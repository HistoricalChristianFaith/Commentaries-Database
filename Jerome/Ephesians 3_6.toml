[[commentary]]
quote='''
But what is this mystery which was not revealed to other generations as it is now? Surely that which follows: that the Gentiles are fellow heirs, fellow members of the body, and fellow partakers of the promise in Christ Jesus through the Gospel, of which Paul was made a minister, according to the gift of the grace of God which was given to him according to the working of his power. I know that the addition of that conjunction, by which it says fellow heirs, and fellow members of the body, and fellow partakers (cohæredes, concorporales, comparticipes), makes the sentence unseemly in the Latin language. But because it is so in the Greek, and in the divine Scriptures the single words, syllables, accents and points are full of meanings, for that reason we would rather run a risk in the composition and structure of the words than in the understanding. The Gentiles, then, are fellow heirs with Israel, or, as we think better, they are fellow heirs with Christ, so that God is our inheritance, and we are fellow heirs of Christ. This is also written in another place: Heirs of God, and fellow heirs of Christ (Rom. 8:17). Not that some possession is divided among us; but that the Lord himself is our inheritance and possession. The Lord, he says, is your inheritance (Deut. 18:2); and elsewhere: The Lord is my portion and my inheritance (Ps. 15:5). Fellow members of the body, moreover, signifies this: that just as in one body there are many members, for example eyes, hands, ears, feet, belly and knees, and though they are in one body they have their own differences, and rejoice and grieve for one another; so, though they have different graces, those who have believed in Christ are nevertheless gathered together in the one body of the Church. And in the two former words, that is, in his saying fellow heirs and fellow members of the body, one could suspect something different within the one body. But from his having added and fellow partakers of the promise in Christ Jesus, all difference whatever has been cut away. For where there is one common partaking, all things are common.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
