[[commentary]]
quote='''
I too will say at the end of the volume, sealing the labor of my little work with an invocation of the Lord: God, who is like you? Take away the iniquity of your servant; pass over the sin of the remnant of my soul; do not send your fury upon me, nor rebuke me in your anger, since you are merciful, and your mercies are many. Return, and have mercy on me; hurl down my iniquities, and cast them into the depth of the sea, so that the saltiness and bitterness of vices may perish in a false region. Give the truth that you promised to your friend Jacob, and the mercy that you promised to your friend Abraham, and free my soul from the persecutors of your prophets, Ahab and Jezebel, as you swore to my fathers in the days of old, saying: As I live, says the Lord. I do not wish the death of the sinner, only that he turn back and live, and elsewhere: As soon as you have turned and groaned, you will be saved. Then my enemy will see, and will be covered with confusion, she who now says to me: Where is the Lord your God? I will see your vengeance on her, and she will be like the mud of the streets, and will be trodden down, so that she may no longer build Egyptian cities out of mud and straw.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
