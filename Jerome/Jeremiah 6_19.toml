[[commentary]]
quote='''
And in what is added: Hear, O earth, the whole world is called to hear, as we also read at the beginning of Isaiah: Hear, O heaven, and give ear, O earth: that is, what the Lord is going to do to the people of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Behold, I will bring evils upon this people, the fruit of their thoughts — or of their turning away —, because they have not heard my words and have cast away my law. He calls 'evils' the punishments and penalties of those who suffer, not upon the Gentiles, who are called to the truth of the Gospel, but upon the people that answered: We will not hear. And it is going to receive the fruit of its thoughts or of its turning away, as David says: You shall eat the labors of your hands. And the cause is plain: because they did not hear the words of the Lord and cast off his law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
