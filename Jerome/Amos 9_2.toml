[[commentary]]
quote='''
If they go down even to hell, from there my hand shall bring them out; and if they go up even into heaven, from there I will drag them down; and if they are hidden on the top of Carmel, from there I will search them out and take them away; and if they hide themselves from my eyes in the depth of the sea, there I will command the serpent, and it shall bite them; and if they go into captivity before their enemies, there I will command the sword, and it shall slay them; and I will set my eyes upon them for evil, and not for good. And the Lord God of hosts, who touches the earth and it melts, and all who dwell in it shall mourn, and the whole of it shall rise up like a stream, and shall flow down like the river of Egypt. LXX: If they are dug down into hell, from there my hand shall pluck them out; and if they go up into heaven, from there I will drag them down; if they are hidden on the top of Carmel, from there I will search them out and take them away; and if they plunge themselves away from my eyes into the depth of the sea, there I will command the dragon, and it shall bite them; and if they go into captivity before the face of their enemies, there I will give orders to the sword, and it shall kill them; and I will fix my eyes upon them for evils, and not for good things. And the Lord God Almighty, who touches the earth and shakes it, and all its inhabitants shall mourn, and their consummation shall rise up like a river, and shall go down like the flood of Egypt. He who had said above: There shall be no flight for them; he shall flee, and he who flees shall not be saved, now cuts flight itself into its parts, and testifies hyperbolically that even if they do this and that, they cannot escape. If they go down, he says, even to hell, from there my hand shall bring them out: not that anyone is drawn back from the lower world before the day of resurrection, but that even those placed in hell are in his power. We know that this was fulfilled upon Dathan and Abiram, whom the gaping of the earth swallowed alive. And if they go up, he says, even to heaven, from there I will drag them down: because both Enoch and Elijah, caught up with their bodies into heaven, are governed by the will of God. And observe the proper use of the words: one goes down to hell, one climbs up to heaven; we are brought out of hell, we are dragged down from the heavens. In the one there is extreme despair, in the other the greatness of pride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
