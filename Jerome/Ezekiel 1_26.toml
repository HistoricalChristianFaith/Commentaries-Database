[[commentary]]
quote='''
That the man ought to be understood as God the Father many testimonies teach, among which is this in the Gospel: A man, a certain one, planted a vineyard and let it out to husbandmen, and a little after: He sent his servants and, above all, his son, and again: A man made a marriage feast for his son — not that the Son is excluded from the kingdom, of whom Isaiah wrote: I saw the Lord sitting upon a throne high and lifted up, and John: These things, moreover, he says, Isaiah said when he saw the glory of the Son of God, but that the Son too reigns in the Father —; and all things of the Son are the Father's, who is the image of the invisible God the Father: for in Daniel too God the Father is introduced sitting, and the Son of man is brought before him to receive the kingdom; and in the Revelation of John the same things are described of the Son; and at the contest of the first martyr Stephen he is seen standing at the right hand of the Father, he of whom it is sung in the Psalms: The Lord said to my Lord: Sit at my right hand, until I make your enemies the footstool of your feet. And just as in the crystal all the purest and shining things in the heavens are shown, which illumine our eyed body, so in the sapphire, that is, in the throne of God, and above the firmament, which we take as heaven, the hidden and secret and incomprehensible mysteries of God are shown, who made darkness his hiding place and is seen in the cloud and in the thick darkness: hence also it is written in Exodus: And under the feet of God there was as it were a work of sapphire brick, and like the appearance of the firmament of the clearest heaven; hence also the bride describes the beauty of the bridegroom in the Song: His belly as it were an ivory tablet upon a sapphire stone; and in the Revelation of John the first foundation is written to be of jasper, the second of sapphire; and on the breastplate of the high priest, in the row and order of the individual stones, the second row has the carbuncle and the sapphire and the jasper; of which stones we have spoken in part in the Explanations of Isaiah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
