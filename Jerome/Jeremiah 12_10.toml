[[commentary]]
quote='''
Many shepherds have demolished — or have corrupted — my vineyard, they have trampled — or have polluted — my part, they have made my desirable portion a desert of solitude — or pathless —. They have made it — or it has been made — a ruin, and it has mourned over me or has perished. Let those hear these things who desire to be princes of the peoples, and who are to render account in the day of judgment not only for themselves but also for the flocks entrusted to them; for because of them the part of the Lord is trampled and polluted, so that where once was the lodging of God, there is the dwelling-place of beasts. Others, however, understand not the leaders of the people and the priests, but the princes of the enemies, who laid Jerusalem, that is, the vineyard of the Lord, in ruins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
