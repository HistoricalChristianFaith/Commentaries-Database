[[commentary]]
quote='''
Are not these my words, while Jerusalem and the cities of Judah were still standing, which I spoke to you by the hands of my prophets, when Jerusalem still stood, and the cities of Judah abounded in all things, and both the hill country and the plain overflowed with crops and enjoyed a most secure peace? Now these were the words of the Lord, as the Scripture that follows testifies: that he wills true judgment and mercy toward one's neighbors, and that one not wrong the widow and the orphan and the stranger and the poor, and not devise evil in one's heart. These things, he says, they would not do, and with deaf ears they despised my commands; for which reason great indignation came upon Jerusalem; and as they would not hear me, so I too did not hear them; and now they ask with such scrupulousness when they ought to fast and mourn, although I said before through Isaiah: This is not the fast I have chosen, says the Lord, nor that a man should humble his soul; but loose every bond of iniquity, undo the obligations of violent contracts, give your bread to the hungry from your heart. If you see the naked, cover him; and the poor and the roofless clothe within your tent. Then your early light shall break forth, and your healings shall quickly arise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
