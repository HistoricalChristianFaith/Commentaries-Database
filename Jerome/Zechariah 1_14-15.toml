[[commentary]]
quote='''
Jerusalem and Zion, the vision of peace and the watchtower, which looks not on the wars of this world, nor on things lowly and earthly, but on peace and concord and the heights of heaven, can be understood as the Church. Angry with her because of vices and sins and charity growing colder every day, the Lord will hand her over to persecutions, so that, as in a smelting furnace, pure gold and silver may appear. But the adversaries to whom she has been handed over, striving to blot her out, fill Jerusalem with the blood of the slain from gate to gate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
