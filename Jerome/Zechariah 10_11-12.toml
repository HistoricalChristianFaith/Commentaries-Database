[[commentary]]
quote='''
And he shall pass through the strait of the sea, and shall strike the waves in the sea; and all the depths of the river shall be confounded, and the pride of Asshur shall be humbled, and the scepter of Egypt shall depart. I will strengthen them in the Lord, and in his name they shall walk, says the Lord. LXX: And they shall pass through in the narrow sea, and they shall strike the waves in the sea, and all the depths of the rivers shall be dried up; and all the injury of the Assyrians shall be taken away, and the scepter of Egypt shall be removed. And I will strengthen them in the Lord their God, and in his name they shall glory, says the Lord. The Hebrews relate that the captive people of the Jews was carried off by the Assyrians and Chaldeans not only to the Medes and Persians, but also to the Bosporus and the northern region, and that afterwards they were in part called back, as the mercy of God turned them to himself, and that this is what is now said: They shall pass through in the narrow sea: the narrows of the Propontis, which divide Chalcedon and what was once Byzantium by a short strait. And the Lord, he says, going before his people, shall strike the waves of the sea, and all the depths of the rivers shall be confounded, as was done of old when the Jordan was dried up and the people crossed the Red Sea in the desert. And when it has been freed from the depth of captivity, from the bitterness of evils, Asshur shall be humbled, and the dominion of Egypt shall depart from them. And they shall be strengthened in the Lord, and in his name they shall walk in the land of Israel, says the Lord. These things, as they were handed down to us by the Hebrews, we have set out for the men of our own tongue, referring the trustworthiness of what is said to those by whom it was said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
[[commentary]]
quote='''
And when they have passed through the strait of the sea, and have trodden its waves under their foot, all the depths of the river shall be confounded, of which it is written: He who turns the sea into dry land; they shall pass through the river on foot; so that the pride, or the injury, of Asshur may be humbled, and the dominion of Egypt may depart from the saints and believers, and those who have been freed may be strengthened in the Lord and say: My strength and my praise is the Lord, and again: I will love you, O Lord, my strength, and with Jeremiah: My strength and my help and my refuge, O Lord my God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
