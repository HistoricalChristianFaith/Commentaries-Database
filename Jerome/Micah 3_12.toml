[[commentary]]
quote='''
Since, therefore, they did not repent, and the whole people followed the vices of the princes and priests and prophets, Zion will be plowed like a field, and Jerusalem will be like a heap of stones, and the temple, which formerly shone with gold and silver, will collapse into utter ruins. These things are against the people of the Jews, upon whom the true captivity and the final ruins were imposed, on account indeed of their earlier crimes, but chiefly on account of the shedding of the Lord's blood. Hence too Zion has been plowed like a field, and Jerusalem turned into mounds of stones, and that temple, once noble and lofty, has been ground down into the last ashes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Therefore, because of us, who are such, who build Zion with blood, and Jerusalem with iniquity, who judge for gifts, who give answers for hire, who divine for money, and who, claiming besides a feigned sanctity for ourselves, say: No evils will come upon us. Let us hear the sentence of the Lord which follows: Zion and Jerusalem, and the mountain of the temple, the watchtower, and the vision of peace, and the temple of Christ, at the consummation and at the end, when charity has grown cold and faith has become rare, will be plowed like a field, and will be reduced to mounds, and will be like the high places of the forests, or a watch-hut for fruit, so that where once there were spacious houses and heaps of grain without number, there there may scarcely be a little hut keeping the appearance of foods which hold no refreshment for the soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
And there rose up men of the elders of the land and said to the whole assembly of the people, speaking: Micah of Moresheth was a prophet in the days of Hezekiah, king of Judah, and he spoke to all the people of Judah, saying: Thus says the Lord of hosts: Zion shall be plowed like a field, and Jerusalem shall become a heap of stones, and the mountain of the house the heights of the forests. Did Hezekiah, king of Judah, and all Judah condemn him to death? Did they not fear the Lord and entreat the face of the Lord, and the Lord repented of the evil which he had spoken against them? So we are doing a great evil against our own souls. The princes of the city and the people understand the truth of the judgment; but the elders, whose proper task it was to know old things, unfold the history and prophecy of Micah of Moresheth, who prophesied under King Hezekiah, compare it with the prophecy of Jeremiah, for which a capital charge is being pressed against him, and show that Micah had said graver things and yet had suffered nothing from the righteous king Hezekiah, but that they, converted to repentance, had turned the sentence of the Lord in a good direction. For Micah said: Zion shall be plowed like a field, and Jerusalem shall become a heap of stones, and the mountain of the house the heights of the forests; and Jeremiah: I will make, he says, this house like Shiloh, and this city I will make a curse to all the nations of the earth. And they give counsel, thinking that what Micah had foretold would by no means come to pass, because for a long time it had not been done on account of the repentance of the people, and that this too, which Jeremiah spoke, would by no means come to be, if, according to his counsel, they made good their ways and their pursuits and heard the voice of the Lord their God, so that the Lord would not bring the evil with which he had threatened them. And at the same time they break the rage of the accusers and mingle themselves with them, saying: So we are doing a great evil against our own souls, not that they ought to do it, but because, if they did it, they would by no means harm the accused, but their own souls, which they could have freed by a change of their sentence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
