[[commentary]]
quote='''
Therefore thus says the Lord to the men of Anathoth, who seek your life and say: You shall not prophesy in the name of the Lord, and you shall not die in our hands. Therefore thus says the Lord of hosts: Behold, I will visit upon them; the young men shall die by the sword, their sons and their daughters shall die by famine, and there shall be no remnant of them; for I will bring evil upon the men of Anathoth, the year of their visitation. This seems to run counter to the former view, by which we wish to prove that the things that were said were said in the person of Christ, and not in that of Jeremiah, who properly dwelt in the little village of Anathoth, which is three miles distant from Jerusalem. But if we understand the etymologian [etymology] of the town Anathoth, which means 'obedience', it will be clearly shown that by the men of Anathoth, who once obeyed the precepts of the Lord, all the Jews are meant, and especially the inhabitants of the city of Jerusalem, upon whom came the final sentence, that they should perish by the evils of the siege, by sword and famine and pestilence. But to free ourselves from all the trouble of interpretation, let us follow this rule: that all the prophets did most things as a type of the Lord the Savior, and that whatever was fulfilled in Jeremiah in the present time is prophesied of the Lord for the future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
