[[commentary]]
quote='''
And she weaned her who was Without Mercy; and she conceived and bore a son; and he said: Call his name Not My People, for you are not my people and I will not be yours. LXX: likewise. He who was called the seed of God, turned into a female and, because of the weakness of his strength and the offense of God, led into captivity, since he did not have the mercy of the Lord, is said to have been weaned not as a son but as a daughter; for the man had already lost his vigor. Whoever is weaned withdraws from the mother, no longer feeds on the parent's milk, and is sustained by food from outside. So also Israel, cast off by the Lord, hemmed in by the straits of captivity, and in Babylon sustained by unclean foods, is called not the people of God, and is struck with the eternal sentence of a foreign nation, so that he is called Not My People and is disowned forever. This we can rightly understand both of the whole people of the Jews, which, handed over to captivity because of the offense against the seed of God, lost its kingdom and its province and is called not the people of God, and also in the person of the heretics. But if some contentious interpreter will not accept what we have said, but understands that the harlot named Gomer, daughter of Diblaim, bore the first and the third as males and the second, the middle one, as a female, wanting the Scripture to mean just what is read, let him answer how he explains that passage in Ezekiel where he is commanded by the Lord to bear the iniquities of the house of Israel, that is, of the ten tribes, and for three hundred and ninety days to sleep continually on one side, the left, although in the LXX one hundred and ninety are written, and to sleep so that he never wakes nor changes his side, unless perhaps, sated with sleep, he opened his eyes a little to take the most filthy food of ash-baked bread, made of wheat and barley, and bean and lentil and millet, and baked on human dung. For the nature of things does not allow that any man should sleep always on one side for three hundred and ninety days. And again he says: You shall take up the iniquities of the house of Judah, and for forty days you shall sleep on the right side. These days, however, will be reckoned as years, during which Israel and Judah will be pressed down by siege and a very long captivity, so that, conquered and motionless, they cannot turn themselves from one side to the other. If he cannot prove that these things, and others like them which we read in the holy Scriptures, were done, but contends that they signify something else, then this harlot woman too, and the other woman, the adulteress, who were either joined to the prophet or kept by the prophet, indicate not a shameful union of lust but the mysteries of things to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
