[[commentary]]
quote='''
Beautifully, too, because he was speaking of marriage, he drew "spot or wrinkle" from the example of women to the beauty of the Church. For just as on women's bodies moles are apt to look dirty, or wrinkles to draw the skin together, or freckles to mottle it, and the whole effort of women is to wipe away whatever seems to disfigure, and to present to their husbands the loveliness of their bodies, so also souls must be purged of all the filth of sins, that the wrinkle of the old man may be smoothed out by youth, and be renewed into the new man from day to day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
