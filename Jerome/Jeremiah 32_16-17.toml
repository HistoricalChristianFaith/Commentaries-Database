[[commentary]]
quote='''
And I prayed to the Lord, after I had delivered the book of possession to Baruch, the son of Neriah, saying: Alas, alas, alas, Lord God — or you who are, Lord God —, behold, you made heaven and earth in your great strength and in your arm outstretched — or lofty —; not difficult for you — or impossible — shall be any word — or according to the Seventy nothing is hidden with you —, you who show mercy to thousands and repay the iniquity of the fathers into the bosom of their sons after them, most mighty, great, powerful — which in Hebrew is called 'gibbor' —, the Lord of hosts — or of powers — is your name! Great in counsel and incomprehensible in thought, whose eyes are open upon all the ways of the sons of Adam — or of men —, to render to each according to his ways and according to the fruit of his devices. After the purchase of the field had been duly performed, and after the sentence of the Lord in which he promised that houses, fields and vineyards would be possessed thereafter, the prophet prays to the Lord and expresses the grief of his heart with groans, saying: alas, alas, alas, Lord God, for which the Seventy translated ho ōn, that is, you who are, Lord God, according to what is said to Moses: go, say to the people of Israel: He who is has sent me; not that others do not exist, but it is one thing to subsist by the gift of the Creator, another by the eternity of one's nature. He praises God and from the creatures proclaims the Creator; and first he extols with his voice his power and mercy and righteousness toward the whole race of men, then he passes to Israel and describes in solemn speech how much he had bestowed on it. And after such great benefits he says that they, unmindful of his good gifts, provoked his clemency to bitterness, so that the city is besieged and, before the enemy's irruption into it takes place, has been consumed by sword and famine and pestilence. All this he set forth beforehand in order to bring in, as a consequence, that which seemed to be said in reproach of the divine sentence: and you say to me, Lord God: Buy the field for silver and call witnesses, when the city has been given into the hands of the Chaldeans? This, for the present, is what the whole perikopē [passage] of this place contains; now let us return to the particulars. You made heaven and earth in your great strength. And John says of the Son: all things were made through him, and without him nothing was made that was made; for this is the 'strength' of the Lord, as the Apostle confirms: 'Christ the power of God and the wisdom of God'. And in your outstretched arm or lofty, both of which are the mark of one who strikes; and this is the 'arm' of which Isaiah also speaks: and to whom has the arm of the Lord been revealed? No word shall be difficult for you — for the things that are impossible with men are possible with God — or, for whom nothing is hidden, according to the word of the psalmist, who says: for darkness shall not be dark to you, and the night shall be lit up as the day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
