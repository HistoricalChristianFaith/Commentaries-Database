[[commentary]]
quote='''
At the same time this too must be noted: that we, whom he recalled as having once been without Christ, alienated from the way of life of Israel, and strangers to the promises and to the Covenant of God, now, after we have believed in Christ, just as we have received his promises and covenants, so may be said to have the way of life of Israel as well: inasmuch as the whole way of life of the Law is fulfilled in us, since, of course, the Law is spiritual, and it is rather we who are circumcised, and keep the sabbath in the spirit, offering spiritual victims: their temple and altar having been destroyed, it is we who offer to God the tithes of our fruits, it is we who sacrifice the spotless lamb, and, girded about the loins and ready for the road, eat the Passover. For just as circumcision is said to be in the flesh, made by hand, so, by distinction from it, another circumcision is understood to exist, which is not, as we have said, made by hand, but by the spirit. And as to his saying: Having no hope, and without God in the world: it is not that the Ephesians, before they believed in Christ, did not have many gods and did not worship them; but that whoever is without the true God has no god. And without God in the world has been added significantly. For indeed they had God, since God had known beforehand that they would have him, and in the foreknowledge of God they were not without God, but in the world they were without God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
