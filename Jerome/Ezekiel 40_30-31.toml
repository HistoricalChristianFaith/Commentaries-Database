[[commentary]]
quote='''
But this, which is not found in the Seventy: And the vestibule (or πρόπυλον) round about, in length twenty-five cubits and in breadth five cubits, seems to raise a question, on account of which it was also not set down in the translation: how, after the progress of the third step, twenty-five cubits and five are set; but what follows removes the ambiguity: And its vestibule toward the outer court, and the palms on its front, namely, that this court, which has twenty-five cubits in length and five in breadth, belongs not to the inner but to the outer court, so that the length of the outer court possesses the breadth of the former court, that is, twenty-five cubits, and holds five cubits in breadth; which measures, that is, twenty-five and five, we refer to those senses, namely sight, hearing, taste and smell and touch, which, if we climb to higher things, we double five times, and out of carnal senses we shall make spiritual ones — as in that saying: Lift up your eyes and see, for the harvests are white for reaping, and: He who has ears to hear, let him hear, and: Taste and see that the Lord is sweet, and: We are the good odor of Christ among those who believe; and in the epistle of John it is said: What we have heard and seen, and our hands have handled, concerning the word of life —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
