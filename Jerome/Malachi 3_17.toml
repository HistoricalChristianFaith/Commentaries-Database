[[commentary]]
quote='''
And those who fear the Lord shall be to the Lord of hosts for a special possession, on the day when the time of judgement arrives. For 'special possession' in the Hebrew is read sgolla, which Aquila translated περιούσιον (special), and the others περιποίησιν (possession). Those, therefore, who fear the Lord, who spoke with their neighbour and answered the words of blasphemy, will be on the day of judgement for a special possession, and he will spare them, because every man is under sin. Or else he will choose them, as a man is wont to choose his son who serves him. In this there is a twofold affection, both of fatherly love toward a son and of service toward a servant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
