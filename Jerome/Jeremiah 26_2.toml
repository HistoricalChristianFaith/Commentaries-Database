[[commentary]]
quote='''
But he who is about to speak the word of the Lord ought to stand with Moses and to hear with the psalmist: you who stand in the house of the Lord, in the courts of the house of our God. And he is commanded to speak to all the cities of Judah, although the Seventy did not translate 'cities', lest perhaps it should seem unfitting to speak, in the court of the house of the Lord, to cities which were not present; but when he speaks to the peoples and to the citizens, he speaks to the cities themselves. And he fittingly stands in the court and vestibule of the temple of the Lord, so that, on the occasion of prayer to the Lord and of worshiping him, they may be compelled to hear the words of the prophet. 'Do not', he says, 'withhold a word; although it be sad, although the rage of those who hear be stirred up against you, nevertheless say what has been commanded you, fearing not the persecutions of those who are to be stirred up against you, but the command of the Lord who orders it!'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
