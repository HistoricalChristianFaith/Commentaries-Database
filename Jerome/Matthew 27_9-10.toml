[[commentary]]
quote='''
(in loc.) I have lately read in a Hebrew book given me by a Hebrew of the Nazarene sect, an apocryphal Hieremias, in which I find the very words here quoted. After all, I am rather inclined to think that the passage was taken by Matthew out of Zacharias, in the usual manner of the Apostles and Evangelists when they quote from the Old Testament, neglecting the words, and attending only to the sense.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And I took, says the Lord through the prophet, as I had been commanded by the Lord, the thirty pieces of silver, and I did not put them down, but cast them into the house of the Lord to the moulder; in the house of the Lord I caused them to be returned by the traitor to the priests and Pharisees, the very man who sold me confessing: I have sinned, betraying just blood. But they, since it was the price of blood, would not put it into the corbona, that is, into the treasury; but with it they bought the potter's field for the burial of strangers. For all of us who were strangers and sojourners from the law, redeemed by his most precious blood, are buried and rest in the house of the potter and Creator of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
Then was fulfilled what was spoken through the prophet Jeremiah, saying: And they took the thirty pieces of silver, the price of the one valued, whom they valued from the sons of Israel, and they gave them for the potter's field, as the Lord appointed for me. This testimony is not found in Jeremiah; but in Zechariah, who is almost the last of the twelve prophets, a certain likeness is reported, and although the sense does not differ much, yet both the order and the words are different. I read recently, in a certain Hebrew volume which a Hebrew of the Nazarene sect brought to me, an apocryphal Jeremiah, in which I found these things written word for word. But still it seems to me that the testimony is rather taken from Zechariah, in the common manner of the evangelists and apostles, who, passing over the order of the words, bring forward only the sense from the Old Testament as an example.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
