[[commentary]]
quote='''
Whoever wish to please in the flesh, these compel you to be circumcised, only so that they may not suffer the persecution of the cross of Christ.

Above he showed from what point he had subscribed with his own hand; now he goes back over what he wrote. Gaius Caesar, and Octavian Augustus, and Tiberius the successor of Augustus, had promulgated laws that the Jews who were dispersed throughout the whole world of the Roman Empire should live by their own rite and devote themselves to their ancestral ceremonies. Whoever, therefore, was circumcised, even though he believed in Christ, was regarded by the Gentiles as a Jew. But whoever, being without circumcision, displayed by his uncircumcision that he was not a Jew, became liable to persecutions both of the Gentiles and of the Jews. Therefore those who had corrupted the Galatians, desiring to escape these persecutions, urged circumcision upon their disciples as a defense; and this the Apostle now calls confidence in the flesh, namely because they held out circumcision in persecution as much to the Gentiles, whom they feared, as to the Jews, who wished to please. For neither the Jews could persecute them, nor the Gentiles, since they saw them both circumcising proselytes and themselves keeping the precepts of the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
