[[commentary]]
quote='''
And now, because you have done all these works, says the Lord, and I spoke to you, rising early and speaking, and you did not hear, and I called you and you did not answer, I will do to this house, in which my name has been called upon and in which you have confidence, and to the place which I gave to you and to your fathers, as I did to Shiloh, and I will cast you out from my face, as I cast out all your brothers, the whole seed of Ephraim. This which we have set down: rising early and speaking, is not found in the Seventy. Now God rises early, not because there is any time for him without daybreak, but because after the rest of the night, when the strength of the body has been restored, the soul of men is more vigorous and, in no way occupied with pleasures and the desire for food, is able to hear and to do what is said. Hence we also read this in the psalm: In the morning you will hear my voice; in the morning I will stand before you and will see; and in Isaiah: By night — or at daybreak — my spirit will rise to you, O God, for your precepts are light upon the earth. Hence also the apostle Paul calls them sons of light, and not of night nor of darkness, nor sleepers, as the others too have slept, who do not perceive the commandments of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
