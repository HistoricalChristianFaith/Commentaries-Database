[[commentary]]
quote='''
Great in counsel: and does anyone dare to thrust himself into the secret of the Lord and to pass judgment on his judgments! And incomprehensible in thought: him whom thought does not comprehend, how can speech comprehend? Whose eyes are open upon all the ways of the sons of Adam: in vain, then, does man think he can hide from the knowledge of God. And what he adds: to render to each according to his ways and according to the fruit of his devices, indicates this, that at times, because of his exceeding wisdom, his judgments seem unjust; a passage which the Apostle explains more fully to the Romans: do you not know that the goodness of God exhorts you to repentance? But according to your hardness and impenitent heart you treasure up for yourself wrath on the day of wrath and of the revelation of the righteous judgment of God. The later, therefore, the punishment of sinners, the more righteous it is, after the likeness of Pharaoh, who, warned by ten plagues, not punished, and persisting in his hardness, was at last overwhelmed by the waves of the Red Sea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
