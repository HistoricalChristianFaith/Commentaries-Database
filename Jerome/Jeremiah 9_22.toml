[[commentary]]
quote='''
Speak: Thus says the Lord: And the carcass of man shall fall — or the corpses of men — like dung upon the face of the region — or of the field — and like hay behind the back of the reaper, and there is none who gathers. The Hebrew word that is written with three letters, 'daleth, beth, res' — for it has no vowels in the middle —, if it is read, according to the context and the judgment of the reader, as 'dabar', means 'word'; if as 'deber', 'death'; if as 'dabber', 'speak'. Hence the Seventy and Theodotion joined it to the previous section, so as to say: to destroy the little ones from outside, the young men from the streets, by death. But Aquila and Symmachus translated lalēson, 'speak', so that God commands the prophet to speak what follows: thus says the Lord and the rest. And the sense is: when death has come up through our windows and has entered the houses of Jerusalem, and the little ones and the young men have perished from outside and from the streets, then their carcass, or the corpses of the dead, will be as it were for a dunghill upon the face of the earth and like stubble that is left behind the back of the reapers and, being useless, is not gathered. By these things he wishes to show that there will be so great a slaughter in Jerusalem and around the city that there will be no one to bury those who fall.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
