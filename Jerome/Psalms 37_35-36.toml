[[commentary]]
quote='''
This Sihon, of whom it is written: Already the axe is laid to the roots of the trees, because he was an unfruitful tree, was cut down when the Lord struck him; his height is compared to the height of the cedars, of which we read: I saw the wicked man exalted on high and lifted up like the cedars of Lebanon; and I passed by, and behold, he was not; and I sought him, and his place was not found. And he fittingly says that he passed by, because from him who passes over from the world, and can say: Passing over, I will see this great vision, the cedar is taken away, and the place of pride cannot be found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
