[[commentary]]
quote='''
And behold, a wall outside, round about the house on every side, and in the man's hand a measuring reed of six cubits and a handbreadth; and he measured the breadth of the building, one reed, the height also, one reed. And he came to the gate which looked toward the eastern way, and he went up by its steps, and he measured the threshold of the gate, one reed in breadth, that is, one threshold one reed in breadth, and the cell one reed in length and one reed in breadth, and between the cells five cubits, and the threshold of the gate beside the vestibule of the gate within, one reed. And he measured the vestibule of the gate, of eight cubits, and its front, two cubits; and the vestibule of the gate was within. Further, the cells of the gate toward the eastern way, three on this side and three on that, one measure of the three, and one measure of the fronts on either side. And he measured the breadth of the threshold of the gate, ten cubits, and the length of the gate, thirteen cubits, and the margin before the cells, of one cubit, and one cubit the boundary on both sides; and the cells were of six cubits on this side and on that. And he measured the gate from the roof of a cell to its roof, a breadth of twenty-five cubits, door opposite door. (LXX: "And behold, a wall outside the house round about, and in the man's hand a measuring reed of six cubits and a palaestes; he measured the wall, the breadth equal to the reed, and the height of the same measure. And he went into the gate which looked toward the east, by seven steps, and he measured ÷ the 'thee', six on this side and six on that: the aelam of the gate equal to the reed in length and equal to the reed in breadth, and the 'aelam' in the middle of the 'theelatha', of five cubits, and the second 'thee' equal to the reed in breadth and equal to the reed in length, and the 'aelam' of five cubits, and the third 'thee' equal to the reed in breadth and equal to the reed in length, of the three, and the 'aelam' of the gate which is beside the 'aelam' of the gate, of eight cubits, and the 'aeleu' of two cubits, and the 'aelam' of the gate within. And the 'thee' of the gate opposite, three on this side and three on that, and one measure of the three, one measure of the 'aelam' on this side and on that. And he measured the breadth of the entrance of the gate, ten cubits, and the breadth of the gate, thirteen cubits, and one cubit was drawn in before the 'theeri', of one cubit, and a boundary of one cubit on this side and on that; and the 'thee' of six cubits on this side and of six cubits on that. And he measured the gate from the wall of the 'thee' to the wall of the 'thee', a breadth of twenty-five cubits; this gate opposite gate.") When I was a boy at Rome and was being educated in liberal studies, I used, with others of the same age and purpose, to go round the tombs of the apostles and martyrs on the Lord's days, and often to enter the crypts which, dug out in the depths of the earth, have along the walls, on either side of those who enter, the bodies of the buried; and everything is so dark that that prophetic word is almost fulfilled: Let them go down alive into hell, and light let in rarely from above tempers the horror of the darkness, so that you would think it not so much a window as a hole for the light let down; and again one moves forward step by step and, to those surrounded by blind night, that line of Vergil presents itself: Horror everywhere for the mind, and at the same time the very silences terrify. Let this have been said by me so that the prudent reader may understand what view I hold about the explanation of the temple of the Lord in Ezekiel, of which it is written: Cloud and darkness under his feet, and again: Darkness is his hiding place; whence Moses too entered into the cloud and the darkness, so that he could contemplate the mysteries of the Lord, which the people, placed far off and remaining below, could not see; and then, after forty days, the ignoble crowd with darkened eyes could not look upon the face of Moses, because the face of Moses 'had been glorified', or, as is contained in the Hebrew, 'was horned'; so it happens to me too as I read the description of the mystical temple — which the Jews think is to be built according to the letter at the coming of their Christ, whom we prove to be Antichrist, and which we refer to the Church of Christ, and which I see being built daily in the saints —: for wherever the eye of the heart is opened, and I have thought that I see something and hold the bridegroom — and rejoicing have said: I have found him whom my soul sought; I will hold him and will not let him go —, again the divine word deserts me, and the bridegroom flees from my hands, and my eyes are closed in blindness — so that I am compelled to say: O the depth of the riches of the wisdom and knowledge of God! How unsearchable are his judgments, and his ways past tracing out!, and what is written elsewhere: The judgments of the Lord are a great deep, and: Out of the depths I have cried to you, O Lord; Lord, hear my voice, and that word of Elisha, who followed with the eyes of the heart the master snatched away from him, saying: Father, father, the chariot of Israel and its charioteer —. It must therefore be simply confessed that I do not wish to discuss the temple of blessed Ezekiel, about which all the ages have been silent, out of rashness, but desire, in faith and the fear of God, to show readers the conjecture of my mind, so that, if I offer to the tabernacle of God goats' skins and hair, by which the thorns and stings of sins may be covered and the rains of storms kept off, another, who is rich, may offer, according to the quality of his merits, either iron or bronze or silver and gold and most precious stones, and may not despise our gifts because they are lesser, but rejoice in his own wealth: for unless there are lowest things, there cannot be highest ones, and so that the greater may be praised, they grow by comparison with the lesser. Let us see, then, what Ezekiel, having entered the building of the city facing toward the south, first saw, then heard: And behold, he says, a wall outside, round about the house on every side. In place of the 'wall' which Aquila and Theodotion translated, Symmachus and the Seventy put περίβολος [enclosure]: on every side it surrounded the house, that is, the temple of the Lord; and the man whose appearance was as of bronze had not only the surveyor's cord, the cord of the masons, but he also held in his hand the reed, whose measure was passed over in silence above and is now given: of six cubits and a handbreadth — which in Greek is more correctly called palaestes, and is the sixth part of a cubit; otherwise 'palmus' means σπιθαμὴν [a span], which some have been accustomed to call 'palma' [palm] for the sake of distinction, and further to call the 'palaesten' 'palmum' [handbreadth] —; with this reed, then, he measured the breadth and the height of the wall, and both, that is, height and breadth, were of one reed, that is, of six cubits and one handbreadth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
The apostle Paul, wishing the Ephesians to know the more sacred things, prays for them 'that they may be filled with the wisdom and love of the Lord, and, being rooted, may be able to know and comprehend what is the breadth and length and height and depth of his riches'; and to the same he says: So then you are by no means strangers and sojourners, but fellow citizens of the saints and members of the household of God, built upon the foundation of the apostles and prophets, Jesus Christ himself being the cornerstone; in whom the whole building, fitted together, grows into a holy temple for the Lord, in whom you too are built up into a dwelling place of God in the Holy Spirit. Peter too, in almost the same words, because with the same spirit, says in his epistle: If indeed you have believed that the Lord is good. Coming to him, a living stone, rejected indeed by men, but chosen and honored by God, you yourselves too, as living stones, are built up as a spiritual house, into a holy priesthood, offering spiritual victims acceptable to God through Jesus Christ. From this it is clear that the Lord Savior, who is the true architect, tests the stones: which can be called together into the foundation of the temple, which into the middle, which into the higher places, and which, being of lesser measure or of not so solid firmness, into the wall and outside the temple, into the περιβολῇ round about — for it is a thing of no small strength nor of the least firmness to bear the stones laid on from above; whence the apostle writes to believers: Bearing one another's burdens, and in another place it is written that we ought not to take up a weight which we cannot carry —. And the measuring reed, which had six cubits and one handbreadth, signifies this: that our way of life is known to God, which is contained in the six days in which the world was made, and that the reason of each of our works is known too, so that one thing pertains to works, another to the mind; whence also the breadth is equal to the height, and of these the breadth refers, as we have said, to works, the height to the mind, which hastens toward high things. Let it suffice to have given this warning once: that I know that cubitum and cubita [cubit, cubits] are used in the neuter gender, but that, for simplicity of understanding and by the custom of the common people, I also put them in the masculine gender — for it is not our concern to avoid faults of speech, but to explain the obscurity of holy Scripture in whatever words we can —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
