[[commentary]]
quote='''
All things heavenly and earthly, and whatever falls under human understanding, roll on their own wheels; the moon runs through the yearly circuit of the sun in each month; the Morning Star, which is itself the Evening Star, while it gleams ruddy in the east and in the west and tempers the darkness of night with a small light, completes the same course in two years; and the four other stars which are called wandering, and whatever shines in the sky, and the varieties too of crops and trees and herbs, run on their own wheels through the four seasons; and we see nothing that was not before: Circling in circles the spirit goes, and returns into its circuits. All torrents go into the sea, and the sea is not filled. Why? Because they return to their springs from the womb of the abyss. But if anyone considers the wheel and course of the Gospels, that is, of the four living creatures, which breathe, live and understand, he will see that in a short time the world was filled with the apostolic word. The wheel in a wheel, too, is either the joining of the two Testaments, which Jacob's ladder and Isaiah's tongs and the twice-sharpened sword point to, or the Gospels cohering with one another, whose course and stature reach toward heaven, and touch anything on the earth only a little, as, ever hurrying, it hastens to the heights; of which it is also said elsewhere: Holy stones roll upon the earth, from which the heavenly Jerusalem is built; I think that this same thing is signified also by what is sung in the psalm: The voice of your thunder in the wheel, and elsewhere: Which sets on fire the wheel of birth; what sense these testimonies have in their own places is not a matter for this time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
