[[commentary]]
quote='''
For he who is Wisdom, how does he receive understanding? But because "Jesus advanced in age and wisdom and grace before God and men," the Son was instructed not so much by the Father as the man was instructed by his own divinity. Hence too, concerning him who flowered from the root of Jesse, there is the prophet's oracle: "The Spirit of the Lord shall rest upon him, the Spirit of wisdom and of understanding."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_061.html'
source_title="Homily 61, on Psalm 15 (Alternate Series)"
