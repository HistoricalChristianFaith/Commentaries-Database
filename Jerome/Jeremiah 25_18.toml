[[commentary]]
quote='''
To Jerusalem and to the cities of Judah and to its kings and to its princes, to make them a desolation and an astonishment and a hissing and a curse, as it is this day. 'I thought', he says, 'that I was giving drink to the nations alone, and therefore I had gladly offered myself for this ministry; but among the other nations, nay rather before the other nations, I gave drink to Jerusalem and to the cities of Judah and to its kings and princes, to make them an astonishment and a desolation and a hissing and a curse, as is also proved by the present example'. Hence he also says above: You have deceived me, O Lord, and I was deceived; you were stronger, and you prevailed!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
