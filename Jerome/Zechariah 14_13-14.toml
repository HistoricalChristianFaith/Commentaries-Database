[[commentary]]
quote='''
On that day there shall be a great tumult from the Lord among them, and a man shall seize the hand of his neighbor, and his hand shall be locked upon the hand of his neighbor. But Judah too shall fight against Jerusalem, and the riches of all the nations round about shall be gathered together, gold and silver, and garments in great abundance. LXX: And it shall be on that day, a great stupor from the Lord upon them, and each one shall seize the hand of his neighbor, and his hand shall cling to the hand of his neighbor. And Judah shall be made ready in Jerusalem, and shall gather the strength of all the peoples round about, gold, silver, and garments exceedingly many. When these wonders have been accomplished, so that the flesh of the enemies flows away, their eyes waste, and the tongue rots in the mouth of the blasphemers, then there shall be a great tumult, or stupor, among them; for this is what ἔκστασις signifies, which the LXX translated: And each one shall seize the hand of his neighbor, and hand shall be joined with the hand of another, for dread and the weight of the evils that shall come upon them. Judah also shall fight against the mother city, of whom we spoke above as well, and, victory having been granted by the Lord, the riches of all the nations that made war against Jerusalem shall be gathered together, gold and silver, and a multitude of garments, which are the most precious of possessions. These things unhappy Judea promises herself, hoping to receive gold, she who valued the Lord at thirty pieces of silver. But let us, following the order we have begun, refer all these things to the blessedness of the Church: that all who are in it marvel at the subjection of their enemies and at their own happiness, and each one seizes the hand of his neighbor, so that they join right hands and are bound together by mutual faith and kinship. And as for what we read in the Hebrew: And Judah shall fight against Jerusalem, for which the LXX translated: And Judah shall be made ready in Jerusalem, let us take it both ways: that Judah, who once confessed the name of the Lord and, under compulsion in the persecutions, persecuted the people of Christ, may himself also be turned to joy. Or at any rate Judah, every one who confesses and is faithful, does not fight against Jerusalem, but makes himself ready in Jerusalem to fight against the adversaries. And this Judah shall gather the riches of all the nations round about, gold, silver and garments exceedingly many. We have often said that gold and silver are to be understood of sense and of speech; hence we ought to take the garments likewise, with which the Church of Christ is adorned, of which it is written: The queen stood at your right hand in gilded clothing, surrounded with variety. Clothed with these garments the throng of believers rejoices and says: I will exult in the Lord, for he has clothed me with the garments of salvation, and with the tunic of gladness. For the Lord had said to her: I clothed with both τριχάπτοις (fine-spun stuffs) and fine linen. By τριχάπτοις let us understand fine garments, which are so beautiful and delicate that they seem to resemble hairs. These garments the Church gathers, so as to have the wherewithal to clothe her people, to whom it was commanded by the true Preacher: At all times let your garments be white.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
