[[commentary]]
quote='''
But that we may know that visitation is brought by God, as upon the wounded and the sick, for this purpose, that as by cautery and most bitter potions they may recover health and be free of diseases, let us hear God speaking through the prophet: I will visit their iniquities with the rod, and their sins with stripes; but my mercy I will not scatter from him. He, therefore, who is loved is corrected; he who is neglected is left to his sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
