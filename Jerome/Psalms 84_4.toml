[[commentary]]
quote='''
Finally, see what he says. Blessed are they who dwell in your house. In the tabernacle we do not dwell, but we sojourn. And as long as we are in the court, we do not dwell, but we sojourn: for from the courts we pass into the house. But when we have come into the house, what is said? Blessed are they who dwell in your house. The house, which has a foundation: because from the house it is not permitted for us to go out, but from the courts it is permitted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_016.html'
source_title="Homily 16, on Psalm 83"

[[commentary]]
quote='''
Blessed are they who dwell in your house, O Lord: that is, in the Church, whether the present one, or "the church of the firstborn." Forever and ever they will praise you. See what kind of office the martyrs have: it is that of the angels too. What they do in heaven, then, this we imitate on earth. So when we are called to the psalms and neglect them, we despise the praises of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_063.html'
source_title="Homily 63, on Psalm 83 (Alternate Series)"
