[[commentary]]
quote='''
Thus says the Lord, who made a way in the sea, and a path in the rushing waters; who brought forth the chariot and the horse, the army and the strong man: together they have fallen asleep, and they will not rise again; they are crushed like flax, they are quenched. Do not remember the former things, and do not look upon the things of old. Behold, I am doing new things; now they will spring forth; surely you will know them. I will make a way in the desert, and rivers in the trackless land. The beast of the field will glorify me, the dragons and the ostriches; for I have given waters in the desert, rivers in the trackless land, to give drink to my people, my chosen one. This people I have formed for myself; they will tell my praise. LXX: For thus says the Lord, who gives a way in the sea, and a path in the mighty water; who brings forth chariots and horses and a most mighty multitude. But they have fallen asleep, and they will not rise again; they are quenched like quenched flax. Do not remember the former things, and do not consider the old things. Behold, I will do new things, which will now spring forth, and you will know them; and I will make a way in the desert, and rivers in the waterless land. The beasts of the field will bless me, the sirens and the daughters of the ostriches, for I have given water in the desert, and rivers in the waterless land, to give drink to my chosen race, my people, whom I have acquired, that it may tell of my powers. The Lord, who destroyed and cast down Babylon, and pulled down its mightiest from their power, and made captives of all the Chaldeans who were sailing prosperously on the waves of this world, he himself found a way in the rushing waters of the Red Sea, so that his people, freed from Egypt, might pass over. Or, he who made a way in the Red Sea, he himself also found a path in the rushing waters of the river Jordan, so that both the going out from Egypt and the entrance into the land of promise might have a miracle. He sank into the deep the chariots and horses and the whole army of Pharaoh, who fell asleep in perpetual sleep. They were crushed and quenched like flax, in a brief space of time, in a point and a moment. For flax, not yet caught by the fire, is at once quenched because of the lightness of its substance, and dissolves into ash.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
