[[commentary]]
quote='''
And when everything has been destroyed, many nations will pass through the city and the temple, which before they were not permitted to enter, and each will say to his neighbor, why the Lord has wrought so sudden and so great an overthrow upon a city so renowned and great. And those who are asked', he says, 'will answer and set forth the causes of the ruins, saying: because they forsook the covenant of the Lord their God and venerated idols in place of God.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
