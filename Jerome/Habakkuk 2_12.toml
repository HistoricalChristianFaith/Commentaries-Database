[[commentary]]
quote='''
Woe to him who builds a city with bloodshed, and prepares a town in iniquity. Are not these things from the Lord of hosts? For peoples will labor in much fire, and nations in vain, and they will fail; for the earth will be filled, so that they may know the glory of the Lord, like waters covering the sea. LXX: Woe to him who builds a city with bloodshed, and prepares a town in iniquities. Are not these things from the Lord Almighty? And many peoples have failed in fire, and many nations have been straitened, for the earth will be filled so that it may know the glory of the Lord, like water to cover the seas. No one doubts that according to the letter the prophetic discourse is still speaking against Nebuchadnezzar, and lamenting him because he builds Babylon with bloodshed, and constructs its walls with the ruin and death of very many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
But it is clear that the devil, and the Antichrist, and the perverse doctrine of the heretics build a city with bloodshed, that is, their own church on the destruction of those whom they have deceived, and prepare a town in iniquities, speaking iniquity against God and setting their mouth on high. And when they have done this, it is plainly shown that they build the city of themselves with bloodshed, and prepare it in iniquities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
It can also be understood — although it does not suit the order of the reading, nor fit the present text of Scripture — of Jerusalem, the city full of the blood of the prophets, of which Scripture records that the blood of the saints overflowed in it from gate to gate. And which says at the Lord's passion: His blood be upon us and upon our children. And to which God speaks in Isaiah: When you lift up your hands to me, I will not hear you; for your hands are full of blood. This city was built in iniquities, in which, according to the same prophet, justice slept.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
