[[commentary]]
quote='''
But when Jesus Christ your Son came, you struck the Antichrist from the house of the wicked one, that is, in this world, which lies in the evil one; or you struck the devil himself, who is the head of wickedness, and laid bare his foundation up to the neck, that is, you made his hidden things manifest, not for a short time but for ever; for this is what sela means, that is, always.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: You went forth for the salvation of your people, to save your anointed ones. First let us see how many kinds of anointed ones there are, and afterwards we shall treat how the Lord went forth for the salvation of his anointed ones. In the Old Testament the patriarchs too were called anointed ones, of whom it is written in the psalms: He rebuked kings for their sake: Do not touch my anointed ones, and do no evil to my prophets. And in the first book of Chronicles all who went out of Egypt are called anointed ones. Chrism, too, is prepared for the priesthood in Exodus, with which the priests are afterwards reported in Leviticus to have been anointed. There is also another ointment, with which kings are anointed into the kingship, and it is divided in two. For if they are David and Solomon, that is, strong of hand and peaceful, they are anointed from a horn. But if they are Jehu and Hazael, they are anointed from a flask; for so an earthenware vessel is called, that is, φακὸς. Moreover Cyrus too, king of the Persians and Medes, who released the people from captivity — although many err and think it written of the Lord the Savior —, hears through Isaiah: Thus says the Lord to my anointed Cyrus, whose right hand I have held, that the nations might hear before him, and so on. And at the end it is said: But you have not known me, which it is impious to understand of the Savior. There is a prophetic ointment, with which Elijah is commanded to anoint Elisha as prophet. And above all kinds of ointments there is a spiritual ointment, which is called the oil of exultation, with which the Savior is anointed, and it is said to him: Therefore God, your God, has anointed you with the oil of exultation above your fellows. And I think his fellows are those to whom John too speaks: And you have an ointment from the Holy One. And a little after: These things I have written to you concerning those who lead you astray; and the chrism which you received from him, let it abide in you; and you have no need that anyone teach you, but the chrism itself will teach you about all things, and it is true and is not a lie, and as it has taught you, abide in it. And lest perhaps those who have lost the chrism of baptism should despair of the chrism being restored, it is written in Leviticus that when the leper cast outside the camp has come to the priest, and his leprosy has been cleansed, the priest shall pour oil into his own left hand, and, having dipped his finger, sprinkle the oil seven times before the Lord, and touch with the same oil the ear of him who had been a leper, and his right hand, and his right foot, and whatever remains of the ointment he shall put entirely on his head. And when he has duly completed all these things, then he shall offer a holocaust for him, and the man himself shall be called the anointed of God. I wish to say something, but I fear lest I give the careless an occasion of ruin: that in the holy Scriptures the same man is often found anointed. Indeed, David was anointed three times; which let us not understand of one who has sinned and is anointed again — for it suffices for the leper that, after the first ointment has been lost, he be anointed a second time —; but of one who advances day by day, and whose anointing is ever increased; and he passes from the oil of the leper to the oil of the people and of the saints, and from the oil of the people he arrives at the oil of the priests, and from the priests he rises to the chrism of the high priest, from the high priest also to the king, from the king to the patriarchs, and from the patriarchs he proceeds to Christ; and he is anointed with the oil of exultation, and whoever has been smeared with it is made one spirit with God, and where the Father and the Son are, there he too will be. But this is rare, and these are the prayers of believers. Besides, I do not know whether the effect follows. For it is said: God, your God, has anointed you with the oil of gladness above your fellows, that is, with that oil which those who are your fellows will be able to find either rarely or never. For the salvation of these anointed ones, then, God went forth from his place, as Micah too says: And he will go forth from his place to save. For because those who needed salvation were unwilling to come in to him, he himself went forth from his majesty and from his place, to lead those who were outside into the land of the meek and the region of the living, from which Adam had been expelled, from which Cain went out and dwelt in the land of Nod. But it must be known, as we said above, that where the LXX put in the plural number: To save your anointed ones, there in the Hebrew is laiesua eth messiach, which Aquila translated: For salvation with your Christ; not that God went forth to save the people and to save his Christ, but that he came for the salvation of the people with his Christ, according to that saying of the Gospel: The Father is in me, and I in the Father; and the Father abiding in me, he does his works. Moreover the Fifth Edition also translated similarly: You went forth for the salvation of your people, for salvation with your Christ. But Theodotion, truly like a poor man and an Ebionite, and Symmachus too, of the same doctrine, following a poor sense, translated in Jewish fashion: You went forth for the salvation of your people, to save your Christ, and: You went forth to save your people, to save your Christ. I am about to say something incredible, but nevertheless true. These half-Christians translated in Jewish fashion, and Aquila the Jew translated as a Christian. The Sixth Edition, disclosing the mystery most plainly, rendered thus from the Hebrew: You went forth to save your people through Jesus your Christ, which in Greek is ἐξῆλθες τοῦ σῶσαι τὸν λαόν σου διὰ Ἰησοῦν τὸν Χριστόν σου. To this sense can be adapted the fact that the Father went forth with the Son from the temple and from the ceremonies of the Jews, saying: Your house will be left to you desolate, and came for the salvation of the Gentiles, to save believers through Jesus Christ his Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: You sent death into the head of the wicked. Let us not think this is said of this common death by which we all die, and Abraham died and was gathered to his fathers, and the prophets, and Christ himself died; but death was sent into the iniquitous, so that those who formerly lived to iniquity, having died to sin, might live to justice. This Hannah too signifies in her prayer: The Lord kills and makes alive. For he kills sinners, sending death into the heads of the wicked, in order to make them alive to justice. I will say something more daring: Christ came into the world for this purpose, to send death into the heads of the iniquitous. And just as he himself died to sin once, so they too might die to iniquity, and those who had been made partakers of this death might also become partakers of life. But according to the Hebrew, where it is written: You struck the head from the house of the wicked one; by the head, as I said, let us understand the prince of this world, and by his house, the world and every soul of a sinner, in which the devil had lodging. And the head is struck in the house of the wicked one for this reason, that, once it has been struck and cast out, it may become the house of God, and justice may dwell there and walk about in it. And this is worthy to be thought of God, who went forth for the salvation of his people with his Christ, so that, once such a head has been struck, he may become head in us who is the head of every man and of his Church. If anyone, therefore, still feels himself to be the house of the wicked one, let him pray for the coming of the Son of God, that the head of the wicked one may be crushed in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: You raised up bonds up to the neck, to the end. The Lord raised up the bonds of charity, so that, the former burden having been laid down, and the most heavy yoke by which we were pressed having been thrown off, we might take up the light yoke of Christ, and, set in his chariot, might carry the best of charioteers. Theodotion too, taking this in a good sense, says: You adorned the foundation up to the neck. The Fifth Edition: You laid bare, or, you emptied the foundation up to the neck, sela, that is, always. For because the foreigners had buried with earth the foundation of Christ which was in the soul of each one, the heaped-up soil is carried out, and the most excellent foundation is laid bare and adorned, so that what lay hidden may appear and recover its brightness; and this is done for ever, which in Hebrew is called sela. And at the same time consider that the LXX themselves, compelled by the necessity of the matter, who always translated sela as diapsalma, have here translated, to the end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
