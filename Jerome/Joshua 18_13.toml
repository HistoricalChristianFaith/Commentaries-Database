[[commentary]]
quote='''
Luza [Luz]: ἀμύγδαλον [almond], although some interpret it as κλοιόν, namely the collar of the condemned, which is commonly called boia. But it can also be interpreted this very one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On the Book of Joshua"
