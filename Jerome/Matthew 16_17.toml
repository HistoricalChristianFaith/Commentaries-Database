[[commentary]]
quote='''
This return Christ makes to the Apostle for the testimony which Peter had spoken concerning Him, Thou art Christ, the Son of the living God. The Lord said unto him, Blessed art thou, Simon Bar-jonas? Why? Because flesh and blood has not revealed this unto thee, but My Father. That which flesh and blood could not reveal, was revealed by the grace of the Holy Spirit. By his confession then he obtains a title, which should signify that he had received a revelation from the Holy Spirit, whose son he shall also be called; for Barjonas in our tongue signifies The son of a dove. Others take it in the simple sense, that Peter is the son of Johnq, according to that question in another place, Simon, son of John, lovest thou me? (John 21:15.) affirming that it is an error of the copyists in writing here Barjonas for Barjoannas, dropping one syllable. Now Joanna is interpreted 'The grace of God.' But either name has its mystical interpretation; the dove signifies the Holy Spirit; and the grace of God signifies the spiritual gift.

Compare what is here said, flesh and blood hath not revealed it unto thee, with the Apostolic declaration, Immediately I was not content with flesh and blood, (Gal. 1:16.) meaning there by this expression the Jews; so that here also the same thing is shown in different words, that not by the teaching of the Pharisees, but by the grace of God, Christ was revealed to him the Son of God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Jesus answered and said to him: Blessed are you, Simon Bar Iona, because flesh and blood has not revealed it to you, but my Father who is in heaven. He repays in kind the apostle's testimony about him. Peter had said: You are the Christ, the Son of the living God; the true confession received its reward: Blessed are you, Simon Bar Iona. Why? Because flesh and blood did not reveal it to you, but the Father revealed it. What flesh and blood could not reveal was revealed by the grace of the Holy Spirit. Therefore from his confession he obtains a name signifying that he has his revelation from the Holy Spirit, whose son he is also to be called. For Bar Iona in our language means son of a dove. Others take it simply, that Simon, that is, Peter, is the son of John, according to the question in another place: Simon of John, do you love me? and he answered: Lord, you know, and they hold that it was corrupted by the fault of the copyists, so that Bar Iona was written in place of Bar Iohanna, that is, son of John, one syllable being taken away. And Iohanna is interpreted the grace of the Lord. But both names can be understood mystically, in that the dove signifies the Holy Spirit, and the grace of God the spiritual gift. That also which he says: Because flesh and blood has not revealed it to you, compare with the Apostle's narrative, in which he says: Immediately I did not acquiesce to flesh and blood, there signifying the Jews by flesh and blood; so that here too, under another sense, it is shown that Christ the Son of God was revealed to him not through the teaching of the Pharisees but through the grace of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
