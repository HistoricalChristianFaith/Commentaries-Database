[[commentary]]
quote='''
Truly straining out the gnat, and swallowing the camel; for if they would not put the money into the treasury, because it was the price of blood, why did they shed the blood at all?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But the chief priests, having taken the pieces of silver, said: It is not lawful to put them into the corbanan, because it is the price of blood. Truly straining out the gnat and swallowing the camel! For if they do not put the money into the corbanam, that is, into the treasury and the gifts of God, because it is the price of blood, why is the blood itself shed?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
