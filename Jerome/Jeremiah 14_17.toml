[[commentary]]
quote='''
And you shall say this word to them: Let my eyes shed a tear — or let your eyes shed tears — through night and day, and let them not be silent — or let them not cease —, for the virgin daughter of my people has been crushed with a great crushing, with a most grievous blow, exceedingly. This passage is understood in two ways: either that God himself laments his people and his eyes do not cease to weep, or at any rate that he commands that the eyes of the peoples should flow with tears; and that what must be lamented is no light thing, since the virgin daughter of his people has been struck with the greatest crushing and an intolerable blow. Others think that these things are said in the person of the prophet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
