[[commentary]]
quote='''
Whatever was said to the royal house, let the bishops and their associates, the presbyters and deacons, and the whole ecclesiastical order understand: that if they do what has been commanded, and among other things do not shed innocent blood by causing even the least to stumble and by wounding the consciences of individuals, they will retain the dignity handed down to them by the Lord; but if they are unwilling to do it and despise it, they themselves will reduce the Church to desolation. Now those of the race of David enter through the gates of Jerusalem and sit upon the throne of him whose name means 'strong of hand', and they mount chariots and horses, when they rein in both their own disturbances and those of the people, and walk in the Church with composed step and with a choir of many virtues singing in harmony with them on every side. And that we may believe this to be true, he swears by himself, who, according to the Apostle, has no other greater by whom he could swear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
