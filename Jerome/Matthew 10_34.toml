[[commentary]]
quote='''
He had before said, What I say to you in darkness, that speak ye in the light; He now tells them what will follow upon that preaching, saying, Think not that I am come to send peace upon earth; I am not come to send peace, but a sword.

For in the matter of belief in Christ, the whole world was divided against itself; each house had its believers and its unbelievers; and therefore was this holy war sent, that an unholy peace might be broken through.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Do not think that I have come to send peace upon the earth; I have not come to send peace but a sword. He had said above: What I say to you in darkness, speak in the light, and what you hear in the ear, preach upon the housetops. Now he adds what follows after the preaching. Over the faith of Christ the whole world was divided against itself; every house had both unbelievers and believers, and therefore a good war was sent so that an evil peace might be broken. Something of the kind God is written in Genesis to have done against the rebellious men who had moved from the east and were hastening to build a tower by which they might penetrate the heights of heaven: he divided their tongues. Hence also in the psalm David prays: Scatter, O Lord, the nations that want wars.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
