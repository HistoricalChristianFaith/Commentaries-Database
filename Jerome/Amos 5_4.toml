[[commentary]]
quote='''
For thus says the Lord to the house of Israel: Seek me, and you shall live; and do not seek Bethel, and do not enter into Gilgal, and do not pass over to Beersheba; for Gilgal shall be led captive, and Bethel shall be useless. LXX: For thus says the Lord to the house of Israel: Seek me, and you shall live; and do not seek Bethel, and do not go into Gilgal, and do not pass over upon the well of the oath; for Gilgal shall be led captive, and Bethel shall be as though it were not. It is the custom of the Scriptures always to join glad things to adverse ones, and after God has threatened sad things, he calls to repentance those whom he has frightened, according to that which we read in Isaiah: Woe, sinful nation, a people full of offences, a most wicked seed, unjust sons. And when he had said: Your land is deserted, your cities consumed with fire, strangers will devour your regions before you, he speaks to them, promising better things: Wash yourselves, be clean; take away your wickednesses from your souls, learn to do good, seek judgment, judge for the orphan, justify the widow; and come, let us dispute, says the Lord. Just as, therefore, in Isaiah he supports with gentle speech those whom he had frightened with a severe voice, so also in this prophet, to those to whom he had said: The house of Israel has fallen, it will not again rise; the virgin Israel has strayed in the land, there is no one to raise her up. Now he speaks to them and says: To the house of Israel, that is, to the ten tribes, Seek me and you shall live, since in that you do not seek me, you are dead. And when you have sought, you will find; and when you have found, you will live.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
