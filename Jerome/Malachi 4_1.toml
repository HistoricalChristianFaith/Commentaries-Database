[[commentary]]
quote='''
For behold, the day will come, kindled like a furnace; and all the proud and all who work impiety will be stubble; and the coming day will set them ablaze, says the Lord of hosts, which will not leave them root and shoot. And for you who fear my name the Sun of justice will rise, and healing in his wings; and you will go forth, and leap like calves from the herd. And you will tread down the impious when they are ash under the soles of your feet, on the day that I make, says the Lord of hosts. LXX: For behold, the day comes burning like an oven, and it will burn them up; and all the foreigners, and all who work iniquity, will be stubble; the coming day will set them on fire, says the Lord Almighty, and neither root nor branch will be left in them. And for you who fear my name the Sun of justice will rise, and healing in his wings and you will go forth, and leap like calves loosed from their bonds, and you will trample down the unjust, and they will be ash among your feet, on the day that I make, says the Lord Almighty. Because the impious made me labour with their words and said: Everyone who does evil is good in the sight of the Lord, and such men please him; and vain is he who serves God; and: What profit is it that we have kept his commandments and walked sorrowful before the Lord of hosts? And those who feared God spoke against their rash words, and each one conferred with his neighbour about the things that pertain to the fear of God: the Lord attended and heard, and a book of remembrance was written for those who fear the Lord and think upon his name, and he promises that when the day comes he will have them for a special possession, and will spare them as a man spares his son who serves him, and he drives it home more fully and says: Behold, the day will come, that is, the day of judgement, which will be light to the saints and darkness to sinners; and that day will be kindled like a furnace, or an oven, so that all the impious are turned into stubble and burned up by the heat of the furnace. And when it has set them ablaze and burned them up, it will not leave in them any root and shoot of wickedness. This is about the impious, what they will suffer on the day of judgement.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
