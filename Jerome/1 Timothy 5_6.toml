[[commentary]]
quote='''
It is difficult, or rather impossible, when we are swimming in luxury or pleasure, not to think of what we are doing. And it is an idle pretense which some put forward that they can take their fill of pleasure with their faith and purity and mental uprightness unimpaired. It is a violation of nature to revel in pleasure, and the apostle gives a caution against this very thing when he says, "She that gives herself to pleasure is dead while she lives." The bodily senses are like horses madly racing, but the soul like a charioteer holds the reins. And as the horses without a driver go at breakneck speed, so the body, if it be not governed by the reasonable soul, rushes to its own destruction.
'''
source_url=''
source_title="AGAINST JOVINIAN 2.9-10"

[[commentary]]
quote='''
Let no one, then, suppose that he will be crowned amid delights. "The widow who is in delights, while living, is dead." What the apostle said of one person, let us apply to all: for the apostle's care was not for widows alone, since he stood forth as the teacher of the whole Church. Now, because he did not name the virgin, nor the monk, nor the churchman, ought a man for that reason not to hold himself back from delights? For if the widow is a human being, I think the rest are human beings too: who, on account of the common frailty, can incur through delights that which the widow dreads.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_071.html'
source_title="Homily 71, on Psalm 93 (Alternate Series)"
