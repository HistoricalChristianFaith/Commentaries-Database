[[commentary]]
quote='''
Nor is it any wonder if, as the occasion offered, he made use of the verses of Gentile poets, since, changing some things in the inscription of an altar, he even spoke to the Athenians: "For passing through," he says, "and beholding your objects of worship, I found also an altar on which was written: To an unknown God. What, therefore, you worship without knowing, this I announce to you". But the inscription of the altar was not as Paul declared, To an unknown God, but thus: To the gods of Asia and Europe and Africa: to unknown and foreign gods. But because Paul did not need many unknown gods, but only one unknown God, he used the singular word, to teach that his God was the one whom the Athenians had inscribed in the title of the altar, and that they ought rightly to worship, knowing him, the one whom they venerated without knowing, and whom they could not fail to know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
