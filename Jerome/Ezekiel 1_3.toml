[[commentary]]
quote='''
The word of the Lord came to Ezekiel the son of Buzi, the priest, in the land of the Chaldeans beside the river Chebar. Both to Daniel and to Ezekiel, who were in Babylon beside the rivers, the mysteries of things to come are laid open above the waters, nay rather in the purest waters, so that the power of baptism might be shown. Besides, the apostle Paul too, when he was washed in the Lord by Ananias, scales having first covered his eyes, was freed of blindness. And in Genesis the first things that lived came forth from the waters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Further, 'Buzi' is rendered in our language 'spurned' and 'despised', 'Hiezechiel' [Ezekiel] 'strengthened by God'. This will be fitted to the Lord thus, that we may say that the Creator of the world, because he is the Father of the Savior, is spurned and despised by all the heretics who do not receive the Old Testament. Nor is it surprising that the Lord is the strong one of God, since he himself is the power of God and the wisdom of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
And the hand of the Lord came upon him there. (LXX: "And the hand of the Lord came upon me.") In order that we may be able to discern and understand the visions of God, we need the hand and strength of God upon us. By this hand and arm the people of Israel was led out of Egypt; its mighty works even the magicians partly understood, saying: This is the finger of God; and the Savior in the Gospel: If I cast out demons by the finger of God, in place of which it is written in another Gospel: If I cast out demons by the Spirit of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
