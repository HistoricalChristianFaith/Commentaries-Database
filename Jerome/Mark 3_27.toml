[[commentary]]
quote='''
Our Lord and Savior, who had spoken earlier through Isaiah, himself repeats the same sense in the Gospel: how can anyone enter the house of a strong man and plunder his goods, unless he first binds the strong man, and then he will plunder his house (Mark 3)? The strong man and giant is the devil, who had subjugated all the nations to his rule, daring to say to the Savior: All these things have been delivered to me, and I will give them to you, if you will fall down and worship me (Matt 4:9). For the world lies in the evil one (1 John 5), and none of the righteous could conquer him: nor, according to Amos, take the prey from the lion's mouth (Amos 3). The question having been set, then, that no one could conquer the strong man and the giant, nor save what had been seized by him, the Lord answered that all would be accomplished by his coming: namely, that the nations formerly captured would be taken from the giant, and all his furniture and his whole household be divided among the Apostles. So is fulfilled what is written: The king of the powers of the beloved, and to the beauty of the house to divide the spoils. For he it is who, ascending on high, led captivity captive, he gave gifts among men (Ps 67 [68]:13, 19; Eph 4): that is, those who had formerly been taken captive unto death he received unto life. Hence Symmachus translated more plainly: But even the captivity of the strong one shall be taken away, and the plunder of the terrible one shall be safe. He wishes the strong and terrible one to be understood as the devil, who has been overcome by the power of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Or how can anyone enter the house of the strong man and plunder his vessels, unless he first binds the strong man, and then he will plunder his house? We must not be complacent: our adversary is shown to be strong even by the words of the victor; his house is the world, which is set in the evil one, not by the dignity of the Creator but by the greatness of the offender; his vessels we once were. The strong man has been bound and fastened down in Tartarus and crushed by the foot of the Lord, and, the seats of the tyrant having been plundered, captivity has been led captive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
