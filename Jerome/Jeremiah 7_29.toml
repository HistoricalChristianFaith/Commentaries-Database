[[commentary]]
quote='''
Shear your hair and cast it away, and take up in the open — or upon the lips — a lament, for the Lord has cast off and forsaken the generation of his fury. We read that Job too, on hearing of the death of his sons and daughters, sheared his hair, and among the ancients this was the custom of all who mourned, to shear the locks; but now, on the contrary, to let the hair grow long is the sign of mourning. And all the prophet's lament and lamentation is taken up for this reason, for the Lord has cast off and forsaken the generation of his fury; no doubt he signifies the people of the Jews. And this is properly to be referred to the times of Christ, when faith perished and was taken away from the mouth of the people blaspheming the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
