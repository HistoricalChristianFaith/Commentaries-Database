[[commentary]]
quote='''
For neither is circumcision anything, nor uncircumcision, but a new creature.

Just as the faithful man and the unbeliever, though one in substance, are divided into two according to the difference of their understanding, as the Apostle says: "Stripping yourselves of the old man with his works, and putting on the new, who is renewed unto knowledge according to the image of the Creator" (Col. 3:9, 10): so also the world, though it is one according to substance, becomes now one thing, now another, according to the mind. To the sinner the world is old; to the saint, new. For when the world has been crucified to the saint, there is for him no circumcision and uncircumcision, no Jew and no Gentile, but a new creature, into which the body of our lowliness is transfigured, conformed to the body of the glory of Christ: for the old things have passed away; behold, all things are made new (2 Cor. 5). And as there is one glory of the sun, another of the moon, another of the stars: "For star differs from star in glory: so also is the resurrection of the dead" (1 Cor. 15:41, 42). Concerning which Daniel too agrees with one voice, saying: "Very many of those who sleep shall rise from the dust of the earth: these to eternal life, and these to reproach and to eternal confusion" (Dan. 12:2); and: "Those who understand shall shine like the splendor of the firmament". And of the righteous: "Many like the stars for ever". For neither in the sun and moon, the firmament and the stars, does circumcision avail anything, or uncircumcision: but there is a new creation, without those parts of bodies that can be cut. So therefore we too, who love God, and for whom have been prepared the things that eye has not seen, nor ear heard, nor have they ascended into the heart of man (1 Cor. 2), when we have been transformed from the body of lowliness into the body of the glory of the Lord Jesus Christ, shall have that body which neither the Jew could cut, nor the Gentile keep with its foreskin. Not that it is something other according to substance, but that it is different according to glory. "For this mortal must put on immortality, and this corruptible be clothed with incorruption" (1 Cor. 15:53). Perceiving something similar to this, the blessed evangelist John also spoke: "Dearly beloved, now we are sons of God: and it is not yet manifest what we shall be. We know that if it is made manifest, we shall be like him: because we shall see him as he is" (1 John 3:2). Since, then, that body of the glory of Jesus Christ has not yet been made manifest — the body which both had the marks of the nails after the resurrection and entered through closed doors — let us, who even now in baptism have risen again with Christ, reborn into the new man, serve neither circumcision nor uncircumcision, but let us believe that even now we are what we shall be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
