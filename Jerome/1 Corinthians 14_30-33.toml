[[commentary]]
quote='''
This too must be noticed: that the assumption or weight, which we have already said are heavy things, is the vision of the prophet; and, against the perverse doctrine of Montanus, he understands what he sees, and he neither speaks like a madman nor, in the manner of raving women, gives forth sound without mind. Hence the Apostle also commands that, if while others are prophesying something has been revealed to another, those who were speaking first should be silent. And immediately: For God, he says, is not of dissension, but of peace. From this it is understood that when someone falls silent by his own will and gives place to another to speak, he can both speak and be silent when he wishes. But he who speaks in ecstasy, that is, unwillingly, has neither silence nor speech in his own power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
