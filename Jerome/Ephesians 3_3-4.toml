[[commentary]]
quote='''
This man, then, who makes solecisms in his words, who cannot complete a hyperbaton and close a sentence, boldly claims wisdom for himself and says: For according to revelation the mystery is known to me, as I wrote before in brief. For truly, if anyone considers the earlier parts of this epistle, he will see mysteries revealed to the Apostle, some small part of which he touched on in his discourse: not so much bringing forth all that he knew as showing from the little what he kept silent. As you are able, he says, reading, to understand my sense, or wisdom, in the mystery of Christ. This is what we said in the preface: that none of Paul's Epistles has so many mysteries, or is wrapped in such recondite meanings, which the Apostle both boasts that he knows and shows to us, indicated briefly, so that we may reread more attentively what has been written.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
