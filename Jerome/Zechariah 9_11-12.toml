[[commentary]]
quote='''
With this proviso, however, that they interpret the earlier testimony otherwise than we have explained it, and say: O Christ, whom we hope will come, and who are to reign in all the ends of the earth, by the blood of your testament, in which, according to Ezekiel, you found Jerusalem spattered with her own blood, and by which you entered into a covenant with Abraham in the dividing of the calf and the ram and the goat, you have released your people Israel from the captivity and the furnace of the Chaldeans, in whom there was no mercy. Therefore you too, O Israelites, who were prisoners and hoped in the Lord, return to most strongly fortified Jerusalem, for today you have the Lord promising you that for the brief injury of captivity you shall receive all things doubled, as we read that Job also received them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
