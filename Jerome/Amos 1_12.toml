[[commentary]]
quote='''
Hence he threatens punishment for their crimes, and says: I will send fire into Teman, which is a region of the Idumeans, and it lies toward the southern quarter, which is what Teman means; this province is called not only Teman but also Daron and Nageb, because it faces the east wind and the south wind and the south-west wind. And as for what he says: It shall devour the houses of Bozrah, it signifies, not another city, as some think, but Idumea, ὀχυρωμένην and fortified, according to that which we read in Isaiah: Who is this who comes from Edom, with garments dyed from Bozrah; this one beautiful in his robe, walking in the multitude of his strength?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
