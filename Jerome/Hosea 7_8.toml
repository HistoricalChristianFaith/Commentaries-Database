[[commentary]]
quote='''
But, to pass to another sense: though Ephraim ought to teach the peoples and draw them to his own likeness, he himself is mingled with the peoples and becomes like them; according to what was said above: As the people is, so will the priest be. Or Ephraim is mingled with the peoples and the nations, so that all heretics differ in nothing from the error of the Gentiles. And he who was once a leader in the Church has become a loaf baked under the ashes, surrounded on every side by unclean ash and the heat of the fires, so that he did not return to the Lord but persisted in the error he had begun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
