[[commentary]]
quote='''
We think the Evangelist first wrote, as we read in the Hebrew, 'Judah,' not 'Judæa.' For in what other country is there a Bethlehem, that this needs to be distinguished as in 'Judæa?' But 'Judah' is written, because there is another Bethlehem in Galilee.

They knew that such a star would rise by the prophecy of Balaam, whose successors they were. But whether they were Chaldæans, or Persians, or came from the utmost ends of the earth, how in so short a space of time could they arrive at Jerusalem?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And in place of what we have translated, following Symmachus and Theodotion: Let the augurs of the heaven stand and save you, the Seventy translated more plainly, Let the astrologers of the heaven stand and save you; who are commonly called mathematicians, and think that human affairs are ruled by the course of the stars and the motion of the heavenly bodies. Hence the Magi too came from the East, saying they had seen the Lord's star, either from the knowledge of their art, or from the prophecy of Balaam, their own Prophet, who had said in Numbers: A star shall rise out of Jacob, and a man from Israel (Num 24:17).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
