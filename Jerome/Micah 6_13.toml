[[commentary]]
quote='''
Hence the most merciful God does not strike them all at once, but strives little by little to admonish them through blows, saying: And I will begin to strike you with ruin on account of your sins; and the sense is: O city which the heretics wish to build, I will strike you so that you perish, not unto abolition, but in so far as you are a sinner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
