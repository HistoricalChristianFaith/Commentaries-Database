[[commentary]]
quote='''
Your riches and your treasures I will give up for plunder for nothing — or without price — for all your sins and in all your borders. And I will bring your enemies — or I will make you serve your enemies — from a land which you do not know, because a fire has been kindled in my fury; it will burn upon you. 'All your substance', he says, 'I will hand over to your enemies without any price, on account of the sins which you have committed in all your borders. Therefore I will bring your enemies or I will make you serve in the land of Chaldea, because my fire, once kindled in my fury, will burn in you and cannot be extinguished; for you have furnished the material for your own burning, so that my fire may consume your wood, which is in you, and hay and stubble'. And so the cause of the burning is not in the Lord, but in those who supplied fuel to the fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
