[[commentary]]
quote='''
Whoso sinneth, yet believeth on Him, falls indeed upon a stone and is broken, yet is not altogether crushed, but is preserved to salvation through endurance. But on whomsoever it shall fall, that is, whomsoever this stone shall itself assault, and whosoever shall utterly deny Christ, it shall so crush him, that not a bone of him shall be left in which a drop of water could be taken up.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Whoever falls on this stone will be broken, but on whomever it falls it will crush him. It is one thing to offend Christ by evil works, another to deny him. He who is a sinner and yet believes in him falls indeed on the stone and is broken, but is not utterly crushed; for he is kept through patience for salvation. But on whomever it falls, that is, on whom the stone itself rushes down, and who has wholly denied Christ, it will so crush him that not even a potsherd remains with which a little water might be drawn.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
