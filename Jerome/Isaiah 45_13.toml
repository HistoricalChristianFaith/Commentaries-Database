[[commentary]]
quote='''
Some refer these things to Zerubbabel, who led the captives out of Babylon, and built the city, and constructed the temple, while Haggai and Zechariah prophesied and said: The hands of Zerubbabel have founded this house, and his hands will complete it (Zech 4:9). But we say more rightly and more truly that neither did Cyrus build the city, which was constructed afterwards under Nehemiah, nor were all his ways made straight, he to whom it was said above: I took you and girded you, and you did not know me; and that all that is said exceeds the station of Zerubbabel, who was under the nod and power of the Medes and Persians. For Zerubbabel neither constructed the city, nor let the captivity go, nor can he be called king who, living under other kings, lacked this name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
