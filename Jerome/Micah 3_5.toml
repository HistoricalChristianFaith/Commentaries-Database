[[commentary]]
quote='''
But if we choose to take what is said according to the Seventy as concerning the heretics, who are truly false prophets, and say, thus says the Lord, when the Lord has not sent them, we shall not err. For they deceive the people that was once God's with error, and they do this in order to eat them, either simply in receiving presents, or mystically in the slaughter of their souls; and they promise them peace and the heavenly kingdoms, and say, there is no need for you to live continently and holily; hold the faith which we teach, and you will obtain all the promises of the Lord. Speaking such things, they rather stir up the wrath of the Lord against them, and sanctify war against them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
