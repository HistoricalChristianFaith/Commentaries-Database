[[commentary]]
quote='''
Because to the men of Sodom and Gomorrah no man had ever preached; but this city had been preached to and had rejected the Gospel.

But if it shall be more tolerable for the land of Sodom than for that city, hence we may learn that there is difference of degree in the punishment of sinners.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Amen I say to you: It will be more tolerable for the land of Sodom and Gomorrah in the day of judgment than for that city. If it will be more tolerable for the land of Sodom and Gomorrah than for that city which has not received the Gospel, and more tolerable for this reason, that it was not preached to Sodom and Gomorrah, but it has been preached to this city and yet it has not received the Gospel, then there are different punishments even among sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
