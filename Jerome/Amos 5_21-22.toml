[[commentary]]
quote='''
I have hated and cast away your festivals, and I will not take in the odour of your gatherings. And if you bring me your whole burnt offerings and your gifts, I will not accept them, and I will not regard the vows of your fatlings. LXX: I have held in hatred and rejected your festivals, nor will I smell in your assemblies. And if you offer me holocausts and sacrifices, I will not accept them, and I will not regard the saving offering of your presence. This is said properly against the tribe of Judah, and against those who had migrated from Israel to the ceremonies of God, and nevertheless did not depart from the high places, and worshipped idols, and polluted the sacrifices of God by the greatness of their sins. For I never think that he would have said of the offerings of calves which they offered in Dan and in Bethel: If you offer me your whole burnt offerings and your gifts, I will not accept them. But God hates, and not only hates but also has cast away, the festivals of those who flee the lion and run into the bear, and enter the house and are bitten by the serpent, because they do not celebrate the festivals of God but their own festivals, as the Lord says: I have hated and cast away your festivals. And he does not accept the gathering and the odour of men of this kind, nor does he hold it for an odour of sweet fragrance, and he detests all their gifts, and does not regard their fattest vows. This indeed will happen not only to the men of that time, but to us as well, if we commit similar offences, and think that we offer to God what has been gained by plunder and perjuries and crimes, and that we redeem our sins, when we have read that Zacchaeus restored fourfold whatever he had seized, and of what he had gained honestly offered half his substance. For he could not offer as gifts to God what had been wrongly gained, unless he first restored it to its owners, and afterwards fulfilled what is written: Honour the Lord from your just labours, and: The ransom of a man's soul is his own riches; for God does not accept vows from the hire of a harlot. On the contrary, the just man can say: Let my prayer be directed as incense in your sight. This prayer was turned into sin for Judas the betrayer, for it did not have a good odour, but he said by his deed: My scars have putrefied and are corrupted, because of my foolishness. All these things we can say of the heretics as well, who, while they flee the lion, run into the bear, and having entered the house which they think is the Church of God, lean upon walls which they themselves have made, and are bitten by the serpent; whose light and day darkness and gloom snatch away, so that the darkness is palpable and their firstborn are slain. God hates their sacrifices and casts them away from himself, and whenever they have gathered under the name of the Lord, he detests their stench and shuts his nostrils. But in speaking of hating and casting away and not smelling, he speaks by a human likeness, so that we may come to know the disposition of God through our own words. And if they offer holocausts, or seem to fast, to give alms, to profess chastity, which are the true holocausts, the Lord does not accept these, nor does he deign to look upon their fattest victims. For he judges not the greatness of the sacrifices but the merits and motives of those who offer. Hence also the widow in the Gospel, who had cast two mites into the treasury, is preferred by the Savior to all those who believed that they were offering the fattest vows and victims full of marrow, giving little out of much, since she had offered all that she had. Are these things said more plainly and more truly, after the coming of the Lord, to the people of the Jews, who, though the temple and the altar have been destroyed, believe that they offer victims? God hates and casts away their festivals, and does not take in the odour of their gathering, when, gathered together, they say: Crucify, crucify such a one, and: His blood be upon us and upon our children. And if they offer holocausts in the synagogues, and gifts in the councils of Satan, and their fattest vows, the Lord does not regard them, just as he did not regard the gifts of Cain. They worship the one God well indeed, and offer rightly, but in this they are not regarded, that they do not divide their confession into the Father, and the Son, and the Holy Spirit. But our gifts, that is, those of the Church, which we offer from our firstfruits, God regards, as once he regarded the sacrifices of Abel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
