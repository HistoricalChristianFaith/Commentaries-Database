[[commentary]]
quote='''
We read in Leviticus, if indeed we read with open eyes, and the veil that is placed upon the law does not shut out the gaze of the inner eye, that leprosy is wont to arise in the weal and scar of a burn, and to change the color of the hair, and that a new foulness is added to the former disfigurement of the scar. This is so for this reason: that no one, secure about repentance because after sin he can say: I will endure the wrath of the Lord, because I have sinned against him, until he justifies my cause, should sin and need cautery, and, once healed, be wounded again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
