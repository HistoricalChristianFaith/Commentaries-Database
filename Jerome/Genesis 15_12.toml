[[commentary]]
quote='''
And at the setting of the sun an ἔκστασις fell upon Abram. For ecstasy, in the Hebrew we read tardema, that is, καταφορά, which above we rendered as deep sleep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
