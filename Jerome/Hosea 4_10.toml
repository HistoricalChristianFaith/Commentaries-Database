[[commentary]]
quote='''
And they will eat and will not be satisfied; they have played the harlot and have not ceased, since they have forsaken the Lord in not observing; fornication and wine and drunkenness take away the heart. My people has inquired of its wood, and its staff has declared to it. For the spirit of fornications deceives them, and they have played the harlot away from their God. LXX: And they will eat and will not be filled; they have played the harlot and will not be set straight, because they have forsaken the Lord, so as not to observe; the heart of my people has taken up fornication and wine and drunkenness; they inquired by auguries, and by their rods they made announcement to it; for they have been led astray by a spirit of fornication and have played the harlot away from their God. Pleasure is insatiable, and the more of it is taken, the more hunger it creates in those who use it. On the contrary, blessed are those who hunger and thirst for justice, for they shall be satisfied. As justice satisfies, so iniquity, having no substance, mocks with deceit those who eat empty things, and leaves the bellies of those who devour it empty. They have played the harlot and have not ceased. Their strength fails in fornication, and the desire to fornicate does not rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
