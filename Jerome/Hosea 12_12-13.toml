[[commentary]]
quote='''
He will not err who says that Jacob the supplanter, and Israel who sees the Lord, went before as a type of the Lord; and that Rachel, at first barren and beautiful, whom Jacob loved most, signifies the Church; but that Leah, with bleary eyes and fruitful, shows the mysteries of the Synagogue; and that he himself led the people of believers out of the darkness of this world, and came to the sweetest streams of the Jordan, that is, of baptism.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
