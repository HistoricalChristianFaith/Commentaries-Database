[[commentary]]
quote='''
And because many rejoice in the health of the body, and think youth and boyhood to be perpetual, he adds and says that the flowering age quickly falls, and robust bodies wither.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
