[[commentary]]
quote='''
As the blind receive light, so the tongue of the dumb is loosed, that he may confess Him whom before he denied. The wonder of the multitude is the confession of the nations. The scoff of the Pharisees is the unbelief of the Jews, which is to this day.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the crowds marveled, saying: Never has the like appeared in Israel. But the Pharisees said: By the prince of demons he casts out demons. The crowd acknowledges the works of God and says: Never has the like appeared in Israel. In the crowd is the confession of the nations. But the Pharisees, because they could not deny the mighty work, slander the deeds and say: By the prince of demons he casts out demons, showing by their slander the unbelief of the Jews down to this day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
