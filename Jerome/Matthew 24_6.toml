[[commentary]]
quote='''
That is, Think not that the day of judgment is at hand, but that it is reserved against another time; the sign of which is plainly put in what follows, For nation shall rise against-nation, and kingdom against kingdom.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For you are going to hear of battles and rumors of battles; see that you are not troubled; for these things must happen, but the end is not yet. So when we see these things happen, let us not think that the day of judgment is coming in, but that it is reserved for that time whose sign is clearly set out in what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
