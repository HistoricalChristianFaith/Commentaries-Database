[[commentary]]
quote='''
I was troubled, and I did not speak. This is what the apostle says: "Let not the sun go down upon your wrath." I was troubled, as a man; I did not speak, as a Christian. Anger began in my heart, but I did not bring the anger forth into words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_010.html'
source_title="Homily 10, on Psalm 76"

[[commentary]]
quote='''
That I am troubled, belongs to a man: but to overcome the trouble and the anger, this belongs to great virtue. Therefore the apostle also says: "Be angry, and do not sin." Are you angry? You are a man. Does the anger not remain in you? You are a Christian.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_035.html'
source_title="Homily 35, on Psalm 108"
