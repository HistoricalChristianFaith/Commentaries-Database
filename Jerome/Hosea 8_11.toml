[[commentary]]
quote='''
For Ephraim has multiplied altars for sinning; altars have become for him an offense. I will write for him my manifold laws, which have been reckoned as foreign; bring victims, bring; they will sacrifice flesh and eat it, and the Lord will not accept them. LXX: For Ephraim has multiplied altars, for sin, altars are beloved to him. I will write for them a multitude; his ordinances have been reckoned as foreign, beloved altars; for if they have sacrificed victims and eaten flesh, the Lord will not accept them. Led, he says, into captivity, they will rest for a little while from the burden of the king and the prince. And they will suffer this because Ephraim, their prince, has multiplied altars, not on which to sacrifice to the Lord, but on which to join sins to sins; and these altars, that is, places of sacrifice, will be turned for him into an offense, so that the more of them there are, the more his crimes are multiplied.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
