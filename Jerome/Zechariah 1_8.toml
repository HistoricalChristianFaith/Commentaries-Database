[[commentary]]
quote='''
[Daniel 7:5] "And behold another beast like a bear stood up on one side; and there were three rows in his mouth and in his teeth; and they said to him: 'Arise up and devour flesh in abundance.'" The second beast resembling a bear is the same as that of which we read in the vision of the statue (2:32): "His chest and arms were of silver." In the former case the comparison was based on the hardness of the metal, in this case on the ferocity of the bear. For the Persian kingdom followed a rigorous and frugal manner of life after the manner of the Spartans, and that too to such an extent that they used to use salt and nasturtium-cress in their relish. Let us consult the record of the childhood of Cyrus the Great (i.e., "The Education or Training" of Cyrus). And as for the fact that the bear is said to have "stood up on one side," the Hebrews interpret it by saying that the Persians never perpetrated any cruelty against Israel. Hence they are described in the Prophecy of Zechariah also as white horses (Zechariah 1:7-11). But as for the three rows or ranks that were in his mouth and between his teeth, one authority has interpreted this to mean that allusion was made to the fact that the Persian kingdom was divided up among three princes, just as we read in the sections dealing with Belshazzar and with Darius that there were three princes who were in charge of the one hundred and twenty satraps. But other commentators affirm that these were three kings of the Persians who were subsequent to Cyrus, and yet they fail to mention them by name. But we know that after Cyrus's reign of thirty years his son Cambyses ruled among the Persians, and his brothers the magi, and then Darius, in the second year of whose reign the rebuilding of the Temple was commenced at Jerusalem. The fifth king was Xerxes, the son of Darius; the sixth was Artabanus; the seventh, Artaxerxes who was surnamed Makrokheir, that is Longimanus ("Long-handed"); the eighth, Xerxes; the ninth, Sogdianus; the tenth, Darius surnamed Nothos ("Bastard"); the eleventh, the Artaxerxes called Mnemon, that is, "The Rememberer"; the twelfth, the other Artaxerxes, who himself received the surname of Ochus; the thirteenth, Arses, the son of Ochus; and the fourteenth, Darius the son of Arsamus, who was conquered by Alexander, the king of the Macedonians. How then can we say that these were three kings of the Persians? Of course we could select some who were especially cruel, but we cannot ascertain them on the basis of the historical accounts. Therefore the three rows in the mouth of the Persian kingdom and between its teeth we must take to be the three kingdoms of the Babylonians, the Medes, and the Persians, all of which were reduced to a single realm. And as for the information, "And thus they spake to him: 'Devour flesh in abundance,'" this refers to the time when in the reign of the Ahasuerus whom the Septuagint calls Artaxerxes, the order was given, at the suggestion of Haman the Agagite, that all the Jews be slaughtered on a single day (Esther 3:13). And very properly, instead of saying, "He was devouring them" the account specifies, "Thus they spake unto him..." This shows that the matter was only attempted, and was by no means ever carried out.
'''
source_url='https://www.ccel.org/ccel/pearse/morefathers/files/jerome_daniel_02_text.htm'
source_title="St. Jerome, Commentary on Daniel, CHAPTER SEVEN"

[[commentary]]
quote='''
I saw by night, and behold, a man mounting a red horse, and he was standing among the myrtle groves that were in the deep, and behind him horses red, dappled and white. And I said: What are these, my lord? And the angel who was speaking in me said to me: I will show you what these are. And the man who was standing among the myrtle groves answered and said: These are they whom the Lord has sent to walk through the earth. And they answered the angel of the Lord, who was standing among the myrtle groves, and said: We have walked through the earth, and behold, all the earth is inhabited and at rest. And the angel of the Lord answered and said: O Lord of hosts, how long will you not have mercy on Jerusalem and on the cities of Judah, with which you are angry? This is the seventieth year. And the Lord answered the angel who was speaking in me good words, words of consolation. LXX: I saw in the night, and behold, a man mounting a red horse, and he was standing between two shady mountains, and behind him horses red, and dappled, and white. And I said: What are these, lord? And the angel who was speaking in me said to me: I will show you what these are. And the man who was standing between the mountains answered and said to me: These are they whom the Lord has sent to go round the earth. And they answered the angel of the Lord, who was standing between the mountains, and said: We have gone round all the earth, and behold, all the earth is inhabited and at rest. And the angel of the Lord answered and said: O Lord Almighty, how long will you not have mercy on Jerusalem and on the cities of Judah, with which you are angry? This is the seventieth year. And the Lord answered the angel who was speaking in me good words and consoling speeches. Let us first discuss the history: I saw, he says, by night, not by day, like Moses, who saw God face to face, and Isaiah, who said: I saw the Lord upon a throne high and lifted up, before the people was led into captivity, before Jerusalem and the temple were destroyed; but now, with the people still set in the evils of servitude, he discerns in darkness the things he sees on their behalf. And behold, a man mounting a red horse. This the Hebrews think is the angel Michael, who is the avenger of the iniquities and sins of Israel. And as to his having stood among the myrtle groves that were in the deep, they want the myrtles to be understood as the prophets and saints who were living in the midst of the captive people and were in the deep; and the man, that is, Michael, was followed by horses red and dappled and white, the order, as they suppose, being changed, so that the white signify the Medes and Persians, because under them the captivity was released and the temple restored; the dappled, the Macedonians, some of whom were friends, others persecutors — the last vision of Daniel speaks most fully on this —; and the red, the kingdom of the Romans, bloody and murderous, which slew the people and overthrew the temple. Others, however, keeping the order as it is written, interpret the man who mounted the red horse, and the red, dappled and white horses, as four kingdoms. The first and second, the bloody ones, are the Assyrians and Chaldeans, the first of whom led the ten tribes captive under Shalmaneser, the second Judah and Benjamin, when the city of Jerusalem had been burned and the temple overthrown. The third and fourth, the dappled and white, they think signify the Medes and Persians, some of whom were merciful, like Cyrus, and Darius son of Hystaspes, and Ahasuerus, whom the Greeks call Artaxerxes, under whom the story of Esther is fulfilled, and others cruel, like Cambyses and the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
But the teachers of the churches understand the night in which the vision is seen as the obscurity of a mystical vision. For God made darkness his hiding place. And according to the Seventy translators it is said of him: The abyss like a garment is his clothing. Now the man who was mounting the red horse is the Lord and Savior, who, taking it up for the dispensation of our flesh, hears in Isaiah: Why are your garments red? He who is now shown as red to the captive people is described in the Apocalypse of John as sitting in white garments and on a white horse. And as to his being said to stand between two shady mountains — although 'two' is not found in the Hebrew — they take them as the New and the Old Testament, which is said to be covered with very dense foliage, and grove, and shady woods, because it is wrapped in many obscurities. And the myrtle groves that were in the deep, among which he is described as standing, they understand as the angelic powers, which ministered to him even when he was set in the flesh. Or else, removing what is not written, 'two', we can take the mountains absolutely and without number as very many saints, and the apostles and apostolic men, who are recorded as having traveled through the whole world, red, and dappled, and white; of whom some are crowned with martyrdom and are called red; others, for their works and teaching and the variety of their signs, are named dappled; others have received the rewards of virginity and of uncorrupted doctrines, and of the pure heart, which sees God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
