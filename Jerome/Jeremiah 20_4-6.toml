[[commentary]]
quote='''
For thus says the Lord: Behold, I will give you into terror, and all your friends, and they shall fall by the sword of their enemies, and your eyes shall see it; and all Judah I will give into the hand of the king of Babylon, and he shall carry them over into Babylon and shall strike them with the sword. And I will give all the substance — or strength — of this city, and all its labor, and every price — or glory — and all the treasures of the kings of Judah I will give into the hand of their enemies, and they shall plunder them and take them and lead them into Babylon. But you, Pashhur, and all the inhabitants of your house shall go into captivity, and you shall come into Babylon, and there you shall die and there you shall be buried, and all your friends, to whom you prophesied a lie. According to the earlier interpretation, by which the name 'Phassur' had been changed so that he should be called 'Magur', all likewise translated so as to signify either 'terror' or 'sojourning' or 'removal' and 'transfer' and 'migration'. And he threatens that he, with his friends, is now at any moment to be taken and handed over into the hands of the enemy; and that the whole people of the tribe of Judah is to be held in the hands of the Babylonian king, some to be killed by the sword and others to be led into captivity; and that all the riches, both of the city and of the royal treasuries, are to be seized by the enemies; and that Pashhur himself, with all his kindred and household, is to be led into captivity and will die in Babylon, because he deceived the people by his lie, promising them by no means things true and sad, but prosperous things through a lie. At the same time the patience and the prudence of the prophet must be noted: sent into prison, he is silent and conquers the injury by silence, and yet he does not conceal what he knows is to come, so that at least in this way the false-prophet high priest may cease to sin and may entreat the mercy of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
