[[commentary]]
quote='''
And at the last they make not, as at the northern quarter, only seven steps, but after the seven the number eight is set, so that we may pass from the Synagogue to the Church, from the old testament to the new, from earthly things to heavenly ones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
