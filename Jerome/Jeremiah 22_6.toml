[[commentary]]
quote='''
For thus says the Lord concerning the house — or to the house — of the king of Judah: You are Gilead to me, the head — or the beginning — of Lebanon; if I do not make you a desolation, cities uninhabitable. And I will sanctify against you a man who slays, and his weapons, and they shall cut down your choice cedars and hurl — or cast — into the fire. And many nations shall pass through this city, and each shall say to his neighbor: Why has the Lord done thus to this great city? And they shall answer: Because they forsook the covenant of the Lord their God and worshiped strange gods and served them. Scripture records that Gilead, which the half-tribe of Manasseh possessed, lies beyond the Jordan; on this mountain Laban overtook Jacob as he fled, and the mountain, according to Genesis, received the name sōros, that is, 'mound of witness', because Jacob and Laban swore there, after stones had been gathered into a heap. Now it is the head or beginning of Lebanon, a lofty mountain which is planted all over with cedars, according to that word of David as he sings: and the Lord will shake the cedars of Lebanon, and elsewhere: I saw the wicked man exalted and lifted up like the cedars of Lebanon; and in Zechariah we read: Open your gates, O Lebanon, and let fire devour your cedars! Therefore in the present passage, since he was speaking to the royal house, he speaks by metaphoran [metaphor] to the temple, or to the house of the stock of Judah, because it is itself on a height, or because remedies for all sins were sought from the temple and the sanctuary; whence this same prophet also records: Is there no resin in Gilead, or is there no physician there? Why has the healing of the daughter of my people not gone up?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
