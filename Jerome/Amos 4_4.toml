[[commentary]]
quote='''
This we have said according to the Hebrew; let us pass on to the LXX translators, and discuss briefly what seems to us according to anagogy in each point; for the size of the books does not allow it, if we should wish to say both things in each edition. You entered into Bethel, that is, into the house of God, which is understood as the Church, and you acted impiously against the Lord, trampling on his precepts. And in Gilgal, which is interpreted revelation or wallowing-place, you multiplied impieties, claiming for yourselves the knowledge of the holy Scriptures, and while you are lifted up into pride, you have rolled down into the lowest depths of the mire. You also brought in your sacrifices in the morning, your tithes on the third day, transformed into an angel of light, and compressing the threefold understanding of the Scriptures — concerning which we have been commanded to write it threefold in our hearts — into the meaning of a single day. For we ought to understand holy Scripture first according to the letter, doing in ethics whatever is commanded; secondly according to allegory, that is, the spiritual understanding; thirdly according to the blessedness of things to come. But you, he says, despising the first and the second day, compose for yourselves certain spiritual fictions without a foundation, setting a roof on top of walls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
