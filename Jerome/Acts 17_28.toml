[[commentary]]
quote='''
And Paul is found to have done this not only in this passage, but in others as well. For in the Acts of the Apostles, when he was addressing the people and disputing in the Areopagus, which is the senate house of the Athenians, he says among other things: "As certain of your own poets also have said: For we are also his offspring" (Acts 17), a half-line which is read in the Phaenomena of Aratus, whom Cicero translated into the Latin tongue, and Germanicus Caesar, and lately Avienus, and many whom it would take very long to enumerate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
