[[commentary]]
quote='''
And lastly, against the devil: 'God is not before his eyes, he sits in ambush with the rich.' Unhappy the rich, with whom the devil sits. Finally, see what is said of the devil: 'He sits in ambush with the rich.' For whoever is rich, unless he has stripped the poor man, cannot be rich: for this reason he said, 'He sits in ambush with the rich.' Whenever the rich persecute Christians, let us say: 'The devil sits in ambush with the rich.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_004.html'
source_title="Homily 4, on Psalm 9"
