[[commentary]]
quote='''
And the Lord will be to them for God — either the Son and the Father, or certainly the shepherd according to the flesh he assumed. But 'Lord' and 'God' according to: The 'Word' that was in the beginning with 'God' —. This David, when the cattle have advanced to being a rational animal, will no longer be called shepherd but prince in the midst of them — of whom it is written: In the midst of you stands he whom you do not know —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
