[[commentary]]
quote='''
I attended and listened; no one speaks what is good, there is none who does repentance over his sin, saying: What have I done? All have turned to their course, like a horse going with a rush to battle. Called back to repentance, they scorn to listen; nor is it enough for them to have offended against the Lord and to have spoken blasphemy, but all, like horses rushing in hot course to battle, do not reflect on their sin nor say: what have I done? By which we understand that these things are said either of the whole human race, because it is prone to vices, or of the time of the Savior, when all have turned aside, together they have become useless; there was none who did good, there was not even one. Hence he himself also cries out mystically: save me, O Lord, for the holy one has failed! But if these things are so, where are those who say that it lies within our will to be free of all sin? No one, he says, speaks what is good, because we shall render account even for an idle word on the day of judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
