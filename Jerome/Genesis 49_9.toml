[[commentary]]
quote='''
And where he says from the shoot, my son, in the Hebrew it has from captivity, my son, you have gone up, to show that he would lead captive peoples and (according to a more sacred understanding) that he ascended on high and led captivity captive. Or (which I think better) the captivity signifies the passion, the ascent the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
