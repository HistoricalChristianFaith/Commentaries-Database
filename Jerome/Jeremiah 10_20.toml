[[commentary]]
quote='''
My tabernacle is established, all my cords are broken — or all my skins are torn apart —, my sons have gone out from me — or my sheep — and they are not; there is no one to stretch out my tent any more — or there is no more place for my tabernacle — and to raise up my skins. Jerusalem laments the overthrow of her city as so easy that you would think it not the razing of the walls and all the fortifications to the ground, but the taking down of a tabernacle and a tent. 'My tabernacle,' she says, 'that is, my dwelling, has suddenly been taken away. All my cords are broken — she keeps the metaphoran [metaphor] of the tabernacle — or all my skins are torn apart. My sons have gone out from me or my cattle'; this, added by the Seventy, does not stand according to the history; for in a long siege how could sheep and cattle have been carried off from Jerusalem, when, even if there had been any, famine had consumed them? 'And they do not', she says, 'subsist or they are not'; for they were not carried over into Chaldea, but a great part of them was killed and utterly destroyed. 'There is no one to stretch out my tent any more: there is no one to restore me and lay the foundations of my walls, which have been leveled to the ground'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
