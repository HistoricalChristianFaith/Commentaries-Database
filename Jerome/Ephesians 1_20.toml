[[commentary]]
quote='''
And making him sit at his right hand in the heavenly places, above every principality, and power, and virtue, and dominion, and every name that is named not only in this age but also in the age to come.

Through a human likeness he has shown the might of God: not that a throne is set up, and God the Father sits on it and has the Son sitting with him; but because we cannot understand him as judging and reigning otherwise than through our own words. To this belongs also what is written in the hundred and ninth psalm: The Lord said to my Lord: Sit at my right hand, until I make your enemies the footstool of your feet (Ps. 109:1). For if the Son sits at the Father's right hand in the manner of one who reigns, it necessarily follows, according to the same likeness, that he is greater than the one who has sat down on the left side. That we may know this is to be understood otherwise than the letter sounds, the same psalm teaches in what follows, saying: You are a priest for ever according to the order of Melchizedek: the Lord at your right hand. For how, when the Son sits at the right hand of the Father, is the Father in turn said to be at his right hand? Or by what reasoning is the earth the footstool of his feet and heaven his throne, when according to Isaiah he is said both to hold the earth in his fist and to measure heaven with the span of his palm (Isa. 40)? For he cannot be within that which is contained by him, nor hold enclosed in his hand that by which he himself, in the posture of one sitting, would be surrounded. Therefore, just as being near to God or withdrawing far from him is to be taken not according to distances of place but according to merits, in that the saints are near him, while sinners, of whom the prophet says: Behold, those who remove themselves far from you shall perish (Ps. 72:27), are kept away from all nearness to him: so also being at the right hand or at the left hand of God is to be understood: that the saints are at his right hand, but sinners at his left, as the Savior also confirms this very thing in the Gospel, when he relates that the sheep are at the right hand and the goats at the left (Matt. 25). But the very word sit also signifies the power of a kingdom, through which God bestows a benefit on those over whom he deigns to sit: namely, that he rules them, and has them in his chariot, and turns at his own nod necks that before were wandering and free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
