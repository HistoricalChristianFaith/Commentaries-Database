[[commentary]]
quote='''
Your malice shall reprove you — or your transgression shall instruct you — and your turning away shall rebuke you. Know and see that it is an evil and bitter thing that you have forsaken the Lord your God and that the fear of me is not with you, says the Lord God of hosts. It must be noted that malice too, or transgression, after it has glutted the transgressor and, like the quails, has come to the point of nausea, instructs the one who does repentance; and he is commanded to see what he has forsaken, what he has followed, and how, spurning good and sweet things, he has chosen evil and bitter ones. And all this happened because he forsook the Lord his God, and the fear of him is not with him. For the beginning of wisdom is the fear of the Lord; and because he did not have it, he is handed over to evil and bitterness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
