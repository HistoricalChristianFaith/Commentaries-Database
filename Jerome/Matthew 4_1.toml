[[commentary]]
quote='''
Then he was led in the desert by the Spirit. No doubt, by the Holy Spirit. For there follows:

To be tempted by the devil. But he is led not unwillingly, nor as a captive, but by the will to fight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Diabolus [devil]: flowing down. But in Greek it means accuser.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On the Gospel of Matthew"
