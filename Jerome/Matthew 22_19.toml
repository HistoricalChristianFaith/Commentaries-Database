[[commentary]]
quote='''
Wisdom does ever wisely, and so the tempters are best confuted out of their own words; therefore it follows, show me the tribute money; and they brought unto Him a denarius. This was a coin reckoned equivalent to ten sesterces, and bore the image of Cæsar.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Show me the coin of the tax. And they brought him a denarius. Wisdom always acts wisely, so that tempters are refuted above all by their own words. Show me, he says, the denarius. This is the kind of coin that was reckoned at ten coins and bore the image of Caesar.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
