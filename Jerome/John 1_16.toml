[[commentary]]
quote='''
And what he says: He shall make equal the grace of its grace, signifies this: Of his fullness we have all received, and grace for grace, that is, for the grace of the law, the grace of the Gospel, so that both those who believe from Israel and the people of the heathen may receive an equal grace and a like gift.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
