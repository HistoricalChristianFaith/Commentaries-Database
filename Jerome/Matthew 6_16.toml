[[commentary]]
quote='''
The word exterminare, so often used in the ecclesiastical Scriptures through a blunder of the translators, has a quite different meaning from that in which it is commonly understood. It is properly said of exiles who are sent beyond the boundary of their country. Instead of this word, it would seem better to use the word demoliri, 'to destroy,' in translating the Greek ἀφανίζειν. The hypocrite destroys his face, in order that he may feign sorrow, and with a heart full of joy wears sorrow in his countenance.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For they exterminate their faces, that they may appear to men as fasting. The word exterminate, which has become worn in the Church's Scriptures through the fault of translators, means something far different from what is commonly understood. For it is exiles, who are sent outside the boundaries, that are exterminated. In place of this word, then, we must always understand demolish. And the hypocrite demolishes his face so as to feign sadness and, while his mind is perhaps rejoicing, to wear mourning on his countenance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
