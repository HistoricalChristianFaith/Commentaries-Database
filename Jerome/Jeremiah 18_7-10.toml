[[commentary]]
quote='''
And though they promise themselves prosperity, they will afterwards endure evils; while, on the other side, the saints fear and do not sin, and therefore by no means die by the sword, because they said: Evils will draw near to us, and the punishments which our sins have deserved will come upon us; of which God speaks more fully in Jeremiah: I will take it up and speak against a nation and a kingdom, to take it away and destroy it; if that nation turns from its evils, I too will repent of the things that I had thought to do to it. God, therefore, is not changed, who is always immutable; but we change him by our conversion. He rages, he is angry, he threatens, and says that he will inflict punishments: If we repent, he too will repent of his sentence. Again, according to the same Jeremiah, he promises prosperity: If we grow slack through negligence, he too will repent of his pledge, and will change what he promised. Of this we can have an example in the Ninevites and in Jerusalem, of whom the one were set free from the punishments that hung over them, the other lost what had been promised to their fathers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
And to signify free will, he says that he announces both evils to this or that nation and kingdom and, again, good things; and yet that what he himself has foretold does not come about, but that the contrary happens, so that good things befall the evil, if they repent, and evils befall the good, if after the promises they have turned to sins. And we say this not because God does not know that this or that nation or kingdom will do this or that, but because he leaves man to his own will, so that he may receive either rewards or punishments by his own desert. Nor will what befalls be wholly man's at once, but belongs to the grace of him who has bestowed all things; for the freedom of the will must be preserved in such a way that the grace of the giver excels in all things, according to that prophetic word: Unless the Lord builds the house, those who build it have labored in vain; unless the Lord guards the city, he who guards it has watched in vain. For it is not of him who wills, nor of him who runs, but of God who shows mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
