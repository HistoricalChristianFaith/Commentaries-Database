[[commentary]]
quote='''
Do not possess gold or silver or money in your belts, no bag for the road, not two tunics, no shoes, nor a staff in the hand; for the laborer is worthy of his food. Consistently he gave these commands to the preachers of the truth, to whom he had said before: Freely you have received, freely give. For if they preach in such a way that they accept no price, the possession of gold and silver and coins is superfluous. For if they had had gold and silver, they would have seemed to preach not for the sake of men's salvation but for the sake of gain. Nor bronze in purses. He who had cut off riches cuts away almost even the necessities of life, so that the apostles, teachers of the true religion, who taught that all things are governed by providence, might show that they themselves took no thought for the morrow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
No bag for the road. By this precept he refutes the philosophers who are commonly called bactroperites, because, though despisers of the world who count all things as nothing, they carried their storeroom about with them. Nor two tunics. By the two tunics he seems to me to indicate a double garment; not that in the regions of Scythia, stiff with glacial snow, anyone ought to be content with a single tunic, but that by the tunic we should understand clothing, lest, being clothed in one, we keep another for ourselves out of fear of what is to come. Nor of shoes. Plato too prescribes that the two extremities of the body should not be covered, and that one ought not to grow used to softness of the head and the feet; for when these have firmness, the rest are sturdier. Nor a staff. We who have the help of the Lord, why should we seek the protection of a stick? And because he had sent the apostles to preach as it were naked and unencumbered, and the condition of the teachers seemed to be hard, he tempered the severity of the precept with the sentence that follows, saying: The laborer is worthy of his food. Take only so much, he says, as is necessary for you in food and clothing. Hence the Apostle too repeats: Having food and clothing, with these we are content, and in another place: Let him who is catechized share with him who catechizes him in every good thing, so that disciples may make those whose spiritual things they reap sharers in their own carnal things, not for avarice but for necessity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
These things we have said according to history. But according to anagogy, teachers are not permitted to possess the gold and silver and money that is in the belts. We often read gold for the understanding, silver for speech, bronze for the voice. These we may not receive from others, but must possess them as given by the Lord. Nor may we take up the disciplines of heretics and philosophers and of perverse doctrine, nor be weighed down by the weight of the world, nor be double-minded, nor have our feet bound with deadly bonds, but, entering the holy ground, we must go barefoot, and not have a staff that is turned into a serpent, nor lean on any protection of the flesh, because a staff and stick of this kind is of reed, which, if you press on it a little, breaks and pierces the hand of the one leaning on it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
