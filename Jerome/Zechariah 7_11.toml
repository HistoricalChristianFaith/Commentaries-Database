[[commentary]]
quote='''
Though I had commanded these things, they would not attend, and turned a withdrawing shoulder, or a scornful back, rejecting my commands by the bearing of their body. For when, with wrinkled brow and contracted nostril, we scorn those who admonish us, we are accustomed to turn our back; according to what is written: They turned their backs to me, and not their faces. And they made their ears heavy, he says, lest they hear, like the ears of the deaf asp that stops its ears, which will not hear the voice of the charmers, and of the sorcerer who charms wisely. For they made their ears heavy so as not to hear, and they set their heart so as not to yield to the law of God. Hence Isaiah speaks to them threateningly: The heart of this people has grown fat, and with their ears they have heard heavily, and they have closed their eyes, lest perhaps they should see with their eyes, and hear with their ears, and understand with their heart, and be converted, and I should heal them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
