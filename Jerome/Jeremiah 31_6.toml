[[commentary]]
quote='''
Then was the day of the Lord, on which the watchmen — namely the apostles and apostolic men — cried on mount 'Samaria' and on mount 'Ephraim', of which the one sounds 'guard', the other 'fruitfulness'; but what do the watchmen of Samaria say, nay rather, what do they cry on Mount Ephraim? 'Arise, you who lie down, leave lowly things, spurn the offerings of victims' — a sacrifice to the Lord is a troubled spirit —, 'let us go up into Zion, that is, into the Church, where there is 'contemplation' and the beholding of God; and when we are in Zion, nay rather have gone up to it, we shall go up likewise to the Lord our God'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
