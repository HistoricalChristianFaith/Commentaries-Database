[[commentary]]
quote='''
These riches of his goodness were hidden through all the past ages in God, who is the Creator of all. Where are Marcion and Valentinus, and all the heretics, who assert one Creator of the world, that is, of the things visible, and another of the things invisible? They call the one just, the other some unknown being, ever unknown, only good, who is the Father of Christ. Behold, God, in whom the mystery of Christ was hidden through all the past ages, is proclaimed the Creator of all. From this it is shown that the God of the New and of the Old Testament is the same. The mystery hidden from the ages can, however, also be understood otherwise: that the ages themselves were ignorant of it, that is, all the spiritual and rational creatures that were in the ages. For "age" is frequently taken for those things that dwell in the age. As Paul speaks to the Galatians, saying: That he might deliver us from the present evil age (Gal. 1:4). And in another place: That he might show in the ages to come (Eph. 2:7), in place of: to all those who were to be in the ages coming after.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
