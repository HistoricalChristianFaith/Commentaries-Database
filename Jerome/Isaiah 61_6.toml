[[commentary]]
quote='''
But you will be called the priests of the Lord; it will be said to you, ministers of our God. You will eat the strength of the nations, and you will pride yourselves in their glory. Instead of your double confusion and shame they will praise their portion; therefore in their land they will possess double things; everlasting gladness will be theirs; for I am the Lord who loves judgment, and hates robbery in burnt offering. LXX: But you will be called the priests of the Lord, ministers of our God. You will eat the strength of the nations, and in their riches you will be admirable. Thus they will possess the land a second time, and everlasting joy will be upon their head. For I am the Lord who love righteousness and hate robberies from iniquity. The builders of the deserted cities and the shepherds of the flocks, who are themselves the ploughmen and vinedressers, that is, the sons of foreigners, are themselves also the priests of God, to whom the Prophet now says: But you will be called the priests of the Lord, and it will be said to you, ministers of our God: there is no doubt that he means the princes of the churches. Or certainly it is to be understood of the Apostles, so that the order is: When masons, shepherds, ploughmen and vinedressers from the nations have been set over the churches, you, of whom it was said, A remnant will be saved (Rom 9:27), and, Unless the Lord Sabaoth had left us a seed, we should have been as Sodom, and should have been like Gomorrah (Isa 1:9), will be called priests and ministers of God, such as the sons of David also were, of whom Scripture says: And the sons of David were priests of God (2 Sam 8:18). These will eat the strength of the nations, and in their riches they will be admirable. For the crown of fathers is the glory of their children, and the progress of the people is the feast of the priests (Prov 17). Of riches of this kind Paul wrote to the Corinthians: I give thanks to my God through Jesus Christ that in everything you have been made rich in him, in all speech and in all knowledge, even as the testimony of Christ has been confirmed in you, so that you lack nothing in any grace (1 Cor 1:4ff.). The strength of the nations is the triumph of the Martyrs, and we are proud in their glory, not with that pride which lies in vice, which God resists, that he may give grace to the humble, but with that which is taken for power and glory (Jas 4). Hence Moses too had a horned face (Exod 34), who could say: In you we shall toss our enemies with the horn (Ps 43 [44]:6). And for the pride of glory Aquila translated καὶ ἐν δόξῃ αὐτῶν πορφύρᾳ ἐνδύσεσθαι, that is, you will be clothed in purple, to show the badge of royal splendor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
