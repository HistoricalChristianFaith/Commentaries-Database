[[commentary]]
quote='''
What we have understood of Jerusalem, let us understand of the state of souls, which were created pure by God and received gold in understanding and wisdom, and silver in speech and eloquence, so that what they have conceived in the mind they may unfold in words. Of silver we read: The utterances of the Lord are chaste utterances, silver tried by fire, proved for the earth, purged sevenfold. Of gold and silver alike Psalm 67 (68) speaks, in which it is written: If you sleep in the midst of the lots, the wings of a dove covered with silver, and the hinder parts (or the inner parts) of her back in the greenness (or paleness) of gold. All indeed the glory of the king's daughter is within, she who speaks in the Song of Songs: The king has brought me into his chamber. Whoever has slept and rested between the two testaments at once takes up the silvered wings of the dove, and will shine with the brightness of gold in the treasury of the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
