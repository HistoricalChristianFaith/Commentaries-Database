[[commentary]]
quote='''
And do not, he says, cast out loads from your houses — for they are not to be carried, but utterly cast away — and do no work — either servile work or that of which it is written: food for the belly and the belly for foods; but God will destroy both it and them —, but that work is to be worked of which the Savior speaks: 'work the work that does not perish!' Sanctify, he says, the sabbath day, so that we may spend all the time of our life in sanctification, as our fathers Abraham, Isaac and Jacob did.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
