[[commentary]]
quote='''
But the Lord our God is the true God — all those, therefore, are lies — and he himself is the living God — so those which are fashioned are dead — and the everlasting king — the shadows of the heretics prevail for a time, but in the long run they decay —; at his indignation the earth will be shaken — those who have earthly works and fashion earthly images — and the nations will not endure: by no means the people of the Lord, but the multitude of the nations, which cannot bear God's threatening.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
