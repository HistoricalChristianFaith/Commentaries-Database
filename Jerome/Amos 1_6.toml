[[commentary]]
quote='''
Thus says the Lord: For three crimes of Gaza, and for four, I will not turn him back, because he carried away a complete captivity, to shut it up in Idumea. And I will send fire into the wall of Gaza, and it will devour its houses; and I will destroy the inhabitant from Azotus, and him who holds the sceptre from Ashkelon, and I will turn my hand upon Ekron, and the remnant of the Philistines will perish, says the Lord. LXX: Thus says the Lord: For three impieties of Gaza, and for four, I will not turn away from them, because they led captive the captivity of Solomon, to shut it up in Idumea; and I will send forth fire upon the walls of Gaza, and it will devour its foundations, and I will destroy the inhabitants of Azotus, and the tribe will be taken away from Ashkelon, and I will bring my hand upon Ekron, and the remnant of the foreigners will perish, says the Lord. The Lord threatens in the law that he will requite the sins of the fathers upon the children to the third and fourth generation; not by an equality of judgment, so that some sin and others are punished, but by the greatness of his clemency, since he always awaits repentance; and what is committed in the first generation he does not rebuke and correct until the third and fourth generation has come. Something of this kind the apostle Paul also says to the Romans: Or do you despise the riches of his goodness and forbearance and patience, not knowing that the kindness of God leads you to repentance? But according to your hardness and impenitent heart you are storing up wrath for yourself on the day of wrath and of the revelation of the just judgment of God, who will render to each one according to his works. What he says, then, is this: I waited a long time for them to repent, and for that reason I was unwilling to punish them when they sinned, so that at some time they might turn and receive healing. But because they do the same things a third and a fourth time, I am compelled to change my sentence and to correct the offenders with blows. Let us see, however, what the Philistines and their cities sinned, whom the Seventy always translated foreigners; for wherever in the Old Testament we read ἀλλοφύλους, that is, foreigners, we must take it not as a common name for all foreign nations, but properly as the Philistines, who are now called the people of Palestine. What did Gaza do to provoke the Lord to anger and vengeance? It carried away the complete captivity of the people of the Jews, and shut it up in Idumea, so as to sell to the Idumeans those whom it had taken from the Jews. For complete captivity the Seventy translated the captivity of Solomon, taking the Hebrew word salma, which means perfect and complete, for the name of Solomon. Accordingly Aquila translated ἀπηρτισμένην and ἀναπεπληρωμένην, Symmachus and Theodotion τελείαν, which signifies not Solomon but perfect and complete, so that none of the captives remained who was not handed over to the Idumeans.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
