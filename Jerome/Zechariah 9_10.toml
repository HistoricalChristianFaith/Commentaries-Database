[[commentary]]
quote='''
And I will destroy, he says, the chariot from Ephraim. It is still spoken in the person of God the Father, that the four-horse chariot, or the chariot, should perish from Ephraim, and the horse from Jerusalem. And meanwhile according to the letter he says this: There shall be no battles, all things having been set at peace by the coming and birth of Christ. Moreover, according to a higher understanding, Ephraim, which is interpreted καρποφορία, that is, fruitfulness and abundance of crops, is referred to the multitude of heresies; of which it is written in Psalm 77 (78): The sons of Ephraim, bending and shooting the bow, turned back in the day of battle. Of these chariots and cars we read: Some in chariots and some on horses, but we will call upon the name of the Lord our God; they are bound and have fallen, but we have risen and are set upright. The horse that is destroyed from Jerusalem is the one of which we read: A horse is a deceitful thing for safety. And in Jeremiah those who gave themselves up to luxury and lust hear: They have become to me horses mad after females; each one neighed after his neighbor's wife. Hence they are called back to repentance, as the psalmist says: Do not become like the horse and the mule, in which there is no understanding. And when God has destroyed the chariots from Ephraim and the horse from Jerusalem, those who have been set free from such horses and chariots shall be transferred into the service of the Lord, and shall become Cherubim, and of them it shall be said: The chariot of God is ten thousandfold, thousands of those who rejoice, and: To my cavalry among the chariots of Pharaoh I have likened you, my nearest one, and: You shall mount your horses, and your riding is salvation. The bow of war shall be scattered, so that the fiery darts may not be shot that could strike the hearts of the pleasure-loving. And he shall speak peace to the nations, of which it is written: He shall be the expectation of the nations, and again: In him the nations shall hope, and: His power from sea to sea, and from the rivers to the ends of the world. This is not to be weakened by allegory, but to be believed as truly fulfilled, according to what we read: Ask of me, and I will give you the nations for your inheritance, and the ends of the earth for your possession. In Psalm 71 (72) also it is said, under the person of Solomon and of the true peaceful one: And he shall rule from sea to sea, and from the river to the ends of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
