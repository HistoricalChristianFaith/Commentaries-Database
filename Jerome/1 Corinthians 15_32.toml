[[commentary]]
quote='''
For their salvation Paul fought with so much sweat that he wrote to the Corinthians: If according to man I fought with beasts at Ephesus, what does it profit me, if the dead do not rise (1 Cor. 15:32)? What are these beasts? Those, surely, of which the Psalmist prays, saying: Do not hand over to the beasts the soul that confesses to you (Ps. 73:19). And in another place: Rebuke the wild beasts of the reed (Ps. 67:31). For our adversary the devil goes about like a roaring lion (1 Pet. 5:8). When he saw the chief city of Asia being snatched from his jaws at the teaching of Paul, he gathered all the troops of his henchmen and strove to crush him, and, insolently exalting himself, he wished like an eagle to set his nest above him (Isa. 14, Prov. 4). The Apostle perceived this, and keeping his heart with all watchfulness (since indeed he was not ignorant of his wiles), he spoke after the victory, it is true, but after a victory not bloodless: For we do not wish you to be ignorant, brothers, of our tribulation which came upon us in Asia: that we were weighed down beyond measure, beyond our strength, so that we were weary even of living (2 Cor. 1:8).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
