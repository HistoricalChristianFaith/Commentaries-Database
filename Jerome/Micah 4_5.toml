[[commentary]]
quote='''
All peoples shall go, each in his own way, but we will walk in the name of the Lord our God unto the age and beyond. While all the nations, they say, go according to their own error, we have hastened to the mountain of the Lord, and have said: Come, let us go up into the mountain of the Lord, and into the house of the God of Jacob and we will walk in the name of Christ our Lord, for he himself is the mountain who is God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
