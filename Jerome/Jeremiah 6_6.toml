[[commentary]]
quote='''
For thus says the Lord of hosts: Cut down her tree — or her trees —, pour out — or heap up — a mound around Jerusalem! 'Therefore', they say, 'we are secure of victory, because it is the command of the Lord, who orders the Chaldeans: cut down the trees and heap up a mound for the siegeworks to come!' By these words it is shown, before it comes to pass, that the city was not to be taken at once by an encircling ring of troops, but by a long siege, as we read afterwards.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
This is the city of visitation — or the lying city —, all false accusation — or oppression — is in her midst. As a cistern makes cold — or a pit — its water, so she has made her wickedness cold. The Lord commands that the trees be cut down, that mounds be cast up round about, because the time of her visitation has come, that she may receive the due for her sins, the greatest of which is sykophantia, that she oppresses the innocent by false accusation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
