[[commentary]]
quote='''
Since, then, no one can be justified in the presence of the Lord, all shall grow old like a garment (Ps 101 [102]). And what grows old is near to perishing. And like a moth, he says, it shall eat them: namely the conscience of sins, and jealousy over the nations that have been saved. Of this it is said at the end of this volume: Their worm shall not die. And in Micah, against the perverse princes: I will take away their goods like a moth that eats them up, and walks upon the rule in the day of watching (Mic 7:4 LXX). And in Proverbs: An understanding heart is a moth of the bones (Prov 14:30 LXX). For moth in the present place Symmachus translated rust, Aquila worm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
