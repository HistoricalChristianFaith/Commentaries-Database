[[commentary]]
quote='''
A Psalm of David, when his land was established. We read in the books of Kingdoms and of Chronicles that David was a warlike man, that he subjected all the surrounding nations, and reduced them under his own power. This for the moment according to the letter, so that we understand it in this way: A Psalm of David which he sang to the Lord, when, his adversaries having been conquered, he restored peace to his land, that is, to Judaea. This according to the history. But if David is interpreted as "strong in hand," and no one is strong in hand except him who conquered all nations, our David, to whom the demons cried out, "Why have you come to torment us before the time, Son of David?" — then this psalm was composed by him, when his land was established. And the holy presbyter said excellently, that this land which is established is our bodies. For truly at that time ought we to sing to God, when our land has been set in order. But let us also speak of it in another way; for it does no harm, if we understand the same thing in two or three ways. For it is written in Solomon: "You shall take these things," he says, "upon the tablet of your heart threefold." It does no harm to say something different, when it is said with one spirit. When his land was established. This land, before our David conquered all, did not have peace, but everywhere there was discord. One nation worshipped Jupiter, another Mercury, another Juno, and all the nations had different idols. The standard of the cross was raised up, and all the land was established.

The Lord has reigned, let the earth exult. Let the whole earth, and all the world, which had before been subjected to demons and idols, rejoice now that the Lord reigns. The Lord has reigned. The Lord the Creator who made you, he himself has reigned. O you who before were subjected under the lord the devil, now you are subjected under the Lord the Creator. Let the many islands be glad — the holy presbyter spoke well of our souls, which are battered this way and that by various thoughts as if by various waves. But let us also call the churches islands. And indeed it is said in another place too: "Many islands shall be converted to me." Do you wish to know that the churches are called islands? It is said in the prophet in the person of the Lord: "Speak," he says, "to the inhabitants of this island." Let the many islands be glad. For just as islands are set in the midst of the sea, so also the churches are set as it were in the midst of the sea of this world, and thus they are battered by persecutions as if by diverse waves. But these islands are battered daily, yet they are not overthrown. They are indeed in the sea, but they have Christ for their foundation, who cannot be moved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_024.html'
source_title="Homily 24, on Psalm 96"

[[commentary]]
quote='''
The Lord has reigned, let the peoples be angry. Three psalms have the same beginning: the ninety-second, the ninety-sixth, and the ninety-eighth. But although they have the same beginning in the opening verse, at the end they are different. For how does it read in the ninety-second? 'The Lord has reigned, he has clothed himself in beauty.' But in the ninety-sixth: 'The Lord has reigned, let the earth rejoice'; and in the ninety-eighth: 'The Lord has reigned, let the peoples be angry.' The sequence seems as it were to be contrary to itself. For it ought first to have said 'The Lord has reigned, let the peoples be angry,' and afterwards to say 'The Lord has reigned, let the earth rejoice,' and last of all 'The Lord has reigned, he has clothed himself in beauty.' But the different order gives us some hint toward understanding. 'The Lord has reigned, he has clothed himself in beauty.' The Lord has reigned, and he has clothed himself with the patriarchs and the prophets and the believing people. He has clothed himself in beauty: the patriarchs and the prophets were as it were the garment of Christ. That is the loincloth which is written of in Jeremiah: that is the loincloth which Jeremiah had about his loins. Do you wish to know that the saints are, as it were, a loincloth, the garment of God? Afterwards God himself speaks to Jeremiah: 'Just as you,' he says, 'placed that loincloth about your loins, so I too have joined my people to myself.' As, then, a garment is about a man, so the people is about God. But because this loincloth, because this beauty with which the Lord had been clothed, was exposed across the Euphrates in a cleft of the rock, and there rotted away, and was led off into captivity by the Assyrians—what does the Lord do? He is not naked, he cannot be without a loincloth, he cannot be without a garment: the former people having been lost, he makes himself a garment out of the people of the Gentiles. And what is said? The Lord has reigned, let the earth rejoice. Let the earth rejoice, the whole earth, that is, the entire people of believers. Then, do you wish to know that the second loincloth is spoken of concerning the people of the Gentiles? The Lord, he says, has reigned, let the earth rejoice: let the many islands be glad. Not one island, Judaea, but many islands, that is, the whole world. Let someone say to me: Give me an example from the Scriptures where Judaea alone is called one island. Everything we say we ought to affirm from the holy Scriptures. 'For in the mouth of two or three witnesses shall every word stand.' The word of the one speaking does not have as much authority as the Lord's command. We read in the prophet Ezekiel: 'And you,' he says, 'son of man, speak to the inhabitants of this island'—that is, of Judaea. Since, therefore, one island has been forsaken, now it is said: Let the many islands be glad. Therefore concerning the loincloth it is said of the former people: The Lord has reigned, he has clothed himself in beauty. Of the second people, gathered from the Gentiles: The Lord has reigned, let the earth rejoice, let the many islands be glad. Now in the third it is said: The Lord has reigned, let the peoples be angry. Whether they be of the Jews, or of the Gentiles, whoever do not believe, let them be angry. 'Why have the nations raged, and the peoples devised vain things?'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_026.html'
source_title="Homily 26, on Psalm 98"

[[commentary]]
quote='''
The title of the psalm is prescribed thus: "When his land was restored." When it says "was restored," it is shown that it existed before, and afterward did not exist, and again was established. What then is this land of David which was restored? David's land is holy Mary, the mother of the Savior. "Who was made to him of the seed of David according to the flesh." What was promised to David was fulfilled in Mary's virginity and childbearing, where a virgin is begotten of a virgin. And thus was accomplished what is said in the Gospel, "The Word was made flesh, and dwelt among us": so that what had been promised to David might be restored to us through holy Mary.

"The Lord has reigned, let the earth rejoice." Let the earth rejoice: let it have one king, which before was held by many. "Let the many islands be glad." It is said in a certain prophet: "Speak to the inhabitants of this island," that is, to the inhabitants of Jerusalem. You see, then, that Jerusalem is called an island. Before David's land was restored, therefore, only the one island of Judea rejoiced; but now, David's land having been restored, it is said, "Let the many islands be glad." By the many islands we can mean the various provinces or cities of the believing peoples, or we shall interpret them as the various churches. For just as islands are beaten this way and that by the waves of the sea, so also the churches are indeed beaten by the various storms of temptations, but are not overturned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_073.html'
source_title="Homily 73, on Psalm 96 (Alternate Series)"
