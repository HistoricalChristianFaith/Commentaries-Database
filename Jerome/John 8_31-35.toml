[[commentary]]
quote='''
The Lord speaks to the Jews, who still preferred to be sons of the bondwoman: "If you remain in my word, you will truly be my disciples, and you will know the truth, and the truth will make you free" (John 8:31, 32). Hence they too, not knowing that what was said was mystical, say: "We are the seed of Abraham, and we have never been slaves to anyone: how do you say, You will be free? Jesus answered them: Amen, amen I say to you, that everyone who commits sin is the slave of sin. But the slave does not remain in the house forever; but the son remains forever". If we are slaves of sin, Hagar the Egyptian has begotten us; if sin does not reign in our mortal body, we are truly sons of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
