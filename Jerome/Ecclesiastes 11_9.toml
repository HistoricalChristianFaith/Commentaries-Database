[[commentary]]
quote='''
But we, returning to the order of our earlier discussion, will try to explain each point: Rejoice, young man, in your youth, and let your heart be in good in the days of your youth, and walk in the ways of your heart and in the sight of your eyes. And know that over all these things God will bring you into judgment. He had said that the light of this world is most sweet, and that a man ought to rejoice in the days of his life and pluck pleasure with all eagerness. For the eternal night of death is coming on, when one may not enjoy what has been gathered, and all that we have had passes away like a shadow. Now, therefore, he exhorts man and says: O young man, before old age and death come upon you, rejoice in your youth, and whatever seems good to you in heart and pleasant in sight, take it; enjoy the things of the world as you please. Again, lest he should be thought by saying this to provoke man to luxury and to fall into the doctrine of Epicurus, he removed this suspicion by adding: And know that over all these things God will bring you into judgment. Use the things of the world to the full, he says, in such a way that you know you are to be judged at the last.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
