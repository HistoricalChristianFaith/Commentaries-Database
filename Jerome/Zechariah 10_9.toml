[[commentary]]
quote='''
In short, there follows: I will sow them among the peoples, and from afar they shall remember me. They who heard the word of the Lord were sown among the peoples: Go, teach all nations, and in another place: You have not chosen me, but I have chosen you, and I have appointed you that you should go and bear fruit, and your fruit should remain forever. And when the apostles have been sown among the peoples, the nations and peoples set far off shall remember me, that prophetic word agreeing with this saying: All the ends of the earth shall remember and shall turn to the Lord. And all the families of the nations shall worship in his sight. For the kingdom is the Lord's, and he shall rule over the nations. And what is said: From afar they shall remember me, is like this: You who are far off, remember the Lord, and let Jerusalem come up upon your heart. The whole multitude of the nations was far off, but it remembered God, because we are all begotten of one parent. And when, the apostles having been sown among all the nations, the nations set far off have remembered God, they shall live with their sons, so that those who before were dead through unbelief may begin to live by faith. These are the sons whom Paul nourished in the gospel, writing to the Corinthians: I gave you milk to drink. And Peter writes to the faithful in the dispersion, who had been reborn: Not of corruptible seed, but of incorruptible, through the word of the living and abiding God, like newborn little children, that they might long for the rational milk and grow by it to salvation. To these sons John the evangelist too was writing: Little sons, keep yourselves from idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
