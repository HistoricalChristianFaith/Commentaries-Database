[[commentary]]
quote='''
To this sense also belongs what follows: I have seen slaves upon horses and princes walking like slaves upon the earth: that those who are slaves of vices and of sin, or so lowly that they are reckoned slaves by men, puffed up by the devil with sudden dignity, wear down the public roads with their ponies; and every noble or prudent man, weighed down by poverty, goes on foot, in the manner and office of slaves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
