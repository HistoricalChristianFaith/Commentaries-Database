[[commentary]]
quote='''
Wherefore I too have given you numbness of teeth, as the LXX translated, whom we have followed in this place because of the simplicity of the word, or cleanness of teeth, as Aquila and Symmachus translated, so as to show by clean teeth the greatness of the famine. And I caused want of bread, not in one city, but in all your cities, nor in one place, but in all your places. And though I have done this, not punishing, but granting an occasion for repentance, not even so have you returned to me, says the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
Hence the Lord threatens vengeance upon them: I will give, he says, you numbness of teeth, which in Greek is called γομφιασμός. For if anyone, according to Ezekiel, eats a sour grape, his teeth will be numbed; so that those who make ill use of the testimonies of the holy Scriptures, and eat them unripe and without their sweetness, lose the strength of their teeth, so that they cannot grind hard food and pass into the belly what would profit the whole body. This numbness of teeth and want of food I will give both in all your cities and in all your places, so that you may suffer a famine of the word of God, and of that bread which came down from heaven, and of which it is written in the psalms: Man ate the bread of angels. All of which I did, not out of cruelty and savagery, as the heretics slanderously claim, the ferocity of a stern judge, but that you might be converted to me, according to that which is written: In vain have I struck your sons; you have not received discipline.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
