[[commentary]]
quote='''
But since we have once begun to expound tropologically as well: The Lord will visit, at the coming and passion of the Savior, that is, on the day of the victim of his Son, upon the high priests and priests of the Jewish people and upon the royal house. For up to that time the kings of Judah from the stock of David continued, according to the prophecy of Jacob: A prince shall not fail from Judah, nor a leader from his thighs, until he comes for whom it is laid up, and he will be the expectation of the nations. For after the Lord's victim the kingdom was taken from the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"

[[commentary]]
quote='''
Of this king Jacob too speaks in the blessing of the patriarch Judah: A prince shall not fail from Judah, nor a leader from his thighs, until he comes for whom it is laid up; and he will be the expectation of the nations. Therefore, after the prince failed from Judah, and the leader from his thighs, and Herod, a foreigner and a proselyte, took the rule, we understand that he has come for whom the kingdom was laid up, and he will be the expectation of the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
