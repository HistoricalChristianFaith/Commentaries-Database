[[commentary]]
quote='''
Be in pain and toil, daughter of Zion, like a woman in labor, for now you shall go forth from the city, and dwell in the country, and come even to Babylon; there you shall be delivered, there the Lord will redeem you from the hand of your enemies. LXX: Be in pain, and act manfully, daughter of Zion, like a woman giving birth, for now you shall go forth from the city, and dwell in the plain, and come even to Babylon; from there he will deliver you, and from there the Lord your God will redeem you from the hand of your enemies. She who is commanded to be in pain, or to be in labor, and to whom is then added, act manfully, is not commanded in vain; but it is so that, bearing her pains patiently, she may go forth from the city, and dwell in the plain or in the country, and come even to Babylon, and when, enduring captivity for her sin, she has bravely borne what was inflicted, then the Lord may deliver her, and her God redeem her from the hand of her enemies, so that, after she has been delivered, she may say to those who mock her: Do not mock me, my enemy, for I have fallen and I shall rise again; for even if I walk in darkness, the Lord is my light. I will bear the wrath of the Lord, because I have sinned against him, until he justifies my cause, and executes my judgment, and brings me out into the light, and I shall see his justice. And my enemy shall behold it, and shall be covered with shame. Hence in the psalms too it is sung with a fitting voice: Not forever will he be angry, nor to eternity will the Lord threaten. And that Be in pain, and act manfully pertains to the salvation of the one who is in pain and acts manfully, Joshua son of Nun too is witness, to whom the Lord says: Be strengthened, and act manfully. And the daughter of Zion is in pain and acts manfully, because she went forth from the city unshod and naked, and is to be led captive into the plain of Shinar, and to be in Babylon until Zerubbabel comes, and Ezra, which means helper, and delivers her from the hand of the Chaldeans. Since this is plain according to the letter, it seems to me to mean that the soul, driven out of the Church for sin, and handed over to the enemy and avenger for the destruction of the flesh, that the spirit may be saved, goes forth from the city which the rush of the river makes glad, and dwells not on the mountain, where it had been before, but in the plain, in which the army of the Assyrians roams, and is in the confusion of its own vices; and that, after it has worn fetters, and dragged the mill, and made flour for the Babylonians, returning to itself it says: How many hired servants of my father have their fill of bread, and I perish here with hunger. And that afterwards, returning to the father's house, it is received by a most merciful father, and redeemed from the hand of a most harsh master. Let us give an example, so that what is commanded to the daughter of Zion, when it is said: Be in pain, and act manfully, like a woman giving birth, we may refer not to her punishment but to her benefit. Paul says to the Galatians: My little children, with whom I am in labor again, until Christ be formed in you. And he was in pain so long, and in labor so long, until he begot again through repentance those who had perished through sin. Suppose a physician says to a man in a fever, or to a wounded man: Be in pain and act manfully, endure thirst, bear the cautery, so that a surer health may follow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
