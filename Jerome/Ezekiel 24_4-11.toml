[[commentary]]
quote='''
It is said also in Jeremiah: "What do you see, Jeremiah?" "A boiling pot," he says. See, then, that into this pot flesh is cast. This is written in Ezekiel. "And I cast," he says, "flesh into the pot": that it may become soft, and the hard may be converted to the Lord, and from a heart of stone may become a heart of flesh, so that where before it could not be written upon because of hardness, afterward it may be written upon because of softness. "I will kindle," he says, "this pot, and I will boil down the flesh and the bones, until they lose all moisture and filth." And see what is said afterward. "And let them learn," he says, "that I am the Lord." Great mercy, great sacrament. The flesh is cast into the pot, that it may be boiled down and may learn that he is the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_034.html'
source_title="Homily 34, on Psalm 107"
