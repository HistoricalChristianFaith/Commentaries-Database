[[commentary]]
quote='''
This is the blindness which has happened in part to Israel, so that the fullness of the Gentiles might come in, and then all Israel would be saved; and after a long time they will return and will seek the Lord their God, and David their king, who was born of the stock of David, and whose name is interpreted strong of hand. For he himself released the captivity of his people, and gave release to those in bonds. And when the sons of Israel see him, who was denied by his own brothers, reigning in the majesty of the Father and in his own, they will tremble and be astonished before the Lord and before his Good One, he who, a good son, was born of a good father; or to the good things of the Lord, of which the saint speaks: I believe I shall see the good things of the Lord in the land of the living; for this land which we sinners inhabit is the land of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
