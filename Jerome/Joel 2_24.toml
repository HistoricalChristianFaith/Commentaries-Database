[[commentary]]
quote='''
And not only, he says, has he given this, but he has made you abound in new crops of virtues, and be filled and inebriated with grain, wine and oil of which we have often spoken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
