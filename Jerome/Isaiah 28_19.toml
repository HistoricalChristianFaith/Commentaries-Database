[[commentary]]
quote='''
For it will always rush upon you, and in prosperity as in adversity you will feel the wrath of the Lord, and cruel death will lay you waste. What shall I say of the punishments? The mere dread of punishments and the fear of torments will correct you unto salvation, and will make you understand your evils. And when you have been vexed, then you will know that my prophets spoke the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
