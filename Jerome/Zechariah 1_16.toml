[[commentary]]
quote='''
Because, therefore, he says, I am jealous for Jerusalem and Zion with a great jealousy, which the adversaries have pressed down more than I wished, therefore thus says the Lord: I will return to Jerusalem not in one mercy but in many mercies, and my house, that is, the temple, shall be built in it under Zerubbabel and Joshua son of Jehozadak; and the plumb line of the masons shall be stretched out over Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
Hence the Lord, promising peace and mercy, says that he will build her again, and that the plumb line, or the cord, is to be stretched out in her according to the measures and ranks of each one. What the cord is, is shown in the following passage, where the prophet says: I lifted up my eyes and saw: and behold, a man, and in his hand a measurers' cord. And the temple of the Lord which the adversaries destroyed can also be understood as the venerable body of the Lord, of which he himself said: Destroy this temple, and in three days I will raise it up. Destroyed in the passion, it was raised in the resurrection, and it was the seedbed and the beginning of all temples, of which the Apostle too speaks: You are the temple of God, and the Spirit of God dwells in you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
