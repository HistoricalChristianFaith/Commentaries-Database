[[commentary]]
quote='''
Strengthen the slackened hands, and make firm the feeble knees. Say to the faint-hearted (or to the fearful), Be strengthened, and do not fear; behold, your God will bring the vengeance of recompense: God himself will come and will save you (or, as the LXX translated, us). Then the eyes of the blind will be opened, and the ears of the deaf will be unstopped (or will hear). Then the lame man will leap like a stag, and the tongue of the dumb will be opened, for waters have broken out in the desert, and torrents in the wilderness, and what was dry ground will become a pool (or marshes), and the thirsty land springs of water. In the lairs in which dragons dwelt before, the green of reed and rush will spring up (for which the LXX translated: There will be the gladness of birds, and folds of flocks). And there will be a path there, and a way (or a clean way), and it will be called the holy way; the polluted will not pass through it. And this will be for us a straight way, so that fools may not go astray in it (or, as the LXX translated, nor will there be an unclean way there, but those who have been scattered will pass through it, and will not go astray). There will be no lion there, he says, and no evil beast will go up by it, nor will one be found there, but those who have been set free will walk in it. And the redeemed of the Lord will return, and will come to Zion with praise, and everlasting gladness will be upon their head. They will obtain joy and gladness, and sorrow and groaning will flee away. We have mingled both editions, lest, by setting out each one, the size of the books be stretched, which already exceeds the measure of brevity. The Apostles, of whom it was said above: They will see the glory of the Lord and the beauty of our God, are commanded to strengthen the hands that had grown slack among the nations, and to make firm the feeble knees; so that those who before could not do the work of God with slackened hands, and had a withered right hand, may stretch it out to good works; and those who long limped among idols with various errors may walk with firm step upon the truth; and that, strengthening the faint-hearted or timid by faith in the Lord, they may make them not fear, and the fear of the one God may drive out the fears of all error. And the cause of their security and constancy is that Christ is to come, to whom the Father has given all judgment, and he will render to each according to his works (John 5). He himself will come and will save you, you to whom it is said, Do not fear; or us, so that the Apostles may say that salvation is common to them with the believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
