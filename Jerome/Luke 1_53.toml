[[commentary]]
quote='''
And the mother of the Lord, full of the Holy Spirit, prophesied: He has filled the hungry with good things (Luke 1:53), those who before did not have the food of the Lord: and the rich he has sent away empty, those who were given for his burial, and who spat out him whom the Prophets had promised. Of these the Psalmist sings in another place too: The rich have been in want, and have hungered (Ps 33 [34]:11), that is, the people of the Jews. But those who seek the Lord, that is, the crowd of the Gentiles, shall not lack any good thing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
