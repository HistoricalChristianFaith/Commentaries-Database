[[commentary]]
quote='''
These, then, are the words which you shall do: Speak the truth, each one with his neighbor; judge truth and the judgment of peace in your gates; and let none of you devise evil in your hearts against his friend, and do not love a lying oath; for all these are things that I hate, says the Lord. LXX: These are the words which you shall do: Speak the truth, each one with his neighbor, and a peaceable judgment, judge in your gates, and let each one not devise evil against his neighbor in your hearts, and do not love a lying oath, for all these things I hate, says the Lord Almighty. I have promised that I will not deal with the remnant of the people of the captives as in the former days. And as I purposed to afflict them, when their fathers had provoked me to anger, and I did not have mercy, so now, having turned, I have purposed in these days to do good to Jerusalem and to the house of Judah. So that my sentence, then, may stand, and the promise may not be made void, do these things which I command: Speak the truth with your neighbors. Let us take neighbor to mean the whole race of men, since we have been begotten of one parent; otherwise, if neighbor is taken to mean kinsman, we must lie to strangers and foreigners. The Apostle says this same thing: Putting away lying, speak the truth, each one with his neighbor. Truth, he says, and the judgment of peace judge in your gates. In judgment let truth and justice come first; then mercy follows. For this is the judgment of peace: that the judge should have as his purpose to make peace between those at variance, according to that saying of the Gospel: Blessed are the peacemakers, for they shall be called sons of God. And what follows, In your gates, agrees with that prophetic saying: They hated him who reproves in the gates, and they abhorred the holy word. And in another place: They shall not be put to shame when they speak with their enemies in the gate. David too used to judge in the gates, when Absalom, promising the truth of judgment, was laying a trap for his father. And it is asked why among the Jews the place of judging was in the gates. So that the farmers should not be forced to enter the cities and undergo some loss, the judges sat in the gates, so that they might hear townsmen and countrymen alike at the going out and coming in of the city, and when the business was finished, each might at once return to his own dwelling.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
