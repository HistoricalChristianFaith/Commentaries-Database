[[commentary]]
quote='''
As for the following little verse, in which he says: But also on the way, when the fool walks, his heart is wanting, and he says: all is folly, or foolish, this is the sense: The fool, as he himself sins, expects that all sin alike, and judges everyone by his own nature. Indeed Symmachus translated thus: But also on the way, when the fool walks, he himself, being foolish, suspects of all that they are fools. But the Seventy made another sense, so as to say: All things that the foolish man thinks are most vain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
