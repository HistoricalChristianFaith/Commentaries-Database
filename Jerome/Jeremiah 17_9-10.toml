[[commentary]]
quote='''
The heart of all is depraved and inscrutable; who will know it? I the Lord search the heart and prove the reins, who give to each one according to his way and according to the fruit of his devices. LXX: the heart is deep above all things, and it is man; who will know him? and so on in the same way. The Hebrew word 'enos' is written with four letters, 'aleph' and 'nun' and 'uau' and 'sin'; if, then, it is read 'enos', it means 'man'; but if 'anus', 'inscrutable' or 'desperate', because no one is able to find out the heart of men. Symmachus, however, translated this passage thus: inscrutable is the heart of all; but who is the man that can find it out? And our people are wont, with a good desire indeed but not according to knowledge, to use this passage against the Jews, to show that the Lord and Savior is a man according to the dispensation of the flesh that he assumed, and that no one can know the mystery of his birth, according to what is written: who will declare his generation?, except God alone, who searches out secrets and renders to each one according to his works. But it is better that we take it simply, that no one knows the secrets of the thoughts except God alone; for he had said above: cursed is the man who has hope in man, and on the contrary: blessed is the man who trusts in the Lord. Hence, lest we should think the judgment of men certain, he added that the hearts of nearly all are perverse, as the psalmist says: cleanse me from my hidden faults, O Lord, and from those of others spare your servant — no doubt, from thoughts — and in Genesis: but God, seeing that the wickedness of men was great on the earth, and that every thought of the heart was intent upon evil at all times, and again: for the sense and thought of the human heart are prone to evil from its youth. Through these we learn that God alone knows their thoughts. But if it is said of the Savior, but Jesus, seeing their thoughts, and no one can see thoughts except God alone, then Christ is God, who searches hearts and proves the reins and will render to each one according to his works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
