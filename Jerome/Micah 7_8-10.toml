[[commentary]]
quote='''
Do not rejoice over me, my enemy, because I have fallen; I shall rise; when I sit in darkness: the Lord is my light. I will bear the wrath of the Lord, because I have sinned against him, until he judges my cause and executes judgment for me; he will bring me out into the light, and I shall see his justice, and my enemy will look on, and she will be covered with confusion, who says to me: Where is the Lord your God? My eyes will look upon her; now she shall be trodden down, like the mud of the streets, the day for your walls to be built. On that day the law shall be far off; on that day they will come even to you from Asshur, and as far as the fortified cities, and from the fortified cities as far as the river, and to sea from sea, and to mountain from mountain. And the land shall become a desolation because of its inhabitants, and because of the fruit of their thoughts. LXX: Do not insult me, my enemy, because I have fallen, and I shall rise again; for if I walk in darkness, the Lord will enlighten me. I will endure the wrath of the Lord, because I have sinned against him, until he justifies my cause, and executes judgment for me, and brings me out into the light, and I shall see his justice, and my enemy will see me and confusion will cover her, who says to me: Where is the Lord your God? My eyes will see her, now she shall be for trampling, like mud in the ways, the day of the daubing of brick, your blotting out, and that day will thrust back your ordinances, and your cities will come into enclosure and into the division of the Assyrians, and your fortified cities into division from Tyre as far as the river, and from sea to sea, and from mountain to mountain; and the land shall become a ruin with its inhabitants because of the fruits of their devisings. It seems to me that according to the letter Jerusalem is speaking against Babylon and the other nations which had insulted her: Do not rejoice at my ruin, for, the Lord having mercy, I shall rise; after I have sat in captivity he will bring me out of the darkness, and he will be my light. I will endure the wrath of the Lord, because I know that I deserved what I have suffered, until I am avenged on the nations, and judgment is executed for me. For I know that he will bring me out into the light and I shall see his justice, and my enemy Babylon will look on, and the other nations round about, and she will be covered with confusion, who now says insultingly: Where is the Lord your God? My eyes will see her, and not after a long time, but now and at present, trodden down like the mud of the streets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
