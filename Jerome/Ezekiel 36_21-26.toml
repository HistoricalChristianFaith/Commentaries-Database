[[commentary]]
quote='''
'When I had seen this,' he says, 'not for their sake but for the sake of my holy name — for I am the Creator of all — I spared them; and I sanctified them and restored them to their former glory, so that upon those who believed and were converted from error I poured out the clean water of saving baptism, and cleansed them from their abominations and from all the errors with which they had been taken up; and I gave them a new heart, that they might believe in the Son of God, and a new spirit' — of which David speaks: Create a clean heart in me, O God, and renew a right spirit in my inward parts —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
