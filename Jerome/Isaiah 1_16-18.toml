[[commentary]]
quote='''
If your sins are like scarlet, they shall be made white as snow; and if they are red like crimson, they shall be like white wool. An excellent order: for it is not enough to have said, wash yourselves, unless he adds, be clean, so that after the washing of water they may have purity of heart. For blessed are the clean of heart, for they shall see God (Matt 5:8). And when they have purity of heart, they must take away evil from their minds, not in the sight of men but in the sight of God, from whom nothing can be hidden. And what he adds, Cease to act perversely, echoes that word of the Gospel: Behold, you have been made whole; sin no more, lest something worse befall you (John 5:14). Withdrawing, then, from vices, let him learn good, and seek judgment, relieve the oppressed, support the orphan and the widow; and if he does this, then the sins which before were blood-red like scarlet will be forgiven, and the works of gore and blood will be changed by the garment of the Lord, which is made from the fleece of the lamb, whom in the Apocalypse (ch. 5) those follow who shine with the whiteness of virginity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
