[[commentary]]
quote='''
Let those who think that the Saviour asks because He is ignorant, learn from the present place that it is not so, for at all events Jesus must have known whose image was on the coin.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus said to them: Whose image and superscription is this? Let those who think that the Savior's questioning is ignorance and not dispensation learn from the present passage that Jesus certainly could have known whose image was on the coin; but he asks so that he may answer their words fittingly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
