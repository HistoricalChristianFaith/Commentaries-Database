[[commentary]]
quote='''
And you, Lord of hosts, tester of the righteous — or who test righteous things —, who see the reins and the heart, let me see, I pray, your vengeance on them! for to you I have revealed my cause. The Lord alone is the one who knows how to test righteousness, just as he alone is the one who beholds the inward parts of the heart; hence Jesus too, knowing the thoughts of men, is God not by advancement, as some think, but by nature. Something of the kind sounds in the Psalms as well: no one living shall be justified in your sight. If one who lives in virtues is not justified, how much more one who is dead in sins! And though the righteous man knows that he has God as his champion, yet through the impatience of human frailty he desires to see even now what he knows is to come. And he revealed his cause to him who says in another place: vengeance is mine, I will repay, says the Lord. Happy, then, the conscience whose cause is revealed to the Lord, as the Apostle says: everything that is made manifest is light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
