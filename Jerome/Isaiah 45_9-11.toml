[[commentary]]
quote='''
Woe to him who contradicts his maker: a potsherd of the Samian earth. Does the clay say to its potter, What are you making? and, Your work is without hands? Woe to him who says to a father, What are you begetting? and to a woman, What are you bringing to birth? Thus says the Lord, the Holy One of Israel, his fashioner: Ask me about things to come concerning my sons, and concerning the work of my hands give charge to me. I made the earth, and I created man upon it: my hands stretched out the heavens, and I gave command to all their host. I have raised him up to righteousness, and I will direct all his ways. He will build my city, and he will let my captivity go, not for a price nor for gifts, says the Lord of hosts. LXX: What better have I made than the potter's clay? Will the ploughman plough the earth? Will the clay say to the potter, What are you making? because you do not work and have no hands? Woe to him who says to a father, What are you begetting? and to a mother, What are you bringing to birth? For thus says the Lord God, the Holy One of Israel, who made the things to come: Ask me about my sons, and concerning the works of my hands give charge to me. I made the earth, and man upon it. I with my hand made firm the heaven: I gave command to all the stars. I raised him up with righteousness as king: all his ways are straight. He will build my city, and will turn back the captivity of my people: not with a price nor with gifts, said the Lord God Sabaoth. Those who wish to refer what is said to the person of Cyrus interpret this passage thus: When I promise great things, that for the sake of my people's return to Judea I will lay all kingdoms beneath Cyrus, woe to him who is unbelieving and does not think that the things I say will come, as if clay and a broken potsherd should cavil at its potter, why it was made, or why it was made so; and a work should speak against the hands of its craftsman; and a son should cavil at his father and mother, why he was poured out onto the earth by the law of nature. Since therefore I, the Lord, the Holy One of Israel, have fashioned Cyrus, and he was begotten at my command, it is superfluous for you to doubt about things to come; rather you ought to know that I dispose of my sons, the people of Israel, and of the work of my hands, not at your discretion but by my will: so that I, who formerly created darkness and evil for them, now grant light and peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"


[[commentary]]
quote='''
But one who refers the understanding so begun to Christ frames the words of his explanation thus: Woe to those who contradict God and do not think that Christ will come; as if clay and a potsherd from among potsherds should contradict its potter. Woe to him who says to the Almighty Father, Why do you beget a Son? and to the woman, holy Mary, What are you bringing to birth? Of whom the Apostle too writes (Gal 4): That Christ was made of a woman, and made under the law. These things, then, says the Lord, the Holy One of Israel, who fashioned the Savior in the virginal womb, saying through Gabriel: The Holy Spirit will come upon you, and the power of the Most High will overshadow you (Luke 1:35): and the holy thing that will be born in you will be called the Son of God: let the potsherd question me and search out the secrets of things to come. And let it instruct me how I ought to regenerate the adopted sons who are to believe in my Son. The evangelist John too says: As many as received him, to them he gave power to become sons of God (John 1:12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
