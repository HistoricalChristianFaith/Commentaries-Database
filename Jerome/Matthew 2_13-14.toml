[[commentary]]
quote='''
When he takes the Child and His mother to go into Egypt, it is in the night and darkness, when to return into Judæa, the Gospel speaks of no light, no darkness.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Behold, an angel of the Lord appeared in sleep to Joseph, saying: Arise, and take the child and his mother, and flee into Egypt. When he took the child and his mother to cross into Egypt, he takes them by night and in darkness; but when he returns into Judea, neither night nor darkness is set down in the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
