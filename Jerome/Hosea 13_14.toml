[[commentary]]
quote='''
From the hand of death I will free them, from death I will redeem them. I will be your death, O death; I will be your bite, O hell. Consolation is hidden from my eyes, because he divides between brothers. LXX: From the hand of hell I will free them, from death I will redeem them; where is your cause, death? Where is your sting, hell? Consolation is hidden from my eyes, because he will divide between brothers. According to both understandings, both of Ephraim, that is, of the ten tribes, and of the heretics, who could not hold out in the crushing of their children when the pains as of a woman in labor came, the Lord promises that he will free them from the hand of death and redeem them from death. Now he calls the hand of death the works by which it kills, according to what is written: Death and life are in the hand of the tongue. And the Lord freed all and redeemed them in the passion of the cross and the shedding of his blood, when his soul went down into hell and his flesh did not see corruption; and to death itself and to hell he spoke: I will be your death, O death. For this is why I died, that you might die by my death. I will be your bite, O hell, you who devoured all in your jaws.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
