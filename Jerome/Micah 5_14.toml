[[commentary]]
quote='''
There is added, in the promise which is directed to the remnant, that is, the ὑπόλειμμα of Jacob: And I will cut down the groves from your midst, and I will destroy your cities, so that he may pull down and consume all the trees of the forests, and the groves which it was forbidden to plant in the temple of God, and the badly built cities which he had earlier called the cities of the land.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
