[[commentary]]
quote='''
When the Pharisees heard that he had imposed silence on the Sadducees, they gathered together; and one of them, a doctor of the law, questioned him, tempting him: Teacher, which is the great commandment in the law? Jesus said to him: You shall love the Lord your God with your whole heart, and the rest. What we read of Herod and Pontius Pilate, that they made concord over the Lord's death, we now see also of the Pharisees and the Sadducees. They are contrary to each other, but to tempt Jesus they agree with one mind. Those, then, who had already been refuted above in the showing of the denarius, and had seen the faction of the opposing party overthrown, ought to have been warned by the example not to contrive snares any further; but ill will and envy nourish impudence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
