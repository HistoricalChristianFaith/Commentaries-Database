[[commentary]]
quote='''
But I went away into Arabia: and again I returned to Damascus. The order of the history does not seem to agree with itself, since Luke relates in the Acts of the Apostles (Acts 9) that when Paul, after his faith in Christ, had for many days been speaking the Gospel boldly at Damascus, a plot was laid against him, and he was let down through the wall by night in a basket, and came to Jerusalem trying to join himself to the disciples; and that, when they avoided him and were afraid to approach him, he was brought by Barnabas to the apostles, and there related how he had seen the Lord on the road, and how he had acted with confidence at Damascus in the name of the Lord. "He was", he says, "with them, going in and going out in Jerusalem, acting with confidence in the name of the Lord. He also spoke and disputed with the Greeks: but they sought to kill him. And when the brothers had learned this, they brought him down to Caesarea, and sent him off to Tarsus" (Acts 9:28-30). Here, however, he says that he first went into Arabia; and that, having returned again to Damascus, he came after three years to Jerusalem, saw Peter, and stayed with him fifteen days, and met no one else besides James, the brother of the Lord. And so that these things may be believed true (for they could seem doubtful to those who were absent), he confirms them under oath, saying: "But the things that I say to you, behold, before God, I do not lie." We can therefore judge that Paul was indeed at Jerusalem, according to Luke's history, not as though going to the apostles who were his predecessors in order to learn something from them, but in order to escape the onslaught of persecution that had been stirred up against him at Damascus on account of the Gospel of Christ; and that he thus came to Jerusalem as he would to any other city. That from there he at once withdrew because of the plots, and came to Arabia, or to Damascus; and from there, after three years, returned to Jerusalem to see Peter. Or certainly thus: that as soon as he was baptized, and strengthened by taking food, he was with the disciples who were at Damascus for some days; and, while all were astonished, he at once preached in the synagogues of the Jews that Jesus was the Son of God; and that he then went into Arabia, and returned from Arabia to Damascus, and spent three years there: and these are the many days to which Scripture testifies, saying: "But when many days were fulfilled, the Jews took counsel to kill him" (Acts 9:23). But their plot became known to Saul: and they watched the gates day and night, in order to kill him. So his disciples took him by night and let him down through the wall, lowering him in a basket. And when he had come to Jerusalem, he tried to join himself to the disciples. And that Luke passed over Arabia for this reason, because perhaps he had accomplished nothing worthy of his apostleship in Arabia; and that he chose rather to tell, in a concise narrative, those things that seemed worthy of the Gospel of Christ. Nor is it to be counted as sloth on the Apostle's part if he was in Arabia to no purpose: rather, there was some dispensation and a command of God that he should keep silent. For afterward too we read that Paul, having set out with Silas, was forbidden by the Holy Spirit to speak the word in Asia (Acts 16).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
