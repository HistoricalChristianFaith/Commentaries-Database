[[commentary]]
quote='''
And again, he says, I will build you and you shall be built, virgin Israel. Let us understand this properly of the Church; for they rave who sigh for a golden and jeweled Jerusalem, consecrating their own avarice in the mystery of the Lord's city. 'Again you shall be adorned with your timbrels, so that you may sing to the Lord in the churches, all the flesh of evil works in you having been consumed, and you shall go forth in the dance of those who make merry with the crowds of the nations, you shall plant vineyards on the mountains of Samaria', not at all in the valleys and low places, but on the mountains of Samaria, which after the captivity of the people of Israel were possessed by foreigners, to whom it is said: plant plantings and gather the vintage!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
