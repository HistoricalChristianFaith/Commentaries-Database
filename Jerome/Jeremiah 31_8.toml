[[commentary]]
quote='''
Behold, I will bring them from the land of the north and will gather them from the ends of the earth; and what follows: at the solemnity of the Passover; and it shall beget many sons, is not found in the Hebrew, but is read only in the Seventy, in place of which among the Hebrews is written: among whom shall be the blind and the lame and the woman with child and the woman giving birth together, a great church of those returning hither. The remnant of the people of Israel is gathered through the apostles and apostolic men, of whom we read above: the watchmen shall cry on the mount, and to whom it is commanded: sound aloud and sing and say, so that the remnant of Israel may be saved. And the Lord himself promises that he will bring them back from the land of the north, which is a most harsh wind, but by name is called right, from unbelief, from the cold of the Lord's love, and will gather them from the ends of the earth, not at another time, but at the solemnity of the Passover, that is, on the festal days of the Lord's passion, when the Lord was crucified and that was fulfilled which he himself promised in the Gospel: when I am lifted up, I will draw all things to myself. Then it begot a great people, so that that saying of Isaiah might be fulfilled: for a nation is born at once; for in one day three thousand and five thousand men believed. And what is written in the Hebrew: among whom shall be the blind and the lame and the woman with child and the woman giving birth together, a great church of those returning hither, although it has also been fulfilled according to the letter, in that the blind saw and the lame walked, yet it can better be understood according to anagōgēn [the higher, spiritual sense]: that those who before were blind with faithlessness afterwards believed in the Savior, and those who were lame, to whom Elijah once spoke: how long do you limp on both feet?, afterwards walked, and the people who sat in darkness and the shadow of death saw a great light, and the lame ran, and the woman with child bore sons, a great church of those returning to the faith. The Jews think that this was fulfilled when under Ezra, after the day of the Passover, they went out from Babylon to return to Jerusalem, in which there was a type and not the truth; for they will not be able to prove that at that time all the things which we have read and are going to read were fulfilled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
