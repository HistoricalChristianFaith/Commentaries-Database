[[commentary]]
quote='''
Therefore the clement and merciful God does not slay the prophetesses themselves, but will tear their cushions, which like nets catch flying souls, so that, after these have been torn, the souls may have free power of flying; and he will rend the veils, or pillows, on which the ruling part of the soul was reclining and with which the heads of the deceived were covered; since the apostle teaches that the heads of men are not to be veiled, but that the glory of the Lord is to be contemplated with unveiled face: 'For you,' he says, 'were breaking the spirits of those who serve God with false terrors, and were keeping the wicked shut in with fraudulent promises, lest by doing penance they should recover the life which they had lost; therefore you shall by no means see vain visions, nor will I call your lies prophecies, but divinations, of which it is written: There is no augury in Jacob, nor divination in Israel, so that I may rescue my people from your hands, and you may know by deed that I am the Lord, who have freed the lost'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
