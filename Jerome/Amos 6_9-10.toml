[[commentary]]
quote='''
And the wrath of God raged against them to such a degree that, even if ten men remain in one house, they too die, and a kinsman, or a neighbour, burns the corpses of the dead to carry the bones out of his house, because, for the crowds of the dying, whole bodies cannot be carried out. And when the one who has grown weary of carrying them away asks the one who is in the inner rooms of the house whether any remain whom he should hand over to him, and he answers: It is the end, I no longer have anyone to hand over to you for burial; then, before he can swear that he has none, the one who had asked, who was outside and had learned that there were none, commands him and says: Be silent, and do not remember the name of the Lord. He records this in order to show that not even when driven by the weight and necessity of evils are they willing to confess the name of the Lord, and that the name of God had come into such oblivion among Israel that Israel does not deign to hear his name even in a simple oath.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
