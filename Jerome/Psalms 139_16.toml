[[commentary]]
quote='''
Which Scripture also attests in the hundred and thirty-eighth (139th) psalm: Your eyes saw my imperfect being. And the sense is: Before I was made, before I was shaped into limbs, while I was still contained in the seed, your eyes saw me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
