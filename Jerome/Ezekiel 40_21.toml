[[commentary]]
quote='''
And that the cells are said to be three on this side and three on that teaches this, that both the letter and the spirit, and each understanding, that of history and that of tropology, pertain to the mysteries of the Trinity. And what is said: And its front and vestibule according to the measure of the former gate, signifies the eastern gate, which is called former not in order but in merit. 'And they had', he says, 'fifty cubits in length and twenty-five in breadth', so that in the fifty, after seven weeks, the eternal rest may be shown, extending through the day of the resurrection to the kingdoms of heaven, in which there is true rest, and in the twenty-five, of which number we have spoken before, the five senses may be kept, through five rows, in the measure of a square, one of which is fitted to the length, the other to the breadth, so that in the length may be shown the rest and delight of a more sacred knowledge, in the breadth the reason of present things which pertains to the senses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
