[[commentary]]
quote='''
And the word of the Lord came to me, saying: Son of man, prophesy concerning the shepherds (or to the shepherds) of Israel, prophesy and say to the shepherds: Thus says the Lord God: Woe to the shepherds of Israel who were feeding themselves (or O shepherds of Israel, do shepherds feed themselves); are not the flocks fed by the shepherds (or do not the shepherds feed the sheep)? You ate the milk and covered yourselves with the wool, and what was fat you slaughtered, but my flock you did not feed; what was weak you did not make firm (or strengthen), and what was sick you did not heal, what was broken you did not bind up, and what was cast off (or was straying) you did not bring back, what had perished you did not seek, but you ruled over them with harshness and with power (or and what was strong, you afflicted with toil). And my sheep were scattered, because there was no shepherd (or shepherds); and they were made to be devoured by all the beasts of the field, and they were scattered. My flocks (or sheep) had wandered over all the mountains and on every high hill, and over the whole face of the earth my flocks (or sheep) were scattered; and there was none who would seek, there was none, I say, who would seek (or who would bring back). Therefore, O shepherds, hear the word of the Lord: As I live, says the Lord God, because my flocks (or sheep) have become a prey, and my sheep have been made to be devoured by all the beasts of the field, because there was no shepherd (or shepherds); for the shepherds did not seek my flock, but the shepherds were feeding themselves, and were not feeding my flocks. Therefore, shepherds, hear the word of the Lord. Thus says the Lord God: Behold, I myself, against the shepherds, will require my flock at their hand, and I will make them cease, so that they no longer feed my flock, nor shall the shepherds feed themselves any more (or the sheep); and I will deliver my flock (or sheep) from their mouth, and it shall no longer be food for them. For thus says the Lord God: Behold, I myself will seek out my sheep, and I will visit them. As a shepherd visits his flock on the day when he is in the midst of his scattered sheep (or when there is gloom and cloud in the midst of his separated sheep), so will I visit my sheep, and I will deliver them from all the places into which they had been scattered in the day of cloud and gloom. And I will lead them (or them) out from the peoples (or from the nations), and I will gather them (or them) from the lands (or regions), and I will bring them (or them) into their own land, and I will feed them (or them) on the mountains, Israel, by the streams and in all the dwelling places of the land. In the richest pastures I will feed them (or them), and on the high mountains of Israel shall be their pastures (or their folds); there they shall rest in green grass, and in fat pastures they shall feed upon the mountains of Israel. I will feed my sheep, and I will make them lie down (or rest), says the Lord God. What had perished I will seek, and what had been cast off (or had strayed) I will bring back, and what had been broken I will bind up, and what was weak I will make firm (or strengthen), and what is fat and strong I will guard, and I will feed them in judgment (or with judgment). But you, my flocks (or my sheep), thus says the Lord God: Behold, I judge between cattle and cattle, of rams and of he-goats. Was it not enough for you to graze down the good pasture? Moreover you will also trample the remnants of your pastures with your feet, and when you drank the purest water, you fouled the rest with your feet; and my sheep fed on what had been trampled by your feet, and drank what your feet had fouled. Therefore thus says the Lord God to them: Behold, I myself judge between fat cattle and lean (or between strong cattle and weak): because you thrust with your sides and shoulders and tossed all the weak cattle with your horns, until they were scattered abroad, I will save my flock and it shall no longer be a prey, and I will judge between cattle and cattle (or between ram and ram). And I will raise up over them (or them) one shepherd to feed them (or them), my servant David, he shall feed them (or them), and he shall be to them for a shepherd. But I the Lord will be to them for God, and my servant David prince in the midst of them: I the Lord have spoken. And I will make with them a covenant (or testament) of peace, and I will make the most evil beasts cease from the land, and those who dwelt in the desert shall sleep secure in the woods; and I will make them, round about my hill, a blessing, and I will bring down (or give) the rain in its season: there shall be rains of blessing. And the tree of the field shall give (or the trees of the plains shall give) its fruit, and the earth shall give its shoot (or strength), and they shall be (or dwell) in their own land without fear (or in hope of peace), and they shall know that I am the Lord, when I have broken the chains (or the collar) of their yoke, and rescued them from the hand of those who ruled over them (or who made them serve). And they shall no longer be a prey to the nations, nor shall the beasts of the earth devour them, but they shall dwell confidently (or in hope) without any terror. And I will raise up for them a renowned shoot (or a planting of peace), and they shall no longer be diminished (or perishing) by famine in the land, nor shall they bear any longer the reproaches of the nations; and they shall know that I am the Lord their God with them, and they my people, the house of Israel, says the Lord God. But you, my flocks, the flocks of my pasture (or sheep), are men, and I the Lord your God, says the Lord God. I have often pointed out that I mix the two editions so as to avoid making the books too large, at least in those places that do not differ much from each other in translation. After Jerusalem was taken, after the one who had escaped brought the news to Babylon, he spoke concerning those who dwelt in the ruins of Jerusalem, and then to those who, though placed in captivity, nonetheless persevered in wickedness, unwilling to hear the prophet's words; now he directs his discourse to the shepherds, that is, to the princes, by whose fault the sheep, that is, the peoples, were scattered. And this must be noted, that from the twelfth year, the tenth month, the fifth of the month of the exile — or of the captivity of Jeconiah and of those who had been taken captive with him —, up to the twenty-fifth year, when the temple is built upon the mountain of the built city and the incredible mysteries of the Church are laid open, no year and no time is set in between, but it is simply said: 'The word of the Lord came to me, saying: Speak to these and to those', so that we should understand that all the things read over thirteen years, though spoken at different times, nevertheless do not have fixed intervals of time between them. But the discourse is directed to the shepherds of Israel — whom we ought to take either as the kings and princes, the scribes and Pharisees and the teachers of the Jewish people, or certainly, in the people of the Gospel, as the bishops, presbyters and deacons, or, according to the mystical senses, as the angels of the individual churches, to whom John writes in his Revelation, and whose angels daily see the face of God —, and first it is said: Woe to the shepherds of Israel, who, when they ought to feed the Lord's flock and provide for its welfare, hasten after their own luxury — whence great care must be taken, and those precepts observed: Do not seek to become a judge, lest perhaps you be unable to take away iniquities, and again: The greater you are, the more humble yourself, and you will find grace in the sight of the Lord, and once more: Have they made you leader? Do not be lifted up: be among them as one of them; whence the Apostle too says that he was among the disciples as a little one and a suckling —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
