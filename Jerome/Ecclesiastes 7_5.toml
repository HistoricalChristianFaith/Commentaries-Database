[[commentary]]
quote='''
It is better to hear the rebuke of a wise man than a man hearing the song of fools. For as the sound of thorns under a pot, so is the laughter of the fool. But this also is vanity. For it is better to be rebuked by a wise man than to be deceived by coaxing flattery. Like this is that saying: Better are the wounds of a friend than the willing kisses of an enemy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
