[[commentary]]
quote='''
Your sun and moon, and all the splendor with which you had formerly shone upon your people, and which afterwards, under the weight of evils, had all been covered with the horror of darkness, recovered their light and had their former brightness. Your arrows and your flashing spear, that is, your blows and your instruction, gave light to your people. Finally, in the light of your arrows and in the splendor of your spear, which chastised them to this end, that it might amend them, your people walked in your roaring.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: The sun was lifted up, and the moon stood in its order. If we follow the simple interpretation, the present words show the advance of the sun and moon, in that, according to Isaiah, in the age to come the sun will shine sevenfold, and the moon will gleam with the brightness of the sun. Because indeed the creation will be set free from the bondage of corruption into the liberty of the glory of the sons of God, the creation which is now subjected to vanity because of him who subjected it in hope of liberty: when, at the consummation of the world, every creature has been set free, the sun and moon too will be set free, and will stand in their order. But if we wish to take Christ as the sun of justice, in whose wings is healing, and the Church as the moon, which is lit by the splendor of this sun, it is not difficult to say that the true light, and the light of men, and the splendor of the glory of God, and the splendor of eternal light illumines her who now, in this age, waxes and wanes according to prosperity and afflictions. But when the sun has been lifted up, and, according to the Apostle, God has exalted him and given him a name above every name, then the Church too, which in the present age cannot keep her order, will return to her due order, and will by no means be changed, but will stand with fixed step, and will hear with Moses: But you, stand here with me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: In light your darts will go, in the splendor of the flashing of your arms. The darts of God, that is, the arrows going forth and proceeding, are not sent in order to kill, but to illumine. To distinguish these arrows and darts, Christ is called a chosen dart, crying out through Isaiah: He has set me as a chosen dart, and in his quiver he has hidden me; and he said to me: It is a great thing for you to be called my servant. This arrow will have many arrows, to send into the whole world. Hence also the bride, wounded by the chosen dart, says: Wounded by charity am I, in accordance with which we too can say: Wounded by chastity am I, wounded by wisdom am I. Wounded by this dart of wisdom, the queen of the south too was beside herself, and, astounded, had found more in the true Solomon than report had told her. These arrows, then, which are sent into light, also proceed in the splendor of the flashing of his arms, that is, of God's. For whoever is armed so as to stand against the wiles of the devil, and girded with the armor of the Apostle, to him will come the darts of light, so that it may be said to him: You are the light of the world. But if anyone is a sinner, and groans that he dwells in the tents of Kedar, there are sent to him sharp arrows of the mighty, with desolating coals, so that first he may be pricked by the words of God and say: I was turned about in misery while the thorn is fixed in me. And after he has been pricked, then let the desolating coal be sent to him through the Seraphim, that is, the burning word of God, to burn out not only the lips, which alone Isaiah had unclean, but also all the parts of his members, and to bring him back to a solitude of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
