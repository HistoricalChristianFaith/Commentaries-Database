[[commentary]]
quote='''
Finally, they will not return to the Lord, because what they wanted they have found, and the spirit of fornication, which according to the Apostle works in the sons of unbelief, possesses their captive hearts; therefore, while he reigned, they did not know the Lord, or rather they forgot their Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
