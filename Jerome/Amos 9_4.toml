[[commentary]]
quote='''
And lest perhaps, from what he said above, we should understand anything other than captivity at the hands of the enemy, Scripture, after its custom, has disclosed what it had said before under riddles. And if they go into captivity before their enemies, there I will command the sword, and it shall slay them: so that, namely, they may not think servitude the extremity of their evils, but the enemy's blade may pierce them even as captives; and those who have been able to survive and escape death may not escape the gaze of God, but he will set his eyes upon them for evil and not for good, so that he may always visit them and drive them to repentance through torments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
