[[commentary]]
quote='''
For splendor and oil, and fatness and brightness, we read in the Hebrew Isaar, according to what is written in the psalms of the joy and happiness of the saints: They shall be inebriated with the plenty, or with the fatness of your house: for πιότης means fatness rather than plenty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
