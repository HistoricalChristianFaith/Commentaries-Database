[[commentary]]
quote='''
But when the Lord has brought us out into the light, and we have seen his justice, then our enemy Babylon will see, and will be covered with confusion, she who formerly said to us: Where is your God, thinking that Jerusalem after her wounds could not be healed. And our eyes will look upon her, and she will be trodden down like the mud of the streets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
