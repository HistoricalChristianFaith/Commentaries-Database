[[commentary]]
quote='''
Here 'who' is taken for 'rare', according to that saying: Who, do you think, is the faithful and wise steward? and: Lord, who dwells in your tabernacle, and who shall go up into your holy mountain? Rare, then, is the one who despises the small days of this world and thinks royal power worth nothing. When we see the powerful of the world gleaming with gold, glowing with purple and gems, surrounded by an army, let us say within ourselves: Who, do you think, despises the small days? Hence Jacob too, understanding that the life of men is short: Small, he says, and very evil are the days of my life. Those, then, who have despised the small days — and he refers this to royal power, to admonish Zerubbabel and Joshua and the people building the temple of God, by no means to fear the adversaries who were hindering them, but to listen to the Lord exhorting them — those, from the fact that they despise royal grandeur, shall also rejoice and see the help of the Savior, who is promised from the stock of Zerubbabel, and because of his strength is called a stone, and a stone of tin. For this in the Hebrew is written abdil, because he is the wall and the strength and the might of those who believe. For just as tin defends other metals from fire, and though bronze and iron are by nature very hard, yet if it is without tin it is burned and consumed, so all the strength of angels and of men, if the help of the Savior is not there, is proved weak and frail. Now this stone, that is, this mass, which among the Hebrews is written abdil, that is, of tin, ἐτυμολογεῖται (is etymologized as) ἀποχωρίζων, that is, separating and setting apart, so that, as tin through fire parts metals that are mixed and adulterated, so the Lord, the true assayer and χωνευτὴς (refiner), may set apart the bronze and the lead of the vices from the gold and silver of good works, so that pure gold and silver may remain. In different words this ἀποχωρίζων and separator is described in the Gospel: Whose winnowing fan is in his hand, and he will cleanse his threshing floor, and will separate the chaff from the wheat, he who cries through Jeremiah: What has the chaff to do with the wheat? says the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
As for the seven eyes, which run to and fro through the whole earth and judge all things, we explained above that they are the seven spirits; and that nothing is hidden from the Lord, who is aware of things past and present and to come, and renders to each according to his works, above all when he comes in the person of the one who separates the good and the wicked, and of the refiner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
