[[commentary]]
quote='''
But since he says: That we may no longer be children tossed to and fro, and the rest, testifying that he too is tossed to and fro and a child, it seems we must reconsider whether he said this out of humility, or whether, seeing in part and knowing in part, he understood how far he was from perfect knowledge and burst out into words true to his own conscience. If anyone, then, holds that he said this out of humility, he will use this example: When I was a child, I spoke as a child, I thought as a child, I understood as a child. But when I became a man, I put away the things that were of a child (1 Cor. 13:11). Another, however, may reply to this that, by comparison with many, the Apostle had arrived at the age of the perfect man, but with respect to the things laid up for the saints he is still called a child. For indeed the prophet speaks of all the apostles who believe in Christ as children, saying: Behold, I and the children whom God has given me (Isa. 8:18). After this we must discuss more attentively whether perhaps the Apostle, truly out of humility, said not only that he was a child, but also tossed to and fro, and swept in different directions by every blast of doctrines, in the deceit of men, in wickedness, for the circumvention of error. But he who holds that he uttered this not out of humility but out of his conscience says: Paul the apostle was a man of sharp and keen intellect, one who at the very first attempts of disputants foresaw with a shrewd mind what was going to be inferred. He saw, therefore, that things were often argued on both sides in such a way, and such plausible claims were made for contrary positions, that they made the hearer doubt; and so, as a man still placed in a frail little body, he was indeed carried about by every wind of doctrine, but he was not dashed upon the rocks, nor was his ship filled by the floods: for he stood at the stern holding the helm, and broke the foaming waves of heresy by the security of faith. Yet not fearless and secure, nor quiet and calm, did he look out upon the winds blowing from this side and that, and with an anxious ear he caught them, and he overcame what was contrary: but his victory was not secure. Since, then, he saw that the words and arguments of his adversaries, by which they strove to overturn the truth, could not easily be overcome, being full of every cunning and woven together by the art of dialectic, nay rather of the devil, he hoped for God's help, that he might drive every deliberation from his mind, and believe without any trouble the sure and fixed truth, and increase it in the love of Christ, whom he knew to be the head both of himself and of the whole body of the Church. We should know that this passage is clearer in the Greek; but when it is translated into Latin word for word, the meanings, wrapped up in the words, have made what is said obscure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
