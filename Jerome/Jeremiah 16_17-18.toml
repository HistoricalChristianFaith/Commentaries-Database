[[commentary]]
quote='''
And he shows that either the apostles or those who are afterwards to be hunted had sins and received their double iniquities. For the servant who knows the will of his lord and does not do it shall be beaten much. And it must be known that in the Hebrew 'first' is set down, and in the edition of the Seventy it is omitted. But when he says: I will repay first their double iniquities and sins, he intimates that after they have received evils, they will receive good things too. And these who are afterwards to be transferred have defiled the land of the Lord with the carcasses of their idols and have filled his inheritance with their abominations, so that the whole world may become subject to God and be preserved not at all by its own merit, but by his mercy. What we have set down here from the Hebrew: they are not hidden from my face, is not found in the Seventy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
