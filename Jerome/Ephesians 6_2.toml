[[commentary]]
quote='''
And at the same time we shall also press hard the heretics, who will not have it that the Old Testament belongs to the good God whose Son Christ is: by what reasoning does the Apostle of Christ, the Son of the good God, use the Scripture of the Creator, and take for granted the obedience of children from the old Law? This testimony, taken from Exodus, is worded thus there: Honor your father and your mother, that it may be well with you, and that you may be long-lived upon the land which the Lord your God will give you (Exod. 20:12); from which he has now removed the last words; and this commandment is the fifth in the Decalogue. Hence it must be asked why he has now said, which is the first commandment, when the first commandment is: You shall have no other gods besides me. For this reason some read it thus: which is the first commandment in promise, as if the four other commandments, which were spoken before, had no promises, and in this one alone a pledge were set down attached to it: that it may be well with you, and that you may be long-lived upon the land which the Lord your God will give you. But they seem to me not to have observed carefully enough that in the second commandment too a promise is joined. For he says: You shall not make for yourself an idol, nor any likeness of the things that are in heaven above, and that are on the earth beneath, and that are in the waters under the earth: you shall not worship them, and you shall not sacrifice to them: for I am the Lord your God, a jealous God, who repay the sins of the fathers upon the children to the third and fourth generation, to those who hate me, and I show mercy to thousands, to those who love me and keep my commandments (Exod. 20:5-6). For observe that these are the words of a pledge: Showing mercy to thousands, to those who love me and keep my commandments. Perhaps, then, because the Decalogue was given as the first Law to the people going out of Egypt, each commandment of the Decalogue is to be called the first commandment, by comparison with those precepts which were afterwards written down in the Law. But he who will try to hold the former exposition, in that he had divided the words, which is the first commandment in promise, will say that the commandment stands separately: Honor your father and your mother; and that afterwards the promise is set in its own place: that you may be long-lived upon the land which the Lord your God will give you. But in this commandment, that is: You shall not make for yourself an idol, nor any likeness, he will say that not separately, but in one context and discourse, it is not so much that a promise was given as that the sentence ended in the praises of God, who shows mercy to thousands, to those who love him and keep his commandments. Again, he who contends that all the commandments of the Decalogue are the first commandment will show that the promise in which it is written: that you may be long-lived upon the land which the Lord your God will give you, pertains not only to those who obey their parents, but also to countless other precepts; and he will have to unroll all the commandments in which this reward and prize is promised, that they may be long-lived upon the land which the Lord their God has given them. From him the interpreter who differs will have to demand that he show that those things which he has brought forward were written as commandments before this commandment. And if he cannot prove this, he will mention in vain that this promise is attached in other precepts too.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
