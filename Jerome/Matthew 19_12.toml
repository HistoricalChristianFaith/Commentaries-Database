[[commentary]]
quote='''
He speaks of three kinds of eunuchs, of whom two are carnal, and one spiritual. One, those who are so born of their mother's womb; another, those whom enemies or courtly luxury has made so; a third, those who have made themselves so for the kingdom of heaven, and who might have been men, but become eunuchs for Christ. To them the reward is promised, for to the others whose continence was involuntary, nothing is due.

(cf. Orig. in loc.) Or we may say otherwise. The eunuchs from their mothers' wombs are they whose nature is colder, and not prone to lust. And they that are made so of men are they whom physicians made so, or they whom worship of idols has made effeminate, or who from the influence of heretical teaching pretend to chastity, that they may thereupon claim truth for their tenets. But none of them obtain the kingdom of heaven, save he only who has become a eunuch for Christ's sake. Whence it follows, He that is able to receive it, let him receive it; let each calculate his own strength, whether he is able to fulfil the rules of virginity and abstinence. For in itself continence is sweet and alluring, but each man must consider his strength, that he only that is able may receive it. This is the voice of the Lord exhorting and encouraging on His soldiers to the reward of chastity, that he who can fight might fight and conquer and triumph.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Therefore by eunuchs are by no means to be understood those whom the fiery poet describes, saying (Lucan, Book 10): And the unhappy youth too, maimed by the steel, and cut away from manhood........ But those of whom the Lord speaks in the Gospel: Who have castrated themselves for the kingdom of heaven (Matt 19:12); such were the Apostles too, to whom, when they wondered and said because of the difficulty of the thing, Who then can be saved?, the Savior answered: He who can take it, let him take it. Hence the Apostle too testifies that concerning eunuchs of this kind, that is, concerning virgins, he has no commandment of the Lord, but gives counsel as one who has obtained mercy from the Lord, wishing all to be as himself: For the time, he says, is short: it remains that those who have wives be as though they had none (1 Cor 7:29). For he who has been called free from the bondage and duty of marriage is truly the slave of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
For there are eunuchs who were born so from their mother's womb, and there are eunuchs who were made so by men, and there are eunuchs who castrated themselves for the kingdom of heaven. He who can accept it, let him accept it. There is a threefold kind of eunuchs, two carnal and the third spiritual. Some are those who are born so from their mother's womb; others, those whom captivity makes, or the luxuries of matrons. The third are those who castrated themselves for the kingdom of heaven, who, though they could be men, become eunuchs for Christ. To these the reward is promised; but to the former, for whom chastity is a necessity and not a choice, nothing at all is owed. We can also put it another way: those are eunuchs from their mother's womb who are of a colder nature and do not seek after lust; and others are those made by men, whom either the philosophers make, or who are softened into women for the worship of idols, or who, by heretical persuasion, feign chastity so as to counterfeit the truth of religion. But none of them attains the kingdom of heaven except him who has castrated himself for Christ. Hence he adds: He who can accept it, let him accept it, so that each may consider his own strength, whether he can fulfill the precepts of virginity and purity. For chastity in itself is alluring and draws anyone to itself. But one's strength must be considered, so that he who can accept it, let him accept it. It is the voice of the Lord as of one exhorting and urging his soldiers on to the reward of purity: He who can accept it, let him accept it; he who can fight, let him fight, conquer and triumph.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
