[[commentary]]
quote='''
Behold, I will send many fishers, says the Lord, and they shall fish them; and after this I will send them many hunters, and they shall hunt them from every mountain and from every hill and from the caves of the rocks, for my eyes are upon all their ways. They are not hidden from my face, and their iniquity was not concealed from my eyes. And I will repay first their double iniquities and sins, with which they have defiled my land with the carcasses of their idols and have filled my inheritance with their abominations. The interpretation of this passage is diverse. For the Jews suppose that the Chaldeans are signified, who are described under the name of fishers, and afterwards the Romans, who are compared to hunters and who hunted the unhappy people from the mountains and hills and caves of the rocks. And the Lord says that he himself did this because he looked upon their ways and repaid their iniquities, with which they had defiled the land by venerating images, and had polluted his inheritance with the abominations of idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
