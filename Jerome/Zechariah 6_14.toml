
[[commentary]]
quote='''
Heldai is interpreted the entreaty of the Lord, which in Greek is said more expressively λιτάνευσις κυρίου. Tobijah, good of the Lord. Jedaiah, known of the Lord. In place of Heldai he has now put in the first place Helem, which means dream; and in the fourth place he has added Hen, that is, grace. The crowns of these four men shall be with the son of Zephaniah, whom we read above was Josiah, who is the guardian and warden of the temple of the Lord, and there they shall rest in an everlasting abode. The Hebrews relate that Hananiah, Azariah and Mishael, coming from the captivity, brought gold and silver as gifts for the temple, and the crowns of the high priest and of the leader; and that Hen, whom he had not mentioned above, that is, grace, means Daniel, who came with a gift; and that Helem was put in place of Heldai for this reason, so that from the interpretation of the name, which means dream, it might be shown that Daniel, set in captivity, and the three young men knew the mysteries of the king's dream. For Daniel, taking the three young men with him, prayed to the Lord and obtained the interpretation of the dream. This is how the circumcision tries to expound these things according to the history.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
And the crown, that is, the emblem of victory, once Christ has been crowned, is promised also to those who wait for him, and understand the profit of their former captivity, and know all the mysteries of God, so that they may be for the favor of the son of Zephaniah, that is, of the visitation of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
