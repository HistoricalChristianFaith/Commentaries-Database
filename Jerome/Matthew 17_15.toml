[[commentary]]
quote='''
Lord, have mercy on my son, for he is a lunatic and suffers badly; for he often falls into the fire, and frequently into the water; and I brought him to your disciples, and they could not cure him. For what reason a demon, watching the course of the moon, seizes men and strives through the creatures to defame the Creator, we have said above. But it seems to me that according to tropology the lunatic is he who is changed toward vices from moment to moment of the hours and does not persist in what he has begun, but waxes and wanes, and is now carried into the fire with which the hearts of adulterers are kindled, now into the waters, which cannot extinguish charity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
