[[commentary]]
quote='''
We can also, according to the apostle John — who writes: As you have heard that the Antichrist is coming, but now there are many antichrists; whence we also know that it is the last hour —, call arrogant and proud all heretics and every perverse doctrine of those who claim knowledge for themselves and despise the simplicity of the Church, who bring nothing to completion but take delight in the deaths of very many; and adapt the whole content of the chapter to an understanding concerning them, who truly multiply for themselves what is not their own, and, gathering to themselves as it were very heavy clay and a weighty collar by which they may be dragged to punishment, despoil many nations, and shed the blood of men, and exercise impiety against the Church and against all its inhabitants. But the remaining peoples, namely churchmen, who have not been deceived by their error, will suddenly rise up and awake as from a heavy sleep, and will bite them, and will lay snares for them, and will have them as a prey.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
