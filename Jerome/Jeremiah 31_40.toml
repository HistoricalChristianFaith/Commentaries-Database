[[commentary]]
quote='''
And all, he says, the valley Phagarim — which means of ruins — and the ashes — 'it shall go round' is understood —, so that, although we seem to ourselves to be on hills, we may yet always fear ruins and consider ashes and, repenting, say with David: for I have eaten ashes like bread and mingled my drink with weeping. Whence also it is said to those who lie fallen: does not he who falls rise again?, says the Lord. And the whole, he says, Sademoth, which we render as the region of death, dividing one name into two words: 'sade', which is called 'region', and 'moth', which means 'of death', for which Aquila rendered 'suburbs' or 'fields' and 'countryside'. But the 'region' 'of death' is the region of sinners, and the 'suburbs' the region of pleasures, which goes on to the brook Kidron — where the Lord was betrayed —, which means 'darkness'. See how many places the Church has, and that that apostolic saying: 'that it be without spot and wrinkle', is reserved for the future and for the heavenly places. You hear of corners, you hear of scab, you hear of ruins and ashes and the region of death and darkness, and you boast of your virtue and sinlessness! Then follows: and to the corner of the gate. Here too is a corner, so that no true righteousness, no sure victory may be shown in this world. The corner of the gate itself too, though it is 'eastern', whence the light comes forth, is yet called 'of the horses', to teach us that we need running and contest, and that at last we may deserve to hear with the Lord: you mounted your horses, and your riding is salvation. In the eastern gate, in the gate of the four-horse chariots, is the sanctification of the Lord, so that we may think ourselves perfect then, when we have said to the Lord: the chariot of God is ten-thousandfold, thousands of those rejoicing; the Lord is among them. A building of this kind, which is set upon the foundation of Christ, of which the Apostle too speaks: as a wise architect I laid the foundation, is never pulled down, but will remain in perpetuity. Obscure and difficult things must be discussed more broadly, so that we may run through plain things more briefly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
