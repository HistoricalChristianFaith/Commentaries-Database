[[commentary]]
quote='''
Because the land is filled with adulterers, because before the face of cursing — or of the oath — the land has mourned, the fields — or pastures — of the desert have dried up; their course has become evil and their strength unlike. This, which we have set down from the Hebrew: because the land is filled with adulterers, is not found in the Seventy, who said 'oath' for 'cursing'. And he gives the causes: that because of adulteries and curses, or superfluous swearing, nay rather perjuries, barrenness of the crops followed. Whatever you understand of the land of Judea according to the letter, refer to the congregation of believers, since because of adulteries and lies or perjuries there is in the churches a barrenness of the virtues and gifts of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
