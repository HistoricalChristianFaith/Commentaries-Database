[[commentary]]
quote='''
"Be not
hasty in your spirit to be angry: for anger rests in the lap of fools. "He does not grant here that anger should be tempered,
therefore he now says, "Be not hasty in your spirit to be angry"; but
that when anger is mad and new, it is more easily tempered because it is
dispersed easily and can be removed. And
since anger is linked to pride, and the desire for vengeance, he says it is
better and above suffering, than he who is exalted in his spirit, and now shows
the sign of foolishness, since however powerful or wise someone is esteemed, if
he is made angry he will seem foolish in his words: "for anger lies in the
lap of fools".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"

[[commentary]]
quote='''
Those to whom he had said above: House of Israel, pass over, all of you, and see, from what sort of vices they are bidden to pass over to better things, the following words describe: Who come to the evil day, preparing for themselves by their own vice an evil day; not that any day is evil, but that each one prepares evil for himself, according to what we read in Ecclesiastes: Do not say, The former days were better for me than these, for you do not ask about this in wisdom; for it is foolish to lay it on the times, since it is in our power to make for ourselves either a good day or an evil one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
