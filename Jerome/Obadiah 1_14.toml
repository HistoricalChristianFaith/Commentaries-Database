[[commentary]]
quote='''
And when someone has slipped away, either by flight or by repentance, they stand in the byways and put forward sophisms, and bring out testimonies as if from the Scriptures, in order to offer sewn cushions to the weary and exhausted, and to put them under every elbow of the hand. And so it comes about that those who perhaps either overcame persecution by courage or escaped it through fear are, deceived by perverse doctrines, held again in the prison of errors, and this tribulation becomes far worse than that which came from the nations; for you would more easily free one captured by the heathen than one entangled in the conjuring tricks of the heretics.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
