[[commentary]]
quote='''
And the Lord answered the angel who was speaking in the prophet good words, words of consolation: good concerning the promise of things to come, consoling concerning the need of things present. These things we have given according to the letter, lest we should seem to hide from our own people what we have learned from teachers of a foreign tongue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
In short, the Lord answered good words and words of consolation, which now we see in part and prophesy in part. But when that which is perfect has come, may the things that are in part be done away, and, set free from the Babylon of this world, may we cry out: When the Lord turned back the captivity of Zion, we became as those consoled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
