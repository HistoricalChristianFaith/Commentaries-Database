[[commentary]]
quote='''
Now let us discuss what has been written by churchmen in their commentaries. They understand the golden lampstand of purest gold as the Church, which in the holy Scriptures searches out the sense and the mind rather than the words. And that gold is taken to mean the sense is shown by the back and shoulders of the dove in Psalm 67 (68), which are said to shine with the green or the gleam of gold. The lamp they too understand as Christ himself, because he shines in the Church, he who said of himself: No one lights a lamp and puts it under a bushel, that is, under the measure of the law, but upon a lampstand, that is, the freedom of the Gospel, so that it may give light to all who are in the house. The seven lamps and their pourers they too understand as the graces of the Holy Spirit, through which the Church receives the oil of the mercy of God and of all the virtues. The two olive trees upon the lampstand they too understand as Moses and Elijah, who were talking with the Lord on the mountain and signifying what he was to suffer in Jerusalem. For the whole law and the prophets proclaim the passion of Christ. Others interpret the two olive trees on the right and on the left as the law and the Gospel, so that the Gospel is on the right and the law on the left; of which right and left it is said in the Song of Songs: His left hand is under my head, and his right hand shall embrace me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
