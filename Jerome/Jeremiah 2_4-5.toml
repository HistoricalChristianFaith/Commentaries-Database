[[commentary]]
quote='''
Hear the word of the Lord, house of Jacob and all the families of the house of Israel. Thus says the Lord: What iniquity did your fathers find in me, that they went far from me and walked after vanity and became vain? Another prophet too testifies to this sense: My people, what have I done to you, and how have I been troublesome to you? Answer me; for I brought you out of the land of Egypt and freed you from the house of servants. Now both names — Israel too — are set down, not according to the two and ten tribes, but for the whole people, since Jacob himself too was afterwards called Israel. And he traces the offense from the fathers, not so that the sins of the fathers are imputed to the sons, but so that the sons too, having the likeness of their fathers, are punished both for their own crime and for their parents'. We often read that God has mercy on sons for the sake of holy fathers. Now the fathers of the sinful people forsook God — and not briefly, but for a long time — and instead of God followed vanity, namely idols, which profit their worshipers nothing, and they became like them, according to that which is written: Let those who make them become like them, and all who trust in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
