[[commentary]]
quote='''
And after this, says the Lord, I will give Zedekiah, king of Judah, and his servants and his people, and those who have been left in this city from the plague and the sword and the famine, into the hand of Nebuchadnezzar, king of Babylon, and into the hand of their enemies, and into the hand of those who seek their life; and he shall strike them with the edge of the sword, and he shall not be moved, nor spare, nor have mercy. This, which we translated: into the hand of Nebuchadnezzar, king of Babylon, and into the hand of their enemies, is not found in the Seventy; and for what we said: he shall not be moved, nor spare, nor have mercy, the Seventy translated: I will not spare, nor have mercy. And it is better according to the Hebrew, so that the cruel and inflexible sentence may seem to belong to the Babylonian king rather than to the Lord. First, then, prophecy was made concerning the whole city; now it is foretold particularly to Zedekiah and to his people, those who would be left after the plague, the sword and the famine, that he is to be captured by Nebuchadnezzar, the Babylonian king, and to be slain with his friends by the sword, and that he should hope for no mercy from him whose covenant and bond he had abandoned by perjury.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
