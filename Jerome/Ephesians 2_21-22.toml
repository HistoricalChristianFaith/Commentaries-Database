[[commentary]]
quote='''
But if the whole building, fitted together, grows into a holy temple in the Lord, we must strive with all our labor to become those stones of which it is written: Holy stones are rolled upon the earth (Zech. 9:16). And when we have become living stones, hewn on every side, smooth, polished, having no roughness, let us be built into a temple and become a dwelling place for God. And let there be set up within us the ark of the covenant, keeper of the Law of the Lord, and the Cherubim, the multitude of knowledge; and let the inner parts of our breast pass over to a new name, and let us be called DABIR (דביר), which we can call "oracle" or "response", or, to render the word more strictly word for word, call λαλητήριον, that is, "speaking-place": so that we may break out with the Apostle into the words: Or do you seek a proof of Christ who speaks in me? (2 Cor. 13:3). But the whole building constructed upon the foundation of the apostles and prophets can signify not only us but also the heavenly virtues, so that all alike may become a dwelling place of God in the spirit: for they say it is incongruous that a building of men, compacted and harmonious, should grow into a holy temple in the Lord and become a dwelling place of God in the spirit, while the angels and all the blessed virtues that serve God in the heavenly places should be thought strangers to this happiness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
