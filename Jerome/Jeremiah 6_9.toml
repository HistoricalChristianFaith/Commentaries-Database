[[commentary]]
quote='''
Thus says the Lord of hosts: Even to the last cluster they will glean, as in a vineyard, the remnant of Israel; turn back your hand like a grape-gatherer to the basket! LXX: For thus says the Lord of powers: Glean, glean as in a vineyard the remnant of Israel; return like a grape-gatherer to his basket! Some take these words in a good sense, others in a bad. In the good sense: 'When Jerusalem has been laid waste, let the remnant be saved'. In the bad, thus: 'Let not even one cluster and small bunch of grapes remain in the vineyard; let everything be gathered; and whatever you find, throw into the basket like a grape-gatherer, so that, as he drags the clusters to the winepress, so you may drag the captives to Babylon'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
