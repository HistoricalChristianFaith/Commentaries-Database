[[commentary]]
quote='''
And all this is done so that those who saw it might understand that Jerusalem would again be inhabited and the fields possessed; and although they ought to have understood this by themselves without Jeremiah's word, yet they are admonished by the words of the Lord, and it is said to them: thus says the Lord of hosts, the God of Israel: houses and fields and vineyards shall yet be possessed in this land. This is what Jeremiah had said a little before: I understood that it was the word of the Lord; and for that reason he bought a field which he was not going to possess.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
