[[commentary]]
quote='''
And the priests and the prophets spoke to the princes and to all the people, saying: There is a judgment of death for this man, because he has prophesied against this city, as you have heard with your ears. While the princes of the city, who had run from the king's palace to the temple so that the riot of the people might be calmed, were sitting in the gate of the temple and in the new gate, and an assembly of the people had been gathered, the priests and false prophets accuse him; and the prophet would have perished, as far as it lay with the priests and prophets, if the accusers themselves had had the power of judgment. From this we understand that those who seemed devoted to religion were crueler toward the prophet, through envy of his holiness, than those who presided over public needs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
