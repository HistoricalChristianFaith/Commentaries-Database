[[commentary]]
quote='''
Nor shall you too look down on his misfortunes on the day of his devastation, and you shall not be sent out against his army on the day of his devastation.

Nor shall you stand at the exits to slay those who have fled; and you shall not shut in his remnant on the day of tribulation. LXX: And you also shall not look down on their gathering on the day of their destruction, nor shall you be added to their strength on the day of their destruction, nor shall you stand at their outlets to slay those who have been saved; nor shall you shut in their fugitives on the day of tribulation. When you yourself have been captured and destroyed by the ravaging Babylonian, among the other things that you have done, do not do these that follow. You shall not look down on, nor despise, your brother Jacob on the day of his devastation, nor shall you be added to the Babylonian army, or, you shall not be sent out against the army of Judah when, overcome by its adversaries, it has turned its back. And when they begin to flee by the ways known to them, and the byways, and the paths leading to the wilderness, you shall not stand at the fork in the road, nor wait for them as they come at the crossroads, to slay those who have been set free, and to shut up others whom you have seized, and either take them captive yourself or keep them for captivity by the enemy. This we have said according to the history: for we ought to pluck briefly at the plainer matters and press on to those that are obscure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
