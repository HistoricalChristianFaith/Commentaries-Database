[[commentary]]
quote='''
Otherwise; It is the manner of Scripture to speak of events as they were commonly viewed at the time by all. So Joseph is called by Mary herself the father of Jesus; so here Herod is said to be sorry, because the guests believed that he was so. This dissembler of his own inclinations, this contriver of a murder displayed sorrow in his face, when he had joy in his mind. For his oath's sake, and them which sat with him at meat, he commanded it to be given. He excuses his crime by his oath, that his wickedness might be done under a pretence of piety. That he adds, and them that sat at meat with him, he would have them all sharers in his crime, that a bloody dish might be brought in in a luxurious feast.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the king was saddened. It is the custom of the Scriptures that the historian narrates the opinion of many in the way it was believed by all at that time. Just as Joseph is called the father of Jesus even by Mary herself, so now too Herod is said to have been saddened, because those reclining at table thought so. For this dissembler of his own mind and skilled murderer displayed sadness on his face while he had joy in his mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
But because of the oath and of those who were reclining with him, he ordered it to be given. He excuses the crime by the oath, so that under the pretext of piety he might become impious. And as for what he added, and because of those who were reclining with him, he wants all to be partners in his crime, so that bloody dishes might be served at a luxurious and impure banquet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
