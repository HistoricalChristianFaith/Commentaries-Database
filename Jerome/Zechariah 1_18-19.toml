[[commentary]]
quote='''
These four kingdoms which overthrew Judea Zechariah writes that he saw in four horns, the angel saying to him: These are the horns which have scattered Judah and Israel and Jerusalem. And again: I lifted up, he says, my eyes and saw; and behold, four chariots coming out from between two mountains, and the mountains were mountains of bronze; in the first chariot, red horses; and in the second chariot, black horses; and in the third chariot, white horses; and in the fourth chariot, dappled, strong horses. And when the prophet had said to the angel who spoke in him: What are these, my lord? The angel answered: These are the four winds of heaven, which go forth to stand before the ruler of all the earth; and the sense is: These are they who go forth from the face of the Lord, to fulfill his will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
And I lifted up my eyes and saw. And behold, four horns; and I said to the angel who spoke in me: What are these? And he said to me: These are the horns that have winnowed Judah, and Israel and Jerusalem. And the Lord showed me four smiths, and I said: What are these coming to do? He spoke, saying: These are the horns that have winnowed Judah man by man, and none of them lifted up his head, and these came to terrify them, to cast down the horns of the nations which have lifted up the horn over the land of Judah, to scatter it. LXX: And I lifted up my eyes and saw. And behold, four horns, and I said to the angel who spoke in me: What are these, Lord? And he said to me: These are the horns that have scattered Judah, and Israel, and Jerusalem. And the Lord showed me four smiths, and I said: What are these coming to do? And he said: These are the horns that have scattered Judah, and have broken Israel, and none of them lifted up his head, and these have gone out to sharpen them in their hands. The four horns are nations that have lifted up the horn over the land of the Lord, to scatter it. That the four horns which winnowed and scattered Judah, and Israel, and Jerusalem are four nations, the Babylonians, the Medes and Persians, and the Macedonians and the Romans, both the Lord now explains when questioned by the prophet, and Daniel unfolds most fully, who in the vision of the image that had a golden head, and a silver breast, and a bronze belly, and legs and feet of iron and of clay, interpreted these four nations. And again in another vision, by four beasts, a lioness and a bear, and a leopard, and another horrible beast whose name he did not set down, he showed the same nations under another figure. That the Medes and Persians were one kingdom after the victory of Cyrus no one will doubt who has read both secular and sacred literature. And most rightly he has put horns for kingdoms, since holy Scripture has this custom, that it always signifies a kingdom by horns, as in that verse: And he exalted the horn of his Christ. And in another place: And he has raised up a horn of salvation for us in the house of David his servant. And the same prophet Daniel testifies to ten horns that are to reign at the last. At the time, then, when this vision was seen, the kingdom of the Babylonians had already passed away, that of the Persians and Medes was at hand, and that of the Greeks and Macedonians, and of the Romans, was yet to come. What the Babylonians, what the Medes and Persians, what the Greeks, that is, the Macedonians, did to Judah and Israel and Jerusalem, a learned man knows, above all under Antiochus, surnamed Ἐπιφανεῖ (Epiphanes), under whom the history of the Maccabees is woven. After the coming of the Lord and Savior as well, when Jerusalem was besieged, what the Israelites suffered both the Gospel foretells and Josephus, the native writer of the Jewish history, teaches most fully.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
But that the prophet says he lifted up his eyes is to be fitted to the spiritual sense: I lifted up my eyes to the mountains, from where my help shall come, and: Lift up your eyes, and see the regions, for they are already white for harvest, and what we read in Isaiah: The Holy One said: Lift up your eyes, and see who has shown all these things. There is need, therefore, of the lifting up of the eyes and of spiritual understanding, that we may see the opposing powers which have lifted up their horn against us, and of which the Apostle speaks: Our wrestling is not against flesh and blood, but against principalities, against powers, against the rulers of this world, of this darkness, against the spiritual forces of wickedness in the heavenly places. These four adversaries, who were always fighting against the saints, Christ crushed at his coming. And of these the psalmist says over again: You shall walk upon the asp and the basilisk, and you shall trample the lion and the dragon. We can also take the four horns, which reigned against the people of God, as the four πάθη (passions), which learned men, not rendering them word for word κακοζήλως (with misplaced zeal) as passions, translate as perturbations: distress and gladness of mind, two present, and two future, fear and desire, of which the illustrious poet also gives indication:

Hence they fear and desire, grieve and rejoice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
