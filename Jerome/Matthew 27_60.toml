[[commentary]]
quote='''
He is laid in a new tomb, lest after His resurrection it should be pretended that it was some other who had risen when they saw the other bodies there remaining. The new tomb may also signify the virgin womb of Mary. And He was laid in a tomb hewn out of the rock, lest had it been one raised of many stones, it might have been said that He was stolen away by undermining the foundations of the pile.

That a great stone was rolled there, shows that the tomb could not have been reopened without the united strength of many.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he laid it in his own new tomb, which he had hewn in the rock, and he rolled a great stone to the door of the tomb and went away. He is laid in a new tomb, lest after the resurrection, while the other bodies remained, it should be pretended that another had risen. But the new sepulcher can also signify the virginal womb of Mary; and the stone set against the door, and a great stone at that, can show that the sepulcher could not have been opened without the help of many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
