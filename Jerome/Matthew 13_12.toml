[[commentary]]
quote='''
Or, To the Apostles who believe in Christ there is given, but from the Jews who believed not on the Son of God there is taken away, even whatever good they might seem to have by nature. For they cannot understand any thing with wisdom, seeing they have not the head of wisdom.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He who has, it will be given to him, and he will abound; but he who does not have, even what he has will be taken from him. It is not by an equality of judgment that something is added to those who have, and that from those who do not have even what they seem to have is taken away; rather, to the apostles, who have faith in Christ, something is granted, even if they have somewhat fewer virtues, while from the Jews, who did not believe in the Son of God, it is taken away, even if they possess something through the good of nature. For those who do not have the head of wisdom cannot understand anything wisely.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
