[[commentary]]
quote='''
Because, therefore, you have done these things, behold, I will raise up against you, O great house and lesser house, which are to be struck with ruins and rents; that is, O house of Israel and all the twelve tribes, the most savage nation of the Assyrians and Chaldeans, to crush and overthrow you from beginning to end, from head to tail; from the borders of your land which look toward the sun, to the torrent of the desert, or of the west, as the LXX translated, that is, from Hamath to Rhinocorura, between which and Pelusium the stream of the Nile, or the torrent coming from the wilderness, enters the sea. We said above that Hamath is Epiphania, which took its name from Antiochus, whose surname was Ἐπιφανὴς (Epiphanes). But those who think that the house of Israel here signifies the ten tribes will not be able to explain how it can be said in a threat against the ten tribes that they are to be crushed from Epiphania to the borders of Egypt, within which borders not the ten tribes only, but all twelve are enclosed, among which were also Judah and Benjamin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
Because of these great sins and the utmost pride, which speaks iniquity against God and sets its mouth on high, the Lord God Almighty says that he will raise up a most savage nation, to crush and grind them down, or rather to forbid them to enter into Hamath, and as far as the torrent of the west. Hamath means wall, or walled. They were therefore forbidden by this most savage nation, to which the punishments had been entrusted, to flee for refuge to the fortified city, which is the heavenly Jerusalem, lest they enter and be saved; after the manner of that section which we read in Genesis, where God placed the Cherubim and the flaming sword which turns to guard the way of the tree of life, so that he who had been cast out of paradise might by no means enter there unworthy. And what follows: As far as the torrent of the west, we shall interpret from the sixty-seventh (68th) psalm, in which it is written: Sing to the Lord, sing a psalm to his name; make a way for him who ascends above the sunset. The Lord is his name. For unless evil works have set in us, Christ will not ascend above us. And when they have set, and we have Christ as our charioteer, then, as we advance and go on to better things, it will be commanded us in the same psalm: Sing to God, sing psalms to the Lord, who ascends above the heaven of heaven toward the east. Hence also in the mysteries we first renounce him who is in the west, and who dies to us together with our sins, and so, turned toward the east, we enter into a covenant with the sun of righteousness and promise that we will serve him. For the torrent of the west, Symmachus translated a valley of the plain, Theodotion the torrent of Arabia, Aquila the torrent which is in the level ground. By these words it is shown that those who are shut out from the walled city can by no means be fortified against sins, nor do they reach the torrent of the plain and the level ground, or of the desert, which is called the torrent of pleasure, according to what we read: You will give them to drink from the torrent of your pleasure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
