[[commentary]]
quote='''
Matthew, also called Levi, apostle and aforetimes publican, composed a gospel of Christ at first published in Judea in Hebrew for the sake of those of the circumcision who believed, but this was afterwards translated into Greek though by what author is uncertain. The Hebrew itself has been preserved until the present day in the library at Caesarea which Pamphilus so diligently gathered. I have also had the opportunity of having the volume described to me by the Nazarenes of Beroea, a city of Syria, who use it. In this it is to be noted that wherever the Evangelist, whether on his own account or in the person of our Lord the Saviour quotes the testimony of the Old Testament he does not follow the authority of the translators of the Septuagint but the Hebrew. Wherefore these two forms exist "Out of Egypt have I called my son," and "for he shall be called a Nazarene."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FLives%2520of%2520Illustrious%2520Men.html'
source_title="Lives of Illustrious Men, Chapter 3"

[[commentary]]
quote='''
(Epist. 57.7.) This is not in the LXX; but in Osee according to the genuine Hebrew text we read; Israel is my child, and I have loved him, and, from Egypt have I called my Son; where the LXX render, Israel is my child, and I have loved him, and called my sons out of Egypt.

(In Osee 11:2.) The Evangelist cites this text, because it refers to Christ typically. For it is to be observed, that in this Prophet and in others, the coming of Christ and the call of the Gentiles are foreshewn in such a manner, that the thread of history is never broken.

Let those who deny the authenticity of the Hebrew copies, show us this passage in the LXX, and when they have failed to find it, we will show it them in the Hebrew. We may also explain it in another way, by considering it as quoted from Numbers, God brought him out of Egypt; his glory is as it were that of a unicorn. (Num. 23:22.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
That what was spoken by the Lord through the prophet might be fulfilled, saying: Out of Egypt I have called my son. Let those who deny the truth of the Hebrew volumes answer where this is read in the LXX translators. And when they have not found it, we shall tell them that it is written in the prophet Hosea, as the copies too can prove which we have lately published. But we can also relieve this passage in another way, for the sake of the contentious, whose custom the apostle Paul denies that he or the Church of Christ has; and we bring forward a testimony from Numbers, where Balaam says: God has called him out of Egypt, his glory is like that of the unicorn.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Where we have said: Out of Egypt I called my son, the Seventy translated: Out of Egypt I called his sons, which is not found in the Hebrew; and no one doubts that Matthew took his testimony from this place according to the Hebrew truth. Therefore let those who disparage our translation produce the scripture from which the evangelist took this testimony and interpreted it of the Lord Savior, when he was brought back from Egypt into the land of Israel. And when they cannot find it, let them stop wrinkling the forehead, knitting the brow, curling the nose and snapping their fingers. The emperor Julian, in the seventh volume of what he vomited forth against us, that is, against the Christians, slanders this place, and says that what was written of Israel the evangelist Matthew transferred to Christ in order to mock the simplicity of those of the Gentiles who had believed. To him we will answer briefly: first, that Matthew published his Gospel in Hebrew letters, which none could read except those who were of the Hebrews. Therefore he did not do it in order to mock the heathen. But if he wished to mock the Hebrews, he was either foolish or unskilled: foolish, if he invented an open lie; unskilled, if he did not understand of whom these things were said. The volume itself clears him of folly, since it is composed prudently and in order; unskilled we cannot call him, whom we know from other testimonies of the Scriptures to have had knowledge of the law. It remains for us to say that the things which go before τυπικῶς (typologically) in others are referred to Christ according to truth and fulfillment; which we know the Apostle did with the two mountains, Sinai and Zion, and with Sarah and Hagar. For it is not that Sinai is not a mountain and Zion is not; that Sarah did not exist and Hagar did not exist, because the apostle Paul referred these to the two covenants. So, therefore, this which is written: Israel was a little child, and I loved him, and out of Egypt I called my son, is indeed said of the people of Israel, which is called out of Egypt, which is loved, which at that time, after the error of idolatry, was called as an infant and a little child; but it is perfectly referred to Christ. For Isaac too was a type of Christ, in that he himself carried the wood of his coming death; and Jacob, in that he had as wives Leah, sore of eye, and Rachel, the beautiful. In Leah, who was the elder, we understand the blindness of the Synagogue, in Rachel the beauty of the Church; and yet those who were in part types of the Lord Savior are not to be believed to have done in his type all the things they are related to have done. For a type indicates a part; if it went before as a whole in the type, it would no longer be a type, but ought to be called the truth of history. These things we have said briefly, as is fitting in commentaries; now let us return to the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
