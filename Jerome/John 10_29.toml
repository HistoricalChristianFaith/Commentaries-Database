[[commentary]]
quote='''
It is asked: if, when God seizes, carries off and holds, no one can snatch from his hands, according to what is written: No one can snatch out of the hand of my Father, how was Judas snatched from the hand of God by his betrayal? To which we will briefly answer that no one can snatch from the hand of God; but that he who is held can, by his own will, fall out of the hand of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
