[[commentary]]
quote='''
For this reason it is also written in Leviticus: 'Every animal that divides the hoof and chews the cud is clean.' That is, if it has two hooves and chews the cud, it is clean. If therefore it has one hoof, it is not clean. The Jew has one hoof, and therefore is unclean. The Manichaean has one hoof, and therefore is unclean. And because it has one hoof, it does not chew over its food, and what it has once sent down into the belly it brings back up again to the throat, and chews it, and makes it fine, so that what had been coarse may be sent down again fine into the belly — this, indeed, pertains to the speaking of the divine mysteries. Every animal that divides the hoof and chews the cud is clean. The Jew has one hoof: for he believes in only one testament, and does not chew the cud. For he reads only the letter, and considers nothing, seeks nothing within. But the churchman divides the hoof and chews the cud, that is, he believes in both testaments, and in both testaments he often searches; and whatever lies hidden in the letter, he brings forth in the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_023.html'
source_title="Homily 23, on Psalm 95"
