[[commentary]]
quote='''
Matthew, also called Levi, apostle and aforetimes publican, composed a gospel of Christ at first published in Judea in Hebrew for the sake of those of the circumcision who believed, but this was afterwards translated into Greek though by what author is uncertain. The Hebrew itself has been preserved until the present day in the library at Caesarea which Pamphilus so diligently gathered. I have also had the opportunity of having the volume described to me by the Nazarenes of Beroea, a city of Syria, who use it. In this it is to be noted that wherever the Evangelist, whether on his own account or in the person of our Lord the Saviour quotes the testimony of the Old Testament he does not follow the authority of the translators of the Septuagint but the Hebrew. Wherefore these two forms exist "Out of Egypt have I called my son," and "for he shall be called a Nazarene."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FLives%2520of%2520Illustrious%2520Men.html'
source_title="Lives of Illustrious Men, Chapter 3"

[[commentary]]
quote='''
Had he meant to quote a particular text, he would not have written 'Prophets,' but 'the Prophet.' By thus using the plural he evidently does not take the words of any one passage in Scripture, but the sense of the whole. Nazarene is interpreted 'Holyd,' and that the Lord would be Holy, all Scripture testifies. Otherwise we may explain that it is found in Isaiah (c. 11:1.) rendered to the strict letter of the Hebrew. There shall come a Rod out of the stem of Jesse, and a Nazarene shall grow out of His rootse.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For root, which the Seventy alone translated, in the Hebrew there is written (גזע) GEZA, which Aquila and Symmachus and Theodotion interpreted as κορμὸν, that is, trunk. And for flower, which in Hebrew is called (נצר) NESER, they translated sprout, to show that long after the time of the Babylonian captivity, when no one of David's stock possessed the glory of the ancient kingdom, Mary arose as if from a trunk, and Christ from Mary. That saying in the Gospel of Matthew of which all churchmen seek, and do not find, where it is written, For he shall be called a Nazarene (Matt 2:23), the learned among the Hebrews think was taken from this place. But it must be known that this NESER is written with the letter SADE, whose peculiar quality and sound, between z and s, the Latin tongue does not express. For it is a hissing sound, and is uttered with clenched teeth, barely, by the pressure of the tongue: and with it the city Zion too is written. Further, Nazirites, whom the Seventy translated sanctified, Symmachus separated, are always written with the letter ZAIN (ז).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
And coming he dwelt in a city that is called Nazareth, that what was spoken through the prophets might be fulfilled: For he shall be called a nazarene. If he had set down a fixed example from the Scriptures, he would never say: what was spoken through the prophets, but simply: what was spoken through the prophet; but as it is, by naming the prophets in the plural, he shows that he took from the Scriptures not the words but the sense. Nazarene is interpreted holy. And that the Lord would be holy, all Scripture records. We can also say otherwise, that it is written in Isaiah even in the same words according to the Hebrew truth: A rod shall go forth from the root of Jesse, and a nazarene shall rise up from the root.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
