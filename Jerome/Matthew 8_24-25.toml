[[commentary]]
quote='''
Of this miracle we have a type in Jonah, who while all are in danger is himself unconcerned, sleeps, and is awakened.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But he was sleeping. And they came and woke him, saying: Lord, save us. The type of this sign we read in Jonah, when, while the others are in peril, he himself is untroubled and sleeps, and is woken, and by the command and mystery of his passion frees those who woke him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
