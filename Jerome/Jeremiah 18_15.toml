[[commentary]]
quote='''
For my people has forgotten me, making libations in vain and stumbling in their ways, in the paths of the age — or everlasting —, so that they walked in them on a road not trodden. He who forgets God and forsakes him who says: I am the way, and pours libations to strange gods, stumbles in his own ways — not God's at all, but his own — and forsakes the ancient and everlasting paths, which are trodden by the footprints of all the saints who worship God. These, however, have walked on a road not trodden and, having abandoned the worship of God, have venerated idols; on account of which the punishment that follows is brought upon them:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
