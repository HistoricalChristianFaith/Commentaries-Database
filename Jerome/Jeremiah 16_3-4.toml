[[commentary]]
quote='''
But why the prophet is kept from marrying a wife, the reason is plain: because with the siege close at hand all were to perish by pestilence and sword and famine, and the number of the dying would be so great that the duty of burial would be overwhelmed, and the corpses would lie like dung to be torn by birds and beasts. And this too must be noted, that to waste away through sicknesses and long infirmity is the wrath of God. Hence Joram also, the son of Jehoshaphat, is consumed by infirmity, and the Apostle teaches that those who have violated holy things fall sick and waste away and die.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
