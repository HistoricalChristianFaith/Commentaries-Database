[[commentary]]
quote='''
Observe the order of these injunctions. He bids the Apostles first to teach all nations, then to wash them with the sacrament of faith, and after faith and baptism then to teach them what things they ought to observe; Teaching them to observe all things whatsoever I have commanded you.

He then who promises that He will be with His disciples to the end of the world, shows both that they shall live for ever, and that He will never depart from those that believe.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Teaching them to observe all things whatever I have commanded you. A notable order. He commanded the apostles first to teach all the nations, then to dip them in the sacrament of faith, and after faith and baptism to enjoin what was to be observed. And lest we think that what was commanded is light and little, he added: all things whatever I have commanded you, so that those who have believed, who have been baptized in the Trinity, may do all things that have been commanded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
And behold, I am with you all days, even to the consummation of the age. He promises that he will be with the disciples even to the consummation of the age, and shows both that they will always live and that he will never withdraw from those who believe. But he who promises his presence even to the consummation of the world is not ignorant of that day on which he knows he will be with the apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
