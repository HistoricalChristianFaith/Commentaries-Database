[[commentary]]
quote='''
From the thirteenth year of Josiah son of Amon, king of Judah, up to this day, this is the twenty-third year, the word of the Lord has come to me, and I have spoken to you, rising by night and speaking; and you have not listened. In the thirteenth year of the reign of Josiah, who reigned in Jerusalem thirty-one years, Jeremiah began to prophesy, and he prophesied under him for nineteen years. His son Jehoahaz succeeded him in the kingdom; and when he was at once led into captivity by Neco, the Egyptian king, his brother Jehoiakim obtained the kingdom, in the fourth year of whose reign this word of the Lord comes to Jeremiah. And so it was the twenty-third year of Jeremiah the prophet since he began to speak to the people, and he never ceased to preach, but every day, rising at dawn and by night, he spoke to the people; and you have not, he says, listened. But if, as the new heretics sprung from the old would have it, the law was given once for all as a help, and precepts were established which we either do or do not do by the volition of our own free will, how is it that the prophet always presses himself upon them and daily repeats the commandments of God, which, once received, would surely have sufficed for those to whom they had been given, unless it is to show that we always need God's help, and that what has been given once can never suffice unless it is renewed daily by the Lord's admonition?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
