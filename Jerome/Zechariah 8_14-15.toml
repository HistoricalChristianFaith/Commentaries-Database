[[commentary]]
quote='''
The cause of the strengthening is the Lord's promise: For thus says the Lord Almighty, to whom nothing is impossible, who is able to fulfil what he promises: As I devised to afflict you and to hand you over to captivity, because your fathers provoked me to anger, and I did not have mercy, which the LXX translated οὐ μετενόησα, that is, I did not repent, which in Hebrew is written ulo naamathi; but I did not have mercy, so that I might correct you by captivity and train you through every torment and scourge; so now, in the present time, I have purposed to do good to Jerusalem and to the house of Judah. And it is to be noted that when he is angry, the house of Judah and the house of Israel, that is, all twelve tribes which were handed over to captivity, are a curse among the nations. But after he has purposed to do good, he does not do it to Judah and Israel, that is, to the two and the ten tribes, namely to Jerusalem and Samaria, Oholah and Oholibah; but, leaving Israel in captivity, he does good to Jerusalem and to the house of Judah. And he adds at the end: Do not fear, or take courage, in the sense which we have explained above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
