[[commentary]]
quote='''
Or surely we can suspect that the Apostle, at the time when he first came to the Galatians, was sick; and that, though held back by some infirmity of his poor body, he nevertheless did not cease nor hold back his voice in silence from preaching the Gospel he had begun. For they relate that he often suffered a most severe pain of the head, and that this is the angel of Satan who was set upon him to buffet him in the flesh, lest he be lifted up. This infirmity and this sickness of the body was a temptation for those to whom the Gospel was proclaimed: whether they would despise him who promised sublime things, whom they saw subject to the sicknesses of the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
