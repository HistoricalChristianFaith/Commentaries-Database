[[commentary]]
quote='''
We do not read that the Lord was wont to discourse to them by night, or to deliver his doctrine in the dark; but He said this because all His discourse is dark to the carnal, and His word night to the unbelieving. What had been spoken by Him they were to deliver again with the confidence of faith and confession.

Otherwise; What you hear in mystery, that teach in plainness of speech; what I have taught you in a corner of Judæa, that proclaim boldly in all quarters of the world.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
What I say to you in darkness, speak in the light, and what you hear in the ear, preach upon the housetops. What you have heard in mystery, preach more openly; what you have learned in secret, speak publicly; what I have taught you in a little place of Judea, say boldly in all the cities and in the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
