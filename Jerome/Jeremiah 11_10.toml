[[commentary]]
quote='''
And he says that both fathers and sons, with one mind and an equal resolve, neglecting God, worshiped idols, namely both Israel and the house of Judah, that is, both the ten tribes and the two, whose rule was in Jerusalem, so that those who had one zeal in contempt of God may have an equal punishment in enduring captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
