[[commentary]]
quote='''
Also they shake off the dust as a testimony of the Apostles' toil, that in preaching the Gospel they had come even so far, or as a token that from those that rejected the Gospel they would accept nothing, not even the necessaries of life.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And whoever does not receive you nor hear your words, going outside, out of the house or the city, shake off the dust from your feet. The dust is shaken from the feet as a testimony of their labor, that they entered the city and the apostolic preaching reached even to them; or else the dust is shaken off so that they may accept nothing, not even what is necessary for food, from those who have spurned the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
