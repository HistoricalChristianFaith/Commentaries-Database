[[commentary]]
quote='''
It is said also to the heretics, that they should not exult and rejoice and think themselves like the other nations. For those did not believe in God; but these, under the name of God, worship idols and play the harlot away from their God; and they multiply for themselves many threshing floors and countless winepresses, and they eat the wheat from which the bread of mourning is made, and drink the wine of Sodom, which is trodden out with the gall of asps. And because they prepare for themselves many winepresses and many threshing floors, therefore they will not eat from the true and only threshing floor, nor drink from the winepress which the Lord Jesus trod; but whatever they think they have will be corrupted by falsehood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
