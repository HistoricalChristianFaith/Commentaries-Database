[[commentary]]
quote='''
The Apostles, on entering a strange town, could not know of each inhabitant what sort of man he was; they were to choose their host therefore by the report of the people, and opinion of the neighbours, that the worthiness of the preacher might not be disgraced by the ill character of his entertainer.

One host is chosen who does not so much confer a favour upon him who is to abide with him, as receive one. For it is said, Who in it is worthy, that he may know that he rather receives than does a favour.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Into whatever city or village you enter, inquire who in it is worthy, and stay there until you leave. Concerning the ordination of a bishop and a deacon Paul says: Moreover they must also have a good testimony from those who are outside. The apostles, entering a new city, could not know who was of what sort. Therefore the host is to be chosen by the report of the people and the judgment of the neighbors, lest the dignity of the preaching be disfigured by the ill repute of the one who receives them. Though they ought to preach to all, one host is chosen, not conferring a benefit on him who is going to stay with him, but receiving one. For the words who in it is worthy are said so that he may know that he is receiving grace rather than giving it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
