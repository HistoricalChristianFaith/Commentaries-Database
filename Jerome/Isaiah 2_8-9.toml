[[commentary]]
quote='''
And its land is filled with idols; they have worshiped the work of their own hands, what their fingers have made; and man has bowed himself down, and the man has been humbled. Where once was the Temple and the worship of God, there the statue of Hadrian and the idol of Jupiter were set up. Which many interpret of that testimony which we read in the Gospel: But when you see the abomination of desolation standing in the holy place (Mark 13:14). And they bowed down to the work of their hands, and man, a rational animal, worshiped bronze and stone. But there are those who interpret these things of the Jews, that before they were taken by the Babylonians they did all these things, and were therefore abandoned by God. Hence at the end of the chapter too is set: Do not, therefore, forgive them. We can say this too according to the anagogy, that every doctrine contrary to the truth worships the works of its own hands and sets up idols in its land, and man bows down and the man is humbled and cannot raise himself up, because he is bound by the devil, unless the Lord raises him up, after the example of that woman whom Satan had bound for eighteen years, so that she could by no means look at the sky but always at the earth (Luke 13).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
