[[commentary]]
quote='''
For as impiety dreads the coming of the great God, so piety, secure about its work and about its faith, awaits him. Where is Arius the serpent? Where Eunomius the snake? The great God Jesus Christ is called Savior; not the firstborn of every creature, not the Word of God and wisdom, but Jesus Christ: names which belong to the man assumed. Nor indeed do we call Jesus Christ one and the Word another, as a new heresy falsely charges: but the same one, both before the ages and after the ages, both before the world and after Mary, nay rather from Mary, we call the great God, our Savior Jesus Christ, who gave himself for us, that with his precious blood he might redeem us from all iniquity, and cleanse for himself a people περιούσιον (for so it stands in the Greek) and make it an emulator of good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
