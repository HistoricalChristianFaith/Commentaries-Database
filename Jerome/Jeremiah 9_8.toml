[[commentary]]
quote='''
Their tongue is a wounding arrow, it has spoken deceit; with his mouth he speaks peace with his friend and secretly lays snares for him. Shall I not visit upon these things, says the Lord, or on such a nation shall my soul not take vengeance? Every heretic who wounds the hearts of his hearers, of those who do not know what is written: keep your heart with all watchfulness, possesses a wounding arrow and speaks in deceit, and while with his mouth he promises peace to his neighbor, he secretly sets snares.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
