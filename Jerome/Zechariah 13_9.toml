[[commentary]]
quote='''
And that this third part too might not be soft, and its confession careless, it is led through fire and tested like silver and gold, the fire which the Lord too longs to blaze in believers and Paul desires to be fervent. Hence the apostles too, baptized in the Spirit and in the fire of the Lord, speak in the psalm: For you have tested us, O God; you have tried us with fire as silver is tried. And a little after: We passed through fire and water, and you brought us out into refreshment. And in another place it is said to the believer: If you pass through fire, the flame shall not burn you, because I am with you. And the reason the fire does not consume and the flame does not devour is this: For the voice of the Lord cuts through the flame of fire. When the little ones, over whom the Lord turned his hand, have been tested in this way, and through their calling the whole throng of the nations has believed, then the people of believers will call Christ by his name, and when he says: You are my people, the people will answer: You are the Lord my God. The Jews refer these things to Christ and contend that they will come to pass in the last time, but the difference between us and them is this: we say that they have already been fulfilled, they speak of them as yet to be fulfilled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
