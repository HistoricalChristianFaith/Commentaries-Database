[[commentary]]
quote='''
Since these things are so, you too, O Judah, imitate your parent: weep and beseech the Lord of hosts, and turn to him. Keep mercy and judgment, and when you have done both, hope in your God always, advancing by good works to greater things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Therefore, O churchman, you who are called Judah, and confessing, turn daily through repentance to your Lord; and if perhaps you have sinned, imitate the prophet who says: I have labored in my groaning; every night I will wash my bed, I will water my couch with my tears. And let it not suffice to have said this, but keep the commandments of God, show mercy to others, that you yourself may obtain mercy. Judge true judgment, so that in what you judge, judgment may be passed on you. And hope in your God always, or draw near to your God continually, so that, advancing in virtue at all times, you may draw near to your God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
