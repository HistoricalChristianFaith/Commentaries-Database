[[commentary]]
quote='''
There is no good for a man except that he eat and drink and show his soul good in his labor. And indeed this I saw, that it is from the hand of God. For who will eat, and who will spare, without him? for to the man who is good before him he has given wisdom and knowledge and joy, and to the one who sins he has given anxiety, to increase and to gather what may be given to the good man before the face of God. But this too is vanity and presumption of spirit. After I had treated of everything and had perceived that nothing is more unjust than for one man to enjoy another's labor, then it seemed to me that this is the most just thing in the world, and as it were a gift of God: that a man should enjoy his own labor, drinking and eating, and, as occasion requires, sparing the wealth he has gathered. For indeed it is a gift of God that a just man should be given such a mind that he himself consumes what he has acquired with cares and watchings. Just as, on the contrary, it belongs to the wrath of God against the sinner that he should gather wealth day and night and, never using it, leave it to those who are just in the sight of God. But this too, he says, as I looked at it carefully and saw that all things are ended by death, I judged most vain. So much, for now, according to the letter, lest we should seem to pass over the simple sense entirely and, while we pursue spiritual riches, to despise the poverty of the history.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
