[[commentary]]
quote='''
On the contrary, blessed is the land of the Church, whose king is Christ, the son of the freeborn, descending from Abraham and Isaac and Jacob, and from the stock of the prophets also and of all the saints, over whom sin did not have dominion; and therefore they were truly free. From them was born a virgin freer still, holy Mary, having no shrub, no shoot from her side; but all her fruit burst forth into a flower, which speaks in the Song of Songs: I am the flower of the field and the lily of the valleys. Its princes too are the apostles and all the saints, who have as king the son of the freeborn, the son of the free woman, begotten not of the handmaid Hagar, but of the freedom of Sarah. Nor do they eat in the morning, nor in haste. For they do not seek pleasure in the present world, but they will eat in their own time, when the time of retribution has come, and they will eat in strength, and not in confusion. Every good of the present world is confusion; every good of the world to come is everlasting strength. Something of this kind is said in Isaiah too: Behold, those who serve me will eat; but you will be hungry. And again: Behold, those who serve me will rejoice; but you will be ashamed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
