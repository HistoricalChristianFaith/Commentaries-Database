[[commentary]]
quote='''
Then after three years I came to Jerusalem to see Peter.

Not to look at his eyes, his cheeks and his face, whether he was lean or stout, whether his nose was hooked or straight, and whether hair covered his forehead or (as Clement relates in the Periodi of Peter) he had a bald head. Nor do I think it would have befitted apostolic gravity that, after so great a preparation of three years, he should have wished to look at something human in Peter. But he looked at him with those eyes with which he too is now seen in his Epistles. With those eyes Paul saw Cephas with which Paul himself is now beheld by all the wise. But if anyone does not see it so, let him join all these things with the earlier sense: that the apostles conferred nothing on him. For the fact that he appears to have gone to Jerusalem means that he went there in order to see the apostle, not from a desire to learn, since he himself had the same author of his preaching, but to pay honor to the earlier apostle.

And I remained with him fifteen days. He who had prepared himself for so long a time to see Peter did not need much instruction. And although to some it may seem superfluous to observe even the numbers that are in the Scriptures, yet I think it not beside the point that the fifteen days during which Paul stayed with Peter signify full knowledge and perfected doctrine. For there are fifteen songs in the Psalter, and fifteen steps by which they go up to sing to God, and by which the righteous man goes up to stand in his courts. Hezekiah too, when a span of fifteen years of life was granted him, deserves to receive a sign on the steps (Isa. 38); and the solemn feasts of God begin from the fifteenth day (Exod. 12). Moreover (since we follow a twofold understanding), he sets down fifteen days for this reason: to show that it was not a long time in which he could have learned anything from Peter, so that everything may be referred back to the sense with which he began: that he was taught not by man but by God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
