[[commentary]]
quote='''
Will not pains seize you like a woman in labor? But if you say in your heart: Why have these things come upon me? Because of the multitude of your iniquity your more shameful parts have been uncovered, your soles have been polluted — or have been dishonored —. 'While you do not know it, as a sudden childbirth seizes a woman, so a sudden captivity will seize you. But if you wish to complain and ask why you have been handed over to enemies, hear plainly that the multitude of your iniquity has done these things to you, so that, as of a harlot woman whose garments have been lifted, your ignominy has been uncovered and your fornications have been shown in public'. By these things we learn that, so long as sins are lesser, God acts patiently and waits for our repentance; but if we choose to join offenses to offenses and to make a heap of sins, our shameful parts will be uncovered and our soles will be shown to all, either in the present age or in the future. For there is nothing hidden that will not be made manifest, when that word of Daniel will be fulfilled: These shall rise to eternal life and those to reproach and to everlasting confusion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
