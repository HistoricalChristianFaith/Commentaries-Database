[[commentary]]
quote='''
Be converted, returning sons — or wandering and departing —, says the Lord, for I am your husband — or I will be lord over you —, and I will take you, one from a city and two from a kindred, and I will bring you into Zion, and I will give you shepherds according to my heart, and they will feed you with knowledge and doctrine. And when you have been multiplied and have increased in the land in those days, says the Lord, they will no longer say: the ark of the covenant — or testament — of the Lord; nor will it come up upon the heart, nor will they remember it, nor will it be visited, nor will it be made any more. The Jews think that this was fulfilled after the return from Babylon under Cyrus, king of the Persians, and Zerubbabel son of Shealtiel, even though not all returned; that this is what is signified by: I will take one from a city and two from a kindred. But it is better taken of the coming of Christ, when the remnant was saved, as the Apostle says and explains: unless the Lord of Sabaoth had left us seed, we would have been as Sodom and would have been like Gomorrah; then they were brought into Zion, of which it is written: glorious things are spoken of you, city of God, and shepherds were given according to his heart, the apostles and apostolic men, and they fed the multitude of believers not in Jewish ceremonies, but in the knowledge and doctrine of Christ, and with the preaching of the Gospel sown in the whole world. They will by no means have confidence in the ark of the Lord, which was the guardian of the Mosaic law, but they themselves will be the temple of God; nor, like the erring Nazarenes, will they serve sacrifices that have been abolished, but they will pursue a spiritual worship. Others, however, understand this of the end of the times, when, as the fullness of the Gentiles comes in, all Israel will be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
