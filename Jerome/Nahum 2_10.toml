[[commentary]]
quote='''
She has been scattered and torn and rent apart, and the heart is melting, and there is a loosening of the knees and a failing in all the kidneys, and the faces of all are like the blackness of a pot. LXX: A shaking out, a shaking out again, and a boiling up, and a breaking of heart and a loosening of knees, and pains upon every loin, and the faces too of all like the scorching of a pot. Under the metaphor of a captive woman, Nineveh is described as scattered, torn, rent: her heart melting, her knees loosened, and her kidneys broken, and the faces of all her inhabitants, through terror of the enemy and the greatness of their fear, appear scorched like pots, wasted, and disfigured with pallor. Moreover, according to the LXX we must understand at a higher level what shaking out, shaking out again signifies. He who is of the people of God and, being a man, has at some time sinned, and returns to his former state, is told, as Jerusalem is: Shake off the dust, and rise up, O Jerusalem. And of him who is such that, after he has been shaken out, he deserves to pass into the arrows of God and to be drawn by the Lord against the enemies, it is sung: As arrows in the hand of the mighty, so are the sons of the shaken out. And when his footprints, as of one walking upon the earth, have been sprinkled with dust, he will hear from the Savior: Shake off the dust of your feet for a testimony to them, no doubt meaning those who refused to receive the preachers. But he who is of Nineveh, which has been weighed down above all the vessels of her concupiscence, is shaken out not once but often. And after he has been shaken out again, and his surface has been cleansed — lest any filth remain within —, there comes to him also a boiling up, which in Greek is more expressively called ἐκβρασμὸς; for ἐκβρασμὸς is properly used of things of this kind, when what lay hidden within breaks out upon the surface. Hence also the pimples which arise on the lips after an illness are called ἐκβράσματα, and it seems a sign of health that the disease has broken out onto the surface. And not only is this remedy applied to Nineveh, that she be shaken out frequently and the hidden sickness be forced to come out of her vitals, but a breaking of heart and a loosening of the knees are also foretold, so that, just as the hard and stony heart of Pharaoh was broken, which, as long as he had it, would not let the people of God go, so the broken heart of Nineveh too may be softened and changed into one of flesh, and the stiff knees which before were not bent to God may be loosened and bow to God, from whom all fatherhood in heaven and on earth is named, and in the name of Jesus every knee should bow, of those in heaven, on earth and in the underworld. So that, after they have come to know their creator, they may hear: Be strengthened, you loosened hands, and make strong the feeble knees. And pains, he says, upon every loin. We have already said above that sexual union is signified by the loin, and that all the works which pertain to intercourse are shown by the name of the kidneys. Great, therefore, will be the pains in the kidneys at the consummation, because all the strength of the dragon is in the loins; and in return for all these things on account of which there came before the shaking out, the shaking out again, the boiling up, and the breaking of heart, the loosening of knees, the pains of the kidneys, the face of all will be like the scorching of a pot, so that it is either close to fire and burning, or, losing the sheen of oil, grows black like coals and is covered with eternal confusion, from which the saint is far removed when he says: The light of your countenance, O Lord, is sealed upon us. For with unveiled face he beholds the glory of God. And I think that, just as other is the glory of the sun, other of the moon, other of the stars, and star differs from star in brightness, so in the resurrection of the dead there will be a great distance both of brightness among the saints and of blackness among the sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Nahum.html'
source_title="Commentary on Nahum"
