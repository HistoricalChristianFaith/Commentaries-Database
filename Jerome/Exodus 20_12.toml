[[commentary]]
quote='''
[The Lord] declares that [this commandment] is to be interpreted not of mere words, which while offering an empty show of regard may still leave a parent's wants unrelieved, but by the actual provision of the necessaries of life. The Lord commanded that poor parents should be supported by their children and that these should pay them back when old for those benefits which they had themselves received in their childhood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_123.html'
source_title="LETTER 123.6"

[[commentary]]
quote='''
For God said: Honor father and mother, and whoever curses father or mother, let him die the death. But you say: Whoever says to father or mother: Whatever gift is from me will profit you; and he has not honored his father or his mother. Honor in the Scriptures is understood not so much in greetings and the paying of courtesies as in alms and the offering of gifts. Honor, says the Apostle, widows who are truly widows, and here honor is understood as a gift; and in another place: Presbyters are to be honored with double honor, especially those who labor in the word and teaching of God. And by this commandment we are bidden not to close the mouth of the ox that treads out the grain, and that the laborer be worthy of his wages. The Lord, considering either the infirmities or the ages or the poverty of parents, had commanded that sons should honor their parents also by supplying them with the necessities of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
And at the same time we shall also press hard the heretics, who will not have it that the Old Testament belongs to the good God whose Son Christ is: by what reasoning does the Apostle of Christ, the Son of the good God, use the Scripture of the Creator, and take for granted the obedience of children from the old Law? This testimony, taken from Exodus, is worded thus there: Honor your father and your mother, that it may be well with you, and that you may be long-lived upon the land which the Lord your God will give you (Exod. 20:12); from which he has now removed the last words; and this commandment is the fifth in the Decalogue. Hence it must be asked why he has now said, which is the first commandment, when the first commandment is: You shall have no other gods besides me. For this reason some read it thus: which is the first commandment in promise, as if the four other commandments, which were spoken before, had no promises, and in this one alone a pledge were set down attached to it: that it may be well with you, and that you may be long-lived upon the land which the Lord your God will give you. But they seem to me not to have observed carefully enough that in the second commandment too a promise is joined. For he says: You shall not make for yourself an idol, nor any likeness of the things that are in heaven above, and that are on the earth beneath, and that are in the waters under the earth: you shall not worship them, and you shall not sacrifice to them: for I am the Lord your God, a jealous God, who repay the sins of the fathers upon the children to the third and fourth generation, to those who hate me, and I show mercy to thousands, to those who love me and keep my commandments (Exod. 20:5-6). For observe that these are the words of a pledge: Showing mercy to thousands, to those who love me and keep my commandments. Perhaps, then, because the Decalogue was given as the first Law to the people going out of Egypt, each commandment of the Decalogue is to be called the first commandment, by comparison with those precepts which were afterwards written down in the Law. But he who will try to hold the former exposition, in that he had divided the words, which is the first commandment in promise, will say that the commandment stands separately: Honor your father and your mother; and that afterwards the promise is set in its own place: that you may be long-lived upon the land which the Lord your God will give you. But in this commandment, that is: You shall not make for yourself an idol, nor any likeness, he will say that not separately, but in one context and discourse, it is not so much that a promise was given as that the sentence ended in the praises of God, who shows mercy to thousands, to those who love him and keep his commandments. Again, he who contends that all the commandments of the Decalogue are the first commandment will show that the promise in which it is written: that you may be long-lived upon the land which the Lord your God will give you, pertains not only to those who obey their parents, but also to countless other precepts; and he will have to unroll all the commandments in which this reward and prize is promised, that they may be long-lived upon the land which the Lord their God has given them. From him the interpreter who differs will have to demand that he show that those things which he has brought forward were written as commandments before this commandment. And if he cannot prove this, he will mention in vain that this promise is attached in other precepts too. After this it must be considered again that for honoring father and mother the promise is not a Jewish and carnal one, that the children should be long-lived upon the land which the Lord their God has given them. For we must believe that there have been many who, though obedient to their parents, died quickly, and who, though impious toward their parents, came to extreme old age. For let the Jews, and those like the Jews, answer: if the length of this life is among the things promised, and to remain long in the body is happiness, what does that saying in the Psalms mean: Woe is me, that my sojourning has been prolonged! I have dwelt with the dwellers of Kedar (Ps. 119:5)? And this of Solomon in Ecclesiastes: I praised all the dead who died long ago, above the living who live up to the present; and better than these two is he who is not yet born, and has not seen all the evil work that has been done under the sun (Eccles. 4:2, 3); and a little after: If a man begets a hundred, and lives many years, and many are the days of his years, and his soul is filled with good things, and he has no burial, I said: better than he is the abortive, because it came in vanity, and its name will be covered in darkness; and indeed it has not seen the sun (Eccles. 6:3-5), and the rest. For if the dead are praised above the living (and according to certain people who think that souls dwell in the heavenly places before they descend into these bodies, he who is not yet born is said to be better than both, and this whole life is a temptation; and according to Job: The death of a man is rest (Job 3:23); and according to the same man and Jeremiah, Cursed is the day on which we are born (Jer. 20:14)), how is it now promised to those who honor father and mother that they shall be long-lived upon the land which the Lord their God has given them? The land, therefore, must be sought which the Lord promises and grants to those who have left the spiritual Egypt, and with all patience have crossed the great and terrible deserts of this life, and have conquered great kings, whom the Lord strikes; and have crossed over into Judea, which flows with milk and honey, and under the leadership of Jesus, with Jericho falling and Ai laid waste, which is interpreted "precipice," have come to Jerusalem, and a temple is built for them under Solomon, the peaceful king (Josh. 6; 8), and they possess the land which has been prepared for the gentle: for Blessed indeed are the meek, since they shall possess the land (Matt. 5:4), which is truly the land of the living, as the Psalmist also says: I believe that I shall see the good things of the Lord in the region of the living (Ps. 26:13). The length of this life wisdom too holds in her right hand, holding in her left riches and glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
