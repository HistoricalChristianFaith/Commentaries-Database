[[commentary]]
quote='''
[The Lord] declares that [this commandment] is to be interpreted not of mere words, which while offering an empty show of regard may still leave a parent's wants unrelieved, but by the actual provision of the necessaries of life. The Lord commanded that poor parents should be supported by their children and that these should pay them back when old for those benefits which they had themselves received in their childhood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_123.html'
source_title="LETTER 123.6"

[[commentary]]
quote='''
For God said: Honor father and mother, and whoever curses father or mother, let him die the death. But you say: Whoever says to father or mother: Whatever gift is from me will profit you; and he has not honored his father or his mother. Honor in the Scriptures is understood not so much in greetings and the paying of courtesies as in alms and the offering of gifts. Honor, says the Apostle, widows who are truly widows, and here honor is understood as a gift; and in another place: Presbyters are to be honored with double honor, especially those who labor in the word and teaching of God. And by this commandment we are bidden not to close the mouth of the ox that treads out the grain, and that the laborer be worthy of his wages. The Lord, considering either the infirmities or the ages or the poverty of parents, had commanded that sons should honor their parents also by supplying them with the necessities of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
