[[commentary]]
quote='''
He is drawing a comparison, therefore, between the law and the gospel. Farther, he says: "I have baptized you with water," that is, the law; "but he will baptize you with the Holy Spirit," that is the gospel.
'''
source_url=''
source_title="HOMILY 76"

[[commentary]]
quote='''
No baptism can be called perfect except that which depends on the cross and resurrection of Christ.
'''
source_url='https://www.newadvent.org/fathers/3005.htm'
source_title="THE DIALOGUE AGAINST THE LUCIFERIANS 7"

[[commentary]]
quote='''
For what is the difference between water and the Holy Ghost, who was borne over the face of the waters? Water is the ministry of man; but the Spirit is ministered by God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He will baptize you in the Holy Spirit and fire. Either because the Holy Spirit is fire, as the Acts of the Apostles teach, at whose descent there sat as it were fire upon the tongues of the believers, and the word of the Lord was fulfilled who said: I came to send fire upon the earth, and how I wish that it may burn; or because in the present we are baptized with the spirit and in the future with fire, the Apostle too agreeing with this sense: The fire will test what sort each one's work is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
