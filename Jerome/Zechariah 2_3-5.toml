[[commentary]]
quote='''
And behold, the angel who spoke in me was going out, and another angel was going out to meet him, and he said to him: Run, speak to this boy, saying: Jerusalem shall be inhabited without a wall, because of the multitude of men and cattle in its midst. And I will be to it, says the Lord, a wall of fire round about, and I will be in glory in its midst. LXX: And behold, the angel who spoke in me was standing, and another angel was going out to meet him, and he said to him, saying: Run and speak to that youth, saying: Jerusalem shall be inhabited fruitful from the multitude of men and cattle in its midst. And I will be to it, says the Lord, a wall of fire round about, and I will be for glory in its midst. The angel who spoke in the prophet, and was standing, or, as is read in the Hebrew, was going out, for that is what iasa means, the Hebrews think to be Michael. And the other angel, who was going out and coming to meet him, they suppose to be Gabriel, who speaks to Michael so that he may tell the prophet how great an abundance of all things, and multitude of men and cattle, and strength of walls Jerusalem shall have, which at present seems destroyed down to embers and ashes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
