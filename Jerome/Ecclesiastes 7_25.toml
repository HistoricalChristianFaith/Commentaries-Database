[[commentary]]
quote='''
I went around, I and my heart, to know, and to consider, and to seek wisdom and reckoning, and to come to know the impiety of the fool and the error of the imprudent. And I find more bitter than death the woman who is a snare, and her heart nets, her hands bonds. He who is good before God will be rescued from her, and the sinner will be caught in her. For what the Seventy put: I went around, I and my heart, to come to know, Symmachus rendered, saying: I passed through all things with my mind, to know, and to discuss, and to investigate. Since, then, Ecclesiastes had said above that he had tried all things in wisdom, and that the more he sought her, the farther she had fled from him, he now says that he also sought something else in his wisdom: what evil in human affairs surpasses all evils, and what thing holds the first place in impiety, folly, error and madness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
