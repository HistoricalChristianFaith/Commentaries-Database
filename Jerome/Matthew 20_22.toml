[[commentary]]
quote='''
By the cup in the divine Scriptures we understand suffering, as in the Psalm, I will take the cup of salvation; (Ps. 116:13, 15.) and straightway He proceeds to show what is the cup, Precious in the sight of the Lord is the death of his saints.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But Jesus answered and said: You do not know what you are asking. The mother makes the request, and the Lord speaks to the disciples, understanding that her prayers came down from the will of her sons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Can you drink the cup that I am to drink? By the cup in the divine Scriptures we understand the passion: Father, if it is possible, let this cup pass from me; and in the psalm: What shall I render to the Lord for all that he has rendered to me? I will take the cup of salvation and call upon the name of the Lord; and at once he adds what this cup is: Precious in the sight of the Lord is the death of his saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
