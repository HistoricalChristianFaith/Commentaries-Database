[[commentary]]
quote='''
Proclaim this among the nations, sanctify war, rouse the strong. Let them approach, let all the men of war go up. Beat your ploughshares into swords, and your mattocks into spears. Let the weak say, I am strong. Burst out and come, all you nations round about, and gather yourselves together; there the Lord will cause your strong ones to fall. LXX: Proclaim these things among the nations, sanctify war, rouse the fighters, bring them up and go up, all you men of war. Beat your ploughshares into swords, and your sickles into spears. Let the strong say, I prevail. Gather yourselves together and come in, all nations round about; and gather yourselves there; let the gentle one be a warrior. This passage is understood in two ways. For some think that these things are proclaimed to the holy nations, that they may be prepared for war and fight for the people of God, that they may turn all the instruments of husbandry into swords and spears, that the weak may say he is strong, and all may come from round about and be gathered into the Lord's contest; above all because, according to the LXX, there follows: Let the gentle and meek one be a warrior, according to what is written in Chronicles: And beyond the Jordan, of Reuben and Gad and the half tribe of Manasseh, with all the instruments of war, one hundred and twenty thousand; all these men of war ready for battle with a peaceful mind; these, they will have it, are the imitators of the true David, of whom we read: Remember, O Lord, David and all his gentleness. And he himself says in the Gospel: Learn from me, for I am humble and meek, or gentle. They also want those to be understood as men who, putting away the beginnings of little children, have come to the strength of mature age, and have turned all the zeal with which they formerly worked the fields of their souls to the need of battle. But to us, following the opinion of the Hebrews, it seems to be the opposite. For the nations hostile to Israel are made ready for battle, and change their ploughshares and mattocks, or sickles, into swords and spears, and the weak says he is strong, and they burst out and come from round about, and gather together against the army of the Lord, for this purpose: that the Lord may cause their strong ones to fall, and that they may understand that they have been overcome because God opposed them. These things wretched Israel promises itself according to the letter. We, following the tropology we have begun, can take them both of the nations of demons, and of those who daily fight against the Church, and in the end of those who under the Antichrist are going to fight against the saints of the Lord, who are gathered together for this purpose, that they may perish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
