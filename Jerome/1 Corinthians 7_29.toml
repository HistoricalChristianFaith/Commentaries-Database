[[commentary]]
quote='''
To Jeremiah, because captivity was to overtake Jerusalem after a short time, it is commanded that he not take a wife, that he not beget sons. Hence to us also it is said through the Apostle: the time has been shortened; it remains that those who have wives be as though they had none. But if, because of the narrowness of the time, the use of wives is taken away from those who have them, how much more is it commanded to those who do not have them that they not take them!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
