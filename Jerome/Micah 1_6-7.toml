[[commentary]]
quote='''
But since we have once understood Samaria as the church of the heretics, which, separated from God, has become a conventicle of the people, the Lord himself threatens that he will make her a watch-hut for fruit, a field and a planting of a vineyard. For it is much better that a useless city be overthrown, and the stones with which it had been built be pulled down headlong, and that it be prepared for an orchard and a planting of vineyards, than that it remain in a most wicked building. For when her foundations have been destroyed and laid bare, — those by which she seemed to conceal her mysteries and to have firm doctrines on which she stood; and when all the idols which seemed to have outward show, and a beauty composed by artful speech, have been cut to pieces by the ministers of God, that is, by churchmen —, then in the place of the most wicked building the various fruits of the Church will spring up, and not only will they spring up, but they will also be guarded, and the vine of Sorek will be planted, from which may come the wine which the Lord promised that he would drink in the kingdom of the Father. And not only will her foundations, which before were pressed down by earth, be opened and brought out into the open, and the idols which she had fashioned for herself be cut to pieces, but the glory too and the riches which she seemed to have from her fornication and her error will be consumed by my fire, of which I said in the Gospel: I came to cast fire upon the earth, and how I wish that it may burn, and they will be burned up and reduced to nothing, because they were not acquired from the truth of doctrines, but from the fornication of the soul, and were collected from error here and there. For the heretics do not have riches coming from a paternal inheritance, but every day they find something to worship, and fashion idols for themselves with an artful hand and a curious mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
