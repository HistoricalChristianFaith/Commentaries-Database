[[commentary]]
quote='''
Behold, siegeworks have been built against the city, that it may be taken, and the city has been given into the hands of the Chaldeans who fight against it, before the face of the sword and of famine and of pestilence; and whatever you have spoken has come to pass, as you yourself see; and you say to me, Lord God: Buy the field for silver and call witnesses, when the city has been given into the hand of the Chaldeans? It was the tenth year of King Zedekiah; for so it is written: the word that came to Jeremiah from the Lord in the tenth year of Zedekiah, king of Judah; then the army of the king of Babylon was besieging Jerusalem, and Jeremiah the prophet was shut up in the court of the prison. And rightly it is now said: 'behold, siegeworks have been built against the city, that it may be taken, and the city has been delivered into the hand of the Chaldeans, and they have no one to conquer, only people to capture; for they have already been consumed by sword, famine and pestilence, and whatever you said we see fulfilled; how then do you say to me, Lord: buy the field for silver and call witnesses, when the city has been given into the hand of the Chaldeans?' Therefore he does not reproach but asks, and wishes to learn not so much for himself as for the others who were sitting in the court of the prison and perhaps were silently reproaching him, how the same prophet, whom they believed to announce the truth, both says that the city is to be taken and buys a field as though he were going to possess it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
