[[commentary]]
quote='''
She is weakened — or has cast away or has been made empty —, who bore seven — or very many —, her soul has fainted; the sun has set for her while it was still day — or midday —; she is confounded and has blushed. And her remnant I will give to the sword in the sight of their enemies, says the Lord. We have often said that the Hebrew word 'saba' means either 'seven' or 'oath' or 'very many'. Hence the translation also differs, Aquila, the Seventy and Theodotion translating 'seven', Symmachus 'very many'. She, then, who was rich in children was suddenly made childless, and perished in broad daylight, and was confounded in her own desolation. 'But the remnant of the people', he says, 'I will hand over to the sword, so that no one may escape death and the wrath of God'. Others refer it to the synagogue, which was weakened so that the multitude of the Church might grow, according to what is written: The barren has borne seven — or very many — and she who had many children has been weakened. Hence also there has set for her the sun of righteousness, in whose wings is healing, and therefore she is covered with eternal confusion, losing her people by the spiritual sword.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
