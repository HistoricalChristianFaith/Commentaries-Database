[[commentary]]
quote='''
Hear this word, which I raise over you as a lament. The house of Israel has fallen; it will not again rise. The virgin Israel is cast down into her land; there is no one to raise her up. LXX: Hear this word, which I will take up over you as a lament. The house of Israel has fallen; it will not any more rise again. The virgin Israel is cast down upon her land; there is no one to raise her up. As far as concerns the order of the letter and the truth of the history begun, the ten tribes, which are called Israel, once led into captivity, by no means returned afterwards to their own land. And the people of Israel is called a virgin, not because it remained in the purity of virginity, but because it was once joined to the Lord like a virgin. Hence the prophet is also commanded to take up a lament over it, because it will by no means be restored to its former rank. But as far as concerns the spiritual understanding, the prophet takes up a lament over every Israel which used to discern God with the mind and afterwards ceased to serve him, according to that which is commanded to Ezekiel, that he should devour the book in which there was written, both within and without, lamentation, and song, and woe. Understand by within the Song of Solomon that follows, who says: The king has brought me into his chamber. And the forty-fourth (45th) psalm, in which it is written: All the glory of the king's daughter is within. But without is whatever is read in the letter, and is seen in the bark, and is not held in the marrow of the spirit. And so, both according to the letter and according to tropology, in all the books of the prophets a lament is written over those who repent after sins; a song over those who, stained by no filth of sins, are worthy of canticle and praise; woe over those who do not repent, but according to the hardness of their heart treasure up for themselves wrath in the day of wrath.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
