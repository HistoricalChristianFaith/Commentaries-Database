[[commentary]]
quote='''
"Who will stand with me against those who work iniquity?" Beautifully did he say, "Who will stand with me?" For unless the Lord stand with us, who lay in his passion, unless he rise up who slept in death, we cannot overcome our adversaries. For this reason Stephen, doing battle against the assaults of the Jews, sees Jesus standing at the right hand of the Father. He saw him standing, because he was fighting on behalf of his martyr.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_071.html'
source_title="Homily 71, on Psalm 93 (Alternate Series)"
