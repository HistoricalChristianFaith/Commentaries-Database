[[commentary]]
quote='''
I, who am the founder of all things, knew you, or fed you, in the wilderness and in an uninhabitable land, where there is want of all things, where there are no waters; I gave you manna from heaven, and brought forth springs of water from the hardest rock. And they, according to what is written elsewhere: The beloved grew fat, became thick, grew broad, and kicked, now also have eaten and been satisfied, and have lifted up their heart, and have forgotten him whose benefits they ought to have remembered. For through so great a waste of desert, where not only no crops and trees and vines, but not even grass is produced, and no waters temper the heat of the sun, Israel could not for forty years have reached the land of the Jordan, unless the Lord had provided everything.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
He himself knew them and fed them in the land of solitude, so that they could say: The Lord pastures me and I shall lack nothing; in a place of pasture there he has set me, he has brought me up beside the water of refreshment. And he gave them the bread of angels, manna from heaven, which they had never eaten in Egypt, and water from the rock that followed them. Now the rock, according to the Apostle, is Christ; and they ate and were filled, and did not endure the food of the Lord. To them the same Apostle says: Already you are satisfied, already you have become rich; without us you reign, and would that you did reign, so that we too might reign with you. For they ate in the holy Scriptures the bread that came down from heaven, and said with David: The uncertain and hidden things of your wisdom you have made manifest to me. And being filled and satisfied, they lifted up their heart against the Creator, and invented another god for themselves, ascribing whatever they had drunk and eaten to their own merits, not to the mercy of God. Therefore they forgot God, who had commanded them to bind the words of the law between their eyes and on their hands, and on the fringes of their cloaks, so that they might never forget their God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
