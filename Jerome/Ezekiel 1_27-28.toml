[[commentary]]
quote='''
And I saw as it were the appearance of electrum, like the look of fire, within it round about, from his loins and upward; and from his loins downward I saw as it were the appearance of fire shining round about, like the look of the bow when it is in the cloud on the day of rain: this was the look of the brightness round about. This is the vision of the likeness of the glory of the Lord. The likeness of the man who sat upon the likeness of the throne (the throne which had the likeness of sapphire stone) is compared from the loins and upward to electrum, and this electrum had both within and without as it were the look of fire. But from the loins and downward there was fire shining round about, to show that the things which are above the loins, where perception and reason dwell, have no need of fire or of flames but of the most precious and purest metal; whereas the things that are from the loins downward, where intercourse is, where generation is, where the incitements of the vices are, need the purgation of flames, so that, once they have been purged, they may have the likeness of the bow, which is commonly called iris, when it is in the cloud on the day of rain — for the ἴρις [rainbow], which in Holy Scripture is called the bow, and in the Revelation of John is called by the same name ἴρις, cannot appear except in rain and in a watery cloud, being of diverse and most beautiful colors that pass gradually into one another; whence the poet too says: It snatches a thousand varied colors from the light opposite; and the same poet also, following the usage of the common people: When the bow, he says, drinks, by which he signifies that the bow never appears except in a cloud and in waters —. This bow is the sign of the clemency of God and of the covenant which he made with men, so that, whenever it appears in the cloud, we may know, according to the example of antiquity, that we shall by no means perish by a flood. From this it is shown that after penalties and torments and the purgation of sins there will be mercy, at least for those who have deserved to see God reigning. Hence it is said: This was the look of the brightness round about, round about God, or the throne, or all things that are perfect; and this is the vision of the glory of the likeness of God: not that he saw the glory of the Lord, but the likeness of his glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
