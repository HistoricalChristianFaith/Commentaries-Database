[[commentary]]
quote='''
But let us interpret the heavenly Jerusalem as the Church, which, walking in the flesh, does not live according to the flesh, and whose citizenship is in heaven. For after the Lord Jesus has become king over all the earth, of whom the Holy Spirit speaks to the Father through the prophet: O God, give your judgment to the king, and your justice to the king's son, then there shall be one Lord, of whom it is written: Know that the Lord himself is God. And his name one, every perverse religion having been trampled down, according to what the prophet sings: O Lord, our Lord, how wonderful is your name in all the earth, and again: You have magnified your holy name above all, and elsewhere: As your name, O God, so also your praise over all the earth; of which Habakkuk too speaks: The earth is full of his praise. Of the glory of this name God himself speaks: Without me you shall not know God, and besides my name, which has been magnified above all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
