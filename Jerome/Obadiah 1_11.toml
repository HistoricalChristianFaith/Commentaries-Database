[[commentary]]
quote='''
But this too shall be a cause of torment: for when strangers were laying waste the army of Jacob and were entering through its gates into Jerusalem, once peaceful, and were casting lots in order to divide its spoils among themselves, you were one of the enemy. We read it, we have seen it, we prove it daily: when persecution arises against the Church, the Jews and the heretics become far worse persecutors of the Christians than the heathen. We can call the foreigners entering the gates of Jerusalem λογισμοὺς, that is, the most wicked thoughts, and we can interpret the gates of Jerusalem, that is, of the soul that is at rest and sees God, as the five senses, through which the enemies enter and divide the spoils of Jerusalem. If we have looked upon a woman to lust after her, death has entered through our windows. If we have taken in through our ears a lie and a judgment of blood, the enemy has entered through another gate. Smell also, taste and touch: if one of them has been captured either by various scents, or by sweet foods, or by soft embraces, the adversaries have entered through other gates, and they divide the spoils of wretched Jerusalem. At that time, therefore, when anyone has fallen from the Church through the onslaught of persecution and through deadly pleasures, we may see the heretics exult, the Jew rejoice and be one of the persecutors, and them reckoned in the number of the heathen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
