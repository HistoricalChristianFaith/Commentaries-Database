[[commentary]]
quote='''
What this tree of life is, Solomon explains more plainly, who, discoursing of the wisdom of God, says: It is a tree of life to all who come to it, and for those who lean upon it, it is as firm as upon the Lord (Prov 3:18); nor is there doubt that it signifies the Word of God, who is himself the way and wisdom, and says of himself: I am the life (John 11:25). And of whom the Prophet sings: In wisdom you have made all things: the earth is filled with your creation (Ps 103 [104]:24); and the apostle Paul: Christ the power of God, and the wisdom of God (1 Cor 1:24).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
We read also in Solomon, if it please anyone to receive the book, for there he speaks of wisdom (Christ, the power of God and the wisdom of God): therefore where Solomon says 'It is a tree of life to all who lay hold of her,' there it is said of wisdom. But if wisdom is the tree of life, and wisdom itself is Christ: you see, then, that he who is the blessed and holy man is compared to this tree, that is, to wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_001.html'
source_title="Homily 1, on Psalm 1"
