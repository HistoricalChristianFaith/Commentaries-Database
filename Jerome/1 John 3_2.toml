[[commentary]]
quote='''
So therefore we too, who love God, and for whom have been prepared the things that eye has not seen, nor ear heard, nor have they ascended into the heart of man (1 Cor. 2), when we have been transformed from the body of lowliness into the body of the glory of the Lord Jesus Christ, shall have that body which neither the Jew could cut, nor the Gentile keep with its foreskin. Not that it is something other according to substance, but that it is different according to glory. "For this mortal must put on immortality, and this corruptible be clothed with incorruption" (1 Cor. 15:53). Perceiving something similar to this, the blessed evangelist John also spoke: "Dearly beloved, now we are sons of God: and it is not yet manifest what we shall be. We know that if it is made manifest, we shall be like him: because we shall see him as he is" (1 John 3:2). Since, then, that body of the glory of Jesus Christ has not yet been made manifest — the body which both had the marks of the nails after the resurrection and entered through closed doors — let us, who even now in baptism have risen again with Christ, reborn into the new man, serve neither circumcision nor uncircumcision, but let us believe that even now we are what we shall be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
