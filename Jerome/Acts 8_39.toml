[[commentary]]
quote='''
By Spirit here we ought to understand the angel who was the leader of the people of Israel, according to what is written: Who makes his angels spirits, and his ministers a burning fire (Ps 103 [104]:4). And in the Epistle to the Hebrews: These are ministering spirits, sent forth to serve for the sake of those who are to possess salvation (Heb 1:14). Let us consider whether what is written in the Acts of the Apostles, The Spirit of the Lord caught away Philip, and the eunuch saw him no more (Acts 8:39), ought to be taken of an angel. There are some who maintain that the angel did these things in the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
