[[commentary]]
quote='''
For the flesh lusts against the spirit, but the spirit against the flesh. For these are opposed to one another, so that you do not do whatever things you will.

The flesh delights in things present and brief; the spirit in things perpetual and future. In the midst of this quarrel the soul stands in the middle, having indeed in its own power good and evil, to will and not to will, but not having this very willing and not willing as something perpetual: because it can happen that, when it has consented to the flesh and done its works, it again stings itself through repentance, is joined to the spirit and accomplishes its works. This, then, is what he says: For these are opposed to one another, that is, the flesh and the spirit; so that you do not do whatever things you will. Not that he has taken away from us our own free choice, by which we assent either to the flesh or to the spirit; but because what we do is not properly ours, but the work itself is reckoned either to the flesh or to the spirit. It is a matter of great labor and of excessive disputation, once the works of the flesh and of the spirit have been set out, to find some middle things which seem to belong neither to the flesh nor to the spirit. We are called carnal when we give ourselves wholly to pleasures; spiritual, when we follow the Holy Spirit going before us, that is, when we are wise with Him instructing us, and are taught with Him as our authority. The animal men (animales), I think, are the philosophers, who suppose their own thoughts to be wisdom, of whom it is rightly said: "But the animal man does not receive the things that are of the spirit. For it is foolishness to him". To make this clearer, let us take an example: let the flesh be called earth, the soul gold, the spirit fire. As long as the gold is in the earth, it loses its own name, and is called after the earth with which it is mixed. But when, separated from the soil, it has received both the appearance and the name of gold, it is indeed called gold, but not yet tested. If, however, it has been smelted and purged through fire, then it receives the splendor of gold and the dignity of its own adornment. So too the soul, standing between soil and fire, that is, between flesh and spirit, when it has handed itself over to the flesh, is called flesh; when to the spirit, it is called spirit. But if it has trusted its own thought, and has supposed that it finds the truth without the grace of the Holy Spirit, it is marked, like impure gold, with the name of the animal man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
And since above we had begun to expound this passage according to a twofold understanding, we must render what we omitted. The flesh lusts against the spirit, that is, the history and the fleshly understanding of Scripture fight against allegory and spiritual teaching. But the spirit against the flesh, that is, the more sublime things resist the lowly, the eternal the brief, the truth the shadow. And the fleshly sense of Scripture, which cannot be fulfilled (for we are not able to do all the things that are written), shows that we are not placed in our own power to fulfill the Law, since, even if we wish to follow the letter, impossibility does not allow it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
