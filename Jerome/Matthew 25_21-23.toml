[[commentary]]
quote='''
He says, Thou wast faithful in a few things, because all that we have at present though they seem great and many, yet in comparison of the things to come are little and few.

What greater thing can be given to a faithful servant than to be with his Lord, and to see his Lord's joy?

The servant who of five talents had made ten, and he who of two had made four, are received with equal favour by the Master of the household, who looks not to the largeness of their profit, but to the disposition of their will.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252025.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
His lord said to him: Well done, good and faithful servant; because you were faithful over a few things, I will set you over many; enter into the joy of your lord. To both servants, as I have already said before, both the one who had made ten out of five talents and the one who had made four out of two, the same word of the householder speaks kindly. And it is to be noted that all the things we have in the present, though they seem great and very many, are yet small and few in comparison with the things to come. Enter, he says, into the joy of your lord, and receive what neither eye has seen nor ear heard, nor has it ascended into the heart of man. But what greater thing can be given to a faithful servant than to be with his lord and to see the joy of his lord?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
