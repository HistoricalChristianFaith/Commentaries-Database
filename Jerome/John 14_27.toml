[[commentary]]
quote='''
Who has set your borders as peace. In another psalm we read: And his place was made in peace. My peace I give to you, my peace I leave to you. My peace: not as the world has peace, since indeed the peace of the world is our war. My peace I give to you. Have war with the world, and you will have my peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_057.html'
source_title="Homily 57, on Psalm 147"
