[[commentary]]
quote='''
And since it is the custom that in sad and adverse things you rend your clothes, which the high priest too is recorded in the Gospel to have done, to aggravate the charge against the Lord the Savior; and which we read that Paul and Barnabas did on hearing words of blasphemy. Therefore I command you by no means to rend your garments, but your hearts, which are full of sins, and which, like wineskins, unless they have been rent, will burst of themselves. And when you have done this, return to the Lord your God, whom your former sins had made a stranger to you; and do not despair of pardon because of the greatness of your crimes, for great mercy will blot out great sins. For he is kind and merciful, preferring the repentance of sinners to their death, patient and great in mercy, one who does not imitate human impatience, but waits a long time for our repentance; and placable, or repenting over evils, so that if we do penance for our sins, he too may repent of his threat, and not bring upon us the evils which he has threatened, and with the change of our resolve he too may be changed. But here we ought to take evil not as the contrary of virtue, but as affliction, according to what we read elsewhere: Sufficient for the day is its own evil. And: If there is evil in a city which the Lord has not done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
