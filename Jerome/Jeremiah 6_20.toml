[[commentary]]
quote='''
To what purpose do you bring me frankincense from Sheba, and sweet-smelling calamus from a distant land? Your burnt offerings are not accepted, and your victims have not pleased me. That frankincense comes from Sheba no one doubts; whence also that line of Vergil: and a hundred altars glow with Sabaean incense. And that 'calamus', which in Hebrew is called 'cane', for which the Seventy and Theodotion translated 'cinnamon', comes from a distant land, the prophetic word shows, so that we may understand India, from which many spices come by way of the Red Sea. This kind of spice physicians call kassian syringos [pipe cassia]. And the sense is: 'In vain do you bring me spices of sweetest odor for compounding the ointments that are prescribed in the law, and kindle burnt offerings, you who do not do my will in the law', according to what was said above: they have not heard my words and have cast away my law. This, moreover, properly fits those who offer sacrifices from robbery and the stripping of the wretched, and think they redeem their sins by alms from iniquity, though Scripture says: The ransom of a man's soul is his own riches, which are gathered not from iniquity but from labor and righteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
