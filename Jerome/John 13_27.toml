[[commentary]]
quote='''
Thus into the heart of Judas Iscariot he first cast the arrow, that he should betray the Savior; and if that wretched man had not received it and cherished it, Satan would never have entered into him after the bread was dipped in the dish. And at the same time pay careful attention to this as well: that the devil did not find a place for entering into Judas, whose breast he had already struck before, except at the Savior's banquet (John 13). For we are given into his power most of all then, when we are not overcome by the kindness, nor the clemency, nor the meekness of him whom we hate undeservedly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
