[[commentary]]
quote='''
Woe to him who says to the wood: Wake up; arise, to the silent stone; can it teach? Behold, it is overlaid with gold and silver, and no spirit at all is in its inward parts. But the Lord is in his holy temple; let all the earth keep silence before his face. LXX: Woe to him who says to the wood: Awake and rise up, and to the stone: Be lifted up. And it is an image, and it is a beaten work of gold and silver, and no spirit at all is in it. But the Lord is in his holy temple; let all the earth revere him before his face. This too can likewise be taken either against Nebuchadnezzar or against all who venerate idols. And human error is described, in that men think the silver, gold, gems and silk with which the idols are either wrapped or covered to be gods, because of the brilliance of the material, although the craftsman could indeed give them form, but could not give the soul by which limbs are quickened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
But if anyone should object, how can it be said that there is no spirit in idols, when unclean spirits attend all images, let him learn the custom of holy Scripture: that a perverse spirit is never called spirit absolutely, but always with some addition, as there: They were led astray by a spirit of fornication. And in the Gospel: But when an unclean spirit has gone out of a man, and other things like these. But wherever spirit is read alone and absolutely, without any addition, it always refers to the good side, that is, to the Holy Spirit, as in that saying of the Apostle: He who sows in the Spirit will reap from the Spirit eternal life, and elsewhere: But the fruit of the Spirit is love, joy, peace, and in another place: Walk by the Spirit, and you will not fulfill the desires of the flesh. Nor do we say this as though the Holy Spirit too were not set down with an addition: for he is called both the Holy Spirit, and the princely spirit, and the right spirit, and the spirit of God, and other things like these; but we say that the Holy Spirit is often set down both with an addition and alone, whereas a perverse spirit has nowhere been read except with an addition. But this too can be said, if anyone contentiously wishes to take a perverse spirit in this place: that it is one thing to say: No spirit at all is in it, and another if he had said: No spirit at all is around it; for a spirit can attend images, but it cannot be within them. Hence Aquila too rendered the Hebrew more expressively, saying: And its spirit is not in its inward parts, or in its midst. Moreover, it should be known that in certain Hebrew volumes "all" is not added, but spirit is read absolutely. But if anyone, overcome by reason, takes spirit in the good sense, and asks why, if it is said of the Holy Spirit, it is read with an addition: And no spirit at all is in it, let him know that by "every spirit" the various graces of the Holy Spirit are understood; so that the sense is: It will be able to have in itself nothing of grace, nothing of power. And this indeed is better understood according to tropology: that in all the idols of the heretics and the fashionings of the devil there is no grace of the Holy Spirit, but they seem to display an image of divinity and a beauty of doctrines, while in them there is nothing breathing and living. Let us say this too, lest we seem to have hidden from the reader what we know: that spirit and wind are called among the Hebrews by the same word, that is, rua, and that according to the sense of the passage it is customarily taken either as spirit or as wind. Therefore in this place too we can take spirit either for wind, in that nothing breathes in idols, or for the soul, in that the images are animated. And that spirit is taken for the soul the Savior's prayer clearly signifies: Father, into your hands I commend my spirit. For Jesus could not commend to the Father either a perverse spirit, which it is impious even to think, or the Holy Spirit, who is himself also God, rather than his own soul, of which he had said: My soul is sorrowful even to death, and: No one can take my soul from me, but by my will I lay down my soul, and of my own accord I take it up again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
