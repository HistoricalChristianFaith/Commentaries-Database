[[commentary]]
quote='''
These things, then, says the Lord of hosts to you who see that the former house is as if it were not. I moved heaven, when my voice was heard from heaven. I moved the earth, when I delivered the covenant to the former people, and at my coming gloom, whirlwind and darkness were seen. I moved the Red Sea, when I provided a way for the people passing over. I moved the dry land, either Egypt, emptied of the worship of God through the plagues, or the wilderness through which I led the people about for forty years. These I will move yet once more. This we see fulfilled in the coming of the Lord the Savior. For at the time of his passion, as the sun fled, heaven was moved, and darkness came over all the earth from the sixth hour until the ninth hour. The earth was moved, and the rocks were split, and the tombs were opened; the sea was moved, when the dragon that was in it was slain; the dry land too was moved, the once fruitless wilderness of the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Haggai.html'
source_title="Commentary on Haggai"
