[[commentary]]
quote='''
We do nothing great, if we leave our own things: Christ left the Father and the kingdoms of the heavens for our sake. Let no one think that I have blasphemed, because I said, he left the Father. I speak according to the dispensation, according to that in which he is sent, according to what he says: 'The Father, who sent me, is greater than I.' God is not sent, God is not subjected, does not serve: but the dispensation is sent. If God is everywhere, and all things are in God, how is God sent to anything, since all things are God's? Christ therefore for our sake was made poor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_054.html'
source_title="Homily 54, on Psalm 143"
