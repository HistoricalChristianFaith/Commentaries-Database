[[commentary]]
quote='''
It must also be noted that the inner court has many windows, not straight and even but slanting, narrow on the outside and widening within, so that through certain small openings we may be able to penetrate to the inner things and to come to the fullness of the brightest light which dwells in the temple —; finally, after the sixty and the fifty cubits, and the cells and the porticoes, the fronts of the porticoes and the very many windows round about, the carving or painting of palm trees is shown to us, so that, possessing the victory over the world, we may be made worthy to see the palms of the virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
