[[commentary]]
quote='''
In short, the angels who presided over the kingdoms and nations come not to another, but to the man himself and angel of the Lord who was standing among the myrtle groves, and say: We have walked through the earth, and behold, all the earth is inhabited and at rest. And the sense is: All the kingdoms under us are safe and pacified, and are not oppressed by any distress.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
