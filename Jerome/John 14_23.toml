[[commentary]]
quote='''
The οἰκουμένη (oikoumenē) in this place, which in our tongue is rendered 'the inhabited world,' seems to me to be the Church, of which it is said in the Gospel: 'I and my Father will come, and will make our abode with him.' Rightly, therefore, is it called a habitation, which has as its inhabitant the Father and the Son and the Holy Spirit. What, then, we have understood concerning the inhabited world—that is, concerning the round earth established forever—let us understand also concerning our soul. For if we have as our inhabitant the Father and the Son and the Holy Spirit, our earth shall not be moved forever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_070.html'
source_title="Homily 70, on Psalm 92 (Alternate Series)"
