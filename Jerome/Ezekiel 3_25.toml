[[commentary]]
quote='''
And you, son of man, behold, bonds have been put upon you, and they shall bind you with them, and you shall not go out from their midst; and I will make your tongue cleave to your palate (or throat), and you shall be dumb and not as a man who rebukes, because it is a provoking house. That he is shut up in his house, that he is tied in bonds, that he does not go out to those among whom he dwells, but amid a multitude of captives suffers the solitude of a prison, is, as I said above, a sign of the siege, which, when Jerusalem is shut up and surrounded by the army of the Chaldeans, permits none of the inhabitants to go out; this is the pot of which Jeremiah speaks, and this prophet himself in what follows, in which the flesh of the people is consumed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
