[[commentary]]
quote='''
For thus says the Lord: all the land shall be deserted, but yet I will not make a full end; the earth shall mourn and the heavens above shall grieve, because I have spoken, I have purposed, and I have not repented, nor have I turned back from it. God's mercy being mixed with wrath, all the land is deserted, but a full end is not made, so that there may be those who understand his clemency.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
