[[commentary]]
quote='''
Then Pilate says to him: Do you not hear how many testimonies they speak against you? He who condemns Jesus is indeed a heathen, but he lays the cause upon the people of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
