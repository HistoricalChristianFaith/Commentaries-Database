[[commentary]]
quote='''
But if we wish to take it of the consummation of the world, it must be expounded thus: Just as in Exodus, when Egypt was struck, and God struck their vineyards and their fig trees, and killed the firstborn of men and of beasts in the hail, and the caterpillar and the locust consumed the Egyptian crops, the fig tree in Egypt did not bear fruit, nor was there produce in their vineyards, the work of the olive, wherever it could be found in Egypt at all, was lying, and their plains did not give food, and they were failing, because their flocks had no food, and there were no oxen in the stalls; but the people of Israel exulted in the Lord and rejoiced in God their salvation: so in the consummation of the world, when, iniquity having been multiplied, charity has grown cold, and the fig tree has not borne fruits, and the vineyards have had no grapes, and the work of the olive has lied, and the plains have not brought forth food, and the rest that follows, then whoever has been found just and worthy of God's election will say, exulting: But I will exult in the Lord, I will rejoice in God my salvation, the Lord God is my strength. And as one set by God above the consummation of the age, so that he may afterward climb to higher things and be brought out by God to the summit, he will say: And he will set my feet unto the consummation, he will set me upon the high places, as it will be when a prize has been set for the singers by Jesus, the ἀγωνοθέτῃ (the president of the games), who was the first to win in the contest. I shall conquer in his song, and let my hands put together the cithara and the psaltery and every kind of instrument, and I will write a panegyric for him who triumphs. And I, who at the beginning said: How long shall I cry, and you will not hear? Shall I cry out to you, suffering violence, and you will not save? and found fault with his justice and judgment, shall afterward praise his equity, and surpass the other singers with my song.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
