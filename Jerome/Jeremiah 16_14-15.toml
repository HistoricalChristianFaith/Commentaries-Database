[[commentary]]
quote='''
Therefore, behold, the days are coming, says the Lord, and it shall no longer be said: The Lord lives, who brought the sons of Israel out of the land of Egypt, but: The Lord lives, who brought the sons of Israel out of the land of the north and out of all the lands to which I cast them; and I will bring them back into their land, which I gave to their fathers. Plainly the future restoration of the people of Israel is foretold, and mercy after the captivity, which according to the letter was in part fulfilled under Zerubbabel and Jeshua the high priest and Ezra, and according to the spiritual understanding is described as to be fulfilled more truly and more perfectly in Christ. 'The time will come', he says, 'when it will no longer be said that the people was brought back from Egypt through Moses and Aaron, but that it was brought back from the land of the north when Cyrus, king of the Persians, released the captives'. And out of all, he says, the lands; which will be fulfilled not at all in the time of Cyrus, but at the very end, as the Apostle says: 'after the fullness of the nations has come in, then all Israel will be saved'. We can also say this of the persecutions which befell our people from the days of Nero, of whom the Apostle writes: and I was delivered from the mouth of the lion, down to the times of Maximinus: how the Lord had mercy on his people and brought them back into their land, no doubt into the Church, which he gave to their fathers, the apostles and apostolic men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
