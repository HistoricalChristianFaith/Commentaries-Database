[[commentary]]
quote='''
With what sword then shall he perish, that takes the sword? By that fiery sword which waves before the gate of paradise, and that sword of the Spirit which is described in the armour of God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then Jesus said to him: Turn your sword back into its place; for all who take the sword will perish by the sword. Although he does not bear the sword in vain who has been appointed the avenger of the Lord's wrath against him who does evil, nevertheless whoever takes up the sword will perish by the sword. By what sword? Surely by that fiery one which turns before paradise, and by the sword of the Spirit which is described in the armor of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
