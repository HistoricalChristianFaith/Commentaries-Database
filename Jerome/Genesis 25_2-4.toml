[[commentary]]
quote='''
We, leaving aside what is uncertain, say this: that the sons of Abraham born of Keturah, according to the historians of the Hebrews, occupied τρωγλοδύτιν [the Troglodyte country] and the Arabia which is now called εὐδαίμων [Felix, 'Happy'], as far as the borders of the Red Sea. It is said, moreover, that one of the descendants of Abraham, who was called Afer, led an army against Libya, and there, having conquered his enemies, settled; and that his descendants, from the name of their ancestor, called it Africa. Witness to this is Alexander, who is called Polyhistor, and Cleodemus, surnamed Malchus, who retell a barbarian history in the Greek tongue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
