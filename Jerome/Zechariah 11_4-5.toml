[[commentary]]
quote='''
Thus says the Lord my God: Feed the cattle of slaughter, which those who had possessed them were killing, and were not grieving; and they were selling them, saying: Blessed be the Lord, we have become rich; and their shepherds were not sparing them. LXX: Thus says the Lord Almighty: Feed the sheep of slaughter, which those who possessed them were killing, and they did not repent; and those who were selling them were saying: Blessed be the Lord, and we have become rich; and their shepherds suffered nothing over them. Where the prophecy is most manifest, and through the metaphor the true order of the history is narrated, the interpretation of tropology is superfluous: that we should say that some shepherds are good and others bad, and refer this as much to the old people as to the new, that is, as much to the priests and princes of the Jews as to the bishops and presbyters of the Christians; and that whatever shepherds have been negligent and have scandalized one of the least, they are the ones who feed the cattle of slaughter, and suffer nothing over them, nor grieve, nor can say with the Apostle: Who is scandalized, and I do not burn? And that they sell the peoples entrusted to them, of whom it is written: Who devour my people as a meal of bread; and gain riches from the deaths of others, praising those who take plunder from the wretched, and blessing the wicked. Let others interpret these things as they will: let us keep the order of explanation which we once took up. Since Lebanon has been opened, and its cedars and firs have been consumed by burning flame, and the howling of the shepherds has been heard, and the roaring of the lions, because all the beauty and pride of the Jordan has been laid waste and consumed, therefore the Lord my God said these things to me: O prophet Zechariah, this word is addressed to you: Feed the flock of slaughter, that is, let it be nourished meanwhile for now and grow, which afterwards is to be slaughtered by enemies; which sheep and cattle the princes of the Romans, who possessed them and held them by right of victory, were killing and not pitying, or else were sacrificing; and they did not feel grief, that is, they suffered no harm for so great a cruelty; and they were selling those whom they kept not out of clemency but for the price. Let us read the old histories, and the traditions of the lamenting Jews, how at the Tent of Abraham — where now a most crowded market is held every year —, after the last overthrow, which they suffered under Hadrian, many thousands of men were sold; and those who could not be sold were carried over into Egypt, cut down as much by shipwreck and famine as by the slaughter of the nations. These victors, then, and avengers of the Lord, who were killing and not grieving, and were selling the cattle and saying: Blessed be the Lord, we have become rich, held this opinion: The Jews offended because of their sins, therefore we have crushed them, and from their price we have become rich. And no wonder, he says, if the enemies by the right of victors were killing the cattle and not grieving, were selling them and glorying in their crime; since their own shepherds and teachers did not spare them, and by their fault the flock was handed over to wolves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
