[[commentary]]
quote='''
The day of our king: the princes began to rage from wine; he stretched out his hand with the mockers, because they applied their heart like an oven when he lay in wait for them. All night he slept baking them; in the morning he himself was kindled like a fire of flame; all were heated like an oven and devoured their judges; all their kings have fallen; there is none among them who cries to me. LXX: The day of your kings. The princes began to rage from wine; he stretched out his hand with the pestilent, because their hearts were kindled like an oven, while they were cast down headlong all night. Ephraim was filled with sleep; morning came; he was set on fire like a flame of fire. All were heated like an oven, a burning fire, and they ate up their judges. All their kings have fallen; there is not among them one who calls on me. An obscure passage, and one needing the close attention of the reader, so that we may first learn the history. Israel and the city of Samaria rested a little, having received into themselves the heat of error, until the whole lump became like leaven, and rose and burst out; and the people, swelling up, shouted at the doors of King Jeroboam and said: This is the day of Jeroboam our king, this is the feast day which our ruler has appointed for us; this we celebrate, this we sing, on this we exult and play, on this we worship the golden calves. When the people shouted, the princes were not angry, as some think; but they too began to rage from wine and to lose the understanding of their mind, to forget God and to dash themselves against the wood of idols. When the king saw this, namely that the people were shouting and saying: This is the day of our king, and that the princes, like drunken and frenzied men, did not know what they were saying, he stretched out his hand to the mockers, he joined his assent to those who mocked him with empty praises.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
