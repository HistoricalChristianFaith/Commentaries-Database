[[commentary]]
quote='''
And the Lord sent to you all his servants, the prophets, rising at dawn and sending; and you have not listened. Not through one prophet but through all of them God always admonished his people, and as though he himself were stationed on watch and on guard, he rose at dawn to warn his people. And you have not, he says, listened, so that the more frequent the admonition, the greater were the sins of those who despised it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
