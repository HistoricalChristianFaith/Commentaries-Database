[[commentary]]
quote='''
Hear this, O priests, and attend, house of Israel, and house of the king; listen with your ears, for the judgment is for you; since you have become a snare to the watchtower and a net spread over Tabor, and you have turned aside the victims into the depth. LXX: Hear this, O priests, and attend, house of Israel, and house of the king; perceive with your ears, for the judgment is against you, because you have become a snare to the watchtower; and like a net spread over Itabyrium, which those who take the prey have fixed fast for the hunt. The priests of the ten tribes are summoned to judgment, and the kings: not that the priests are of the tribe of Levi, but that they are called priests by the people. Hence too the priests of Baal, the four hundred and fifty prophets whom Elijah, and afterwards Jehu son of Nimshi in the presence of Jonadab son of Rechab, killed, were called priests; but Israel too, that is, the people, is summoned to judgment; and no one is excepted, so that priests and people and kings, who had led the people astray and appointed the priests, may hear together what they have done and why they are handed over to their enemies. I set you, he says, as watchmen and princes among the people, and placed you on the lofty summit of dignity, so that you might guide the wandering people. But you have become a snare, and are to be called not so much watchmen and princes as hunters. For you spread a net over Mount Tabor, which the Seventy rendered Ἰταβύριον (Itabyrium), having this custom, that they inflect Hebrew names in the Greek tongue; just as Edom, that is, Esau, and Seir they always translate Idumaea. Now Tabor is a mountain in Galilee, situated in the plains, round and lofty, and it is bounded evenly on every side. Of this mountain we read in the psalm too: Tabor and Hermon will exult in your name. This mountain the Seventy also rendered Itabyrium in Jeremiah; on it birds are commonly caught with snares.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
