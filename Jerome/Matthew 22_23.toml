[[commentary]]
quote='''
There were two sects among the Jews, the Pharisees and the Sadducees; the Pharisees pretended to the righteousness of traditions and observances, whence they were called by the people 'separate.' The Sadducees (the word is interpreted 'righteous') also passed themselves for what they were not; and whereas the first believed the resurrection of body and soul, and confessed both Angel and spirit, these, according to the Acts of the Apostles, denied them all, as it is here also said, Who say that there is no resurrection. (Acts 23:8.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
I say nothing of the Jewish heretics who before the coming of Christ destroyed the law delivered to them: of Dositheus, the leader of the Samaritans who rejected the prophets: of the Sadducees who sprang from his root and denied even the resurrection of the flesh: of the Pharisees who separated themselves from the Jews on account of certain superfluous observances, and took their name from the fact of their dissent: of the Herodians who accepted Herod as the Christ.
'''
source_url='https://www.ccel.org/ccel/schaff/npnf206.vi.iv.html'
source_title="The Dialogue Against the Luciferians, Section 23"

[[commentary]]
quote='''
On that day the Sadducees, who say that there is no resurrection, came to him. There were two heresies among the Jews, one of the Pharisees and the other of the Sadducees. The Pharisees held up a righteousness of traditions and observances, which they call deuteroses, and hence they were also called 'divided' by the people; while the Sadducees, which is interpreted 'just', themselves also claimed for themselves what they were not. And whereas the former believed and confessed the resurrection of both body and soul, and angels and spirit, the latter, according to the Acts of the Apostles, denied it all. These are the two houses of which Isaiah teaches quite plainly that they would stumble on the stone of stumbling.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
