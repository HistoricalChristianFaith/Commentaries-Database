[[commentary]]
quote='''
Then a parable will be spoken over you, and your miseries will be turned into a song: We have been laid waste with devastation, the portion of my people. My temple, he says, which alone I had more than the other nations, will be changed into a ruin. How will the Assyrian depart from me, when he returns to distribute my fields to himself by lot? Therefore, O family of Israel, against which I devise evil, you will have no part in the inheritance of the just.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
And the people will know how to say nothing else but this: In misery we have been made miserable. For the land of promise, which had earlier been divided by lot to two and a half tribes beyond the Jordan, with Moses casting the cord, and afterwards apportioned by Joshua son of Nun to the remaining tribes, has been divided among the nations by a Roman surveyor, and there was no one to forbid; rather, though it holds all the nations, there is no one of the Jews who possesses the ancient soil in its former freedom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Since, therefore, all our glory has been shorn, and we have enlarged our shaving, or our widowhood — for so it is found in some codices —, men have been sent to mourn us with Jeremiah, and to take up a parable over us, and to say with the Apostle: I shall mourn many who have sinned and have not repented. For who would not mourn, seeing human souls possessed like assorted household goods by demons and various vices? One demon, that of fornication, casts the cord; another, that of avarice; that one, of murder; this one, of perjury, stretches out the lines. The portion of the people of God has been divided by the cord, and the fields once of holiness and of paradise, with whose fragrance Isaac was delighted in his son Jacob, have been handed over to the Assyrians and to the Babylonian king. And while the foxes have holes and the birds of the air nests, The Son of Man has nowhere to lay his head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
