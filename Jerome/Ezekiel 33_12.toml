[[commentary]]
quote='''
In the lives of Christians we look not to the beginnings but to the endings. Paul began badly but ended well. The start of Judas wins praise; his end is condemned because of his treachery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_054.html'
source_title="LETTER 54.6"

[[commentary]]
quote='''
For what does it profit a man to be in continence for twenty years, and afterwards to fall? — according to what is written in the prophet: 'The justice of the just man shall not profit him on whatever day he goes astray: it shall not free him, nor save him. And the sin of the sinner shall not harm him on whatever day he turns and does penance.' Neither ought the just man to be secure, nor ought the sinner to despair of his salvation: for in both of them there is both fear and hope.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_032.html'
source_title="Homily 32, on Psalm 105"
