[[commentary]]
quote='''
But the Samaria of spiritual wickedness too, which had divided itself from the people of God, made its king pass swiftly away, namely the speech of the heretics and their doctrine, like foam, or brushwood, upon the face of the water: the one, even while it is seen, suddenly dissolves; the other is easy to lift from the surface of the waters and cast into the fire. Such are the heretics, swelling with foaming words and mixing precepts destined for burning into the baptism of Christ and into his words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
