[[commentary]]
quote='''
It is said also to the heretics: When the solemn day comes, what are you going to do? For solemn day Aquila has translated time. From which it is manifest that it does not mean a festal day, but the time of retribution; for at once there follows: The days of vengeance have come, the days of your retribution have come. Behold, you have been laid waste by many enemies: the Assyrians and the Chaldeans have slaughtered you, you have fled to the world, and have been made like the other nations; there Memphis will bury you, which is interpreted from the mouth; and the sense is: you will receive according to your blasphemies, and what you have spoken you will feel in your punishments; the desirable things, that is, the dogmas which you had composed for yourselves with crafty eloquence, which is what silver signifies, the nettle will possess, which will consume you with eternal burning; and the bur or thorn will be in your tents; for thorns spring up in the hands of those who have been made drunk with the Babylonian cup. And in the Gospel we read that shameful thoughts and the cares of this world, and the vices that cling to us, are called thorns, which choke the grain as it rises among the grasses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
