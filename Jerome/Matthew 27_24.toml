[[commentary]]
quote='''
Pilate took water in accordance with that, I will wash my hands in innocency, (Ps. 26:6.) in a manner testifying and saying, I indeed have sought to deliver this innocent man, but since a tumult is rising, and the charge of treason to Cæsar is urged against me, I am innocent of the blood of this just man. The judge then who is thus compelled to give sentence against the Lord, does not convict the accused, but the accusers, pronouncing innocent Him who is to be crucified. See ye to it, as though he had said, I am the law's minister, it is your voice that has shed this blood.

Also in the washing of Pilate's hands all the works of the Gentiles are cleansed, and we are acquitted of all share in the impiety of the Jews.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But Pilate, seeing that he was gaining nothing, but that rather a tumult was arising, took water and washed his hands before the people, saying: I am innocent of the blood of this just man; you see to it. Pilate took water according to that prophetic word: I will wash my hands among the innocent, so that in the washing of his hands the works of the Gentiles might be cleansed, and that he might in some way make us strangers to the impiety of the Jews, who cried out: Crucify him, testifying to this and saying: I indeed wished to free an innocent man, but since a sedition is arising and the charge of treason against Caesar is being thrust upon me: I am innocent of the blood of this just man. The judge who is forced to pass sentence against the Lord does not condemn the one brought before him, but convicts those who bring him, pronouncing that he who is to be crucified is just. You, he says, see to it; I am the minister of the laws, your voice sheds the blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
