[[commentary]]
quote='''
This is the fig tree to which the householder came for the third time, and which he wishes to cut down as not producing fruit; for it the farmer, to whom it had been entrusted, pleads, that he may give it time, and he says: Lord, let it alone this year also, until I dig around it and put on manure, and if indeed it bears fruit; but if not, then you shall cut it down. That farmer is either Gabriel or Michael, to whom the people of the Jews was entrusted, who pleads with the Lord at the passion and says: Lord, give it time for repentance, and do not overthrow them, and if indeed they bear fruit; but if not, then you shall overthrow them. If they bear fruit, he says: he did not say what they would undergo; nor did he say: If they bear fruit, they will remain as they were; but, if they bear fruit: the sentence is left suspended, so that this is understood: you will transfer them into the church of the Gentiles, and transplant them into another vineyard. The Lord came for the third time and did not find fruit in them. First he gave the law through Moses, the second time he spoke through the prophets, the third time he himself came down. And after the passion, when forty-two years had been given for repentance, because they did not bear fruit, the fourth time they were overthrown. This, however, is left to our understanding. For in the parable it is not written what the householder did afterward, but only what the farmer pleaded for. From this we perceive that those of this fig tree who bore fruit were transferred to the people of the Gentiles, to which the prophet too goes up, saying: I shall rest in the day of tribulation, that I may go up to the people of my sojourning; but that those who did not bear fruit and remained in their hardness were overthrown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
