[[commentary]]
quote='''
The Lord has said, From Basan I will turn back: that is, from the confusion of this world I will turn back the human race; that is, through my passion and cross, which these people think foolishness and confusion, I will turn back my people. Since indeed Basan is interpreted "confusion." I will turn back in the depths of the sea: that is, from the deep vices and sins of this world, from the commotion and the waves I will turn back my people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_007.html'
source_title="Homily 7, on Psalm 67"

[[commentary]]
quote='''
Let us say, then, according to the ἀναγωγὴν [anagogy, the higher sense], that the oars of the Tyrian ship are made from Bashan — of which it is also written in the Psalms: The Lord said: From Bashan I will turn back, I will turn back from the depth of the sea; Basan in our language means 'ignominy' —; those, then, who were in the depth of the sea and in the ignominy of sins, the Lord turns back, and turns them into oars, so that, sailing with the apostles, they may reach the land and the shores; and benches are made of ivory when they have mortified their bodies, or have devoted the use of their teeth to the praises of God; and cabins or storerooms from the islands of 'Chetthiim', which, according to the ἐτυμολογιὰν [etymology] of the Hebrew language, is rendered 'struck', so that it has been not so much killed as tested by the blows of the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
