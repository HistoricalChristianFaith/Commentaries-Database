[[commentary]]
quote='''
That too which we read in the Apocalypse of John (Chapter 20), that after the resurrection small and great are brought into the presence of the judge, signifies differences not of ages but of merits. For he who is small, according to the sentence of Solomon, is worthy of mercy: but the mighty shall mightily suffer torments (Wis 6:7). With this sense the words of the Lord also agree: The servant who knows the will of his lord and does not do it shall be beaten with many stripes (Luke 12:47). But he who does not know, and has done things worthy of stripes, shall be beaten with few.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
