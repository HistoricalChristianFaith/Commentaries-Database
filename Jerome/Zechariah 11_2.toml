[[commentary]]
quote='''
The fir trees howl because the cedar has fallen, the princes and priests mourning one another in their own devastation. And what he said obscurely before, he now sets out more plainly: Because the magnificent have been laid waste. I want to know what are the cedars of Lebanon that were burned, what are the fir trees to which howling is enjoined, what is the pine that has fallen; the magnificent, he says, have been laid waste. Howl, O oaks of Bashan, that is, of confusion and ignominy, because the most fortified forest, which in Hebrew is called besor, and was translated by the LXX as wooded, has been cut down; because the temple, which had grown up in impregnable strength, and had been built by various kings and princes, and afterwards by Herod, was destroyed when the Roman attacked it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
