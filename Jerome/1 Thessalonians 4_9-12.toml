[[commentary]]
quote='''
The Macedonians are praised for love, and for hospitality and the reception of the brothers. Hence it is written to them: "But concerning the love of the brotherhood we have no need to write to you. For you yourselves have learned from God to love one another. And indeed you do it toward all the brothers in all Macedonia" (1 Thess. 4:9). But they are rebuked because they go idly round the houses, and, looking for another's food, while they desire to please each one and run about hither and thither, they report what is done at each person's house. For it follows: "But we beseech you, brothers, that you abound more, and take pains to be quiet, and that you do your own business, and work with your hands, as we commanded you, so that you may walk honestly toward those who are outside, and may desire nothing of anyone" (1 Thess. 4:10-11). And lest anyone think this was urged more from the duty of a teacher than because of a fault of the people, in the second letter to the same he presses and repeats it, saying: "For even when we were with you, we declared this to you, that if anyone will not work, neither let him eat. For we have heard that some among you walk restlessly, doing no work, but acting as busybodies. Now those who are such we charge and beseech in the Lord Jesus Christ, that, working in silence, they eat their own bread" (2 Thess. 3:10 ff.).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
