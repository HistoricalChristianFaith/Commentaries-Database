[[commentary]]
quote='''
Now the Apostle writes to Titus, dearest son, which in Greek is said γνησίῳ τέκνῳ (true-born son), and cannot be expressed in the Latin tongue: for γνήσιος rather conveys this, when someone is called faithful and one's own, and (so to speak) legitimate or genuine, beyond comparison with another. From this we understand that there was also a very great difference among Paul's sons: that some he had as γνησίους, that is, most genuine, and joined to himself, and begotten of a true marriage and of a free woman; but others as if of a handmaid and of Hagar, who cannot receive the inheritance with Isaac, the son of the free woman. For the speech and wisdom and doctrine with which Titus instructed the churches of Christ made him the Apostle's own son, and set him apart from all fellowship with others. Let us see after this what follows: According to the common faith: whether he called the faith common to all who believed in Christ, or common only to himself and Titus? It seems better to me that the faith was common to the apostle Paul and Titus than to all believers, in whom, according to the variety of their minds, the faith also could not be common, but diverse. Finally, the preface of the Epistle and the greeting of the Apostle's preface to Titus are completed with this ending: Grace and peace from God the Father and Christ Jesus our Savior: whether because both grace and peace come as much from God the Father as from Christ Jesus, and both may be understood as given by each; or because grace is referred to the Father, and peace to the Son. We must not pass over without scruple that the Apostle prayed for some that grace and peace might be multiplied to them, whereas now, to Titus, peace and grace are set down without multiplication. Noah, a just man, alone preserved when the world was shipwrecked, is said to have found not many graces but one grace in the sight of God. And Moses to the Lord: "If I have found," he says, "grace with you" (Exod. 33:13). And wherever else grace is set down in the person of the saints, seek and you will find that they found not graces, but grace. That merchant in the Gospel who had many pearls at last found one precious one, which alone he bought with the many pearls (Matt. 13). For it belongs to the perfect to buy one pearl and one treasure in exchange for all their pearls and their whole substance; but to beginners, and those still set upon the road, to have not just one and only one, but many pearls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
