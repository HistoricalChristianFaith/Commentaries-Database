[[commentary]]
quote='''
Therefore, behold, I will show them at this turn, I will show them my hand and my power, and they shall know that my name is the Lord. The hand of God, through which he has wrought all things, and the power, of which the Apostle said: 'Christ the power of God and the wisdom of God', is shown to the nations once the passion of the Son has been completed. And beautifully he said: 'I will show them at this turn; and I will show them plainly, and not as before in shadow and in image and in prophecy of things to come, so that, after they have come to know it, they may know my name and hear from the Son: Father, I have made your name manifest to men'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
