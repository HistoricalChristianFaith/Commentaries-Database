[[commentary]]
quote='''
And now I will uncover her folly in the eyes of her lovers; and no one will rescue her from my hand and I will make all her joy cease, her solemnity, her new moon, her sabbath, and all her festal times; and I will spoil her vine and her fig tree, of which she said: These are my wages, which my lovers gave me; and I will make her into a forest, and the beast of the field will eat her. LXX: And now I will uncover her uncleanness in the sight of her lovers; and no one will rescue her from my hand; and I will turn away all her gladness, her solemnities and her new moons, and the sabbaths, and all her festivals; and I will destroy her vine, and her fig trees, of which she said: These are my wages which my lovers gave me; and I will make her a testimony, and the beasts of the field will eat her. What follows, The birds of the sky and the creeping things of the earth, must be marked beforehand with an obelus. For 'forest', too, which in Hebrew is called iar, whence Kiriath-jearim also is interpreted 'town of the woods', the LXX translated 'testimony', through the deceptive likeness of the letters res and daleth. For if daleth is read in place of res, it means 'testimony', provided only that the letter iod does not come before it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
The vine too and the fig tree and the abundance of all things will be spoiled: in the vine understand gladness, in the fig sweetness and pleasantness, which are taken away by the evils of a most grievous slavery; and they are taken away for this reason, that she judged them given to her not by God, as to a wife, but by her lovers, as to a harlot, for the wages of lust. Then she will by no means have fruit-bearing trees, but everything will be turned into forest. And since he had once taken the metaphor from the woods, he carries it through in the rest, so as to call the enemies, by whom all things are to be devoured, beasts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
