[[commentary]]
quote='''
And if they are prophets and the word of the Lord is in them, let them meet — and what follows, which we are about to subjoin up to the end of this chapter, is not found in the Seventy — the Lord of hosts, that the vessels which had been left in the house of the Lord and in the house of the king of Judah and in Jerusalem may not come into Babylon. For thus says the Lord of hosts to the pillars and to the sea and to the bases — for which in the Hebrew is written 'mechonoth' — and to the rest of the vessels which remained in this city, which Nebuchadnezzar, king of Babylon, did not take when he carried Jeconiah, son of Jehoiakim, king of Judah, from Jerusalem into Babylon, and all the nobles of Judah and Jerusalem. For thus says the Lord of hosts, the God of Israel, to the vessels which have been left in the house of the Lord and in the house of the king of Judah and in Jerusalem: They shall be carried into Babylon and shall be there until the day of their visitation, says the Lord, and I will cause them to be brought and restored to this place. These words, as we have said, are not found in the Seventy, but have been translated from the Hebrew truth; in place of which they set down something else, which was not written, saying: to me, because thus said the Lord: and the rest of the vessels which the king of Babylon did not take, when he carried Jeconiah from Jerusalem, shall enter Babylon, says the Lord, setting down the sense rather than the words, perhaps thinking it irrational that God should speak to the pillars and to the sea and to the bases and to the rest of the vessels which had remained in Jerusalem — as if we did not read both that the Lord rebuked the morning worm and that he spoke to the sea: be silent and be still! And what he says: let them meet me or the Lord of hosts, shows that a true prophet can withstand the Lord with prayers, in accordance with which Moses too stood in the smiting against the Lord, to turn away the wrath of his fury; Samuel also did the same. And the Lord to Moses: let me alone, he says, I will strike this people! But when he says: let me alone, he shows that he can be held back by the prayers of the saints. 'Let the prophets meet', he says, 'and let them show whatever they foretell fulfilled in deed, and then the prophecy will be proved by its truth'. Now the pillars and the sea and the bases and the rest of the vessels we read of in Malachim [Kings] and at the end of this prophet's volume; and there are enumerated the vessels that were carried into Babylon when Zedekiah was taken and the city burned and the temple overthrown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
