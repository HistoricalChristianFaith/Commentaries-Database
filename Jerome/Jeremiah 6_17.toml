[[commentary]]
quote='''
And at once he adds: 'And I set watchmen over you' — no doubt the choir of the apostles is indicated, according to Ezekiel: Son of man, I have given you as a watchman to the house of Israel —, 'and I commanded that you hear the voice of the trumpet, either the commands of the Gospel or the teaching of the apostles, according to that saying of Isaiah: Go up onto a high mountain, you who bring good tidings to Zion; lift up your voice like a trumpet, you who announce to Jerusalem'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
