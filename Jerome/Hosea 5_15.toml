[[commentary]]
quote='''
And as for what follows: Going, I will return to my place, by the place of God we ought to understand his magnificence and majesty; so that he no longer, by way of dispensation, descends to men, is angry, has mercy, forgets, becomes like a panther, is turned into a lion, is changed into beasts; but disregards human affairs and allows those whom he formerly protected to be subjected to their enemies, so that they may waste away, and fail, and perish, and afterwards seek the face of the Lord, and say: Make your face shine, and we shall be saved. And: Show us, O Lord, your mercy, and grant us your salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
In their tribulation they will rise early to me: come, and let us return to the Lord, for he has seized and he will heal us; he will strike and he will cure us; he will make us live after two days; on the third day he will raise us up, and we shall live in his sight; we shall know and we shall follow, that we may know the Lord. LXX: In their tribulation they will watch early for me, saying: let us go and return to the Lord our God, for he will scourge and he will heal us; he will strike and he will cure us; he will make us whole after two days; on the third we shall rise again and we shall live before him and we shall know; let us pursue, that we may know the Lord. Therefore God has handed Ephraim and Judah over to captivity, and there is none who can snatch from his hand, and he will return to his place until they fail; and they will seek his face, so that him whom they had not felt as gracious and present, they may seek again as angry and absent; and in their tribulation, when the light of repentance has risen for them, they may rise early to him, according to what we read in Isaiah: In tribulation I remembered the Lord. And in the first of the psalms of ascents: To the Lord I cried when I was in tribulation, and he heard me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
