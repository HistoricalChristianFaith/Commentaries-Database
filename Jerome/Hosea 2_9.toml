[[commentary]]
quote='''
Therefore I will return and take my grain in its time, and my wine in its time, and I will set free my wool and my flax, which covered her disgrace. LXX: Therefore I will return and take away my wheat in its time, and my wine in its time, and I will take away my garments and my linens, so that they may not cover her disgrace. The punishment is heavier when, at the time of harvest and vintage, the hoped-for crops and the wine are taken away, and are, as it were, snatched out of the hands that already held them. But if at the time of the threshing floor and the vat and the winepress, when the earth makes up for past barrenness with new crops, there is a want of all things, what must we reckon of the rest of the year, when the old stores too are being saved? Now the wool and the flax, or the garments and the linens, are set free, so that they may no longer cover the harlot's disgrace; that is to say, so that she may be stripped of God's help, and the protection of all the angels may depart from her. Hence the Apostle too says that the creation is set free from the bondage of corruption into the liberty of the glory of the sons of God. Many have received the gold and silver of wisdom and eloquence, out of which they might make the lampstand of seven lamps of purest gold, and the golden table of the showbread, and the mercy seat and the cherubim gleaming with the splendor of gold, and the silver bases of the pillars, and the wheat of the word of God, and the wine, the joy of the Holy Spirit; and garments too and linens with which believers might be clothed in Christ; all of which they turned to the worship of idolatry, composing various dogmas of error, and, being deceived, they deceived others. All these things God takes away, so that those who did not perceive the giver from abundance may perceive him from want.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
