[[commentary]]
quote='''
And I will take away sorceries from your hands, by which either you yourself were deceived by others, or, being deceived, you deceived others; and those who speak, or pronounce, shall not be yours. Now the world is full of speakers and pronouncers; they speak what they do not know, they teach what they have not learned; they are teachers, though they were not pupils before. When, therefore, God teaches man knowledge, false presumptions will cease, and perverse doctrine will be removed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
