[[commentary]]
quote='''
To them the Lord replied: How are you called Israel, when Israel has cast away the good, that is, his Lord, from whom he was called Israel? Therefore, because Israel cast away the good, the enemy, that is, the Assyrian, will pursue him and seize him, who, having abandoned me as king, asked for a king for themselves, as the other nations also had, and acted against my will. Finally, Samuel for this reason sets before them the harsh commands of a king, and says that their sons and daughters will serve kings, so that they might return to the Lord, the most merciful king; but they became princes without the will of God. And this crime was not enough for them, unless they doubled the outrage with a greater impiety, turning into idols the silver and gold which they had received for riches and adornment. Therefore Saul became king not by the will of God, but by the error of the people. And because he did not have the root of piety, as soon as he began to reign he was inflamed with impiety. What he says: They have reigned, and not from me; they have been princes, and I did not know it, can also be taken of Jeroboam son of Nebat, and of the other princes who succeeded him in power. Nor, because God, angry with Solomon, willed his kingdom to be divided, did Israel therefore do well in accepting a king. For according to the precepts of the law it ought to have asked the Lord whether he wished this to be done. For of the Savior too it is said that the Son of man must indeed be betrayed, but woe to him through whom he is to be betrayed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
