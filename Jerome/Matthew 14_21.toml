[[commentary]]
quote='''
To the number of loaves, five, the number of the men that ate is apportioned, five thousand; And the number of them that had eaten was about five thousand men, besides women and children.

There partook five thousand who had reached maturity; for women and children, the weaker sex, and the tender age, were unworthy of number; thus in the book of Numbers, slaves, women, children, and an undistinguished crowd, are passed over unnumbered.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Now the number of those who ate was five thousand men, besides women and little children. In keeping with the number of the five loaves, the multitude of the men who ate is also five thousand. For it had not yet come, as in the narrative of another passage, to the number seven, of which those who eat are four thousand, a number close to that of the Gospels. Now five thousand men eat, men who had grown to the perfect man and were following him of whom Zechariah says: Behold a man, the Rising is his name. But women and little children, the frail sex and the lesser age, are unworthy of being numbered. Hence too in the book of Numbers, whenever the priests and the Levites and the army or the bands of fighting men are registered, slaves and women and little children and the undistinguished common people are passed over without number.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
