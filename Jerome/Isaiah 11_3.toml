[[commentary]]
quote='''
But especially the spirit of the fear of the Lord filled him, for the sake of those who have need of the fear of the Lord, because they are little ones; the fear which perfect love casts out. For he who fears has punishment, and is not perfect (1 John 4:18). Hence the Apostle too says to believers: For you have not received the spirit of slavery again in fear: but you have received the Spirit of adoption, in which we cry Abba, Father (Rom 8:15). And in Malachi we read: If I am a father, where is my glory? and if I am Lord, where is my fear (Mal 1:6)? of which fear it is sung in the Psalm: Come, children, hear me: I will teach you the fear of the Lord (Ps 33 [34]:12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
He shall not judge according to the sight of the eyes, nor reprove according to the hearing of the ears: but he shall judge the poor in righteousness, and shall reprove with equity on behalf of the meek of the earth, and he shall strike the earth with the rod of his mouth, and with the spirit of his lips he shall slay the wicked. And righteousness shall be the girdle of his loins, and faith the belt of his reins. We refer these things to the first coming of the Savior: the Jews contend that they will come to pass at the end of the world. Further, the Seventy translated: He shall not judge according to glory, nor reprove according to speech: but he shall judge with a lowly judgment, and shall reprove the lowly of the earth. For he accepts no one's person in judgment; but to the scribes and Pharisees and rulers he says: Woe to you, hypocrites: and, The kingdom of God will be taken from you, and will be given to a nation that brings forth its fruits (Matt 23:13; 21:43). Nor did he rebuke according to speech and the hearing of the ears. For when they said: Master, we know that you are truthful, and teach the way of God in truth, and you care for no one: for you do not look at the faces of men (Matt 22:16), knowing their malice he answered: Why do you test me, hypocrites? and other things like these.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
