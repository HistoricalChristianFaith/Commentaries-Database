[[commentary]]
quote='''
The present section some of the Jews interpret of the Babylonian captivity, when the temple was desolate for seventy years, and there were no altar and victims and priesthood, and afterwards under Zerubbabel they returned to their former seats. Others, like us, defer it to the future time; and what is the cause of so great an offense, that they have been abandoned for so long a time, especially since they do not worship idols, they cannot find any other than the killing of the Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
