[[commentary]]
quote='''
Although those who have made void their first faith are not worthy of faith (I speak of Marcion and Basilides, and of all the heretics who tear apart the Old Testament), yet we would bear with them in some measure if they at least kept their hands off the New, and did not dare to violate either the evangelists or the apostles of Christ, the Son (as they themselves boast) of the good God. But now, since they have both scattered his Gospels and made the epistles of the apostles to be not the apostles' of Christ but their own, I wonder how they dare to claim for themselves the name of Christians. For, to say nothing of the other Epistles, from which they erased whatever they had seen to be contrary to their doctrine, some they believed should be rejected entire: namely both the Epistles to Timothy, the one to the Hebrews, and the one to Titus, which we are now attempting to expound. And if indeed they gave reasons why they did not think them the Apostle's, we would try to make some reply, and perhaps to satisfy the reader. But now, since they pronounce with heretical authority and say, "That epistle is Paul's, this one is not," let them understand that they are refuted, on behalf of the truth, by the same authority by which they themselves do not blush to feign falsehoods. But Tatian, patriarch of the Encratites, who himself also rejected some epistles of Paul, believed that this one above all, that is, the one to Titus, must be pronounced the Apostle's, setting little store by the assertion of Marcion and of the others who agree with him on this point. The Apostle, then, O Paula and Eustochium, writes from Nicopolis, which, situated on the shore of Actium, is now by far the greatest part of your property; and he writes to Titus, his disciple and his son in Christ, whom he had left in Crete to instruct the churches; and he commanded him that, when one of the two, Artemas or Tychicus, had landed in Crete, he himself should come to Nicopolis. For it was just that he who had said, "my care for all the churches", and who, setting out from Jerusalem, had founded the Gospel of Christ as far as Illyricum, should not allow the Cretans, from whom the seeds of idolatry first sprouted, to be left deserted by his own absence and that of Titus, but should send them, in place of himself and Titus, Artemas or Tychicus, by whose teaching and consolation they might be cherished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"

[[commentary]]
quote='''
Paul, a servant of God, but an apostle of Jesus Christ. In the Epistle to the Romans he began thus: "Paul, a servant of Jesus Christ, called an apostle". In this one, however, he calls himself a servant of God, but an apostle of Jesus Christ. For if the Father and the Son are one, and whoever has believed in the Son believes also in the Father, then the servitude of the apostle Paul too is to be referred without distinction either to the Father or to the Son. But this servitude is not the one of which the Apostle himself says: "For you did not receive the spirit of servitude again in fear, but you received the spirit of adoption, in which we cry, Abba, Father" (Rom. 8:15); rather, it is a noble servitude, of which David also speaks to God: "I am your servant, the son of your handmaid" (Ps. 115:16). And blessed Mary to the angel: "Behold the handmaid of the Lord; be it done to me according to your word" (Luke 1:38). Moses too had this servitude, of whom the Lord says to Joshua the son of Nun: "Moses," he says, "my servant is dead" (Josh. 1:2). And in another place: "Moses the servant of the Lord died in the land of Moab by the word of the Lord" (Deut. 34:5). God forbid, indeed, that we should believe that Moses and Mary had the spirit of servitude in fear, and not in the love of God. Nor is it any wonder that men, holy though they are, are nobly called servants of God, since through the prophet Isaiah the Father speaks to the Son: "It is a great thing for you to be called my child (puer)" (Isa. 49:6), which in Greek is said: μέγα σοί ἐστι τοῦ κληθῆναί σε παῖδά μου. Now because "child" (puer), that is, παῖς, can according to the Greeks signify both servant (famulus) and son, we inquired in the Hebrew, and found written not "my son" but "my servant", that is, ABDI (עבדי). Hence also the prophet Obadiah (Abdias), whose name means "servant of the Lord", received his name from his service to God. If it disturbs anyone that the Lord and Savior, who is the founder of the universe, is called a servant of God, he will not be disturbed if he hears him speaking to the apostles: "Whoever wishes to be greater among you, let him be the servant of all"; and: "The Son of man came, not to be served, but to serve" (Matt. 20:27, 28); and, lest he should seem to teach this by words alone, he showed it by example. For taking a towel, he girded himself, and filling a basin with water, he washed the feet of the disciples (John 13). It is therefore not impious to believe that he who had taken the form of a servant did those things which belong to a servant, so that he may be said to have served his Father's will, since he himself served his own servants. Now this servitude belongs to love, through which we are commanded to serve one another. And the Apostle himself, though he was free from all, made himself the servant of all (1 Cor. 9). And in another place: "Your servant," he says, "for Christ's sake". He is a servant of God who is not a servant of sin. "For everyone who commits sin is a servant of sin" (John 8:34). The Apostle, therefore, who was not a servant of sin, is rightly called a servant of God the Father and of Christ. Further, his saying but an apostle of Jesus Christ seems to me to be just as if he had said: prefect of the praetorium of Augustus Caesar, master of the army of the emperor Tiberius. For just as the judges of this age, in order to appear more noble, take their titles from the kings whom they serve and from the dignity with which they swell: so too the Apostle, claiming for himself a great dignity among Christians, inscribed himself beforehand with the title of an apostle of Christ, so as to awe his future readers by the very authority of the name, indicating that all who believed in Christ ought to be subject to him. Moreover, what we set down a little before as written to the Romans, "A servant of Jesus Christ", does not differ from his having said: a servant of wisdom, a servant of righteousness, a servant of sanctification, a servant of redemption: "For Christ was made for us by God the Father wisdom, righteousness, sanctification and redemption" (1 Cor. 1:30).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"

[[commentary]]
quote='''
According to the faith of the elect of God, and the knowledge of the truth which is according to piety, in the hope of eternal life, which God, who does not lie, promised before eternal ages; but he has manifested in his own times his word in the preaching which has been entrusted to me according to the command of our Savior God. To Titus, dearest son, according to the common faith: Grace and peace from God the Father, and Jesus Christ our Savior. He who had said, not out of humility, as most suppose, but truly: "Even if I am unskilled in speech, yet not in knowledge", a Hebrew of the Hebrews, as to the Law a Pharisee, does not unfold his profound meanings in the Greek tongue, and scarcely brings out in words what he thinks. Let us therefore discuss each point as it is written, following the order of the meanings and the sequence of the matters rather than of the words. According to the faith, he says, of the elect of God: refer what he has brought in to what precedes: Paul, a servant of God, but an apostle of Jesus Christ according to the faith of the elect of God, that is, of those who are not only called but also elect. Among the elect themselves, too, there is great diversity according to the variety of their works, minds and words. Nor does whoever is elect of God at once possess faith according to his election, or have knowledge of the truth according to his faith. Hence the Savior also spoke to the Jews who had believed in him: "If you remain in my word, you will know the truth, and the truth will set you free" (John 8:31, 32). And the evangelist testifies that he said these things to those who believed indeed, but did not know the truth, which they could attain if they remained in his word, and, being made free, would cease to be servants. The question is asked why, to his saying according to the faith of the elect of God and the knowledge of the truth, he joined which is according to piety: whether there is some truth that is not set in piety, and the knowledge of the truth which is according to piety is now brought in to distinguish it from that other. There plainly is a truth that does not have piety: if someone knows the art of grammar, or dialectic, so as to possess the method of speaking correctly and to judge between false and true. Geometry also and arithmetic and music have truth in their knowledge; but that knowledge is not of piety. The knowledge of piety is to know the Law, to understand the prophets, to believe the Gospel, not to be ignorant of the apostles. And on the contrary there are many who have a true knowledge of piety, but not at once the truth of the other arts as well, and of those which we mentioned above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
