[[commentary]]
quote='''
He threatens, therefore, the royal house and the city of Jerusalem and the temple, which he calls the head of Lebanon, that it is to be reduced to desolation together with all its cities, not by the power of the Babylonian king but by the command of the Lord, who says: I will sanctify against you one who slays. And Nebuchadnezzar and all his army are called 'holy' because he carries out the sentence of God. 'And they shall cut down', he says, 'your choice cedars' — all the powerful men and princes of the city — 'and cast into the fire, so that the flame devouring all things may consume them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
