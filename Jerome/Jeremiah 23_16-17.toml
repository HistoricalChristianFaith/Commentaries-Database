[[commentary]]
quote='''
Thus says the Lord of hosts: Do not listen to the words of the prophets who prophesy to you and deceive you! They speak the vision of their own heart and not from the mouth of the Lord. They say to those who blaspheme me — or cast away my word — : The Lord has spoken: peace shall be to you; and to everyone who walks in the perversity of his heart they have said: Evils shall not come upon you. Lest the people should think itself free of guilt if it acquiesced in perverse teachers, 'Do not', he says, 'listen to the words of the prophets who prophesy to you a lie and deceive you', — for the punishment will be equal for master and disciple — 'they do not speak from the mouth of the Lord, but the things they have feigned in their own heart. They say to those who blaspheme me' — namely to heretics and perverse men — 'or who cast away my speech, what do they say?: The Lord has spoken: peace shall be to you; do not fear harsh punishments nor be terrified by empty threats; peace shall be to you, and tranquillity, and whatever we say and announce to you, the Lord has spoken; nor shall evil come upon you, which you fear because of a bad conscience, but good, which the Lord has spoken to you.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
