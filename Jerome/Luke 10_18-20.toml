[[commentary]]
quote='''
For Lucifer, who in Hebrew is called ELIL (הילל), Aquila translated howling son of the dawn. For truly he ought to howl and wail, who because of his pride was cast headlong from heaven to earth and crushed. Hence the Savior too says to the disciples: I saw Satan falling like lightning from heaven (Luke 10:18). Not, I see now; but I saw before, when he fell. And if he fell from so great a height because of pride, you too ought not to glory because the demons are subject to you, but because your names are written in heaven; so that whence he fell through pride, you may ascend through humility.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
