[[commentary]]
quote='''
Behold, the days are coming, says the Lord, and I will send a famine into the land, not a famine of bread, nor a thirst for water, but of hearing the word of the Lord. And they shall be moved from sea to sea, and from the north to the east they shall go about seeking the word of the Lord, and shall not find it. In that day the beautiful virgins shall fail, and the young men, in thirst, who swear by the sin of Samaria, and say: Your god lives, Dan, and the way of Beersheba lives; and they shall fall and shall not rise again any longer. LXX: Behold, the days are coming, says the Lord God, and I will send forth a famine upon the land, not a famine of bread nor a thirst for water, but a famine of hearing the word of the Lord. And the waters shall be moved from sea to sea, and from the North to the East they shall go about seeking the word of the Lord, and shall not find it. In that day the beautiful virgins shall fail, and the youths, in thirst, who swear by the propitiation of Samaria; who say: Your god lives, Dan, and your god lives, Beersheba; and they shall fall and shall not rise again any more. 'Waters' are not found in the Hebrew; and 'propitiation', which we have rendered 'sin', and which is called asamath by the Hebrews, signifies an idol, which is the beginning of sins. Ancient history, Latin as well as Greek, and that of all the barbarian nations, relates that nothing is harder than famine, which often compels the besieged to feed on human flesh and to rage against their own nature, so that parents do not spare their little children, and marital affection tears apart the limbs of a wife once loved. If the famine of bodies does this, what must be said of the famine of souls? This famine, on the day of the Lord's resurrection, overwhelmed the people of the Jews, and joined to the famine was a most burning thirst, since they did not have the bread which came down from heaven, nor those waters which flowed from the belly of Jesus. The law has been taken away from them, and the prophets have fallen silent in eternal silence; they are moved from sea to sea, and from the British Ocean to the Atlantic Ocean, that is, from the west to the south, and from the north to the east, wanderers through the whole world, and they are not able to find the word of God. At this place we shall ask the Jews what day they think is signified, in which they are to endure a famine of hearing the word of God, especially since they read the Scriptures and follow the lowliness of the letter? To them we press home that what was foretold is a famine of spiritual understanding, in which Christ is discerned, and the passion and resurrection of the Lord are found. They go around the world and seek the word of the Lord and do not find it, because they denied the Word of the Lord, which came to pass in the hands of all the prophets, which in the beginning was with the Father, which was made flesh and dwelt among us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
But the Lord sends a famine into the land upon those who savor earthly things; and a famine not of bread, and a thirst not of water, but of hearing the word of the Lord, when on account of the sins of the people teaching fails in the churches; and from sea to sea, that is, from salt and most bitter waves they come as far as the sea; not meeting with rivers, nor with most sweet and varied springs, but running back again to bitter things; and from the north to the east, desiring to forsake the north, which is the harshest wind and is called 'the right-hand wind' by the ignorant, and to reach the east, which they will not be able to find, because they do not go by a straight road but wander about by devious paths, and, not keeping to the king's road, are led along winding turns.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
