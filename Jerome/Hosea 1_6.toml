[[commentary]]
quote='''
And she conceived again and bore a daughter; and he said to him: Call her name: Without Mercy; for I will no more have mercy on the house of Israel, but with forgetting I will forget them. And on the house of Judah I will have mercy; and I will save them in the Lord their God; and I will not save them by bow and sword, and by war, and by horses, and by horsemen. LXX: And she conceived again and bore a daughter, and he said to him: Call her name: Without Mercy; for by no means will I any more have mercy on the house of Israel, but opposing I will oppose them; but on the sons of Judah I will have mercy, and I will save them in the Lord their God; and I will not save them by bow, nor by sword, nor by war, nor by horses, nor by horsemen. After the bow of Israel was crushed and broken in the valley of Jezreel, and the kingdom of the ten tribes was forsaken, so that they were led into captivity, there is no longer born a Jezreel, that is, the seed of God, nor a son of the male sex; but a daughter, that is, a woman, of the frail sex, and one exposed to the insults of the victors; and she is called: Without Mercy. For she was led away captive for this reason, because she did not have the mercy of God. And the indignation of the Lord must be considered, in that he says he will by no means have mercy any more on the house of Israel, but will blot them out of his memory with an eternal forgetting; for to this day they serve the kings of the Persians, and their captivity has never been released.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
