[[commentary]]
quote='''
The pride of your heart has lifted you up. For which of the heretics is not lifted up into pride, making little of the simplicity of the Church and reckoning faith to be want of skill? Dwelling in the clefts of the rock, exalting his throne. Although the rock is frequently put either for the person of the Lord or for solidity, whence the prophet too says: He has set my feet upon the rock, and to Peter it is said: You are Peter, and upon this rock I will build my Church, yet it is also frequently taken in the contrary sense: I will take away, he says, the heart of stone, and I will give you a heart of flesh; and: God is able from these stones to raise up children to Abraham; and above all here, where he did not say, dwelling upon the rock, on which the prudent builder builds his house, but in the clefts of the rock, so as to signify the cleavings of the heresies from the rock of Christ and from the Church. Furthermore, what follows, Exalting your throne, and, Who says in his heart: Who will drag me down to the earth?, shows the swelling of the heretical mind, of men who trust in their own mysteries and secrets and, as far as lies in them — but we ought to take this hyperbolically —, promise themselves the kingdoms of heaven. Whence the Apostle writes to men of this kind: Already without us you reign; and would that you did reign, that we also might reign with you. David too says something of the kind: They have set their mouth against heaven, and their tongue has passed over the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
