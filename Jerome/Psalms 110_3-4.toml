[[commentary]]
quote='''
The Jews, to make sport of the truth of the question, invent many frivolous things, asserting that it was Abraham's home-born servant, whose son was Eliezer of Damascus, and that the psalm was written in his person, because after the slaughter of the five kings the Lord God said to his lord Abraham: Sit at my right hand until I make all your enemies the footstool of your feet. Let us ask them: How did God say to Abraham the words that follow: With you is the beginning in the day of your power, in the splendors of the saints; from the womb before the morning star I begot you; and: The Lord has sworn and will not repent: You are a priest for ever according to the order of Melchizedek, and let us compel them to answer how Abraham was begotten before the morning star and was a priest according to the order of Melchizedek, for whom Melchizedek offered bread and wine, and from whom he received tithes of the spoil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
