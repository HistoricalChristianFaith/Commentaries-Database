[[commentary]]
quote='''
And now many nations are gathered against you, who say: Let her be stoned, and let our eye look upon Zion. But they have not known the thoughts of the Lord, and have not understood his counsel, for he has gathered them like hay of the threshing floor. Arise and thresh, daughter of Zion, for I will make your horn iron, and your hoofs I will make bronze, and you shall break in pieces many peoples; and you shall slay to the Lord their plunder, and their strength to the Lord of the whole earth. LXX: And now many nations are gathered against you, of those who say: Let us insult, and let our eyes look upon Zion. But they did not know the thought of the Lord, and did not understand his counsel, for he has gathered them like sheaves of the threshing floor. Arise and thresh them, daughter of Zion, for I will make your horns iron, and your hoofs I will make bronze, and you shall break in pieces many peoples, and you shall vow to the Lord their multitude, and their might to the Lord of the whole earth. O Jerusalem, O daughter of Zion, who will come even to Babylon, and there will be delivered, and the Lord will redeem you from the hand of your enemies: now, meanwhile, many nations are gathered against you, who speak as of an adulteress and say: Let her be stoned, and let our eye look upon her. Or, as it is written in the LXX: Let us insult and rejoice, and let our eyes look down upon Zion; and they did not know the will and counsel of the Lord, that the nations were gathered against you for this very reason, that you might crush them like hay or stubble of the threshing floor. Arise, therefore, daughter of Zion, and with the iron horns, which I promise to give you, and with the bronze hoofs, which you are to receive, winnow and crush the peoples, and slay them to the Lord of the whole earth. For he delights in such a sacrifice and such an offering. The Jews, seeing that these things have not yet been fulfilled, promise this there, at the future coming of Christ, and say that all nations will serve the Jewish people, and that the very empire of the Romans, which they interpret under the name of Edom, is to be crushed by their hoofs and winnowed by their horns. How foolish this is, is easily proved from all the Scriptures; but that belongs to another time. We, therefore, who follow not the letter that kills but the spirit that gives life, say that against the daughter of Zion, which is interpreted as the Church, many nations of demons are gathered, and in the present age, which is set in the evil one, they insult her and rejoice in the slaughter of her sons, not knowing the thoughts of the Lord, nor recognizing his counsel. For if they had known, they would never have crucified the Lord of majesty. He will therefore gather them like sheaves of the threshing floor, so that whatever they seemed to have that is thorny and rough, empty and light, she may crush with her hoofs and winnow with her horns, and the pure grain that remains may be offered as gifts to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
