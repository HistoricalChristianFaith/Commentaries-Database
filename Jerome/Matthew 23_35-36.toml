[[commentary]]
quote='''
The rule of the Scriptures is only to know two generations, one of good the other of bad. Of the generation of the good it is said, The generation of the righteous shall be blessed. (Ps. 112:2.) And of the bad it is said in the present passage, Generation of vipers. These then, because they did against the Apostles like things as Cain and Joas, are described as of one generation.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Let us say briefly why the blood of Abel the just, up to Zechariah son of Barachiah, is required of that generation, though it killed neither of them. It is a rule of the Scriptures to set forth two generations, of the good or of the evil, that is, one for each. Let us take examples from the good: Who shall ascend into the mountain of the Lord, or who shall rest on his holy mountain? and when he had described the many who are to ascend into the mountain of the Lord, who lived in different ages, he afterwards adds: This is the generation of those who seek the Lord, who seek the face of the God of Jacob; and in another place, of all the saints: The generation of the just shall be blessed; but of the evil, as in the present passage: generation of vipers and all things shall be required of this generation; and in Ezekiel, when he had described the sins of the land, the prophetic word added: If Noah and Job and Daniel are found there, the sins of that land will not be forgiven, wishing all the just who would be like them in virtues to be understood through Noah and Job and Daniel. Therefore these too, who did things against the apostles like those of Cain and Joash, are reported to be of one generation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
