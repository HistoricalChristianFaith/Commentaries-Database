[[commentary]]
quote='''
It follows: For Thou wilt bless the just. Thou wilt bless, in the future: therefore blessedness is deferred.

Lord, Thou hast crowned us as with a shield of good will. In the world one thing is the shield, another the crown; but with God He Himself is the shield, He Himself is also the crown. As a shield He protects, as God He crowns: He Himself is our shield, He Himself is also our crown. And this is what he says, Lord, Thou hast crowned us as with a shield of Thy good will: Thou hast protected us with Thy shield, and Thy protection was our crown, that is, our crown was Thy shield, it was our victory. For the crown is interpreted as victory.

Let us give thanks to God, and let us entreat Him, that in His good will He Himself may be our shield and our crown, that we may never withdraw from Him, that we may follow Him, and may say with Jeremiah: 'And following after Thee I have not grown weary.' To whom be glory unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_002.html'
source_title="Homily 2, on Psalm 5"

[[commentary]]
quote='''
His truth shall surround you with a shield. Our shield is round, that is, it hedges us in on every side. Not only is it a shield, but it is also a wall. "Lord, as with a shield of your good will you have crowned us." Does someone crown with a shield? See what he says: Lord, as with a shield of your good will you have crowned us. What does he say? You will protect us, and make us conquer, and after the victory you will crown us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_020.html'
source_title="Homily 20, on Psalm 90"

[[commentary]]
quote='''
"O Lord, you have crowned us as with a shield of your good will." See what he says, O Lord, you have crowned us as with a shield of your good will. Does anyone crown with a shield? Surely he who crowns, crowns with flowers, crowns with gold, crowns with the other kinds of crowns. Does anyone crown with a shield? But the Lord's shield is a crown: for it protects and defends, and thus it crowns. And here, therefore, what is there signified by a shield, here is signified by mercy; and the shield, while it protects, is mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_029.html'
source_title="Homily 29, on Psalm 102"
