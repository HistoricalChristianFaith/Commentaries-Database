[[commentary]]
quote='''
Let us seek other horses also, which the Lord mounts. In the fourth book of Kingdoms (2 Kings) we read that Elisha's servant rose early, and going out saw an army surrounding the walls of the city, and horses and chariots. And after his eyes were opened at the prophet's prayers: He looked, it says, and behold, the mountain was full of horses, and chariots of fire round about Elisha. Attend carefully to this: horses are seen, and chariots, and yet among so many thousands of horses and chariots there is no rider; of these horses he was the charioteer and the driver of whom the psalmist sings: You who sit upon the Cherubim, show yourself. With such horses and such a chariot Elijah too was snatched up to heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
