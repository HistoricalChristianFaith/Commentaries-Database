[[commentary]]
quote='''
Here is a latent allusion to the form of salutation in Hebrew and Syriac; they say Salemalach or Salamalach, for the Greek χαῖρε, or Latin Ave; that is, 'Peace be with you.' The command then is, that on entering any house they should pray for peace for their host; and, as far as they may be able, to still all discords, so that if any quarrel should arise, they, who had prayed for peace should have it—others should have the discord; as it follows, And if that house be worthy, your peace shall rest upon it; but if it be not worthy, your peace shall return to you again.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And entering into the house, greet it; and if the house is worthy, your peace will come upon it; but if it is not worthy, your peace will return to you. He has expressed, in a hidden way, the greeting of the Hebrew and Syriac language. For what in Greek is said χαῖρε and in Latin haue, this in the Hebrew and Syriac language is called salom lach or salama lach, that is, peace be with you. What he commanded, then, is this: entering a house, call down peace upon your host, and, as far as lies in you, calm the wars of discord; but if contradiction arises, you will have the reward of the peace you offered, and they will possess the war they wished to have.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
