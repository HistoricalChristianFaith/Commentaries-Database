[[commentary]]
quote='''
I think this is what Jacob's ladder also signifies, when he fled Esau his brother. 'And he came,' it says, 'to Bethel, and slept there, and put a stone at his head.' See our ascetic; he was fleeing a most cruel man, he was fleeing his brother, and he found help in a stone. That stone is Christ; this stone is a help to those who suffer persecution: but to the unbelieving Jews a stone of stumbling and a rock of offense. 'And Jacob saw there,' it says, 'a ladder set up from the earth all the way to heaven; and in heaven,' it says, 'the Lord leaning upon it (epestērigmenon autēi). And he saw,' it says, 'angels ascending and descending.' See what he says. He saw angels climbing up; he saw Paul climbing up. He saw angels descending: Judas the traitor was falling down. He saw angels ascending: holy men going from earth to heaven. He saw angels descending: the devil and the demons and his army cast down headlong from heaven. Great is the difficulty of climbing from earth to the heavenly places. We fall down more easily than we climb up. We fall down easily: in ascending there is great toil, there is great sweat. If I am on the first step, how much remains for me all the way to heaven? If I am on the second, if on the third, if on the fourth, if on the tenth, what does it profit me unless I reach the top? Suppose that ladder of mine has fifteen steps: I have come all the way to the fourteenth: unless I hold the fifteenth, what does it profit me that I have come to the fourteenth? If I come to the fifteenth, and fall down, the greater the ascent, the greater the fall. And at the same time consider the sacred meaning: that it is great toil and great sweat to climb from earth to heaven. Do you want to know what those steps are? What is the first step? I think the first step is fasting, for it is still near the earth: we withdraw from the earth, we climb up: yet we still think about earthly and bodily things. Someone may say: What does fasting profit me? I seek that my soul be pure before the Lord: how many do not fast, and yet are holy. I do not say this. If Paul the apostle, the vessel of election, chastised his body and brought it into subjection, lest, having preached to others, he himself should be found a castaway: if he says 'But I see another law resisting the law of my mind and leading me into captivity,' and afterward says 'Unhappy man that I am, who shall deliver me from the body of this death?' — if he fears the snares of the body, are we secure? If he says 'When I am weak, then am I stronger' — weakness of the body is health of the soul. Why do I say all this? Because abstinence is the first step. Let us not at once suppose that, if we have fasted, we climb up to the kingdom of heaven: fastings do not lead us to the kingdom of heaven, but without fastings we do not climb up to the kingdom of heaven. By themselves they do not profit: together with other things they profit. Why have I said all this? Because it is as it were a foundation and a support (hypostērigma) for those ascending to greater things. But the second step is to renounce the world, to seek nothing of the world, to despise earthly things. Someone may say: And is doing this the second? I say, the second. It is nothing to let go of earthly things: to let go of the vices of the soul, that is a great thing. For if I have fasted, that is, if I am on the first step: if I have let go of my possessions, that is, if I am on the second step: what does it profit me, if I am quarrelsome, if I am irascible, if I am a slanderer, if I am envious? It is nothing great to let go of earthly things: the vices are greater, which are to be let go. But someone may say: It is difficult, it is great, it is hard. And it is great for this very reason, because it is difficult. The athlete of Christ is not crowned unless he has striven lawfully. Let it cause despair to no one: the ascent is arduous, it is difficult, despair is born. Do not despair, O man: on the fifteenth step the Lord is above, he watches you, he gives help. If you are on the first step, and the distance (diastēma) between the first and the fifteenth seems great to you: do not look at the steps, but look to the Lord. And see what he says. He did not say, I saw the Lord standing on the fifteenth step: for we could not reach the Lord standing and upright. But see what he says: he saw him leaning upon the ladder. See what he says: from the fact that he was standing, he bent himself and humbled himself, so that we might be able to ascend. The Lord is bent down, he humbled himself for your sake: ascend secure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_041.html'
source_title="Homily 41, on Psalm 119"
