[[commentary]]
quote='''
For thus says the Lord to the man of Judah and Jerusalem: break up fallow ground for yourselves, and do not sow upon thorns; be circumcised to the Lord and take away the foreskins of your hearts, men of Judah and inhabitants of Jerusalem, lest my indignation go forth like fire and be kindled, and there be none to quench it, because of the wickedness of the thoughts — or devices — of yours. For what we said: be circumcised to the Lord and take away the foreskin of your hearts, Symmachus put: be purified to the Lord and take away the wickednesses of your hearts, understanding circumcision as cleansing and foreskins as vice. And this is commanded to the men of Judah and Jerusalem who follow the true faith and dwell in the Church: that they should not sow upon thorns, which the word of the Gospel signifies, thorns that choke the seed of God, but should first make fallow ground, dig up all the brambles and take away the briars, so that clean fields may receive clean seeds. This is what is said in another place: do not cast your pearls before swine, and do not give what is holy to dogs. For how can a man hear the word of God and conceive the seeds and bear fruit, whose mind is full of the troubles of the world? And as for what follows: be circumcised to the Lord and take away the foreskins of your hearts, it is commanded to no one else but the man of Judah and the inhabitant of Jerusalem, that they should forsake the letter that kills and follow the Spirit that gives life. 'For if you do not do this,' he says, 'my indignation will go forth like fire and will be kindled, and there will be none to quench it'. And he therefore warns and foretells beforehand so as not to be compelled to do it, as we also prove in the case of the Ninevites, to whom the sentence was foretold so that they might turn aside the impending fury by repentance. And all these evils will come because of the wickedness of our thoughts or devices. Where are those who say that there is no sin in thoughts, when, according to the truth of the Gospel, all vices proceed from the heart?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
