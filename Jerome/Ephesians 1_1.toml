[[commentary]]
quote='''
If there is anything, Paula and Eustochium, that holds a wise man steady in this life and persuades him to remain with an even mind amid the pressures and whirlwinds of the world, I reckon it to be, first of all, the meditation and knowledge of the Scriptures. For since we differ from the other living creatures in this above all, that we are a rational animal and are able to speak, and since all reason and speech is contained in the divine books, through which we both learn God and are not ignorant of why we were created, I am amazed that some have arisen who either give themselves over to idleness and sleep and are unwilling to learn things that are most excellent, or think that others who have this pursuit deserve to be reproved. Though I could answer them more sharply, and briefly send them away, either offended or appeased, by saying that it is much better to read the Scriptures than to gape after increasing and heaping up wealth, I will say this, which I could make good even before the most unjust judge: that my leisure pleases me, and solitude seems to me more delightful than any crowd. And just as I do not reprove, do not condemn what they do, so they ought to grant me my trifles. I am not eloquent enough: what is that to you? Read someone more eloquent. I do not render Greek into Latin worthily: either read the Greeks (if you have knowledge of that language), or, if you are only a Latin, do not pass judgment on a free gift, nor, as the common proverb has it, look a gift horse in the teeth. Do I lay hands on you and drag you into court because you do not write our works? Anyone less skilled than I will read me; your sayings, perhaps, if you write them, Tully will admire. Did Tertullian deter the blessed martyr Cyprian from writing, or Cyprian Lactantius, or Lactantius Hilary? I say nothing of the other small fry who chatter along with me in their books. Unless there are small things as well, great things cannot stand out. Nothing is called first unless a second and a third follow. We do not climb to the top unless we step through the lowest places. Therefore I beseech both you who are here at present and the holy Marcella, the unique model of widowhood, not to hand over my little works readily to slanderers and the envious, nor to give what is holy to dogs and cast pearls before swine (Matt. 7). Since they cannot imitate good things, they do the only thing they can: they envy; and they think themselves learned and erudite in this, if they disparage others. I beseech you to answer them that they should take up the pen themselves, join three words together, as the saying goes, sweat a little, put themselves to the test, and learn from their own labor to pardon those who labor. For you yourselves know that you drove me to this work of explanation against my will and holding back. Not that from my youth I ever ceased either to read or to question learned men about what I did not know, or that I have had only myself for a teacher, as most do. Indeed, recently I went to Alexandria for this reason above all, to see Didymus and to ask him about everything I found doubtful in all the Scriptures. But it is one thing to compose books of one's own, for example on avarice and on faith, on virginity, on widows, and on each subject to join worldly eloquence to testimonies of the Scriptures sought out here and there, and to toss about a showy style almost in commonplaces; it is another thing to enter into the mind of a prophet and an apostle, to understand why they wrote, by what reasoning they established their view, what is peculiar in the Old Law to the Edomites, Moabites, Ammonites, Tyrians, Philistines, Egyptians and Assyrians; what, again, in the New Testament to the Romans, Corinthians, Galatians, Philippians, Thessalonians, Hebrews, Colossians, and to the Epistle to the Ephesians that we now have in hand. For they must have differing occasions, arguments and origins, according to the differences of the places and times and of the people to whom they were written. And just as the blessed John in his Apocalypse, writing to the seven Churches, in each of them either reproves particular vices or approves particular virtues, so too the holy apostle Paul heals the wounds inflicted in each several Church, and does not wish, after the manner of an unskilled physician, to cure everyone's eyes with one salve. And since a few days ago, at your request, we set out what we thought on the Epistle to the Galatians, we must now pass on to the Ephesians, the middle epistle of the Apostle, in meaning as in order. I call it the middle, not because, following the first ones, it is greater than the last, but in the way that the heart of a living creature is in the middle: so that from this you may understand with how great difficulties and how deep questions it is entangled. He was writing to Ephesians who worshipped Diana, not this huntress who holds a bow and is girt up, but that many-breasted one whom the Greeks call πολύμαστον, so that, namely, from her very image too they might falsely claim that she is the nurse of all beasts and living things. He was writing, moreover, to the metropolis of Asia, a city in which idolatry and, what always follows idolatry, the deceptions of the magic arts had so flourished that Demetrius said: and the temple of the great goddess Diana will be reckoned as nothing, and her greatness too will be destroyed, which all Asia and the whole world worships (Acts 19:27). In fact the Apostle stayed there three years, preaching the Gospel of God night and day, so that, once the citadel of idolatry was destroyed, the temples of the lesser cities might easily be taken. Scripture itself reports this very thing, how Paul addresses the Ephesians, saying: Therefore watch, remembering that for three years night and day I did not cease with tears to admonish each one of you; and now I commend you to God, and to the word of his grace, who is able to build up and to give you an inheritance among all the sanctified (Acts 20:31, 32). For they needed the Apostle's commendation to God, they whom the error of demons had held for so long; and they knew that there were certain spiritual powers, and had recognized a certain likeness of divinity in entrails and auguries and divinations. Hence he says to them again: Wherefore I testify to you this day that I am clean from the blood of all. For I did not hold back from declaring to you the whole will of God. And in another place: How I held back nothing of what was profitable to you, but declared it, and taught publicly and from house to house (ibid., 20). He had read in Ezekiel (ibid., 26, 27) that the watchman who had not forewarned the people of the coming of the enemy would have the blood of the citizens required at his hands; and therefore he recalled that he had declared the whole will of God and all things that would be useful to them, so that he might be free of their blood. And that you may know that those who had believed at Ephesus had been bound by demonic illusions and the arts of magic, it is recounted in the same Acts of the Apostles, where it says: Many also of those who had practiced curious arts brought their books together and burned them before all; and they reckoned up their price and found it fifty thousand pieces of silver: so mightily did the word of the Lord grow and gain strength (Acts 19:19). We have recounted all these things for this reason: to show why the Apostle, in this Epistle above all, gathered together obscure meanings and mysteries unknown to the ages, and taught about the might of the holy and the opposing powers: who the demons are, what they can do, what they were before, and how after the coming of Christ they were overthrown and destroyed. Of them he says: We have no struggle against flesh and blood, but against principalities and powers, against the rulers of this darkness, against the spiritual forces of wickedness in the heavenly places (Eph. 6:12). And in another place: But I will remain at Ephesus until Pentecost. For a great and effective door has been opened to me, but there are many adversaries (1 Cor. 16:8, 9). Now he remained at Ephesus until Pentecost, a time of gladness and victory, in which we do not bend the knee or bow down to the ground, but rising with the Lord are lifted up to the heights of heaven. And he remained because a door was open to him, and not a small door but a great one, so that, having bound and overcome the strong man, he might invade his house, plunder it, overturn it, and lead captivity captive (Matt. 12); and that strong man, gathering the columns of his henchmen, fought against the Apostle with his whole battle line, and was conquered. What sort of men the Ephesians were is proved most of all from this as well: that just as John, who was to relate the mystery of the Lord's ancient birth, reclined on his breast and drew a stream of teachings from the purest spring (John 13 and 21), so these too, falling on the neck of Paul as he departed (Acts 20), showed by their kisses and embraces that they had one treasure of knowledge with him, and bore witness with tears to their longing for their master. This too I point out in the preface, so that you may know that Origen wrote three volumes on this Epistle, and we too have followed him in part; and that Apollinaris and Didymus also published some short commentaries, from which we have culled a few things, it is true, and we have added or taken away some things as seemed good to us, so that the studious reader may recognize at the very outset that this work is partly another's and partly our own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
Paul, apostle of Jesus Christ, through the will of God.

If the preposition through (per) shows the ministry of the one through whom a thing is done, this meaning seems to me to accord with that statement: No one comes to me unless my Father has drawn him to me (John 6:44). And so it will come about that this too which is read in John's Gospel: All things were made through him (John 1:3), doubtless through the Son, does not prejudice our Lord Jesus Christ, as though he were less because he obeys the Father's will; just as now too it does not prejudice the Father that Paul is an apostle of Jesus Christ through his will. Others, however, understand this passage so as to think that Paul is shown to be an apostle of Jesus Christ through the will of God, which (they say) is Christ: so that, just as he is called wisdom and Word and power of God, and truth and resurrection and way, so he is also named will. Some think it makes no difference whether he said through (per) the will of God or from (ex) the will of God, because the Apostle uses these prepositions indifferently; and that "through the will of God" signifies the same as if he had said from the will of God.

To all the saints who are at Ephesus. Some, more curiously than is necessary, think, from the fact that it was said to Moses: These things you shall say to the sons of Israel: He who is has sent me (Exod. 3:14), that those too who are saints and faithful at Ephesus are named by the word for essence: so that, just as from the Holy One men are called holy, from the Just One just, from the Wise One wise, so from him who is these are called those who are; and that, according to the same Apostle, God chose the things that were not, to destroy the things that were. The very Scripture adduced in testimony they also expound in such a way that we are to understand the destruction of the things that were from what follows: That no flesh, he says, may glory in the sight of God (1 Cor. 1:29). For if, they say, anyone who is advancing, by God's doing, from what was not into being what is does not return thanks to the giver, but reckons that he subsists by his own merit and virtue, at once his being what he is is destroyed, and what he had been begins not to be. Others, however, think it is written simply, not to those who are, but to those who are saints and faithful at Ephesus.

And to the faithful in Christ Jesus. Since the unbelieving wife is sanctified in the faithful brother, and the unbelieving husband is sanctified in the faithful wife (1 Cor. 7:14); and there are also holy vessels, and dumb beasts that are slain for God in the temple (Num. 4 and 31): therefore those whom he had called saints he also called faithful; because faith comes down from the choice of one's own mind, whereas into sanctification we are sometimes taken up, without our will, by the bounty of the one who sanctifies. And as for his saying to the faithful in Christ Jesus, this too has been set down to mark a distinction of the most careful observance. For there are many faithful, but not in Christ Jesus. If someone returns a deposit, if someone does not deny what was entrusted to him, shows himself a faithful friend, is ready to give up his life rather than betray his faith (which we read of some philosophers, and, lest they should glory too much in it, an Athenian harlot accomplished it too), that man is indeed faithful, but he is not faithful in Christ Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
In the preface to the first book, O Paula and Eustochium, I discussed fully and more than fully the argument of Paul's Epistle to the Ephesians; and here and there, wherever occasion was given, though briefly, I have shown that the blessed Apostle wrote to none of the churches so mystically, and to none revealed the mysteries hidden from the ages. Now therefore, since, supported by the help of your prayers and of the holy Marcella, I am dictating the third, that is, the last, book on the same Epistle, it seems right to me to show that the etymology of the name itself also agrees with the meaning I set out above. Ephesus, rendered into the Latin language, means "will", or "my counsel in her", or at any rate "my soul in her". The will and the counsel and the soul of God are in him who can say: For he himself gave me knowledge of all things (Eccles. 1, and 1 John 5); and when the uncertain and hidden things of God's wisdom have been revealed to him, he will obtain the testimony of the one who says: I have found David, the son of Jesse, from Bethlehem, a man after my own heart, who will do all my will (Acts 13:22). The prophet Hosea also signifies a man of this kind, saying: Who is wise, and will understand these things; prudent, and will recognize them (Hos. 14:10)? Moreover, that you may know that there is a great distance between the simple righteous man and the wise righteous man, observe what glory each will attain in the resurrection of the dead. And many of those who sleep in the mud of the earth shall rise: these to eternal life, and those to reproach and eternal confusion. And those who understand shall shine like the splendor of the firmament, and many of the righteous like the stars for ever (Dan. 12:2). The righteous, he says, shall shine like the stars for ever; and those who understand, that is, who have knowledge of the Scriptures, like the splendor of heaven. Not that the learned man ought not also to be righteous; but that he who is righteous, unless he has been instructed, is as far from the wise righteous man as the gleam of the stars is from the light of the firmament. But if anyone, instructed only by meditation on the law, neglects his life, and does not dare to say: From your commandments I have understood; therefore I was directed to all your commandments (Ps. 118:104), that man, like sounding brass and a tinkling cymbal and salt that has lost its savor, is to be trampled underfoot in the dung (1 Cor. 13, Mark 9, and Luke 14). But if the choice between the two were given (setting aside the man who has both wisdom and righteousness), I for my part would rather have righteous rusticity than learned malice. For in the one case, though the glory is lesser, it is still glory to be made equal to the light of the stars; in the other, the punishments are greater in proportion to the advance in knowledge. The mighty shall suffer torments (Wisd. 6:7); and: The servant who knew his lord's will and did not do it shall be beaten with many stripes (Luke 12:47). I have said these things for this reason: to show why the name of the Ephesians sounds "the soul and counsel and will of God": they who, abandoning the illusions of the magic arts, transferred the zeal of error to the pursuit of truth. For their salvation Paul fought with so much sweat that he wrote to the Corinthians: If according to man I fought with beasts at Ephesus, what does it profit me, if the dead do not rise (1 Cor. 15:32)? What are these beasts? Those, surely, of which the Psalmist prays, saying: Do not hand over to the beasts the soul that confesses to you (Ps. 73:19). And in another place: Rebuke the wild beasts of the reed (Ps. 67:31). For our adversary the devil goes about like a roaring lion (1 Pet. 5:8). When he saw the chief city of Asia being snatched from his jaws at the teaching of Paul, he gathered all the troops of his henchmen and strove to crush him, and, insolently exalting himself, he wished like an eagle to set his nest above him (Isa. 14, Prov. 4). The Apostle perceived this, and keeping his heart with all watchfulness (since indeed he was not ignorant of his wiles), he spoke after the victory, it is true, but after a victory not bloodless: For we do not wish you to be ignorant, brothers, of our tribulation which came upon us in Asia: that we were weighed down beyond measure, beyond our strength, so that we were weary even of living (2 Cor. 1:8). And the fact that the Epistle is sent by Tychicus accords well with the mysteries of the same Epistle (1 Thess. 4). Of these the title of the ninth psalm also gives notice in advance: for the secrets of the son. For Tychicus is interpreted "silent": one who does not cast pearls before swine nor give what is holy to dogs, and who speaks freely to God. In my heart I have hidden your words, that I may not sin against you (Ps. 118:11).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
