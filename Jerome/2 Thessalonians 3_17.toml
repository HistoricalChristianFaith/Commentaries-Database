[[commentary]]
quote='''
And so that no suspicion of a forged Epistle might arise, from this place to the end he wrote it out with his own hand, showing that what came before had been written down by another. That Epistles were being sent under his name by false teachers he also shows when writing to the Thessalonians: "But we beseech you, brothers, by the coming of our Lord Jesus Christ, and by our gathering together unto him, that you be not quickly moved from your mind, nor be terrified, neither by spirit, nor by word, nor by an Epistle as if sent by us, as though the day of the Lord were at hand; let no one deceive you in any way" (2 Thess. 2:1 ff.). And to rescue the whole Epistle he was sending from the suspicion of falsity, he signed it at the end with his own hand, saying: "The greeting with my own hand, Paul's, which is the sign in every Epistle: thus I write: The grace of our Lord Jesus Christ be with you all" (2 Thess. 3:17, 18). The letter to the Colossians too, which he had dictated, he likewise signed underneath with his own hand: "The greeting with my own hand, Paul's: Be mindful of my chains". And wherever he knew that false teachers were present who might sow new doctrines by means of the Apostle's authority, he signed the Epistle with his own hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
