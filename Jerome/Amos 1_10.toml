[[commentary]]
quote='''
Therefore he says that he will send fire upon its walls, and that it will devour its houses or foundations, which the prophet Ezekiel, in the vision of Tyre, records that Nebuchadnezzar king of the Chaldeans did, where he says: He will surround you with fortifications, and he will heap up a mound round about. And again: Nebuchadnezzar king of Babylon made his army serve a great service against Tyre. Every head was made bald, and every shoulder stripped of hair, and wages were not paid to him, nor to his army, for Tyre, for the service with which he served me against her, because his army heaped up a mound for taking Tyre, which formerly was an island. And history relates that Alexander of Macedon also did this, so as to make out of the island a peninsula, which the Greeks call χεῤῥόνησον.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
