[[commentary]]
quote='''
Cursed be the man who will not hear the words of this pact, which I commanded your fathers in the day in which I brought them out of the land of Egypt, out of the iron furnace, saying: Hear my voice and do all that I command you, and you shall be my people and I will be your Lord. Not because of the privileges of race, not because of the injury of circumcision and the idleness of the sabbath, but because of obedience does God become the God of the people of Israel, and Israel his people. And here, indeed, he speaks as to servants, that they may please God; but in the Gospel the Lord says to the disciples: You, he says, are my friends, if you do what I command you. No longer do I call you servants, because the servant does not know what his lord does. But I have called you friends, because all that I have heard from my Father I have made known to you. And when they have become friends, from friends they pass over into sons; for as many as received him, to them he gave power to become sons of God. Hence he commands friends and sons: Be perfect, as your Father is perfect, enjoining likeness, not equality. And there it is obedience to the commandments, here likeness to God. And what he says: in the day in which I brought them out of the land of Egypt, out of the iron furnace, gives us to understand that the oven and the iron furnace, kindled, signify the greatness of tribulation and punishment, not some place of punishment made ready out of the material of iron.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
