[[commentary]]
quote='''
Before the cord of silver is broken, and the golden fillet runs back, and the pitcher is crushed upon the fountain, and the wheel is broken upon the cistern. And the dust returns into its earth as it was, and the spirit goes back to God, who gave it. Vanity of vanities, said Ecclesiastes, everything is vanity. He returns to what came before, and after a great hyperbaton – which he had interposed from the place where he says: And remember your Creator, in the day of your youth; before the days of malice come, and before the sun and moon are darkened, and the rest, in the day in which the keepers of the house will be moved –. Now he concludes the sentence he had begun with a similar ending, saying: Before the cord of silver is broken, and this or that happens. By the cord of silver he shows this bright life, and the breath that is given us from heaven. The running back of the golden fillet signifies the soul, which runs back thither whence it had come down. Further, the two remaining things that follow, the crushing of the pitcher upon the fountain and the breaking of the wheel upon the cistern, are, by metaphor, riddles of death. For as a pitcher that is crushed ceases to draw, and when the wheel by which water is raised from cisterns and wells is broken, rolled up, as the Seventy translators would have it, in its own cord, the use of the water is cut off; so too, when the cord of silver has been broken and the stream of the soul has run back to its fountain, the man will perish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
