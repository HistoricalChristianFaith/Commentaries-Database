[[commentary]]
quote='''
Where is your king, of whom you said to Samuel: Appoint a king over us to judge us, as the other nations also have. And when he spoke against it, you answered: By no means; but there shall be a king over us, and we too shall be like all the nations, and our king will judge us, and go out before us, and fight for us. Let him, then, of whom you had promised yourself that he would fight your wars, now come to your aid in your need, and free all your cities from servitude. Where are your judges? Where are your kings? For you said: Give me a king and princes; and so I gave you Saul as king in my fury, so much so that in the days of harvest I displayed rain, contrary to the nature of the province of Judea. And I took away, he says, the king in my indignation, namely Zedekiah, so that the one I had given with fury I might take away with indignation. Others think that the king given in fury was Jeroboam son of Nebat, and the one taken away in indignation Hoshea, the last king of the ten tribes. This which we have expounded, I gave you a king in my indignation, and I took away the king, the Hebrews refer to the future tense. At that time, he says, when you were saying: Give me a king and princes, I answered you through Samuel that I would give you one in my fury and would take him away in my indignation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
His king and judges are the devil and the demons, or all the princes of perverse dogmas, who will not be able to free them in the time of need and distress, who were given in fury and will be taken away in indignation; not that the Lord wished them to have such kings, otherwise he would not take away those whom he had given of his own accord, but because he let them go after their own wills, so that, eating, and with their flesh grown fat, they might be nauseated and vomit it out through their nostrils, and begin to hate those whom they followed with such zeal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
