[[commentary]]
quote='''
For who could believe that a god is formed by adze, file and auger and hammer? And that images are either cast in the coals, or by rule, plane and corner tools and compass suddenly rise up into gods? Especially since the cheapness of the art is shown by the hunger and thirst of the craftsman. For a wooden statue is made, expressing the human form, and the more beautiful it is, the more august a god it is thought. It is set in a shrine and shut up in an eternal prison, the thing that grew for a long time in the forests and, according to the variety of trees, was a cedar or a holm oak or an oak or a pine. And in a wondrous manner its chips and shavings are thrown into the fire to warm the god's craftsman and to cook various stews; but the other part is formed into a god, so that, when the work is finished, its maker may worship it and invoke the help of his own work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
