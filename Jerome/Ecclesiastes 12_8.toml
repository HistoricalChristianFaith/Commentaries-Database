[[commentary]]
quote='''
After the description of human death, beautifully repeating the opening of his book, he says: Vanity of vanities, said Ecclesiastes, all is vanity. For since all the labor of mortals, which has been discussed in the whole volume, comes to this, that the dust returns into its earth and the soul goes back thither whence it was taken, it is a matter of great vanity to labor in this world and to gather what will profit nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
