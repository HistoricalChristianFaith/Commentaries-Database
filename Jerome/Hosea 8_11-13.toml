[[commentary]]
quote='''
Now the Apostle teaches that there is one altar in the Church, and one faith, and one baptism; deserting this, the heretics have fashioned for themselves many altars, not for appeasing God, but for a multitude of offenses. Therefore they do not deserve to receive the law of God, since they had earlier despised those laws which they had received. And if they have said anything from the Scriptures, it is to be compared not with the divine words, but with the thoughts of the pagans. These men sacrifice many victims and eat their flesh, deserting the one victim of Christ; nor do they eat the flesh of him whose flesh is the food of believers. Whatever they do, feigning the order and rite of sacrifices, whether they give alms, or promise chastity, or feign humility and deceive all the simple with pretended blandishments, the Lord will accept nothing of sacrifices of this kind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
