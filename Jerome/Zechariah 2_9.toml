[[commentary]]
quote='''
And God lifts up his hand to strike the hostile nations, and to lead his people back either into Jerusalem or into the Church. By the hostile nations, according to tropology, understand the opposing powers, which every day subject sinners to their power and compel them to serve them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
