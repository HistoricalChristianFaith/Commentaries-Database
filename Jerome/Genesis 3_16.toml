[[commentary]]
quote='''
(Verse 16) I will multiply your sorrows and your groanings. For sorrow and groaning, it has pains and conception in Hebrew.

And for your conversion. Regarding the conversion of Aquila, the society: Symmachus transferred the desire or impulse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
And also subject to their husbands: lest, puffed up by riches and rank, they not remember the sentence of God by which they are subjected to their husbands. For he says to the woman: "Your turning shall be to your husband, and he shall rule over you" (Gen. 3:16). In this the prudence of holy Scripture is to be considered: that the Lord did not say this to the man, saying, "You shall rule over your wife", but to the woman herself, so as to leave her the reward of compliance, since it is in her own power, if she wishes to obey the precepts of God, to serve the man and to be subject to her husband, so that it might in some way be a free servitude, and full of love; she is therefore serving her husband while she fears to offend him. For man was not created for the woman, but woman for the man. And since the man is the head of the woman, and Christ the head of the man, any wife who is not subject to her husband, that is, to her head, is guilty of the same crime as the man is if he is not subject to Christ, his head. And the word of the Lord is blasphemed either when the first sentence of God is despised and counted for nothing, or when the Gospel of Christ is defamed, while she who is a Christian, and subject by the law of God, desires, against the law and the faith of nature, to command her husband: when even Gentile women serve their husbands by the common law of nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
