[[commentary]]
quote='''
(in Matt. 15) Wonderful is the folly of the Pharisees and Scribes; they accuse the Son of God, because He keeps not the traditions and precepts of men.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Why do your disciples transgress the tradition of the elders? Astonishing is the folly of the Pharisees and scribes. They accuse the Son of God of not keeping the traditions and precepts of men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
For they do not wash their hands when they eat bread. The hands, that is, the works, not of the body but of the soul, are what must be washed, so that the word of God may come to be in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
