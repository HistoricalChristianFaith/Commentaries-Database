[[commentary]]
quote='''
They hated him who rebukes in the gate, and abhorred him who speaks perfectly. LXX: They hated him who reproves in the gates, and abhorred the holy word. These upon whom God smiles devastation, and brings plundering upon them, who are strong in evil and mighty to oppress, hated him who rebukes in the gate, that is, in court: either me, or the other prophets who have been sent to them; and him who speaks perfectly, or the immaculate word, as Symmachus translated, or the holy speech, as Theodotion and the LXX rendered. That the judgments of the people took place in the gate, according to the ancient custom of the Jews, we have both often read and frequently explained, so that neither would the farmer coming to a case be frightened by the throng of the city and its novel aspect, nor would the inhabitant of the city hasten far from the city and seek the conveyance of beasts of burden. This much let us say according to the letter. But it is a great sin to hate him who rebukes, especially if he rebukes you not out of hatred but out of love; if alone with you alone; if with another brother taken along; if afterwards in the presence of the Church; so that he may be seen to bring the charge not from a desire to disparage, but for your amendment. We often read in the Scriptures of double gates, of death and of life, of vices and of virtues, as in that place in the psalms: You who lift me up from the gates of death, that I may announce all your praises in the gates of the daughter of Zion. There is no doubt that he signifies the Church: the lofty Mount Zion, and the city of the living God, the heavenly Jerusalem, and the multitude of angels, and the Church of the firstborn, who are written in heaven. He who has been lifted up in the gates of Zion will not be able to fear the gates of death, of which the Lord spoke to Peter: Upon this rock I will build my Church, and the gates of hell shall not prevail against it. The gates of virtue we learn plainly in another psalm: Open to me the gates of righteousness; having entered into them, I will confess to the Lord. This is the gate of the Lord; the righteous shall enter into it. Finally, Wisdom too, in the gates of the city, said boldly: As long as the innocent have held to righteousness, they will not be put to shame. Therefore I think that the gates of the city, that is, of the soul that believes in Christ, are the virtues through which Christ enters into those who believe. And since it is not written in which gates they hated him who rebukes, whether in the evil or in the good, let us refer it to both. The prophet reproves sinners standing in the gates of vices, and for that reason he is held in detestation by them. Or certainly the prophet himself stands in the gates and beginnings of the virtues, and is hated by those whom he rebukes; and it is not enough for sinners to hate him who reproves, or rebukes, in the gates, unless they also abhor the holy word that is brought forth from his mouth. For he who does not receive the prophet does not receive him who sent him. But if they abhorred the holy word, or him who spoke perfectly — moreover, the holy word is the Lord Jesus, of whom it is said: You will not give your holy one to see corruption —, all the Jews, saying anathema to Jesus, abhor the word of God, which is both perfect and holy and immaculate. For to the sinner piety is an abomination. And whatever we have said of the Jews can be referred both to the heathen and to the heretics, of whom the former abhor all the holy Scriptures, in which is the word of God; the latter, while they perversely understand what they read, set up an abomination in the house of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
