[[commentary]]
quote='''
And as for his saying, One body and one spirit: either the one body of Christ is simply understood, which is the Church, or else the body which he deigned to assume from the Virgin, lest they should think that he was embodied as many times as he appeared in the Old Testament. And one Holy Spirit: for he is the one bestower and sanctifier of all. Or else the one body refers to the life and works which in Greek are called πρακτικὸς βίος (the active life); and the one spirit to knowledge and contemplation, which properly has its place in the heart and is called by them θεωρία. When, therefore, anyone has become a member of the Church and is not separated from its one spirit, he will consequently be in the one hope of the calling. It is asked how there is one hope of the calling when there are different mansions with the Father. To this we shall say that the one hope of the calling, the kingdom of heaven, is as it were the one house of God the Father, and that in the one house there are various mansions. For one is the glory of the sun, another of the moon, another of the stars (1 Cor. 15:41). Or else something more subtle is indicated: that at the end and consummation of things all things are to be restored to their original state, when we shall all be made one body and be re-formed into a perfect man, and the Savior's prayer for us will be fulfilled: Father, grant that, as I and you are one, so these too may be one in us (John 17:21).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
