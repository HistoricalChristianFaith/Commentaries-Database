[[commentary]]
quote='''
And when they have ceased, there will no longer be a stumbling block of bitterness and a thorn of pain pricking and wounding the people of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
