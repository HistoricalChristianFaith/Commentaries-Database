[[commentary]]
quote='''
O boastful enquiry and ostentation of fasting much to be blamed, nor can John's disciples be excused for their taking part with the Pharisees who they knew had been condemned by John, and for bringing a false accusation against Him whom they knew their master had preached.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then the disciples of John came to him, saying: Why do we and the Pharisees fast often, but your disciples do not fast? A proud question and full of the haughtiness of the Pharisees. Certainly (not to say anything else) the boasting of their fasting is to be reproved. Nor could the disciples of John but be at fault, since they were slandering him whom they knew to have been proclaimed by their master's voice, and were joining themselves to the Pharisees, whom they knew had been condemned by John: Brood of vipers, who showed you to flee from the wrath to come?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
