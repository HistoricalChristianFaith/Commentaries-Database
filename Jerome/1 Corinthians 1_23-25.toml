[[commentary]]
quote='''
And that the cross is a stumbling block to the Jews and foolishness to the Gentiles, our Lord himself shows, who is called a stone of offense and a rock of stumbling (Matt. 21; Luke 20): for no other reason, I think, than that preaching, when it has advanced toward its hearers under full sail, strikes against the cross as soon as it comes to it, and can by no means proceed further on a free course. But this cross, which among the Jews is a stumbling block and among the Gentiles foolishness, is to us who believe power and wisdom. "For Christ is the power of God and the wisdom of God" (1 Cor. 1:24), so that, because of that which was called foolishness, the foolishness of God might become wiser than men; and because of that which was called weakness and a stumbling block, the weakness of God might become stronger than men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
