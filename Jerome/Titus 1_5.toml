[[commentary]]
quote='''
And lest any should in a spirit of contention argue that there must then have been more bishops than one in a single church, there is the following passage which clearly proves a bishop and a presbyter to be the same. Writing to Titus the apostle says: "For this cause I left you in Crete, that you should set in order the things that are wanting, and appoint presbyters in every city, as I had instructed you: if any be blameless, the husband of one wife, having believing children not accused of wantonness or unruly. For a bishop must be blameless as the steward of God." … When subsequently one was chosen to preside over the rest, this was done to remedy schism and to prevent each individual from rending the church of Christ by drawing it to himself.
'''
source_url='https://www.newadvent.org/fathers/1102146.htm'
source_title="LETTERS 146.1"

[[commentary]]
quote='''
For this reason I left you in Crete, that you might correct the things that were lacking. It belongs to the apostolic dignity to lay the foundation of the Church, which no one can lay except the master builder. "But there is no other foundation than Christ Jesus" (1 Cor. 3:11). Those who are lesser craftsmen can build houses upon the foundations. Paul, therefore, as a wise master builder, striving with all labor not to boast in things already prepared, but to preach where Christ had not yet been announced, after he had softened the hard hearts of the Cretans to the faith of Christ, and had tamed them as much by word as by signs, and had taught them to believe not in their native Jupiter but in God the Father and in Christ, left his disciple Titus in Crete to strengthen the rudiments of the newborn Church, and to correct anything that seemed lacking, while he himself went on to other nations, to lay the foundation of Christ among them in turn. Now his saying that you might correct the things that were lacking shows that they had not yet come to the full knowledge of the truth, and that, although they had been corrected by the Apostle, they still needed correction. For everything that is corrected is imperfect. For in the Greek too the addition of the preposition, by which ἐπιδιορθώσῃ is written, does not convey the same as διορθώσῃ, that is, you might correct (corrigeres), but, so to speak, you might correct further (supercorrigeres): namely, that the things which have been corrected by me, and have not yet been drawn back to the full line of truth, may be corrected by you and receive the rule of evenness.

And you might appoint presbyters throughout the cities, as I arranged for you. Let the bishops hear, who have the power of appointing presbyters in each city, under what law the order of the Church's constitution is held; and let them not think these to be the words of the Apostle, but of Christ, who says to the disciples: "He who rejects you rejects me; and he who rejects me rejects him who sent me" (Luke 10:16). So also he who hears you hears me; and he who hears me hears him who sent me. From this it is plain that those who, scorning the Apostle's law, have chosen to confer an ecclesiastical rank on someone not on merit but by favor act against Christ, who through his Apostle has set out in what follows what kind of presbyter is to be appointed in the Church. Moses, the friend of God, to whom God spoke face to face (Deut. 5 and 31), could certainly have made his own sons the successors of his rule and left his own dignity to his descendants; but Joshua, an outsider from another tribe, is chosen, so that we might know that rule over the peoples is to be conferred not on blood but on life. But now we see very many making this matter a favor, so that they do not seek to raise up as pillars of the Church those who can be of more benefit to the Church, but those whom they themselves love, or by whose services they have been soothed, or for whom one of the great has asked, and (to say nothing of worse things) those who have obtained by gifts that they should become clerics.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
