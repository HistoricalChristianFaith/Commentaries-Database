[[commentary]]
quote='''
And now hear, Jacob my servant, and Israel, whom I have chosen. Thus says the Lord, who makes you and forms you from the womb, your helper: Do not fear, my servant Jacob, and you, Most Upright, whom I have chosen. For I will pour out waters upon the thirsty, and streams upon the dry ground; I will pour out my spirit upon your seed, and my blessing upon your offspring. And they will spring up among the grass, like willows beside flowing waters. This one will say, I am the Lord's; and that one will call in the name of Jacob; and this one will write with his hand, To the Lord; and he will be likened in the name of Israel. LXX: But now hear, Jacob my child, and Israel whom I have chosen. I am the Lord God, who made you and fashioned you from the womb; you will yet have help. Do not fear, my child Jacob, and beloved Israel whom I have chosen; yet I will give water in thirst to those who walk in the waterless land; I will put my spirit upon your seed, and my blessings upon your sons. And they will spring up like grass in the midst of water, and like the willow beside flowing waters. This one will say, I am God's; this one will cry out in the name of Jacob. And another will write on his hand, I am God's, and will cry out in the name of Israel. Where the people of the Jews is accused for its unbelief and blasphemy, it is called by the bare words, without any dignity of name: You have not called upon me, Jacob, nor have you labored in me, Israel; and again: I have given Jacob to slaughter, and Israel to blasphemy (above, Isa 43:22, 28). But where he speaks to the choir of the Apostles, which is from the Jews, the privileges of names are also added: Hear, Jacob my servant, and Israel whom I have chosen: so that servitude comes first, election second.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
