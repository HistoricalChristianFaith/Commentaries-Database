[[commentary]]
quote='''
For I desired mercy and not sacrifice, and the knowledge of God more than burnt offerings; but they, like Adam, have transgressed the covenant; there they have dealt treacherously against me. LXX: For I desire mercy and not sacrifice, the knowledge of God rather than burnt offerings; but they are like a man passing over the covenant. What follows in the Seventy: There Gilead despised me, a city that works vain things, and the rest, must be fitted to the following section; let us discuss what we have set down: I have hewn them by the prophets, I have slain them by the words of my mouth, I have threatened grievous things, so that I might have mercy on the penitent, so that I might stretch out my hand to those who have fallen and are rising. For I do not delight in sacrifices and victims, and in a multitude of burnt offerings. My victims and burnt offerings are the salvation of those who believe, the conversion of sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
