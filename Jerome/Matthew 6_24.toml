[[commentary]]
quote='''
Mammon—riches are so termed in Syriac. Let the covetous man who is called by the Christian name, hear this, that he cannot serve both Christ and riches. Yet He said not, he who has riches, but, he who is the servant of riches. For he who is the slave of money, guards his money as a slave; but he who has thrown off the yoke of his slavery, dispenses them as a master.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
You cannot serve God and mammon. In the Syriac language riches are called mammona. You cannot serve God and mammon. Let the avaricious man hear this, let him hear who is enrolled under the Christian name, that one cannot serve riches and Christ at the same time. And yet he did not say: he who has riches, but: he who serves riches. For he who is the slave of riches guards his riches as a slave; but he who has shaken off the yoke of slavery distributes them as a master.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
