[[commentary]]
quote='''
We, however, who heard the Lord our Savior say that those in Judea should flee to the mountains also lift our own eyes to the mountains, concerning which it was written: "I raise my eyes to the mountains, whence comes my assistance." And in another place [it is written], "Its foundation is in the holy mountains," and "The Lord surrounds his people as the mountains surround them," and "The city set upon a mountain cannot be hidden." We must shed the skin of the letter and, ascending Mount Zion barefoot with Moses, say, "I will cross over and see this great vision." [This is] so that we can understand those souls to be pregnant who conceived the beginning of faith from the seed of doctrine and from talking with God, who say with Isaiah, "Out of reverence for you, Lord, we have conceived and given birth, bringing the spirit of your salvation upon the earth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_121.html'
source_title="LETTER 121.4"

[[commentary]]
quote='''
Salvations we have not wrought on the earth; therefore the inhabitants of the world have not fallen. LXX: We shall not fall, but the inhabitants of the earth will fall. A different translation must needs have a different sense too. According to the Hebrew this is said: Because we have done nothing worthy of your mercy, therefore the impious have not fallen, but to this day prevail and possess the earth. But the Seventy assert this: that while the saints make the spirit of salvation upon the earth, those who are inhabitants of the earth fall; although between world, which in Hebrew is called THEBEL (תבל) and in Greek οἰκουμένη, and earth there is much difference. Whoever, then, have given themselves to dwelling on the earth, and have been grounded with a fixed root in earthly works, will fall; and they will not fall who sit in the world and rest in the Church, which is the dwelling place of the Father, and of the Son, and of the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
For they have crushed, or cut asunder, with iron carts the women with child of Gilead. These are the women with child of whom the Lord speaks in the Gospel: Woe to those who are with child, and to those who give suck in those days. The women with child are the souls of believers, who at the beginning of faith can say: From fear of you, Lord, we have conceived and been in labour; and if they have not been cut up and pierced with iron by the carts and the iron and toothed wheels, of which the psalmist says: The sons of men, their teeth are weapons and arrows, they can also say what follows: And we have brought forth; we have made the spirit of your salvation upon the earth. And consider at the same time that they cannot cut up men of mature age, but only those who are still in the womb, or who cannot take solid food and are still nourished with the milk of infancy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
