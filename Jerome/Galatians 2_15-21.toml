[[commentary]]
quote='''
But to take in the whole argument in a brief discourse, this is the sense that is being woven: We, that is, I and you, Peter (for he joined his own person to Peter's, so as not to seem to do him an injury), since we were, he says, Jews by nature, doing those things which are commanded in the law, and not sinners from among the Gentiles (who either are sinners generally, because they serve idols, or are those whom we now regard as unclean), knowing that we cannot be saved by the work of the Law but by faith in Christ, have believed in Christ, so that what the Law had not given us, the faith which we had in Christ might bestow. But if, withdrawing from the Law, in which we could not be saved, we have crossed over to faith, in which it is not circumcision of the flesh that is sought but the devotion of a pure heart; and if now, by withdrawing from the Gentiles, we bring it about that whoever is not circumcised is unclean: then faith in Christ, in which we formerly thought we were saved, is the minister of sin rather than of righteousness, since it takes away circumcision, and whoever does not have circumcision is unclean. But far be it from me to lay claim again to what I once destroyed and knew had been of no profit to me. Departing once for all from the Law, I died to the Law, that I might live in Christ, and, fastened to his cross and reborn into the new man, might subsist by faith rather than by the flesh, and might go forth from the world with Christ. What I once undertook, I hold fast. Christ did not die for me for nothing: in him I believed in vain, if I could have been saved in the old Law without faith in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
