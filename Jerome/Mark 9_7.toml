[[commentary]]
quote='''
It seems to me that this cloud is the grace of the Holy Spirit. Naturally, a tent gives shelter and overshadows those who are within; the cloud, therefore, serves the purpose of the tents. O Peter, you who want to set up three tents, have regard for the one tent of the Holy Spirit who shelters us equally.
'''
source_url=''
source_title="HOMILY 80"

[[commentary]]
quote='''
Do not set up tents equally for the Lord and his servants. "This is my beloved Son; hear him," my Son, not Moses or Elijah. They are servants; this is the Son. This is my Son, of my nature, of my substance, abiding in me, and he is all that I am. This is my beloved Son. They, too, indeed are dear to me, but he is my beloved; hear him, therefore. They proclaim and teach him, but you, hear him. He is the Lord and master, they are companions in service. Moses and Elijah speak of Christ; they are your fellow servants. He is the Lord; hear him.
'''
source_url=''
source_title="HOMILY 80"

[[commentary]]
quote='''
While he was still speaking, behold, a bright cloud overshadowed them, and a voice from the cloud, saying: This is my beloved Son, in whom I am well pleased; hear him. Because he had asked imprudently, he therefore does not merit the Lord's answer, but the Father answered for the Son, so that the word of the Lord might be fulfilled: I do not bear witness for myself, but the Father who sent me, he bears witness for me. And the cloud is seen to be bright and overshadows them, so that those who were seeking a fleshly tabernacle of boughs or tents might be covered by the shelter of the bright cloud. The voice too of the Father speaking from heaven is heard, to bear witness to the Son and, removing Peter's error, to teach him the truth, or rather, through Peter, the other apostles. This is, he says, my beloved Son: for him a tabernacle is to be made, him you must obey; this is my Son; they are servants; Moses and Elijah ought themselves, with you, to prepare a tabernacle for the Lord in the inner recesses of their heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
