[[commentary]]
quote='''
He is brought, then, again to the gate which looked toward the north, but by no means, as above, to the outer court, but to the inner — for in what is said in what follows: Its vestibule looked toward the outer court, it is shown that this court was within —; by which the progress of the one entering is shown, since in each place the names and measures are its own, and the windows round about show all things full of the light of knowledge; and through the fifty and the twenty-five cubits the mysteries of remission and of the divine senses are set, so that, placed in the vestibule of the inner court, we may see the outer things, and, contemplating the knowledge of things past and present, through which we may come to the double palms and victories, may know the mysteries of the eight steps, having gone into the chambers, in which the riches of the temple are contained and our prayers are washed from every stain of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
