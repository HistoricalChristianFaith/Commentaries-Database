[[commentary]]
quote='''
And it has mourned over me; with desolation the whole land has been made desolate, because there is no one who considers in his heart. Upon all the ways of the desert the destroyers have come, because the sword of the Lord has devoured from the end of the earth to its end; there is no peace for all flesh. LXX: because of me with ruin the land has been ruined, and the rest. This, which we have set down: and it has mourned over me, is joined according to the Hebrew to the preceding verse, so that it reads: they have made it a ruin, that is, my inheritance, and it has mourned over me, bereft of my help. According to the Seventy, however, God says that because of him the land has been ruined and reduced to a solitude, because there is no one who considers in his heart, nor is there any peace for all flesh. For flesh cannot receive the peace of God; for the wisdom of the flesh is hostile to God, and those who are in the flesh cannot please God. Further, according to the Hebrew, all Judea has been made desolate for this reason, that there is no one who considers God in his heart, nor anyone left who can escape. For through all the ways of the wilderness the destroyers have come, that is, the hostile army, and the sword of the Lord has devoured from border to border, and there was no rest for those fleeing from the city. Hence it is said: there is no peace for all flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
