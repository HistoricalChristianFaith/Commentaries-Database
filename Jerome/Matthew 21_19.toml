[[commentary]]
quote='''
The Lord about to suffer among the nations, and to take upon Him the offence of the Cross, sought to strengthen the minds of His disciples by a previous miracle; whence it follows, And seeing a fig-tree by the wayside, He came to it, and found nothing thereon, but leaves only.

For ever, (in sempiternum,) or, To the end of the world, (in sæculum,) for the Greek word αἰῶγ signifies both.

The tree which He saw by the wayside we understand as the synagogue, which was nigh to the way inasmuch as it had the Law, but yet believed not on the way, that is, on Christ.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For the fig tree did not give fruit, the one to which the Lord came hungry in the Gospel, and he did not find fruit on it, and he cursed it, saying: You shall not bear fruit even unto the age. And consider diligently what he said: You shall not bear fruit unto the age; he does not say, unto the ages of ages, but when this age has passed away and the fullness of the Gentiles has entered, then this fig tree too will bear its fruits, and all Israel will be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
And when he had seen a single tree, which we understand as the synagogue and the assembly of the Jews, beside the road (for it had the law, and it was beside the road because it did not believe in the Way), he came to it, standing as it was and immovable and not having the feet of the Gospel, and he found nothing on it but leaves only: the rustling of promises, the traditions of the Pharisees, boasting of the law, ornaments of words, without any fruits of truth. Hence another evangelist also says: For it was not yet the time, either because the time of Israel's salvation had not yet come, since the people of the Gentiles had not yet come in, or because the time of faith had passed, since, having come to Israel first and been spurned, he had passed over to the nations. And he said to it: Let fruit never grow from you, either forever or to the age; for the Greek word αἰών signifies both. And the fig tree withered, because, when the Lord was hungry, it did not have the food he had desired. But the leaves withered in such a way that the trunk itself remained, and, though the branches were broken, the root stayed green, so that in the last time, if they are willing to believe, it may sprout shoots of faith, and the Scripture may be fulfilled which says: There is hope for a tree.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
