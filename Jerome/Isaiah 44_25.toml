[[commentary]]
quote='''
He, then, being so great and such, when the time of the foreordained mystery has come, that all idols may be destroyed and the knowledge of God alone may be preached in the world, will destroy and overturn all the prophecies of the diviners, and the signs and portents of the pythons and soothsayers, by which they have deceived the human race; and he will show to be foolish the wisdom of the philosophers, which itself also is the greatest part of error, since by human thoughts they are in no way shown to have comprehended the wisdom of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
