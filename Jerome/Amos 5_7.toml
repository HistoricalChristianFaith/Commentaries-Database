[[commentary]]
quote='''
You who turn judgment into wormwood and leave righteousness on the earth; him who makes Arcturus and Orion, and turns darkness into morning, and changes day into night. Who calls the waters of the sea and pours them out upon the face of the earth: the Lord is his name. Who smiles devastation upon the strong, and brings plundering upon the mighty. LXX: Who makes judgment on high and has set righteousness on the earth; who makes all things, and transforms them, and turns the shadow of death into morning, and darkens the day into night. Who calls the water of the sea and pours it out upon the face of the earth: the Lord God Almighty is his name. Who divides crushing upon strength, and brings misery upon the fortress. In this place the common edition disagrees greatly with the Hebrew truth, as the prudent reader at once understands, without our reminder, from what we have set forth. Let us therefore expound first according to the Hebrews, and afterwards, if we have deserved it, with Christ opening the way, let us say what seems to us in the translation of the LXX. The house of Joseph, that is, the house of Ephraim, and for that reason the royal house, and Bethel, or, as the LXX translated, the house of Israel, that is, both kings and peoples, both worshippers and idols alike, will be overthrown, who by unjust judgment provoked God to anger. And they turned the sweetness of judgment into the bitterness of wormwood, which is a kind of most bitter herb, taking up iniquity and leaving righteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
Let us speak also according to the LXX: God makes judgment on high, when he judges truth and renders to each according to his work; and everyone who is an imitator of God, and desires to be his son, and to be perfect, as his Father who dwells in heaven is perfect, makes judgment on high, and does not imitate that judge who did not fear God, and did not respect man, and by the perversity of his judgment did not lift his sentence up to heaven, but dragged it down to the depths. And as for what follows: And has set righteousness on the earth, we ought to take it according to this, that he gave us Christ, his righteousness, and did not cast it away but set it down on the earth, so that, all iniquity being overcome, he might make us heavenly from earthly. I think that the Gentile poet also stole from this place, who, discoursing on the simplicity and blessedness of country folk, added: "Justice, leaving the earth, made her last steps among them."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
