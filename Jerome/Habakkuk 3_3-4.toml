[[commentary]]
quote='''
His glory covered the heavens, and the earth is full of his praise.

His brightness will be as light, horns in his hands. There his strength is hidden. LXX: His power covered the heavens, and the earth is full of his praise, and his brightness will be like light; horns in his hands, and he placed a mighty love of his strength. Where the Seventy translated: And he placed a mighty love of his strength, and we said: There his strength is hidden, Aquila translated: And he placed the hiding of his strength; Symmachus: And he placed his strength hidden; Theodotion alone, agreeing with our translation, says: And there is the hiding of his strength. For the word sam, according to the character of the place, is understood both as he placed and as there, and in the present place there should be read rather than he placed, so that the sense and order of the sentence is: Horns in his hands, and let there be understood, there, that is, in the horns his strength is hidden. Now it is manifest according to the Hebrew that at the coming of Christ all things were filled with glory, according to what is said in the Gospel: Glory to God in the highest, and on earth peace to men of good will. And elsewhere: He made peace in the heavens and on earth through the blood of the cross, and sat at the right hand of the majesty: For his word runs swiftly. And elsewhere: O Lord, our Lord, how wonderful is your name in all the earth. And again in Psalm 18 (19): Their sound has gone out into all the earth, and their words to the ends of the world. His brightness also, as the sun of justice, shone forth with clear light, and horns are in his hands, the standards and trophies of the cross, and in those very horns his strength is hidden: For though he was in the form of God, he did not think it robbery to be equal to God, but emptied himself, taking the form of a servant. He became obedient to the Father unto death, even the death of the cross. On the cross, therefore, his strength was for a little while hidden, when he said to the Father: My soul is sorrowful even unto death. And: Father, if it is possible, let this cup pass from me. And on the cross itself: Father, into your hands I commend my spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
