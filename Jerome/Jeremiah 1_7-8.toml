[[commentary]]
quote='''
And the Lord said to me: Do not say: I am a boy, for to all that I shall send you to, you shall go, and all things whatsoever I command you, you shall speak. Do not be afraid of their face, for I am with you to rescue you, says the Lord. 'Do not consider your age,' he says, '— for you have learned from another prophet who says: the gray hairs of a man are his wisdom —, let it only be of your will that you go forward; you will have me as companion, and with my help you will accomplish all things: open your mouth, and I will fill it. And do not consider the multitude of those to whom and against whom you are to speak, but me, who am with you to rescue you, says the Lord'. But the Lord delivers, not in the sense that the prophet is free of persecutions and distresses, since we read that he suffered many things, but so that by enduring he may overcome all things and not yield to distress.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
