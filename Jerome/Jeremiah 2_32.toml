[[commentary]]
quote='''
It is the virgin Mary of whom God by the mouth of Jeremiah speaks, saying, "Can a maid forget her ornaments or a bride her attire?" Concerning her we read of a great miracle in the same prophecy—that a woman should compass a man and that the Father of all things should be contained in a virgin's womb.
'''
source_url='https://www.newadvent.org/fathers/30091.htm'
source_title="Against Jovinianus 1.32"


[[commentary]]
quote='''
(Verse 32.) Will the virgin forget her adornment, and the bride her breastplate? My people have forgotten me in countless days. Through these things we learn that Christ is the bridegroom of the virgin Church, which has no blemish or wrinkle. But if he is the bridegroom, his words are, as John the Baptist speaks: He who has the bride is the bridegroom (John 3:29). Therefore, he loses his adornment who departs from the Lord, and loses the understanding of the teachings, which is symbolized in the breastplate. Wherefore also John the Evangelist leaned on the breast of the Lord (John 13), and among other things, the chest of the victims is separated for the priests (Numbers 18). But as the number of times in which we forget the Lord increases, so does the greater punishment of sin, which neither the length of the ages can subdue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
The band covers the breast, and holds that place in women which the Rational holds in the High Priests. Of this breast-band Jeremiah too spoke in mystical speech: If a bride can forget her adornment, or a virgin her breast-band, I too will forget you, says the Lord (Jer 2:32). The virgin, such as the Apostle desires to present us to Christ (2 Cor 11), so long as she is not corrupted in Egypt and her breasts, which are bound with the breast-band, are not broken, is joined to the bridegroom; and though daily she bears sons of the virtues, she by no means ceases to be a virgin. But if at some time she has spread her feet to every passer-by and followed her lovers, and, according to the prophecy of Hosea, the Lord has hedged in her ways and shut off her paths, she will return to her former husband and will hear: Put off the garments of mourning, and put on the garments of your glory (Hos 2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
