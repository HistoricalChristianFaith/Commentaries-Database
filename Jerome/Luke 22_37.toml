[[commentary]]
quote='''
One will resolve this question briefly if one uses that example: "and he was reckoned with those who were without the Law". For although in the Latin manuscripts, owing to the simplicity of the translators, it has been badly rendered: "And he was reckoned with the iniquitous" (Luke 22:37), yet one must know that among the Greeks ἄνομον, which is written here, means one thing, and ἄδικον, which is found in the Latin volumes, another. For ἄνομος is said of one who is without law and is bound by no right, whereas ἄδικος means iniquitous, or unjust. Hence the Apostle himself too, in another place: "since I was not", he says, "without the Law of God, but was in the Law of Christ" (1 Cor. 9); and certainly in this testimony also ἄνομος is written in the Greek; and he who translated well here could have translated the same word likewise there too, had the ambiguity not deceived him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
