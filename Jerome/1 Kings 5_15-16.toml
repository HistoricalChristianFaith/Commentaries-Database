
[[commentary]]
quote='''
Hear greater mysteries. At that time when Solomon, that is, our peacemaker who says, "My peace I give to you, my peace I leave to you": for "he himself is our peace," and "the peace that surpasses all understanding," he himself built a temple to God. And see there what Scripture says. "And there were," it says, "seventy thousand stonecutters, and eighty thousand of those who carried burdens." See the number. The stonecutters who cut the stones, who prepare, as it were, the foundations of the buildings, who lift up the stones from the earth to build in the temple of God, are placed in the seventh number, in the prophets, in the patriarchs. For they, drawing out the human race, as it were, from the earth, prepared them for the temple of the Lord. But these others, that is, the eighty thousand, are the apostolic and evangelical preaching, these who together with the Lord the Savior and Solomon himself carried the heavy sins of the nations. Up to this point the mystery seems to be finished: hear greater mysteries. "And those who were in charge," it says, "of these works and of the temple, were three thousand." There can be none greater, even among those who preside over the works, than those who preach the Trinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_019.html'
source_title="Homily 19, on Psalm 89"
