[[commentary]]
quote='''
Or, otherwise; This apparent discrepancy in the Evangelists as to the times of their visits is no mark of falsehood, as wicked men urge, but shows the sedulous duty and attention of the women, often going and coming, and not enduring to be long absent from the sepulchre of their Lord.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Now in the evening of the Sabbath, as it grows light toward the first day of the week, there came Mary Magdalene and the other Mary to see the sepulchre. That different times are described for these women in the Gospels is not a sign of falsehood, as the impious object, but the service of a diligent visiting, while they often go away and run back and do not bear to be away from the Lord's sepulchre long or far.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
