[[commentary]]
quote='''
Because of the slaughter and the iniquity against your brother Jacob, confusion shall cover you, and you shall perish for ever. On the day when you stood against him, when strangers were capturing his army, and foreigners were entering his gates, and were casting lots upon Jerusalem, you too were as one of them. LXX: Because of the slaughter and the impiety against your brother Jacob, confusion shall cover you, and you shall be taken away for ever. From the day on which you stood against him, on the day when aliens captured his strength, and strangers entered his gates, and cast lots upon Jerusalem, you also were as one of them. Therefore the man shall perish from Mount Esau, and wisdom shall perish from Idumea, and prudence from Mount Esau, because you slew your kinsman and acted wickedly against your brother Jacob, when, as the Chaldeans and Babylonians were laying Jerusalem waste, and besieging the city, and entering its gates, and casting lots in the division of the spoils, you were their ally and were counted among the number of the enemy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
