[[commentary]]
quote='''
So too the Lord has scattered the wretched house of Israel through the whole world, and shaken it in a sieve, and winnowed it with a shovel; and while the pebbles and little stones do not fall upon the earth, those will die by the sword who, on account of their filth and dust, are called the sinners of the people. And they will suffer this because they do not believe the prophecies of the prophets, nor think that the things which the Lord threatens through them will come. And though they promise themselves prosperity, they will afterwards endure evils; while, on the other side, the saints fear and do not sin, and therefore by no means die by the sword, because they said: Evils will draw near to us, and the punishments which our sins have deserved will come upon us; of which God speaks more fully in Jeremiah: I will take it up and speak against a nation and a kingdom, to take it away and destroy it; if that nation turns from its evils, I too will repent of the things that I had thought to do to it. God, therefore, is not changed, who is always immutable; but we change him by our conversion. He rages, he is angry, he threatens, and says that he will inflict punishments: If we repent, he too will repent of his sentence. Again, according to the same Jeremiah, he promises prosperity: If we grow slack through negligence, he too will repent of his pledge, and will change what he promised. Of this we can have an example in the Ninevites and in Jerusalem, of whom the one were set free from the punishments that hung over them, the other lost what had been promised to their fathers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
