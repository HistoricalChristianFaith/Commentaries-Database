[[commentary]]
quote='''
The words of Jeremiah, the son of Hilkiah, of the priests who were in Anathoth, in the land of Benjamin. Which word of the Lord came to him in the days of Josiah, the son of Amon, king of Judah, in the thirteenth year of his reign. And it came in the days of Jehoiakim, the son of Josiah, king of Judah, until the end of the eleventh year of Zedekiah, the son of Josiah, king of Judah, until the exile of Jerusalem in the fifth month. The other prophets, such as Isaiah, Hosea, Joel, were before the captivity of the ten tribes of Israel or of the two tribes of Judah and Benjamin; others after the captivity, such as Daniel, Haggai and Zechariah; but Jeremiah and Ezekiel wove their prophecy when the captivity was imminent, but one of them in the land of Judah, the other in Babylon. Jeremiah, while he was still a boy, began to prophesy in the thirteenth year of Josiah, the son of Amon, king of Judah, and he prophesied under his rule for nineteen years, and afterward under Jehoiakim his son for eleven years, and under Zedekiah, who was the last of the kings of Judah, for eleven years, until the fifth month, when Jerusalem was taken by the Babylonians. But the three months each of Jehoahaz and of Jeconiah — of whom the one was led into Egypt, the other with his mother into Babylon — are counted within the years mentioned above. And thus from the beginning of his prophecy until the captivity of Jerusalem, in which he himself was also taken, he prophesied for forty-one years, besides that time when he was led into Egypt. And there he prophesied in Tahpanhes, as is contained in this very volume. For 'the words of Jeremiah' the Seventy put: the word of God which came to Jeremiah, in this sense, namely, that 'the words of Jeremiah' are the word of the Lord. And he was of the family of the priests who dwelt to the north of Jerusalem at the third milestone, in the little village of Anathoth. And at the same time, wonderful is the clemency of the Lord, that, with the captivity already near and the Babylonian army besieging Jerusalem, he nonetheless calls the people to repentance, preferring to save them converted rather than to destroy them as transgressors. For 'exile', which all the others translated with one accord, the Seventy put 'captivity'. And after the beginning of the prophesying of Jeremiah, in the thirty-fifth year of his prophecy, Ezekiel began to prophesy in Babylon to those who had been taken captive with him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
