[[commentary]]
quote='''
I gave numbness to your teeth, and you did not return to me, says the Lord. I withheld the rain from you, and I rained upon one city, and upon another I did not rain, and two and three cities came to one to drink water, and they were not satisfied, and not even so did you return to me, says the Lord. I struck you with scorching wind, and with mildew your gardens and vineyards and olive groves and fig groves, and you did not return to me, says the Lord. I sent death upon you in the way of Egypt, and I struck your young men with the sword, and I made the stench of your camps rise into your nostrils, and you did not return to me, says the Lord. I overthrew you as the Lord overthrew Sodom and Gomorrah, and you became as a brand snatched from the burning, and you did not return to me, says the Lord. Therefore I will do these things to you, O Israel, so that you who have despised what is past may at least be corrected by what I am about to bring upon you. And when he has said, I will do these things to you, he is silent about what he is going to do, so that while Israel hangs uncertain over each kind of punishment — which are the more terrible for this reason, that men suspect them all —, he may repent, lest God bring on what he threatens. But after I have done to you what I solemnly declare I will do, prepare to call upon the Lord your God. Everyone, after all, who calls upon the name of the Lord will be saved. Or: prepare to meet your God, so that you may receive with all eagerness the Lord who comes to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
But if we read according to Symmachus and Aquila: These things I will do to you, Israel, afterwards, and when I have done these things to you, prepare to oppose your God Israel, it is to be understood thus: In order to correct you I did the things which the preceding discourse describes; and because you were unwilling to return to me, I will do to you the things that are contained in my secret counsel. You killed the servants whom I had sent to you; last of all I will send my Son; but you, according to your custom, by which you have always resisted the will of God, prepare yourself to contradict and oppose your God, according to that which is written: Behold, this one is set for the fall and for the rising again of many, and for a sign which shall be contradicted. And he says this not to command what Israel ought to do, but to foretell what he will do of his own accord, as if rebuking and reproving him, so that, corrected, he may at least not do what has been foretold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
