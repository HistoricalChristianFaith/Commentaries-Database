[[commentary]]
quote='''
And I praised gladness, because there is no good for man under the sun but to eat, and to drink, and to be glad. And this will go out with him from his labor in the days of his life, which God has given him under the sun. We have interpreted this more fully above, and now we say briefly that he prefers that pleasure of eating and drinking, though brief and soon to end, to the straits of the world and to the things that are seen to be done unjustly in the world, because this alone man seems to have from his labor, if he enjoys even a little refreshment. But this interpretation, if it is taken as it is written, will prove wretched those who fast, hunger, thirst and mourn, whom the Lord calls blessed in the Gospel. And so let us take both the food and the drink spiritually, and the gladness over them, which in the labor of our life we can scarcely find.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
