[[commentary]]
quote='''
This therefore I say and testify in the Lord, that you no longer walk as the Gentiles also walk, in the vanity of their mind, darkened in mind, alienated from the way of God through the ignorance that is in them, because of the blindness of their heart. Who, despairing, have given themselves over to unchastity, in the working of all impurity, in covetousness.

This therefore, he says, I say to you, O Ephesians, and I testify to you, that, since you are to meet in the measure of the age of the fullness of Christ, you do not walk as the Gentiles walk, who, serving idols, abuse both sense and mind for depravity. Though they received a soul and an understanding for this very purpose, that they might know God, they have been alienated from his way (and we know no other way apart from Christ), and they walk in the blindness of their own heart. And would that it had been enough to have sinned, and that they might at least late repent and condemn the vices after which they have continually gaped: there would be a remedy in coming to their senses after error. But now, despairing, and plunging themselves, after the manner of irrational beasts, into mire and the abyss, they have given themselves over to unchastity and luxury, working whatever the body wished, the mind desired, lust suggested. And since they have left out nothing whatever that is unclean, they have done all this in covetousness, since they are never sated with indulgence, and their pleasure has no limit. Or else, beyond the union of man with woman that is permitted, they climb to greater things, males working shamefulness with males, and receiving in themselves the recompense of their error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
