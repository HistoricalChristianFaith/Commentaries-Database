[[commentary]]
quote='''
For I have come to separate a man against his father, and a daughter against her mother, and a daughter-in-law against her mother-in-law; and a man's enemies are those of his household. This passage is written in nearly the same words in the prophet Micah. And note, wherever a testimony is set down from the Old Testament, whether the sense alone agrees or the wording as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
We ought to know, moreover, that in the Gospel there are nearly the same words that we now read in the prophet, and that according to the context of that place they have another sense; whether they were taken from the prophet or commanded on his own authority, it belongs to the Lord to know, who spoke both in the prophets and in the Gospels. Now there the Lord says: I came to divide a man against his father, and a daughter against her mother, and a daughter-in-law against her mother-in-law, and a man's enemies are his own household.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
