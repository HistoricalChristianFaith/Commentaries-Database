[[commentary]]
quote='''
The word that came to Jeremiah from the Lord, saying: Arise and go down into the potter's house, and there you shall hear my words! And I went down into the potter's house, and behold, he was doing a work upon the wheel — or stones —. And the vessel that he was making from clay with his hands was broken; and turning — or and again — he made it another vessel, as it had pleased in his eyes to make it. And the word of the Lord came to me, saying: Can I not do with you as this potter, O house of Israel? says the Lord; behold, as clay in the hand of the potter, so are you in my hand, O house of Israel! Suddenly — or in sum — I will speak against a nation and against a kingdom, to root it out — or to take it away — and to destroy and to ruin it. If that nation repents of its evil, which I have spoken against it, I too will repent of the evil which I thought to do to it. And suddenly — or in sum — I will speak concerning a nation and a kingdom, to build and to plant it. If it does evil in my eyes, so as not to hear my voice, I will repent of the good which I spoke of, to do to it. Through all the senses, indeed, one arrives at judgment and understanding of mind, through hearing, smell, taste, touch; but what is seen with the eyes is retained more in the mind. Hence the prophet is ordered to go to the potter's house and there to hear the Lord's commands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
