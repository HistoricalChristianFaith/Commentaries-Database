[[commentary]]
quote='''
What He says is to this purpose. Is it possible that God should so contradict Himself, as to command one thing at first, and after defeat His own ordinance by a new statute? Think not so; but, whereas Moses saw that through desire of second wives who should be richer, younger, or fairer, that the first were put to death, or treated ill, he chose rather to suffer separation, than the continuance of hatred and assassination. Observe moreover that He said not God suffered you, but, Moses; showing that it was, as the Apostle speaks, a counsel of man, not a command of God. (1 Cor. 7:12.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He says to them: Because Moses, in view of the hardness of your heart, permitted you to put away your wives; but from the beginning it was not so. What he says is of this kind: Can God be contrary to himself, so as to have commanded one thing before and then break his own sentence by a new command? That is not to be thought; but Moses, when he saw that, because of the desire for second wives who were richer or younger or more beautiful, the first wives were being killed or leading a wretched life, preferred to allow discord rather than that hatreds and murders should go on. And at the same time consider that he did not say: God permitted you because of the hardness of your heart, but Moses, so that, according to the Apostle, it is the counsel of a man, not the command of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
