[[commentary]]
quote='''
He who removes stones will be pained by them; and he who splits wood will be endangered by it. In Zechariah too holy stones are rolled upon the earth. For they do not stand firm in that station, but pass on, and, always striving toward higher things, hasten to depart from here. Of these living stones the city of the Savior is built in the Apocalypse too, and the Apostle does not keep silent that the Church is built of them. If, then, someone perverted by heretical art has taken these stones away from the building of the Church – whence Aquila and Symmachus too pointedly said, in place of what we have put: He who removes stones will be pained by them: He who transfers stones will be torn apart by them – he will afterwards suffer torments. But because Scripture says absolutely, he who removes stones, or, he who transfers stones, and did not add good or bad, it must therefore also be understood the other way round: that a man of the Church, a bishop, namely, or a presbyter, if according to the commandment of Leviticus he has taken out of a leprous house a stone to be ground into dust and ashes, will be pained by that very fact, that he is compelled to remove a stone from the Church of Christ, saying with the Apostle: To weep with those who weep, to mourn with those who mourn; and: Who is weak, and I do not burn? Splitting wood too, he will be endangered by it. Heretics are unfruitful wood, and woodland with no benefit of fruit. Hence in the temple of God too a grove is forbidden to be planted, and the empty shades of leaves, that is, of words that merely make a sound, are spurned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
