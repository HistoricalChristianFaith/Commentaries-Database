[[commentary]]
quote='''
For who has been present in the counsel of the Lord and seen and heard his speech? who has considered his word and heard? Where we translated 'in the counsel of the Lord' and in the Hebrew is written 'bassod', Aquila translated 'secret', Symmachus 'speech', the Seventy and Theodotion 'substance' or 'subsistence'. And the sense is: 'Do not believe, O untaught crowd, the prophets who announce false things to you, who say this: The Lord has spoken: peace shall be to you; evil shall not come upon you! For whence can they know the secrets of God, or at whose announcing have they learned the counsel of the Lord? How has the word of the divine dispensation reached them?' Some of our own think that in this place they have found where the substance of God is written of.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
