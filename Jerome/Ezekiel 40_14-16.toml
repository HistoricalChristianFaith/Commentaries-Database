[[commentary]]
quote='''
And he made fronts of sixty cubits, and at the front a court of the gate on every side round about; and before the face of the gate, which reached as far as the face of the vestibule of the inner gate, fifty cubits; and slanting windows in the cells and in their fronts, which were within the gate on every side round about; and likewise there were also windows in the vestibules round about within, and before the fronts a painting of palm trees. (LXX: "And under the open sky the 'aelam' of the gate, sixty cubits, and the 'theïm' of the court of the gate round about; and under the open sky of the court outside, the 'aelam' of the inner gate, fifty cubits; and hidden windows over the 'theïm' and over the 'aelam', within the gate of the court round about; and likewise the 'aelamoth' and windows round about within, and on the 'aelam' palms on this side and on that.") Symmachus translated this place thus: And he made περιστάσεις, which we can call 'circumstantias' [things standing round], in place of which the Hebrew also has 'ulium', which Aquila translated κρίωμα [ram-work, a pilaster] and we have turned into 'front'; again, where the Seventy put 'theïm of the court', the Hebrew has 'ulim' in the singular number, which Symmachus translated 'beside the court', Aquila κρίωμα, that is, 'the front of the court'; 'under the open sky' too, 'the aelam of the gate', Aquila translated 'before the face of the posts of the gate', Symmachus 'before the face of the vestibule of the gate'; and the 'hidden' windows, which in Hebrew are called 'aetemoth', Symmachus translated τοξικὰς [arrow-like]; and where the Seventy said 'over the theïm' and 'over the aelam', the same Symmachus put 'posts' and 'circumstantias', Aquila 'cells' and 'their fronts', in place of which in the Hebrew is written 'tham' and 'aele'; further, 'aelamoth', which the Seventy and Theodotion translated alike, Symmachus translated 'circumstantias', Aquila 'fronts'; and 'aelam', in place of which in the Hebrew is written 'ul', is called either 'door' or 'portico'; 'palm' too is written in the Hebrew 'thamarim', in the plural number, because the singular number calls a 'palm' 'thamar'. I do not doubt that these things will be tiresome to a fastidious reader, but I wished to show briefly how far, through length of time, or rather through the fault of the scribes and, to speak more openly, through their fault and unskillfulness, the old translation differs from the Hebrew truth, and especially in the Hebrew words which we have rendered into the Latin tongue from the editions of others, simply indicating not so much an explanation of the words as our conjecture. And I think that between the wall of the temple, outside round about, and the house itself, in the court, that is, in the middle, certain things were set for ornament, which Symmachus translates 'circumstantias', that is, 'certain standing things', raised up on high from the ground of the earth, and that these occupied a space of sixty cubits; and again, for those going out from the inner gate to the face of the vestibule which looked toward the outer gate, that the place occupied fifty cubits, in which there were slanting windows, which the Seventy call 'hidden', Symmachus τοξικὰς; and these windows were in the cells, that is, in each of the rooms, and in the porticoes which extended before the rooms, occupying fifty cubits — these slanting windows, or τοξικαὶ, received their name from arrows for this reason, that, like arrows, a narrow light is let into the building; and within they widen —; and everything round about was full of windows of this kind. 'And before the fronts', he says, 'of the porticoes, a painting or carving of palm trees'; by which it is shown that, for those at the entrance of the gate and as soon as they enter the wall, sixty cubits meet them with various ornaments, which are referred to the creation of the world, so that the Creator may be understood from the creatures, and so that the variety of the world may show all things running in order and reason — the world which among the Greeks receives the name κόσμος from 'adornment', and was made in six days, so that for each day one decade may be reckoned, which we said above is a perfect number —; after this, as we enter the inner court, there meet us, before the very vestibule of the inner gate, cells with slanting windows, which occupy a space of fifty cubits, which itself too is a consecrated number: and after seven full weeks of festivity and joy, the first day of the ogdoad begins, which is the day of the resurrection, and brings us into the neighborhood of the temple — for when we have done all things, doing penance for our former error, then we are made neighbors and nearest to God, so that, in the outer court, the order and constancy of the creatures may teach us the knowledge of the Creator, and, in the inner, the true jubilee, in which all debts are forgiven us, may instruct us in θεολογίαν [theology, the knowledge of God].
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
