[[commentary]]
quote='''
And it came to pass, while he was drawing near to Chabratha in the land of Canaan, to come to Efratha, Rachel gave birth. The Hebrew word chabratha, in what follows, where Jacob speaks to Joseph, but when I was coming from Mesopotamia of Syria, your mother Rachel died in the land of Canaan, on the road of the hippodrome, as I was coming to Ephratham, the Seventy translators, meaning I know not what, rendered as hippodrome: and straightaway there, where in the Hebrew it is said [Gen 35:19] and they buried her on the road of Ephratha, this is Bethlehem, the Seventy translators again put hippodrome in place of Ephratha: whereas, surely, if chabratha is a hippodrome, Ephratha cannot be a hippodrome. Aquila, however, translated this as follows: and it came to pass καθ'-ὁδὸν τῆς γῆς, that is, on the journey of the land, entering into Ephratham. But it is better if it is translated, "in the chosen time of the land, when he was entering Ephratham". Further, it signifies the springtime, when all things burst into flower and it is the chosen time of the year, or when those passing along the road pluck and choose from the neighboring fields whatever comes to hand, enticed by the various flowers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
