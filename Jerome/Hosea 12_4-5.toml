[[commentary]]
quote='''
And he prevailed, he says, against the angel; and by the blessing of him whom he had overcome he was strengthened. He also wept and besought him, that is, the angel, saying: I will not let you go unless you bless me. And when, on the advice of his father and mother, he was fleeing to Mesopotamia, he found the same angel in Bethel, who spoke to him; he spoke with us, that is, in the father he spoke to the sons also, and in Jacob he loved Judah too; and from that time down to the present the memory of his name, which was imposed on him by the angel and by God, endures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
