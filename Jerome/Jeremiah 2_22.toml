[[commentary]]
quote='''
If you wash yourself with nitre and multiply for yourself the herb borith, you are stained with your iniquity before me, says the Lord God. For 'herb borith', which we have rendered as it is set down in the Hebrew, the Seventy translated poan, to signify the fullers' herb, which, after the manner of the province of Palestine, grows in green and moist places and has the same power for washing away dirt as nitre does; but our 'nitre' and 'fullers' herb' is repentance. The preaching of the Church too, which reproves and rebukes and corrects the offender, has the likeness of a more biting nitre. He who is stained with the light dirt of sins is cleansed by lighter admonitions. But grave sins, which drag to death, can be washed away neither by nitre nor by the herb borith, but need heavier torments. For each one's work, of what sort it is, the fire will test, and in fire it will be revealed. And beautifully he added: you are stained with your iniquity in my sight, because, even if you seem clean to men, you are not clean to me, who know the consciences of each one. Hence too in another place it is said: no one living shall be justified in your sight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
