[[commentary]]
quote='''
For the sake of the simpler folk we have spoken according to the letter: let us return, then, to the spiritual understanding. The waters saw you, O God. Let us speak from the Revelation of John. "The many waters," he says, "are many peoples." The waters saw you, O God. What waters? "And let the waters that are above the heavens praise the name of the Lord." The waters saw you, O God. What waters? Pure minds and souls. The waters saw you, and they feared. The fear was not from hatred, but from faith. And the depths were troubled. Let us say something according to the spiritual understanding. In the beginning of Genesis it is written: "And over the waters," it says, "the Spirit was borne." And then it is written: "Over the depths," it says, "darkness was borne." See, then, what is said in the beginning of Genesis. This according to the spiritual understanding. Over the waters, it says, the Spirit was borne. Already at that time baptism was signified. For there could be no baptism without the Spirit. But over the depths, darkness. This is the abyss into which the demons beg not to be sent by Jesus. Over the depths, then, darkness. In the waters was cleanness, in the depths darkness. What the depths are, you understand while I am silent: since the demons dread to go into the abyss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_010.html'
source_title="Homily 10, on Psalm 76"
