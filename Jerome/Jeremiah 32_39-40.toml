[[commentary]]
quote='''
And one, he says, way — him who says: I am the way and the life and the truth —, that they may fear me all their days; for the beginning of wisdom is the fear of the Lord. All, he says, their days: if this does not apply to the Jews, it must be taken of our people, with whom it has been and is and will be well, not only with themselves but also with their sons after them; for he has struck an everlasting covenant with us and will not cease henceforth to do us good. And what follows: and I will put my fear in their heart, that they may not depart from me, so grants free will that the very fear which is bestowed nevertheless remains the grace of the giver.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
