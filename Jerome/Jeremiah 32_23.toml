[[commentary]]
quote='''
And they entered and possessed it. And at once there was nothing between possession and disobedience; for plenty begets security, security negligence, negligence contempt. And they did not obey, he says, your voice, and did not walk in your law. In vain, then, did they promise in the wilderness, saying: all that the Lord commands we will do; for the reward lies not in the pledge but in the deed; so as to beat back the impudence of those who think that a man can fulfill all that he has promised he will do. All that you commanded them to do they did not do; and certainly they had promised that they would do it. And all these evils befell them; 'evils' to those who suffered them, but 'goods' according to the sentence of the Lord, which renders to each according to his ways.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
