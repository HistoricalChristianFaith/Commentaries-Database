[[commentary]]
quote='''
Behold, you have spoken and done evil things, and you were able. 'In place of words of repentance you have blasphemed with words of pride, and you have fulfilled your evil thought and shown your strength against your husband, so that you can do what you handled in speech.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
