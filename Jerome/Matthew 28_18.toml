[[commentary]]
quote='''
Power is given to Him, Who but a little before was crucified, Who was buried, but Who afterwards rose again.

Power is given in heaven and in earth, that He who before reigned in heaven, should now reign on earth by the faith of the believers.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Jesus came up and spoke to them, saying: All power has been given to me in heaven and on earth. Power has been given to him who a little before had been crucified, who had been buried in the tomb, who had lain dead, who afterward rose again. But power has been given in heaven and on earth so that he who before reigned in heaven may reign on earth through the faith of believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
