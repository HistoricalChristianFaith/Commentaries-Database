[[commentary]]
quote='''
But as for what he says, From itself judgment and its burden will go forth, for which Symmachus translated, It will judge for itself, and will go forth by its own decree, it is to be understood either thus: it will appoint rulers from its own nation, and its power and its sword will have no attendants from other nations; or certainly: as it has done, so it will be done to it; and it will be laid waste just as it laid waste.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
There follows: It is terrible and illustrious; from him will be its judgment, and its assumption will go forth from him. The Chaldean is terrible because of the many and varied punishments he brings upon the despisers; illustrious, because he takes to himself the glory of divinity. And through his oracles and false responses, and the cures of diseases which he himself had sent in, he seems illustrious among the ignorant and the despisers of God. For the judgment and punishment of the despiser will be from him, that is, from himself, or from the Chaldean. For according to the Apostle they will be handed over to him for punishment, that they may learn not to blaspheme; and whoever repents and is converted to God will go forth from him, though before he was held in his hands and was the assumption of the Chaldean. If ever we see that someone has served the devil for a long time, and afterwards has been converted to God, let us say of him: And his assumption has gone forth from him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
