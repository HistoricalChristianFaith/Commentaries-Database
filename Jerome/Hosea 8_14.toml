[[commentary]]
quote='''
For Israel has forgotten his Maker and has built shrines on the high places, consecrating whole hills and mountains, and shady trees, to Baal and Ashtaroth and other idols. Judah too, understanding that Israel had departed from the love of God and that their sins had been visited, was not converted to the Lord, but trusted in the fortification of his cities, which the Lord says he will destroy, devouring them down to his foundations. His: there is no doubt that it signifies Judah; although some read their foundations, that is, of the cities, in place of his.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Israel has forgotten his Maker, and, having despised the Creator, has fashioned another god for himself. Judah too, that is, the churchman, in evil works, or in a perverse interpretation of the holy Scriptures, has built himself fortified cities, not with the help of God, but with skillful falsehood; and the Lord says that he will set them on fire with the fire of his spirit, and will devour his βάρεις, that is, great houses built in the manner of towers, and will overturn the foundations badly laid, so that they may not be able to set up sacrilegious shrines against God. Some take the cities fortified by Judah in a good sense, and they try to temper what seemed contrary to this sense, I will send fire upon his cities, and it will devour his dwellings, in such a way that, after what is perfect has come, what is in part is destroyed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
