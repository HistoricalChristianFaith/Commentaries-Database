[[commentary]]
quote='''
Behold, the Lord God will come in strength, whom you despised when he came in humility. And his strength will rule, who before had taken the form of a servant, made obedient to the Father unto death (Phil 2). Behold, his reward is with him, and his work before him (Isa 40 and 62). According to what he himself says in the Gospel: For the Son of man is to come in the glory of his Father, and he will render to each according to his work (Matt 16:27).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
