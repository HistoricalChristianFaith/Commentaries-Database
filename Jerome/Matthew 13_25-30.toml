[[commentary]]
quote='''
Therefore, as I said above, to the things that have been expounded by the Lord we must give our faith, while those that are passed over in silence and left to our understanding are to be touched on briefly. By the men who sleep understand the teachers of the churches; by the servants of the householder, do not take any others than the angels who daily see the face of the Father; the devil, moreover, is called an enemy man because he ceased to be a god, and in Psalm 9 it is written of him: Arise, O Lord, let not man prevail. Therefore let him who is set over the Church not sleep, lest through his negligence the enemy man oversow darnel, that is, the doctrines of heretics. As for what is said, lest perhaps, in gathering the darnel, you root up the wheat along with it, room is given for repentance, and we are warned not to cut off a brother quickly, because it may happen that he who today has been corrupted by a harmful doctrine comes to his senses tomorrow and begins to defend the truth. That too which follows, Let both grow until the harvest, seems to be contrary to that precept, Remove the evil one from your midst, and to the rule that no fellowship is to be had with those who are called brothers and are adulterers and fornicators. For if uprooting is forbidden and patience is to be kept until the harvest, how are some to be cast out from our midst? Between the wheat and the darnel, which we call lolium, as long as it is still in the blade and the stalk has not yet come to the ear, there is great similarity, and in telling them apart the difference is either none or very hard to see. Therefore the Lord warns us beforehand not to pronounce sentence quickly where anything is doubtful, but to reserve the end for God the judge, so that, when the day of judgment has come, he may cast out of the company of the saints not a suspicion of crime but manifest guilt. As for his saying that the bundles of darnel are given over to the fires and the wheat gathered into barns, it is plain that all heretics and hypocrites of the faith are to be burned in the fires of Gehenna, while the saints, who are called wheat, are received into barns, that is, into heavenly mansions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
