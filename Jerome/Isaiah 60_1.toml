[[commentary]]
quote='''
Arise, be enlightened; for your light has come, and the glory of the Lord has risen upon you. For behold, darkness will cover the earth, and thick gloom the peoples; but upon you the Lord will rise, and his glory will be seen in you. And the nations will walk in your light, and kings in the brightness of your rising. LXX: Be enlightened, be enlightened, ÷ Jerusalem ⁚ for your light has come, and the glory of the Lord has risen upon you. Behold, darkness will cover the earth, and thick gloom upon the nations. But upon you the Lord will appear, and his glory will be seen in you. And the nations will walk in your light, and kings in your brightness. What we thought about the restoration of Zion and Jerusalem, and about everything that is promised to her by the prophetic oracle, we said more fully at the end of the preceding book, where we explained what that little verse meant: The redeemer will come to Zion, and to those who return from iniquity in Jacob. Now we must touch briefly on what most people think of this passage, so that, once the error has been seen through, we may more easily take up the truth. The Jews and our half-Jews, who expect a golden and jewelled Jerusalem from heaven, contend that these things will come to pass in the kingdom of a thousand years, when all the nations are to serve Israel, and the camels of Midian and Ephah, coming from Sheba, will bring gold and incense, and all the sheep of Kedar will be gathered, and the rams of Nebaioth will come to be sacrificed upon the altar of the Temple that will have been built. They say too that from the islands, and above all in the ships of Tarshish, her daughters will fly like doves, bringing riches of gold and silver; that the walls of Jerusalem will be built by foreigners, with the kings of the nations set over them; that the gates of the city will always stand open, so that by day and by night the riches of Jerusalem and the victims may be brought in; and that everything that lies desolate will be rebuilt with cypress and pine and cedar cut in Lebanon, above all the Temple of the Lord, in which there will be everlasting gladness; so that she will suck the milk of the nations and eat the riches of kings, and there will be such an abundance of all things that they will have gold for bronze, silver for iron, bronze for wood, iron for stones. Her princes too, they say, will enjoy everlasting peace, and bishops will preside over the peoples in righteousness, and her gates will be carved in relief. And what is greater than these, instead of the sun and the moon the Lord himself will shine with everlasting light; and for one man she will have a thousand very strong men, and for little ones she will possess very mighty nations. So say those who desire earthly pleasures, and seek beauty in wives and a great number of children, whose god is their belly and whose glory is in their shame (Phil 3); and whoever follows their error confesses himself, under the Christian name, to be like the Jews. Others, however, assert that all these things were promised to the Jews in a carnal sense, if they had received him who says in the Gospel: I am the light of the world (John 8:12), which enlightens every man coming into the world; so that, just as victims were granted to the people of Israel, not because they were good in themselves, but so that they might not be offered to demons, so too the Lord promises these things to the gluttonous Jews, who seek nothing but the pleasures of the body, so that at least for the sake of their carnal desires and an abundance of wealth they might receive the Son of God; and since they did not receive him, the promises too, they say, became void. Thus to the Canaanite woman pleading for her daughter: I did not come, he says, except to the lost sheep of the house of Israel (Matt 15:24). And to his disciples: Do not go away into the way of the nations, and do not enter the cities of the Samaritans; go rather to the lost sheep of the house of Israel (Matt 10:5, 6). For this reason the Apostles too first proclaimed the Lord in the synagogues, and when these did not receive the Gospel they said to them: It was necessary that the word should be preached to you; but since you have not received salvation, behold, we turn to the nations (Acts 13:46). For the light came into the world, and the Jews loved darkness rather. Hence the Lord too, when he had wept over Jerusalem, added: If you also had known the things that make for your peace (Luke 19:42). And since she did not receive it, he went on: But now a day will come upon you, and your enemies will surround you with a rampart, and hem you in, and bring you down to the ground together with your children (ibid., 43). But let us, following the former sense, believe that all of this is said to the Church, which was first gathered from the Jewish people, and which through the Apostles passed on to the nations the light that had risen upon her. To her it is said: Arise, be enlightened, so that she who fell in the unbelievers may rise in the faithful; she who fell in the synagogues may rise in the churches; and, once she has risen, may be enlightened, so that she may have no darkness of error at all. For your light, he says, has come, the light that all the Prophets promised, which you were ever awaiting. And the glory of the Lord, which was once upon the tabernacle and his Temple, has risen upon you; of which it is said: Glorious things have been said of you, city of God (Ps 86 [87]:3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
