[[commentary]]
quote='''
This too must be noted with some care: that across the three books the title of the author differs. For in Proverbs it is set down: The proverbs of Solomon, the son of David, king of Israel. But in Ecclesiastes: The words of Ecclesiastes, the son of David, king of Jerusalem; for Israel is superfluous here, and it is wrongly found in the Greek and Latin copies. In the Song of Songs, however, neither son of David nor king of Israel or of Jerusalem is set at the head, but only The Song of Songs of Solomon. For just as Proverbs and elementary instruction belong to the twelve tribes and to all Israel, and as contempt of the world suits none but the citizens of the mother city, that is, the inhabitants of Jerusalem, so the Song of Songs properly concerns those who desire only the things above. With beginners and those making progress, both a father's dignity and the authority of his own kingdom are rightly claimed. But with the perfect, where the disciple is taught not by fear but by love, his own name suffices, and he is an equal teacher and does not know himself to be a king.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
