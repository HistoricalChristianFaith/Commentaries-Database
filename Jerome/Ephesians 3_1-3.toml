[[commentary]]
quote='''
But I think that the expression in this place is also faulty. For instead of what he ought to have said: for the sake of this thing, I Paul, the prisoner of Jesus Christ for you Gentiles, came to know the mystery, as I also wrote before in brief; as you are able, reading, to understand, he says: for the sake of this thing I Paul the prisoner, according to revelation the mystery was made known to me, and the rest. But if anyone can show, even according to the context of the discourse and the language, that the Apostle was perfect and did not fall into the faults of the grammatical art, he is rather the one to be listened to. As for us, whenever we have noted solecisms or anything of the kind, we are not striking at the Apostle, as the malevolent charge, but are rather the Apostle's champions, because a Hebrew of the Hebrews, without the polish of rhetorical speech, the arrangement of words and the charm of eloquence, would never have been able to bring the whole world over to the faith of Christ had he not evangelized it not in wisdom of word but in the power of God. For he himself says to the Corinthians: And I, when I came to you, brethren, came not in eminence of word or of wisdom, announcing to you the testimony of God (1 Cor. 2:1). And again: And my word and my preaching were not in persuasive words of wisdom, but in demonstration of the spirit and of power, that your faith might not be in the wisdom of men, but in the power of God (ibid., 4 and 5).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
