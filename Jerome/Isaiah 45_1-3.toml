[[commentary]]
quote='''
His right hand he took hold of and held, so that no one could resist his strength. Let us read Xenophon's history of the elder Cyrus in eight books, and we shall see the prophecy of Isaiah fulfilled. For what city was not opened to him? What city did not bow beneath him the backs of its kings? What walls, before impregnable, were not overthrown by his siege? Hence God makes an apostrophe to Cyrus himself: I have given you the treasures and the hidden wealth of all the cities, so that you, who before worshiped idols, might perceive the one God through his benefits, especially since you know that your name was foretold long before you were born. Josephus too relates this in the eleventh book of the Jewish Antiquities: that Cyrus read that Isaiah had prophesied of him by his very name, and that for this reason he loved the Jews very much as God's intimates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
