[[commentary]]
quote='''
From the voices of many waters. The voices of many waters have furnished us with three mysteries. Let us see what those mysteries are. From the voices of many waters, wonderful are the surgings of the sea, wonderful is the Lord on high: thy testimonies are made exceedingly credible. If we understand the sea mystically as this world... for it is bitter and full of tempests, in which those who sail behold many wonders of the Lord. On account of which he says: Wonderful are the surgings of the sea. For we see many, lifted up by swelling waves, suddenly collapse; but others we see, oppressed by the billows, again raised up to the heights. For nothing in this world is found firm, nothing stable. Where you think there is calm, there is shipwreck: where the appearance of quiet is shown, there the assault of the tempest and the whirlwinds lie hidden; and unless we cry out, 'Master, save us,' we suddenly perish. Wonderful is the Lord on high. Whoever has been able to withstand firmly the billows of this world's sea, dwelling steadfastly upon the rock, he will be able to understand how wonderful is the Lord on high. 'For the exalted one dwells in the exalted places, and the holy one in the holy'; as he also says elsewhere, 'Be ye holy, as I also am holy, the Lord your God.' But the man whom the consciousness of his sins humbles, and who cannot lift up his eyes to heaven together with Jesus, in his sight the Lord is not wonderful on high, but terrible to those beneath.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_070.html'
source_title="Homily 70, on Psalm 92 (Alternate Series)"
