[[commentary]]
quote='''
After this it must be considered again that for honoring father and mother the promise is not a Jewish and carnal one, that the children should be long-lived upon the land which the Lord their God has given them. For we must believe that there have been many who, though obedient to their parents, died quickly, and who, though impious toward their parents, came to extreme old age. For let the Jews, and those like the Jews, answer: if the length of this life is among the things promised, and to remain long in the body is happiness, what does that saying in the Psalms mean: Woe is me, that my sojourning has been prolonged! I have dwelt with the dwellers of Kedar (Ps. 119:5)? And this of Solomon in Ecclesiastes: I praised all the dead who died long ago, above the living who live up to the present; and better than these two is he who is not yet born, and has not seen all the evil work that has been done under the sun (Eccles. 4:2, 3); and a little after: If a man begets a hundred, and lives many years, and many are the days of his years, and his soul is filled with good things, and he has no burial, I said: better than he is the abortive, because it came in vanity, and its name will be covered in darkness; and indeed it has not seen the sun (Eccles. 6:3-5), and the rest. For if the dead are praised above the living (and according to certain people who think that souls dwell in the heavenly places before they descend into these bodies, he who is not yet born is said to be better than both, and this whole life is a temptation; and according to Job: The death of a man is rest (Job 3:23); and according to the same man and Jeremiah, Cursed is the day on which we are born (Jer. 20:14)), how is it now promised to those who honor father and mother that they shall be long-lived upon the land which the Lord their God has given them? The land, therefore, must be sought which the Lord promises and grants to those who have left the spiritual Egypt, and with all patience have crossed the great and terrible deserts of this life, and have conquered great kings, whom the Lord strikes; and have crossed over into Judea, which flows with milk and honey, and under the leadership of Jesus, with Jericho falling and Ai laid waste, which is interpreted "precipice," have come to Jerusalem, and a temple is built for them under Solomon, the peaceful king (Josh. 6; 8), and they possess the land which has been prepared for the gentle: for Blessed indeed are the meek, since they shall possess the land (Matt. 5:4), which is truly the land of the living, as the Psalmist also says: I believe that I shall see the good things of the Lord in the region of the living (Ps. 26:13). The length of this life wisdom too holds in her right hand, holding in her left riches and glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
