[[commentary]]
quote='''
O senseless Galatians, who has bewitched you?

This passage can be understood in two ways. Either the Galatians were called senseless for this reason, that coming from greater things to lesser they had begun in the spirit and were being finished in the flesh; or on account of this, that each province has its own peculiar characteristics. The Apostle confirms that the Cretans are always liars, evil beasts, lazy bellies, as was truly said by the poet Epimenides. The Latin historian lashes the vain Moors and the fierce Dalmatians. All the poets tear at the timid Phrygians. The philosophers boast that readier minds are born at Athens. Tully, before Gaius Caesar, taunts the Greeks as fickle, saying: Either of the fickle Greeks or of the savage barbarians. And in the speech for Flaccus: Inborn, he says, fickleness, and learned vanity. All the Scriptures reprove Israel itself for its heavy heart and stiff neck. In this way, then, I think that the Apostle too lashed the Galatians with the peculiar characteristic of their region. Some, it is true, thrusting themselves into deep questions, as if under the pretext of avoiding the heresy that introduces diverse natures, say that the Tyrians and Sidonians too, the Moabites and Ammonites and Edomites, the Babylonians and Egyptians, and all the peoples that are named in the Scriptures, have certain peculiarities from preceding causes and by the merit of former works, so that the righteousness of God may not come into doubt, since each nation is asserted to have some good or some evil that another does not have. We, declining these depths, shall follow what was said above: either that they are charged with folly, by which they cannot discern the spirit of the Law from the letter; or that they are rebuked for the fault of their nation, in that they are unteachable and witless and rather slow to wisdom. But what follows, Who has bewitched you, we ought to explain in a manner worthy of Paul (who, though he is unskilled in speech, is not so in knowledge [2 Cor. 11:6]): not that he knew that there is such a thing as the evil eye, which is commonly thought to do harm, but that he used the speech of the crossroads, and, as elsewhere, so in this place too he took up a word of everyday conversation. We read in Proverbs: "The gift of the envious man torments the eyes". What with us is "envious" is put more expressively in the Greek as "bewitcher"; and in the Wisdom that is ascribed to Solomon: "The bewitching of malice obscures good things" (Wisd. 4:12). By these examples we are taught either that the envious man is tormented by another's happiness, or that he in whom there are some good things is harmed when another bewitches him, that is, envies him. The evil eye is said properly to harm infants and those of tender age, and those who do not yet plant their step with a firm footing. Hence also one of the Gentiles says: Some eye or other bewitches my tender lambs. (Virgil, Eclogues 3.) Whether this is true or not, God will see; for it may be that demons too serve this sin, and turn away from good works whomever they know either to have begun or to have made progress in the work of God. For now, the point at issue is that we think the example was taken from the opinion of the common people: so that, just as tender age is said to be harmed by the evil eye, so also the Galatians, newly born in the faith of Christ and nourished with milk and not with solid food (1 Cor. 3), were harmed as though by someone bewitching them, and, with the stomach of their faith nauseated, vomited up the food of the Holy Spirit. But if anyone objects, let him explain how it is taken from common opinion that there is the valley of the Titans in the books of Kingdoms (2 Kings 23), Sirens and Onocentaurs in Isaiah (ch. 34), Arcturus and Orion and the Pleiades in Job (ch. 9), and other things like these, which names certainly have both the causes and the origins of the fables of the Gentiles. Let us ask Marcion, then, who rejects the prophets, how he interprets in this place what follows.

Before whose eyes Jesus Christ was publicly portrayed (proscriptus), crucified among you. For Christ was rightly portrayed beforehand (præscriptus) for us, of whose gibbet and passion, blows and scourgings the whole choir of the prophets foretells, so that we have known his cross not from the Gospel alone, in which he is related to have been crucified, but long before he deigned to descend to the earth and to take up the man who was crucified. Nor is it small praise of the Galatians that they believed in the Crucified in such a way as he had been portrayed beforehand (præscriptus) to them: namely, that by reading the prophets again and again and knowing all the mysteries of the old Law, they came to believe by a way and an order. In some codices is read: "Who has bewitched you, not to believe the truth?" But because this is not found in the copies of Adamantius, we have omitted it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
What I had left untouched in the first book of the Commentaries on Galatians, when I was discussing the characteristics of the nations, it now seems I should render in the second: who the Galatians are, or whither and whence they crossed over; whether the land they now inhabit poured them forth as natives or received them as newcomers; and whether they lost their language through intermarriage, or both learned a new one and did not lose their own. Marcus Varro, the most diligent investigator of all antiquities, and the others who have imitated him, have handed down many things about this people, and things worthy of memory. But since it is our purpose not to bring uncircumcised men into the temple of God (and, to confess it plainly, it is many years now since we ceased to read these things), we shall set down the words of our Lactantius, what he held about this people in the third volume to Probus: "The Gauls," he says, "were anciently called Galatae from the whiteness of their bodies; and the Sibyl calls them so. This is what the poet meant to signify when he says: Then their milk-white necks — are entwined with gold (Virgil, Aeneid 8): when he could have said 'white.' Hence, certainly, the province of Galatia, into which the Gauls came at one time and mingled themselves with the Greeks. Whence that region was first named Gallograecia, afterward Galatia." Nor is it surprising if he said this of the Galatians, and recorded that Western peoples, passing over such great spaces of the lands in between, settled in the region of the East, since it is established that swarms from the East and from Greece, conversely, reached the farthest bounds of the West. The Phocaeans founded Marseilles, and Varro says they are trilingual, because they speak Greek and Latin and Gallic. Colonists of the Rhodians founded the town of Rhoda, from which the river Rhone received its name. I pass over the Tyrians, founders of Carthage, and the city of Agenor; I pass by the Thebes of Liber, which he founded in Africa, a city now called Thebestis. I leave aside that part of Libya which is full of Greek cities. I cross over to the Spains: did not Greeks setting out from the island of Zacynthus found Saguntum, and are not the Ionians, Greek men, reported to have founded the town of Tartessus, which is now called Carteia? The mountains of the Spains too, Calpe, Idrus, Pyrene, and likewise the islands Aphrodisiades and Gymnesiae, which are called the Balearics, do they not show traces of the Greek tongue? Italy itself, occupied by Greek peoples, was once called Greater Greece. Certainly, and this cannot be denied, the Romans were begotten of the stock of Aeneas, a man of Asia. From this it comes about that in the West talents of Greek sharpness are often found, and in the East they smack of barbarian stupidity. Nor do we say this as though diverse things were not born in each place according to the region, but because for the most part even the other things that are not alike are so named. Therefore it is not surprising that the Galatians were called foolish and slower of understanding, since even Hilary, the Rhone of Latin eloquence, himself a Gaul and born at Poitiers, in his Song of Hymns calls the Gauls unteachable. And that they are now fertile in orators pertains not so much to the diligence of the region as to the clamor of the rhetoricians, especially since Aquitaine boasts of a Greek origin, and the Galatians set out not from that part of the lands but from the fiercer Gauls. Do you wish to know, O Paula and Eustochium, how the Apostle marked each province with its own characteristics? To this very day the same traces remain, whether of virtues or of errors. The faith of the Roman people is praised (Rom. 1). Where else do people run with such zeal and in such crowds to the churches and to the tombs of the martyrs? Where does the Amen so resound, like heavenly thunder, that the empty temples of the idols are shaken? Not that the Romans have another faith than this which all the churches of Christ have, but that devotion is greater in them, and simplicity in believing. Again, they are accused of facility and of pride. Of facility, as there: "I beseech you, brothers, that you watch those who cause dissensions and offenses, contrary to the doctrine which you have learned; and turn aside from them; for such men do not serve Christ the Lord, but their own belly; and by sweet words and blessings they seduce the hearts of the innocent. For your obedience is spread abroad to every place. I rejoice therefore in you, and I wish you to be wise in good and simple in evil" (Rom. 16:17 ff.). And of pride: "Be not high-minded, but fear" (Rom. 11:20, 25). And: "I do not wish you to be ignorant, brothers, of this mystery, that you may not be wise in yourselves". And in what follows: "For I say, through the grace that has been given to me, to all who are among you: not to be wise beyond what one ought to be wise, but to be wise unto sobriety" (Rom. 12:3). And more openly: "To rejoice with those who rejoice; to weep with those who weep. Being of the same mind toward one another. Not minding high things, but consenting to the humble. Do not be prudent in your own sight" (Rom. 12:15-16). He also marks the Corinthians, because their women are with uncovered head and the men let their hair grow (1 Cor. 11), and they eat indifferently in temples (1 Cor. 8:10), and, puffed up with secular wisdom, they deny the resurrection of the flesh. That these things in part remain to this day, no one who has seen Achaia can doubt (1 Cor. 4). The Macedonians are praised for love, and for hospitality and the reception of the brothers. Hence it is written to them: "But concerning the love of the brotherhood we have no need to write to you. For you yourselves have learned from God to love one another. And indeed you do it toward all the brothers in all Macedonia" (1 Thess. 4:9). But they are rebuked because they go idly round the houses, and, looking for another's food, while they desire to please each one and run about hither and thither, they report what is done at each person's house. For it follows: "But we beseech you, brothers, that you abound more, and take pains to be quiet, and that you do your own business, and work with your hands, as we commanded you, so that you may walk honestly toward those who are outside, and may desire nothing of anyone" (1 Thess. 4:10-11). And lest anyone think this was urged more from the duty of a teacher than because of a fault of the people, in the second letter to the same he presses and repeats it, saying: "For even when we were with you, we declared this to you, that if anyone will not work, neither let him eat. For we have heard that some among you walk restlessly, doing no work, but acting as busybodies. Now those who are such we charge and beseech in the Lord Jesus Christ, that, working in silence, they eat their own bread" (2 Thess. 3:10 ff.). It would be long if I wished to note, from the Apostle and from all the Scriptures, either the virtues or the vices of the individual nations, since we have come down to these very things we have said from the fact that the Galatians were pronounced foolish and senseless. Whoever has seen Ancyra, the metropolitan city of Galatia, knows with me by how many schisms it is torn even now, by how many varieties of doctrines it is defiled. I pass over the Cataphrygians, Ophites, Borborites and Manichaeans; for these are by now familiar names of human calamity. Who has ever heard, in any part of the Roman world, of the Passalorynchites and Ascodrobi and Artotyrites, and the rest, monsters rather than names? Traces of the ancient folly remain to this day. One thing we add, and so pay what was promised at the beginning: that the Galatians, apart from the Greek speech which the whole East speaks, have their own language, almost the same as the Treveri, and it does not matter if they have corrupted some things in it, since the Africans too have in some part changed the language of the Phoenicians, and Latinity itself changes daily both by regions and by time. But now let us return to our purpose.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
