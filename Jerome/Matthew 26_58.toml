[[commentary]]
quote='''
He went in, either out of the attachment of a disciple, or natural curiosity, seeking to know what sentence the High Priest would pass, whether death, or scourging.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But Peter followed him from afar. He who was going to deny the Lord followed from afar.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
And going inside he sat with the attendants, to see the end. Either out of a disciple's love or out of human curiosity he wished to know what the high priest would decide about the Lord: whether he would condemn him to death or would release him after beating him with scourges. And in this lies the difference between the ten apostles and Peter: they flee; he, although from a distance, still follows the Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
