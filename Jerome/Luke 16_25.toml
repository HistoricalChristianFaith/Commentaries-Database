[[commentary]]
quote='''
In short, Abraham did not have good things because he was rich, but because he used his riches well (Gen 13). And Lazarus, who afterward rested in his bosom, did not endure evils because he suffered the torments of diseases together with want; rather, through what were thought evils in the world, he obtained true goods. Hence too that rich man clad in purple received his good things in his lifetime, which were good to him who thought them good (Luke 16); and of Lazarus it is not said, conversely: He received his evil things in his lifetime; but: he received evil things in his lifetime, which seemed evil not to him who suffered them but to others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
