[[commentary]]
quote='''
And because every outrage, once it has passed the boundary of shame, adds crimes to crimes and always advances to worse things, the ten tribes even reclined upon garments taken in pledge beside every altar, which the Hebrews interpret thus: upon the garments of those who were unwilling to go to the idols, which they had extorted by force, they reclined, feasting in the idol's temple. But according to the Seventy, so great was their contempt for God that they stretched out with cords beside the altar their garments in which they sleep, or in which they commit fornication, and made παραπετάσματα, that is, coverings, so that no one could see them committing fornication in the temple; and, serving drunkenness and lust, they bought even the very wine that they drank, not from their own labor, but from false accusations; and they did this in the shrine of their god, so as to defile those whom they thought gods with shamefulness and debaucheries. So speak, and so expound, those who follow the simple history.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
But also, binding their garments with cords, they make coverings beside the altar, holding out the faith of Christ as a screen. For as many as have been baptized in Christ have put on Christ, and they set their garments, which they have bound with the cords of sins, before the eyes of those who look, so that their outrages may not be seen, and so that whoever looks at the altar may not suspect the debauchery. This all the heretics do, committing fornication under the Christian name, and spreading the testimonies of the Scriptures over their errors and lies as a screen. Hence the apostles too spread their garments on the foal of the ass, so that the Lord might sit more softly, and might mount the road paved from the law and the prophets. On the contrary, the heretics do not spread their garments beneath the footsteps of the Savior; but they bind them beside the altar and hold them out before their sins, so that they may drink the wine of false accusation, or of the condemned, who are condemned from the very fact that they have gone out of the Church. This is the wine of Sodom, of the fury of dragons and of asps; whoever drinks it cannot be healed. And they drink the wine, not in the house of God, where the temple is and Jerusalem, but in the house of their god, whom they have fashioned for themselves with artful speech.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
