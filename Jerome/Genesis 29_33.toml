[[commentary]]
quote='''
And she conceived he says another son and said, Because the Lord has heard me, in that my husband held me in hatred, and he has given me this one also: and she called his name Simeon. From the fact that she was heard, she gave Simeon his name. For Simeon means 'hearing'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
Symeon [Simeon]: hearing, or name of a dwelling.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Genesis"
