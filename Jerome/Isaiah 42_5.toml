[[commentary]]
quote='''
Thus says the Lord God, who creates the heavens and stretches them out, who makes firm the earth and the things that spring from it, who gives breath to the people that is upon it, and spirit to those who tread on it: I the Lord have called you in righteousness, and have taken hold of your hand, and have kept you, and have given you as a covenant of the people, as a light of the nations, that you might open the eyes of the blind, and bring the bound out of confinement, out of the prison house those who sit in darkness. I am the Lord, that is my name; my glory I will not give to another, nor my praise to graven images. The former things, behold, they have come; new things too I declare; before they spring up, I will make you hear of them: It was uncertain who had said before: Behold my servant, I will uphold him; my chosen one, in him my soul is well pleased. I have put my spirit upon him; he will bring forth judgment to the nations. For after the condemnation of the idols the speech had burst out suddenly: Behold my servant, and the rest, which we interpreted as spoken in the person of the Father concerning Christ. So, lest he leave it ambiguous who had said the foregoing, he adds and says: Thus says the Lord God, who creates the heavens and stretches them out. Or, as the Seventy translated: Who made the heaven and fixed it. The Creator and Lord of the universe, therefore, himself promised the coming of his Christ, he who not only stretched out the heavens and fixed them, but also made the earth firm with its lofty mass, and all things that spring from it: so that his invisible things may be clearly seen, being understood by the things that are made (Rom 1), his eternal power also and divinity. He gave breath to all who dwell on the earth, by the first law of mortals: for God breathed into the face of Adam the spirit of life, and he became a living soul (Gen 2). But spirit he gave properly to those who tread on the earth and subject the wisdom of the flesh to their own power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
