[[commentary]]
quote='''
James, who is called the brother of the Lord, surnamed the Just, the son of Joseph by another wife, as some think, but, as appears to me, the son of Mary sister of the mother of our Lord of whom John makes mention in his book, after our Lord's passion at once ordained by the apostles bishop of Jerusalem, wrote a single epistle, which is reckoned among the seven Catholic Epistles and even this is claimed by some to have been published by some one else under his name, and gradually, as time went on, to have gained authority. Hegesippus, who lived near the apostolic age, in the fifth book of his Commentaries, writing of James, says

"After the apostles, James the brother of the Lord surnamed the Just was made head of the Church at Jerusalem. Many indeed are called James. This one was holy from his mother's womb. He drank neither wine nor strong drink, ate no flesh, never shaved or anointed himself with ointment or bathed. He alone had the privilege of entering the Holy of Holies, since indeed he did not use woolen vestments but linen and went alone into the temple and prayed in behalf of the people, insomuch that his knees were reputed to have acquired the hardness of camels' knees."

He says also many other things, too numerous to mention. Josephus also in the 20th book of his Antiquities, and Clement in the 7th of his Outlines mention that on the death of Festus who reigned over Judea, Albinus was sent by Nero as his successor. Before he had reached his province, Ananias the high priest, the youthful son of Ananus of the priestly class, taking advantage of the state of anarchy, assembled a council and publicly tried to force James to deny that Christ is the son of God. When he refused Ananius ordered him to be stoned. Cast down from a pinnacle of the temple, his legs broken, but still half alive, raising his hands to heaven he said, "Lord forgive them for they know not what they do." Then struck on the head by the club of a fuller such a club as fullers are accustomed to wring out garments with — he died. This same Josephus records the tradition that this James was of so great sanctity and reputation among the people that the downfall of Jerusalem was believed to be on account of his death. He it is of whom the apostle Paul writes to the Galatians that "No one else of the apostles did I see except James the brother of the Lord," and shortly after the event the Acts of the apostles bear witness to the matter. The Gospel also which is called the Gospel according to the Hebrews, and which I have recently translated into Greek and Latin and which also Origen often makes use of, after the account of the resurrection of the Saviour says, "but the Lord, after he had given his grave clothes to the servant of the priest, appeared to James (for James had sworn that he would not eat bread from that hour in which he drank the cup of the Lord until he should see him rising again from among those that sleep)" and again, a little later, it says "'Bring a table and bread,' said the Lord." And immediately it is added, "He brought bread and blessed and broke and gave to James the Just and said to him, 'my brother eat your bread, for the son of man is risen from among those that sleep.'" And so he ruled the church of Jerusalem thirty years, that is until the seventh year of Nero, and was buried near the temple from which he had been cast down. His tombstone with its inscription was well known until the siege of Titus and the end of Hadrian's reign. Some of our writers think he was buried in Mount Olivet, but they are mistaken.
'''
source_url='https://www.newadvent.org/fathers/2708.htm'
source_title="De Viris Illustribus (On Illustrious Men), Section 2"

[[commentary]]
quote='''
But of the other apostles I saw none, except James the brother of the Lord.

I remember that while I was at Rome, at the urging of the brothers, I published a book on the perpetual virginity of holy Mary. In it I had to argue at some length about those who are called the brothers of the Lord. Hence, whatever the things we wrote there are worth, we ought to be content with them. For now let this suffice: that because of his excellent character, his incomparable faith and his uncommon wisdom he was called the brother of the Lord; and because he was the first to preside over the Church which, the first to believe in Christ, had been gathered from the Jews. The other apostles too are indeed called brothers of the Lord, as in the Gospel: "Go, tell my brothers: I go to my Father and to your Father, and to my God and to your God" (John 20:17). And in the psalm: "I will declare your name to my brothers; in the midst of the Church I will sing to you" (Ps. 21:22). But this man is called brother in a special way, to whom the Lord, as he was going to the Father, had entrusted the sons of his mother. And just as Job and the other patriarchs were indeed called servants of God, yet Moses had something as it were outstanding, so that it was written of him, "But not as Moses my servant" (Heb. 3:5): so too blessed James was specially called the brother of the Lord (as we said before). As for the fact that, apart from the twelve, certain men are called apostles, the reason is this: all who had seen the Lord and afterwards preached him were called apostles, as is written to the Corinthians: "That he was seen by Cephas, after this by the eleven; then he was seen by more than five hundred brothers at once, of whom many remain until now, but some have fallen asleep; then he was seen by James, then by all the apostles" (1 Cor. 15:5 ff.). But gradually, as time went on, and elsewhere, by those whom the Lord had chosen, apostles were ordained; as that passage to the Philippians declares, saying: "But I thought it necessary to send to you Epaphroditus, my brother, fellow worker and fellow soldier, but your apostle and the minister of my need" (Phil. 2:25). And to the Corinthians it is written of such men: "Or the apostles of the churches, the glory of God" (2 Cor. 8:23). Silas also and Judas were named apostles by the apostles. Hence he erred greatly who thought that this James was the one in the Gospel, the apostle, the brother of John, who, it is agreed, shed his blood for Christ after Stephen, according to the testimony of the Acts of the Apostles (Acts 12). This James, however, was the first bishop of Jerusalem, surnamed the Just: a man of such holiness and of such renown among the people that they vied with one another in their eagerness to touch the fringe of his garment. He too was afterwards thrown down from the temple by the Jews, and had as his successor Simon, who also, they relate, was crucified for the Lord. He therefore denies that he met any of the apostles besides these, lest a hidden objection should arise: "Even if you were not taught by Peter, you had other apostles as your teachers." And he did not see them, not because he held them in contempt, but because they had been scattered over the whole world to preach the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
