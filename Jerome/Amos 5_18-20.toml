[[commentary]]
quote='''
Woe to those who desire the day of the Lord: to what end is it for you? That day of the Lord is darkness and not light; as if a man should flee from the face of a lion, and a bear should meet him, and he should enter the house and lean with his hand upon the wall, and a snake should bite him. Is not the day of the Lord darkness and not light? And gloom and no brightness in it? LXX: Woe to those who desire the day of the Lord: to what end is this day of the Lord for you? And it is darkness and not light. As if a man should flee from the face of a lion, and a bear should fall upon him, and he should go into the house and lean with his hands upon the wall, and a snake should bite him. Is not the day of the Lord darkness and not light? And gloom, and it has no brightness. Lest the Tekoite prophet, who was of the tribe of Judah, should seem to neglect the men of his own tribe altogether and to address his word to the ten tribes alone, the prophecy is now directed to both kingdoms, that is, to Judah and Israel; this can be understood from many other things indeed, but especially from what follows: Woe to you who are wealthy in Zion, and trust in the mountain of Samaria. Woe therefore to Judah and Israel, who say: Let the day come, let the foretold captivity come, provided that the restoration also which is promised through the prophets follows. For there is not so much evil in the injury of captivity as there is good in the things which the Lord promises after the captivity. To them the prophet replied that they were waiting in vain, after the seventy years of the Babylonian captivity, for what is to come a long time afterwards, at the coming of the Son of God; for desolation and poverty and innumerable miseries will follow them. For to those who flee, he says, from the face of Nebuchadnezzar the lion, Ahasuerus will come to meet them, under whom the history of Esther is told; or, when the empire of the Assyrians and Chaldeans has been destroyed, the Medes and Persians will rise up. And when you have returned in the reign of Cyrus, and at the command of Darius have begun to build the house of the Lord, and have put all your confidence in the temple, so that you rest in it and lean your weary hands upon the walls, then will come Alexander, king of the Macedonians, or Antiochus surnamed Ἐπιφανὴς (Epiphanes), who will stay in the temple and bite you like a snake, not outside in Babylon and in Susa, but within the borders of the holy land. By these things it is proved that the day which you long for is not one of light and joy, but of darkness and sadness. These things we have said briefly according to the history, so as not to leave the opinion of the Jews wholly untouched.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
