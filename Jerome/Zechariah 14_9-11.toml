[[commentary]]
quote='''
On that day the Lord shall be one, and his name one.

And all the land shall be turned back as far as the desert, from the hill of Rimmon to the south of Jerusalem; and it shall be exalted, and shall dwell in its place, from the gate of Benjamin as far as the place of the former gate, as far as the gate of the corners, and from the tower of Ananeel as far as the king's winepresses. And they shall dwell in it, and there shall be no more anathema, but Jerusalem shall sit secure. LXX: On that day the Lord shall be one, and his name one, going round all the land and the desert from Geba as far as Rimmon to the south of Jerusalem. But Rama shall remain in place, from the gate of Benjamin, as far as the first gate, as far as the gate of the corners, and as far as the tower of Anamael, as far as the king's winepresses they shall dwell in it; and there shall be no more anathema, and Jerusalem shall dwell confident. The building of the city of Jerusalem, and the going forth of waters from the midst of it, to flow down to both seas, the Jews and Judaizing Christians promise themselves in the last time, when circumcision is to be practised again, and victims sacrificed, and all the precepts of the law kept, so that it is not Jews who become Christians, but Christians who become Jews. On that day, they say, when Christ shall sit in a Jerusalem of gold and jewels to reign, there shall be no idols nor diverse worship of divinity, but the Lord shall be one, and all the land shall be turned back as far as the wilderness, that is, to its ancient state. And he sets down the names of the places, from which place to which place Jerusalem is to be built: from the hill of Rimmon, for that is what Geba means, where there is a pomegranate tree, as far as the southern quarter of Jerusalem. And as for what follows: But Rama shall remain in its place, Aquila and the rest translated it better, who put: it shall be exalted. For Rama means exaltation, according to that saying of the prophet and the Gospel: A voice was heard in Rama, that is, it sounded on high. Jerusalem therefore shall be exalted, and shall be built in its former place, from the gate of Benjamin as far as the gate which is called of the corners, and from the tower of Ananeel, not Anamael as the Greeks and Latins wrongly read, as far as the king's winepresses, which is written in Hebrew ammelech. And they shall dwell, he says, in it, that is, in Jerusalem, and there shall be no more anathema, that is to say no fear of hostile attack, no dread, but Jerusalem shall sit, or shall be inhabited, resting in eternal peace. These things the Jews dream according to the letter, and our χιλιασταὶ (chiliasts), who long to hear again: Increase and multiply, and fill the earth, and in return for the continence of this life and a brief fast promise themselves bulbs, and sows' wombs, and birds of the Phasis, and the francolin, by no means the Ionian but the Jewish one; of whom the Lord can truly say: My spirit shall not remain in these men, because they are flesh. For the flesh fights against the spirit, and the spirit against the flesh. And let them not set the Apocalypse of John against us, which itself too must be expounded spiritually.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
