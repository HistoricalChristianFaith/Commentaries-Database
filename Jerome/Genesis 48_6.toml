[[commentary]]
quote='''
But the remaining sons, he says, whom you will beget after my death (showing that they were not yet begotten at that time), [Gen 48:6] shall be yours; they shall be called by the name of their brothers in their inheritance. They will not, he says, receive land separately, nor will they have their own allotted portions, like the other tribes, but they will be mingled into the tribes of Ephraim and Manasseh as appended peoples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
