[[commentary]]
quote='''
Blow the trumpet in Zion; wail on my holy mountain. Let all the inhabitants of the land be troubled, for the day of the Lord comes, for the day of darkness and gloom is near, a day of cloud and whirlwind; like the morning spread out over the mountains, a people many and strong; there has not been its like from the beginning, and after it there will not be, even to the years of generation and generation. Before its face a devouring fire, and behind it a burning flame; the land before it is like a garden of delight, and behind it the solitude of the desert, and there is none who escapes it; like the appearance of horses is their appearance, and like horsemen so shall they run; like the sound of four-horse chariots they shall leap upon the tops of the mountains; like the sound of a flame of fire devouring stubble, like a strong people prepared for battle; before its face the peoples shall be tormented; all faces shall be brought to a pot; like mighty men they shall run, like men of war they shall climb the wall; men shall walk in their ways, and shall not turn aside from their paths; none shall press upon his brother, each shall walk in his own track. Moreover they shall fall through the windows and shall not be destroyed; they shall enter the city, they shall run upon the wall, they shall climb up the houses, they shall enter through the windows like a thief; before its face the earth trembled, the heavens were moved, the sun and the moon were darkened, and the stars withdrew their splendor; and the Lord gave his voice before the face of his army, for his camps are exceedingly many, for they are strong and doing his word. For great is the day of the Lord and very terrible, and who shall endure it? LXX: Blow the trumpet in Zion, proclaim on my holy mountain; let all the inhabitants of the land be troubled, because the day of the Lord is at hand, because the day of darkness and gloom is near, a day of cloud and frost; like the morning a people many and strong shall be poured out over the mountains; there has not been its like from the beginning, and after it there will not be, even to the years of generation of generations. Before it a consuming fire, and behind it a kindled flame. Like a paradise of delight is the land before its face; and its hinder parts like a plain of solitude, and there shall be none who is saved from it; like the appearance of horses is their appearance, and like horsemen so shall they pursue. Like the voice of four-horse chariots they shall leap upon the summits of the mountains, and like the voice of a flame of fire devouring stubble; and like a people many and strong prepared for battle; before its face the peoples shall be crushed, every face like the scorching of a pot; like fighters they shall run, and like men of war they shall climb upon the walls, and each shall walk in his own way, and they shall not turn aside from their paths; none shall withdraw from his neighbor; weighed down with their arms they shall go, and they shall fall upon their javelins, and shall not be consumed; they shall seize the city, and run about upon the walls; they shall climb upon the houses and enter through the windows like thieves; before its face the earth shall be confounded, and the heaven shall be moved; the sun and the moon shall be darkened, and the stars shall withdraw their light; and the Lord shall give his voice before the face of his strength, because his camps are exceedingly many, because strong are the works of his words, for great is the day of the Lord, great and exceedingly illustrious, and who shall be sufficient for it? Again, by a metaphor of locusts, the onset of the Chaldeans is described, and the prophet is commanded, or rather through the prophet all who can hear the word of God, to lift up their voice like a trumpet, and to proclaim in Zion, and to sound on his holy mountain, so that at the noise of the cry and of the trumpet all the people of Jerusalem may tremble. And when, he says, you have sounded, say this: The day of the Lord will by no means be put off any longer, that is, the day of retribution and vengeance; captivity is close at hand, already the army of the Babylonians has gone out from its place, near is the day of darkness and of distress, the day of gloom and cloud and whirlwind, in which every light of gladness will be taken away, and all things will be overwhelmed by darkness. As, he says, the morning and the dawn suddenly put the darkness to flight, and the daybreak lights up all the mountains, so the army of the Babylonians will be poured out over all your land.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
