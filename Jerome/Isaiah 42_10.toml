[[commentary]]
quote='''
Even as islands have been set in the midst of the sea, churches have been established in the midst of this world, and they are beaten and buffeted by different waves of persecution. Truly these islands are lashed by waves every day, but they are not submerged. They are in the midst of the sea, to be sure, but they have Christ as their foundation, Christ who cannot be moved.
'''
source_url=''
source_title="HOMILIES ON THE PSALMS 24 (PSALM 97)"

[[commentary]]
quote='''
Sing to God a new song, his praise from the ends of the earth, you who go down to the sea, and its fullness, the islands and their inhabitants. Let the desert and its cities lift up; Kedar will dwell in houses; give praise, you inhabitants of Petra; from the top of the mountains they will cry out. They will give glory to the Lord, and will declare his praise in the islands. The Lord will go forth as a mighty one, as a man of war he will stir up zeal; he will shout and cry aloud; he will prevail over his enemies. I have always held my peace, I have kept silent, I have been patient; like a woman giving birth I will speak; I will scatter and swallow up at once. I will make the mountains and hills desolate, and I will dry up all their grass; and I will turn the rivers into islands, and I will dry up the pools. And I will lead out the blind into a way that they do not know, and in paths of which they are ignorant I will make them walk. I will turn darkness before them into light, and crooked things into straight. These words I have done for them, and I have not forsaken them. They have turned back; let them be confounded with confusion, who trust in a graven image, who say to a molten image: You are our gods. LXX: Sing to the Lord a new song; his dominion is glorified, and his name from the top of the earth; those who go down to the sea and sail it, the islands and their inhabitants. Rejoice, O desert, and its villages, the farmsteads and the inhabitants of Kedar. Those who dwell in Petra will rejoice; from the top of the mountains they will cry out. They will give glory to God; they will declare his powers in the islands. The Lord God of powers will go forth and will crush war; he will stir up zeal, and will cry out over his enemies with strength. I have held my peace from the beginning; shall I always hold my peace and endure? Like a woman giving birth I have been patient; I will burst forth and will dry up at once; I will lay waste mountains and hills, and I will dry up all their hay. And I will turn the rivers into islands, and I will dry up the marshes. And I will lead the blind by a way that they do not know, and I will make them tread paths of which they have been ignorant; I will turn darkness into light for them, and crooked things into straight. These words I will do for them, and I will not forsake them; but they have turned back. Be confounded with confusion, you who trust in graven images, who say to molten images: You are our gods. He who had said before, The former things, behold, they have come; new things too I declare; before they spring up, I will make you hear of them, and had promised that he would tell what they did not know, declares in the following discourse what those new things are, commanding the Apostles and apostolic men to sing a new song, in no way in the oldness of the letter, but in the newness of the spirit; and not only in the old Instrument, but in the new; and that his praise should reach even to the ends of the earth. For his going forth is from the highest heaven, and his circuit even to its height (Ps 18 [19]). The sound of the Apostles went out into all the earth, and their words to the ends of the world. Or, according to the Seventy: Glorify his name in the ends of the earth: so that in the whole world the name of Christ may be announced to the nations. And who these are who are to sing the new song, the following words declare: You who go down, he says, to the sea, and sail it, or the fullness of the sea. For Jesus, seeing the Apostles on the shore by the sea of Gennesaret mending their nets, called them and sent them into the great sea (Luke 5), so that from fishers of fish he might make them fishers of men; and they preached the Gospel from Jerusalem as far as Illyricum and the Spains, capturing in a short time even the might of the city of Rome itself. Or certainly they went down to the sea and sailed it, enduring the storms and persecutions of this world. By the islands too and their inhabitants understand either the diversity of the nations or the multitude of the Churches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
