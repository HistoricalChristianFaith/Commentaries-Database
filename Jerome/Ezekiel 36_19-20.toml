[[commentary]]
quote='''
Then he will be scattered among the nations so as to be made equal to the unbelieving nations, and he will be winnowed on the earth like chaff so as to be separated from the grain of the Church, and he will be judged according to his ways; and if not even so does he perceive his sin, but defiles his holy name, all among whom he dwells will say: 'Behold the people of God, behold one who went out of his land, or rather was cast out'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
