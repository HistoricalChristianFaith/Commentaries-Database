[[commentary]]
quote='''
'But if', he says, 'you refuse to hear me, secretly' — according to Aquila 'in darkness' — 'the soul will weep, mine' — or, according to the Seventy, 'yours' — 'before the face of pride, so that not even groaning and weeping may be free, lest the eyes of the victors be offended'. But we can also interpret this passage thus: the Savior speaks: 'Work while it is day; the night will come, when no one can work any longer'. Of this time there is also the prophecy of Isaiah: For the stars of heaven and Orion and all the adornment of heaven will not give light, and they will be darkened at the rising of the sun, and the moon will not give light. Zephaniah too agrees in the same words, saying: A day of tribulation and distress, a day of misery and perdition, a day of darkness and whirlwind, a day of cloud and gloom. Before, therefore, the time of judgment arrives and our feet stumble upon the dark mountains, namely the adverse powers that are set over torments and tortures, let us do repentance, lest, waiting for light, we be wrapped in the darkness of night; and let us know that, unless we do this, the soul either of God or of the prophet will weep before the face of our pride, who refuse to hear the words of God. Hence the prophet himself also says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
