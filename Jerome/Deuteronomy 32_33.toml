[[commentary]]
quote='''
But the wine in which is debauchery can also be taken as that of which it is said in the song of Moses: Their wine is the rage of dragons, and the incurable rage of asps (Deut. 32:33), which all who are drunk with the thought of this age drink, and they rave, and vomit, and fall headlong. And, as in the fable of the Lapiths and Centaurs, they are borne to mutual destruction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
