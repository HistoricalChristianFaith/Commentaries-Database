
[[commentary]]
quote='''
Otherwise, as it is written: "And I will take away from them the heart of stone, and I will give them a heart of flesh," that is, a soft one, with which they may be able to receive the law of God. For unless someone turns from his hardness, and becomes soft, he cannot receive food, and the bread which came down from heaven, so that he may be able to say: "Give us this day our supersubstantial bread," that is, the bread which is of your substance. In the Hebrew Gospel according to Matthew it has thus: "Give us this day our bread for tomorrow," that is, the bread which you are going to give us in your kingdom, give us today.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_047.html'
source_title="Homily 47, on Psalm 135"
