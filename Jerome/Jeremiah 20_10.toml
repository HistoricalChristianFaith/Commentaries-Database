[[commentary]]
quote='''
But many of the teachers in the Church even today endure similar things, hearing the reproach of many gathered round about against them and who say: Persecute, and let us persecute them!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
