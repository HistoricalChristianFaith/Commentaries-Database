[[commentary]]
quote='''
This is the sword, and this is the broadsword and the sword (framea), of which the Lord also speaks to the Father in Psalm 21 (22): Deliver my soul from the sword and my only one from the hand of the dog. Of this broadsword it is also written in Amos the prophet: All the sinners of the earth shall die by the sword. This cannot stand at all according to the letter, for many sinners perish by shipwreck, others by poison; these are choked by water, those a fire consumes. But by this sword and this broadsword all sinners perish, and the Ethiopians of black color too, of whom Zephaniah testifies with his sacred mouth, saying: But you also, Ethiopians, shall be slain by my sword.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
