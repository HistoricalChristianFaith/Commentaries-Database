[[commentary]]
quote='''
Again the speech of the prophet speaking about himself is introduced: while they prophesy falsely and are covered with confusion and ignominy, I, what I speak, I speak moved by the Holy Spirit, and I speak the judgment of the Lord and the truth. And while the false prophets bite with their teeth and preach peace, I without any fear declare to Jacob his crime and to Israel his sin, because they either worshipped idols in place of God, or crucified the Son of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
