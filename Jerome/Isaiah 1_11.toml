[[commentary]]
quote='''
To what purpose is the multitude of your victims to me, says the Lord? I am full. Burnt offerings of rams, and the fat of fatlings, and the blood of calves and of lambs and of goats I did not want. For what is I did not want, the Seventy translated I do not want, the present tense for the past. But according to the Hebrew, God shows that he never wanted the victims of the Jews; which we read also in Psalm 49 (50): I will not take calves from your house, nor goats from your flocks: for all the wild beasts of the forests are mine, the cattle on the mountains and the oxen. I know all the birds of the sky, and the beauty of the field is with me. If I am hungry, I will not tell you: for the world is mine and the fullness thereof. Shall I eat the flesh of bulls, or shall I drink the blood of goats (Ps 49 [50]ff.)? And having rejected the ceremonies of the old Law, he passes on to the purity of the Gospel, and shows what he desires in their place: Offer to God the sacrifice of praise, and pay your vows to the Most High. And call upon me in the day of trouble, and I will deliver you, and you shall honor me. So the whole content of this chapter, down to the place where he says, Judge for the orphan, defend the widow, and come, and let us reason together, rejects the sacrifices of victims and teaches that obedience to the Gospel is above sacrifice. And what he added, I am full, is to be taken in this sense: I lack nothing; The earth is the Lord's, and the fullness thereof (Ps 23 [24]:1). Hence we too have all received of his fullness. This can also be taken of those who, while not doing God's commandments, believe that they can buy God off with gifts and offerings; or of those who offer to the altar and to the poor what they have taken by robbery and greed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
