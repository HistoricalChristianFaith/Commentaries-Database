[[commentary]]
quote='''
'And when', he says, 'the city has been taken, then I will speak to them, that my judgments were right and that each one received what he deserved, not for the other vices to which the human condition is subject, but above all for idolatry, through which, forsaking me, they worshiped the works of their own hands'. Some take this place in a good sense, namely that those who have been boiled in the bronze pot through torments and purged will afterward be princes of Jerusalem, and that, after the Lord has had mercy on them, he will then reproach them because, having forsaken him, they venerated images. But this is a forced and perverse interpretation; let not an unlearned expounder raise a false charge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
