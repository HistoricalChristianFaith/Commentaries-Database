[[commentary]]
quote='''
Gather out of the land your confusion, you who dwell under siege, for thus says the Lord: Behold, I will cast far away the inhabitants of the land at this turn, and I will afflict them, that they may be found. LXX: She has gathered from outside her substance, she who dwells in a stronghold, for thus says the Lord: Behold, I will supplant the inhabitants of this land and afflict them, that they may be found. Jerusalem is commanded to gather whatever substance she has outside into the most strongly fortified city and to prepare provisions for a long siege; for he is threatening no longer, as before, about a future and distant time, but now about the captivity close at hand, which is about to come at any moment. 'Gather,' he says, 'both from outside and from the land, that is, from the fields, your substance into confusion. For whatever you have is worthy of confusion; and although you prepare these things, learn the words of the Lord concerning them: Behold, I at this turn, that is, at this time, will cast or hurl as from a sling far away the inhabitants of the land, this one'. For this the Seventy translated: I will supplant and make fall; for this Hebrew word, that is 'cole', Aquila and Symmachus translated sphendonisō [I will sling], and the sense is: 'As from a sling I will hurl them with all force, and so I will cause them to be besieged, and so I will afflict and hem them in, that all may be found in the city and be unable to escape the evil'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
