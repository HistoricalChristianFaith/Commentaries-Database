[[commentary]]
quote='''
And when Ashkelon, Gaza and Ekron have been terrified, and have grieved because they either had no inhabitants, or lost their king, or their former hope was frustrated, foreigners shall sit in Ashdod, where the fire generates which the Lord sent upon the earth and desires to be kindled. For he baptizes in the Holy Spirit and fire, where there is the cousin and the paternal uncle, ἀδελφὶδος καὶ πατράδελφος, whom the bride desires in the Song of Songs; where there is the fire of the breast and of the most bounteous bosom, of which we read in the same Song: He shall abide between my breasts, and in the Apostle: I gave you milk to drink, not solid food. Where according to the LXX we said: And foreigners shall dwell in Ashdod, in the Hebrew is read, the mamzer shall dwell, or shall sit, in Ashdod, for which we have put: And the separator shall sit in Ashdod. Understand the separator to be the Lord, who separates the wheat from the chaff, and the good fish from the bad fish, and distinguishes silver and gold from filth and dross. And when he has done this, he promises the rest also: I will destroy the insolence, or the pride of the Philistines, for whom the LXX translated foreigners. The Philistines are interpreted in our language falling by the cup, because they drank from the cup of Babylon and, being drunk, fell down. These therefore in the time of the calling of the nations and the coming of Christ shall not have pride, but shall follow the humble and meek Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
