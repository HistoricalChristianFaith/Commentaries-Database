[[commentary]]
quote='''
And you, when you were dead in your trespasses and sins, in which you once walked according to the age of this world, according to the prince of the power of the air, the spirit that now works in the sons of unbelief, in which we also all once lived in the desires of our flesh, doing the wills of the flesh and of the thoughts, and were by nature sons of wrath, even as the rest. But God, who is rich in mercy, because of his great love with which he loved us, even when we were dead in sins, made us alive together with Christ.

Before we discuss the senses of the individual words, it seems to us that the order of the reading should be rendered thus: And you, when you were dead in your trespasses and sins, God, who is rich in mercy, made alive together with Christ, because of his great love with which he loved us; and when we were dead in trespasses, in which we once walked according to the age of this world, according to the prince of the power of the air, the spirit that now works in the sons of unbelief, in which we also all once lived in the desires of our flesh, doing the wills of the flesh and of the minds, and were by nature sons of wrath, he made us alive together with Christ; so that, ἀπὸ κοινοῦ (in common), and he made us alive together with Christ is understood as though said twice. As for the causal conjunction in the place where he says, But God, who is rich in mercy, we judge that it was either added by unlearned scribes, and the fault gradually took root, or else was used superfluously by Paul himself, who was unskilled in speech but not in knowledge (2 Cor. 11).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
