[[commentary]]
quote='''
Jacob, at the time when he was fleeing his brother into Mesopotamia, came to Luz: and there, it says, he placed a stone for himself at his head. Under his head the stone was Christ. He never placed a stone at his head, except at the time when he fled his persecutor. When he remained in his father's house, as long as he was in his father's house and had the comforts of the flesh, he did not have a stone at his head. He departed from his home naked, he departed with a staff; and at once, that very night, he found a stone, and placed it at his head. Because he had such a pillow on which to take his rest, see his vision. 'He saw,' it says, 'a ladder reaching from the earth to heaven; and he saw,' it says, 'angels descending and ascending.' He saw angels coming from heaven to earth, and others ascending from earth to the heavens. Do you wish to know that that stone, which was at Jacob's head, was Christ the cornerstone? 'The stone which the builders rejected has become the head of the corner.' That stone which is written of in the book of Kingdoms, Ebenezer. That stone is Christ. And Ebenezer is interpreted 'stone of help.' 'Jacob arose,' it says, 'in the morning.' And what did he say? 'This,' he says, 'is the house of God.' And what did he do? 'He took,' it says, 'oil, and anointed the stone.' Unless we understand the mysteries of the Scriptures, what reason was there that he should anoint the stone with oil?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_046.html'
source_title="Homily 46, on Psalm 133"
