[[commentary]]
quote='''
For Jerusalem has fallen, and Judah has collapsed: because their tongue and their devices are against the Lord, to provoke the eyes of his majesty. The recognition of their countenance has answered them: and they have proclaimed their sin like Sodom, and have not hidden it. It is the Prophet who says this, not, as many think, the one who had been chosen prince. And he says that no one is willing to be set over a sinful people for this reason, that both Judah and Jerusalem, both the city and the province of Judea, or the tribe of Judah, have fallen alike. And he gives the causes of their impiety: that they blasphemed against the Lord and said, Away, away, crucify such a one; we have no king but Caesar (John 19:15, 16), and by the fury of their tongue provoked the most merciful Lord to bitterness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
