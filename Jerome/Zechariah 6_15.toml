
[[commentary]]
quote='''
And when the crowns, he says, have been laid up in the temple of the Lord, and consecrated for an everlasting memorial, nations from the whole circle of the lands and set far off shall come, and shall build in my temple, each according to his strength. And then, by the outcome of events and the prosperity of all, you shall know that the Lord has sent me, and that at his command I foretold all things. And all these things shall come to pass if you obey the precepts of the Lord and do his commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
