[[commentary]]
quote='''
They will walk after the Lord; he will roar like a lion, for he himself will roar; and the sons of the sea will tremble, and they will fly like birds out of Egypt, and like a dove from the land of the Assyrians; and I will settle them in their houses, says the Lord. LXX: I will walk after the Lord; as a lion he will roar, for he himself will roar; and the sons of the waters will tremble, and they will fly like a bird out of Egypt, and like a dove from the land of the Assyrians; and I will settle them in their houses, says the Lord. When the Lord promises prosperous things, the people will be converted to him, and will walk after the Lord, because the Lord will roar like a lion. Of this the prophet Amos also makes mention: The Lord will roar from Zion, and from Jerusalem he will utter his voice. And he roars when he says: as Admah, I will set you as Zeboiim. And when he has roared, then the sons of the sea will tremble, or of the waters, as the LXX translated. For the word maim, which is written with three letters, mem, iod, mem, if it is read maim, means waters; if meiam, it is understood of the sea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
