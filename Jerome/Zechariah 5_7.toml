[[commentary]]
quote='''
And behold, a talent of lead was being carried. For talent of lead we read in what follows stone of lead. A talent is called chachar; a stone, aben. It is, then, the stone of lead which is also the talent of lead, which we, expressing it more plainly, have translated as a lump or ball of lead, by which is signified the very heavy weight of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
