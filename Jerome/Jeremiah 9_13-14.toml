[[commentary]]
quote='''
And he brings in the Lord answering and giving the reasons: because they had forsaken his law, which he had given them, and had not heard his voice nor done what had been commanded, but had gone after the perversity of their heart. Therefore we must trust not in our own will but in the Lord; for the heart in men is perverse, and from our heart come forth the worst thoughts. And after the Baals, he says, they have gone, whom they learned from their fathers. Bahal is the idol of the Sidonians and is of the singular number, but Bahalim of the plural number. Therefore neither the error of parents nor that of ancestors is to be followed, but the authority of the Scriptures and the command of God who teaches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
