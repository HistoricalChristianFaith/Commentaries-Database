[[commentary]]
quote='''
And the house of Jacob, that is, of Judah, shall be a fire, and the house of Joseph, that is, of the ten tribes, a flame. For of Joseph was born Ephraim, from which tribe came the rule of Samaria; but the house of Esau, that is, of the Idumeans, who had shown themselves so savage and cruel against their brother, shall be turned into stubble. And as fire and flame swiftly devour stubble, so the two kingdoms, bound in alliance into one rod, according to Ezekiel, shall lay Idumea waste and devour it, and there shall be no one left of the people who could announce the overthrow of the adversaries to the neighboring nations. For this is what the Seventy translated πυροφόρον, which we have rendered as grain-carrier, following the idiom of the old speech; for those whom they now call agents in affairs, or post-couriers, the ancients called grain-carriers. But it is better that we follow the Hebrew itself, that is, sarid, which is translated either 'remaining', according to Aquila, or 'escaping', according to Symmachus, or, according to Theodotion and the Fifth edition, 'left over'. And all these things shall come to pass because the Lord has spoken, and for him to have commanded is to have done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
