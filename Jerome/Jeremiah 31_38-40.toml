[[commentary]]
quote='''
Behold, days are coming, says the Lord, and the city shall be built for the Lord from the tower of Hananel to the gate of the corner. And the rule — or, according to Symmachus, the line — of its measure shall go out further, over against it, upon the hill Gareb, and it shall go round Goah — or, according to the LXX, of chosen stones — and all the valley of ruins — for which Theodotion put the Hebrew word itself, Phagarim — and the ashes and all Asaremoth — which we better read Asademoth, for which Aquila translated suburbs — to the brook Kidron and to the corner of the eastern gate of the horses, the holy place of the Lord; it shall not be plucked up and shall not be pulled down for ever. Those who accept a thousand-year reign of Christ in the land of Judea, namely the Jews and our Judaizers, try to point out the tower of Hananel and the gate of the corner and the hill Gareb and Goah and the valley Phagarim and all Asademoth and the brook Kidron and the place of the corner of the eastern gate of the horses, and there, they say, the sanctuary of the Lord, that is, the temple, is to be founded and is to remain in perpetuity. And because they cannot show it fulfilled after the captivity, in the times of Zerubbabel and Ezra, they pass to the times of Christ, who they say will come at the consummation of the world, so that a golden and jeweled Jerusalem, according to the Revelation of John, may descend and be built round about in this space of land, that is, from that place to that place. And they catch at this little breeze for their supposition: that from the tower of Anathoth, which today is called Jeremiah's, three miles distant from Jerusalem, as far as the brook Kidron — which is recorded in the Gospel and is in the valley of Jehoshaphat, where there was a garden in which Judas the betrayer handed over the Savior — the foundations of the city are to be laid. 'We are going to read', they say, 'in what follows that Anamehel, son of Shallum, was the cousin of Jeremiah, whose field he bought; and this is the tower of Ananehel', ignorant of the Hebrew truth; for here according to the Hebrew is written: from the tower of Ananehel, namely with 'nun' as the middle letter, but there: behold, Anamehel, son of Shallum, your cousin, will come to you, with 'm' as the middle letter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
