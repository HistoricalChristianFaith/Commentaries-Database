[[commentary]]
quote='''
And when your seed shall seem to flower, and to have some shadow of piety, while you draw men away from idols, yet when you come to gather the fruits in the day of inheritance you shall grieve grievously, seeing the people of the nations preferred to you. Whence the Apostle also says: I have great sorrow and unceasing grief in my heart. For I myself wished to be anathema from Christ for my brethren, who are my kinsmen according to the flesh, who are Israelites, to whom belong the adoption of sons, and the giving of the law, and the glory, and the covenant, and the promises; whose are the fathers and so on (Rom 9:2ff.). This not only Paul but every saint says, wishing that, together with the branches of the wild olive, the root too may be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
