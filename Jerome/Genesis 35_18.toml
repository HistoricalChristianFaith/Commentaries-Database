[[commentary]]
quote='''
(Verse 18.) And it came to pass, when her soul departed, for she died, that he called her name, 'The Son of my Sorrow'; but his father called his name Benjamin. In Hebrew, the similarity of the name is echoed; for the son of my sorrow, which the dying mother gave him as a name, is called Benoni (). However, the son of the right hand, that is, of strength, which Jacob changed, is called Benjamin. Hence, those who think Benjamin () is interpreted as 'Son of Days' are mistaken. For when the right hand is called Jamin (), and it ends in the letter n: the days are indeed called Jamim (), but they end in the letter m.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
Now Benjamin is interpreted 'son of the right hand.' For at the time when Rachel died in Ephrata (we see the tomb with our own eyes, we do not seek examples elsewhere); at that time, therefore, when Rachel was dying, 'She bore,' it says, 'an infant, and the women — or she herself who was dying — called his name Benoni, that is, son of my sorrow.' But on the contrary Jacob the father turned the mother's sorrow into glory, and does not call him Benoni, that is, son of my sorrow, but Benjamin, that is, son of the right hand, that is, of my strength. Benjamin, therefore, is a name composed of two parts, of 'son' and of 'right hand': for BEN means 'son,' JAMIN means 'right hand.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_003.html'
source_title="Homily 3, on Psalm 7"
