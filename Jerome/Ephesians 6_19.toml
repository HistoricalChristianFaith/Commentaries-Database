[[commentary]]
quote='''
That utterance may be given me in the opening of my mouth, to make known with confidence the mystery of the Gospel, for which I perform an embassy in a chain, so that in it I may dare to speak as I ought.

What he now says: In the opening of my mouth; and elsewhere: My mouth is open to you, O Corinthians (2 Cor. 6:11); and: Opening his mouth, he taught his disciples, saying (Matt. 5:2); and: I opened my mouth and drew in the spirit (Ps. 118:131); and: I will open my mouth in parables (Ps. 77:2), and other things like these, are to be taken as if he had said: let the treasures be opened, and let the mysteries hidden from the ages be laid open, so that the Holy Spirit may enter to bring forth the things that lie hidden. For that this is the meaning of this testimony, that is, that utterance may be given me in the opening of my mouth, what follows proves. With confidence, he says, to make known the mystery of the Gospel. Not at all in parables and proverbs, as both the prophets spoke and the Lord himself, while still placed in the body, saying: The hour comes when I will no longer speak to you in proverbs, but I will tell you with confidence of the Father (John 16:25). This speech of confidence he alone will be able to obtain who does not have a heart that reproaches him: For if our heart does not reproach us, we have confidence toward God, and whatever we ask, we shall receive from him (1 John 3). Rare, therefore, is he who makes known the mystery of the Gospel with confidence, because rare is he who has confidence toward God. For who will boast that he has a chaste heart, or who will stand saying that he is clean from sins? (Prov. 20:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
