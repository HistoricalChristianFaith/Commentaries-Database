[[commentary]]
quote='''
And others cut boughs … and strewed them in the way. They cut branches from the fruitbearing trees with which the Mount of Olives was planted, and spread them in the way; so as to make the crooked ways straight, and the rough ways smooth, that Christ the conqueror of sin might walk straightly and safely into the hearts of the faithful.… And when they had done all that was to be done by their hands, they offered also the tribute of their voices; and going before and following after they cry, not in a brief and wordless confession, but with all their might: "Hosanna to the son of David. Blessed is he that comes in the name of the Lord."
'''
source_url=''
source_title="HOMILIES 94"

[[commentary]]
quote='''
And a very great crowd spread their garments on the road. See the difference of each person. The apostles put their garments upon the ass; the crowd, which is of lower rank, spreads them beneath the ass's feet, so that it may nowhere strike against a stone, may not tread on a thorn, may not slip into a pit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
And others cut branches from the trees and spread them on the road. From the fruit-bearing trees with which the Mount of Olives is planted they cut branches and spread them on the road, to make the crooked straight and to level the uneven, so that Christ, the conqueror of demons and of vices, might advance more straightly and more safely in the heart of believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
