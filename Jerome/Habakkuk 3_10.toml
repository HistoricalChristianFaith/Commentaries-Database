[[commentary]]
quote='''
They saw you, and the mountains grieved; the flood of waters passed; the abyss gave its voice; the height lifted up its hands. The sun and moon stood still in their dwelling; in the light of your arrows they will go, in the splendor of your flashing spear. In roaring you will trample the earth; in fury you will astound the nations. You went forth for the salvation of your people, for salvation with your Christ. You struck the head from the house of the wicked one; you laid bare the foundation up to the neck. Always. We have set down our edition alone, so that, following it, that is, following the Hebrew, we may weave together the sequence of the passage, and afterwards discuss the LXX clause by clause, section by section. They saw you, O God, and the mountains grieved; that is, the lofty kingdoms and the exalted powers of this world, and the four chariots in Zechariah which go out from the mountains of bronze: these saw you and trembled. And the flood of waters passed, that is, all their onrush, and the persecution with which they harassed your people, passed after they saw you. Then the abyss, that is, those below, praised you; then also those above, that is, the angels, clapped their hands in applause, to show forth the victor as it were by a kind of gesture and dance of uplifted hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: They will see you, and they will grieve, or, the peoples will be in labor: for ὠδινήσουσι means both. Accordingly, the earth having been split open and the rivers flowing forth, the peoples who had drunk from the rivers of God will see God and will be in labor. For from the very fact that they see God, they at once conceive by the word of God and say: From fear of you, O Lord, we have conceived in the womb, and have been in labor, and have brought forth; we will make the spirit of your salvation upon the earth. Blessed, he says, are the pure in heart, for they shall see God. These peoples, therefore, washed by the rivers, have not already seen, but are going to see God; and when they have seen, they will conceive, so that they may bring forth the fruits of doctrines. But because they are called peoples, and it does not belong to peoples to see the face of God, although the speech is extended into the future, they will see and they will bring forth, nevertheless, according to tropology, the Hebrew is rather to be followed, where it says: They saw you, and the mountains brought forth; for it belongs to mountains to see God and to bring forth sons, whom they have conceived from the word of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: You will scatter the waters of the way. The waters are of different kinds: some are everlasting, others short-lived. Of the everlasting waters, and those which flow from the fountains of Israel, it is said: The earth will be split by rivers. Of the sudden ones, which run for a time: All torrents go into the sea. For the end of such waters is destruction. God, therefore, will scatter all the waters which have been trampled by perverse doctrines, when he has dispersed the counsels of princes and the wisdom of this world. If ever you see some heresy flourish for a short while and afterwards be dispersed by the grace of God, say that this has been fulfilled: You will scatter the waters of the way. Moreover, to what is said, of the way, one may supply of the devil, so that the sense is: The waters which the devil has trampled, and which have afforded a way through themselves to many, that is, have lain open to many errors, the Lord will divide and scatter. Hence the other translators too, wishing to describe the fury of heretics, translated: The dashing, or the rush of waters will pass. For they are borne along headlong on the downhill course of eloquence, so as to drag along with them whomever they find in their path and light-minded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: The abyss gave its voice, the height of phantasy. The abyss is often taken in a good sense, often in a bad one, sometimes indifferently. In a good sense: Your judgments are a great abyss, and: Abyss calls upon abyss, and the rest. In a bad sense: The waters saw you, O God, and the rest. Moreover the demons too beg not to be sent into the abysses. And in Genesis: The abyss over which there was darkness: I do not know whether it can be taken in a good sense. But it is set down indifferently there: The fountains of the abyss were broken up, and the cataracts of heaven were opened. And that in Psalm 148: Dragons and all abysses, fire and hail and the spirit of storms; unless perhaps, because it is set among dragons and fire and hail, it is to be drawn into a bad sense. Which I do not know whether anyone can say who has seen it sounding together with the rest in the praise of the Lord. If, then, we take the abyss in a good sense, let us say: when the waters of the most wicked way were scattered, your wise ones saw you, and, borrowing from your countenance the height of knowledge which they had — because they saw you and the mountains were in labor —, whatever they had previously thought about you they brought forth in the praises of their voice. And he beautifully calls the opinion of phantasy height, in accordance with Jesus son of Sirach, who says: The abyss and wisdom, who will search them out? Hence also, from the little mountain, that is, the assumption of a human body, which Daniel calls a stone cut from the mountain without hands, that is, without the work of marriage, Christ the abyss calls upon the Father, the other abyss, in the voice of his cataracts, that he may give to those who preach the good news the word with great power. Or certainly the abyss, the New Testament, in testimony of the little mountain by which the prince of Tyre was wounded, calls upon the abyss of the Old Testament, so that through the cataracts of Christ, that is, the apostles, the preaching may become firmer. But if anyone wishes to take what is said, The abyss gave its voice, the height of its phantasy, in a bad sense, he will use this argument: that after the scattered waters of the way, which were certainly taken in a bad sense, this too is rightly understood in the contrary sense. And at the same time observe that he did not say its height, but the height of its phantasy, that is, of shadow and image. For they seem to have height and knowledge of the Scriptures, but all their height, compared with the truth, is phantasy, and they lift up their voice in vain, because the waters of the way have already been scattered. Let us search in the Scriptures whether we can anywhere find phantasy in a good sense; and since it has been found either rarely or never, we shall interpret the abyss and its phantasy in a bad sense with greater firmness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
