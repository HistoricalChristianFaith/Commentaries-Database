[[commentary]]
quote='''
Moreover, I consider foolish talk to belong not only to those who relate shameful things to raise a laugh, and with feigned silliness rather make sport of those whom they wish to please, but also to those who are reckoned the wise of this age and who, disputing about natural things, say that they have clearly comprehended the sands of the shores, the drops of the Ocean, the expanse of the heavens and the point of the earth. There is foolish talk in the Church too: if anyone thinks that heaven is curved like a vault, deceived by the words of Isaiah, whom he does not understand; and also that a throne is set in the heavens, and God sits upon it, and that, after the fashion of an emperor and a judge, angels stand round about, to obey the words of the one who commands and to be sent off on their various duties (Isa. 6). But since scurrility follows foolish talk, foolish talk is rather to be applied to silly and inept tales. Between foolish talk and scurrility there is this difference: foolish talk has in it nothing wise and nothing worthy of a man's heart; scurrility, on the other hand, comes down from a shrewd mind, and deliberately seeks out certain words, whether urbane or rustic or indecent or witty (what we may call by another word jocularity), to raise a laugh among the hearers. But these things too are to be driven far away from holy men, for whom it is more fitting to weep and mourn; as we also read in the Hebrew Gospel, where the Lord speaks to the disciples: And never, he says, be glad, except when you have seen your brother in love. Up to this point he seems to have brought in nothing outside his purpose, nothing outside the logical sequence and the texture of the order. But as to what follows, and is placed at the end, But rather thanksgiving, someone may ask, and say, what does thanksgiving mean after the prohibition of fornication and impurity and wantonness and obscenity and foolish talk and scurrility? For if he was once free to set down any virtue whatever, he could have said: but rather righteousness, truth, love. But just as this is inconsequent, so those too could have been inconsequent, and by the same license would have had no order. Perhaps, then, the thanksgiving (gratiarum actio) named in this place is not the one by which we give thanks to God, but the one by which we are called pleasing or gracious (gratiosus), and witty, among men. For it does not befit a Christian to be a foolish talker and a buffoon; but it does befit his speech to be seasoned with salt, so that it may have grace with those who hear. And since it is not customary among the Greeks, except among certain learned men, to say εὐχαριστίαν as distinct from eucharistia, that is, being gracious as distinct from giving thanks, I therefore think that the Apostle, as a Hebrew of the Hebrews, used the common word, and wished to set out his meaning by the signification of another word; especially since among the Hebrews "gracious" and "giving thanks" are expressed, as they say, by one word. Hence I think that in Proverbs too it is written thus: γυνὴ εὐχάριστος ἐγείρει ἀνδρὶ δόξαν, a grateful woman raises up glory for her husband (Prov. 11:16), in the sense of "gracious". We would seem to be doing violence to Scripture, and boldly taking a thanksgiving woman for a gracious one, did not the other editions also agree with our opinion. For Aquila and Theodotion and Symmachus put it thus: γυνὴ χάριτος, that is, a gracious woman, and not εὐχάριστος, which pertains to the giving of thanks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
