[[commentary]]
quote='''
He who is now said to have ascended ascended for this reason, because he had first descended. For this is what But that he ascended, what is it, except that he also descended means. And so we must ask, concerning what is written elsewhere, No one has ascended into heaven except he who descended from heaven, the Son of man (John 3:13), how he ascended before descending? For when he was saying these things, after his descent from the heavens, he was showing that he had once ascended to the heavens. And this too must likewise be considered: how the descent and the ascent themselves are to be understood, whether locally, according to the body, or spiritually, above the body, or indeed in both ways.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
