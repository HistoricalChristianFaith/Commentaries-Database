[[commentary]]
quote='''
Many measuring the commandments of God by their own weakness, not by the strength of the saints, hold these commands for impossible, and say that it is virtue enough not to hate our enemies; but to love them is a command beyond human nature to obey. But it must be understood that Christ enjoins not impossibilities but perfection. Such was the temper of David towards Saul and Absalom; the Martyr Stephen also prayed for his enemies while they stoned him, and Paul wished himself anathema for the sake of his persecutors. (Rom. 9:3.) Jesus both taught and did the same, saying, Father, forgive them, for they know not what they do. (Luke 23:34.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But I say to you: Love your enemies, do good to those who hate you. Many, judging the precepts of God by their own weakness and not by the strength of the saints, think that the things commanded are impossible, and say that it is enough for the virtues not to hate one's enemies; but that to love them is to command more than human nature can bear. It must be known, then, that Christ commands not impossible things but perfect ones, which David did toward Saul and Absalom. Stephen the martyr too prayed for the enemies who were stoning him, and Paul longs to be anathema for his persecutors. And these things Jesus both taught and did, saying: Father, forgive them; for they do not know what they are doing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
