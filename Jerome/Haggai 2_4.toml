[[commentary]]
quote='''
Nevertheless, because the former house has become as if it did not subsist, Zerubbabel the governor and Joshua the priest are roused, so that the kingdom and the priesthood of Christ may be strengthened, and his people, which was once the people of the land, may do works in the house of the Lord and know that God is present to it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Haggai.html'
source_title="Commentary on Haggai"
