[[commentary]]
quote='''
You see now how the rebuilding of Jerusalem takes place: the broken heart is mended.… You wound your heart, and the Lord binds your wounds.… It refers to those who are penitent, but of the unrepentant, Scripture says, their wounds "are not drained or bandaged or eased with salve."
'''
source_url=''
source_title="HOMILIES ON THE PSALMS 56 (PSALM 146)"

[[commentary]]
quote='''
From the sole of the foot to the crown of the head there is no soundness in it: wound and bruise and swelling sore. He keeps up the figure he has begun: from the feet up to the crown, that is, from the lowest to the highest, from the last to the first, they are pierced through in the whole body. Wound, he says, and bruise and swelling sore: for bodies are either livid from beatings, or swollen with blows, or gaping with wounds. We ask to what time these things should be fitted. After the Babylonian captivity, under Zerubbabel and Ezra and Nehemiah, Israel returned to Judea and recovered its ancient state. Under various princes and kings also the temple was built more magnificently, so much so that they even earned the friendship of foreign nations, of the Lacedaemonians and the Athenians and the Romans. Therefore this which he says, There is no soundness in it, he refers to the last captivity, when, after Titus and Vespasian and the final overthrow of Jerusalem under Aelius Hadrian, there has been no remedy down to the present time, and what is written is fulfilled: All have turned aside, together they have become unprofitable; there is none who does good, there is not even one (Rom 3:12). And as for what is added, there is no soundness in it, understand it either of the people, or of the body, or of the head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
It is not bound up, nor treated with medicine, nor soothed with oil. For which the Seventy translated: It is not possible to apply a plaster, nor oil, nor bandages. To this day the wound and bruise and swelling sore of the people of Israel is not bound up with bandages, nor treated with medicine. Which Aquila translated μότωσιν, namely the lint which is laid on wounds to dry up the matter and draw out the pus. Nor soothed with oil: that their hardness might be softened by tears of repentance. For the bandages, with which the wounds of Israel are by no means bound up, the Seventy translated plaster. Israel therefore lies pierced through and cut to pieces, because he killed the physician who had come to heal the house of Israel. Hence in Jeremiah too the Angels speak τροπικῶς in the person of Babylon: We have cared for Babylon, and she is not healed (Jer 51:9), that is, the city of confusion and of vices. And in the Gospel (Luke 10) we read of the man going down from Jerusalem to Jericho who was wounded by robbers and cared for by the Samaritan, and of the softness of oil poured into his wounds after the sharpness of wine. From the place, then, where he had said above, Upon what shall I strike you, and every head is sick, down to what is added here, It is not treated with medicine, nor soothed with oil, the likeness of the figure is kept, and the description of incurable wounds expresses the eternal captivity of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
