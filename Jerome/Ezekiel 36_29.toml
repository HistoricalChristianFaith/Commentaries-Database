[[commentary]]
quote='''
And when they have been saved, the Lord will call the grain and multiply it — for unless indeed a grain of wheat falling into the earth has died, it remains alone —, and they will by no means suffer famine — not a famine of bread and a thirst for water, but a famine of hearing the word of God — the famine which he suffered who, setting out from his father, squandered all the substance he had received, when, compelled by the necessity of hunger, he fed on the pods of the swine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Then they will be saved from all their defilements, and the grain from which the heavenly bread is made will be multiplied for them, and they will no longer suffer the famine of the word of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
