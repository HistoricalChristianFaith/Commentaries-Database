[[commentary]]
quote='''
Segor [Zoar]: small. It is the same as Seor above. But it must be known that it does not have the letter G in the middle, and is written among the Hebrews with the vowel ain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Genesis"
