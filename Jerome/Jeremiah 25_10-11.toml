[[commentary]]
quote='''
And I will destroy from them the voice of joy and the voice of gladness, the voice of the bride and the voice of the bridegroom, the voice of the mill and the light of the lamp. And all its land shall become a desolation and an astonishment. This is proved even today in the assembly of the malignant, in that their teachers do not teach the word of God but hiss like a serpent. And there perishes in them the voice of joy and the voice of gladness, so that they never hear that saying of the Apostle: rejoice, again I say, rejoice!; also the voice of the bride, that is, of the Church's faith, and the voice of the bridegroom, that is, of the Lord the Savior, for he who has the bride is the bridegroom; the voice of the mill, so that grain is not ground in it and given to the peoples to eat; and the light of the lamp, namely the teaching and knowledge of the prophets. Indeed, of John the Baptist too it is said: he was a shining lamp, and another prophet says: a lamp to my feet, he says, is your word, O Lord, and a light to my paths. 'All', he says, 'the land of the heretics shall become a desolation and an astonishment, when its last end has been shown to be foolish'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
