[[commentary]]
quote='''
For behold, the Lord will go forth from his place, and he will come down and tread upon the high places of the earth, and the mountains will be consumed beneath him, and the valleys will be split like wax before the fire, like waters that run down headlong; for the crime of Jacob is all this, and for the sins of the house of Israel. What is the crime of Jacob? Is it not Samaria? And what are the high places of Judah? Are they not Jerusalem? LXX: For behold, the Lord will go forth from his place, and will come down, and will go up upon the high places of the earth, and the mountains will be shaken beneath him, and the valleys will melt like wax before the fire, and like water flowing down a slope; because of the impiety of Jacob are all these things, and because of the sin of the house of Israel. What is the impiety of the house of Jacob? Is it not Samaria? And what is the sin of the house of Judah? Is it not Jerusalem? O Samaria and Jerusalem, hear, and diligently attend to the Lord testifying to you from his temple and foretelling whatever he is going to do. Behold, the Lord will go forth from his place. For he who is meek and kind, and whose nature is clemency, is compelled for your sake to take on the character of cruelty, which he does not have. And he will come down and tread upon the high places of the earth. The descent of God, and the running down of his majesty to lower things, is to tread the earth and to crush all the powerful. The mountains, he says, will be consumed, or will melt, and the valleys beneath him, by which we are to understand princes and peoples. And just as wax does not endure the nearness of fire, and waters are borne headlong in a downward course, so all the pride of the impious, when the Lord comes, will be dissolved and will flow away. All this, moreover, will happen because of the crimes of the ten tribes, which he calls Jacob and Israel, and because of the transgression of Judah, since among the ten tribes Samaria was the metropolis, and in the kingdom of Judah Jerusalem fashioned the idols of the high places; this according to the letter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
It can also be understood thus: that because of the impieties of Samaria and the crimes of the Jews the Lord went forth from what was once his place, and said to the Jews: Behold, your house shall be left to you desolate. And he came down from the heavens, and went up upon the high places of the earth, that is, upon those who, believing out of the lowliness of the Gentiles, deserved to be lofty. And the mountains were shaken, the doctrines of the philosophers and lofty kingdoms, and those who remained lowly were consumed and crushed by the coming of the Savior; and as the Church grew and the mountains rose on high, the idols fell down into the depth. The Lord, therefore, went forth from his place, and the Church was built from the Gentiles, so that the mountains might be moved beneath his feet and the depths of the valleys dissolved, because Jacob acted impiously, and Israel sinned, and all the tribes denied the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
