[[commentary]]
quote='''
Your land is desolate, your cities are burned with fire; strangers devour your country in your sight, and it shall be made desolate as in a devastation by enemies. These things were partly fulfilled under the Babylonians, when the temple was burned and Jerusalem overthrown, when the Samaritans took possession of the region of the ten tribes, and the land of promise was reduced to such desolation that it was laid waste by lions. But what was to come under the Roman captivity is described more fully and more perfectly: when the Roman army laid waste all Judea, and the cities were burned, and strangers at the present time devour their country, and the desolation of the Jews will continue until the end of the world. We can also take these things tropologically of sinners who have fallen from their former holiness, after they have been handed over to the opposing powers: that all their goods come to desolation, and God does not remember their former righteousness, and all things are set on fire by the fire of the devil, and they become the food of beasts, of which it is written in another place too: Do not deliver to the beasts the soul that confesses to you (Ps 73 [74]:19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
