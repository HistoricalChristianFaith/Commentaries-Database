[[commentary]]
quote='''
It is clear from this passage that the willing and running are ours, but the fulfillment of our willing and running belongs to the mercy of God. So it is that free will is preserved as far as our willing and running is concerned and that everything depends on the power of God as far as the fulfillment of our willing and running is concerned.
'''
source_url='https://www.newadvent.org/fathers/30111.htm'
source_title="Against the Pelagians 1.5"


[[commentary]]
quote='''
This he means to say: When we labor, then God helps us. "For it is not of him who wills, nor of him who runs, but of God who has mercy." See what he says: Is it not of him who lies idle, nor of him who sleeps, but of God who has mercy? But see what he says: It is not of him who wills, nor of him who runs, but of God who has mercy. If, then, we do not will and run, God will profit us nothing. It is ours to will and to run, and afterward God has mercy. For a sleeping athlete loses the victory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_034.html'
source_title="Homily 34, on Psalm 107"
