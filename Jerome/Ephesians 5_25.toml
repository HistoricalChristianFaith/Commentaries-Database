[[commentary]]
quote='''
Husbands, love your wives, as Christ also loved the Church, and gave himself up for her, that he might sanctify her, cleansing by the washing of water in the word, that he might present to himself a glorious Church, not having spot, or wrinkle, or any such thing, but that she might be holy and without blemish.

Although husband and wife may be held by love for one another (such as that wife of Hasdrubal is recorded to have been, who, when her husband was captured, threw herself into the burning of her country, and the other women who refused to outlive their dead husbands), yet a wise man will never compare that love to the love of Christ and the Church. Here, therefore, a holy love is to be understood, the love with which Isaac too loved his wife Rebekah (Gen. 24), whose name is interpreted "patience": and from the land of Mesopotamia, which is girded on every side by the waves of this age, he brought her into the land of promise, that he might be comforted for the death of his mother. For he tempered the death of the Synagogue by union with the Church. In saying these things we give an occasion to the heretics who think that all marriages without exception are to be rejected; and they use this testimony above all. To them we must answer in brief words: that here passions, impurity and luxury between husband and wife are forbidden by the Apostle, not a holy union; otherwise, if he was forbidding wedlock altogether, what need was there to say your wives, when he could have said: Husbands, love women, or wives? For your properly signifies marriage. And again in what follows: and husbands ought to love their wives as their own bodies: and more plainly still: He who loves his wife loves himself: For no one ever hated his own flesh; but he nourishes and cherishes it: because according to the edict of the ancient Law and the restoration of the Gospel, husband and wife become one flesh. Therefore, as we have said, the works of begetting children are granted in marriage; but the pleasures that are taken from the embraces of harlots are condemned in a wife. Reading this, let every husband and wife understand that after conception they must devote themselves to prayer rather than to conjugal union. And what in animals and beasts is prescribed by the very law of nature, that when pregnant they do not couple until the birth, let them know that in human beings this has been left to choice, so that there might be a reward from abstinence from pleasures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
