[[commentary]]
quote='''
However, I am not unaware that according to their translation it can also be taken thus: Write the vision in which Christ is promised, and, whether on boxwood, or on tablets, or, as Symmachus translated, on pages, weave this discourse of your prophecy: that at the appointed time and at the consummation of the world my Son will come, to save the lost sheep of the house of Israel, and to join other sheep also to the ancient sheep, and, making one flock, to join the two rods, which Ezekiel, that is, the strength of God, holds joined and cleaving to one another in his prophetic hand. But if, O prophet, or you, O people — in whose person my prophet also seemed to doubt —, Christ withdraws himself a little and seems to delay, wait for him; for coming he will come, and will not tarry, and the rest which we have already expounded above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
