[[commentary]]
quote='''
Not from pharisaical pride, or the superciliousness of the Scribes, but that He might not seem to contravene His own decision, Go not into the way of the Gentiles. For He was unwilling to give occasion to their cavils, and reserved the complete salvation of the Gentiles for the season of His passion and resurrection.

The disciples, as yet ignorant of the mysteries of God or moved by compassion, beg for this Chananæan woman; or perhaps seeking to be rid of her importunity.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Who did not answer her a word. Not from Pharisaic pride nor from the haughtiness of the scribes, but so that he might not seem to contradict his own pronouncement, in which he had commanded: Do not go into the way of the Gentiles, and do not enter the cities of the Samaritans. For he did not wish to give an occasion to the slanderers, and he was reserving the full salvation of the Gentiles for the time of his passion and resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
And his disciples came and asked him, saying: Send her away, for she is crying out after us. The disciples, not yet knowing at that time the mysteries of the Lord, were asking on behalf of the Canaanite woman (whom the other evangelist calls a Syrophoenician), either moved by mercy or wishing to be rid of her importunity, because she kept crying out to him, not as to a merciful physician but as to a harsh one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
