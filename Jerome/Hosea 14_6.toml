[[commentary]]
quote='''
The branches of these trees stretch this way and that, so that the birds of heaven may come and dwell in them. And lest perhaps we should think, because he had said: his root will break forth, or: he will send out his roots like Lebanon, that he was speaking of cedars and unfruitful trees, he compares the holy man, converted to the Lord, to the fruit-bearing olive, the man who says in another place: But I am like a fruitful olive in the house of God. Its fruit the five wise virgins prepared for themselves; by it the swelling of wounds is soothed, the limbs of the sick find rest, light is kindled in darkness, those who contend in the contest are anointed. This olive will have a fragrance like that of Lebanon, or of frankincense, which is a kind of incense: ὁμωνύμως (by the same name) among the Greeks and the Hebrews both the mountain and frankincense are so called; or at least like that of Mount Lebanon, which, most fertile and green, is covered with the densest foliage of trees, so that the olive can say: We are the good fragrance of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
