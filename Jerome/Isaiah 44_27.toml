[[commentary]]
quote='''
He, then, who says to Jerusalem and to Judea and its deserts that it will be inhabited and built and raised up, says to the deep or abyss, that is, to Babylon, Be desolate, and I will dry up your rivers, all the power of its kings. Or, because he had spoken of the deep and the abyss, rightly by metaphor he set down rivers too, of which the Psalmist also sings: By the rivers of Babylon, there we sat and wept (Ps 136 [137]:1).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
