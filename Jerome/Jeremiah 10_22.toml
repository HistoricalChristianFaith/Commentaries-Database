[[commentary]]
quote='''
A voice of hearing, behold, comes, and a great commotion from the land of the north, to make the cities of Judah a desolation and a dwelling of dragons — or a lair of ostriches and, as Symmachus translated, of sirens —; for this in the Hebrew 'thannim' is set down. The words of the prophet: 'Behold,' he says, 'the sound and roaring of the Babylonian as he comes is heard, and a great commotion, or earthquake, from the land of the north, to reduce all the cities of Judea to desolation, their inhabitants slain, and to make dragons and all venomous creatures dwell in place of men, or ostriches'; this animal too is at home in desolation, and is born and nourished in deserts; or else we can understand sirens, certain monsters and phantoms of demons. All these things, which both the past and the present discourse have described, let us refer to the times of the Church's persecution, when the tabernacles of the Lord are overthrown and every dwelling of the Church is reduced to desolation. And that all these things come to pass is the fault of the shepherds, who have acted foolishly and have not sought the Lord nor understood him; and therefore the whole flock has been scattered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
