[[commentary]]
quote='''
Will the snow of Lebanon fail from the rock of the field? Or can the cold waters that burst forth and flow down be torn away? LXX: Will breasts fail from the rock, or snow from Lebanon? Or will water violently carried off by the wind turn aside? Something of the same kind that line of Vergil also sounds: Sooner, therefore, shall the nimble stags graze in the air, and the seas leave the fishes bare upon the shore, than his face shall slip from our heart; and in another place: While rivers run into the seas, while shadows move over the slopes of the mountains, while the sky feeds the stars, ever shall your honor, your name and your praises abide. 'Just as,' he says, 'the snow cannot fail from the summits of Lebanon, nor is it overcome by any heat of the sun so as to melt entirely, and the streams flowing down from the mountains are by no means dried up at their springs, so my name, which is in itself stable and everlasting, cannot be changed; and yet, while all other things keep the order of nature, my people has forgotten me.' For there follows:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
