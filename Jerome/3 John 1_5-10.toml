[[commentary]]
quote='''
But I fear that, just as the queen of the South, who came from the ends of the earth to hear the wisdom of Solomon (Matt. 12), will judge the men of her time, and the men of Nineveh, who did penance at the preaching of Jonah, will condemn those who scorned to hear the Savior, greater than Jonah, so very many among the peoples may judge the bishops, withdrawing themselves from the ecclesiastical rank and practicing what does not befit a bishop. Of these I think John too writes to Gaius: "Dearest, you act faithfully in whatever you do for the brethren, and that for strangers, who have borne witness to your love before the Church: you will do very well if you send them on their way worthily of God: for they went out for the name of the Lord, accepting nothing from the Gentiles" (3 John 5 ff.). And truly, the Holy Spirit speaking in him, he even then rebuked what was to come in the churches, saying: "I wrote also to the Church: but Diotrephes, who loves to hold the first place among them, does not receive us. Therefore, when I come, I will call to mind his works which he does, slandering us with evil words; and it is not enough for him that he does not himself receive the brethren, but he also forbids those who wish to, and casts them out of the Church." Truly one can now see what was foretold: in very many cities, bishops, or presbyters, if they see laymen hospitable, lovers of good things, envy them, rage, excommunicate them, expel them from the Church, as though it were not lawful to do what the bishop does not do, and as though for laymen to be such were a condemnation of the priests. So they find them burdensome, and as though set upon their own necks, and harass them with various persecutions in order to draw them away from good work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
