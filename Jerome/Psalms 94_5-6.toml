[[commentary]]
quote='''
"Your people, O Lord, they have humbled, and your inheritance they have harassed." Who? The proud. "The widow and the stranger they have slain." The plain sense is clear: but if we should wish to interpret according to the anagogy, every day the proud devil with his satellites oppresses and harasses the humble in the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_071.html'
source_title="Homily 71, on Psalm 93 (Alternate Series)"
