[[commentary]]
quote='''
Indeed, that you may know that God takes away the spirit, the good spirit of God departed from Saul, and the malignant spirit choked him. It follows: "And the evil spirit of God choked him," that is, from God. Does God, then, have an evil spirit? By no means: but God had departed for this reason, that afterward the evil spirit might choke him. Therefore the spirit is called God's evil spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_009.html'
source_title="Homily 9, on Psalm 75"
