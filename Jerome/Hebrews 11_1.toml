[[commentary]]
quote='''
Nor is it any wonder if hope is not mentioned in this catalogue, since what is hoped for is in faith, and the Apostle, writing to the Hebrews, defines it thus: "Now faith is the substance of things to be hoped for, the proof of things not yet appearing" (Heb. 11:1). For that which we hope will come, and which is not yet in the present, we possess by faith, hoping that we hold what we believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
