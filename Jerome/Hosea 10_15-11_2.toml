[[commentary]]
quote='''
And we understand that the heretics pass away like the first light of dawn, and their king, the devil, or the heresiarch; whom in their infancy, — when they believed in the Church, and were little ones, and were reckoned under the name of Christ —, God loved; and he called them out of the tribulation and darkness of Egypt. And he called them through the apostles and the teachers of the Church. And when they had been called, he says, by my leaders, they withdrew from their face and worshipped Baal-peor, that is, they served their own vices and lust, and afterwards they sacrificed to the Baalim and to images which they had fashioned for themselves. For each of the heretics has his own gods, and whatever they have feigned they set up as a carved and a molten image.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
