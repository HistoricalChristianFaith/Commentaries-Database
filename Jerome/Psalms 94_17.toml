[[commentary]]
quote='''
"Unless the Lord had helped me, my soul had almost dwelt in hell." For this reason, O Lord, I rise again, because you were among the dead and rose again. My soul would have been held fast among the dead, if your soul had not risen again from the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_022.html'
source_title="Homily 22, on Psalm 93"

[[commentary]]
quote='''
"Unless the Lord had helped me." Unless Christ had risen from hell, my soul would have descended to the netherworld.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_071.html'
source_title="Homily 71, on Psalm 93 (Alternate Series)"
