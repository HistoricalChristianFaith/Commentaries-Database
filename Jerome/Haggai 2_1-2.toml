[[commentary]]
quote='''
So the word of God comes to those who had begun to work in the house of the Lord Almighty, now in rest, that is, in the seventh month and in the most complete mystery of the Trinity, on the twenty-first of the month, and to Haggai, who was celebrating the feasts of God and had again prepared his hand for the word of the Lord, and he says to him: Speak to Zerubbabel of the tribe of Judah, and to Joshua the great priest, who for our sake deigned to become both man and priest, and to the remnant of the people; for in comparison with the whole world, the part of those who believed was small in the beginning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Haggai.html'
source_title="Commentary on Haggai"
