[[commentary]]
quote='''
At that time, says the Lord, they shall cast out the bones of the king of Judah and the bones of his princes and the bones of the priests and the bones of the prophets and the bones of those who dwelt in Jerusalem, from their graves. And they shall spread them out to the sun and the moon and all the host of heaven, which they have loved and which they have served and after which they have walked and which they have sought and worshiped. They shall not be gathered and shall not be buried; they shall be for a dunghill upon the face of the earth. And all who remain of this most wicked family shall choose death rather than life, in all the places that are left, to which I have cast them out, says the Lord of hosts. All the things that the prophetic word describes we see to have happened in our own time, not to Jerusalem alone, which suffered these things from the Chaldeans and the Romans, but to the whole world, so that tears have dried up and everything has been filled with the bones of the dead. And because, according to ancient custom, they used to lay up gold and certain ornaments, whether of women or of men, in tombs, avarice broke these open too and dug them up, so as to expose them to the sky and the light. And therefore first the bones of the kings of Judah and of its princes, of the priests also and of the prophets and of all the people who had been in Jerusalem, were brought out of their tombs, lying open to the sun and the moon and to the sight of all the stars, so that they lay open to the gaze of those whom they had served after forsaking God, and, consumed, were dissolved into a dunghill and ashes; and if anyone of the multitude had been able to escape, to whatever places he came, he would prefer death to life and think destruction the remedy of an unhappy soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
