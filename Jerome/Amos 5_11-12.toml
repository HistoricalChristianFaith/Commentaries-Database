[[commentary]]
quote='''
Therefore, because you plundered the poor man and took choice spoil from him, you shall build houses of squared stone and shall not dwell in them; you shall plant most lovely vineyards and shall not drink their wine. For I have known your many crimes and your strong sins, enemies of the just, taking a gift and pressing down the poor in the gate; therefore the prudent man shall keep silent at that time, for it is an evil time. LXX: Therefore, because you struck the poor with the fist, and received choice gifts from them, you have built houses of hewn stones, and you shall not dwell in them; you have planted desirable vineyards, and you shall not drink their wine; for I have known your many impieties and your strong sins; trampling the just, receiving exchanges, and turning aside the poor in the gates; therefore he who understands shall be silent at that time, for it is an evil time. Lest Israel should perhaps think that it was being handed over to the enemy for punishment on account of idolatry alone, he joins to it also the other things which it committed once the religion of the truth had been lost. You plundered the poor man, he says, so as to take from him who scarcely had what was necessary for his sustenance, and whatever you saw that was precious and beautiful you handed over to your own uses. Hence also from the price of the things which you seized and took from the poor man you built houses of squared stone, so that, while despoiling men, you might clothe walls with marble; and because you built them out of plunder, and prepared them not only for dwelling and shelter, which human frailty requires, but for beauty and delights, you shall not dwell in them, carried off by sudden captivity or by death. You also planted most lovely vineyards, providing for future drinking, and you shall not drink wine from them, because I have known all your crimes and sins, and strong sins, which have provoked my wrath. You are the enemies of righteousness, or of every just man, and you receive gifts and press down the poor in judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
