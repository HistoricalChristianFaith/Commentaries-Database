[[commentary]]
quote='''
We read in the Apostle: In other tongues and with other lips I will speak to this people, and not even so will they hear me, says the Lord (1 Cor 14:21). This seems to me taken from the present chapter according to the Hebrew; and we have observed this in the Old Testament (apart from a few testimonies which Luke alone uses, who had a greater knowledge of the Greek language): wherever anything is cited from the old instrument, they set it down not according to the Septuagint but according to the Hebrew, following no one's translation, but rendering the Hebrew sense in their own language.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
