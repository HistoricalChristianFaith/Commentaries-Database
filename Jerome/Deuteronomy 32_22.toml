[[commentary]]
quote='''
Of this perpetual fire we read in the song of Moses too: A fire is kindled from my fury, and it shall burn down to hell below. It shall devour the earth and its produce: it shall burn the foundations of the mountains, and my arrows shall consume them (Deut 32:22). The sense of this testimony is that the fire and vengeance of God always burns for sinners, and pursues them even to the lower world. Such was that rich man too in the Gospel (Luke 16), clothed in purple, who, while Lazarus rested in Abraham's bosom, was tormented with eternal burnings. The same flame will also burn the earth, that is, our flesh, and its produce, that is, the desires of the flesh, and the foundations of the mountains that raise themselves against the knowledge of God. The darts of God will also destroy the mountains themselves, so that, humbled in punishments, they cease to be mountains.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
