[[commentary]]
quote='''
He gazed and looked around here and there, and not even a bird could be found; for even the mute elements feel the wrath of God, and the irrational animals dread it. That this is true the whole world now shows, in that, a multitude of men having been slain, the birds too, which are wont to follow the inhabitants, have gone away and perished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
