[[commentary]]
quote='''
For the living know that they will die, and the dead know nothing, and there is no more reward for them. For their memory comes into oblivion. But also their love, and their hatred, and their zeal have already perished; and they have no portion any longer in the world, in all that is done under the sun. Because he had said above that the heart of the sons of men is filled with malice and insolence, and that after this everything is ended by death, now he fills out and repeats the same point: that as long as men live they can become just, but that after death no occasion for good work is given. For a living sinner can be better than a dead just man, if he is willing to pass over to his virtues. Or at any rate, than one who boasted himself in malice, power and insolence and has died, any poor man, however vile, can be better. Why? Because the living, through fear of death, can perform good works; but the dead can add nothing to what they once took with them from life; and all things are wrapped in oblivion, according to what is written in the psalm: I have been given over to oblivion, like one dead from the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
