[[commentary]]
quote='''
They who thus desired, and who thus ran, merited to have their rising Lord come to meet them; whence it follows, And, behold, Jesus met them, saying, All hail.

The women ought first to hear this Hail, that the curse of the woman Eve may be removed in these women.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And behold, Jesus met them, saying: Hail. Those who were seeking in this way, who were running so, deserved to have the risen Lord come to meet them and to be the first to hear: Hail, so that the curse of the woman Eve might be undone in women.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
But they came up and took hold of his feet and worshiped him. These women come up and hold his feet because they worshiped him. But that woman who was seeking the living among the dead and did not yet know that the Son of God had risen rightly hears: Do not touch me, for I have not yet ascended to my Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
