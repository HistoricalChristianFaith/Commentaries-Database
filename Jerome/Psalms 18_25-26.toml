[[commentary]]
quote='''
For example, if someone wishes to ask why God speaks thus to Moses: Who made the dumb and the deaf, the seeing and the blind, was it not I, the Lord God? and says: Why were the blind and the deaf and the dumb created so? and other things like these; in this place we must take up the testimony of the seventeenth (18th) psalm, in which it is said to the Lord: With the holy you will be holy, and with the perverse you will be perverted. And it must be said that the Lord is holy with him who is holy, and is perverted toward him who has first become perverse by his own will. According also to that which is written in Leviticus: If they walk perverse toward me, I too will walk perverse toward them in my fury.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
