
[[commentary]]
quote='''
And there shall be peace between those two, that is, between him who is of the royal tribe and him who descends from the Levitical stock, so that priesthood and kingdom alike may rule the people of God; and the crowns themselves which you have made of gold and silver, after they have been set on the head of Joshua son of Jehozadak and on the head of Zerubbabel son of Shealtiel, you shall consecrate in the temple with the names of those by whom they were offered, that is, of Helem, and Tobijah, and Jedaiah, and Hen. The second and third names are the same as above. The first has been changed; for in place of Heldai he has now put Helem; a fourth, which he had not mentioned above, has been added, that is, Hen; of these we shall speak in what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
