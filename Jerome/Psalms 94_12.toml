[[commentary]]
quote='''
"Blessed is the man whom you shall instruct, O Lord, and shall teach him out of your law." You see, then, that the law is to be learned, so that the things which are obscure may be more diligently understood. For the apostle says that "the law is spiritual." And David: "Reveal my eyes, and I will consider the wondrous things of your law." This, then, is what he says. "Blessed is the man whom you shall instruct, O Lord, and shall teach him out of your law."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_071.html'
source_title="Homily 71, on Psalm 93 (Alternate Series)"
