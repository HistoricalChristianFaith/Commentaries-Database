[[commentary]]
quote='''
O sword, be roused against my shepherd and against the man who cleaves to me, says the Lord of hosts. Strike the shepherd and the sheep shall be scattered, and I will turn my hand to the little ones. And there shall be in all the land, says the Lord: two parts in it shall be destroyed and shall fail, and the third part shall be left in it. And I will lead the third part through fire, and I will burn them as silver is burned, and I will test them as gold is tested. He shall call on my name and I will hear him; I will say: You are my people; and he shall say: The Lord is my God. LXX: O sword, arise against my shepherd and against the man his fellow citizen, says the Lord Almighty. Strike the shepherd, and the sheep shall be scattered, and I will bring my hand upon the shepherds. And it shall be on that day, says the Lord, two parts shall perish and shall fail, and the third part shall be left in it; and I will lead the third part across through fire, and I will burn them as silver is burned and I will test them as gold is tested. He shall invoke my name, and I will hear him and will say: This is my people; and he shall say: You are the Lord my God. For sword (framea), which the LXX translated ῥομφαίαν, we find in the Hebrew areb, and in Aquila and Symmachus μάχαιραν, that is, sword or point. And for what we have rendered, Against the man who cleaves to me, that is, προσκεκολλημένον μοι, Aquila translated: Against the man of my tribe, that is, σύμφυλόν μοι. Symmachus: Against the man of my people, which in Hebrew is said amithi. The LXX: Against the man his fellow citizen. Theodotion: Against the man his neighbor; they read vav at the end of the word instead of yod, letters which differ from each other only in size; and if yod is read it means 'my', if vav, 'his'. But I am amazed that some wish to thin out with allegorical interpretations this prophecy — which the evangelist Matthew referred to the Lord and Savior after the disciples fled at his passion, and says that it was then fulfilled —, and, while they want to seem to know more than the rest, do not hold to the rule of truth. For the evangelist Matthew relates: Then Jesus says to them: You will all take offense at me this night. For it is written: I will strike the shepherd and the sheep of the flock shall be scattered. And again: But all this was done that the scriptures of the prophets might be fulfilled. Then all the disciples, leaving him, fled. Nor should it be thought that the testimony was taken from another place because in the Gospel God says that the shepherd was struck by himself, while in the present place we read that the sword and the point are commanded: Strike the shepherd, and the sheep shall be scattered. This is the sword, and this is the broadsword and the sword (framea), of which the Lord also speaks to the Father in Psalm 21 (22): Deliver my soul from the sword and my only one from the hand of the dog. Of this broadsword it is also written in Amos the prophet: All the sinners of the earth shall die by the sword. This cannot stand at all according to the letter, for many sinners perish by shipwreck, others by poison; these are choked by water, those a fire consumes. But by this sword and this broadsword all sinners perish, and the Ethiopians of black color too, of whom Zephaniah testifies with his sacred mouth, saying: But you also, Ethiopians, shall be slain by my sword. After the good shepherd, who laid down his life for his sheep, who spoke to the Father: Him whom you struck they have persecuted, and they have added to the pain of my wounds, was struck by the Father's will, and the man who cleaves to God, who says: I am in the Father, and the Father in me, hung on the gibbet and said: Father, into your hands I commend my spirit, at once the sheep were scattered, the whole multitude of believers in Christ. And the Lord turned his hand, as is read in the LXX, to the shepherds, whom many wrongly interpret as the princes of the Jews. But as it is written in the Hebrew, to the little ones, to whom the Lord had said in the Gospel: Fear not, little flock, and in Isaiah: Behold I and the children, or the little ones whom the Lord has given me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
