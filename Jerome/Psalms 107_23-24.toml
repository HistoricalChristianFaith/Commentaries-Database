[[commentary]]
quote='''
But there are on the contrary good ships too, of which it is said in the same psalms: Those who go down to the sea in ships and do business in many waters, they have seen the works of the Lord and his wonders in the deep (Ps 106 [107]:23). For those who are not idle in the waves of this world, but work, and carry the Lord's merchandise, and hasten to come to the harbor of rest, they see the works of the Lord and his wonders in the deep, when they have come to deep knowledge and, searching all things, that is, even the deep things of God, have beheld his wonders.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
That the world is called the sea (to pass over many things), I am content with a single testimony of the Psalm: They who go down to the sea in ships, doing business in many waters, these have seen the works of the Lord, and his wonders in the deep (Ps 106 [107]:23). For those who do the work of God in this world, and say with the Prophet, I have come into the depth of the sea, see his wonders in the deep; and, delivered from temptations and straits, they say that they have heard a terrible and hard vision.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
[[commentary]]
quote='''
Of this sea we also read in the psalms: They who go down to the sea in ships, doing business in many waters, they have seen the works of the Lord, and his wonders in the deep. Into this sea of the world, in which the number of the saints is hemmed in and set in tribulation, the apostles went down, and first of all the Lord, that he might free us from the bitter waves. Into this sea is cast the dragnet of the gospel, which is woven of the testimonies of the Scriptures, so that it may draw out into the free air many fish overwhelmed by the whirlpools of this world, that they may be able to sing praises to God. These are they who have gone down to the sea, and in the ships of the churches do many works, and behold the wonders of God in the depth of the riches of his wisdom and knowledge, and in the Holy Spirit, who searches even the deep things of God; to whom the Lord says: Come after me, and I will make you fishers of men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
