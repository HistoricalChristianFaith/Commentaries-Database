[[commentary]]
quote='''
But concerning the Church and each one of the believers it can be understood thus: that in the time of persecution the Christians were a curse and an example to all the nations round about, because they had offended their Lord; and afterwards they are in blessing, when peace has been restored; and all this comes about because the Lord, who had at first been angry, afterwards has mercy on Jerusalem, the vision of peace, and on Judah, which confesses the faith of the Lord. Each of the believers, too, who are cast out of the Church for their vices and are handed over to Satan for the destruction of the flesh, that they may learn not to blaspheme, when they have done repentance, will return to their former state and will see the peace of the Lord, and will possess the glory of their confession.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
