[[commentary]]
quote='''
And they gave him wine mixed with gall to drink, and when he had tasted it he would not drink. God speaks to Jerusalem: I planted you a true vine; how have you turned into the bitterness of a foreign vine? A bitter vine makes bitter wine, which it gives the Lord Jesus to drink, so that what is written might be fulfilled: They gave gall for my food, and in my thirst they gave me vinegar to drink. But what is said: when he had tasted it he would not drink, indicates that he tasted indeed the bitterness of death for us, but on the third day he rose again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
But I planted you a choice vineyard, wholly a true seed; how have you been turned for me into what is crooked, a strange vineyard? LXX: But I planted you a fruitful vineyard, wholly true; how have you been turned into bitterness, a strange vine? For the 'choice' or 'fruitful' vineyard the Hebrew has 'sorec', which is set down in the song of Isaiah. Now it is a kind of the finest vine, with which slip the Lord says he planted Israel too, and he marvels how the true seed and choice vineyard has been turned into bitterness and has therefore become a strange vineyard. And let no one be secure, if both the planting of the Lord and the true seed and the vineyard sorec is so changed by its own vice that through bitterness it withdraws from the Lord and becomes a strange vine. And in this the clemency of the Creator must be considered, that he who said in the Gospel: I am the true vine, granted also to his disciples and to the people believing in him to be a choice or true vine, if it wills to remain in that in which it has been planted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
