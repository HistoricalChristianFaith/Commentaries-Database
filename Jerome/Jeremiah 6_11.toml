[[commentary]]
quote='''
Therefore I am full of the fury of the Lord; I have toiled in holding it in. LXX: And I have filled up my fury and held it in, and I did not consume it. According to the Hebrew it is said in the person of the prophet, that he foresees the wrath of God that is coming, and is full of the fury and anger of the Lord, and can hold it in no longer, nor dares to entreat the Lord for sinners. According to the Seventy, however, a new sense is set down: that the Lord himself speaks and says: I have completed my fury, by striking the sinful people, and yet that he restrained it and did not pour it all out, so that a remnant might be saved. This seems to me to be self-contradictory; for if he completed his fury, how did he hold it in so as not to complete it?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Pour out — or He poured out — upon the little child outside and upon the council of young men together; for man with wife will be taken, the old man with him who is full of days. And their houses will pass to others, their fields and wives alike. Either the prophet in the spirit commands the coming Chaldean to pour out the fury of the Lord upon the little children and to spare not even their innocent age, or else he relates what has been done upon the council of young men together, who had seized their arms to fight back. For man with wife will be taken: names most sweet to one another will alike feel captivity, the old man with him who is full of days. Therefore old age is not the last age, but that of those who are 'full of days', whom in our own speech we call 'depositos' [given up for dead] or 'decrepitos' [decrepit].
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
