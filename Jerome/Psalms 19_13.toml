[[commentary]]
quote='''
Scripture here signifies the prince of this world, the ruler of darkness, the one working in the sons of unbelief, whom the Apostle too mentions. If he rises up into our heart and the mind has received the wound of an evil thought, we ought not to give him place any longer, but fight against the very evil thought and be freed from the greatest sin, namely, that we not complete the thought in deed; because it is one thing to sin in thought, another to sin in deed. Of this great sin it is also written in the psalm: If they have not had dominion over me, then I shall be spotless and shall be cleansed from the greatest offense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
