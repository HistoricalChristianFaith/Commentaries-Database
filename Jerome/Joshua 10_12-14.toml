[[commentary]]
quote='''
Do you wish to know what one man does? Jesus the son of Nave, when the whole earth was inhabited, was alone. Surely there were infinite multitudes, and he alone was. Alone he commands the sun and the moon, and it stands still; a man bids, and heaven hears. Heaven hears him, because he himself was hearing the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_054.html'
source_title="Homily 54, on Psalm 143"
