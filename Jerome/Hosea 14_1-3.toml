[[commentary]]
quote='''
To every perverse dogma also the prophet speaks daily, and calls its followers to repentance, saying: Return to the Lord your God, you who have fallen, or have grown weak, having lost the health of the Lord; take words with you, the true confession of faith, and say: Take away the iniquity that dwells in our heart, and receive the good of faith. For with the heart one believes unto righteousness, but with the mouth confession is made unto salvation. The calves and victims, or the fruit of the lips, are to believe in the Father and the Son and the Holy Spirit, and in the passion and resurrection of the Lord; and whoever has offered this to him will by no means hope in the Assyrian king, of whom we have often spoken. Nor will he mount upon the horse which the Lord commands by no means to be multiplied, the horse with which Pharaoh was drowned together with his cavalry. For every heretic, through pride, mounts horses which he himself has bred in his error. And by no means will they any longer say to the works of their hands, which they themselves have fashioned with artful eloquence: our gods. The glutton's god is his belly, the covetous man worships mammon, the heretic, the dogma he has invented. Whoever deserts all these, that is, Assyria and the horse and the works of his hands, will return to the Lord, and will appease his father, by whom he had been cast off.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
