[[commentary]]
quote='''
Hence the prophet, who is a spiritual physician, heals all the wounds, and solemnly declares that the words of blasphemy fall back upon the Creator, and he says in the person of God: Your words have grown strong against me, or have been made heavy; for indeed, according to Zechariah, iniquity sits upon a talent of lead, and what is said against God is weighed down by the heavy mass of blasphemies. They, not understanding their most grievous words and their blasphemy, ask, what have we spoken against you?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
