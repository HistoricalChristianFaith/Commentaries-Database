[[commentary]]
quote='''
Thus the Savior asks the scribes and Pharisees, the vinedressers and farmers of the Jews, what he will do to the wicked vinedressers and farmers; and when they answered, He will destroy the wicked wickedly, and give the vineyard to other farmers (Matt 21:41), he went on: The kingdom of God will be taken from you and given to a nation producing its fruits (ibid., 43). The matter needs no interpretation. For how few of the princes of the churches are from the Jews, and not from foreigners and men of outside nations! Formerly serving idols, and strangers to the testament of God and aliens from his promises, having no hope and without God in the world, they now preside over the churches, and with the plough of faith they tame the hard and formerly untamed hearts of the Gentiles to bear fruit, so that they may multiply the seed of the Lord's doctrine with an abundance of good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
