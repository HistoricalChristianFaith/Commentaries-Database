[[commentary]]
quote='''
Then Aracaeus, who founded Arcae, a town situated opposite Tripolis at the roots of Lebanon. Not far from it there was another city named Sini, which afterwards, overthrown by the shifting fortune of wars, has kept for the place only its former name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
