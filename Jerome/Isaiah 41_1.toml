[[commentary]]
quote='''
Let the islands be silent before me, and let the nations change their strength; let them approach, and then let them speak; let us draw near together to judgment. Who raised up the Righteous One from the East, called him to follow him? He will give the nations before him, and he will hold kings. He will give them as dust to his sword, as stubble swept off by the wind to his bow. He will pursue them; he will pass on in peace; the path will not appear in his feet. Who has wrought and done these things, calling the generations from the beginning? I the Lord, I am the first and the last. The islands saw and were afraid; the ends of the earth were astounded; they drew near and came. Each will help his neighbor, and will say to his brother Be strong. The coppersmith strengthened the one who was forging at that time, striking with the hammer, saying, It is good for gluing; and he strengthened it with nails, so that it should not be moved. LXX: Be renewed toward me, you islands, for the princes will change their strength; let them draw near and speak together; then let them declare judgment. Who raised up righteousness from the East, called it to his feet, and it will go? He will give before the nations, and will cast kings into amazement, and will give their swords into the earth, and their bows like stubble cast away; and he will pursue them; the way of his feet will pass over in peace. Who has wrought and done these things? He will call it, he who calls it from the beginning of the generations. I God am first, and for the things that are to come I am. The nations saw and were afraid; the ends of the earth were astounded and drew near; they came together, each judging to help his neighbor and his brother; and he will say: The craftsman and coppersmith has prevailed, striking with the hammer, at the same time drawing out; at one time indeed he says, The soldering is good. They strengthened them; they will fix them with nails; and they will not be moved. The nations, that is, the islands, which are beaten by the false and bitter waves of this world, are bidden to listen and to close their mouths, and to know what was said to Israel: Hear, Israel, and be silent; and to change their strength, lest through their former weakness they be unable to hear the word of God, so that they may first approach the Lord, and not be content with their own salvation, but teach others what they have learned, and dispute with the Lord whether the God of all has kept what is just.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
