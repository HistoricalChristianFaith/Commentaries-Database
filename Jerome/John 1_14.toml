[[commentary]]
quote='''
Further, as to what John says, "We saw his glory, glory as of the only-begotten from the Father, full of grace and truth," and what is written in another place, "Arise, my glory, arise": let us understand that to be the Savior's glory which the apostles saw in the humility of his flesh, so that they gazed with keener eyes not on what appeared, but on what lay hidden in the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_061.html'
source_title="Homily 61, on Psalm 15 (Alternate Series)"
