[[commentary]]
quote='''
Further, as to what John says, "We saw his glory, glory as of the only-begotten from the Father, full of grace and truth," and what is written in another place, "Arise, my glory, arise": let us understand that to be the Savior's glory which the apostles saw in the humility of his flesh, so that they gazed with keener eyes not on what appeared, but on what lay hidden in the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_061.html'
source_title="Homily 61, on Psalm 15 (Alternate Series)"

[[commentary]]
quote='''
For in the case of the neighbor a likeness is set down, that you should love him just as yourself and desire him to be saved. But in the case of the wife the adverb of comparison, as (sicut), sounds, with a certain weight, not likeness but approval and confirmation. As we say of a man: he acted as a man (quasi vir); and of the Savior it is written: We saw his glory, glory as (quasi) of the only-begotten (John 1:14). Not that the Savior himself had glory by comparison with another only-begotten: for he himself is the Only-begotten. And if there were also another only-begotten, he could not be called only-begotten. Hence he had no need of the example of another only-begotten, but he possessed glory as the Only-begotten, that is, as it befitted him himself to have it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
