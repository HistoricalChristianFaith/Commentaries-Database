[[commentary]]
quote='''
Howsoever free then He was, yet seeing He had taken to Him lowliness of the flesh, He ought to fulfil all righteousness; whence it follows, But that they should not be offended, go to the sea.

I am at a loss what first to admire in this passage; whether the foreknowledge, or the mighty power of the Saviour. His foreknowledge, in that He knew that a fish had a stater in its mouth, and that that fish should be the first taken; His mighty power, if the stater were created in the fish's mouth at His word, and if by His command that which was to happen was ordered. Christ then, for His eminent love, endured the cross, and paid tribute; how wretched we who are called by the name of Christ, though we do nothing worthy of so great dignity, yet in respect of His majesty, pay no tribute, but are exempt from tax as the King's sons. But even in its literal import it edifies the hearer to learn, that so great was the Lord's poverty, that He had not whence to pay the tribute for Himself and His Apostle. Should any object that Judas bore money in a bag, we shall answer, Jesus held it a fraud to divert that which was the poor's to His own use, and left us an example therein.

Or; That fish which was first taken is the first Adam, who is set free by the second Adam; and that which is found in his mouth, that is, in his confession, is given for Peter and for the Lord.

And beautifully is this very stater given for the tribute; but it is divided; for Peter as for a sinner a ransom is to be paid, but the Lord had not sin. Yet herein is shown the likeness of their flesh, when the Lord and His servants are redeemed with the same price.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Go to the sea and cast a hook, and take the fish that comes up first, and when you have opened its mouth you will find a stater; take it and give it to them for me and for you. What I should wonder at first in this place I do not know, whether the foreknowledge or the greatness of the Savior: the foreknowledge, in that he knew the fish had a stater in its mouth and that it would be the first to be caught; the greatness and power, if at his word the stater was at once created in the fish's mouth, and he himself made what was to be by speaking it. But it seems to me, according to the mystical understandings, that this fish which was caught first is the one which was in the depth of the sea and dwelt in the salt and bitter whirlpools, so that through the second Adam the first Adam might be freed, and that which had been found in his mouth, that is, in confession, might be paid for Peter and the Lord. And beautifully the very same price is given, but it is divided, because for Peter, as for a sinner, a price was being paid, whereas our Lord had committed no sin, nor was deceit found in his mouth. That is called a stater which holds two didrachmas, so that the likeness of the flesh might be shown, when both lord and servant are freed by the same price. But understood simply too it edifies the hearer, since the Lord was of such poverty that he did not have the means to pay the tribute for himself and the apostle. But if anyone wishes to object: And how did Judas carry money in his purse? we shall answer: he thought it wrong to turn the property of the poor to his own uses, and he gave us the same example.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
