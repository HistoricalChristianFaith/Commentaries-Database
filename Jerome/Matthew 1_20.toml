[[commentary]]
quote='''
But we are not to think that she ceased to be betrothed, because she is here called wife, since we know that this is the Scripture manner to call the man and woman, when espoused, husband and wife; and this is confirmed by that text in Deuteronomy, If one find a virgin that is betrothed to a man in the field, and offer violence to her, and lie with her, he shall die, because he hath humbled his neighbour's wife. (Deut. 22:23.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Joseph, son of David, do not fear to take Mary your wife. We have already said above too that betrothed women are called wives, which the book Against Helvidius teaches more fully. And the angel speaks to him in a dream with the affection of one who soothes, to approve the justice of his silence. At the same time it is to be noted that Joseph is said to be the son of David, so that Mary also might be shown to be of the stock of David.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
