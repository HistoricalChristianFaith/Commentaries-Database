[[commentary]]
quote='''
He is then set before all those that are born in wedlock, and not before Him who was born of the Virgin and the Holy Spirit; yet these words, there has not arisen a greater than John the Baptist, do not imply that John is to be set above the Prophets and Patriarchs and all others, but only makes him equal to the rest; for it does not follow that because others are not greater than him, that therefore he is greater than others.

We understand it simply, that every saint who is already with the Lord is greater than he who yet stands in the battle; for it is one thing to have gained the crown of victory, another to be yet fighting in the field.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Amen I say to you: There has not arisen among those born of women one greater than John the Baptist. Among those born, he says, of women. He is therefore preferred to those men who were born of women and of union with a man, and not to him who was born of a virgin and the Holy Spirit. And yet in saying: There has not arisen among those born of women one greater than John the Baptist, he did not prefer John to the other prophets and patriarchs and to all men, but made the others equal to John. For it does not straightway follow that, if others are not greater than he, he is greater than the others, but rather that he has equality with the other saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
But he who is less in the kingdom of heaven is greater than he. Many want this to be understood of the Savior: that he who is less in time is greater in dignity. But let us understand simply that every saint who is already with God is greater than he who still stands in the battle. For it is one thing to possess the crown of victory, another still to fight in the battle line. Some want to take the lowest angel ministering to the Lord in heaven as better than any foremost man who lives on earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
I have chosen to be an outcast in the house of my God, rather than to dwell in the tabernacles of sinners. This is what the Savior also says about John: "Amen I say to you, that among those born of women there is not a greater than John the Baptist." Then he says that he himself is an angel. And then he says: "But he who is lesser in the kingdom of heaven is greater than he." The sense there is this: John is greater than all men, and, if you wish to know, he himself is an angel; but this one who on earth is an angel, is the least in the kingdom of heaven, that is, he is lesser than the angels; but he who is lesser in the kingdom of heaven, that is, the angel, is greater than this one who on earth is greater than all. This, therefore, is now what the prophet says: I have chosen to be an outcast in the house of my God, that is, I have wished to be the least in the kingdom of heaven, rather than the first in this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_016.html'
source_title="Homily 16, on Psalm 83"
