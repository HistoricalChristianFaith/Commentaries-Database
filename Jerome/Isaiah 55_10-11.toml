[[commentary]]
quote='''
And as the rain and the snow come down from heaven, and will not return thither again; but they soak the earth, and water it, and make it spring up, and give seed to the sower, and bread to the eater: so shall my word be which goes forth from my mouth; it shall not return to me empty, but it shall do whatever I willed, and shall prosper in the things for which I sent it. LXX: As if the rain or the snow should come down from heaven, and not return until it soaks the earth, and it bring forth and spring up, and give seed to the sower and bread for eating: so shall my word be which has gone forth from my mouth: it shall not return until it accomplishes what I willed, and I will make its ways and my precepts prosperous. What is said hangs on what went before, and briefly the sense is this: let the people of the nations not be incredulous that after such great crimes the ungodly man is suddenly saved. For my thoughts are not as the thoughts of men, and as far as heaven is distant from the earth, so far are my thoughts separated from the thoughts of men. For I am most clement and abundant in forgiving. Do you wish to receive another likeness also? As the rain and the snow come down from heaven, and will not return thither again, but soak the earth, and water it, and make various seeds sprout, so that from full harvests bread is produced for the use of men: so the word of my promise, which I have once pledged and which has gone forth from my mouth, will not be void, but all will be fulfilled in deed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
