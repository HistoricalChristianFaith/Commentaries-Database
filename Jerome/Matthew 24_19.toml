[[commentary]]
quote='''
But woe to those who are pregnant and nursing in those days. Woe to those souls which have not brought their offspring to the perfect man, but have only the beginnings of faith, so that they need the nurture of teachers. This too can be said: that in the persecution of antichrist, or of the Roman captivity, those who were pregnant and nursing, weighed down by the burden of womb and of children, could not have an unencumbered flight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
For they have crushed, or cut asunder, with iron carts the women with child of Gilead. These are the women with child of whom the Lord speaks in the Gospel: Woe to those who are with child, and to those who give suck in those days. The women with child are the souls of believers, who at the beginning of faith can say: From fear of you, Lord, we have conceived and been in labour; and if they have not been cut up and pierced with iron by the carts and the iron and toothed wheels, of which the psalmist says: The sons of men, their teeth are weapons and arrows, they can also say what follows: And we have brought forth; we have made the spirit of your salvation upon the earth. And consider at the same time that they cannot cut up men of mature age, but only those who are still in the womb, or who cannot take solid food and are still nourished with the milk of infancy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
