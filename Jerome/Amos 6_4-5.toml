[[commentary]]
quote='''
Though you are about to suffer this, you now sleep on beds of ivory and wanton on soft couches, so as to couple lust with sleep. You eat not to drive away hunger and to sustain the human body, but for delights and luxury, so that whatever is tender and fat in the flocks and in the herds you make ready for your gullet; for you the lust of the genitals and of the throat, and a paunch seething with food, are not enough unless you soothe your ears with the songs of pipes and psaltery and lyre, so that what David did for the worship of God, devising the orders of the Levites and the varieties of instruments, you turn to pleasure and luxury.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
