[[commentary]]
quote='''
Hear this word, you fat cows, who are on the mountain of Samaria; who do calumny to the needy, and crush the poor, who say to your masters: Bring, and we will drink. The Lord God has sworn by his holy one that behold, days shall come upon you, and they shall lift you up on poles, and your remnants in boiling pots; and you shall go out through the openings, one against another, and you shall be cast into Armon, says the Lord. LXX: Hear this word, you cows of Basanitis, who are on the mountain of Samaria, who oppress the poor and trample the needy, who say to your masters: Give us, that we may drink. The Lord swears by his holy ones that behold, days shall come upon you, and they shall take you up in arms; and those who are with you, in pots, pestilent traders; and you shall be cast out naked, one facing another, and you shall be cast upon mount Remmam, says the Lord. In place of fat cows, the Seventy put of Basanitis; Aquila and Theodotion the Hebrew word itself, Basan; we, following the interpretation of Symmachus, who says αἱ Βόες εὔτροφοι, that is, fattened kine, have interpreted fat cows. Now he speaks to the princes of Israel and to all the nobles of the ten tribes, who gave themselves up to luxuries and plunder, that they should hear the word of God, and know that they are not ploughing oxen but fat cows from the herd, or such as are fed in the pastures of Bashan, which are places most fertile in grass; and by this he signifies that they were made ready not for agriculture but for sacrifice and for eating. You are fat cows on the mountain of Samaria, and you crush all the lowly, and you say to your masters, that is, to the shepherds, by whom we understand the kings: Give us and we will drink, that is, only give the command, and we will lay everything waste. But from the fact that he put: Give us and we will drink, and did not say: Give and we will eat, he signifies their drunkenness in wine and luxury, which overturn the state of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
Now the word of the Lord which the cows of Bashan are commanded to hear is, according to the tropology we have begun, addressed to the heretics, who, serving the belly and gluttony, are rightly called very fat cows, or cows of ignominy; for this is what Bashan means, that is, αἰσχύνη; and if we wished to call it confusion, we should be interpreting Babylon rather than Bashan. These fat cows, or cows of ignominy and dry, for Bashan is understood in this sense too, are on the mountain of Samaria, to which it is also said in Hosea: Take away your calf, Samaria. And again in the same prophet: For your calf was a deceiver, Samaria; and they are on the mountain of Samaria for this reason, that they are always lifted up into pride and promise themselves lofty things. Samaria also means watch, not because they keep watch over the words of the Lord, but because they boast that they are the watchmen of his precepts. Who do calumny to the needy and crush the poor. By the needy and the poor understand the churchman, who, content with the simplicity of the truth, does not seek the furniture of the heretics, and the brilliance of eloquence, and the riches of arguments. These cows say to their masters: Bring and we will drink. Their masters we can call either the princes of perverse dogmas, such as Valentinus, and Marcion, and Arius, and Eunomius, or those who through many books strengthen what others have wickedly invented. To these the cows of Basanitis say: Bring us and we will drink. For unless those give, these have nothing to devour, or rather nothing to drink so as to be drunk. But that we may know that waters and cups signify teaching, the Lord speaks to the Samaritan woman: Everyone who drinks of this water will thirst again; but whoever drinks of the water that I shall give him will not thirst for ever. Therefore whoever drinks of the waters of the Samaritan woman, that is, of the heretics, will always thirst and will not be able to cool the burning of a parched throat, as Isaiah cries aloud about this very thing: As one who is thirsty dreams that he drinks, and when he has risen he still thirsts, and his soul has hoped in vain; so shall all the nations be that fight against Jerusalem. For truly whoever drinks of the waters of the heretics, and fights against Jerusalem, the Church of God, drinks in his sleep, and his soul is mocked by empty images. And when he thinks himself satisfied, then he will have the beginning of thirst. Hence also it is said to the churchman: Drink waters from your own vessels, and your waters from the springs of the wells, and let them be for you alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
