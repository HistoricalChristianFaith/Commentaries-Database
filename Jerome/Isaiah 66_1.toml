[[commentary]]
quote='''
The Lord is in his holy temple, the Lord's seat is in heaven. Before the bodily temple was built by Solomon, the prophet knows the spiritual temple of the Lord and his throne in heaven. Whereupon it is asked, how it is said elsewhere, "Heaven is my throne." When the throne of the Lord is in heaven, his throne is encompassed by heaven, and the throne of the Lord is in a part of heaven; when heaven is the throne of the Lord, the whole heaven is turned into the throne of the Lord. From which, according to the ἀναγωγήν (higher spiritual sense, anagōgē), the Lord dwelling in his holy temple — that is, in the soul of the believer — dwells either in a part of it or in the whole. When we are still imperfect, and there is in us both something good and something evil, God dwells only in a part of our soul, that is, in heaven. But when we are consummate and perfect, we are wholly turned into a dwelling-place of God, and we are made heaven, his throne.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_060.html'
source_title="Homily 60, on Psalm 10 (Alternate Series)"
