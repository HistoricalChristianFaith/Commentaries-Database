[[commentary]]
quote='''
These princes or shepherds will say to their flocks: 'Sanctify against Jerusalem war, for it is the command of the Lord. Arise, and let us go up at noon: let us fight not by night and by ambush, but in full daylight; for no one can resist us'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Woe to us, for the day has declined, for longer have grown — or have failed — the shadows of evening. Arise, and let us go up by night, and let us destroy the houses — or foundations — of her! Those say: 'Arise, and let us go up at noon, and let us fight in clear daylight'; these reply: woe to us, for the shadows of evening have grown longer, according to that saying of Vergil: and now far off the rooftops of the farmhouses smoke, and greater shadows fall from the high mountains. And the sense is: 'If we suffer these things by day, what shall we suffer by night?'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
