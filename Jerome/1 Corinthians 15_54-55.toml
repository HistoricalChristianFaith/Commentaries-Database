[[commentary]]
quote='''
For 'swallowing up' is said for victory, as the Apostle says: 'Death is swallowed up in victory. Where, O death, is your victory? where, O hell, is your sting?' Now he calls that very swallowing up a victory, the victory which it had in swallowing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_051.html'
source_title="Homily 51, on Psalm 140"
