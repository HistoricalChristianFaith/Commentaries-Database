[[commentary]]
quote='''
Let us set out an example, so that what we are saying may become plainer. The Assyrian once came upon the land of Paul and went up upon his country, when he was in labors beyond measure, in blows more abundantly, in prisons exceedingly, in deaths often, when he received from the Jews five times forty lashes less one, was beaten with rods three times, was stoned once, suffered shipwreck three times, was a night and a day in the depth of the sea, in perils from robbers, in perils among false brothers, in perils from my own race, in perils from the Gentiles; but in all these he conquered because of him who had loved him. And therefore he was filled with peace, because he had been filled with insults.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
