[[commentary]]
quote='''
Hence the people and the priest alike will bear the sentence of an indignant God; because he will visit not only their works, which are called ways, in which they walk, but also the thoughts with which they deliberated in order to do such things. For not only the work, but also the thought of an evil work will pay the penalty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
