[[commentary]]
quote='''
And at the same time let us warn those who think theft and perjury small crimes, that the curse which is described in the scroll and the sickle is brought into the house of the thief and of the perjurer, and remains in it, and consumes all its timbers and stones. But if in these things which are thought lesser — theft, I mean, and perjury — there is so great a threat of punishments, what shall we say of fornication, adultery, homicide, sacrilege, and all the crimes which are numbered by the Apostle among the works of the flesh?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
