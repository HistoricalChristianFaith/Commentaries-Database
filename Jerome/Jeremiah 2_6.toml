[[commentary]]
quote='''
And they did not say: Where is the Lord, who made us go up from the land of Egypt, who led us across through the wilderness, through a land uninhabitable and pathless, through a land of thirst and the image of death, through a land in which no man walked nor did a human being dwell? For 'human being' the Seventy translated 'son of man', and for 'image of death' 'shadow of death' was added from Theodotion. Since this is plain according to the history, this must be considered according to anagōgēn [the higher, spiritual sense]: that as long as we are in this world and are being led out of Egypt, we go up little by little, and first we cross deserts and a land uninhabitable, which the holy man ought not to inhabit, and pathless, to show the difficulty of the journey; through a land of thirst, where we always desire greater things and are not content with things present, and the image or shadow of death — for we always stand in danger, and everywhere the devil sets his snares —, through a land in which no man walked, who is of the perfect age in Christ — for we shall all rise again to a perfect man, to the measure of the age of the fullness of Christ — ; nor does he who is a man of God, or a son of man, ever dwell in it, but he always hastens on to greater things. From this it is clear that perfection is not on the way, but at the end of the way and in the dwelling that is prepared for the saints in the heavenly places, and to whom it is said: you who stand in the house of the Lord, in the courts of the house of our God. In vain, therefore, does the new heresy sprung from the old suppose that perfect victory is here, where there is battle and contest and an uncertain outcome of things to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
