[[commentary]]
quote='''
For Herodias, fearing that Herod might some time recover his senses, and be reconciled to his brother, and dissolve their unlawful union by a divorce, instructs her daughter to ask at once at the banquet the head of John, a reward of blood worthy of the deed of the dancing.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Give me, she says, here on a dish the head of John the Baptist. Herodias, fearing that Herod might at some time come to his senses, or become a friend to his brother Philip, and that the unlawful marriage might be dissolved by divorce, advises her daughter to ask at once, at the very banquet, for the head of John: a fitting reward of blood for a fitting work of dancing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
