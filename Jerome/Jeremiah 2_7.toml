[[commentary]]
quote='''
And I brought you into the land of Carmel, that you might eat its fruit and its good things, and having entered you defiled my land and made my inheritance an abomination. 'For the toil of a very hard journey I gave you an abundance of all things'; for this is what 'Carmelus' signifies, which in Hebrew is called 'Chermel' and in our language sounds as 'knowledge of circumcision'. And as that people polluted and violated with idolatry the holy land, fertile in all things, so we, receiving the knowledge of the true circumcision, eat its fruit and, if negligence creeps in, defile the land of God and make his inheritance abominable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
