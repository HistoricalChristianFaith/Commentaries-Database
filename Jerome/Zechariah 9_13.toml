[[commentary]]
quote='''
For I have stretched Judah for myself, as a bow I have filled Ephraim; and I will raise up your sons, O Zion, over your sons, O Greece, and I will set you as the sword of the mighty. LXX: For I have bent you, O Judah, for myself, as a bow I have filled Ephraim; and I will raise up your sons, O Zion, over the sons of the Greeks, and I will handle you as the sword of a warrior. The Jews refer this to the times of the Maccabees, who conquered the Macedonians and, after a space of three and a half years, cleansed the temple that had been defiled by idolatry. And what follows: As a bow I have filled Ephraim, they think signifies those who had come, under Hezekiah, from the ten tribes that are called Israel, over whom Josiah too is recorded to have reigned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
According to tropology this place can be explained thus: Judah is stretched as a bow when the Lord and Savior is sent by the Father into this world, he who is himself both the bow and the archer and the arrow. The bow, as in the present place. The archer, as in Psalm 44 (45): Your arrows are sharp, most mighty; and when someone has been wounded by them, he says: I am wounded with love. And the arrow is he himself who speaks through Isaiah: He has set me as a chosen arrow, and in his quiver he has hidden me. The chosen arrow is the Word of God; the quiver in which the arrow is hidden is the dispensation of the flesh he assumed. With this Ephraim is filled, so that, when he has been armed and made ready for war, he too, together with the nations, may be wounded by the arrows of the Lord; Ephraim, from whose tribe Jeroboam first split the people, whom the prophet Hosea shows more fully to be taken in the person of heretics; and what we said above: The sons of Ephraim, bending and shooting the bow, turned back in the day of battle. For when the Lord raises up the sons of Zion, that is, the sons of the Church, both the masters of contrary doctrines and every assertion of the philosophers and the arguments of the Gentiles will be destroyed, because the Lord himself is the sword of the mighty, of whom it is said: Gird your sword upon your thigh, O most mighty. In your comeliness and your beauty, set forth, proceed prosperously and reign, because of truth and meekness and justice; and your right hand shall lead you wonderfully. With this sword the Ethiopians are wounded, of whom it is written: And you, O Ethiopians, shall be wounded by my sword; and after they have been wounded by the sword of Christ, they will lay aside their dark color and, exulting, will say: The splendor of the Lord our God shall be upon us; which David too promises himself after his repentance: You shall wash me, and I shall be made whiter than snow. This is the sword of which the Apostle writes: The word of God is living and effective, and more piercing than any two-edged sword, and reaching even to the division of soul and spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
