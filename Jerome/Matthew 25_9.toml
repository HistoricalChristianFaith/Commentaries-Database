[[commentary]]
quote='''
For these wise virgins do not answer thus out of covetousness, but out of fear. Wherefore, each man shall receive the recompense of his own works, and the virtues of one cannot atone for the vices of another in the day of judgment. The wise admonish them not to go to meet the bridegroom without oil, Go ye rather to them that sell, and buy for yourselves.

And this oil is sold, and at a high cost, nor is it to be got without much toil; so that we understand it not of alms only, but of all virtues and counsels of the teachers.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252025.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The prudent answered and said: Lest perhaps there not be enough for us and for you. They answer this not out of avarice but out of fear. For each will receive the wage for his own works, nor on the day of judgment can the virtues of some relieve the vices of others. And just as in the time of the Babylonian captivity Jeremiah could not help the sinners, and it is said to him: Do not pray for this people, so fearful will that day be, when each will be anxious for himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Go rather to those who sell and buy for yourselves. This oil is sold, and bought at a great price, and acquired by hard labor; we understand it of almsgiving and all the virtues and the counsels of teachers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
