[[commentary]]
quote='''
For the shepherds have acted foolishly and have not sought the Lord; therefore they have not understood, and all their flock has been scattered. Through the metaphor of shepherds and sheep the guilt of the princes and the scattering of the people are described. For because the princes acted foolishly and did not seek the Lord, whom they ought to have sought with their whole heart, therefore they did not see the evils that were coming, or did not understand the Lord, and the whole multitude of Jerusalem has been scattered hither and thither.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
