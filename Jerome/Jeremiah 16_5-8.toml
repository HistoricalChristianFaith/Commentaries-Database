[[commentary]]
quote='''
For thus says the Lord: Do not enter the house of feasting, nor go to lament, nor comfort them, for I have taken away my peace from this people, says the Lord, my mercy and compassions. And both great and small shall die in this land; they shall not be buried nor lamented, and they shall not cut themselves, nor shall baldness be made for them. And they shall not break bread among them for the mourner, to comfort him over the dead, and they shall not give them the drink of the cup to comfort them over their father and mother. And you shall not enter the house of feasting, to sit with them and eat and drink. The Apostle commands that with those who turn away from God not even food is to be taken; and further: do not even say hail to such! And the Savior forbids the apostles to greet anyone on the way; hence Elisha too forbids Gehazi to give greetings as he went to heal the boy. Now it is the custom to bring food to those who mourn and to prepare a feast, which the Greeks call perideipna, and which among our people are commonly named 'parentalia' [ancestral rites], because rites are performed for parents. Divine Scripture also says elsewhere: give wine to those who are in mourning, that is, so that they may forget their grief. The prophet is therefore commanded not to comfort anyone of the people, not to mix himself in the feasts of the enemies of God, not to perform rites over the funerals of the dead. For it is one thing to die by the common law of nature, another to be slain by the sentence of God. 'I have taken away', he says, 'my peace from this people, and they are unworthy of mercy, and I will spare no age, but both great and small shall perish alike, so that they shall lack even burial'. Nor shall they cut themselves, he says, nor shall baldness be made for them. This custom existed among the ancients and still persists today among some of the Jews, that in mourning they cut their arms and make baldness; which we read Job also did. Hence the prophet is told not to break bread among them nor to go in to comfort them over the dead, not to give drink, not to enter the house of feasting, and not to mix with those who have been made ready for God's sentence. But if this is said of those who mourn, what will become of the heretics, whose word spreads like a cancer, and who daily lay low in the Church the corpses of the deceived?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
