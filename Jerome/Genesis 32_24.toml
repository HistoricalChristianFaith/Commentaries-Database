[[commentary]]
quote='''
We think that Jacob's wrestling too was of this kind, namely that he did not contend against flesh and blood (Gen. 32), when he remained alone, and a man wrestled with him, helping him and strengthening him against another, who was fighting with excessive sweat. And at the same time see whether those may not perhaps be ridiculous who suppose that Jacob wrestled the whole night in the manner of wrestlers. For what great thing is it if, as they say, in wrestling he either won or was beaten? But according to a struggle reasonable and fitting for the patriarch, we must believe that his wrestling was such as those have who could say: We have no wrestling against flesh and blood. There is no need now to shake out the whole mystery of that passage, since it must be discussed more fully in its own place, if I live.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
