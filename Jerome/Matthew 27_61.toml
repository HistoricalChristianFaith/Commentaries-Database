[[commentary]]
quote='''
Or, when the rest left the Lord, the women continued in their attendance, looking for what Jesus had promised; and therefore they deserved to be the first to see the resurrection, because he that endureth to the end shall be saved. (Matt. 10:22.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Mary Magdalene was there, and the other Mary, sitting opposite the sepulcher. While the others left the Lord, the women persevere in their duty, waiting for what Jesus had promised; and therefore they deserved to be the first to see him rising, because he who perseveres to the end, he shall be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
