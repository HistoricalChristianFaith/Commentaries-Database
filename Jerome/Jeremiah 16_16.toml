[[commentary]]
quote='''
"He rains on the wicked snares." Without any doubt, it is the Lord who contrives snares for sinners, in order to entrap those who abuse their freedom and to compel them to tread the right path under his bridle, thereby making it possible for them to advance through him who says, "I am the way." Wherefore, in Jeremiah, the Lord sends fishers and hunters to spread nets for the lost fish tossed about in whirlpools and to hunt down and save the beasts that wander through mountains and hills. This and the following verses do not promise punishment to sinners, as many believe, but rather give them promise of healing.
'''
source_url=''
source_title="HOMILIES ON THE PSALMS 60 (PS 10)"
[[commentary]]
quote='''
But our writers more rightly and better think that the prophet prophesied these things about the future. For since he had said above: I will bring them back into their land, which I gave to their fathers, he now shows how they are to be brought back: that first he sends the apostles, to whom the Savior said: come after me, and I will make you fishers of men, and afterwards hunters, whom we can take to be either churchmen or angels, who, once the time of the consummation has come, are to hunt all the saints from the mountains of lofty doctrines and from the hills of good works and from the caves of the rocks, the apostles and apostolic men. For not only is Christ the rock, but he also granted to the apostle Peter that he should be called rock; those who rest in his thoughts are rightly said to have been transferred from the rock.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
