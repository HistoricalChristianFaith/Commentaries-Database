[[commentary]]
quote='''
And there was the glory of the God of Israel, not because he delighted in such proximity, but in order to destroy the idol of Zeal and its temple with his presence. Hence, the destruction of the city and temple followed shortly after. And in Isaiah it is written that a narrow bed cannot accommodate two, and a short cloak cannot cover both, with Scripture indicating what the Apostle said: What agreement is there between Christ and Belial? Temple of God and idol.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
