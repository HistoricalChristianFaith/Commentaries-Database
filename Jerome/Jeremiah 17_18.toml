[[commentary]]
quote='''
Let those who persecute me be confounded, and let me not be confounded! Let them tremble, and let me not tremble! Bring upon them the day of affliction, and crush them with a double crushing! The prophet calls down imprecations against those who taunt him with the word of the Lord and say, where is the word of the Lord? let it come: that those who persecute him may be confounded, and may blush and return to salvation; that they, who lie, may tremble, and not he, who foretells true things; and that, when the day of vengeance has come, he may crush them with a double crushing, famine and sword.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
