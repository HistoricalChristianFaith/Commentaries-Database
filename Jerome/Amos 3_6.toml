[[commentary]]
quote='''
The fifth punishment is that of those who have abandoned the peace which surpasses all understanding, and which the Lord, as he went to the Father, left to the apostles, saying: My peace I give to you, my peace I leave to you: that, though set in the city of the Lord, they are terrified by the sound of the trumpet. For whatever is said in the holy Scriptures is a threatening trumpet, piercing the ears of believers with a great voice. If we are righteous, we are summoned by the trumpet of Christ to blessedness; if sinners, we hear what torments we are going to suffer. But the evil which the Lord does in the city is not the contrary of virtue, but affliction and torment, of which we read: Sufficient to the day is its own evil, that is, tribulation and distress. And in the prophet we read: I am God, who made light and darkness, who make peace and create evils. For just as darkness is contrary to light and day, so war too is contrary to peace; it is not evil in itself, but seems to be evil to those who endure it. And that we may know that in the holy Scriptures evil is sometimes taken not as the contrary of virtue but as affliction, punishments and distress, let us take one more example, from Jonah: And God saw their works, that they had turned from their most wicked ways, and he repented over the evil which he had spoken of doing to them. The evil there is surely the overthrow of the Ninevites, which God had threatened through the prophet, and not the evil contrary to virtue, which belongs to sin, on account of which he was threatening torments to sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
