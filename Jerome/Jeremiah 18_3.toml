[[commentary]]
quote='''
'And when,' he says, 'I had set out and had gone down into the potter's house, he was doing a work upon the wheel', which the Seventy, led astray by the ambiguity of the word, translated 'stones'; for 'abanim', according to the nature of the context and the difference of pronunciation, is used both for an 'instrument', that is, the potter's 'wheel', and for 'stones'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
