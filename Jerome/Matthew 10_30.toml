[[commentary]]
quote='''
That He says, The hairs of your head are all numbered, shows the boundless providence of God towards man, and a care unspeakable that nothing of ours is hid from God.

Those who deny the resurrection of the flesh ridicule the sense of the Church on this place, as if we affirmed that every hair that has ever been cut off by the razor rises again, when the Saviour says, Every hair of your head—not is saved, but—is numbered. Where there is number, knowledge of that number is implied, but not preservation of the same hairs.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when he says: But even the hairs of your head are all numbered, he shows the immense providence of God toward men and signifies his ineffable affection, in that nothing of ours is hidden from God, and even small and idle words do not escape his knowledge. Those who deny the resurrection of the flesh mock the Church's understanding of this place, as though we said that even the hairs that have been numbered and cut off by the barber all rise again, when the Savior did not say: But even all your hairs are to be saved, but are numbered. Where there is number, knowledge of the number is shown, not the preservation of that same number.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
