[[commentary]]
quote='''
And she received mourning, and was struck with fear and weakened in her good, she who dwells in Maroth, that is, in bitternesses; or as Symmachus renders: The dwelling provoking to bitterness, that is, ἡ κατοικία ἡ παραπικραίνουσα, which in Hebrew is called iosebeth maroth, on account of the captivity of the neighboring tribes, because evil came down from the Lord to the gate of Jerusalem; for the Assyrian, after laying waste Samaria, came also to Jerusalem, at the time when Rabshakeh was sent, hurling insults, about whom both the fourth book of Kingdoms (2 Kings) and Isaiah write more fully. There it is said that the Assyrian king sent from Lachish to Jerusalem, and afterwards, Lachish having been taken, passed on to attack Libnah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Moreover, as to what is brought in, For evils have come down from the Lord upon the gates of Jerusalem, the Marcionites and the Manichaeans too use this text, on the ground that the God of the law is the author of evils. Let us say that evils came down from the Lord in the way that the Savior also speaks in the Gospel: I saw Satan like lightning falling from heaven. For as there Lucifer, who rose in the morning, fell from heaven and was crushed upon the earth, he who used to send to the nations, so also these evils, which fell from the Lord and came to the gates of Jerusalem, were not evils before they fell, but because they fell headlong from the Lord, for that reason they became evils. And that we may know the snares of the evils: They came, he says, to the gates of Jerusalem, which, because they are strong and adamantine, are shut by the apostles, to whom the keys of Jerusalem have been entrusted; before them the enemies roam about, and whomever they see going out, they kill. If anyone, therefore, is of Jerusalem, which dwells well in her cities, he does not go out, since he dwells in abundance; but he remains always within, and does not go out of her gates, for whoever goes out of them is killed; and he is killed by those who lift themselves up in Gath, and dwell in Bachim, and build a house for derision. In short, the evils which came down from the Lord to the gates of Jerusalem have only the din of chariots and the tumult of horses, and a confused sound before the doors of Jerusalem, so that with the lance of their mouth they may kill whomever they see wandering.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
