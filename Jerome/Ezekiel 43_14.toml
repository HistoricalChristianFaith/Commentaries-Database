[[commentary]]
quote='''
But the 'pit' of the altar, or 'depth' and 'height', for which in the Hebrew 'gab' is set down, was of two cubits from the bosom of the earth up to the lowest ledge, or up to the greatest mercy seat, and its breadth of one cubit: for the lower parts, deep and clinging to the earth, are contained in the dual number — which was also set down for the unclean animals —, but the upper parts, reaching to the ledge or mercy seat — which Theodotion called by the Hebrew name itself, 'azara' [ledge, enclosure] — have a breadth of one cubit, so that the dual number passes over to the single, and the good of marriage, which is lower, attains to the blessedness of unity. And as for what follows, And from the lesser ledge up to the greater ledge four cubits, and the breadth of one cubit — for which in the Seventy is set down: And from the lesser mercy seat up to the greater mercy seat, and Theodotion in both places translated 'azara' —, this is to be understood: that the lesser mercy seat is the stone cut from the mountain without hands, and the great mercy seat is the stone itself which grew into a great mountain and filled the whole world; or, according to another sense, the lesser mercy seat is when he emptied himself, taking the form of a servant, and the great mercy seat when he received back the glory which he had with the Father before the world was made: for first we come to know the humbler things of Christ, and so we arrive at the height of his divinity; and yet the mercy seat of both natures, that is, of the lesser and the greater, pertains to the mystery of one altar. And between the two mercy seats, the lesser and the greater, there were four cubits, signifying the four elements of the world, which themselves too arrive at the breadth of one cubit — and this is to be noted, that in the measure of the altar the first cubit in breadth is coupled to none but is perfect in its own unity, while the second cubit of breadth grows to the top after two cubits, and the third cubit, after the lesser and greater mercy seat, tends through the four elements to the mystery of one cubit: so that the one and the second and the third cubit in the altar of the Lord are by no means said to be first, second and third, but one and one and one —.
'''
source_url = "https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html"
source_title = "Commentary on Ezekiel"
