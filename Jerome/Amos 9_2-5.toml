[[commentary]]
quote='''
And these things, following the order of the history, we have interpreted as best we could, if indeed understanding has not failed us in some points. But David sets out the whole περιοχὴν (the whole tenor) of this passage, saying: Lord, you have proved me, and you have known me. And at once he adds: Where shall I go from your spirit, and from your face where shall I flee? If I ascend into heaven, you are there; if I descend into hell, you are there. If I take my wings at dawn, and dwell in the uttermost parts of the sea: even there your hand shall lead me, and your right hand shall hold me. In Deuteronomy also we read something similar: This commandment which I command you today is not above you, nor placed far off, nor set in heaven, so that you could say: Which of us is able to climb up to heaven, to bring it down to us, that we may hear it and fulfil it in deed? Nor is it placed beyond the sea, so that you should make excuses and say: Which of us will be able to cross the sea and bring it all the way to us, so that we may be able to hear and do what is commanded? But the word is near you, exceedingly, in your mouth and in your heart, that you may do it. For when the soul, loosed from the bodily chains, has, by reason of the thinness of its substance, the freedom to fly where it will, or where it is compelled to go, it will either be led to the lower regions, of which it is written: Let sinners be turned into hell, all the nations that forget God, and: In hell who will confess to you? And: Your glory has gone down into hell. Or else it will be lifted up to the heavenly places, where are the spiritual hosts of wickedness in the heavenly places; and if it wishes to claim for itself the knowledge of the true circumcision, for this is what Carmel is interpreted, and, scorning humility, to dwell on the mountains, even there it will not be able to escape the searching hand of God. But if, despairing of salvation, it tries to avoid the eyes of God and to reach the farthest limits of the salt waves, even there the Lord will command the crooked and ancient serpent, who is the enemy and the avenger, and it will bite it. Taken captive also by vices and sins, it will be punished with the sword of the Lord, and he will set his eyes upon it for evil and not for good, so that through tortures and punishments it may return to the Lord. And when Almighty God has touched their land and shaken it, and has made all earthly things melt, they, understanding their crimes, will be turned to mourning, and the Lord himself will ascend and descend in a twofold way. He will ascend upon the saints like the river of its consummation, that is, of the earth, so as to consume their earthly works. He will descend upon sinners like the flood of Egypt, so that by the Lord's onrush they may be thrust down into the bitterness of torments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
