[[commentary]]
quote='''
Verse 7. "And the overseer of the eunuchs imposed names upon them, calling Daniel Belteshazzar (Balthasar), and Hananiah Shadrach, and Mishael Meshach, and Azariah Abednego." It was not only the overseer or master of the eunuchs (as others have rendered it, the "chief-eunuch") who changed the names of saints, but also Pharaoh called Joseph in Egypt Somtonphanec (Genesis 41:45), for neither of them wished them to have Jewish names in the land of captivity. Wherefore the prophet says in the Psalm: "How shall we sing the Lord's song in a strange land?" (Psalm 137:4). Furthermore the Lord Himself changes names benignly, and on the basis of events imposes names of special significance, so as to call Abram Abraham (Genesis 17:5), and Sarai Sarah (Genesis 17:15). Also in the Gospel, the former Simon received the name of Peter (Mark 3:16), and the sons of Zebedee are called "sons of thunder" (Mark 3:17) - which is not boanerges, as most people suppose, but is more correctly read benereem.
'''
source_url='https://www.ccel.org/ccel/pearse/morefathers/files/jerome_daniel_02_text.htm'
source_title="St. Jerome, Commentary on Daniel, CHAPTER ONE"

[[commentary]]
quote='''
And God said to Abraham: Sarai your wife, you shall not call her Sarai, but Sara shall be her name. Those are mistaken who think that Sara was first written with one R and that afterwards another R was added to her; and, because among the Greeks R is the number one hundred, they suppose many absurdities about her name: whereas, surely, however they would have her name changed, it ought to have a Hebrew, not a Greek, explanation, since the name itself is Hebrew. And no one who names somebody in one language takes the ἐτυμολογίαν [etymology] of the word from another. Sarai, then, was first called with sin, res, ioth: so, when ioth, that is, the element I, was taken away, the letter he was added, which is read as A, and she was called Saraa. And the reason the name was so changed is this: that before she was called my princess, the mother of the household of one house only, but afterwards she is called princess absolutely, that is, ἄρχουσα.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
Sarai: my princess.
