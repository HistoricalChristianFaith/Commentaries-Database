[[commentary]]
quote='''
Nor indeed let us think that the Apostle burst out into these words suddenly and without order; but because he had stated beforehand that God is above all things, and through all things, and in all, and that grace has been given to each of the saints according to the measure of the gift of Christ, he now adds that some apostles, others prophets, others evangelists, others pastors and teachers have been distributed in the Church, who are necessary for the perfecting and instruction of the saints, for the work of the ministry, for the building up of the body of Christ: because, since the Church is the body of the Lord, and the Church is built of living stones, those whom we mentioned above as appointed in the Church have this as their work, that according to the dispensation and the offices entrusted to them they build up the Church of Christ, that is, his body. If anyone, then, does not build up the Church of Christ, nor instruct the people subject to him (so that the Church of Christ may be built from the subject people), he is to be called neither apostle, nor prophet, nor evangelist, nor pastor, nor teacher.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
