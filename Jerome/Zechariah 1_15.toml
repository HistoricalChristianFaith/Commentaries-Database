[[commentary]]
quote='''
He, then, who was jealous for Jerusalem and Zion, which are, moreover, one and the same city, is now angry with the wealthy nations, which he named above as the red, white and speckled horses: because he himself handed them over to be chastened, but they raged against those handed over; he wished them corrected as a son by a tutor, they tried to kill and punish them as an enemy. Like this is that passage in Isaiah: I gave them into your hands, but you showed them no mercy. On the old man you made the yoke very heavy, and you said: I shall be mistress forever. Now jealousy is taken ἀνθρωποπάθως (in human fashion), in the same way as anger. By this passage the heretics who disparage the Old Testament are refuted, since God, when he is angry, desires not to destroy those with whom he is angry, but to amend them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
