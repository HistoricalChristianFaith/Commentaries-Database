[[commentary]]
quote='''
And I will be to them like a lioness, like a leopard on the way of the Assyrians; I will meet them like a bear robbed of her cubs, and I will tear apart the inner parts of their liver; and I will devour them there like a lion; the beast of the field will rend them. LXX: And I will be to them like a panther and like a leopard on the way of the Assyrians; I will meet them like a bear in want of food, and I will tear apart the inner parts of their heart; and the whelps of the forests will devour them there, the beasts of the field will tear them apart. They were filled and satisfied; they lifted up their hearts and forgot me. But I, he says, will be to them like a lioness, or a panther, of which we spoke more fully above; and like a leopard on the way of the Assyrians, when they are led captive by the Assyrians; and I will meet them like a bear robbed of her cubs, or in want of food; and I will tear apart all their vital organs. Those who have written on the natures of beasts say that among all wild animals nothing is more savage than a bear when she has lost her cubs or is in want of food; and he threatens not only the ferocity of the panther, the leopard and the bear, but also that of the lion and of all the beasts that are bred in the woodland pastures; and he says he will be turned into all these when they go to the Assyrians, so that, when they have suffered hard things there, they may not ascribe their miseries to the strength of their enemies, but to the power and indignation of the Lord. And at the same time let us consider that he who in the Gospel says to believers: Come to me, all you who labor and are burdened, and I will refresh you; for my yoke is sweet and my burden is light, now through the prophet becomes to the unbelieving and to those unwilling to repent a panther, a leopard, a bear and a lion; not only to the Israelites, who because of their idolatry were settled in the cities or mountains of the Medes, but also to the heretics, who because of the pride of their mind and the vanity of their false dogmas have forgotten their God, and have fashioned and followed foreign gods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
