[[commentary]]
quote='''
That he might show in the ages to come the abundant riches of his grace in kindness upon us in Christ Jesus.

How great is the magnitude of the benefit, and how manifold the grace by which the Lord, having freed us from the disturbances of this age, has made us sit and reign with Christ, is proved most of all from this: that in the ages to come, not in one but in all, he is going to show his glory upon us to all rational creatures, and to display his riches. That we, who were once held by the law of hell, and who, because of our vices and sins, were destined for punishments as we were for the works of the flesh, now reign in Christ and sit with him. And we sit not in some lowly place, but above every principality, and power, and virtue, and dominion, and every name that is named, not only in this age but also in that to come. For if Christ, raised from the dead, sits at the right hand of God in the heavenly places, above every principality, and power, and virtue, and the rest, and we sit and reign with Christ, it is necessary that we sit above the things above which he sits. But one who is a careful reader immediately asks and says: What then, is man greater than the angels and all the powers in heaven? Since it is dangerous to answer this, he will refer the principalities and powers, and virtues, and dominions, and every name that is named, not only in this age but also in that to come (especially since all things are subjected under the feet of Christ), not to the good side but to the contrary one: so as to say that they are the renegade angels, and the prince of this world, and Lucifer who rose in the morning, above whom the saints are to sit with Christ at the end, conferring a benefit on them too, who now, unbridled and badly abusing their freedom, wander everywhere and rush headlong over the precipices of sins. But when they have such riders, they will begin to be steered according to the will of those who sit upon them. Another, however, will transfer what he says, that he might show in the ages to come the abundant riches of his grace in kindness over us, in Christ Jesus, to this understanding: that we have been saved not by our own merit but by his grace, and that it is a sign of greater kindness to die for sinners rather than for the righteous: For perhaps for a good man someone might dare to die; and that he is going to give us the things which eye has not seen, nor ear heard, nor have they entered into the heart of man (1 Cor. 2). All of which he has already given in part in Christ Jesus: because no good can be spoken of apart from Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
