[[commentary]]
quote='''
And I will give Jerusalem into heaps of sand — or into exile — and into lairs of dragons, and the cities of Judah I will give into desolation, because there is no inhabitant. When churchmen and all the teachers have failed, then Jerusalem is given into exile or into heaps of sand, so that heretical speech prevails in her and she is made a lair of dragons and her cities are reduced to a wilderness, and there is in her no dwelling of the divine word and of him who says: I will dwell and walk among them, and I will be their God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
