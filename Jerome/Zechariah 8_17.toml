[[commentary]]
quote='''
And do not devise evil, he says, against your friends in your hearts; raath, which all with one voice have translated κακίαν, that is, evil, we can take in two ways, both for affliction and for wickedness. For affliction: If there is evil in a city which the Lord has not done, and: Sufficient for the day is its own evil. For wickedness, God speaks in the prophet Jonah: The cry of their evil has gone up to me, and in the Apostle we read: Filled with all iniquity and evil. In both ways, therefore, he who is holy neither afflicts his friend nor devises evil against him in his heart. And do not love, he says, a lying oath; for the Lord commands in the Gospel: But I say to you, do not swear at all, but let your speech be, yes yes, no no; for he who does not swear will never be able to swear falsely. Let him who swears hear what is written: You shall not take up the name of the Lord your God in a vain thing. All these are things that I hate, says the Lord, according to the words of Malachi, who says: And all the things that I hated, you did. In precepts which pertain to life and are plain, we ought not to look for allegory, lest, as the Comic poet says, we seek a knot in a bulrush.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
