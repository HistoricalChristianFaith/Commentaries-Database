[[commentary]]
quote='''
Therefore the judgment of God is with Judah, and visitation upon Jacob; according to his ways and according to his devices he will repay him. In the womb he supplanted his brother, and in his strength he was directed with the angel; and he prevailed over the angel and was strengthened; he wept and besought him; in Bethel he found him, and there he spoke with us, and the Lord God of hosts. The Lord is his memorial; and you will turn to your God; keep mercy and judgment, and hope in your God always. LXX: And there is judgment for the Lord with Judah, that he may punish Jacob; according to his ways and according to his devices he will repay him. In the womb he supplanted his brother, and in his labor he prevailed with God, and he was strengthened with the angel, and was able; they wept and entreated me; in the house of ὢν they found me, and there it was spoken to them. But the Lord God almighty will be his memorial, and you will turn in your God; keep mercy and judgment; and draw near to your God always. Since Ephraim once fed on winds and followed lying, and came to such madness that he wavered in doubt between two hostile nations, making peace with the Assyrians and carrying oil into Egypt, now all my judgment is with Judah, and visitation upon Jacob. Now he calls visitation scourges and punishments, so that he who repaid Ephraim what he deserved may repay Judah too, who sprang from the seed of Jacob, according to his ways and according to his devices; for he was not merely deceived by chance error and brought down by human frailty, but sought out and devised the things in which to sin and fall.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
