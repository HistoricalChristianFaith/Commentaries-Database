[[commentary]]
quote='''
Chabonim: hand, or a heap of thorns. But better: preparations, although most of the Hebrews think that offering-cakes or little pastries are meant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Jeremiah"
