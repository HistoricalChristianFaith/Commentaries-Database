
[[commentary]]
quote='''
And I turned, and lifted up my eyes and saw. And behold, four chariots coming out from between two mountains, and the mountains, mountains of bronze. In the first chariot were red horses, and in the second chariot black horses, and in the third chariot white horses, and in the fourth chariot spotted and strong horses. And I answered, and said to the angel who spoke in me: What are these, my lord? And the angel answered, and said to me: These are the four winds of heaven, which go out to stand before the Ruler of all the earth. The one in which were the black horses went out into the land of the north, and the white went out after them, and the spotted went out toward the land of the south. But those which were the most robust went out, and sought to go and run to and fro through all the earth. And he said: Go, walk through the earth; and they walked through the earth. And he called me, and spoke to me, saying: Behold, those who go out into the land of the north have made my spirit rest in the land of the north. LXX: And I turned, and lifted up my eyes, and saw. And behold, four chariots coming out from between two mountains, and the mountains were mountains of bronze. In the first chariot were red horses, and in the second chariot black horses, and in the third chariot white horses, and in the fourth chariot spotted, starling-colored horses. And I answered, and said to the angel who spoke in me: What are these, lord? And the angel who spoke in me answered and said: These are the four winds of heaven, which go out to stand by the Lord of all the earth. The one in which were the black horses went out over the land of the north, and the white went out after them, and the spotted went out into the land of the south, and the starling-colored went out, and they looked to go around the earth. And he said: Go and go around the earth; and they went around the earth, and he cried out; and he spoke to me, saying: Behold, those who have gone out over the land of the north have made my fury rest in the land of the north. I passed, he says, to another vision, and lifted the eyes of my heart higher, toward heaven, and saw: four chariots came out from between two mountains which were of bronze, that is, unconquerable and most strong, and such as could be consumed by no age. For those he had called above mountains of myrtles, or shady and wooded ones, he now calls mountains of bronze.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
