[[commentary]]
quote='''
Be astonished, O heavens, at this, and, its gates, be utterly desolate, says the Lord; for my people has done two evils: they have forsaken me, the fountain of living water, and have dug for themselves broken cisterns, which cannot hold waters. LXX: the heaven was astonished at this and shuddered beyond measure and exceedingly, the rest likewise. The heaven, to which it was said: Give heed, O heaven, and I will speak and: Hear, O heaven, and give ear, O earth, seeing the precepts of God trampled underfoot, shudders and cannot hide its astonishment. For every creature groans together and grieves together over the sins of men. Now the people of God has done two contrary things: first, that they forsook God, who is the fountain of life and gave the precept, saying: I am the Lord your God, who brought you out of the land of Egypt; second, what is written in the same place: You shall have no gods in my sight; instead of which it followed demons, whom he calls broken cisterns because they cannot keep the commandments of God. And this must be noted, that the fountain is perpetual and has life-giving waters, but cisterns and pits are filled either from torrents or from the turbid waters of the earth and from rains. And he calls those the gates of the heavens of which it is also written in Psalm 23 (24): Lift up, O gates, your heads, and the king of glory shall enter; for which the Seventy translated: Lift up your gates, O princes; of these more will be said fully in its proper place. And let it trouble no one that Aquila and Symmachus translated 'heavens', but the Seventy and Theodotion 'heaven'. For the Hebrew 'samaim' is of common number, and both 'heavens' and 'heaven' are called by the same name, like Thebes, Athens, Salonae.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
