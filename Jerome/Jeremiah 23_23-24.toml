[[commentary]]
quote='''
Am I a God from near at hand, says the Lord, and not a God from afar? If a man is hidden in secret places, shall I not see him?, says the Lord; do I not fill heaven and earth?, says the Lord. LXX: I am a God drawing near, says the Lord, and not a God from afar. If a man shall hide in secret places, shall I not see him?, says the Lord; do I not fill heaven and earth?, says the Lord. Aquila and Symmachus translated similarly: Am I a God from near — or nearby — and not a God from afar? But the Seventy and Theodotion translated in a contrary sense, so as to say: I am a God drawing near, says the Lord, and not a God from afar: namely, the former assert that God knows not only things nearby but also those which are far off, and sees not only present things but future ones; while these think that God is present everywhere and that there is no place where God is not present. For God draws near to all, and especially to the saints, as a garment clings to the skin; but sinners, withdrawing far from him, will perish. This sense we read in the psalms too: Whither shall I go from your spirit, and whither shall I flee from your face? If I ascend into heaven, you are there; if I descend into hell, you are present; if I take my wings at dawn and dwell in the uttermost parts of the sea, even there your hand shall lead me and your right hand shall hold me. Amos too agrees with these words, saying: if they go down even to hell, from there my hand shall bring them out, and if they go up even to heaven, from there I will drag them down; and if they are hidden on the summit of Carmel, searching I will take them away from there, and if they have hidden themselves from my eyes in the depth of the sea, there I will command the serpent and it shall bite them. And again in the psalm above: For darkness, he says, shall not be darkened to you, and night shall be lit up as day; as its darkness, so also its light. And as for its being said frequently in the prophets: 'thus says the Lord', it is always added for this reason: that they should not be despised as words of the prophets, but that people should be continually reminded that the words they speak are God's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
