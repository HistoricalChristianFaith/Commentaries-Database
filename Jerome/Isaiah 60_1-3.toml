[[commentary]]
quote='''
He also cries out to Jerusalem in another place: Be enlightened, be enlightened, O Jerusalem; for your light has come upon you, and the glory of your God has risen upon you. For behold, darkness and gloom shall cover the earth over the nations, but over you the Lord shall appear, and the glory of your God has risen upon you. And kings shall walk in your light, and the nations in your splendor. If gloom and darkness shall cover the earth over the nations, how in turn shall the nations walk in the splendor of the Lord? But those nations will be in darkness which the cold and frost have gripped; and those will walk in the light of the Lord which have followed the kings, the apostles and prophets, of whom it is written: The heart of the king is in the hand of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
