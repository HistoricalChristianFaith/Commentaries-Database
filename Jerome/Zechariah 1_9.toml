[[commentary]]
quote='''
You see that God speaks not in the ears but in the heart; just as Zechariah too says: "And the angel who spoke within me said to me." There the angel is understood to be our Lord, who announces the will of the Father, who in Isaiah is called the "angel of great counsel."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_064.html'
source_title="Homily 64, on Psalm 84 (Alternate Series)"
