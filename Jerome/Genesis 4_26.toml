[[commentary]]
quote='''
(Verse 26) And he called his name Enos: this one hoped to invoke the name of the Lord God. Just as Adam () is interpreted as 'man': so also Enos () according to the variety of the Hebrew language is called 'man' or 'vir'. And it is beautiful because he had this word, it is written about him, 'Then was the beginning of invoking the name of the Lord God': although many Hebrews interpret it differently, that at that time idols were first made in the name of the Lord and in his likeness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
Whoever therefore believe shall be blessed with faithful Abraham, who, because of his outstanding faith in God, is related to have been the first to believe in him; just as Enosh, because of his preeminent hope in God, one that stood out among the rest, is written to have hoped to call upon the Lord God (Gen. 4:26). Not that Abel also, of whom the Lord says: "The voice of your brother's blood cries to me" (ibid. 4:10), and the others after him, did not hope to call upon God; but that each one is named from that quality which he possesses most of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
