[[commentary]]
quote='''
And to this locust, and to the morning cloud and the dew and the dust, the heretics are compared, of whom it is also said in the catholic epistle: These are clouds without water. For they have the appearance of prophets and of apostolic clouds, to which the truth of God comes; but they do not have waters, that is, the grace of the Holy Spirit, as the Lord says in the Gospel: He who believes in me, as the scripture says, out of his belly shall flow rivers of living water. But this, he says, he said of the Spirit which those who believed in him were to receive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
