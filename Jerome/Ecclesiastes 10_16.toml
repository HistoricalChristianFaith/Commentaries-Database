[[commentary]]
quote='''
But to me something more sacred seems to lie hidden in the letter: that those are called young men in Scripture who fall away from the old authority and despise the gray-haired precepts of their parents; who, neglecting the commandment of God, desire to establish the traditions of men. Concerning them, in Isaiah too, the Lord threatens Israel, because it would not have the water of Siloam, which goes in silence, and turned away from the old pool, choosing for itself the streams of Samaria and the floods of Damascus. And I will give, he says, young men as their princes, and mockers shall rule over them. Read Daniel and you will find God the Ancient of days. Read the Apocalypse of John and you will find the head of the Savior white as snow and like white wool. Jeremiah too, because he was wise and his gray hairs were reckoned in his wisdom, is forbidden to say that he is a youth. Woe, then, to the land whose king is the devil, who, ever greedy for revolution, rebels even in Absalom against his parent; the land which has as judges and princes those who love the pleasures of this world, who, before the day of death comes, say: Let us eat and drink; for tomorrow we shall die.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
