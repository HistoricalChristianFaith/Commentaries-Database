[[commentary]]
quote='''
And the word of the Lord came to me, saying: The hands of Zerubbabel have founded this house, and his hands shall finish it, and you shall know that the Lord of hosts has sent me to you. For who has despised the small days? And they shall rejoice, and shall see the stone of tin in the hand of Zerubbabel. These seven are the eyes of the Lord, which run to and fro through the whole earth. LXX: And the word of the Lord came to me, saying: The hands of Zerubbabel have founded this house, and his hands shall complete it. And you shall know that the Lord Almighty has sent me to you; for who has despised in the small days? And they shall rejoice, and shall see the stone of tin in the hand of Zerubbabel; these seven are the eyes of the Lord, which look upon all the earth. Much is said both by the Hebrews and by our writers; following most of it and rejecting some, let us set out what we think, keeping the truth of the history, so that from it we may be able to recognize him who is prophesied through the history. The hands of Zerubbabel, the prince of the Jews who returned from Babylon, laid the foundations of the temple; and his hands shall reach to the top of the temple, completing what they had begun, and building up all that had been begun. We read in Ezra that the temple was begun and finished by Zerubbabel. And when, says the prophet Zechariah, you see the roof set by you upon the temple which you are now building, then you will understand that I was sent by the Lord, and that what I have spoken I said at his command: For who has despised the small days?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
