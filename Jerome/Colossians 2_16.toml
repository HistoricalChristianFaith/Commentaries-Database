[[commentary]]
quote='''
The Apostle explains this passage more fully to the Colossians, saying: "Let no one therefore judge you in food, or in drink, or in part of a feast day, or of a new moon, or of sabbaths, which are a shadow of things to come" (Col. 2:16). He put "part of a feast day" here to distinguish it from the perpetual festival, so that we may hold not a brief one and, so to speak, some small particle of the whole body, but the whole span of our life as a perpetual solemnity in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
