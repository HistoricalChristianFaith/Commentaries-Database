[[commentary]]
quote='''
Because of what He had said, I am not come to send peace but a sword, &c. that none might suppose that family affection was banished from His religion, He now adds, He that loves father or mother more than me is not worthy of me. So in the Song of Songs we read, Order love in me. (c. 2:4.) For this order is needed in every affection; after God love thy father, thy mother, and thy children; but if a necessity should occur that the love of parents and children comes into competition with the love of God, and where both cannot be preserved, remember that hatred of our kindred becomes then love to God. He forbids not to love parent or child, but adds emphatically, more than me.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He who loves father or mother more than me is not worthy of me, and the rest. Because he had said before: I have not come to send peace but a sword, and to divide men against father and mother and mother-in-law, lest anyone should put filial devotion before religion, he went on, saying: He who loves father or mother more than me; and in the Song of Songs we read: Set charity in order in me. This order is necessary in every affection. After God love your father, love your mother, love your children; but if a necessity comes such that the love of parents and children is weighed against the love of God, and both cannot be kept, hatred of one's own is devotion toward God. So he did not forbid loving father or mother, but pointedly added: He who loves father or mother more than me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
