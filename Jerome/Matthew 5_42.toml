[[commentary]]
quote='''
If we understand this only of alms, it cannot stand with the estate of the most part of men who are poor; even the rich if they have been always giving, will not be able to continue always to give.

But it maybe understood of the wealth of doctrine: wealth which never fails but the more of it is given away, the more it abounds.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Give to him who asks of you, and do not turn away from him who wishes to borrow from you. If we understand it as said only of almsgiving, in the case of most poor people this cannot stand. And even the rich, if they always give, will not be able always to give. After the good of almsgiving, then, precepts are given to the apostles, that is, to teachers, so that those who have received freely may bestow freely. Money of this kind never runs out, but the more of it is given, the more it is doubled; and though it waters the fields below it, the water of the spring never dries up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
