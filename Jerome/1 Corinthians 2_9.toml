[[commentary]]
quote='''
From of old they have not heard, nor perceived with their ears; the eye has not seen, O God, besides you, what you have prepared for those who wait for you. You have met him who rejoices and does righteousness in your ways; they will remember you. LXX: From of old we have not heard, nor have our eyes seen a God besides you, and your works, which you will do for those who wait for mercy; for he meets those who do righteousness, and they will remember your ways. A paraphrase of this testimony the apostle Paul, as a Hebrew of the Hebrews, takes from the authentic books in the Epistle which he writes to the Corinthians, not rendering word for word, which he altogether disdains to do, but expressing the truth of the sense, which he uses to support what he wished (1 Cor 2). Let the ravings of the apocrypha, then, fall silent, which on the pretext of this testimony are thrust upon the churches of Christ. Of them it can truly be said that the devil sits in ambush with the rich in the apocrypha, to kill the innocent. And again: He lies in wait in the hidden place like a lion in his den; he lies in wait to seize the poor (Ps 9 [10]:8). For the Ascension of Isaiah and the Apocalypse of Elijah contain this testimony. And on this pretext, and through many things of this kind, silly women of the Spains, and above all of Lusitania, laden with sins, led away by various desires, always learning and never coming to the knowledge of the truth (2 Tim 3), were deceived into taking up the monstrosities of Basilides, of Balsamus and Thesaurus, of Barbelo too and Leusibora, and of the remaining names. Of these the apostolic man Irenaeus, bishop of Lyons and martyr, writes most carefully, explaining the origins of many heresies, and above all of the Gnostics, who through Mark the Egyptian deceived noble women, first of the Gauls about the Rhône, then of the Spains, mixing pleasure with fables and claiming for their ignorance the name of knowledge (Irenaeus, Against Heresies, book 1).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
