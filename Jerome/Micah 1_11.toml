[[commentary]]
quote='''
Pass over for yourselves, dwelling of Shaphir, which in the Syriac and Hebrew language means beautiful. For Samaria is shown even now, situated in the most beautiful and most fertile place of Judea. It is said to her, therefore: O you who dwell in a most fertile region, since you are confounded with shame, so pass over, so be led away into captivity, that because of the greatness of your evils not even your neighbor the Philistine may hear your voice. Moreover, what follows: She who dwells in Zaanan has not gone out, which means going out, or as Symmachus renders: The abundant dwelling has not gone out, is said of the same Samaria, which is at the very doors of the Assyrian captivity, and as soon as she is moved from her borders, enters hostile land. For the abundant dwelling is to be taken in the sense of what we have already said above, the beautiful dwelling. She, therefore, who dwelt in the going out, or in abundance, did not go out of her own will, but was led by force to the Assyrians. Hence the neighboring house, at the side, which is what Ezel means, namely the kingdom of Judah, will receive mourning from you, she who now for the time being, Samaria having been captured, stood firm and had God as her defender.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
There follows: She who dwells well in her cities has not gone out, dwelling in Zaanan. This seems to me to have this meaning: You who are proud in Gath and in Bachim, in vain do you try to build a house worthy of laughter; sprinkle yourselves with dust and repent, because you wished to press out a detestable wine and to construct a building contrary to God. But the Church of Christ, which dwells well, and, possessing churches in the whole world, is joined by the unity of the Spirit, and has the cities of the law, of the prophets and of the Gospel, and of the apostles, has not gone out of her borders, that is, out of the holy Scriptures, but keeps the possession she entered upon, because she dwells in Zaanan, which Symmachus, as we said above, rendered abundance; for she has the Father and the Son and the Holy Spirit, with whom are all spiritual graces and abundance of virtues. Hence it is said to her: Let peace be in your strength, and abundance in your towers. But you who dwell beside Zaanan, that is, beside the abundant Church, O you heretics, O contrary doctrines, mourn for yourselves, because you have built yourselves a house for derision, and have pressed the winepress into pride, and have built your house not in the Scriptures but in the neighborhood of the Scriptures, a house now worthy not of laughter but of mourning and tears. Hence it is also added: mourn for the house which is beside her, that is, beside Zaanan. But what is added, She will receive from you a blow of pain, is said to the same heretics who are commanded to mourn for the house neighboring the Church, because the enemy and avenger, the devil, to whom they are to be handed over for punishment, himself inflicts blows on them, and for their most wicked building wrings out of them the pain of the blows. These are inflicted for this reason, that, perceiving the sins they had committed, they may repent, and the dwelling of pains may be for them an occasion of good things. Or else the pain of the Church is indicated, because she mourns her one-time sons, and she herself is the cause of the heretics' salvation, if they are willing to return to their grieving mother.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
