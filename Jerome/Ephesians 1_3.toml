[[commentary]]
quote='''
Blessed be the God and Father of our Lord Jesus Christ, who has blessed us in every spiritual blessing in the heavenly places, in Christ.

Just as God, who is good by substance and nature, has made us good by communion with himself, and says to Israel: Be holy, for I am holy (Lev. 20:7), so he who is blessed grants us to be blessed. For the lawgiver gives blessings, and the blessing of the Lord is upon the head of the righteous (Prov. 10); from this blessing Baruch has his name, which in our language means "blessed." And he has blessed us not in one blessing but in all. Not that we all obtain all things; but while each of us has either single blessings or several out of all of them, we all possess them all through the individual ones. And not in earthly blessings, but in spiritual ones. For these are earthly blessings: for someone to have children, to abound in wealth, to rejoice in honor and health; and this earthly blessing comes down even to the irrational beasts. For it was said of them: The Lord blessed them, and said: Increase and multiply (Gen. 1:22). But spiritual blessings are in the heavenly places, because the earth does not hold a spiritual blessing. Indeed, those blessings too which are promised in Leviticus to those who keep God's precepts (Lev. 26), for example, to lend at interest to foreign nations, to have granaries full of grain, to be blessed in the cities (Deut. 28), blessed in the fields, and the rest like these, we shall not see fulfilled in the prophets, men who wandered about in sheepskins and goatskins, in want, in distress, in desert mountains, in caves and caverns of the rocks, avoiding the onslaughts of persecutors (Heb. 11). All things, therefore, are to be taken spiritually, and spiritual things are to be awaited not in earthly places but in heavenly ones. But as for his saying: He has blessed us in every spiritual blessing in the heavenly places, as though it had already been done in the past and not promised for the future, that is, "he has blessed," not "he will bless," the question is how he has blessed us with a heavenly blessing while we are still set upon the earth. Either, then, because our way of life is in heaven, and we are not of this world, but, having laid aside the image of the earthy, we bear the image of the supercelestial; and we do not live in the flesh but in the spirit; and we lay up treasure for ourselves in heaven, where we also have our heart: for this reason we are now said to be blessed with a heavenly blessing; or surely because every spiritual blessing in Christ, although it is on earth, is nevertheless reckoned as belonging to the heavenly places. He has blessed us, he says, in every spiritual blessing in the heavenly places in Christ: in the word of God, and wisdom, and truth, and the other virtues. It is to be read in two ways: Blessed be the God and Father of our Lord Jesus Christ; either so that it is "Blessed be God," who is the Creator of all things, and the pause comes here, and next is added: who is also the Father of our Lord Jesus Christ; or thus: so that "God and Father" is referred jointly to our Lord. Blessed be the God of the man who was assumed, and the Father of him who in the beginning was God the Word with God. Not that the man assumed is one and the Word that assumed him another; but that one and the same is proclaimed, according to the variety of circumstances, now as lofty, now as lowly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
