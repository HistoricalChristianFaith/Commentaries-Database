[[commentary]]
quote='''
After this follows: A fill of shame instead of glory drink, you, and be shaken, that is: O devil, O perverse doctrine, O heretic, who thought yourself a golden cup with which all the nations are made drunk, so that they might see your caves and your secrets, instead of the greatness of your glory be filled with a fill of shame, and be reckoned as an earthen vessel, the works of the potter's hands; drink, you also, from the cup of the Lord, of which it is said in the psalm: A cup is in the hand of the Lord, full of pure wine mixed, and he has tilted it from this into that; yet its dregs have not been emptied out. And be shaken from your former opinion, and do not think firm and stable the things in which you at first desired to stand, because the cup of the right hand of the Lord has surrounded you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
