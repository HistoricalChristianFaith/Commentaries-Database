[[commentary]]
quote='''
And the angel who spoke in me said to me: Cry out, saying: Thus says the Lord of hosts: I am jealous for Jerusalem and Zion with a great jealousy, and with great anger I am angry with the wealthy nations; for I was angry a little, but they helped toward evil. Therefore thus says the Lord: I will return to Jerusalem in mercies, and my house shall be built in it, says the Lord of hosts; and the plumb line shall be stretched out over Jerusalem. LXX: And the angel who spoke in me said to me: Cry out, saying: Thus says the Lord Almighty: I am jealous for Jerusalem and Zion with a great jealousy, and with great anger I am angry with the nations that have been set on top, because I indeed was angry a little, but they have set themselves on top unto evils. Therefore thus says the Lord: I will turn to Jerusalem in mercy, and my house shall be restored in it, says the Lord Almighty; and the measure shall be stretched out over Jerusalem. These are still good words, words of consolation, which the prophet is now commanded to cry out: that the Lord has been jealous for Jerusalem and Zion with a great jealousy. But he who is jealous shows that he loves her for whom he is jealous, by no means saying through Jeremiah: As a woman despises her husband, so the house of Israel has despised me. To her the Lord used to speak through Ezekiel: Being angry, I will no longer be angry with you, and my jealousy has departed from you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
