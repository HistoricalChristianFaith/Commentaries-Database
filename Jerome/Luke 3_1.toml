[[commentary]]
quote='''
An old history relates that Philip, the son of Herod the elder, under whom the Lord fled into Egypt, and the brother of this Herod, under whom Christ suffered, married Herodias, the daughter of King Phetras; but that afterwards her father, his father-in-law, when certain quarrels had arisen against his son-in-law, took back his daughter and, to the grief of her former husband, joined her in marriage to Herod, his enemy. Who this Philip is, the evangelist Luke teaches more fully: In the fifteenth year of the reign of Tiberius Caesar, when Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of Iturea and the region of Trachonitis.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
