[[commentary]]
quote='''
And I will visit upon her the days of the Baalim, on which she burned incense and adorned herself with her earring and her necklace, and went after her lovers, and forgot me, says the Lord. LXX: And I will avenge upon her the days of the Baalim, on which she sacrificed to them; and she put her earrings and necklaces about herself, and went after her lovers; but me she forgot, says the Lord. He keeps up the character of the harlot, who adorns herself with gold and gems to please her lovers, and whatever beauty she does not have by nature she procures by art. These earrings, with which her ears had been adorned by the teaching of God, and these pearls which hung precious from her neck, so that the bridegroom and husband said to her, Your neck is like necklaces, she cast before the feet of swine, and gave what is holy to the dogs. And what we read in Proverbs was fulfilled: Like a golden earring in a sow's nostrils, so is beauty to a most wicked woman. Now she did all these things so as to follow her lovers and leave her husband. And so great was her desire for pleasure and lust that she lost all memory of her marriage and forgot that she had been a wife. Therefore, on those very solemnities on which she burned frankincense to the demons, she will be visited with blows and chastised with punishments. Baal in the singular number, Baalim in the plural: the same idols are named in the masculine gender. For wherever we read the syllable im at the end of a Hebrew word, it is in the plural number, masculine gender; but where oth, plural number, feminine gender. Therefore we understand seraphim and cherubim as plural number, masculine gender; but Sabaoth, which is interpreted 'of armies', or 'of hosts', or 'of powers', as plural number, feminine gender. And so the Baalim too are of the masculine gender and plural number, although some wrongly read τῇ Βαὰλ (feminine article) and ταῖς Βααλεὶμ (feminine plural), in the feminine gender. But how the heretics deceive their lovers, and adorn themselves with charm of speech and the arrangement of words, so as to make falsehood look like truth, and abandon conjugal chastity, and burn incense to the Baalim, that is, to the idols which they have fashioned out of their own heart, we see daily. For they have no care for the simple rusticity that does not seek a harlot's ornaments, but for artful and elegant falsehood, so as to please their lovers, the devils and demons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
