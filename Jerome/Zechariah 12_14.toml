[[commentary]]
quote='''
He was silent about the remaining tribes, which have no privilege of dignity. But in saying: All the remaining tribes, tribes and tribes apart, and their wives apart, he includes them all without a name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
