[[commentary]]
quote='''
Mindful of this voice, the Scribes and Pharisees and the princes of the Jews, when they heard that John was preaching in the wilderness a baptism of penance and teaching the people, send men to ask him whether he was the Christ, or Elijah, or the Prophet; and when he had answered that he was none of these, they ask again: Tell us then, who are you? that we may give an answer to those who sent us. What do you say of yourself? And he answered: I am the voice of one crying in the desert: Prepare the way of the Lord; as Isaiah the Prophet said (John 1:22, 23). In this it is to be noticed that the straight ways of the Lord and the paths of our God, the filling of the valleys, and the lowering of the mountains and hills, and the correction of the crooked, and the level plains made of rough places and rocks, and the glory of the Lord and the salvation of our God, are proclaimed not in Jerusalem but in the wilderness of the Church and in the deserted multitude of the nations, of which we read above (cf. Isa 35:1): Rejoice, thirsting desert: let the wilderness exult and flower like the lily. For this multitude was deserted of the knowledge of God, and was held by idols: low in confession, lifted up in pride, rough and intractable in savagery. But after the glory of the Lord appeared, and all flesh saw the salvation of God, all things were suddenly changed and the way of the Lord prepared, so that the glory of God appeared in the wilderness: when the Lord was baptized in the Jordan, and the heavens were opened, and the Holy Spirit descended in the form of a dove and remained on him; and the voice of the Father thundering from above was heard: This is my beloved Son, in whom I am well pleased: hear him (Matt 3:17). And all flesh saw the salvation of God. It was called flesh for this reason, that before it did not have the Holy Spirit. Of it the Lord also says: My spirit shall not remain in these men, because they are flesh (Gen 6:3). But that flesh will see the salvation of God of which the same Lord spoke through Joel: I will pour out of my spirit upon all flesh, and they shall prophesy (Joel 2:28). This was cried out not only at that time by John, who, as the forerunner and precursor of the Word of God, is rightly called a voice (Matt 3); but to this day in the desert of the Gentiles the teachers of the Churches cry out: that we should make straight ways and paths for God in our hearts, and be filled with virtues, and be bowed down by humility; that we should change the crooked into straight and turn the rough into smooth: and so deserve to see the glory of the Lord and the salvation of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
For this is he who was spoken of through the prophet Isaiah, saying: The voice of one crying in the desert: Prepare the way of the Lord, make his paths straight. He was preparing the souls of believers, in which the Lord was going to walk, so that he, the pure one, might walk in most pure ways, saying: I will dwell in them and walk among them, and I will be their God, and they shall be my people. Porphyry compares this passage with the beginning of the evangelist Mark, in which it is written: The beginning of the Gospel of Jesus Christ, the Son of God; as it is written in the prophet Isaiah: Behold, I send my angel before your face, who shall prepare your way; the voice of one crying in the desert: Prepare the way of the Lord, make his paths straight. For since the testimony is woven together from Malachi and Isaiah, he asks how we can think the example was taken as from Isaiah alone. To him churchmen have answered most fully. We, however, think either that the name of Isaiah was added through the fault of copyists, which we can prove in other places as well, or at any rate that one body has been made out of different testimonies of the Scriptures. Read Psalm 13 (14) and you will find this same thing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
