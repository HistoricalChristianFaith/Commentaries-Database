[[commentary]]
quote='''
In that day man shall cast away the idols of his silver and the images of his gold, which he had made for himself, to worship moles and bats; and he shall go into the clefts of the rocks and the caverns of the stones from the face of the terror of the Lord and from the glory of his majesty, when he rises to strike the earth. We have often said that silver and gold are taken for speech and sense; and though these were given by God to men so that they might either speak of God or perceive God and praise their creator, they abuse this gift for the fashioning of idols; according to what is written: I gave them silver and gold, but they made Baal of my silver and gold (Hos 2:8). When, then, someone, terrified by the fear of the Lord, has first hidden his idols in the cave of his breast and concealed them in the abysses of the earth, not daring to bring out what he had wickedly fashioned, the second advance is that he cast away what he had first concealed and not suffer it to be in him. For moles, as we have translated, the Seventy have vain things, Aquila ὀρυκτὰ, Symmachus unfruitful things; Theodotion put the Hebrew word itself, PHARPHAROTH (פרפרות). It is an animal without eyes, which always digs the earth and throws out the soil, and, eating the roots underneath, is harmful to crops; the Greeks call it ἀσπάλακα. The bat, a bird of the night, which received from them the fitting name νυκτερὶς because it flits about in the night, is a small animal, like a mouse, sounding not so much with voice and song as with squeaking; and though it is seen to fly, it shuns the light and cannot bear to see the sun. To such animals are compared the idols, which, blind and dark, are worshiped by the blind, and all doctrines contrary to the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
