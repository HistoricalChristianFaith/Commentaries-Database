[[commentary]]
quote='''
But he refused to do the will of God, and therefore he was plundered and laid waste by his adversaries, whom we ought to understand either as demons or as enemies. All are the snare of young men, and they are hidden in prison houses. Or, as the Seventy translated, There is a snare in the chambers everywhere, and in the houses together, in which they hid them: signifying the scribes and Pharisees, who deceived the wretched common people and everywhere laid snares against the Lord the Savior and his Apostles (Luke 11), having the key of knowledge, neither entering themselves, and forbidding others who wished to enter. And beautifully he called their breasts, in which the worst thoughts dwelt, prisons. Therefore they became a prey and a plunder, and there was none to free them and to speak a word on their behalf.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
