[[commentary]]
quote='''
'But if', he says, 'the people asks you why it suffers these things, and seeks the causes of its miseries, you shall answer them: because your fathers forsook me, says the Lord, those who preside over you in the churches, and went after strange gods — whose god is the belly, and avarice and luxury, and their glory is in their shame — and served them — for by whatever one is overcome, of that he is also the slave — and worshiped them — for each one worships what he loves — and forsook me and did not keep my law'. It belongs properly to priests not only to teach the law but also to do it, so that they may teach the peoples subject to them and the flock entrusted to them not by words at all, but by examples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
