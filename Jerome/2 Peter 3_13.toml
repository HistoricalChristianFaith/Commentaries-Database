[[commentary]]
quote='''
Peter too signifies the same thing: This escapes them, willingly: that the heavens were from the beginning, and the earth out of water and through water subsists by the word of God; through which the former world, flooded by the deluge, perished. But the heavens and earth which are now are by the same principle kept for fire (2 Pet 3:5ff.); in what sense this is to be taken, he teaches afterwards: But we see new heavens and a new earth, and his promise (ibid. 13): he did not say, we shall see other heavens and another earth, but the old and ancient ones changed for the better.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
