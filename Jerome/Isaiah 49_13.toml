[[commentary]]
quote='''
And the heavens and the earth are commanded, either the powers that dwell in heaven and on earth, or angels and men, to sing together the praises of God. And those who are set on the height of the virtues are to testify to the gladness of their mind with jubilation and exultation. For the Lord has comforted his people, those of the Jews who were willing to believe. And he has had mercy on his poor and lowly ones: or on all his people, who were called to him from East and West, North and South, having neither Law nor Prophets nor spiritual riches, but, deserted, poor and lowly, lay subject to all the demons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
