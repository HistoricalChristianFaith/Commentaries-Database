[[commentary]]
quote='''
But what do you think? A man had two sons, and coming to the first he said: Go today, work in my vineyard. But he answered and said: I will not; but afterward, moved by repentance, he went. And coming to the other he spoke likewise. And he answered and said: I go, lord, and he did not go. These are the two sons who are also described in Luke's parable, the thrifty one and the prodigal, and of whom the prophet Zechariah speaks: I took for myself two rods; one I called Beauty and the other I called Cord, and I fed the flock. First it is said to the people of the Gentiles, through the knowledge of the natural law: Go and work in my vineyard, that is: what you do not want done to you, do not do to another. It answered proudly: I will not; but afterward, at the coming of the Savior, having repented, it worked in the vineyard of God and corrected the stubbornness of its word by labor. But the second son is the people of the Jews, which answered Moses: All things whatsoever the Lord says we will do, and did not go into the vineyard, because, having killed the householder's son, it thought itself the heir.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
