[[commentary]]
quote='''
And that you may know that whenever Sodom and Gomorrah and Egypt are named, it is not said of these provinces which we see with our eyes but of other, spiritual ones, which the prophetic word threatens, read in the Apocalypse of John: But the place in which the Lord was crucified is called spiritually Sodom and Egypt. If, then, Jerusalem, in which the Lord was crucified, is called spiritually Sodom and Egypt, why should not, conversely, Egypt and Sodom and Gomorrah, if they have done the works of Jerusalem and of the land of Judah, be transferred into the land of the Lord's lot?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"

[[commentary]]
quote='''
And just as the world is written to be destined to perish, according to what is written: heaven and earth shall pass away, because it is set in the evil one, so too the very houses and places in which crimes were committed lie subject to the wrath of God. There are those who contentiously refer to the places themselves what is written: 'the place in which the Lord and Savior was crucified is spiritually called Gomorrah and Egypt'. But others think that the whole world is signified under the name of Egypt and Gomorrah; for as Gomorrah was destroyed by divine fire, so the world too is to be burned up by the judgment of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
