[[commentary]]
quote='''
And that you may know that whenever Sodom and Gomorrah and Egypt are named, it is not said of these provinces which we see with our eyes but of other, spiritual ones, which the prophetic word threatens, read in the Apocalypse of John: But the place in which the Lord was crucified is called spiritually Sodom and Egypt. If, then, Jerusalem, in which the Lord was crucified, is called spiritually Sodom and Egypt, why should not, conversely, Egypt and Sodom and Gomorrah, if they have done the works of Jerusalem and of the land of Judah, be transferred into the land of the Lord's lot?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
