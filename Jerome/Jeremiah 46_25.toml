[[commentary]]
quote='''
Moreover the prophet Jeremiah too understands Amon, or No, as Alexandria in the vision against Egypt, to which he says: Egypt is a beautiful heifer; a goader will come to her from the north. He also adds this more plainly: The daughter of Egypt is confounded, she has been delivered into the hand of the people of the north, says the Lord of powers, the God of Israel. Behold, I will visit upon Amon Menno, that is, upon the people from Alexandria. For Amon, as we have said, means peoples, men the preposition 'from', and No Alexandria. And I will visit, he says, upon Pharaoh, and upon Egypt and upon her gods; and upon her kings, and upon Pharaoh, and upon those who hope in him; and I will give them into the hands of those who seek their lives, and into the hand of Nebuchadnezzar king of Babylon, and into the hand of his servants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Nahum.html'
source_title="Commentary on Nahum"
