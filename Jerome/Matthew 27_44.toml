[[commentary]]
quote='''
Or it may be said that at first both reviled Him; but when the sun had withdrawn, the earth was shaken, the rocks were rent, and the darkness increased, one believed on Jesus, and repaired his former denial by a subsequent confession.

Or, in the two thieves both nations, Jews and Gentiles, at first blasphemed the Lord; afterwards the latter terrified by the multitude of signs did penitence, and thus rebukes the Jews, who blaspheme to this day.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the robbers too who had been fixed with him reproached him with the same. Here, by the trope which is called σύλληψις (syllepsis), both are presented as having blasphemed, in place of one robber. But Luke asserts that, while one blasphemed, the other confessed and on the contrary rebuked the blasphemer; not that the Gospels disagree, but because at first both blasphemed, and then, when the sun fled, the earth was shaken, the rocks were split and darkness came on, one believed in Jesus and corrected his former denial by his subsequent confession. In the two robbers both peoples, of the Gentiles and of the Jews, at first blasphemed the Lord; afterwards one, terrified by the greatness of the signs, repented, and to this day rebukes the Jews when they blaspheme.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
