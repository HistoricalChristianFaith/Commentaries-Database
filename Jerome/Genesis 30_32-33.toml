[[commentary]]
quote='''
I will pass through all your flock today; separate from it every spotted and parti-coloured beast, and every beast of one colour among the lambs, and the spotted and parti-coloured among the goats, and it shall be my wage: and my justice shall answer for me tomorrow, when my wage comes before you: everything that is not spotted and parti-coloured among the goats and among the lambs shall be theft with me and so on. In the Seventy translators the sense is greatly confused, and to the present day I have been able to find none of our writers who would set out clearly what is said in this place. You want me, says Jacob, to serve you another seven years as well: do what I ask. Separate all the parti-coloured and spotted, sheep as well as goats, and hand them over into the hands of your sons; and in turn, out of each flock, give me the white and the black beasts, that is, those of one colour. If, then, anything spotted is born of the white and the black, which are of one colour, it shall be mine; but if anything of one colour, yours. I ask no difficult thing. The nature of the flocks is on your side, that white are born of white and black of black; on mine is my justice, while God looks upon my humiliation and my toil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
