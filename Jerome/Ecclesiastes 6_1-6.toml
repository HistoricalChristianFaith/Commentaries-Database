[[commentary]]
quote='''
There is an evil which I have seen under the sun, and it is frequent among men. A man to whom God has given riches and substance and glory, and nothing is lacking to his soul of all that he has desired, and God has not given him power to eat of it, but a stranger eats it. This is vanity and a most grievous sickness. If a man begets a hundred and lives many years, and the days of his years were many, and his soul is not filled with good things, and he has had no tomb, I said that the untimely birth is better than he. For it comes in vanity and goes in darkness, and in darkness its name will be hidden. And indeed it has not seen the sun nor known it; this one has rest rather than that one. And if he lives a thousand years twice over and has not seen good, do not all things hasten to one place? He describes the miserly rich man and asserts that this evil is frequent among men: that nothing of what in the world is thought good is lacking to him, and nonetheless he torments himself with the most foolish thrift, keeping it all to be devoured by others. And he also adds this hyperbolically: that even if he should beget a hundred children, and should live not, like Adam, nearly a thousand, but two thousand years, and his soul should waste away with greed and avarice, he would be of a far worse condition than the untimely birth, which perishes as soon as it is seen to be born. For that one has seen neither evils nor good things; but this one, though he possessed good things, was always tormented by sorrows and anxious thought, and the untimely birth would have rest rather than that long-lived miser; and yet both are carried off by an equal end, since this one and that one alike are taken away by a like death. This can also be understood of Israel: that God gave him the law and the prophets and the covenant and the promise, and, as the Savior says: The kingdom of God will be taken away from you and given to a nation producing its fruits, all these things have been transferred to a stranger and foreign people from the Gentiles, and the former see their good things and do not enjoy them. And that we are of a much better condition, who were reckoned like untimely births and newcomers by those who applauded themselves on their antiquity, glorying in the fathers and saying: Our father is Abraham; and yet both we and they hasten to one place, that is, to the judgment of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
