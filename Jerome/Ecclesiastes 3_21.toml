[[commentary]]
quote='''
But as for what seems to be blasphemous: Who knows whether the spirit of the sons of man itself ascends upward, and whether the spirit of the beast itself descends downward into the earth? He is not contending that between cattle and man there is no difference as regards the dignity of the soul, but by adding the word who he wished to show the difficulty of the matter. For the pronoun who is always taken in the holy Scriptures to mean not the impossible but the difficult. As there: Who will declare his generation? And in the psalm: Lord, who ascends into your tabernacle, and into your holy mountain? and the rest that follows. And in Jeremiah, although in the Hebrew it is otherwise: He is also a man, and who knows him? Between men and beasts, then, this is the only difference: that the spirit of man ascends into heaven, and the spirit of the beast descends into the earth and is dissolved with the flesh; provided, however, that some man of the Church, learned in the heavenly disciplines, is a sure asserter of this matter, doubtful as it seems. So much, for now, according to the letter.

But as far as the spiritual understanding is concerned: For men and beasts the Lord will save; and in another place: A beast, he says, am I before you; and in all the prophets men and cattle are said to be saved in Jerusalem, and the land of promise to be filled with cattle and herds. Who knows whether the holy man, who is worthy of the name of man, ascends into heaven, and whether the sinner, who is called a beast, descends into the earth? For it can happen, through the uncertain and slippery state of this life, that both the just man falls and the sinner rises; and it sometimes comes about that one who is more rational and learned in the Scriptures, that is, a man, does not live circumspectly and as befits his knowledge, and is led down to the underworld, while someone simpler and more rustic, who might be called a beast in comparison with a man, lives better and is crowned with martyrdom, and becomes a tenant of paradise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
