[[commentary]]
quote='''
When the princes of the city, who were staying in the royal house, had heard this, they crossed over, or went up from the king's house to the house of the Lord. And it is to be noted that to go to the house of the Lord is always an ascent. And they sat in the entrance of the new gate of the Lord. For it was the duty of the princes to sit in the gate of the house of the Lord and there to learn the truth of the business and of the riot. But the gate is called 'new' because those who sat in it and presided over the judgment resisted the slanders of the priests and false prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
