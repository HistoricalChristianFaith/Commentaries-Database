[[commentary]]
quote='''
The Lord has sworn by himself, or, as we read in the Hebrew, by his soul, according to what is written in Isaiah: Your new moons and sabbaths and feast days my soul hates, not that God has a soul, but that he speaks with human affections. Nor is it surprising if he is said to have a soul, since he testifies that he has the other members too, which are lower than the soul, feet and hands and belly, and the other limbs. But if those who deny that Christ had a human soul, and say instead that in the human body God was in place of the soul, should raise this against us, let them hear that in Christ the substance of a soul is shown, just as the members of his body also had substance. But in God the Father, just as the other things that are spoken of are not members, but by their names a diversity of operations is indicated, so also the soul is not substantial, but an affection of the inner mind and the seat of thoughts, through which God indicates his will. Has sworn, therefore, the Lord, the God of hosts, that is, Sabaoth — for which the Seventy translated, of powers — that he detests the pride of Jacob and hates his houses. Here, following the preceding section, where it is written: And they suffered nothing over the breaking of Joseph, take Jacob either as the ten tribes, or certainly as the whole house of the twelve tribes. And he has sworn that he will deliver up the city with its inhabitants, either Samaria, or certainly Jerusalem, or both in common. This we can refer to the time of the Lord Savior, after whose coming and passion God detested all the pride, or the insult, of Jacob, with which they cried out that he was the son of a carpenter, and a Samaritan, and had a demon. For this reason Jerusalem with its inhabitants was delivered up to the Roman armies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
