[[commentary]]
quote='''
And Ahab is reproved by the Lord concerning Naboth, when he killed him, and took his vineyard, and shed innocent blood. Elijah the prophet was sent to him, who said: 'You have killed, and moreover you have taken possession.' At once, stricken in conscience, he bowed down his neck and his eyes: and this an impious king, and clothed in purple. And afterward Scripture says that he went and put on sackcloth beneath the purple. And God, seeing this, said: 'Because Ahab has reverenced me, I will not bring evil upon him.' See therefore how much the sackcloth availed, and the fasting, and how much blood a little tear washed away. So then one ought to wear sackcloth and to fast in such a way that no one sees.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_051.html'
source_title="Homily 51, on Psalm 140"
