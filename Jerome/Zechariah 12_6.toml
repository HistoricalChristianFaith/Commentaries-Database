[[commentary]]
quote='''
On that day I will make the chiefs of Judah like a furnace of fire among wood, and like a torch of fire in hay; and they shall devour to the right and to the left all the peoples round about; and Jerusalem shall be inhabited again in her own place, in Jerusalem. And the Lord shall save the tents of Judah, as in the beginning, so that the house of David may not glory magnificently, and the glory of the inhabitants of Jerusalem against Judah. LXX: On that day I will make the tribunes of Judah like a firebrand among wood, and like hay of fire in stubble; and they shall devour on the right and on the left all the peoples of the Lord round about, and Jerusalem shall be inhabited still in herself; and the Lord shall save the tents of Judah, as from the beginning, so that the glory of the house of David may not be magnified, and the exaltation of the inhabitants of Jerusalem over Judah. When the chiefs of Judah have said in their hearts: Strengthen for me, O Lord, the besieged of Jerusalem, so that those who have been conquered through their own weakness may prevail by your help, then I, the Lord Almighty, their God, will make the princes of Judah like a furnace of fire among wood, and like a torch in stubble, so that they may devour the adversaries to whom they were joined in feigned friendship. And let them devour on the right and on the left, and slay all the peoples round about, so that Jerusalem may again be inhabited in her own place and may in no way fear hostile assaults.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
Let us say that, in the time of the Church's persecution, the chiefs and tribunes of the Christian name, of whom we spoke above, when the Lord has restored peace to Jerusalem and has slain the adversary with the spirit of his mouth, will be like a furnace of fire among wood, to devour the unfruitful trees, and like torches in stubble, so that whatever has no grain, and is carried about by every wind of doctrine, may be given over to burning. And the chiefs of Judah and the tribunes, he says, shall devour to the right and to the left those who were unwilling to walk in the middle of the road, who do not know that ὑπερβολὰς (excesses) belong to κακίας (vice); whence the people of God promises: we will turn aside neither to the right nor to the left, we will walk in the straight way. The right way is stinginess, which the Greeks call φειδολίαν; the left, extravagance; the middle and straight way, frugality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
