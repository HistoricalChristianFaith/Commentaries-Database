[[commentary]]
quote='''
Why do you teach him? Render the reasons. "That you may soften it for him from the evil days." Therefore you teach him, so that in the future you may spare him: therefore in the present you rebuke him, so that in the future you may not condemn him. For the judge's sentence is an evil to the one who endures the evils: not that the sentence is evil, but that the one suffering it, while he feels the punishment, feels a just and good sentence as evil. "Until the pit be dug for the sinner." Who is it that digs the pit for the sinner? Let us see what the prophet says elsewhere. "He opened a pit and dug it out, and he fell into the trench which he made." God, therefore, does not make the pit, but the sinner, so that he may fall into it. "The blind," he says, "if he offers guidance to the blind, both fall into the pit."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_071.html'
source_title="Homily 71, on Psalm 93 (Alternate Series)"
