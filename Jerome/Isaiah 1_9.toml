[[commentary]]
quote='''
Unless the Lord of hosts had left us a seed, we would have been as Sodom, and we would have been like Gomorrah. Paul the apostle discusses this passage more fully to the Romans, writing: I say then, has God cast away his people? God forbid: for I too am an Israelite, of the seed of Abraham, of the tribe of Benjamin. God has not cast away his people whom he foreknew (Rom 11:1, 2). And a little later: So then at this present time also a remnant has been saved according to the election of grace (ibid., 5). From this it is shown that the foregoing threats which the prophetic word uttered against Jerusalem and Judah are not to be referred to the time of the Babylonian captivity, but to the last, the Roman one, when in the Apostles the remnant of the people of the Jews was saved, and on one day three thousand believed and on another five thousand, and the Gospel was sown in the whole world. For the Lord of hosts, which we, following Aquila, have rendered in Latin, in the Hebrew is read the Lord Sabaoth, which the Seventy Translators translate in two ways according to the character of the passages, either the Lord of powers or the Lord almighty. And it must be asked whether it is said of the Father or of the Son. Nor is there any doubt that what is read in Psalm 23 (24), Lift up your gates, O princes, and be lifted up, O everlasting gates, and the king of glory shall come in. Who is this king of glory? The Lord Sabaoth (Ps 23 [24]:7, 8), that is, the Lord of powers, he is the king of glory, is referred to Christ, who after the triumph of his passion ascended victorious to the heavens. And in another place it is said of the Lord that he is the king of glory: For if they had known, they would never have crucified the Lord of glory (1 Cor 2:8). Therefore not only according to the Apocalypse of John and the apostle Paul, but in the Old Testament too, Christ is called the Lord Sabaoth, that is, the Almighty. For if all things of the Father are the Son's, and, as he himself says in the Gospel, All power has been given to me in heaven and on earth (Matt 28:18), and, All mine are yours, and I am glorified in them, why should not the name of the Almighty also be referred to Christ, so that as he is God of God and Lord of Lord, so he is the Almighty Son of the Almighty?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
