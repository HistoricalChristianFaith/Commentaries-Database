[[commentary]]
quote='''
Moreover, that you may know that there is a great distance between the simple righteous man and the wise righteous man, observe what glory each will attain in the resurrection of the dead. And many of those who sleep in the mud of the earth shall rise: these to eternal life, and those to reproach and eternal confusion. And those who understand shall shine like the splendor of the firmament, and many of the righteous like the stars for ever (Dan. 12:2). The righteous, he says, shall shine like the stars for ever; and those who understand, that is, who have knowledge of the Scriptures, like the splendor of heaven. Not that the learned man ought not also to be righteous; but that he who is righteous, unless he has been instructed, is as far from the wise righteous man as the gleam of the stars is from the light of the firmament.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
