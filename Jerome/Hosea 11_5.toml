[[commentary]]
quote='''
He will not return into the land of Egypt, and Assyria itself is his king, because they would not be converted. The sword has begun in his cities and will consume his chosen ones; and it will eat their heads, and my people will hang in suspense for my return. But a yoke will be laid upon them all together, which will not be taken away. LXX: Ephraim will dwell in Egypt, and Assyria itself is his king, because he would not be converted. And the sword has grown weak in his cities, and has rested in his hands, and they will eat of their own thoughts; and his people hangs from its sojourning, and God will be angry over his precious things, and will not exalt him. When he says: he will not return into the land of Egypt, he shows that he desires to return but cannot go. For Israel desired to return, begging for help from the Egyptians; but he was taken in possession by the Assyrian, who captured him and ruled over him by the right of the victor; and he suffered this because he would not be converted nor repent. Or at least let us say that he returned into the land of Egypt when in the holy land he worshipped the gods of the Egyptians; or it is to be taken in the sense in which it was said above: They called upon Egypt, they went away to the Assyrians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
