[[commentary]]
quote='''
There may be set against us what is written to the Corinthians: "What do you want? Shall I come to you with a rod, or in love and the spirit of gentleness" (1 Cor. 4:21)? For if there he says that he comes to sinners not in the spirit of gentleness but with a rod, how is it that here, to those who have been overtaken in some sin, he applies not the rod but the spirit of gentleness? But there it is said to those who, after their sin, not perceiving their error, were unwilling to be subject to their superiors and to be corrected by repentance. Where, however, the sinner, understanding his wound, hands himself over to the physician to be cured, there the rod is not necessary, but the spirit of mildness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
