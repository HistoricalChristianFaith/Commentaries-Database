[[commentary]]
quote='''
To whom shall I speak, and whom shall I solemnly warn, that he may hear? Behold, their ears — or your ears — are uncircumcised, and they cannot hear! Behold, the word of the Lord has become to them a reproach, and they will not receive it! They cannot hear because they were unwilling to circumcise their ears; yet the inability is not free of punishment, since it comes down from contempt and unbelief. If anyone, therefore, does not receive the words of God and has no understanding of his precepts, he is of uncircumcised ears. And at the same time it is to be noted that circumcision in the Scriptures is spoken of in three kinds: in the foreskin, in the heart, and in the ears; whence the Lord too says: He who has ears to hear, let him hear. It is by our own will, therefore, that we do not receive the word of God; and for that reason it becomes to us a reproach, so that what had been given for salvation is turned by our own fault into punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
