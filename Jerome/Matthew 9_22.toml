[[commentary]]
quote='''
He said not, Thy faith shall make thee whole, but, hath made thee whole; for in that thou hast believed, thou art already made whole.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Take heart, daughter, your faith has made you well. Daughter, for this reason, that your faith has made you well. Nor did he say: Your faith will make you well, but has made you well; for in that you believed, you have already been made well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
