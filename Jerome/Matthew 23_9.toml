[[commentary]]
quote='''
It is a difficulty that the Apostle against this command calls himself the teacher of the Gentiles; and that in monasteries in their common conversation, they call one another, Father. It is to be cleared thus. It is one thing to be father or master by nature, another by sufferance. Thus when we call any man our father, we do it to show respect to his age, not as regarding him as the author of our being. We also call men 'Master,' from resemblance to a real master; and, not to use tedious repetition, as the One God and One Son, who are by nature, do not preclude us from calling others gods and sons by adoption, so the One Father and One Master, do not preclude us from speaking of other fathers and masters by an abuse of the terms.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But since Abba means Father in the Hebrew and Syriac tongue, and our Lord in the Gospel commands that no one is to be called father except God (Matt. 23), I do not know by what license in the monasteries we either call others by this name or consent to be called by it ourselves. And certainly he gave this command who had said that one must not swear (Matt. 5). If we do not swear, let us not name anyone father either. If we interpret the saying about a father otherwise, we shall be compelled to think otherwise about swearing as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
