[[commentary]]
quote='''
Slaves, obey your fleshly masters with fear and trembling, and in the simplicity of your heart, as to Christ; not serving to the eye, as pleasing all, but as slaves of Christ, doing the will of God from the heart; serving with faithfulness as to the Lord, and not to men; knowing that whatever good each one has done, this he will receive from the Lord, whether slave or free.

When the Prophet says to Jerusalem: Who are you, that you were afraid of mortal man, and of the son of man (Isa. 51)? and Peter in his Epistle: Do not fear their fear, but sanctify the Lord Jesus Christ in your hearts (1 Pet. 3:14, 15); and the Savior is in harmony with the same: Do not fear those who can kill the body and have nothing more that they can do to you, but fear him who can kill both soul and body into Gehenna (Matt. 10:28); and Solomon too bears like witness: Son, honor the Lord, and you will be strong; but besides him fear no other (Prov. 7): the Apostle seems to command different things, that slaves should obey their fleshly masters with fear and trembling, and that the wife should fear her husband. And one who answers more simply will say this: these precepts were laid down not for perfect slaves and for those who had come to know the secrets of wisdom, but for those who had the beginnings of faith and needed humbler teachings. Another, however, would assert that he who does not have the spirit of slavery again in fear is by no means subject to this rule, that he should obey his fleshly masters with fear and trembling; and he would say the same of the wife too, who is commanded to fear her husband. A third, moreover, will think that in this passage too, as in the case of the woman, fear is said for reverence; but he will be hard pressed by the fact that trembling has been added to fear. For reverence can befit a wife, so that she fears her husband reverently. But where there is trembling, dread will not signify reverence but fear. Necessarily, then, it was added in the case of slaves that after the fear of the Lord they should have trembling too; and to distinguish him from the spiritual Lord, the master is now called fleshly: so that for a slave, whoever has believed in God and has not yet attained the summit of knowledge, it is not unbecoming to serve a fleshly master with fear and trembling, in the simplicity of his heart, and to serve him faithfully as he would Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
