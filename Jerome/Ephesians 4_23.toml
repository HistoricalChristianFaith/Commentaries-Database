[[commentary]]
quote='''
But be renewed in the spirit of your mind: and put on the new man, who was created according to God, in righteousness and holiness of truth.

We are neither renewed in the mind without the spirit, nor in the spirit without the mind; but we are renewed jointly in the spirit of our mind: so that, just as we sing psalms with the spirit and sing psalms with the mind as well, and pray with the spirit and pray with the mind as well, so we may be renewed in the spirit of our mind: so that when the mind has been made clean and purged, and is a stranger to every stain of filthy accretion, then the spirit too may be joined to it, and they may be so coupled together by a certain glue of unity that it is no longer called simply spirit, but the spirit of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
