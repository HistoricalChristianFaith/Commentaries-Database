[[commentary]]
quote='''
In what one thing is this disciple like the Scribe? The one called Him Master, the other confesses Him as his Lord. The one from filial piety asks permission to go and bury his father; the other offers to follow, not seeking a master, but by means of his master seeking gain for himself.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And another of his disciples said to him: Lord, let me first go and bury my father. What likeness is there between the scribe and the disciple? The one calls him master, the other confesses him Lord; the one, on the occasion of piety, desires to go to bury his father, the other promises that he will follow wherever he goes, seeking not the master but gain from the master.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
