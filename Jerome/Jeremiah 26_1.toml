[[commentary]]
quote='''
In the beginning of King Jehoiakim, son of Josiah, king of Judah, this word came from the Lord, saying: Thus says the Lord: Stand in the court of the house of the Lord, and you shall speak to all the cities of Judah, from which they come to worship in the house of the Lord, all the words that I have commanded you to speak to them; do not withhold a word! If perhaps they will hear and turn, each one from his evil way, and I may repent of the evil — or I may rest from the evil —, which I am thinking to do to them because of the wickedness of their pursuits. This prophecy is earlier than the former one, although it was made under the same king. For that one was made in the fourth year of Jehoiakim, son of Josiah king of Judah, but this one in the beginning of the same king, as Scripture says: in the beginning of King Jehoiakim, son of Josiah, king of Judah, this word came from the Lord, saying. Therefore, as we have often said already, the order of history is not to be woven together in the prophets, since in the present case, under the same king, earlier things are spoken afterwards and later things before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
