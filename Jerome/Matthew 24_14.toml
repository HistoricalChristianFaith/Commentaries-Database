[[commentary]]
quote='''
And the sign of the Lord's second coming is, that the Gospel shall be preached in all the world, so that all may be without excuse.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And this Gospel of the kingdom will be preached in the whole world as a testimony to all nations, and then the consummation will come. The sign of the Lord's coming is that the Gospel be preached in the whole world, so that no one may be excusable; and this we see either already fulfilled or soon to be fulfilled. For I do not think that any nation remains which does not know the name of Christ; and although it may not have had a preacher, yet from the neighboring nations it cannot be ignorant of the report of the faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
