[[commentary]]
quote='''
Why is the lamb offered up in the evening and not during the day? The reason is plain enough, for our Lord and Savior suffered his passion at the close of the ages, which is why John called it the last hour.
'''
source_url=''
source_title="SERMONS 91"

[[commentary]]
quote='''
But this mountain of the Lord was shown in the last of days, when the kingdom of heaven drew near. For indeed at the consummation of the ages, for the rejection of sins, our Savior appeared through his own victim, and came at the eleventh hour to hire laborers. And when his passion was accomplished, John says: It is the last hour; for in six thousand years, if five hundred years are allotted to each hour of the day, the time of the faith of the Gentiles will consequently be called the last hour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
