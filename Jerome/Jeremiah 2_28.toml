[[commentary]]
quote='''
Where are your gods, which you made for yourself? Let them arise and deliver you in the time of your affliction. It is a shameless request, in time of need and distress, to seek help from him whom they despised in peace. And it is to be read with the feeling of one rebuking: 'Let your gods, which you made for yourself, deliver you; so that, since God is the creator of men but man has made a god, necessity may prove what they can do whom you formerly worshiped when you were secure.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
According to the number of your cities were your gods, O Judah. The several cities worshiped either the same gods or single and different ones, so that they did not seem to have agreement even in impiety, but a superstition fighting against itself followed diverse error. And what follows: and according to the number of the streets of Jerusalem they sacrificed to Baal, was added by the Seventy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
