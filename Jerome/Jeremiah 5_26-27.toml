[[commentary]]
quote='''
For among my people there have been found ungodly men lying in wait like fowlers, setting snares and traps to catch men! As a trap full of birds, so their houses are full of deceit. That the early and the late rain might turn aside from them and all good things might not come, the causes are added: because there have been found among his people 'ungodly men'. He did not say 'unjust' and 'sinners', as the new heresy would have it, but 'ungodly'. Ungodliness openly denies God; iniquity and sin, if it confesses its error, easily bends God to mercy. And for what we have said, lying in wait like fowlers, which is not found in the Seventy, Aquila and Symmachus translated the word 'iasir' as like the net of a fowler, because even he who among them seems good and upright lays snares like a fowler, while they hunt one another to death and fill their own houses with the losses and costs of others, so that that saying of the philosophers is fulfilled: Every rich man is either unjust or the heir of an unjust man. And would that these things were done only by those who seem to be outside, and whom the Lord judges, and were not fulfilled in our own little assemblies by those whom avarice, the root of all evils, possesses, so that we look not at the faces of those who come to us, but at their hands!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
