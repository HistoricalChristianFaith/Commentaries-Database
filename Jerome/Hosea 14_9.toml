[[commentary]]
quote='''
Who is wise, and will understand these things? Understanding, and will know these things? For the ways of the Lord are right, and the just will walk in them, but transgressors will fall in them. LXX: Who is wise, and will understand these things, or understanding, and will know them? For the ways of the Lord are right, and the just will walk in them; but those who are impious will be weakened in them. When he says: Who is wise, and will understand these things? understanding, and will know them? he shows the obscurity of the book and the difficulty of its explanation. But if he himself who wrote it confesses that it is either difficult or impossible, what can we do, who, with bleary eyes darkened by the filth of sins, cannot gaze upon the brightest radiance of the sun, except say what is written: O the depth of the riches of the wisdom and knowledge of God! How inscrutable are his judgments and unsearchable his ways! For who, without Christ teaching him, can know what Jezreel signifies, what his sister Not Obtained Mercy, what the third brother Not My People; who the adulteress is, who is to sit for a long time without the law of God; what the covenant with the beasts of the earth and with the birds of heaven is; who the David is to whom the people is to return, whose resurrection is on the third day and whose going forth is compared to the dawn; what the first and the last rain are; who he is whom the prophet says is to come, to show us righteousness, or in whose type Israel is led out of Egypt, and carried in arms, and led with the cords of love; who he is who slays death, and dries up its veins and parches its springs, and plunders the vessels that were kept stored in the treasury, and the rest, which it would take long to go over again? Hence whoever is holy and just will know that the ways of the Lord are right. Now we know that the ways of the Lord are the reading of the Old and New Testament, the understanding of the holy Scriptures. Whoever walks in these ways, unless he is converted to the Lord and the veil which was before the eyes of Moses has been taken away from him, will not be able to find the right road. But if he says with David: Unveil my eyes, and I will consider the wonders of your law, he will walk in them, and will find Christ; and he will perceive that the Jews and the heretics, whom Scripture here names either transgressors or impious, stumble in them, and are weakened and fall; according to what is written: Behold, this one is set for the fall and for the rising of many in Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
