[[commentary]]
quote='''
To it God answered, using a likeness from nature: If it can happen that a mother forgets her infant, and is not moved by pity toward the offspring of her own womb, then I too will forget you. I will say something more: even if she should forget, overcoming the laws of nature by hardness of mind, yet I will not forget my creature, and I will always hold the souls of the Saints in my heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
