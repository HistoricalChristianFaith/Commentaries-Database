[[commentary]]
quote='''
By which we may understand both the disciples of John himself, and of the Saviour.

And the Prophet has lost among them both tongue and voice.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And his disciples came up and took his body and buried it, and they came and told Jesus. Josephus reports that John was beheaded in a certain town of Arabia. And what follows, His disciples came up and took the body, we can understand of the disciples both of John himself and of the Savior. And they came and told Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
