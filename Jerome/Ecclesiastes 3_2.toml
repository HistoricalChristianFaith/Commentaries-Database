[[commentary]]
quote='''
But what is the time in which the barren woman shall bring forth? As I suppose, that of which Isaiah speaks: In an acceptable time I have heard you, and in the day of salvation I have helped you. Paul too, understanding this as foretold of the time of Christ, says: Behold, now is the acceptable time; behold, now is the day of salvation. I think that this very thing is also shown mystically by what is written in Ecclesiastes: A time to bring forth, and a time to die; because at the time when the people of the Gentiles was born of the barren woman, the synagogue lost her children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
A time to give birth and a time to die. A time to plant and a time to pluck up what has been planted. No one doubts that both the rising and the passing away of men is known to God and fixed by him, and that to give birth is the same as to plant, and to die the same as to pluck up what has been planted. But since we read in Isaiah: From fear of you, O Lord, we have conceived and been in labor and given birth, this must be said: that in the perfect man that offspring which was born of fear dies, once he has begun to love God. For perfect indeed love casts out fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
