[[commentary]]
quote='''
Let us attend carefully to the words of the Apostle, who says: That you might appoint presbyters throughout the cities, as I arranged for you. Discussing in what follows what kind of presbyter ought to be ordained, he says this: "If anyone is without crime, the husband of one wife", and the rest; and afterwards he added: "For a bishop must be without crime, as the steward of God". A presbyter, therefore, is the same as a bishop; and before, at the devil's instigation, factions arose in religion, and it was said among the peoples, "I am of Paul, I of Apollos, but I of Cephas" (1 Cor. 1:12), the churches were governed by the common council of the presbyters. But after each one thought that those whom he had baptized were his own and not Christ's, it was decreed throughout the whole world that one chosen from among the presbyters should be set over the rest, to whom the whole care of the church should belong, and the seeds of schisms be removed. Should anyone think that the view that bishop and presbyter are one, and that the one (presbyter, that is, "elder") is a name of age, the other a name of office, is not that of the Scriptures but our own, let him read again the words of the Apostle to the Philippians, saying: "Paul and Timothy, servants of Jesus Christ, to all the saints in Christ Jesus who are at Philippi, with the bishops and deacons: grace to you and peace" (Phil. 1:1, 2), and the rest. Philippi is a single city of Macedonia, and certainly in one city there could not have been several bishops, as they are called. But because at that time they called the same men bishops whom they also called presbyters, for that reason he spoke of bishops indifferently as of presbyters. This may still seem doubtful to someone, unless it is proved by a second testimony. In the Acts of the Apostles it is written that when the Apostle had come to Miletus, he sent to Ephesus and called the presbyters of that church, to whom he afterwards said, among other things: "Take heed to yourselves and to all the flock, in which the Holy Spirit has placed you as bishops, to feed the Church of the Lord, which he acquired by his own blood" (Acts 20:28). And here observe more carefully how, calling the presbyters of the single city of Ephesus, he afterwards called the same men bishops. If anyone is willing to receive the Epistle written under the name of Paul to the Hebrews, there too the care of the church is divided equally among several. For he writes to the people: "Obey your rulers and be subject to them: for they are the ones who keep watch over your souls, as those who will give an account, so that they may not do this with sighing; for this is useful for you" (Heb. 13:17). And Peter, who received his name from the firmness of faith, speaks in his Epistle, saying: "The presbyters among you, therefore, I beseech, as a fellow presbyter and a witness of the sufferings of Christ, who am also a partaker of his glory which is to be revealed in the future: feed the flock of the Lord which is among you, not as under necessity, but willingly" (1 Pet. 5:1, 2). This we have said in order to show that among the ancients presbyters were the same as bishops, but that little by little, so that the seedlings of dissensions might be rooted out, the whole responsibility was conferred upon one. Just as the presbyters, then, know that by the custom of the Church they are subject to him who has been set over them, so let the bishops know that they are greater than the presbyters more by custom than by the truth of the Lord's arrangement, and that they ought to rule the church in common, imitating Moses, who, though he had it in his power to preside alone over the people of Israel, chose seventy with whom to judge the people (Num. 11). Let us see, therefore, what kind of presbyter, or bishop, is to be ordained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
