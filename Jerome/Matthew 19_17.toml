[[commentary]]
quote='''
But because he had styled Him Good Master, and had not confessed Him as God, or as the Son of God, He tells him, that in comparison of God there is no saint to be called good, of whom it is said, Confess unto the Lord, for he is good; (Ps. 118:1.) and therefore He says, There is one good, that is, God. But that none should suppose that by this the Son of God is excluded from being good, we read in another place, The good Shepherd layeth down his life for his sheep. (John 10:11.)

For Our Saviour does not reject this witness to His goodness, but corrected the error of calling Him Good Master apart from God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Why do you ask me about the good? One is good, God. Because he had called him a good teacher and had not confessed him God or the Son of God, he learns that a man, however holy, is not good in comparison with God, of whom it is said: Confess to the Lord, for he is good. But lest anyone think that, in God's being called good, the Son of God is excluded from goodness, let us read in another place: The good shepherd lays down his life for his sheep; and in the prophet, a good spirit and a good land. So the Savior too did not refuse the testimony to his goodness, but excluded the error of a teacher apart from God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
