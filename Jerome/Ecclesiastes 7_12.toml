[[commentary]]
quote='''
But the shadow of silver, or of money, we ought to take according to ἀναγωγὴν (the higher, anagogical sense), as that of which the talents and minas are gathered in the parables of the Gospel, so that, when we are under the shadow of wisdom and under the shadow of such silver: The sun will not burn us by day, nor the moon by night. But this too can be said, that our life upon the earth is a shadow: And the spirit of our face, Christ the Lord, to whom we said: In his shadow we shall live among the nations. All our protection in this life is like a shadow, whether of wisdom or of the silver mentioned above, until the day breathes and the shadows are taken away. Symmachus, after his manner, rendered more clearly in this place too, saying: As wisdom protects, so likewise money also protects. And the following little verse plainly exhorts to the pursuit of knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
