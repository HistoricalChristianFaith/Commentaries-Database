[[commentary]]
quote='''
Now it is the proper work of kings to do judgment and righteousness, and to deliver from the hand of slanderers those oppressed by force, and to give help to the stranger and the orphan and the widow, who are more easily oppressed by the powerful. And to instill in them a greater care for the precepts of God, he added: 'Do not grieve, so that you not only rescue them, but do not even allow them, through your connivance, to be grieved by others, and do not shed innocent blood in this place!' For to punish murderers and the sacrilegious and poisoners is not the shedding of blood, but the ministry of the laws.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
