[[commentary]]
quote='''
And I will raise up for them, he says, a renowned shoot (or a planting of peace) — which speaks in the Gospel: I am the true vine —, and they will no longer be diminished by famine in the land — so the famine is in earthly things; but the famine of hearing the word of God, which, under the good shepherd, and the renowned shoot, celebrated in the speech of all, and the planting of peace, will by no means be in the land —, nor will they be subject any longer to the reproaches of the nations — so that they say: Where is the Lord their God? —; and after all these things they will know, not only that he himself is the Lord — which he had also said above —, but, with an addition, that the Lord of all is properly their God, with them — who says in the Gospel to the apostles: Behold, I am with you all days, even to the consummation of the age —; and when he himself is the Lord their God, then they too will be his people: not just anyone, but those who have deserved to be called the house of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
