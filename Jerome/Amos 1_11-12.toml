[[commentary]]
quote='''
Whatever we have said about Esau and Jacob, let us refer to the Jews and the Christian people. For they, earthly and bloodthirsty, persecuted their brother Jacob, who supplanted them and took away their birthright, and they persecuted him with the sword, so that they confiscated the substance and possessions of the believers, as we read in the Acts of the Apostles; and they violated mercy and the rights of nature, and forgot their mother Rebekah, which means patience, who bore them together in Christ; and holding on to their ancient fury and wrath, to this day in their synagogues they blaspheme the Christian people under the name of Nazarenes, and provided only that they may kill us, they are willing to be burned with fire. But the Lord will send fire into Teman, into the deserted and dry places of Judea — which are by no means watered by the showers of the prophets —, and it will devour all their fortifications, or the foundations of its walls, so that, with every sense of the letter collapsing, the Church may be built up upon the foundations of Christ the Lord. In place of mercy the Seventy translated womb, and in place of fury, horror, and in place of indignation, onset, led by the ambiguity of the words, because rehem signifies both womb and mercy, aphpho both his fury and his horror; and ebrath is said both for indignation and for onset. Moreover armanoth, which we have translated houses, Aquila and Symmachus translated βάρεις, that is, houses, and Theodotion, inhabitants; the Seventy alone, both here and above, said foundations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
