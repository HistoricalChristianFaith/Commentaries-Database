[[commentary]]
quote='''
And I will scatter them like stubble that is snatched away by the wind in the desert. This is your lot and the portion of your measure from me, says the Lord or and the portion of your disobedience against me. 'Because through excessive habit of evils they could not change their nature — not by the fault of the Creator, but by the pursuit of ingrained wickedness —, therefore I will scatter them like stubble snatched away by the wind into the wilderness, according to what is written elsewhere: like the dust which the wind casts from the face of the earth'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
