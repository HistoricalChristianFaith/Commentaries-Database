[[commentary]]
quote='''
And he brought me out to the outer court, and behold, chambers, and a pavement laid with stone in the court round about, thirty chambers round about the pavement; and the pavement at the front of the gates, according to the length of the gates, was lower. And he measured the breadth from the face of the lower gate to the front of the inner court outside, a hundred cubits toward the east and toward the north. (LXX: "And he brought me into the inner court, and behold, cells and intercolumniations of the court round about, thirty cells between the columns; and porticoes behind the doors, along the length of the doors, before the columns, lower. And he measured the breadth of the court from that place which was under the open sky of the outer gate to the inner place under the open sky of the inner gate, which looked toward the outer parts, a hundred cubits, and it faced toward the east.") In place of the thirty 'cells' which the Seventy rendered, or 'chambers', and 'storerooms', as Aquila translated, Symmachus put 'exedrae'; and in place of the hundred cubits of the outer part which extended as far as the eastern gate, in the Hebrew the same number of cubits is said to extend toward the north too, but in the Seventy the name of the north has been removed. That man, then, who had the masons' cord in his hand and the measuring reed, and stood in the gate, among the other things which he showed to his sight, after the court of sixty cubits and the other vestibule of the inner gate which occupied fifty cubits, brought the prophet out to the outer court or, as is contained in the Seventy, brought him into the inner court — and I wonder greatly, according to the letter and the Seventy, how, after the outer courts occupying sixty and fifty cubits, there is an inner court which extends over spaces of a hundred cubits in breadth, unless perhaps, according to the mystical senses and the progress of those who enter, the things which were more inward in teachings are broader —; and having been brought into the inner court, or led to the outer court, as is contained in the Hebrew, he at once beheld thirty 'cells' or 'chambers' and, as Symmachus translated, 'exedrae', which had been prepared for the dwelling of the Levites and priests, and the pavement laid with stones, or intercolumniations, so that it may be shown that the inner or outer court has before the doors a row of columns and a pavement at the front of the gates, or porticoes behind the back of the gates, in which porticoes I think the columns were arranged in order, so that before the chambers there were porticoes, and at the fronts of the porticoes columns sustaining the porticoes; and the pavement which was laid with stones and extended before the porticoes of the court was lower at the ascent of the porticoes, and had the same length which the building of the cells possessed. And the same man, in whose hand were the cord and the reed, measured from the face of the lower gate or, as the Seventy would have it, of the outer gate, to the front of the inner court or gate, a hundred cubits toward the east and, as is said in the Hebrew, toward the north too. From which we understand that the saying of the Gospel which the Savior relates, of the seed sent into the field onto good ground, which multiplies its fruits according to the variety of the virtues into the number thirty and sixty and a hundred, agrees with the prophecy of this place: here too the number thirty and sixty and a hundred is set, so that by these, as by steps, we may be able to come to perfect knowledge, yet only in such a way that the number fifty leads us to the inner house, which, when the sabbath of the seven weeks is finished, breaks forth into the day of the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
