[[commentary]]
quote='''
Hence you, Israel, whose king and redeemer I am, do not fear the images, which you learned on Mount Sinai are nothing. Or is there perhaps another Creator, whom I have not known? Or besides this is there another world, to show the power of an unknown God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
