[[commentary]]
quote='''
Because to forsake is not enough, he adds that which makes perfection, and have followed thee. We have done what thou commandedst us, what reward wilt thou then give us? What shall we have?

He said not only, Ye who have left all, for this did the philosopher Cratesh, and many other who have despised riches, but added, and have followed me, which is peculiar to the Apostles and believers.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then Peter answered and said to him: Behold, we have left all things and have followed you; what then will there be for us? Great confidence! Peter was a fisherman, he had not been rich, he sought his food by hand and craft, and yet he speaks confidently: we have left all things. And because merely leaving is not enough, he joins what is perfect: and have followed you. We have done what you commanded; what reward, then, will you give us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
