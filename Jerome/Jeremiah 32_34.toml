[[commentary]]
quote='''
And they set their idols in the house in which my name is invoked, to pollute it. Not only at that time did Judah set up in the temple of God the statue of an idol of which we read at the beginning of Ezekiel, but to this day in the house of God, which is interpreted as the Church, or in the heart and soul of believers, an idol is set up when a new dogma is constructed and, according to Deuteronomy, is worshiped in secret; do you not know, he says, that you are the temple of God and the Spirit of God dwells in you?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
