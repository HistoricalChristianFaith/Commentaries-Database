[[commentary]]
quote='''
It is a day of darkness and of distress, a day of cloud and whirlwind; for all things are full of punishments and torments. A people of angels, many and strong, will come, to render to each according to his works; and as the morning and the rising dawn first takes hold of the mountains, so judgment will begin from the lofty and the powerful, that the mighty may suffer torments mightily. There has not been its like from the beginning, and after it there will not be, even to the years of generation and generation. For all the evils which are contained in the ancient histories, and which befell men either by the flooding of the sea, or by the overflowing of rivers, or by pestilence, diseases, famine, beasts, the devastation of enemies, cannot be compared with these punishments which are to be rendered on the day of judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
