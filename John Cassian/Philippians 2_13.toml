[[commentary]]
quote='''
Further the blessed David asks of the Lord that he may gain that very understanding, by which he can recognize God's com- rounds which, he well knew, were written in the book of the law, and he says "I am Thy servant: O give me understanding that I may learn Thy commandments." Certainly he was in possession of understanding, which had been granted to him by nature, and also had at his fingers' ends a knowledge of God's commands which were preserved in writing in the law: and still he prayed the Lord that he might learn this more thoroughly as he knew that what came to him by nature would never be sufficient for him, unless his understanding was enlightened by the Lord by a daily illumination from Him, to understand the law spiritually and to recognize His commands more clearly, as the "chosen vessel" also declares very plainly this which we are insisting on. "For it is God which worketh in you both to will and to do according to good will." What could well be clearer than the assertion that both our good will and the completion of our work are fully wrought in us by the Lord?
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 15"

[[commentary]]
quote='''
And SO we can escape the snare of this most evil spirit, if in the case of every virtue in which we feel that we make progress, we say these words of the Apostle: "Not I, but the grace of God with me," and "by the grace of God I am what I am;" and "it is God that worketh in us both to will and to do of His good pleasure."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 9"
