[[commentary]]
quote='''
Germanus: We say that this does not apply to the persons either of those who are involved in capital offences, or of an Apostle and those who have advanced to his measure, but we think that it ought properly to be taken of those who after receiving the grace of God and the knowledge of the truth, are anxious to keep themselves from carnal sins but, as ancient custom like a natural law rules most forcibly in their members, they are carried away to the ingrained lust of their passions. For the custom and frequency of sinning becomes like a natural law, which, implanted in the man's weak members, leads the feelings of the soul that is not yet instructed in all the pursuits of virtue, but is still, if I may say so, of an uninstructed and tender chastity, captive to sin and subjecting them by an ancient law to death, brings them under the yoke of sin that rules over them, not suffering them to obtain the good of purity which they love, but rather forcing them to do the evil which they hate.

Theonas: Your notion does not come to much; as you yourselves have actually now begun to maintain that this cannot possibly stand in the person of those who are out and out sinners, but that it properly applies to those who are trying to keep themselves clear from carnal sins. And since you have already separated these from the number of sinners, it follows that you must shortly admit them into the ranks of the faithful and holy. For what kinds of sin do you say that those can commit, from which, if they are involved in them after the grace of baptism, they can be freed by the daily grace of Christ? or of what body of death are we to think that the Apostle said: "Who shall deliver me from the body of this death? Thanks be to God through Jesus Christ our Lord"? Is it not clear, as truth compels you yourselves also to admit, that it is spoken not of those members of capital crimes, by which the wages of eternal death are gained; viz., murder, fornication, adultery, drunkenness, thefts and robberies, but of that body before mentioned, which the daily grace of Christ assists? For whoever after baptism and the knowledge of God falls into that death, must know that he will either have to be cleansed, not by the daily grace of Christ, i.e., an easy forgiveness, which our Lord when at any moment He is prayed to, is wont to grant to our errors, but by a lifelong affliction of penitence and penal sorrow, or else will be hereafter consigned to the punishment of eternal fire for them, as the same Apostle thus declares: "Be not deceived: neither fornicators, nor idolaters, nor adulterers, nor effeminate, nor defilers of themselves with mankind, nor thieves, nor covetous persons, nor drunkards, nor railers, nor extortioners shall possess the kingdom of God." Or what is that law warring in our members which resists the law of our mind, and when it has led us resisting but captives to the law of sin and death, and has made us serve it with the flesh, nevertheless suffers us to serve the law of God with the mind? For I do not suppose that this law of sin denotes crimes or can be taken of the offences mentioned above, of which if a man is guilty he does not serve the law of God with the mind, from which law he must first have departed in heart before he is guilty of any of them with the flesh. For what is it to serve the law of sin, but to do what is commanded by sin? What sort of sin then is it to which so great holiness and perfection feels that it is captive, and yet doubts not that it will be freed from it by the grace of Christ, saying: "O wretched man that I am! Who shall deliver me from the body of this death? Thanks be to God through Jesus Christ our Lord"? What law, I ask, will you maintain to be implanted in our members, which, withdrawing us from the law of God and bringing us into captivity to the law of sin, could make us wretched rather than guilty so that we should not be consigned to eternal punishment, but still as it were sigh for the unbroken joys of bliss, and, seeking for a helper who shah restore us to it, exclaim with the Apostle: 'O wretched man that I am! Who shaft deliver me from the body of this death?" For what is it to be led captive to the law of sin but to continue to perform and commit sin? Or what other chief good can be given which the saints cannot fulfil, except that in comparison with which, as we said above, everything else is not good? Indeed we know that many things in this world are good, and chiefly, modesty, continence, sobriety, humility, justice, mercy, temperance, piety: but all of these things fail to come up to that chief good, and can be done I say not by apostles, but even by ordinary folk; and, those by whom they are not done, are either chastised with eternal punishment, or are set free by great exertions, as was said above, of penitence, and not by the daily grace of Christ. It remains then for us to admit that this saying of the Apostle is rightly applied only to the persons of saints, who day after day falling under this law, which we described, of sin not of crimes, are secure of their salvation and not precipitated into wicked deeds, but, as has often been said, are drawn away from the contemplation of God to the misery of bodily thoughts, and are often deprived of the blessing of that true bliss. For if they felt that by this law of their members they were bound daily to crimes, they would complain of the loss not of happiness but of innocence, and the Apostle Paul would not say: "O wretched man that I am," but "Impure," or "Wicked man that I am," and he would wish to be rid not of the body of this death, i.e., this mortal state, but of the crimes and misdeeds of this flesh. But because by reason of his state of human frailty he felt that he was captive, i.e., led away to carnal cares and anxieties which the law of sin and death causes, he groans over this law of sin under which against his will he had fallen, and at once has recourse to Christ and is saved by the present redemption of His grace. Whatever of anxiety therefore that law of sin, which naturally produces the thorns and thistles of mortal thoughts and cares, has caused to spring up in the ground of the Apostle's breast, that the law of grace at once plucks up. "For the law," says he, "of the spirit of life in Christ Jesus hath set me free from the law of sin and death."

This then is that body of death from which we cannot escape, pent in which those who are perfect, who have tasted "how gracious the Lord is," daily feel with the prophet "how bad for himself and bitter it is for a man to depart from the Lord his God." This is the body of death which restrains us from the heavenly vision and drags us back to earthly things, which causes men while singing Psalms and kneeling in prayer to have their thoughts filled with human figures, or conversations, or business, or unnecessary actions. This is the body of death, owing to which those, who would emulate the sanctity of angels, and who long to cling continually to God, yet are unable to arrive at the perfection of this good, because the body of death stands in their way, but they do the evil that they would not, i.e., they are dragged down in their minds even to the things which have nothing to do with their advance and perfection in virtue. Finally that the blessed Apostle might clearly denote that he said this of saintly and perfect men, and those like himself, he in a way points with his finger to himself and at once proceeds: "And so I myself," i.e, I who say this, lay bare the secrets of my own not another's conscience. This mode of speech at any rate the Apostle is familiarly accustomed to use, whenever he wants to point specially to himself, as here: "I, Paul, myself beseech you by the mildness and modesty of Christ;" and again: "except that I myself was not burdensome to you;" and once more: "But be it so: I myself did not burden you;" and elsewhere: "I, Paul, myself say unto you: if ye be circumcised Christ shall profit you nothing;" and to the Romans: "For I could wish that I myself were Anathema from Christ for my brethren." But it cannot unreasonably be taken in this way, that "And so I myself" is expressly said with emphasis, i.e., I whom you know to be an Apostle of Christ, whom you venerate with the utmost respect, whom you believe to be of the highest character and perfect, and one in whom Christ speaks, though with the mind I serve the law of God, yet with the flesh I confess that I serve the law of sin, i.e., by the occupations of my human conditionam sometimes dragged down from heavenly to earthly things and the height of my mind is brought down to the level of care for humble matters. And by this law of sin I find that at every moment I am so taken captive that although I persist in my immovable longing around the law of God, yet in no way can I escape the power of this captivity, unless I always fly to the grace of the Saviour.
'''
