[[commentary]]
quote='''
Our sixth combat is with what the Greeks call a0khdi/a, which we may term weariness or distress of heart. This is akin to dejection, and is especially trying to solitaires, and a dangerous and frequent foe to dwellers in the desert; and especially disturbing to a monk about the sixth hour, like some fever which seizes him at stated times, bringing the burning heat of its attacks on the sick man at usual and regular hours. Lastly, there are some of the elders who declare that this is the "midday demon" spoken of in the ninetieth Psalm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 1"
