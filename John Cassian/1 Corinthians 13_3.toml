[[commentary]]
quote='''
A renunciation then in body alone, and a mere change of place from Egypt will not do us any good, if we do not succeed in achieving that renunciation in heart, which is far higher and more valuable. For of that mere bodily renunciation of which we have spoken the apostle declares as follows: "Though I bestow all my goods to feed the poor, and give my body to be burned, but have not charity, it profiteth me nothing." And the blessed Apostle would never have said this had it not been that he foresaw by the spirit that some who had given all their goods to feed the poor would not be able to attain to evangelical perfection and the lofty heights of charity, because while pride or impatience ruled over their hearts they were not careful to purify themselves from their former sins, and unrestrained habits, and on that account could never attain to that love of God which never faileth, and these, as they fall short in this second stage of renunciation, can still less reach that third stage which is most certainly far higher. But consider too in your minds with great care the fact that he did not simply say "If I bestow my goods." For it might perhaps be thought that he spoke of one who had not fulfilled the command of the gospel, but had kept back something for himself, as some half-hearted persons do. But he says "Though I bestow all my goods to feed the poor," i.e., even if my renunciation of those earthly riches be perfect. And to this renunciation he adds something still greater: "And though I give my body to be burned, but have not charity, I am nothing:" As if he had said in other words, though I bestow all my goods to feed the poor in accordance with that command in the gospel, where we are told "If thou wilt be perfect, go sell all that thou hast, and give to the poor, and thou shalt have treasure in heaven," renouncing them so as to keep back nothing at all for myself, and though to this distribution (of my goods) I should by the burning of my flesh add martyrdom so as to give up my body for Christ, and yet be impatient, or passionate or envious or proud, or excited by wrongs done by others, or seek what is mine, or indulge in evil thoughts, or not be ready and patient in bearing all that can be inflicted on me, this renunciation and the burning of the outer man will profit me nothing, while the inner man is still involved in the former sins, because, while in the fervour of the early days of my conversion I made light of the mere worldly substance, which is said to be not good or evil in itself but indifferent, I took no care to cast out in like manner the injurious powers of a bad heart, or to attain to that love of the Lord which is patient, which is "kind, which envieth not, is not puffed up, is not soon angry, dealeth not perversely, seeketh not her own, thinketh no evil," which "beareth all things, endureth all things," and which lastly never suffers him who follows after it to fall by the deceitfulness of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 7"
