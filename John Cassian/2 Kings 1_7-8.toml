[[commentary]]
quote='''
A monk, then, as a soldier of Christ ever ready for battle, ought always to walk with his loins girded. For in this fashion, too, the authority of Holy Scripture shows that they walked who in the Old Testament started the original of this life,-I mean Elijah and Elisha; and, moreover, we know that the leaders and authors of the New Testament, viz., John, Peter, and Paul, and the others of the same rank, walked in the same manner. And of these the first-mentioned, who even in the Old Testament displayed the flowers of a virgin life and an example of chastity and continence, when he had been sent by the Lord to rebuke the messengers of Ahaziah, the wicked king of Israel, because when confined by sickness he had intended to consult Beelzebub, the god of Ekron, on the state of his health, and thereupon the said prophet had met them and said that he should not come down from the bed on which he lay,-this man was made known to the bed-ridden king by the description of the character of his clothing. For when themessengers returned to him and brought back the prophet's message, he asked what the man who had met them and spoken such words was like and how he was dressed. "An hairy man," they said, "and girt with a girdle of leather about his loins;" and by this dress the king at once saw that it was the man of God, and said: "It is Elijah the Tishbite:" i.e., by the evidence of the girdle and the look of the hairy and unkempt body he recognized without the slightest doubt the man of God, because this was always attached to him as he dwelt among so many thousands of Israelites, as if it were impressed as some special sign of his own particular style.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25201.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 1, Chapter 1"
