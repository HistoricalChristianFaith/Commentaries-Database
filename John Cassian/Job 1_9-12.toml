[[commentary]]
quote='''
For Holy Scripture bears witness that two angels, a good and a bad one, cling to each one of us. And of the good ones the Saviour says: "Do not despise one of these little ones; for I say unto you that their angels in heaven do always behold the face of thy Father which is in heaven:" and this also: "the angel of the Lord shall encamp round about them that fear Him, and deliver them." Moreover this also which is said in the Acts of the Apostles, of Peter, that "it is his angel." But of both sorts the book of the Shepherd teaches us very fully. But if we consider about him who attacked the blessed Job we shall clearly learn that it was he who always plotted against him but never could entice him to sin, and that therefore he asked for power from the Lord, as he was worsted not by his (Job's) virtue but by the Lord's protection which ever shielded him. Of Judas also it is said: "And let the devil stand at his right hand."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 17"

[[commentary]]
quote='''
And this too we read that the Divine righteousness provided for in the case of Job His well tried athlete, when the devil had challenged him to single combat. For if he had advanced against his foe, not with his own strength, but solely with the protection of God's grace; and, supported only by Divine aid without any virtue of patience on his own part, had borne that manifold weight of temptations and losses, contrived with all the cruelty of his foe, how would the devil have repeated with some justice that slanderous speech which he had previously uttered: "Doth Job serve God for nought? Hast Thou not hedged him in, and all his substance round about? but take away thine hand," i.e., allow him to fight with me in his own strength, "and he will curse Thee to Thy face." But as after the struggle the slanderous foe dare not give vent to any such murmur as this, he admired that he was vanquished by his strength and not by that of God; although too we must not hold that the grace of God was altogether wanting to him, which gave to the tempter a power of tempting in proportion to that which it knew that he had of resisting, without protecting him from his attacks in such a way as to leave no room for human virtue, but only providing for this; viz., that the most fierce foe should not drive him out of his mind and overwhelm him when weakened, with unequal thoughts and in an unfair contest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 14"
