[[commentary]]
quote='''
And, therefore, they do not even attempt to finish the Psalms, which they sing in the service, by an unbroken and continuous recitation. But they repeat them separately and bit by bit, divided into two or three sections, according to the number of verses, with prayers in between. For they do not care about the quantity of verses, but about the intelligence of the mind; aiming with all their might at this: "I will sing with the spirit: I will sing also with the understanding." And so they consider it better for ten verses to be sung with understanding and thought than for a whole Psalm to be poured forth with a bewildered mind. And this is sometimes caused by the hurry of the speaker, when, thinking of the character and number of the remaining Psalms to be sung, he takes no pains to make the meaning clear to his hearers, but hastens on to get to the end of the service.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25202.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 2, Chapter 11"
