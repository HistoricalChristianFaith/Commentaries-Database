[[commentary]]
quote='''
But there are some which, unless they are weakened down by an allegorical interpretation, and softened by the trial of the fire of the spirit cannot become wholesome food for the inner man without injury and loss to him; and damage rather than profit will accrue to him from receiving them: as with this passage: "But let your loins be girded up and your lights burning;" and: "whosoever has no sword, let him sell his coat and buy himself a sword;" and: "whosoever taketh not up his cross and followeth after Me is not worthy of Me;" a passage which some most earnest monks, having "indeed a zeal for God, but not according to knowledge" understood literally, and so made themselves wooden crosses, and carried them about constantly on their shoulders, and so were the cause not of edification but of ridicule on the part of all who saw them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 3"
