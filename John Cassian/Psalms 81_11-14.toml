[[commentary]]
quote='''
But it is right for us to hold with unswerving faith that nothing whatever is done in this world without God. For we must acknowledge that everything is done either by His will or by His permission, i.e., we must believe that whatever is good is carried out by the will of God and by His aid, and whatever is the reverse is done by His permission, when the Divine Protection is withdrawn from us for our sins and the hardness of our hearts, and suffers the devil and the shameful passions of the body to lord it over us. And the words of the Apostle most assuredly teach us this, when he says: "For this cause God delivered them up to shameful passions:" and again: "Because they did not like to have God in their knowledge, God delivered them up to a reprobate sense, to do those things which are not convenient." And the Lord Himself says by the prophet: "But My people did not hear My voice and Israel did not obey me: Wherefore I gave them up unto their own hearts' lusts. They shall walk after their own inventions."

Germanus: This passage very clearly shows the freedom of the will, where it is said "If My people would have hearkened unto Me," and elsewhere "But My people would not hear My voice." For when He says "If they would have heard" He shows that the decision to yield or not to yield lay in their own power. How then is it true that our salvation does not depend upon ourselves, if God Himself has given us the power either to hearken or not to hearken?

Paphnutius: You have shrewdly enough noticed how it is said "If they would have hearkened to Me:" but have not sufficiently considered either who it is who speaks to one who does or does not hearken; or what follows: "I should soon have put down their enemies, and laid My hand on those that trouble them." Let no one then try by a false interpretation to twist that which we brought forward to prove that nothing can be done without the Lord, nor take it in support of free will, in such a way as to try to take away from man the grace of God and His daily oversight, through this test: "But My people did not hear My voice," and again: "If My people would have hearkened unto Me, and if Israel would have walked in My ways, etc.:" but let him consider that just as the power of free will is evidenced by the disobedience of the people, so the daily over- sight of God who declares and admonishes him is also shown. For where He says "If My people would have hearkened unto Me" He clearly implies that He had spoken to them before. And this the Lord was wont to do not only by means of the written law, but also by daily exhortations, as this which is given by Isaiah: "All day long have I stretched forth My hands to a disobedient and gain-saying people." Both points then can be supported from this passage, where it says: "If My people would have hearkened, and if Israel had walked in My ways, I should soon have put down their enemies, and laid My hand on those that trouble them." For just as free will is shown by the disobedience of the people, so the government of God and His assistance is made clear by the beginning and end of the verse, where He implies that He had spoken to them before, and that afterwards He would put down their enemies, if they would have hearkened unto Him. For we have no wish to do away with man's free will by what we have said, but only to establish the fact that the assistance and grace of God are necessary to it every day and hour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapters 20-22"
