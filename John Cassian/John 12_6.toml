[[commentary]]
quote='''
Would you like to know how dangerously and harmfully that incitement, unless it has been carefully eradicated, will shoot up for the destruction of its owner, and put forth all sorts of branches of different sins? Look at Judas, reckoned among the number of the apostles, and see how because he would not bruise the deadly head of this serpent it destroyed him with its poison, and how when he was caught in the snares of concupiscence, it drove him into sin and a headlong downfall, so that he was persuaded to sell the Redeemer of the world and the author of man's salvation for thirty pieces of silver. And he could never have been impelled to this heinous sin of the betrayal if he had not been contaminated by the sin of covetousness: nor would he have made himself wickedly guilty of betraying the Lord, unless he had first accustomed himself to rob the bag intrusted to him.

This is a sufficiently dreadful and clear instance of this tyranny, which, when once the mind is taken prisoner by it, allows it to keep to no rules of honesty, nor to be satisfied with any additions to its gains. For we must seek to put an end to this madness, not by riches, but by stripping ourselves of them. Lastly, when he (viz. Judas) had received the bag set apart for the distribution to the poor, and intrusted to his care for this purpose, that he might at least satisfy himself with plenty of money, and set a limit to his avarice, yet his plentiful supply only broke out into a still greedier incitement of desire, so that he was ready no longer secretly to rob the bag, but actually to sell the Lord Himself. For the madness of this avarice is not satisfied with any amount of riches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25207.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 7, Chapters 23-24"
