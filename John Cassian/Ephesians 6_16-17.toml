[[commentary]]
quote='''
And what is the character of the arms of this centurion, and for what use in battle they are, hear the blessed Apostle declaring: "The arms," he says "of our warfare are not carnal, but mighty to God." He tells us their character; viz., that they are not carnal or weak, but spiritual and mighty to God. Then he next suggests in what struggles they are to be used: "Unto the pulling down of fortifications, purging the thoughts, and every height that exalteth itself against the knowledge of God, and bringing into captivity every understanding unto the obedience of Christ, and having in readiness to avenge all disobedience, when your obedience shall be first fulfilled." And since though useful, it yet belongs to another time to run through these one by one, I only want you to see the different sorts of these arms and their characteristics, as we also ought always to walk with them girt upon us if we mean to fight the Lord's battles and to serveamong the centurions of the gospel. "Take," he says "the shield of faith, wherewith ye may be able to quench all the fiery darts of the evil one." Faith then is that which intercepts the flaming darts of lust, and destroys them by the fear of future judgment, and belief in the heavenly kingdom. "And the breastplate," he says, "of charity." This indeed is that which going round the vital parts of the breast and protecting what is exposed to the deadly wounds of swelling thoughts, keeps off the blows opposed to it, and does not allow the darts of the devil to penetrate to our inner man. For it "endureth all things, suffereth all things, beareth all things." "And for an helmet the hope of salvation." The helmet is what protects the head. As then Christ is our head, we ought always in all temptations and persecutions to protect it with the hope of future good things to come, and especially to keep faith in Him whole and undefiled. For it is possible for one who has lost other parts of the body, weak as he may be, still to survive: but even a short time of living is extended to no one without a head. "And the sword of the Spirit which is the word of God." For it is "sharper than any two-edged sword, and piercing even to the dividing of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart:" as it divides and cuts off whatever carnal and earthly things it may find in us. And whosoever is protected by these arms will ever be defended from the weapons and ravages of his foes, and will not be led away bound in the chains of his spoilers, a captive and a prisoner, to the hostile land of vain thoughts, nor hear the words of the prophet: "Why art thou grown old in a strange country?" But he will stand like a triumphant conqueror in the land of thoughts which he has chosen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 5"
