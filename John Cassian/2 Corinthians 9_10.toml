[[commentary]]
quote='''
From which we clearly infer that the initiative not only of our actions but also of good thoughts comes from God, who inspires us with a good will to begin with, and supplies us with the opportunity of carrying out what we rightly desire: for "every good gift and every perfect gift cometh down from above, from the Father of lights," who both begins what is good, and continues it and completes it in us, as the Apostle says: "But He who giveth seed to the sower will both provide bread to eat and will multiply your seed and make the fruits of your righteousness to increase."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 3"
