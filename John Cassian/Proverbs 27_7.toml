[[commentary]]
quote='''
For although the narration of holy things be often repeated, yet in a mind that feels a thirst for true knowledge the satiety will never create disgust, but as it receives it every day as if it were something new and what it wanted however often it may have taken it in, it will so much the more eagerly either hear or speak, and from the repetition of these things will gain confirmation of the knowledge it already possesses, rather than weariness of any sort from the frequent Conference. For it is a sure sign of a mind that is cold and proud, if it receives with disdain and carelessness the medicine of the words of salvation, although it be offered with the zeal of excessive persistence. For "a soul that is full jeers at honeycomb: but to a soul that is in want even little things appear sweet."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 13"
