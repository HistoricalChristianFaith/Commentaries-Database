[[commentary]]
quote='''
But we ought to consider those men truly wretched and miserable in whose case, although they defile themselves with all kinds of sins and wickedness, yet not only is there no visible sign of the devil's possession shown in them, nor is any temptation proportionate to their actions, nor any scourge of punishment brought to bear upon them. For they are vouchsafed no swift and immediate remedy in this world, whose "hardness and impenitent heart," being too much for punishment in this life, "heapeth up for itself wrath and indignation in the day of wrath and revelation of the righteous judgment of God," "where their worm dieth not, and their fire is not quenched." Against whom the prophet as if perplexed at the affliction of the saints, when he sees them subject to various losses and temptations, and on the other hand sees sinners not only passing through the course of this world without any scourge of humiliation, but even rejoicing in great riches, and the utmost prosperity in everything, inflamed with uncontrollable indignation and fervour of spirit, exclaims: "But as for me, my feet had almost gone, my treadings had well nigh slipped. For I was grieved at the wicked, when I saw the peace of sinners. For there is no regard to their death, nor is there strength in their stripes. They are not in the labour of men, neither shall they be scourged like other men," since hereafter they shall be punished with the devils, to whom in this world it was not vouchsafed to be scourged in the lot and discipline of sons, together with men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 31"
