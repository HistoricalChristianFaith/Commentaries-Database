[[commentary]]
quote='''
When then anyone is overcome by a wrong, and blazes up in a fire of anger, we should not hold that the bitterness of the insult offered to him is the cause of his sin, but rather the manifestation of secret weakness, in accordance with the parable of our Lord and Saviour which He spoke about the two houses, one of which was founded upon a rock, and the other upon the sand, on both of which He says that the tempest of rain and waters and storm beat equally: but that one which was founded on the solid rock felt no harm at all from the violence of the shock, while that which was built on the shifting and moving sand at once collapsed. And it certainly appears that it fell, not because it was struck by the rush of the storms and torrents. but because it was imprudently built upon the sand. For a saint does not differ from a sinner in this, that he is not himself tempted in the same way, but because he is not worsted even by a great assault, while the other is overcome even by a slight temptation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 13"
