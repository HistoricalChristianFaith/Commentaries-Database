[[commentary]]
quote='''
Germanus: And whence can there be aroused in us this holy and salutary contrition from humiliation, which is described as follows in the person of the penitent: "I have acknowledged my sin, and mine unrighteousness have I not hid. I said: I will acknowledge against myself mine unrighteousness to the Lord," so that we may be able effectually to say also what follows: "And Thou forgavest the iniquity of my heart;" or how, when we kneel in prayer shall we be able to stir ourselves up to tears of confession, by which we may be able to obtain pardon for our offences, according to these words: "Every night will I wash my bed: I will water my couch with tears;" if we expel from our hearts all recollection of our faults, though on the contrary we are bidden carefully to preserve the remembrance of them, as the Lord says: "And thine iniquities I will not remember: but do thou recollect them?" Wherefore not only when I am at work, but also when I am at prayer I try of set purpose to recall to my mind the recollection of my sins, that I may be more effectually inclined to true humility and contrition of heart, and venture to say with the prophet: "Look upon my humility and my labour: and forgive me all my sins."

Pinufius: Your question, as has been already said above, was not raised with regard to the character of penitence, but with regard to its end, and the marks of satisfaction: to which, as I think, a fair and pertinent reply has been given. But what you have said as to the remembrance of sins is sufficiently useful and needful to men who are still doing penance, that they may with constant smiting of the breast say: "For I acknowledge my wickedness: and my sin is ever before me;" and this too: "And I will think for my sin." While then we do penance, and are still grieved by the recollection of faulty actions, the shower of tears which is caused by the confession of our faults is sure to quench the fire of our conscience. But when, while a man is still in this state of humility of heart and contrition of spirit and continuing to labour and to weep, the remembrance of these things fades away, and the thorns of conscience are by God's grace extracted from his inmost heart, then it is clear that he has attained to the end of satisfaction and the reward of pardon, and that he is purged from the stain of the sins he has committed. To which state of forgetfulness we can only attain by the obliteration of our former sins and likings, and by perfect and complete purity of heart. And this most certainly will not be attained by any of those who from sloth or carelessness have failed to purge out their faults, but only by one who by constantly continuing to groan and sigh sorrowfully has removed every spot of his former stains, and by the goodness of his heart and his labour has proclaimed to the Lord: "I have acknowledged my sin, and mine unrighteousness have I not hid;" and: "My tears have been my meat day and night;" so that in the end it may be vouchsafed to him to hear these words: "Let thy voice cease from weeping, and thine eyes from tears: for there is a reward for thy labour, saith the Lord;" and these words also may be uttered of him by the voice of the Lord: "I have blotted out as a cloud thine iniquities, and as a mist thy sins:" and again: "I even I am He that blotteth out thine iniquities for mine own sake, and thine offences I will no longer remember;" and so, when he is freed from the "cords of his sins," by which "everyone is bound," he will with all thanksgiving sing to the Lord: "Thou hast broken my chains: I will offer to thee the sacrifice of praise."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F20.%2520Conference%2520of%2520Abbot%2520Pinufius.html'
source_title="Conference of Abbot Pinufius, Chapters 6-7"
