[[commentary]]
quote='''
And SO it is most clearly established by instances and testimonies from Scripture that the mischief of pride, although it comes later in the order of the combat, is yet earlier in origin, and is the beginning of all sins and faults: nor is it (like the other vices) simply fatal to the virtue opposite to it (in this case, humility), but it is also at the same time destructive of all virtues: nor does it only tempt ordinary folk and small people, but chiefly those who already stand on the heights of valour. For thus the prophet speaks of this spirit, "His meat is choice."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 6"
