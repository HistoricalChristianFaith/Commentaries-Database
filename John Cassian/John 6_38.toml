[[commentary]]
quote='''
Then how can any seeds of discussion arise from him who serves not his own but his brother's will, and becomes a follower of his Lord and Master, who speaking in the character of man which He had taken, said: "I am not come to do Mine own will, but the will of Him that sent Me?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 6"

[[commentary]]
quote='''
Finally even if there is any diminution of my purity of heart while I am living in the coenobium, I shall be satisfied by keeping in exchange that one precept of the Gospel, which certainly cannot be less esteemed than all those fruits of the desert; I mean that I should take no thought for the morrow, and submitting myself completely to the Abbot seem in some degree to emulate Him of whom it is said: "He humbled Himself, and became obedient unto death; and so be able humbly to make use of His words: "For I came not to do mine own will, but the will of the Father which sent me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F19.%2520Conference%2520of%2520Abbot%2520John.html'
source_title="Conference of Abbot John, Chapter 6"
