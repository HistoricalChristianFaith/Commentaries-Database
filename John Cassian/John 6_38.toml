[[commentary]]
quote='''
Then how can any seeds of discussion arise from him who serves not his own but his brother's will, and becomes a follower of his Lord and Master, who speaking in the character of man which He had taken, said: "I am not come to do Mine own will, but the will of Him that sent Me?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 6"
