[[commentary]]
quote='''
Beware therefore lest at any time you take again any of those things which you renounced and forsook, and, contrary to the Lord's command, return from the field of evangelical work, and be found to have clothed yourself again in your coat which you had stripped off; neither sink back to the low and earthly lusts and desires of this world, and in defiance of Christ's word come down from the rod of perfection and dare to take up again any of those things which you have renounced and forsaken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25204.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 4, Chapter 36"

[[commentary]]
quote='''
IF then through the desire of perfection you have forsaken all things and followed Christ who says to thee, "Go sell all that thou hast, and give to the poor, and thou shalt have treasure in heaven: and come follow me," why, having put your hand to the plough, do you look back, so that you will be declared by the voice of the same Lord not to be fit for the kingdom of heaven? When secure on the top of the gospel roof, why do you descend to carry away something from the house, from those things, namely, which beforetime you despised? When you are out in the field and working at the virtues, why do you run back and try to clothe yourself again with what belongs to this world, which you stripped off when you renounced it?
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25207.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 7, Chapter 27"
