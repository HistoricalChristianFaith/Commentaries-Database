[[commentary]]
quote='''
We shall then be ambidextrous, when neither abundance nor want affects us, and when the former does not entice us to the luxury of a dangerous carelessness, while the latter does not draw us to despair, and complaining; but when, giving thanks to God in either case alike, we gain one and the same advantage out of good and bad fortune. And such that truly ambidextrous man, the teacher of the Gentiles, testifies that he himself was, when he says: "For I have learnt in whatsoever state I am, to be content therewith. I know both how to be brought low and I know how to abound: everywhere and in all things I am instructed both to be full and to De hungry, both to abound and to suffer need. I can do all things in Him which strengtheneth me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F6.%2520Conference%2520of%2520Abbot%2520Theodore.html'
source_title="Conference of Abbot Theodore, Chapter 10"
