[[commentary]]
quote='''
And therefore in order that prayer may be offered up with that earnestness and purity with which it ought to be, we must by all means observe these rules. First all anxiety about carnal things must be entirely got rid of; next we must leave no room for not merely the care but even the recollection of any business affairs, and in like manner also must lay aside all backbitings, vain and incessant chattering, and buffoonery; anger above all and disturbing moroseness must be entirely destroyed, and the deadly taint of carnal lust and covetousness be torn up by the roots. And so when these and such like faults which are also visible to the eyes of men, are entirely removed and cut off, and when such a purification and cleansing, as we spoke of, has first taken place, which is brought about by pure simplicity and innocence, then first there must be laid the secure foundations of a deep humility, which may be able to support a tower that shall reach the sky; and next the spiritual structure of the virtues must be built up upon them, and the soul kept free from all conversation and from roving thoughts that thus it may by little and little begin to rise to the contemplation of God and to spiritual insight. For whatever our mind has been thinking of before the hour of prayer, is sure to occur to us while we are praying through the activity of the memory. Wherefore what we want to find ourselves like while we are praying, that we ought to prepare ourselves to be before the time for prayer. For the mind in prayer is formed by its previous condition, and when we are applying ourselves to prayer the images of the same actions and words and thoughts will dance before our eyes, and make us either angry, as in Our previous condition, or gloomy, or recall our former lust and business, or make us shake with foolish laughter (which I am ashamed to speak of) at some silly joke, or smile at some action, or fly back to our previous conversation. And therefore if we do not want anything to haunt us while we are praying, we should be careful before our prayer, to exclude it from the shrine of our heart, that we may thus fulfill the Apostle's injunction: "Pray without ceasing;" and: "In every place lifting up holy hands without wrath or disputing." For otherwise we shall not be able to carry out that charge unless our mind, purified from all stains of sin, and given over to virtue as to its natural good, feed on the continual contemplation of Almighty God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 3"

[[commentary]]
quote='''
And when the soul has been established in such a peaceful condition, and has been freed from the meshes of all carnal desires, and the purpose of the heart has been steadily fixed on that which is the only highest good, he will then fulfil this Apostolic precept: "Pray without ceasing;" and: "in every place lifting up holy hands without wrath and disputing:" for when by this purity (if we can say so) the thoughts of the soul are engrossed, and are re-fashioned out of their earthly condition to bear a spiritual and angelic likeness, whatever it receives, whatever it takes in hand, whatever it does, the prayer will be perfectly pure and sincere.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 6"

[[commentary]]
quote='''
OR how can we think that the Lord would have it retained even for an instant, since He does not permit us to offer the spiritual sacrifices of our prayers, if we are aware that another has any bitterness against us: saying, "If then thou bringest thy gift to the altar and there rememberest that thy brother hath aught against thee, leave there thy gift at the altar and go thy way; first be reconciled to thy brother, and then come and offer thy gift." How then may we retain displeasure against our brother, I will not say for several days, but even till the going down of the sun, if we are not allowed to offer our prayers to God while he has anything against us? And yet we are commanded by the Apostle: "Pray without ceasing;" and "in every place lifting up holy hands without wrath and disputing." It remains then either that we never pray at all, retaining this poison in our hearts, and become guilty in regard of this apostolic or evangelic charge, in which we are bidden to pray everywhere and without ceasing; or else if, deceiving ourselves, we venture to pour forth our prayers, contrary to His command, we must know that we are offering to God no prayer, but an obstinate temper with a rebellious spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25208.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 8, Chapter 13"
