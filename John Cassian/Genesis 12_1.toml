[[commentary]]
quote='''
WE must now speak of the renunciations, of which tradition and the authority of Holy Scripture show us three, and which every one of us ought with the utmost zeal to make complete. The first is that by which as far as the body is concerned we make light of all the wealth and goods of this world; the second, that by which we reject the fashions and vices and former affections of soul and flesh; the third, that by which we detach our soul from all present and visible things, and contemplate only things to come, and set our heart on what is invisible. And we read that the Lord charged Abraham to do all these. three at once, when He said to him "Get thee out from thy country, and thy kinsfolk, and thy father's house." First He said "from thy country," i.e., from the goods of this world, and earthly riches: secondly, "from thy kinsfolk," i.e., from this former life and habits and sins, which cling to us from our very birth and are joined to us as it were by ties of affinity and kinship: thirdly, "from thy father's house," i.e., from all the recollection of this world, which the sight of the eyes can afford. For of the two fathers, i.e., of the one who is to be forsaken, and of the one who is to be sought, David thus speaks in the person of God: "Hearken, O daughter, and consider, and incline thine ear: forget also thine own people and thy father's house:" for the person who says "Hearken, O daughter," is certainly a Father; and yet he bears witness that the one, whose house and people he urges should be forgotten, is none the less father of his daughter. And this happens when being dead with Christ to the rudiments of this world, we no longer, as the Apostle says, regard "the things which are seen, but those which are not seen, for the things which are not seen are eternal," and going forth in heart from this temporal and visible home, turn our eyes and heart towards that in which we are to remain for ever. And this we shall succeed in doing when, while we walk in the flesh, we are no longer at war with the Lord according to the flesh, proclaiming in deed and actions the truth of that saying of the blessed Apostle "Our conversation is in heaven."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 6"

[[commentary]]
quote='''
The first renunciation then of which we spoke is of what is not our own, and therefore is not enough of itself to confer perfection on the renunciant, unless he advances to the second, which is really and truly a renunciation of what belongs to us. And when we have made sure of this by the expulsion of all our faults, we shall mount to the heights of the third renunciation also, whereby we rise above not merely all those things which are done in this world or specially belong to men, but even that whole universe around us which is esteemed so glorious, and shall with heart and soul look down upon it as subject to vanity and destined soon to pass away; as we look, as the Apostle says, "not on those things which are seen, but on those which are not seen: for the things that are seen, are temporal, and the things which are not seen are eternal;" that so we may be found worthy to hear that highest utterance, which was spoken to Abraham: "and come into a land which I will show thee," which clearly shows that unless a man has made those three former renunciations with all earnestness of mind, he cannot attain to this fourth, which is granted as a reward and privilege to one whose renunciation is perfect, that he may be found worthy to enter the land of promise which no longer bears for him the thorns and thistles of sins; which after all the passions have been driven out is acquired by purity of heart even in the body, and whichno good deeds or exertions of man's efforts (can gain), but which the Lord Himself promises to show, saying "And come into the land which I will show to thee:" which clearly proves that the beginning of our salvation results from the call of the Lord, Who says "Get thee out from thy country," and that the completion of perfection and purity is His gift in the same way, as He says "And come into the land which I will show thee," i.e., not one you yourself can know or discover by your own efforts, but one which I will show not only to one who is ignorant of it, but even to one who is not looking for it. And from this we clearly gather that as we hasten to the way of salvation through being stirred up by the inspiration of the Lord, so too it is under the guidance of His direction and illumination that we attain to the perfection of the highest bliss.

Germanus: Where then is there room for free will, and how is it ascribed to our efforts that we are worthy of praise, if God both begins and ends everything in us which concerns our salvation?

Paphnutius: This would fairly influence us, if in every work and practice, the beginning and the end were everything, and there were no middle in between. And so as we know that God creates opportunities of salvation in various ways, it is in our power to make use of the opportunities granted to us by heaven more or less earnestly. For just as the offer came from God Who called him "get thee out of thy country," so the obedience was on the part of Abraham who went forth; and as the fact that the saying "Come into the land" was carried into action, was the work of him who obeyed, so the addition of the words "which I will show thee" came from the grace of God Who commanded or promised it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapters 10-12"
