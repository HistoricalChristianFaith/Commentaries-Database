[[commentary]]
quote='''
But if we were altogether deprived of the protection of our parents, the services of the princes of this world would not be wanting, as they would most thankfully rejoice to minister to our necessities with prompt liberality. And supported by their bounty, we should be free from the care of preparing food, were it not that this curse of the prophet terribly frightened us. For "Cursed," he says, "is the man that putteth his hope in man;" and: "Put not your trust in princes."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 2"
