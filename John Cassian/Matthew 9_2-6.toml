[[commentary]]
quote='''
And we read also that the Lord poured forth this superabundance of grace in the case of the cure of the paralytic, when, though he only asked for the healing of the weakness by which his body was enervated, He first brought health to the soul by sating: "Son, be of good cheer, thy sins be forgiven thee." After which, when the scribes did not believe that He could forgive men's sins, in order to confound their incredulity, He set free by the power of His word the man's limb, and put an end to his disease of paralysis, by saying: "Why think ye evil in. your hearts? Whether is easier to say, thy sins be forgiven thee, or to say, arise and walk? But that ye may know that the Son of man hath power on earth to forgive sins, then saith He to the sick of the palsy: Arise, take up thy bed, and go unto thine house."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 16"
