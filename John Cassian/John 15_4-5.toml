[[commentary]]
quote='''
And if in Peter's case there was need of the Lord's help that it might not fail, who will be so presumptuous and blind as to fancy that he has no need of daily assistance from the Lord in order to preserve it? Especially as the Lord Himself has made this clear in the gospel, saying: "As the branch cannot bear fruit of itself except it abide in the vine, so no more can ye, except ye abide in me." And again: "for without me ye can do nothing." How foolish and wicked then it is to attribute any good action to our own diligence and not to God's grace and assistance, is clearly shown by the Lord's saying, which lays down that no one can show forth the fruits of the Spirit without His inspiration and co-operation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 16"
