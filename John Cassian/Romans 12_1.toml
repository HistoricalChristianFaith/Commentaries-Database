[[commentary]]
quote='''
And therefore the blessed Apostle warns us to keep hold of the reins of discretion and not to be attracted by excess and swerve to either side, saying: "Your reasonable service."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 22"
