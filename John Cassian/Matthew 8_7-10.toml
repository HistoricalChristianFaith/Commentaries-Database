[[commentary]]
quote='''
But that the Lord is sometimes wont to tempt our faith that it maybe made stronger and more glorious, we are taught by the example of the centurion in the gospel, in whose case though the Lord knew that He would cure his servant by the power of His word, yet He chose to offer His bodily presence, saying: "I will come and heal him:" but when the centurion overcame this offer of His by the ardour of still more fervent faith, and said: "Lord, I am not worthy that Thou shouldest come under my roof: but speak the word only and my servant shall be healed," the Lord marvelled at him and praised him, and put him before all those of the people of Israel who had believed, saying: "Verily, I say unto you, I have not found so great faith in Israel." For there would have been no ground for praise or merit, if Christ had only preferred in him what He Himself had given.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 14"
