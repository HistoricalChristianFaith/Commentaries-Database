[[commentary]]
quote='''
And so the blessed David, although he guarded the recesses of his heart with the utmost care, so that he dared to say to Him from whom the secrets of his conscience were not hid, "Lord, my heart is not exalted, nor are my eyes lofty: neither have I walked in great matters, nor in wonderful things above me. If I was not humbly minded;" and again, "He that worketh pride shall not dwell in the midst of my house;" yet, as he knew how hard is that watchfulness even for those that are perfect, he did not so presume on his own efforts, but prayed to God and implored His help, that he might escape unwounded by the darts of this foe, saying, "Let not the foot of pride come to me, " for he feared and dreaded falling into that which is said of the proud, viz., "God resisteth the proud;" and again: "Every one that exalteth his heart is unclean before the Lord."

How great is the evil of pride, that it rightly has no angel, nor other virtues opposed to it, but God Himself as its adversary! Since it should be noted that it is never said of those who are entangled in other sins that they have God resisting them; I mean it is not said that God is opposed "to the gluttonous, fornicators, passionate, or covetous," but only "to the proud." For those sins react only on those who commit them, or seem to be committed against those who share in them, i.e., against other men; but this one has more properly to do with God, land therefore it is especially right that it should have Him opposed to it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapters 6-7"
