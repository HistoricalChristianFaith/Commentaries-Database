[[commentary]]
quote='''
Finally even if there is any diminution of my purity of heart while I am living in the coenobium, I shall be satisfied by keeping in exchange that one precept of the Gospel, which certainly cannot be less esteemed than all those fruits of the desert; I mean that I should take no thought for the morrow, and submitting myself completely to the Abbot seem in some degree to emulate Him of whom it is said: "He humbled Himself, and became obedient unto death; and so be able humbly to make use of His words: "For I came not to do mine own will, but the will of the Father which sent me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F19.%2520Conference%2520of%2520Abbot%2520John.html'
source_title="Conference of Abbot John, Chapter 6"

[[commentary]]
quote='''
The aim indeed of the coenobite is to mortify and crucify all his desires and, according to that salutary command of evangelic perfection, to take no thought for the morrow. And it is perfectly clear that this perfection cannot be attained by any except a coenobite, such a man as the prophet Isaiah describes and blesses and praises as follows: "If thou turn away thy foot from the Sabbath, from doing thy own will in my holy day, and glorify Him, while thou dost not thine own ways, and thine own will is not found to speak a word: then shalt thou be delighted in the Lord, and I will lift thee up above the high places of the earth, and will feed thee with the inheritance of Jacob thy father. For the mouth of the Lord hath spoken it." But the perfection for a hermit is to have his mind freed from all earthly things, and to unite it, as far as human frailty allows, with Christ: and such a man the prophet Jeremiah describes when he says: "Blessed is the man who hath borne the yoke from his youth. He shall sit solitary and hold his peace, because he hath taken it upon himself;" the Psalmist also: "I am become like a pelican in the desert. I watched and became as a sparrow alone upon the housetop." To this aim then, which we have described as that of either life, unless each of them attains, in vain does the one adopt the system of the coenobium, and the other of the hermitage: for neither of them will get the good of his method of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F19.%2520Conference%2520of%2520Abbot%2520John.html'
source_title="Conference of Abbot John, Chapter 8"

[[commentary]]
quote='''
Wherefore each one on his admission is stripped of all his former possessions, so that he is not allowed any longer to keep even the clothes which he has on his back: but in the council of the brethren he is brought forward into the midst and stripped of his own clothes, and clad by the Abbot's hands in the dress of the monastery, so that by this he may know not only that he has been despoiled of all his old things, but also that he has laid aside all worldly pride, and come down to the want and poverty of Christ, and that he is now to be supported not by wealth sought for by the world's arts, nor by anything reserved from his former state of unbelief, but that he is to receive out of the holy and sacred funds of the monastery his rations for his service; and that, as he knows that he is thence to be clothed and fed and that he has nothing of his own, he may learn, nevertheless, not to be anxious about the morrow, according to the saying of the Gospel, and may not be ashamed to be on a level with the poor, that is with the body of the brethren, with whom Christ was not ashamed to be numbered, and to call him-self their brother, but that rather he may glory that he has been made to share the lot of his own servants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25204.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 4, Chapter 5"
