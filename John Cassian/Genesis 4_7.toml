[[commentary]]
quote='''
For we have residing in our conscience an uncorrupt and true judge who sometimes, when all are wrong, is the only person not deceived as to the state of our purity. And so with all care and pains we should preserve a constant purpose in our circumspect heart for fear lest if the judgment of our discretion goes wrong, we may be fired with the desire for an ill-considered abstinence, or allured by the wish for an excessive relaxation, and so weigh the substance of our strength in the tongue of an unfair balance; but we should place in one of the scales our purity of soul, and in the other our bodily strength, and weigh them both in the true judgment of conscience, so that we may not perversely incline the scale of fairness to either side, either to undue strictness or to excessive relaxation, from the preponderating desire for one or the other, and so have this said to us by reason of excessive strictness or relaxation: "If thou offerest rightly, but dost not divide rightly, hast thou not sinned?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 22"
