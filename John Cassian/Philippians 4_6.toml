[[commentary]]
quote='''
But though our Lord made a distinction between these four kinds of prayers as to be offered separately and one by one according to the scheme which we know of, yet that they can all be embraced in a perfect prayer at one and the same time He showed by His own example in that prayer which at the close of S. John's gospel we read that He offered up with such fulness. From the words of which (as it is too long to repeat it all) the careful inquirer can discover by the order of the passage that this is so. And the Apostle also in his Epistle to the Philippians has expressed the same meaning, by putting these four kinds of prayers in a slightly different order, and has shown that they ought sometimes to be offered together in the fervour of a single prayer, saying as follows: "But in everything by prayer and supplication with thanksgiving let your requests be made known unto God." And by this he wanted us especially to understand that in prayer and supplication thanksgiving ought to be mingled with our requests.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 17"
