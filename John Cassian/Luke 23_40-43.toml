[[commentary]]
quote='''
For if we recall that thief who was by reason of a single confession admitted into paradise, we shall feel that he did not acquire such bliss by the merits of his life, but obtained it by the gift of a merciful God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 11"
