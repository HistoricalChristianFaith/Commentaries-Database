[[commentary]]
quote='''
But it would take too long to search through the whole of Scripture and run through the different kinds of them, as they are termed by the prophets onocentaurs, satyrs, sirens, witches, howlers, ostriches, urchins; and asps and basilisks in the Psalms; and are called lions, dragons, scorpions in the gospel, and are named by the Apostle the prince of this world, rulers of this darkness, and spirits of wickedness. And all these names we ought not to take as given at random or hap-hazard, but as alluding to their fierceness and madness under the sign of those wild beasts which are more or less harmful and dangerous among us, and by comparing them to the poisonous wickedness or power which among other beasts or serpents, some pre-eminence in evil confers on them, they are called by their names, in such a way that to one is assigned the name of lion because of the fury of his rage and the madness of his anger, to another that of basilisk because of his deadly poison, which kills a person before it is perceived, and to another that of onocentaur or urchin or ostrich because of his sluggish malice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 32"
