[[commentary]]
quote='''
Germanus: And how is it that we see them not only scorned and shunned by everybody, but actually always kept away from the Lord's communion in our provinces, in accordance with these words of the gospel: "Give not that which is holy to the dogs, neither cast four pearls before swine;" while you tell us that somehow we ought to hold that the humiliation of this temptation is brought upon them with a view to their purification and profit?

Serenus: If we had this knowledge. or rather faith, of which I treated above; viz., to believe that all things were brought about by God, and ordered for the good of our souls, we should not only never despise them, but rather pray without ceasing for them as our own members, and sympathize with them with all our hearts and the fullest affection (for "when one member suffers, all the members suffer with it" ), as we know that we cannot possibly be perfected without them inasmuch as they are members of us, just as we read that our predecessors could not attain the fulness of promise without us, as the Apostle speaks of them as follows: "And these all being approved by the testimony of faith, received not the promise, God providing some better thing for us that they should not be perfected without us."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapters 29-30"
