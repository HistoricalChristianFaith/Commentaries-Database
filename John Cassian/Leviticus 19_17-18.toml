[[commentary]]
quote='''
But why should we spend any more time over evangelic and apostolic precepts, when even the old law, which is thought to be some- what slack, guards against the same thing, when it says, "Thou shall not hate thy brother in thine heart;" and again, "Be not mindful of the injury of thy citizens;" and again, "The ways of those who preserve the recollection of wrongs are towards death"? You see there too that wickedness is restrained not only in action, but also in the secret thoughts, since it is commanded that hatred be utterly rooted out from the heart, and not merely retaliation for, but the very recollection of, a wrong done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25208.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 8, Chapter 15"
