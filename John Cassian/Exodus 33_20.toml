[[commentary]]
quote='''
But there are numberless other considerations of this sort, which arise in our minds according to the character of our life and the purity of our heart, by which God is either seen by pure eyes or embraced: which considerations certainly no one will preserve lastingly, if anything of carnal affections still survives in him, because "thou canst not," saith the Lord, "see My face: for no man shall see Me and live;" viz., to this world and to earthly affections.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F1.%2520First%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="First Conference of Abbot Moses, Chapter 15"
