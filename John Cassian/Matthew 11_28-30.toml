[[commentary]]
quote='''
Germanus: As you have given us a remedy for all delusions, and by God's grace all the wiles of the devil by which we were harassed, have been exposed by your teaching, we beg that you will also explain to us this that is said in the gospel: "My yoke is easy, and My burden is light." For it seems tolerably opposed to that saying of the prophet where it is said: "For the sake of the words of Thy lips I kept hard ways;" while even the Apostle says: "All who will live godly in Christ suffer persecutions." But whatever is hard and fraught with persecutions cannot be easy andlight.

Abraham: We can prove by the easy teaching of our own experience that our Lord and Saviour's saying is perfectly true, if we approach the way of perfection properly and in accordance with Christ's will, and mortifying all our desires, and cutting off injurious likings, not only allow nothing to remain with us of this world's goods (whereby our adversary would find at his pleasure opportunities of destroying and damaging us) but actually recognize that we are not our own masters, and truly make our own the Apostle's words: "I live, yet not I, but Christ liveth in me.'' For what can be burdensome, or hard to onewho has embraced with his whole heart the yoke of Christ, who is established in true humility and ever fixes his eye on the Lord's sufferings and rejoices in all the wrongs that are offered to him, saying: "For which cause I please myself in my infirmities, in reproaches, in necessities, in persecutions, in distresses, for Christ: for when I am weak, then am I strong"? By what loss of any common thing, I ask, will he be injured, who boasts of perfect renunciation, and voluntarily rejects for Christ's sake all the pomp of this world, and considers all and every of its desires as dung, so that he may gain Christ, and by continual meditation on this command of the gospel, scorns and gets rid of agitation at every loss: "For what shall it profit a man if he gain the whole world, but lose his own soul? Or what shall a man give in exchange for his soul?" For the loss of what will he be vexed, who recognizes that everything that can be taken away from others is not their own, and proclaims with unconquered valour: "We brought nothing into this world: it is certain that we cannot carry anything out"? By the needs of what want will his courage be overcome, who knows how to do without "scrip for the way, money forthe purse," and, like the Apostle, glories "in many fasts, in hunger and thirst, in cold and nakedness"? What effort, or what hard command of an Eider can disturb the peace of his bosom, who has no will of his own, and not only patiently but even gratefully accepts what is commanded him, and after the example of our Saviour, seeks to do not his own will, but the Father's, as He says Himself to His Father: "Nevertheless not as I will, but as Thou wilt"? By what wrongs also, by what persecution will he be frightened, nay, what punishment can fail to be delightful to him, who always rejoices together with apostles in stripes, and longs to be counted worthy to suffer shame for the name of Christ?

But the fact that to us on the contrary the yoke of Christ seems neither light nor easy, must be rightly ascribed to our perverseness, as we are cast down by unbelief and want of faith, and fight with foolish obstinacy against His command, or rather advice, who says: "If thou wilt be perfect, go sell (or get rid of) all that thou hast, and come follow Me," for we keep the substance of our worldly goods. And as the devil holds our soul fast in the toils of these, what remains but that, when he wants to sever us from spiritual delights, he should vex us by diminishing these and depriving us of them, contriving by his crafty wiles that when the sweetness of His yoke and lightness of His burden have become grievous to us through the evil of a corrupt desire, and when we are caught in the chains of that very property and substance, which we kept for our comfort and solace, he may always torment us with the scourges of worldly cares, extorting from us ourselves that wherewith we are tortured?For "Each one is bound by the cords of his own sins," and hears from the prophet: "Behold all you that kindle a fire, encompassed with flames, walk in the light of your fire, and in the flames which you have kindled." Since, as Solomon is witness, "Each man shall thereby be punished, whereby he has sinned." For the very pleasures which we enjoy become a torment to us, and the delights and enjoyments of this flesh, turn like executioners upon their originator, because one who is supported by his former wealth and property is sure not to admit perfect humility of heart, not entire mortification of dangerous pleasures. But where all these implements of goodness give their aid, there all the trials of this present life, and whatever losses the enemy can contrive, are endured not only with the utmost patience, but with real pleasure, and again when they are wanting so dangerous a pride springs up that we are actually wounded by the deadly strokes of impatience at the slightest reproach, and it may be said to us by the prophet Jeremiah: "And now what hast thou to do in the way of Egypt, to drink the troubled water?And what hast thou to do with the way of the Assyrians, to drink the water of the river? Thy own wickedness shall reprove thee, and thy apostasy shall rebuke thee. Know thou and see that it is an evil and a bitter thing for thee to have left the Lord thy God, and that My fear is not with thee, saith the Lord." How then is it that the wondrous sweetness of the Lord's yoke is felt to be bitter, but because the bitterness of our dislike injures it? How is it that the exceeding lightness of the Divine burden becomes heavy, but because in our obstinate presumption we despise Him by whom it was borne, especially as Scripture itself plainly testifies to this very thing saying: "For if they would walk in right paths, theywould certainly have found the paths of righteousness smooth"? It is plain, I say, that itis we, who make rough with the nasty and hardstones of our desires the right and smooth paths of the Lord; who most foolishly forsake the royal road made stony with the flints of apostles and prophets, and trodden down by the footsteps of all the saints and of the Lord Himself, and seek trackless and thorny places, and, blinded by the allurements of present delights, tear our way with torn legs and our wedding garment rent, through dark paths, overrun withthe briars of sins, so as not only to be pierced by the sharp thorns of the brambles but actually laid low by the bites of deadly serpents and scorpions lurking there. For "there are thorns and thistles in wrong ways, but he that feareth the Lord shall keep himself from them." Of such also the Lord says elsewhere by the prophet: "My people have forgotten, sacrificing in vain, and stumbling in their ways, in ancient paths, to walk in them in a way not trodden." For according to Solomon's saying: "The ways of those who do not work are strewn with thorns, but the ways of the lusty are trodden down." And thus wandering from the king's highway, they can never arrive at that metropolis, whither our course should ever be directed without swerving. And this also Ecclesiastes has pretty significantly expressed saying: "The labour of fools wearies those who know not how to go to the city;" viz., that "heavenly Jerusalem, which is the mother of us all." But whoever truly gives up this world and takes upon him Christ's yoke and learns of Him, and is trained in the daily practice of suffering wrong, for He is "meek and lowly of heart," will ever remain undisturbed by all temptations, and "all things will work together for good to him." For as the prophet Obadiah says the words of God are "good to him that walketh uprightly;" and again: "For the ways of the Lord are right, and the just shall walk in them; but the transgressors shall fall in them."

And so by the struggle with temptation the kindly grace of the Saviour bestows on us larger rewards of praise than if it had taken away from us all need of conflict. For it is a mark of a loftier and grander virtue to remain ever unmoved when hemmed in by persecutions and trials, and to stand faithfully and courageously at the ramparts of God, and in the attacks of men, girt as it were with the arms of unconquered virtue, to triumph gloriously over impatience and somehow to gain strength out of weakness, for "strength is made perfect in weakness." "For behold I have made thee." saith the Lord, "a pillar of iron and a wall of brass, over all the land, to the kings of Judah, and the princes and the priests thereof, and all the people of the land. And they shall fight against thee and shall not prevail: for I am with thee to deliver thee, saith the Lord." Therefore according to the plain teaching of the Lord the king's highway is easy and smooth, though it may be felt as hard and rough: for those who piously and faithfully serve Him, when they have taken upon them the yoke of the Lord, and have learnt of Him, that He is meek and lowly of heart, at once somehow or other lay aside the burden of earthly passions, and find no labour but rest for their souls, by the gift of the Lord, as He Himself testifies by Jeremiah the prophet, saying: "Stand ye on the ways and see, and ask for the old paths, which is the good way, and walk ye in it: and you shall find refreshment for your souls." For to them at once "the crooked shall become straight and the rough ways plain;" and they shall "taste and see that the Lord is gracious," and when they hear Christ proclaiming in the gospel: "Come unto Me all ye that labour and are heavy laden, and I will refresh you," they will lay aside the burden of their sins, and realize what follows: "For My yoke is easy, and My burden is light." The way of the Lord then has refreshment if it is kept to according to His law. But it is we who by troublesome distractions bring sorrows and troubles upon ourselves, while we try even With the utmost exertion and difficulty to follow the crooked and perverse ways of this world. But when in this way we have made the Lord's yoke heavy and hard to us, we at once complain in a blasphemous spirit of the hardness and roughness of the yoke itself or of Christ who lays it upon us, in accordance with this passage: "The folly of man corrupteth his ways, but he blames God in his heart;" and as Haggai the prophet says, when we say that "the way of the Lord is not right" the reply is aptly made to us by the Lord: "Is not My way right? Are not your ways rather crooked?" And indeed ifyou will compare the sweet scented flower ofvirginity, and tender purity of chastity to the foul and fetid sloughs of lust, the calm and security of monks to the dangers and losses in which the men of this world are involved, the peace of our poverty to the gnawing vexations and anxious cares of riches, in which they are night and day consumed not without the utmost peril to life, then you will prove that the yoke of Christ is most easy and His burden most light.
'''
