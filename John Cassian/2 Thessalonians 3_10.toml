[[commentary]]
quote='''
And so though we also might have the protection of our kinsfolk, yet we have preferred his abstinence to all riches, and have chosen to procure our daily bodily sustenance by our own exertions rather than rely on the sure provision made by our relations, having less inclination for idle meditation on holy Scripture of which you have spoken, and that fruitless attendance to reading than to this laborious poverty. And certainly we should most. gladly pursue the former, if the authority of the apostles had taught us by their examples that it was better for us, or the rules of the Elders had laid it down for our good. But you must know that you are affected by this no less than by that harm of which I spoke above, because though your body may be sound and lusty, yet you are supported by another's contributions, a thing which properly belongs only to the feeble. For certainly the whole human race, except only that class of monks, who live in accordance with the Apostle's command by the daily labours of their own hands, looks for the charity of another's compassion. Wherefore it is clear that not only those who boast that they themselves are supported either by the wealth of their relations or the labours of their servants or the produce of their farms, but also the kings of this world are supported by charity. This at any rate is embraced in the definition of our predecessors, who have laid down that anything that is taken for the requirements of daily food which has not been procured and prepared by the labour of our own hands, ought to be referred to charity, as the Apostle teaches, who altogether forbids the help of another's bounty to the idle and says: "If a man does not work, neither let him eat." These words the blessed Antony used against some one, and instructed us also by the example of his teaching, to shun the pernicious allurements of our relations and of all who provide the needful charity for our food as well as the delights of a pleasant home, and to prefer to all the wealth of this world sandy wastes horrid with the barrenness of nature, and districts overwhelmed by living incrustations, and for that reason subject to no control or dominion of man, so that we should not only avoid the society of men for the sake of a pathless waste, but also that the character of a fruitful soil may never entice us to the distractions of cultivating it, whereby the mind would be recalled from the chief service of the heart, and rendered useless for spiritual aims.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 12"

[[commentary]]
quote='''
But lest haply it might be thought that, while he worked in silence and tried to teach them by example, he had not instructed them by precepts and warnings, he proceeds to say: "For when we were with you, this we declared to you, that if a man will not work neither should he eat." Still greater does he make their idleness appear, for, though they knew that he, like a good master, worked with his hands for the sake of his teaching and in order to instruct them, yet they were ashamed to imitate him; and he emphasizes our diligence and care by saying that he did not only give them this for an example when present, but that he also proclaimed it continually in words; saying that if any one would not work, neither should he eat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 11"

[[commentary]]
quote='''
And now he no longer addresses to them the advice of a teacher or physician, but proceeds with the severity of a judicial sentence, and, resuming his apostolic authority, pronounces sentence on his despisers as if from the judgment seat: with that power, I mean, which, when writing with threats to the Corinthians, he declared was given him of the Lord, when he charged those taken in sin, that they should make haste and amend their lives before his coming: thus charging them, "I beseech you that I may not be bold when I am present, against some, with that power which is given to me over you." And again: "For if I also should boast somewhat of the power which the Lord has given me unto edification, and not for your destruction, I shall not be ashamed." With that power, I say, he declares, "If a man will not work, neither let him eat." Not punishing them with a carnal sword, but with the power of the Holy Ghost forbidding them the goods of this life, that if by chance, thinking but little of the punishment of future death, they still should remain obstinate through love of ease, they may at last, forced by the requirements of nature and the fear of immediate death, be compelled to obey his salutary charge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 12"
