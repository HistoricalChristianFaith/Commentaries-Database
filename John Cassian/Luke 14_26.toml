[[commentary]]
quote='''
But he also added and spoke as follows: If Moses suffered wives to be divorced for the hardness of their hearts, why should not Christ allow this for the desire of chastity, especially when the same Lord among those other affections; viz., for fathers and mothers and children (all due regard to which not only the law but He Himself also charged to be shown, yet for His name's sake and for the desire of perfection He decreed that they should not simply be disregarded but actually hated)-to these, I say, He joined also the mention of wives, saying: "And everyone that hath left house, or brethren or sisters or father or mother or wife or children for My name's sake, shall receive an hundredfold and shall inherit eternal life." So far then is He from allowing anything to be set against that perfection which He is proclaiming, that He actually enjoins that the ties to father and mother should be broken and disregarded out of love for Him, though according to the Apostle it is the first commandment with promise; viz., "Honour thy father and thy mother, which is the first commandment with promise, that it may be well with thee and that thy days may be long upon earth." And as the word of the gospel condemns those who break the chains of matrimony where there has been no sin of adultery, so it clearly promises a reward of an hundredfold to those who have cast off a carnal yoke out of love for Christ and the desire for chastity. Wherefore if it can be brought about that you may listen to reason and be turned together with me to this most desirable choice; viz., that we should together serve the Lord and escape the pains of hell, I will not refuse the affection of marriage, nay I will embrace it with a still greater love. For I acknowledge and honour my helpmeet assigned to me by the word of the Lord, and I do not refuse to be joined to her in an unbroken tie of love in Christ, nor do I separate from me what the Lord joined to me by the law of the original condition, if only you yourself will be what your Maker meant you to be. But if you will not be a helpmeet, but prefer to make yourself a deceiver and an assistance not to me but to the adversary, and fancy that the sacrament of matrimony was granted to you for this reason that you may deprive yourself of this salvation which is offered to you, and also hold me back from following the Saviour as a disciple, then I will resolutely lay hold on the words which were uttered by the lips of Abbot John, or rather of Christ Himself, so that no carnal affection may be able to tear me away from spiritual blessings, for He says: "He that hateth not father and mother and children and brothers and sisters and wife and lands, yea and his own soul also, cannot be My disciple."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 9"

[[commentary]]
quote='''
Nor are we so deprived of the solace of our kinsfolk, that those who delight to support us with their substance should fail us, were it not that this saying of the Saviour meets us and excludes everything that contributes to the support of this flesh, as He says: "He who doth not leave (or hate) father and mother and children and brethren cannot be My disciple."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 2"
