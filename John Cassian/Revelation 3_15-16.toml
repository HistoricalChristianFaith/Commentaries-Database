[[commentary]]
quote='''
Between these two desires then the free will of the soul stands in an intermediate position somewhat worthy of blame, and neither delights in the excesses of sin, nor acquiesces in the sorrows of virtue. Seeking to restrain itself from carnal passions in such a way as not nevertheless to be willing to undergo the requisite suffering, and wanting to secure bodily chastity without chastising the flesh, and to acquire purity of heart without the exertion of vigils, and to abound in spiritual virtues together with carnal ease, and to attain the grace of patience without the irritation of contradiction, and to practise the humility of Christ without the loss of worldly honour, to aim at the simplicity of religion in conjunction with worldly ambition, to serve Christ not without the praise and favour of men, to profess the strictness which truth demands without giving the slightest offence to anybody: in a word, it is anxious to pursue future blessings in such a way as not to lose present ones. And this free will would never lead us to attain true perfection, but would plunge us into a most miserable condition of lukewarmness, and make us like those who are rebuked by the Lord's remonstrance in the Apocalypse: "I know thy works, that thou art neither hot nor cold. I would that thou wert hot or cold. But now thou art lukewarm, and I will forthwith spue thee out of my mouth;" were it not that these contentions which rise up on both sides disturb and destroy this condition of lukewarmness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F4.%2520Conference%2520of%2520Abbot%2520Daniel.html'
source_title="Conference of Abbot Daniel, Chapter 12"
