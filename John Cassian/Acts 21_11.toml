[[commentary]]
quote='''
Paul also, going up to Jerusalem and soon to be put in chains by the Jews, was met at Caesarea by the prophet Agabus, who took his girdle and bound his hands and feet to show by his bodily actions the injuries which he was to suffer, and said: "So shall the Jews in Jerusalem bind the man whose girdle this is, and deliver him into the hands of the Gentiles." And surely the prophet would never have brought this forward, or have said "the man whose girdle this is," unless Paul had always been accustomed to fasten it round his loins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25201.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 1, Chapter 1"
