[[commentary]]
quote='''
But that, when we do not always resist or remain persistently unwilling, everything is granted to us by God, and that the main share in our salvation is to be ascribed not to the merit of our own works but to heavenly grace, we are thus taught by the words of the Lord Himself: "And you shall remember your ways and all your wicked doings with which you have been defiled; and you shall be displeased with yourselves in your own sight for all your wicked deeds which you have committed. And you shall know that I am the Lord, when I shall have done well by you for My own name's sake, not according to your evil ways, nor according to your wicked deeds, O house of Israel."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 18"
