[[commentary]]
quote='''
And to go on in the order which we proposed, with our account of the way in which the other passions act (our analysis of which was obliged to be interrupted by this account of gluttony and of the Lord's temptation) vainglory and pride can be consummated even without the slightest assistance from the body. For in what way do those passions need any action of the flesh, which bring ample destruction on the soul they take captive simply by its assent and wish to gain praise and glory from men? Or what act on the part of the body was there in that pride of old in the case of the above mentioned Lucifer; as he only conceived it in his heart and mind, as the prophet tells us: "Who saidst in thine heart: I will ascend into heaven, I will set my throne above the stars of God. I will ascend above the heights of the clouds, I will be like the most High." And just as he had no one to stir him up to this pride, so his thoughts alone were the authors of the sin when complete and of his eternal fall; especially as no exercise of the dominion at which he aimed followed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 7"

[[commentary]]
quote='''
So then the devil also in as much as he was created a spirit or an angel and good, had no one as his Father but God his Maker. But when he had become puffed up by pride and had said in his heart: "I will ascend above the heights of the clouds, I will be like the Most High," he became a liar, and "abode not in the truth;" but brought forth a lie from his own storehouse of wickedness and so became not only a liar, but also the father of the actual lie, by which when he promised Divinity to man and said "Ye shall be as gods," he abode not in the truth, but from the beginning became a murderer, both by bringing Adam into a state of mortality, and by slaying Abel by the hand of his brother at his suggestion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 25"
