[[commentary]]
quote='''
When then any one has acquired this love of goodness of which we have been speaking, and the imitation of God, then he will be endowed with the Lord's heart of compassion, and will pray also for his persecutors, saying in like manner: "Father, forgive them, for they know not what they do." But it is a clear sign of a soul that is not yet thoroughly purged from the dregs of sin, not to sorrow with a feeling of pity at the offences of others, but to keep to the rigid censure of the judge: for how will he be able to obtain perfection of heart, who is without that by which, as the Apostle has pointed out, the full requirements of the law can be fulfilled, saying: "Bear one another's burdens and so fulfil the law of Christ," and who has not that virtue of love, which "is not grieved, is not puffed up, thinketh no evil," which "endureth all things, beareth all things." For "a righteous man pitieth the life of his beasts: but the heart of the ungodly is without pity." And so a monk is quite certain to fall into the same sins which he condemns in another with merciless and inhuman severity, for "a stern king will fall into misfortunes," and "one who stops his ears so as not to hear the weak, shall himself cry, and there shall be none to hear him."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 10"

[[commentary]]
quote='''
But you must certainly know that in general he plays a stronger part who subjects his own will to his brother's, than he who is found to be the more pertinacious in defending and clinging to his own decisions. For the former by bearing and putting up with his neighbour gains the character of being strong and vigorous, while the latter gains that of being weak and sickly, who must be pampered and petted so that sometimes for the sake of his peace and quiet it is a good thing to relax something even in necessary matters. And indeed in this he need not fancy that he has lost anything of his own perfection, though by yielding he has given up something of his intended strictness, but on the contrary he may be sure that he has gained much more by his virtue of long-suffering and patience. For this is the Apostle's command: "Ye who are strong should bear the infirmities of the weak;" and: "Bear ye one another's burdens, and so fulfil the law of Christ." For a weak man will never support a weak man, nor can one who is suffering in the same way, bear or cure one in feeble health, but one who is himself not subject to infirmity brings remedies to one in weak health. For it is rightly said to him: "Physician, heal thyself."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 23"
