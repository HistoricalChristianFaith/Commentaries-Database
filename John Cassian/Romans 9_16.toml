[[commentary]]
quote='''
But for God's permission and allowance there is a twofold reason. First, that being for a short time forsaken by the Lord, and observing with all humility the weakness of our own heart, we may not be puffed up on account of the previous purity of heart. granted to us by His visitation; and that by proving that when we are forsaken by Him we cannot possibly recover our former state of purity and delight by any groanings and efforts of our own, we may also learn that our previous gladness of heart resulted not from our own earnestness but from His gift, and that for the present time it must be sought once more from His grace and enlightenment. But a second reason for this allowance, is to prove our perseverance, and steadfastness of mind, and real desires, and to show in us, with what purpose of heart, or earnestness in prayer we seek for the return of the Holy Spirit, when He leaves us, and also in order that when we discover with what efforts we must seek for that spiritual gladness-when once it is lost-and the joy of purity, we may learn to preserve it more carefully, when once it is secured, and to hold it with firmer grasp. For men are generally more careless about keeping whatever they think can be easily replaced.

And by this it is clearly shown that God's grace and mercy always work in us what is good, and that when it forsakes us, the efforts of the worker are useless, and that however earnestly a man may strive, he cannot regain his former condition without His help, and that this saying is constantly fulfilled in our case: that it is "not of him that willeth or runneth but of God which hath mercy." And this grace on the other hand sometimes does not refuse to visit with that holy inspiration of which you spoke, and with an abundance of spiritual thoughts, even the careless and indifferent; but inspires the unworthy, arouses the slumberers, and enlightens those who are blinded by ignorance, and mercifully reproves us and chastens us, shedding itself abroad in our hearts, that thus we may be stirred by the compunction which He excites, and impelled to rise from the sleep of sloth. Lastly we are often filled by His sudden visitation with sweet odours, beyond the power of human composition-so that the soul is ravished with these delights, and caught up, as it were, into an ecstasy of spirit, and becomes oblivious of the fact that it is still in the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F4.%2520Conference%2520of%2520Abbot%2520Daniel.html'
source_title="Conference of Abbot Daniel, Chapters 4-5"

[[commentary]]
quote='''
If we consider also the beginning of the call and salvation of mankind, in which, as the Apostle says, we are saved not of ourselves, nor of our works, but by the gift and grace of God, we can clearly see how the whole of perfection is "not of him that willeth nor of him that runneth, but of God that hath mercy," who makes us victorious over our faults, without any merits of works and life on our part to outweigh them, or any effort of our will availing to scale the difficult heights of perfection, or to subdue the flesh which we have to use: since no tortures of this body, and no contrition of heart, can be sufficient for the acquisition of that true chastity of the inner man so as to be able to gain that great virtue of purity (which is innate in the angels alone and indigenous as it were to heaven) merely by human efforts, i.e., without the aid of God: for the performance of everything good flows from His grace, who by multiplying His bounty has granted such lasting bliss, and vast glory to our feeble will and short and petty course of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 11"

[[commentary]]
quote='''
Nor do I say this to cast a slight on human efforts, or in the endeavour to discourage any one from his purpose of working and doing his best. But clearly and most earnestly do I lay down, not giving my own opinion, but that of the elders, that perfection cannot possibly be gained without these, but that by these only without the grace of God nobody can ever attain it. For when we say that human efforts cannot of themselves secure it without the aid of God, we thus insist that God's mercy and grace are bestowed only upon those who labour and exert themselves, and are granted (to use the Apostle's expression) to them that "will" and "run," according to that which is sung in the person of God in the eighty-eighth Psalm: "I have laid help upon one that is mighty, and have exalted one chosen out of my people." For we say, in accordance with our Saviour's words, that it is given to them that ask, and opened to them that knocks and found by them that seek; but that the asking, the seeking, and the knocking on our part are insufficient unless the mercy of God gives what we ask, and opens that at which we knock, and enables us to find that which we seek. For He is at hand to bestow all these things, if only the opportunity is given to Him by our good will. For He desires and looks for our perfection and salvation far more than we do ourselves. And the blessed David knew so well that by his own efforts he could not secure the increase of his work and labour, that he entreated with renewed prayers that he might obtain the "direction" of his work from the Lord, saying, "Direct thou the work of our hands over us; yea, the work of our hands do thou direct;" and again: "Confirm, O God, what thou hast wrought in us."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 14"
