[[commentary]]
quote='''
At the same hour, too, to Peter,in an ecstasy of mind, there was divinely revealed both the calling of the Gentiles by the letting down of the Gospel vessel from heaven, and also the cleansing of all the living creatures contained in it, when a voice came to him and said to him: "Rise, Peter; kill and eat; " which vessel, let down from heaven by the four corners, is plainly seen to signify nothing else than the Gospel. For although, as it is divided by the fourfold narrative of the Evangelists, it seems to have "four corners" (or beginnings), yet the body of the Gospel is but one; embracing, as it does, the birth as well as the Godhead, and the miracles as well as the passion of one and the same Christ. Excellently, too, it says not "of linen" but "as if of linen." For linen signifies death. Since, then, our Lord's death and passion were not undergone by the law of human nature, but of His own free will, it says "as if of linen." For when dead according to theflesh He was not dead according to the spirit, because "His soul was not left in hell, neither did His flesh see corruption." And again He says: "No man taketh My life from Mebut I lay it down of Myself. I have power to lay it down, and I have power to take it again." And so in this vessel of the Gospels let down from heaven, that is written by the Holy Ghost, all the nations which were formerly outside the observance of the law and reckoned as unclean now flow together through belief in the faith that they may to their salvation be turned away from the worship of idols and be serviceable for health-giving food, and are brought to Peter and cleansed by the voice of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25203.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 3, Chapter 3"
