[[commentary]]
quote='''
Of anger there are three kinds: one which rages within, which is called in Greek qumo/j; another which breaks out in word and deed and action, which they term o0rgh/: of which the Apostle speaks, saying "But now do ye lay aside all anger and indignation;" the third, which is not like those in boiling over and being done with in an hour, but which lasts for days and long periods, which is called mh=nij. And all these three must be condemned by us with equal horror.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 11"
