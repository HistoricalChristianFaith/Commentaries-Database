[[commentary]]
quote='''
But you should know that we must make an effort with a twofold purpose in our exertion; both for the expulsion of vice, and for the attainment of virtue. And this we do not gather from our own conjecture, but are taught by the words of Him who alone knows the strength and method of His work: "Behold," He says: "I have set thee this day over the nations and over kingdoms, to root up, and to pull down, and to waste, and to destroy, and to build and to plant." He points out that for getting rid of noxious things four things are requisite; viz., to root up, to pull down, to waste, and to destroy: but for the performance of what is good, and the acquisition of what pertains to righteousness only to build and to plant. Whence it is perfectly evident that it is a harder thing to tear up and eradicate the inveterate passions of body and soul than to introduce and plant spiritual virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 3"
