[[commentary]]
quote='''
So far therefore is our Lord anxious that we should not disregard the vexation of another that He does not accept our offerings if our brother has anything against us, i.e., He does not allow prayers to be offered by us to Him until by speedy amends we remove from his (our brother's) mind the vexation which he whether rightly or wrongly feels. For He does not say: "if thy brother hath a true ground for complaint against thee leave thy gift at the altar, and go thy way, first be reconciled to him;" but He says: "if thou remember that thy brother hath aught against thee," i.e., if there be anything however trivial or small, owing to which your brother's anger is roused against you, and this comes back to your recollection by a sudden remembrance, you must know that you ought not to offer the spiritual gift of your prayers until by kindly amends you have removed from your brother's heart the vexation arising from whatever cause. If then the words of the Gospel bid us make satisfaction to those who are angry for past and utterly trivial grounds of quarrel, and those which have arisen from the slightest causes, what will become of us wretches who with obstinate hypocrisy disregard more recent grounds of offence, and those of the utmost importance, and due to our own faults; and being puffed up with the devil's own pride, as we are ashamed to humble ourselves, deny that we are the cause of our brother's vexation and in a spirit of rebellion disdaining to be subject to the Lord's commands, contend that they never ought to be observed and never can be fulfilled? And so it comes to pass that as we make up our minds that He has commanded things which are impossible and unsuitable, we become, to use the Apostle's expression, "not doers but judges of the law."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 16"

[[commentary]]
quote='''
OR how can we think that the Lord would have it retained even for an instant, since He does not permit us to offer the spiritual sacrifices of our prayers, if we are aware that another has any bitterness against us: saying, "If then thou bringest thy gift to the altar and there rememberest that thy brother hath aught against thee, leave there thy gift at the altar and go thy way; first be reconciled to thy brother, and then come and offer thy gift." How then may we retain displeasure against our brother, I will not say for several days, but even till the going down of the sun, if we are not allowed to offer our prayers to God while he has anything against us? And yet we are commanded by the Apostle: "Pray without ceasing;" and "in every place lifting up holy hands without wrath and disputing." It remains then either that we never pray at all, retaining this poison in our hearts, and become guilty in regard of this apostolic or evangelic charge, in which we are bidden to pray everywhere and without ceasing; or else if, deceiving ourselves, we venture to pour forth our prayers, contrary to His command, we must know that we are offering to God no prayer, but an obstinate temper with a rebellious spirit.

And because we often spurn the brethren who are injured and saddened, and despise them, and say that they were not hurt by any fault of ours, the Healer of souls, who knows all secrets, wishing utterly to eradicate all opportunities of anger from our hearts, not only commands us to forgive if we have been wronged, and to be reconciled with our brothers, and keep no recollection of wrong or injuries against them, but He also gives a similar charge, that in case we are aware that they have anything against us, whether justly or unjustly, we should leave our gift, that is, postpone our prayers, and hasten first to offer satisfaction to them; and so when our brother's cure is first effected, we may bring the offering of our prayers without blemish. For the common Lord of all does not care so much for our homage as to lose in one what He gains in another, through displeasure being allowed to reign in us. For in any one's loss He suffers some loss, who desires and looks for the salvation of all His servants in one and the same way. And therefore our prayer will lose its effect, if our brother has anything against us, just as much as if we were cherishing feelings of bitterness against him in a swelling and wrathful spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25208.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 8, Chapters 13-14"
