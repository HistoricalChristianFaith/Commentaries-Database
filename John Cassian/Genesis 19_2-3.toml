[[commentary]]
quote='''
Though when the angels had refused to enter the house of Lot at Sodom, saying to him: "We will not enter but will remain in the street," they were presently forced by his prayers to change their determination, as Scripture subjoins: "And Lot constrained them, and they turned in to him." And certainly if they knew that they would turn in to him, they refused his request with a sham excuse: but if their excuse was a real one, then they are clearly shown to have changed their mind. And certainly we hold that the Holy Spirit inserted this in the sacred volume for no other reason but to teach us by their examples that we ought not to cling obstinately to our own determinations, but to subject them to our will, and so to keep our judgment free from all the chains of law that it may be ready to follow the call of good counsel in any direction, and may not delay or refuse to pass without any delay to whatever a sound discretion may find to be the better choice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 25"
