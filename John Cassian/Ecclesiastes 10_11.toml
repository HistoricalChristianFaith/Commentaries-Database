[[commentary]]
quote='''
And so, as the old man declared, said he, the sway of that diabolical tyranny over me has been destroyed by the power of this confession and stilled for ever so that the enemy has never even tried to force upon me any more the recollection of this desire, nor have I ever felt myself seized with the passion of that furtive longing. And this meaning we see is neatly expressed in a figure in Ecclesiastes. "If" says he "a serpent bite without hissing there is no sufficiency for the charmer," showing that the bite of a serpent in silence is dangerous, i.e., if a suggestion or thought springing from the devil is not by means of confession shown to some charmer, I mean some spiritually minded person who knows how to heal the wound at once by charms from the Scripture, and to extract the deadly poison of the serpent from the heart, it will be impossible to help the sufferer who is already in danger and must soon die.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F2.%2520Second%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="Second Conference of Abbot Moses, Chapter 11"

[[commentary]]
quote='''
For just as he who was the first to be corrupted by the plague of that evil, admitted no remedy of penitence, nor any healing plaster, so those also who have given themselves up to be smitten by the same pricks, exclude all the aid of the sacred charmer, because as they are tormented not by the faults but by the prosperity of those of whom they are jealous, they are ashamed to display the real truth and look out for some external unnecessary and trifling causes of offence: and of these, because they are altogether false, vain is the hope of cure, while the deadly poison which they will not produce is lurking in their veins. Of which the wisest of men has fitly said: "If a serpent bite without hissing, there is no supply for the charmer." For those are silent bites, to which alone the medicine of the wise is no succour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 16"
