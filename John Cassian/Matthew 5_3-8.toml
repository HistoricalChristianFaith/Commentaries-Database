[[commentary]]
quote='''
Chaeremon: In accordance with the condition and measure of every mind Holy Scripture summons our free wills to different grades of perfection. For no uniform crown of perfection can be offered to all men, because all have not the same virtue, or purpose, or fervour, and so the Divine Word has in some way appointed different ranks and different measures of perfection itself. And that this is so the variety of beatitudes in the gospel clearly shows. For though they are called blessed, whose is the kingdom of heaven, and blessed are they who shall possess the earth, and blessed are they who shall receive their consolation, and blessed are they who shall be filled, yet we believe that there is a great difference between the habitations of the kingdom of heaven, and the possession of the earth, whatever it be, and also between the reception of consolation and the fulness and satisfaction of righteousness; and that there is a great distinction between those who shall obtain mercy, and those who shall be deemed worthy to enjoy the most glorious vision of God. "For there is one glory of the sun, and another glory of the moon, and another glory of the stars: for star differeth from star in glory, so also is the resurrection of the dead."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 12"
