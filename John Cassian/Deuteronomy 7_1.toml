[[commentary]]
quote='''
These are the seven nations whose lands the Lord promised to give to the children of lsrael when they came out of Egypt. And everything which, as the Apostle says, happened to them "in a figure" we ought to take as written for our correction. For so we read: "When the Lord thy God shall have brought thee into the land, which thou art going in to possess, and shall have destroyed many nations before thee, the Hittite, and the Girgashites, and the Amorite, the Canaanite, and the Perizzite, and the Hivite, and the Jebusite, seven nations much more numerous thanthou art and much stronger than thou: and the Lord thy God shall have delivered them to thee, thou shalt utterly destroy them." And the reason that they are said to be much more numerous, is that faults are many more in number than virtues and so in the list of them the nations are reckoned as seven in number, but when the attack upon them is spoken of they are set down without theirnumber being given, for thus we read "And shall have destroyed many nations before thee."For the race of carnal passions which springs from this sevenfold incentive and root of sin, is more numerous than that of Israel. For thence spring up murders, strifes, heresies, thefts, false witness, blasphemy, surfeiting, drunkenness, back-biting, buffoonery, filthy conversation, lies, perjury, foolish talking, scurrility, restlessness, greediness, bitterness, clamour, wrath, contempt, murmuring, temptation, despair, and many other faults, which it would take too long to describe. And if we are inclined to think these small matters, let us hear what the Apostle thought about them, and what was his opinion of them: "Neither murmur ye," says he, "as some of them murmured, and were destroyed of the destroyer:" and of temptation: "Neither let us tempt Christ as some of them tempted and perished by the serpents." Of backbiting: "Love not backbiting lest thou be rooted out." And of despair: "Who despairing have given themselves up to lasciviousness unto the working of all error, in uncleanness." And that clamour is condemned as well as anger and indignation and blasphemy, the words of the same Apostle teach us as clearly as possible when he thus charges us: "Let all bitterness, and anger, and indignation, and clamour, and blasphemy be put away from you with all malice," and many more things like these. And though these are far more numerous than the virtues are, yet if those eight principal sins, from which we know that these naturally proceed, are first overcome, all these at once sink down, and are destroyed together with them with a lasting destruction. For from gluttony proceed surfeiting and drunkenness. From fornication filthy conversation, scurrility, buffoonery and foolish talking. From covetousness, lying, deceit, theft, perjury, the desire of filthy lucre, false witness, violence, inhumanity, and greed. From anger, murders, clamour and indignation. From dejection, rancor, cowardice, bitterness, despair. From accidie, laziness, sleepiness, rudeness, restlessness, wandering about, instability both ofmind and body, chattering, inquisitiveness. From vainglory, contention, heresies, boasting and confidence in novelties. From pride, contempt, envy, disobedience, blasphemy, murmuring, backbiting. And that all these plagues are stronger than we, we can tell very plainly from the way in which they attack us. For the delight in carnal passions wars more powerfully in our members than does thedesire for virtue, which is only gained with the greatest contrition of heart and body. But if you will only gaze with the eyes of the spirit on those countless hosts of our foes, which the Apostle enumerates where he says: "For we wrestle not against flesh and blood, but against principalities, against powers, against the world-rulers of this darkness, against spiritual wickedness in heavenly places," and this which we find of the right- eous man in the nineteenth Psalm: "A thousand shall fall beside thee and ten thousand at thy right hand," then you will clearly see that they are far more numerous and more powerful than are we, carnal and earthly creatures as we are, while to them is given a substance which is spiritual and incorporeal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 16"

[[commentary]]
quote='''
Germanus: How then is it that there areeight faults which assault us, when Moses reckons the nations opposed to the people of Israel as seven, and how is it well for us to take possession of the territory of our faults?

Serapion: Everybody is perfectly agreed that there are eight principal faults which affect a monk. And all of them are not included in the figure of the nations for this reason, because in Deuteronomy Moses, or rather the Lord through him, was speaking to those who had already gone forth from Egypt and been set free from one most powerful nation, I mean that of the Egyptians. And we find that this figure holds good also in our case, as when we have got clear of the snares of this world we are found to be free from gluttony, i.e., the sin of the belly and palate; and like them we have a conflict against these seven remaining nations, without taking account at all of the one which has been already overcome. And the land of this nation was not given to Israel for a possession, but the command of the Lord ordained that they should at once forsake it and go forth from it. And for this cause our fasts ought to be made moderate, that there may be no need for us through excessive abstinence, which results from weakness of the flesh and infirmity, to return again to the land of Egypt, i.e., to our former greed and carnal lust which we forsook when we made our renunciation of this world. And this has happened in a figure, in those who after having gone forth into the desert of virtue again hanker after the flesh pots over which they sat in Egypt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapters 17-18"

[[commentary]]
quote='''
But the fact that we are bidden for our good to take possession of the countries of those most wicked nations, may be understood in this way. Each fault has its own especial corner in the heart, which it claims for itself in the recesses of the soul, and drives out Israel, i.e., the contemplation of holy and heavenly things, and never ceases to oppose them. For virtues cannot possibly live side by side with faults. "For what participation hath righteousness with unrighteousness? Or what fellowship hath light with darkness?" But as soon as these faults have been overcome by the people of Israel, i.e., by those virtues which war against them, then at once the place in our heart which the spirit of concupiscence and fornication had occupied, will be filled by chastity. That which wrath had held, will be claimed by patience. That which had been occupied by a sorrow that worketh death, will be taken by a godly sorrow and one full of joy. That which had been wasted by accidie, will at once be tilled by courage. That which pride had trodden down will be ennobled by humility: and so when each of these faults has been expelled, their places (that is the tendency towards them) will be filled by the opposite virtues which are aptly termed the children of Israel, that is, of the soul that seeth God: and when these have expelled all passions from the heart we may believe that they have recovered their own possessions rather than invaded those of others.

For, as an ancient tradition tells us, these same lands of the Canaanites into which the children of Israel were brought, had been formerly allotted to the children of Shem at the division of the world, and afterward the descendants of Ham wickedly invading them with force and violence took possession of them. And in this the righteous judgment of God is shown, as He expelled from the land of others these who had wrongfully taken possession of them, and restored to those others the ancient property of their fathers which had been assigned to their ancestors at the division of the world. And we can perfectly well see that this figure holds good in our own case. For by nature God's will assigned the possession of our heart not to vices but to virtues, which, after the fall of Adam were driven out from their own country by the sins which grew up, i.e., by the Canaanites; and so when by God's grace they are by our efforts and labour restored again to it, we may hold that they have not occupied the territory of another, but rather have recovered their own country.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapters 23-24"
