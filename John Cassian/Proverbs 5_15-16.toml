[[commentary]]
quote='''
And so if these things have been carefully taken in and stored up in the recesses of the soul and stamped with the seal of silence, afterwards like some sweet scented wine that maketh glad the heart of man, they will, when mellowed by the antiquity of the thoughts and by long-standing patience, be brought forth from the jar of your heart with great fragrance, and like some perennial fountain will flow abundantly from the veins of experience and irrigating channels of virtue and will pour forth copious streams as if from some deep well in your heart. For that will happen in your case, which is spoken in Proverbs to one who has achieved this in his work: "Drink waters from your own cisterns and from the fount of your own wells. Let waters from your own fountain flow in abundance for you, but let your waters pass through into your streets."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 13"
