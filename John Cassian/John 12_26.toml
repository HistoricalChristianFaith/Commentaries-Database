[[commentary]]
quote='''
Wherefore every one while still existing in this body should already be aware that he must be committed to that state and office, of which he made himself a sharer and an adherent while in this life, nor should he doubt that in that eternal world he will be partner of him, whose servant and minister he chose to make himself here: according to that saying of our Lord which says "If any man serve Me, let him follow Me, and where I am, there shall My servant also be." For as the kingdom of the devil is gained by consenting to sin, so the kingdom of God is attained by the practice of virtue in purity of heart and spiritual knowledge. But where the kingdom of God is, there most certainly eternal life is enjoyed, and where the kingdom of the devil is, there without doubt is death and the grave.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F1.%2520First%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="First Conference of Abbot Moses, Chapter 14"
