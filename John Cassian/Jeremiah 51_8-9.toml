[[commentary]]
quote='''
And when the Lord mourns for their destruction by the prophet, and anxiously directs doctors and physicians to heal them, and in a manner urges them on to a similar lamentation and says: "Babylon is suddenly fallen: she is destroyed. Howl for her: take balm for her pain, if so she may be healed;" then, in their despair, the angels, to whom is entrusted the care of man's salvation, make reply; or at any rate the prophet in the person of the Apostles and spiritual men and doctors who see the hardness of their soul, and their impenitent heart: "We have healed Babylon: but she is not cured. Let us forsake her, and let us go every man to his own land because her judgment hath reached even to the heavens, and is lifted up to the clouds."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 31"
