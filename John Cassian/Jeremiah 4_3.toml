[[commentary]]
quote='''
Lastly, why should we any longer linger over those things which we have sufficiently discovered and proved by experience? We have often seen those who were cold and carnal, i.e., worldly men and heathen, attain spiritual warmth: but lukewarm and "natural" men never. And these too we read in the prophet are hated of the Lord, so that a charge is given to spiritual and learned men to desist from warning and teaching them, and not to sow the seed of the life-giving word in ground that is barren and unfruitful and choked by noxious thorns; but that they should scorn this, and rather cultivate fallow ground, i.e., that they should transfer all their care and teaching, and their zeal in the life-giving word to pagans and worldly men: as we thus read: "Thus saith the Lord to the men of Judah and inhabitants of Jerusalem: break up your fallow ground, and sow not among thorns."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F4.%2520Conference%2520of%2520Abbot%2520Daniel.html'
source_title="Conference of Abbot Daniel, Chapter 19"
