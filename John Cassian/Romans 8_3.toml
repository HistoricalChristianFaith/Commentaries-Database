[[commentary]]
quote='''
In His case then though it was fitting that He should undergo temptation, yet it was not necessary that He should fail under it. Nor could He who had vanquished gluttony be tempted byfornication, which springs from superfluityand gluttony as its root, with which even the first Adam would not have been destroyed unless before its birth he had been deceived by the wiles of the devil and fallen a victim to passion. And therefore the Son of God is not said absolutely to have come "in the flesh of sin," but "in the likeness ofthe flesh of sin," because though His was true flesh and He ate and drank and slept, and truly received the prints of the nails, there was in Him no true sin inherited from the fall, but only what was something like it. For He had no experience of the fiery darts of carnal lust, which in our case arise even against our will, from the constitution of our natures, but He took upon Him something like this, by sharing in our nature. For as He truly fulfilled every function which belongs to us, and bore all human infirmities, He has consequently been considered to have been subject to this feeling also, that He might appear through these infirmities to bear in His own flesh the state even of this fault and sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 6"
