[[commentary]]
quote='''
Others we find are not only keen for lies, but also inspire men with blasphemies. And of this we ourselves can testify as we have heard a demon openly confessing that he had proclaimed a wicked and impious doctrine by the mouths of Arius and Eunomius. And the same thing we read that one of them openly proclaimed in the fourth book of Kings: "I will go forth," he said, "and will be a lying spirit in the mouth of all his prophets." On which the Apostle, when reproving those who are deceived by them, adds as follows: "giving heed to seducing spirits and doctrines of devils speaking lies in hypocrisy."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 32"

[[commentary]]
quote='''
So then the spiritual wickednesses tempt with crafty malice each one of us, by particularly laying insidious snares for those affections of the soul, in which they have seen that it is weak, as for instance, if they see that the reasonable parts of our soul are affected, they try to deceive us in the same way that the Scripture tells us that king Ahab was deceived by those Syrians, who said: "We know that the kings of Israel are merciful: And so let us put sackcloth upon our loins, and ropes round our heads, and go out to the king of Israel, and say to him: Thy servant Benhadad saith: I pray thee, let my soul live." And thereby he was affected by no true goodness, but by the empty praise of his clemency, and said: "If he still liveth, he is my brother;" and after this fashion they can deceive us also by the error of that reasonable part, and make us incur the displeasure of God owing to that from which we were hoping that we might gain a reward and receive the recompense of goodness, and to us too the same rebuke may be addressed: "Because thou hast let go from thy hand a man who was worthy of death, thy life shall be for his life, and thy people for his people" Or when the unclean spirit says: "I will go forth, and will be a lying spirit in the mouth of all his prophets," he certainly spread the nets of deception by means of the reasonable feeling which he knew to be exposed to his deadly wiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 17"
