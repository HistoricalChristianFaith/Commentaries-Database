[[commentary]]
quote='''
"Because we were not restless among you." When he wants to prove by the practice of work that he was not restless among them, he fully shows that those who will not work are always restless, owing to the fault of idleness. "Nor did we eat any man's bread for nought." By each expression the teacher of the Gentiles advances a step in the rebuke. The preacher of the gospel says that he has not eaten any man's bread for nought, as he knows that the Lord commanded that "they who preach the gospel should live of the gospel:" again, "The labourer is worthy of his meat." And so if he who preached the gospel, performing a work so lofty and spiritual, did not venture in reliance on the Lord's command to eat his bread for nought, what shall we do to whom not merely is there no preaching of the word intrusted, but no cure of souls except our own committed? with what confidence shall we dare with idle hands to eat our bread for nought, when the "chosen vessel," constrained by his anxiety for the gospel and his work of preaching, did not venture to eat without labouring with his own hands? "But in labour," he says "and weariness, working night and day lest we should be burdensome to any of you." Up to this point he amplifies and adds to his rebuke. For he did not simply say, "We did not eat bread for nought from any of and then stop short. For it might have been thought that he was supported by his own private means, and by money which he had saved, or by other people's, though not by their collections and gifts. "But in labour," he says, "and weariness, working night and day is, being specially supported by our own labour. And this, he says, we did not of our own wish, and for our own pleasure, as rest and bodily exercise suggested, but as our necessities and the want of food compelled us to do, and that not without great bodily weariness. For not only throughout the whole day, but also by night, which seems to be granted for bodily rest, I was continually plying the work of my hands, through anxiety for food.

And he testifies that it was not he alone who so lived among them, lest haply this method might not seem important or general if he depended only on his example. But he declares that all those who were appointed with him for the ministry of the gospel, i.e., Silvanus and Timothy, who wrote this with him, worked in the same fashion. For by saying, "lest we should be burdensome to any of you, he covers them with great shame. For if he who preached the gospel and commended it by signs and mighty works, did not dare to eat bread for nought, lest he should be burdensome to any, how can those men help thinking that they are burdensome who take it every day in idleness and at their leisure?
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapters 8-9"
