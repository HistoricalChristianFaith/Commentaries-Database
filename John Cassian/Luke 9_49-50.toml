[[commentary]]
quote='''
And so these men gave no credit to themselves for their power of working such wonders, because they confessed that they were done not by their own merits but by the compassion of the Lord and with the words of the Apostle they refused the human hon- our offered out of admiration for their miracles: "Men and brethren, why marvel ye at this, or why look ye on us as though by our own power or holiness we had caused this man to walk." Nor did they think that any one should be renowned for the gifts and marvels of God, but rather for the fruits of his own good deeds, which are brought about by the efforts of his mind and the power of his works. For often, as was said above, men of corrupt minds, reprobate concerning the truth, both cast out devils and perform the greatest miracles in the name of the Lord. Of whom when the Apostles complained and said: "Master, we saw one casting out devils in Thy name, and we forbade him because he followeth not with us," though for the present Christ replied to them "Forbid him not, for he that is not against you is for you," still when they say at the end: "Lord, Lord, have we not in Thy name prophesied, and in Thy name cast out devils, and in Thy name done many mighty works?" He testifies that then He will answer: "I never knew you: depart from me, ye workers of iniquity." And therefore He actually warns those, to whom He Himself has given this glory of miracles and mighty works because of their holiness, that they be not puffed up by them, saying: "Rejoice not because the devils are subject to you, but rejoice rather because your names are written in heaven."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F15.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The Second Conference of Abbot Nesteros, Chapter 6"
