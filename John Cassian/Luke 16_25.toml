[[commentary]]
quote='''
Nor are we ignorant that there are even in our country some pleasant recesses, where plenty of fruits, and pleasant gardens, and fertile ground would furnish the food we need with the slightest bodily efforts on our part, were it not that we were afraid lest that reproach might apply to us, which is directed against the rich man in the gospel: "Because thou hast received thy consolation in this life."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 2"
