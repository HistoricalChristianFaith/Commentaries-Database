[[commentary]]
quote='''
This, this is the formula which the mind should unceasingly cling to until, strengthened by the constant use of it and by continual meditation, it casts off and rejects the rich and full material of all manner of thoughts and restricts itself to the poverty of this one verse, and so arrives with ready ease at that beatitude of the gospel, which holds the first place among the other beatitudes: for He says "Blessed are the poor in spirit, for theirs is the kingdom of heaven." And so one who becomes grandly poor by a poverty of this sort will fulfil this saying of the prophet: "The poor and needy shall praise the name of the Lord." And indeed what greater or holier poverty can there be than that of one who knowing that he has no defence and no strength of his own, asks for daily help from another's bounty, and as he is aware that every single moment his life and substance depend on Divine assistance, professes himself not without reason the Lord's bedesman, and cries to Him daily in prayer: "But I am poor and needy: the Lord helpeth me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F10.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The Second Conference of Abbot Isaac, Chapter 11"
