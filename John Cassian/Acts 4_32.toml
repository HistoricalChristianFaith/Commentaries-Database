[[commentary]]
quote='''
For if one is walking along the course previously marked out, how can he ever differ from his friend, for if he claims nothing for himself, he entirely cuts off the first cause of quarrel (which generally springs from trivial things and most unimportant matters), as he observes to the best of his power what we read in the Acts of the Apostles on the unity of believers: "But the multitude of believers was of one heart and soul; neither did any of them say that any of the things which he possessed was his own, but they had all things common."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 6"
