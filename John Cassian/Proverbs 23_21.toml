[[commentary]]
quote='''
But concerning this poverty of the idler elsewhere he also writes thus: "Every sluggard shall be clothed in torn garments and rags." For certainly he will not merit to be adorned with that garment of incorruption (of which the Apostle says, "Put ye on the Lord Jesus Christ," and again: "Being clothed in the breastplate of righteousness and charity," concerning which the Lord Himself also speaks to Jerusalem by the prophet: "Arise, arise, O Jerusalem, put on the garments of thy glory)," whoever, overpowered by lazy slumber or by accidie, prefers to be clothed, not by his labour and industry, but in the rags of idleness, which he tears off from the solid piece and body of the Scriptures, and fits on to his sloth no garment of glory and honour, but an ignominious cloak and excuse. For those, who are affected by this laziness, and do not like to support themselves by the labour of their own hands, as the Apostle continually did and charged us to do, are wont to make use of certain Scripture proofs by which they try to cloak their idleness, saying that it is written, "Labour not for the meat that perisheth, but for that which remains to life eternal;" and "My meat is to do the will of my Father." But these proofs are (as it were) rags, from the solid piece of the gospel, which are adopted for this purpose, viz., to cover the disgrace of our idleness and shame rather than to keep us warm, and adorn us with that costly and splendid garment of virtue which that wise woman in the Proverbs, who was clothed with strength and beauty, is said to have made either for herself or for her husband; of which presently it is said: "Strength and beauty are her clothing, and she rejoices in the latter days."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 21"
