[[commentary]]
quote='''
Theonas: If we weigh everything that we do, by a reasonable judgment of the mind, and on the purity of our heart always consult not the opinions of other people but our own conscience, that interval for refreshment is sure not to interfere with our proper strictness, if only, as was said, our pure mind impartially considers the right limits of indulgence and abstinence, and fairly checks excess in either, and with real discrimination discerns whether the weight of the delicacies is a burden upon our spirits, or whether too much austerity in abstaining weighs down the other side, i.e., that of the body, and either depresses or raises that side which it sees to be raised or weighed down. For our Lord would have nothing done to His honour and glory without being tempered by judgment, for "the honour of a king loveth judgment," and therefore Solomon, the wisest of men, urges us not to let our judgment incline to either side, saying: "Honour God with thy righteous labours and offer to Him of the fruits of thy righteousness."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 22"
