[[commentary]]
quote='''
For the purpose of God whereby He made man not to perish but to live for ever, stands immovable. And when His goodness sees in us even the very smallest spark of good will shining forth, which He Himself has struck as it were out of the hard flints of our hearts, He fans and fosters it and nurses it with His breath, as He "willeth all men to be saved and to come to the knowledge of the truth," for as He says, "it is not the will of your Father which is in heaven that one of these little ones should perish," and again it says: "Neither will God have a soul to perish, but recalleth," meaning that he that is cast off should not altogether perish. For He is true, and lieth not when He lays down with an oath: "As I live, saith the Lord God, for I will not the death of a sinner, but that he should turn from his way and live." For if He willeth not that one of His little ones should perish, how can we imagine without grievous blasphemy that He does not generally will all men, but only some instead of all to be saved? Those then who perish, perish against His will, as He testifies against each one of them day by day: "Turn from your evil ways, and why will ye die, O house of Israel?" And again: "How often would I have gathered thy children together as a hen gathereth her chickens under her wings, and ye would not;" and: "Wherefore is this people in Jerusalem turned away with a stubborn revolting? They have hardened their faces and refused to return."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 7"
