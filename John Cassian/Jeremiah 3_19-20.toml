[[commentary]]
quote='''
And hence it comes that for the most part when instead of good things we ask for the opposite, our prayer is either heard but tardily or not at all; and again the Lord vouchsafes to bring upon us even against our will, like some most beneficent physician, for our good what we think is opposed to it, and sometimes He delays and hinders our injurious purposes and deadly attempts from having their horrible effects, and, while we are rushing headlong towards death, draws us back to salvation, and rescues us without our knowing it from the jaws of hell.

And this care of His and providence with regard to us the Divine word has finely described by the prophet Hosea under the figure of Jerusalem as an harlot, and inclining with disgraceful eagerness to the worship of idols, where when she says: "I will go after my lovers, who give me my bread, and my water, and my wool, and my flax, and my oil, and my drink;" the Divine consideration replies having regard to her salvation and not to her wishes: "Behold I will hedge up thy way with thorns, and I will stop it up with a wall, and she shall not find her paths. And she shall follow after her lovers, and shall not overtake them: and she shall seek them, and shall not find them, and shall say: I will return to my first husband, because it was better with me then than now." And again our obstinacy, and scorn, with which we in our rebellious spirit disdain Him when He urges us to a salutary return, is described in the following comparison: He says: "And I said thou shalt call Me Father, and shalt not cease to walk after Me. But as a woman that despiseth her lover, so hath the house of Israel despised Me, saith the Lord." Aptly then, as He has compared Jerusalem to an adulteress forsaking her husband, He compares His own love and persevering goodness to a man who is dying of love for a woman. For the goodness and love of God, which He ever shows to mankind,-since it is overcome by no injuries so as to cease from caring for our salvation, or be driven from His first intention, as if vanquished by our iniquities,-could not be more fitly described by any comparison than the case of a man inflamed with most ardent love for a woman, who is consumed by a more burning passion for her, the more he sees that he is slighted and despised by her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapters 7-8"
