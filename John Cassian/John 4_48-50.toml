[[commentary]]
quote='''
But let no one imagine that we have brought forward these instances to try to make out that the chief share in our salvation rests with our faith, according to the profane notion of some who attribute everything to free will and lay down that the grace of God is dispensed in accordance with the desert of each man: but we plainly assert our unconditional opinion that the grace of God is superabounding, and sometimes overflows the narrow limits of man's lack of faith. And this, as we remember, happened in the case of the ruler in the gospel, who, as he believed that it was an easier thing for his son to be cured when sick than to be raised when dead, implored the Lord to come at once, saying: "Lord, come down ere my child die;" and though Christ reproved his lack of faith with these words: "Except ye see signs and wonders ye will not believe," yet He did not manifest the grace of His Divinity in proportion to the weakness of his faith, nor did He expell the deadly disease of the fever by His bodily presence, as the man believed he would, but by the word of His power, saying: "Go thy way, thy son liveth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 16"
