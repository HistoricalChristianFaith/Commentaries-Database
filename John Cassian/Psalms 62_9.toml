[[commentary]]
quote='''
Those also who take the main part of their offerings, i.e., their offices and actions, to benefit the flesh for their own use, but leave the remains of them and a tiny portion for the Lord, these the Divine Word thus condemns as fraudulent workmen: "Cursed is he that doeth the work of the Lord fraudulently." It is not then without reason that the Lord reproves him who thus deceives himself by unfair considerations, saying: "But vain are the children of men: the children of men are liars upon the balances that they may deceive."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 22"
