[[commentary]]
quote='''
But so far did the blessed Apostle recognize that what we say is true, that he actually wished to depart from this flesh; that by separation from it, he might be able to be joined more earnestly to the Lord; saying: "I desire to be dissolved and to be with Christ, which is far better, for while we are in the body we are absent from the Lord:" and therefore "we are bold and have our desire always to be absent from the body, and present with the Lord. Wherefore also we strive, whether absent or present, to be pleasing to Him;" and he declares indeed that the continuance of the soul which is in the flesh is distance from the Lord, and absence from Christ, and trusts with entire faith that its separation and departure from this flesh involves presence with Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F1.%2520First%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="First Conference of Abbot Moses, Chapter 14"
