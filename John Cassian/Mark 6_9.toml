[[commentary]]
quote='''
But refusing shoes, as forbidden by the command of the gospel, if bodily weakness or the morning cold in winter or the scorching heat of midday compels them, they merely protect their feet with sandals, explaining that by the use of them and the Lord's permission it is implied that if, while we are still in this world we cannot be completely set free from care and anxiety about the flesh, nor can we be altogether released from it, we should at least provide for the wants of the body with as little fuss and as slight an entanglement as possible: and as for the feet of our soul which ought to be ready for our spiritual race and always prepared for preaching the peace of the gospel (with which feet we run after the odour of the ointments of Christ, and of which David says: "I ran in thirst," and Jeremiah: "But I am not troubled, following Thee"), we ought not to suffer them to be entangled in the deadly cares of this world, filling our thoughts with those things which concern not the supply of the wants of nature, but unnecessary and harmful pleasures. And this we shall thus fulfil if, as the Apostle advises, we "make not provision for the flesh with its lusts."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25201.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 1, Chapter 9"
