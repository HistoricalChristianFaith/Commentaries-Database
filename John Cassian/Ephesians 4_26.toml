[[commentary]]
quote='''
Such is discretion, which is not only the "light of the body," but also called the sun by the Apostle, as it said "Let not the sun go down upon your wrath."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F2.%2520Second%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="Second Conference of Abbot Moses, Chapter 4"
