[[commentary]]
quote='''
Of fornication there are three sorts: (I) that which is accomplished by sexual intercourse; (2) that which takes place without touching a woman, for which we read that Onan the son of the patriarch Judah was smitten by the Lord; and which is termed by Scripture uncleanness: of which the Apostle says: "But I say to the unmarried and to widows, that it is good for them if they abide even as I. But if they do not contain let them marry: for it is better to marry than to burn;" (3) that which is conceived in heart and mind, of which the Lord says in the gospel: "Whosoever looketh on a woman to lust after her hath already committed adultery with her in his heart." And these three kinds the blessed Apostle tells us must be stamped out in one and the same way. "Mortify," says he, "your members which are upon the earth, fornication, uncleanness, lust, etc." And again of two of them he says to the Ephesians: "Let fornication and uncleanness be not so much as named among you:" and once more: "But know this that no fornicator or unclean person, or covetous person who is an idolater hath inheritance in the kingdom of Christ and of God." And just as these three must be avoided by us with equal care, go they one and all shut us out and exclude us equally from the kingdom of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 11"

[[commentary]]
quote='''
Secondly, he should realize that in the actual wearing of the girdle there is no small mystery declaring what is demanded of him. For the girding of the loins and binding them round with a dead skin signifies that he bears about the mortification of those members in which are contained the seeds of lust and lasciviousness, always knowing that the command of the gospel, which says, "Let your loins be girt about, " is applied to him by the Apostle's interpretation; to wit, "Mortify your members which are upon the earth; fornication, uncleanness, lust, evil concupiscence."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25201.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 1, Chapter 11"

[[commentary]]
quote='''
If the man has dropped away at all from the hope of gain, he has no scruples about transgressing the bounds of humility, and through it all gold and the love of gain become to him his god, as the belly does to others. Wherefore the blessed Apostle, looking out on the deadly poison of this pest, not only says that it is a root of all kinds of evil, but also calls it the worship of idols, saying "And covetousness (which in Greek is called filarguri/a) which is the worship of idols." You see then to what a downfall this madness step by step leads, so that by the voice of the Apostle it is actually declared to be the worship of idols and false gods, because passing over the image and likeness of God (which one who serves God with devotion ought to preserve undefiled in himself), it chooses to love and carefor images stamped on gold instead of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25207.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 7, Chapter 7"
