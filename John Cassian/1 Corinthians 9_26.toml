[[commentary]]
quote='''
But our belief is that they undertake this struggle not without effort on their part. For in their conflict they themselves have some sort of anxiety and depression, and especially when they are matched with stronger rivals, i.e., saints and perfect men. Otherwise no contest or struggle, but only a simple deception of men, and one free from anxiety on their part would be assigned to them. And how then would the Apostle's words stand, where he says: "We wrestle not against flesh and blood, but against principalities, against powers, against world-rulers of this darkness, against spiritual wickedness in heavenly places;" and this too: "So fight I, not as one that beateth the air;" and again: "I have fought a good fight"? For where it is spoken of as a fight, and conflict, and battle, there must be effort and exertion and anxiety on both sides, and equally there must either be in store for them chagrin and confusion for their failure, or delight consequent upon their victory. But where one fights with ease and security against another who struggles with great effort, and in order to overthrow his rival makes use of his will alone as his strength, there it ought not to be called a battle, struggle, or strife, but a sort of unfair and unreasonable assault and attack.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 21"
