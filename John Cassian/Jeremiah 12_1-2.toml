[[commentary]]
quote='''
Jeremiah also, when conversing with God on this prosperity of sinners, although he never professes to doubt about the justice of God, as he says "for Thou art just, O Lord, if I dispute with Thee," yet in his inquiry as to the reasons of this inequality, proceeds to say: "But yet I will speak what is just to Thee. Why doth the way of the wicked prosper? Why is it well with all them that transgress and do wickedly? Thou hast planted them and they have taken root: they prosper and bring forth fruit. Thou art near in their mouth and far from their reins."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 31"
