[[commentary]]
quote='''
Among those then who were caught by this mistaken notion was one named Sarapion, a man of long-standing strictness of life, and one who was altogether perfect in actual discipline, whose ignorance with regard to the view of the doctrine first mentioned was so far a stumbling block to all who held the true faith, as he himself outstripped almost all the monks both in the merits of his life and in the length of time (he had been there). And when this man could not be brought back to the way of the right faith by many exhortations of the holy presbyter Paphnutius, because this view seemed to him a novelty, and one that was not ever known to or handed down by his predecessors, it chanced that a certain deacon, a man of very great learning, named Photinus, arrived from the region of Cappadocia with the desire of visiting the brethren living in the same desert: whom the blessed Paphnutius received with the warmest welcome, and in order to confirm the faith which had been stated in the letters of the aforesaid Bishop, placed him in the midst and asked him before all the brethren how the Catholic Churches throughout the East interpreted the passage in Genesis where it says "Let us make man after our image and likeness." And when he explained that the image and likeness of God was taken by all the leaders of the churches not according to the base sound of the letters, but spiritually, and supported this very fully and by many passages of Scripture, and showed that nothing of this sort could happen to that infinite and incomprehensible and invisible glory, so that it could be comprised in a human form and likeness, since its nature is incorporeal and uncompounded and simple, and what can neither be apprehended by the eyes nor conceived by the mind, at length the old man was shaken by the numerous and very weighty assertions of this most learned man, and was drawn to the faith of the Catholic tradition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F10.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The Second Conference of Abbot Isaac, Chapter 3"

[[commentary]]
quote='''
Isaac: We need not be surprised that a really simple man who had never received any instruction on the substance and nature of the Godhead could still be entangled and deceived by an error of simplicity and the habit of a longstanding mistake, and (to speak more truly) continue in the original error which is brought about, not as you suppose by a new illusion of the demons, but by the ignorance of the ancient heathen world, while in accordance with the custom of that erroneous notion, by which they used to worship devils formed in the figure of men, they even now think that the incomprehensible and ineffable glory of the true Deity should be worshipped under the limitations of some figure, as they believe that they can grasp and hold nothing if they have not some image set before them, which they can continually address while they are at their devotions, and which they can carry about in their mind and have always fixed before their eyes. And against this mistake of theirs this text may be used: "And they changed the glory of the incorruptible God into the likeness of the image of corruptible man." Jeremiah also says: "My people have changed their glory for an idol. Which error although by this its origin, of which we have spoken, it is engrained in the notions of some, yet none the less is it contracted in the hearts also of those who have never been stained with the superstition of the heathen world, under the colour of this passage where it is said "Let us make man after our image and our likeness," ignorance and simplicity being its authors, so that actually there has arisen owing to this hateful interpretation a heresy called that of the Anthropomorphites, which maintains with obstinate perverseness that the infinite and simple substance of the Godhead is fashioned in our lineaments and human configuration. Which however any one who has been taught the Catholic doctrine will abhor as heathenish blasphemy, and so will arrive at that perfectly pure condition in prayer which will not only not connect with its prayers any figure of the Godhead or bodily lineaments (which it is a sin even to speak of), but will not even allow in itself even the memory of a name, or the appearance of an action, or an outline of any character.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F10.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The Second Conference of Abbot Isaac, Chapter 5"
