[[commentary]]
quote='''
And therefore the will always remains free in man, and can either neglect or delight in the grace of God. For the Apostle would not have commanded saying: "Work out your own salvation with fear and trembling," had he not known that it could be advanced or neglected by us. But that men might not fancy that they had no need of Divine aid for the work of Salvation, he subjoins: "For it is God that worketh in you both to will and to do, of His good pleasure." And therefore he warns Timothy and says: "Neglect not the grace of God which is in thee;" and again: "For which cause I exhort thee to stir up the grace of God which is in thee." Hence also in writing to the Corinthians he exhorts and warns them not through their unfruitful works to show themselves unworthy of the grace of God, saying: "And we helping, exhort you that ye receive not the grace of God in vain:" for the reception of saving grace was of no profit to Simon doubtless because he had received it in vain; for he would not obey the command of the blessed Peter who said: "Repent of thine iniquity, and pray God if haply the thoughts of thine heart may be forgiven thee; for I perceive that thou art in the gall of bitterness and the bonds of iniquity."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 12"
