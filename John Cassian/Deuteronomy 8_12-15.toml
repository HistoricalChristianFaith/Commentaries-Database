[[commentary]]
quote='''
And that we ought not to be puffed up by victories over them he likewise charges us; saying, "Lest after thou hast eaten and art filled, hast built goodly houses and dwelt in them, and shalt have herds of oxen and flocks of sheep, and plenty of gold and of silver, and of all things, thy heart be lifted up and thou remember not the Lord thy God, who brought thee out of the land of Egypt, out of the house of bondage; and was thy leader in the great and terrible wilderness." Solomon also says in Proverbs: "When thine enemy shall fall be not glad, and in his ruin be not lifted up, lest the Lord see and it displease Him, and He turn away His wrath from him," i.e., lest He see thy pride of heart, and cease from attacking him, and thou begin to be forsaken by Him and so once more to be troubled by that passion which by God's grace thou hadst previously overcome. For the prophet would not have prayed in these words, "Deliver not up to beasts, O Lord, the soul that confesseth to Thee," unless he had known that because of their pride of heart some were given over again to those faults which they had overcome, in order that they might be humbled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 15"
