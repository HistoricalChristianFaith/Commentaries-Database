[[commentary]]
quote='''
For what sinner defiles himself unwillingly by adulteries and fornication? Who against his will prepares plots against his neighbour? Who is driven by unavoidable necessity to oppress a man by false witness or cheat him by theft, or covet the goods of another or shed his blood? Nay rather, as Scripture says, "Mankind is diligently inclined to wickedness from his youth." For to such an extent are all inflamed by the love of sin and desire to carry out what they like, that they actually look out with watchful care for an opportunity of committing wickedness and are afraid of being too slow to enjoy their lusts, and glory in their shame and the mass of their crimes, as the Apostle says in censure, and seek credit for themselves out of their own confusion, of whom also the prophet Jeremiah maintains that they commit their flagitious crimes not only not unwillingly nor with ease of heart and body, but with laborious efforts to such an extent that they come to toil to carry them out, so that they are prevented even by the hindrance of arduous difficulty from their deadly quest of sin; as he says: "They have laboured to do wickedly."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F23.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The Third Conference of Abbot Theonas, Chapter 1"
