[[commentary]]
quote='''
Germanus: Why then do we relax the rigour of our abstinence in our meals all through the fifty days, whereas Christ only remained with His disciples for forty days after His resurrection?

Your pertinent question deserves to be told the perfect true reason. After the Ascension of our Saviour which took place on the fortieth day after His Resurrection, the apostles returned from the Mount of Olives, on which He had suffered them to see Him when He was returning to the Father, as the book of the Acts of the Apostles also testifies, and entered Jerusalem and are said to have waited ten days for the coming of the Holy Ghost, and when these were fulfilled on the fiftieth day they received Him with joy. And thus in this way the number of this festival was clearly made up, which as we read was figuratively foreshadowed also in the Old Testament, where when seven weeks were fulfilled the bread of the firstfruits was ordered to be offered by the priests to the Lord: and this was indeed shown to be offered to the Lord by the preaching of the Apostles which they are said on that day to have addressed to the people; the true bread of the firstfruits, which when produced from the instruction of a new doctrine, consecrated the firstfruits of the Jews as a Christian people to the Lord, five thousand men being filled with the gifts of the food. And therefore these ten days are to be kept with equal solemnity and joy as the previous forty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapters 19-20"
