[[commentary]]
quote='''
And thence it comes that in whatever degree any one stands, he is found sometimes to offer up pure and devout prayers; as even in that first and lowly station which has to do with the recollection of future judgment, he who still remains under the punishment of terror and the fear of judgment is so smitten with sorrow for the time being that he is filled with no less keenness of spirit from the richness of his supplications than he who through the purity of his heart gazes on and considers the blessings of God and is overcome with ineffable joy and delight. For, as the Lord Himself says, he begins to love the more, who knows that he has been forgiven the more.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 15"
