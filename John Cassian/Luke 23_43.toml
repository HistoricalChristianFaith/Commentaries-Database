[[commentary]]
quote='''
But if you care too to understand the words spoken to the thief "To-day thou shalt be with Me in Paradise," what do they clearly show but that not only does their former intelligence continue with the souls, but also that in their changed condition they partake of some state which corresponds to their actions and deserts? For the Lord would certainly never have promised him this, if He had known that his soul after being separated from the flesh would either have been deprived of perception or have been resolved into nothing. For it was not his flesh but his soul which was to enter Paradise with Christ. At least we must avoid, and shunwith the utmost horror, that wicked punctuation of the heretics, who, as they do not believe that Christ could be found in Paradise on the same day on which He descended into hell, thus punctuate "Verily, I say unto you to-day," and making a stop apply "thou shall be with. Me in Paradise, in such a way that they imagine that this promise was not fulfilled at once after he departed from this life, but that it will be fulfilled after the resurrection, as they do not understand what before the time of His resurrection He declared to the Jews, who fancied that He was hampered by human difficulties and weakness of the flesh as they were: "No man hath ascended into heaven, but He who came down from heaven, even the Son of man who is in heaven:" by which He clearly shows that the souls of the departed are not only not deprived of their reason, but that they are not even without such feelings as hope and sorrow, joy and fear, and that they already are beginning to taste beforehand something of what is reserved for them at the last judgment, and that they are not as some unbelievers hold resolved into nothing after their departure from this life: but that they live a more real life, and are still more earnest in waiting on the praises of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F1.%2520First%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="First Conference of Abbot Moses, Chapter 14"
