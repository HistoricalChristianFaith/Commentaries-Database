[[commentary]]
quote='''
But that it may be still clearer that through the excellence of nature which is granted by the goodness of the Creator, sometimes first beginnings of a good will arise, which however cannot attain to the complete performance of what is good unless it is guided by the Lord, the Apostle bears witness and says: "For to will is present with me, but to perform what is good I find not."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 9"
