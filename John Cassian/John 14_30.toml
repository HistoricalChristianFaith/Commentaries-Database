[[commentary]]
quote='''
And this also the same spirit expected in the case of our Lord, when he tempted Him in these three affections of the soul, wherein he knew that all mankind had been taken captive, but gained nothing by his crafty wiles. For he approached that portion of his mind which was subject to desire, when he said: "Command that these stones be made bread;" the part subject to wrath, when he tried to incite Him to seek the power of the present life and the kingdoms of this world; the reasonable part when he said: "If Thou art the Son of God cast Thyself down from hence." And in these his deception availed nothing for this reason because he found that there was nothing damaged in Him, in accordance with the supposition which he had formed from a false idea. Wherefore no part of His soul yielded when tempted by the wiles of the foe, "For lo," He saith, "the prince of this world cometh and shall find nothing in Me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 17"
