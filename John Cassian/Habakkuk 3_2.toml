[[commentary]]
quote='''
This then we think should be above all else observed by those who want to keep the affec- tion of their companions unimpaired; viz., that first of all when provoked by any wrongs, a monk should keep not only his lips but even the depth of his breast unmoved: but if he finds that they are even slightly disturbed, let him keep himself in by entire silence, and diligently observe what the Psalmist speaks of: "I was troubled and spake nothing;" and: "I said I will take heed to thy ways that I offend not with my tongue. I have set a guard to my mouth, when the sinner stood against me. I was dumb and was humbled, and kept silence from good things;" and he should not pay any heed to his present state, nor give vent to what his violent rage suggests and his exasperated mind expresses at the moment, but should dwell on the grace of past love or look forward in his mind to the renewal and restoration of peace, and contemplate it even in the very hour of rage, as if it were sure presently to return. And while he is reserving himself for the delight of harmony soon to come, he will not feel the bitterness of the present quarrel and will easily make such answers that, when love is restored, he will not be able to accuse himself as guilty or be blamed by the other; and thus he will fulfil these words of the prophet: "In wrath remember mercy."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 26"
