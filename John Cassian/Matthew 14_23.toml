[[commentary]]
quote='''
But Jesus is seen as well by those who live in towns and villages and hamlets, i.e., who are occupied in practical affairs and works, but not with the same brightness with which He appeared to those who can go up with Him into the aforesaid mount of virtues, i.e., Peter, James, and John. For so in solitude He appeared to Moses and spoke with Elias. And as our Lord wished to establish this and to leave us examples of perfect purity, although He Himself, the very fount of inviolable sanctity, had no need of external help and the assistance of solitude in order to secure it (for the fulness of purity could not be soiled by any stain from crowds, nor could He be contaminated by intercourse with men, who cleanses and sanctifies all things that are polluted) yet still He retired into the mountain alone to pray, thus teaching us by the example of His retirement that if we too wish to approach God with a pure and spotless affection of heart, we should also retire from all the disturbance and confusion of crowds, so that while still living in the body we I may manage in some degree to adapt ourselves to some likeness of that bliss which is promised hereafter to the saints, and that "God may be" to us "all in all."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F10.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The Second Conference of Abbot Isaac, Chapter 6"
