[[commentary]]
quote='''
For it is no ordinary virtue nor one which can be freely gained by merely human efforts, unless they are aided by the Divine blessing, for we read that this is also reckoned among the noblest gifts of the Spirit by the Apostle: "To one is given by the Spirit the word of wisdom, to another the word of knowledge by the same Spirit, to another faith by the same Spirit, to another the gift of healing by the same Spirit," and shortly after, "to another the discerning of spirits." Then after the complete catalogue of spiritual gifts he subjoins: "But all these worketh one and the selfsame Spirit, dividing to every man severally as He will." You see then that the gift of discretion is no earthly thing and no slight matter, but the greatest prize of divine grace. And unless a monk has pursued it with all zeal, and secured a power of discerning with unerring judgment the spirits that rise up in him, he is sure to go wrong, as if in the darkness of night and dense blackness, and not merely to fall down dangerous pits and precipices, but also to make frequent mistakes in matters that are plain and straightforward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F2.%2520Second%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="Second Conference of Abbot Moses, Chapter 1"
