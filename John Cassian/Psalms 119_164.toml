[[commentary]]
quote='''
And this form, although it may seem to have arisen out of an accident and to have been appointed within recent memory for the reason given above, yet it clearly makes up according to the letter that number which the blessed David indicates (although it can be taken spiritually): "Seven times a day do I praise Thee because of Thy righteous judgments." For by the addition of this service we certainly hold these spiritual assembliesseven times a day, and are shown to sing praises to God seven times in it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25203.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 3, Chapter 4"
