[[commentary]]
quote='''
"The beginning" of our salvation and the safeguard of it is, as I said, "the fear of the Lord." For through this those who are trained in the way of perfection can gain a start in, conversion as well as purification from vices and security in virtue. And when this has gained an entrance into a man's heart it produces contempt of all things, and begets a forgetfulness of kinsfolk and an horror of the world itself. But by the contempt for the loss of all possessions humility is gained. And humility is attested by these signs: First of all if a man has all his desires mortified; secondly, if he conceals none of his actions or even of his thoughts from his superior; thirdly, if he puts no trust in his own opinion, but all in the judgment of his superior, and listens eagerly and willingly to his directions; fourthly, if he maintains in everything obedience and gentleness and constant patience; fifthly, if he not only hurts nobody else, but also is not annoyed or vexed at wrongs done to himself; sixthly, if he does nothing and ventures on nothing to which he is not urged by the Common Rule or by the example of our elders; seventhly, if he is contented with the lowest possible position, and considers himself as a bad workman and unworthy inthe case of everything enjoined to him; eighthly, if he does not only outwardly profess with his lips that he is inferior to all, but really believes it in the inmost thoughts of his heart; ninthly, if he governs his tongue, and is not over talkative; tenthly, if he is not easily moved or too ready to laugh. For by such signs and the like is true humility recognised. And when this has once been genuinely secured, then at once it leads you on by a still higher step to love which knows no fear; and through this you begin, without any effort andas it were naturally, to keep up everything that you formerly observed not without fearof punishment; no longer now from regard of punishment or fear of it but from love of goodness itself, and delight in virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25204.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 4, Chapter 39"

[[commentary]]
quote='''
And in order that all these things which have been set forth in a somewhat lengthy discourse may be more easily stamped on your heart and may stick in your thoughts with all tenacity, I will make a summary of them so that you may be able to learn all the changes by heart by reason of their brevity and conciseness. Hear then in few words how you can mount up to the heights of perfection without an effort or difficult "The beginning" of our salvation and of wisdom" is, according to Scripture, "the fear of the Lord." From the fear of the Lord arises salutary compunction. From compunction of heart springs renunciation, i.e. nakedness and contempt of all possessions. From nakedness is begotten humility; from humility the mortification of desires. Through mortification of desires all faults are extirpated and decay. By driving out faults virtues shoot up and increase. By the budding of virtues purity of heart is gained. By purity of heart the perfection of apostolic love is acquired.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25204.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 4, Chapter 43"
