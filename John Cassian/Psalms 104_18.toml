[[commentary]]
quote='''
And so by the illumination of God Himself he mounts to that manifold knowledge of Him and begins henceforward to be nourished on sublimer and still more sacred mysteries, in accordance with these words of the prophet: "The high hills are a refuge for the stags, the rocks for the hedgehogs," which is very fairly applied in the sense we have given, because whosoever continues in simplicity and innocence is not injurious or offensive to any one, but being content with his own simple condition endeavours simply to defend himself from being spoiled by his foes, and becomes a sort of spiritual hedgehog and is protected by the continual shield of that rock of the gospel, i.e., being sheltered by the recollection of the Lord's passion and by ceaseless meditation on the verse given above he escapes the snares of his opposing enemies. And of these spiritual hedgehogs we read in Proverbs as follows: "And the hedgehogs are a feeble folk, who have made their homes in the rocks." And indeed what is feebler than a Christian, what is weaker than a monk, who is not only not permitted any vengeance for wrongs done to him but is actually not allowed to suffer even a slight and silent feeling of irritation to spring up within? But whoever advances from this condition and not only secures the simplicity of innocence, but is also shielded by the virtue of discretion, becomes an exterminator of deadly serpents, and has Satan crushed beneath his feet, and by his quickness of mind answers to the figure of the reasonable stag, this man will feed on the mountains of the prophets and Apostles, i.e., on their highest and loftiest mysteries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F10.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The Second Conference of Abbot Isaac, Chapter 11"
