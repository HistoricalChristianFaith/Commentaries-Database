[[commentary]]
quote='''
"And forgive us our debts as we also forgive our debtors." O unspeakable mercy of God, which has not only given us a form of prayer and taught us a system of life acceptable to Him, and by the requirements of the form given, in which He charged us always to pray, has torn up the roots of both anger and sorrow, but also gives to those who pray an opportunity and reveals to them a way by which they may move a merciful and kindly judgment of God to be pronounced over them and which somehow gives us a power by which we can moderate the sentence of our Judge, drawing Him to forgive our offences by the example of our forgiveness: when we say to Him: "Forgive us as we also forgive." And so without anxiety and in confidence from this prayer a man may ask for pardon of his own offences, if he has been forgiving towards his own debtors, and not towards those of his Lord. For some of us, which is very bad, are inclined to show ourselves calm and most merciful in regard to those things which are done to God's detriment, however great the crimes may be, but to be found most hard and inexorable exactors of debts to ourselves even in the case of the most trifling wrongs. Whoever then does not from his heart forgive his brother who has offended him, by this prayer calls down upon himself not forgiveness but [condemnation, and by his own profession asks that he himself may be judged more severely, saying: Forgive me as I also have forgiven. And if he is repaid according to his own request, what else will follow but that he will be punished after his own example with implacable wrath and a sentence that cannot be remitted? And so if we want to be judged mercifully, we ought also to be merciful towards those who have sinned against us. For only so much will be remitted to us, as we have remitted to those who have injured us however spitefully. And some dreading this, when this prayer is chanted by all the people in church, silently omit this clause, for fear lest they may seem by their own utterance to bind themselves rather than to excuse themselves, as they do not understand that it is in vain that they try to offer these quibbles to the Judge of all men, who has willed to show us beforehand how He will judge His suppliants. For as He does not wish to be found harsh and inexorable towards them, He has marked out the manner of His judgment, that just as we desire to be judged by Him, so we should also judge our brethren, if they have wronged us in anything, for "he shall have judgment without mercy who hath shown no mercy."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 22"

[[commentary]]
quote='''
But if shame holds you back, and you blush to reveal them before men, you should not cease to confess them with constant supplication to Him from Whom they cannot be hid, and to say to Him: "I acknowledge mine iniquity, and my sin is ever before me. Against Thee only have I sinned, and have done evil before Thee;" as He is wont to heal them without any publication which brings shame, and to forgive sins without any reproaching. And further besides that ready and sure aid the Divine condescension has afforded us another also that is still easier, and has entrusted the possession of the remedy to our own will, so that we can infer from our own feelings the forgiveness of our offences, when we say to Him: "Forgive us our debts as we also forgive our debtors."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F20.%2520Conference%2520of%2520Abbot%2520Pinufius.html'
source_title="Conference of Abbot Pinufius, Chapter 8"

[[commentary]]
quote='''
But that no one however holy is in this life free from trespasses and sin, we are told also by the teaching of the Saviour, who gave His disciples the form of the perfect prayer and among those other sublime and sacred commands, which as they were only given to the saints and perfect cannot apply to the wicked and unbelievers, He bade this to be inserted: "And forgive us our debts as we also forgive our debtors." If then this is offered as a true prayer and by saints, as we ought without the shadow of a doubt to believe, who can be found so obstinate and impudent, so puffed up with the pride of the devil's own rage, as to maintain that he is without sin, and not only to think himself greater than apostles, but also to charge the Saviour Himself with ignorance or folly, as if He either did not know that some men could be free from debts, or was idly teaching those whom He knew to stand in no need of the remedy of that prayer? But since all the saints who altogether keep the commands of their King, say every day "Forgive us our debts," if they sneak the truth there is indeed no one free from sin, but if they speak falsely, it is equally true that they are not free from the sin of falsehood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F23.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The Third Conference of Abbot Theonas, Chapter 18"
