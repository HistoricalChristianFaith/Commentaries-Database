[[commentary]]
quote='''
But to return to the explanation of the knowledge from which our discourse took its rise. Thus, as we said above, practical knowledge is distributed among many subjects and interests, but theoretical is divided into two parts, i.e., the historical interpretation and the spiritual sense. Whence also Solomon when he had summed up the manifold grace of the Church, added: "for all who are with her are clothed with double garments." But of spiritual knowledge there are three kinds, tropological, allegorical, anagogical, of which we read as follows in Proverbs: "But do you describe these things to yourself in three ways according to the largeness of your heart."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 8"
