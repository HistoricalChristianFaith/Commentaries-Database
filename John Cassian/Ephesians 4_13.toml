[[commentary]]
quote='''
Moreover also: "the kingdom of heaven suffereth violence and the violent take it by force," for no virtue is acquired without effort, nor can anyone attain to that mental stability which he desires without great sorrow of heart, for "man is born to trouble," and in order that he may be able to attain to "the perfect man, the measure of the stature of the fulness of Christ" he must ever be on the watch with still greater intentness, and toil with ceaseless carefulness. But to the fulness of this measure no one will ever attain, but one Who has considered it beforehand and been trained to it now and has had some foretaste of it while still in this world, and being marked a most precious member of Christ, has possessed in the flesh an earnest of that "joint" by which he can be united to His body: desiring one thing alone, thirsting for but one thing, ever bringing not only his acts but even his thoughts to bear on one thing alone; viz., that he may even now keep as an earnest that which is said of the blessed life of thesaints hereafter; viz., that "God may be" to him "all in all."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 6"

[[commentary]]
quote='''
For if we want to gain all virtues from some one person, we shall with great difficulty or perhaps never at all find suitable examples for us to imitate. For though we do not as yet see that even Christ is made "all things in all," as the Apostle says; still in this way we can find Him bit by bit in all. For it is said of Him, "Who was made of God to you wisdom and righteousness and sanctification and redemption." While then in one there is found wisdom, in another righteousness, in another sanctification, in another kindness, in another chastity, in another humility, in another patience, Christ is at the present time divided, member by member, among all of the saints. But when all come together into the unity of the faith and virtue, He is formed into the "perfect man," completing the fulness of His body, in the joints and properties of all His members. Until then that time arrives when God will be "all in all," for the present God can in the way of which we have spoken be "in all," through particular virtues, although He is not yet "all in all" through the fulness of them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25205.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 5, Chapter 4"
