[[commentary]]
quote='''
And therefore the blessed Apostle prefers it not only above fear and hope but also above all gifts which are counted great and wonderful, and shows the way of love still more excellent than all. For when after finishing his list of spiritual gifts of virtues he wanted to describe its members, he began as follows: "And yet I show unto you a still more excellent way. Though I speak with the tongues of men and angels, and though I have the gift of prophecy and know all mysteries and all knowledge, and though I have all faith so that I can remove mountains, and though I bestow all my goods to feed the poor, and give my body to be burned, but have not love, it profiteth me nothing." You see then that nothing more precious, nothing more perfect, nothing more sublime, and, if I may say so, nothing more enduring can be found than love. For "whether there be prophecies, they shall fail, whether there be tongues, they shall cease, whether there be knowledge, it shall be destroyed," but "love never faileth," and without it not only those most excellent kinds of gifts, but even the glory of martyrdom itself will fail.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 12"

[[commentary]]
quote='''
Wherefore we never ought to admire those who affect these things, for these powers, but rather to look whether they are perfect in driving out all sins, and amending their ways, for this is granted to each man not for the faith of some other, or for a variety of reasons, but for his own earnestness, by the action of God's grace. For this is practical knowledge which is termed by another name by the Apostle; viz., love, and is by the authority of the Apostle preferred to all tongues of men and of angels, and to full assurance of faith which can even remove mountains, and to all knowledge, and prophecy, and to the distribution of all one's goods, and finally to the glory of martyrdom itself. For when he had enumerated all kinds of gifts and had said: "To one is given by the Spirit the word of wisdom, to another the word of knowledge, to another faith, to another the gift of healing, to another the working of miracles, etc.:" when he was going to speak about love notice how in a few words he put it before all gifts: "Andyet," he says, "I show unto you a still more excellent way." By which it is clearly shown that the height of perfection and blessedness does not consist in the performance of those wonderful works but in the purity of love. And this not without good reason. For all those things are to pass away and be destroyed, but love is to abide for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F15.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The Second Conference of Abbot Nesteros, Chapter 2"
