[[commentary]]
quote='''
For that evil is so far incurable that it is made worse by attentions, it is increased by services, is irritated by presents, because as the same Solomon says: "envy endures nothing." For just in proportion as another has made progress in humble submission or in the virtue of patience or in the merit of munificence, so is a man excited by worse pricks of envy, because he desires nothing less than the ruin or death of the man whom he envies. Lastly no submission on the part of their harmless brother could soften the envy of the eleven patriarchs, so that Scripture relates of them: "But his brothers envied him because his father loved him, and they could not speak peaceably unto him" until their jealousy, which would not listen to any entreaties on the part of their obedient and submissive brother, desired his death, and would scarcely be satisfied with the sin of selling a brother.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 16"
