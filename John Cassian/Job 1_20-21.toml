[[commentary]]
quote='''
Anyone therefore who is not at all puffed up through the aid of vainglory by any of those things on the right hand which we have mentioned, and who struggles manfully against those on the left hand, and does not yield to despair and give in, but rather on the other hand seizes the armour of patience to practise himself in virtue-this man can use both hands as fight hands, and in each action he proves triumphant and carries off the prize of victory from that condition on the left hand as well as that on the fight. Such, we read, was the reward which the blessed Job obtained who was certainly crawned (for a victory) on the right hand, when he was the father of seven sons and walked as a rich and wealthy man, and yet offered daily sacrifices to the Lord for their purification, in his anxiety that they might prove acceptable and dear to God rather than to himself, when his gates stood open to every stranger, when he was "feet to lame and eyes to blind," when the shoulders of the suffering were kept warm by the wool of his sheep, when he was a father to orphans and a husband to widows, when he did not even in his heart rejoice at the fall of his enemy. And again it was the same man who with still greater virtue triumphed over adversity on the left hand, when deprived in one moment of his seven sons he was not as a father overcome with bitter grief but as a true servant of God rejoiced in the will of his Creator. When instead of being a wealthy man he became poor, naked instead of rich, pining away instead of strong, despised and contemptible instead of famous and honourable, and yet preserved his fortitude of mind unshaken, when, lastly, bereft of all his wealth and substance he took up his abode on the dunghill, and like some stern executioner of his own body scraped with a potsherd the matter that broke out, and plunging his fingers deep into his wounds dragged out on every side masses of worms from his limbs. And in all this he never fell into despair and blasphemy, nor murmured at all against his Creator. Moreover also so little was he overcome by such a weight of bitter temptations that the cloak which out of all his former property remained to cover his body, and which alone could be saved from destruction by the devil because he was clothed with it, he rent and cast off, and covered with it his nakedness which he voluntarily endured, which the terrible robber had brought upon him. The hair of his head too, which was the only thing left untouched out of all the remains of his former glory, he shaved and cast to his tormentor, and cutting off even that which his savage foe had left to him he exulted over him and mocked him with that celestial cry of his: "If we have received good at the hand of the Lord, should we not also receive evil? Naked came I out of my mother's womb, and naked shall I return thither. The Lord gave and the Lord hath taken away; as it hath pleased the Lord, so is it done; blessed be the name of the Lord."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F6.%2520Conference%2520of%2520Abbot%2520Theodore.html'
source_title="Conference of Abbot Theodore, Chapter 10"
