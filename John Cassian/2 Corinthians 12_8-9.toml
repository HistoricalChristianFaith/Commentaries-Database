[[commentary]]
quote='''
For if we also remember these words of the Apostle that "we know not what to pray for as we ought" we shall see that we sometimes ask for things opposed to our salvation and that we are most providentially refused our requests by Him who sees what is good for us with greater right and truth than we can. And it is clear that this also happened to the teacher of the Gentiles when he prayed that the messenger of Satan who had been for his good allowed by the Lord's will to buffet him, might be removed, saying: "For which I besought the Lord thrice that he might depart from me. And He said unto me, My grace is sufficient for thee, for strength is made perfect in weakness."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 34"

[[commentary]]
quote='''
For it is not in our power to secure the silence of solitude and severe fasts and undisturbed study even when we could use such opportunities, but by a chapter of accidents we are often very much against our will kept away from the salutary ordinances so that we have to pray to the Lord for opportunities of place or time in which to practise them. And it is clear that the ability for these is not sufficient for us unless there be also granted to us by the Lord an opportunity of doing what we are capable of (as the Apostle also says: "For we wanted to come to you once and again, but Satan hindered us" ), so that sometimes we find for our advantage we are called away from these spiritual exercises in order that while without our own consent the regularity of our routine is broken and we yield something to weakness of the flesh, we may even against our will be brought to a salutary patience. Of which providential arrangement of God the blessed Apostle says something similar: "For which I besought the Lord thrice that it might depart from me. And He said to me: My grace is sufficient for thee: for my strength is made perfect in weakness:" and again: "For we know not what to pray for as we ought."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 6"
