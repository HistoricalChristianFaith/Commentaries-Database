[[commentary]]
quote='''
With all possible care therefore avoid being puffed up with the love of vainglory, and so failing to become a partaker with him whom the prophet praises, "who hath not given his money upon usury." For every one who, from love of the praise of men dispenses the words of God, of which it is said "the words of the Lord are pure words, as silver tried by the fire, purged from the earth, refined seven times," puts out his money upon usury, and will deserve for this not merely no reward, but rather punishment. For this reason he chose to use up his Lord's money that he might be the garner from a temporal profit, and not that the Lord, as it is written, might "when He comes, receive His own with usury."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 17"
