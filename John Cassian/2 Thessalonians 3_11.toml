[[commentary]]
quote='''
Then after all this rigour of gospel severity, he now lays bare the reason why he put forward all these matters. "For we have heard that some among you walk disorderly, working not at all, but curiously meddling." He is nowhere satisfied to speak of those who will not give themselves up to work, as if they were victims of but a single malady. For in his first Epistle he speaks of them as "disorderly," and not walking according to the traditions which they had received from him: and he also asserts that they were restless, and ate their bread for nought. Again he says here, "We have heard that there are some among you who walk disorderly." And at once he subjoins a second weakness, which is the root of this restlessness, and says, "working not at all;" a third malady as well he adds, which springs from this last like some shoot: "but curiously meddling."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 13"
