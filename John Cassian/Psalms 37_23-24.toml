[[commentary]]
quote='''
For "By the Lord," and not by free-will, "are a man's steps directed," and "although the righteous fair" at least by free will, "he shall not be east away." And why? because "the Lord upholdeth him with His hand:" and this is to say with the utmost clearness: None of the righteous are sufficient of themselves to acquire righteousness, unless every moment when they stumble and fall the Divine mercy supports them with His hands, that they may not utterly collapse and perish, when they have been cast down through the weakness of free will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 12"
