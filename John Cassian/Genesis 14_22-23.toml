[[commentary]]
quote='''
For so we read that Abraham went beyond the requirement of the law which was afterwards to be given, when after his victory over the four kings, he would not touch any of the spoils of Sodom, which were fairly due to him as the conqueror, and which indeed the king himself, whose spoils he had rescued, offered him; and with an oath by the Divine name he exclaimed: "I lift up my hand to the Lord Most High, who made heaven and earth, that I will not take from a thread to a shoe's latchet of all that is thine."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 4"
