[[commentary]]
quote='''
Wherefore we should always cling to this assertion; viz., that evil cannot be brought upon a man by another, unless a man has admitted it by his sloth or feebleness of heart: as the blessed Apostle confirms this opinion of ours in a verse of Scripture: "But we know that all things work together for good to them that love God." But by saying "All things work together for good," he includes everything alike, not only things fortunate, but also those which seem to be misfortunes: through which the Apostle tells us in another place that he himself has passed, when he says: "By the amour of righteousness on the right hand and on the left," i.e.," Through honour and dishonour, through evil report and goodreport, as deceivers and yet true, as sorrowful but always rejoicing, as needy and yet enriching many:" All those things then which are considered fortunate, and are called those "on the right hand," which the holy Apostle designates by the terms honour and good report; and those too which are counted misfortunes, which he clearly means by dishonour and evil report, and which he describes as "on the left hand," become to the perfect man "the armour of righteousness," if when they are brought upon him, he bears them bravely: because, as he fights with these, and uses those very weapons with which he seems to be attacked, and is protected by them as by bow and sword and stout shield against those who bring these things upon him, he secures the advantage of his patience and goodness, and obtains a grand triumph of steadfastness by means of those very weapons of his enemies which are hurled against him to kill him; and if only he is not elated by success or cast down by failure, but ever marches straightforward on the king's highway, and does not swerve from that state of tranquillity as it were to the right hand, when joy overcomes him, nor let himself be driven so to speak to the left hand, when misfortunes overwhelm him, and sorrow holds sway. For "Much peace have they that love Thy law, and to them there is no stumbling block." But of those who shift about according to the character and changes of the several chances which happen to them, we read: "But a fool will change like the moon." For just as it is said of men who are perfect and wise: "To them that love God all things work together for good," so of those who are weak and foolish it is declared that "everything is against a foolish man," for he gets no profit out of prosperity, nor does adversity make him any better. For it requires as much goodness to bear sorrows bravely, as to be moderate in prosperity: and it is quite certain that one who fails in one of these, will not bear up under the other. But a man can be more easily overcome by prosperity than by misfortunes: for these sometimes restrain men against their will and make them humble and through most salutary sorrow cause them to sin less, and make them better: while prosperity puffs up the mind with soothing but most pernicious flatteries and when men are secure in the prospect of their happiness dashes them to the ground with a still greater destruction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F6.%2520Conference%2520of%2520Abbot%2520Theodore.html'
source_title="Conference of Abbot Theodore, Chapter 9"
