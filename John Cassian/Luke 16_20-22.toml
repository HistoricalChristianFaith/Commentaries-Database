[[commentary]]
quote='''
And how useful bodily sickness sometimes may be the blessing on Lazarus, the beggar who was full of sores, shows us. For Scripture makes mention of no other good qualities or deserts of his, but it was for this fact alone; viz., that he endured want and bodily sickness with the utmostpatience, that he was deemed worthy of the blessed lot of a place in Abraham's bosom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F6.%2520Conference%2520of%2520Abbot%2520Theodore.html'
source_title="Conference of Abbot Theodore, Chapter 3"
