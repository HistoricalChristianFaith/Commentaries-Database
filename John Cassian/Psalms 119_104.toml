[[commentary]]
quote='''
And so keeping up that diligence in reading, which I see that you have, endeavour with all eagerness to gain in the first place a thorough grasp of practical, i.e., ethical knowledge. For without this that theoretical purity of which we have spoken cannot be obtained, which those only,-who are perfected not by the words of others who teach them, but by the excellence of their own actions, can after much expenditure of effort and toil attain as a reward for it. For as they gain their knowledge not from meditation on the law but from the fruit of their labour, they sing with the Psalmist: "From Thy commandments I have understanding;" and having overcome all their passions, they say with confidence: "I will sing, and I will understand in the undefiled way." For he who is striving in an undefiled way in the course of a pure heart, as he sings the Psalm, understands the words which are chanted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 9"
