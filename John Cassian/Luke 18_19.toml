[[commentary]]
quote='''
But if we want also to establish the force of this opinion by still clearer proofs, is it not the case that while we read of many things as called good in the gospel, as a good tree, and good treasure, and a good man, and a good servant, for He says: "A good tree cannot bring forth evil fruit;" and: "a good man out of the good treasure of his heart brings forth good things;" and: "Well done, good and faithful servant;" and certainly there can be no doubt that none of these are good in themselves, yet if we take into consideration the goodness of God, none of them will becalled good, as the Lord says: "None is good save God alone"? In whose sight even the apostles themselves, who in the excellence of their calling in many ways went beyond the goodness of mankind, are said to be evil, as the Lord thus speaks to them: "If ye then being evil know how to give good gifts to your children, how much more shall your Father which is in heaven give good things to them that ask Him."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F23.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The Third Conference of Abbot Theonas, Chapter 4"
