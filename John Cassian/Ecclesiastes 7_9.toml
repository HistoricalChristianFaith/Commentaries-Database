[[commentary]]
quote='''
The deadly poison of anger has to be utterly rooted out from the inmost corners of our soul. For as long as this remains in our hearts and blinds with its hurtful darkness the eye of the soul, we can neither acquire right judgment and discretion nor gain the insight which springs from an honest gaze, or ripeness of counsel. Nor can we be partakers of life, or retentive of righteousness, or even have the capacity for spiritual and true light, "for," says one, "mine eye is disturbed by reason of anger." Nor can we become partakers of wisdom, even though we are considered wise by universal consent, for "anger rests in the bosom of fools."
'''
source_url=''
source_title="INSTITUTES 8:1"

[[commentary]]
quote='''
And there is something like this that Solomon says: "Be not hasty in thy spirit to be wroth, for anger reposes in the bosom of fools;" and: "Be not quick to rush into a quarrel, lest thou repent thereof at the last" For he does not blame a hasty exhibition of quarrelling and anger in such a way as to praise a tardy one. In the same way too must this be taken: "A fool declares his anger in the very same hour, but a prudent man hides his shame." For hedoes not lay it down that a shamefuloutburst of anger ought to be hidden by wise men in such a way that while he blames a speedy outburst of anger he fails to forbid a tardy one, as certainly, if owing to human weakness it does burst forth, he means that it should be hidden for this reason, that while for the moment it is wisely covered up, it may be destroyed forever. For the nature of anger is such that when it is given room it languishes and perishes, but if openly exhibited, it burns more and more.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 27"
