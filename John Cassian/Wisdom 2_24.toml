[[commentary]]
quote='''
However you should know that the evil of envy is harder to be cured than other faults, for I should almost say that a man whom it has once tainted with the mischief of its poison is without a remedy. For it is the plague of which it is figuratively said by the prophet: "Behold I will send among you serpents, basilisks, against which there is no charm: and they shall bite you." Rightly then are the stings of envy compared by the prophet to the deadly poison of basilisks, as by it the first author of all poisons and their chief perished and died. For he slew himself before him of whom he was envious, and destroyed himself before that he poured forth the poison of death against man: for "by the envy of the devil death entered into the world: they therefore who are on his side follow him." For just as he who was the first to be corrupted by the plague of that evil, admitted no remedy of penitence, nor any healing plaster, so those also who have given themselves up to be smitten by the same pricks, exclude all the aid of the sacred charmer, because as they are tormented not by the faults but by the prosperity of those of whom they are jealous, they are ashamed to display the real truth and look out for some external unnecessary and trifling causes of offence: and of these, because they are altogether false, vain is the hope of cure, while the deadly poison which they will not produce is lurking in their veins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 16"
