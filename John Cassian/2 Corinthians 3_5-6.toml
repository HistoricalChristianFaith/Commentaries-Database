[[commentary]]
quote='''
And the teacher of the Gentiles was not ignorant of this when he declared that he was made capable of the ministry of the New Testament not by his own merits or efforts but by the mercy of God. "Not" says he, "that we are capable of thinking anything of ourselves as of ourselves, but our sufficiency is of God, which can be put in less good Latin but more forcibly, "our capability is of God," and then there follows: "Who also made us capable ministers of the New Testament."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 15"
