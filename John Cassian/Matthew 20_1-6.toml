[[commentary]]
quote='''
At these hours too that householder in the Gospel hired labourers into his vineyard. For thus also is he described as having hired them in the early morning, which time denotes the Mattin office; then at the third hour; then at the sixth; after this, at the ninth; and last of all, at the eleventh, by which the hour of the lamps is denoted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25203.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 3, Chapter 3"
