[[commentary]]
quote='''
Lastly, the Author of our salvation teaches us what we ought not merely to think, but also to acknowledge in everything that we do. "I can," He says, "of mine own self do nothing, but the Father which abideth in me, He doeth the works." He says, speaking in the human nature which He had taken, that He could do nothing of Himself; and shall we, who are dust and ashes, think that we have no need of God's help in what pertains to our salvation?
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 17"
