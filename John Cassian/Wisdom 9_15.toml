[[commentary]]
quote='''
And so the nou=j, i.e., the mind, is defined as a0eiki/nhtoj kai\ poluki/nhioj, i.e., ever shifting and very shifting: as it is thus described in the so called wisdom of Solomon in other words: kai\ gew=dej skh=noj bri/qei nou=n polufro/ntida, i.e.," And the earthly tabernacle weigheth down the mind that museth on many things." This then in accordance with its nature can never remain idle, but unless provision is made where it may exercise its motions and have what will continually occupy it, it must by its own fickleness wander about and stray over all kinds of things until, accustomed by long practice and daily use-in which you say that you have toiled without result-it tries and learns what food for the memory it ought to prepare, toward which it may bring back its unwearied flight and acquire strength for remaining, and thus may succeed in driving away the hostile suggestion of the enemy by which it is distracted, and in persisting in that state and condition which it yearns for.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 4"
