[[commentary]]
quote='''
Moreover we should strive that this warning of the prophetic exhortation may not be uttered against us to no purpose: "Celebrate, O Judah, thy festivals, and pay thy vows." For if the occurrence of festival days does not interfere with the continuity of our abstinence, we shall continually enjoy spiritual festivals and so, when we cease from servile work, "there shall be month after month and Sabbath after Sabbath."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 23"
