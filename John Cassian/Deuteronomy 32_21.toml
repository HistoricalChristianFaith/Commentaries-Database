[[commentary]]
quote='''
Nor shall anyone be disturbed because God threatens to send "serpents, basilisks," to bite those by whose crimes He is offended. For although it is certain that God cannot be the author of envy, yet it is fair and worthy of the divine judgment that, while good gifts are bestowed on the humble and refused to the proud and reprobate, those who, as the Apostle says, deserve to be given over "to a reprobate mind," should be smitten and consumed by envy sent as it were by Him, according to this passage: "They have provoked me to jealousy by them that are no gods: and I will provoke them to jealousy by them that are no nation."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 16"
