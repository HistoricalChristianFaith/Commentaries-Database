[[commentary]]
quote='''
For among them (viz., the Egyptians) these offices which we are taught to render to the Lord at separate hours and at intervals of time, with a reminder from the converter, are celebrated continuously throughout the whole day, with the addition of work, and that of their own free will. For manual labour is incessantly practised by them in their cells in such a way that meditation on the Psalms and the rest of the Scriptures is never entirely omitted. And as with it at every moment they mingle suffrages and prayers, they spend the whole day in those offices which we celebrate at fixed times. Wherefore, except Vespers and Nocturns, there are no public services among them in the day except on Saturday and Sunday, when they meet together at the third hour (or the purpose of Holy Communion. For that which is continuously offered is more than what is rendered at intervals of time; and more acceptable as a free gift than the duties which are performed by the compulsion of a rule: as David for this rejoices somewhat exultingly when he says, "Freely will I sacrifice unto Thee;" and, "Let the free will offerings of my mouth be pleasing to Thee, O Lord."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25203.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 3, Chapter 2"
