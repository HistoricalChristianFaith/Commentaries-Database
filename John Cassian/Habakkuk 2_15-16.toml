[[commentary]]
quote='''
So then it is of no good to hold one's tongue, if we impose silence upon ourselves for this reason that by our silence we may do what would have been done by an outcry on our part, simulating certain gestures by which he whom we ought to have cured, may be made still more angry, while we are commended for all this, to his loss and damage: as if a man were not for this very reason the more guilty, because he tried to get glory for himself out of his brother's fall. For such a silence will be equally bad for both because while it increases the vexation in the heart of another, so it prevents it from being removed from one's own: and against such persons the prophet's curse is with good reason directed: "Woe to him that giveth drink to his friend, and presenteth his gall, and maketh him drunk, that he may behold his nakedness. He is filled with shame instead of glory."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 18"
