[[commentary]]
quote='''
The tropological sense is the moral explanation which has to do with improvement of life and practical teaching, as if we were to understand by these two covenants practical and theoretical instruction, or at any rate as if we were to want to take Jerusalem or Sion as the soul of man, according to this: "Praise the Lord, O Jerusalem: praise thy God, O Sion." And so these four previously mentioned figures coalesce, if we desire, in one subject, so that one and the same Jerusalem can be taken in four senses: historically as the city of the Jews; allegorically as Church of Christ, anagogically as the heavenly city of God "which is the mother of us all," tropologically, as the soul of man, which is frequently subject to praise or blame from the Lord under this title.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 8"
