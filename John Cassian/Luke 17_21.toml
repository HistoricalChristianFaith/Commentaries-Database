[[commentary]]
quote='''
For unless our mind is strengthened by the power of His protection Who says in the gospel "the kingdom of God is within you," in vain do we fancy that we can defeat the plots of our airy foe by the aid of men who are living with us, or that we can avoid them by distance of place, or exclude them by the protection of walls. For though none of these things was wanting to Saint Paphnutius yet the tempter did not fail to find a way of access against him to attack him; nor did the encircling walls, or the solitude of the desert or the merits of all those saints in the congregation repulse that most foul spirit. But because the holy servant of God had fixed the hope of his heart not on those external things but on Him Who is the judge of all secrets, he could not be moved even by the machinations of such an assault as that. On the other hand did not the man whom envy had hurried into so grievous a sin enjoy the benefit of solitude and the protection of a retired dwelling, and intercourse with the blessed Abbot and Presbyter Isidore and other saints? And yet because the storm raised by the devil found him upon the sand, it not only drove in his house but actually overturned it. We need not then seek for our peace in externals, nor fancy that another person's patience can be of any use to the faults of our impatience. For just as "the kingdom of God is within you," so "a man's foes are they of his own household." For no one is more my enemy than my own heart which is truly the one of my household closest to me. And therefore if we are careful, we cannot possibly be injured by intestine enemies. For where those of our own household are not opposed to us, there also the kingdom of God is secured in peace of heart. For if you diligently investigate the matter, I cannot be injured by any man however spiteful, if I do not fight against myself with warlike heart. But if I am injured, the fault is not owing to the other's attack, but to my own impatience. For as strong and solid food is good for a man in good health, so it is bad for a sick one. But it cannot hurt the man who takes it, unless the weakness of its recipient gives it its power to hurt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 16"
