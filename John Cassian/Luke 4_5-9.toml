[[commentary]]
quote='''
Lastly the devil only tempted Him to those sins, by which he had deceived the first Adam, inferring that He as manwould similarly be deceived in other matters if he found that He was overcome by those temptations by which he had overthrown His predecessor. But as he was overthrown in the first encounter he was not able to bring upon Him the second infirmity which had shot up as from the root of the first fault. For he saw that He had not even admitted anything from which this infirmity might take its rise, and it was idle to hope for the fruit of sin from Him, as he saw that He in no sort of way received into Himself seeds or roots of it. Yet according to Luke, who places last that temptation in which he uses the words "If Thou art the Son of God, cast Thyself down," we can understand this of the feeling of pride, so that that earlier one, which Matthew places third, in which, as Luke the evangelist says, the devil showed Him all the kingdoms of the world in a moment of time and promised them to Him, may be taken of the feeling of covetousness, because after His victory over gluttony, he did not venture to tempt Him to fornication, but passed on to covetousness, which he knew to be the root of all evils, and when again vanquished inthis, he did not dare attack Him with any of those sins which follow, which, as he knew full well, spring from this as a root and source; and so he passed on to the last passion; viz., pride, by which he knew that those who are perfect and have overcome all other sins, can be affected, and owing to which he remembered that he himself in his character of Lucifer, and many others too, had fallen from their heavenly estate, without temptation from any of the preceding passions. In this order then which we have mentioned, which is the one given by the evangelist Luke, there is an exact agreement between the allurements and forms of the temptations by which that most crafty foe attacked both the first and the second Adam. For to the one he said "Your eyes shall be opened;" to theother "he showed all the kingdoms of the world and the glory of them." In the one case he said "Ye shall be as gods;" in the other, "If Thou art the Son of God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 6"
