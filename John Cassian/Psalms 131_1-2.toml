[[commentary]]
quote='''
There are some things besides in the dress of the Egyptians which concern not the care of the body so much as the regulation of the character, that the observance of simplicity and innocence may be preserved by the very character of the clothing. For they constantly use both by day and by night very small hoods coming down to the end of the neck and shoulders, which only cover the head, in order that they may constantly be moved to preserve the simplicity and innocence of little children by imitating their actual dress. And these men have returned to childhood in Christ and sing at all hours with heart and soul: "Lord, my heart is not exalted nor are mine eyes lofty. Neither have I walked in great matters nor in wonderful things above me. If I was not humbly minded, but exalted my soul: as a child that is weaned is towards his mother."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25201.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 1, Chapter 3"

[[commentary]]
quote='''
And so the blessed David, although he guarded the recesses of his heart with the utmost care, so that he dared to say to Him from whom the secrets of his conscience were not hid, "Lord, my heart is not exalted, nor are my eyes lofty: neither have I walked in great matters, nor in wonderful things above me. If I was not humbly minded;" and again, "He that worketh pride shall not dwell in the midst of my house;" yet, as he knew how hard is that watchfulness even for those that are perfect, he did not so presume on his own efforts, but prayed to God and implored His help, that he might escape unwounded by the darts of this foe, saying, "Let not the foot of pride come to me, " for he feared and dreaded falling into that which is said of the proud, viz., "God resisteth the proud;" and again: "Every one that exalteth his heart is unclean before the Lord."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 6"
