[[commentary]]
quote='''
Whoever then by this love has attained the image and likeness of God, will now delight in goodness for the pleasure of goodness itself, and having somehow a like feeling of patience and gentleness will henceforth be angered by no faults of sinners, but in his compassion and sympathy will rather ask for pardon for their infirmities, and, remembering that for so long he himself was tried by the stings of similar passions till by the Lord's mercy he was saved, will feel that, as he was saved from carnal attacks not by the teaching of his own exertions but by God's protection, not anger but pity ought to be shown to those who go astray; and with full peace of mind will he sing to God the following verse: "Thou hast broken my chains. I will offer to Thee the sacrifice of praise;" and: "except the Lord had helped me, my soul had almost dwelt in hell." And while he continues in this humility of mind he will be able even to fulfil this Evangelic command of perfection: "Love your enemies, do good to them that hate you, and pray for them that persecute you and slander you." And so it will be vouchsafed to us to attain that reward which is subjoined, whereby we shall not only bear the image and likeness of God, but shall even be called sons: "that ye may be," says He "sons of your Father which is in heaven, Who maketh His sun to rise on the good and evil, and sends rain on the just and on the unjust:" and this feeling the blessed John knew that he had attained when he said: "that we may have confidence in the day of judgment, because as He is so are we also in this world." For in what can a weak and fragile human nature be like Him, except in always showing a calm love in its heart towards the good and evil, the just and the unjust, in imitation of God, and by doing good for the love of goodness itself, arriving at that true adoption of the sons of God, of which also the blessed Apostle speaks as follows: "Every one that is born of God doeth not sin, for His seed is in him, and he cannot sin, because he is born of God;" and again: "We know that every one who is born of God sinneth not, but his birth of God preserves him, and the wicked one toucheth him not?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 9"
