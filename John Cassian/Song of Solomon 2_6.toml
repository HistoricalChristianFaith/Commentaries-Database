[[commentary]]
quote='''
These men then and those who are like them are rightly termed a0mfoterode/cion, i.e., ambidextrous. For they can use either hand as the right hand, and passing through those things which the Apostle enumerates can fairly say: "Through the armour of righteousness on the right hand and on the left, through honour and dishonour, through evil report and good report etc." And of this right and left hand Solomon speaks as follows in the Song of songs, in the person of the bride: "His left hand is under my head, and his right hand shall embrace me." And while this passage shows that both are useful, yet it puts one under the head, because misfortunes ought to be subject to the control of the heart, since they are only useful for this; viz., to train us for a time and discipline us for our salvation and make us perfect in the matter of patience. But the right hand she hopes will ever cling to her to cherish her and hold her fast in the blessed embrace of the Bridegroom, and unite her to him indissolubly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F6.%2520Conference%2520of%2520Abbot%2520Theodore.html'
source_title="Conference of Abbot Theodore, Chapter 10"
