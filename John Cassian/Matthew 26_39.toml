[[commentary]]
quote='''
And this feeling even our Lord expressed when He prayed in the character of man which He had taken, that He might give us a form of prayer as other things also by His example; saying thus: "Father, if it be possible, let this cup pass from me: nevertheless not as I will but as Thou wilt," though certainly His will was not discordant with His Father's will, "For He had come to save what was lost and to give His life a ransom for many;" as He Himself says: "No man taketh my life from Me, but I lay it down of Myself. I have power to lay it down and I have power to take it again." In which character there is in the thirty-ninth Psalm the following sung by the blessed David, of the Unity of will which He ever maintained with the Father: "To do Thy will: O My God, I am willing." For even if we read of the Father: "For God so loved the world that He gave His only begotten Son," we find none the less of the Son: "Who gave Himself for our sins." And as it is said of the One: "Who spared not His own Son, but gave Him for all of us," so it is written of the other: "He was offered because He Himself willed it." And it is shown that the will of the Father and of the Son is in all things one, so that even in the actual mystery of the Lord's resurrection we are taught that there was no discord of operation. For just as the blessed Apostle declares that the Father brought about the resurrection of His body, saying: "And God the Father, who raised Him from the dead," so also the Son testifies that He Himself will raise again the Temple of His body, saying: "Destroy this temple, and in three days I will raise it up again." And therefore we being instructed by all these examples of our Lord which have been enumerated ought to end our supplications also with the same prayer, and always to subjoin this clause to all our petitions: "Nevertheless not as I will, but as Thou wilt."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 34"

[[commentary]]
quote='''
But how can he arouse any incitement to contention, who has determined to trust not so much to his own judgment as to his brother's decision, on his own intelligence and meaning, in accordance with his will either approving or disapproving his discoveries, and fulfilling in the humility of a pious heart these words from the Gospel: "Nevertheless, not as I will, but as Thou wilt."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 6"
