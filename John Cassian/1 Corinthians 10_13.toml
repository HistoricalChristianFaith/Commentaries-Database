[[commentary]]
quote='''
WE ought also not to be ignorant of this, that they have not all the same fierceness and energy, nor indeed the same boldness and malice, and that with beginners and feeble folk only the weaker spirits join battle, and when these spiritual wickednesses are beaten, then gradually the assaults of stronger ones are made against the athlete of Christ. For in proportion to a man's strength and progress, is the difficulty of the struggle made greater: for none of the saints could possibly be equal to the endurance of the malice of so many and so great foes, or meet their attacks, or even bear their cruelty and savagery, were it not that the merciful judge of our contest, and president of the games, Christ Himself, equalized the strength of the combatants, and repelled and checked their excessive attacks, and made with the temptation a way of escape as well that we might be able to bear it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 20"

[[commentary]]
quote='''
But if we have been overcome in this battle, having been proved as it were slaves of carnal lusts, and thus displaying the tokens neither of freedom nor of strength, we shall be straightway repulsed from the conflicts with spiritual hosts, as unworthy and as slaves, with every mark of confusion. For "every one that doeth sin is the servant of sin." And this will be addressed to us by the blessed Apostle, together with those among whom fornication is named. "Temptation does not overtake you, except such as is human." For if we do not seek for strength of mind we shall not deserve to make trial of severer contest against wickedness on high, if we have been unable to subdue our weak flesh which resists the spirit. And some not understanding this testimony of the Apostle, have read the subjunctive instead of the indicative mood, i.e. , "Let no temptation overcome you, except such as is human." But it is clear that it is rather said by him with the meaning not of a wish but of a declaration or rebuke.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25205.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 5, Chapter 16"
