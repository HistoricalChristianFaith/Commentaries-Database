[[commentary]]
quote='''
The second when for the edification of the church or on account of the faith of those who bring their sick, or of those whoare to be cured, the virtue of health proceeds even from sinners and men unworthy of it. Of whom the Saviour says in the gospel: "Many shall say to Me in that day, Lord, Lord, have we not prophesied in Thy name, and in Thy name cast out devils, and in Thy name done many mighty works? And then I will confess to them, I never knew you: Depart from Me, ye workers of iniquity." And on the other hand, if the faith of those who bring them or of the sick is wanting, it prevents those onwhom the gifts of healing are conferred from exercising their powers of healing. On which subject Luke the Evangelist says: "And Jesus could not there do any mighty work because of their unbelief." Whence also the Lord Himself says:"Many lepers were in Israel in the days of Elisha the prophet, and none of them was cleansed but Naaman the Syrian."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F15.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The Second Conference of Abbot Nesteros, Chapter 1"
