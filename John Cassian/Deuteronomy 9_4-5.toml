[[commentary]]
quote='''
Wherefore it is well for us both to be certified by actual experience, and also to be instructed by countless passages of Scripture, that we cannot possibly overcome such mighty foes in our own strength, and unless supported by the aid of God alone; and that we ought always to refer the Whole Of our victory each day to God Himself, as the Lord Himself also gives us instruction by Moses on this very point: "Say not in thine heart when the Lord thy God shall have destroyed them in thy sight: For my righteousness hath the Lord brought me in to possess this land, whereas these nations are destroyed for their wickedness. For it is not for thy righteousness, and the uprightness of thine heart, that thou shalt go in to possess their lands: but because they have done wickedly they are destroyed at thy coming in." I ask what could be said clearer in opposition to that impious notion and impertinence of ours, in which we want to ascribe everything that we do to our own free will and our own exertions? "Say not," he tells us, "in thine heart, when the Lord thy God shall have destroyed them in thy sight: For my righteousness the Lord hath brought me in to possess this land." To those who have their eyes opened and their ears ready to hearken does not this plainly say: When your struggle with carnal faults has gone well for you, and you see that you are free from the filth of them, and from the fashions of this world, do not be puffed up by the success of the conflict and victory and ascribe it to your own power and wisdom, nor fancy that you have gained the victory over spiritual wickedness and carnal sins through your own exertions and energy, and free will?For there is no doubt that in all this you could not possibly have succeeded, unless you had been fortified and protected by the help of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 15"
