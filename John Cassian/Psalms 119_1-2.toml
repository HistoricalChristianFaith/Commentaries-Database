[[commentary]]
quote='''
There is then no way of arriving at spiritual knowledge but this which one of the prophets has finely described: "Sow to yourselves for righteousness: reap the hope of life. Enlighten yourselves with the light of knowledge." First then we must sow for righteousness, i.e., by works of righteousness we must extend practical perfection; next we must reap the hope of life, i.e., by the expulsion of carnal sins must gather the fruits of spiritual virtues: and so we shall succeed in enlightening ourselves with the light of knowledge. And the Psalmist also sees that this system ought to be followed, when he says: "Blessed are they that are undefiled in the way: who walk in the law of the Lord. Blessed are they that seek His testimonies." For he does not say in the first place: "Blessed are they that seek His testimonies, and afterwards add: Blessed are they that are undefiled in the way;" but he begins by saying: "Blessed are they that are undefiled in the way;" and by this clearly shows that no one can properly come to seek God's testimonies unless he first walks undefiled in the way of Christ by his practical life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 16"
