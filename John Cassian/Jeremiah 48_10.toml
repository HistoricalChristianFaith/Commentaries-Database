[[commentary]]
quote='''
Whoever then is aiming at this condition, which we have mentioned, will seek the grace of satisfaction by daily fasting and mortification of heart and body, for, as it is written, "Without shedding of blood there is no remission;" and this not without good reason. For "flesh and blood cannot inherit the kingdom of God." And therefore one who would withhold "the sword of the spirit which is the word of God" from this shedding of blood certainly comes under the lash of that curse of Jeremiah's; for "Cursed," says he "is he who withholds his sword from blood." For this is the sword which for our good sheds that bad blood whereby the material of our sins lives; and cuts Off and pares away everything carnal and earthly which it finds to have grown up in the members of our soul; and makes men die to sin and live to God, and flourish with spiritual virtues. And so he will begin to weep no more at the recollection of former sins, but at the hope of what is to come, and, thinking less of past evils than of good things to come, will shed tears not from sorrow at his sins, but from delight in that eternal joy, and "forgetting those things which are behind," i.e., carnal sins, will press on "to those before," i.e., to spiritual gifts and virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F20.%2520Conference%2520of%2520Abbot%2520Pinufius.html'
source_title="Conference of Abbot Pinufius, Chapter 8"

[[commentary]]
quote='''
Those also who take the main part of their offerings, i.e., their offices and actions, to benefit the flesh for their own use, but leave the remains of them and a tiny portion for the Lord, these the Divine Word thus condemns as fraudulent workmen: "Cursed is he that doeth the work of the Lord fraudulently."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 22"

[[commentary]]
quote='''
FoR as unbounded glory hereafter is promised to those who faithfully serve God and cleave to Him according to the rule of this system; so the severest penalties are in store for those who have carried it out carelessly and coldly, and have failed to show to Him fruits of holiness corresponding to what they professed or what they were believed by men to be. For "it is better," as Scripture says, "that a man should not vow rather than that he should vow and not pay;" and "Cursed is he that doeth the work of the Lord carelessly." Therefore you were for a long while declined by us, not as if we did not des re with all our hearts to secure your salvation and the salvation of all, nor as if we did not careto go to meet even afar off those who are longing to be converted to Christ; but for fearlest if we received you rashly we might makeourselves guilty in the sight of God of levity, and make you incur a yet heavier punishment, if, when you had been too easily admitted by us without realizing the responsibility of this profession, you had afterwards turned out a deserter or lukewarm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25204.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 4, Chapter 33"
