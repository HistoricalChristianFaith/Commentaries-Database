[[commentary]]
quote='''
But dia/qesij, i.e., affection is shown to but a few and those who are united to us by kindred dispositions or by a tie of goodness; though indeed affection seems to have many degrees of difference. For in one way we love our parents, in another our wives, in another our brothers, in another our children, and there is a wide difference in regard to the claims of these feelings of affection, nor is the love of parents towards their children always equal. As is shown by the case of the patriarch Jacob, who, though he was the father of twelve sons and loved them all with a father's love, yet loved Joseph with deeper affection, as Scripture clearly shows: "But his brethren envied him, because his father loved him;" evidently not that that good man his father failed in greatly loving the rest of his children, but that in his affection he clung to this one, because he was a type of the Lord, more tenderly and indulgently. This also, we read, was very clearly shown in the case of John the Evangelist, where these words are used of him: "that disciple whom Jesus loved," though certainly He embraced all the other eleven, whom He had chosen in the same way, with His special love, as this He shows also by the witness of the gospel, where He says: "As I have loved you, so do ye also love one another;" of whom elsewhere also it is said: "Loving His own who were in the world, He loved them even to the end." But this love of one in particular did not indicate any coldness in love for the rest of the disciples, but only a fuller and more abundant love towards the one, which his prerogative of virginity and the purity of his flesh bestowed upon him. And therefore it is marked by exceptional treatment, as being something more sublime, because no hateful comparison with others, but a richer grace of superabundant love singled it out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 14"
