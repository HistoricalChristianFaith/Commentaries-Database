[[commentary]]
quote='''
These then try to make out a case for their original avarice, by some authority from Holy Scripture, which they interpret with base ingenuity, in their desire to wrest and pervert to their own purposes a saying of the Apostle or rather of the Lord Himself: and, not adapting their own life or understanding to the meaning of the Scripture, but making the meaning of Scripture bend to the desires of their own lust, they try to make it to correspond to their own views, and say that it is written, "It is more blessed to give than to receive." And by an entirely wrong interpretation of this they think that they can weaken the force of that saying of the Lord in which he says: "If thou wilt be perfect, go sell all that thou hast and give to the poor, and thou shalt have treasure in heaven; and come, follow me." And they think that under colour of this they need not deprive themselves of their riches: declaring indeed that they are more blessed if, supported by that which originally belonged to them, they give to others also out of their superabundance. And while they are shy of embracing with the Apostle that glorious state of abnegation for Christ's sake, they will not be content either with manual labour or the sparing diet of the monastery. And the only thing is that these must either know that they are deceiving themselves, and have not really renounced the world while they are clinging to their former riches; or, if they really and truly want to make trial of the monastic life, they must give up and forsake all these things and keep back nothing of that which they have renounced, and, with the Apostle, glory "in hunger and thirst, in cold and nakedness."

As if he (who, by his assertion that he was endowed with the privileges of a Roman citizen from his birth, testifies that he was no mean person according to this world's rank) might not likewise have been supported by the property which formerly belonged to him! And as if those men who were possessors of lands and houses in Jerusalem and sold everything and kept back nothing whatever for themselves, and brought the price of them and laid it at the feet of the apostles, might not have supplied their bodily necessities from their own property, had this been considered the best plan by the apostles, or had they themselves deemed it preferable! But they gave up all their property at once, and preferred to be supported by their own labour, and by the contributions of the Gentiles, of whose collection the holy Apostle speaks in writing to the Romans, and declaring his own office in this matter to them, and urging them on likewise to make this collection: "But now I go to Jerusalem to minister to the saints. For it has pleased them of Macedonia and Achaia to make a certain contribution for the poor saints who are at Jerusalem: it has pleased them indeed, and their debtors they are. For if the Gentiles are made partakers of their spiritual things, they ought also to minister to them in carnal things." To the Corinthians also he shows the same anxiety about this, and urges them the more diligently to prepare before his arrival a collection, which he was intending to send for their needs. "But concerning the collection for the saints, as I appointed to the churches of Galatia, so also do ye. Let each one of you on the first day of the week put apart with himself, laying up what it shall well please him, that when I come the collections be not then to be made. But when I come whomsoever you shall approve by your letters, themI will send to carry your grace to Jerusalem."And that he may stimulate them to make a larger collection, he adds, "But if it be meet that I also go, they shall go with me:" meaning if your offering is of such a character as to deserve to be taken there by my ministration. To the Galatians too, he testifies that when he was settling the division of the ministry of preaching with the apostles, he had arranged this with James, Peter, and John: that he should undertake the preaching to the Gentiles, but should never repudiate care and anxious thought for the poor who were at Jerusalem, who for Christ's sake gave up all their goods,and submitted to voluntary poverty. "And when they saw," said he, "the grace of God which was given to me, James and Cephas and John, who seemed to be pillars, gave to me and to Barnabas the right hand: of fellowship, that we should preach to the: Gentiles, but they to those of the circumcision: only they would that we should be mindful of the poor." A matter which he testifies that he attended to most carefully, saying, "which also I was anxious of myself to do." Who then are the more blessed, those who but lately were gathered out of the number of the heathen, and being unable to climb to the heights of the perfection of the gospel, clung to their own property, in whose case it was considered a great thing by the Apostle if at least they were restrained from the worship of idols, and from fornication, and from things strangled, and from blood, and had embraced the faith of Christ, with their goods and all: or those who live up to the demands of the gospel, and carry the Lord's cross daily, and want nothing out of their property to remain for their own use? And if the blessed Apostle himself, bound with chains and fetters, or hampered by the difficulties of travelling, and for these reasons not being able to provide with his hands, as he generally did, for the supply of his food, declares that he received that which supplied his wants from the brethren who came from Macedonia; "For that which was lacking to me," he says, "the brethren who came from Macedonia supplied:" and to the Philippians he says: "For ye Philippians know also that in the beginning of the gospel, when I came from Macedonia, no church communicated with me in the matter of giving and receiving, except you only; because even in Thessalonica once and again you sent to supply my needs:" (if this was so) then, according to the notion of thesemen, which they have formed in the coldnessof their heart, will those men really be more blessed than the Apostle, because it is foundthat they have ministered to him of their substance? But this no one will venture to assert, however big a fool he may be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25207.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 7, Chapters 16-17"

[[commentary]]
quote='''
And he says that this is a command of the Lord: "For He Himself," namely the Lord Jesus, said he, "said it is more blessed to give than to receive." That is, the bounty of the giver is more blessed than the need of the receiver, where the gift is not supplied from money that has been kept back through unbelief or faithlessness, nor from the stored-up treasures of avarice, but is produced from the fruits of our own labour and honest toil. Andso "it is more blessed to give than to receive," because while the giver shares the poverty of the receiver, yet still he is diligent in providing with pious care by his own toil, not merely enough for his own needs, but also what he can give to one in want; and so he is adorned with a double grace, since by giving away all his goods he secures the perfect abnegation of Christ, and yet by his labour and thought displays the generosity of the rich; thus honouring God by his honest labours, and plucking for him the fruits of his righteousness, while another, enervated by sloth and indolent laziness, proves himself by the saying of the Apostle unworthy of food, as in defiance of his command he takes it in idleness, not without the guilt of sin and of obstinacy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 19"
