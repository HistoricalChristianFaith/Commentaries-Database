[[commentary]]
quote='''
As when some injuries come upon us, which are caused either by toil laid upon us or by a bad atmosphere, it is generally the case in the bodies of men that those which are the weaker are the first to give in and yield to those chances, and when the disease has more particularly laid hold of them, it affects the sound parts of the body also with the same mischief, so also, when the pestilent blast of sin breathes over us the soul of each one of us is sure to be tempted above all by that passion, in the case of which its feebler and weaker portion does not make so stubborn a resistance to the powerful attacks of the foe, and to run the risk of being taken captive by those, in the case of which a careless watch opens an easier way to betrayal. For so Balsam gathered that God's people could be by a sure method deceived, when he advised, that in that quarter, wherein he knew that the children of Israel were weak, the dangerous snares should be set for them, as he had no doubt that when a supply of women was offered to them, they would at once fall and be destroyed by fornication, because he was aware that the parts of their souls which were subject to desire were corrupted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 17"
