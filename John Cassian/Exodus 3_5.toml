[[commentary]]
quote='''
But though lawfully enough they make use of these sandals, as permitted by the Lord's command, yet they never suffer them to remain on their feet when they approach to celebrate or to receive the holy mysteries, as they think that they ought to observe in the letter that which was said to Moses and to Joshua, the son of Nun: "Loose the latchet of thy shoe: for the place whereon thou standest is holy ground."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25201.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 1, Chapter 9"
