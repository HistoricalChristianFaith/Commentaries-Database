[[commentary]]
quote='''
"Not as if we had not power; but that we might give ourselves a pattern to you to imitate us." He lays bare the reason why he imposed such labour on himself: "that we might," says he, "give a pattern to you to imitate us, that if by chance you become forgetful of the teaching of our words which so often passes through your ears, you may at least keep in your recollection the example of my manner of life given to you by ocular demonstration. There is here too no slight reproof of them, where he says that he has gone through this labour and weariness by night and day, for no other reason but to set an example, and that nevertheless they would not be instructed, for whose sakes he, although not obliged to do it, yet imposed on himself such toil. "And indeed," he says "though we had the power, and opportunities were open to us of using all your goods and substance, and I knew that I had the permission of our Lord to use them: yet I did not use this power, lest what was rightly and lawfully done on my part might set an example of dangerous idleness to others. And therefore when preaching the gospel, I preferred to be supported by my own hands and work, that I might open up the way of perfection to you who wish to walk in the path of virtue, and might set an example of good life by my work."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 10"
