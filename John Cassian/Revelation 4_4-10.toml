[[commentary]]
quote='''
This twenty-fourth Conference of Abbot Abraham is by the favour of Christ produced, which concludes the traditions and decisions of all the Elders; and when by the aid of your prayers it has been finished, as the numbermystically corresponds to that of the four and twenty Elders who are said in the holy Apocalypse to offer their crowns to the Lamb, we think that we shall have paid the debt of all our promises. And henceforth if these four and twenty Elders of ours have been crowned with any glory for the sake of their teaching, they shall with bowed heads offer it to the Lamb who was slain for the salvation of the world: for He it was Who vouschafed for the honour of His name to grant to them such exalted feelings and to us whatever words were needful to set forth such profound thoughts. And the merits of His gift must be referred to the Author of all good, to whom the more is owed, as the more is paid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 1"
