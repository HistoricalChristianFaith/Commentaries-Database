[[commentary]]
quote='''
Ann of those cures it was said to the blessed Apostles: "Rejoice not that the devils are subject to you'' For this was wrought not by their own power, but by the might of the name invoked. And therefore they are warned not to presume to claim for themselves any blessedness or glory on this account as it was done simply by the power and might of God, but only on account of the inward purity of their life and heart, for which it was vouchsafed to them to have their names written in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F15.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The Second Conference of Abbot Nesteros, Chapter 9"

[[commentary]]
quote='''
Finally, when the Lord would for their speedy fall turn away His merciful countenance from the people, whom He had chosen out of all nations, the giver of the law interposes on their behalf and cries out: "I beseech Thee, O Lord, this people have sinned a great sin; they have made for themselves gods of gold; and now if Thou forgivest their sin, forgive it; but if not, blot me out of Thy book which Thou hast written. To whom the Lord answered: If any man hath sinned before Me, I will blot him out of My book." David also, when complaining in prophetic spirit of Judas and the Lord's persecutors, says: "Let them be blotted out of the book of the living;" and because they did not deserve to come to saving penitence because of the guilt of their great sin, he subjoins: "And let them not be written among the righteous." Finally in the case of Judas himself the meaning of the prophetic curse was clearly fulfilled, for when his deadly sin was completed, he killed himself by hanging, that he might not after his name was blotted out be converted and repent and deserve to be once more written among the righteous in heaven. We must therefore not doubt that at the time when he was chosen by Christ and obtained a place in the Apostolate, the name of Judas was written in the book of the living, and that he heard as well as the rest the words: "Rejoice not because the devils are subject unto you, but rejoice because your names are written in heaven." But because he was corrupted by the plague of covetousness and had his name struck out from that heavenly list, it is suitably said of him and of men like him by the prophet: "O Lord, let all those that forsake Thee be confounded. Let them that depart from Thee be written in the earth, because they have forsaken the Lord, the vein of living waters." And elsewhere: "They shall not be in the counsel of My people, nor shall they be written in the writing of the house of Israel, neither shall they enter into the land of lsrael."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 25"
