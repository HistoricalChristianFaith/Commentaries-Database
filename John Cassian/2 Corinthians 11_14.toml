[[commentary]]
quote='''
For often it has been proved that what the Apostle says really takes place. "For Satan himself transforms himself into an angel of light," so that he deceitfully sheds abroad a confusing and foul obscuration of the thoughts instead of the true light of knowledge. And unless these thoughts are received in a humble and gentle heart, and kept for the consideration of some more experienced brother or approved Elder, and when thoroughly sifted by their judgment, either rejected or admitted by us, we shall be sure to venerate in our thoughts an angel of darkness instead of an angel of light, and be smitten with a grievous destruction: an injury which it is impossible for any one to avoid who trusts in his own judgment, unless he becomes a lover and follower of true humility and with all contrition of heart fulfils what the Apostle chiefly prays for: "If then there be any consolation in Christ, if any comfort of love, if any bowels of compassion, fulfil ye my joy, that you be of one mind, having the same love, being of one accord, doing nothing by contention, neither by vainglory; but in humility each esteeming others better than themselves;" and this: "in honour preferring one another," that each may think more of the knowledge and holiness of his partner, and hold that the better part of true discretion is to be found in the judgment of another rather than in his own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 11"
