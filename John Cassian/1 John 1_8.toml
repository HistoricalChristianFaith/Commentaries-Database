[[commentary]]
quote='''
For in what can a weak and fragile human nature be like Him, except in always showing a calm love in its heart towards the good and evil, the just and the unjust, in imitation of God, and by doing good for the love of goodness itself, arriving at that true adoption of the sons of God, of which also the blessed Apostle speaks as follows: "Every one that is born of God doeth not sin, for His seed is in him, and he cannot sin, because he is born of God;" and again: "We know that every one who is born of God sinneth not, but his birth of God preserves him, and the wicked one toucheth him not?" And this must be understood not of all kinds of sins, but only of mortal sins: and if any one will not extricate and cleanse himself from these, for him the aforesaid Apostle tells us in another place that we ought not even to pray, saying: "If a man knows his brother to be sinning a sin not unto death, let him ask, and He will give him life for them that sin not unto death. There is a sin unto death: I do not say that he should ask for it." But of those which he says are not unto death, from which even those who serve Christ faithfully cannot, with whatever care they keep themselves, be free, of these he says: "If we say that we have no sin we deceive ourselves and the truth is not in us;" and again: "If we say that we have not sinned, we make Him a liar, and His word is not in us." For it is an impossibility for any one of the saints not to fall into those trivial faults which are committed by word, and thought, and ignorance, and forgetfulness, and necessity, and will, and surprise: which though quite different from that sin which is said to be unto death, still cannot be free from fault and blame.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 9"
