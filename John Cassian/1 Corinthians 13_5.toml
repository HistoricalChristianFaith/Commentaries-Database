[[commentary]]
quote='''
But these, even if they could in some way keep calm and quiet themselves, would yet not bear any fruits of righteousness, while they claim the glory of patience on their part by their neighbour's loss, and are thus altogether removed from that Apostolic love which "Seeketh not her own," butthe things of others. For it does not so desire riches in such a way as to make profit for itself out of one's neighbour's loss, nor does it wish to gain anything if it involves the spoiling of another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 22"

[[commentary]]
quote='''
What too shall we say of the deed of that woman, who received the men who had been sent to king David by the aforesaid Hushai, and hid them in a well, and spread a cloth over its mouth, and pretended that she was drying pearl-barley, and said "They passed on after tasting a little water"; and by this invention saved them from the hands of their pursuers? Wherefore answer me, I pray you, and say what you would have done, if any similar situation had arisen for you, living now under the gospel; would you prefer to hide them with a similar falsehood, saying in the same way: "They passed on after tasting a little water," and thus fulfil the command: "Deliver those who are being led to death, and spare not to redeem those who are being killed;" or by speaking the truth, would you have given up those in hiding to the men who would kill them? And what then becomes of the Apostle's words: "Let no man seek his own but the things of another:" and: "Love seeketh not her own, but the things of others;" and of himself he says: "I seek not mine own good but the good of many that they may be saved?" For if we seek our own, and want obstinately to keep what is good for ourselves, we must even in urgent cases of this sort speak the truth, and so become guilty of the death of another: but if we prefer what is for another's advantage to our own good, and satisfy the demands of the Apostle, we shall certainly have to put up with the necessity of lying. And therefore we shall not be able to keep a perfect heart of love, or to seek, as Apostolic perfection requires, the things of others, unless we relax a little in those things which concern the strictness and perfection of our own lives, and choose to condescend with ready affection to what is useful to others, and so with the Apostle become weak to the weak, that we may be able to gain the weak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 19"
