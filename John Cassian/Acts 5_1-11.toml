[[commentary]]
quote='''
We find, it is true, that even for lighter faults some men have received the same sentence of death in this world, as that with which those men were punished who, as we said before, were the authors of a blasphemous falling away: as happened in the case of the man who gathered sticks on the Sabbath, and in that of Ananias and Sapphira, who through the sin of unbelief kept back some portion of their goods: not that the guilt of their sins was equal, but because they were the firstfound out in a new kind of transgression, and so it was right that as they had given to others an example of sin, so also they should give them an example of punishment and of fear, that anyone, who should attempt to copy them, might know that (even if his punishment were postponed in this life) he would be punished in the same way that they were at the trial of the judgment hereafter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F6.%2520Conference%2520of%2520Abbot%2520Theodore.html'
source_title="Conference of Abbot Theodore, Chapter 11"

[[commentary]]
quote='''
And while the Christian religion was rejoicing in these two orders of monks though this system had begun by degrees to deteriorate, there arose afterwards that disgusting and unfaithful kind of monks; or rather, that baleful plant revived and sprang up again which when it first shot up in the persons of Ananias and Sapphira in the early Church was cut off by the severity of the Apostle Peter - a kind which among monks has been for a long while considered detestable and execrable, and which was adopted by no one any more, so long as there remained stamped on the memory of the faithful the dread of that very severe sentence, in which the blessed Apostle not merely refused to allow the aforesaid originators of the novel crime to be cured by penitence or any amends, but actually destroyed that most dangerous germ by their speedy death. When then that precedent, which was punished with Apostolical severity in the case of Ananias and Sapphira had by degrees faded from the minds of some, owing to long carelessness and forgetfulness from lapse of time, there arose the race of Sarabaites, who owing to the fact that they have broken away from the congregations of the coenobites and each look after their own affairs, are rightly named in the Egyptian language Sarabaites, and these spring from the number of those, whom we have mentioned, who wanted to imitate rather than truly to aim at Evangelical perfection, urged thereto by rivalry or by the praises of those who preferred the complete poverty of Christ to all manner of riches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 7"
