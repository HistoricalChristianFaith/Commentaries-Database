[[commentary]]
quote='''
Chaeremon: In accordance with the condition and measure of every mind Holy Scripture summons our free wills to different grades of perfection. For no uniform crown of perfection can be offered to all men, because all have not the same virtue, or purpose, or fervour, and so the Divine Word has in some way appointed different ranks and different measures of perfection itself. And that this is so the variety of beatitudes in the gospel clearly shows. For though they are called blessed, whose is the kingdom of heaven, and blessed are they who shall possess the earth, and blessed are they who shall receive their consolation, and blessed are they who shall be filled, yet we believe that there is a great difference between the habitations of the kingdom of heaven, and the possession of the earth, whatever it be, and also between the reception of consolation and the fulness and satisfaction of righteousness; and that there is a great distinction between those who shall obtain mercy, and those who shall be deemed worthy to enjoy the most glorious vision of God. "For there is one glory of the sun, and another glory of the moon, and another glory of the stars: for star differeth from star in glory, so also is the resurrection of the dead." While therefore in accordance with this rule holy Scripture praises those who fear God, and says "Blessed are all they that fear the Lord," and promises them for this a full measure of bliss, yet it says again: "There is no fear in love, but perfect love casteth out fear: for fear hath torment. But he that feareth is not yet perfect in love." And again, though it is a grand thing to serve God, and it is said: "Serve the Lord in fear;" and: "It is a great thing for thee to be called My servant;" and: "Blessed is that servant whom his Lord, when He cometh, shall find so doing," yet it is said to the Apostles: "I no longer call you servants, for the servant knoweth not what his Lord doeth: but I call you friends, for all things whatsoever I have heard from my Father, I have made known unto you." And once more: "Ye are My friends, if ye do whatever I command you." You see then that there are different stages of perfection, and that we are called by the Lord from high things to still higher in such a way that he who has become blessed and perfect in the fear of God; going as it is written "from strength to strength," and from one perfection to another, i.e., mounting with keenness of soul from fear to hope, is summoned in the end to that still more blessed stage, which, is love, and he who has been "a faithful and wise servant" will pass to the companionship of friendship and to the adoption of sons. So then our saying also must be understood according to this meaning: not that we say that the consideration of that enduring punishment or of that blessed recompense which is promised to the saints is of no value, but because, though they are useful and introduce those who pursue them to the first beginning of blessedness, yet again love, wherein is already fuller confidence, and a lasting joy, will remove them from servile fear and mercenary hope to the love of God, and carry them on to the adoption of sons, and somehow make them from being perfect still more perfect. For the Saviour says that in His Father's house are "many mansions," and although all the stars seem to be in the sky, yet there is a mighty difference between the brightness of the sun and of the moon, and between that of the morning star and the rest of the stars.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 12"

[[commentary]]
quote='''
Whoever then has been established in this perfect love is sure to mount by a higher stage to that still more sublime fear belonging to love, which is the outcome of no dread of punishment or greed of reward, but of the greatest love; whereby a son fears with earnest affection a most indulgent father, or a brother fears his brother, a friend his friend, or a wife her husband, while there is no dread of his blows or reproaches, but only of a slight injury to his love, and while in every word as well as act there is ever care taken by anxious affection lest the warmth of his love should cool in the very slightest degree towards the object of it. And one of the prophets has finely described the grandeur of this fear, saying: "Wisdom and knowledge are the riches of salvation: the fear of the Lord is his treasure." He could not describe with greater clearness the worth and value of that fear than by saying that the riches of our salvation, which consist in true wisdom and knowledge of God, can only be preserved by the fear of the Lord. To this fear then not sinners but saints are invited by the prophetic word where the Psalmist says: "O fear the Lord, all ye His Saints: for they that fear Him lack nothing." For where a man fears the Lord with this fear it is certain that nothing is lacking to his perfection. For it was clearly of that other penal fear that the Apostle John said that "He who feareth is not made perfect in love, for fear hath punishment." There is then a great difference between this fear, to which nothing is lacking, which is the treasure of wisdom and knowledge, and that imperfect fear which is called "the beginning of wisdom," and which has in it punishment and so is expelled from the hearts of those who are perfect by the incoming of the fulness of love. For "there is no fear in love, but perfect love casteth out fear." And in truth if the beginning of wisdom consists in fear, what will its perfection be except in the love Of Christ which, as it contains in it the fear which belongs to perfect love, is called not the beginning but the treasure of wisdom and knowledge?
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 13"
