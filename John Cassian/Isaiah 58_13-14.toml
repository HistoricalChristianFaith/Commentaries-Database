[[commentary]]
quote='''
The aim indeed of the coenobite is to mortify and crucify all his desires and, according to that salutary command of evangelic perfection, to take no thought for the morrow. And it is perfectly clear that this perfection cannot be attained by any except a coenobite, such a man as the prophet Isaiah describes and blesses and praises as follows: "If thou turn away thy foot from the Sabbath, from doing thy own will in my holy day, and glorify Him, while thou dost not thine own ways, and thine own will is not found to speak a word: then shalt thou be delighted in the Lord, and I will lift thee up above the high places of the earth, and will feed thee with the inheritance of Jacob thy father. For the mouth of the Lord hath spoken it." But the perfection for a hermit is to have his mind freed from all earthly things, and to unite it, as far as human frailty allows, with Christ: and such a man the prophet Jeremiah describes when he says: "Blessed is the man who hath borne the yoke from his youth. He shall sit solitary and hold his peace, because he hath taken it upon himself;" the Psalmist also: "I am become like a pelican in the desert. I watched and became as a sparrow alone upon the housetop." To this aim then, which we have described as that of either life, unless each of them attains, in vain does the one adopt the system of the coenobium, and the other of the hermitage: for neither of them will get the good of his method of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F19.%2520Conference%2520of%2520Abbot%2520John.html'
source_title="Conference of Abbot John, Chapter 8"

[[commentary]]
quote='''
Those are certainly worthy of praise as violent, who do violence to their own destruction, for, "A man," as it is written, "that is in sorrow laboureth for himself and does violence to his own destruction." For our destruction is delight in this present life, and to speak more definitely, the performance of our own likes and desires, as, if a man withdraws these from his soul and mortifies them, he straightway does glorious and valuable violence to his own destruction, provided that he refuses to it the pleasantest of its wishes which the Divine word often rebukes by the prophet, saying: "For in the days of your fast your own will is found;" and again: "If thou turn away thy foot from the Sabbath, to do thy will on My holy day, and glorify him, while thou dost not thy own ways, and thy own will is not found, to speak a word." And the great blessedness that is promised to him is at once added by the prophet. "Then," he says, "shalt thou be delighted in the Lord, and I will lift thee up above the high places of the earth, and will feed thee with the inheritance of Jacob thy father. For the mouth of the Lord hath spoken it." And therefore our Lord and Saviour, to give us an example of giving up our own wills, says: "I came not to do My own will, but the will of Him that sent Me;" and again: "Not as I will, but as Thou wilt." And this good quality those men in particular show who live in the coenobia and are governed by the rule of the Elders, who do nothing of their own choice, but their will depends upon the will of the Abbot.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 26"
