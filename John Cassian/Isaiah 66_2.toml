[[commentary]]
quote='''
Wherefore if we wish the summit of our building to be perfect and to rise well-pleasing to God, we should endeavour to lay its foundations not in accordance with the desires of our own lust, but according to the rules of evangelical strictness: which can only be the fear of God and humility, proceeding from kindness and simplicity of heart. But humility cannot possibly be acquired without giving up everything: and as long as a man is a stranger to this, he cannot possibly attain the virtue of obedience, or the strength of patience, or the serenity of kindness, or the perfection of love; without which things our hearts cannot possibly be a habitation for the Holy Spirit: as the Lord says through the prophet: "Upon whom shall My spirit rest, but on him that is humble and quiet and ears My words," or according to those copies which express the Hebrew accurately: "To whom shall I have respect, but to him that is poor and little and of a contrite spirit and that trembleth at My words?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 31"
