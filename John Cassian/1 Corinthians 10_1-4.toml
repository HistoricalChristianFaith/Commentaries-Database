[[commentary]]
quote='''
Of these four kinds of interpretation the blessed Apostle speaks as follows: "But now, brethren, if I come to you speaking with tongues what shall I profit you unless I speak to you either by revelation or by knowledge or by prophecy or by doctrine?" For "revelation" belongs to allegory whereby what is concealed under the historical narrative is revealed in its spiritual sense and interpretation, as for instance if we tried to expound how "all our fathers were under the cloud and were all baptized unto Moses in the cloud and in the sea," and how they "all ate the same spiritual meat and drank the same spiritual drink from the rock that followed them. But the rock was Christ." And this explanation where there is a comparison of the figure of the body and blood of Christ which we receive daily, contains the allegorical sense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 8"
