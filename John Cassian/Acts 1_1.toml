[[commentary]]
quote='''
Be then in all things "swift to hear, but slow to speak," lest there come upon you that which is noted by Solomon: "If thou seest a man who is quick to speak, know that there is more hope of a fool than of him; and do not presume to teach any one in words what you have not already performed in deed. For our Lord taught us by His own example that we ought to keep to this order, as of Him it is said: "what Jesus began to do and to teach." Take care then that you do not rush into teaching before doing, and so be reckoned among the number of those of whom the Lord speaks inthe gospel to the disciples: "What they sayunto you, that observe and do, but not aftertheir words: for they say and do not. But they bind heavy burdens and grievous to beborne, and lay them on men's shoulders; butthey themselves will not move them with oneof their fingers."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 9"
