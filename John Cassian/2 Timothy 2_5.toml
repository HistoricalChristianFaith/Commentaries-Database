[[commentary]]
quote='''
"One who strives. in the games is not crowned unless he has contended lawfully." One who wants to extinguish the natural desires of the flesh, should first hasten to overcome those vices whose seat is outside our nature. For if we desire to make trial of the force of the Apostle's saying, we ought first to learn what are the laws and what the discipline of the world's contest, so that finally by a comparison with these, we may be able to know what the blessed Apostle meant to teach to us who are striving in a spiritual contest by this illustration. For in these conflicts, which, as the same Apostle says, hold out "a corruptible crown" to the victors, this rule is kept, that he who aims at preparing himself for the crown of glory, which is embellished with the privilege of exemption, and who is anxious to enter the highest struggle in the contest, should first in the Olympic and Pythian games give evidence of his abilities as a youth, and his strength in its first beginnings; since in these the younger men who want to practise this training are tested as to whether they deserve or ought to be admitted to it, by the judgment both of the president of the games and of the whole multitude. And when any one has been carefully tested, and has first been proved to be stained by no infamy of life, and then has been adjudged not ignoble through the yoke of slavery, and for this reason unworthy to be admitted to this training and to the company of those who practise it, and when thirdly he produces sufficient evidence of his ability and prowess and by striving with the younger men and his own compeers has shown both his skill and valour as a youth, and going forward from the contests of boys has been by the scrutiny of the president permitted to mix with full-grown men and those of approvedexperience, and has not only shown himself their equal in valour by constant striving with them,but has also many a time carried off the prize of victory among them, then at last he is allowed to approach the most illustrious conflict of the games, permission to contend in which is granted to none but victors and those who are decked with many crowns and prizes. If we understand this illustration from a carnal contest, we ought by a comparison with it to know what is the system and method of our spiritual conflict as well.

WE also ought first to give evidence of our freedom from subjection to the flesh. For "of whom a man is overcome, of the same is he the slave." And "every one that doeth sin slave of sin." And when the scrutiny is the of the president of the contest finds that we are stained by no infamy of disgraceful lust, and when we are judged by him not to be slaves of the flesh, and ignoble and unworthy of the Olympic struggle against our vices, then we shall be able to enter the lists against our equals, that is the lusts of the flesh and the motions and disturbances of the soul. For it is impossible for a full belly to make trial of the combat of the inner man: nor is he worthy to be tried in harder battles, who can be overcome in a slight skirmish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25205.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 5, Chapters 12-13"

[[commentary]]
quote='''
And so when the desires of the belly and of the palate have been by these considerations overcome, and when we have been declared, as in the Olympic contests, neither slaves of the flesh nor infamous through the brand of sin, we shall be adjudged to be worthy of the contest in higher struggles as well, and, leaving behind lessons of this kind, may be believed capable of entering the lists against spiritual wickednesses, against which only victors and those who are allowed to contend in a spiritual conflict are deemed worthy to struggle. For this is so to speak a most solid foundation of all the conflicts, viz.: that in the first instance the impulses of carnal desires should be destroyed. For no one can lawfully strive unless his own flesh has been overcome. And one who does not strive lawfully certainly cannot take a share in the contest, nor win a crown of glory and the grace of victory. But if we have been overcome in this battle, having been proved as it were slaves of carnal lusts, and thus displaying the tokens neither of freedom nor of strength, we shall be straightway repulsed from the conflicts with spiritual hosts, as unworthy and as slaves, with every mark of confusion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25205.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 5, Chapter 16"
