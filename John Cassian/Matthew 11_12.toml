[[commentary]]
quote='''
Moreover also: "the kingdom of heaven suffereth violence and the violent take it by force," for no virtue is acquired without effort, nor can anyone attain to that mental stability which he desires without great sorrow of heart, for "man is born to trouble," and in order that he may be able to attain to "the perfect man, the measure of the stature of the fulness of Christ" he must ever be on the watch with still greater intentness, and toil with ceaseless carefulness. But to the fulness of this measure no one will ever attain, but one Who has considered it beforehand and been trained to it now and has had some foretaste of it while still in this world, and being marked a most precious member of Christ, has possessed in the flesh an earnest of that "joint" by which he can be united to His body: desiring one thing alone, thirsting for but one thing, ever bringing not only his acts but even his thoughts to bear on one thing alone; viz., that he may even now keep as an earnest that which is said of the blessed life of thesaints hereafter; viz., that "God may be" to him "all in all."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 6"

[[commentary]]
quote='''
But all these things he will receive not with careless slackness and a lazy delight, but, in accordance with the Lord's word, "with persecutions," i.e., with the pressure of this world, and terrible distress from his passions, because, as the wise man testifies: "He who is easy going and without trouble shall come to want." For not the slothful, or the careless, or the delicate, or the tender take the kingdom of heaven by force, but the violent. Who then are the violent? Surely they are those who show a splendid violence not to others, but to their own soul, who by a laudable force deprive it of all delights in things present, and are declared by the Lord's mouth to be splendid plunderers, and by rapine of this kind, violently seize upon the kingdom of heaven. For, as the Lord says, "The kingdom of heaven suffereth violence and the violent take it by force." Those are certainly worthy of praise as violent, who do violence to their own destruction, for, "A man," as it is written, "that is in sorrow laboureth for himself and does violence to his own destruction." For our destruction is delight in this present life, and to speak more definitely, the performance of our own likes and desires, as, if a man withdraws these from his soul and mortifies them, he straightway does glorious and valuable violence to his own destruction, provided that he refuses to it the pleasantest of its wishes which the Divine word often rebukes by the prophet, saying: "For in the days of your fast your own will is found;" and again: "If thou turn away thy foot from the Sabbath, to do thy will on My holy day, and glorify him, while thou dost not thy own ways, and thy own will is not found, to speak a word." And the great blessedness that is promised to him is at once added by the prophet. "Then," he says, "shalt thou be delighted in the Lord, and I will lift thee up above the high places of the earth, and will feed thee with the inheritance of Jacob thy father. For the mouth of the Lord hath spoken it." And therefore our Lord and Saviour, to give us an example of giving up our own wills, says: "I came not to do My own will, but the will of Him that sent Me;" and again: "Not as I will, but as Thou wilt." And this good quality those men in particular show who live in the coenobia and are governed by the rule of the Elders, who do nothing of their own choice, but their will depends upon the will of the Abbot.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 26"
