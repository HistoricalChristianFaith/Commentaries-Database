[[commentary]]
quote='''
And that this kind of temptation can befall us, for the sake of proving us, is sufficiently clearly foretold by the giver of the Law in Deuteronomy: "If there rise in the midst of you a prophet or one that saith he hath seen a dream, and foretell a sign and wonder; and that come to pass which he spoke, and he say to thee: Let us go and serve strange gods which ye know not, thou shalt not hear the words of that prophet or dreamer; for the Lord your God surely trieth thee, whether thou lovest Him with all thine heart, and keepest His Commandments, or no." What then follows? When God has permitted that prophet or dreamer to arise, must we hold that He will protect those whose faith He is purposing to try, in such a way as to leave no place for their own free will, where they can fight with the tempter with their own strength? And why is it necessary for them even to be tried if He knows them to be so weak and feeble as not to be able by their own power to resist the tempter? But certainly the Divine righteousness would not have permitted them to be tempted, unless it knew that there was within them an equal power of resistance, by which they could by an equitable judgment be found in either result either guilty or worthy of praise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 14"

[[commentary]]
quote='''
The third method of healing is copied by the deceit and contrivance of devils, that, when a man who is enslaved to evident sins is out of admiration for his miracles regarded as a saint and a servant of God, men may be persuaded to copy his sins and thus an opening being made for cavilling, the sanctity of religion may be brought into disgrace, or else that he, who believes that he possesses the gift of healing, may be puffed up by pride of heart and so fall more grievously. Hence it is that invoking the names of those, who, as they know, have no merits of holiness or any spiritual fruits, they pretend that by their merits they are disturbed and made to flee from the bodies they have possessed. Of which it says in Deuteronomy: "If there rise up in the midst of thee a prophet, or one who says that he has seen a dream, and declare a sign and a wonder, and that which he hath spoken cometh to pass, and he say to thee: Let us go and follow after other gods whom thou knowest not, and let us serve them: thou shalt not hear the words of that prophet or of that dreamer, for the Lord thy God is tempting thee that it may appear whether thou lovest Him or not, with all thy heart and with all thy soul."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F15.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The Second Conference of Abbot Nesteros, Chapter 1"
