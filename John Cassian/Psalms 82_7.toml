[[commentary]]
quote='''
But Holy Scripture relates that these fell not alone from that summit of their station in bliss, as it tells us that the dragon dragged down together with himself the third part of the stars. One of the Apostles too says still more plainly: "But the angels who kept not their first estate, but left their own dwelling, He hath reserved in everlasting chains under darkness to the judgmentof the great day." This too which is said to us: "But ye shall die like men and fall like one of the princes," what does it imply but that many princes have fallen? And by these testimonies we can gather the reason for this diversity; viz., either that they still retain those differences of rank (which adverse powers are said to possess, after the manner of holy and heavenly virtues) from the station of their former rank in which they were severally created, or else that, though themselves cast down from heavenly places, yet, as a reward for that wickedness of theirs in which they have graduated in evil, they claim in perversity these grades and titles of rank among themselves, by way of copying those virtues which have stood firm there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 8"
