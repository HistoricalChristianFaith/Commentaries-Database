[[commentary]]
quote='''
And so, after the exertion of the Vigil, a dispensation from fasting, appointed in like manner for the Sabbath by apostolic men, is not without reason enjoined in all the churches of the East, in accordance with that saying of Ecclesiastes, which, although it has another and a mystical sense, is not misapplied to this, by which we are charged to give to both days-that is, to the seventh and eighth equally-the same share of the service, as it says: "Givea portion to these seven and also to these eight." For this dispensation from fasting must not be understood as a participation in the Jewish festival by those above all who are shown to be free from all Jewish superstition, but as contributing to that rest of the wearied body of which we have spoken; which, as it fasts continually for five days in the week all through the year, would easily be worn out and fail, unless it were revived by an interval of at least two days.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25203.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 3, Chapter 9"
