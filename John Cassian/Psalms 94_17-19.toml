[[commentary]]
quote='''
And again: "If I said my foot was moved;" viz., from the slippery character of the will, "Thy mercy, O Lord, helped me." Once more he joins on the help of God to his own weakness, as he confesses that it was not owing to his own efforts but to the mercy of God, that the foot of his faith was not moved. And again: "According to the multitude of the sorrows which I had in my heart," which sprang most certainly from my free will, "Thy comforts have refreshed my soul," i.e., by coming through Thy inspiration into my heart, and laying open the view of future blessings which Thou hast prepared for them who labour in Thy name, they not only removed all anxiety from my heart, but actually conferred upon it the greatest delight. And again: "Had it not been that the Lord helped me, my soul had almost dwelt in hell." He certainly shows that through the depravity of this free will he would have dwelt in hell, had he not been saved by the assistance and protection of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 12"
