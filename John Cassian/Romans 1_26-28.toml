[[commentary]]
quote='''
But it is right for us to hold with unswerving faith that nothing whatever is done in this world without God. For we must acknowledge that everything is done either by His will or by His permission, i.e., we must believe that whatever is good is carried out by the will of God and by His aid, and whatever is the reverse is done by His permission, when the Divine Protection is withdrawn from us for our sins and the hardness of our hearts, and suffers the devil and the shameful passions of the body to lord it over us. And the words of the Apostle most assuredly teach us this, when he says: "For this cause God delivered them up to shameful passions:" and again: "Because they did not like to have God in their knowledge, God delivered them up to a reprobate sense, to do those things which are not convenient."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 20"

[[commentary]]
quote='''
There are also other sorts of vengeance, with which some who have overpassed the bounds of wickedness are smitten in this life, as we read that Dathan and Abiram or Korah were punished, or above all, those of whom the Apostle speaks: "Wherefore God gave them up to vile passions and a reprobate mind:" and this must be counted worse than all other punishments. For of these the Psalmist says: "They are not in the labours of men; neither shall they be scourged like other men." For theyare not worthy of being healed by the visitation of the Lord which gives life, and by plagues in this world, as "in despair they have given themselves over to lasciviousness, unto the working of all error unto uncleanness," and as by hardening their hearts, and by growing accustomed and used to sin they have got beyond cleansing in this brief life and punishment in the present world: men, who are thus reproved by the holy word of the prophet: "I destroyed some of you, as God destroyed Sodom and Gomorrah, and you were as a firebrand plucked out of the burning: yet you returned not to Me, saith the Lord," and Jeremiah: "I have killed and destroyed thy people, and yet they are not returned from their ways."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F6.%2520Conference%2520of%2520Abbot%2520Theodore.html'
source_title="Conference of Abbot Theodore, Chapter 11"
