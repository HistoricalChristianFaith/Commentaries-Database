[[commentary]]
quote='''
Finally SO highly is the virtue of love ex-tolled that the blessed Apostle John declares that it not only belongs to God but that it is God, saying: "God is love: he therefore that abideth in love, abideth in God, and God in him." For so far do we see that it is divine, that we find that what the Apostle says is plainly a living truth in us: "For the love of God is shed abroad in our hearts by the Holy Ghost Who dwelleth in us." For it is the same thing as if he said that God is shed abroad in our hearts by the Holy Ghost Who dwelleth in us: who also, when we know not what we should pray for, "makes intercession for us with groanings that cannot be uttered: But He that searcheth the hearts knoweth what the Spirit desireth, for He asketh for the saints according to God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 13"
