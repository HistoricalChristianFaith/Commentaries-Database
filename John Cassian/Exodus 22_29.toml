[[commentary]]
quote='''
By the law of Moses thecommand propounded to all the people generally was this: "Thou shalt offer to the Lord thy God thy tithes and firstfruits." And so, while we are commanded to offer tithes of our substance and all our fruits, it is much more needful for us to offer tithes of our life and ordinary employments and actions, which certainly is clearly arranged for in the calculation of Lent. For the tithe of the number of all the days included in the revolving circle of the year is thirty-six days and a half. But in seven weeks, if Sundays and Saturdays are subtracted, there remain thirty-five days assigned for fasting. But by the addition of Easter Eve when the Saturday's fast is prolonged to the cock-crowing at the dawn of Easter Day, not only is the number of thirty-six days made up, but in regard to the tithe of the five days which seemed to be over, if the bit of the night which was added be taken into account nothing will be wanting to the whole sum.

But what shall I say of the firstfruits which surely are given daily by all who serve Christ faithfully? For when men waking from sleep and arising with renewed activity after their rest, before they take in any impulse or thought in their heart, or admit any recollection or consideration of business consecrate their first and earliest thoughts as divine offerings, what are they doing indeed but rendering the firstfruits of their produce through the High Priest Jesus Christ for the enjoyment of this life and a figure of the daily resurrection? And also when roused from sleep in the same way they offer to God a sacrifice of joy and invoke Him with the first motion of their tongue and celebrate His name and praise, and throwing open, the first thing, the door of their lips to sing hymns to Him they offer to God the offices of their mouth; and to Him also in the same way their bring the earliest offerings of their hands anti steps, when they rise from bed and stand in prayer and before they use the services of their limbs for their own purposes, take to themselves nothing of their services, but for His glory advance their steps, and set them in His praise and so render the first fruits of all their movements by stretching forth the hands, bending the knees, and prostrating the whole body. For in no other way can we fulfil that of which we sing in the Psalm: "I prevented the dawning of the day and cried;" and: "Mine eves to Thee have prevented the morning that I might meditate on Thy words;" and: "In the morning shall my prayer prevent Thee;" unless after our rest in sleep when, as we said above, we are restored as from darkness and death to this light, we have the courage not to begin by taking any of all the services both of mind and body for our own uses. For there is no other morning which the prophet "prevented," or which in the same way we ought to prevent, except either ourselves, i.e., our occupations and feelings and earthly cares, without which we cannot exist-or the most subtle suggestions of the adversary, which he tries to suggest to us, while still resting and overcome with sleep, by the phantoms of vain dreams, with which, when we presently awake, he will fill our minds and occupy us, that he may be the first to seize and carry off the spoils of our firstfruits. Wherefore we must take the utmost care (if we want to fulfil in act the meaning of the above quoted verse) that an anxious watchfulness takes regard of our first and earliest morning thoughts, that they may not be defiled beforehand being hastily taken possession of by our jealous adversary, and thus he may make our firstfruits to be rejected by the Lord as worthless and common. And if he is not prevented by us with watchful circumspection of mind, he will not lay aside his habit of miserably anticipating us nor cease day after day to prevent us by his wiles. And therefore if we want to offer firstfruits that are acceptable and well pleasing to God of the fruits of our mind, we ought to spend no ordinary care to keep all the senses of our body, especially during the hours of the morning, as a sacred holocaust to the Lord pure and undefiled in all things. And this kind of devotion many even of those who live in the world observe with the utmost care, as they rise before it is light or very early, and do not at all mix in the ordinary and necessary business of this world before hastening to church and striving to consecrate in the sight of God the firstfruits of all their actions and doings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapters 25-26"

[[commentary]]
quote='''
But as sin is alive in one who loves marriage, so is it also in one who is satisfied with merely paying his tithes and firstfruits. For, while he is dawdling or careless, he is sure to sin in regard to either their quality or quantity, or the daily distribution of them. For as he is commanded unweariedly to minister to those in want of what is his, although he may dispense it with the fullest faith and devotion, yet it is hard for him not to fall often into the snares of sin. But over those who have not set at naught the counsel of the Lord, but who, disposing of all their property to the poor, take up their cross and follow the bestower of grace, sin can have no dominion. For no faithless anxiety for getting food will annoy him who piously distributes and disperses his wealth already consecrated to Christ and no longer regarded as his own; nor will any grudging hesitation take away from the cheerfulness of his almsgiving, because without any thought of his own needs or fear of his own food running short he is distributing what has once for all been completely offered to God, and is no longer regarded as his own,as he is sure that when he has succeeded instripping himself as he desires, he will be fed by God much more than the birds of the air.On the other hand he who retains his goodsof this world, or, bound by the rules of the old law, distributes the tithe of his produce, and his firstfruits, or a portion of his income, although he may to a considerable degree quench the fire of his sins by this dew of almsgiving, yet, however generously he gives away his wealth, it is impossible for him altogether to rid himself of the dominion of sin, unless perhaps by the grace of the Saviour, together with his substance he gets rid of all love of possessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 33"
