[[commentary]]
quote='''
And in the same way in the case of the man who had been lying for thirty-eight years near the edge of the pool, and hoping for a cure from the moving of the water, He showed the princely character of His bounty unasked. For when in His wish to arouse him for the saving remedy, He had said to him: "wiliest thou to be made whole," and when the man complained of his lack of human assistance and said: "I have no man to put me into the pool when the water is troubled," the Lord in His pity granted pardon to his unbelief and ignorance, and restored him to his former health, not in the way which he expected, but in the way which He Himself willed, saying: "Arise, take up thy bed and go unto thine house."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 16"
