[[commentary]]
quote='''
Lastly, those very people, whom in his first Epistle he had treated with the gentle application of his words, in his second Epistle he en-deavours to heal with severer and sterner remedies, as those who had not profited by more gentle treatment; and he no longer applies the treatment of gentle words, no mild and kindly expressions, as these, "But we ask you, brethren," but "We adjure you, brethren, in the name of our Lord Jesus Christ, that ye withdraw from every brother that walketh disorderly." There he asks; here he adjures. There is the kindness of one who is persuading; here the sternness of one protesting and threatening. "We adjure you, brethren:" because, when we first asked you, you scorned to listen; now at least obey our threats. And this adjuration he renders terrible, not by his bare word, but by the imprecation of the name of our Lord Jesus Christ: for fear lest they might again scorn it, as merely man's word, and think that it was not of much importance. And forthwith, like a well-skilled physician with festering limbs, to which he could not apply the remedy of a mild treatment, he tries to cure by an incision with a spiritual knife, saying, "that ye withdraw yourselves from every brother that walketh disorderly, and not according to the tradition which ye received of us." And so he bids them withdraw from those who will not make time for work, and to cut them off like limbs tainted with the festering sores of leisure: test the the malady of idleness, like some deadly con tagion, might infect even the healthy portionof their limbs, by the gradual advance of infection. And when he is going to speak ofthose who will not work with their own hands and eat their bread in quietness, from whom he urges them to withdraw, hear with what reproaches he brands them at starting. First he calls them "disorderly," and "not walking according to the tradition." In other words, he stigmatizes them as obstinate, since they will not walk according to his appointment; and "dishonest," i.e., not keeping to the right and proper times for going out, and visiting, and talking. For a disorderly person is sure to be subject to all those faults. "And not according to the tradition which they received from us." And in this he stamps them as in some sort rebellious, and despisers, who scorned to keep the tradition which they had received from him, and would not follow that which they not only remembered that the master had taught in word, but which they knew that he had performed in deed. "For you yourselves know how ye ought to be folowers of us." He heaps up an immense pile of censure when he asserts that they did not observe that which was still in their memory, and which not only had they learned by verbal instruction, but also had received by the incitement of his example in working.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 7"
