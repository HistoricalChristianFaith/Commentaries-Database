[[commentary]]
quote='''
And there is indeed in these a stage leading to some advance, which affects us so that when from fear of punishment or from hope of reward we begin to avoid sin we are enabled to pass on to the stage of love, for "fear," says one, "is not in love, but perfect love casteth out fear: for fear hath torment, but he who fears is not perfect in love. We therefore love because God first loved us." We can then only ascend to that true perfection when, as He first loved us for the grace of nothing but our salvation, we also have loved Him for the sake of nothing but His own love alone. Wherefore we must do our best to mount with perfect ardour of mind from this fear to hope, from hope to the love of God, and the love of the virtues themselves, that as we steadily pass on to the love of goodness itself, we may, as far as it is possible for human nature, keep firm hold of what is good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 7"
