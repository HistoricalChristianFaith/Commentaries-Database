[[commentary]]
quote='''
But when the multitude of believers began day by day to decline from that apostolic fervour, and to look after their own wealth, and not to portion it out for the good of all the faithful in accordance with the arrangement of the apostles, but having an eye to their own private expenses, tried not only to keep it but actually to increase it, not content with following the example of Ananias and Sapphira, then it seemed good to all the priests that men who were hampered by worldly cares, and almost ignorant, if I may say so, of abstinence and contrition, should be recalled to the pious duty by a fast canonically enjoined, and be constrained by the necessity of paying the legal tithes, as this certainly would be good for the weak brethren and could not do any harm to the perfect who were living under the grace of the gospel and by their voluntary devotion going beyond the law, so as to succeed in attaining to the blessedness which the Apostle speaks of: "For sin shall not have dominion over you; for ye are not under the law but under grace." For of a truth sin cannot exercise dominion over one who lives faithfully under the liberty of grace.

Germanus: Because this saying of the Apostle, which promises freedom from care not only to monks but to all Christians in general, cannot lead us wrong, it seems to us somewhat obscure. For whereas he maintains that all those who believe the gospel are at liberty and free from the yoke and dominion of sin, how is it that the dominion of sin holds vigorous sway over almost all the baptized, in accordance with the Lord's words, where He says: "Every one that doeth sin is the servant of sin"?

Theonas: Your inquiry once more raises before us a question of no small extent. The explanation of which though I know that it cannot be taught to or understood by the inexperienced, yet as far as I can, I will try to set forth in words and briefly to explain, if only your minds will follow up and act upon what we say. For whatever is known not by teaching but by experience, just as it cannot be taught by one without experience, so neither can it be grasped or taken in by the mind of one who has not laid the foundation by a similar study and training. And therefore I think it necessary for us first to inquire somewhat carefully what is the purpose or meaning of the law, and what is the system and perfection of grace, that from this we may succeed in understanding the dominion of sin and how to drive it out. And so the law chiefly commands men to seek the bonds of wedlock, saying: "Blessed is he that hath seed in Sion and an household in Jerusalem;" and: "Cursed is the barren that hath not borne." On the other hand grace invites us to the purity of perpetual chastity, and the undefiled state of blessed virginity, saying: "Blessed are the barren, and the breasts which have not given suck;" and: "he that hateth not father and mother and wife cannot be my disciple;" and this of the Apostle: "It remaineth that they that have wives be as though they had them not." The law says: "Thou shall not delay to offer thy tithes and firstfruits;" grace says: "If thou wilt be perfect, go and sell all that thou hast and give to the poor:" The law forbids not retaliation for wrongs and vengeance for injuries, saying""An eye for an eye and a tooth for a tooth." Grace would have our patience proved by the injuries and blows offered to us being redoubled, and bids us be ready to endure twice as much damage; saying: "If a man strike thee on one cheek, offer him the other also; and to him who will contend with thee at the law and take away thy coat, give him thy cloak also." The one decrees that we should hate our enemies, the other that we should love them so that it holds that even for them we ought always to pray to God.

Whoever therefore climbs this height of evangelical perfection, is at once raised by the merits of such virtue above every law, and disregarding as trivial all that is commanded by Moses, recognizes that he is only subject to the grace of the Saviour, by whose aid he knows that he attained to that most exalted condition. Therefore sin has no dominion over him, "because the love of God, which is shed abroad in our hearts by the Holy Ghost which is given to us," shuts out all care for everything else, and can neither desire what is forbidden, or disregard what is commanded, as its whole aim and all its desire is ever fixed on divine love, and to such an extent is it not caught by the delights of worthless things, that it actually does not take advantage of those things which are permitted. But under the law, where lawful marriages are observed, although the rovings of wantonness are restrained, and bound down to one woman alone, yet the pricks of carnal lust cannot help being vigorous; and it is hard for the fire, for which fuel is expressly supplied, to be thus shut in within prearranged limits, so as not to spread further and burn up anything it touches. As even if this objection occurs to it that it is not allowed to be kindled beyond these limits, yet even while it is kept in check, it is on fire because the will itself is in fault, and its habit of carnal intercourse hurries it into too speedy excesses of adultery. But those whom the grace of the Saviour has fired with the holy love of chastity, so consume all the thorns of carnal desires in the fire of the Lord's love, that no dying embers of sin interfere with the coldness of their purity. The servants of the law then from the use of lawful things fall away to unlawful; the partakers of grace while they disregard lawful things know nothing of unlawful ones. But as sin is alive in one who loves marriage, so is it also in one who is satisfied with merely paying his tithes and firstfruits. For, while he is dawdling or careless, he is sure to sin in regard to either their quality or quantity, or the daily distribution of them. For as he is commanded unweariedly to minister to those in want of what is his, although he may dispense it with the fullest faith and devotion, yet it is hard for him not to fall often into the snares of sin. But over those who have not set at naught the counsel of the Lord, but who, disposing of all their property to the poor, take up their cross and follow the bestower of grace, sin can have no dominion. For no faithless anxiety for getting food will annoy him who piously distributes and disperses his wealth already consecrated to Christ and no longer regarded as his own; nor will any grudging hesitation take away from the cheerfulness of his almsgiving, because without any thought of his own needs or fear of his own food running short he is distributing what has once for all been completely offered to God, and is no longer regarded as his own,as he is sure that when he has succeeded instripping himself as he desires, he will be fed by God much more than the birds of the air.On the other hand he who retains his goodsof this world, or, bound by the rules of the old law, distributes the tithe of his produce, and his firstfruits, or a portion of his income, although he may to a considerable degree quench the fire of his sins by this dew of almsgiving, yet, however generously he gives away his wealth, it is impossible for him altogether to rid himself of the dominion of sin, unless perhaps by the grace of the Saviour, together with his substance he gets rid of all love of possessing. In the same way he cannot fail to be subject to the bloody sway of sin, whoever chooses to pull out, as the law commands, an eye for an eye, a tooth for a tooth, or to hate his enemy, for while he desires by retaliation in exchange to avenge an injury done to himself, and while he cherishes bitter hatred against an enemy, he is sure always to be inflamed with the passion of anger and rage. But whoever lives under the light of the grace of the gospel, and overcomes evil by not resisting it, but by bearing it, and does not hesitate of his own free will to give to one who smites his right cheek, the other also, and to one who wants to raise a lawsuit against him for his coat, gives his cloak also, and who loves his enemies, and prays for those who slander him, this man has broken the yoke of sin and burst its chains. For he is not living under the law, which does not destroy the seeds of sin (whence not without reason the Apostle says of it: "There is a setting aside of the former commandment because of the weakness and unprofitableness thereof: for the law brought nothing to perfection;" and the Lord says by the prophet: "And I gave them commands that were not good, and ordinances, whereby they could not live" , but under grace which does not merely lop off the boughs of wickedness, but actually tears up the very roots of an evil will.

Whoever then strives to reach the perfection of evangelical teaching, this man living under grace is not oppressed by the dominion of sin, for to be under grace is to do those things which grace commands. But whoever will not submit himself to the complete requirements of evangelical perfection, must not remain ignorant that, although he seems to be baptized and to be a monk, yet he is not under grace, but is still shackled by the chains of the law, and weighed down by the burden of sin. For it is the aim of Him, who by the grace of adoption accepts all those by whom He has been received, not to destroy but to build upon, not to abolish but to fulfil the Mosaic requirements. But some knowing nothing about this, and disregarding the splendid counsels and exhortations of Christ, are so emancipated by the carelessness of a freedom too hastily assumed, that they not only fail to carry out the commands of Christ as if they were too hard, but actually scorn as antiquated, the commands given to them as beginners and children by the law of Moses, saying in this dangerous freedom of theirs that which the Apostle execrates: "We have sinned, because we are not under the law but under grace." He then who is neither under grace, because he has never climbed the heights of the Lord's teaching, nor under the law, because he has not accepted even those small commands of the law, this man, ground down beneath a twofold rule of sin, fancies that he has received the grace of Christ, simply and solely for this, that by this dangerous liberty of his he may make himself none of His, and falls into that state, which the Apostle Peter warns us to avoid, saying: "Act as free, and not having your liberty as a cloak of wickedness." The blessed Apostle Paul also says: "For ye, brethren, were called to liberty," i.e., that ye might be free from the dominion of sin, "only use not your liberty for an occasion of the flesh," i.e., believe that the doing away with the commands of the law is a licence to sin. But this liberty, the Apostle Paul teaches us is nowhere but where the Lord is dwelling, for he says: "The Lord is the Spirit, but where the Spirit of the Lord is there is liberty." Wherefore I know not whether I could express and explain the meaning of the blessed Apostle, as those know how, who have experience; one thing I do know, that it is very clearly revealed even without anyone's explanation to all those who have perfectly acquired praktikh;, i.e., practical training. For they will need no effort to understand in discussion what they have already learnt by practice.
'''
