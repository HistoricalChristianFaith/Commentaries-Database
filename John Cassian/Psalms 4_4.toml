[[commentary]]
quote='''
We have, it must be admitted, a use for anger excellently implanted in us for which alone it is useful and profitable for us to admit it, viz., when we are indignant and rage against the lustful emotions of our heart, and are vexed that the things which we are ashamed to do or say before men have risen up in the lurking places of our heart, as we tremble at the presence of the angels, and of God Himself, who pervades all things everywhere, and fear with the utmost dread the eye of Him from whom the secrets of our hearts cannot possibly be hid.

And at any rate (this is the case), when we are agitated against this very anger, because it has stolen on us against our brother, and when in wrath we expel its deadly incitements, nor suffer it to have a dangerous lurking place in the recesses of our heart. To be angry in this fashion even that prophet teaches us who had so completely expelled it from his own feelings that he would not retaliate even on his enemies and those delivered by God into his hands: when he says "Be ye angry and sin not." For he, when he had longed for water from the well of Bethlehem, and had been given it by his mighty men, who had brought it through the midst of the hosts of the enemy, at once poured it out on the ground: and thus in his anger extinguished the delicious feeling of his desire, and poured it out to the Lord, without satisfying the longing that he had expressed, saying: "That be far from me that I should do this! Shall I drink the blood of those men who went forth on the danger of their souls?" And when Shimei threw stones at King David and cursed him, in his hearing, before everybody, and Abishai, the son of Zeruiah, the captain of the host, wished to cut off his head and avenge the insult to the king, the blessed David moved with pious wrath against this dreadful suggestion of his, and keeping the due measure of humility and a strict patience, said with imperturbable gentleness, "What have I to do with you, ye sons of Zeruiah? Let him alone that he may curse. For the Lord hath commanded him to curse David. And who is he who shall dare to say, Why hast thou done this? Behold my son, who came forth from my loins, seeks my life, and how much more this son of Benjamin? Let him alone, that he may curse, according to the command of the Lord. It may be the Lord will look upon my affliction, and return to me good for this cursing to-day."

And some are commanded to "be angry" after a wholesome fashion, but with our own selves, and with evil thoughts that arise, and "not to sin," viz., by bringing them to a bad issue. Finally, the next verse explains this to be the meaning more clearly: "The things you say in your hearts, be sorry for them on your beds:" i.e., whatever you think of in your hearts when sudden and nervous excitements rush in on you, correct and amend with wholesome sorrow, lying as it were on a bed of rest, and removing by the moderating influence of counsel all noise and disturbance of wrath. Lastly, the blessed Apostle, when he made use of the testimony of this verse, and said, "Be ye angry and sin not," added, "Let not the sun go down upon your wrath, neither give place to the devil." If it is dangerous for the sun of righteousness to go down upon our wrath, and if when we are angry we straightway give place to the devil in our hearts, how is it that above he charges us to be angry, saying, "Be ye angry, and sin not"? Does he not evidently mean this: be ye angry with your faults and your tempers, lest, if you acquiesce in them, Christ, the sun of righteousness, may on account of your anger begin to go down on your darkened minds, and when He departs you may furnish a place for the devil in your hearts?
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25208.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 8, Chapters 7-9"
