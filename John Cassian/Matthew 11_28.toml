[[commentary]]
quote='''
The grace of Christ then is at hand every day, which, while it "willeth all men to be saved and to come to the knowledge of the truth," calleth all without any exception, saying: "Come unto Me, all ye that labour and are heavy laden, and I will refresh you." But if He calls not all generally but only some, it follows that not all are heavy laden either with original or actual sin, and that this saying is not a true one: "For all have sinned and come short of the glory of God;" nor can we believe that "death passed on all men."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 7"
