[[commentary]]
quote='''
It produces indeed "grass for the cattle" also, (and of this food all the fields of Scripture are full); viz., plain and simple narratives of history, by which simple folk, and those who are incapable of perfect and sound understanding (of whom it is said "Thou, Lord, wilt save both man and beast") may be made stronger and more vigorous for their hard work and the labour of actual life, in accordance with the state and measure of their capacity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 3"
