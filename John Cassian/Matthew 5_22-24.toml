[[commentary]]
quote='''
But on what grounds will he endure either to admit the rancour of vexation in himself or for it to remain in another, if his firm decision is that there cannot be any good ground for anger, as it is dangerous and wrong, and that when his broker is angry with him he cannot pray, in just the same way as when he himself is angry with his brother, as he ever keeps in an humble heart these words of our Lord and Saviour: "If thou bring thy gift to the altar and there remember that thy brother hath aught against thee, leave there thy gift at the altar, and go thy way; first be reconciled to thy brother, and then come and offer thy gift." For it will be of no use for you to declare that you are not angry, and to believe that you are fulfilling the command which says: "Let not the sun go down upon thy wrath;" and: "Whosoever is angry with his brother, shall be in danger of the judgment," if you are with obstinate heart disregarding the vexation of another which you could smooth down by kindness on your part. For in the same way you will be punished for violating the Lord's command. For He who said that you should not be angry with another, said also that you should not disregard the vexations of another, for it makes no difference in the sight of God, "Who willeth all men to be saved," whether you destroy yourself or someone else. Since the death of any one is equally a loss to God, and at the same time it is equally a gain to him to whom all destruction is delightful, whether it is acquired by your death or by the death of your brother.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 6"

[[commentary]]
quote='''
ON the other hand we know (and O! would that we did not know) some of the brethren who are so hard and obstinate, that when they know that their own feelings are aroused against their brother, or that their brother's are against them, in order to conceal their vexation of mind, which is caused by indignation at the grievance of one or the other, go apart from those whom they ought to smooth down by humbly making up to them and talking with them; and begin to sing some verses of the Psalms. And these while they fancy that they are softening the bitter thoughts which have arisen in their heart, increase by their insolent conduct what they could have got rid of at once if they had been willing to show more care and humility, for a well-timed expression of regret would cure their own feelings and soften their brother's heart. For by that plan they nourish and cherish the sin of meanness or rather of pride, instead of stamping out all inducement to quarrelling, and they forget the charge of the Lord which says: "Whosoever is angry with his brother, is in danger of the judgment;" and: "if thou remember that thy brother hath aught against thee, leave there thy gift before the altar, and go thy way, first be reconciled to thy brother, and then come and offer thy gift."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 15"
