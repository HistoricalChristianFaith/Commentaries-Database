[[commentary]]
quote='''
Beware lest at any time, when you have begun to dip into the knowledge of the Psalms and of this life, you be little by little puffed up and think of reviving that pride which now at your beginning you have trampled under foot in the ardour of faith and in fullest humility; and thus (as the ApOstle says) building again those things which you had destroyed, you make yourself a backslider.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25204.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 4, Chapter 36"
