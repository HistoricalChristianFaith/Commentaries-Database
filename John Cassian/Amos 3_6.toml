[[commentary]]
quote='''
Germanus: We often read in holy Scripture that God has created evil or brought it upon men, as is this passage: "There is none beside Me. I am the Lord, and there is none else: I form the light and create darkness, I make peace, and create evil." And again: "Shall there be evil in a city which the Lord hath not done?"

Theodore: Sometimes holy Scripture is wont by an improper use of terms to use "evils "for "affliction;" not that these are properly and in their nature evils, but because they are imagined to be evils by those on whom they are brought for their good. For when divine judgment is reasoning with men it must speak with the language and feelings of men. For when a doctor for the sake of health with good reason either cuts or cauterizes those who are suffering from the inflammation of ulcers, it is considered an evil by those who have to bear it. Nor are the spur and the whip pleasant to a restive horse. Moreover all chastisement seems at the moment to be a bitter thing to those who are chastised, as the Apostle says: "Now all chastisement for the present indeed seemeth not to bring with it joy but sorrow; but afterwards it will yield to them that are exercised by it most peaceable fruits of righteousness," and "whom the Lord loveth He chasteneth, and scourgeth every son whom He receiveth: for what son is there whom the father doth not correct?" And so evils are sometimes wont to stand for afflictions, as where we read: "And God repented of the evil which He had said that He would do to them and He did it not." And again: "For Thou, Lord, are gracious and merciful, patient and very merciful and ready to repent of the evil," i.e., of the sufferings and losses which Thou art forced to bring upon us as the reward of our sins. And another prophet, knowing that these are profitable to some men, and certainly not through any jealousy of their safety, but with an eye to their good, prays thus: "Add evils to them, O Lord, add evils to the haughty ones of the earth;" and the Lord Himself says "Lo, I will bring evils upon them," i.e., sorrows, and losses, with which they shall for the present be chastened for their soul's health, and so shall be at length driven to return and hasten back to Me whom in their prosperity they scorned. And so that these are originally evil we cannot possibly assert: for to many they conduce to their good and offer the occasions of eternal bliss, and therefore (to return to the question raised) all those things, which are thought to be brought upon us as evils by our enemies or by any other people, should not be counted as evils, but as things indifferent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F6.%2520Conference%2520of%2520Abbot%2520Theodore.html'
source_title="Conference of Abbot Theodore, Chapters 5-6"
