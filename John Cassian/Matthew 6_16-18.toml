[[commentary]]
quote='''
And to bring forward some instances from our unavoidable and almost daily wants which with all our care we can never so guard against as not to be driven to incur them whether with or against our will: what, I ask you, is to be done when, while we are proposing to put off our supper, a brother comes and asks us if we have had it: is our fast to be concealed, and the good act of abstinence hidden, or is it to be proclaimed by telling the truth? If we conceal it, to satisfy the Lord's command which says: "Thou shalt not appear unto men to fast but unto thy Father Who is in secret;" and again: "Let not thy left hand know what thy right hand doeth," we must at once tell a lie. If we make manifest the good act of abstinence, the word of the gospel rightly discourages us: "Verily I say unto you, they have their reward."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 21"
