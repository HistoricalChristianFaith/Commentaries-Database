[[commentary]]
quote='''
Of this perfect mind then there is an excellent figure drawn in the case of the centurion in the gospel; whose virtue and consistency, owing to which he was not led away by the rush of thoughts, but in accordance with his own judgment either admitted such as were good, or easily drove away those of the opposite character, are described in this tropical form: "For I also am a man under authority, having soldiers under me: and I say to this man, Go, and he goeth; and to another, Come, and he cometh; and to my servant, Do this, and he doeth it." If then we too strive manfully against disturbances and sins and can bring them under our own control and discretion, and fight and destroy the passions in our flesh, and bring under the sway of reason the swarm of our thoughts, and drive back from our breast the terrible hosts of the powers opposed to us by the life-giving standard of the Lord's cross, we shall in reward for such triumphs be promoted to the rank of that centurion spiritually understood, who, as we read in Exodus, was mystically pointed to by Moses: "Appoint for thee rulers of thousands, and of hundreds, and of fifties and of tens." And so we too when raised to the height of this dignity shall have the same right and power to command, so that we shall not be carried away by thoughts against our will, but shall be able to continue in and cling to those which spiritually delight us, commanding the evil suggestions to depart, and they will depart, while to good ones we shall say "Come," and they will come: and to our servant also, i.e., the body we shall in like manner enjoin what belongs to chastity and continence, and it will serve us without any gainsaying, no longer arousing in us the hostile incitements of concupiscence, but showing all subservience to the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 5"
