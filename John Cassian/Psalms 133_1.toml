[[commentary]]
quote='''
Wherefore this, as we said, is the sure and indissoluble union of friendship, where the tie consists only in likeness in goodness. For "the Lord maketh men to be of one mind in an house." And therefore love can only continue undisturbed in those in whom there is but one purpose and mind to will and to refuse the same things. And if you also wish to keep this unbroken, you must be careful that having first got rid of your faults, you mortify your own desires, and with united zeal and purpose diligently fulfil that in which the prophet specially delights: "Behold how good and joyful a thing it is for brethren to dwell together in unity." Which should be taken of unity of spirit rather than of place. For it is of no use for those who differ in character and purpose to be united in one dwelling, nor is it an hindrance for those who are grounded on equal goodness to be separated by distance of place. For with God the union of character, not of place, joins brethren together in a common dwelling, nor can unruffled peace ever be maintained where difference of will appears.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 3"
