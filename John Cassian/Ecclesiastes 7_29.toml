[[commentary]]
quote='''
We ought not then to ascribe this wandering inclination of our heart either to human nature or to God its Creator. For it is a true statement of Scripture, that "God made man upright; but they themselves found out many thoughts" The character of these then depends on us ourselves, for it says "a good thought comes near to those that know it, but a prudent man will find it." For where anything is subject to our prudence and industry so that it can be found out, there if it is not found out, we ought certainly to set it down to our own laziness or carelessness and not to the fault of our nature. And with this meaning the Psalmist also is in agreement, when he says: "Blessed is the man whose help is from Thee: in his heart he hath disposed his ascents." You see then that it lies in our power to dispose in our hearts either ascents, i.e., thoughts that belong to God, or descents; viz., those that sink down to carnal and earthly things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 4"

[[commentary]]
quote='''
For we should not hold that God made man such that he can never will or be capable of what is good: or else He has not granted him a free will, if He has suffered him only to will or be capable of evil, but neither to will or be capable of what is good of himself. And, in this case how will that first statement of the Lord made about men after the fall stand: "Behold, Adam is become as one of us, knowing good and evil?" For we cannot think that before, he was such as to be altogether ignorant of good. Otherwise we should have to admit that he was formed like some irrational and insensate beast: which is sufficiently absurd and altogether alien from the Catholic faith. Moreover as the wisest Solomon says: "God made man upright," i.e., always to enjoy the knowledge of good only, "But they have sought out many imaginations," for they came, as has been said, to know good and evil. Adam therefore after the fall conceived a knowledge of evil which he had not previously, but did not lose the knowledge of good which he had before. Finally the Apostle's words very clearly show that mankind did not lose after the fall of Adam the knowledge of good: as he says: "For when the Gentiles, which have not the law, do by nature the things of the law, these, though they have not the law, are a law to themselves, as they show the work of the law written in their hearts, their conscience bearing witness to these, and their thoughts within them either accusing or else excusing them, in the day in which God shall judge the secrets of men."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 12"
