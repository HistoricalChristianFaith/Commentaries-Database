[[commentary]]
quote='''
For not free will but the Lord "looseth them that are bound." No strength of ours, but the Lord "raiseth them that are fallen:" no diligence in reading, but "the Lord enlightens the blind:" where the Greeks have ku/rioj sofoi/ tuflou/j, i.e., "the Lord maketh wise the blind:" no care on our part, but "the Lord careth for the stranger:" no courage of ours, but "the Lord assists (or supports) all those who are down." But this we say, not to slight our zeal and efforts and diligence, as if they were applied unnecessarily and foolishly, but that we may know that we cannot strive without the help of God, nor can our efforts be of any use in securing the great reward of purity, unless it has been granted to us by the assistance and mercy of the Lord: for "a horse is prepared for the day of battle: but help cometh from the Lord," "for no man can prevail by strength."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 15"
