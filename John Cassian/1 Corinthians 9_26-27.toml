[[commentary]]
quote='''
Would You like to hear a true athlete of Christ striving according to the rules and laws of the conflict? "I," said he, "so run, not as uncertainly; I so fight, not as one that beateth the air: but I chastise my body and bring it into subjection, lest by any means when I have preached to others I myself should be a castaway." You see how he made the chief part of the struggle depend upon himself, that is upon his flesh, as if on a most sure foundation, and placed the result of the battle simply in the chastisement of the flesh and the subjection of his body. "I then so run not as uncertainly." He does not run uncertainly, because, looking to the heavenly Jerusalem, he has a mark set, towards which his heart is swiftly directed without swerving. He does not run uncertainly, because, "forgetting those things which are behind, he reaches forth to those that are before, pressing towards the mark for the prize of the high calling of God in Christ Jesus," whither he ever directs his mental gaze, and hastening towards it with all speed of heart, proclaims with confidence, "I have fought a good fight, I have finished my course, I have kept the faith." And because he knows he has run unweariedly "after the odour of the ointment" a of Christ with ready devotion of heart, and has won the battle of the spiritual combat by the chastisement of the flesh, he boldly concludes and says, "Henceforth there is laid up for me a crown of righteousness, which the Lord, the righteousjudge, will give to me in that day." And that e might open up to us also a like hope of reward, if we desire to imitate him in the struggle of his course, he added: "But not to me only, but to all also who love His coming;" declaring that we shall be sharers of his crown in the day of judgment, if we love the coming of Christ-not that one only which will be manifest to men even against their will; but also this one which daily comes to pass in holy souls-and if we gain the victory in the fight by chastising the body. And of this coming it is that the Lord speaks in the Gospel. "I," says He, "and my Father will come to him, and will make our abode with him." And again: "Behold, I stand at the door and knock: if any man hear my voice and open the gate, I will come in to him and will sup with him, and he with me."

But he does not mean that he has only finished the contest of a race when he says "I so run, not as uncertainly" (a phrase which has more particularly to do with the intention of the mind and fervour of his spirit, in which he followed Christ with all zeal, crying out with the Bride, "We will run after thee for the odour of thine ointments;" and again, "My soul cleaveth unto thee:" but he also testifies that he has conquered in another kind of contest, saying, "So fight I, not as one that beateth the air, but I chastise my body and bring it into subjection." And this properly has to do with the pains of abstinence, and bodily fasting and affliction of the flesh: as he means by this that he is a vigorous bruiser of his own flesh, and points out that not in vain has he planted his blows of Continence against it; but that he has gained a battle triumph by mortifying his own body; for when it is chastised with the blows of continence and struck down with the boxing-gloves of fasting, he has secured for his victorious spirit the crown of immortality and the prize of incorruption. You see the orthodox method of the contest, and consider the issue of spiritual combats: how the athlete of Christ having gained a victory over the rebellious flesh, having cast it as it were under his feet, is carried forward as triumphing on high. And therefore "he does not run uncertainly," because he trusts that he will forthwith enter the holy city, the heavenly Jerusalem. He "so fights," that is with fasts and humiliation of the flesh, "not as one that beateth the air," that is, striking into space with blows of continence, through which he struck not the empty air, but those spirits who inhabit it, by the chastisement of his body. For one who says "not as one that beateth the air," shows that he strikes-not empty and void air, but certain beings in the air. And because he had overcome in this kind of contest, and marched on enriched with the rewards of many crowns, not undeservedly does he begin to enter the lists against still more powerful foes, and having triumphed over his former rivals, he boldly makes proclamation and says, "Now our striving is not against flesh and blood, but against principalities, against powers, against world-rulers of this darkness, against spiritual wickedness in heavenly places."

The athlete of Christ, as long as he is in the body, is never in want of a victory to be gained in contests: but in proportion as he grows by triumphant successes, so does a severer kind of struggle confront him. For when the flesh is subdued and conquered, what swarms of foes, what hosts of enemies are incited by his triumphs and rise up against the victorious soldier of Christ! for fear lest in the ease of peace the soldier of Christ might relax his efforts and begin to forget the glorious struggles of his contests, and be rendered slack through the idleness which is caused by immunity from danger, and be cheated of the reward of his prizes and the recompense of his triumphs. And so if we want to rise with ever-growing virtue to these stages of triumph we ought also in the same way to enter the lists of battle and begin by saying with the Apostle: "I so fight, not as one that beateth the air, but I chastise my body and bring it into subjection," that when this conflict is ended we may once more be able to say with him: "we wrestle not against flesh and blood, but against principalities, against powers, against world-rulers of this darkness, against spiritual wickedness in heavenly places." For otherwise we cannot possibly join battle with them nor deserve to make trial of spiritual combats if we are baffled in a carnal contest, and smitten down in a struggle with the belly: and deservedly will it be said of us by the Apostle in the language of blame: "Temptation does not overtake you, except what is common to man."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25205.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 5, Chapters 17-19"
