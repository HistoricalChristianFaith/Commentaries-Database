[[commentary]]
quote='''
And so if even those who, faithfully offering tithes of their fruits, are obedient to the more ancient precepts of the Lord, cannot yet climb the heights of the gospel, you can see very clearly how far short of it those fall who do not even do this. For how can those men be partakers of the grace of the gospel who disregard the fulfilment even of the lighter commands of the law, to the easy character of which the weighty words of the giver of the law bear testimony, as a curse is actually invoked on those who do not fulfil them; for it says: "Cursed is everyone that does not continue in all things that are written in the book of the law to do them." But here on account of the superiority and excellence of the commandments it is said: "He that can receive it, let him receive it." There the forcible compulsion of the lawgiver shows the easy character of the precepts; for he says: "I call heaven and earth to record against you this day, that if ye do not keep the commandments of the Lord your God ye shall perish from off the face of the earth." Here the grandeur of sublime commands is shown by the very fact that He does not order, but exhorts, saying: "if thou wilt be perfect go" and do this or that. There Moses lays a burden that cannot be refused on those who are unwilling: here Paul meets with counsels those who are willing and eager for perfection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 5"
