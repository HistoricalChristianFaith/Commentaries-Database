[[commentary]]
quote='''
And so let us learn in everything, as we feel our own weakness, and at the same time His help, to declare with the saints, "I was overturned that I might fall, but the Lord supported me. The Lord is my strength and my praise: and He is become my salvation." And "Unless the Lord had helped me, my soul had almost dwelt in hell. If I said, My foot is moved: Thy mercy, O Lord, assisted me. According to the multitude of my sorrows in my heart, Thy comforts have given Joy to my souL" Seeing also that our heart is strengthened in the fear of the Lord, and in patience, let us say: "And the Lord became my protector; and He brought me forth into a large place." And knowing that knowledge is increased by progress in work, let us say: "For thou lightest my lamp, O Lord: O my God, enlighten my darkness, for by Thee I shall be delivered from temptation, and through my God I shall go over a wall." Then, feeling that we have ourselves sought for courage and endurance, and are being directed with greater ease and without labour in the path of the virtues, let us say, "It is God who girded me with strength, and made my way perfect; who made my feet like hart's feet, and setteth me up on high: who teacheth my hands to war." And having also secured discretion, strengthened with which we can dash down our enemies, let us cry aloud to God: "Thy discipline hath set me up unto the end, and Thy discipline the same shall teach me. Thou hast enlarged my steps under me, and my feet are not weakened." And because I am thus strengthened with Thy knowledge and power, I will boldly take up the words which follow, and will say, "I will pursue after my enemies and overtake them: and I will not turn again till they are consumed. I will break them, and they shall not be able to stand: they shall fall under my feet." Again, mindful of our own infirmity, and of the fact that while still burdened with the weak flesh we cannot without His assistance overcome such bitter foes as our sins are, let us say, "Through Thee we will scatter our enemies: and through Thy name we will despise them that rise up against us. For I will not trust in my bow: neither shall my sword save me. For Thou hast saved us from them that afflict us: and hast put them to shame that hate us." But further: "Thou hast guided me with strength unto the battle, and hast subdued under me them that rose up against me. And Thou hast made mine enemies turn their backs upon me, and hast destroyed them that hated me." And reflecting that with our own arms alone we cannot conquer, let us say, "Take hold of arms and shield: and rise up to help me. Bring out the sword and stop the way against them that persecute me: say to my soul, I am thy salvation." And Thou hast made my arms like a brazen bow. And Thou hast given me the protection of Thy salvation: and Thy right hand hath held me up." "For our fathers got not the possession of the land through their own sword; neither did their own arm save them: but Thy right hand and Thine arm and the light of Thy countenance because Thou wast pleased with them." Lastly, as with anxious mind we regard all His benefits with thankfulness, let us cry to Him with the inmost feelings of our heart, for all these things, because we have fought, and have obtained from Him the light of knowledge, and self-control and discretion, and because He has furnished us with His own arms, and strengthened us with a girdle of virtue, and because He has made our enemies turn their backs upon us, and has given us the power of scattering them like the dust before the wind: "I will love Thee, O Lord my Strength; the Lord is my stronghold, my refuge and my deliverer. My God is my helper, and in Him will I put my trust. My protector and the horn of my salvation, and my support. Praising I will call upon the name of the Lord; and I shall be saved from mine enemies."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 17"
