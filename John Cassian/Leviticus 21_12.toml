[[commentary]]
quote='''
And so your soul will be carried forward not only to the ark of the Divine Covenant, but also to the priestly kingdom, and owing to its unbroken love of purity being as it were engrossed in spiritual studies, will fulfil the command given to the priests, enjoined as follows by the giver of the Law: "And he shall not go forth from the sanctuary, lest he pollute the Sanctuary of God," i.e., his heart, in which the Lord promised that he would ever dwell, saying: "I will dwell in them and will walk among them."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 10"
