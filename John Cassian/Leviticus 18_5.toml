[[commentary]]
quote='''
Wherefore we ought to know that we from whom the requirements of the law are no longer exacted, but in whose ears the word of the gospel daily sounds: "If thou wilt be perfect, go and sell all that thou hast and give to the poor, and thou shalt have treasure in heaven, and come follow Me," when we offer to God tithes of our substance, are still in a way ground down beneath the burden of the law, and not able to rise to those heights of the gospel, those who conform to which are recompensed not only by blessings in this present life, but also by future rewards. For the law promises to those who obey it no rewards of the kingdom of heaven, but only solaces in this life, saying: "The man that doeth these things shall live in them." But the Lord says to His disciples: "Blessed are the poor in spirit, for theirs is the kingdom of heaven;" and: "Everyone that leaveth house or brothers or sisters or father or mother or wife or children or field for My name's sake, shall receive an hundredfold, and shall inherit eternal life." And this with good reason. For it is not so praiseworthy for us to abstain from forbidden as from lawful things, and not to use these last out of reverence for Him, Who has permitted us to use them because of our weakness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 5"
