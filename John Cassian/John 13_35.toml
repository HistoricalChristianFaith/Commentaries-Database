[[commentary]]
quote='''
Or in what way will he admit anything which grieves the brother, who thinks that nothing is more precious than the blessing of peace, and never forgets these words of the Lord: "By this shall all men know that ye are My disciples, that ye love one another;" for by this, as by a special mark, Christ willed that the flock of His sheep should be known in this world, and be separated from all others by this stamp, so to speak?
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 6"
