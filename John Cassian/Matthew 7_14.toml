[[commentary]]
quote='''
Wherefore, as Scripture says, "when you go forth to serve the Lord stand in the fear of the Lord, and prepare your mind" not for repose or carelessness or delights, but for temptations and troubles. For "through much tribulation we must enter into the kingdom of God." For "strait is the gate and narrow isthe way which leadeth unto life, and few there be which find it." Consider therefore that you belong to the few and elect; and do not grow cold after the examples of the lukewarmness of many: but live as the few, that with the few you may be worthy of a place in the kingdom of God: for "many are called, but few chosen, and it is a "little flock to which it is the Father's good pleasure to give" an inheritance. You should therefore realize that it is no light sin for one who has made profession of perfection to follow after what is imperfect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25204.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 4, Chapter 38"
