[[commentary]]
quote='''
And none the less does God's grace continue to be free grace while in return for some small and trivial efforts it bestows with priceless bounty such glory of immortality, and such gifts of eternal bliss. For because the faith of the thief on the cross came as the first thing, no one would say that therefore the blessed abode of Paradise was not promised to him as a free gift, nor could we hold that it was the penitence of King David's single word which he uttered: "I have sinned against the Lord," and not rather the mercy of God which removed those two grievous sins of his, so that it was vouchsafed to him to hear from the prophet Nathan: "The Lord also hath put away thine iniquity: thou shalt not die." The fact then that he added murder to adultery, was certainly due to free will: but that he was reproved by the prophet, this was the grace of Divine Compassion. Again it was his own doing that he was humbled and acknowledged his guilt; but that in a very short interval of time he was granted pardon for such sins, this was the gift of the merciful Lord. And what shall we say of this brief confession and of the incomparable infinity of Divine reward, when it is easy to see what the blessed Apostle, as he fixes his gaze on the greatness of future remuneration, announced on those countless persecutions of his? "for," says he, "our light affliction which is but for a moment worketh in us a far more exceeding and eternal weight of glory," of which elsewhere he constantly affirms, saying that "the sufferings of this present time are not worthy to be compared with the future glory which shall be revealed in us." However much then human weakness may strive, it cannot come up to the future reward, nor by its efforts so take off from Divine grace that it should not always remain a free gift.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 13"
