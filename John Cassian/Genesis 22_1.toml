[[commentary]]
quote='''
And this searching trial of faith we read that the Divine righteousness brought about also in the case of the grandest of the patriarchs; where it is said: "And it came to pass after these things that God did tempt Abraham." For the Divine righteousness wished to try not that faith with which the Lord had inspired him, but that which when called and enlightened by the Lord he could show forth by his own free will. Wherefore the firmness of his faith was not without reason proved, and when the grace of God, which had for a while left him to prove him, came to his aid, it was said: "Lay not thine hand on the lad, and do nothing unto him: for now I know that thou fearest the Lord, and for my sake hast not spared thy beloved son."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 14"
