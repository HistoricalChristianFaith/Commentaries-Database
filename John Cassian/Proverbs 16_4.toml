[[commentary]]
quote='''
And these three things although they all seem to aim at one and the same end (for they incite us to abstain from things unlawful) yet they differ from each other greatly in the degrees of their excellence. For the two former belong properly to those men who in their aim at goodness have not yet acquired the love of virtue, and the third belongs specially to God and to those who have received into themselves the image and likeness of God. For He alone does the things that are good, with no fear and no thanks or reward to stir Him up, but simply from the love of goodness. For, as Solomon says, "The Lord hath made all things for Himself." For under cover of His own goodness He bestows all the fulness of good things on the worthy and the unworthy because He cannot be wearied by wrongs, nor be moved by passions at the sins of men, as He ever remains perfect goodness and unchangeable in His nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 6"
