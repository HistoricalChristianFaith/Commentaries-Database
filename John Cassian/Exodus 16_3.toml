[[commentary]]
quote='''
Serapion: Everybody is perfectly agreed that there are eight principal faults which affect a monk. And all of them are not included in the figure of the nations for this reason, because in Deuteronomy Moses, or rather the Lord through him, was speaking to those who had already gone forth from Egypt and been set free from one most powerful nation, I mean that of the Egyptians. And we find that this figure holds good also in our case, as when we have got clear of the snares of this world we are found to be free from gluttony, i.e., the sin of the belly and palate; and like them we have a conflict against these seven remaining nations, without taking account at all of the one which has been already overcome. And the land of this nation was not given to Israel for a possession, but the command of the Lord ordained that they should at once forsake it and go forth from it. And for this cause our fasts ought to be made moderate, that there may be no need for us through excessive abstinence, which results from weakness of the flesh and infirmity, to return again to the land of Egypt, i.e., to our former greed and carnal lust which we forsook when we made our renunciation of this world. And this has happened in a figure, in those who after having gone forth into the desert of virtue again hanker after the flesh pots over which they sat in Egypt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 18"

[[commentary]]
quote='''
Wherefore, if we are anxious to attain true perfection, we ought to look to it that as we have outwardly with the body made light of parents, home, the riches and pleasures of the world, we may also inwardly with the heart forsake all these things and never be drawn back by any desires to those things which we have forsaken, as those who were led up by Moses, though they did not literally go back, are yet said to have returned in heart to Egypt; viz., by forsaking God who had led them forth with such mighty signs, and by worshipping the idols of Egypt of which they had thought scorn, as Scripture says: "And in their hearts they turned back into Egypt, saying to Aaron: Make us gods to go before us," for we should fall into like condemnation with those who, while dwelling in the wilderness, after they had tasted manna from heaven, lusted after the filthy food of sins, and of mean baseness, and should seem together with them to murmur in the same way: "It was well with us in Egypt, when we sat over the flesh pots and ate the onions, and garlic, and cucumbers, and melons:" A form of speech, which, although it referred primarily to that people, we yet see fulfilled today in our own case and mode of life: for everyone who after renouncing this world turns back to his old desires, and reverts to his former likings asserts in heart and act the very same thing that they did, and says "It was well with me in Egypt," and I am afraid that the number of these will be as large as that of the multitudes of backsliders of whom we read under Moses, for though they were reckoned as six hundred and three thousand armed men who came out of Egypt, of this number not more than two entered the land of promise. Wherefore we should be careful to take examples of goodness from those who are few and far between, because according to that figure of which we have spoken in the gospel "Many are called but few" are said to be "chosen."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 7"
