[[commentary]]
quote='''
And we see clear instance of this in the case of that prophet and man of God in the third book of Kings, who was straightway destroyed by a lion for a single fault of disobedience, in which he was implicated not of set purpose nor by the fault of his own will but by the enticement of another, as the Scripture speaks thus of him: "It is the man of God, who was disobedient to the mouth of the Lord, and the Lord delivered him to the lion, and it tare him according to the word of the Lord, which He spake." In which case the punishment of the present offence and carelessness together with the reward of his righteousness, for which the Lord gave over his prophet in this world to the destroyer, are shown by the moderation and abstinence of the beast of prey, as that most savage creature did not dare even to taste the carcass that was given over to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 26"
