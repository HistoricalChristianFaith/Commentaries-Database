[[commentary]]
quote='''
WE ought then carefully to notice this threefold order, and with a wise discretion to analyse the thoughts which arise in our hearts, tracking out their origin and cause and author in the first instance, that we may be able to consider how we ought to yield ourselves to them in accordance with the of those who suggest them so that we may, desert as the Lord's command bids us, become good money-changers, whose highest skill and whose training is to test what is perfectly pure gold and what is commonly termed tested, or what is not sufficiently purified in the fire; and also with unerring skill not to be taken in by a common brass denarius, if by being coloured with bright gold it is made like some coin of great value; and not only shrewdly to recognize coins stamped with the heads of usurpers, but with a still shrewder skill to detect those which have the image of the right king, but are not properly made, and lastly to be careful by the test of the balance to see that they are not under proper weight. All of which things the gospel saying, which uses this figure, shows us that we ought also to observe spiritually; first that whatever has found an entrance into our hearts, and whatever doctrine has been received by us, should be most carefully examined to see whether it has been purified by the divine and heavenly fire of the Holy Ghost, or whether it belongs to Jewish superstition, or whether it comes from the pride of a worldly philosophy and only externally makes a show of religion. And this we can do, if we carry out the Apostle's advice, "Believe not every spirit, but prove the spirits whether they are of God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F1.%2520First%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="First Conference of Abbot Moses, Chapter 20"
