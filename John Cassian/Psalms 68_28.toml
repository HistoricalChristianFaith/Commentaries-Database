[[commentary]]
quote='''
And David too, as he knows this, similarly prays that the same thing may be granted to him by God's mercy. "Strengthen, O God, that which Thou hast wrought in us:" showing that it is not enough for the beginning of our salvation to be granted by the gift and grace of God, unless it has been continued and ended by the same pity and continual help from Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 15"
