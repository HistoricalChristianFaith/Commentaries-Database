[[commentary]]
quote='''
And to such an extent is account taken, not so much of the actual thing which is done as of the disposition of the doer, that on the other hand truth is sometimes found to have injured some, and a lie to have done them good. For when Saul was grumbling to his servants about David's flight, and saying: "Will the son of Jesse give you all fields and vineyards, and make you all tribunes and centurions: that all of you have conspired against me, and there is no one to inform me," did Doeg the Edomite say anything but the truth, when he told him: "I saw the son of Jesse in Nob, with Abimelech the son of Ahitub the priest, who consulted the Lord for him, and gave him victuals, and gave him also the sword of Goliath the Philistine?" For which true story he deserved to be rooted up out of the land of the living, and it is said of him by the prophet: "Wherefore God shall destroy thee forever, and pluck thee up and tear thee out of thy tabernacle, and thy root from the land of the living:" He then for showing the truth is forever plucked and rooted up out of that land in which the harlot Rahab with her family is planted for her lie: just as also we remember that Samson most injuriously betrayed to his wicked wife the truth which he had hidden for a long time by a lie, and therefore the truth so inconside-rately disclosed was the cause of his own deception, because he had neglected to keep the command of the prophet: "Keep the doors of thy mouth from her that sleepeth in thy bosom."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 20"
