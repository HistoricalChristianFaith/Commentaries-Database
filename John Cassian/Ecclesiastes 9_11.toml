[[commentary]]
quote='''
And from this it is clearly gathered by those who, led not by chattering words but by experience, measure the magnitude of grace, and the paltry limits of man's will, that "the race is not to the swift nor the battle to the strong, nor food to the wise, nor riches to the prudent, nor grace to the learned," but that "all these worketh that one and the selfsame Spirit, dividing to every man severally as He will." And therefore it is proved by no doubtful faith but by experience which can (so to speak) be laid hold of, that God the Father of all things worketh indifferently all things in all, as the Apostle says, like some most kind father and most benign physician; and that now He puts into us the very beginnings of salvation, and gives to each the zeal of his free will; and now grants the carrying out of the work, and the perfecting of goodness; and now saves men, even against their will and without their knowledge, from ruin that is close at hand, and a headlong fall; and now affords them occasions and opportunities of salvation, and wards off headlong and violent attacks from purposes that would bring death; and assists some who are already willing and running, while He draws others who are unwilling and resisting, and forces them to a good will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 18"
