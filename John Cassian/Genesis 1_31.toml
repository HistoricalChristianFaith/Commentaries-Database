[[commentary]]
quote='''
God forbid that we should admit that God has created anything which is substantially evil, as Scripture says "everything that God had made was very good." For if they were created by God such as they are now, or made for this purpose; viz., to occupy these positions of malice, and ever to be ready for the deception and ruin of men, we should in opposition to the view of the above quoted Scripture slander God as the Creator and author of evil, as having Himself formed utterly evil wills and natures, creating them for this very purpose; viz., that they might ever persist in their wickedness and never pass over to the feeling of a good will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 6"

[[commentary]]
quote='''
But as, for example, the metal of alloy which is considered of some use and worth, becomes worthless when silver is taken into account, and again the value of silver disappears in comparison with gold, and gold itself is disregarded when compared with precious stones, and yet a quantity of precious stones however splendid are outdone by the brightness of a single pearl, so all those merits of holiness, although they are not merely good and useful for the present life, but also secure the gift of eternity, yet if they are compared with the merit of Divine contemplation, will be considered trifling and so to speak,fit to be sold. And to support this illustration by the authority of Scripture, does not Scripture declare of all things in general which were created by God, and say: "And behold everything that God had made was very good;" and again: "And things that God hath made are all good in their season"? These things then which in the present time are termed not simply and solely good, but emphatically "very good" (for they are really convenient for us while living in this world,either for purposes of life, or for remedies for the body, or by reason of some unknown usefulness, or else they are indeed "very good," because they enable us "to see the invisible things of God from the creatures of the world, being understood by the things that are made, even His eternal power and Godhead," from this great and orderly arrangement of the fabric of the world; and to contemplate themfrom the existence of everything in it), yet none of these things will keep the name of good if they are regarded in the light of that world to come, where no variation of good things, and no loss of true blessedness need be feared. The bliss of which world is thus described: "The light of the moon shall be as the light of the sun, and the light of the sun shall be sevenfold as the light of seven days." These things then which are great and wondrous to be gazed on, and marvellous, will at once appear as vanity if they are compared with the future promises from faith; as David says: "They all shall wax old as a garment, and as a vesture shall Thou change them, and they shall be changed. But Thouart the same, and Thy years shall not fail." Because then there is nothing of itself enduring, nothing unchangeable, nothing good but Deity alone, while every creature, to obtain the blessing of eternity and immutability, aimsat this not by its own nature but by participation of its Creator, and His grace, they cannotmaintain their character for goodness when compared with their Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F23.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The Third Conference of Abbot Theonas, Chapter 3"
