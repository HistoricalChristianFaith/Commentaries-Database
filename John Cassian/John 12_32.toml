[[commentary]]
quote='''
But concerning the evening sacrifices what is to be said,since even in the Old Testament these areordered to be offered continually by the law of Moses? For that the morning whole-burnt offerings and evening sacrifices were offered every day continually in the temple, although with figurative offerings, we can show from that which is sung by David: "Let my prayer be set forth in Thy sight as the incense, and let the lifting up of my hands be an evening sacrifice," in which place we can understand it in a still higher sense of that true evening sacrifice which was given by the Lord our Saviour in the evening to the Apostles at the Supper, when He instituted the holy mysteries of the Church, and of that evening sacrifice which He Himself, on the following day, in the end of the ages, offered up to the Father by the lifting up of His hands for the salvation of the whole world; which spreading forth of His hands on the Cross is quite correctly called a "lifting up." For when we were all lying in hades He raised us to heaven, according to the word of His own promise when He says: "When I am lifted up from the earth, I will draw all men unto Me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25203.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 3, Chapter 3"
