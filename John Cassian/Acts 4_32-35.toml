[[commentary]]
quote='''
And so the system of coenobites took its rise in the days of the preaching of the Apostles. For such was all that multitude of believers in Jerusalem, which is thus described in the Acts of the Apostles: "But the multitude of believers was of one heart and one soul, neither said any of them that any of the things which he possessed was his own, but they had all things common. They sold their possessions and property and divided them to all, as any man had need." And again: "For neither was there any among them that lacked; for as many as possessed fields or houses, sold them and brought the price of the things that they sold and laid them before the feet of the Apostles: and distribution was made to every man as he had need." The whole Church, I say, was then such as now are those few who can be found with difficulty in coenobia. But when at the death of the Apostles the multitude of believers began to wax cold, and especially that multitude which had come to the faith of Christ from diverse foreign nations, from whom the Apostles out of consideration for the infancy of their faith and their ingrained heathen habits, required nothing more than that they should" abstain from things sacrificed to idols and from fornication, and from things strangled, and fromblood," and so that liberty which was conceded to the Gentiles because of the weakness of their newly-born faith, had by degreesbegun to mar the perfection of that Churchwhich existed at Jerusalem, and the fervourof that early faith cooled down owing to thedaily increasing number both of natives andforeigners, and not only those who had accepted the faith of Christ, but even those whowere the leaders of the Church relaxed somewhat of that strictness. For some fancyingthat what they saw permitted to the Gentiles because of their weakness, was alsoallowable for themselves, thought that theywould suffer no loss if they followed the faithand confession of Christ keeping their property and possessions. But those who stillmaintained the fervour of the apostles, mindful of that former perfection left their citiesand intercourse with those who thought thatcarelessness and a laxer life was permissibleto themselves and the Church of God, andbegan to live in rural and more sequesteredspots, and there, in private and on their ownaccount, to practise those things which theyhad learnt to have been ordered by the apostles throughout the whole body of the Churchin general: and so that whole system of whichwe have spoken grew up from those disciples who had separated themselves fromthe evil that was spreading. And these, as bydegrees time went on, were separated fromthe great mass of believers and because theyabstained from marriage and cut themselvesoff from intercourse with their kinsmen andthe life of this world, were termed monks orsolitaries from the strictness of their lonelyand solitary life. Whence it followed thatfrom their common life they were calledcoenobites and their cells and lodgings coenobia. That then alone was the earliest kindof monks, which is first not only in time butalso in grace, and which continued unbrokenfor a very long period up to the time of AbbotPaul and Antony; and even to this day wesee its traces remaining in strict coenobia
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 5"
