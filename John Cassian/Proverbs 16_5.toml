[[commentary]]
quote='''
For he who is puffed up with pride and has permitted himself to be worshipped as God, is (as the Apostle says) "given over to shameful passions and a reprobate mind to do those things which are not convenient." And because, as Scripture says, "every on, who exalts his heart is unclean before God," he who is puffed up with swelling pride of heart is given over to most shameful confusion to be deluded by it, that when thus humbled he may know that he is unclean through impurity of the flesh and knowledge of impure desires,-a thing which he had refused to recognize in the pride of his heart; and also that the shameful infection of the flesh may disclose the hidden impurity of the heart, which he contracted through the sin of pride, and that through the patent pollution of his body he may be proved to be impure, who did not formerly see that he had become unclean through the pride of his spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 21"
