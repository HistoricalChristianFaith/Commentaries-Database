[[commentary]]
quote='''
But let not any suppliant doubt that he certainly will not be heard, so long as he doubts whether he is heard. But that this also shall be sought from the Lord unweariedly, we are taught by the example of the blessed Daniel, as, though he was heard from the first day on which he began to pray, he only obtained the result of his petition after one and twenty days. Wherefore we also ought not to grow slack in the earnestness of the prayers we have begun, if we fancy that the answer comes but slowly, for fear lest perhaps the gift of the answer be in God's providence delayed, or the angel, who was to bring the Divine blessing to us, may when he comes forth from the Presence of the Almighty be hindered by the resistance of the devil, as it is certain that he cannot transmit and bring to us the desired boon, if he finds that we slack off from the earnestness of the petition made. And this would certainly have happened to the above mentioned prophet unless he had with incomparable steadfastness prolonged and persevered in his prayers until the twenty-first day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 34"
