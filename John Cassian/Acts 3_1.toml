[[commentary]]
quote='''
In another passage, too, in the Acts of the Apostles, we are told as follows about the same time: "But Peter and John went up into the temple at the hour of prayer, the ninth hour." And by these notices it is clearly proved that these hours were not without good reason consecrated with religious services by holy and apostolic men, and ought to be observed in like manner by us, who, unless we are compelled, as it were, by some rule to discharge these pious offices at least at stated times,either through sloth or through forgetfulness,or being absorbed in business, spend the wholeday without engaging in prayer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25203.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 3, Chapter 3"
