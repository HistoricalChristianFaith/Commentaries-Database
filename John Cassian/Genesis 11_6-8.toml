[[commentary]]
quote='''
And thus the result will be that when, in consequence of the lukewarmness arising from this sluggish will of which we have spoken, the mind has been more easily entangled in carnal desires, it is checked by the desire of the spirit, which by no means acquiesces in earthly sins; and again, if through over much feeling our spirit has been carried in unbounded fervour and towards ill-considered and impossible heights, it is recalled by the weakness of the flesh to sounder considerations and rising above the lukewarm condition of our free will with due proportion and even course proceeds along the way of perfection. Something of this sort we hear that the Lord ordained in the case of the building of that tower in the book of Genesis, where a confusion of tongues suddenly sprang up, and put a stop to the blasphemous and wicked attempts of men. For there would have remained there in opposition to God, aye and against the interest of those whohad begun to assail His Divine Majesty, an agreement boding no good, unless by God's providence the difference of languages, raising disturbances among them, had forced them because of the variations of their words to go on to a better condition, and a happy and valuable discord had recalled to salvation those whom a ruinous union had driven to destruction, as when divisions arose they began to experience human weakness of which when puffed up by their wicked plots they had hitherto known nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F4.%2520Conference%2520of%2520Abbot%2520Daniel.html'
source_title="Conference of Abbot Daniel, Chapter 12"
