[[commentary]]
quote='''
Take care then that you do not rush into teaching before doing, and so be reckoned among the number of those of whom the Lord speaks inthe gospel to the disciples: "What they sayunto you, that observe and do, but not aftertheir words: for they say and do not. But they bind heavy burdens and grievous to beborne, and lay them on men's shoulders; butthey themselves will not move them with oneof their fingers." For if he who shall "breakone of these commands, and shall teach menso, shall be called least in the kingdom of heaven," it follows that one who has dared to despise many and greater commands and to teach men so, shall certainly be considered not least in the kingdom of heaven, but greatest in the punishment of hell.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 9"
