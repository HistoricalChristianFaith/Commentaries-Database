[[commentary]]
quote='''
For a careless promise is changed in such a way that it may be pardoned or indeed praised, if it is turned into a better path, nor need we take it as a failure in consistency, but as a correction of rashness, whenever a promise that was faulty is corrected. And all this may be proved by most certain witness from Scripture, that for many the fulfilment of their promise has led to death, and on the other hand that for many it has been good and profitable to have refused it.

And both these points are very clearly shown by the cases of S. Peter the Apostle and Herod. For the former, because he departed from his expressed determination which he had as it were confirmed with an oathsaying "Thou shalt never wash my feet," gained an immortal partnership with Christ, whereas he would certainly have been cut off from the grace of this blessedness, if he had clung obstinately to his word. But the latter, by clinging to the pledge of his ill-considered oath, became the bloody murderer of the Lord's forerunner, and through the vain fear of perjury plunged himself into condemnation and the punishment of everlasting death. In everything then we must consider the end, and must according to it direct our course and aim, and if when some wiser counsel supervenes, we see it diverging to the worse part, it is better to discard the unsuitable arrangement, and to come to a better mind rather than to cling obstinately to our engagements and so become involved in worse sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapters 8-9"
