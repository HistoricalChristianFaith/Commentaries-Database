[[commentary]]
quote='''
Or whether he tries to cheat us with counterfeits, for instance by urging that some work of piety should be taken up which as it does come from the true minds of the fathers, leads under the form of virtue to vice; and, deceiving us either by immoderate or impossible fasts, or by too long vigils, or inordinate prayers, or unsuitable reading, brings us to a bad end. Or, when he persuades us to give ourselves up to mixing in the affairs of others, and to pious visits, by which he may drive us away from the spiritual cloisters of the monastery, and the secrecy of its friendly peacefulness, and suggests that we take on our shoulders the anxieties and cares of religious women who are in want, that when a monk is inextricably entangled in snares of this sort he may distract him with most injurious occupations and cares. Or else when he incites a man to desire the holy office of the clergy under the pretext of edifying many people, and the love of spiritual gain, by which to draw us away from the humility and strictness of our life. All of which things, although they are opposed to our salvation and to our profession, yet when covered with a sort of veil of compassion and religion, easily deceive those who are lacking in skill and care. For they imitate the coins of the true king, because they seem at first full of piety, but are not stamped by those who have the right to coin, i.e., the approved Catholic fathers, nor do they proceed from the head public office for receiving them, but are made by stealth and by the fraud of the devil, and palmed off upon the unskilful and ignorant not without serious harm. And even although they seem to be useful and needful at first, yet if afterwards they begin to interfere with the soundness of our profession, and as it were to weaken in some sense the whole body of our purpose, it is well that they should be cut off and cast away from us like a member which may be necessary, but yet offends us and which seems to perform the office of the right hand or foot. For it is better, without one member of a command, i.e., its working or result, to continue safe and sound in other parts, and to enter as weak into the kingdom of heaven rather than with the whole mass of commands to fall into some error which by an evil custom separates us from our strict rule and the system purposed and entered upon, and leads to such loss, that it will never outweigh the harm that will follow, but will cause all our past fruits and the whole body of our work to be burnt in hell fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F1.%2520First%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="First Conference of Abbot Moses, Chapter 20"
