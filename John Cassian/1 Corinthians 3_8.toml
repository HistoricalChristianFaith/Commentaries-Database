[[commentary]]
quote='''
We should also at any rate place our cells on the banks of the river Nile and have water at our very doors, so as not to be obliged to carry it on our necks for four miles, were it not that the blessed Apostle rendered us indefatigable in enduring this labour, and cheered us by his words, saying: "Every one shall receive his own reward according to his labour."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 2"
