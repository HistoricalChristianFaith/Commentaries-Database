[[commentary]]
quote='''
IF then any one is aiming at perfection, from that first Stage of fear which we rightly termed servile (of which it is said: "When ye have done all things say: we are unprofitable servants," ) he should by advancing a step mount to the higher path of hope-which is compared not to a slave but to a hireling, because it looks for the payment of its recompense, and as if it were free from care concerning absolution of its sins and fear of punishment, and conscious of its own good works, though it seems to look for the promised reward, yet it cannot attain to that love of a son who, trusting in his father's kindness and liberality, has no doubt that all that the father has is his, to which also that prodigal who together with his father's substance had lost the very name of son, did not venture to aspire, when he said: "I am no more worthy to be called thy son;" for after those husks which the swine ate, satisfaction from which was denied to him, i.e., the disgusting food of sin, as he "came to himself," and was overcome by a salutary fear, he already began to loathe the uncleanness of the swine, and to dread the punishment of gnawing hunger, and as if he had already been made a servant, desires the condition of a hireling and thinks about the remuneration, and says: "How many hired servants of my father have abundance of bread, and I perish here with hunger. I will then return to my father and will say unto him, `Father I have sinned against heaven and before thee, and am no more worthy to be called thy son: make me as one of thy hired servants.'" But those words of humble penitence his father who ran to meet him received with greater affection than that with which they were spoken, and was not content to allow him lesser things, but passing through the two stages without delay restored him to his former dignity of sonship. We also ought forthwith to hasten on that by means of the indissoluble grace of love we may mount to that third stage of sonship, which believes that all that the father has is its own, and so we may be counted worthy to receive the image and likeness of our heavenly Father, and be able to say after the likeness of the true son: "All that the Father hath is mine."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 7"
