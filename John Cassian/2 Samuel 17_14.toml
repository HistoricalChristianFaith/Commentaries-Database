[[commentary]]
quote='''
For what shall we say of that pious fraud of Hushai to Absalom for the salvation of king David, which though uttered with all appearance of good-will by the deceiver and cheat, and opposed to the good of him who asked advice, is yet commended by the authority of Holy Scripture, which says: "But by the will of the Lord the profitable counsel of Ahithophel was defeated that the Lord might bring evil upon Absalom?" Nor could that be blamed which was done for the right side with a right purpose and pious intent, and was planned for the salvation and victory of one whose piety was pleasing to God, by a holy dissimulation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 19"
