[[commentary]]
quote='''
But that description of the forgetfulness spoken of only has to do with capital offences, which are also condemned by the mosaic law, the inclination to which is destroyed and put an end to by a good life, and so also the penance for them has an end. But for those small offences in which, as it is written, "therighteous falls seven times and will rise again" penitence will never cease. For either through ignorance, or forgetfulness, orthought, or word, or surprise, or necessity, orweakness of the flesh, or defilement in adream, we often fall every day either againstour will or voluntarily; offences for whichDavid also prays the Lord, and asks for purification and pardon, and says: "Who canunderstand sins? from my secret ones cleanseme; and from those of others spare Thy servant;" and the Apostle: "For the goodwhich I would I do not, and the evil which Iwould not, that I do." For which also the same man exclaims with a sigh "O wretchedman that I am! who shall deliver me fromthe body of this death?" For we slip intothese so easily as it were by a law of nature,that however carefully and guardedly we areon the lookout against them, we cannot altogether avoid them. Since it was of these thatone of the disciples, whom Jesus loved, declared and laid down absolutely saying: "Ifwe say that we have no sin we deceive ourselves, and His word is not in us."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F20.%2520Conference%2520of%2520Abbot%2520Pinufius.html'
source_title="Conference of Abbot Pinufius, Chapter 12"

[[commentary]]
quote='''
IT remains therefore for us to measure its meaning and drift from the inmost feelings of the speaker, and to discuss what the blessed Apostle called good, and what he pronounced by comparison evil, not by the bare meaning of the words, but with the same insight which he showed, and to investigate his meaning with due regard to the worth and goodness of the speaker. For then we shall be able to understand the words, which were uttered by God's inspiration, in accordance with his purpose and wish, when we weigh the position and character of those by whom they were spoken, and are ourselves clothed with the same feelings (not in words but by experience), in accordance with the character of which most certainly all the thoughts are conceived and opinions uttered. Wherefore let us carefully consider what was in the main that good which the Apostle could not do when he would. For we know that there are many good things which we cannot deny that the blessed Apostle and all men as good as he either have by nature, or acquire by grace. For chastity is good, continence is praiseworthy, prudence is to be admired, kindness is liberal, sobriety is careful, temperance is modest, pity is kind, justice is holy: all of which we cannot doubt existed fully and in perfection in the Apostle Paul and his companions, so that they taught religion by the lesson of their virtues rather than their words. What if they were always consumed with the constant care of all the churches and watchful anxiety? How great a good is this pity, what perfection it is to burn for them that are offended, to be weak with the weak! If then the Apostle abounded with such good things, we cannot recognize what that good was, inthe perfection of which the Apostle was lacking, unless we have advanced to that state of mind in which he was speaking. And so all those virtues which we say that he possessed, though they are like most splendid and precious gems, yet when they are compared with that most beautiful and unique pearl which the merchant in the gospel sought and wanted to acquire by selling all that he possessed, so does their value seem poor and trifling, so that if they are without hesitation got rid of, the possession of one good thing alone will enrich the man who sells countless good things.

What then is that one thing which is so incomparably above those great and innumerable good things, that, while they are all scorned and rejected, it alone should be acquired? Doubtless it is that truly good part, the grand and lasting character of which is thus described by the Lord, when Mary disregarded the duties of hospitality and courtesy and chose it: "Martha, Martha, thou art careful and troubled about many things: but there is but need of but few things or even of one only. Mary hath chosen the good part which shall not be taken away from her." Contemplation then, i.e., meditation on God, is the one thing, the value of which all the merits of our righteous acts, all our aims at virtue, come short of. And all those things which we said existed in the Apostle Paul, were not only good and useful, but even great and splendid. But as, for example, the metal of alloy which is considered of some use and worth, becomes worthless when silver is taken into account, and again the value of silver disappears in comparison with gold, and gold itself is disregarded when compared with precious stones, and yet a quantity of precious stones however splendid are outdone by the brightness of a single pearl, so all those merits of holiness, although they are not merely good and useful for the present life, but also secure the gift of eternity, yet if they are compared with the merit of Divine contemplation, will be considered trifling and so to speak,fit to be sold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F23.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The Third Conference of Abbot Theonas, Chapters 2-3"
