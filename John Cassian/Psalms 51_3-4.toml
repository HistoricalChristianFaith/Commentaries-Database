[[commentary]]
quote='''
But if shame holds you back, and you blush to reveal them before men, you should not cease to confess them with constant supplication to Him from Whom they cannot be hid, and to say to Him: "I acknowledge mine iniquity, and my sin is ever before me. Against Thee only have I sinned, and have done evil before Thee;" as He is wont to heal them without any publication which brings shame, and to forgive sins without any reproaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F20.%2520Conference%2520of%2520Abbot%2520Pinufius.html'
source_title="Conference of Abbot Pinufius, Chapter 8"
