[[commentary]]
quote='''
Lastly when a great multitude had come with swords and staves to take the Lord, none of the murderers of the author of our life stood forth as more cruel than he who advanced before them all with a counterfeit respect and salutation and offered a kiss of reigned love; to whom the Lord said: "Judas, betrayest thou the Son of man with a kiss?" i.e., the bitter- ness of thy persecution and hatred has taken as a cloke this which expresses the sweetness of true love. More openly too and more energetically does He emphasize the force of this grief by the prophet, saying: "For if mine enemy had cursed me, I would have borne it: and if he who hated me had spoken great things against me, I would have hid myself from him. But it was thou, a man of one mind, my guide, and my familiar friend: who didst take sweet meats together with me: in the house of God we walked with consent."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 18"
