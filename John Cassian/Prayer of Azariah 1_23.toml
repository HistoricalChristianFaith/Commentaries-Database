[[commentary]]
quote='''
And, preserved by this zeal of mind and continual compunction, we shall beat down the wantonness of the flesh (which becomes more proud and haughty by being fomented with food) and its dangerous incitement, and so by the copiousness of our tears and the weeping of our heart we shall succeed in extinguishing the fiery furnace of our body, which is kindled by the Babylonish king who continually furnishes us with opportunities for sin, and vices with which we burn more fiercely, instead of naphtha and pitch-until, through the grace of God, instilled like dew by His Spirit in our hearts, the heats of fleshly lusts can be altogether deadened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25205.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 5, Chapter 14"
