[[commentary]]
quote='''
Although it is a fact that those men are more grievously and severely troubled, who, while they seem to be very little affected by them in the body, are yet possessed in spirit in a far worse way, as they are entangled in their sins and lusts. For as the Apostle says: "Of whom a man is overcome, of him he is also the servant." Only that in this respect they are more dangerously ill, because though they are their slaves, yet they do not know that they are assaulted by them, and under their dominion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 25"
