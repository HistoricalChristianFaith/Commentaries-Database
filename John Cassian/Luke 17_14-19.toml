[[commentary]]
quote='''
But that after the reception of any blessing, the grace of God, and the use of free will both remain, the case of the ten lepers, who were all healed alike, shows us. For when one of them through goodness of will returned thanks, the Lord looking for the nine, and praising the one, showed that He was ever anxious to help even those who were unmindful of His kindness. For even this is a gift of His visitation; viz., that he receives and commends the grateful one, and looks for and censures those who are thankless.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 19"
