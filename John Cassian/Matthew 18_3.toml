[[commentary]]
quote='''
For one who renounces the world, whatever property or riches he may possess, must seek the common dwelling of a Coenobium, that he may not flatter himself in any way with what he has forsaken or what he has brought into the monastery. He must also be obedient to all, so as to learn that he must, as the Lord says, become again a little child, arrogating nothing to himself on the score of his age and the number of the years which he now counts as lost while they were spent to no purpose in the world and, as he is only a beginner, and because of the novelty of the apprenticeship, which he knows he is serving in Christ's service, he should not hesitate to submit himself even to his juniors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25202.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 2, Chapter 3"
