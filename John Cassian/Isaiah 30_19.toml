[[commentary]]
quote='''
The Divine protection then is inseparably present with us, and so great is the kindness of the Creator towards His creatures, that His Providence not only accompanies it, but actually constantly precedes it, as the prophet experienced and plainly confessed, saying: "My God will prevent me with His mercy." And when He sees in us some beginnings of a good will, He at once enlightens it and strengthens it and urges it on towards salvation, increasing that which He Himself implanted or which He sees to have arisen from our own efforts. For He says "Before they cry, I will hear them: While they are still speaking I will hear them;" and again: "As soon as He hears the voice of thy crying, He will answer thee." And in His goodness, not only does He inspire us with holy desires, but actually creates occasions for life and opportunities for good results, and shows to those in error the direction of the way of salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 8"

[[commentary]]
quote='''
These two then; viz., the grace of God and free will seem opposed to each other, but really are in harmony, and we gather from the system of goodness that we ought to have both alike, lest if we withdraw one of them from man, we may seem to have broken the rule of the Church's faith: for when God sees us inclined to will what is good, He meets, guides, and strengthens us: for "At the voice of thy cry, as soon as He shall hear, He will answer thee;" and: "Call upon Me," He says, "in the day of tribulation and I will deliver thee, and thou shalt glorify Me." And again, if He finds that we are unwilling or have grown cold, He stirs our hearts with salutary exhortations, by which a good will is either renewed or formed in us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 11"
