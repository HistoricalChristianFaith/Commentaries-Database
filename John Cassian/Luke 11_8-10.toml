[[commentary]]
quote='''
Isaac: That there are different reasons for prayer being heard in accordance with the varied and changing condition of souls the words of the gospels and of the prophets teach us. For you have the fruits of an answer pointed out by our Lord's words in the case of the agreement of two persons; as it is said: "If two of you shall agree upon earth touching anything for which they shall ask, it shall be done for them of my Father which is in heaven." You have another in the fulness of faith, which is compared to a grain of mustard-seed. "For," He says, "if you have faith as a grain of mustard seed, ye shall say unto this mountain: Be thou removed, and it shall be removed; and nothing shall be impossible to you." You have it in continuance in prayer, which the Lord's words call, by reason of unwearied perseverance in petitioning, importunity: "For, verily, I say unto you that if not because of his friendship, yet because of his importunity he will rise and give him as much as he needs." You have it in the fruits of almsgiving: "Shut up alms in the heart of the poor and it shall pray for thee in the time of tribulation." You have it in the purifying of life and in works of mercy, as it is said: "Loose the bands of wickedness, undo the bundles that oppress;" and after a few words in which the barrenness of an unfruitful fast is rebuked, "then," he says, "thou shall call and the Lord shall hear thee; thou shalt cry, and He shall say, Here am I." Sometimes also excess of trouble causes it to be heard, as it is said: "When I was in trouble I called unto the Lord, and He heard me;" and again: "Afflict not the stranger for if he crieth unto Me, I will hear him, for I am merciful." You see then in how many ways the gift of an answer may be obtained, so that no one need be crushed by the despair of his conscience for securing those things which are salutary and eternal. For if in contemplating our wretchedness I admit that we are utterly destitute of all those virtues which we mentioned above, and that we have neither that laudable agreement of two persons, nor that faith which is compared to a grain of mustard seed, nor those works of piety which the prophet describes, surely we cannot be without that importunity which He supplies to all who desire it, owing to which alone the Lord promises that He will give whatever He has been prayed to give. And therefore we ought without unbelieving hesitation to persevere, and not to have the least doubt that by continuing in them we shall obtain all those things which we have asked according to the mind of God. For the Lord, in His desire to grant what is heavenly and eternal, urges us to constrain Him as it were by our importunity, as He not only does not despise or reject the importunate, but actually welcomes and praises them, and most graciously promises to grant whatever they have perseveringly hoped for; saying, "Ask and ye shall receive: seek and ye shall find: knock and it shall be opened unto you. For every one that asketh receiveth, and he that seeketh findeth, and to him that knocketh it shall be opened;" and again: "All things whatsoever ye shall ask in prayer believing ye shall receive, and nothing shall be impossible to you." And therefore even if all the grounds for being heard which we have mentioned are altogether wanting, at any rate the earnestness of importunity may animate us, as this is placed in the power of any one who wills without the difficulties of any merits or labours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 34"
