[[commentary]]
quote='''
Further we confidently assert that even the Apostle Paul himself who surpassed in the number of his sufferings the toils of all the saints, could not possibly fulfil this, as he himself testifies to the disciples in the Acts of the Apostles: "Ye yourselves know that these hands have ministered to my needs, and to the needs of those who were with me," or when in writing in the Thessalonians he testifies that he "worked in labour and weariness night and day." And although for this there were great rewards for his merits prepared, yet his mind, however holy and sublime it might be, could not help being sometimes drawn away from that heavenly contemplation by its attention to earthly labours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F23.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The Third Conference of Abbot Theonas, Chapter 5"
