[[commentary]]
quote='''
It is most truly named counsel, without which the authority of Scripture allows us to do nothing, so that we are not even permitted to take that spiritual "wine which maketh glad the heart of man" without its regulating control: as it is said "Do everything with counsel, drink thy wine with counsel," and again "like a city that has its walls destroyed and is not fenced in, so is a man who does anything without counsel." And how injurious the absence of this is to a monk, the illustration and figure in the passage quoted shows, by comparing it to a city that is destroyed and without walls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F2.%2520Second%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="Second Conference of Abbot Moses, Chapter 4"
