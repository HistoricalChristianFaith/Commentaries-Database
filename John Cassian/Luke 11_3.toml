[[commentary]]
quote='''
Next: "Give us this day our bread which is e0piou/sion," i.e., "supersubstantial," which another Evangelist calls "daily." The former indicates the quality of its nobility and substance, in virtue of which it is above all substances and the loftiness of its grandeur and holiness exceeds all creatures, while the latter intimates the purpose of its use and value. For where it says "daily" it shows that without it we cannot live a spiritual life for a single day. Where it says "today" it shows that it must be received daily and that yesterday's supply of it is not enough, but at it must be given to us today also in like manner. And our daily need of it suggests to us that we ought at all times to offer up this prayer, because there is no day on which we have no need to strengthen the heart of our inner man, by eating and receiving it, although the expression used, "today" may be taken to apply to his present life, i.e., while we are living in this world supply us with this bread. For we know that it will be given to those who deserve it by Thee hereafter, but we ask that Thou wouldest grant it to us today, because unless it has been vouchsafed to a man to receive it in this life he will never be partaker of it in that.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 21"
