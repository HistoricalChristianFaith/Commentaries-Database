[[commentary]]
quote='''
You see then that they are very far from evangelical perfection, which teaches that patience must be maintained, not in words but in inward tranquillity of heart, and which bids us preserve it whatever evil happens, that we may not only keep ourselves always from disturbing anger, but also by submitting to their injuries compel those, who are disturbed by their own fault, to become calm, when they have had their fill of blows; and so overcome their rage by our gentleness. And so also we shall fulfil these words of the Apostle: "Be not overcome of evil, but overcome evil with good." And it is quite clear that this cannot be fulfilled by those who utter words of gentleness and humility in such a spirit and rage that they not only fall to lessen the fire of wrath which has been kindled, but rather make it blaze up the more fiercely both in their own feelings and in those of their enraged brother.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 22"
