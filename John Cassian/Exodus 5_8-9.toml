[[commentary]]
quote='''
At any rate, although this has nothing to do with the question raised, yet I think that I ought not to omit the fact that very often our elders used to testify that especially on these days the whole body of monks was attacked according to the ancient custom of the people opposed to them, and was more vehemently urged to forsake their homes, for this reason, because in accordance with this figure, whereby the Egyptians formerly oppressed the children of Israel with grievous afflictions, so now also the spiritual Egyptians try to bow down the true Israel, i.e., the monastic folk, with hard and vile tasks, lest by means of that peace which is dear to God, we should forsake the land of Egypt, and for our good cross to the desert of virtues, so that Pharaoh rages against us and says: "They are idle and therefore they cry saying: Let us go and sacrifice to the Lord our God. Let them be oppressed with labours, and be harassed in their works, and they shall not be harassed by vain words." For certainly their folly imagines that the holy sacrifice of the Lord, which is only offered in the desert of a pure heart, is the height of folly, for "religion is an abomination to a sinner."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 28"
