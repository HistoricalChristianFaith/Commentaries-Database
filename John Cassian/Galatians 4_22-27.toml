[[commentary]]
quote='''
But to return to the explanation of the knowledge from which our discourse took its rise. Thus, as we said above, practical knowledge is distributed among many subjects and interests, but theoretical is divided into two parts, i.e., the historical interpretation and the spiritual sense. Whence also Solomon when he had summed up the manifold grace of the Church, added: "for all who are with her are clothed with double garments." But of spiritual knowledge there are three kinds, tropological, allegorical, anagogical, of which we read as follows in Proverbs: "But do you describe these things to yourself in three ways according to the largeness of your heart." And so the history embraces the knowledge of things past and visible, as it is repeated in this way by the Apostle: "For it is written that Abraham had two sons, the one by a bondwoman, the other by a free: but he who was of the bondwoman was born after the flesh, but he who was of the free was by promise." But to the allegory belongs what follows, for what actually happened is said to have prefigured the form of some mystery "For these," says he, "are the two covenants the one from Mount Sinai, which gendereth into bondage, which is Agar. For Sinai is a mountain in Arabia, which is compared to Jerusalem which now is, and is in bondage with her children." But the anagogical sense rises from spiritual mysteries even to still more sublime and sacred secrets of heaven, and is subjoined by the Apostle in these words: "But Jerusalem which is above is free, which is the mother of us. For it is written, Rejoice, thou barren that bearest not, break forth and cry, thou that travailest not, for many are the children of the desolate more than of her that hath an husband." The tropological sense is the moral explanation which has to do with improvement of life and practical teaching, as if we were to understand by these two covenants practical and theoretical instruction, or at any rate as if we were to want to take Jerusalem or Sion as the soul of man, according to this: "Praise the Lord, O Jerusalem: praise thy God, O Sion." And so these four previously mentioned figures coalesce, if we desire, in one subject, so that one and the same Jerusalem can be taken in four senses: historically as the city of the Jews; allegorically as Church of Christ, anagogically as the heavenly city of God "which is the mother of us all," tropologically, as the soul of man, which is frequently subject to praise or blame from the Lord under this title.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 8"
