[[commentary]]
quote='''
We know too howgreat is theuse of sorrow, which is reckonedamong the othervices, when it is turned to an opposite use. For on the one hand, when it is in accordance with the fear of God it is most needful, and on the other, when it is in accordance with the world, most pernicious; as the Apostle teaches us when he says that "the sorrow which is according to God worketh repentance that is steadfast unto salvation, but the sorrow of the world worketh death."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25207.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 7, Chapter 3"
[[commentary]]
quote='''
And so we must see that dejection is only useful to us in one case, when we yield to it either in penitence for sin, or through being inflamed with the desire of perfection, or the contemplation of future blessedness. And of this the blessed Apostle says: "The sorrow which is according to God worketh repentance steadfast unto salvation: but the sorrow of the world worketh death."

But that dejection and sorrow which "worketh repentance steadfast unto salvation" is obedient, civil, humble, kindly, gentle, and patient, as it springs from the love of God, and unweariedly extends itself from desire of perfection to every bodily grief and sorrow of spirit; and somehow or other rejoicing and feeding on hope of its own profit preserves all the gentleness of courtesy and forbearance, as it has in itself all the fruits of the Holy Spirit of which the same Apostle gives the list: "But the fruit of the Spirit is love, joy, peace, forbearance, goodness, benignity, faith, mildness, modesty." But the other kind is rough, impatient, hard, full of rancour and useless grief and penal despair, and breaks down the man on whom it has fastened, and hinders him from energy and wholesome sorrow, as it is unreasonable, and not only hampers the efficacy of his prayers, but actually destroys all those fruits of the Spirit of which we spoke, which that other sorrow knows how to produce.

Wherefore except that sorrow which is endured either for the sake of saving penitence, or for the sake of aiming at perfection,or for the desire of the future, all sorrow and dejection must equally be resisted, as belonging to this world, and being that which "worketh death," and must be entirely expelled from our hearts like the spirit of fornication and covetousness and anger.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25209.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 9, Chapters 10-12"
