[[commentary]]
quote='''
And SO this disease and unhealthy state is threefold, and is condemned with equal abhorrence by all the fathers. One feature is this, of which we described the taint above, which by deceiving wretched folk persuades them to hoard though they never had anything of their own when they lived in the world. Another,which forces men afterwards to resume and once more desire those things which in the early days of their renunciation of theworld they gave up. A third, which springing from a faulty and hurtful beginning and making a bad start, does not suffer those whom it hasonce infected with this lukewarmness of mind to strip themselves of all their worldly goods, through fear of poverty and want of faith; and those who keep back money and property which they certainly ought to have renounced and forsaken, it never allows to arrive at the perfection of the gospel. And we find in Holy Scripture instances of these three catastrophes which were visited with no light punishment. For when Gehazi wished to acquire what he had never had before, not only did he fail to obtain the gift of prophecy which it would have been his to receive from his master by hereditary succession, but on the contrary he was covered by the curse of the holy Elisha with a perpetual leprosy: while Judas, wanting to resume the possession of the wealth which he had formerly cast away when he followed Christ, not only fell into betraying the Lord, and lost his apostolic rank, but also was not allowed to close his life with the common lot of all but ended it by a violent death. But Ananias and Sapphira, keeping backa part of that which was formerly their own, were at the Apostle's word punished with death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25207.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 7, Chapter 14"

[[commentary]]
quote='''
And such are seen to be lepers in spirit and heart, after the likeness of Gehazi, who, desiring the uncertain riches of this world, was covered with the taint of foul leprosy, through which he left us a clear example that every soul which is defiled with the stain of cupidity is covered with the spiritual leprosy of sin, and is counted as unclean before God with a perpetual curse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25207.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 7, Chapter 26"
