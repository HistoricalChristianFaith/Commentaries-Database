[[commentary]]
quote='''
And to make this clearer not only by a short discussion to the best of my ability, but by Scripture proof as well, gluttony and fornication, though they exist in us naturally (for sometimes they spring up without any incitement from the mind, and simply at the motion and allurement of the flesh) yet if they are to be consummated, must find an external object, and thus take effect only through bodily acts. For "every man is tempted of his own lust. Then lust when it has conceived beareth sin, and sin when it is consummated begets death." For the first Adam could not have fallen a victim to gluttony unless he had had material food at hand, and had used it wrongly, nor could the second Adam be tempted without the enticement of some object, when it was said to Him: "If Thou art the Son of God, command that these stones be made bread." And it is clear to everybody that fornication also is only completedby a bodily act, as God says of this spirit to the blessed Job: "And his force is in his loins, and his strength in the navel of his belly." And so these two faults in particular, which are carried into effect by the aid of the flesh, especially require bodily abstinence as well as spiritual care of the soul; since the determination of the mind is not in itself enough to resist their attacks (as is sometimes the case with anger or gloominess or the other passions, which an effort of the mind alone can overcome without any mortification of the flesh); but bodily chastisement must be used as well, and be carried out by means of fasting and vigils and acts of contrition; and to this must be added change of scene, because since these sins are the results of faults of both mind and body, so they can only be overcome by the united efforts of both.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 4"
