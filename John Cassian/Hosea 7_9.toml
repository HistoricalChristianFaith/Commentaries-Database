[[commentary]]
quote='''
Not content with these words, the blessed Anthony entered upon a wider field of discussion, and he said, "This way of life and this most lukewarm condition not only causes you the loss that I have spoken of, even though you yourself may not feel it now. You may even somehow say in keeping with a sentence from Proverbs: 'They strike me, but I did not grieve, and they mocked me, but I was unaware.' And remember what is said by the prophet Hosea: 'Aliens devoured his strength, and he himself did not even recognize it.' "
'''
source_url=''
source_title="CONFERENCE 24:11.3"

[[commentary]]
quote='''
Moses: Just as all young men are not alike in fervour of spirit nor equally instructed in learning and good morals, so too we cannot find that all old men are equally perfect and excellent. For the true riches of old men are not to be measured by grey hairs but by their diligence in youth and the rewards of their past labours. "For," says one, "the things that thou hast not gathered in thy youth, how shall thou find them in thy old age?" "For venerable old age is not that of long time, nor counted by the number of years: but the understanding of a man is grey hairs, and a spotless life is old age." And therefore we are not to follow in the steps or embrace the traditions and advice of every old man whose head is covered with grey hairs, and whose age is his sole claim to respect, but only of those whom we find to have distinguished themselves in youth in an approved and praiseworthy manner, and to have been trained up not on self-assurance but on the traditions of the Elders. For there are some, and unhappily they form the majority, who pass their old age in a lukewarmness which they contracted in youth, and in sloth, and so obtain authority not from the ripeness of their character but simply from the number of their years. Against whom that reproof of the Lord is specially aimed by the prophet: "Strangers have devoured his strength and he knew it not: yea, grey hairs also are spread about upon him, and he is ignorant of it." These men, I say, are not pointed out as examples to youth from the uprightness of their lives, nor from the strictness of their profession, which would be worthy of praise and imitation, but simply from the number of their years; and so the subtle enemy uses their grey hairs to deceive the younger men, by a wrongful appeal to their authority, and endeavours in his cunning craftiness to upset and deceive by their example those who might have been urged into the way of perfection by their advice or that of others; and drags them down by means of their teaching and practice either into a baneful indifference, or into deadly despair.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F2.%2520Second%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="Second Conference of Abbot Moses, Chapter 13"
