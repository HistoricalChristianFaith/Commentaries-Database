[[commentary]]
quote='''
For this is discretion, which is termed in the gospel the "eye," "and light of the body," according to the Saviour's saying: "The light of thy body is thine eye: but if thine eye be single, thy whole body will be full of light, but if thine eye be evil, thy whole body will be full of darkness:" because as it discerns all the thoughts and actions of men, it sees and overlooks all things which should be done. But if in any man this is "evil," i.e., not fortified by sound judgment and knowledge, or deceived by some error and presumption, it will mike our whole body "full of darkness," i.e., it will darken all our mental vision and our actions, as they will be involved in the darkness of vices and the gloom of disturbances. For, says He, "if the light which is in thee be darkness, how great will that darkness be!" For no one can doubt that when the judgment of our heart goes wrong, and is overwhelmed by the night of ignorance, our thoughts and deeds, which are the result of deliberation and discretion, must be involved in the darkness of still greater sins.

Lastly, the man who in the judgment of God was the first to be worthy of the kingdom of His people Israel, because he was lacking in this "eye" of discretion, was, as if his whole body were full of darkness, actually cast down from the kingdom while, being deceived by the darkness of this "light," and in error, he imagined that his own offerings were more acceptable to God than obedience to the command of Samuel, and met with an occasion of falling in that very matter in which he had hoped to propitiate the Divine Majesty. And ignorance, I say, of this discretion led Ahab the king of Israel after a triumph and splendid victory which had been granted to him by the favour of God to fancy that mercy on his part was better than the stem execution of the divine command, and, as it seemed to him, a cruel rule: and moved by this consideration, while he desired to temper a bloody victory with mercy, he was on account of his indiscriminating clemency rendered full of darkness in his whole body, and condemned irreversibly to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F2.%2520Second%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="Second Conference of Abbot Moses, Chapters 2-3"
