[[commentary]]
quote='''
Would you understand too the strength and courage of this centurion, by which he bears these arms of which we spoke before as not carnal but mighty to God? Hear of the selection by which the King himself marks and approves brave men when he summons them to the spiritual combat. "Let," says He, "the weak say that I am strong;" and: "Let him who is the sufferer become a warrior." You see then that none but sufferers and weak people can fight the Lord's battles, weak indeed with that weakness, rounded on which that centurion of ours in the gospel said with confidence: "For when I am weak, then am I strong," and again, "for strength is made perfect in weakness." Of which weakness one of the prophets says: "And he that is weak among them shall be as the house of David. For the patient sufferer shall fight these wars, with that patience of which it is said "patience is necessary for you that doing the will of God you may receive the reward."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 5"
