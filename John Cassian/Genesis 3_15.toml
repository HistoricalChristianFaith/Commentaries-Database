[[commentary]]
quote='''
For the subtle serpent is ever "watching our heel," that is, is lying in wait for the close, and endeavouring to trip us up right to the end of our life. And therefore it will not be of any use to have made a good beginning and to have eagerly taken the first step towards renouncing the world with all fervour, if a corresponding end does not likewise set it off and conclude it, and if the humility and poverty of Christ, of which you have now made profession in His sight, are not preserved by you even to the close of your life, as they were first secured. And that you may succeed in doing this, do you ever "watch his head," i.e. the first rise of thoughts, by bringing them at once to your superior. For thus you will learn to "bruise" his dangerous beginnings, if you are not ashamed to disclose any of them to your superior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25204.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 4, Chapter 37"

[[commentary]]
quote='''
And in this case it will be the greatest victory and a lasting triumph, if, as is said, the conscience of the monk is not defiled by the possession of the smallest coin. For it is an impossibility for him who, overcome in the matter of a small possession, has once admitted into his heart a root of evil desire, not to be inflamed presently with the heat of a still greater desire. For the soldier of Christ will be victorious and in safety, and free from all the attacks of desire, so long as this most evil spirit does not implant in his heart a seed of this desire. Wherefore, though in the matter of all kinds of sins we ought ordinarily to watch the serpent's head, yet in this above all we should be more keenly on our guard. For if it has been admitted it will grow by feeding on itself, and will kindle for itself a worse fire. And so we must not only guard against the possession of money, but also must expel from our souls the desire for it. For we should not so much avoid the results of covetousness, as cut off by the roots all disposition towards it. For it will do no good not to possess money, if there exists in us the desire for getting it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25207.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 7, Chapter 21"
