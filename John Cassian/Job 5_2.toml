[[commentary]]
quote='''
And concerning anger and jealousy the blessed Job says: "For anger slayeth a fool, and envy killeth a child." And at the same time it should be noticed that he who is angered is set down as a fool; and he who is jealous, as a child. For the former is not undeservedly considered a fool, since of his own accord he brings death upon himself, being goaded by the stings of anger; and the latter, while he is envious, proves that he is a child and a minor, for while he envies another he shows that the one at whose prosperity he is vexed, is greater than he.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25205.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 5, Chapter 22"
