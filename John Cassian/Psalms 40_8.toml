[[commentary]]
quote='''
And this feeling even our Lord expressed when He prayed in the character of man which He had taken, that He might give us a form of prayer as other things also by His example; saying thus: "Father, if it be possible, let this cup pass from me: nevertheless not as I will but as Thou wilt," though certainly His will was not discordant with His Father's will, "For He had come to save what was lost and to give His life a ransom for many;" as He Himself says: "No man taketh my life from Me, but I lay it down of Myself. I have power to lay it down and I have power to take it again." In which character there is in the thirty-ninth Psalm the following sung by the blessed David, of the Unity of will which He ever maintained with the Father: "To do Thy will: O My God, I am willing."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 34"
