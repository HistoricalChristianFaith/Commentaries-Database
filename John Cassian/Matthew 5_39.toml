[[commentary]]
quote='''
From which we infer by the clearest of reasonings that that law committed to writing need not have been given at the beginning (for it was unnecessary for this to be done while the natural law still remained, and was not utterly violated) nor could evangelical perfection have been granted before the law had been kept. For they could not have listened to this saying: "If a man strikes thee on the right cheek, turn to him the other also," who were not content to avenge wrongs done to them with the even justice of the lex talionis, but repaid a very slight touch with deadly kicks and wounds with weapons, and for a single truth sought to take the life of those who had struck them. Nor could it be said to them, "love your enemies," among whom it was considered a great thing and most important if they loved their friends, but avoided their enemies and dissented from them only in hatred without being eager to oppress and kill them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 24"

[[commentary]]
quote='''
WE are not ignorant also of another kind of insanity, which we find in some of the brethren under colour of a counterfeit patience, as in this case it is not enough to have stirred up quarrels unless they incite them with irritating words so as to get themselves smitten, and when they have been touched by the slightest blow, at once they offer another part of their body to be smitten, as if in this way they could fulfil to perfection that command which says: "If a man smite thee on the right cheek, offer him the other also;" while they totally ignore the meaning and purpose of the passage. For they fancy that they are practising evangelical patience through the sin of anger, for the utter eradication of which not only was the exchangeof retaliation and the irritation of strife forbidden, but the command was actually given us to mitigate the wrath of the striker by the endurance of a double wrong.

Germanus: How can we blame one who satisfies the command of the Gospel and not only does not retaliate, but is actually prepared to have a double wrong offered to him?

Joseph: As was said a little before, we must look not only at the thing which is done, but also at the character of the mind and the purpose of the doer. And therefore if you weigh with a careful scrutiny of heart what is done by each man and consider with what mind it is done or from what feeling it proceeds, you will see that the virtue of patience and gentleness cannot possibly be fulfilled in the opposite spirit, i.e., that of impatience and rage. Since our Lord and Saviour, when giving us a thorough lesson on the virtue of patience and gentleness (i.e., teaching us not only to profess it with our lips, but to store it up in the inmost recesses of the soul) gave us this summary of evangelical perfection, saying: "If any one smites thee on thy right cheek, offer him the other also" (doubtless the "right" cheek is mentioned, as another "right" cheek cannot be found except in the face of the inner man, so to speak), as by this He desires entirely to remove all incitement to anger from the deepest recesses of the soul, i.e., that if your external right cheek has received a blow from the striker, the inner man also humbly consenting may offer its right cheek to be smitten, sympathizing with the suffering of the outward man, and in a way submitting and subjecting its own body to wrong from the striker, that the inner man may not even silently be disturbed in itself at the blows of the outward man. You see then that they are very far from evangelical perfection, which teaches that patience must be maintained, not in words but in inward tranquillity of heart, and which bids us preserve it whatever evil happens, that we may not only keep ourselves always from disturbing anger, but also by submitting to their injuries compel those, who are disturbed by their own fault, to become calm, when they have had their fill of blows; and so overcome their rage by our gentleness. And so also we shall fulfil these words of the Apostle: "Be not overcome of evil, but overcome evil with good." And it is quite clear that this cannot be fulfilled by those who utter words of gentleness and humility in such a spirit and rage that they not only fall to lessen the fire of wrath which has been kindled, but rather make it blaze up the more fiercely both in their own feelings and in those of their enraged brother. But these, even if they could in some way keep calm and quiet themselves, would yet not bear any fruits of righteousness, while they claim the glory of patience on their part by their neighbour's loss, and are thus altogether removed from that Apostolic love which "Seeketh not her own," butthe things of others. For it does not so desire riches in such a way as to make profit for itself out of one's neighbour's loss, nor does it wish to gain anything if it involves the spoiling of another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapters 20-22"
