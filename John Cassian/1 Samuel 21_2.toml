[[commentary]]
quote='''
But that lying was even then condemned the text of the whole Old Testament clearly shows, as it says: "Thou shall destroy all them that speak lies;" and again: "The bread of lying is sweet to a man, but afterwards his mouth is filled with gravel;" and the Giver of the law himself says: "Thou shalt avoid a lie." But we said that it was then properly employed as a last resort when some need or plan of salvation was linked on to it, on account of which it ought not to be condemned. As is the case, which you mentioned, of king David when in his flight from the unjust persecution of Saul, to Abimelech the priest he used lying words, not with the object of getting any gain nor with the desire to injure anybody, but simply to save himself from that most iniquitous persecution; inasmuch as he would not stain his hands with the blood of the hostile king, so often delivered up to him by God; as he said: "The Lord be merciful to me that I may do no such thing to my master the Lord's anointed, as to lay my hand upon him, because he is the Lord's anointed."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 19"
