[[commentary]]
quote='''
And therefore the aforesaid teacher of the Gentiles, though he bears his witness that he had obtained the grade of the Apostolate by the grace of God, saying: "By the grace of God I am what I am," yet also declares that he himself had corresponded to Divine Grace, where he says: "And His Grace in me was not in vain; but I laboured more abundantly than they all: and yet not I, but the Grace of God with me." For when he says: "I laboured," he shows the effort of his own will; when he says: "yet not I, but the grace of God," he points out the value of Divine protection; when he says: "with me," he affirms that it cooperates with him when he was not idle or careless, but working and making an effort.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 13"

[[commentary]]
quote='''
And SO we can escape the snare of this most evil spirit, if in the case of every virtue in which we feel that we make progress, we say these words of the Apostle: "Not I, but the grace of God with me," and "by the grace of God I am what I am;" and "it is God that worketh in us both to will and to do of His good pleasure."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 9"
