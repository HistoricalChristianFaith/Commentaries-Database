[[commentary]]
quote='''
Abraham: Never to be resorted to by men at all is a sign of an unreasonable and ill-considered strictness, or rather of the greatest coldness. For if a man walks in this way, on which he has entered, with too slow steps, and lives according to the former man, it is right that none - I say not of the saints - but of any men should visit him. But you, if you are inflamed with true and perfect love of our Lord, and follow God, who indeed is love, with entire fervour of spirit, are sure to be resorted to by men, to whatever inaccessible spot you may flee, and, in proportion as the ardour of divine love brings you nearer to God, so will a larger concourse of saintly brethren flock to you. For, as the Lord says, "A city set on an hill cannot be hid," because "them that love Me," saith the Lord, "will I honour, and they that despise Me shall be contemned."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 19"
