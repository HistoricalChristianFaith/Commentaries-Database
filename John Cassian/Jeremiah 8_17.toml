[[commentary]]
quote='''
However you should know that the evil of envy is harder to be cured than other faults, for I should almost say that a man whom it has once tainted with the mischief of its poison is without a remedy. For it is the plague of which it is figuratively said by the prophet: "Behold I will send among you serpents, basilisks, against which there is no charm: and they shall bite you." Rightly then are the stings of envy compared by the prophet to the deadly poison of basilisks, as by it the first author of all poisons and their chief perished and died. For he slew himself before him of whom he was envious, and destroyed himself before that he poured forth the poison of death against man: for "by the envy of the devil death entered into the world: they therefore who are on his side follow him." For just as he who was the first to be corrupted by the plague of that evil, admitted no remedy of penitence, nor any healing plaster, so those also who have given themselves up to be smitten by the same pricks, exclude all the aid of the sacred charmer, because as they are tormented not by the faults but by the prosperity of those of whom they are jealous, they are ashamed to display the real truth and look out for some external unnecessary and trifling causes of offence: and of these, because they are altogether false, vain is the hope of cure, while the deadly poison which they will not produce is lurking in their veins. Of which the wisest of men has fitly said: "If a serpent bite without hissing, there is no supply for the charmer." For those are silent bites, to which alone the medicine of the wise is no succour. For that evil is so far incurable that it is made worse by attentions, it is increased by services, is irritated by presents, because as the same Solomon says: "envy endures nothing." For just in proportion as another has made progress in humble submission or in the virtue of patience or in the merit of munificence, so is a man excited by worse pricks of envy, because he desires nothing less than the ruin or death of the man whom he envies. Lastly no submission on the part of their harmless brother could soften the envy of the eleven patriarchs, so that Scripture relates of them: "But his brothers envied him because his father loved him, and they could not speak peaceably unto him" until their jealousy, which would not listen to any entreaties on the part of their obedient and submissive brother, desired his death, and would scarcely be satisfied with the sin of selling a brother. It is plain then thatenvy is worse than all faults, and harder to get rid of, as it is inflamed by those remedies by which the others are destroyed. For, for example, a man who is grieved by a loss that has been caused to him, is healed by a liberal compensation: one who is sore owing to a wrong done to him, is appeased by humble satisfaction being made. What can you do with one who is the more offended by the very fact that he sees you humbler and kinder, who is not aroused to anger by any greed which can be appeased by a bribe; or by any injurious attack or love of vengeance, which is overcome by obsequious services; but is only irritated by another's success and happiness? But who is there who in order to satisfy one who envies him, would wish to fall from his good fortune, or to lose his prosperity or to be involved in some calamity? Wherefore we must constantly implore the divine aid, to which nothing is impossible, in order that the serpent may not by a single bite of this evil destroy whatever is flourishing in us, and animated as it were by the life and quickening power of the Holy Ghost. For the other poisons of serpents, i.e., carnal sins and faults, in which human frailty is easily entangled and from which it is as easily purified, show some traces of their wounds in the flesh, whereby although the earthly body is most dangerously inflamed, yet if any charmer well skilled in divine incantations applies a cure and antidote or the remedy of words of salvation, the poisonous evil does not reach to the everlasting death of the soul. But the poison of envy as if emitted by the basilisk, destroys the very life of religion and faith, even before the wound is perceived in the body. For he does not raise himself up against men, but, in his blasphemy, against God, who carps at nothing in his brother except his felicity, and so blames no fault of man, but simply the judgment of God. This then is that "root of bitterness springing up" which raises itself to heaven and tends to reproaching the very Author Who bestows good things on man. Nor shall anyone be disturbed because God threatens to send "serpents, basilisks," to bite those by whose crimes He is offended. For although it is certain that God cannot be the author of envy, yet it is fair and worthy of the divine judgment that, while good gifts are bestowed on the humble and refused to the proud and reprobate, those who, as the Apostle says, deserve to be given over "to a reprobate mind," should be smitten and consumed by envy sent as it were by Him, according to this passage: "They have provoked me to jealousy by them that are no gods: and I will provoke them to jealousy by them that are no nation."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 16"
