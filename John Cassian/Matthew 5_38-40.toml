[[commentary]]
quote='''
In the same way he cannot fail to be subject to the bloody sway of sin, whoever chooses to pull out, as the law commands, an eye for an eye, a tooth for a tooth, or to hate his enemy, for while he desires by retaliation in exchange to avenge an injury done to himself, and while he cherishes bitter hatred against an enemy, he is sure always to be inflamed with the passion of anger and rage. But whoever lives under the light of the grace of the gospel, and overcomes evil by not resisting it, but by bearing it, and does not hesitate of his own free will to give to one who smites his right cheek, the other also, and to one who wants to raise a lawsuit against him for his coat, gives his cloak also, and who loves his enemies, and prays for those who slander him, this man has broken the yoke of sin and burst its chains. For he is not living under the law, which does not destroy the seeds of sin (whence not without reason the Apostle says of it: "There is a setting aside of the former commandment because of the weakness and unprofitableness thereof: for the law brought nothing to perfection;" and the Lord says by the prophet: "And I gave them commands that were not good, and ordinances, whereby they could not live" , but under grace which does not merely lop off the boughs of wickedness, but actually tears up the very roots of an evil will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 33"
