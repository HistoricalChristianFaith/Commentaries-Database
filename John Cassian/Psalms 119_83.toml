[[commentary]]
quote='''
Secondly, he should realize that in the actual wearing of the girdle there is no small mystery declaring what is demanded of him. For the girding of the loins and binding them round with a dead skin signifies that he bears about the mortification of those members in which are contained the seeds of lust and lasciviousness, always knowing that the command of the gospel, which says, "Let your loins be girt about, " is applied to him by the Apostle's interpretation; to wit, "Mortify your members which are upon the earth; fornication, uncleanness, lust, evil concupiscence." And so we find in Holy Scripture that only those were girt with the girdle in whom the seeds of carnal lust are found to be destroyed, and who sing with might and main this utterance of the blessed David: "For I am become like a bottle in the frost," because when the sinful flesh is destroyed in the inmost parts they can distend by the power of the spirit the dead skin of the outward man. And therefore he significantly adds "in the frost," because they are never satisfied merely with the mortification of the heart, but also have the motions of the outward man and the incentives of nature itself frozen by the approach of the frost of continence from without, if only, as the Apostle says, they no longer allow any reign of sin in their mortal body, nor wear a flesh that resists the spirit."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25201.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 1, Chapter 11"
