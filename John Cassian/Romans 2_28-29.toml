[[commentary]]
quote='''
Theonas: Your zeal indeed, whereby you desire to reach the way of perfection, not for a moment only but fully and perfectly, urges us to continue this discussion unweariedly. For you are anxiously inquiring not about external chastity or outward circumcision, but about that which is secret, as you know that complete perfection does not consist in this visible continence of the flesh which can be attained either by constraint, or by hypocrisy even by unbelievers, but in that voluntary and invisible purity of heart, which the blessed Apostle describes as follows: "For he is not a Jew which is so outwardly, nor is that circumcision which is outward in the flesh, buthe is a Jew which is one inwardly, and the circumcision is that of the heart, in the spirit not in the letter, whose praise is not of men but of God," who alone searches the secrets of the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 36"
