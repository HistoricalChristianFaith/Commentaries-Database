[[commentary]]
quote='''
Isaac: We need not be surprised that a really simple man who had never received any instruction on the substance and nature of the Godhead could still be entangled and deceived by an error of simplicity and the habit of a longstanding mistake, and (to speak more truly) continue in the original error which is brought about, not as you suppose by a new illusion of the demons, but by the ignorance of the ancient heathen world, while in accordance with the custom of that erroneous notion, by which they used to worship devils formed in the figure of men, they even now think that the incomprehensible and ineffable glory of the true Deity should be worshipped under the limitations of some figure, as they believe that they can grasp and hold nothing if they have not some image set before them, which they can continually address while they are at their devotions, and which they can carry about in their mind and have always fixed before their eyes. And against this mistake of theirs this text may be used: "And they changed the glory of the incorruptible God into the likeness of the image of corruptible man."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F10.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The Second Conference of Abbot Isaac, Chapter 5"
