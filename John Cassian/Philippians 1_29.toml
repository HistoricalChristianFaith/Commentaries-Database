[[commentary]]
quote='''
And again "For it is granted to you for Christ's sake, not only to believe in Him but also to suffer for Him." Here also he declares that the beginning of our conversion and faith, and the endurance of suffering is a gift to us from the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 15"
