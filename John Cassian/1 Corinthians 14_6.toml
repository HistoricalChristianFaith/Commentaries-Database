[[commentary]]
quote='''
Of these four kinds of interpretation the blessed Apostle speaks as follows: "But now, brethren, if I come to you speaking with tongues what shall I profit you unless I speak to you either by revelation or by knowledge or by prophecy or by doctrine?" For "revelation" belongs to allegory whereby what is concealed under the historical narrative is revealed in its spiritual sense and interpretation, as for instance if we tried to expound how "all our fathers were under the cloud and were all baptized unto Moses in the cloud and in the sea," and how they "all ate the same spiritual meat and drank the same spiritual drink from the rock that followed them. But the rock was Christ." And this explanation where there is a comparison of the figure of the body and blood of Christ which we receive daily, contains the allegorical sense. But the knowledge, which is in the same way mentioned by the Apostle, is tropological, as by it we can by a careful study see of all things that have to do with practical discernment whether they are useful and good, as in this case, when we are told to judge of our own selves "whether it is fitting for a woman to pray to God with her head uncovered." And this system, as has been said, contains the moral meaning. So "prophecy" which the Apostle puts in the third place, alludes to the anagogical sense by which the words are applied to things future and invisible, as here: "But we would not have you ignorant, brethren, concerning those that sleep: that ye be not sorry as others also who have no hope. For if we believe that Christ died and rose again, even so them also which sleep in Jesus will God bring with Him. For this we say to you by the word of God, that we which are alive at the coming of the Lord shall not prevent those that sleep in Christ, for the Lord Himself shall descend from heaven with a shout, with the voice of the archangel and with the trump of God; and the dead in Christ shall rise first." In which kind of exhortation the figure of anagoge is brought forward. But "doctrine" unfolds the simple course of historical exposition, under which is contained no more secret sense, but what is declared by the very words: as in this passage: "For I delivered unto you first of all what I also received, how that Christ died for our sins according to the Scriptures, and that He was buried, and that He rose again on the third day, and that he was seen of Cephas;" and: "God sent His Son, made of a woman, made under the law, to redeem them that were under the law;" or this: "Hear, O Israel, the Lord the God is one Lord."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 8"
