[[commentary]]
quote='''
And some are commanded to "be angry" after a wholesome fashion, but with our own selves, and with evil thoughts that arise, and "not to sin," viz., by bringing them to a bad issue. Finally, the next verse explains this to be the meaning more clearly: "The things you say in your hearts, be sorry for them on your beds:" i.e., whatever you think of in your hearts when sudden and nervous excitements rush in on you, correct and amend with wholesome sorrow, lying as it were on a bed of rest, and removing by the moderating influence of counsel all noise and disturbance of wrath. Lastly, the blessed Apostle, when he made use of the testimony of this verse, and said, "Be ye angry and sin not," added, "Let not the sun go down upon your wrath, neither give place to the devil." If it is dangerous for the sun of righteousness to go down upon our wrath, and if when we are angry we straightway give place to the devil in our hearts, how is it that above he charges us to be angry, saying, "Be ye angry, and sin not"? Does he not evidently mean this: be ye angry with your faults and your tempers, lest, if you acquiesce in them, Christ, the sun of righteousness, may on account of your anger begin to go down on your darkened minds, and when He departs you may furnish a place for the devil in your hearts?

And of this sun God clearly makes mention by the prophet, when He says, "But to those that fear my name the sun of righteousness shall arise with healing in His wings." And this again is said to "go down" at midday on sinners and false prophets, and those who are angry, when the prophet says, "Their sun is gone down at noon." And at any rate "tropically" the mind, that is the nou=j or reason, which is fairly called the sun because it looks over all the thoughts and discernings of the heart, should not be put out by the sin of anger: lest when it "goes down" the shadows of disturbance, together with the devil their author, fill all the feelings of our hearts, and, overwhelmed by the shadows of wrath, as in a murky night, we know not what we ought to do. In this sense it is that we have brought forward this passage of the Apostle, handed down to us by the teaching of the elders, because it was needful, even at the risk of a somewhat lengthy discourse, to show how they felt with regard to anger, for they do not permit it even for a moment to effect an entrance into our heart: observing with the utmost care that saying of the gospel: "Whosoever is angry with his brother is in danger of the judgment." But if it be lawful to be angry up till sunset, the surfeit of our wrath and the vengeance of our anger will be able to give full play to passion and dangerous excitement before that sun inclines towards its setting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25208.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 8, Chapters 9-10"
