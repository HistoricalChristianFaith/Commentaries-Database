[[commentary]]
quote='''
Heroin lies wisdom, herein lies intelligence and understanding without which our inward house cannot be built, nor can spiritual riches be gathered together, as it is said: "A house is built with wisdom, and again it is set up with intelligence. With understanding the storehouses are filled with all precious riches and good things."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F2.%2520Second%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="Second Conference of Abbot Moses, Chapter 4"
