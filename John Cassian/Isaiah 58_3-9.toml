[[commentary]]
quote='''
But to those men also will these things be found bad, who are on the lookout for the praises of men by their fasts, and by a foolish show of paleness gain credit for sanctity, of whom the word of the Gospel tells us that they have received their reward in this life, and whose fast the Lord execrates by the prophet. In whose person he first objected to himself and said: "Wherefore have we fasted and Thou hast not regarded: wherefore have we humbled our souls, and Thou hast not known it?" and then at once he answered and explained the reasons why they did not deserve to be heard: "Behold," he says, "in the days of your fast your own will is found and you exact of all your debtors. Behold you fast for debates and strife, and strike with the fist wickedly. Do not fast as ye have done unto this day, to make your cry to be heard on high. Is this such a fast as I have chosen, for a man to afflict his soul for a day? Is it this, to wind his head about like a circle, and to spread sackcloth and ashes? Will ye call this a fast and a day acceptable o the Lord?" Then he proceeds to teach how the abstinence of one who fasts may become acceptable, and clearly lays down that faring cannot be good of itself alone, but only when it has the following reasons which are added: "Is not this," he says, "the fast that I have chosen? Loose the bands of wickedness, undo the bundles that oppress, let them that are broken go free, and break asunder every burden. Deal thy bread to the hungry, and bring the needy and the harbourless into thine house: and when thou shalt see one naked cover him, and despise not thine own flesh. Then shalt thy light break forth as the morning and thy health shall speedily arise, and thy righteousness shall go before thy face and the glory of the Lord shall gather thee up. Then shalt thou call, and the Lord shall hear: thou shalt cry, and He shall say, Here am I." You see then that fasting is certainly not considered by the Lord as a thing that is good in its own nature, because it becomes good and well-pleasing to God not by itself but by other works, and again from the surrounding circumstances it may be regarded as not merely vain but actually hateful, as the Lord says: "When they fast I will not hear their prayers."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 14"
