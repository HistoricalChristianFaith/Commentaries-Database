[[commentary]]
quote='''
For as the kingdom of the devil is gained by consenting to sin, so the kingdom of God is attained by the practice of virtue in purity of heart and spiritual knowledge. But where the kingdom of God is, there most certainly eternal life is enjoyed, and where the kingdom of the devil is, there without doubt is death and the grave. And the man who is in this condition, cannot praise the Lord, according to the saying of the prophet which tells us: "The dead cannot praise Thee, O Lord; neither all they that go down into the grave (doubtless of sin). But we," says he, "who live(not forsooth to sin nor I to this world but to God) will bless the Lord, from this time forth for evermore: for in death no man remembereth God: but in the grave (of sin) who will confess to the Lord?" i.e., no one will. For no man even though he were to call himself a Christian a thousand times over, or a monk, confesses God when he is sinning: no man who allows those things which the Lord hates, remembereth God, nor calls himself with any truth the servant of Him, whose commands he scorns with obstinate rashness: in which death the blessed Apostle declares that the widow is involved, who gives herself to pleasure, saying "a widow who giveth herself to pleasure is dead while she liveth." There are then many who while still living in this body are dead, and lying in the grave cannot praise God; and on the contrary there are many who though they are dead in the body yet bless God in the spirit, and praise Him, according to this: "O ye spirits and souls of the righteous, bless ye the Lord:" and "every spirit shall praise the Lord."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F1.%2520First%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="First Conference of Abbot Moses, Chapter 14"
