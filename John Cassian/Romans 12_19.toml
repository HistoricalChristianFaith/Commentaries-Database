[[commentary]]
quote='''
Something of the same kind too is this which is said by the Apostle: "Not avenging yourselves, dearly beloved: but give place to wrath," i.e., do not under the compulsion of wrath proceed to vengeance, but give place to wrath, i.e., do not let your hearts be confined in the straits of impatience and cowardice so that, when a fierce storm of passion rises, you cannot endure it; but be ye enlarged in your hearts, receiving the adverse waves of anger in the wide gulf of that love which "suffereth all things, beareth all things;" and so your mind will be enlarged with wide long-suffering and patience, and will have within it safe recesses of counsel, in which the foul smoke of anger will be received and be diffused and forthwith vanish away; or else the passage may be taken in this way: we give place to wrath, as often as we yield with humble and tranquil mind to the passion of another, and bow to the impatience of the passionate, as if we admitted that we deserved any kind of wrong. But those who twist the meaning of the perfection of which the Apostle speaks so as to make out that those give place to anger, who go away from a man in a rage, seem to me not to cut off but rather to foment the incitement to quarrelling, for unless a neighbour's wrath is overcome at once by amends being humbly made, a man provokes rather than avoids it by his flight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 27"
