[[commentary]]
quote='''
Let the robe also of the monk be such as may merely cover the body and prevent the disgrace of nudity, and keep off harm from cold, not such as may foster the seeds of vanity and pride; for the same apostle tells us: "Having food and covering, with these let us be content." "Covering," he says, not "raiment," as is wrongly found in some Latin copies: that is, what may merely cover the body, not what may please the fancy by the splendour of the attire; commonplace, so that it may not be thought remarkable for novelty of colour or fashion among other men of the same profession; and quite free from anxious carefulness, yet not discoloured by stains acquired through neglect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25201.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 1, Chapter 2"
