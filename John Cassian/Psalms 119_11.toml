[[commentary]]
quote='''
Take care too, when your riper age leads you to teach, lest you be led astray by the love of vainglory, and teach at random to the most impure persons these things which you have learnt not so much by reading as by the effects of experience, and so incur what Solomon, that wisest of men, denounced: "Attach not a wicked man to the pastures of the just, and be not led astray by the fulness of the belly," for "delicacies are not good for a fool, nor is there room for wisdom where sense is wanting: for folly is the more led on, because a stubborn servant is not improved by words, for even though he understands, he will not obey." And "Do not say anything in the ears of an imprudent man, lest haply he mock at thy wise speeches." And "give not that which is holy to dogs, neither east ye your pearls before swine, lest haply they trample them under foot and turn again and rend you." It is right then to hide the mysteries of spiritual meanings from men of this sort, that you may effectually sing: "Thy words have I hid within my heart: that I should not sin against Thee."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 17"
