[[commentary]]
quote='''
Finally even if there is any diminution of my purity of heart while I am living in the coenobium, I shall be satisfied by keeping in exchange that one precept of the Gospel, which certainly cannot be less esteemed than all those fruits of the desert; I mean that I should take no thought for the morrow, and submitting myself completely to the Abbot seem in some degree to emulate Him of whom it is said: "He humbled Himself, and became obedient unto death; and so be able humbly to make use of His words: "For I came not to do mine own will, but the will of the Father which sent me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F19.%2520Conference%2520of%2520Abbot%2520John.html'
source_title="Conference of Abbot John, Chapter 6"

[[commentary]]
quote='''
I Have heard while I have been in this district a thing which I shudder and am ashamed to recall; viz., that one of the juniors-when he was reproved by his Abbot because he had shown signs of throwing off the humility, of which he had made trial for a short time at his renunciation of the world, and of being puffed up with diabolical pride-most impertinently answered "Did I humiliate myself for a time on purpose to be always in subjection?" And at this wanton and wicked reply of his the elder was utterly aghast, and could say nothing, as if he had received this answer from old Lucifer himself and not from a man; so that he could not possibly utter a word against such impudence, but only let fall sighs and groans from his heart; turning over in silence in his mind that which is said of our Saviour: "Who being in the form of God humbled Himself and became obedient"-not, as the man said who was seized with a diabolical spirit of pride, "for a time," but "even to death."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252012.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 12, Chapter 28"
