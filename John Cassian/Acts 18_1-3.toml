[[commentary]]
quote='''
IN the Epistle to the Ephesians also he thus gives a charge on this subject of work, saying: "He that stole, let him now steal no more, but rather let him labour, working with his hands the thing that is good, that he may have something to give to him that suffereth need." And in the Acts of the Apostles too we find that he not only taught this, but actually practised it himself. For when he had come to Corinth, he did not permit himself to lodge anywhere except with Aquila and Priscilla, because they were of the same trade which he himself was accustomed to practise. For we thus read: "After this, Paul departing from Athens came to Corinth; and finding a certain Jew named Aquila, born in Pontus, and Priscilla his wife, he came to them because they were of the same trade; and abode with them, and worked: for they were tent-makers by trade."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 17"
