[[commentary]]
quote='''
But you must know that unclean spirits are obedient to men in two ways. For either they are by divine grace and power subject to the holiness of the faithful, or they are captivated by the sacrifices of sinners, and certain charms, and are flattered by them as their worshippers. And the Pharisees too were led astray by this notion and fancied that by this device even the Lord the Saviour gave commands to devils, and said "By Beelzebub the prince of the devils He casteth out devils," in accordance with that plan by which they knew that their own magicians and enchanters-by invoking his name and offering sacrifices, with which they know he is pleased and delighted-have as his servants power even over the devils who are subject to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 19"
