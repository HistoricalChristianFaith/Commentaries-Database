[[commentary]]
quote='''
For sometimes when a difference of opinion is expressed on one and the same subject, either view may be considered reasonable and be held without injury to the faith either firmly, or doubtfully, i.e., in such a way that neither is full belief nor absolute rejection accorded to it, and the second view need not interfere with the former, if neither of them is found to be opposed to the faith: as in this case: where Elias came in the person of John, and is again to be the precursor of the Lord's Advent: and in the matter of the "Abomination of desolation" which "stood in the holy place," by means of that idol of Jupiter which, as we read, was placed in the temple in Jerusalem, and which is again to stand in the Church through the coming of Antichrist, and all those things which follow in the gospel, which we take as having been fulfilled before the captivity of Jerusalem and still to be fulfilled at the end of this world. In which matters neither view is opposed to the other, nor does the first interpretation interfere with the second.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 4"
