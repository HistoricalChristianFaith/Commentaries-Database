[[commentary]]
quote='''
And this was clearly shown of Rahab of Jericho, and the patriarch Jacob; the former of whom could only escape death by means of this remedy, while the latter could not secure the blessing of the first-born without it. For God is not only the Judge and inspector of our words and actions, but He also looks into their purpose and aim. And if He sees that anything has been done or promised by some one for the sake of eternal salvation and shows insight into Divine contemplation, even though it may appear to men to be hard and unfair, yet He looks at the inner goodness of the heart and regards the desire of the will rather than the actual words spoken, because He must take into account the aim of the work and the disposition of the doer, whereby, as was said above, one man may be justified by means of a lie, while another may be guilty of a sin of everlasting death by telling the truth. Towhich end the patriarch Jacob also had regard when he was not afraid to imitate the hairy appearance of his brother's body by wrapping himself up in skins, and to his credit acquiesced in his mother's instigation of a lie for this object. For he saw that in this way there would be bestowed on him greater gains of blessing and righteousness than by keeping to the path of simplicity: for he did not doubt that the stain of this lie would at once be washed away by the flood of the paternal blessing, and would speedily be dissolved like a little cloud by the breath of the Holy Spirit; and that richer rewards of merit would be bestowed on him by means of this dissimulation which he put on than by means of the truth, which was natural to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 17"
