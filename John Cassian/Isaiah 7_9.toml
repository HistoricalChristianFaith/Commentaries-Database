[[commentary]]
quote='''
If however any more subtle inference of man's argumentation and reasoning seems opposed to this interpretation, it should be avoided rather than brought forward to the destruction of the faith (for we gain not faith from understanding, but understanding from faith, as it is written: "Except ye believe, ye will not understand" ) for how God works all things in us and yet everything can be ascribed to free will, cannot be fully grasped by the mind and reason of man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 18"
