[[commentary]]
quote='''
And Solomon, the wisest of men, clearly points to this fault of idleness in many passages, as he says: "He that followeth idleness shall be filled with poverty," either visible or invisible, in which an idle person and one entangled with different faults is sure to be involved, and he will always be a stranger to the contemplation of God, and to spiritual riches, of which the blessed Apostle says: "For in all things ye were enriched in him, in all utterance and in all knowledge."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 21"
