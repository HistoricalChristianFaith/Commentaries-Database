[[commentary]]
quote='''
So then there sprang from that system of which we have spoken another sort of perfection, whose followers are rightly termed anchorites; i.e., withdrawers, because, being by no means satisfied with that victory whereby they had trodden under foot the hidden snares of the devil, while still living among men, they were eager to fight with the devils in open conflict, and a straightforward battle, and so feared not to penetrate the vast recesses of the desert, imitating, to wit, John the Baptist, who passed all his life in the desert, and Elijah and Elisha and those of whom the Apostle speaks as follows: "They wandered about in sheepskins and goatskins, being in want, distressed, afflicted, of whom the world was not worthy, wandering in deserts, in mountains and in dens and in caves of the earth." Of whom too the Lord speaks figuratively to Job: "But who hath sent out the wild ass free, and who hath loosed his bands? To whom I have given the wilderness for an house, and a barren land for his dwelling. He scorneth the multitude of the city and heareth not the cry of the driver; he looketh round about the mountains of his pasture, and seeketh for every green thing."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 6"
