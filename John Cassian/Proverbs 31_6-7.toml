[[commentary]]
quote='''
But you will perhaps say: And to whom are the mysteries of Holy Scripture to be dispensed? Solomon, the wisest of men, shall teach you: "Give, says he, strong drink to those who are in sorrow, and give wine to drink, to those who are in pain, that they may forget their poverty, and remember their pain no more," i.e., to those who in consequence of the punishment of their past actions are oppressed with grief and sorrow, supply richly the joys of spiritual knowledge like "wine that maketh glad the heart of man," and restore them with the strong drink of the word of salvation, lest haply they be plunged in continual sorrow and a despair that brings death, and so those who are of this sort be "swallowed up in overmuch sorrow." But of those who remain in coldness and carelessness, and are smitten by no sorrow of heart we read as follows: "For one who is kindly and without sorrow, shall be in want."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 17"
