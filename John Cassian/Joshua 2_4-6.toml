[[commentary]]
quote='''
And so we ought to regard a lie and to employ it as if its nature were that of hellebore; which is useful if taken when some deadly disease is threatening, but if taken without being required by some great danger is the cause of immediate death. For so also we read that holy men and those most approved by God employed lying, so as not only to incur no guilt of sin from it, but even to attain the greatest goodness; and if deceitcould confer glory on them, what on the other hand would the truth have brought them but condemnation? Just as Rahab, of whom Scripture gives a record not only of no good deed but actually of unchastity, yet simply for the lie, by means of which she preferred to hide the spies instead of betraying them, had it vouchsafed to her to be joined with the people of God in everlasting blessing. But if she had preferred to speak the truth and to regard the safety of the citizens, there is no doubt that she and all her house would not have escaped the coming destruction, nor would it have beenvouchsafed to her to be inserted in the progenitors of our Lord's nativity, and reckoned in the list of the patriarchs, and through her descendants that followed, to become the mother of the Saviour of all. Again Dalila, who to provide for the safety of her fellow citizens betrayed the truth she had discovered, obtained in exchange eternal destruction, and has left to all men nothing but the memory of her sin. When then any grave danger hangs on confession of the truth, then we must take to lying as a refuge, yet in such a way as to be for our salvation troubled by the guilt of a humbled conscience. But where there is no call of the utmost necessity present, there a lie should be most carefully avoided as if it were something deadly: just as we said of a cup of hellebore which is indeed useful if it is only taken in the last resort when a deadly and inevitable disease is threatening, while if it is taken when the body is in a state of sound and rude health, its deadly properties at once go to find out the vital parts. And this was clearly shown of Rahab of Jericho, and the patriarch Jacob; the former of whom could only escape death by means of this remedy, while the latter could not secure the blessing of the first-born without it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 17"
