[[commentary]]
quote='''
The feebleness of your ideas shows that you have not yet renounced worldly desires nor mortified your former lusts. For as the wandering character of your desires testifies to the sloth of your heart, this pilgrimage and absence from your kinsfolk, which you ought rather to endure with your heart, you do endure only with the flesh. For all these things would have been buried and altogether driven out of your hearts, if you had got hold of the right method of renunciation, and the main reason for the solitude in which we dwell. And so I see that you are labouring under that infirmity of sluggishness, which is thus described in Proverbs: "Every sluggard is always desiring something;" and again: "Desires kill the slothful."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 2"
