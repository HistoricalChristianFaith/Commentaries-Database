[[commentary]]
quote='''
The feebleness of your ideas shows that you have not yet renounced worldly desires nor mortified your former lusts. For as the wandering character of your desires testifies to the sloth of your heart, this pilgrimage and absence from your kinsfolk, which you ought rather to endure with your heart, you do endure only with the flesh. For all these things would have been buried and altogether driven out of your hearts, if you had got hold of the right method of renunciation, and the main reason for the solitude in which we dwell. And so I see that you are labouring under that infirmity of sluggishness, which is thus described in Proverbs: "Every sluggard is always desiring something;" and again: "Desires kill the slothful."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 2"

[[commentary]]
quote='''
Of this evil of idleness Solomon thus makes mention again: "The ways of the idlers are strown with thorns;" i.e., with these and similar faults, which the Apostle above declared to spring from idleness. And again: "Every sluggard is always in want." And of these the Apostle makes mention when he says, "And that you want nothing of any man's." And finally: "For idleness has been the teacher of many evils:" which the Apostle has clearly enumerated in the passage which he expounded above: "Working not at all, but curiously meddling." To this fault also he joins another: "And that ye study to be quiet;" and then, "that ye should do your own business and walk honestly towards them that are without, and that you want nothing of any man's."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 21"
