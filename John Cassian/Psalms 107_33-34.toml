[[commentary]]
quote='''
And so he took his staff and scrip, as is there the custom for all monks starting on a journey, and himself led us as guide of our road to his own city, i.e., Panephysis, the lands of which and indeed the greater part of the neighbouring region (formerly an extremely rich one since from it, as report says, everything was supplied for the royal table), had been covered by the sea which was disturbed by a sudden earthquake and overflowed its banks, and so (almost all the villages being in ruins) covered what were formerly rich lands with salt marshes, so that you might think that what is spiritually sung in the psalm was a literal prophecy of that region. "He hath turned rivers into a wilderness; and the Springs of waters into a thirsty land: a fruitful land into saltness for the wickedness of them that dwell therein."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 3"
