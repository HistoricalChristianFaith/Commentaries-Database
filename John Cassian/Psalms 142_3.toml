[[commentary]]
quote='''
Nor does this malady endeavour to wound a man except through his virtues; introducing hindrances which lead to death by means of those very things through which the supplies of life are sought. For when men are anxious to walk in the path of holiness and perfection, the enemies do not lay their snares to deceive them anywhere except in the way along which they walk, in accordance with that saying of the blessed David: "In the way wherein I walked have they laid a snare for me;" that in this very way of virtue along which we are walking, when pressing on to "the prize of our high calling," we may be elated by our successes, and so sink down, and fall with the feet of our soul entangled and caught in the snares of vainglory. And so it results that those of us who could not be vanquished in the conflict with the foe are overcome by the very greatness of our triumph, or else (which is another kind of deception) that, overstraining the limits of that self-restraint which is possible to us, we fail of perseverance in our course on account of bodily weakness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252011.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 11, Chapter 6"
