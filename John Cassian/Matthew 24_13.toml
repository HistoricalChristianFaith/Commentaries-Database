[[commentary]]
quote='''
But rather take heed to continue even to the end in that state of nakedness of which you made profession in the sight of God and of his angels. In this humility too and patience, with which you persevered for ten days before the doors and entreated with many tears to be admitted into the monastery, you should not only continue but also increase and go forward. For it is too bad that when you ought to be carried on from the rudiments and beginnings, and go forward to perfection, you should begin to fall back from these to worse things. For not he who begins these things, but he who endures in them to the end, shall be saved.

For the subtle serpent is ever "watching our heel," that is, is lying in wait for the close, and endeavouring to trip us up right to the end of our life. And therefore it will not be of any use to have made a good beginning and to have eagerly taken the first step towards renouncing the world with all fervour, if a corresponding end does not likewise set it off and conclude it, and if the humility and poverty of Christ, of which you have now made profession in His sight, are not preserved by you even to the close of your life, as they were first secured. And that you may succeed in doing this, do you ever "watch his head," i.e. the first rise of thoughts, by bringing them at once to your superior. For thus you will learn to "bruise" his dangerous beginnings, if you are not ashamed to disclose any of them to your superior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25204.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 4, Chapters 36-37"
