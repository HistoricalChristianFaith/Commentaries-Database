[[commentary]]
quote='''
Do you ask also where for the good of those who were utterly ignorant of the law of God, he himself became as if without law? Read the introduction to his sermon at Athens where heathen wickedness was flourishing: "As I passed by," he says, "I saw your idols and an altar on which was written: To the unknown God;" and when he had thus started from their superstition, as if he himself also had been without law, under the cloke of that profane inscription he introduced the faith of Christ, saying: "What therefore ye ignorantly worship, that declare I unto you." And after a little, as if he had known nothing whatever of the Divine law, he chose to bring forward a verse of a heathen poet rather than a saying of Moses or Christ, saying: "As some also of your own poets have said: for we are also His offspring." And when he had thus approached them with their own authorities, which they could not reject, thus confirming the truth by things false, he added and said: "Since then we are the offspring of God we ought not to think that the Godhead is like to gold or silver or stone sculptured by the art and device of man."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 20"
