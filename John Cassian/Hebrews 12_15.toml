[[commentary]]
quote='''
For the other poisons of serpents, i.e., carnal sins and faults, in which human frailty is easily entangled and from which it is as easily purified, show some traces of their wounds in the flesh, whereby although the earthly body is most dangerously inflamed, yet if any charmer well skilled in divine incantations applies a cure and antidote or the remedy of words of salvation, the poisonous evil does not reach to the everlasting death of the soul. But the poison of envy as if emitted by the basilisk, destroys the very life of religion and faith, even before the wound is perceived in the body. For he does not raise himself up against men, but, in his blasphemy, against God, who carps at nothing in his brother except his felicity, and so blames no fault of man, but simply the judgment of God. This then is that "root of bitterness springing up" which raises itself to heaven and tends to reproaching the very Author Who bestows good things on man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 16"
