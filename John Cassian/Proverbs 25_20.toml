[[commentary]]
quote='''
For "as the moth injures the garment, and the worm the wood, so dejection the heart of man." With sufficient clearness and appropriateness has the Divine Spirit expressed the force of this dangerous and most injurious fault.

For the garment that is moth-eaten has no longer any commercial value or good use to which it can be put; and in the same way the wood that is worm-eaten is no longer worth anything for ornamenting even an ordinary building, but is destined to be burnt in the fire. So therefore the soul also which is a prey to the attacks of gnawing dejection will be useless for that priestly garment which, according to the prophecy of the holy David, the ointment of the Holy Spirit coming down from heaven, first on Aaron's beard, then on his skirts, is wont to assume: as it is said, "It is like the ointment upon the head which ran down upon Aaron's beard, which ran down to the skirts of his clothing. Nor can it have anything to do with the building or ornamentation of that spiritual temple of which Paul as a wise master builder laid the foundations, saying, "Ye are the temple of God, and the Spirit of God dwelleth in you:" and what the beams of this are like the bride tells us in the Song of Songs: "Our rafters are of cypress: the beams of our houses are of cedar." And therefore those sorts of wood are chosen for the temple of God which are fragrant and not liable to rot, and which are not subject to decay from age nor to be worm-eaten.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25209.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 9, Chapters 2-3"
