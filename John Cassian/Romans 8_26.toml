[[commentary]]
quote='''
Sometimes however the mind which is advancing to that perfect state of purity and which is already beginning to be established in it, will take in all these at one and the same time, and like some incomprehensible and all-devouring flame, dart through them all and offer up to God inexpressible prayers of the purest force, which the Spirit Itself, intervening with groanings that cannot be uttered, while we ourselves understand not, pours forth to God, grasping at that hour and ineffably pouring forth in its supplications things so great that they cannot be uttered with the mouth nor even at any other time be recollected by the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 15"

[[commentary]]
quote='''
For if we also remember these words of the Apostle that "we know not what to pray for as we ought" we shall see that we sometimes ask for things opposed to our salvation and that we are most providentially refused our requests by Him who sees what is good for us with greater right and truth than we can. And it is clear that this also happened to the teacher of the Gentiles when he prayed that the messenger of Satan who had been for his good allowed by the Lord's will to buffet him, might be removed, saying: "For which I besought the Lord thrice that he might depart from me. And He said unto me, My grace is sufficient for thee, for strength is made perfect in weakness."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 34"
