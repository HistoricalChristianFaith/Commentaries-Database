[[commentary]]
quote='''
Finally the occasion of the envy and seduction, which led him to deceive man, arose from the ground of his previous fall, in that he saw that man, who had but recently been formed out of the dust of the ground, was to be called to that glory, from which he remembered that he himself, while still one of the princes, had fallen. And so that first fall of his, which was due to pride, and which obtained for him the name of the serpent, was followed by a second owing to envy: and as this one found him still in the possession of something upright so that he could enjoy some interchange of conference and counsel with man, by the Lord's sentence he was very properly cast down to the lowest depth, that he might no longer walk as before erect, and looking up on high, but should cleave to the ground and creep along, and be brought low upon his belly and feed upon the earthly food and works of sins, and henceforward proclaim his secret hostility, and put between himself and man an enmity that is to our advantage, and a discord that is to our profit, so that while men are on their guard against him as a dangerous enemy, he can no longer injure them by a deceptive show of friendship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 10"
