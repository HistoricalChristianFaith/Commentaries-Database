[[commentary]]
quote='''
To the Galatians too, he testifies that when he was settling the division of the ministry of preaching with the apostles, he had arranged this with James, Peter, and John: that he should undertake the preaching to the Gentiles, but should never repudiate care and anxious thought for the poor who were at Jerusalem, who for Christ's sake gave up all their goods,and submitted to voluntary poverty. "And when they saw," said he, "the grace of God which was given to me, James and Cephas and John, who seemed to be pillars, gave to me and to Barnabas the right hand: of fellowship, that we should preach to the: Gentiles, but they to those of the circumcision: only they would that we should be mindful of the poor." A matter which he testifies that he attended to most carefully, saying, "which also I was anxious of myself to do."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25207.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 7, Chapter 17"
