[[commentary]]
quote='''
Abraham: Sometimes we see bad precedents taken from good things. For if a man ventures to do the same thing as another, but not with the same mind and purpose, or not with equal goodness, he will immediately fall into the snares of deception and death through the very things from which others gain the fruit of eternal life: As that strong armed lad matched with the warlike giant in the combat would certainly have found, if he had been clad in the heavy armour of Saul fit only for men; and that by which one of stronger age would have laid low countless hosts of foes, would only have brought certain danger to the stripling, had he not with prudent discretion chosen the sort of weapons suitable to his youth, and armed himself against his foul foe not with breastplate and shield, with which he saw that others were equipped, but with those weapons with which he was able to fight. Wherefore it is right for each one of us first to consider carefully the measure of his powers and in accordance with its limits, to choose what system he pleases, because though all are good, yet all things cannot be fit for all men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 8"
