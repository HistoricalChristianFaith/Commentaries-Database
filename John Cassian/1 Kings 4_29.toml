[[commentary]]
quote='''
The hearts then should be enlarged and openedwide, lest they be confined in the narrow straits of cowardice, and be filled with the swelling surge of wrath, and so we become unable to receive what the prophet calls the "exceeding broad" commandment of God in our narrow heart, or to say with the prophet: "I have run the way of thy commandments for thou hast enlarged my heart." For that long-suffering is wisdom we are taught by very clear passages of Scripture: for "a man who is long-suffering is great in prudence; but a coward is very foolish." And therefore Scripture says of him who to his credit asked the gift of wisdom from the Lord: "God gave Solomon wisdom and prudence exceeding much, and largeness of heart as the sand of the sea for multitude."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 27"
