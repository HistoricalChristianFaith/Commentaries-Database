[[commentary]]
quote='''
And to produce something still plainer, even the vital precepts of the law itself, which are said to have been "given byangels by the the hand of a mediator," and of which the same Apostle says: "So the law indeed is holy and the commandment is holy and just and good," when they are compared with the perfection of the gospel are pronounced anything but good by the Divine oracle: for He says: "And I gave them precepts that were not good, and ordinances whereby they should not live in them." The Apostle also affirms that the glory of the law is so dimmed by the light of the New Testament that he declares that in comparison with the splendour of the gospel it is not to be considered glorious, saying: "For even that which was glorious was not glorified by reason of the glory that excelleth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F23.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The Third Conference of Abbot Theonas, Chapter 4"
