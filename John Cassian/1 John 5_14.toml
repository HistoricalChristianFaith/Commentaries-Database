[[commentary]]
quote='''
Let us then not be at all cast down by despair from the confidence of this faith of ours, even when we fancy that we are far from having obtained what we prayed for, and let us not have any doubts about the Lord's promise where He says: "All things, whatsoever ye shall ask in prayer believing, ye shall receive." For it is well for us to consider this saying of the blessed Evangelist John, by which the ambiguity of this question is clearly solved: "This is," he says, "the confidence which we have in Him, that whatsoever we ask according to His will, He heareth us." He bids us then have a full and undoubting confidence of the answer only in those things which are not for our own advantage or for temporal comforts, but are in conformity to the Lord's will. And we are also taught to put this into our prayers by the Lord's Prayer, where we say "Thy will be done,"-Thine not ours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 34"
