[[commentary]]
quote='''
And so then we see that from the beginning God created everything perfect, nor would there have been need for anything to have been added to His original arrangement-as if it were shortsighted and imperfect-if everything had continued in that state and condition in which it had been created by Him. And therefore in the case of those who sinned before the law and even before the flood we see that God visited them with a righteous judgment, because they deserved to be punished without any excuse, for having transgressed the law of nature; nor should we fall into the blasphemous slanders of those who are ignorant of this reason, and so depreciate the God of the Old Testament, and run down our faith, and say with a sneer: Why then did it please your God to will to promulgate the law after so many thousand years, While He suffered such long ages to pass without any law? But if He afterwards discovered something better, then it appears that at the beginning of the world His wisdom was inferior and poorer, and that afterwards as if taught by experience He began to provide for something better, and to amend and improve His original arrangements. Athing which certainly cannot happen to the infinite foreknowledge of God, nor can these assertions be made about Him by the mad folly of heretics without grievous blasphemy, as Ecclesiastes says: "I have learnt that all the words which God hath made from the beginning shall continue forever: nothing can be added to them, and nothing can be taken away from them," and therefore "the law is not made for the righteous, but for the unrighteous, and insubordinate, for the ungodly and sinners, for the wicked and profane." For as they had the sound and complete system of natural laws implanted in them they had no need of this external law in addition, and one committed to writing, and what was given as an aid to that natural law. From which we infer by the clearest of reasonings that that law committed to writing need not have been given at the beginning (for it was unnecessary for this to be done while the natural law still remained, and was not utterly violated) nor could evangelical perfection have been granted before the law had been kept.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 24"

[[commentary]]
quote='''
By this law of Lent then the man who is upright and perfect is not restrained nor is he content with merely submitting to that paltry rule which the heads of the church have established for those who all the year round are involved in pleasure or business, that they may be bound by this legal requirement and forced at any rate during these days to find time for the Lord, and dedicate to Him the tithe of the days of their life, all of which they would have consumed as their profits. But the righteous, for whom the law is not appointed, and who devote to spiritual duties not a small part; viz., the tenth, but the whole time of their life, because they are free from the burden of tithes according to law, for his reason, if any worthy and pious occasion happening to them constrains them, are ready to relax their station fast without any hesitation. For in their case it is no paltry tithe that is diminished, as they offer all that they have to the Lord equally with themselves. And this certainly a man could not do without being guilty of a grievous wrong, who, offering nothing of his own free will to God, is forced to pay his tithes by the stern compulsion of the law which takes no excuse. Wherefore it is clearly established that the servant of the law cannot be perfect, who only shuns those things which are forbidden and does those things which are commanded, but that those are really perfect who do not take advantage even of those things which the law allows. And in this way, though it is said of the Mosaic law that "the law brought nothing to perfection," we read that some of the saints in the Old Testament were perfect because they went beyond the commands of the law and lived under the perfection of the Gospel: "Knowing that the law is not appointed for the righteous but for the unrighteous and disobedient, for the ungodly and sinners, for the wicked and defiled, etc."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 29"
