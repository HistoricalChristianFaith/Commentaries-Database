[[commentary]]
quote='''
Above all, considering the state of our weak and shifty nature, let us beware lest the day of the Lord come upon us as a thief in the night, and find our conscience defiled even by a single penny; for this would make void all the fruits of our renunciation of the world, and cause that which was said to the rich man in the gospel to be directed towards us also by the voice of the Lord: "Thou fool, this night thy soul shall be required of thee: then whose shall those things be which thou hast prepared?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25207.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 7, Chapter 30"
