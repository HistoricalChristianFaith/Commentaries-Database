[[commentary]]
quote='''
Further we are more fully taught by other passages of Scripture as well that we neither can nor should carry out everything which we determine either with peace or disturbance of mind, as we often hear that holy men and angels and even Almighty God Himself have changed what they had decided upon. For the blessed David determined and confirmed it by an oath, saying: "May God do so and add more to the foes of David if I leave of all that belong unto Nabal until the morning a single male." And presently when Abigail his wife interceded and intreated for him, he gave up his threats, lightened the sentence, and preferred to be regarded as a breaker of his word rather than to keep his pledged oath by cruelly executing it, saying: "As the Lord liveth, if thou hadst not quickly come to meet me there had not been left to Nabal by the morning light a single male." And as we do not hold that his readiness to take a rash oath (which resulted from his anger and disturbance of mind) ought to be copied by us, so we do think that the pardon and revision of his determination is to be followed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 25"
