[[commentary]]
quote='''
To the Corinthians also he shows the same anxiety about this, and urges them the more diligently to prepare before his arrival a collection, which he was intending to send for their needs. "But concerning the collection for the saints, as I appointed to the churches of Galatia, so also do ye. Let each one of you on the first day of the week put apart with himself, laying up what it shall well please him, that when I come the collections be not then to be made. But when I come whomsoever you shall approve by your letters, themI will send to carry your grace to Jerusalem."And that he may stimulate them to make a larger collection, he adds, "But if it be meet that I also go, they shall go with me:" meaning if your offering is of such a character as to deserve to be taken there by my ministration.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25207.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 7, Chapter 17"
