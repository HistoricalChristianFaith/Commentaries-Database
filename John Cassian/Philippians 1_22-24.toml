[[commentary]]
quote='''
Further we confidently assert that even the Apostle Paul himself who surpassed in the number of his sufferings the toils of all the saints, could not possibly fulfil this, as he himself testifies to the disciples in the Acts of the Apostles: "Ye yourselves know that these hands have ministered to my needs, and to the needs of those who were with me," or when in writing in the Thessalonians he testifies that he "worked in labour and weariness night and day." And although for this there were great rewards for his merits prepared, yet his mind, however holy and sublime it might be, could not help being sometimes drawn away from that heavenly contemplation by its attention to earthly labours. Further, when he saw himsetf enriched with such practical fruits, and on theother hand considered in his heart the good of meditation, and weighed as it were in one scale the profit of all these labours and in the other the delights of divine contemplation, when for a long time he had corrected the balance in his breast, while the vast rewards for his labours delighted him on one side, and on the other the desire for unity with and the inseparable companionship of Christ inclined him to depart this life, at last in his perplexity he cries out and says: "What I shall choose I know not. For I am in a strait betwixt two, having a desire to depart and to be with Christ, for it were much better: but to abide in the flesh is more necessary for your sakes." Though then in many ways he preferred this excellent good to all the fruits of his preaching, yet he submits himself in consideration of love, without which none can gain the Lord; and for their sakes, whom hitherto he had soothed with milk as nourishment from the breasts of the gospel, does not refuse to be parted from Christ, which is bad for himself though useful for others. For he is driven to choose this the rather by that excessive goodness of his whereby for the salvation of his brethren he is ready, were it possible, to incur even the last evil of an Anathema. "For I could wish," he says, "that I myself were Anathema from Christ for my brethren's sake, who are my kinsmen according to the flesh, who are Israelites," i.e., I could wish to be subject not only to temporal, but even to perpetual punishment, if only all men, were it possible, might enjoy the fellowship of Christ: for I am sure that the salvation of all would be better for Christ and for me than my own. That then the Apostle might perfectly gain this chief good, i.e., to enjoy the vision of God and to be joined continually to Christ, he was ready to be parted from this body, which as it is feeble and hindered by the many requirements of its frailties cannot help separating from union with Christ: for it is impossible for the mind, that is harassed by such frequent cares, and hampered by such various and tiresome troubles, always to enjoy the Divine vision.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F23.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The Third Conference of Abbot Theonas, Chapter 5"
