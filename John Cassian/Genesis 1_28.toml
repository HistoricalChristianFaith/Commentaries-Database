[[commentary]]
quote='''
Joseph: All liberty in the matter of wives and many concubines, as the end of time is approaching and the multiplying of the human race completed, ought rightly to be cut off by evangelical perfection, as being no longer necessary. For up to the coming of Christ it was well that the blessing of the original sentence should be in full vigour, whereby it was said: "Increase and multiply, and fill the earth." And therefore it was quite right that from the root of human fecundity which happily flourished in the synagogue, in accordance with that dispensation of the times, the buds of angelical virginity should spring, and the fragrant flowers of continence be produced in the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 19"
