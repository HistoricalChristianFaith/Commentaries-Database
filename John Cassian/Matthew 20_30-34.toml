[[commentary]]
quote='''
And this same fact we see is plainly taught in the healing of the blind men. For the fact that Jesus passed by them, was a free gift of Divine providence and condescension. But the fact that they cried out and said "Have mercy on us, Lord, thou son of David," was an act of their own faith and belief. That they received the sight of their eyes was a gift of Divine pity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 19"
