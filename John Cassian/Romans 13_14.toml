[[commentary]]
quote='''
But the reason why that nation in which the children of Israel were born, was biddennot to be utterly destroyed but only to have its land forsaken, while it was commanded that these seven nations were to be completely destroyed, is this: because however great may be the ardour of spirit, inspired by which we have entered on the desert of virtues, yet we cannot possibly free ourselves entirely from the neighbourhood of gluttony or from its service and, so to speak, from daily intercourse with it. For the liking for delicacies and dainties will live on as something natural and innate in us, even though we take pains to cut off all superfluous appetites and desires, which, as they cannot be altogether destroyed, ought to be shunned and avoided. For of these we read "Take no care for the flesh with its desires." While then we still retain the feeling for this care, which we are bidden not altogether to cut off, but to keep without its desires, it is clear that we do not destroy the Egyptian nation but separate ourselves in a sort of way from it, not thinking anything about luxuries and delicate feasts, but, as the Apostle says, being "content with our daily food and clothing." And this is commanded in a figure in the law, in this way: "Thou shalt not abhor the Egyptian, because thou wast a stranger in his land." For necessary food is not refused to the body without danger to it and sinfulness in the soul. But of those seven troublesome faults we must in every possible way root out the affections from the inmost recesses of our souls. For of them we read: "Let all bitterness and anger and indignation and clamour and blasphemy be put away from you with all malice:" and again:"But fornication and all uncleanness and covetousness let it not so much as be named among you, or obscenity orfoolish talking or scurrility." We can then cut out the roots of these faults which aregrafted into our nature from without whilewe cannot possibly cut off occasions of gluttony. For however far we have advanced, we cannot help being what we were born. And that this is so we can show not only from the lives of little people like ourselves but from the lives and customs of all who have attained perfection, who even when they have got rid of incentives to all other passions, and are retiring to the desert with perfect fervour of spirit and bodily abnegation, yet still cannot do without thought for their daily meal and the preparation of their food from year to year.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 19"

[[commentary]]
quote='''
And so it is a very true and most excellent saying of the Fathers that the right method of fasting and abstinence lies in the measure of moderation and bodily chastening; and that this is the aim of perfect virtue for all alike, viz.: that though we are still forced to desire it, yet we should exercise self-restraint in the matter of the food, which we are obliged to take owing to the necessity of supporting the body. For even if one is weak in body, he can attain to a perfect virtue and one equal to that of those who are thoroughly strong and healthy, if with firmness of mind he keeps a check upon the desires and lusts which are not due to weakness of the flesh. For the Apostle says: "And take not care for the flesh in its lusts." He does not forbid care for it in every respect: but says that care is not to be taken in regard to its desires and lusts. He cuts away the luxurious fondness for the flesh: he does not exclude the control necessary for life: he does the former, lest through pampering the flesh we should be involved in dangerous entanglements of the desires; the latter lest the body should be injured by our fault and unable to fulfil its spiritual and necessary duties.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25205.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 5, Chapter 8"
