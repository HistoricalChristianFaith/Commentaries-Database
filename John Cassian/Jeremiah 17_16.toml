[[commentary]]
quote='''
For it is but little for a monk to have once made his renunciation, i.e., in the early days of his conversion to have disregarded the present world, unless he continues to renounce it daily. For to the very end of this life we must with the prophet say this: "And I have not desired the day of man, Thou knowest." Wherefore also the Lord says in the gospel: "If any man will come after Me, let him deny himself and take up his cross daily and follow Me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 2"
