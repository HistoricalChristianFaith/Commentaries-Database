[[commentary]]
quote='''
And if to anyone relying on the help of God and not on his own efforts, it has been vouch-safed to acquire this state, from the condition of a Servant, wherein is fear, and from a mercenary greed of hope, whereby there is sought not so much the good of the donor as the recompense of reward, he will begin to pass on to the adoption of sons, where there is no longer fear, nor greed, but that love which never faileth continually endures. Of which fear and love the Lord in chiding some shows what is befitting for each one: "A son knoweth his own father, and a servant feareth his lord: And if I be a Father, where is My honour: and if I be a Lord, where is my fear?" For one who is a servant must needs fear because "if knowing his lord's will he has done things worthy of stripes, he shall be beaten with many stripes."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 9"

[[commentary]]
quote='''
And therefore there is a twofold stage of fear. The one for beginners, i.e., for those who are still subject to the yoke and to servile terror; of which we read: "And the servant shall fear his Lord;" and in the gospel: "I no longer call you servants, for the servant knoweth not what his Lord doeth;" and therefore "the servant," He tells us, "abideth not in the house for ever, but the Son abideth for ever." For He is instructing us to pass on from that penal fear to the fullest freedom of love, and the confidence of the friends and sons of God. Finally the blessed Apostle, who had by the power of the Lord's love already passed through the servile stage of fear, scorns lower things and declares that he has been enriched with good things by the Lord, "for God hath not given us" he says "a spirit of fear but of power and of love and of a sound mind." Those also who are inflamed with a perfect love of their heavenly Father, and whom the Divine adoption has already made sons instead of servants, he addresses in these words: "For ye have not received the spirit of bondage again to fear, but ye received the spirit of adoption, whereby we cry, Abba, Father." It is of this fear too, that the prophet spoke when he would describe that sevenfold spirit, which according to the mystery of the Incarnation, full surely descended on the God man: "And there shall rest upon Him the Spirit of the Lord: the Spirit of wisdom and of understanding, the Spirit of counsel and of might, the Spirit of knowledge and of true godliness," and in the last place he adds as something special these words: "And the Spirit of the fear of the Lord shall fill Him." Where we must in the first place notice carefully that he does not say "and there shall rest upon Him the Spirit of fear," as he said in the earlier cases, but he says "there shall fill Him the Spirit of the fear of the Lord." For such is the greatness of its richness that when once it has seized on a man by its power, it takes possession not of a portion but of his whole mind. And not without good reason. For as it is closely joined to that love which "never faileth," it not only fills the man, but takes a lasting and inseparable and continual possession of him in whom it has begun, and is not lessened by any allurements of temporal joy or delights, as is sometimes the case with that fear which is cast out. This then is the fear belonging to perfection, with which we are told that the God-man, who came not only to redeem mankind, but also to give us a pattern of perfection and example of goodness, was filled. For the true Son of God "who did no sin neither was guile found in His mouth," could not feel that servile fear of punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F11.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The First Conference of Abbot Chaeremon, Chapter 13"
