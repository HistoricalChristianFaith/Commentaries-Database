[[commentary]]
quote='''
It prevents therefore the will of man, for it is said: "My God will prevent me with His mercy;" and again when God waits and for our good delays, that He may put our desires to the test, our will precedes, for it is said: "And in the morning my prayer shall prevent Thee;" and again: "I prevented the dawning of the day and cried;" and: "Mine eyes have prevented the morning."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 12"
