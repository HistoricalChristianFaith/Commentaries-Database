[[commentary]]
quote='''
But concerning visible and worthless riches Peter says to the Lord: "Lo, we have left all and followed thee. What shall we have therefore?" when it is clear that they had left nothing but their miserable broken nets. And unless this expression "all" is understood to refer to that renunciation of sins which is really great and important, we shall not find that the Apostles had left anything of any value, or that the Lord had any reason for bestowing on them the blessing of so great glory, that they were allowed to hear from Him that "in the regeneration, when the Son of Man shall sit on the throne of His glory, ye also shall sit upon twelve thrones judging the twelve tribes of Israel."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 10"
