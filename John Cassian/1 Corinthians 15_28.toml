[[commentary]]
quote='''
Moreover also: "the kingdom of heaven suffereth violence and the violent take it by force," for no virtue is acquired without effort, nor can anyone attain to that mental stability which he desires without great sorrow of heart, for "man is born to trouble," and in order that he may be able to attain to "the perfect man, the measure of the stature of the fulness of Christ" he must ever be on the watch with still greater intentness, and toil with ceaseless carefulness. But to the fulness of this measure no one will ever attain, but one Who has considered it beforehand and been trained to it now and has had some foretaste of it while still in this world, and being marked a most precious member of Christ, has possessed in the flesh an earnest of that "joint" by which he can be united to His body: desiring one thing alone, thirsting for but one thing, ever bringing not only his acts but even his thoughts to bear on one thing alone; viz., that he may even now keep as an earnest that which is said of the blessed life of thesaints hereafter; viz., that "God may be" to him "all in all."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 6"

[[commentary]]
quote='''
And as our Lord wished to establish this and to leave us examples of perfect purity, although He Himself, the very fount of inviolable sanctity, had no need of external help and the assistance of solitude in order to secure it (for the fulness of purity could not be soiled by any stain from crowds, nor could He be contaminated by intercourse with men, who cleanses and sanctifies all things that are polluted) yet still He retired into the mountain alone to pray, thus teaching us by the example of His retirement that if we too wish to approach God with a pure and spotless affection of heart, we should also retire from all the disturbance and confusion of crowds, so that while still living in the body we I may manage in some degree to adapt ourselves to some likeness of that bliss which is promised hereafter to the saints, and that "God may be" to us "all in all."

For then will be perfectly fulfilled in our case that prayer of our Saviour in which He prayed for His disciples to the Father saying "that the love wherewith Thou lovedst Me may be in them and they in us;" and again: "that they all may be one as Thou, Father, in Me and I in Thee, that they also may be one in us," when that perfect love of God, wherewith" He first loved us" has passed into the feelings of our heart as well, by the fulfilment of this prayer of the Lord which we believe cannot possibly be ineffectual. And this will come to pass when God shall be all our love, and every desire and wish and effort, every thought of ours, and all our life and words and breath, and that unity which already exists between the Father and the Son, and the Son and the Father, has been shed abroad in our hearts and minds, so that as He loves us with a pure and unfeigned and indissoluble love, so we also may be joined to Him by a lasting and inseparable affection, since we are so united to Him that whatever we breathe or think, or speak is God, since, as I say, we attain to that end of which we spoke before, which the same Lord in His prayer hopes may be fulfilled in us: "that they all may be one as we are one, I in them and Thou in Me, that they also may be made perfect in one;" and again: "Father, those whom Thou hast given Me, I will that where I am, they may also be with Me." This then ought to be the destination of the solitary, this should be all his aim that it may be vouchsafed to him to possess even in the body an image of future bliss, and that he may begin in this world to have a foretaste of a sort of earnest of that celestial life and glory. This, I say, is the end of all perfection, that the mind purged from all carnal desires may daily be lifted towards spiritual things, until the whole life and all the thoughts of the heart become one continuous prayer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F10.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The Second Conference of Abbot Isaac, Chapters 6-7"
