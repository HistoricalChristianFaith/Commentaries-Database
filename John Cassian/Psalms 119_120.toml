[[commentary]]
quote='''
Renunciation is nothing but the evidence of the cross and of mortification. And so you must know that to-day you are dead to this world and its deeds and desires, and that, as the Apostle says, you are crucified to this world and this world to you. Consider therefore the demands of the cross under the sign of which you ought henceforward to live in this life; because you no longer live but He lives in you who was crucified for you. We must therefore pass our time in this life in that fashion and form in which He was crucified for us on the cross so that (as David says) piercing our flesh with the fear of the Lord, we may have all our wishes and desires not subservient to our own lusts but fastened to His mortification. For so shall we fulfil the command of the Lord which says: "He that taketh not up his cross and followeth me is not worthy of me." But perhaps you will say: How can a man carry his cross continually? or how can any one who is alive be crucified? Hear briefly how this is.

The fear of the Lord is our cross. As then one who is crucified no longer has the power of moving or turning his limbs in any direc- tion as he pleases, so we also ought to affix our wishes and desires-not in accordance with what is pleasant and delightful to us now, but in accordance with the law of the Lord, where it constrains us. And as he who is fastened to the wood of the cross no longer considers things present, nor thinks about his likings, nor is perplexed by anxiety and care for the morrow, nor disturbed by any desire of possession, nor inflamed by any pride or strife or rivalry, grieves not at present injuries, remembers not past ones, and while he is still breathing in the body considers that he is deadto all earthly things, sending the thoughts of his heart on before to that place whither he doubts not that he is shortly to come: so we also, when crucified by the fear of the Lord ought to be dead indeed to all these things, i.e.not only to carnal vices but also to all earthly things, having the eye of our minds fixed therewhither we hope at each moment that we are soon to pass. For in this way we can have all our desires and carnal affections mortified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25204.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 4, Chapters 34-35"
