[[commentary]]
quote='''
Finally the blessed Apostle when revolving in his mind this manifold bounty of God's providence, as he sees that he has fallen into some vast and boundless ocean of God's goodness, exclaims: "O the depth of the riches of the wisdom and knowledge of God! How inscrutable are the judgments of God and His ways past finding out! For who hath known the mind of the Lord?" Whoever then imagines that he can by human reason fathom the depths of that inconceivable abyss, will be trying to explain away the astonishment at that knowledge, at which that great and mighty teacher of the gentiles was awed. For if a man thinks that he can either conceive in his mind or discuss exhaustively the dispensation of God whereby He works salvation in men, he certainly impugns the truth of the Apostle's words and asserts with profane audacity that His judgments can be scrutinized, and His ways searched out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 17"
