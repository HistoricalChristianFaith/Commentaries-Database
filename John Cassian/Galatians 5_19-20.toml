[[commentary]]
quote='''
And although the blessed Apostle says generallythat all faults are carnal, since he enumerates enmities and anger and heresies among other works of the flesh, yet in order to cure them and to discover their nature more exactly we make a twofold division of them: for we call some of them carnal, and some spiritual. And those we call carnal, which specially have to do with pampering the appetites of the flesh, and with which it is so charmed and satisfied, that sometimes it excites the mind when at rest and even drags it against its will to consent to its desire. Of which the blessed Apostle says: "In which also we all walked in time past in the desires of our flesh, fulfilling the will of the flesh and of our thoughts, and were by nature children of wrath even as the rest." But we call those spiritual which spring only from the impulse of the mind andnot merely contribute no pleasure to the flesh, but actually bring on it a weakness that is harmful to it, and only feed a diseased mind with the food of a most miserable pleasure. And therefore these need a single medicine for the heart: but those which are carnal can only be cured, as we said, by a double remedy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 4"
