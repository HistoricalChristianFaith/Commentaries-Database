[[commentary]]
quote='''
To the same effect also is this which the Apostle says: "Therefore let him that thinketh he standeth, take heed lest he fall. There hath no temptation taken you but such as is common to man. But God is faithful, who will not suffer you to be tempted above that ye are able, but will with the temptation make also a way of escape that ye may be able to bear it." For when he says "Let him that standeth take heed lest he fall" he sets free will on its guard, as he certainly knew that, after grace had been received, it could either stand by its exertions or fall through carelessness. But when he adds: "there hath no temptation taken you but what is common to man" he chides their weakness and the frailty of their heart that is not yet strengthened, as they could not yet resist the attacks of the hosts of spiritual wickedness, against which he knew that he and those who were perfect daily fought; of which also he says to the Ephesians: "For we wrestle not against flesh and blood, but against principalities, against powers, against the world-rulers of this darkness, against spiritual wickedness in heavenly places." But when he subjoins: "But God is faithful who will not suffer you to be tempted above that ye are able," he certainly is not hoping that the Lord will not suffer them to be tempted, but that they may not be tempted above what they are able to bear. For the one shows the power of man's will, the other denotes the grace of the Lord who moderates the violence of temptations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 14"
