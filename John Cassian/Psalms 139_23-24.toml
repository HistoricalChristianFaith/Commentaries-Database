[[commentary]]
quote='''
When then anyone discovers by those signs which we described above, that he is attacked by outbreaks of impatience or anger, he should always practise himself in the opposite and contrary things, and by setting before himself all sorts of injuries and wrongs, as if offered to him by somebody else, accustom his mind to submit with perfect humility to everything that wickedness can bring upon him; and by often representing to himself all kinds of rough and intolerable things, continually consider with all sorrow of heart with what gentleness he ought to meet them. And, by thus looking at the sufferings of all the saints, or indeed at those of the Lord Himself, he will admit that the various reproaches as well as punishments are less than he deserves, and prepare himself to endure all kinds of griefs. And when occasionally he has been recalled by so, me invitation to the assembly of the brethren-a thing which cannot but happen every now and then even to the strictest inmates of the desert,-if he finds that his mind is silently disturbed even for trifles, he should like some stern censor of his secret emotions charge himself with all those various hard wrongs, to theperfect endurance of which he was training himself by his daily meditations, and blaming and chiding himself as follows, say My good man, are you the fellow who while training yourself in the practising ground of solitude, ventured most determinedly to think that you would get the better of all bad qualities, and who just now, when you were representing to yourself not only all sorts of bitter reproaches, but also intolerable punishments, fancied that you were pretty strong and able to stand against all storms? How is it that that unconquered patience of yours is upset by the first trial even of a light word? How is it that even a gentle breeze has shaken that house of yours which you fancied was built so strongly on the solid rock? Where is that which you announced when during a time of peace you were in your foolish confidence longing for war? "I am ready, and am not troubled;" and this which you used often to say with the prophet: "Prove me, 0 Lord, and try me: search out my reins and my heart;" and: "prove me, 0 Lord, and know my heart: question me and know my paths; and see if there be any way of wickedness in me." How has a tiny ghost of an enemy frightened your grand preparations for war? With such reproaches and remorse a man should condemn himself and not allow the sudden temptation which has upset him to go unpunished, but by chastising his flesh with a severer penalty of fasting and vigils; and, by punishing his sin of lightness of mind by continual pains of self-restraint, he should while living in solitude consume in this fire of practice what he ought to have thoroughly driven out in the life of the coenobium.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F19.%2520Conference%2520of%2520Abbot%2520John.html'
source_title="Conference of Abbot John, Chapter 14"
