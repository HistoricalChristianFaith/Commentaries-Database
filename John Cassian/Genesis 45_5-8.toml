[[commentary]]
quote='''
Joseph is sold by the envy of his brethren, in order to bring about the descent of the children of Israel into Egypt, and that while they were contemplating the death of their brother provision might be made for them against the famine to come: as Joseph shows when he makes himSelf known to his brethren and says: "Fear not, neither let it be grievous unto you that ye sold me into these parts: for for your salvation God sent me before you;" and below: "For God sent me before that ye might be preserved upon the earth and might have food whereby to live. Not by your design was I sent but by the will of God, who has made me a father to Pharaoh and lord of all his house, and chief over all the land of Egypt." And when his brethren were alarmed after the death of his father, he removed their suspicions and terror by saying: "Fear not: Can ye resist the will of God? You imagined evil against me but God turned it into good, that He might exalt me, as ye see at the present time, that He might save much people." And that this was brought about providentially the blessed David likewise declared saying in the hundred and fourth Psalm: "And He called for a dearth upon the land: and brake all the staff of bread. He sent a man before them: Joseph was sold for a slave."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 11"
