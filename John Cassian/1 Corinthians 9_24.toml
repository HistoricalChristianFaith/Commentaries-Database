[[commentary]]
quote='''
Further that the grandeur of perfection was open to every age and either sex, and that all the members of the Church were urged to scale the heights of heavenly goodness when the Apostle said: "So run that ye may obtain;" nor should those who were ready and eager for it hang back because of the delays of the slow and dawdlers, as it is better for the sluggards to be urged on by those running before than for those who are doing their best to be hampered by the slothful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 9"
