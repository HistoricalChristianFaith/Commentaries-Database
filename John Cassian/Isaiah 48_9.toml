[[commentary]]
quote='''
But in one matter vainglory is found to be a useful thing for beginners. I mean by those who are still troubled by carnal sins, as for instance, if, when they are troubled by the spirit of fornication, they formed an idea of the dignity of the priesthood, or of reputation among all men, by which they maybe thought saints and immaculate: and so with these considerations they repell the unclean suggestions of lust, as deeming them base and at least unworthy of their rank and reputation; and so by means of a smaller evil they overcome a greater one. For it is better for a man to be troubled by the sin of vainglory than for him to fall into the desire for fornication, from which he either cannot recover at all or only with great difficulty after he has fallen. And this thought is admirably expressed byone of the prophets speaking in the person of God, and saying: "For My name's sake I will remove My wrath afar off: and with My praise I will bridle thee lest thou shouldest perish," i.e., while you are enchained by the praises of vainglory, you cannot possibly rush on into the depths of hell, or plunge irrevocably into the commission of deadly sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F5.%2520Conference%2520of%2520Abbot%2520Serapion.html'
source_title="Conference of Abbot Serapion, Chapter 12"
