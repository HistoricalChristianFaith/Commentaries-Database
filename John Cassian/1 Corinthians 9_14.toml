[[commentary]]
quote='''
The preacher of the gospel says that he has not eaten any man's bread for nought, as he knows that the Lord commanded that "they who preach the gospel should live of the gospel:" again, "The labourer is worthy of his meat." And so if he who preached the gospel, performing a work so lofty and spiritual, did not venture in reliance on the Lord's command to eat his bread for nought, what shall we do to whom not merely is there no preaching of the word intrusted, but no cure of souls except our own committed? with what confidence shall we dare with idle hands to eat our bread for nought, when the "chosen vessel," constrained by his anxiety for the gospel and his work of preaching, did not venture to eat without labouring with his own hands?
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%252010.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 10, Chapter 8"
