[[commentary]]
quote='''
So then when the sons of Seth at the instigation of their lust had transgressed that command which had been for a long while kept by a natural instinct from the beginning of the world, it was needful that it should afterwards be restored by the letter of the law: "Thou shalt not give thy daughter to his son to wife, nor shalt thou take a wife of his daughters to thy son; for they shall seduce your hearts to depart from your God, and to follow their gods and serve them."

Germanus: If that command had been given to them, then the sin of breaking it might fairly have been brought against them for their audacity in so marrying. But since the observance of that separation had not yet been established by any rule, how could that intermingling of races be counted wrong in them, as it had not been forbidden by any command? For a law does not ordinarily forbid crimes that are past, but those that are future.

Serenus: God at man's creation implanted in him naturally complete knowledge of the law, and if this had been kept by man, as at the beginning, according to the Lord's purposes, there would not have been any need for another law to be given, which He afterwards proclaimed in writing: for it were superfluous for an external remedy to be offered, where an internal one was still implanted and vigorous. But since this had been, as we have said, utterly corrupted by freedom and the opportunity of sinning, the severe restrictions of the law of Moses were added as the executor and vindicator of this (earlier law) and to use the expressions of Scripture, as its helper, that through fear of immediate punishment men might be kept from altogether losing the good of natural knowledge, according to the word of the prophet who says "He gave the law to help them:" and it is also described by the Apostle as having been given as a schoolmaster to little children, as it instructs and guards them to prevent them from departing through sheer forgetfulness from the teaching in which they had been instructed by the light of nature: for that the complete knowledge of the law was implanted in man at his first creation, is clearly proved from this; viz., that we know that before the law, aye, and even before the flood, all holy men observed the commands of the law without having the letter to read.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapters 21-23"
