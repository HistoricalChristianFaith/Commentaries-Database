[[commentary]]
quote='''
For a saint does not differ from a sinner in this, that he is not himself tempted in the same way, but because he is not worsted even by a great assault, while the other is overcome even by a slight temptation. For the fortitude of any good man would not, as we said, be worthy of praise, if his victory was gained without his being tempted, as most certainly there is no room for victory where there is no struggle and conflict: for "Blessed is the man that endureth temptation, for when he has been proved he shall receive the crown of life which God hath promised to them that love Him."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 13"
