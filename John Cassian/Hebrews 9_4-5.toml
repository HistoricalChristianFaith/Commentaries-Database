[[commentary]]
quote='''
Next you must by all means strive to get rid of all anxiety and worldly thoughts, and give yourself over assiduously or rather continuously, to sacred reading, until continual meditation fills your heart, and fashions you so to speak after its own likeness, making of it, in a way, an ark of the testimony, which has within it two tables of stone, i.e., the constant assurance of the two testaments; and a golden pot, i.e., a pure and undefiled memory which preserves by a constant tenacity the manna stored up in it, i.e., the enduring and heavenly sweetness of the spiritual sense and the bread of angels; moreover also the rod of Aaron, i.e., the saving standard of Jesus Christ our true High Priest, that ever buds with the freshness of immortal memory. For this is the rod which after it had been cut from the root of Jesse, died and flourished again with a more vigorous life. But all these are guarded by two Cherubim, i.e., the fulness of historical and spiritual knowledge. For the Cherubim mean a multitude of knowledge: and these continually protect the mercy seat of God, i.e., the peace of your heart, and overshadow it from all the assaults of spiritual wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 10"
