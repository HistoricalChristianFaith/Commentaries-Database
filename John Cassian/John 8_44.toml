[[commentary]]
quote='''
But as for this which disturbed you about the devil, that "he is a liar and his father," as if it seemed that he and his father were pronounced by the Lord to be liars, it is sufficiently ridiculous to imagine this even cursorily. For as we said a little while ago spirit does not beget spirit just as soul cannot procreate soul, though we do not doubt that the compacting of flesh is formed from man's seed, as the Apostle clearly distinguishes in the case of both substances; viz., flesh and spirit, what should be ascribed to whom as its author, and says: "Moreover we have had fathers of our flesh for instructors, and we reverenced them: shall we not much more be in subjection to the Father of spirits and live? " What could show more clearly than this distinction, that he laid down that men were the fathers of our flesh, but always taught that God alone was the Father of souls. Although even in the actual compacting of this body a ministerial office alone must be attributed to men, but the chief part of its formation to God the Creator of all, as David says: "Thy hands have made me and fashioned me:" And the blessed Job: "Hast thou not milked me as milk, and curdled me as cheese? Thou hast put me together with bones and sinews;" and the Lord to Jeremiah: "Before I formed thee in the womb, I knew thee." But Ecclesiastes very clearly and accurately gathers the nature of either substance, and its beginning, by an examination of the rise and commencement, from which each originated, and by a consideration of the end to which each is tending, and decides also of the division of this body and soul, and discourses as follows: "Before the dust returns to the earth as it was, and the spirit returns unto God who gave it." But what could be said with greater plainness than that he declares that the matter of the flesh which he styled dust, because it springs from the seed of man, and seems to be sown by his ministration, mush as it was taken from the earth, again return to the earth, while he points out that the spirit which is not begotten by intercourse between the sexes, but belongs to God alone in a special way, returns to its creator? And this also is clearly implied in that breathing by God, through which Adam in the first instance received his life. And so from these passages we clearly infer that no one can be called the Father of spirits but God alone, who makes them out of nothing whenever He pleases, while men can only be termed the fathers of our flesh. So then the devil also in as much as he was created a spirit or an angel and good, had no one as his Father but God his Maker. But when he had become puffed up by pride and had said in his heart: "I will ascend above the heights of the clouds, I will be like the Most High," he became a liar, and "abode not in the truth;" but brought forth a lie from his own storehouse of wickedness and so became not only a liar, but also the father of the actual lie, by which when he promised Divinity to man and said "Ye shall be as gods," he abode not in the truth, but from the beginning became a murderer, both by bringing Adam into a state of mortality, and by slaying Abel by the hand of his brother at his suggestion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F8.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="The Second Conference of Abbot Serenus, Chapter 25"
