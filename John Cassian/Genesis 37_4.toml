[[commentary]]
quote='''
But dia/qesij, i.e., affection is shown to but a few and those who are united to us by kindred dispositions or by a tie of goodness; though indeed affection seems to have many degrees of difference. For in one way we love our parents, in another our wives, in another our brothers, in another our children, and there is a wide difference in regard to the claims of these feelings of affection, nor is the love of parents towards their children always equal. As is shown by the case of the patriarch Jacob, who, though he was the father of twelve sons and loved them all with a father's love, yet loved Joseph with deeper affection, as Scripture clearly shows: "But his brethren envied him, because his father loved him;" evidently not that that good man his father failed in greatly loving the rest of his children, but that in his affection he clung to this one, because he was a type of the Lord, more tenderly and indulgently.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 14"

[[commentary]]
quote='''
For that evil is so far incurable that it is made worse by attentions, it is increased by services, is irritated by presents, because as the same Solomon says: "envy endures nothing." For just in proportion as another has made progress in humble submission or in the virtue of patience or in the merit of munificence, so is a man excited by worse pricks of envy, because he desires nothing less than the ruin or death of the man whom he envies. Lastly no submission on the part of their harmless brother could soften the envy of the eleven patriarchs, so that Scripture relates of them: "But his brothers envied him because his father loved him, and they could not speak peaceably unto him" until their jealousy, which would not listen to any entreaties on the part of their obedient and submissive brother, desired his death, and would scarcely be satisfied with the sin of selling a brother.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F18.%2520Conference%2520of%2520Abbot%2520Piamun.html'
source_title="Conference of Abbot Piamun, Chapter 16"
