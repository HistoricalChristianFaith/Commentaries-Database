[[commentary]]
quote='''
IN leaving then these visible goods of the world we forsake not our own wealth, but that which is not ours, although we boast of it as either gained by our own exertions or inherited by us from our forefathers. For as I said nothing is our own, save this only which we possess with our heart, and which cleaves to our soul, and therefore cannot be taken away from us by any one. But Christ speaks in terms of censure of those visible riches, to those who clutch them as if they were their own, and refuse to share them with those in want. "If ye have not been faithful in what is another's, who will give to you what is your own?" Plainly then it is not only daily experience which teaches us that these riches are not our own, but this saying of our Lord also, by the very title which it gives them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 10"
