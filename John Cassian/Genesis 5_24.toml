[[commentary]]
quote='''
Of this third renunciation then we shall succeed in reaching the perfection, whenever our soul is sullied by no stain of carnal coarseness, but, all such having been carefully eliminated, it has been freed from every earthly quality and desire, and by constant meditation on things Divine, and spiritual contemplation has so far passed on to things unseen, that in its earnest seeking after things above and things spiritual it no longer feels that it is prisoned in this fragile flesh, and bodily form, but is caught up into such an ecstasy as not only to hear no words with the outward ear, or to busy itself with gazing on the forms of things present, but not even to see things close at hand, or large objects straight before the very eyes. And of this no one can understand the truth and force, except one who has made trial of what has been said, under the teaching of experience; viz., one, the eyes of whose soul the Lord has turned away from all things present, so that he no longer considers them as things that will soon pass away, but as things that are already done with, and sees them vanish into nothing, like misty smoke; and like Enoch, "walking with God," and "translated" from human life and fashions, not "be found" amid the vanities of this life: And that this actually happened corporeally in the case of Enoch the book of Genesis thus tells us. "And Enoch walked with God, and was not found, for God translated him." And the Apostle also says: "By faith Enoch was translated that he should not see death," the death namely of which the Lord says in the gospel: "He that liveth and believeth in me shall not die eternally."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 7"
