[[commentary]]
quote='''
The way of the Lord then has refreshment if it is kept to according to His law. But it is we who by troublesome distractions bring sorrows and troubles upon ourselves, while we try even With the utmost exertion and difficulty to follow the crooked and perverse ways of this world. But when in this way we have made the Lord's yoke heavy and hard to us, we at once complain in a blasphemous spirit of the hardness and roughness of the yoke itself or of Christ who lays it upon us, in accordance with this passage: "The folly of man corrupteth his ways, but he blames God in his heart;" and as Haggai the prophet says, when we say that "the way of the Lord is not right" the reply is aptly made to us by the Lord: "Is not My way right? Are not your ways rather crooked?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 25"
