[[commentary]]
quote='''
For not the slothful, or the careless, or the delicate, or the tender take the kingdom of heaven by force, but the violent. Who then are the violent? Surely they are those who show a splendid violence not to others, but to their own soul, who by a laudable force deprive it of all delights in things present, and are declared by the Lord's mouth to be splendid plunderers, and by rapine of this kind, violently seize upon the kingdom of heaven. For, as the Lord says, "The kingdom of heaven suffereth violence and the violent take it by force." Those are certainly worthy of praise as violent, who do violence to their own destruction, for, "A man," as it is written, "that is in sorrow laboureth for himself and does violence to his own destruction." For our destruction is delight in this present life, and to speak more definitely, the performance of our own likes and desires, as, if a man withdraws these from his soul and mortifies them, he straightway does glorious and valuable violence to his own destruction, provided that he refuses to it the pleasantest of its wishes which the Divine word often rebukes by the prophet, saying: "For in the days of your fast your own will is found;" and again: "If thou turn away thy foot from the Sabbath, to do thy will on My holy day, and glorify him, while thou dost not thy own ways, and thy own will is not found, to speak a word." And the great blessedness that is promised to him is at once added by the prophet. "Then," he says, "shalt thou be delighted in the Lord, and I will lift thee up above the high places of the earth, and will feed thee with the inheritance of Jacob thy father. For the mouth of the Lord hath spoken it."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F24.%2520Conference%2520of%2520Abbot%2520Abraham.html'
source_title="Conference of Abbot Abraham, Chapter 26"
