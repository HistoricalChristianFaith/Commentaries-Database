[[commentary]]
quote='''
So then the end indeed which we have set before us is, as the Apostle says, eternal life, as he declares, "having indeed your fruit unto holiness, and the end eternal life;" but the immediate goal is purity of heart, which he not unfairly terms "sanctification," without which the afore-mentioned end cannot be gained; as if he had said in other words, having your immediate goal in purity of heart, but the end life eternal. Of which goal the same blessed Apostle teaches us, and significantly uses the very term, i.e., skopo/j, saying as follows, "Forgetting those things which are behind and reaching forward tothose that are before, I press toward the mark, lot the prize of the high calling of the Lord:" which is more clearly put in Greek kata\ skopo\n diw/kw, i.e., "I press toward the mark, as if he said, "With this aim, with which I forget those things that are behind, i.e., the faults of earlier life, I strive to reach as the end the heavenly prize."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F1.%2520First%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="First Conference of Abbot Moses, Chapter 5"
