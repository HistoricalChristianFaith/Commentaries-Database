[[commentary]]
quote='''
For according to the measure of its purity, as I said in the former Conference, each mind is both raised and moulded in its prayers if it forsakes the consideration of earthly and material things so far as the condition of its purity may carry it forward, and enable it with the inner eyes of the soul to see Jesus either still in His humility and in the flesh, or glorified and coming in the glory of His Majesty: for those cannot see Jesus coming in His Kingdom who are still kept back in a sort of state of Jewish weakness, and cannot say with the Apostle: "And if we have known Christ after the flesh, yet now we know Him so no more;" but only those can look with purest eyes on His Godhead, who rise with Him from low and earthly works and thoughts and go apart in the lofty mountain of solitude which is free from the disturbance of all earthly thoughts and troubles, and secure from the interference of all sins, and being exalted by pure faith and the heights of virtue reveals the glory of His Face and the image of His splendour to those who are able to look on Him with pure eyes of the soul. But Jesus is seen as well by those who live in towns and villages and hamlets, i.e., who are occupied in practical affairs and works, but not with the same brightness with which He appeared to those who can go up with Him into the aforesaid mount of virtues, i.e., Peter, James, and John. For so in solitude He appeared to Moses and spoke with Elias.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F10.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The Second Conference of Abbot Isaac, Chapter 6"
