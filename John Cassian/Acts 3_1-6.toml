[[commentary]]
quote='''
And what wonder if these acts are told of the Lord's power, when Divine grace has actually wrought similar works by means of His servants! For when Peter and John were entering the temple, when the man who was lame from his mother's womb and had no idea how to walk, asked an alms, they gave him not the miserable coppers which the sick man asked for, but the power to walk, and when he was only expecting the smallest of gifts to console him, enriched him with the prize of unlooked for health, as Peter said: "Silver and gold have I none: but such as I have, give I unto thee. In the name of Jesus Christ of Nazareth, rise up and walk."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 16"
