[[commentary]]
quote='''
What shall I say of the sons of Jonadab the son of Rechab, of whom we are told that, when at the Lord's bidding the prophet Jeremiah offered them wine, they replied: "We drink no wine: for Jonadab the son of Rechab, our father, commanded us, saying: Ye shall drink no wine, ye and your sons forever: and ye shall build no house, nor sow any seed, nor plant vineyards nor possess them: but ye shall dwell in tents all your days"? Wherefore also they were permitted to hear from the same prophet these words: "Thus saith the Lord God of hosts, the God of Israel: there shall not fail a man from the stock of Jonadab the son of Rechab to stand in My sight all the days;" as all of them were not satisfied with merely offering tithes of their possessions, but actually refused property, and offered the rather to God themselves and their souls, for which no redemption can be made by man, as the Lord testifies in the gospel: "For what shall a man give in exchange for his own soul?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 4"
