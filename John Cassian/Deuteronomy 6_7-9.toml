[[commentary]]
quote='''
We must then ceaselessly and continuously pour forth the prayer of this verse, in adversity that we may be delivered, in prosperity that we may be preserved and not puffed up. Let the thought of this verse, i tell you, be conned over in your breast without ceasing. Whatever work you are doing, or office you are holding, or journey you are going, do not cease to chant this. When you are going to bed, or eating, and in the last necessities of nature, think on this. This thought in your heart maybe to you a saving formula, and not only keep you unharmed by all attacks of devils, but also purify you from all faults and earthly stains, and lead you to that invisible and celestial contemplation, and carry you on to that ineffable glow of prayer, of which so few have any experience. Let sleep come upon you still considering this verse, till having been moulded by the constant use of it, you grow accustomed to repeat it even in your sleep. When you wake let it be the first thing to come into your mind, let it anticipate all your waking thoughts, let it when you rise from your bed send you down on your knees, and thence send you forth to all your work and business, and let it follow you about all day long. This you should think about, according to the Lawgiver's charge, "at home and walking forth on a journey," sleeping and waking. This you should write on the threshold and door of your mouth, this you should place on the walls of your house and in the recesses of your heart so that when you fall on your knees in prayer this may be your chant as you kneel, and when you rise up from it to go forth to all the necessary business of life it may be your constant prayer as you stand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F10.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The Second Conference of Abbot Isaac, Chapter 10"
