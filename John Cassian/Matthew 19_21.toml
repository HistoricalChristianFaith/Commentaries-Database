[[commentary]]
quote='''
Wherefore we ought to know that we from whom the requirements of the law are no longer exacted, but in whose ears the word of the gospel daily sounds: "If thou wilt be perfect, go and sell all that thou hast and give to the poor, and thou shalt have treasure in heaven, and come follow Me," when we offer to God tithes of our substance, are still in a way ground down beneath the burden of the law, and not able to rise to those heights of the gospel, those who conform to which are recompensed not only by blessings in this present life, but also by future rewards. For the law promises to those who obey it no rewards of the kingdom of heaven, but only solaces in this life, saying: "The man that doeth these things shall live in them." But the Lord says to His disciples: "Blessed are the poor in spirit, for theirs is the kingdom of heaven;" and: "Everyone that leaveth house or brothers or sisters or father or mother or wife or children or field for My name's sake, shall receive an hundredfold, and shall inherit eternal life." And this with good reason. For it is not so praiseworthy for us to abstain from forbidden as from lawful things, and not to use these last out of reverence for Him, Who has permitted us to use them because of our weakness. And so if even those who, faithfully offering tithes of their fruits, are obedient to the more ancient precepts of the Lord, cannot yet climb the heights of the gospel, you can see very clearly how far short of it those fall who do not even do this. For how can those men be partakers of the grace of the gospel who disregard the fulfilment even of the lighter commands of the law, to the easy character of which the weighty words of the giver of the law bear testimony, as a curse is actually invoked on those who do not fulfil them; for it says: "Cursed is everyone that does not continue in all things that are written in the book of the law to do them." But here on account of the superiority and excellence of the commandments it is said: "He that can receive it, let him receive it." There the forcible compulsion of the lawgiver shows the easy character of the precepts; for he says: "I call heaven and earth to record against you this day, that if ye do not keep the commandments of the Lord your God ye shall perish from off the face of the earth." Here the grandeur of sublime commands is shown by the very fact that He does not order, but exhorts, saying: "if thou wilt be perfect go" and do this or that. There Moses lays a burden that cannot be refused on those who are unwilling: here Paul meets with counsels those who are willing and eager for perfection. For that was not to be enjoined as a general charge, nor to be required, if I may so say, as a regular rule from all, which could not be secured by all, owing to its wonderful and lofty nature; but by counsels all are rather stimulated to grace, that those who are great may deservedly be crowned by the perfection of their virtues, while those who are small, and not able to come up to "the measure of the stature of the fulness of Christ," although they seem to be lost to sight and hidden as it were by the brightness of larger stars, may yet be free from the darkness of the curses which are in the law, and not adjudged to suffer present evils or visited with eternal punishment. Christ therefore does not constrain anyone, by the compulsion of a command, to those lofty heights of goodness, but stimulates them by the power of free will, and urges them on by wise counsels and the desire of perfection. For where there is a command, there is duty, and consequently punishment. But those who keep those things to which they are driven by the severity of the law established escape the punishment with which they were threatened, instead of obtaining rewards and a recompense.

And as the word of the gospel raises those that are strong to sublime and lofty heights, so it suffers not the weak to be dragged down to the depths, for it secures to the perfect the fulness of blessing, and brings to those who are overcome through weakness pardon. For the law placed those who fulfilled its commands in a sort of middle state between what they deserved in either case, severing them from the condemnation due to transgressors, as it also kept them away from the glory of the perfect. But how wretched and miserable this is, you can see from comparing the state of this present life, in which it is considered a very poor thing for a man to sweat and labour only to avoid being regarded as guilty among good men, not also to be esteemed rich and honourable and renowned.

Wherefore it lies today in our own power whether we choose to live under the grace of the gospel or under the terrors of the law: for each man must incline to one side or the other in accordance with the character of his actions, for either the grace of Christ welcomes those who go beyond the law, or else the law keeps its hold over the weaker ones as those who are its debtors and within its clutches. For one who is guilty as regards the precepts of the law will never be able to attain to the perfection of the gospel, even though he idly boasts that he is a Christian and freed by the Lord's grace: for we must not only regard as still under the law the man who refuses to fulfil what the law enjoins, but the man as well who is satisfied with the mere observance of what the law commands, and who never brings forth fruits worthy of his vocation and the grace of Christ, where it is not said: "Thou shalt offer to the Lord thy God thy tithes and firstfruits;" but: "Go and sell all that thou hast and give to the poor, and come follow Me;" where, owing to the grandeur of perfection, to the request of the disciple there is not granted even the very short space ofan hour in which to bury his father, as the offices of human charity are outweighed by the virtue of Divine love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapters 5-7"

[[commentary]]
quote='''
But as sin is alive in one who loves marriage, so is it also in one who is satisfied with merely paying his tithes and firstfruits. For, while he is dawdling or careless, he is sure to sin in regard to either their quality or quantity, or the daily distribution of them. For as he is commanded unweariedly to minister to those in want of what is his, although he may dispense it with the fullest faith and devotion, yet it is hard for him not to fall often into the snares of sin. But over those who have not set at naught the counsel of the Lord, but who, disposing of all their property to the poor, take up their cross and follow the bestower of grace, sin can have no dominion. For no faithless anxiety for getting food will annoy him who piously distributes and disperses his wealth already consecrated to Christ and no longer regarded as his own; nor will any grudging hesitation take away from the cheerfulness of his almsgiving, because without any thought of his own needs or fear of his own food running short he is distributing what has once for all been completely offered to God, and is no longer regarded as his own,as he is sure that when he has succeeded instripping himself as he desires, he will be fed by God much more than the birds of the air.On the other hand he who retains his goodsof this world, or, bound by the rules of the old law, distributes the tithe of his produce, and his firstfruits, or a portion of his income, although he may to a considerable degree quench the fire of his sins by this dew of almsgiving, yet, however generously he gives away his wealth, it is impossible for him altogether to rid himself of the dominion of sin, unless perhaps by the grace of the Saviour, together with his substance he gets rid of all love of possessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F21.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The First Conference of Abbot Theonas, Chapter 33"
