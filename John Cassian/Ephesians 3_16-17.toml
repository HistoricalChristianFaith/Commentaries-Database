[[commentary]]
quote='''
But if, while fasting as far as the body is concerned, we are entangled in the most dangerous vices of the soul, our humiliation of the flesh will do us no good whatever, while the most precious part of us is defiled: since we go wrong through that substance by virtue of which we are made a shrine of the Holy Ghost. For it is not so much the corruptible flesh as the clean heart, which is made a shrine for God, and a temple of the Holy Ghost. We ought therefore, whenever the outward man fasts, to restrain the inner man as well from food which is bad for him: that inner man, namely, whichthe blessed Apostle above all urges us to present pure before God, that it may be found worthy to receive Christ as a guest within, saying "that in the inner man Christ may dwell in your hearts through faith. "
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25205.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 5, Chapter 21"
