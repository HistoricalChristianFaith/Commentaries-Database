[[commentary]]
quote='''
In the second place we should be careful to see that no wrong interpretation fixed on to the pure gold of Scripture deceives us as to the value of the metal: by which means the devil in his craft tried to impose upon our Lord and Saviour as if He was a mere man, when by his malevolent interpretation he perverted what ought to be understood generally of all good men, and tried to fasten it specially on to Him, who had no need of the care of the angels: saying, "For He shall give His angels charge concerning Thee, to keep Thee in all Thy ways: and in their hands they shall bear Thee up, lest at any time Thou dash Thy foot against a stone," by a skilful assumption on his part giving a turn to the precious sayings of Scripture and twisting them into a dangerous sense, the very opposite of their true meaning, so as to offer to us the image and face of an usurper under cover of the gold colour which may deceive us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F1.%2520First%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="First Conference of Abbot Moses, Chapter 20"
