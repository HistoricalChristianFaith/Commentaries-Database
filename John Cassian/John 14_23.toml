[[commentary]]
quote='''
And because he knows he has run unweariedly "after the odour of the ointment" a of Christ with ready devotion of heart, and has won the battle of the spiritual combat by the chastisement of the flesh, he boldly concludes and says, "Henceforth there is laid up for me a crown of righteousness, which the Lord, the righteousjudge, will give to me in that day." And that e might open up to us also a like hope of reward, if we desire to imitate him in the struggle of his course, he added: "But not to me only, but to all also who love His coming;" declaring that we shall be sharers of his crown in the day of judgment, if we love the coming of Christ-not that one only which will be manifest to men even against their will; but also this one which daily comes to pass in holy souls-and if we gain the victory in the fight by chastising the body. And of this coming it is that the Lord speaks in the Gospel. "I," says He, "and my Father will come to him, and will make our abode with him." And again: "Behold, I stand at the door and knock: if any man hear my voice and open the gate, I will come in to him and will sup with him, and he with me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25205.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 5, Chapter 17"
