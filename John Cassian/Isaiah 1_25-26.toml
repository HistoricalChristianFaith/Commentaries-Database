[[commentary]]
quote='''
But we know that even saintly men have been given over in the flesh to Satan and to great afflictions for some very slight faults, since the Divine mercy will not suffer the very least spot or stain to be found in them on the day of judgment, and purges away in this world every spot of their filth, as the prophet, or rather God Himself says, in order that He may commit them to eternity as gold or silver refined and needing no penal purification. "And," says He, "I will clean purge away thy dross, and I will take away all thy tin; and after this thou shall be called the city of the just, a faithful city."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 25"
