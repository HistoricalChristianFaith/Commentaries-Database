[[commentary]]
quote='''
Nor is it without good reasons that these times are more particularly assigned to religious offices, since at them what completed the promises and summed up our salvation was fulfilled. For we can show that at the third hour the Holy Spirit, who had been of old promised by the prophets, descended in the first instance on the Apostles assembled together for prayer. For when in their astonishment at the speaking with tongues, which proceeded from them throughthe outpouring of the Holy Ghost upon them, the unbelieving people of the Jews mocked and said that they were full of new wine, then Peter, standing up in the midst of them, said: "Men of Israel, and all ye who dwell at Jerusalem, let this be known unto you, and consider my words. For these men are not, as ye imagine, drunk, since it is the third hour of the day; but this is that which was spoken by the prophet Joel: and it shall come to pass in the last days, saith the Lord, I will pour out of my Spirit upon all flesh, and your sons and your daughters shall prophesy, and your young men shall see visions and your old men shall dream dreams. And indeed upon my servants and my handmaids in those days I will pour out of my Spirit, and they shall prophesy." And all of this was fulfilled at the third hour, when the Holy Spirit, announced before by the prophets, came at that hour and abode upon the Apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25203.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 3, Chapter 3"
