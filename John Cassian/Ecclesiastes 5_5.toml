[[commentary]]
quote='''
FoR as unbounded glory hereafter is promised to those who faithfully serve God and cleave to Him according to the rule of this system; so the severest penalties are in store for those who have carried it out carelessly and coldly, and have failed to show to Him fruits of holiness corresponding to what they professed or what they were believed by men to be. For "it is better," as Scripture says, "that a man should not vow rather than that he should vow and not pay;" and "Cursed is he that doeth the work of the Lord carelessly." Therefore you were for a long while declined by us, not as if we did not des re with all our hearts to secure your salvation and the salvation of all, nor as if we did not careto go to meet even afar off those who are longing to be converted to Christ; but for fearlest if we received you rashly we might makeourselves guilty in the sight of God of levity, and make you incur a yet heavier punishment, if, when you had been too easily admitted by us without realizing the responsibility of this profession, you had afterwards turned out a deserter or lukewarm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25204.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 4, Chapter 33"
