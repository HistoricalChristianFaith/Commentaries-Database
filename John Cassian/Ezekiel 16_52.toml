[[commentary]]
quote='''
And Scripture keeps up this comparison on the other side also, i.e., in weighing the merits of sinners, so that in comparison with the wicked it justifies those who have sinned less, saying: "Sodom is justified above thee;" and again: "For what hath thy sister Sodom sinned?" and: "The rebellious Israel hath justified her soul in comparison of the treacherous Judah."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F23.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The Third Conference of Abbot Theonas, Chapter 4"
