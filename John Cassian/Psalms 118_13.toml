[[commentary]]
quote='''
And so we ought every moment to pray and say with David "Order my steps in thy paths that my footsteps slip not:" and "He hath set my feet upon a rock and ordered my goings:" that He Who is the unseen ruler of the human heart may vouchsafe to turn to the desire of virtue that will of ours, which is more readily inclined to vice either through want of knowledge of what is good, or through the delights of passion. And we read this in a verse in which the prophet sings very plainly: "Being pushed I was overturned that I might fall," where the weakness of our free will is shown. And "the Lord sustained me:" again this shows that the Lord's help is always joined to it, and by this, that we may not be altogether destroyed by our free will, when He sees that we have stumbled, He sustains and supports us, as it were by stretching out His hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F3.%2520Conference%2520of%2520Abbot%2520Paphnutius.html'
source_title="Conference of Abbot Paphnutius, Chapter 12"
