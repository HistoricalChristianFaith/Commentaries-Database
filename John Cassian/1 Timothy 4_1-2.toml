[[commentary]]
quote='''
Others we find are not only keen for lies, but also inspire men with blasphemies. And of this we ourselves can testify as we have heard a demon openly confessing that he had proclaimed a wicked and impious doctrine by the mouths of Arius and Eunomius. And the same thing we read that one of them openly proclaimed in the fourth book of Kings: "I will go forth," he said, "and will be a lying spirit in the mouth of all his prophets." On which the Apostle, when reproving those who are deceived by them, adds as follows: "giving heed to seducing spirits and doctrines of devils speaking lies in hypocrisy."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F7.%2520First%2520Conference%2520of%2520Abbot%2520Serenus.html'
source_title="First Conference of Abbot Serenus, Chapter 32"
