[[commentary]]
quote='''
When Peter also had been Jut in prison by Herod and was to be brought forth to be slain on the next day, when the angel stood by him he was charged: "Gird thyself and put on thy shoes." And the angel of the Lord would certainly not have charged him to do this had he not seen that for the sake of his night's rest he had for a while freed his wearied limbs from the girdle usually tied round them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FThe%2520Twelve%2520Books%2520on%2520the%2520Institutes%2520of%2520the%2520Coenobia%2FBook%25201.html'
source_title="The Twelve Books on the Institutes of the Coenobia, Book 1, Chapter 1"
