[[commentary]]
quote='''
For who, when "delivering the poor from the hand of them that are too strong for him, and the needy and the poor from them that strip him," who when "breaking the jaws of the wicked and snatching their prey from between their teeth," can with a calm mind regard the glory of the Divine Majesty during the actual work of intervention? Who when ministering support to the poor, or when receiving with benevolent kindness the crowds that come to him, can at the very moment when he is with anxious mind perplexed for the wants of his brethren, contemplate the vastness of the bliss on high, and while he is shaken by the troubles and cares of the present life look forward to the state of the world to come with an heart raised above the stains of earth? Whence the blessed David when laying down that this alone is good for man, longs to cling constantly to God, and says: "It is good for me to cling to God, and to put my hope in the Lord." And Ecclesiastes also declares that this cannot be done without fault by any of the saints, and says: "For there is not a righteous man upon earth, that doeth good and sinneth not." For who, even if he be the chief of all righteous and holy men, can we ever think could, while bound in the chains of this life, so acquire this chief good, as never to cease from divine contemplation, or be thought to be drawn away by earthly thoughts even for a short time from Him Who alone is good?
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F23.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Theonas.html'
source_title="The Third Conference of Abbot Theonas, Chapter 5"
