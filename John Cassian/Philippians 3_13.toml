[[commentary]]
quote='''
Germanus: But can our mind constantly preserve its condition unaltered, and always continue in the same state?

Theodore: It is needful that one must either, as the Apostle says, "be renewed in the spirit of the mind," and daily advance by "pressing forward to those things which are before," or, if one neglects to do this, the sure result will be to go back, and become worse and worse. And therefore the mind cannot possibly remain in one and the same state. Just as when a man, by pulling hard, is trying to force a boat against the stream of a strong current he must either stem the rush of the torrent by the force of his arms, and so mount to what is higher up, or letting his hands slacken be whirled headlong down stream. Wherefore it will be a clear proof of our failure if we find that we have gained nothing more, nor should we doubt but that we have altogether gone back, whenever we find that we have not advanced upwards, because, as I said, the mind of man cannot possibly continue in the same condition, nor so long as he is in the flesh will any of the saints ever reach the height of all virtues, so that they continue unalterable. For something must either be added to them or taken away from them, and in no creature can there be such perfection, as not to be subject to the feeling of change; as we read in the book of Job: "What is man that he should be without spot, and he that is born of a woman that he should appear just? Behold among His saints none is unchangeable, and the heavens are not pure in His sight." For we confess that God only is unchangeable, who alone is thus addressed by the prayer of the holy prophet "But Thou art the same," and who says of Himself "I am God, and I change not," because He alone is by nature always good, always full and perfect, and one to whom nothing can ever be added, or from whom nothing can be taken away. And so we ought always with incessant care and anxiety to give ourselves up to the acquirement of virtue, and constantly to occupy ourselves with the practice of it, lest, if we ceaseto go forward, the result should immediately be a going back. For, as we said, the mind cannot continue in one and the same condition, I mean without receiving addition to or diminution of its good qualities. For to fail to gain new ones, is to lose them, because when the desire of making progress ceases, there the danger of going back is present.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F6.%2520Conference%2520of%2520Abbot%2520Theodore.html'
source_title="Conference of Abbot Theodore, Chapters 13-14"

[[commentary]]
quote='''
Whoever then is aiming at this condition, which we have mentioned, will seek the grace of satisfaction by daily fasting and mortification of heart and body, for, as it is written, "Without shedding of blood there is no remission;" and this not without good reason. For "flesh and blood cannot inherit the kingdom of God." And therefore one who would withhold "the sword of the spirit which is the word of God" from this shedding of blood certainly comes under the lash of that curse of Jeremiah's; for "Cursed," says he "is he who withholds his sword from blood." For this is the sword which for our good sheds that bad blood whereby the material of our sins lives; and cuts Off and pares away everything carnal and earthly which it finds to have grown up in the members of our soul; and makes men die to sin and live to God, and flourish with spiritual virtues. And so he will begin to weep no more at the recollection of former sins, but at the hope of what is to come, and, thinking less of past evils than of good things to come, will shed tears not from sorrow at his sins, but from delight in that eternal joy, and "forgetting those things which are behind," i.e., carnal sins, will press on "to those before," i.e., to spiritual gifts and virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520III%2F20.%2520Conference%2520of%2520Abbot%2520Pinufius.html'
source_title="Conference of Abbot Pinufius, Chapter 8"
