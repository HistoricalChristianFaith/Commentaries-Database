[[commentary]]
quote='''
The third petition is that of sons: "Thy will be done as in heaven so on earth." There can now be no grander prayer than to wish that earthly things may be made equal with things heavenly: for what else is it to say "Thy will be done as in heaven so on earth," than to ask that men may be like angels and that as God's will is ever fulfilled by them in heaven, so also all those who are on earth may do not their own but His will? This too no one could say from the heart but only one who believed that God disposes for our good all things which are seen, whether fortunate or unfortunate, and that He is more careful and provident for our good and salvation than we ourselves are for ourselves. Or at any rate it may be taken in this way: The will of God is the salvation of all men, according to these words of the blessed Paul: "Who willeth all men to be saved and to come to the knowledge of the truth." Of which will also the prophet Isaiah says in the Person of God the Father: "And all Thy will shall be done." When we say then "Thy will be done as in heaven so on earth," we pray in other words for this; viz., that as those who are in heaven, so also may all those who dwell on earth be saved, O Father, by the knowledge of Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 20"

[[commentary]]
quote='''
For the purpose of God whereby He made man not to perish but to live for ever, stands immovable. And when His goodness sees in us even the very smallest spark of good will shining forth, which He Himself has struck as it were out of the hard flints of our hearts, He fans and fosters it and nurses it with His breath, as He "willeth all men to be saved and to come to the knowledge of the truth," for as He says, "it is not the will of your Father which is in heaven that one of these little ones should perish," and again it says: "Neither will God have a soul to perish, but recalleth," meaning that he that is cast off should not altogether perish. For He is true, and lieth not when He lays down with an oath: "As I live, saith the Lord God, for I will not the death of a sinner, but that he should turn from his way and live." For if He willeth not that one of His little ones should perish, how can we imagine without grievous blasphemy that He does not generally will all men, but only some instead of all to be saved? Those then who perish, perish against His will, as He testifies against each one of them day by day: "Turn from your evil ways, and why will ye die, O house of Israel?" And again: "How often would I have gathered thy children together as a hen gathereth her chickens under her wings, and ye would not;" and: "Wherefore is this people in Jerusalem turned away with a stubborn revolting? They have hardened their faces and refused to return." The grace of Christ then is at hand every day, which, while it "willeth all men to be saved and to come to the knowledge of the truth," calleth all without any exception, saying: "Come unto Me, all ye that labour and are heavy laden, and I will refresh you." But if He calls not all generally but only some, it follows that not all are heavy laden either with original or actual sin, and that this saying is not a true one: "For all have sinned and come short of the glory of God;" nor can we believe that "death passed on all men." And so far do all who perish, perish against the will of God, that God cannot be said to have made death, as Scripture itself testifies: "For God made not death, neither rejoiceth in the destruction of the living."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F13.%2520The%2520Third%2520Conference%2520of%2520Abbot%2520Chaeremon.html'
source_title="The Third Conference of Abbot Chaeremon, Chapter 7"
