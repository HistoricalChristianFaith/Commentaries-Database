[[commentary]]
quote='''
For it is impossible for an impure soul (however earnestly it may devote itself to reading) to obtain spiritual knowledge. For no one pours any rich ointment or fine honey or any precious liquid into a dirty and stinking vessel. For a jar that has once been filled with foul odours spoils the sweetest myrrh more readily than it receives any sweetness or grace from it, for what is pure is corrupted much more quickly than what is corrupt is purified. And so the vessel of our bosom unless it has first been purified from all the foul stains of sin will not be worthy to receive that blessed ointment of which it is said by the prophet: "Like the ointment upon the head, which ran down upon the beard of Aaron, which ran down upon the edge of his garment," nor will it keep undefiled that spiritual knowledge and the words of Scripture which are "sweeter than honey and the honeycomb."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F14.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Nesteros.html'
source_title="The First Conference of Abbot Nesteros, Chapter 14"
