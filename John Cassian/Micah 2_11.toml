[[commentary]]
quote='''
To which state and condition of sonship when we have advanced, we shall forthwith be inflamed with the piety which belongs to good sons, so that we shall bend all our energies to the advance not of our own profit, but of our Father's glory, saying to Him: "Hallowed be Thy name," testifying that our desire and our joy is His glory, becoming imitators of Him who said: "He who speaketh of himself, seeketh his own glory. But He who seeks the glory of Him who sent Him, the same is true and there is no unrighteousness in Him." Finally the chosen vessel being filled with this feeling wished that he could be anathema from Christ if only the people belonging to Him might be increased and multiplied, and the salvation of the whole nation of Israel accrue to the glory of His Father; for with all assurance could he wish to die for Christ as he knew that no one perished for life. And again he says: "We rejoice when we are weak but ye are strong." And what wonder if the chosen vessel wished to be anathema from Christ for the sake of Christ's glory and the conversion of His own brethren and the privilege of the nation, when the prophet Micah wished that he might be a liar and a stranger to the inspiration of the Holy Ghost, if only the people of the Jews might escape those plagues and the going forth into captivity which he had announced in his prophecy, saying: "Would that I were not a man that hath the Spirit, and that I rather spoke a lie;" -to pass over that wish of the Lawgiver, who did not refuse to die together with his brethren who were doomed to death, saying: "I beseech Thee, O Lord; this people hath sinned a heinous sin; either forgive them this trespass, or if Thou do not, blot me out of Thy book which Thou hast written."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F9.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Isaac.html'
source_title="The First Conference of Abbot Isaac, Chapter 18"
