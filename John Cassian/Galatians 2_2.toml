[[commentary]]
quote='''
And this self-sufficiency the apostle himself teaches, not only by his letters but by his acts and deeds, ought to be shunned with all possible care, as he says that he went up to Jerusalem solely for this reason; viz., to communicate in a private and informal conference with his co-apostles and those who were before him that Gospel which he preached to the Gentiles, the grace of the Holy Spirit accompanying him with powerful signs and wonders: as he says "And I communicated with them the Gospel which I preach among the Gentiles lest perhaps I had run or should run in vain." Who then is so self-sufficient and blind as to dare to trust in his own judgment and discretion when the chosen vessel confesses that he had need of conference with his fellow apostles. Whence we clearly see that the Lord does not Himself show the way of perfection to anyone who having the opportunity of learning depises the teaching and training of the Elders, paying no heed to that saying which ought most carefully to be observed: "Ask thy father and he will show it to thee: thine Elders and they will tell thee. "
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F2.%2520Second%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="Second Conference of Abbot Moses, Chapter 15"

[[commentary]]
quote='''
For it often happens either by an illusion of the devil or by the occurrence of a human mistake (by which every man in this life is liable to be deceived) that sometimes one who is keener in intellect and more learned, gets some wrong notion in his head, while he who is duller in wits and of less worth, conceives the matter better and more truly. And therefore no one, however learned he may be, should persuade himself in his empty vanity that he cannot require conference with another. For even if no deception of the devil blinds his judgment, yet he cannot avoid the noxious snares of pride and conceit. For who can arrogate this to himself without great danger, when the chosen vessel in whom, as he maintained, Christ Himself spoke, declares that he went up to Jerusalem simply and solely for this reason, that he might in a secret discussion confer with his fellow-Apostles on the gospel which he preached to the gentiles by the revelation and co-operation of the Lord? By which fact we are shown that we ought not only by these precepts to preserve unanimity and harmony, but that we need not fear any crafts of the devil opposing us, or snares of his illusions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F16.%2520The%2520First%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The First Conference of Abbot Joseph, Chapter 12"
