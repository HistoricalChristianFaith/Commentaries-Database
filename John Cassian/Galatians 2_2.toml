[[commentary]]
quote='''
And this self-sufficiency the apostle himself teaches, not only by his letters but by his acts and deeds, ought to be shunned with all possible care, as he says that he went up to Jerusalem solely for this reason; viz., to communicate in a private and informal conference with his co-apostles and those who were before him that Gospel which he preached to the Gentiles, the grace of the Holy Spirit accompanying him with powerful signs and wonders: as he says "And I communicated with them the Gospel which I preach among the Gentiles lest perhaps I had run or should run in vain." Who then is so self-sufficient and blind as to dare to trust in his own judgment and discretion when the chosen vessel confesses that he had need of conference with his fellow apostles. Whence we clearly see that the Lord does not Himself show the way of perfection to anyone who having the opportunity of learning depises the teaching and training of the Elders, paying no heed to that saying which ought most carefully to be observed: "Ask thy father and he will show it to thee: thine Elders and they will tell thee. "
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F2.%2520Second%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="Second Conference of Abbot Moses, Chapter 15"
