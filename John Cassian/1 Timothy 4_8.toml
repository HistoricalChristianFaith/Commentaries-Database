[[commentary]]
quote='''
To which we, being deeply moved, replied what then? will the effort of fasting, dili- gence in reading, works of mercy, justice, piety, and kindness, be taken away from us, and not continue with the doers of them, especially since the Lord Himself promises the reward of the kingdom of heaven to these works, when He says: "Come, ye blessed of My Father, inherit the kingdom prepared for you from the beginning of the world. For I was an hungred, and ye gave Me to eat; I was thirsty and ye gave Me to drink:" etc. How then shall these works be taken away, which admit the doers of them into the kingdom of heaven?

Moses. I did not say that the reward for a good work would be taken away, as the Lord Himself says: "Whosoever shall give to one of the least of these, a cup of cold water only in the name of a disciple, verily I say unto you, he shall not lose his reward:" but I maintain that the doing of a thing, which either bodily necessity, or the onslaught of the flesh, or the inequalities of this world, compel to be done, will be taken away. For diligence in reading, and self-denial in fasting, are usefully practised for purifying the heart and chastening the flesh in this life only, as long as "the flesh lusteth against the spirit," and sometimes we see that even in this life they are taken away from those men who are worn out with excessive toil, or bodily infirmity or old age, and cannot be practised by them. How much more then will they come to an end hereafter, when "this corruptible shall have put on incorruption," and the body which is now "a natural body" shall have risen "a spiritual body" and the flesh shall have begun to be such that it no longer lusts against the spirit? And of this the blessed Apostle also clearly speaks, when he says that "bodily exercise is profitable for a little: but godliness (by which he certainly means love) "is profitable for all things, having the promise of the life that now is and of that which is to come." This clearly shows that what is said to be useful for a little, is not to be practised for all time, and cannot possibly by itself alone confer the highest state of perfection on the man who slaves at it. For the term "for a little" may mean either of the two things, i.e., it may refer to the shortness of the time, because bodily exercise cannot possibly last on with man both in this life and in the world to come: or it may refer to the smallness of the profit which results from exercising the flesh, because bodily austerities produce some sort of beginnings of progress, but not the actual perfection of love, which has the promise of the life that now is and of that which is to come: and therefore we deem that the practice of the aforesaid works is needful, because without them we cannot climb the heights of love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F1.%2520First%2520Conference%2520of%2520Abbot%2520Moses.html'
source_title="First Conference of Abbot Moses, Chapters 9-10"
