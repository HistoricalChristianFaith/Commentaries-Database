[[commentary]]
quote='''
Wherefore it will be a clear proof of our failure if we find that we have gained nothing more, nor should we doubt but that we have altogether gone back, whenever we find that we have not advanced upwards, because, as I said, the mind of man cannot possibly continue in the same condition, nor so long as he is in the flesh will any of the saints ever reach the height of all virtues, so that they continue unalterable. For something must either be added to them or taken away from them, and in no creature can there be such perfection, as not to be subject to the feeling of change; as we read in the book of Job: "What is man that he should be without spot, and he that is born of a woman that he should appear just? Behold among His saints none is unchangeable, and the heavens are not pure in His sight." For we confess that God only is unchangeable, who alone is thus addressed by the prayer of the holy prophet "But Thou art the same," and who says of Himself "I am God, and I change not," because He alone is by nature always good, always full and perfect, and one to whom nothing can ever be added, or from whom nothing can be taken away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520I%2F6.%2520Conference%2520of%2520Abbot%2520Theodore.html'
source_title="Conference of Abbot Theodore, Chapter 14"
