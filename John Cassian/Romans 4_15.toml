[[commentary]]
quote='''
And therefore a monk ought not hastily to make any promise on those things which merely concern bodily exercise, for fear lest he may stir up the enemy still more to attack what he is keeping as it were under the observance of the law, and so he may be more readily compelled to break it. Since every one who lives under the grace of liberty, and sets himself a law, thereby binds himself in a dangerous slavery, so that if by chance necessity constrains him to do what he might have ventured on lawfully, and indeed laudably and with thanksgiving, he is forced to act as a transgressor, and to fall into sin: "for where there is no law there is no transgression."
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Cassian%2FConferences%2520of%2520John%2520Cassian%2520-%2520Part%2520II%2F17.%2520The%2520Second%2520Conference%2520of%2520Abbot%2520Joseph.html'
source_title="The Second Conference of Abbot Joseph, Chapter 30"
