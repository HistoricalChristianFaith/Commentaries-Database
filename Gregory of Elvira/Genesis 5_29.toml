[[commentary]]
quote='''
Thus, this construction of the ark clearly revealed a type of our Church. But there is no doubt that Noah had a figure of Christ, as indeed from the Hebrew to the Latin language Noah is called rest, just as even his father Lamech, when he imposed the name, prophesied: This one will make us rest from our works and the sorrows of our hands and from the earth, which the Lord has cursed. Therefore, as Noah alone in all the earth was found righteous, and with everyone having perished in the cataclysm of water, he alone with his household was saved, because he alone by living well had made himself pious to God, whom the world had angered by a contrary act, thus too when the Lord has come to judge the world in flame of fire, then will be ended the evils of men and of the fleeing angels and of the villainies of the whole world, but with the saints alone provided rest in the kingdom of the future age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Elvira%2FOn%2520Noah%2527s%2520Ark.pdf'
source_title="ON THE ARK OF NOAH 4-5"
