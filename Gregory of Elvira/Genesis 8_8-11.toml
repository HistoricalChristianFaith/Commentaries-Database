[[commentary]]
quote='''
But the dove that was sent, and, when it had not found rest in the world, returned again into the ark, revealed an image of the Holy Spirit, who, when he had been spread by the Lord in all the world and because of the iniquity of the world could not find peace in the home of all men, had to be called back into the ark of the Church, just as the Lord himself in the Gospel instructs his apostles, saying: When you come to each house or city, say: Peace to this house. If there is there a son of peace, your peace will come upon him; if, however, there is not there a son of peace, your peace will return to you. Accordingly, the Holy Spirit, when he still had not found rest upon the nations, because they had not yet believed in Christ, returned into the ark of the Church of the apostles, until, with the iniquities of sinners eliminated, there grew in all the nations the discipline of faith, as they merited to receive the Holy Spirit. Finally, Scripture subjoined: And again he sent off a dove from the ark, and it returned to him around evening having an olive branch in its mouth. Therefore, what brought forth the olive branch clearly revealed the testimony of peace and resurrection and that the wood of the passion in its mouth, foretelling and presenting, has to grant the fertile grace of the charism; around evening, however, that it has to arrive in the end of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Elvira%2FOn%2520Noah%2527s%2520Ark.pdf'
source_title="ON THE ARK OF NOAH 25-28"
