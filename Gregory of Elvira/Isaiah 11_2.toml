[[commentary]]
quote='''
For seven are the gifts of the charisms, as through Isaiah the renowned prophet the Lord has deigned to manifest: And there will rest upon him the spirit of wisdom, the spirit of understanding, of counsel, of virtue, of knowledge, of piety, the spirit of fear of God; we cannot all have them all, but we individuals have single ones. But only Christ the Lord has all, whereby the body is whole; but in us, single ones, whereby we are counted as members. Therefore, whoever of the number of brothers consisting in one and in the same church have had the spirit of wisdom, these all having one charism make one church. Indeed, church means the congregation of the saints; lastly, the blessed apostle Paul, when he was writing to the Church, added what the Church is, saying: to the saints and faithful; and also through this whoever holy and faithful brothers have the spirit of understanding make another church as another class; also, by similar reason, whoever have the spirit of counsel make a third class as a third church; and those whom the spirit of virtue has filled are numbered as the fourth church; in the same way too those whom the spirit of knowledge has inundated are counted in the fifth church; thus too those whom the spirit of piety has united show the number of the sixth church, and those whom the spirit of the fear of God has conjoined are referred to the seventh church. For when we are separate, we individuals have the single charisms; however, when we convene into one, we all make the one and whole and perfect septiform Church, whose is the body of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Elvira%2FOn%2520Noah%2527s%2520Ark.pdf'
source_title="ON THE ARK OF NOAH 9-13"
