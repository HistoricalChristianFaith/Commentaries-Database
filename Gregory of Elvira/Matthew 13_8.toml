[[commentary]]
quote='''
So, the Lord has also deigned to manifest through a parable this tripartite reason of the dwellings of the saints, saying: The seed that fell on the good earth will bear fruit a hundredfold. So, they will bear the hundredfold fruit who receive habitations into heaven; sixtyfold, who merit to dwell in paradise; thirtyfold, who are into the new earth. Whence already it should be plain to you that that three-story ark clearly revealed an image of, as I have often said, the Catholic Church, whose tripartite residences—i.e., of heaven, of paradise, and of the new earth—were formerly shown by the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Elvira%2FOn%2520Noah%2527s%2520Ark.pdf'
source_title="ON THE ARK OF NOAH 19-20"
