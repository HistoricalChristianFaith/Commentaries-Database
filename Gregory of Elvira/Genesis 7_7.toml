[[commentary]]
quote='''
The seven souls, however, who are given to the holy and righteous Noah, are recognized to have had a type of the seven churches, which through Christ are to escape the destruction of the fire of judgment and are to reign in the new earth with Christ. But perhaps it may disturb someone, why the churches are called seven, when one is spread upon the entire globe. Seven churches, thus, because of the septenary spirit, though it is one, are named plurally. For just as there is one body, and seven are the members, or seven duties of the members—i.e., head, hands, feet, sight, hearing, taste, and smell—thus too the body of the Church is one, yet septiform by grace of the charisms. But also seven eyes of the Lord, and seven stars in the right hand of him seated on the throne, and seven golden candelabra, and seven lamps in the tabernacle of the Lord, and seven angels, seven trumpets, seven bowls, seven women seizing one man—i.e., the Church's virtues holding Christ—and seven columns in Solomon's house, with which the house of the Church is supported and built; but also John the blessed apostle writes to seven churches, and Paul, an equally venerable apostle, gave epistles to seven churches likewise, though to the rest he wrote by name, so as not to exceed the number seven of the churches; for also the seven loaves of bread in the Gospel and the seven baskets full of fragments, overflowing, revealed an image of the septiform Church. And for that reason, divine Scripture says: Noah entered into the ark and seven souls with him.

Those seven souls revealed, as I have said, the seven churches; I shall briefly prove that in every single church there are the seven churches. For seven are the gifts of the charisms, as through Isaiah the renowned prophet the Lord has deigned to manifest: And there will rest upon him the spirit of wisdom, the spirit of understanding, of counsel, of virtue, of knowledge, of piety, the spirit of fear of God; we cannot all have them all, but we individuals have single ones. But only Christ the Lord has all, whereby the body is whole; but in us, single ones, whereby we are counted as members. Therefore, whoever of the number of brothers consisting in one and in the same church have had the spirit of wisdom, these all having one charism make one church. Indeed, church means the congregation of the saints; lastly, the blessed apostle Paul, when he was writing to the Church, added what the Church is, saying: to the saints and faithful; and also through this whoever holy and faithful brothers have the spirit of understanding make another church as another class; also, by similar reason, whoever have the spirit of counsel make a third class as a third church; and those whom the spirit of virtue has filled are numbered as the fourth church; in the same way too those whom the spirit of knowledge has inundated are counted in the fifth church; thus too those whom the spirit of piety has united show the number of the sixth church, and those whom the spirit of the fear of God has conjoined are referred to the seventh church. For when we are separate, we individuals have the single charisms; however, when we convene into one, we all make the one and whole and perfect septiform Church, whose is the body of Christ. These are the seven souls who were given in the destruction of water to Noah, who stretched forth an image of Christ.

For through water, as the righteous are saved, thus the sinners and the impious are punished, just as those seven churches in the end of the age, with all the nations perishing, through Christ are to be freed from the cataclysm of fire, as I have already said, and to perceive the glory of the heavenly kingdom, because, just as no one could evade the cataclysm of water, except who is reserved in the ark, thus too nobody can flee on the day of divine judgment, except whom the ark of the Catholic Church has sheltered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Elvira%2FOn%2520Noah%2527s%2520Ark.pdf'
source_title="ON THE ARK OF NOAH 6-14"
