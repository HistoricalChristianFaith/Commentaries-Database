[[commentary]]
quote='''
For what it says that the raven sent out from the ark would no more return, this showed that the impure pleasures of men must be expelled from the Church and are to return no further. For the raven signified the pleasures of the deceitful and impure soul, and the infamy of its black color showed the unrighteous vice of sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Elvira%2FOn%2520Noah%2527s%2520Ark.pdf'
source_title="ON THE ARK OF NOAH 25"
