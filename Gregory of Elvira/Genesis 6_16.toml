[[commentary]]
quote='''
That the ark, however, is referred to as having a second story and a third story evidently shows the places of the dwellings and the qualities of the habitations that are prepared for the saints in the kingdom of God. Indeed, in one story is a figure of paradise, in another of the new earth—where heavenly Jerusalem is to descend, so that there may be in it, just as it is written, the habitation of God among men; of which earth the blessed John says: And I saw a new heaven and a new earth and the heavenly city Jerusalem, descending from heaven onto the new earth, and Isaiah: Just as a new heaven and a new earth, which I make persist in my sight, so will your seed and your name persist, says the Lord almighty—in the third story, the kingdom of the heavens.

Of there is what also our savior and Lord said in the Gospel: Many are the habitations in the house of my Father who is in heaven. Thus, however, is written of the kingdom of the heavens: Blessed who suffer persecution because of righteousness, because theirs is the kingdom of the heavens. Of the dwelling of paradise, however, the Lord himself by all means proves when he says: To the victor, I will give to eat from the tree of life, which is in my God's paradise. However, he likewise manifests the dwelling of the new earth, when he says: Blessed the meek, because they will possess the earth; but also Solomon: The holy will be left upon the earth, yet the impious will be expelled from it. So, the same blessed Isaiah recalls again the qualities of these three dwellings, saying: Those waiting on the Lord will renew their strength, they will be winged like eagles, they will run and not tire, they will walk and not hunger. They will by all means fly into heaven just like winged eagles, run in paradise and not tire, walk into the new earth and not hunger, because they will receive food there prepared by God. So, the Lord has also deigned to manifest through a parable this tripartite reason of the dwellings of the saints, saying: The seed that fell on the good earth will bear fruit a hundredfold. So, they will bear the hundredfold fruit who receive habitations into heaven; sixtyfold, who merit to dwell in paradise; thirtyfold, who are into the new earth. Whence already it should be plain to you that that three-story ark clearly revealed an image of, as I have often said, the Catholic Church, whose tripartite residences—i.e., of heaven, of paradise, and of the new earth—were formerly shown by the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Elvira%2FOn%2520Noah%2527s%2520Ark.pdf'
source_title="ON THE ARK OF NOAH 15-20"

[[commentary]]
quote='''
Truly, what says thus that the construction of the ark itself was disposed so that the broader will be in the first, where it takes foundation, in the middle narrower, and in the third through four corners an opening is finished up to one cubit by a shortening measure, brought down having one window, this certainly signifies that in the first part of the construction—i.e., in the first dispensation of the saints—wider license and laxer discipline of all the fathers and patriarchs was indulged because of the offspring of their sons to be generated; and because it was to be permitted to them to do many things licitly and to more freely do what they wanted, therefore the greater and more spacious part of the ark was made first. But the middle was rendered in a narrower measure, because in the middle times, through the Law of Moses and the prophets, in a narrower and shorter space, by constricting precepts, the people had to be reduced. But the third through corners and by an opening finished into one cubit signified this, that through the four corners—i.e., the four Gospels—the construction of all the Church should be compressed: Because tight and narrow is the way that leads to life, and up to one cubit—i.e., up to the measure of the begotten man that the Lord assumed—all the framework of the Church had to be reduced.

Finally, no one can reach the peak of perfect virtue and glory except through the anguishes of tribulations and the pressures of persecutions, which also our Lord bore in his passion, just as it is written: It is necessary that we through many tribulations enter into the kingdom of God. But because it says: in a cubit you shall finish it, this one cubit is an image, as I have said, of the body of Christ; which cubit is seen to pertain to the unity of the perfect man, of whom we are members, not to the measure of the status of the man; for we all are one in Christ Jesus. Therefore, into one cubit the construction of the ark was finished, because in Christ's one body and in the grace of his sufferings all the fullness of the Church had to be gathered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Elvira%2FOn%2520Noah%2527s%2520Ark.pdf'
source_title="ON THE ARK OF NOAH 21-24"
