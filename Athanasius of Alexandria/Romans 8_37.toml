[[commentary]]
quote='''
For the enemy draws near to us in afflictions, and trials, and labours, using every endeavour to ruin us. But the man who is in Christ, combating those things that are contrary, and opposing wrath by long-suffering, contumely by meekness, and vice by virtue, obtains the victory, and exclaims, ‘I can do all things through Christ Who strengtheneth me;’ and, ‘In all these things we are conquerors through Christ Who loved us.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 8"

[[commentary]]
quote='''
Now the blessed Paul, when troubled by afflictions, and persecutions, and hunger and thirst, ‘in everything was a conqueror, through Jesus Christ, Who loved us.’ Through suffering he was weak indeed in body, yet, believing and hoping, he was made strong in spirit, and his strength was made perfect in weakness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252013%2520%2528for%2520341%2529.html'
source_title="Festal Letter 13 (for 341), Section 2"
