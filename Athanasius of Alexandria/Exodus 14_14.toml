[[commentary]]
quote='''
For to those who thus examine themselves, and conform their hearts to the Lord, nothing adverse shall happen; for indeed, their heart is strengthened by confidence in the Lord, as it is written, ‘They who trust in the Lord are as mount Sion: he who dwelleth in Jerusalem shall not be moved for ever.’ For if at any time, the crafty one shall be presumptuously bold against them, chiefly that he may break the rank of the saints, and cause a division among brethren; even in this the Lord is with them, not only as an avenger on their behalf, but also when they have already been beaten, as a deliverer for them. For this is the divine promise; ‘The Lord shall fight for you.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 6"
