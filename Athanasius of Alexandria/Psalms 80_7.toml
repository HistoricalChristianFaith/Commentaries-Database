[[commentary]]
quote='''
Now because they did not thus consider these matters, the Ario-maniacs, being opponents of Christ, and heretics, smite Him who is their Helper with their tongue, and blaspheme Him who set [them] free, and hold all manner of different opinions against the Saviour. Because of His coming down, which was on behalf of man, they have denied His essential Godhead; and seeing that He came forth from the Virgin, they doubt His being truly the Son of God, and considering Him as become incarnate in time, they deny His eternity; and, looking upon Him as having suffered for us, they do not believe in Him as the incorruptible Son from the incorruptible Father. And finally, because He endured for our sakes, they deny the things which concern His essential eternity; allowing the deed of the unthankful, these despise the Saviour, and offer Him insult instead of acknowledging His grace. To them may these words justly be addressed: Oh! unthankful opponent of Christ, altogether wicked, and the slayer of his Lord, mentally blind, and a Jew in his mind, hadst thou understood the Scriptures, and listened to the saints, who said, ‘Cause Thy face to shine, and we shall be saved;’ or again, ‘Send out Thy light and Thy truth;’—then wouldest thou have known that the Lord did not descend for His own sake, but for ours; and for this reason, thou wouldest the more have admired His loving kindness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 9"
