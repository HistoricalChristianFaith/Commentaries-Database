[[commentary]]
quote='''
Since these things are so, my brethren, let us mortify our members which are on the earth, and be nourished with living bread, by faith and love to God, knowing that without faith it is impossible to be partakers of such bread as this. For our Saviour, when He called all men to him, and said, ‘If any man thirst, let him [come] to Me and drink,’ immediately spoke of the faith without which a man cannot receive such food; ‘He that believeth on Me, as the Scripture saith, out of his belly shall flow rivers of living water.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 7"


[[commentary]]
quote='''
When we thirst, He satisfies us on the feast-day itself; standing and crying, ‘If any man thirst, let him come to Me, and drink.’ For such is the love of the saints at all times, that they never once leave off, but offer the uninterrupted, constant sacrifice to the Lord, and continually thirst, and ask of Him to drink; as David sang, ‘My God, my God, early will I seek Thee, my soul thirsteth for Thee; many times my heart and flesh longeth for Thee in a barren land, without a path, and without water. Thus was I seen by Thee in the sanctuary.’ And Isaiah the prophet says, ‘From the night my spirit seeketh Thee early, O God, because Thy commandments are light.’ And another says, ‘My soul fainteth for the longing it hath for Thy judgments at all times.’ And again he says, ‘For Thy judgments I have hoped, and Thy law will I keep at all times.’ Another boldly cries out, saying, ‘Mine eye is ever towards the Lord.’ And with him one says, ‘The meditation of my heart is before Thee at all times.’ And Paul further advises, ‘At all times give thanks; pray without ceasing.’ Those who are thus continually engaged, are waiting entirely on the Lord, and say, ‘Let us follow on to know the Lord: we shall find Him ready as the morning, and He will come to us as the early and the latter rain for the earth.’ For not only does He satisfy them in the morning; neither does He give them only as much to drink as they ask; but He gives them abundantly according to the multitude of His lovingkindness, vouchsafing to them at all times the grace of the Spirit. And what it is they thirst for He immediately adds, saying, ‘He that believeth on Me.’ For, ‘as cold waters are pleasant to those who are thirsty,’ according to the proverb, so to those who believe in the Lord, the coming of the Spirit is better than all refreshment and delight.

It becomes us then in these days of the Passover, to rise early with the saints, and approach the Lord with all our soul, with purity of body, with confession and godly faith in Him; so that when we have here first drunk, and are filled with these divine waters which [flow] from Him, we may be able to sit at table with the saints in heaven, and may share in the one voice of gladness which is there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252020%2520%2528for%2520348%2529.html'
source_title="Festal Letter 20 (for 348), Sections 1-2"


[[commentary]]
quote='''
When therefore the servants of the Chief Priests and the Scribes saw these things, and heard from Jesus, ‘Whosoever is athirst, let him come to Me and drink;’ they perceived that this was not a mere man like themselves, but that this was He Who gave water to the saints, and that it was He Who was announced by the prophet Isaiah. For He was truly the splendour of the light, and the Word of God. And thus as a river from the fountain he gave drink also of old to Paradise; but now to all men He gives the same gift of the Spirit, and says, ‘If any man thirst, let him come to Me and drink.’ Whosoever ‘believeth on Me, as saith the Scripture, rivers of living water shall flow out of his belly.’ This was not for man to say, but for the living God, Who truly vouchsafes life, and gives the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252044%2520%2528for%2520372%2529.html'
source_title="Festal Letter 44 (for 372)"
