[[commentary]]
quote='''
For the righteous man, being nurtured in faith and knowledge, and the observance of divine precepts, has his soul always in health. Wherefore it is commanded to ‘receive to ourselves him who is weak in the faith,’ and to nourish him, even if he is not yet able to eat bread, but herbs, ‘for he that is weak eateth herbs.’ For even the Corinthians were not able to partake of such bread, being yet babes, and like babes they drank milk. ‘For every one that partaketh of milk is unskilful in the word of righteousness,’ according to the words of that divine man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 8"
