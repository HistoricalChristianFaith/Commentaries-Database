[[commentary]]
quote='''
For such things as these serve for exercise and trial, so that, having approved ourselves zealous and chosen servants of Christ, we may be fellow-heirs with the saints. For thus Job: ‘The whole world is a place of trial to men upon the earth.’ Nevertheless, they are proved in this world by afflictions, labours, and sorrows, to the end that each one may receive of God such reward as is meet for him, as He saith by the prophet, ‘I am the Lord, Who trieth the hearts, and searcheth the reins, to give to every one according to his ways.’

Not that He first knows the things of a man on his being proved (for He knows them all before they come to pass), but because He is good and philanthropic, He distributes to each a due reward according to his actions, so that every man may exclaim, Righteous is the judgment of God! As the prophet says again, ‘The Lord trieth the just, and discerneth the reins.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252013%2520%2528for%2520341%2529.html'
source_title="Festal Letter 13 (for 341), Sections 1-2"
