[[commentary]]
quote='''
For this cause, the Ario-maniacs, who now have gone out from the Church, being opponents of Christ, have digged a pit of unbelief, into which they themselves have been thrust; and, since they have advanced in ungodliness, they ‘overthrow the faith of the simple;’ blaspheming the Son of God, and saying that He is a creature, and has His being from things which are not. But as then against the adherents of Philetus and Hymenæus, so now the Apostle forewarns all men against ungodliness like theirs, saying, ‘The foundation of God standeth sure, having this seal, The Lord knoweth them that are His; and, Let every one that nameth the name of the Lord depart from iniquity.’ For it is well that a man should depart from wickedness and deeds of iniquity, that he may be able properly to celebrate the feast; for he who is defiled with the pollutions of the wicked is not able to sacrifice the Passover to the Lord our God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 10"
