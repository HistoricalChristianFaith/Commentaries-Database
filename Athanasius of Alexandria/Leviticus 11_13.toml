[[commentary]]
quote='''
Now we say that the wicked are dead, but not in an ascetic life opposed to sin; nor do they, like the saints, bear about dying in their bodies. But it is the soul which they bury in sins and follies, drawing near to the dead, and satisfying it with dead nourishment; like young eagles which, from high places, fly upon the carcases of the dead, and which the law prohibited, commanding figuratively, ‘Thou shalt not eat the eagle, nor any other bird that feedeth on a dead carcase;’ and it pronounced unclean whatsoever eateth the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 2"
