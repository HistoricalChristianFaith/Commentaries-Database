[[commentary]]
quote='''
For they assured us that they had not gone over to impiety; but lest certain most impious persons should be elected and ruin the Churches they elected rather to acquiesce in the violence and to bear the burden, than to lose the people. But in saying this, they appeared to us to say what was plausible; for they alleged in excuse Aaron the brother of Moses, who in the wilderness acquiesced in the people’s transgression; and that he had had as his excuse the danger of the people returning to Egypt and abiding in idolatry. For there was reason in the view, that if they remained in the wilderness they might cease from their impiety: but if they went into Egypt they would become ruined and increase the impiety in their midst. For this reason, then, they have been allowed to rank as clergy, those who had been deceived and suffered violence being pardoned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252055%2520Letter%2520to%2520Rufinianus.html'
source_title="Letter 55, To Rufinianus"
