[[commentary]]
quote='''
But we should like your piety to ask them this. When Israel was ordered to go up to Jerusalem to worship at the temple of the Lord, where was the ark, ‘and above it the Cherubim of glory overshadowing the Mercy-seat,’ did they do well or the opposite? If they did ill, how came it that they who despised this law were liable to punishment? for it is written that if a man make light of it and go not up, he shall perish from among the people. But if they did well, and in this proved well-pleasing to God, are not the Arians, abominable and most shameful of any heresy, many times worthy of destruction, in that while they approve the former People for the honour paid by them to the Temple, they will not worship the Lord Who is in the flesh as in a temple? And yet the former temple was constructed of stones and gold, as a shadow. But when the reality came, the type ceased from thenceforth, and there did not remain, according to the Lord’s utterance, one stone upon another that was not broken down. And they did not, when they saw the temple of stones, suppose that the Lord who spoke in the temple was a creature; nor did they set the Temple at nought and retire far off to worship. But they came to it according to the Law, and worshipped the God who uttered His oracles from the Temple. Since then this was so, how can it be other than right to worship the Body of the Lord, all-holy and all-reverend as it is, announced as it was by the archangel Gabriel, formed by the Holy Spirit, and made the Vesture of the Word?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252060%2520To%2520Adelphius%252C%2520Bishop%2520and%2520Confessor%253A%2520Against%2520the%2520Arians.html'
source_title="Letter 60, To Adelphius, Section 7"
