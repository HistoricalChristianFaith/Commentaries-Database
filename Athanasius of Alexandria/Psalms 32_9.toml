[[commentary]]
quote='''
Let a man see what these become like, that they bear not the likeness of the conversation of the saints, nor of that right understanding, by which man at the beginning was rational, and in the image of God. But they are compared to their disgrace to beasts without understanding, and becoming like them in unlawful pleasures, they are spoken of as wanton horses; also, for their craftiness, and errors, and sin laden with death, they are called a ‘generation of vipers,’ as John saith. Now having thus fallen, and grovelling in the dust like the serpent, having their minds set on nothing beyond visible things, they esteem these things good, and rejoicing in them, serve their own lusts and not God.

Yet even in this state, the man-loving Word, who came for this very reason, that He might seek and find that which was lost, sought to restrain them from such folly, crying and saying, ‘Be ye not as the horse and the mule which have no understanding, whose cheeks ye hold in with bit and bridle.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25202%2520For%2520330.html'
source_title="Festal Letter 2 (for 330), Sections 2-3"
