[[commentary]]
quote='''
For thus the God of all, after the manner of wise Solomon, distributes everything in time and season, to the end that, in due time, the salvation of men should be everywhere spread abroad. Thus the ‘Wisdom of God,’ our Lord and Saviour Jesus Christ, not out of season, but in season, ‘passed upon holy souls, fashioning the friends of God and the prophets;’ so that although very many were praying for Him, and saying, ‘O that the salvation of God were come out of Sion!’—the Spouse also, as it is written in the Song of Songs, was praying and saying, ‘O that Thou wert my sister’s son, that sucked the breasts of my mother!’ that Thou wert like the children of men, and wouldest take upon Thee human passions for our sake!—nevertheless, the God of all, the Maker of times and seasons, Who knows our affairs better than we do, while, as a good physician, He exhorts to obedience in season—the only one in which we may be healed—so also does He send Him not unseasonably, but seasonably, saying, ‘In an acceptable time have I heard Thee, and in the day of salvation I have helped Thee.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25201%2520For%2520329.html'
source_title="Festal Letter 1 (for 329), Section 1"
