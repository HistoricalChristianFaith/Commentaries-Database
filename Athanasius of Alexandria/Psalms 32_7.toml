[[commentary]]
quote='''
For as He is the Shepherd, and the High Priest, and the Way and the Door, and everything at once to us, so again, He is shewn to us as the Feast, and the Holy day, according to the blessed Apostle; ‘Our Passover, Christ, is sacrificed.’ He it was who was expected, He caused a light to shine at the prayer of the Psalmist, who said, ‘My Joy, deliver me from those who surround me;’ this being indeed true rejoicing, this being a true feast, even deliverance from wickedness, whereto a man attains by thoroughly adopting an upright conversation, and being approved in his mind of godly submission towards God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 1"
