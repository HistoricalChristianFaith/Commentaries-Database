[[commentary]]
quote='''
Thus, being changed into the likeness of fools, they fell so low in their understanding, that by their excessive reasoning, they even likened the Divine Wisdom to themselves, thinking it to be like their own arts. Therefore, ‘professing themselves to be wise, they became fools, and changed the glory of the incorruptible God into the likeness of the corruptible image of man, and birds, and four-footed beasts, and creeping things. Wherefore God gave them over to a reprobate mind, to do those things which are not convenient.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25202%2520For%2520330.html'
source_title="Festal Letter 2 (for 330), Section 3"
