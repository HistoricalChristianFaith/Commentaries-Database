[[commentary]]
quote='''
Now they suffer such things, because there is not among them one sound of mind to guide them. For where there is sagacity, there the Word, who is the Pilot of souls, is with the vessel; ‘for he that hath understanding shall possess guidance;’ but they who are without guidance fall like the leaves. Who has so completely fallen away as Hymenæus and Philetus, who held evil opinions respecting the resurrection, and concerning faith in it suffered shipwreck? And Judas being a traitor, fell away from the Pilot, and perished with the Jews. But the disciples since they were wise, and therefore remained with the Lord, although the sea was agitated, and the ship covered with the waves, for there was a storm, and the wind was contrary, yet fell not away. For they awoke the Word, Who was sailing with them, and immediately the sea became smooth at the command of its Lord, and they were saved. They became preachers and teachers at the same time; relating the miracles of our Saviour, and teaching us also to imitate their example. These things were written on our account and for our profit, so that through these signs we may acknowledge the Lord Who wrought them.

Let us, therefore, in the faith of the disciples, hold frequent converse with our Master. For the world is like the sea to us, my brethren, of which it is written, ‘This is the great and wide sea, there go the ships; the Leviathan, which Thou hast created to play therein.’ We float on this sea, as with the wind, through our own free-will, for every one directs his course according to his will, and either, under the pilotage of the Word, he enters into rest, or, laid hold on by pleasure, he suffers shipwreck, and is in peril by storm. For as in the ocean there are storms and waves, so in the world there are many afflictions and trials. The unbelieving therefore ‘when affliction or persecution ariseth is offended,’ as the Lord said. For not being confirmed in the faith, and having his regard towards temporal things, he cannot resist the difficulties which arise from afflictions. But like that house, built on the sand by the foolish man, so he, being without understanding, falls before the assault of temptations, as it were by the winds. But the saints, having their senses exercised in self-possession, and being strong in faith, and understanding the word, do not faint under trials; but although, from time to time, circumstances of greater trial are set against them, yet they continue faithful, and awaking the Lord Who is with them, they are delivered. So, passing through water and fire, they find relief and duly keep the feast, offering up prayers with thanksgiving to God Who has redeemed them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Sections 6-7"
