[[commentary]]
quote='''
Now those who meditate evil we say, [think] not truth, but falsehood and not righteousness, but iniquity, for their tongue learns to speak lies. They have done evil, and have not ceased that they might repent. For, persevering with delight in wicked actions, they hasten thereto without turning back, even treading under foot the commandment with regard to neighbours, and, instead of loving them, devise evil against them, as the saint testifies, saying, ‘And those who seek me evil have spoken vanity, and imagined deceit all the day.’ But that the cause of such meditation is none other than the want of instruction, the divine proverb has already declared; ‘The son that forsaketh the commandment of his father meditateth evil words.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 4"
