[[commentary]]
quote='''
For a servant of the Lord should be diligent and careful, yea, moreover, burning like a flame, so that when, by an ardent spirit, he has destroyed all carnal sin, he may be able to draw near to God who, according to the expression of the saints, is called ‘a consuming fire.’

Therefore, the God of all, ‘Who maketh His angels [spirits],’ is a spirit, ‘and His ministers a flame of fire.’ Wherefore, in the departure from Egypt, He forbade the multitude to touch the mountain, where God was appointing them the law, because they were not of this character. But He called blessed Moses to it, as being fervent in spirit, and possessing unquenchable grace, saying, ‘Let Moses alone draw near.’ He entered into the cloud also, and when the mountain was smoking, he was not injured; but rather, through ‘the words of the Lord, which are choice silver purified in the earth,’ he descended purified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Sections 3-4"
