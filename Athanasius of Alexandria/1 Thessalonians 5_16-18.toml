[[commentary]]
quote='''
And let us not forget that which Paul delivered, declaring it to the Corinthians; I mean His resurrection, whereby ‘He destroyed him that had the power of death, that is, the devil;’ and raised us up together with Him, having loosed the bands of death, and vouchsafed a blessing instead of a curse, joy instead of grief, a feast instead of mourning, in this holy joy of Easter, which being continually in our hearts, we always rejoice, as Paul commanded; ‘We pray without ceasing; in everything we give thanks.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25202%2520For%2520330.html'
source_title="Festal Letter 2 (for 330), Section 7"

[[commentary]]
quote='''
For such meditation and exercise in godliness, being at all times the habit of the saints, is urgent on us at the present time, when the divine word desires us to keep the feast with them if we are in this disposition. For what else is the feast, but the constant worship of God, and the recognition of godliness, and unceasing prayers from the whole heart with agreement? So Paul wishing us to be ever in this disposition, commands, saying, ‘Rejoice evermore; pray without ceasing; in everything give thanks.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 11"

[[commentary]]
quote='''
In this manner the blessed Paul, when he took pleasure in infirmities, in reproach, in necessities, in persecutions, and in distresses for Christ, rejoiced, and wished all of us to rejoice saying, ‘Rejoice always; in everything give thanks.’

For what is so fitting for the feast, as a turning from wickedness, and a pure conversation, and prayer offered without ceasing to God, with thanksgiving? Therefore let us, my brethren, looking forward to celebrate the eternal joy in heaven, keep the feast here also, rejoicing at all times, praying incessantly, and in everything giving thanks to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Sections 7-8"
