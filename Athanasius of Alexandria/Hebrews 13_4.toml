[[commentary]]
quote='''
But since we must grapple with the objections of evil persons, as they may say, ‘If the organs have been severally fashioned by the Creator, then there is no sin in their genuine use,’ let us stop them by asking this question: What do you mean by use? That lawful use which God permitted when He said, ‘Increase and multiply, and replenish the earth,’ and which the Apostle approves in the words, ‘Marriage is honourable and the bed undefiled,’ or that use which is public, yet carried on stealthily and in adulterous fashion? For in other matters also which go to make up life, we shall find differences according to circumstances. For example, it is not right to kill, yet in war it is lawful and praiseworthy to destroy the enemy; accordingly not only are they who have distinguished themselves in the field held worthy of great honours, but monuments are put up proclaiming their achievements. So that the same act is at one time and under some circumstances unlawful, while under others, and at the right time, it is lawful and permissible. The same reasoning applies to the relation of the sexes. He is blessed who, being freely yoked in his youth, naturally begets children. But if he uses nature licentiously, the punishment of which the Apostle writes shall await whoremongers and adulterers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252048%2520Letter%2520to%2520Amun%2520Written%2520Before%2520354%2520ad.html'
source_title="Letter 48, To Amun"
