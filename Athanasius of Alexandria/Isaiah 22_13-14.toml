[[commentary]]
quote='''
Now we say that the wicked are dead, but not in an ascetic life opposed to sin; nor do they, like the saints, bear about dying in their bodies. But it is the soul which they bury in sins and follies, drawing near to the dead, and satisfying it with dead nourishment; like young eagles which, from high places, fly upon the carcases of the dead, and which the law prohibited, commanding figuratively, ‘Thou shalt not eat the eagle, nor any other bird that feedeth on a dead carcase;’ and it pronounced unclean whatsoever eateth the dead. But these kill the soul with lusts, and say nothing but, ‘let us eat and drink, for to morrow we die.’ And the kind of fruit those have who thus love pleasures, he immediately describes, adding, ‘And these things are revealed in the ears of the Lord of Hosts, that this sin shall not be forgiven you until ye die.’ Yea, even while they live they shall be ashamed, because they consider their belly their lord; and when dead, they shall be tormented, because they have made a boast of such a death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 2"
