[[commentary]]
quote='''
Afterwards when, being reproved, they should have come to their senses, they rather grew insolent, saying, ‘We are Moses’ disciples; and we know that God spake to Moses;’ dealing the more falsely by that very expression, and accusing themselves. For had they believed him to whom they hearkened, they would not have denied the Lord, Who spake by Moses, when He was present. Not so did the eunuch in the Acts, for when he heard, ‘Understandest thou what thou readest?’ he was not ashamed to confess his ignorance, and implored to be taught. Therefore, to him who became a learner, the grace of the Spirit was given.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Section 5"
