[[commentary]]
quote='''
Heaven truly is high, and its distance from us infinite; for ‘the heaven of heavens,’ says he, ‘is the Lord’s.’ But not, on that account, are we to be negligent or fearful, as though the way thereto were impossible; but rather should we be zealous. Yet not, as in the case of those who formerly, removing from the east and finding a plain in Senaar, began [to build a tower], is there need for us to bake bricks with fire, and to seek slime for mortar; for their tongues were confounded, and their work was destroyed. But for us the Lord has consecrated a way through His blood, and has made it easy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252043%2520%2528for%2520371%2529.html'
source_title="Festal Letter 43 (for 371)"
