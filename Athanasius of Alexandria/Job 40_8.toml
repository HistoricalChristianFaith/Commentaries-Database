[[commentary]]
quote='''
Again, for this cause He tries each one of us, either that to those who know it not, virtue may be manifested by means of those who are proved, as was said respecting Job; ‘Thinkest thou that I was revealed to thee for any other cause, than that thou shouldest be seen righteous?’ or that, when men come to a sense of their deeds, they may be able to know of what manner they are, and so may either repent of their wickedness, or abide confirmed in the faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252013%2520%2528for%2520341%2529.html'
source_title="Festal Letter 13 (for 341), Section 2"
