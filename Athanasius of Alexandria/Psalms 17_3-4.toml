[[commentary]]
quote='''
The other saints also, who had a like confidence in God, accepted a like probation with gladness, as Job said, ‘Blessed be the name of the Lord.’ But the Psalmist, ‘Search me, O Lord, and try me: prove my reins and my heart.’ For since, when the strength is proved, it convinceth the foolish, they perceiving the cleansing and the advantage resulting from the divine fire, were not discouraged in trials like these, but they rather delighted in them, suffering no injury at all from the things which happened, but being seen to shine more brightly, like gold from the fire, as he said, who was tried in such a school of discipline as this; ‘Thou hast tried my heart, Thou hast visited me in the night-season; Thou hast proved me, and hast not found iniquity in me, so that my mouth shall not speak of the works of men.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252013%2520%2528for%2520341%2529.html'
source_title="Festal Letter 13 (for 341), Section 3"
