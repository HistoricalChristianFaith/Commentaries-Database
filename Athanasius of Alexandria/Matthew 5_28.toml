[[commentary]]
quote='''
And whereas, not only in action, but also in the thoughts of the mind, men are moved to deeds of virtue, he afterwards adds, saying, ‘Mine eyes prevent the dawn, that I might meditate on Thy words.’ For it is meet that the spiritual meditations of those who are whole should precede their bodily actions. And does not our Saviour, when intending to teach this very thing begin with the thoughts of the mind? saying, ‘Whosoever looketh on a woman to lust after her, hath already committed adultery:’ and, ‘Whosoever shall be angry with his brother, is guilty of murder.’ For where there is no wrath, murder is prevented; and where lust is first removed, there can be no accusation of adultery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 7"
