[[commentary]]
quote='''
Let us celebrate it then, even heavenly joy, with those saints who formerly proclaimed a like feast, and were ensamples to us of conversation in Christ. For not only were they entrusted with the charge of preaching the Gospel, but, if we enquire, we shall see, as it is written, that its power was displayed in them. ‘Be ye therefore followers of me,’ he wrote to the Corinthians. Now the apostolic precept exhorts us all, for those commands which he sent to individuals, he at the same time enjoined upon every man in every place, for he was ‘a teacher of all nations in faith and truth.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25202%2520For%2520330.html'
source_title="Festal Letter 2 (for 330), Section 1"
