[[commentary]]
quote='''
He too that received the one talent, and bound it up in a napkin, and hid it in the earth, was in consequence cast out for unthankfulness, hearing the words, ‘Thou wicked and slothful servant, thou knewest that I reap where I sowed not, and gather where I have not strawed; thou oughtest therefore to have put my money to the exchangers, and on my return, I should have received mine own. Take therefore the talent from him, and give it to him that hath ten talents.’ For, of course, when he was required to deliver up to his lord that which belonged to him, he should have acknowledged the kindness of him who gave it, and the value of that which was given. For he who gave was not a hard man, had he been so, he would not have given even in the first instance; neither was that which was given unprofitable and vain, for then he had not found fault. But both he who gave was good, and that which was given was capable of bearing fruit. As therefore ‘he who withholdeth corn in seed-time is cursed,’ according to the divine proverb, so he who neglects grace, and hides it without culture, is properly cast out as a wicked and unthankful person. On this account, he praises those who increased [their talents], saying, ‘Well done, good and faithful servant; thou hast been faithful in a little, I will place thee over much; enter into the joy of thy Lord.’

This was right and reasonable; for, as the Scripture declares, they had gained as much as they had received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Sections 2-3"
