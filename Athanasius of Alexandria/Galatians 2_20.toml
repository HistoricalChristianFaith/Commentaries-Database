[[commentary]]
quote='''
Christ is the true Son, and so when we receive the Spirit, we are made sons. For it says; 'you did not receive the spirit of slavery leading you back into fear, but you have received the Spirit of adopted sonship' [Romans 8:15]. But when we are made sons in the Spirit, it is clear that we are called children of God in Christ... And when the Spirit is given to us-the Saviour said: 'Receive the Holy Spirit' [John 20:22]- God [The Father] is in us... But when God is in us, the Son is also in us. For the Lord Himself said: 'I and the Father will come and make our home with him' [John 14:23]. Next, the Son is life-for He said: 'I am the life' [John 14:6]- and so we are said to be given life in the Spirit... But when we are given life in the Spirit, Christ Himself is said to live in us. For it says: 'I am crucified with Christ. It is no longer I who live, but Christ who lives in me.' (Galatians 2:19-20). - "Letters to Separion On the Spirit, Letter 1, Chapter 19"
'''

[[commentary]]
quote='''
And how can we more abide in piety than when we acknowledge God, Who in His love to mankind has bestowed on us such benefits? (For thus we shall obediently keep the law, and observe its commandments. And, further, we shall not, as unthankful persons, be accounted transgressors of the law, or do those things which ought to be hated, for the Lord loveth the thankful); when too we offer ourselves to the Lord, like the saints, when we subscribe ourselves entirely [as] living henceforth not to ourselves, but to the Lord Who died for us, as also the blessed Paul did, when he said, ‘I am crucified with Christ, yet I live; yet not I, but Christ liveth in me.’

Now our life, my brethren, truly consists in our denying all bodily things, and continuing stedfast in those only of our Saviour. Therefore the present season requires of us, that we should not only utter such words, but should also imitate the deeds of the saints. But we imitate them, when we acknowledge Him who died, and no longer live unto ourselves, but Christ henceforth lives in us; when we render a recompense to the Lord to the utmost of our power, though when we make a return we give nothing of our own, but those things which we have before received from Him, this being especially of His grace, that He should require, as from us, His own gifts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25205%2520For%2520333.html'
source_title="Festal Letter 5 (for 333), Sections 3-4"

[[commentary]]
quote='''
But the saints, and they who truly practise virtue, ‘mortify their members which are upon the earth, fornication, uncleanness passions, evil concupiscence;’ and, as the result of this, are pure and without spot, confiding in the promise of our Saviour, who said, ‘Blessed are the pure in heart, for they shall see God.’ These, having become dead to the world, and renounced the merchandise of the world, gain an honourable death; for, ‘precious in the sight of the Lord is the death of His saints.’ They are also able, preserving the Apostolic likeness, to say, ‘I am crucified with Christ, nevertheless I live; yet not I, but Christ liveth in me.’ For that is the true life, which a man lives in Christ; for although they are dead to the world, yet they dwell as it were in heaven, minding those things which are above, as he who was a lover of such a habitation said, ‘While we walk on earth, our dwelling is in heaven.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 3"
