[[commentary]]
quote='''
Therefore the blessed Paul, when desirous that the grace of the Spirit given to us should not grow cold, exhorts, saying, ‘Quench not the Spirit.’ For so shall we remain partakers of Christ, if we hold fast to the end the Spirit given at the beginning. For he said, ‘Quench not;’ not because the Spirit is placed in the power of men, and is able to suffer anything from them; but because bad and unthankful men are such as manifestly wish to quench it, since they, like the impure, persecute the Spirit with unholy deeds. ‘For the holy Spirit of discipline will flee deceit, nor dwell in a body that is subject unto sin; but will remove from thoughts that are without understanding.’ Now they being without understanding, and deceitful, and lovers of sin, walk still as in darkness, not having that ‘Light which lighteth every man that cometh into the world.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Section 4"
