[[commentary]]
quote='''
For sin has her own special bread, of her death, and calling to those who are lovers of pleasure and lack understanding, she saith, ‘Touch with delight secret bread, and sweet waters which are stolen;’ for he who merely touches them knows not that that which is born from the earth perishes with her. For even when the sinner thinks to find pleasure, the end of that food is not pleasant, as the Wisdom of God saith again, ‘Bread of deceit is pleasant to a man; but afterwards his mouth shall be filled with gravel.’ And, ‘Honey droppeth from the lips of a whorish woman, which for a time is sweet to thy palate; but at the last thou shalt find it more bitter than gall, and sharper than a two-edged sword.’ Thus then he eats and rejoices for a little time; afterwards he spurneth it when he hath removed his soul afar. For the fool knoweth not that those who depart far from God shall perish. And besides, there is the restraint of the prophetic admonition which says, ‘What hast thou to do in the way of Egypt, to drink the waters of Gihon? And what hast thou to do in the way of Asshur, to drink the waters of the rivers?’ And the Wisdom of God which loves mankind forbids these things, crying, ‘But depart quickly, tarry not in the place, neither fix thine eye upon it; for thus thou shalt pass over strange waters, and depart quickly from the strange river.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 5"
