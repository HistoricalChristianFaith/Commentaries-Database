[[commentary]]
quote='''
For He raised up the falling, healed the sick, satisfied those who were hungry, and filled the poor, and, what is more wonderful, raised us all from the dead; having abolished death, He has brought us from affliction and sighing to the rest and gladness of this feast, a joy which reacheth even to heaven. For not we alone are affected by this, but because of it, even the heavens rejoice with us, and the whole church of the firstborn, written in heaven, is made glad together, as the prophet proclaims, saying, ‘Rejoice, ye heavens, for the Lord hath had mercy upon Israel. Shout, ye foundations of the earth. Cry out with joy, ye mountains, ye high places, and all the trees which are in them, for the Lord hath redeemed Jacob, and Israel hath been glorified.’ And again; ‘Rejoice, and be glad, ye heavens; let the hills melt into gladness, for the Lord hath had mercy on His people, and comforted the oppressed of the people.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 9"
