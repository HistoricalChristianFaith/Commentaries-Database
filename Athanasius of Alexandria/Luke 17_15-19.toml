[[commentary]]
quote='''
So now, those who keep the Passover in like manner, the Lord again reproves, as He did those lepers who were cleansed, when He loved the one as thankful, but was angry with the others as ungrateful, because they did not acknowledge their Deliverer, but thought more of the cure of the leprosy than of Him who healed them. ‘But one of them when he saw that he was healed, turned back, and with a loud voice glorified God, and fell on his face at the feet of Jesus giving Him thanks; and he was a Samaritan. And Jesus answering said, Were there not ten cleansed? but those nine—whence are there none found who returned to give glory to God, but this stranger?’ And there was more given to him than to the rest; for being cleansed from his leprosy, he heard from the Lord, ‘Arise, go thy way, thy faith hath saved thee.’ For he who gives thanks, and he who glorifies, have kindred feelings, in that they bless their Helper for the benefits they have received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 3"
