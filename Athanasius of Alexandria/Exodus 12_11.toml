[[commentary]]
quote='''
Let us then, my beloved brethren, celebrate with thanksgiving the holy feast which now draws near to us, ‘girding up the loins of our minds,’ like our Saviour Jesus Christ, of Whom it is written, ‘Righteousness shall be the girdle of His loins, and faithfulness the girdle of His reins.’ Each one of us having in his hand the staff which came out of the root of Jesse, and our feet shod with the preparation of the Gospel, let us keep the feast as Paul saith, ‘Not with the old leaven, but with the unleavened bread of sincerity and truth;’ reverently trusting that we are reconciled through Christ, and not departing from faith in Him, nor do we defile ourselves together with heretics, and strangers to the truth, whose conversation and whose will degrade them. But rejoicing in afflictions, we break through the furnace of iron and darkness, and pass, unharmed, over that terrible Red Sea. Thus also, when we look upon the confusion of heretics, we shall, with Moses, sing that great song of praise, and say, ‘We will sing unto the Lord, for He is to be gloriously praised.’ Thus, singing praises, and seeing that the sin which is in us has been cast into the sea, we pass over to the wilderness. And being first purified by the fast of forty days, by prayers, and fastings, and discipline, and good works, we shall be able to eat the holy Passover in Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Section 5"

[[commentary]]
quote='''
For the feast is not on account of the days; but for the Lord’s sake, who then suffered for us, we celebrate it, for ‘our Passover Christ, is sacrificed.’ Even as Moses, when teaching Israel not to consider the feast as pertaining to the days, but to the Lord, said, ‘It is the Lord’s Passover.’ To the Jews, when they thought they were keeping the Passover, because they persecuted the Lord, the feast was useless; since it no longer bore the name of the Lord, even according to their own testimony. It was not the Passover of the Lord, but that of the Jews. The Passover was named after the Jews, my brethren, because they denied the Lord of the Passover. On this account, the Lord, turning away His face from such a doctrine of theirs, saith, ‘Your new moons and your sabbaths My soul hateth.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 2"

[[commentary]]
quote='''
Now that is a wonderful account, for a man might have seen them at that time girded as for a procession or a dance, and going out with staves, and sandals, and unleavened bread. These things, which took place before in shadows, were typical. But now the Truth is nigh unto us, ‘the Image of the invisible God,’ our Lord Jesus Christ, the true Light, Who instead of a staff, is our sceptre, instead of unleavened bread, is the bread which came down from heaven, Who, instead of sandals, hath furnished us with the preparation of the Gospel, and Who, to speak briefly, by all these hath guided us to His Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 3"
