[[commentary]]
quote='''
Although testimony was borne by Caiaphas against our Redeemer, and He was set at nought by the Jews, and was condemned by Pilate in those days, yet exalted exceedingly and most mighty was the voice of the Father which came to Him; ‘I have glorified, and will glorify again.’ For those things which He suffered for our sake have passed away; but those which belong to Him as the Saviour remain for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 3"
