[[commentary]]
quote='''
Now he who has been counted worthy of the heavenly calling, and by this calling has been sanctified, if he grow negligent in it, although washed becomes defiled: ‘counting the blood of the covenant by which he was sanctified a profane thing, and despising the Spirit of grace,’ he hears the words, ‘Friend, how camest thou in hither, not having wedding garments?’ For the banquet of the saints is spotless and pure; ‘for many are called, but few chosen.’ Judas to wit, though he came to the supper, because he despised it went out from the presence of the Lord, and having abandoned his Life, hanged himself. But the disciples who continued with the Redeemer shared in the happiness of the feast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 9"
