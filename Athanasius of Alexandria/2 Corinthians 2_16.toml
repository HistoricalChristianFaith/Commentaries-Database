[[commentary]]
quote='''
Wherefore then, my beloved, do we not acknowledge the grace as becometh the feast? Wherefore do we not make a return to our Benefactor? It is indeed impossible to make an adequate return to God; still, it is a wicked thing for us who receive the gracious gift, not to acknowledge it. Nature itself manifests our inability; but our own will reproves our unthankfulness. Therefore the blessed Paul, when admiring the greatness of the gift of God, said, ‘And who is sufficient for these things?’ For He made the world free by the blood of the Saviour; then, again, He has caused the grave to be trodden down by the Saviour’s death, and furnished a way to the heavenly gates free from obstacles to those who are going up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25205%2520For%2520333.html'
source_title="Festal Letter 5 (for 333), Section 3"
