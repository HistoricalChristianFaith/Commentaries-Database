[[commentary]]
quote='''
For what grace has the unrighteous man, though he may feign to keep the commandments? Nay rather, the unrighteous man is unable even to keep a portion of the law, for as is his mind, such of necessity must be his actions; as the Spirit says, reproving such; ‘The fool hath said in his heart, there is no God.’ After this the Word, shewing that actions correspond with thoughts, says, ‘They are corrupt; they are profane in their machinations.’ The unrighteous man then, in every respect corrupts his body; stealing, committing adultery, cursing, being drunken, and doing such like things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 8"

[[commentary]]
quote='''
For whom do Arians spare, who have spared not even their own souls? Or how can they give up their infamous actions while they persist in denying Christ our Lord the only Son of God? This is the root of their wickedness; on this foundation of sand they build up the perversity of their ways, as we find it written in the thirteenth Psalm, ‘The fool said in his heart there is no God;’ and presently follows, ‘Corrupt are they and become abominable in their works.’ Hence the Jews who denied the Son of God, deserved to be called ‘a sinful nation, a people laden with iniquity, a seed of evil doers, children without law.’ Why ‘without law?’—because you have deserted the Lord. And so the most blessed Paul, when he had begun not only to believe in the Son of God, but also to preach His deity, wrote, ‘I know nothing against myself.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252051%2520Second%2520Letter%2520to%2520Lucifer.html'
source_title="Letter 51, Second Letter to Lucifer"
