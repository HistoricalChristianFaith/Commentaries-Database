[[commentary]]
quote='''
I have been mindful while I keep the feast, to give you also notice of the great feast of Easter, that so we may go up together, as it were, to Jerusalem, and eat the Passover, not separately but as in one house; let us not as sodden in water, water down the word of God; neither let us, as having broken its bones, destroy the commands of the Gospel. But as roasted with fire, with bitterness, being fervent in spirit, in fastings and watchings, with lying on the ground, let us keep it with penitence and thanksgiving.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Section 8"
