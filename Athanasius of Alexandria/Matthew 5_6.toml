[[commentary]]
quote='''
Now wicked men hunger for bread like this, for effeminate souls will hunger; but the righteous alone, being prepared, shall be satisfied, saying, ‘I shall behold Thy face in righteousness; I shall be satisfied when Thy glory is seen by me.’ For he who partakes of divine bread always hungers with desire; and he who thus hungers has a never-failing gift, as Wisdom promises, saying, ‘The Lord will not slay the righteous soul with famine.’ He promises too in the Psalms, ‘I will abundantly bless her provision; I will satisfy her poor with bread.’ We may also hear our Saviour saying, ‘Blessed are they who hunger and thirst after righteousness, for they shall be filled.’ Well then do the saints and those who love the life which is in Christ raise themselves to a longing after this food. And one earnestly implores, saying, ‘As the hart panteth after the fountains of waters, so panteth my soul after Thee, O God! My soul thirsteth for the living God, when shall I come and see the face of God?’ And another; ‘My God, my God, I seek Thee early; my soul thirsteth for Thee; often does my flesh, in a dry and pathless land, and without water. So did I appear before Thee in holiness to see Thy power and Thy glory.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 6"
