[[commentary]]
quote='''
But let us not be like the heathen, or the ignorant Jews, or as the heretics and schismatics of the present time. For the heathen think the accomplishment of the feast is in the abundance of food; the Jews, erring in the type and shadow, think it still such; the schismatics keep it in separate places, and with vain imaginations. But let us, my brethren, be superior to the heathen, in keeping the feast with sincerity of soul, and purity of body; to the Jews, in no longer receiving the type and the shadow, but as having been gloriously illumined with the light of truth, and as looking upon the Sun of Righteousness; to the schismatics, in not rending the coat of Christ, but in one house, even in the Catholic Church, let us eat the Passover of the Lord, Who, by ordaining His holy laws, guided us towards virtue, and counselled the abstinence of this feast. For the Passover is indeed abstinence from evil for exercise of virtue, and a departure from death unto life. This may be learnt even from the type of old time. For then they toiled earnestly to pass from Egypt to Jerusalem, but now we depart from death to life; they then passed from Pharaoh to Moses, but now we rise from the devil to the Saviour. And as, at that time, the type of deliverance bore witness every year, so now we commemorate our salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25205%2520For%2520333.html'
source_title="Festal Letter 5 (for 333), Section 4"

[[commentary]]
quote='''
I have been mindful while I keep the feast, to give you also notice of the great feast of Easter, that so we may go up together, as it were, to Jerusalem, and eat the Passover, not separately but as in one house; let us not as sodden in water, water down the word of God; neither let us, as having broken its bones, destroy the commands of the Gospel. But as roasted with fire, with bitterness, being fervent in spirit, in fastings and watchings, with lying on the ground, let us keep it with penitence and thanksgiving.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Section 8"
