[[commentary]]
quote='''
Now there was a law given about these things, for the instruction of the people, and to prefigure things to come, for Paul saith to the Galatians; ‘Before faith came, we were kept guarded under the law, being shut up in the faith which should afterwards be revealed unto us; wherefore the law was our instructor in Christ, that we might be justified by faith.’ But the Jews knew not, neither did they understand, therefore they walked in the daytime as in darkness, feeling for, but not touching, the truth we possess, which [was contained] in the law; conforming to the letter, but not submitting to the spirit. And when Moses was veiled, they looked on him, but turned away their faces from him when he was uncovered. For they knew not what they read, but erroneously substituted one thing for another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Section 2"
