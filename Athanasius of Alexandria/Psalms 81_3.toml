[[commentary]]
quote='''
At set seasons also He called the children of Israel to the Levitical feasts by Moses, saying, ‘Three times in a year ye shall keep a feast to Me’ (one of which, my beloved, is that now at hand), the trumpets of the priests sounding and urging its observance; as the holy Psalmist commanded, saying, ‘Blow with the trumpet in the new moon, on the [solemn] day of your feast.’ Since this sentence enjoins upon us to blow both on the new moons, and on the solemn days, He hath made a solemn day of that in which the light of the moon is perfected in the full; which was then a type, as is this of the trumpets. At one time, as has been said, they called to the feasts; at another time to fasting and to war. And this was not done without solemnity, nor by chance, but this sound of the trumpets was appointed, so that every man should come to that which was proclaimed. And this ought to be learned not merely from me, but from the divine Scriptures, when God was revealed to Moses, and said, as it is written in the book of Numbers; ‘And the Lord spake unto Moses, saying, Make to thee two trumpets; of silver shalt thou make them, and they shall be for thee to call the congregation;’—very properly for those who here love Him. So that we may know that these things had reference to the time of Moses—yea, were to be observed so long as the shadow lasted, the whole being appointed for use, ‘till the time of reformation.’ ‘For’ (said He) ‘if ye shall go out to battle in your land against your enemies that rise up against you’ (for such things as these refer to the land, and no further), ‘then ye shall proclaim with the trumpets, and shall be remembered before the Lord, and be delivered from your enemies.’ Not only in wars did they blow the trumpet, but under the law, there was a festal trumpet also. Hear him again, going on to say, ‘And in the day of your gladness, and in your feasts, and your new moons, ye shall blow with the trumpets.’ And let no man think it a light and contemptible matter, if he hear the law command respecting trumpets; it is a wonderful and fearful thing. For beyond any other voice or instrument, the trumpet is awakening and terrible; so Israel received instruction by these means, because he was then but a child. But in order that the proclamation should not be thought merely human, being superhuman, its sounds resembled those which were uttered when they trembled before the mount; and they were reminded of the law that was then given them, and kept it.

For the law was admirable, and the shadow was excellent, otherwise, it would not have wrought fear, and induced reverence in those who heard; especially in those who at that time not only heard but saw these things. Now these things were typical, and done as in a shadow. But let us pass on to the meaning, and henceforth leaving the figure at a distance, come to the truth, and look upon the priestly trumpets of our Saviour, which cry out, and call us, at one time to war, as the blessed Paul saith; ‘We wrestle not with flesh and blood, but with principalities, with powers, with the rulers of this dark world, with wicked spirits in heaven.’ At another time the call is made to virginity, and self-denial, and conjugal harmony, saying, To virgins, the things of virgins; and to those who love the way of abstinence, the things of abstinence; and to those who are married, the things of an honourable marriage; thus assigning to each its own virtues and an honourable recompense. Sometimes the call is made to fasting, and sometimes to a feast. Hear again the same [Apostle] blowing the trumpet, and proclaiming, ‘Christ our Passover is sacrificed; therefore let us keep the feast, not with old leaven, neither with the leaven of malice and wickedness.’ If thou wouldest listen to a trumpet much greater than all these, hear our Saviour saying; ‘In that last and great day of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto Me and drink.’ For it became the Saviour not simply to call us to a feast, but to ‘the great feast;’ if only we will be prepared to hear, and to conform to the proclamation of every trumpet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25201%2520For%2520329.html'
