[[commentary]]
quote='''
At that time, Moses proclaimed the beginning of the feast, saying, ‘This month is the beginning of months to you.’ But the Lord, Who came down in the end of the ages, proclaimed a different day, not as though He would abolish the law, far from it, but that He should establish the law, and be the end of the law. ‘For Christ is the end of the law to every one that believeth in righteousness;’ as the blessed Paul saith, ‘Do we make void the law by faith? far from it: we rather establish the law.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 4"
