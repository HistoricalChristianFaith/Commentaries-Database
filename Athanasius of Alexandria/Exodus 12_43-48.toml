[[commentary]]
quote='''
But now, which is above all things most necessary, I wish to remind you, and myself with you, how that the command would have us come to the Paschal feast not profanely and without preparation, but with sacramental and doctrinal rites, and prescribed observances, as indeed we learn from the historical account, ‘A man who is of another nation, or bought with money, or uncircumcised, shall not eat the Passover.’ Neither should it be eaten in ‘any’ house, but He commands it to be done in haste; inasmuch as before we groaned and were made sad by the bondage to Pharaoh, and the commands of the task-masters. For when in former time the children of Israel acted in this way, they were counted worthy to receive the type, which existed for the sake of this feast, nor is the feast now introduced on account of the type.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 3"
