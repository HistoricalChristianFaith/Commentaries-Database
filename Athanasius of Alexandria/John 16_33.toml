[[commentary]]
quote='''
Let us rejoice as we keep the feast, my brethren, knowing that our salvation is ordered in the time of affliction. For our Saviour did not redeem us by inactivity, but by suffering for us He abolished death. And respecting this, He intimated to us before, saying, ‘In the world ye shall have tribulation.’ But He did not say this to every man, but to those who diligently and faithfully perform good service to Him, knowing beforehand, that they should be persecuted who would live godly toward Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252013%2520%2528for%2520341%2529.html'
source_title="Festal Letter 13 (for 341), Section 6"
