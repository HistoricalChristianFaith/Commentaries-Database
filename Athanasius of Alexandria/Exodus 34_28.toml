[[commentary]]
quote='''
And indeed that which I am about to say is wonderful, yea it is of those things which are very miraculous; yet not far from the truth, as ye may be able to learn from the sacred writings. That great man Moses, when fasting, conversed with God, and received the law. The great and holy Elijah, when fasting, was thought worthy of divine visions, and at last was taken up like Him who ascended into heaven. And Daniel, when fasting, although a very young man, was entrusted with the mystery, and he alone understood the secret things of the king, and was thought worthy of divine visions. But because the length of the fast of these men was wonderful, and the days prolonged, let no man lightly fall into unbelief; but rather let him believe and know, that the contemplation of God, and the word which is from Him, suffice to nourish those who hear, and stand to them in place of all food. For the angels are no otherwise sustained than by beholding at all times the face of the Father, and of the Saviour who is in heaven. And thus Moses, as long as he talked with God, fasted indeed bodily, but was nourished by divine words. When he descended among men, and God was gone up from him, he suffered hunger like other men. For it is not said that he fasted longer than forty days—those in which he was conversing with God. And, generally, each one of the saints has been thought worthy of similar transcendent nourishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25201%2520For%2520329.html'
source_title="Festal Letter 1 (for 329), Section 6"
