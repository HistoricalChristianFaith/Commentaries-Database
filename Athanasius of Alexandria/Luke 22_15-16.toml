[[commentary]]
quote='''
If then God Himself loves the feast, and calls us to it, it is not right, my brethren, that it should be delayed, or observed carelessly; but with alacrity and zeal we should come to it, so that having begun joyfully here, we may also receive an earnest of that heavenly feast. For if we diligently celebrate the feast here, we shall doubtless receive the perfect joy which is in heaven, as the Lord says; ‘With desire I have desired to eat this Passover with you before I suffer. For I say unto you, that I will not eat it, until it is fulfilled with you in the kingdom of God.’ Now we eat it if, understanding the reason of the feast, and acknowledging the Deliverer, we conduct ourselves in accordance with His grace, as Paul saith; ‘So that we may keep the Feast, not with old leaven, neither with the leaven of wickedness; but with the unleavened bread of sincerity and truth.’ For the Lord died in those days, that we should no longer do the deeds of death. He gave His life, that we might preserve our own from the snares of the devil. And, what is most wonderful, the Word became flesh, that we should no longer live in the flesh, but in spirit should worship God, who is Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 1"
