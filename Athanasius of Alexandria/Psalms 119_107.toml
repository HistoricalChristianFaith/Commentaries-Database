[[commentary]]
quote='''
Strengthen then, father, the flocks under you, exhorting them from the Apostolic writings, guiding them from the Evangelical, counselling them from the Psalms, and saying, ‘quicken me according to Thy Word;’ but by ‘Thy Word,’ is meant that we should serve Him with a pure heart. For knowing this, the Prophet says, as if interpreting himself, ‘Make me a clean heart, O God,’ lest filthy thoughts trouble me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252048%2520Letter%2520to%2520Amun%2520Written%2520Before%2520354%2520ad.html'
source_title="Letter 48, To Amun"
