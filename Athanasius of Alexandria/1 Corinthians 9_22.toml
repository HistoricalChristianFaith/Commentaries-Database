[[commentary]]
quote='''
But whereas you have also told me of the monks at Cæsarea, and I have learned from our beloved Dianius that they are vexed, and are opposing our beloved bishop Basil, I am glad you have informed me, and I have pointed out to them what is fitting, namely that as children they should obey their father, and not oppose what he approves. For if he were suspected as touching the truth, they would do well to combat him. But if they are confident, as we all are, that he is a glory to the Church, contending rather on behalf of the truth and teaching those who require it, it is not right to combat such an one, but rather to accept with thanks his good conscience. For from what the beloved Dianius has related, they appear to be vexed without cause. For he, as I am confident, to the weak becomes weak to gain the weak. But let our beloved friends look at the scope of his truth, and at his special purpose, and glorify the Lord Who has given such a bishop to Cappadocia as any district must pray to have.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252063%2520Letter%2520to%2520the%2520Presbyter%2520Palladius.html'
source_title="Letter 63, To the Presbyter Palladius"
