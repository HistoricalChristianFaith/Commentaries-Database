[[commentary]]
quote='''
For not only has He afforded us consolation respecting the distance, but also in that He has come and opened the door for us which was once shut. For, indeed, it was shut from the time He cast out Adam from the delight of Paradise, and set the Cherubim and the flaming sword, that turned every way, to keep the way of the tree of life—now, however, opened wide. And He that sitteth upon the Cherubim having appeared with greater grace and loving-kindness, led into Paradise with himself the thief who confessed, and having entered heaven as our forerunner, opened the gates to all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252043%2520%2528for%2520371%2529.html'
source_title="Festal Letter 43 (for 371)"
