[[commentary]]
quote='''
For there were first our Saviour’s own words, who from the height of His divinity, when conversing with His disciples, said, ‘Learn of Me, for I am meek and lowly in heart, and ye shall find rest to your souls.’ Then too when He poured water into a basin, and girded Himself with a towel, and washed His disciples’ feet, He said to them, ‘Know what I have done. Ye call Me Master and Lord, and ye say well, for so I am. If therefore I, your Lord and Master, have washed your feet, ye also ought to wash one another’s feet: for I have given you an example, that as I have done to you, ye also should do.’

Oh! my brethren, how shall we admire the loving-kindness of the Saviour? With what power, and with what a trumpet should a man cry out, exalting these His benefits! That not only should we bear His image, but should receive from Him an example and pattern of heavenly conversation; that as He hath begun, we should go on, that suffering, we should not threaten, being reviled, we should not revile again, but should bless them that curse, and in everything commit ourselves to God who judgeth righteously.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25202%2520For%2520330.html'
source_title="Festal Letter 2 (for 330), Sections 4-5"
