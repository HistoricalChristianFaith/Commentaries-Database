[[commentary]]
quote='''
But Israel despised and would not render, for their will was not right, nay moreover they killed those that were sent, and not even before the Lord of the vineyard were they ashamed, but even He was slain by them. Verily, when He came and found no fruit in them, He cursed them through the fig-tree, saying, ‘Let there be henceforth no fruit from thee;’ and the fig-tree was dead and fruitless so that even the disciples wondered when it withered away.

Then was fulfilled that which was spoken by the prophet; ‘I will take away from them the voice of joy and the voice of gladness, the voice of the bridegroom and the voice of the bride, the scent of myrrh, and the light of a lamp, and the whole land shall be destroyed.’ For the whole service of the law has been abolished from them, and henceforth and for ever they remain without a feast. And they observe not the Passover; for how can they? They have no abiding place, but they wander everywhere. And they eat unleavened bread contrary to the law, since they are unable first to sacrifice the lamb, as they were commanded to do when eating unleavened bread. But in every place they transgress the law, and as the judgments of God require, they keep days of grief instead of gladness. Now the cause of this to them was the slaying of the Lord, and that they did not reverence the Only-Begotten. At this time the altogether wicked heretics and ignorant schismatics are in the same case; the one in that they slay the Word, the other in that they rend the coat. They too remain expelled from the feast, because they live without godliness and knowledge, and emulate the conduct shewn in the matter of Bar-Abbas the robber, whom the Jews desired instead of the Saviour. Therefore the Lord cursed them under the figure of the fig-tree. Yet even thus He spared them in His loving-kindness, not destroying them root and all. For He did not curse the root, but [said], that no man should eat fruit of it thenceforth. When He did this, He abolished the shadow, causing it to wither; but preserved the root, so that we might [not] be grafted upon it; ‘they too, if they abide not in unbelief, may attain to be grafted into their own olive tree.’ Now when the Lord had cursed them because of their negligence, He removed from them the new moons, the true lamb, and that which is truly the Passover.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Sections 5-6"
