[[commentary]]
quote='''
Perhaps you have heard of the prophecy of Christ's death. You ask to learn [from Moses] what is set forth concerning the cross. Not even this is passed over. It is displayed by the holy men with great plainness. For first Moses predicts it, and that even with a loud voice, when he says, "You shall see your Life hanging before your eyes and shall not believe."
'''
source_url='https://www.newadvent.org/fathers/2802.htm'
source_title="On the Incarnation of the Word 35"

[[commentary]]
quote='''
And verily for their darkness and blindness, He wept. For if they had understood the things which are written in the Psalms, they would not have been so vainly daring against the Saviour, the Spirit having said, ‘Why do the heathen rage, and the people imagine a vain thing?’ And if they had considered the prophecy of Moses, they would not have hanged Him Who was their Life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 5"
