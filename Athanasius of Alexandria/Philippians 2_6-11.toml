[[commentary]]
quote='''
For Creation does not worship a creature. Nor again did she on account of His Flesh refuse to worship her Lord. But she beheld her maker in the Body, and ‘in the Name of Jesus every knee’ bowed, yea and ‘shall bow, of things in heaven and things on earth and things under the earth, and every tongue shall confess,’ whether the Arians approve or no, ‘that Jesus is Lord, to the Glory of God the Father.’ For the Flesh did not diminish the glory of the Word; far be the thought: on the contrary, it was glorified by Him. Nor, because the Son that was in the form of God took upon Him the form of a servant was He deprived of His Godhead. On the contrary, He is thus become the Deliverer of all flesh and of all creation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252060%2520To%2520Adelphius%252C%2520Bishop%2520and%2520Confessor%253A%2520Against%2520the%2520Arians.html'
source_title="Letter 60, To Adelphius, Section 4"
