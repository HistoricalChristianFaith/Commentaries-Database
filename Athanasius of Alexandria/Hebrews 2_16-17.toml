[[commentary]]
quote='''
Or what need was there even of the Word coming among us, to put on what was coessential with Himself, or to change His own nature and become a body? For the Deity does not take hold of itself, so as to put on what is of its own Essence, any more than the Word sinned, in that it ransoms the sins of others, in order that changing into a body it should offer itself a sacrifice for itself, and ransom itself.

But this is not so, far be the thought. For he ‘takes hold of the seed of Abraham,’ as the apostle said; whence it behoved Him to be made like His brethren in all things, and to take a Body like us. This is why Mary is truly presupposed, in order that He may take it from her, and offer it for us as His own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252059%2520To%2520Epictetus.html'
source_title="Letter 59, To Epictetus, Sections 4-5"
