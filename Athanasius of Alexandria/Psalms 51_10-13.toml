[[commentary]]
quote='''
Strengthen then, father, the flocks under you, exhorting them from the Apostolic writings, guiding them from the Evangelical, counselling them from the Psalms, and saying, ‘quicken me according to Thy Word;’ but by ‘Thy Word,’ is meant that we should serve Him with a pure heart. For knowing this, the Prophet says, as if interpreting himself, ‘Make me a clean heart, O God,’ lest filthy thoughts trouble me. David again, ‘And stablish me with Thy free spirit,’ that even if ever thoughts disturb me, a certain strong power from Thee may stablish me, acting as a support. Giving then this and the like advice, say with regard to those who are slow to obey the truth, ‘I will teach Thy ways unto the wicked,’ and, confident in the Lord that you will persuade them to desist from such wickedness, sing ‘and sinners shall be converted unto Thee.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252048%2520Letter%2520to%2520Amun%2520Written%2520Before%2520354%2520ad.html'
source_title="Letter 48, To Amun"
