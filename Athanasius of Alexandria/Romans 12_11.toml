[[commentary]]
quote='''
Nay but if you feared the times and acted as you did from timidity, your mind is not manly; for in such a case you ought to manifest zeal for Christ, and rather meet circumstances boldly, and use the language of blessed Paul: ‘in all these things we are more than conquerors;’ and the more so in that we ought to serve not the time, but the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252049%2520Letter%2520to%2520Dracontius%2520Written%2520ad%2520354%2520or%2520355.html'
source_title="Letter 49, To Dracontius, Section 3"
