[[commentary]]
quote='''
So, not even to him who owed ten thousand talents did the Gospel grant forgiveness in the sight of the Lord. For even he, having received forgiveness of great things, was forgetful of kindness in little ones, so that he paid the penalty also of those former things. And justly indeed, for having himself experienced kindness, he was required to be merciful to his fellow servant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Section 2"
