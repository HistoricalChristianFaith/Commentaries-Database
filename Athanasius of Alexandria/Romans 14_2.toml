[[commentary]]
quote='''
For the might of man and of all creatures, is weak and poor; but the Might which is above man, and uncreated, is rich and incomprehensible, and has no beginning, but is eternal. He does not then possess one method only of healing, but being rich, He works in divers manners for our salvation by means of His Word, Who is not restricted or hindered in His dealings towards us; but since He is rich and manifold, He varies Himself according to the individual capacity of each soul. For He is the Word and the Power and the Wisdom of God, as Solomon testifies concerning Wisdom, that ‘being one, it can do all things, and remaining in itself, it maketh all things new; and passing upon holy souls, fashioneth the friends of God and the prophets.’ To those then who have not yet attained to the perfect way He becomes like a sheep giving milk, and this was administered by Paul: ‘I have fed you with milk, not with meat.’ To those who have advanced beyond the full stature of childhood, but still are weak as regards perfection, He is their food, according to their capacity, being again administered by Paul, ‘Let him that is weak eat herbs.’ But as soon as ever a man begins to walk in the perfect way, he is no longer fed with the things before mentioned, but he has the Word for bread, and flesh for food, for it is written, ‘Strong meat is for those who are of full age, for those who, by reason of their capacity, have their senses exercised.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 4"
