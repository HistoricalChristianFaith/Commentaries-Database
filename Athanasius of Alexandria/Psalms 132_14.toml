[[commentary]]
quote='''
But if ‘he is blessed that feareth the Lord,’ we may now confidently call him blessed, having the firm assurance that he has reached as it were a haven, and has a life without care. Would that the same had also befallen each one of us; would that each of us in his running might thus arrive; would that each of us, on his voyage, might moor his own bark there in the stormless haven, so that, at rest with the fathers, he might say, ‘here will I dwell, for I have a delight therein.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252058%2520Second%2520Letter%2520to%2520Orsisius.html'
source_title="Letter 58, Second Letter to Orsisius"
