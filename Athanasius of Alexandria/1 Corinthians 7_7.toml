[[commentary]]
quote='''
The blessed Paul, being girt about with every virtue, and called faithful of the Lord—for he was conscious of nothing in himself but what was a virtue and a praise, or what was in harmony with love and godliness—clave to these things more and more, and was carried up even to heavenly places, and was borne to Paradise; to the end that, as he surpassed the conversation of men, he should be exalted above men. And when he descended, he preached to every man; ‘We know in part, and we prophesy in part; here I know in part; but then shall I know even as also I am known.’ For, in truth, he was known to those saints who are in heaven, as their fellow-citizen. And in relation to all that is future and perfect, the things known by him here were in part; but with respect to those things which were committed and entrusted to him by the Lord, he was perfect; as he said, ‘We who are perfect, should be thus minded.’ For as the Gospel of Christ is the fulfilment and accomplishment of the ministration which was supplied by the law of Israel, so future things will be the accomplishment of such as now exist, the Gospel being then fulfilled, and the faithful receiving those things which, not seeing now, they yet hope for, as Paul saith; ‘For what a man seeth, why doth he also hope for? But if we hope for those things we see [not], we then by patience wait for them.’ Since then that blessed man was of such a character, and apostolic grace was committed to him, he wrote, wishing ‘that all men should be as he was.’ For virtue is philanthropic, and great is the company of the kingdom of heaven, for thousands of thousands and myriads of myriads there serve the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 1"
