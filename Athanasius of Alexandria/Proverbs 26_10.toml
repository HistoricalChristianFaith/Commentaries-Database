[[commentary]]
quote='''
‘For from the heart proceed evil thoughts, fornications, adulteries, murders.’ By them the fool is wrecked, as by the waves of the sea, being led away and enticed by his fleshly pleasures; for this stands written, ‘All flesh of fools is greatly tempest-tossed.’ While he associates with folly, he is tossed by a tempest, and perishes, as Solomon says in the Proverbs, ‘The fool and he who lacketh understanding shall perish together, and shall leave their wealth to strangers.’ Now they suffer such things, because there is not among them one sound of mind to guide them. For where there is sagacity, there the Word, who is the Pilot of souls, is with the vessel; ‘for he that hath understanding shall possess guidance;’ but they who are without guidance fall like the leaves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Section 6"
