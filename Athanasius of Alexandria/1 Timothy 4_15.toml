[[commentary]]
quote='''
The Apostle therefore, as was meet, sent to different people, but his own son he especially reminded, ‘that he should not despise the things in which he had been instructed by him,’ and enjoined on him, ‘Remember Jesus Christ, who rose from the dead, of the seed of David, according to my Gospel.’ And speaking of these things being delivered to him, to be always had in remembrance, he immediately writes to him, saying, ‘Meditate on these things: be engaged in them.’ For constant meditation, and the remembrance of divine words, strengthens piety towards God, and produces a love to Him inseparable and not merely formal; as he, being of this mind, speaks about himself and others like-minded, saying boldly, ‘Who shall separate us from the love of God?’ For such men, being confirmed in the Lord, and possessing an unshaken disposition towards Him, and being one in spirit (for ‘he who is joined to the Spirit is one spirit’), are sure ‘as the mount Sion;’ and although ten thousand trials may rage against them, they are founded upon a rock, which is Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 4"
