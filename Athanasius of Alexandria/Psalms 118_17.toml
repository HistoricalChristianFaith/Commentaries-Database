[[commentary]]
quote='''
But the righteous man, although he appears dying to the world, uses boldness of speech, saying, ‘I shall not die, but live, and narrate all Thy marvellous deeds.’ For even God is not ashamed to be called the God of those who truly mortify their members which are upon the earth, but live in Christ; for He is the God of the living, not of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 4"
