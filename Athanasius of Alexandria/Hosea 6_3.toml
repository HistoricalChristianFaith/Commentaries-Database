[[commentary]]
quote='''
Those who are thus continually engaged, are waiting entirely on the Lord, and say, ‘Let us follow on to know the Lord: we shall find Him ready as the morning, and He will come to us as the early and the latter rain for the earth.’ For not only does He satisfy them in the morning; neither does He give them only as much to drink as they ask; but He gives them abundantly according to the multitude of His lovingkindness, vouchsafing to them at all times the grace of the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252020%2520%2528for%2520348%2529.html'
source_title="Festal Letter 20 (for 348), Section 1"
