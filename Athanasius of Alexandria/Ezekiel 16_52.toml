[[commentary]]
quote='''
And they are no longer named the people of God, and a holy nation, but rulers of Sodom, and people of Gomorrah; having exceeded in this even the iniquity of the Sodomites, as the prophet also saith, ‘Sodom is justified before thee.’ For the Sodomites raved against angels, but these against the Lord and God and King of all, and these dared to slay the Lord of angels, not knowing that Christ, who was slain by them, liveth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 5"
