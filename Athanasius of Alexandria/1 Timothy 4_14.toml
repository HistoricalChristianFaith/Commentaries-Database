[[commentary]]
quote='''
There is, moreover, the apostolic injunction, that the grace given us should not be unprofitable; for those things which he wrote particularly to his disciple, he enforces on us through him, saying, ‘Neglect not the gift that is in thee. For he who tilleth his land shall be satisfied with bread; but the paths of the slothful are strewn with thorns;’ so that the Spirit forewarns a man not to fall into them, saying, ‘Break up your fallow ground, sow not among thorns.’ For when a man despises the grace given him; and forthwith falls into the cares of the world, he delivers himself over to his lusts; and thus in the time of persecution he is offended, and becomes altogether unfruitful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Section 3"

[[commentary]]
quote='''
Or do your advisers think that you have received nothing, that they despise it? If so surely they are wrong. For it is time for them to think that the grace of the Font is nothing, if some are found to despise it. But you have received it, beloved Dracontius; do not tolerate your advisers nor deceive yourself. For this will be required of you by the God who gave it. Have you not heard the Apostle say, ‘Neglect not the gift that is in thee?’ or have you not read how he accepts the man that had doubled his money, while he condemned the one that had hidden it? But may it come to pass that you may quickly return, in order that you too may be one of those who are praised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252049%2520Letter%2520to%2520Dracontius%2520Written%2520ad%2520354%2520or%2520355.html'
source_title="Letter 49, To Dracontius, Section 4"
