[[commentary]]
quote='''
Now observe; that city, since the coming of our Saviour, has had an end, and all the land of the Jews has been laid waste; so that from the testimony of these things (and we need no further proof, being assured by our own eyes of the fact) there must, of necessity, be an end of the shadow. And not from me should these things be learned, but the sacred voice of the prophet foretold, crying; ‘Behold upon the mountains the feet of Him that bringeth good tidings, and publisheth peace;’ and what is the message he published, but that which he goes on to say to them, ‘Keep thy feasts, O Judah; pay to the Lord thy vows. For they shall no more go to that which is old; it is finished; it is taken away: He is gone up who breathed upon the face, and delivered thee from affliction.’ Now who is he that went up? a man may say to the Jews, in order that even the boast of the shadow may be done away; neither is it an idle thing to listen to the expression, ‘It is finished; he is gone up who breathed.’ For nothing was finished before he went up who breathed. But as soon as he went up, it was finished. Who was he then, O Jews, as I said before? If Moses, the assertion would be false; for the people were not yet come to the land in which alone they were commanded to perform these rites. But if Samuel, or any other of the prophets, even in that case there would be a perversion of the truth; for hitherto these things were done in Judæa, and the city was standing. For it was necessary that while that stood, these things should be performed. So that it was none of these, my beloved, who went up. But if thou wouldest hear the true matter, and be kept from Jewish fables, behold our Saviour who went up, and ‘breathed upon the face, and said to His disciples, Receive ye the Holy Ghost.’ For as soon as these things were done, everything was finished, for the altar was broken, and the veil of the temple was rent; and although the city was not yet laid waste, the abomination was ready to sit in the midst of the temple, and the city and those ancient ordinances to receive their final consummation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25201%2520For%2520329.html'
source_title="Festal Letter 1 (for 329), Section 8"
