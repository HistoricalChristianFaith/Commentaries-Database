[[commentary]]
quote='''
But those who dissemble, and steal away the truth, quench their hearts. Having first drunk of these things, they go on to say those things which the whore saith in the Proverbs, ‘Lay hold with delight on hidden bread, and sweet stolen waters.’ They lay snares secretly, because they have not the freedom of virtue, nor the boldness of Wisdom, who praises herself in the gates, and employs freedom of speech in the broad ways, preaching on high walls. For this reason, they are bidden to ‘lay hold with delight,’ because, having the choice between faith and pleasures, they steal the sweetness of truth, and disguise their own bitter waters [to escape] from the blame of their wickedness, which would have been speedy and public. On this account, the wolf puts on the skin of the sheep, sepulchres deceive by their whitened exteriors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252020%2520%2528for%2520348%2529.html'
source_title="Festal Letter 20 (for 348), Section 2"
