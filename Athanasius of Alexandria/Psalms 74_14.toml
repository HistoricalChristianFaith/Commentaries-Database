[[commentary]]
quote='''
Now the soul is humbled when it does not follow wicked opinions, but feeds on becoming virtues. For virtues and vices are the food of the soul, and it can eat either of these two meats, and incline to either of the two, according to its own will. If it is bent toward virtue, it will be nourished by virtues, by righteousness, by temperance, by meekness, by fortitude, as Paul saith; ‘Being nourished by the word of truth.’ Such was the case with our Lord, who said, ‘My meat is to do the will of My Father which is in heaven.’ But if it is not thus with the soul, and it inclines downwards, it is then nourished by nothing but sin. For thus the Holy Ghost, describing sinners and their food, referred to the devil when He said, ‘I have given him to be meat to the people of Æthiopia.’ For this is the food of sinners. And as our Lord and Saviour Jesus Christ, being heavenly bread, is the food of the saints, according to this; ‘Except ye eat My flesh, and drink My blood;’ so is the devil the food of the impure, and of those who do nothing which is of the light, but work the deeds of darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25201%2520For%2520329.html'
source_title="Festal Letter 1 (for 329), Section 5"
