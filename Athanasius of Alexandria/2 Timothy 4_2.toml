[[commentary]]
quote='''
For discerning the time is one of the duties most urgent on us, for the practice of virtue; so that the blessed Paul, when instructing his disciple, teaches him to observe the time, saying, ‘Stand (ready) in season, and out of season’—that knowing both the one and the other, he might do things befitting the season, and avoid the blame of unseasonableness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25201%2520For%2520329.html'
source_title="Festal Letter 1 (for 329), Section 1"
