[[commentary]]
quote='''
For as in the ocean there are storms and waves, so in the world there are many afflictions and trials. The unbelieving therefore ‘when affliction or persecution ariseth is offended,’ as the Lord said. For not being confirmed in the faith, and having his regard towards temporal things, he cannot resist the difficulties which arise from afflictions. But like that house, built on the sand by the foolish man, so he, being without understanding, falls before the assault of temptations, as it were by the winds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Section 7"
