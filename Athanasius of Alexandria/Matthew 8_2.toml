[[commentary]]
quote='''
We do not worship a creature. Far be the thought. For such an error belongs to heathens and Arians. But we worship the Lord of Creation, Incarnate, the Word of God. For if the flesh also is in itself a part of the created world, yet it has become God’s body. And we neither divide the body, being such, from the Word, and worship it by itself, nor when we wish to worship the Word do we set Him far apart from the Flesh, but knowing, as we said above, that ‘the Word was made flesh,’ we recognise Him as God also, after having come in the flesh. Who, accordingly, is so senseless as to say to the Lord: ‘Leave the Body that I may worship Thee;’ or so impious as to join the senseless Jews in saying, on account of the Body, ‘Why dost Thou, being a man, make Thyself God?’ But the leper was not one of this sort, for he worshipped God in the Body, and recognised that He was God, saying, ‘Lord, if Thou wilt Thou canst make me clean.’ Neither by reason of the Flesh did he think the Word of God a creature: nor because the Word was the maker of all creation did he despise the Flesh which He had put on. But he worshipped the Creator of the universe as dwelling in a created temple, and was cleansed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252060%2520To%2520Adelphius%252C%2520Bishop%2520and%2520Confessor%253A%2520Against%2520the%2520Arians.html'
source_title="Letter 60, To Adelphius, Section 3"
