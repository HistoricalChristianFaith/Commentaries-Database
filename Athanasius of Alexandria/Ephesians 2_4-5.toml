[[commentary]]
quote='''
But God, who is good, multiplied His loving-kindness towards us, not only when He granted the common salvation of us all through His Word, but now also, when enemies have persecuted us, and have sought to seize upon us. As the blessed Paul saith in a certain place, when describing the incomprehensible riches of Christ: ‘But God, being rich in mercy, for the great love wherewith He loved us, even when we were dead in follies and sins, quickened us with Christ.’ For the might of man and of all creatures, is weak and poor; but the Might which is above man, and uncreated, is rich and incomprehensible, and has no beginning, but is eternal. He does not then possess one method only of healing, but being rich, He works in divers manners for our salvation by means of His Word, Who is not restricted or hindered in His dealings towards us; but since He is rich and manifold, He varies Himself according to the individual capacity of each soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 4"
