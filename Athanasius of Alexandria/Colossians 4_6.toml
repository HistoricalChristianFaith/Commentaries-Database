[[commentary]]
quote='''
And enter upon no controversy with the heretics, but overcome their argumentativeness with silence, their ill-will with courtesy. For thus your speech shall be ‘with grace, seasoned with salt,’ while they [will be judged] by the conscience of all.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252064%2520To%2520Diodorus%2520%2528Fragment%2529.html'
source_title="Letter 64, To Diodorus"
