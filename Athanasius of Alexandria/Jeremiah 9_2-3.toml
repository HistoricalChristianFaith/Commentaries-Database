[[commentary]]
quote='''
The unrighteous man then, in every respect corrupts his body; stealing, committing adultery, cursing, being drunken, and doing such like things. Even as Jeremiah, the prophet, convicts Israel of these things, crying out and saying, ‘Oh, that I had a lodge far off in the wilderness! then would I leave my people and depart from them: for they are all adulterers, an assembly of oppressors, who draw out their tongue as a bow; lying and not truth has prevailed upon the earth, and they proceed from iniquities to iniquities; but Me they have not known.’ Thus, for wickedness and falsehood, and for deeds, in which they [proceed] from iniquity to iniquity, he reproves their practices; but, because they knew not the Lord, and were faithless, he charges them with unrighteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 8"
