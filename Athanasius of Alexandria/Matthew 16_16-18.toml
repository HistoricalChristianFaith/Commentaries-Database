[[commentary]]
quote='''
But ye are blessed, who by faith are in the Church, dwell upon the foundations of the faith, and have full satisfaction, even the highest degree of faith which remains among you unshaken. For it has come down to you from Apostolic tradition, and frequently has accursed envy wished to unsettle it, but has not been able. On the contrary, they have rather been cut off by their attempts to do so. For this is it that is written, ‘Thou art the Son of the Living God,’ Peter confessing it by revelation of the Father, and being told, ‘Blessed art thou Simon Barjona, for flesh and blood did not reveal it to thee,’ but ‘My Father Who is in heaven,’ and the rest. No one therefore will ever prevail against your Faith, most beloved brethren.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252029%2520%2528for%2520357%2529.html'
source_title="Festal Letter 29 (for 357), Fragment 3"
