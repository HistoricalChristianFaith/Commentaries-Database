[[commentary]]
quote='''
Considering therefore how it is written in the Book of Ecclesiastes, ‘I said, I will be wise, but it was far from me; That which is far off, and exceeding deep, who shall find it out?’ and what is said in the Psalms, ‘The knowledge of Thee is too wonderful for me; it is high, I cannot attain unto it;’ and that Solomon says, ‘It is the glory of God to conceal a thing;’ I frequently designed to stop and to cease writing; believe me, I did. But lest I should be found to disappoint you, or by my silence to lead into impiety those who have made enquiry of you, and are given to disputation, I constrained myself to write briefly, what I have now sent to your piety. For although a perfect apprehension of the truth is at present far removed from us by reason of the infirmity of the flesh, yet it is possible, as the Preacher himself has said, to perceive the madness of the impious, and having found it, to say that it is ‘more bitter than death.’ Wherefore for this reason, as perceiving this and able to find it out, I have written, knowing that to the faithful the detection of impiety is a sufficient information wherein piety consists. For although it be impossible to comprehend what God is, yet it is possible to say what He is not. And we know that He is not as man; and that it is not lawful to conceive of any originated nature as existing in Him. So also respecting the Son of God, although we are by nature very far from being able to comprehend Him; yet is it possible and easy to condemn the assertions of the heretics concerning Him, and to say, that the Son of God is not such; nor is it lawful even to conceive in our minds such things as they speak, concerning His Godhead; much less to utter them with the lips.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252052%2520First%2520Letter%2520to%2520Monks%2520%2528Written%2520358-360%2529.html'
source_title="Letter 52, First Letter to Monks, Section 2"
