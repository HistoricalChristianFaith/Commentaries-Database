[[commentary]]
quote='''
But such meditation, because it is evil, the Holy Spirit blames in these words, and reproves too in other terms, saying, ‘Your hands are polluted with blood, your fingers with sins; your lips have spoken lawlessness, and your tongue imagineth iniquity: no man speaketh right things, nor is there true judgment.’ But what the end is of such perverse imagining, He immediately declares, saying, ‘They trust in vanities and speak falsehood; for they conceive mischief, and bring forth lawlessness. They have hatched the eggs of an asp, and woven a spider’s web; and he who is prepared to eat of their eggs, when he breaks them finds gall, and a basilisk therein.’ Again, what the hope of such is, He has already announced. ‘Because righteousness does not overtake them, when they waited for light, they had darkness; when they waited for brightness, they walked in a thick cloud. They shall grope for the wall like the blind, and as those who have no eyes shall they grope; they shall fall at noon-day as at midnight; when dead, they shall groan. They shall roar together as a bear, or as a dove.’

This is the fruit of wickedness, these rewards are given to its familiars, for perverseness does not deliver its own. But in truth, against them it sets itself, and it tears them first, and on them especially it summons ruin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 4"
