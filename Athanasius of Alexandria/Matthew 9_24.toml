[[commentary]]
quote='''
Wherefore, brethren beloved and most longed-for, weep not for Theodorus, for he ‘is not dead, but sleepeth.’ Let none weep when he remembers him, but imitate his life. For one must not grieve over one that is gone to the place where grief is not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252058%2520Second%2520Letter%2520to%2520Orsisius.html'
source_title="Letter 58, Second Letter to Orsisius"
