[[commentary]]
quote='''
Wherefore, my beloved, having our souls nourished with divine food, with the Word, and according to the will of God, and fasting bodily in things external, let us keep this great and saving feast as becomes us. Even the ignorant Jews received this divine food, through the type, when they ate a lamb in the passover. But not understanding the type, even to this day they eat the lamb, erring in that they are without the city and the truth. As long as Judæa and the city existed, there were a type, and a lamb, and a shadow, since the law thus commanded: These things shall not be done in another city; but in the land of Judæa, and in no place without [the land of Judæa]. And besides this, the law commanded them to offer whole burnt-offerings and sacrifices, there being no other altar than that in Jerusalem. For on this account, in that city alone was there an altar and temple built, and in no other city were they permitted to perform these rites, so that when that city should come to an end, then those things that were figurative might also be done away.

Now observe; that city, since the coming of our Saviour, has had an end, and all the land of the Jews has been laid waste; so that from the testimony of these things (and we need no further proof, being assured by our own eyes of the fact) there must, of necessity, be an end of the shadow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25201%2520For%2520329.html'
source_title="Festal Letter 1 (for 329), Sections 7-8"
