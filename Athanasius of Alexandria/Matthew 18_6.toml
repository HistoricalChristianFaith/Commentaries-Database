[[commentary]]
quote='''
For many are offended when they hear it; not merely that you have done this, but that you have done it having regard to the times and to the afflictions which are weighing upon the Church. And I fear lest, in flying for your own sake, you prove to be in peril in the sight of the Lord on account of others. For if ‘he that offendeth one of the little ones, should rather choose that a mill stone were hanged about his neck, and that he were drowned in the depths of the sea,’ what can be in store for you, if you prove an offence to so many? For the surprising unanimity about your election in the district of Alexandria will of necessity be broken up by your retirement: and the episcopate of the district will be grasped at by many,—and many unfit persons, as you are well aware. And many heathen who were promising to become Christians upon your election will remain heathen, if your piety sets at nought the grace given you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252049%2520Letter%2520to%2520Dracontius%2520Written%2520ad%2520354%2520or%2520355.html'
source_title="Letter 49, To Dracontius, Section 1"
