[[commentary]]
quote='''
For since, as I before said, there are divers proclamations, listen, as in a figure, to the prophet blowing the trumpet; and further, having turned to the truth, be ready for the announcement of the trumpet, for he saith, ‘Blow ye the trumpet in Sion: sanctify a fast.’ This is a warning trumpet, and commands with great earnestness, that when we fast, we should hallow the fast. For not all those who call upon God, hallow God, since there are some who defile Him; yet not Him—that is impossible—but their own mind concerning Him; for He is holy, and has pleasure in the saints. And therefore the blessed Paul accuses those who dishonour God; ‘Transgressors of the law dishonour God.’ So then, to make a separation from those who pollute the fast, he saith here, ‘sanctify a fast.’ For many, crowding to the fast, pollute themselves in the thoughts of their hearts, sometimes by doing evil against their brethren, sometimes by daring to defraud. And, to mention nothing else, there are many who exalt themselves above their neighbours, thereby causing great mischief. For the boast of fasting did no good to the Pharisee, although he fasted twice in the week, only because he exalted himself against the publican. In the same manner the Word blamed the children of Israel on account of such a fast as this, exhorting them by Isaiah the Prophet, and saying, ‘This is not the fast and the day that I have chosen, that a man should humble his soul; not even if thou shouldest bow down thy neck like a hook, and shouldest strew sackcloth and ashes under thee; neither thus shall ye call the fast acceptable.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25201%2520For%2520329.html'
source_title="Festal Letter 1 (for 329), Section 4"
