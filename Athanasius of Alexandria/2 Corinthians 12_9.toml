[[commentary]]
quote='''
Now the blessed Paul, when troubled by afflictions, and persecutions, and hunger and thirst, ‘in everything was a conqueror, through Jesus Christ, Who loved us.’ Through suffering he was weak indeed in body, yet, believing and hoping, he was made strong in spirit, and his strength was made perfect in weakness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252013%2520%2528for%2520341%2529.html'
source_title="Festal Letter 13 (for 341), Section 2"
