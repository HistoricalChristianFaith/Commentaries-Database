[[commentary]]
quote='''
The Jews in their imaginings, and in their agreeing to act unjustly against the Lord, forgot that they were bringing wrath upon themselves. Therefore does the Word lament for them, saying, ‘Why do the people exalt themselves, and the nations imagine vain things?’ For vain indeed was the imagination of the Jews, meditating death against the Life, and devising unreasonable things against the ‘Word of the Father.’ For who that looks upon their dispersion, and the desolation of their city, may not aptly say, ‘Woe unto them, for they have imagined an evil imagination, saying against their own soul, let us bind the righteous man, because he is not pleasing to us.’ And full well is it so, my brethren; for when they erred concerning the Scriptures, they knew not that ‘he who diggeth a pit for his neighbour falleth therein; and he who destroyeth a hedge, a serpent shall bite him.’ And if they had not turned their faces from the Lord, they would have feared what was written before in the divine Psalms: ‘The heathen are caught in the pit which they made; in the snare which they hid is their own foot taken. The Lord is known when executing judgments: by the works of his hands is the sinner taken.’ Let them observe this, and how that ‘the snare they know not shall come upon them, and the net they hid take them.’ But they understood not these things, for had they done so, ‘they would not have crucified the Lord of glory.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 5"
