[[commentary]]
quote='''
And, what is greater and more startling (for perhaps this even offended those most impious men), even when the Lord was hanging upon the actual cross (for it was His Body and the Word was in it), the sun was darkened and the earth shook, the rocks were rent, and the vail of the temple rent, and many bodies of the saints which slept arose.

These things then happened, and no one doubted, as the Arians now venture to doubt, whether one is to believe the incarnate Word; but even from beholding the man, they recognised that He was their maker, and when they heard a human voice, they did not, because it was human, say that the Word was a creature. On the contrary, they trembled, and recognised nothing less than that it was being uttered from a holy Temple. How then can the impious fail to fear lest ‘as they refused to have God in their knowledge, they may be given up to a reprobate mind, to do those things which are not fitting?’ For Creation does not worship a creature. Nor again did she on account of His Flesh refuse to worship her Lord. But she beheld her maker in the Body, and ‘in the Name of Jesus every knee’ bowed, yea and ‘shall bow, of things in heaven and things on earth and things under the earth, and every tongue shall confess,’ whether the Arians approve or no, ‘that Jesus is Lord, to the Glory of God the Father.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252060%2520To%2520Adelphius%252C%2520Bishop%2520and%2520Confessor%253A%2520Against%2520the%2520Arians.html'
source_title="Letter 60, To Adelphius, Sections 3-4"
