[[commentary]]
quote='''
Therefore the righteous and faithful servants of the Lord, who ‘are made disciples for the kingdom of heaven, and bring forth from it things new and old;’ and who ‘meditate on the words of the Lord, when sitting in the house, when lying down or rising up, and when walking by the way;’—since they are of good hope because of the promise of the Spirit which said, ‘Blessed is the man that hath not walked in the counsel of the ungodly, nor stood in the way of sinners, nor sat in the seat of corrupters; but his delight is in the law of the Lord, and in His law doth he meditate day and night;’—being grounded in faith, rejoicing in hope, fervent in spirit, they have boldness to say, ‘My mouth shall speak wisdom, and the meditation of my heart shall be of understanding.’ And again, ‘I have meditated on all Thy works, and on the work of Thy hands has been my meditation.’ And, ‘If I have remembered Thee on my bed, and in the morning have meditated on Thee.’ Afterwards, advancing in boldness, they say, ‘The meditation of my heart is before Thee at all times.’ And what is the end of such an one? He cites immediately; ‘The Lord is my Helper and my Redeemer.’ For to those who thus examine themselves, and conform their hearts to the Lord, nothing adverse shall happen; for indeed, their heart is strengthened by confidence in the Lord, as it is written, ‘They who trust in the Lord are as mount Sion: he who dwelleth in Jerusalem shall not be moved for ever.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 6"
