[[commentary]]
quote='''
The whole creation keeps a feast, my brethren, and everything that hath breath praises the Lord, as the Psalmist [says], on account of the destruction of the enemies, and our salvation. And justly indeed; for if there is joy in heaven over one sinner that repenteth, what should there not be over the abolition of sin, and the resurrection of the dead? Oh what a feast and how great the gladness in heaven! how must all its hosts joy and exult, as they rejoice and watch in our assemblies, those that are held continually, and especially those at Easter? For they look on sinners while they repent; on those who have turned away their faces, when they become converted; on those who formerly persisted in lusts and excess, but who now humble themselves by fastings and temperance; and, finally, on the enemy who lies weakened, lifeless, bound hand and foot, so that we may mock at him; ‘Where is thy victory, O Death? where is thy sting, O Grave?’ Let us then sing unto the Lord a song of victory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 10"
