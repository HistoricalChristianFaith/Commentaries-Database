[[commentary]]
quote='''
Having read the letter now come from you, I approve your piety: but, marvelling at the rashness of those ‘who understand neither what they say nor whereof they confidently affirm,’ I had really decided to say nothing. For to reply upon matters which are so plain and which are clearer than light, is simply to give an excuse for shamelessness to such lawless men. And this we have learned from the Saviour. For when Pilate had washed his hands, and acquiesced in the false accusation of the Jews of that day, the Lord answered him no more, but rather warned his wife in a dream, so that He that was being judged might be believed to be God not in word, but in power. While after vouchsafing Caiaphas no reply to his folly, He Himself by his promise brought all over to knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252061%2520Letter%2520to%2520Maximus%2520%2528Written%2520About%2520371%2520ad%2529.html'
source_title="Letter 61, To Maximus, Section 1"
