[[commentary]]
quote='''
Let us, therefore, in the faith of the disciples, hold frequent converse with our Master. For the world is like the sea to us, my brethren, of which it is written, ‘This is the great and wide sea, there go the ships; the Leviathan, which Thou hast created to play therein.’ We float on this sea, as with the wind, through our own free-will, for every one directs his course according to his will, and either, under the pilotage of the Word, he enters into rest, or, laid hold on by pleasure, he suffers shipwreck, and is in peril by storm. For as in the ocean there are storms and waves, so in the world there are many afflictions and trials.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Section 7"
