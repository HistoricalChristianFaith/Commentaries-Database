[[commentary]]
quote='''
And further, when the word is sown it does not yield a uniform produce of fruit in this human life, but one various and rich; for it bringeth forth, some an hundred, and some sixty, and some thirty, as the Saviour teaches—that Sower of grace, and Bestower of the Spirit. And this is no doubtful matter, nor one that admits no confirmation; but it is in our power to behold the field which is sown by Him; for in the Church the word is manifold and the produce rich. Not with virgins alone is such a field adorned; nor with monks alone, but also with honourable matrimony and the chastity of each one. For in sowing, He did not compel the will beyond the power. Nor is mercy confined to the perfect, but it is sent down also among those who occupy the middle and the third ranks, so that He might rescue all men generally to salvation. To this intent He hath prepared many mansions with the Father, so that although the dwelling-place is various in proportion to the advance in moral attainment, yet all of us are within the wall, and all of us enter within the same fence, the adversary being cast out, and all his host expelled thence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 4"

[[commentary]]
quote='''
For there are two ways in life, as touching these matters. The one the more moderate and ordinary, I mean marriage; the other angelic and unsurpassed, namely virginity. Now if a man choose the way of the world, namely marriage, he is not indeed to blame; yet he will not receive such great gifts as the other. For he will receive, since he too brings forth fruit, namely thirtyfold. But if a man embrace the holy and unearthly way, even though, as compared with the former, it be rugged and hard to accomplish, yet it has the more wonderful gifts: for it grows the perfect fruit, namely an hundredfold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252048%2520Letter%2520to%2520Amun%2520Written%2520Before%2520354%2520ad.html'
source_title="Letter 48, To Amun"
