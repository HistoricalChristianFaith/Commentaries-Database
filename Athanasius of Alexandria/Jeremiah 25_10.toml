[[commentary]]
quote='''
Then was fulfilled that which was spoken by the prophet; ‘I will take away from them the voice of joy and the voice of gladness, the voice of the bridegroom and the voice of the bride, the scent of myrrh, and the light of a lamp, and the whole land shall be destroyed.’ For the whole service of the law has been abolished from them, and henceforth and for ever they remain without a feast. And they observe not the Passover; for how can they? They have no abiding place, but they wander everywhere. And they eat unleavened bread contrary to the law, since they are unable first to sacrifice the lamb, as they were commanded to do when eating unleavened bread. But in every place they transgress the law, and as the judgments of God require, they keep days of grief instead of gladness. Now the cause of this to them was the slaying of the Lord, and that they did not reverence the Only-Begotten.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 6"
