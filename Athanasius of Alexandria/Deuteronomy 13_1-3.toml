[[commentary]]
quote='''
‘But evil-doers and sorcerers will wax worse and worse, deceiving and being deceived.’ If therefore, like those expounders of dreams and false prophets who professed to give signs, these ignorant men being drunk, not with wine, but with their own wickedness, make a profession of priesthood, and glory in their threats, believe them not; but since we are tried, let us humble ourselves, not being drawn away by them. For so God warned His people by Moses, saying, ‘If there shall rise up among you a prophet, or a dreamer of dreams, and shall give signs and tokens, and the sign or the token shall come to pass which he spake to thee, saying, Let us go and serve strange gods, which ye have not known; ye shall not hearken unto the words of that prophet or that dreamer of dreams. For the Lord your God trieth you, that He may know whether you will love the Lord your God with all your heart.’ So we, when we are tried by these things, will not separate ourselves from the love of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252013%2520%2528for%2520341%2529.html'
source_title="Festal Letter 13 (for 341), Section 7"
