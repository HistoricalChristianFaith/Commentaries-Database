[[commentary]]
quote='''
The Saviour also, since He was changing the typical for the spiritual, promised them that they should no longer eat the flesh of a lamb, but His own, saying, ‘Take, eat and drink; this is My body, and My blood.’ When we are thus nourished by these things, we also, my beloved, shall truly keep the feast of the Passover.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25204%2520For%2520332.html'
source_title="Festal Letter 4 (for 332), Section 4"
