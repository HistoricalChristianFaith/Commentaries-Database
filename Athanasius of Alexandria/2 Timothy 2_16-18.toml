[[commentary]]
quote='''
For faith and godliness are allied to each other, and sisters; and he who believes in Him is godly, and he also who is godly, believes the more. He therefore who is in a state of wickedness, undoubtedly also wanders from the faith; and he who falls from godliness, falls from the true faith. Paul, for instance, bearing testimony to the same point, advises his disciple, saying, ‘Avoid profane conversations; for they increase unto more ungodliness, and their word takes hold as doth a canker, of whom are Hymenæus and Philetus.’ In what their wickedness consisted he declares, saying, ‘Who have erred from the faith, saying that the resurrection is already past.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 9"
