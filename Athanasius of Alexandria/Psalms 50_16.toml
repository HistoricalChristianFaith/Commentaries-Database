[[commentary]]
quote='''
And although, again, he conceal his natural falsehood, and pretend to speak truth with his lips; yet are we 'not ignorant of his devices,' but are able to answer him in the words spoken by the Spirit against him; 'But unto the ungodly, said God, why dost thou preach My laws?' and, 'Praise is not seemly in the mouth of a sinner.' For even though he speak the truth, the deceiver is not worthy of credit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FTo%2520the%2520Bishops%2520of%2520Egypt.html'
source_title="LETTER TO THE BISHOPS OF EGYPT 3"

[[commentary]]
quote='''
Therefore, although wicked men press forward to keep the feast, and as at a feast praise God, and intrude into the Church of the saints, yet God expostulates, saying to the sinner, ‘Why dost thou talk of My ordinances?’ And the gentle Spirit rebukes them, saying, ‘Praise is not comely in the mouth of a sinner.’ Neither hath sin any place in common with the praise of God; for the sinner has a mouth speaking perverse things, as the Proverb saith, ‘The mouth of the wicked answereth evil things.’ For how is it possible for us to praise God with an impure mouth? since things which are contrary to each other cannot coexist. For what communion has righteousness with iniquity? or, what fellowship is there between light and darkness? So exclaims Paul, a minister of the Gospel.

Thus it is that sinners, and all those who are aliens from the Catholic Church, heretics, and schismatics, since they are excluded from glorifying (God) with the saints, cannot properly even continue observers of the feast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 4"
