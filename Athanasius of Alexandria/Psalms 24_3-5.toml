[[commentary]]
quote='''
Who then will lead us to such a company of angels as this? Who, coming with a desire for the heavenly feast, and the angelic holiday, will say like the prophet, ‘I will pass to the place of the wondrous tabernacle, unto the house of God; with the voice of joy and praise, with the shouting of those who keep festival?’ To this course the saints also encourage us, saying, ‘Come, let us go up to the mountain of the Lord, and to the house of the God of Jacob.’ But not for the impure is this feast, nor is the ascent thereto for sinners; but it is for the virtuous and diligent; and for those who live according to the aim of the saints; for, ‘Who shall ascend to the hill of the Lord? or who shall stand in His holy place, but he that hath clean hands, and a pure heart; who hath not devoted his soul to vanity, nor sworn deceitfully to his neighbour. For he,’ as the Psalmist adds, when he goes up, ‘shall receive a blessing from the Lord.’ Now this clearly also refers to what the Lord gives to them at the right hand, saying, ‘Come, ye blessed, inherit the kingdom prepared for you.’ But the deceitful, and he that is not pure of heart, and possesses nothing that is pure (as the Proverb saith, ‘To a deceitful man there is nothing good’), shall assuredly, being a stranger, and of a different race from the saints, be accounted unworthy to eat the Passover, for ‘a foreigner shall not eat of it.’ Thus Judas, when he thought he kept the Passover, because he plotted deceit against the Saviour, was estranged from the city which is above, and from the apostolic company. For the law commanded the Passover to be eaten with due observance; but he, while eating it, was sifted of the devil, who had entered his soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 11"
