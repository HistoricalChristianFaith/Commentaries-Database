[[commentary]]
quote='''
Or possibly there are some who advise you to hide, because you have given your word upon oath not to accept the office if elected. For I hear that they are buzzing in your ears to this effect, and consider that they are thus acting conscientiously. But if they were truly conscientious, they would above all have feared God, Who imposed this ministry upon you. Or if they had read the divine Scriptures, they would not have advised you contrary to them. For it is time for them to blame Jeremiah also, and to impeach the great Moses, in that they did not listen to their advice, but fearing God fulfilled their ministry, and prophesying were made perfect. For they also when they had received their mission and the grace of Prophecy, refused. But afterwards they feared, and did not set at nought Him that sent them. Whether then you be of stammering utterance, and slow of tongue, yet fear God that made you, or if you call yourself too young to preach, yet reverence Him Who knew you before you were made. Or if you have given your word (now their word was to the saints as an oath), yet read Jeremiah, how he too had said, ‘I will not name the Name of the Lord,’ yet afterwards he feared the fire kindled within him, and did not do as he had said, nor hid himself as if bound by an oath, but reverenced Him that had entrusted to him his office, and fulfilled the prophetic call. Or are you not aware, beloved, that Jonah also fled, but met with the fate that befel him, after which he returned and prophesied?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252049%2520Letter%2520to%2520Dracontius%2520Written%2520ad%2520354%2520or%2520355.html'
source_title="Letter 49, To Dracontius, Section 5"
