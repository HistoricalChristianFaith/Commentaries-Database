[[commentary]]
quote='''
For those who are thus disposed, and fashion themselves according to the Gospel, will be partakers of Christ, and imitators of apostolic conversation, on account of which they shall be deemed worthy of that praise from him, with which he praised the Corinthians, when he said, ‘I praise you that in everything ye are mindful of me.’ Afterwards, because there were men who used his words, but chose to hear them as suited their lusts, and dared to pervert them, as the followers of Hymenæus and Alexander, and before them the Sadducees, who as he said, ‘having made shipwreck of faith,’ scoffed at the mystery of the resurrection, he immediately proceeded to say, ‘And as I have delivered to you traditions, hold them fast.’ That means, indeed, that we should think not otherwise than as the teacher has delivered.

For not only in outward form did those wicked men dissemble, putting on as the Lord says sheep’s clothing, and appearing like unto whited sepulchres; but they took those divine words in their mouth, while they inwardly cherished evil intentions. And the first to put on this appearance was the serpent, the inventor of wickedness from the beginning—the devil,—who, in disguise, conversed with Eve, and forthwith deceived her. But after him and with him are all inventors of unlawful heresies, who indeed refer to the Scriptures, but do not hold such opinions as the saints have handed down, and receiving them as the traditions of men, err, because they do not rightly know them nor their power. Therefore Paul justly praises the Corinthians, because their opinions were in accordance with his traditions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25202%2520For%2520330.html'
source_title="Festal Letter 2 (for 330), Sections 5-6"
