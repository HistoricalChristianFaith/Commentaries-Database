[[commentary]]
quote='''
Following Him, we may, even here, as on the threshold of the Jerusalem which is above, meditate beforehand on the feast which is eternal, as also the blessed Apostles, together following the Saviour Who was their Leader, have now become teachers of a like grace, saying, ‘Behold, we have left all, and followed Thee.’ For the following of the Lord, and the feast which is of the Lord, is not accomplished by words only, but by deeds, every enactment of laws and every command involving a distinct performance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 2"
