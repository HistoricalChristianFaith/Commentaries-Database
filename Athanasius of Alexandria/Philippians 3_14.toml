[[commentary]]
quote='''
Paul also, ‘pressing toward the mark for the prize of the high calling,’ by it was taken up to the third heaven, and having seen those things which are above, and then descended, he teaches us, announcing what is written to the Hebrews, and saying, ‘For ye are not come unto the mount that might be touched, and that burned with fire, and clouds, and darkness, and a tempest, and to the voice of words. But ye are come unto Mount Sion, and unto the city of the living God, the heavenly Jerusalem, and to an innumerable company of angels, and to the general assembly and Church of the first-born, which are written in heaven.’ Who would not wish to enjoy the high companionship with these! Who not desire to be enrolled with these, that he may hear with them, ‘Come, ye blessed of My Father, inherit the kingdom prepared for you from the foundation of the world.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252043%2520%2528for%2520371%2529.html'
source_title="Festal Letter 43 (for 371)"
