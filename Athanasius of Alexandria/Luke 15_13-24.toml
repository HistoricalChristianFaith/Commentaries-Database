[[commentary]]
quote='''
And that young man who went into a far country, and there wasted his substance, living in dissipation, if he receive a desire for this divine feast, and, coming to himself, shall say, ‘How many hired servants of my father have bread to spare, while I perish here with hunger!’ and shall next arise and come to his father, and confess to him, saying, ‘I have sinned against heaven and before thee, and am not worthy to be called thy son; make me as one of thy hired servants;’—when he shall thus confess, then he shall be counted worthy of more than he prayed for. For the father does not receive him as a hired servant, neither does he look upon him as a stranger, but he kisses him as a son, he brings him back to life as from the dead, and counts him worthy of the divine feast, and gives him his former and precious robe. So that, on this account, there is singing and gladness in the paternal home.

For this is the work of the Father’s loving-kindness and goodness, that not only should He make him alive from the dead, but that He should render His grace illustrious through the Spirit. Therefore, instead of corruption, He clothes him with an incorruptible garment; instead of hunger, He kills the fatted calf; instead of far journeys, [the Father] watched for his return, providing shoes for his feet; and, what is most wonderful, placed a divine signet-ring upon his hand; whilst by all these things He begat him afresh in the image of the glory of Christ. These are the gracious gifts of the Father, by which the Lord honours and nourishes those who abide with Him, and also those who return to Him and repent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Sections 9-10"
