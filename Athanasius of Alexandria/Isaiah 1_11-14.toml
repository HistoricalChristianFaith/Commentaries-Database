[[commentary]]
quote='''
Even the heathen fancy they keep festival, and the Jews hypo-critically feign to do so. But the feast of the heathen He reproves, as the bread of mourners, and He turns His face from that of the Jews, as being outcasts, saying, ‘Your new moons and your sabbaths My soul hateth.’

For actions not done lawfully and piously, are not of advantage, though they may be reputed to be so, but they rather argue hypocrisy in those who venture upon them. Therefore, although such persons feign to offer sacrifices, yet they hear from the Father, ‘Your whole burnt-offerings are not acceptable, and your sacrifices do not please Me; and although ye bring fine flour, it is vanity, incense also is an abomination unto Me.’ For God does not need anything; and, since nothing is unclean to Him, He is full in regard to them, as He testifies, by Isaiah, saying, ‘I am full.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Sections 1-2"
