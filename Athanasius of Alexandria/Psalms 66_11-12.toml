[[commentary]]
quote='''
For virtue is philanthropic, and great is the company of the kingdom of heaven, for thousands of thousands and myriads of myriads there serve the Lord. And though a man enters it through a strait and narrow way, yet having entered, he beholds immeasurable space, and a place greater than any other, as they declare, who were eye-witnesses and heirs of these things. ‘Thou didst place afflictions before us.’ But afterwards, having related their afflictions, they say, ‘Thou broughtest us forth into a wide place;’ and again, ‘In affliction Thou hast enlarged us.’ For truly, my brethren, the course of the saints here is straitened; since they either toil painfully through longing for those things which are to come, as he who said, ‘Woe is me that my pilgrimage is prolonged;’ or they are distressed and spent for the salvation of other men, as Paul wrote to the Corinthians, saying, ‘Lest, when I come to you, God should humble me, and I should bewail many of those who have sinned already, and not repented for the uncleanness and fornication and lasciviousness which they have committed.’ As Samuel bewailed the destruction of Saul, and Jeremiah wept for the captivity of the people. But after this affliction, and sorrow, and sighing, when they depart from this world, a certain divine gladness, and pleasure, and exultation receives them, from which misery and sorrow, and sighing, flee away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 1"
