[[commentary]]
quote='''
And blessed Esther, when destruction was about to come on all her race, and the nation of Israel was ready to perish, defeated the fury of the tyrant by no other means than by fasting and prayer to God, and changed the ruin of her people into safety. Now as those days are considered feasts for Israel, so also in old time feasts were appointed when an enemy was slain, or a conspiracy against the people broken up, and Israel delivered. Therefore blessed Moses of old time ordained the great feast of the Passover, and our celebration of it, because, namely, Pharaoh was killed, and the people were delivered from bondage. For in those times it was especially, when those who tyrannized over the people had been slain, that temporal feasts and holidays were observed in Judæa.

Now, however, that the devil, that tyrant against the whole world, is slain, we do not approach a temporal feast, my beloved, but an eternal and heavenly. Not in shadows do we shew it forth, but we come to it in truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25204%2520For%2520332.html'
source_title="Festal Letter 4 (for 332), Sections 2-3"

[[commentary]]
quote='''
Thus anciently, the people of the Jews, when they came out of affliction into a state of ease, kept the feast, singing a song of praise for their victory. So also the people in the time of Esther, because they were delivered from the edict of death, kept a feast to the Lord, reckoning it a feast, returning thanks to the Lord, and praising Him for having changed their condition. Therefore let us, performing our vows to the Lord, and confessing our sins, keep the feast to the Lord, in conversation, moral conduct, and manner of life; praising our Lord, Who hath chastened us a little, but hath not utterly failed nor forsaken us, nor altogether kept silence from us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 11"
