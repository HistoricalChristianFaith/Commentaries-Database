[[commentary]]
quote='''
Why therefore do we tarry, and why do we delay, and not come with all eagerness and diligence to the feast, trusting that it is Jesus who calleth us? Who is all things for us, and was laden in ten thousand ways for our salvation; Who hungered and thirsted for us, though He gives us food and drink in His saving gifts. For this is His glory, this the miracle of His divinity, that He changed our sufferings for His happiness. For, being life, He died that He might make us alive, being the Word, He became flesh, that He might instruct the flesh in the Word, and being the fountain of life, He thirsted our thirst, that thereby He might urge us to the feast, saying, ‘If any man thirst, let him come to Me, and drink.’ At that time, Moses proclaimed the beginning of the feast, saying, ‘This month is the beginning of months to you.’ But the Lord, Who came down in the end of the ages, proclaimed a different day, not as though He would abolish the law, far from it, but that He should establish the law, and be the end of the law. ‘For Christ is the end of the law to every one that believeth in righteousness;’ as the blessed Paul saith, ‘Do we make void the law by faith? far from it: we rather establish the law.’ Now these things astonished even the officers who were sent by the Jews, so that wondering they said to the Pharisees, ‘No man ever thus spake.’ What was it then that astonished those officers, or what was it which so affected the men as to make them marvel? It was nothing but the boldness and authority of our Saviour. For when of old time prophets and scribes studied the Scriptures, they perceived that what they read did not refer to themselves, but to others. Moses, for instance, ‘A prophet will the Lord raise up unto you of your brethren, like unto me; to him hearken in all that he commands you.’ Isaiah again, ‘Behold, a virgin shall conceive and bear a son, and ye shall call his name Emmanuel.’ And others prophesied in different and various ways, concerning the Lord. But by the Lord, of Himself, and of no other, were these things prophesied; to Himself He limited them all, saying, ‘If any man thirst, let him come to Me’—not to any other person, but to ‘Me.’ A man may indeed hear from those concerning My coming, but he must not henceforth drink from others, but from Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 4"

[[commentary]]
quote='''
When therefore the servants of the Chief Priests and the Scribes saw these things, and heard from Jesus, ‘Whosoever is athirst, let him come to Me and drink;’ they perceived that this was not a mere man like themselves, but that this was He Who gave water to the saints, and that it was He Who was announced by the prophet Isaiah. For He was truly the splendour of the light, and the Word of God. And thus as a river from the fountain he gave drink also of old to Paradise; but now to all men He gives the same gift of the Spirit, and says, ‘If any man thirst, let him come to Me and drink.’ Whosoever ‘believeth on Me, as saith the Scripture, rivers of living water shall flow out of his belly.’ This was not for man to say, but for the living God, Who truly vouchsafes life, and gives the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252044%2520%2528for%2520372%2529.html'
source_title="Festal Letter 44 (for 372)"
