[[commentary]]
quote='''
And the Lord most righteously reproved the Jews, saying, ‘Wherefore do ye also transgress the commandments of God on account of your traditions.’ For they changed the commandments they received from God after their own understanding, preferring to observe the traditions of men. And about these, a little after, the blessed Paul again gave directions to the Galatians who were in danger thereof, writing to them, ‘If any man preach to you aught else than that ye have received, let him be accursed.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25202%2520For%2520330.html'
source_title="Festal Letter 2 (for 330), Section 6"
