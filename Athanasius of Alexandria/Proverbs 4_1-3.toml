[[commentary]]
quote='''
And, generally, the commands of all the saints urge us on similarly, as Solomon makes use of proverbs, saying, ‘Hear, my children, the instruction of a father, and attend to know understanding; for I give you a good gift, forsake ye not my word: for I was an obedient son to my father, and beloved in the sight of my mother.’ For a just father brings up [his children] well, when he is diligent in teaching others in accordance with his own upright conduct, so that when he meets with opposition, he may not be ashamed on hearing it said, ‘Thou therefore that teachest others, teachest thou not thyself?’ but rather, like the good servant, may both save himself and gain others; and thus, when the grace committed to him has been doubled, he may hear, ‘Thou good and faithful servant, thou hast been faithful in a little, I will set thee over much: enter into the joy of thy Lord.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25202%2520For%2520330.html'
source_title="Festal Letter 2 (for 330), Section 1"
