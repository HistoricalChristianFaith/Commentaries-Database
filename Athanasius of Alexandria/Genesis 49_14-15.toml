[[commentary]]
quote='''
Now to this the example of Issachar, the patriarch, may persuade, as the Scripture saith, ‘Issachar desires that which is good, resting between the heritages; and when he saw that the rest was good, and the land fertile, he bowed his shoulder to labour, and became a husbandman.’ Being consumed by divine love, like the spouse in the Canticles, he gathered abundance from the holy Scriptures, for his mind was captivated not by the old alone, but by both the heritages. And hence as it were, spreading his wings, he beheld afar off ‘the rest’ which is in heaven, and,—since this ‘land’ consists of such beautiful works,—how much more truly the heavenly [country] must also [consist] of such; for the other is ever new, and grows not old. For this ‘land’ passes away, as the Lord said; but that which is ready to receive the saints is immortal. Now when Issachar, the patriarch, saw these things, he joyfully made his boast of afflictions and toils, bowing his shoulders that he might labour. And he did not contend with those who smote him, neither was he disturbed by insults; but like a strong man triumphing the more by these things, and the more earnestly tilling his land, he received profit from it. The Word scattered the seed, but he watchfully cultivated it, so that it brought forth fruit, even a hundred-fold.

Now what does this mean, my beloved, but that we also, when the enemies are arrayed against us, should glory in afflictions, and that when we are persecuted, we should not be discouraged, but should the rather press after the crown of the high calling in Christ Jesus our Lord? and that being insulted, we should not be disturbed, but should give our cheek to the smiter, and bow the shoulder?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252013%2520%2528for%2520341%2529.html'
source_title="Festal Letter 13 (for 341), Sections 5-6"
