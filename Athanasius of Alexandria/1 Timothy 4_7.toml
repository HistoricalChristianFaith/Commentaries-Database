[[commentary]]
quote='''
Therefore the blessed Paul, when urging us to such exercises as these, and having before measured himself by them, says, ‘Therefore I take pleasure in afflictions, in infirmities.’ And again, ‘Exercise thyself unto godliness.’ For since he knew the persecutions that befel those who chose to live in godliness, he wished his disciples to meditate beforehand on the difficulties connected with godliness; that when trials should come, and affliction arise, they might be able to bear them easily, as having been exercised in these things. For in those things wherewith a man has been conversant in mind, he ordinarily experiences a hidden joy. In this way, the blessed martyrs, becoming at first conversant with difficulties, were quickly perfected in Christ, regarding as nought the injury of the body, while they contemplated the expected rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252013%2520%2528for%2520341%2529.html'
source_title="Festal Letter 13 (for 341), Section 3"
