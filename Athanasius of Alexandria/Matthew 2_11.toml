[[commentary]]
quote='''
Let then the unbelievers perceive this, and learn that while as a Babe He lay in a manger, He subjected the Magi and was worshipped by them; and while as a Child He came down to Egypt, He brought to nought the hand-made objects of its idolatry: and crucified in the flesh, He raised the dead long since turned to corruption. And it has been made plain to all that not for His own sake but for ours He underwent all things, that we by His sufferings might put on freedom from suffering and incorruption, and abide unto life eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252061%2520Letter%2520to%2520Maximus%2520%2528Written%2520About%2520371%2520ad%2529.html'
source_title="Letter 61, To Maximus, Section 4"
