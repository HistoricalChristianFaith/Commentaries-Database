[[commentary]]
quote='''
Now a fire such as this laid hold of Jeremiah the prophet, when the word was in him as a fire, and he said, ‘I pass away from every place, and am not able to endure it.’ And our Lord Jesus Christ, being good and a lover of men, came that He might cast this upon earth, and said, ‘And what? would that it were already kindled!’ For He desired, as He testified in Ezekiel, the repentance of a man rather than his death; so that evil should be entirely consumed in all men, that the soul, being purified, might be able to bring forth fruit; for the word which is sown by Him will be productive, some thirty, some sixty, some an hundred. Thus, for instance, those who were with Cleopas, although infirm at first from lack of knowledge, yet afterwards were inflamed with the words of the Saviour, and brought forth the fruits of the knowledge of Him. The blessed Paul also, when seized by this fire, revealed it not to flesh and blood, but having experienced the grace, he became a preacher of the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Section 4"
