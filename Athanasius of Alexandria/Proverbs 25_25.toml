[[commentary]]
quote='''
And what it is they thirst for He immediately adds, saying, ‘He that believeth on Me.’ For, ‘as cold waters are pleasant to those who are thirsty,’ according to the proverb, so to those who believe in the Lord, the coming of the Spirit is better than all refreshment and delight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252020%2520%2528for%2520348%2529.html'
source_title="Festal Letter 20 (for 348), Section 1"
