[[commentary]]
quote='''
And this is a great proof that, whereas we were strangers, we are called friends; from being formerly aliens, we are become fellow-citizens with the saints, and are called children of the Jerusalem which is above, whereof that which Solomon built was a type. For if Moses made all things according to the pattern shewed him in the mount, it is clear that the service performed in the tabernacle was a type of the heavenly mysteries, whereto the Lord, desirous that we should enter, prepared for us the new and abiding way. And as all the old things were a type of the new, so the festival that now is, is a type of the joy which is above, to which coming with psalms and spiritual songs, let us begin the fasts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252045%2520%2528for%2520373%2529.html'
source_title="Festal Letter 45 (for 373)"
