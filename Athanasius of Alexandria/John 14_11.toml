[[commentary]]
quote='''
I know indeed, that when these things are spoken, they will gnash their teeth upon us, with the devil who stirs them up, since they are troubled by the declaration of the true glory concerning the Redeemer. But the Lord, Who always has scoffed at the devil, does the same even now, saying, ‘I am in the Father, and the Father in Me.’ This is the Lord, Who is manifested in the Father, and in Whom also the Father is manifested; Who, being truly the Son of the Father, at last became incarnate for our sakes, that He might offer Himself to the Father in our stead, and redeem us through His oblation and sacrifice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 10"
