[[commentary]]
quote='''
For although place separate us, yet the Lord the Giver of the feast, and Who is Himself our feast, Who is also the Bestower of the Spirit, brings us together in mind, in harmony, and in the bond of peace. For when we mind and think the same things, and offer up the same prayers on behalf of each other, no place can separate us, but the Lord gathers and unites us together. For if He promises, that ‘when two or three are gathered together in His name, He is in the midst of them,’ it is plain that being in the midst of those who in every place are gathered together, He unites them, and receives the prayers of all of them, as if they were near, and listens to all of them, as they cry out the same Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 2"
