[[commentary]]
quote='''
But this is God's kindness to man, that of whom He is Maker, of them according to grace He afterwards becomes Father also; becomes, that is, when men, His creatures, receive into their hearts, as the Apostle says, "the Spirit of His Son, crying, Abba, Father." And these are they who, having received the Word, gained power from Him to become sons of God; for they could not become sons, being by nature creatures, otherwise than by receiving the Spirit of the natural and true Son. Wherefore, that this might be, "The Word became flesh," that He might make man capable of Godhead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FFour%2520Discourses%2520Against%2520the%2520Arians%2FDiscourse%25202.html'
source_title="Four Discourses Against the Arians, Discourse 2, Chapter 59"


[[commentary]]
quote='''
For the Word perceived that death was the only way that the corruption of people could be undone. However, it was impossible for the Word to suffer death, being immortal and Son of the Father. Therefore, he takes to himself a body capable of death, so that such a body, by partaking of the Word who is above all, might be worthy to die in the stead of all, and might, because of the Word that had come to dwell in it, remain incorruptible. In this way, the corruption of all might be checked by the grace of the resurrection. By offering to death the body he himself had taken, as an offering and sacrifice free from any stain, he got rid of death for all his peers by offering an equivalent. For the Word of God, which by his very nature is over everything, by offering his own temple and bodily vessel for the life of all, satisfied the debt by his death. And thus he, the incorruptible Son of God, joined with all by a similar nature, naturally clothed all with incorruption by the promise of the resurrection. For the actual corruption in death no longer has a hold on humanity because of the Word which, by his one body, has come to dwell among them. It is similar to when a great king has entered into some large city and taken up residence in one of the houses there. That city is thus deemed worthy of high honor. No enemy or bandit any longer descends on it and subdues it. On the contrary, it finds itself entitled to total protection because the king has taken up his residence in a single house there: so, too, has it been with the Monarch of all. For now that he has come to our realm and taken up residence in one body among his peers, from this time forward the whole conspiracy of the enemy against humankind is checked, and the corruption of death, which before had prevailed against them, is done away with. For the human race would have gone to ruin if the Lord and Savior of all, the Son of God, had not come among us to meet the end of death.
'''
source_url='https://www.newadvent.org/fathers/2802.htm'
source_title="On the Incarnation of the Word 9.1-4"


[[commentary]]
quote='''
He was made man that we might be made god. He manifested himself by a body that we might receive a conception of the unseen Father. He endured the hubris of humanity that we might inherit incorruptibility. For on the one hand, he himself was in no way injured, being impassible and incorruptible and very Word and God; but on the other hand, in his own impassibility he maintained and preserved those human beings who were suffering and for whose sakes he endured all this.
'''
source_url='https://www.newadvent.org/fathers/2802.htm'
source_title="On the Incarnation of the Word 54.3"

[[commentary]]
quote='''
These things being thus demonstrated, it is superfluous to touch upon the other points, or to enter upon any discussion relating to them, since the body in which the Word was is not coessential with the Godhead, but was truly born of Mary, while the Word Himself was not changed into bones and flesh, but came in the flesh. For what John said, ‘The Word was made flesh,’ has this meaning, as we may see by a similar passage; for it is written in Paul: ‘Christ has become a curse for us.’ And just as He has not Himself become a curse, but is said to have done so because He took upon Him the curse on our behalf, so also He has become flesh not by being changed into flesh, but because He assumed on our behalf living flesh, and has become Man. For to say ‘the Word became flesh,’ is equivalent to saying ‘the Word has become man;’ according to what is said in Joel: ‘I will pour forth of My Spirit upon all flesh;’ for the promise did not extend to the irrational animals, but is for men, on whose account the Lord is become Man. As then this is the sense of the above text, they all will reasonably condemn themselves who have thought that the flesh derived from Mary existed before her, and that the Word, prior to her, had a human soul, and existed in it always even before His coming.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252059%2520To%2520Epictetus.html'
source_title="Letter 59, To Epictetus, Section 8"

[[commentary]]
quote='''
For, once again, in their other fallacy one can see how great is their folly. For if they think because it is contained and stated in the Scriptures, that the Body of the Saviour is human and derived from Mary, that a Tetrad is substituted for a Triad, as though the Body created an addition, they go very far wrong, so much so as to make the creature equal to the Creator, and suppose that the Godhead can receive an addition. And they have failed to perceive that the Word is become Flesh, not by reason of an addition to the Godhead, but in order that the flesh may rise again. Nor did the Word proceed from Mary that He might be bettered, but that He might ransom the human race. How then can they think that the Body, ransomed and quickened by the Word, made an addition in respect of Godhead to the Word that had quickened it? For on the contrary, a great addition has accrued to the human Body itself from the fellowship and union of the Word with it. For instead of mortal it is become immortal; and, though an animal body, it is become spiritual, and though made from earth it entered the heavenly gates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252059%2520To%2520Epictetus.html'
source_title="Letter 59, To Epictetus, Section 9"

[[commentary]]
quote='''
But with regard to the imagination of some, who say that the Word came upon one particular man, the Son of Mary, just as it came upon each of the Prophets, it is superfluous to discuss it, since their madness carries its own condemnation manifestly with it. For if He came thus, why was that man born of a virgin, and not like others of a man and woman? For in this way each of the saints also was begotten. Or why, if the Word came thus, is not the death of each one said to have taken place on our behalf, but only this man’s death? Or why, if the Word sojourned among us in the case of each one of the prophets, is it said only in the case of Him born of Mary that He sojourned here ‘once at the consummation of the ages?’ Or why, if He came as He had come in the saints of former times, did the Son of Mary alone, while all the rest had died without rising as yet, rise again on the third day? Or why, if the Word had come in like manner as He had done in the other cases, is the Son of Mary alone called Emmanuel, as though a Body filled full of the Godhead were born of her? For Emmanuel is interpreted ‘God with us.’ Or why, if He came thus, is it not said that when each of the saints ate, drank, laboured, and died, that He (the Word) ate, drank, laboured, and died, but only in the case of the Son of Mary. For what that Body suffered is said to have been suffered by the Word. And while we are merely told of the others that they were born, and begotten, it is said in the case of the Son of Mary alone that ‘The Word was made Flesh.’

This proves that while to all the others the Word came, in order that they might prophesy, from Mary the Word Himself took flesh, and proceeded forth as man; being by nature and essence the Word of God, but after the flesh man of the seed of David, and made of the flesh of Mary, as Paul said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252059%2520To%2520Epictetus.html'
source_title="Letter 59, To Epictetus, Sections 11-12"

[[commentary]]
quote='''
We do not worship a creature. Far be the thought. For such an error belongs to heathens and Arians. But we worship the Lord of Creation, Incarnate, the Word of God. For if the flesh also is in itself a part of the created world, yet it has become God’s body. And we neither divide the body, being such, from the Word, and worship it by itself, nor when we wish to worship the Word do we set Him far apart from the Flesh, but knowing, as we said above, that ‘the Word was made flesh,’ we recognise Him as God also, after having come in the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252060%2520To%2520Adelphius%252C%2520Bishop%2520and%2520Confessor%253A%2520Against%2520the%2520Arians.html'
source_title="Letter 60, To Adelphius, Section 3"

[[commentary]]
quote='''
Accordingly it is no good venture of theirs to say that the Word of God came into a certain holy man; for this was true of each of the prophets and of the other saints, and on that assumption He would clearly be born and die in the case of each one of them. But this is not so, far be the thought. But once for all ‘at the consummation of the ages, to put away sin’ ‘the Word was made flesh’ and proceeded forth from Mary the Virgin, Man after our likeness, as also He said to the Jews, ‘Wherefore seek ye to kill Me, a man that hath told you the truth?’ And we are deified not by partaking of the body of some man, but by receiving the Body of the Word Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252061%2520Letter%2520to%2520Maximus%2520%2528Written%2520About%2520371%2520ad%2529.html'
source_title="Letter 61, To Maximus, Section 2"

[[commentary]]
quote='''
Why, even now that He is become man we behold His Glory, ‘glory as of one only-begotten of His Father—full of grace and truth.’ For what He endured by means of the Body, He magnified as God. And while He hungered in the flesh, as God He fed the hungry. And if anyone is offended by reason of the bodily conditions, let him believe by reason of what God works. For humanly He enquires where Lazarus is laid, but raises him up divinely.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252061%2520Letter%2520to%2520Maximus%2520%2528Written%2520About%2520371%2520ad%2529.html'
source_title="Letter 61, To Maximus, Section 3"
