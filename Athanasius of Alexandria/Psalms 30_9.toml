[[commentary]]
quote='''
The Lord too was sacrificed, that by His blood He might abolish death. Full well did He once, in a certain place, blame those who participated vainly in the shedding of His blood, while they did not delight themselves in the flesh of the Word, saying, ‘What profit is there in my blood, that I go down to corruption?’ This does not mean that the descent of the Lord was without profit, for it gained the whole world; but rather that after He had thus suffered, sinners would prefer to suffer loss than to profit by it. For He regarded our salvation as a delight and a peculiar gain; while on the contrary He looked upon our destruction as loss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 4"
