[[commentary]]
quote='''
But again, desirous of shewing that faith is yoked with godliness, the Apostle says, ‘And all those who will live godly in Jesus Christ shall suffer persecution.’ Afterwards, that no man should renounce godliness through persecution, he counsels them to preserve the faith, adding, ‘Thou, therefore, continue in the things thou hast learned, and hast been assured of.’ And as when brother is helped by brother, they become as a wall to each other; so faith and godliness, being of like growth, hang together, and he who is practised in the one, of necessity is strengthened by the other.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 9"
