[[commentary]]
quote='''
Now, my beloved, our will ought to keep pace with the grace of God, and not fall short; lest while our will remains idle, the grace given us should begin to depart, and the enemy finding us empty and naked, should enter [into us], as was the case with him spoken of in the Gospel, from whom the devil went out; ‘for having gone through dry places, he took seven other spirits more wicked than himself; and returning and finding the house empty, he dwelt there, and the last state of that man was worse than the first.’ For the departure from virtue gives place for the entrance of the unclean spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Section 3"
