[[commentary]]
quote='''
Not therefore separately, but unitedly and collectively, let us all keep the feast together, as the prophet exhorts, saying, ‘O come, let us rejoice in the Lord; let us make a joyful noise unto God our Saviour.’ Who then is so negligent, or who so disobedient to the divine voice, as not to leave everything, and run to the general and common assembly of the feast? which is not in one place only, for not one place alone keeps the feast; but ‘into all the earth their song has gone forth, and to the ends of the world their words.’ And the sacrifice is not offered in one place, but ‘in every nation, incense and a pure sacrifice is offered unto God.’ So when in like manner from all in every place, praise and prayer shall ascend to the gracious and good Father, when the whole Catholic Church which is in every place, with gladness and rejoicing, celebrates together the same worship to God, when all men in common send up a song of praise and say, Amen; how blessed will it not be, my brethren! who will not, at that time, be engaged, praying rightly?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 11"
