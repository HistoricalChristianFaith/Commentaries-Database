[[commentary]]
quote='''
For it is not His will that the grace we have received should be unprofitable; but He requires us to take pains to render Him His own fruits, as the blessed Paul saith; ‘The fruit of the Spirit is love, joy, and peace.’ Having therefore this right resolution, and owing no man anything, but rather giving everything to every man, he was a teacher of the like rightness of principle, saying, ‘Render to all their dues.’ He was like those sent by the householder to receive the fruits of the vineyard from the husbandmen; for he exhorted all men to render a return. But Israel despised and would not render, for their will was not right, nay moreover they killed those that were sent, and not even before the Lord of the vineyard were they ashamed, but even He was slain by them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 5"
