[[commentary]]
quote='''
That then which was born of Mary was according to the divine Scriptures human by nature, and the Body of the Lord was a true one; but it was this, because it was the same as our body, for Mary was our sister inasmuch as we all are from Adam. And no one can doubt of this when he remembers what Luke wrote. For after He had risen from the dead, when some thought that they did not see the Lord in the body derived from Mary, but were beholding a spirit instead, He said, ‘See My hands and My feet, and the prints of the nails, that it is I Myself: handle Me and see; for a spirit hath not flesh and bones as ye see Me to have. And when He had said thus, He shewed them His hands and His feet.’ Whence they can be refuted who have ventured to say that the Lord was transformed into flesh and bones. For He did not say, ‘As ye see Me to be flesh and bone,’ but ‘as ye see Me to have,’ in order that it might not be thought that the Word Himself was changed into these things, but that He might be believed to have them after His resurrection as well as before His death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252059%2520To%2520Epictetus.html'
source_title="Letter 59, To Epictetus, Section 7"
