[[commentary]]
quote='''
For the following of the Lord, and the feast which is of the Lord, is not accomplished by words only, but by deeds, every enactment of laws and every command involving a distinct performance. For as great Moses, when administering the holy laws, exacted a promise from the people, respecting the practice of them, so that having promised, they might not neglect them, and be accused as liars, thus also, the celebration of the feast of the Passover raises no question, and demands no reply; but when the word is given, the performance of it follows, for He saith, ‘And the children of Israel shall keep the Passover;’ intending that there should be a ready performance of the commandment, while the command should aid its execution.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 2"
