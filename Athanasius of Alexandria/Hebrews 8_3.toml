[[commentary]]
quote='''
And at this also I am much surprised, how they have ventured to entertain such an idea as that the Word became man in consequence of His Nature. For if this were so, the commemoration of Mary would be superfluous. For neither does Nature know of a Virgin bearing apart from a man. Whence by the good pleasure of the Father, being true God, and Word and Wisdom of the Father by nature, He became man in the body for our salvation, in order that having somewhat to offer for us He might save us all, ‘as many as through fear of death were all their life-time subject to bondage.’ For it was not some man that gave Himself up for us; since every man is under sentence of death, according to what was said to all in Adam, ‘earth thou art and unto earth thou shalt return.’ Nor yet was it any other of the creatures, since every creature is liable to change. But the Word Himself offered His own Body on our behalf that our faith and hope might not be in man, but that we might have our faith in God the Word Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252061%2520Letter%2520to%2520Maximus%2520%2528Written%2520About%2520371%2520ad%2529.html'
source_title="Letter 61, To Maximus, Section 3"
