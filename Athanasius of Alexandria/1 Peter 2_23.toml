[[commentary]]
quote='''
For how shall patience be looked for, if there be not previously labours and sorrows? Or how can fortitude be tested with no assault from enemies? Or how shall magnanimity be exhibited, unless after contumely and injustice? Or how can long-suffering be proved, unless there has first been the calumny of Antichrist? And, finally, how can a man behold virtue with his eyes, unless the iniquity of the very wicked has previously appeared? Thus even our Lord and Saviour Jesus Christ comes before us, when He would shew men how to suffer, Who when He was smitten bore it patiently, being reviled He reviled not again, when He suffered He threatened not, but He gave His back to the smiters, and His cheeks to buffetings, and turned not His face from spitting; and at last, was willingly led to death, that we might behold in Him the image of all that is virtuous and immortal, and that we, conducting ourselves after these examples, might truly tread on serpents and scorpions, and on all the power of the enemy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 7"
