[[commentary]]
quote='''
And I thought it needful to represent to your Piety what pains the writing of these things has cost me, in order that you may understand thereby how truly the blessed Apostle has said, ‘O the depth of the riches both of the wisdom and knowledge of God;’ and may kindly bear with a weak man such as I am by nature. For the more I desired to write, and endeavoured to force myself to understand the Divinity of the Word, so much the more did the knowledge thereof withdraw itself from me; and in proportion as I thought that I apprehended it, in so much I perceived myself to fail of doing so. Moreover also I was unable to express in writing even what I seemed to myself to understand; and that which I wrote was unequal to the imperfect shadow of the truth which existed in my conception.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252052%2520First%2520Letter%2520to%2520Monks%2520%2528Written%2520358-360%2529.html'
source_title="Letter 52, First Letter to Monks, Section 1"
