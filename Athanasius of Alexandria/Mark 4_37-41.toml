[[commentary]]
quote='''
The Lord proved the disciples, when He was asleep on the pillow, at which time a miracle was wrought, which is especially calculated to put even the wicked to shame. For when He arose, and rebuked the sea, and silenced the storm, He plainly shewed two things; that the storm of the sea was not from the winds, but from fear of its Lord Who walked upon it, and that the Lord Who rebuked it was not a creature, but rather its Creator, since a creature is not obedient to another creature. For although the Red Sea was divided before by Moses, yet it was not Moses who did it, for it came to pass, not because he spake, but because God commanded. And if the sun stood still in Gibeon, and the moon in the valley of Ajalon, yet this was the work, not of the son of Nun, but of the Lord, Who heard his prayer. He it was Who both rebuked the sea, and on the cross caused the sun to be darkened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252029%2520%2528for%2520357%2529.html'
source_title="Festal Letter 29 (for 357), Fragment 1"
