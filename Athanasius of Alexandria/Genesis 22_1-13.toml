[[commentary]]
quote='''
For thus the patriarch Abraham rejoiced not to see his own day, but that of the Lord; and thus looking forward ‘he saw it, and was glad.’ And when he was tried, by faith he offered up Isaac, and sacrificed his only-begotten son—he who had received the promises. And, in offering his son, he worshipped the Son of God. And, being restrained from sacrificing Isaac, he saw the Messiah in the ram, which was offered up instead as a sacrifice to God. The patriarch was tried, through Isaac, not however that he was sacrificed, but He who was pointed out in Isaiah; ‘He shall be led as a lamb to the slaughter, and as a sheep before her shearers he shall be speechless;’ but He took away the sin of the world. And on this account [Abraham] was restrained from laying his hand on the lad, lest the Jews, taking occasion from the sacrifice of Isaac, should reject the prophetic declarations concerning our Saviour, even all of them, but more especially those uttered by the Psalmist; ‘Sacrifice and offering Thou wouldest not; a body Thou hast prepared Me;’ and should refer all such things as these to the son of Abraham.

For the sacrifice was not properly the setting to rights of Isaac, but of Abraham who also offered, and by that was tried. Thus God accepted the will of the offerer, but prevented that which was offered from being sacrificed. For the death of Isaac did not procure freedom to the world, but that of our Saviour alone, by whose stripes we all are healed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Sections 8-9"
