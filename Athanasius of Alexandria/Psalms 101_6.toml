[[commentary]]
quote='''
And this is the characteristic of those who fall away from the faith—to injure and persecute the faithful. The saints on the other hand, take such to themselves and look upon them as friends; as also the blessed David, using openness of speech, says, ‘Mine eyes are on the faithful of the earth, that they may dwell with me.’ But those that are weak in the faith, Paul urges that we should especially take to ourselves. For virtue is philanthropic, just as in men of an opposite character, sin is misanthropic. So Saul, being a sinner, persecuted David, whereas David, though he had a good opportunity, did not kill Saul. Esau too persecuted Jacob, while Jacob overcame his wickedness by meekness. And those eleven sold Joseph, but Joseph, in his loving-kindness, had pity on them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 4"
