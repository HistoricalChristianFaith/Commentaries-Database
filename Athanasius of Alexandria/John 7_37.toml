[[commentary]]
quote='''
For the law was admirable, and the shadow was excellent, otherwise, it would not have wrought fear, and induced reverence in those who heard; especially in those who at that time not only heard but saw these things. Now these things were typical, and done as in a shadow. But let us pass on to the meaning, and henceforth leaving the figure at a distance, come to the truth, and look upon the priestly trumpets of our Saviour, which cry out, and call us, at one time to war, as the blessed Paul saith; ‘We wrestle not with flesh and blood, but with principalities, with powers, with the rulers of this dark world, with wicked spirits in heaven.’ At another time the call is made to virginity, and self-denial, and conjugal harmony, saying, To virgins, the things of virgins; and to those who love the way of abstinence, the things of abstinence; and to those who are married, the things of an honourable marriage; thus assigning to each its own virtues and an honourable recompense. Sometimes the call is made to fasting, and sometimes to a feast. Hear again the same [Apostle] blowing the trumpet, and proclaiming, ‘Christ our Passover is sacrificed; therefore let us keep the feast, not with old leaven, neither with the leaven of malice and wickedness.’ If thou wouldest listen to a trumpet much greater than all these, hear our Saviour saying; ‘In that last and great day of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto Me and drink.’ For it became the Saviour not simply to call us to a feast, but to ‘the great feast;’ if only we will be prepared to hear, and to conform to the proclamation of every trumpet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25201%2520For%2520329.html'
source_title="Festal Letter 1 (for 329), Section 3"

[[commentary]]
quote='''
Again the time has arrived which brings to us a new beginning, even the announcement of the blessed Passover, in which the Lord was sacrificed. We eat, as it were, the food of life, and constantly thirsting we delight our souls at all times, as from a fountain, in His precious blood. For we continually and ardently desire; He stands ready for those who thirst; and for those who thirst there is the word of our Saviour, which, in His loving-kindness, He uttered on the day of the feast; ‘If any man thirst, let him come to Me and drink.’ Nor was it then alone when any one drew near to Him, that He cured his thirst; but whenever any one seeks, there is free access for him to the Saviour. For the grace of the feast is not limited to one time, nor does its splendid brilliancy decline; but it is always near, enlightening the minds of those who earnestly desire it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25205%2520For%2520333.html'
source_title="Festal Letter 5 (for 333), Section 1"

[[commentary]]
quote='''
And if after we have passed over the Red Sea heat should again vex us or some bitterness of the waters befall us, even thence again the Lord will appear to us, imparting to us of His sweetness, and His life-giving fountain, saying, ‘If any man thirst, let him come to Me, and drink.’

Why therefore do we tarry, and why do we delay, and not come with all eagerness and diligence to the feast, trusting that it is Jesus who calleth us? Who is all things for us, and was laden in ten thousand ways for our salvation; Who hungered and thirsted for us, though He gives us food and drink in His saving gifts. For this is His glory, this the miracle of His divinity, that He changed our sufferings for His happiness. For, being life, He died that He might make us alive, being the Word, He became flesh, that He might instruct the flesh in the Word, and being the fountain of life, He thirsted our thirst, that thereby He might urge us to the feast, saying, ‘If any man thirst, let him come to Me, and drink.’ At that time, Moses proclaimed the beginning of the feast, saying, ‘This month is the beginning of months to you.’ But the Lord, Who came down in the end of the ages, proclaimed a different day, not as though He would abolish the law, far from it, but that He should establish the law, and be the end of the law. ‘For Christ is the end of the law to every one that believeth in righteousness;’ as the blessed Paul saith, ‘Do we make void the law by faith? far from it: we rather establish the law.’ Now these things astonished even the officers who were sent by the Jews, so that wondering they said to the Pharisees, ‘No man ever thus spake.’ What was it then that astonished those officers, or what was it which so affected the men as to make them marvel? It was nothing but the boldness and authority of our Saviour. For when of old time prophets and scribes studied the Scriptures, they perceived that what they read did not refer to themselves, but to others. Moses, for instance, ‘A prophet will the Lord raise up unto you of your brethren, like unto me; to him hearken in all that he commands you.’ Isaiah again, ‘Behold, a virgin shall conceive and bear a son, and ye shall call his name Emmanuel.’ And others prophesied in different and various ways, concerning the Lord. But by the Lord, of Himself, and of no other, were these things prophesied; to Himself He limited them all, saying, ‘If any man thirst, let him come to Me’—not to any other person, but to ‘Me.’ A man may indeed hear from those concerning My coming, but he must not henceforth drink from others, but from Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Sections 3-4"
