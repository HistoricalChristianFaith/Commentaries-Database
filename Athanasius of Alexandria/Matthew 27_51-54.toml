[[commentary]]
quote='''
But if they are in doubt whether He is God at all, let them reverence Thomas, who handled the Crucified and pronounced Him Lord and God. Or let them fear the Lord Himself, who said, after washing the feet of the disciples: ‘Ye call Me Lord and Master, and ye say well, for so I am.’ But in the same body in which He was when he washed their feet, He also carried up our sins to the Tree. And He was witnessed to as Master of Creation, in that the Sun withdrew his beams and the earth trembled and the rocks were rent, and the executioners recognised that the Crucified was truly Son of God. For the Body they beheld was not that of some man, but of God, being in which, even when being crucified, He raised the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252061%2520Letter%2520to%2520Maximus%2520%2528Written%2520About%2520371%2520ad%2529.html'
source_title="Letter 61, To Maximus, Section 2"
