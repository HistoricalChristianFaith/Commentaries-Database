[[commentary]]
quote='''
Would therefore, O my beloved, that as the word requires, we might here so govern ourselves at all times and entirely, and so live, as never to forget the noble acts of God, nor to depart from the practice of virtue! As also the Apostolic voice exhorts; ‘Remember Jesus Christ, that He rose from the dead.’ Not that any limited season of remembrance was appointed, for at all times He should be in our thoughts. But because of the slothfulness of many, we delay from day to day. Let us then begin in these days. To this end a time of remembrance is permitted, that it may show forth to the saints the reward of their calling, and may exhort the careless while reproving them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25205%2520For%2520333.html'
source_title="Festal Letter 5 (for 333), Section 5"
