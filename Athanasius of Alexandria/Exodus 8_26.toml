[[commentary]]
quote='''
For it is well that a man should depart from wickedness and deeds of iniquity, that he may be able properly to celebrate the feast; for he who is defiled with the pollutions of the wicked is not able to sacrifice the Passover to the Lord our God. Hence, the people who were then in Egypt said, ‘We cannot sacrifice the Passover in Egypt to the Lord our God.’ For God, Who is over all, willed that they should go far away from the servants of Pharaoh, and from the furnace of iron; so that being set free from wickedness, and having carefully put away from them all strange notions, they might receive the knowledge of God and of virtuous actions. For He saith, ‘Go far from them: depart from the midst of them, and touch not the unclean things.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 10"
