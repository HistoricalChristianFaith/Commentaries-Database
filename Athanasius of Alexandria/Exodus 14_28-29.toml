[[commentary]]
quote='''
For through many tribulations, and labours, and sorrows, the saint enters into the kingdom of heaven; but when he arrives where sorrow, and distress, and sighing, shall flee away, he shall thenceforward enjoy rest; as Job, who, when tried here, was afterwards the familiar friend of the Lord. But the lover of pleasures, rejoicing for a little while, afterwards passes a sorrowful life; like Esau, who had temporal food, but afterwards was condemned thereby.

We may take as a type of this distinction, the departure of the children of Israel and the Egyptians from Egypt. For the Egyptians, rejoicing a little while in their injustice against Israel, when they went forth, were all drowned in the deep; but the people of God, being for a time smitten and injured, by the conduct of the taskmasters, when they came out of Egypt, passed through the sea unharmed, and walked in the wilderness as an inhabited place. For although the place was unfrequented by man and desolate, yet, through the gracious gift of the law, and through converse with angels, it was no longer desert, but far more than an inhabited country. As also Elisha, when he thought he was alone in the wilderness, was with companies of angels; so in this case, though the people were at first afflicted and in the wilderness, yet those who remained faithful afterwards entered the land of promise. In like manner those who suffer temporal afflictions here, finally having endured, attain comfort, while those who here persecute are trodden under foot, and have no good end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Sections 5-6"

[[commentary]]
quote='''
And at that time when they went forth and crossed over Egypt, their enemies were the sport of the sea; but now, when we pass over from earth to Heaven, Satan himself henceforth falls like lightning from Heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252024%2520%2528for%2520352%2529.html'
source_title="Festal Letter 24 (for 352)"
