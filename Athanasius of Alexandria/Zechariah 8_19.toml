[[commentary]]
quote='''
Therefore let us also, when we come to the feast, no longer come as to old shadows, for they are accomplished, neither as to common feasts, but let us hasten as to the Lord, Who is Himself the feast, not looking upon it as an indulgence and delight of the belly, but as a manifestation of virtue. For the feasts of the heathen are full of greediness, and utter indolence, since they consider they celebrate a feast when they are idle; and they work the works of perdition when they feast. But our feasts consist in the exercise of virtue and the practice of temperance; as the prophetic word testifies in a certain place, saying, ‘The fast of the fourth, and the fast of the fifth, and the fast of the seventh, and the fast of the tenth [month], shall be to the house of Judah for gladness, and rejoicing, and for pleasant feasts.’ Since therefore this occasion for exercise is set before us, and such a day as this is come, and the prophetic voice has gone forth that the feast shall be celebrated, let us give all diligence to this good proclamation, and like those who contend on the race course, let us vie with each other in observing the purity of the fast, by watchfulness in prayers, by study of the Scriptures, by distributing to the poor, and let us be at peace with our enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 5"
