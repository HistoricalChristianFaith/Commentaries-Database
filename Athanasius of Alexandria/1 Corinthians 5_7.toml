[[commentary]]
quote='''
And we do not keep the festival as observers of days, knowing that the Apostle reproves those who do so, in those words which he spake; ‘Ye observe days, and months, and times, and years.’ But rather do we consider the day solemn because of the feast; so that all of us, who serve God in every place, may together in our prayers be well-pleasing to God. For the blessed Paul, announcing the nearness of gladness like this, did not announce days, but the Lord, for whose sake we keep the feast, saying, ‘Christ, our Passover, is sacrificed;’ so that we all, contemplating the eternity of the Word, may draw near to do Him service.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Section 1"

[[commentary]]
quote='''
For the feast is not on account of the days; but for the Lord’s sake, who then suffered for us, we celebrate it, for ‘our Passover Christ, is sacrificed.’ Even as Moses, when teaching Israel not to consider the feast as pertaining to the days, but to the Lord, said, ‘It is the Lord’s Passover.’ To the Jews, when they thought they were keeping the Passover, because they persecuted the Lord, the feast was useless; since it no longer bore the name of the Lord, even according to their own testimony. It was not the Passover of the Lord, but that of the Jews. The Passover was named after the Jews, my brethren, because they denied the Lord of the Passover. On this account, the Lord, turning away His face from such a doctrine of theirs, saith, ‘Your new moons and your sabbaths My soul hateth.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 2"

[[commentary]]
quote='''
Now those who thus live, and are partakers in such virtue, are alone able to give glory to God, and this it is which essentially constitutes a feast and a holiday. For the feast does not consist in pleasant intercourse at meals, nor splendour of clothing, nor days of leisure, but in the acknowledgment of God, and the offering of thanksgiving and of praise to Him. Now this belongs to the saints alone, who live in Christ; for it is written, ‘The dead shall not praise Thee, O Lord, neither all those who go down into silence; but we who live will bless the Lord, from henceforth even for ever.’ So was it with Hezekiah, who was delivered from death, and therefore praised God, saying, ‘Those who are in hades cannot praise Thee; the dead cannot bless Thee; but the living shall bless Thee, as I also do.’ For to praise and bless God belongs to those only who live in Christ, and by means of this they go up to the feast; for the Passover is not of the Gentiles, nor of those who are yet Jews in the flesh; but of those who acknowledge the truth in Christ, as he declares who was sent to proclaim such a feast; ‘Our Passover, Christ, is sacrificed.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 3"

[[commentary]]
quote='''
This is the Lord, Who is manifested in the Father, and in Whom also the Father is manifested; Who, being truly the Son of the Father, at last became incarnate for our sakes, that He might offer Himself to the Father in our stead, and redeem us through His oblation and sacrifice. This is He Who once brought the people of old time out of Egypt; but Who afterwards redeemed all of us, or rather the whole race of men, from death, and brought them up from the grave. This is He Who in old time was sacrificed as a lamb, He being signified in the lamb; but Who afterwards was slain for us, for ‘Christ our Passover is sacrificed.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 10"

[[commentary]]
quote='''
It is truly a subject of joy, that we can see the signs of victory against death, even our own incorruptibility, through the body of the Lord. For since He rose gloriously, it is clear that the resurrection of all of us will take place; and since His body remained without corruption, there can be no doubt regarding our incorruption. For as by one man, as saith Paul (and it is the truth), sin passed upon all men, so by the resurrection of our Lord Jesus Christ, we shall all rise. ‘For,’ he says, ‘this corruptible must put on incorruption, and this mortal must put on immortality.’ Now this came to pass in the time of the Passion, in which our Lord died for us, for ‘our Passover, Christ, is sacrificed.’ Therefore, because He was sacrificed, let each of us feed upon Him, and with alacrity and diligence partake of His sustenance; since He is given to all without grudging, and is in every one ‘a well of water flowing to everlasting life.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 14"

[[commentary]]
quote='''
But let us now keep the feast, my beloved, not as introducing a day of suffering, but of joy in Christ, by Whom we are fed every day. Let us be mindful of Him Who was sacrificed in the days of the Passover; for we celebrate this, because Christ the Passover was sacrificed. He Who once brought His people out of Egypt, and hath now abolished death, and him that had the power of death, that is the devil, will likewise now turn him to shame, and again grant aid to those who are troubled, and cry unto God day and night.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252013%2520%2528for%2520341%2529.html'
source_title="Festal Letter 13 (for 341), Section 7"

[[commentary]]
quote='''
The gladness of our feast, my brethren, is always near at hand, and never fails those who wish to celebrate it. For the Word is near, Who is all things on our behalf, even our Lord Jesus Christ, Who, having promised that His habitation with us should be perpetual, in virtue thereof cried, saying, ‘Lo, I am with you all the days of the world.’ For as He is the Shepherd, and the High Priest, and the Way and the Door, and everything at once to us, so again, He is shewn to us as the Feast, and the Holy day, according to the blessed Apostle; ‘Our Passover, Christ, is sacrificed.’ He it was who was expected, He caused a light to shine at the prayer of the Psalmist, who said, ‘My Joy, deliver me from those who surround me;’ this being indeed true rejoicing, this being a true feast, even deliverance from wickedness, whereto a man attains by thoroughly adopting an upright conversation, and being approved in his mind of godly submission towards God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 1"

[[commentary]]
quote='''
For this is the season of the feast, my brethren, and it is near; being not now proclaimed by trumpets, as the history records, but being made known and brought near to us by the Saviour, Who suffered on our behalf and rose again, even as Paul preached, saying, ‘Our Passover, Christ, is sacrificed.’ Henceforth the feast of the Passover is ours, not that of a stranger, nor is it any longer of the Jews. For the time of shadows is abolished, and those former things have ceased, and now the month of new things is at hand, in which every man should keep the feast, in obedience to Him who said, ‘Observe the month of new things, and keep the Passover to the Lord thy God.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Section 1"

[[commentary]]
quote='''
For we have been called, brethren, and are now called together, by Wisdom, and according to the Evangelical parable, to that great and heavenly Supper, and sufficient for every creature; I mean, to the Passover,—to Christ, Who is sacrificed; for ‘Christ our Passover is sacrificed.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252042%2520%2528for%2520370%2529.html'
source_title="Festal Letter 42 (for 370)"
