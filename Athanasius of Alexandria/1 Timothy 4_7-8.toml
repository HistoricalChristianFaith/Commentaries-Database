[[commentary]]
quote='''
Hence meditation on the law is necessary, my beloved, and uninterrupted converse with virtue, ‘that the saint may lack nothing, but be perfect to every good work.’ For by these things is the promise of eternal life, as Paul wrote to Timothy, calling constant meditation exercise, and saying, ‘Exercise thyself unto godliness; for bodily exercise profiteth little; but godliness is profitable for all things, since it has the promise of the present life, and of that which is eternal.’

Worthy of admiration is the virtue of that man, my brethren! for through Timothy he enjoins upon all, that they should have regard to nothing more than to godliness, but above everything to adjudge the chief place to faith in God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Sections 7-8"

[[commentary]]
quote='''
And as when brother is helped by brother, they become as a wall to each other; so faith and godliness, being of like growth, hang together, and he who is practised in the one, of necessity is strengthened by the other. Therefore, wishing the disciple to be exercised in godliness unto the end, and to contend for the faith, he counsels them, saying, ‘Fight the good fight of faith, and lay hold on eternal life.’ For if a man first put away the wickedness of idols, and rightly confesses Him Who is truly God, he next fights by faith with those who war against Him.

For of these two things we speak of—faith and godliness—the hope is the same, even everlasting life; for he saith, ‘Fight the good fight of faith; lay hold on eternal life.’ And, ‘exercise thyself unto godliness, for it hath the promise of the life that now is, and of that which is to come.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Sections 9-10"
