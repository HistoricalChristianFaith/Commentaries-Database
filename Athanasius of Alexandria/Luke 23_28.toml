[[commentary]]
quote='''
Hence, when our Saviour was led to death, He restrained the women who followed Him weeping, saying, ‘Weep not for Me;’ meaning to shew that the Lord’s death is an event, not of sorrow but of joy, and that He Who dies for us is alive. For He does not derive His being from those things which are not, but from the Father. It is truly a subject of joy, that we can see the signs of victory against death, even our own incorruptibility, through the body of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 14"
