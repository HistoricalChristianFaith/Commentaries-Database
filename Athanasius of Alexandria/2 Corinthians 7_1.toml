[[commentary]]
quote='''
‘Ye are they that have continued with Me in My temptations; and I appoint unto you a kingdom, as My Father hath appointed unto Me, that ye may eat and drink at My table in My kingdom.’ Being called, then, to the great and heavenly Supper, in that upper room which has been swept, let us ‘cleanse ourselves,’ as the Apostle exhorted, ‘from all filthiness of the flesh and spirit, perfecting holiness in the fear of God;’ that so, being spotless within and without,—without, clothing ourselves with temperance and justice; within, by the Spirit, rightly dividing the word of truth—we may hear, ‘Enter into the joy of thy Lord.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252040%2520%2528for%2520368%2529.html'
source_title="Festal Letter 40 (for 368)"
