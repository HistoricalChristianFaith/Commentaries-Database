[[commentary]]
quote='''
But what sprinklings shall we now employ, while we celebrate the feast? Who will be our guide, as we haste to this festival? None can do this, my beloved, but Him Whom you will name with me, even our Lord Jesus Christ Who said, ‘I am the Way.’ For it is He Who, according to the blessed John, ‘taketh away the sin of the world.’ He purifies our souls, as Jeremiah the prophet says in a certain place, ‘Stand in the ways and see, and enquire, and look which is the good path, and ye shall find in it cleansing for your souls.’ Of old time, the blood of he-goats and the ashes of a heifer, sprinkled upon those who were unclean, were fit only to purify the flesh; but now, through the grace of God the Word, every man is thoroughly cleansed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 2"
