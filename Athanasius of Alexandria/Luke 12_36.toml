[[commentary]]
quote='''
We fast meditating on death, that we may be able to live; and we watch, not as mourners, but as they that wait for the Lord, when He shall have returned from the wedding, so that we may vie with each other in the triumph, hastening to announce the sign of victory over death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25205%2520For%2520333.html'
source_title="Festal Letter 5 (for 333), Section 4"
