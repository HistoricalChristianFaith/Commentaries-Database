[[commentary]]
quote='''
For when any sees you, the faithful in Christ, associate and communicate with such people, [or worshipping along with them], certainly they will think it a matter of indifference and will fall into the mire of irreligion. Lest, then, this should happen, be pleased, beloved, to shun those who hold the impiety [of Arius], and moreover to avoid those who, while they pretend not to hold with Arius, yet worship with the impious. And we are specially bound to fly from the communion of men whose opinions we hold in execration. [If then any come to you, and, as blessed John says, brings with him right doctrine, say to him, All hail, and receive such an one as a brother.] But if any pretend that he confesses the right faith, but appear to communicate with those others, exhort him to abstain from such communion, and if he promise to do so, treat him as a brother, but if he persist in a contentious spirit, him avoid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252053%2520Second%2520Letter%2520To%2520Monks.html'
source_title="Letter 53, Second Letter to Monks"
