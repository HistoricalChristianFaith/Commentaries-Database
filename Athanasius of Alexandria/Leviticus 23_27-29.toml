[[commentary]]
quote='''
That we may be able to shew what kind of persons we should be when we fast, and of what character the fast should be, listen again to God commanding Moses, and saying, as it is written in Leviticus, ‘And the Lord spake unto Moses, saying, In the tenth day of this seventh month, there shall be a day of atonement; a convocation, and a holy day shall it be to you; and ye shall humble your souls, and offer whole burnt-offerings unto the Lord.’ And afterwards, that the law might be defined on this point, He proceeds to say; ‘Every soul that shall not humble itself, shall be cut off from the people.’

Behold, my brethren, how much a fast can do, and in what manner the law commands us to fast. It is required that not only with the body should we fast, but with the soul. Now the soul is humbled when it does not follow wicked opinions, but feeds on becoming virtues. For virtues and vices are the food of the soul, and it can eat either of these two meats, and incline to either of the two, according to its own will. If it is bent toward virtue, it will be nourished by virtues, by righteousness, by temperance, by meekness, by fortitude, as Paul saith; ‘Being nourished by the word of truth.’ Such was the case with our Lord, who said, ‘My meat is to do the will of My Father which is in heaven.’ But if it is not thus with the soul, and it inclines downwards, it is then nourished by nothing but sin. For thus the Holy Ghost, describing sinners and their food, referred to the devil when He said, ‘I have given him to be meat to the people of Æthiopia.’ For this is the food of sinners. And as our Lord and Saviour Jesus Christ, being heavenly bread, is the food of the saints, according to this; ‘Except ye eat My flesh, and drink My blood;’ so is the devil the food of the impure, and of those who do nothing which is of the light, but work the deeds of darkness. Therefore, in order to withdraw and turn them from vices, He commands them to be nourished with the food of virtue; namely, humbleness of mind, lowliness to endure humiliations, the acknowledgment of God. For not only does such a fast as this obtain pardon for souls, but being kept holy, it prepares the saints, and raises them above the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25201%2520For%2520329.html'
source_title="Festal Letter 1 (for 329), Sections 4-5"
