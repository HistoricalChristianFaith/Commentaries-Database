[[commentary]]
quote='''
For at no time should a man freely praise God, more than when he has passed through afflictions; nor, again, should he at any time give thanks more than when he finds rest from toil and temptations. As Hezekiah, when the Assyrians perished, praised the Lord, and, gave thanks, saying, ‘The Lord is my salvation; and I will not cease to bless Thee with harp all the days of my life, before the house of the Lord.’ And those valiant and blessed three who were tried in Babylon, Hananiah, Mishael, and Azariah, when they were in safety and the fire became to them as dew, gave thanks, praising and ‘saying words of glory to God.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 3"
