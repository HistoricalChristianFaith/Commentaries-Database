[[commentary]]
quote='''
Let us celebrate it then, even heavenly joy, with those saints who formerly proclaimed a like feast, and were ensamples to us of conversation in Christ. For not only were they entrusted with the charge of preaching the Gospel, but, if we enquire, we shall see, as it is written, that its power was displayed in them. ‘Be ye therefore followers of me,’ he wrote to the Corinthians. Now the apostolic precept exhorts us all, for those commands which he sent to individuals, he at the same time enjoined upon every man in every place, for he was ‘a teacher of all nations in faith and truth.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25202%2520For%2520330.html'
source_title="Festal Letter 2 (for 330), Section 1"

[[commentary]]
quote='''
For as he who receives an apostle receives Him who sent him, so he who is a follower of the saints, makes the Lord in every respect his end and aim, even as Paul, being a follower of Him, goes on to say, ‘As I also of Christ.’ For there were first our Saviour’s own words, who from the height of His divinity, when conversing with His disciples, said, ‘Learn of Me, for I am meek and lowly in heart, and ye shall find rest to your souls.’ Then too when He poured water into a basin, and girded Himself with a towel, and washed His disciples’ feet, He said to them, ‘Know what I have done. Ye call Me Master and Lord, and ye say well, for so I am. If therefore I, your Lord and Master, have washed your feet, ye also ought to wash one another’s feet: for I have given you an example, that as I have done to you, ye also should do.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25202%2520For%2520330.html'
source_title="Festal Letter 2 (for 330), Section 4"

[[commentary]]
quote='''
Thus even our Lord and Saviour Jesus Christ comes before us, when He would shew men how to suffer, Who when He was smitten bore it patiently, being reviled He reviled not again, when He suffered He threatened not, but He gave His back to the smiters, and His cheeks to buffetings, and turned not His face from spitting; and at last, was willingly led to death, that we might behold in Him the image of all that is virtuous and immortal, and that we, conducting ourselves after these examples, might truly tread on serpents and scorpions, and on all the power of the enemy.

Thus too Paul, while he conducted himself after the example of the Lord, exhorted us, saying, ‘Be ye followers of me, as I also am of Christ.’ In this way he prevailed against all the divisions of the devil, writing, ‘I am persuaded that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers, nor height, nor depth, nor any other creature, shall be able to separate us from the love of God which is in Jesus Christ.’ For the enemy draws near to us in afflictions, and trials, and labours, using every endeavour to ruin us. But the man who is in Christ, combating those things that are contrary, and opposing wrath by long-suffering, contumely by meekness, and vice by virtue, obtains the victory, and exclaims, ‘I can do all things through Christ Who strengtheneth me;’ and, ‘In all these things we are conquerors through Christ Who loved us.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Sections 7-8"

[[commentary]]
quote='''
Since we are thus circumstanced, my brethren, let us never loiter in the path of virtue; for hereto he counsels us, saying, ‘Be ye followers of me, as I also am of Christ.’ For he gave this advice not to the Corinthians only, since he was not their Apostle only, but being ‘a teacher of the Gentiles in faith and verity,’ he admonished us all through them; and in short, the things he wrote to each particular person are commandments common to all men. On this account in writing to different people, some he exhorted as, for instance, in the Epistles to the Romans, and the Ephesians, and Philemon. Some he reproved, and was indignant with them, as in the case of the Corinthians and Galatians. To some he gave advice, as to the Colossians and Thessalonians. The Philippians he approved of, and rejoiced in them. The Hebrews he taught that the law was a shadow to them. But to his elect sons, Timothy and Titus, when they were near, he gave instruction; when far away, he put them in remembrance. For he was all things to all men; and being himself a perfect man, he adapted his teaching to the need of every one, so that by all means he might rescue some of them. Therefore his word was not without fruit; but in every place it is planted and productive even to this day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 2"
