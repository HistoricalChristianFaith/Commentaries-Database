[[commentary]]
quote='''
And not only here, my brethren, is this bread the food of the righteous, neither are the saints on earth alone nourished by such bread and such blood; but we also eat them in heaven, for the Lord is the food even of the exalted spirits, and the angels, and He is the joy of all the heavenly host. And to all He is everything, and He has pity upon all according to His loving-kindness. Already hath the Lord given us angels’ food, and He promises to those who continue with Him in His trials, saying, ‘And I promise to you a kingdom, as My Father hath promised to Me; that ye shall eat and drink at My table in My kingdom, and sit on twelve thrones, judging the twelve tribes of Israel.’ O what a banquet is this, my brethren, and how great is the harmony and gladness of those who eat at this heavenly table! For they delight themselves not with that food which is cast out, but with that which produces life everlasting. Who then shall be deemed worthy of that assembly? Who is so blessed as to be called, and accounted worthy of that divine feast? Truly, ‘blessed is he who shall eat bread in Thy kingdom.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Section 8"
