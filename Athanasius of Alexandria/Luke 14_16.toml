[[commentary]]
quote='''
For we have been called, brethren, and are now called together, by Wisdom, and according to the Evangelical parable, to that great and heavenly Supper, and sufficient for every creature; I mean, to the Passover,—to Christ, Who is sacrificed; for ‘Christ our Passover is sacrificed.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252042%2520%2528for%2520370%2529.html'
source_title="Festal Letter 42 (for 370)"
