[[commentary]]
quote='''
They would easily have borne the afflictions which were brought upon them to prove them from time to time, if the prophetic admonition had been listened to by them; ‘It is good for a man to take up Thy yoke in his youth; he shall sit alone and shall be silent, because he hath taken Thy yoke upon him. He will give his cheek to him who smiteth him; he will be filled with reproaches. Because the Lord does not cast away for ever; for when He abases, He is gracious, according to the multitude of His tender mercies.’ For though all these things should proceed from the enemies, stripes, insults, reproaches, yet shall they avail nothing against the multitude of God’s tender mercies; for we shall quickly recover from them since they are merely temporal, but God is always gracious, pouring out His tender mercies on those who please [Him].
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252013%2520%2528for%2520341%2529.html'
source_title="Festal Letter 13 (for 341), Section 4"
