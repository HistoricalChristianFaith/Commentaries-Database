[[commentary]]
quote='''
For apart from light there is darkness, and apart from blessing there is a curse, the devil also is apart from the saints, and sin far from virtue. Therefore the Gospel rebukes Satan, saying, ‘Get thee behind Me, Satan.’ But us it calls to itself, saying, ‘Enter ye in at the strait gate.’ And again, ‘Come, blessed of My Father, inherit the kingdom which is prepared for you.’ So also the Spirit cried aforetime in the Psalms, saying, ‘Enter into His gates with psalms.’ For through virtue a man enters in unto God, as Moses did into the thick cloud where God was. But through vice a man goes out from the presence of the Lord; as Cain when he had slain his brother, went out, as far as his will was concerned, from before the face of God; and the Psalmist enters, saying, ‘And I will go in to the altar of God, even to the God that delighteth my youth.’ But of the devil the Scripture beareth witness, that the devil went out from before God, and smote Job with sore boils. For this is the characteristic of those who go out from before God—to smite and to injure the men of God. And this is the characteristic of those who fall away from the faith—to injure and persecute the faithful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 4"
