[[commentary]]
quote='''
And if after we have passed over the Red Sea heat should again vex us or some bitterness of the waters befall us, even thence again the Lord will appear to us, imparting to us of His sweetness, and His life-giving fountain, saying, ‘If any man thirst, let him come to Me, and drink.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 3"
