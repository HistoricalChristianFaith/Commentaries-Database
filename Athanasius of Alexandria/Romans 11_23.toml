[[commentary]]
quote='''
Therefore the Lord cursed them under the figure of the fig-tree. Yet even thus He spared them in His loving-kindness, not destroying them root and all. For He did not curse the root, but [said], that no man should eat fruit of it thenceforth. When He did this, He abolished the shadow, causing it to wither; but preserved the root, so that we might [not] be grafted upon it; ‘they too, if they abide not in unbelief, may attain to be grafted into their own olive tree.’ Now when the Lord had cursed them because of their negligence, He removed from them the new moons, the true lamb, and that which is truly the Passover.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 6"
