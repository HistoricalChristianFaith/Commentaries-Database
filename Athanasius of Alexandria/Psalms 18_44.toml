[[commentary]]
quote='''
And if they had examined with their understanding the things which were written, they would not have carefully fulfilled the prophecies which were against themselves, so as for their city to be now desolate, grace taken from them, and they themselves without the law, being no longer called children, but strangers. For thus in the Psalms was it before declared, saying, ‘The strange children have acted falsely by Me.’ And by Isaiah the prophet; ‘I have begotten and brought up children, and they have rejected Me.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 5"
