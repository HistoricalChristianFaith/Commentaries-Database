[[commentary]]
quote='''
Or tell me, whom do your advisers wish you to imitate? For we ought to walk by the standard of the saints and the fathers, and imitate them, and to be sure that if we depart from them we put ourselves also out of their fellowship. Whom then do they wish you to imitate? The one who hesitated, and while wishing to follow, delayed it and took counsel because of his family, or blessed Paul, who, the moment the stewardship was entrusted to him, ‘straightway conferred not with flesh and blood?’ For although he said, ‘I am not worthy to be called an Apostle,’ yet, knowing what he had received, and being not ignorant of the giver, he wrote, ‘For woe is me if I preach not the gospel.’ But, as it was ‘woe to me’ if he did not preach, so, in teaching and preaching the gospel, he had his converts as his joy and crown. This explains why the saint was zealous to preach as far as Illyricum, and not to shrink from proceeding to Rome, or even going as far as the Spains, in order that the more he laboured, he might receive so much the greater reward for his labour. He boasted then that he had fought the good fight, and was confident that he should receive the great crown. Therefore, beloved Dracontius, whom are you imitating in your present action? Paul, or men unlike him? For my part, I pray that you, and myself, may prove an imitator of all the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252049%2520Letter%2520to%2520Dracontius%2520Written%2520ad%2520354%2520or%2520355.html'
source_title="Letter 49, To Dracontius, Section 4"
