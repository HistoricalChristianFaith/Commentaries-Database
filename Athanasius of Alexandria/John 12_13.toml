[[commentary]]
quote='''
When the crowd took the palm branches from the date palms and went before Christ as he was about to go up to the feast, all of them bore witness that he had called Lazarus forth from the grave and had raised him from the dead. Because of this, this great throng believed on him when they heard that he had done this sign. For all the people had come out of the tomb before they buried him and closed the mouth of the tomb. A great wonder seized them all when they heard that he was alive again.
'''
source_url=''
source_title="HOMILY ON THE RESURRECTION OF LAZARUS"

[[commentary]]
quote='''
But let us, brethren, who have received the vineyard from the Saviour, and are invited to the heavenly banquet, inasmuch as the Feast is now drawing nigh, take the branches of the palm trees, and proving conquerors of sin, let us too like those, who on that occasion went to meet the Saviour, make ourselves ready by our conduct, both to meet Him when He comes, and to go in with Him and partake of the immortal food, and from thenceforth live eternally in the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252028%2520%2528for%2520356%2529.html'
source_title="Festal Letter 28 (for 356), Fragment 2"
