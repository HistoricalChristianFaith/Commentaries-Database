[[commentary]]
quote='''
For you must know, and not be in doubt, that while before your election you lived to yourself, after it, you live for your flock. And before you had received the grace of the episcopate, no one knew you; but after you became one, the laity expect you to bring them food, namely instruction from the Scriptures. When then they expect, and suffer hunger, and you are feeding yourself only, and our Lord Jesus Christ comes and we stand before Him, what defence will you offer when He sees His own sheep hungering? For had you not taken the money, He would not have blamed you. But He would reasonably do so if upon taking it you dug and buried it,—in the words which God forbid that your piety should ever hear: ‘Thou oughtest to have given my money to the bankers, that when I came I might demand it of them.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252049%2520Letter%2520to%2520Dracontius%2520Written%2520ad%2520354%2520or%2520355.html'
source_title="Letter 49, To Dracontius, Section 2"
