[[commentary]]
quote='''
And He by His living Word quickeneth all men, and gives Him to be food and life to the saints; as the Lord declares, ‘I am the bread of life.’ The Jews, because they were weak in perception, and had not exercised the senses of the soul in virtue, and did not comprehend this discourse about bread, murmured against Him, because He said, ‘I am the bread which came down from heaven, and giveth life unto men.’

For sin has her own special bread, of her death, and calling to those who are lovers of pleasure and lack understanding, she saith, ‘Touch with delight secret bread, and sweet waters which are stolen;’ for he who merely touches them knows not that that which is born from the earth perishes with her. For even when the sinner thinks to find pleasure, the end of that food is not pleasant, as the Wisdom of God saith again, ‘Bread of deceit is pleasant to a man; but afterwards his mouth shall be filled with gravel.’ And, ‘Honey droppeth from the lips of a whorish woman, which for a time is sweet to thy palate; but at the last thou shalt find it more bitter than gall, and sharper than a two-edged sword.’ Thus then he eats and rejoices for a little time; afterwards he spurneth it when he hath removed his soul afar. For the fool knoweth not that those who depart far from God shall perish. And besides, there is the restraint of the prophetic admonition which says, ‘What hast thou to do in the way of Egypt, to drink the waters of Gihon? And what hast thou to do in the way of Asshur, to drink the waters of the rivers?’ And the Wisdom of God which loves mankind forbids these things, crying, ‘But depart quickly, tarry not in the place, neither fix thine eye upon it; for thus thou shalt pass over strange waters, and depart quickly from the strange river.’ She also calls them to herself, ‘For wisdom hath builded her house, and supported it on seven pillars; she hath killed her sacrifices, and mingled her wine in the goblets, and prepared her table; she hath sent forth her servants, inviting to the goblet with a loud proclamation, and saying, Whoso is foolish, let him turn in to me; and to them that lack understanding she saith, Come, eat of my bread, and drink of the wine I have mingled for you.’ And what hope is there instead of these things? ‘Forsake folly that ye may live, and seek understanding that ye may abide.’ For the bread of Wisdom is living fruit, as the Lord said; ‘I am the living bread which came down from heaven: if any man eat of this bread, he shall live for ever.’ For when Israel ate of the manna, which was indeed pleasant and wonderful, yet he died, and he who ate it did not in consequence live for ever, but all that multitude died in the wilderness. The Lord teaches, saying, ‘I am the bread of life: your fathers did eat manna in the wilderness, and are dead. This is the bread which came down from heaven, that a man should eat thereof, and not die.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25207%2520For%2520335.html'
source_title="Festal Letter 7 (for 335), Sections 4-5"
