[[commentary]]
quote='''
Since then we have passed beyond that time of shadows, and no longer perform rites under it, but have turned, as it were, unto the Lord; ‘for the Lord is the Spirit, and where the Spirit of the Lord is, there is liberty;’—as we hear the sacred trumpet, no longer slaying a material lamb, but that true Lamb that was slain, even our Lord Jesus Christ; ‘Who was led as a sheep to the slaughter, and was dumb as a lamb before her shearers;’ being purified by His precious blood, which speaketh better things than that of Abel, having our feet shod with the preparation of the Gospel, holding in our hands the rod and staff of the Lord, by which that saint was comforted, who said, ‘Thy rod and Thy staff they comfort me;’ and to sum up, being in all respects prepared, and careful for nothing, because, as the blessed Paul saith, ‘The Lord is at hand;’ and as our Saviour saith, ‘In an hour when we think not, the Lord cometh;—Let us keep the Feast, not with old leaven, neither with the leaven of malice and wickedness; but with the unleavened bread of sincerity and truth. Putting off the old man and his deeds, let us put on the new man, which is created in God,’ in humbleness of mind, and a pure conscience; in meditation of the law by night and by day. And casting away all hypocrisy and fraud, putting far from us all pride and deceit, let us take upon us love towards God and towards our neighbour, that being new [creatures], and receiving the new wine, even the Holy Spirit, we may properly keep the feast, even the month of these new [fruits].
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25201%2520For%2520329.html'
source_title="Festal Letter 1 (for 329), Section 9"

[[commentary]]
quote='''
Now again, my beloved, has God brought us to the season of the feast, and through His loving-kindness we have reached the period of assembly for it. For that God who brought Israel out of Egypt, even He at this time calls us to the feast, saying by Moses, ‘Observe the month of new fruits, and keep the Passover to the Lord thy God:’ and by the prophet, ‘Keep thy feasts, O Judah; pay to the Lord thy vows.’ If then God Himself loves the feast, and calls us to it, it is not right, my brethren, that it should be delayed, or observed carelessly; but with alacrity and zeal we should come to it, so that having begun joyfully here, we may also receive an earnest of that heavenly feast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 1"

[[commentary]]
quote='''
For this is the season of the feast, my brethren, and it is near; being not now proclaimed by trumpets, as the history records, but being made known and brought near to us by the Saviour, Who suffered on our behalf and rose again, even as Paul preached, saying, ‘Our Passover, Christ, is sacrificed.’ Henceforth the feast of the Passover is ours, not that of a stranger, nor is it any longer of the Jews. For the time of shadows is abolished, and those former things have ceased, and now the month of new things is at hand, in which every man should keep the feast, in obedience to Him who said, ‘Observe the month of new things, and keep the Passover to the Lord thy God.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252019%2520%2528for%2520347%2529.html'
source_title="Festal Letter 19 (for 347), Section 1"
