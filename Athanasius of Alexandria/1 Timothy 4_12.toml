[[commentary]]
quote='''
But the wise servants of the Lord, who have truly put on the man which is created in God, have received gospel words, and reckon as a general commandment that given to Timothy, which saith, ‘Be thou an example to the believers in word, in conversation, in love, in faith, in purity.’ So well do they keep the Feast, that even the unbelievers, seeing their order, may say, ‘God is with them of a truth.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25202%2520For%2520330.html'
source_title="Festal Letter 2 (for 330), Section 4"
