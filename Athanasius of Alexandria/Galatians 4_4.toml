[[commentary]]
quote='''
And if God sent His Son brought forth from a woman, the fact causes us no shame but contrariwise glory and great grace. For He has become Man, that He might deify us in Himself, and He has been born of a woman, and begotten of a Virgin, in order to transfer to Himself our erring generation, and that we may become henceforth a holy race, and ‘partakers of the Divine Nature,’ as blessed Peter wrote.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252060%2520To%2520Adelphius%252C%2520Bishop%2520and%2520Confessor%253A%2520Against%2520the%2520Arians.html'
source_title="Letter 60, To Adelphius, Section 4"
