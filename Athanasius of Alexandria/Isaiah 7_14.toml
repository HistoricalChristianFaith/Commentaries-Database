[[commentary]]
quote='''
For he ‘takes hold of the seed of Abraham,’ as the apostle said; whence it behoved Him to be made like His brethren in all things, and to take a Body like us. This is why Mary is truly presupposed, in order that He may take it from her, and offer it for us as His own. And this Isaiah pointed to in his prophecy, in the words: ‘Behold the Virgin,’ while Gabriel is sent to her—not simply to a virgin, but ‘to a virgin betrothed to a man,’ in order that by means of the betrothed man he might shew that Mary was really a human being. And for this reason Scripture also mentions her bringing forth, and tells of her wrapping Him in swaddling clothes; and therefore, too, the paps which He sucked were called blessed. And He was offered as a sacrifice, in that He Who was born had opened the womb. Now all these things are proofs that the Virgin brought forth. And Gabriel preached the Gospel to her without uncertainty, saying not merely ‘what is born in thee,’ lest the body should be thought to be extraneously induced upon her, but ‘of thee,’ that what was born might be believed to be naturally from her, inasmuch as Nature clearly shews that it is impossible for a virgin to produce milk unless she has brought forth, and impossible for a body to be nourished with milk and wrapped in swaddling clothes unless it has previously been naturally brought forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252059%2520To%2520Epictetus.html'
source_title="Letter 59, To Epictetus, Section 5"

[[commentary]]
quote='''
But our faith is right, and starts from the teaching of the Apostles and tradition of the fathers, being confirmed both by the New Testament and the Old. For the Prophets say: ‘Send out Thy Word and Thy Truth,’ and ‘Behold the Virgin shall conceive and bear a son, and they shall call His name Emmanuel, which is being interpreted God with us.’ But what does that mean, if not that God has come in the Flesh?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252060%2520To%2520Adelphius%252C%2520Bishop%2520and%2520Confessor%253A%2520Against%2520the%2520Arians.html'
source_title="Letter 60, To Adelphius, Section 6"
