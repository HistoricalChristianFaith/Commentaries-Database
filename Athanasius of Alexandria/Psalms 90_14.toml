[[commentary]]
quote='''
So when in like manner from all in every place, praise and prayer shall ascend to the gracious and good Father, when the whole Catholic Church which is in every place, with gladness and rejoicing, celebrates together the same worship to God, when all men in common send up a song of praise and say, Amen; how blessed will it not be, my brethren! who will not, at that time, be engaged, praying rightly? For the walls of every adverse power, yea even of Jericho especially, falling down, and the gift of the Holy Spirit being then richly poured upon all men, every man perceiving the coming of the Spirit shall say, ‘We are all filled in the morning with Thy favour, and we rejoice and are made glad in our days.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 11"
