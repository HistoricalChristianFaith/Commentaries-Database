[[commentary]]
quote='''
But the faithful and true servants of the Lord, knowing that the Lord loves the thankful, never cease to praise Him, ever giving thanks unto the Lord. And whether the time is one of ease or of affliction, they offer up praise to God with thanksgiving, not reckoning these things of time, but worshipping the Lord, the God of times. Thus of old time, Job, who possessed fortitude above all men, thought of these things when in prosperity; and when in adversity, he patiently endured, and when he suffered, gave thanks. As also the humble David, in the very time of affliction sang praises and said, ‘I will bless the Lord at all times.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Section 5"
