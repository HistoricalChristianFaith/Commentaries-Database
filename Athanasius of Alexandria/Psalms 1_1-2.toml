[[commentary]]
quote='''
For the grace of the feast is not limited to one time, nor does its splendid brilliancy decline; but it is always near, enlightening the minds of those who earnestly desire it. For therein is constant virtue, for those who are illuminated in their minds, and meditate on the divine Scriptures day and night, like the man to whom a blessing is given, as it is written in the sacred Psalms; ‘Blessed is the man who hath not walked in the counsel of the ungodly, nor stood in the way of sinners, nor sat in the seat of corrupters. But his delight is in the law of the Lord, and in His law doth he meditate day and night.’ For it is not the sun, or the moon, or the host of those other stars which illumines him, but he glitters with the high effulgence of God over all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25205%2520For%2520333.html'
source_title="Festal Letter 5 (for 333), Section 1"
