[[commentary]]
quote='''
It is truly a subject of joy, that we can see the signs of victory against death, even our own incorruptibility, through the body of the Lord. For since He rose gloriously, it is clear that the resurrection of all of us will take place; and since His body remained without corruption, there can be no doubt regarding our incorruption. For as by one man, as saith Paul (and it is the truth), sin passed upon all men, so by the resurrection of our Lord Jesus Christ, we shall all rise. ‘For,’ he says, ‘this corruptible must put on incorruption, and this mortal must put on immortality.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 14"

[[commentary]]
quote='''
And so it is shewn to all that the Body was not the Word, but Body of the Word. And it was this that Thomas handled when it had risen from the dead, and saw in it the print of the nails, which the Word Himself had undergone, seeing them fixed in His own Body, and though able to prevent it, did not do so. On the contrary, the incorporeal Word made His own the properties of the Body, as being His own Body. Why, when the Body was struck by the attendant, as suffering Himself He asked, ‘Why smitest thou Me?’ And being by nature intangible, the Word yet said, ‘I gave My back to the stripes, and My cheeks to blows, and hid not My face from shame and spitting.’ For what the human Body of the Word suffered, this the Word, dwelling in the body, ascribed to Himself, in order that we might be enabled to be partakers of the Godhead of the Word. And verily it is strange that He it was Who suffered and yet suffered not. Suffered, because His own Body suffered, and He was in it, which thus suffered; suffered not, because the Word, being by Nature God, is impassible. And while He, the incorporeal, was in the passible Body, the Body had in it the impassible Word, which was destroying the infirmities inherent in the Body. But this He did, and so it was, in order that Himself taking what was ours and offering it as a sacrifice, He might do away with it, and conversely might invest us with what was His, and cause the Apostle to say: ‘This corruptible must put on incorruption, and this mortal put on immortality.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252059%2520To%2520Epictetus.html'
source_title="Letter 59, To Epictetus, Section 6"

[[commentary]]
quote='''
Let then the unbelievers perceive this, and learn that while as a Babe He lay in a manger, He subjected the Magi and was worshipped by them; and while as a Child He came down to Egypt, He brought to nought the hand-made objects of its idolatry: and crucified in the flesh, He raised the dead long since turned to corruption. And it has been made plain to all that not for His own sake but for ours He underwent all things, that we by His sufferings might put on freedom from suffering and incorruption, and abide unto life eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252061%2520Letter%2520to%2520Maximus%2520%2528Written%2520About%2520371%2520ad%2529.html'
source_title="Letter 61, To Maximus, Section 4"
