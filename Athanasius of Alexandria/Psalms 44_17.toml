[[commentary]]
quote='''
Let us, being followers of such men, pass no season without thanksgiving, but especially now, when the time is one of tribulation, which the heretics excite against us, will we praise the Lord, uttering the words of the saints; ‘All these things have come upon us, yet have we not forgotten Thee.’ For as the Jews at that time, although suffering an assault from the tabernacles of the Edomites, and oppressed by the enemies of Jerusalem, did not give themselves up, but all the more sang praises to God; so we, my beloved brethren, though hindered from speaking the word of the Lord, will the more proclaim it, and being afflicted, we will sing Psalms, in that we are accounted worthy to be despised, and to labour anxiously for the truth. Yea, moreover, being grievously vexed, we will give thanks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Section 5"

[[commentary]]
quote='''
Since this is so, let us make a joyful noise with the saints, and let no one of us fail of his duty in these things; counting as nothing the affliction or the trials which, especially at this time, have been enviously directed against us by the party of Eusebius. Even now they wish to injure us, and by their accusations to compass our death, because of that godliness, whose helper is the Lord. But, as faithful servants of God, knowing that He is our salvation in the time of trouble:—for our Lord promised beforehand, saying, ‘Blessed are ye when men revile you and persecute you, and say all manner of evil against you falsely, for My sake. Rejoice, and be exceeding glad, for your reward is great in heaven.’ Again, it is the Redeemer’s own word, that affliction shall not befall every man in this world, but only those who have a holy fear of Him:—on this account, the more the enemies hem us in, the more let us be at liberty; although they revile us, let us come together; and the more they would turn us aside from godliness, let us the more boldly preach it saying, ‘All these things are come upon us, yet have we not forgotten Thee,’ and we have not done evil with the Ario-maniacs, who say that Thou hast existence from those things that exist not. The Word which is eternally with the Father, is also from Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Section 12"
