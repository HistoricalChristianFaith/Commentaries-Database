[[commentary]]
quote='''
For the blessed Apostle, who gave thanks at all times, urges us in the same manner to draw near to God saying, ‘Let your requests, with thanksgiving, be made known unto God.’ And being desirous that we should always continue in this resolution, he says, ‘At all times give thanks; pray without ceasing.’ For he knew that believers are strong while employed in thanksgiving, and that rejoicing they pass over the walls of the enemy, like those saints who said, ‘Through Thee will we pierce through our enemies, and by my God I will leap over a wall.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25203%2520For%2520331.html'
source_title="Festal Letter 3 (for 331), Section 5"
