[[commentary]]
quote='''
The gladness of our feast, my brethren, is always near at hand, and never fails those who wish to celebrate it. For the Word is near, Who is all things on our behalf, even our Lord Jesus Christ, Who, having promised that His habitation with us should be perpetual, in virtue thereof cried, saying, ‘Lo, I am with you all the days of the world.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252014%2520%2528for%2520342%2529.html'
source_title="Festal Letter 14 (for 342), Section 1"
