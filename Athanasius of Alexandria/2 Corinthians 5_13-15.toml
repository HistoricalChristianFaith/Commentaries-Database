[[commentary]]
quote='''
But in our commemoration of these things, my brethren, let us not be occupied with meats, but let us glorify the Lord, let us become fools for Him who died for us, even as Paul said; ‘For if we are foolish, it is to God; or if we are sober-minded, it is to you; since because one died for all men, therefore all were dead to Him; and He died for all, that we who live should not henceforth live to ourselves, but to Him who died for us, and rose again.’ No longer then ought we to live to ourselves, but, as servants to the Lord. And not in vain should we receive the grace, as the time is especially an acceptable one, and the day of salvation hath dawned, even the death of our Redeemer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 4"
