[[commentary]]
quote='''
But let us not be like the heathen, or the ignorant Jews, or as the heretics and schismatics of the present time. For the heathen think the accomplishment of the feast is in the abundance of food; the Jews, erring in the type and shadow, think it still such; the schismatics keep it in separate places, and with vain imaginations. But let us, my brethren, be superior to the heathen, in keeping the feast with sincerity of soul, and purity of body; to the Jews, in no longer receiving the type and the shadow, but as having been gloriously illumined with the light of truth, and as looking upon the Sun of Righteousness; to the schismatics, in not rending the coat of Christ, but in one house, even in the Catholic Church, let us eat the Passover of the Lord, Who, by ordaining His holy laws, guided us towards virtue, and counselled the abstinence of this feast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25205%2520For%2520333.html'
source_title="Festal Letter 5 (for 333), Section 4"

[[commentary]]
quote='''
I know these [words] are grievous, not only to those who dispute with Christ, but also to the schismatics; for they are united together, as men of kindred feelings. For they have learned to rend the seamless coat of God: they think it not strange to divide the indivisible Son from the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 9"
