[[commentary]]
quote='''
For who is our joy and boast, but our Lord and Saviour Jesus Christ, Who suffered for us, and by Himself made known to us the Father? For He is no other than He Who of old time spake by the Prophets; but now He saith to every man, ‘I Who speak am near.’ Right well is this word spoken, for He does not at one time speak, at another keep silence; but continually and at all times, from the beginning without ceasing, He raises up every man, and speaks to every man in his heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FFrom%2520Letter%252027%2520%2528for%2520355%2529.html'
source_title="Festal Letter 27 (for 355)"
