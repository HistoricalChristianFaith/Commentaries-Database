[[commentary]]
quote='''
For the guile of the Jews, and the unbounded impiety of the Arians, cause nothing but sad reflections, for the former at the beginning slew the Lord; but these latter take away His position of having conquered that death to which the Jews brought Him, in that they say He is not the Creator, but a creature. For if He were a creature, He would have been holden by death; but if He was not holden by death, according to the Scriptures, He is not a creature, but the Lord of the creatures, and the subject of this immortal feast.

For the Lord of death would abolish death, and being Lord, what He would was accomplished; for we have all passed from death unto life. But the imagination of the Jews, and of those who are like them, was vain, since the result was not such as they contemplated, but turned out adverse to themselves; and ‘at both of them He that sitteth in the heaven shall laugh: the Lord shall have them in derision.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252011%2520For%2520339.html'
source_title="Festal Letter 11 (for 339), Sections 13-14"
