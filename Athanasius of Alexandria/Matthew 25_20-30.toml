[[commentary]]
quote='''
Also in the Gospel, He praises those who increased the grace twofold, both him who made ten talents of five, and him who made four talents of two, as those who had profited, and turned them to good account; but him who hid the talent He cast out as wanting, saying to him, ‘Thou wicked servant! oughtest thou not to have put My money to the exchangers? then at My coming I should have received Mine own with interest. Take, therefore, from him the talent, and give it to him that hath ten talents. For to every one that hath shall be given, and he shall have more abundantly; but from him that hath not, shall be taken away even that which he hath. And cast ye the unprofitable servant into outer darkness; there shall be weeping and gnashing of teeth.’ For it is not His will that the grace we have received should be unprofitable; but He requires us to take pains to render Him His own fruits, as the blessed Paul saith; ‘The fruit of the Spirit is love, joy, and peace.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25206%2520For%2520334.html'
source_title="Festal Letter 6 (for 334), Section 5"
