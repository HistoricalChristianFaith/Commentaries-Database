[[commentary]]
quote='''
Moreover if we believe man to be, as the divine Scriptures say, a work of God’s hands, how could any defiled work proceed from a pure Power? and if, according to the divine Acts of the Apostles, ‘we are God’s offspring,’ we have nothing unclean in ourselves. For then only do we incur defilement, when we commit sin, that foulest of things. But when any bodily excretion takes place independently of will, then we experience this, like other things, by a necessity of nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252048%2520Letter%2520to%2520Amun%2520Written%2520Before%2520354%2520ad.html'
source_title="Letter 48, To Amun"
