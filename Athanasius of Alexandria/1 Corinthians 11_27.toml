[[commentary]]
quote='''
But, ‘stretching forth to those things that are to come,’ let us pray that we may not eat the Passover unworthily, lest we be exposed to dangers. For to those who keep the feast in purity, the Passover is heavenly food; but to those who observe it profanely and contemptuously, it is a danger and reproach. For it is written, ‘Whosoever shall eat and drink unworthily, is guilty of the death of our Lord.’ Wherefore, let us not merely proceed to perform the festal rites, but let us be prepared to draw near to the divine Lamb, and to touch heavenly food. Let us cleanse our hands, let us purify the body. Let us keep our whole mind from guile; not giving up ourselves to excess, and to lusts, but occupying ourselves entirely with our Lord, and with divine doctrines; so that, being altogether pure, we may be able to partake of the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%25205%2520For%2520333.html'
source_title="Festal Letter 5 (for 333), Section 5"
