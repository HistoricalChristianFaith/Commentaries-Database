[[commentary]]
quote='''
But since those whose only pleasure is to gainsay what is said aright, or rather what is made by God, pervert even a saying in the Gospels, alleging that ‘not that which goeth in defileth a man, but that which goeth out,’ we are obliged to make plain this unreasonableness,—for I cannot call it a question—of theirs. For firstly, like unstable persons, they wrest the Scriptures to their own ignorance. Now the sense of the divine oracle is as follows. Certain persons, like these of to-day, were in doubt about meats. The Lord Himself, to dispel their ignorance, or it may be to unveil their deceitfulness, lays down that, not what goes in defiles the man, but what goes out. Then he adds exactly whence they go out, namely from the heart. For there, as he knows, are the evil treasures of profane thoughts and other sins. But the Apostle teaches the same thing more concisely, saying, ‘But meat shall not bring us before God.’ Moreover, one might reasonably say no natural secretion will bring us before him for punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252048%2520Letter%2520to%2520Amun%2520Written%2520Before%2520354%2520ad.html'
source_title="Letter 48, To Amun"
