[[commentary]]
quote='''
In like manner those who suffer temporal afflictions here, finally having endured, attain comfort, while those who here persecute are trodden under foot, and have no good end. For even the rich man, as the Gospel affirms, having indulged in pleasure here for a little while, suffered hunger there, and having drunk largely here, he there thirsted exceedingly. But Lazarus, after being afflicted in worldly things, found rest in heaven, and having hungered for bread ground from corn, he was there satisfied with that which is better than manna, even the Lord who came down and said, ‘I am the bread which came down from heaven, and giveth life to mankind.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252010%2520For%2520338.html'
source_title="Festal Letter 10 (for 338), Section 6"
