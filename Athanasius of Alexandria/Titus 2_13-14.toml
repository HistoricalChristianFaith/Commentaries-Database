[[commentary]]
quote='''
While the Apostolic tradition teaches in the words of blessed Peter, ‘Forasmuch then as Christ suffered for us in the Flesh;’ and in what Paul writes, ‘Looking for the blessed hope and appearing of our great God and Saviour Jesus Christ, Who gave Himself for us that He might redeem us from all iniquity, and purify unto Himself a people for His own possession, and zealous of good works.’ How then has He given Himself, if He had not worn flesh? For flesh He offered, and gave Himself for us, in order that undergoing death in it, ‘He might bring to nought him that had the power of death, that is, the devil.’ Hence also we always give thanks in the name of Jesus Christ, and we do not set at nought the grace which came to us through Him. For the coming of the Saviour in the flesh has been the ransom and salvation of all creation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Athanasius%2520of%2520Alexandria%2FLetters%2520of%2520Athanasius%2FLetter%252060%2520To%2520Adelphius%252C%2520Bishop%2520and%2520Confessor%253A%2520Against%2520the%2520Arians.html'
source_title="Letter 60, To Adelphius, Section 6"
