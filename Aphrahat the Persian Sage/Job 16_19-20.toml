[[commentary]]
quote='''
Who is there that acquired great possessions, and at the time when he departed took them with him? That which was gathered together from the earth returns back into its bosom; and naked does a man depart from his possessions. The wise, when they acquire goods, send some of them before them, as Job said:—My witnesses are heaven; and again:—My brethren and my lovers are with God. And our Lord commanded them that acquire possessions to make for themselves friends in heaven, and also to lay up treasures there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 10"
