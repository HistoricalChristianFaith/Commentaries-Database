[[commentary]]
quote='''
Because of this, hear the word of the Lord, saying:—I will crush the Assyrian in My land, and on My mountains will I tread him down. And when he shall have been crushed and trodden down, the Virgin, the daughter of Zion, will despise him, and the daughter of Jerusalem will shake her head and say:—Whom hast thou reviled and blasphemed, and against whom hast thou lifted up thy voice? Thou hast lifted up thine eyes towards heaven against the Holy One of Israel, and by the hands of thy messengers thou hast reviled the Lord. Now see that the hook has been forced into thy nostrils, and the bridle into thy lips, and thou hast turned back with thine heart crushed, who camest with thine heart uplifted. And his slaying was by the hands of his loved ones; and in the house of his confidence, there was he overthrown, and fell before his god. And truly it was right, my beloved, that his body should thus become a sacrifice and offering before that god on whom he relied, and in his temple, as a memorial for his idol.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 4"
