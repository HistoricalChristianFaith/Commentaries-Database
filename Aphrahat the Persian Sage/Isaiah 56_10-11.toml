[[commentary]]
quote='''
Great is this mystery, beloved, which he provided and showed (as) His sign to Gideon. For He said to him: "Everyone who laps the water as a dog laps is fit to go to battle." And from every living creature which has been created there is not one which loves his master and keeps watch over him by day and by night as does a dog, and even when his master beats him severely he does not depart from him, and when he goes forth to the hunt with his master and a powerful lion meets his master he delivers himself over to death instead of his master. So are those strong who have been put to the test by the water; they follow their Master as the dogs, and they delivert themselves over to death for Him, and carry on His struggle valiant ly, and keep watch over Him by day and by night, and they roar like the dogs while they meditate upon the law day and night (cf. Heb. Ps. 1: 2), and they love the Lord, and they lick His wounds when they receive His Body, and they set Him before their eyes, and they lick Him with their tongues as a dog licks his master. And those who do not meditate upon the law are called "dumb dogs, who are not able to bark" (Isa. 56: 10); and all those who are not eager to fast are called "greedy dogs, not knowing how to be satisfied" (Isa. 56:11). And those who are eager to seek mercies receive the bread of children, and they cast it to them (cf. S. Mt. 15: 26).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 21"
