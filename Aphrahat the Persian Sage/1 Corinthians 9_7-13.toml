[[commentary]]
quote='''
I beseech you, ye pastors, that ye set not over the flock, leaders who are foolish and stupid, covetous also and lovers of possessions. Every one who feeds the flock shall eat of their milk. And every one who guides the yoke shall be ministered to from his labour. The priests have a right to partake of the altar, and the Levites shall receive their tithes. Whoever eats of the milk, let his heart be upon the flock; and let him that is ministered to from the labour of his yoke, take heed to his tillage. And let the priests who partake of the altar serve the altar with honour. And as for the Levites who receive the tithes, they have no portion in Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 10 (Of Pastors), Section 6"
