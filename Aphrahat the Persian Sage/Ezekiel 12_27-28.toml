[[commentary]]
quote='''
It was not as though it were unknown that He had promised in their behalf that things should be thus, and then the years were diminished and also were increased, but as known; for He knew the measure of that which was to come, and on account of His mercies He gave a time for repentance that men might be without excuse; and men despised the longsuffering of God, and when they heard that there was much time until the wrath which was promised should come, becoming bold they sinned before Him and said: "That which the prophets say is prophesied for a remote time." On account of this when there arose a disputing concerning these things in the days of Ezekiel the prophet and they said: "That which hath been prophesied is for a remote time," He said to Ezekiel: "As I live," saith the Lord of dominions, "there shall not again be a delay to My words, for the word which I shall speak I shall shortly accomplish." And He cut off that which He had foretold, to give to men a time for repentance, that perhaps they might repent; but they despised the longsuffering of God and did not repent, and He also changed the time which He had appointed and decreed to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 10"
