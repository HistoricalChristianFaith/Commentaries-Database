[[commentary]]
quote='''
For the animal shall be swallowed up in the spiritual, as I wrote unto thee above. And the man that grieves the spirit of Christ, will be animal in his resurrection; because the heavenly spirit is not with him, that the animal might be swallowed up in it. But when he shall arise he shall continue in his natural state, naked of the Spirit. Because he stripped off from him the Spirit of Christ, he shall be given over to utter nakedness. And whosoever honours the Spirit, and it is guarded in him in purity, in that day the Holy Spirit shall protect him, and he shall become altogether spiritual, and shall not be found naked; as the Apostle said:—And when we shall have clothed ourselves, may we not be found naked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 18"
