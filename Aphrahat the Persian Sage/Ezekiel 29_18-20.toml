[[commentary]]
quote='''
And as for that He said again:—I will destroy the overshadowing Cherub. For the Cherub that He will destroy is Nebuchadnezzar, as it is written:—He performed a work in Tyre, and there was given him by Tyre no hire for his host, and in return for the work of Tyre there was given him the land of Egypt. And why was hire not given by Tyre to Nebuchadnezzar? Clearly because its wealth went away in the sea, so that Nebuchadnezzar did not receive it. And at that time He destroyed the overshadowing Cherub, which is Nebuchadnezzar.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 9"
