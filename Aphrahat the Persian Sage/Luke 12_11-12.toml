[[commentary]]
quote='''
And again He taught us:—When they shall bring you before rulers and before magistrates, and before kings that hold the world, meditate not before the time what ye shall say, and how ye shall make defence; and I will give you a mouth and wisdom, that your enemies may not be able to overcome you, because it is not ye that speak, but the Holy Spirit of your Father; He shall speak in you. This is the spirit which spoke by the mouth of Jacob to Esau, his persecutor; and the spirit of wisdom which spoke before Pharaoh by the mouth of the persecuted Joseph; and the spirit which spoke by the mouth of Moses in all the prodigies which he did in the land of Egypt, and the spirit of knowledge which was given to Joshua, the son of Nun, when Moses laid his hand upon him, so that the nations which persecuted him came to a complete end before him; and the spirit that uttered psalms by the mouth of the persecuted David, by which he used to sing psalms and soothe Saul his persecutor from the evil spirit; and the spirit which clothed Elijah, and through him reproved Jezebel and Ahab his persecutor; and the spirit which spoke in Elisha, and prophesied and made known to the king his persecutor about all that was to happen thereafter; and the spirit which was fervent in the mouth of Micaiah when he reproved Ahab his persecutor saying:—If thou shalt at all return back, the Lord hath not spoken by me; and the spirit which strengthened Jeremiah, so that he stood boldly, and by it reproved Zedekiah; and the spirit that preserved Daniel and his brethren in the land of Babylon; and the spirit that delivered Mordecai and Esther in the place of their captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 21"
