[[commentary]]
quote='''
And Cain also was full of guile, and sacrifice was not accepted from him; and He gave to him (a place) of repentance, and he did not accept. For He said to him: "if thou hadst done well I would have accepted thy sacrifice; but thou hast not done well and thy sin will accompany thee" (Gen. 4: 7). And in the guile of his heart he slew his brother and was accursed, "and he was trembling and wandering on the earth" (Gen. 4: 12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 8"
