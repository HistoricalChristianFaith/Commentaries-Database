[[commentary]]
quote='''
So the word that He shall send through His Christ, Who is Himself the Word and the Message, shall return to Him with great power. For when He shall come and bring it, He shall come down like rain and snow, and through Him all that is sown shall spring up and bear righteous fruit, and the word shall return to His sender; but not in vain shall His going have been, but thus shall He say in the presence of His sender:—Behold, I and the children that the Lord has given Me. And this is the voice through which the dead shall live. Concerning it our Redeemer testifies, saying:—The hour shall come when even the dead shall hear the voice of the Son of Man and shall come forth from their tombs; as it is written, In the beginning was the voice, that is the Word. Again He said, The Word became a body and dwelt amongst us. And this is that voice of God which shall sound from on high and raise up all the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 15"
