[[commentary]]
quote='''
And all the pure virgins who are betrothed to Christ shall light their lamps and with the Bridegroom shall they go into the marriage chamber. All those that are betrothed to Christ are far removed from the curse of the Law, and are redeemed from the condemnation of the daughters of Eve; for they are not wedded to men so as to receive the curses and come into the pains. They take no thought of death, because they do not deliver children to him. And in place of a mortal husband, they are betrothed to Christ. And because they do not bear children, there is Given to them the name that is better than sons and daughters. And instead of the groans of the daughters of Eve, they utter the songs of the Bridegroom. The wedding-feast of the daughters of Eve continues for but seven days; but for these (virgins) is the Bridegroom who departs not for ever. The adornment of the daughters of Eve is wool that wears out and perishes, but the garments of these wear not out. Old age withers the beauty of the daughters of Eve, but the beauty of these shall be renewed in the time of the Resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 6"
