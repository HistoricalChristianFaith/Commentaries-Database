[[commentary]]
quote='''
These memorials that I have written unto thee, my beloved, concerning Jesus Who was persecuted, and the righteous who were persecuted, are in order that those who to-day are persecuted for the sake of the persecuted Jesus, may be comforted, for He wrote for us and comforted us Himself; for He said:—If they have persecuted Me, they will also persecute you. And because of this they will persecute you, that ye are not of the world, even as I was not of it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 21"
