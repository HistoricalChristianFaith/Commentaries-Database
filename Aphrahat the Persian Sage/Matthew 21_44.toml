[[commentary]]
quote='''
And furthermore Isaiah also prophesied beforehand with regard to this stone. For he said:—Thus saith the Lord, Behold I lay in Zion a chosen stone in the precious corner, the heart of the wall of the foundation. And he said again there:—Every one that believeth on it shall not fear. And whosoever falleth on that stone shall be broken, and every one on whom it shall fall, it will crush. For the people of the house of Israel fell upon Him, and He became their destruction for ever. And again it shall fall on the image and crush it. And the Gentiles believed on it and do not fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 6"
