[[commentary]]
quote='''
And our Lord encouraged the penitents and said: "I have not come to call the righteous but sinners to repentance" (S. Luke 5:32). And again He said: "There shall be joy in heaven over onesinner that repenteth, more than over ninety and nine righteous persons, who are not needing repentance " (S. Luke 15:7). The shepherd in concerned about that sheep who is lost from all the flock more than (about) those who have not wandered. For Christ died because of sinners, not because of the righteous, as He said by the prophet: "He bore the sins of many" (Isa. 53:12). And the Apostle said: "If while we were sinners God was reconciled with us by the death of His Son, how much more abundantly now in His reconciliation shall we live by His life" (Rom. 5:10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 13"
