[[commentary]]
quote='''
Moses was sent to deliver the people from Egypt, and took with him the woman who advised him to shameful acts, and the Lord met with Moses, and desired to slay him, till he sent back his wife to Midian.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 3"
