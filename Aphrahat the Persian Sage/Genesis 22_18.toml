[[commentary]]
quote='''
When the time of the law was at hand it was added on account of transgression. And He showed that it was an addition. And wherefore, then, was this addition? except on account of the calling of the Gentiles which was foretold before the law was promised. And that law was the keeper and teacher until that Seed should come in whom the Gentiles were blessed. For the word of the oath which was promised to Abraham is also a covenant of the promise; God said unto him, "In thy seed shall all the Gentiles be blessed." And this word, which is a covenant, placed four hundred and thirty years before the law, was a promise to Abraham that the Gentiles in his seed, which is Christ, should be blessed. And the law was four hundred and thirty years after these things. For when Abraham received this promise he was eighty-five years old, and from that time until Jacob went to Egypt was two hundred and five years, and from the time that Jacob went to Egypt and until the people came forth by the hand of Moses was two hundred and twenty-five years.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 3"
