[[commentary]]
quote='''
And Sennacherib also said thus:—I will go up to the summit of the mountains and to the shoulders of Lebanon. I will dig and drink water and will dry up with my horses’ hoofs all the deep rivers. And because he thus exalted himself, Isaiah again said concerning him:—Why does the axe boast itself against him that cutteth with it, or the saw exalt itself against him that saweth with it, or the rod lift itself up against him that wieldeth it? For thou, Sennacherib, art the axe in the hands of Him that cuts, and thou art the saw in the hands of Him that saws, and the rod in the hand of Him that wields thee for chastisement, and thou art the staff for smiting. Thou art sent against the fickle people, and again thou art ordained against the stubborn people, that thou mayest carry away the captivity and take the spoil; and thou hast made them as the mire of the streets for all men and for all the Gentiles. And when thou hast done all these things, why art thou exalted against Him Who holds thee, and why dost thou boast against Him Who saws with thee, and why hast thou reviled the holy city? and hast said to the children of Jerusalem:—Can your God deliver you from my hand? And thou hast dared to say:—Who is the Lord that He shall deliver you from my hands?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 4"
