[[commentary]]
quote='''
It happened one day, that a man, who is called wise amongst the Jews, questioned me, saying:—Jesus, Who is called your Teacher, wrote for you, that If there shall be in you faith like one grain of mustard, ye shall say to this mountain, Remove, and it shall remove from before you; and (ye shall say) even, Be lifted up and fall into the sea, and it shall obey you. So apparently there is in all your people not one wise man, whose prayer is heard, and who asks of God that your persecutors should cease from you. For clearly it is written for you in that passage, There is nothing which ye shall not be able to do.

And when I saw that he was blaspheming and speaking much against the Way (the Christian religion), my mind was disturbed, and I understood that he would not admit the interpretation of the words that he quoted to me. Then I also questioned him on sayings from the Law and from the Prophets, and said to him:—Do ye trust that even when ye are dispersed God is with you? And he professed to me, “God is with us, because that God said unto Israel:—Even in the lands of their enemies, I yet did not forsake them, nor did I make void My covenant with them.” In answer I said to him:—“Right good is this that I have heard from thee, that God is with you. Against thy words will I also speak unto thee. For I said the Prophet said unto Israel, as from the mouth of God:—If thou shalt pass through the sea, I will be with thee, and the rivers shall not overflow thee; and if thou shalt walk upon fire, thou shalt not be burned, and the flame shall not search thee; because the Lord thy God is with thee. Thus there is not one righteous and good and wise man out of all your people, who could pass through the sea and live and not be drowned; or (through) the river without its overflowing him; or who could walk over fire and see whether he would not be scorched and whether the flame would not burn him. And if thou shalt bring to me an explanation, I will not be persuaded by thee, just as thou also dost not accept from me the interpretation of the words as to which thou hast questioned me.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Sections 1-2"
