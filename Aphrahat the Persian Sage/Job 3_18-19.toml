[[commentary]]
quote='''
He leads away to himself slaves and their masters; and there the masters are not honoured more than their servants. Small and great are there, and they hear not the voice of the oppressor. The slave who is freed from his master there pays no regard to him who used to oppress him. Death binds and makes captive to himself the keepers of prisoners, and the prisoners who were shut up. By means of Death the prisoners are released, and fear not again because of their oppressors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 7"
