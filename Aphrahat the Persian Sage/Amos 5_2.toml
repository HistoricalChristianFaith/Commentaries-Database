[[commentary]]
quote='''
Consider and observe, my hearer, that if God had given a hope to Sodom and to her fellows, He would not have overthrown them with fire and brimstone, the sign of the last day of the world, but would have delivered them over to one of the kingdoms to be chastised. As it is written that when Jeremiah caused the nations and kingdoms to drink the cup of wrath, he said concerning each one of the cities, that after they shall drink the cup, I will turn back the captivity of Elam, of Tyre, of Zidon, of the children of Ammon, and of Moab, and of Edom. Concerning each one of these kingdoms he said:—In the last days I well turn back her captivity. Now we see that Tyre was inhabited, and was opulent after she had wandered seventy years, and after she had received the reward of her harlotries and after she had committed fornication with all kingdoms. And she took the harp, and played it sweetly, and multiplied her music. And also the region of Elam is inhabited and opulent. And with regard to Babylon Jeremiah said:—Babylon shall fall, and shall not rise. And lo! unto this day does it continue in desolation, and will do so for ever. And also about Jerusalem he said:—The virgin of Israel shall fall, and shall not rise again. She is forsaken upon the ground and there is none to raise her up. For if the prophecy is true which Jeremiah spoke about Babylon, also that about Jerusalem is true and worthy of faith. And Isaiah said unto Jerusalem:—I will not again be wroth with thee, nor will I reprove thee. Of a truth He will not again be wroth with her, nor will He reprove her for ever; for that which is in desolation He will not reprove, nor will she provoke him to wrath.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 6"
