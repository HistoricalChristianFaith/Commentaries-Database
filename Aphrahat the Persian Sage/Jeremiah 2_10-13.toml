[[commentary]]
quote='''
But they forsook Him, and worshipped idols, as Jeremiah said concerning them:—Go to the distant isles, and send to Kedar, and consider well and see, whether there has been (anything) like this, whether the nations change their gods, those that are no gods. But My people has changed My honour for that which is not profitable. Be astonished, ye heavens, at this; and quake and fear greatly, saith the Lord; because My people have done two wickednesses; they have abandoned Me, the fountain of the water of life, and they have gone and dug for themselves cisterns, broken cisterns which cannot hold water. For the broken cisterns are the fear of images and idols. And He calls the heavens to astonishment, because they worshipped the hosts of the heavens. And the heavens shall receive as a penalty, that they shall be rolled up as a scroll, and all the host of them shall fall down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 7"
