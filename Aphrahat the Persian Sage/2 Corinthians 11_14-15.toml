[[commentary]]
quote='''
And if thou shouldest say, “How manifold is Satan! for lo! he fights with many;” then hear and learn from that which I proved to thee above concerning Christ, that no matter to what extent He is divided amongst many, yet He is not a whit diminished. For, as the house, through the window of which a little sunlight enters, is altogether illumined, so the man into whom a little of Satan enters, is altogether darkened. Hear that which the Apostle said:—If Satan is transfigured to an angel of light, it is no wonder if his ministers also are transfigured to ministers of righteousness. And again our Lord said to His disciples:—Lo, I have given you authority to tread upon the power of the adversary. And the Scriptures have made known that he has power and also ministers. Moreover Job said concerning him:—God made him to wage his war. These ministers then that he has, he causes to run in the world, to wage war. But be sure that he will not fight openly; because from the time of the coming of our Saviour, (God) has given authority over him. But he will surely plunder and steal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 17"
