[[commentary]]
quote='''
He said again:—The saints of the Most High shall receive the Kingdom. What shall we say concerning this? Have the children of Israel received the Kingdom of the Most High? God forbid. Or has that people come upon the clouds of heaven? This has passed away from them. For Jeremiah said concerning them:—Call them rejected silver, for the Lord has rejected them. Again he said:—He will not again regard them. And Isaiah said concerning them:—Pass by; pass by; approach not the defiled. And concerning the saints of the Most High (Daniel) said thus:—They shall inherit the Kingdom for ever. For these rested a little from the burden of kings and princes, namely, from after the death of Antiochus till the sixty-two weeks were fulfilled. And the Son of Man came to free them and gather them together, but they did not receive Him. For He came to obtain fruit from them, and they did not give it to Him. For their vines were of the vine of Sodom and of the stock of Gomorrha, a vineyard in which thorns grew, and which bore wild grapes. Their vine was bitter, and their fruit sour. The thorns could not be softened, nor could the bitterness change to the nature of wine, nor could the sour fruit change to a sweet nature.

For Isaiah first set men of Judah as judges over them, and there was planted amongst them a new and beloved planting. But these are those judges who shall sit on twelve thrones and judge their twelve tribes. And thus He said to the judges:—Judge between Me and My vineyard, what further, O ye judges, should I have done to My vineyard, that I did not do? For lo! I planted it with vine scions, and they became strange vines. I surrounded it with a fence of heavenly Watchers and I built its tower, the holy Temple. And I dug out its winepress, the baptism of the priests. And I brought down rain upon it, the words of My Prophets. And I pruned it and trimmed it, from the works of the Amorites. I looked that it should produce grapes of righteousness, and it produced wild grapes of iniquity and sin. I looked for judgment and behold oppression, and for righteousness and there was a cry. Hear, O ye judges, what I will do to My vineyard. I will break open its fence, and it shall be for down-treading. And I will tear down its tower, and it shall be for pillage. And I will make it to become a desert because it produced wild grapes. And it shall not be dressed and it shall not be pruned. And thorns and weeds shall grow up in it. And I will command the clouds that they send not down rain upon it. For the heavenly Watchers departed from the fence of the vineyard; and the mighty tower on which they relied was torn down. The winepress, the cleansing away of their offences, was overthrown. When the vine was without blemish, it did not prove of service. Now that the fire has devoured it and that it is laid waste, how shall it prove of service? The fire has devoured its two branches and its inward parts are wasted. For its two branches are the two kingdoms, and its inward part which is laid waste is Jerusalem. Many servants were sent to them by the Lord of the vineyard. And they slew them and did not send the fruit to the Lord of the vineyard. After the servants the beloved Son was sent, to receive from them the fruit and to bring it back to Him that sent Him. And they seized Him and cast Him out of the vineyard; and they cut spikes from the thorns of the vineyard and fixed them in His hands. And He was hungry and asked food of them; and they took and gave Him gall from the fruit of the vineyard. He was thirsty and asked of them drink; and they gave Him vinegar and He would not drink it. And they platted a crown of thorns that had sprung up in the vineyard, and placed it on the head of the Son of the Lord of the vineyard. For from the time that the vineyard was made, it displayed these fruits. Therefore its Lord uprooted it and cast it in the fire; and planted good fruit-bearing vines in the vineyard, and such as gladden the husbandman. For Christ is the vineyard, and His Father is the husbandman; and they who drink of His cup are the vines. Therefore vineyard was formed instead of vineyard. And furthermore at His coming He handed over the kingdom to the Romans, as the children of Esau are called. And these children of Esau will keep the kingdom for its giver.

And the holy People inherited an eternal Kingdom; the holy people who were chosen instead of the People. For He provoked them to jealousy with a people that was not a people. And with a foolish people He angered them. And He set free the holy people. For lo! every covenant of God is freed from the burden of kings and princes. For even if a man has served the heathen, as soon as ever he draws nigh unto the covenant of God, he is set free. But the Jews are toiling in bondage amongst the Gentiles. For thus he said about the Saints;—They shall inherit the Kingdom that is beneath the heaven. But if he had said it about them (the Jews), why are they toiling in service amongst the Gentiles? And if they say that it has not taken place as yet; then (we ask) is the Kingdom that shall be given to the Son of man, to be heavenly or earthly? And lo! the children of the Kingdom are sealed, and they have received their emancipation from this world. For since it exists now, it will not be willing to be subjected to the power of the King, Who shall come and take to Himself His Kingdom. But it will guard His pledges with honour, that when He shall come to bring to nought the Kingdom, he may come upon them not in anger. For when He, Whose is the Kingdom, shall come in His second coming, He will take to Himself whatever He has given. And He Himself will be King for ever and ever. And His Kingdom shall not pass away, because it is an eternal Kingdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Sections 21-23"
