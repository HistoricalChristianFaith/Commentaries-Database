[[commentary]]
quote='''
For all our fathers, in hope of the Resurrection and the quickening of the dead, were looking forward and hastening; as the blessed Apostle said, If the righteous had been looking forward to that city from which Abraham went forth, they would have had an opportunity of again turning back and to it; but they showed that they were looking forward to one better than it, namely that which is in heaven. They were looking forward to be released and to go speedily thither. And from that which I am writing unto thee, understand and observe that they were looking forward to the Resurrection. For Jacob our father, when he was dying, bound Joseph his son with an oath, and said to him, Bury me in the tomb of my fathers, with Abraham and Sarah and Isaac and Rebecca. And why, my beloved, did Jacob not wish to be buried in Egypt, but with his fathers? He showed beforehand, that he was looking forward to the quickening of the dead; that, when the Resurrection shout should be raised and the sound of the trumpet (heard), he might rise up near to his fathers, and might not at the time of the Resurrection be mingled with the wicked who shall return to Sheol and to punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 7"
