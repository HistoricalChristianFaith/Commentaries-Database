[[commentary]]
quote='''
But, however, we say thus: That which our Redeemer said to us is true:—Heaven and earth shall pass away. And the Apostle said, Hope which is seen is not hope. And the Prophet said, The heavens shall pass away as smoke, and the earth as a garment shall wear away; and its inhabitants shall become like it. And Job said concerning those that sleep, Till the heavens wear out, they shall not be aroused, nor shall they wake out of their sleep. From these things be thou persuaded that this earth, in which the children of Adam are sown, and the firmament that is over men, (even) that firmament which is set to divide the upper heavens from the earth and this life, shall pass away, and wear out, and be destroyed. And God will make a new thing for the children of Adam, and they shall inherit inheritances in the Kingdom of Heaven. If He shall give them inheritance in the earth, it shall be called the kingdom of heaven. And if in Heaven, it is easy for Him to do.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 24"
