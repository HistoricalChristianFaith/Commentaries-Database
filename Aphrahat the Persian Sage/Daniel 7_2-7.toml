[[commentary]]
quote='''
Again hear concerning the vision of the four beasts which Daniel saw coming up out of the sea and diverse one from another. This is the appearance of them:—The first was like a lion, and it had the wings of an eagle. And I saw that its wings were plucked away, and it stood up like a man upon its feet, and the heart of a man was given to it. And the second beast was like a bear, and it raised itself up upon one side and there were three ribs in its mouth between its teeth. And the third beast was like a leopard, and it had four wings and four heads. And the fourth beast was exceedingly terrible and strong and powerful, and it had great teeth. It devoured and brake to pieces, and whatsoever remained, it stamped with its feet. Now the great sea that Daniel saw is the world: and these four beasts are the four kingdoms signified above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 15"
