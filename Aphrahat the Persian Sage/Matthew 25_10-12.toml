[[commentary]]
quote='''
Also in respect of penalty, I say that all men are not equal. He that has done great wickedness is greatly tormented. And he that has offended not so much is less tormented. Some shall go into outer darkness, where there is weeping and gnashing of teeth. Others shall be cast into the fire, according as they deserve; for it is not written that they shall gnash their teeth, nor that there is darkness there. Some shall be cast into another place, a place where their worm shall not die, and their fire shall not be quenched, and they shall became an astonishment to all flesh. In the faces of others the door shall be closed and the Judge will say to them:—I know you not. And consider that, as the reward for good deeds is not equal for all men, so it is also for evil deeds. Not in one fashion shall men be judged, but every man according to his works shall receive his requital, because the Judge is clothed in righteousness and regards not the persons of men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 22"
