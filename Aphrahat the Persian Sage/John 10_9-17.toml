[[commentary]]
quote='''
The good shepherd giveth himself for the sake of his sheep. And again He said:—I have other sheep and I must bring them also hither. And the whole flock shall be one, and one shepherd, and My Father because of this loveth Me; that I give Myself for the sake of the sheep. And again He said;—I am the door of the sheep. Every one that entereth by Me shall live and shall go in and go out and find pasture. O ye pastors, be ye made like unto that diligent pastor, the chief of the whole flock, who cared so greatly for his flock. He brought nigh those that were afar off. He brought back the wanderers. He visited the sick. He strengthened the weak. He bound up the broken. He guarded the fatlings. He gave himself up for the sake of the sheep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 10 (Of Pastors), Section 4"
