[[commentary]]
quote='''
This is the Spirit, my beloved, that the Prophets received, and thus also have we received. And it is not at every time found with those that receive it, but sometimes it returns to Him that sent it, and sometimes it goes to him that receives it. Hearken to that which our Lord said:—Despise not one of these little ones that believe on Me, for their angels in heaven do always behold the face of My Father. This Spirit then goes frequently and stands before God and beholds His face, and whosoever injures the temple in which it dwells, it will accuse him before God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 15"
