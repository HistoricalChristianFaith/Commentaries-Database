[[commentary]]
quote='''
For the venerated name of Godhead has been applied also to righteous men, and they have been held worthy to be called by it. And the men with whom God was well pleased, them He called, My sons, and My friends. When He chose Moses His friend and His beloved and made him chief and teacher and priest unto his people he called him God. For He said to him:—I have made thee a God unto Pharaoh. And He gave him His priest for a prophet, And Aaron thy brother shall speak for thee unto Pharaoh, and thou shalt be unto him as a God, and he shall be unto thee an interpreter. Thus not alone to the evil Pharaoh did He make Moses God, but also unto Aaron, the holy priest, He made Moses God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 17 (Of Christ the Son of God), Section 3"
