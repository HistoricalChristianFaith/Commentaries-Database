[[commentary]]
quote='''
When our Lord went outside of His nature, He walked in our nature. Let us abide in our nature, that in the day of judgment He may cause us to partake of His nature. Our Lord took from us a pledge when He went, and He left us a pledge of His own when he ascended. He that was without need, because of our need devised this expedient. What was ours was His even from the beginning, but that which was His, who would have given us? But true is that which our Lord promised us:—Where I am there ye also shall be. For whatsoever He took of ours, is in honour with Him, and (as) a diadem is bound upon His Head. So also that, which of His we have received, we ought to honour. That which is ours is held in honour with Him who was not in our nature: let us honour that which is His in His own nature. If we honour Him, we shall go to Him, Who took upon Him of our nature and so ascended. But if we despise Him, He will take away from us that which He has given us. If we deal fraudulently with His pledge, He will there take away that which is His, and will deprive us of all that He has promised us. Let us magnify gloriously the King’s Son Who is with us, because a hostage for Him has been taken from us. Whoso holds the King’s Son in honour, shall obtain many gifts from the King. That of ours, that is with Him, has sat down in honour and a diadem is bound upon His head, and He has sat down with the King. And we who are poor, what shall we do to the King’s Son Who is with us? He needs nothing from us, but that we should adorn our temples for Him; that when the time is accomplished and He goes to His Father, He may give thanks to Him because of us, because we have honoured Him. When He came to us, He had nothing of ours, and also we had nothing of His, though the two natures were His and His Father’s. For when Gabriel made announcement to the Blessed Mary who bore Him, the word from on high set out and came, and the word became flesh and dwelt in us. And when He returned to Him that sent Him, He took away, when He went, that which He had not brought, as the Apostle said:—He has taken us up and seated us with Himself in the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 10"
