[[commentary]]
quote='''
There is not in that place any want at all; but it is full of light, and life, and grace, and fulness, and satisfaction and renewal, and love, and all the good promises that are written but not yet sealed. For there is there that which eye hath not seen and ear hath not heard, and which hath not come up into the heart of man, that which is unspeakable and which a man cannot utter. And the Apostle said:—That which God hath prepared for them that love Him. Though men shall say much, they shall not be able to express it. That which eye hath not seen, they are unable to relate; and that which ear hath not heard, it is not right to speak of in such wise as to compare it with anything that the ear has heard and the eye has seen. And that which has not come up unto the heart, who is there dares to speak of it, as though it was like anything that has come up into the heart? But this is right for a speaker, to liken and call that place the abode of God, and the place of life, the perfect place, the place of light, the place of glory, the Sabbath of God, the day of rest, the repose of the righteous, the joy of the just, the abode and dwelling-place of the righteous and the holy, the place of our hope, the sure abode of our trust, the place of our treasure, the place that shall assuage our weariness and remove our afflictions, and soothe our sighs. To these things it is right for us to liken, and thus to call, that place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 13"
