[[commentary]]
quote='''
And even as I have showed thee concerning the world, how one honour excels another, of those that kings and rulers of this world give to those beneath them; also concerning this I have showed thee, that even as kings have good gifts to give to those honoured by them, so also they have prisons and chains and fetters, which are various kinds of bonds. One man offends the king with a grievous offence, and without inquiry he is delivered over to death. Another offends, yet is not deserving of death; he is put in bonds until he is judged; and is chastised, and the king remits his offence. There is another whom the king has held in regard; and outside the prison house he is kept in freedom, without chains and without bonds. He that is put to death is distinguished from him that is bound; and the punishment of one exceeds that of another, according to the desert of his offence. But come thou to our Redeemer, Who said:—Many are the mansions in My Father’s house.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 23"
