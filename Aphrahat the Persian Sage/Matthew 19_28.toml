[[commentary]]
quote='''
Remember that the Apostle also said, We shall judge angels. And our Lord said to His disciples, Ye shall sit on twelve thrones, and judge twelve tribes of the house of Israel. And Ezekiel said concerning righteous men, that they shall judge Ahola and Aholibah. Since, then, the righteous are to judge the wicked, He has made clear concerning them that they shall not come into judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 16"
