[[commentary]]
quote='''
Also Elisha was persecuted as Jesus was persecuted. Elisha was persecuted by the son of Ahab, the son of the murderer; and Jesus was persecuted by the murderous people. Elisha prophesied, and there came about abundance in Samaria; and Jesus said:—Whosoever eateth of My body and drinketh of My blood shall live for ever. Elisha satisfied a hundred men with a little bread; and Jesus satisfied four thousand men, besides women and children, with five loaves. Elisha made oil out of water; and Jesus made wine out of water. Elisha delivered the widow from her creditor; and Jesus delivered the indebted nations. Elisha made the iron to swim and the wood to sink; and Jesus raised up that which was sunk in us, and sank that which was light. A dead man (laid) upon the bones of Elisha recovered life; and all the nations, who were dead in their sins, were cast upon the bones of Jesus and recovered life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 15"
