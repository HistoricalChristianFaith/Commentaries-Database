[[commentary]]
quote='''
Concerning Daniel they expected that when he had fallen into the pit he would not come up again; and concerning Jesus they said, Since He has fallen, He shall not rise again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 18"
