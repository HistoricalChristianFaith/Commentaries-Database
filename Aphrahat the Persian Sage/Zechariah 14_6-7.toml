[[commentary]]
quote='''
And on that day a great prodigy happened. namely, that the light became dark in the middle of the day, as Zechariah prophesied, saying:—The day shall be known unto the Lord. It shall not be daytime, and it shall not be night; and at the evening time there shall be light. Now what is the day that was distinguished by the prodigy, that it was neither daytime nor night, and that at the evening time there was light? Evidently the day on which they crucified Him, for in the midst of that day there came darkness, and at the evening time there was light. And again he said:—That day there shall be cold and frost.—As thou knowest, on that day on which they crucified Him, it was cold, and they had made them a fire to warm themselves when Simon came and stood with them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 17 (Of Christ the Son of God), Section 10"
