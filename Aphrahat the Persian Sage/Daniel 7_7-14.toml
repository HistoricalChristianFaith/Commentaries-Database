[[commentary]]
quote='''
Therefore, as for the ram, its horns are broken. And though its horns are broken, lo! it exalts and uplifts itself against the fourth beast, that is strong and mighty and its teeth of iron and its hoofs of brass, and it shall devour and grind down, and trample with its feet whatsoever remaineth. O Ram, whose horns are broken, rest thou from the beast, and provoke it not lest it devour thee and grind thee to powder. The ram could not stand before the he-goat; how shall it stand before that terrible beast, whose mouth speaketh great things, and whatsoever it finds it couches over as a lion over his prey? Whoever provokes the lion becomes its portion; and whoever stirs up that beast, it shall devour him. And who is there that shall escape out from under the feet of that beast when it is trampling on him? For the beast shall not be slain until the Ancient of Days shall sit upon the throne, and the Son of Man shall come near before Him, and authority shall be given to Him. Then shall that beast be slain and its carcase shall perish. And the Kingdom of the Son of Man shall be established, an eternal Kingdom, and His authority from generation to generation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 6"
