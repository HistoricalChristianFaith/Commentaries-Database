[[commentary]]
quote='''
Moreover the blessed apostle also said:—God divided of the Spirit of Christ and sent it into the Prophets. And Christ was in nothing injured, for it was not by measure that His Father gave unto Him the Spirit. By this reflection thou canst comprehend that Christ dwells in faithful men; yet Christ suffers no loss though He is divided among many. For the Prophets received of the Spirit of Christ, each one of them as he was able to bear. And of the Spirit of Christ again there is poured forth to-day upon all flesh, and the sons and the daughters prophesy, the old men and the youths, the men-servants and the hand-maids. Something of Christ is in us, yet Christ is in heaven at the right hand of His Father. And Christ received the Spirit not by measure, but His Father loved Him and delivered all into His hands, and gave Him authority over all His treasure. For John said:—Not by measure did the Father give the Spirit to His Son, but loved Him and gave all into His hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 12"
