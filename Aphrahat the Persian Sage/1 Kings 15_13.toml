[[commentary]]
quote='''
King Asa also conquered the Accursed-of-life, when he wished to come in against him, through his mother. For Asa knew his craftiness and removed his mother from her high estate, and cut in pieces her idol and cast it down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 3"
