[[commentary]]
quote='''
Therefore, my beloved, as I have been able to obtain now from that treasure that fails not, I have sent unto thee from it. Yet though I have sent it to thee, it is all with me. For the treasure fails not, for it is the wisdom of God; and the steward is our Lord Jesus Christ, as He testified when He said:—All things have been committed to Me by My Father. And while He is the steward of the wisdom, again, as the Apostle said:—Christ is the power of God and His wisdom. This wisdom is imparted to many, yet nothing is lacking, as I explained to thee above; the Prophets received of the spirit of Christ, yet Christ was not a whit diminished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 10 (Of Pastors), Section 8"
