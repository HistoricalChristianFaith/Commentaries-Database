[[commentary]]
quote='''
And furthermore David said concerning His Passion:—For My meat they gave gall, and for My thirst did they give Me vinegar to drink.—Again he said in that passage:—They have persecuted Him Whom Thou hast smitten; and have added to the affliction of Him that was slain. For they added many (afflictions) to Him, much that was not written concerning Him, cursings and revilings, such as the Scripture could not reveal, for their revilings were hateful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 17 (Of Christ the Son of God), Section 10"
