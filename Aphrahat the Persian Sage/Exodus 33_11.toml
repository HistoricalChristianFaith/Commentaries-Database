[[commentary]]
quote='''
For thus it is written, my beloved, concerning Moses, that from the time the Holy One was revealed to him, he also loved holiness. And from the time he was sanctified, his wife ministered not to him. But it is thus written:—Joshua, the son of Nun, was the minister of Moses from his childhood. And of Joshua again it is thus written concerning him, that he used not to depart from the tabernacle. And the temporal tabernacle was not ministered to by a woman, because the Law did not allow women to enter the temporal tabernacle, but even when they came to pray, they used to pray at the door of the temporal tabernacle, and then turn back. Moreover, he commanded the Priests, that at the time of their ministry they should continue in holiness, and should not know their wives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 5"
