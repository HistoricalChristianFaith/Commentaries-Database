[[commentary]]
quote='''
And understand that our Lord has made known to us in His Gospel, that every man according to his work shall receive his reward. He that received money, showed the increase on it. He whose pound or talent produced tenfold, received life, perfect, in nothing lacking. He whose pound or talent produced fivefold, received the half of ten. One was given a tenfold authority and one a fivefold. Now consider and see, that the increase of five is less than that of ten; and the labourers who demand the reward excel them that received it in silence. They who toiled all the day, with bold face receive the reward and demand it, in confidence that He will add more to them. While they who worked one hour receive it in silence, and know that through grace they receive mercy and life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 18"
