[[commentary]]
quote='''
And also through the Prophet Ezekiel, the Resurrection of the dead was manifestly shown, when God brought him forth to the valley and showed him many bones, and made him pass by them round about them, and said to him:—Son of Man, will these bones live? And Ezekiel said to Him:—Thou knowest, O Lord of lords. And the Lord said to him:—Prophesy, O Son Man, over these bones; prophesy and say to the dry bones, Hear the word of the Lord of lords. And when he had caused them to hear those words, there was a shaking and a noise, and the bones were gathered together, even those that were crushed into pieces and broken. And when the Prophet saw them, he was astonished, for they came together from all sides, and each bone received its fellow, and each joint approached its fellow-joint, and they ordered themselves, one on another. And their dryness was made moist, and the joints were united by the ligatures, and the blood grew warm in the arteries, and skin was stretched over the flesh, and hair grew up according to its nature. But they lay prostrate and there was no breath in them. Then again He commanded the Prophet, and said to him:—Prophesy unto the spirit and say to it, Come, O spirit, from the four winds, and breathe upon these slain men that they may live. And when he caused them to hear this second word, the spirit entered into them, and they revived and stood up upon their feet, a very great host.

But why, my beloved, was it that those dead did not rise because of the one word (spoken) through Ezekiel, and why was not their resurrection, both of bones and spirit, accomplished (through that one word)? For lo! by one word the bones were fitted together, and by another the spirit came. It was in order that full perfection might be left for our Lord Jesus Christ, Who with one utterance and one word will raise up at the last day every body of man. For it was not the word that was insufficient, but its bearer was inferior. And with regard to this, understand and observe that when Elijah also, and Elisha his disciple, raised the dead, it was not with one word that they raised them up, but after they had prayed and made intercession and delayed no little time, then they arose.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Sections 12-13"
