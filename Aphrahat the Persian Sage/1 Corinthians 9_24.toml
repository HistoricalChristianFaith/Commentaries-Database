[[commentary]]
quote='''
Of all those who are begotten, who have put on a body, there is only One innocent, that is our Lord Jesus Christ; just as He bore witness concerning Himself, for He said: "I have overcome the world" (S. John 16: 33). And the prophet also bore witness concerning Him: "He did not iniquity, neither was guile found in His mouth" (Mal. 2: 6). And the blessed Apostle said: "He who had not known sin made Himself sin in our behalf" (2 Cor. 5; 21). And how did He make Himself sin? if not because of His taking sin, when He Himself had not committed it, and His nailing it on His cross. Again the Apostle said: "There are many who run in the race course, but one received the crown (1 Cor. 9: 24). Furthermore, there is no other of the sons of Adam who, descending into the contest, has not been smitten and beaten; for sin has reigned from (the time) that Adam transgressed against the commandment; and from the many it (sin) had beaten, and the many it had smitten, and the many it had killed, there was not a man from the many (that) it had not destroyed, until our Saviour came, and took it, and nailed it on His cross. And even when it was nailed on the cross there was (still) its sting, and it will sting many until the end, and (then) its sting will be broken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 1"
