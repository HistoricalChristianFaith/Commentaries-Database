[[commentary]]
quote='''
Be ye not afraid, O penitents, lest the hope which is written in the Scriptures be cut off; for it is fitting for the Spirit of God thus to warn, for a fearful warning is set in Ezekiel the prophet when He said to him: "If all his days a man shall do judgment and righteousness, and at the end of his days he shall do iniquity, in his iniquity he shall die. And if a man shall do iniquity all his days, and he shall repent and do judgment and righteousness, his soul shall live" (Ezek. 33: 18-19). By this one word He has warned the righteous that he should not sin and lose his course; and He gave hope to the wicked that he should turn from his iniquity and live.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 10"
