[[commentary]]
quote='''
Know moreover, beloved, that there is no law for God. For sometimes He increases and diminishes, and sometimes He adds to because it is little. For in the days of Noah on account of the sins of men He promised that the days of men should be one hundred and twenty years, and in the six hundredth year of the years of the life of Noah He destroyed them. For He said: "A hundred and twenty years they shall be upon the earth." And in the six hundredth year of the years of the life of Noah they were destroyed, and he took away these twenty years.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 9"

[[commentary]]
quote='''
And also to the generation in the days of Noah he gave one hundred and twenty years for repentance; and they were not willing to repent and, one hundred years being completed, He destroyed them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 8"
