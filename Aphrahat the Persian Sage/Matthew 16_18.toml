[[commentary]]
quote='''
And also Simon who was called Cephas because of his faith was called the firm rock.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 17"

[[commentary]]
quote='''
And also Simon, the chief of the disciples, when he denied, (saying) that Christ hath never seen me, and he cursed and swore, "I do not know Him" (S. Mt. 26: 74) and when repentance came to him he multiplied tears in his weeping; our Lord received him, and made him the foundation, and called him Peter, the edification of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 15"
