[[commentary]]
quote='''
David also proclaimed, saying:—For lo! for the dead Thou workest wonderful things, and the mighty ones shall rise and make confession unto Thee, and those that are in the tombs shall recount Thy grace. And how in the tombs shall they recount the grace of God? Clearly, when they shall hear the sound of trumpet summoning them, and the cornet sounding forth from on high, and the earthquake that shall be, and the tombs that shall be opened, then the mighty ones shall arise in glory, and recount one to another in the tombs, saying, “Great is the grace that is performed towards us. For our hope was cut off; yet (another) hope has arisen for us. We were imprisoned in darkness, and have come forth to the light. We were sown in corruption, and have risen in glory. We were buried naturally, and we have risen spiritually. Again we were sown in weakness, and have risen in power.” This is the grace that they shall tell of in the tombs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 10"
