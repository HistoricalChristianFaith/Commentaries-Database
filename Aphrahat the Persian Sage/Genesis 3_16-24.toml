[[commentary]]
quote='''
Therefore, brethren, because we know and have seen that from the beginning it was through woman that the adversary had access unto men, and to the end he will accomplish it by her—for she is the weapon of Satan, and through her he fights against the champions. Through her he makes music at every time, for she became as a harp for him from the first day. For because of her the curse of the Law was established, and because of her the promise unto death was made. For with pangs she bears children and delivers them to death. Because of her the earth was cursed, that it should bring forth thorns and tares. Accordingly, by the coming of the offspring of the Blessed Mary the thorns are uprooted, the sweat wiped away, the fig-tree cursed, the dust made salt, the curse nailed to the cross, the edge of the sword removed from before the tree of life and it given as food to the faithful, and Paradise promised to the blessed and to virgins and to the saints. So the fruit of the tree of life is given as food to the faithful and to virgins, and to those that do the will of God has the door been opened and the way made plain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 6"
