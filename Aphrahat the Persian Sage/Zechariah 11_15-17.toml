[[commentary]]
quote='''
O shepherds, disciples of the Lord, feed the flock and lead (it) well! Strengthen the sick, support the weak, bind up the broken, make whole the lame, and take heed to the fattened ones for the Lord of the flock. Be not likened unto an unskilled and foolish shepherd, who in his foolishness is not able to feed the flock, and whose arm is dried up, and whose eye has been blinded, because he said: "dying, let it die; and perishing, let it perish, and the flesh that is left shall be eaten by its companions ". And when the Chief of the shepherds comes He will condemn the unskilled and foolish shepherd who has not cared well for his fellow servants. And he who has shepherded the flock and led (it) well shall be called "a good and skillful servant" (cf. S. Mt. 25: 21), who has presented the flock to the Shepherd while it was intact.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 26"

[[commentary]]
quote='''
O stupid and foolish pastor, to whose right hand and to whose right eye I committed my sheep. Because thou didst say concerning the sheep, let that which dieth, die, and let that which perisheth perish, and whatever is left, let them devour the flesh of one another; therefore, behold I will make blind thy right eye and I will wither up thy right arm. Thy eye which regarded a bribe shall be blinded, and thy hand which did not rule in righteousness shall waste away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 10 (Of Pastors), Section 3"
