[[commentary]]
quote='''
And also concerning Elijah it is thus written, that at one time he dwelt in Mount Carmel, and at another he dwelt at the brook Cherith, and was ministered to by his disciple; and because his heart was in heaven, the bird of heaven used to bring sustenance to him; and because he took upon him the likeness of the angels of heaven, those very angels brought him bread and water when he was fleeing from before Jezebel. And because he set all his thought in heaven, he was caught up in the chariot of fire to heaven, and there his dwelling-place was established for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 5"
