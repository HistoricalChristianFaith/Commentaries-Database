[[commentary]]
quote='''
Again I will show thee, beloved, that love is more excellent than anything else, and by it the righteous ones of the old times were perfected. For it (i. e. the Scripture) shows concerning Moses that he gave himself in behalf of the sons of his people, and he wished that he might be blotted out of the book of life (if) only the people might not be blotted out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 17"

[[commentary]]
quote='''
Moses fed the sheep of Jethro his father-in-law, and he was chosen from (tending) the sheep to tend his people, and as a good pastor he guided them. Moses bore his staff upon his shoulder, and went in front of his people that he was leading, and tended them for forty years; and he was vigilant and toiled on behalf of his sheep, a diligent and good pastor. When his Lord wished to destroy them because of their sins, in that they worshipped the calf, Moses prayed and besought of his Lord and said:—Either pardon the people for their sins, or else blot me out from Thy book that Thou hast written. That is a most diligent pastor, who delivered over himself on behalf of his sheep. That is an excellent leader, who gave himself in behalf of his sheep. And that is a merciful father who cherished his children and reared them up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 10 (Of Pastors), Section 2"
