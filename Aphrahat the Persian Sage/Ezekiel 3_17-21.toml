[[commentary]]
quote='''
Be ye not afraid, O penitents, lest the hope which is written in the Scriptures be cut off; for it is fitting for the Spirit of God thus to warn, for a fearful warning is set in Ezekiel the prophet when He said to him: "If all his days a man shall do judgment and righteousness, and at the end of his days he shall do iniquity, in his iniquity he shall die. And if a man shall do iniquity all his days, and he shall repent and do judgment and righteousness, his soul shall live" (Ezek. 33: 18-19). By this one word He has warned the righteous that he should not sin and lose his course; and He gave hope to the wicked that he should turn from his iniquity and live. Again He said to Ezekiel: "Although I cut off the hope of the unrighteous, thou shalt surely warn him; also when I encourage the righteous, set thou fear before him that he may be warned" (abridged thought of Ezek. 33: 7-9). When I say to the sinner: "Thou shalt surely die; and thou dost not warn him, the sinner shall die in his iniquity, and is blood will I require from thy hand" (Ezek. 3: 18), because thou didst not warn him. "And if thou warn the sinner, the sinner shall live whom thou shalt warn, and thou shalt save thy soul. And when thou shalt say to the righteous: thou shalt surely live, and there shall be confidence to him concerning this, it was fitting for thee to warn him lest he be exalted and sin; and he who has been warned shall live, and thou shalt save thy soul" (Ezek. 3: 17-21 loosely).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 10"
