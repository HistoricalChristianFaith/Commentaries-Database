[[commentary]]
quote='''
And it was thus that our Saviour taught us diligently to manifest love. For first He perfected it in Himself, and then He taught those who heard Him. And He reconciled our enmity with His Father because He loved us, and He yielded up His innocence in the stead of the debtors, and the Good in place of the evil ones was put to shame, and the Rich in our behalf was made poor, and the Living died in behalf of the dead, and by His death made alive our death. And the Son of the Lord of all took for our sake the form of a servant, and He to whom all things were subject subjected Himself that He might release us from the subjection of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 19"
