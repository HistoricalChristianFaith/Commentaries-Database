[[commentary]]
quote='''
He chose and instructed excellent leaders, and committed the sheep into their hands, and gave them authority over all his flock. For He said to Simon Cephas:—Feed My sheep and My lambs and My ewes. So Simon fed His sheep; and he fulfilled his time and handed over the flock to you, and departed. Do ye also feed and guide them well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 10 (Of Pastors), Section 4"
