[[commentary]]
quote='''
Furthermore I questioned him about another saying that is written in Ezekiel; namely, that he said to Jerusalem:—Sodom and her daughters shall be built up as of old, and thou and thy daughters shall become as of old. So he explained this saying to me, and began to make a defence, and said to me “As to this that God said to Jerusalem by the Prophet, Sodom and her daughters shall be built up as of old, and thou and thy daughters shall become as of old; this is the force of the passage, that Sodom and her daughters shall be in their place as of old, and shall be made subject to Israel; and Jerusalem and her daughters shall be in the splendour of royalty as of old.” When I heard this defence from him, it was very contemptible in my eyes, and I said to him:—“Inasmuch as the words of the Prophet were said in wrath, is the whole passage wrathful, or is part of it wrathful and part of it gracious?” He answered:—“A wrathful passage is altogether wrath, and there is no peace in it.” And I said to him:—“Since thou hast instructed me that there is no peace in that wrathful passage, hear without contention and blaspheme not, and I will instruct thee about this saying. For from the top to the bottom the whole passage is said in wrath. For he said to Jerusalem:—As I live, saith the Lord God, Sodom and her daughters did not do at all as thou and they daughters have done. And he said to her (Jerusalem):—Be abashed and accept thy shame, that thou hast overcome thy sisters in thy sins, and they are justified rather than thou. Since he says that Sodom and her daughters were justified rather than Jerusalem and her daughters, and that Jerusalem overcame Sodom in her sins, it is right that when Israel shall be gathered together, its seat should be in Sodom and Gomorrha. For their vine is of the vine of Sodom, and of the planting of Gomorrha. Their grapes are bitter and their clusters gall unto them. And Isaiah also calls them rulers of Sodom, and people of Gomorrha. For if Israel is gathered together, in Sodom and Gomorrha ought they to dwell with the rulers of Sodom and with the people of Gomorrha; and on the vine of Sodom and planting of Gomorrha to eat bitter grapes and gather clusters of gall; and to eat the eggs of the basilisk and to clothe themselves with spiders’ webs, to be used with wild grapes of the vineyard, and to be turned into reprobate silver. And Sodom and her daughters, who were justified rather than Jerusalem, shall be built up as of old. And Jerusalem, that surpassed Sodom in her sins, shall continue in her sins, and shall remain in desolation until the accomplishment of the things determined for ever.

And Ezekiel said:—This is the iniquity of Sodom and of her daughters, that they did not take by the hand the poor and needy; and when I saw these things in them, I overthrew them. And consider and see that, from the time that Sodom was overthrown until Jerusalem was built, there were eight hundred and ninety-six years. From the time that Abraham was informed by God through the Angel that at this time next year I will return to thee, and Sarah thy wife shall have a son, from that time till Jacob entered Egypt was a hundred and ninety-one years: and the children of Jacob were in Egypt two hundred and twenty-five years. So all the years from the time that Isaac was conceived and Sodom overthrown were four hundred and sixteen years, and from the Exodus of Israel from Egypt till the great edifice of Jerusalem was built up by Solomon, and the temple was built, there were four hundred and eighty years. Therefore all the years from the conception of Isaac and the overthrow of Sodom till the great building of Jerusalem, were eight hundred and ninety-six years. And from the great building of Jerusalem until the destruction of Jerusalem there were four hundred and twenty-five years. The sum of all the years from the time of the overthrow of Sodom until Jerusalem was laid waste, was one thousand three hundred and twenty-one. These are all the years that Sodom and her daughters were laid waste before Jerusalem. And she that was more just than Jerusalem is not yet inhabited. Therefore the whole sum of the years from the overthrow of Sodom till the six hundred and fifty-fifth year of the Kingdom of Alexander, the son of Philip of Macedon, is two thousand two hundred and seventy-six years. And from the time that Jerusalem was laid waste by the Babylonians until the present time is nine hundred and fifty-five years. And Jerusalem has been inhabited, after the Babylonians laid it waste, during those seventy weeks about which Daniel testified. Then it was laid waste in its last destruction by the Romans, and it shall not be inhabited again for ever, for it abideth in desolation until the accomplishment of the things determined. So then, all the years of the former and latter desolation of Jerusalem have been four hundred and sixty-five years, and when thou dost deduct from them the seventy years of Babylon, they have been three hundred and ninety-five years.

All this argument have I written to thee, because the Jews pride themselves, (saying), “It has been covenanted to us, that we shall be gathered.” For if Sodom, whose iniquity was not so great as that of Jerusalem, is not as yet inhabited, and if we say thus, that it will not be restored for ever, how shall Jerusalem be restored, whose iniquity is greater than that of Sodom and her daughters? As for Sodom God has not had mercy on her for two thousand two hundred and seventy-six years; and shall we say that He will have mercy on Jerusalem? For up to the present there are but three hundred and ninety-five years from the day that she was laid waste, according to the calculation that has been written above. But as to this that he said, Sodom and her daughters shall be possessed as of old, and with regard to Jerusalem he said, Thou and thy daughters shall become as of old, this is the force of the passage; that they shall not be inhabited for ever; for the Lord also thus cursed the land against which He was wroth:—It shall not be sown, nor shall it produce, nor shall any herb spring up in it, but it shall be like Sodom and Gomorrha, against which the Lord was wroth and towards which He was not appeased. Therefore be sure, my hearer, that Sodom and her daughters shall not be inhabited for ever; but they shall be as of old, namely, as in that time when they were not as yet inhabited, and as in the time when the Lord was wroth with them and was not appeased towards them. And Jerusalem and her daughters shall be as of old, (that is) as in the former time when the mountain of the Amorites lay in desolation, whereon Abraham built the altar, when he bound upon it Isaac his son; and as it was desolate when David bought the threshing-floor from Araunah the Jebusite, and built there the altar. For consider and see that this mountain whereon Abraham offered his son is the mountain of Jebus, which is Jerusalem. And this place of the threshing-floor that David bought of Araunah is that whereon the Temple was built. Thus Jerusalem shall be in desolation as of old. And consider that when Ezekiel prophesied this passage, Jerusalem still was sitting in her greatness, and those who were in her were rebelling against the King of Babylon. And that which the Prophet spoke, he said in wrath and reproach against Jerusalem.
'''
