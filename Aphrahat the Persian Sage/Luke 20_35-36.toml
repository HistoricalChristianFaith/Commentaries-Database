[[commentary]]
quote='''
They shall not marry wives there, nor shall they beget children; nor shall there the male be distinguished from the female; but all shall be sons of their Father Who is in heaven; as the Prophet said:—Is there not one Father of us all; is there not one God Who created us?

And as regards that which I said; that there they shall not take wives, nor is male distinguished from female, our Lord and His Apostles have taught us. For our Lord said:—They that are worthy of that world, and of that resurrection from the abode of the dead, shall not take wives, nor shall (women) become wives to men; for they cannot die; but they are as the angels in heaven, and are the children of God. And the apostle said:—There is neither male nor female, neither bond nor free; but ye are all one in Jesus Christ. For, as for Eve, to spread abroad generation, God took her out from Adam, that she might become the mother of all living; but yet in that world there is no female; even as in heaven also there is no female, nor generation, nor use of concupiscence. In that place there is no deficiency, but fulness and perfection. The aged shall not die and the young shall not grow old. And it is in expectation of growing old and dying that young men take wives and beget children, that when the fathers shall have died the children may rise up in their stead. Now all these things have their use only in this world, for in that place there is no want, nor any deficiency, nor concupiscence, nor generation, nor ending, nor failure, nor death, nor termination, nor old age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Sections 12-13"
