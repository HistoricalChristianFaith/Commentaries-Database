[[commentary]]
quote='''
Know moreover, beloved, that there is no law for God. For sometimes He increases and diminishes, and sometimes He adds to because it is little. For in the days of Noah on account of the sins of men He promised that the days of men should be one hundred and twenty years, and in the six hundredth year of the years of the life of Noah He destroyed them. For He said: "A hundred and twenty years they shall be upon the earth." And in the six hundredth year of the years of the life of Noah they were destroyed, and he took away these twenty years. And again it is written that when iniquity increased the sins of the house of Ephraim, when Jeroboam ruled over them, the son of Nebat, that he sinned and caused Israel to sin, and when they sinned He promised in their behalf by the prophecy of Isaiah the prophet, who said to them that after sixty-five years He will cut off Ephraim from the people. This word was in the first year of Ahaz, and in the fourth year of Hezekiah Shalmanasar, King of Assyria ('Ôtûr), came up against them, and after him Taglathphalasar, and he carried them into exile from their land. For Ahaz reigned over them sixteen years, and in the fourth year of Hezekiah the kings of Assyria ruled over them; so there were only twenty years and He cut off Ephraim from the people of Israel, and He took away from them forty-five years, and this time which at first He had appointed He did not complete according to that which He had decreed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 9"
