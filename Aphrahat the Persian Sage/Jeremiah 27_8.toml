[[commentary]]
quote='''
The great and honourable name of Godhead He withheld not from His righteous ones; even as, though He is the great King, without grudging He applied the great and honourable name of Kingship to men who are His creatures.

For by the mouth of His prophet God called the heathen King Nebuchadnezzar, King of Kings. For Jeremiah said:—Every people and kingdom that shall not put his neck into the yoke of Nebuchadnezzar, King of Kings, My servant, with famine and with sword and with pestilence will I visit that people. Though He is the great King, He grudges not the name of Kingship to men. And (so), though He is the great God, yet He grudged not the name of Godhead to the sons of flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 17 (Of Christ the Son of God), Sections 5-6"
