[[commentary]]
quote='''
And again the Prophet Zechariah also prophesied about that stone which is Christ. For he said:—I saw a chief stone of equality and of love. And why did he say “chief”? Surely because from the beginning He was with His Father. And again that he spoke of love, it was because when He came into the world, He said thus to His disciples:—This is My commandment, that ye love one another. And again He said:—I have called you My friends (lovers). And the blessed Apostle said thus:—God loved as in the love of His Son. Of a truth Christ loved us and gave Himself for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 8"
