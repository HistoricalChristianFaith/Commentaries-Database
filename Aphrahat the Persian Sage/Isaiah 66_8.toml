[[commentary]]
quote='''
But for God this was no great thing, that the dead should be quickened. Before seed was sown in the earth, the earth produced that which had not been cast into it. Before it had conceived, it bore in its virginity. How then is this difficult, that the earth should cause to spring up again what had been cast into it, and after conception should bear? And lo! her travail-pains are near; as Isaiah said, Who hath seen anything like this and who hath heard such things as these? that the earth should travail in one day, and a people should be born in one hour? For Adam unsown sprang up; unconceived he was born. But lo! now his offspring are sown, and wait for the rain, and shall spring up. And lo! the earth teems with many, and the time of her bringing forth is at hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 6"
