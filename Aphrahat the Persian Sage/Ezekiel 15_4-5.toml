[[commentary]]
quote='''
For the heavenly Watchers departed from the fence of the vineyard; and the mighty tower on which they relied was torn down. The winepress, the cleansing away of their offences, was overthrown. When the vine was without blemish, it did not prove of service. Now that the fire has devoured it and that it is laid waste, how shall it prove of service? The fire has devoured its two branches and its inward parts are wasted. For its two branches are the two kingdoms, and its inward part which is laid waste is Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 22"
