[[commentary]]
quote='''
It was not as though it were unknown that He had promised in their behalf that things should be thus, and then the years were diminished and also were increased, but as known; for He knew the measure of that which was to come, and on account of His mercies He gave a time for repentance that men might be without excuse; and men despised the longsuffering of God, and when they heard that there was much time until the wrath which was promised should come, becoming bold they sinned before Him and said: "That which the prophets say is prophesied for a remote time." On account of this when there arose a disputing concerning these things in the days of Ezekiel the prophet and they said: "That which hath been prophesied is for a remote time," He said to Ezekiel: "As I live," saith the Lord of dominions, "there shall not again be a delay to My words, for the word which I shall speak I shall shortly accomplish." And He cut off that which He had foretold, to give to men a time for repentance, that perhaps they might repent; but they despised the longsuffering of God and did not repent, and He also changed the time which He had appointed and decreed to them. And it was not done as if it were not known, but as it is written: "Woe to him that destroyeth! Ye were not destroyed; and who hath spoken falsely, and He did not speak falsely against you. For when ye have wished to destroy ye have been destroyed, and when ye have wished to speak falsely it hath been spoken falsely against you." Again it is written in Jeremiah: "If I shall speak against a people and against a kingdom, to pluck up and to break down and to destroy them and to cause them to perish, and that nation shall turn from its wickedness, I also will make false My word, and I will turn away from them everything which I have spoken against them." Again Jeremiah said: "If I shall speak concerning a people and concerning a kingdom to build and to plant, and that people shall do iniquity before Me, I also will make false My word, and I will turn from it the good thing which I have spoken to benefit it."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 10"
