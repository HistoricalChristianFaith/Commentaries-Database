[[commentary]]
quote='''
And Jerusalem and her daughters shall be as of old, (that is) as in the former time when the mountain of the Amorites lay in desolation, whereon Abraham built the altar, when he bound upon it Isaac his son; and as it was desolate when David bought the threshing-floor from Araunah the Jebusite, and built there the altar. For consider and see that this mountain whereon Abraham offered his son is the mountain of Jebus, which is Jerusalem. And this place of the threshing-floor that David bought of Araunah is that whereon the Temple was built. Thus Jerusalem shall be in desolation as of old.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 5"
