[[commentary]]
quote='''
For there are two Cherubs, one anointed and overshadowing, and one overshadowing but not anointed. For He said above:—Thou wast with the Cherub anointed and overshadowing. And lower down He said:—I will destroy thee the overshadowing Cherub; and did not say “anointed.” For Nebuchadnezzar was not anointed; but David and Solomon were, and the other kings who arose after them. And how was Nebuchadnezzar called overshadowing? Clearly on account of the vision of the tree, when he saw a tree in the midst of the earth, beneath which dwelt all the beasts of the wilderness and on its branches dwelt all the birds of heaven, and from it all flesh was fed. When Daniel interpreted his dream to him, Daniel said to him:—Thou art the tree, that tree which thou sawest in the midst of the earth and beneath thee dwell all the nations. On this account he was the overshadowing Cherub; who destroyed the Prince of Tyre, because he rejoiced over the children of Israel, for that they were carried away captive from their land, and because his heart was exalted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 9"
