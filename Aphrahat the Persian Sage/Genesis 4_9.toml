[[commentary]]
quote='''
Be ye not foolish as Adam who was ashamed to confess his sin. And also be ye not likened to Cain who, when he was accused of killing his brother, said: "I do not know where Abel is, for I am not his keeper" (Gen. 4: 9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 16"
