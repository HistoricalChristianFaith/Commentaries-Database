[[commentary]]
quote='''
And concerning the suffering of Christ, David said:—They pierced my hands and my feet, and all my bones cried out. They gazed and looked upon me, and divided my garments amongst them, and upon my vesture did they cast the lot. And Isaiah said:—Lo! My servant shall be known and shall be revealed and shall be lifted up, so that many shall be astonished at Him. As for this man, His visage shall be marred more than that of man, and His aspect more than that of the sons of men. And he said:—He will purify many nations, and kings shall be amazed at Him. And he said in that passage:—He came up as a little child before Him, and as a root from the dry ground. And in the end of the passage he said:—He shall be slain for our sins; He shall be humiliated for our iniquity; the chastisement of our peace is upon Him, and by His bruises shall we be healed. By what wounds were men healed? David was not slain; for he died in a good old age, and was buried in Bethlehem. And if they should say that it is spoken of Saul, for Saul was killed in the mountains of Gilboa in the battle with the Philistines, and if they should say that they pierced his hands and his feet, when they fastened up his body on the wall of Bethshan; yet it does not fitly apply to Saul. When the limbs of Saul were pierced, his bones were not conscious of suffering, because he was dead. It was after Saul died, that they hanged his body and those of his sons on the wall of Bethshan. But when David said, They pierced my hands and my feet, and all my bones cried out, he said in the next verse:—O God, abide for my help, and deliver my soul from the sword. Now Christ was delivered from the sword, and ascended from out of Sheol, and revived and rose the third day, and so God abode for His help. But Saul called upon the Lord and He did not answer him; and he asked through the Prophets, but no answer was given to him. And he disguised himself and inquired by soothsayers, and learned from thence. He was worsted before the Philistines, and he slew himself with his own sword, when he saw that the battle had overcome him. Moreover in this passage David said:—I will declare Thy name unto my brethren, and in the midst of the congregation will I glorify Thee. How can these things apply to Saul? And again David said:—Thou didst not give Thy holy one to see corruption. But all these things fitly apply to Christ. When He came to them, they did not receive Him; but wickedly judged Him by false witness. And He was hung upon the tree by His hands, and they pierced His hands and His feet with the nails which they fastened in him; and all His bones cried out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 17 (Of Christ the Son of God), Section 10"
