[[commentary]]
quote='''
Again when our Lord taught a prayer to His disciples, He said to them: "Thus shall ye pray, Forgive us our debts, and also we shall forgive our debtors." And again He said: "When thou desirest to offer an oblation, and thou rememberest that thou hast anger against thy brother, go away and be reconciled with thy brother, and then come (and) offer thy oblation." Lest when a man prayeth: "Forgive us our debts, and also we will forgive our debtors," he should be ensnared out of his own mouth, and it should be said to him by Him who receiveth prayers, thou thyself has not forgiven thy debtor, how shall it be forgiven to thee? And thy prayer shall remain upon the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 15"
