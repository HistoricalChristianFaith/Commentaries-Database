[[commentary]]
quote='''
And if he shall ask about the matters that are too hard for him of wise and discerning men who inquire into doctrine, then, when ten wise men shall speak to him in ten different ways about one matter, let him accept that which pleases him; and if any please not him, let him not scorn the sages; for the word of God is like a pearl, that has a beautiful appearance on whatever side you turn it. And remember, O disciple, what David said, From all my teachers have I learned. And the Apostle said:—Thou readest every Scripture that is in the Spirit of God. And prove everything; hold fast that which is good; and flee from every evil thing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 26"
