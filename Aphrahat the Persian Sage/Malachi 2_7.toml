[[commentary]]
quote='''
And as to what the apostles say, that We shall judge angels, hear, and I will instruct thee. The angels who shall be judged by the apostles are the priests who have violated the law; as the Prophet said, The lips of the priest shall guard knowledge, and the law shall they inquire of his mouth; because he is the angel of the Lord, the most mighty. The angels who are the priests, of whose mouth the law is inquired, when they transgress the law, shall be judged at the last by the apostles, and the priests who observe the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 16"
