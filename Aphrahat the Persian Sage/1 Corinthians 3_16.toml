[[commentary]]
quote='''
And if perchance thou shouldest say:—If Christ is set for the foundation, how does Christ also dwell in the building when it is completed? For both these things did the blessed Apostle say. For he said:—I as a wise architect have laid the foundation. And there he defined the foundation and made it clear, for he said as follows:—No man can lay other foundation than that which is laid, which is Jesus Christ. And that Christ furthermore dwells in that building is the word that was written above—that of Jeremiah who called men temples and said of God that He dwelt in them. And the Apostle said:—The Spirit of Christ dwelleth in you. And our Lord said:—I and My Father are one. And therefore that word is accomplished, that Christ dwells in men, namely, in those who believe on Him, and He is the foundation on which is reared up the whole building.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 5"
