[[commentary]]
quote='''
And this again is the word on which our Saviour says the law and the prophets depend, beautiful and good and seemly. For our Lord spake thus: "A single letter yudh shall not pass from the law or the prophets until all is done." For He took the law and the prophets and made them depend upon two commandments, and did not abolish anything from them. And when thou shalt look well at this word, so it truly is. The observation of that which is in the law and of everything which is written in it is an example of that word, "Thou shalt love the Lord thy God with all thy soul, and with all thy might, and with all thy heart"; and of everything which was done by the law, for it lead them to love the Lord their God; and a man shall love his neighbor as his own flesh. And these two commandments above are from the whole law. And when thou shalt set thy heart and look intently unto the law, in the beginning of all the law (thou shalt find) it is written thus: "I am the Lord thy God, who brought thee up from the land of Egypt. Thou shalt not make to thyself, My people, any image or any similitude." And the man who does not make another god has under him the word on which hangs the law and the prophets. Remember, beloved, that I have written for thee that the law is not imposed for the righteous, for he who observes righteousness is above the commandments and the law and the prophets; and the word which our Lord speaks is true: "The letter yudh shall not pass from the law and from the prophets," for by the two commandments He seals (them) and makes them depend.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 7"

[[commentary]]
quote='''
Now, beloved, all these things have I written to thee because in what was said before, that is in the former discourse concerning faith, I have shown thee that in faith may be placed the foundation of this covenant in which we are established; and in this second discourse which I have written to thee I have reminded thee that all the law and the prophets depend upon two commandments, those which our Saviour spoke, and in these two commandments are included all the law and the prophets. And in the law faith is included, and by faith true love is established, which is from those two commandments, that after a man loves the Lord his God he shall cherish his neighbor as himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 11"
