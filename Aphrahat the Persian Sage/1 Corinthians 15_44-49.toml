[[commentary]]
quote='''
But I will explain to thee, my beloved, concerning that word which the Apostle said, by which can be weighed the doctrines that are instruments of the Evil One and doctrines of deceit. For the Apostle said:—There is an animal body and there is a spiritual body, seeing that it is thus written:—The first Adam became a living soul and the second Adam a quickening spirit. So they say that there will be two Adams. But he said:—As we have put on the image of that Adam who was from the earth, so we shall put on the image of that Adam who is from heaven. For Adam who was from the earth was he that sinned, and the Adam who is from heaven is our Saviour, our Lord Jesus Christ. They then that receive the Spirit of Christ, come into the likeness of the heavenly Adam, Who is our Saviour, our Lord Jesus Christ. For the animal shall be swallowed up in the spiritual, as I wrote unto thee above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 18"
