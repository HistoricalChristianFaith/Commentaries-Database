[[commentary]]
quote='''
Daniel also was persecuted as Jesus was persecuted. Daniel was persecuted by the Chaldeans, the congregation of heathen men; Jesus also the Jews, the congregation of wicked men, persecuted. Daniel the Chaldeans accused; and Jesus the Jews accused before the governor. Daniel they cast into the pit of lions, and he was delivered and came up out of its midst uninjured; and Jesus they sent down into the pit of the abode of the dead, and He ascended, and death had not dominion over him. Concerning Daniel they expected that when he had fallen into the pit he would not come up again; and concerning Jesus they said, Since He has fallen, He shall not rise again. From (harming) Daniel the mouth of the ravenous and destructive lions was closed; and from (harming) Jesus was closed the mouth of death, (though) ravenous and destructive of (living) forms. They sealed the pit of Daniel, and guarded it with diligence; and the grave of Jesus did they guard with diligence, as they said, Set guards to watch al the tomb. When Daniel came up, his accusers were ashamed; and when Jesus rose, all they who had crucified Him were ashamed. The King who judged Daniel was greatly grieved at the wickedness of his accusers the Chaldeans; and Pilate who judged Jesus was greatly grieved because he knew that for malice the Jews were accusing Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 18"
