[[commentary]]
quote='''
Hear now, beloved, the persuasiveness of this word. If a man should say: "Why was this word written, that the seat of the children of Israel should remain in the land of Egypt four hundred and thirty years, when in the promise which had been made to Abraham it was said to him that there should be four hundred years? And thirty were received in addition?" Now I will show thee, beloved, even as it was. For when the time of fulfillment of the four hundred years was come, Moses was sent that he might deliver them. "When he killed the Egyptian, and they rejected him as their saviour, and Moses fled to Midian, wrath was upon them so that they remained thirty years in Egypt. For they said to Moses: "Who has appointed thee ruler and judge over us?" And when they rejected their salvation the wrath of God withheld them for thirty years in the midst of Egypt, and Moses was thirty years in Midian. Then, when affliction increased upon them, He lead them out of Egypt. God manifested this patience of His spirit; first He chastised them because they had rejected Moses, and secondly because they had completed the sins of the Amorites. He exceeded that which had been promised to Abraham and added thirty years to the people, and He had patience with the Amorites seventy years, thirty in Egypt and forty in the desert. And when the four hundred and thirty was completed, and the forty years for the consummation of the iniquities of the Amorites, He brought them into the land of promise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 8"
