[[commentary]]
quote='''
Moses also was persecuted, as Jesus was persecuted. When Moses was born, they concealed him that he might not be slain by his persecutors. When Jesus was born they carried Him off in flight into Egypt that Herod, His persecutor, might not slay Him. In the days when Moses was born, children used to be drowned in the river; and at the birth of Jesus the children of Bethlehem and in its borders were slain. To Moses God said:—“The men are dead who were seeking thy life;” and to Joseph the angel said in Egypt:—Arise, take up the child, and go into the land of Israel, for they are dead who were seeking the life of the child to take it away. Moses brought out his people from the service of Pharaoh; and Jesus delivered all nations from the service of Satan. Moses grew up in Pharaoh’s house; and Jesus grew up in Egypt when Joseph brought Him there in flight. Miriam stood on the edge of the river when Moses was floating in the water; and Mary bare Jesus, after the Angel Gabriel had made the annunciation to her. When Moses sacrificed the lamb, the firstborn of Egypt were slain; and when they crucified Jesus the true Lamb, the people who slew Him perished through His slaying. Moses brought down manna for his people; and Jesus gave His Body to the nations. Moses sweetened the bitter waters by the wood; and Jesus sweetened our bitterness by His cross, by the wood of the tree of His crucifixion. Moses brought down the Law to his people; and Jesus gave His covenants to the nations. Moses conquered Amalek by the spreading out of his hands; and Jesus conquered Satan by the sign of His cross. Moses brought out water from the rock for his people; and Jesus sent Simon Cephas (the rock) to carry His doctrine among the nations. Moses lifted up the veil from his face and spake with God; and Jesus lifted up the veil from the face of the nations, that they might hear and receive His doctrine. Moses laid his hand upon his messengers (apostles), and they received priesthood; and Jesus laid His hand upon His apostles, and they received the Holy Spirit. Moses ascended the mountain and died there; and Jesus ascended into heaven and took his seat at the right hand of His Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 10"
