[[commentary]]
quote='''
And remember, my beloved, what I wrote to thee, in the first discourse, about faith, that whoever has freely received ought to give freely as he has received, as our Lord said:—Freely ye have received, freely give. For whosoever keeps back part of anything he has received, even that which he has obtained shall be taken away from him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 10 (Of Pastors), Section 8"
