[[commentary]]
quote='''
Joseph was persecuted, and his brothers were persecutors; Joseph was exalted and his persecutors bowed down before him, and so his dreams and his visions were fulfilled. Joseph who was persecuted was a type of the persecuted Jesus. His father clothed Joseph in a tunic of divers colours; and His Father clothed Jesus with a body (taken) from the Virgin. His father loved Joseph more than his brethren, and Jesus is the dear and beloved one of His Father. Joseph saw visions and dreamed dreams; Jesus fulfilled the visions and the Prophets. Joseph was a shepherd with his brethren; and Jesus is the Chief of Shepherds. When his father sent Joseph to visit his brethren, they saw him coming and plotted to kill him; and when His Father sent Jesus to visit His brethren, they said:—This is the heir; come, let us kill him. His brethren cast Joseph into the pit; and His brethren brought down Jesus into the abode of the dead. Joseph ascended from the pit and Jesus arose from the abode of the dead. Joseph, after he arose from the pit, had authority over his brethren; and after Jesus arose from the abode of the dead, His Father gave Him a great and excellent name, that His brethren should serve Him, and His enemies be put beneath His feet. After that Joseph was made known to his brethren, they were abashed and feared and were amazed at his greatness; and when Jesus shall come at the last time, when He shall be revealed in His Majesty, His brethren will be abashed and fear and be dismayed before Him, because they crucified Him. Moreover, Joseph, by the counsel of Judah, was sold into Egypt; and Jesus, by the hands of Judas Iscariot, was delivered over to the Jews. When they sold Joseph, he answered nothing to his brethren; Jesus also spake not and gave no answer to the judges who judged Him. His master wrongfully delivered over Joseph to the prison; and His countrymen wrongfully condemned Jesus. Joseph delivered over his two garments, one into the hand of his brethren, and the other into the hand of his master’s wife; and Jesus delivered over His garments and divided them between the soldiers. Joseph, when thirty years old, stood before Pharaoh and became lord of Egypt; and Jesus, when about thirty years old, came to the Jordan to be baptized, and received the spirit, and went forth to preach. Joseph nourished Egypt with bread; and Jesus nourished the whole world with the bread of life. Joseph took to wife the daughter of the wicked and unclean priest; and Jesus espoused to Himself the Church (taken) from the unclean Gentiles. Joseph died and was buried in Egypt; and Jesus died and was buried in Jerusalem. Joseph’s bones his brethren brought up from Egypt; and Jesus His Father raised from the abode of the dead, and took up His Body with Him to heaven uncorrupted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 9"
