[[commentary]]
quote='''
But those pastors who did not care for the sheep, those were hirelings who used to feed themselves alone. On this account the Prophet addresses them, saying to them:—O ye pastors who destroy and scatter the sheep of my pasture, hear the word of the Lord. Thus saith the Lord: Lo! I will visit My sheep as the pastor visits his flock in the day of the whirlwind, and I will require My sheep at your hands. O foolish pastors, with the wool of the sheep do ye clothe yourselves and the flesh of the fatlings do eat, and the sheep ye do not feed. That which was sick ye did not heal, and that which was broken ye did not bind. The weak ye did not strengthen, and the lost and the scattered ye did not gather together. The strong ones and the fatlings ye did guard, but with harshness ye subdued them. The good pastures ye yourselves graze upon, and what remains ye trample with your feet. The pleasant waters do ye drink, and whatever remains ye defile with your feet. And My sheep have eaten the trampled (herbage) which your feet have trampled, and they have drunk the waters which your feet have defiled. These are the greedy and base pastors and hirelings, who did not feed the sheep, or guide them well, or deliver them from the wolves. But when the Great Pastor, the chief of pastors, shall come, He will call and visit His sheep and will take knowledge of His flock. And He will bring forward those pastors, and will exact an account from them, and will condemn them for their deeds. And those who fed the sheep well, them the Chief of Pastors will cause to rejoice and to inherit life and rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 10 (Of Pastors), Section 3"
