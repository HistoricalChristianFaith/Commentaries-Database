[[commentary]]
quote='''
And furthermore Isaiah also prophesied beforehand with regard to this stone. For he said:—Thus saith the Lord, Behold I lay in Zion a chosen stone in the precious corner, the heart of the wall of the foundation. And he said again there:—Every one that believeth on it shall not fear. And whosoever falleth on that stone shall be broken, and every one on whom it shall fall, it will crush. For the people of the house of Israel fell upon Him, and He became their destruction for ever. And again it shall fall on the image and crush it. And the Gentiles believed on it and do not fear.

And He shows thus with regard to that stone that it was laid as head of the wall and as foundation. But if that stone was laid as the foundation, how did it also become the head of the wall? How but that when our Lord came, He laid His faith in the earth like a foundation, and it rose above all the heavens like the head of the wall and all the building was finished with the stones, from the bottom to the top. And with regard to the faith about which I said that He laid His faith in the earth, this David proclaimed beforehand about Christ. For He said:—Faith shall spring up from the earth. And that again, it is above, he said:—Righteousness looked down from the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Sections 6-7"
