[[commentary]]
quote='''
Let us take pattern, my beloved, from our Saviour, Who though He was rich, made Himself poor; and though He was lofty, humbled His Majesty; and though His dwelling place was in heaven, He had no place to lay His head; and though He is to come upon the clouds, yet rode on a colt and so entered Jerusalem; and though He is God and Son of God, He took upon Him the likeness of a servant; and though He was (for others) rest from all weariness, yet was Himself tired with the weariness of the journey; though He was the fountain that quenches thirst, yet Himself thirsted and asked for water; though He was abundance and satisfied our hunger, yet He Himself hungered when He went forth to the wilderness to be tempted; though He was a Watcher that slumbers not, He yet slumbered and slept in the ship in the midst of the sea; and though He was ministered to in the Tabernacle of His Father, yet let Himself be served by the hands of men; though He was the healer of all sick men, yet nails were fastened into His hands; though His mouth brought forth things that were good, yet they gave Him gall to eat; though He injured no man and harmed none, yet He was beaten with stripes and endured shame; and though he was Saviour of all mortals, He delivered Himself to the death of the cross.

All this humility did our Saviour show us in Himself. Let us then also humble ourselves, my beloved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Sections 9-10"
