[[commentary]]
quote='''
Behold the grace and the love of our good Maker, that He did not grudge to men the name of Godhead and the name of worship, and the name of Kingship, and the name of authority; because He is the Father of the created things that are over the face of the world, and He has honoured and exalted and glorified men above all creatures. For with His holy hands He fashioned them; and of His Spirit He breathed into them, and a dwelling-place did He become unto them from of old. In them doth He abide and amongst them doth He walk. For He said through the prophet, I will dwell in them, and walk in them. Furthermore also the Prophet Jeremiah said:—Ye are the temple of the Lord, if ye make fair your ways and your deeds. And of old David said:—Thou, Lord, hast been a dwelling-place unto us for generations; before the mountains were conceived and before the earth travailed, and before the world was framed; from age to age Thou art God.

How dost thou understand this? For one prophet says:—Lord, Thou hast been our dwelling-place. And another said:—I will dwell in them and walk in them. First, He became to us a dwelling-place, and afterwards He dwelt and walked in us. For the wise both things are true and simple. For David says:—Thou, Lord, hast been our dwelling-place for generations, before the mountains were conceived and before the earth travailed, and before the world was framed. And thou knowest, my beloved, that all created things that are above and that are beneath were created first, and after them all, man. For when God determined to create the world with all its goodly things, first He conceived and fashioned man in His mind; and after that Adam was conceived in His thought, then He conceived the created things; as he said:—Before the mountains were conceived and the earth travailed; because man is older and more ancient in conception than the creatures, but in birth the creatures are older and more ancient than Adam. Adam was conceived and dwelt in the thought of God; and while in conception he (man) was held in His (God’s) mind, He (God) by the word of His mouth created all the creatures. And when He had finished and adorned the world, when nothing was lacking in it, then He brought forth Adam from His thoughts, and fashioned man by His hands; and Adam saw the world completed. And He (God) gave him authority over all that He had made, just as a man who has a son and desires to make for him a marriage feast, betroths to him a wife and builds for him a house, and prepares and adorns all that is needed for his son; then he makes the marriage feast and gives his son authority over his house. So after the conception of Adam, He brought him forth and gave him authority over all his creation. Concerning this the Prophet said:—Thou, Lord, hast been our habitation for generations, before the mountains were conceived, and before the earth travailed and before the world was framed. From age unto age Thou art the Lord. That no one should suppose that there is another God, either before or afterwards, he said:—From age and unto age, just as Isaiah said:—I am the first and I am the last. And after that God brought forth Adam from within His thought, He fashioned him, and breathed into him of His Spirit, and gave him the knowledge of discernment, that he might discern good from evil, and might know that God made him. And inasmuch as man knew his Maker, God was formed and conceived within his thought, and he became a temple for God his Maker, as it is written, Ye are the temple of God. And (so) He Himself said:—I will dwell in them and walk in them. But as for the sons of Adam, who do not recognise their Maker, He is not formed within them, and does not dwell in them, and is not conceived in their thought; but they are accounted before Him as the beasts, and as the rest of the creatures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 17 (Of Christ the Son of God), Sections 6-7"
