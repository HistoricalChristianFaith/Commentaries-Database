[[commentary]]
quote='''
For when He, Whose is the Kingdom, shall come in His second coming, He will take to Himself whatever He has given. And He Himself will be King for ever and ever. And His Kingdom shall not pass away, because it is an eternal Kingdom.

For first, He gave the Kingdom to the sons of Jacob, and subdued to them the children of Esau; as Isaac said to Esau:—Thou shalt serve Jacob thy brother. And when again they did not prosper in the Kingdom, He took it away from the children of Jacob and gave it to the children of Esau until He should come Whose it is. And they will deliver up the deposit to its Giver, and will not deal fraudulently with it. And the Guardian of the Kingdom is subject to Him to Whom all things are subject. Therefore this Kingdom of the children of Esau shall not be delivered up into the hand of the hosts that are gathered together, that desire to go up against it; because the Kingdom is being kept safe for its Giver, and He Himself will preserve it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Sections 23-24"

[[commentary]]
quote='''
And if thou shouldest say that Christ has not yet come, I will grant this also to thy contentiousness. For it is written that when He shall come, the Gentiles shall expect Him. Lo! I, one of the Gentiles, have heard that Christ is to come. And when as yet He had not come, I beforehand have believed on Him; and through Him I worship the God of Israel. When He comes, will He then blame me because before His coming I beforehand believed on Him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 17 (Of Christ the Son of God), Section 10"
