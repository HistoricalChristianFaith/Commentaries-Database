[[commentary]]
quote='''
Now Nebuchadnezzar said:—I will ascend to heaven and exalt my throne above the stars of God and sit in the lofty mountains that are in the borders of the North. Isaiah said concerning him:—Because thy heart has thus exalted thee, therefore thou shalt be brought down to Sheol, and all that look upon thee shall be astonished at thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 4"
