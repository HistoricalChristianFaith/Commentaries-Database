[[commentary]]
quote='''
Many servants were sent to them by the Lord of the vineyard. And they slew them and did not send the fruit to the Lord of the vineyard. After the servants the beloved Son was sent, to receive from them the fruit and to bring it back to Him that sent Him. And they seized Him and cast Him out of the vineyard; and they cut spikes from the thorns of the vineyard and fixed them in His hands. And He was hungry and asked food of them; and they took and gave Him gall from the fruit of the vineyard. He was thirsty and asked of them drink; and they gave Him vinegar and He would not drink it. And they platted a crown of thorns that had sprung up in the vineyard, and placed it on the head of the Son of the Lord of the vineyard. For from the time that the vineyard was made, it displayed these fruits. Therefore its Lord uprooted it and cast it in the fire; and planted good fruit-bearing vines in the vineyard, and such as gladden the husbandman. For Christ is the vineyard, and His Father is the husbandman; and they who drink of His cup are the vines. Therefore vineyard was formed instead of vineyard.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 22"
