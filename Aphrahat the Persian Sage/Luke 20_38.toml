[[commentary]]
quote='''
Again, our Lord explained to the Sadducees with regard to the resurrection of the dead, when they brought forth to Him the parable of the woman who was married to seven husbands, and said to Him:—Lo! the woman was wife of them all; in the Resurrection of the dead, to which of them shall she be wife? Then our Lord said to them:—Ye do greatly err, and ye know not the Scriptures nor the power of God. For they who are worthy of that world and of that Resurrection from the dead, they that are men do not take wives, nor are the women married to husbands, for they cannot die, for they are as the angels of God and children of the Resurrection. But concerning the Resurrection, that the dead shall rise, have ye not read in the Scripture that God said to Moses out of the bush, “I am the God of Abraham, of Isaac and of Jacob.” And lo! He is not God of the dead, for they all are alive unto Him.

And there are those who even while they live are dead unto God. For He laid a commandment on Adam and said to him, In the day that thou shalt eat of the tree, thou shalt surely die. And after he had transgressed the commandment, and had eaten, he lived nine hundred and thirty years; but he was accounted dead unto God because of his sins. But that it may be made certain for thee that a sinner is called dead even when he lives, I will make it clear to thee. For thus it is written in Ezekiel the Prophet, As I live, saith the Lord of lords, I desire not the death of the dead sinner.

Moreover our Lord said to that man who said to Him:—Let me go and bury my father, and I will come to Thee. And our Lord said to him, Let the dead bury their dead, but go thou, preach the Kingdom of God. But how is this word understood by thee, my beloved? Didst thou ever see the dead burying their dead? Or how shall a dead man arise to bury another dead man? But receive this explanation from me, that a sinner, while he is living, is dead unto God; and a righteous man, though dead, is alive unto God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Sections 16-18"
