[[commentary]]
quote='''
Thus also Joshua the son of Nun divided Jordan by his faith, and the children of Israel crossed over as in the days of Moses. But know, my beloved, that this passage of the Jordan was three times laid open by its being divided. First through Joshua the Son of Nun, and secondly through Elijah, and then through Elisha. For the word of the Book makes known that over against this passage of Jericho, there Elijah was taken up to heaven; for when Elisha turned back from following him and divided the Jordan and passed over, the children of the Prophets of Jericho came out to meet Elisha and said:—The spirit of Elijah rests upon Elisha. Furthermore when the people crossed over in the days of Joshua the son of Nun (it was there), for thus it is written:—The people passed over, over against Jericho.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 16"
