[[commentary]]
quote='''
And when the time of the final consummation shall have come, and the time of the Resurrection shall have approached, the Holy Spirit, that was kept in purity, receives great power from its nature and comes before Christ and stands at the door of the tombs, where the men are buried that kept it in purity, and awaits the (resurrection) shout. And when the Watchers shall have opened the doors of heaven before the King, then the cornet shall summon, and the trumpets shall sound, and the Spirit that waits for the (resurrection) shout shall hear, and quickly shall open the tombs, and raise up the bodies and whatsoever was buried in them, and shall put on the glory that comes with it. And (the Spirit) shall be within for the resurrection of the body, and the glory shall be without for the adornment of the body. And the animal spirit shall be swallowed up in the heavenly Spirit, and the whole man shall become spiritual, since his body is possessed by it (the Spirit). And death shall be swallowed up in life, and body shall be swallowed up in Spirit. And by the power of the Spirit, that man shall fly up to meet the King and He shall receive him with joy, and Christ shall give thanks for the body that has kept His Spirit in purity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 14"
