[[commentary]]
quote='''
Pastors are set over the flock, and give the sheep the food of life. Whosoever is watchful, and toils in behalf of his sheep, is careful for his flock, and is the disciple of our Good Shepherd, who gave Himself in behalf of His sheep. And whosoever brings not back his flock carefully, is likened to the hireling who has no care for the sheep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 10 (Of Pastors), Section 1"
