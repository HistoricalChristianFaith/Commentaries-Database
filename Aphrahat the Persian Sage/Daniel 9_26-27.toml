[[commentary]]
quote='''
But, thou fool, the prophets suffer thee not to say that Christ has not yet come; for Daniel confutes thee, saying:—After sixty-two weeks shall Messiah come and shall be slain. And in His coming shall the Holy City be laid waste, and her end shall be with a flood. And until the accomplishment of the things that are determined, shall she continue in desolation. Thou expectest and hopest that, at the coming of Christ, Israel shall be gathered together from all regions, and Jerusalem shall be built up and inhabited. But Daniel testifies that, when Christ comes and is slain, Jerusalem shall be destroyed, and shall continue in desolation until the accomplishment of the things which are determined, forever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 17 (Of Christ the Son of God), Section 10"

[[commentary]]
quote='''
And from the time that Jerusalem was laid waste by the Babylonians until the present time is nine hundred and fifty-five years. And Jerusalem has been inhabited, after the Babylonians laid it waste, during those seventy weeks about which Daniel testified. Then it was laid waste in its last destruction by the Romans, and it shall not be inhabited again for ever, for it abideth in desolation until the accomplishment of the things determined. So then, all the years of the former and latter desolation of Jerusalem have been four hundred and sixty-five years, and when thou dost deduct from them the seventy years of Babylon, they have been three hundred and ninety-five years.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 4"
