[[commentary]]
quote='''
For from the whole flock its Lord seeks the sheep which is lost, and finds it, and rejoices over it. And there is joy to the watchers of heaven when a sinner turns back from his iniquity. "For it is not the will of the Father who is in heaven that one of these little ones should perish" (S. Mt. 18: 14), who have sinned and who have sought repentance for themselves. "For the Lord came not that He might call the righteous but sinners to repentance."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 23"
