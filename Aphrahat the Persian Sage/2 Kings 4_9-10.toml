[[commentary]]
quote='''
Elisha also walked in the footsteps of his Master. He used to dwell in the upper chamber of the Shunamite, and was ministered to by his disciple. For thus the Shunamite said;—He is a holy Prophet of God and passes by us continually, for thus it becomes his holiness that we should make for him an upper chamber and do for him the service that is (necessary) in it. Now what was the service necessary in the upper chamber of Elisha? Clearly the bed and table and stool and lamp-stand only.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 5"
