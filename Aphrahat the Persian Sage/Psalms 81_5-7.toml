[[commentary]]
quote='''
Joseph, because of his faith, was tried in the waters of contention, and was delivered from his trial, and his Lord established a witness in him, as David said:—Witness hath he established in Joseph.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 14"
