[[commentary]]
quote='''
And as to this that I wrote to thee, beloved, that the Kingdom of the children of Esau is being kept safe for its Giver, doubt not about it, that that Kingdom will not be conquered. For a mighty champion Whose name is Jesus shall come with power, and bearing as His armour all the power of the Kingdom. And search out and see that also by the poll-tax He was enrolled amongst them. And as He was enrolled by the poll-tax amongst them, He will also succour them. And His standard abounds in that place, and they are clothed in His armour, and shall not be found wanting in war. And if thou shouldest say unto me:—“In the years of the Kings that preceded these, why did they conquer and subdue the beast?” It was because the chiefs and kings who stood up at that time in the Kingdom of the children of Esau did not wish to lead with them to the war the Man who was enrolled with them in the poll-tax. Therefore the beast was subdued a little, but was not slain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 24"
