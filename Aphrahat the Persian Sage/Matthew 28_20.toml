[[commentary]]
quote='''
And when He went to His Father, He sent to us His Spirit and said to us I am with you till the world shall end. For Christ sitteth at the right hand of His Father, and Christ dwelleth among men. He is sufficient above and beneath, by the wisdom of His Father. And He dwells in many, though He is one, and all the faithful each by each He overshadows from Himself, and fails not, as it is written:—I will divide Him among many. And though He is divided among many, yet He sits at the right hand of His Father. And He is in us and we are in Him, as He said:—Ye are in Me and I am in you. And in another place He said:—I and Father are one.

And if anyone, whose conscience lacks knowledge, should dispute about this and say:—“Since Christ is one and His Father is one, how does Christ dwell, and His Father dwell, in faithful men? And how do righteous men become temples for God that He should dwell in them? If then it is thus, that to each several faithful man there comes a several Christ, and God Who is in Christ,—if it is so, there are for them Gods many and Christs without number.” But hear, my beloved, the defence that is suited to this argument. From that which is visible let him that has thus said receive instruction. For every man knows that the sun is fixed in the heavens, yet its rays are spread out in the earth, and (light) from it enters by many doors and windows of houses; and wherever the sunshine falls, though it be but as (the measure of) the palm of the hand, it is called the sun. And though it fall in many places, it is thus called, but the real sun itself is in heaven. Therefore, if it is so, have they many suns? Also the water of the sea is vast, and when thou takest one cup from it, that is called water. And though thou shouldest divide it into a thousand vessels, yet it is called water by its name. Also when thou kindlest fire from fire in many places, the place from whence thou takest it, when thou kindlest it, lacks not, and the fire is called by one name. And because thou dividest it into many places, it does not on that account become possessed of many names. And when thou takest dust from the earth, and castest it into many places, it is not a whit diminished, and also thou canst not call it by many names. Thus also God and His Christ, though they are One, yet dwell in men who are many. And they are in heaven in person, and are diminished in nothing when they dwell in many; as the sun is not a whit diminished in heaven, when its power is poured out in the earth. How much greater then is the power of God, since by the power of God the very sun itself subsists.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Sections 10-11"
