[[commentary]]
quote='''
For when Antiochus arose in the kingdom, he humbled three kings, and he exalted himself against the saints of the Most High and against Jerusalem. And he defiled the sanctuary. And he caused the sacrifice and the offerings to cease for a week and half a week, namely, for ten and a-half years. And he brought in fornicators into the house of the Lord, and he caused the observances of the Law to cease. And he slew righteous men and gave them to the birds of heaven and to the beasts of the earth. For in his days was fulfilled the word that David spoke:—O God, the Gentiles have come into thine inheritance, and have defiled Thy holy temple. They have made Jerusalem desolate. They have given the dead bodies of Thy servants as food to the birds of heaven, and the flesh of Thy righteous ones to the beasts of the earth. They have poured out their blood like water round about Jerusalem, and there is none to bury them. For this was accomplished at that time, when the venerable and aged Eleazar was slain, and the sons of the blessed Samuna, seven in number, and when Judas (Maccabeus) and his brethren were struggling on behalf of their people, when they were dwelling in hiding-places.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 20"
