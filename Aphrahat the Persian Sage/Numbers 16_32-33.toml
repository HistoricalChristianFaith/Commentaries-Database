[[commentary]]
quote='''
My beloved, men who are inferior in understanding, dispute about this that I write to thee, and say:—“What is the place in which the righteous shall receive a good reward; and what is the place in which are torments, in which the wicked shall receive the punishments of their works?” O man that thinkest thus, I will ask thee, and tell thou me, why is death called death, and why is Sheol called Sheol? For it is written that when Korah and his companions made a schism against Moses, the earth opened her mouth and swallowed them up, and they went down alive into Sheol. Therefore that was the mouth of Sheol that was opened in the wilderness. David also said, The wicked shall turn back to Sheol. We say that to Sheol, in which Korah and his companions were swallowed up, thither shall the wicked be turned back.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 24"
