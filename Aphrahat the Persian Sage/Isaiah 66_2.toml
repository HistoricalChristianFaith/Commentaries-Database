[[commentary]]
quote='''
Thus also Satan, he has not the knowledge beforehand to know or see when the Spirit will depart, that so he may come to rob the man; but he too listens and watches, and so assails. But if he hears a man in whom Christ dwells speaking shameful words, or enraged, or quarrelling, or contending, then Satan knows that Christ is not with him, and he comes and accomplishes his will in him. For Christ dwells in the peaceful and the meek, and lodges in those that fear His word, as He says through the prophet:—On whom shall I look, and in whom shall I dwell, but in the peaceful and the meek who fear My word? And our Lord said:—Whoever walks in My commandments and keeps My love, We will come to him and make Our abode with him. But if he hears from a man that he is on his guard and is praying and meditating in the Law of his Lord by day and by night, then he turns back from him, for he knows that Christ is with him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 17"
