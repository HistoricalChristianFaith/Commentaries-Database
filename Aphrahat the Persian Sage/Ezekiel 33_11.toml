[[commentary]]
quote='''
And there are those who even while they live are dead unto God. For He laid a commandment on Adam and said to him, In the day that thou shalt eat of the tree, thou shalt surely die. And after he had transgressed the commandment, and had eaten, he lived nine hundred and thirty years; but he was accounted dead unto God because of his sins. But that it may be made certain for thee that a sinner is called dead even when he lives, I will make it clear to thee. For thus it is written in Ezekiel the Prophet, As I live, saith the Lord of lords, I desire not the death of the dead sinner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 17"
