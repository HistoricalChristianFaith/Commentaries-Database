[[commentary]]
quote='''
Furthermore, the adversary tempted Job through his children and his possessions, and when he could not prevail over him, he went and brought against him his armour, and he came, bringing with him a daughter of Eve, who had caused Adam to sink, and through her mouth he said to Job, her righteous husband:—Curse God. But Job rejected her counsel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 3"
