[[commentary]]
quote='''
For thus He warned and said: "If thy brother shall sin against thee, forgive him; and even if he shall sin against thee seven times in one day, forgive him."

And when Simon Peter (Kipho) heard this word he said to our Lord: "How many times, if my brother sin against me, shall I forgive him? Seven times?" Our Lord said to him: "Not only seven, but until seventy times seven (and) seven." Even if he shall sin against thee four hundred and ninety times, forgive him in one day" (this sentence has the particle indicating a quotation). And He is likened to His good Father who multiplied His forgiveness upon Jerusalem when He caused the children of Israel to go into captivity to Babylon, He scattered them seventy years, and when His mercies were revealed He brought them together to their land by means of Ezra the scribe, and He increased forgiveness unto them by the division of His day (which is) seventy weeks of years (cf. Ps. 90:4), four hundred and ninety years. And when they shed innocent blood He did not again exempt them on account of Jerusalem, but He delivered it over into the hands of its enemies, and they rooted it up, and they did not leave in it stone upon stone, and they did not leave its foundations for the Lord. And He did not say to the children of Edom that vengeance should be recompensed them because they did not cry out against Jerusalem, "reveal it, reveal it, even to its foundations." But God by the division of His day forgave four hundred and ninety years, and He bore their iniquities; and then He rooted it up, and also He delivered Jerusalem into the hands of strangers. So our Life-giver commanded them that in one day a man should forgive his brother four hundred and ninety times.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Sections 12-13"
