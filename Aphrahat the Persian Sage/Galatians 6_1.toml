[[commentary]]
quote='''
Hear again also ye who hold the keys of the gates of heaven and open the gates to the penitent, believe that which the blessed Apostle hath said: "If a man from among you shall be troubled by sin, ye who are in the spirit, restore ye him in a spirit of gentleness; and be ye cautious lest perhaps ye also be tempted" (Gal. 6: 1). For the Apostle was afraid and warned them, for he said concerning himself: "Lest I who have preached to others should myself become reprobate" (1 Cor. 9: 27). He who from among you is troubled by sin, do not hold him as an enemy, but be ye counsellors and admonishers to him as of a brother; for he whom ye have separated from among you has been swallowed up by Satan.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 11"
