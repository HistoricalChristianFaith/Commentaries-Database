[[commentary]]
quote='''
Again He took up a parable against them and reminded them of that which is written in the law, and He wished that the law might speak falsely for the sake of their repentance. For He said: "When a man takes a wife and she shall go forth from him and shall be unto another man, and if the other man who took her shall die or shall dismiss her, and she shall return unto her first husband, it will not be possible for her first husband to take her again after she has been polluted; and if he shall take her, behold that land will surely be polluted. And now also I have taken thee, Jerusalem, to Myself, and thou hast become Mine, and thou hast gone from Me, and thou hast departed, and thou hast committed fornication with stones and trees. Now return unto Me, and I will receive thee, and in thy repentance I will loose the law" (Jere. 3: 1 sqq., and Dt. 24: 13 sqq., both loosely).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 9"
