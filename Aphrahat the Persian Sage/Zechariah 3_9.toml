[[commentary]]
quote='''
And definitely did He show concerning this stone:—Lo! on this stone will I open seven eyes. And what then are the seven eyes that were opened on the stone? Clearly the Spirit of God that abode on Christ with seven operations, as Isaiah the Prophet said:—The Spirit of God shall rest and dwell upon Him, (a spirit) of wisdom and understanding, of counsel and of courage, of knowledge and of the fear of the Lord. These were the seven eyes that were opened upon the Stone, and these are the seven eyes of the Lord which look upon all the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 9"
