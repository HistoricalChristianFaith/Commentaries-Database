[[commentary]]
quote='''
Again I will remind thee, my beloved, also of that which is written. For thus it is written, that when it was a grievous burden to Moses to lead the camp alone, the Lord said to him:—Lo! will take away of the Spirit that is upon thee, and will put it upon seventy men, elders of Israel. But when He took away some of the Spirit of Moses, and the seventy men were filled with it, Moses nothing lacked, nor could it be known that anything was taken away from his Spirit. Moreover the blessed apostle also said:—God divided of the Spirit of Christ and sent it into the Prophets. And Christ was in nothing injured, for it was not by measure that His Father gave unto Him the Spirit. By this reflection thou canst comprehend that Christ dwells in faithful men; yet Christ suffers no loss though He is divided among many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 12"
