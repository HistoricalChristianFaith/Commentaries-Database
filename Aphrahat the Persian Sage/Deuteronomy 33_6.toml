[[commentary]]
quote='''
And also at the time that Jacob was dying, he blessed his tribes, and showed them what would happen to them in the latter days, and said to Reuben:—Reuben, thou art my firstborn, might and the beginning of my strength. Thou hast gone astray; as water, thou shalt not abide, because thou wentest up father’s bed. Truly thou defilest my couch and wentest up. From the time that Jacob fell asleep until the time that Moses fell asleep two hundred and thirty-three years elapsed. Then Moses wished by his priestly power to absolve Reuben from his transgression and sin, in that he had lain with Bilhah, his father’s concubine; that when his brethren should rise, he might not be cut off from their number. So he said in the beginning of his blessing:—Reuben shall live and not die, and shall be in the number.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 8"

[[commentary]]
quote='''
And why did he say:—From Adam unto Moses did Death rule? And who is so ill-furnished with knowledge as to imagine that only from Adam to Moses has death had dominion? Yet let him understand from this that he said:—Upon all men it passed. Thus, upon all men it passed from Moses until the world shall end. Yet Moses preached that its kingdom is made void. For when Adam transgressed the commandment whereby the sentence of death was passed upon his progeny, Death hoped that he would bind fast all the sons of man and would be king over them for ever. But when Moses came, he proclaimed the resurrection, and Death knew that his kingdom is to be made void. For Moses said:—Reuben shall live and not die, and shall be in number. And when the Holy One called Moses from the bush he said thus to him:—I am the God of Abraham, of Isaac, and of Jacob. When Death heard this utterance, he trembled and feared and was terrified and was perturbed, and knew that he had not become king for ever over the children of Adam. From the hour that he heard God saying to Moses:—I am the God of Abraham, of Isaac, and of Jacob, Death smote his hands together, for he learned that God is King of the dead and of the living, and that it is appointed to the children of Adam to come forth from his darkness, and arise with their bodies. And observe that our Redeemer Jesus also, when He repeated this utterance to the Sadducees, when they were disputing with Him about the Resurrection of the dead, thus said:—God is not (God) of the dead, for all are alive unto Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 2"
