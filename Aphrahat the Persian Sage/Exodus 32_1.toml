[[commentary]]
quote='''
Two goodly benefits did his Lord accomplish for Moses in not making known his tomb to the children of Israel. He rejoiced that his adversaries should not know it, and cast forth his bones from his tomb; and in the second place, that the children of his people should not know it, and make his tomb a place of worship, for he was accounted as God in the eyes of the children of his people. And understand this, my beloved, from hence, that when he left them and went up to the mountain, they said:—As for this Moses who brought us up from the land of Egypt we know not what has become of him. So they made them a calf and worshipped it, and they remembered not God Who brought them up from Egypt by means of Moses with a mighty hand and an uplifted arm. Because of this, God had respect unto Moses, and did not make known his tomb; lest, if He should make known his tomb, the children of his people might go astray, and make them an image, and worship it and sacrifice to it, and so by their sins disquiet the bones of the righteous man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 9"
