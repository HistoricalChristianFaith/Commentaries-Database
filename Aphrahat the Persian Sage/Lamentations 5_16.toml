[[commentary]]
quote='''
And again (God) said to him:—Thou wast with the Cherub who was anointed and overshadowing. For the king, who was anointed with the holy oil, was called a Cherub. And he was overshadowing all his people, as Jeremiah said:—The anointed of the Lord is the breath of our nostrils, he of whom we said that in his shadow shall we live amongst the Gentiles. For they were sitting in the shadow of the king, while he was standing at their head. And when the crown of their head fell, they were without shade. And if any one should say that this word is spoken concerning Christ, let him receive that which I write for him without disputation, and thus he will be persuaded that it was said with reference to the king. For Jeremiah said in behalf of the people:—Woe unto us, for the crown of our head has fallen! But Christ has not fallen, because He rose again the third day. For the king fell from the house of Judah, and never again was their kingdom set up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 9"
