[[commentary]]
quote='''
For from baptism do we receive the Spirit of Christ. For in that hour in which the priests invoke the Spirit, the heavens open and it descends and moves upon the waters. And those that are baptized are clothed in it; for the Spirit stays aloof from all that are born of the flesh, until they come to the new birth by water, and then they receive the Holy Spirit. For in the first birth they are born with an animal souls which is created within man and is not thereafter subject to death, as he said:—Adam became a living soul. But in the second birth, that through baptism, they received the Holy Spirit from a particle of the Godhead, and it is not again subject to death. For when men die, the animal spirit is buried with the body, and sense is taken away from it, but the heavenly spirit that they receive goes according to its nature to Christ. And both these the Apostle has made known, for he said:—The body is buried in animal wise, and rises again in spiritual wise. The Spirit goes back again to Christ according to its nature, for the Apostle said again:—When we shall depart from the body we shall be with our Lord. For the Spirit of Christ, which the spiritual receive, goes to our Lord. And the animal spirit is buried in its nature, and sense is taken away from it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 14"
