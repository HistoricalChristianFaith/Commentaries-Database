[[commentary]]
quote='''
Furthermore, David fed his father’s sheep, and was taken from the sheep to tend his people. So he tended them in the integrity of his heart and by the skill of his hands he guided them. And when David numbered the flock of his sheep, wrath came upon them, and they began to be destroyed. Then David delivered himself over on behalf of his sheep, when he prayed, saying:—O Lord God, I have sinned in that I have numbered Israel. Let Thy hand be on me and on my father’s house. These innocent sheep, in what have they sinned? So also all the diligent pastors used thus to give themselves on behalf of their sheep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 10 (Of Pastors), Section 2"
