[[commentary]]
quote='''
And if thou dost glory in thy wisdom, thou dost not in it excel the Prince of Tyre, whom Ezekiel reproached, saying unto him:—Art thou wiser than Daniel, or hast thou seen by thy wisdom the things that are hid? And if thy mind is puffed up by thy years, that they are many; they are not more in number than those of the Prince of Tyre who ruled the Kingdom during the days of twenty-two Kings of the house of Judah, that is, for four hundred and forty years. And since the years of that King of Tyre were many, all the time he thus said in his heart, I am God and sit in the seat of God in the heart of the seas. But Ezekiel said to him: Thou art a man and thou art not God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 7"
