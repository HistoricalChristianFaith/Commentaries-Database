[[commentary]]
quote='''
When He came to us, He had nothing of ours, and also we had nothing of His, though the two natures were His and His Father’s. For when Gabriel made announcement to the Blessed Mary who bore Him, the word from on high set out and came, and the word became flesh and dwelt in us. And when He returned to Him that sent Him, He took away, when He went, that which He had not brought, as the Apostle said:—He has taken us up and seated us with Himself in the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 10"
