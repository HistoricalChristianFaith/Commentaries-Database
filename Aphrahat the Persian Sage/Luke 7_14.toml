[[commentary]]
quote='''
And our Lord Himself, in that His first Coming raised up three that were dead, that the testimony of three might be made sure. And He raised up each one of them with two words each. For when He raised up the widow’s son, He called him twice, saying to him, Young man, young man, arise. And he revived and arose. And again, He twice called the daughter of the chief of the synagogue, saying to her, Damsel, damsel, arise. And her spirit returned and she arose. And after Lazarus died, when He came to the place of burial. He prayed earnestly and cried with a loud voice and said, Lazarus, come forth. And he revived and came out of his tomb.

And concerning all this that I have explained to thee, that those dead persons were raised with two words each, it was because for them two resurrections take place; that former one, and the second, that which is to come. For in that resurrection in which all men shall rise, none shall fall again; and by one word of God, sent forth through Christ, all the dead shall rise in the twinkling of an eye, speedily. For He Who brings it to pass is not feeble or insufficient.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Sections 14-15"
