[[commentary]]
quote='''
Mordecai also was persecuted as Jesus was persecuted. Mordecai was persecuted by the wicked Haman; and Jesus was persecuted by the rebellious People. Mordecai by his prayer delivered his people from the hands of Haman; and Jesus by His prayer delivered His people from the hands of Satan. Mordecai was delivered from the hands of his persecutor; and Jesus was rescued from the hands of His persecutors. Because Mordecai sat and clothed himself with sackcloth, he saved Esther and his people from the sword; and because Jesus clothed Himself with a body and was illuminated, He saved the Church and her children from death. Because of Mordecai, Esther was well pleasing to the king, and went in and sat instead of Vashti, who did not do his will; and because of Jesus, the Church is well pleasing to God, and has gone in to the king, instead of the congregation which did not His Will. Mordecai admonished Esther that she should fast with her maidens, that she and her people might be delivered from the hands of Haman; and Jesus admonished the Church and her children (to fast), that she and her children might be delivered from the wrath. Mordecai received the honour of Haman, his persecutor; and Jesus received great glory from His Father, instead of His persecutors who were of the foolish People. Mordecai trod upon the neck of Haman, his persecutor; and as for Jesus, His enemies shall be put under His feet. Before Mordecai, Haman proclaimed, Thus shall it be done to the man, in honouring whom the king is pleased; and as for Jesus, His preachers came out of the People that persecuted Him, and they said:—This is Jesus the San of God. The blood of Mordecai was required at the hand of Haman and his sons; and the blood of Jesus, His persecutors took upon themselves and upon their children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 20"
