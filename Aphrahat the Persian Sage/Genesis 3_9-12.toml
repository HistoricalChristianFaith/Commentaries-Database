[[commentary]]
quote='''
Also I remind you physicians of that which is written in the Scriptures of our wise Physician, that He does not forbid repentance. For when Adam had sinned He called him to repentance when He said to him: "Adam, where art thou?" (Gen. 3: 8). And he, hiding his sin from Him who beholds the heart, laid the blame upon Eve who had deceived him. And because he did not confess his sin death was decreed against him and against all his offspring.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 8"
