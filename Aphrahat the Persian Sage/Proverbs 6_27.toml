[[commentary]]
quote='''
O ye virgins who have betrothed yourselves to Christ, when one of the monks shall say to one of you, “I will live with thee and minister thou to me,” thus shalt thou say unto him:—“To a royal husband am I betrothed, and Him do I serve; and if I leave His service and serve thee, my betrothed will be wroth with me, and will write me a letter of divorce, and will send me away from His house; and while thou seekest to be honoured by me, and I to be honoured by thee, take heed lest hurt come upon me and thee. Take not fire into thy bosom, lest it burn thy garments; but be thou in honour alone, and I also alone will abide in my honour. And as concerning these things which the Bridegroom has prepared for the eternity of his marriage feast, do thou make thee a wedding-gift and prepare thyself to meet Him. And as for me, I will make me ready oil, that I may enter in with the wise virgins and may not be kept outside the door with the foolish virgins.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 7"
