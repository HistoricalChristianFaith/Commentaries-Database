[[commentary]]
quote='''
For that lamp shone and they did not by it seek the Lord their God. And its light shone in the darkness and the darkness did not comprehend it. And the lamp was set up on the lamp-stand and those who were in the house did not see its light. And what then means this, that the lamp was set up on the lamp-stand? Clearly His being raised up upon the cross. And by this all the house was made dark over them. For when they crucified Him, the light was darkened from them, and shone amongst the Gentiles, because that from the time of the sixth hour (of the day) on which they crucified Him even unto the ninth hour there was darkness in all the land of Israel. And the sun set in midday and the land was darkened in the shining daytime, as is written in Zechariah the Prophet:—It shall come to pass in that day, saith the Lord, I will cause the sun to set in midday, and will make dark the land in the shining daytime.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 11"
