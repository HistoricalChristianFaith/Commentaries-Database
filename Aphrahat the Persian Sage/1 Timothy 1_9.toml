[[commentary]]
quote='''
And when thou proceedest to the examination of these two commandments, upon the power of which depends all the law and the prophets, thou mayest perceive if these two commandments, on which depends all the power of the law and the prophets, are received in the hearts and in the minds of men, or if the law and the prophets which have been written, have not been sought, as it is written that "for the just the law is not appointed, but for the evil doers." On account of the wicked, therefore, the law has been appointed. And if righteousness had remained among men law would not have been needed. Again, if a law had not been appointed, the power of God would not have been known in all our generations, and in all the miracles which He showed. By the transgression of the commandment of the house of Adam death was decreed against the world, and the power of God manifested when all men arise at the end which removes the rule of death. On account of the sinners which were in the days of Noah the power of God was manifested in the waters of the flood. And Abraham, because he observed the righteousness which is in the law before the law was appointed, had manifested in him the power of God by means of righteousness, when he brought back the spoil of Sodom by the power of his God and did not put forth his hand upon the booty; and God said to him after that day: "Thy reward is multiplied by thy righteousness." And he upon whom the law had not been imposed manifested the works of the law, which the law of his righteousness did not require. Thus also in the case of Isaac and Jacob his sons, there was no necessity for them (to obey the law), because the law had not yet been imposed for their righteousness, for their father commanded them to act worthily and justly; as it is written that the Lord said concerning Abraham: "I know him, that he will command all his sons after him that they keep all My commandments." Also Joseph kept the righteousness which is in the law when he was not obedient to his mistress. For he said: "How shall I do this great wickedness and sin against God?" And Moses also, for he observed the righteousness which is in the law when he denied that he should be called a son to the daughter of Pharoah; on account of this the Lord made him worthy that through him He gave the law to His people. For all these manifested the works of the law, also for their righteousness the law had not been imposed and they were a law unto themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 2"
