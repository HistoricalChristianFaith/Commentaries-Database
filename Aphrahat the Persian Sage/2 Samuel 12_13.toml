[[commentary]]
quote='''
God forgives him who confesses his sins. For when David had sinned, Nathan the prophet came unto him and made known to him his sin and the punishment which he should receive. Then David confessed and said: "I have sinned." The prophet said to him: "The Lord also hath put away thy sin because thou last confessed" (2 Sam. 12: 13).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 14"
