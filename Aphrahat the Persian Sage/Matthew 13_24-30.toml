[[commentary]]
quote='''
And again there is one who confesses his sin, and penitence is not given to him. O master of the house of Christ, give penitence to thy fellow man, and remember that the Lord did not reject the penitent. Tares are sown in the field, and the Master of the seed does not permit His servants to purge the tares from among the wheat until the time of harvest. A net is spread in the sea, and the fish are not chosen until it is drawn to the top. Servants receive hire from their masters, and his master will judge the slothful servant. The wheat and the chaff are mingled together, and the Lord of the threshing-floor separates and cleanses (them). There are many who are called to the marriage feast, and His Lord casts out him who has not garments into the darkness. The wise and the foolish are standing together, and the Lord of the bride-chamber knows who shall enter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 25"
