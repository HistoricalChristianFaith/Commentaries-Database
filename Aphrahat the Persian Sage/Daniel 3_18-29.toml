[[commentary]]
quote='''
Hananiah also and his brethren were persecuted as Jesus was persecuted. Hananiah and his brethren were persecuted by Nebuchadnezzar; and Jesus, the people of the Jews persecuted. Hananiah and his brethren were cast into the furnace of fire, and it was cold as dew upon the righteous. Jesus also descended to the place of darkness, and burst its gates and brought forth its prisoners. Hananiah and his brethren came up from the furnace of fire, and the flame burned their accusers; and Jesus revived and came up from the midst of darkness, and His accusers and they that crucified Him shall be burned in flames at the end. When Hananiah and his brethren came up from the furnace, Nebuchadnezzar the King trembled and was amazed; and when Jesus arose from the abode of the dead, the people that crucified Him were terrified and trembled. Hananiah and his brethren worshipped not the image of the King of Babylon; and Jesus restrained the nations from the worship of dead images. Because of Hananiah and his brethren, the nations and languages glorified God Who had delivered them from the fire: and because of Jesus, the nations and oil languages shall glorify (God) Who delivered His Son, so that He saw no corruption. On the garments of Hananiah and his brethren the fire had no power; and on the bodies of the righteous, who have believed in Jesus, the fire shall have no power at the end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 19"
