[[commentary]]
quote='''
And now hear concerning faith that is based upon the Stone, and concerning the structure that is reared up upon the Stone. For first a man believes, and when he believes, he loves. When he loves, he hopes. When he hopes, he is justified. When he is justified, he is perfected. When he is perfected, he is consummated. And when his whole structure is raised up, consummated, and perfected, then he becomes a house and a temple for a dwelling-place of Christ, as Jeremiah the Prophet said:—The temple of the Lord, the temple of the Lord, the temple of the Lord are ye, if ye amend your ways and your works. And again He said through the Prophet:—I will dwell in them and walk in them. And also the Blessed Apostle thus said:—Ye are the temple of God and the spirit of Christ dwelleth in you. And also our Lord again thus said to His disciples:—Ye are in Me and I am in you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 3"
