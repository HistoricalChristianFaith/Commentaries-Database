[[commentary]]
quote='''
Daniel said concerning Jerusalem, that until the things determined, she should remain in desolation; and Jesus said concerning Jerusalem, There shall not be left in her stone upon stone, because she knew not the day of her greatness. Daniel foresaw the weeks that should remain over for his people; and Jesus came and fulfilled them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 18"
