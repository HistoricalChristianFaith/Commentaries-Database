[[commentary]]
quote='''
Also Jephthah was persecuted, as Jesus was persecuted. Jephthah, his brethren drove out from the house of his father; and Jesus, His brethren drove out and lifted up and crucified. Jephthah though persecuted arose as leader to his people; Jesus though persecuted arose and became King of the Nations. Jephthah vowed a vow and offered up his firstborn daughter as a sacrifice; and Jesus was lifted up as a sacrifice to his Father for all the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 12"
