[[commentary]]
quote='''
Faith is compounded of many things, and by many kinds is it brought to perfection. For it is like a building that is built up of many pieces of workmanship and so its edifice rises to the top. And know, my beloved, that in the foundations of the building stones are laid, and so resting upon stones the whole edifice rises until it is perfected. Thus also the true Stone, our Lord Jesus Christ, is the foundation of all our faith. And on Him, on [this] Stone faith is based. And resting on faith all the structure rises until it is completed. For it is the foundation that is the beginning of all the building. For when any one is brought nigh unto faith, it is laid for him upon the Stone, that is our Lord Jesus Christ. And his building cannot be shaken by the waves, nor can it be injured by the winds. By the stormy blasts it does not fall, because its structure is reared upon the rock of the true Stone. And in this that I have called Christ the Stone, I have not spoken of my own thought, but the Prophets beforehand called Him the Stone. And this I shall make clear to thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 2"
