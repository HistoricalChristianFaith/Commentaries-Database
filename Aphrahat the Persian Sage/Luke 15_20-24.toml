[[commentary]]
quote='''
I say to you also, penitents, that ye should not withhold from your souls this counsel which is given for your healing. For he has said in the Scriptures: "He who confesseth his sins and passeth away from them, God will be moved with compassion in his behalf" (Prov. 28: 13). Behold the son who has squandered his goods, and when he returned unto his father he rejoiced over him, and received him, and killed for him the fatted ox, and his father was glad over his return. And he called his friends also that they might rejoice with him; and his father embraced him and covered him with kisses and said: "this my son was dead and is alive; he was lost and has been found (S. Luke 15: 32). And his father did not find fault with him about the goods which he had squandered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 12"
