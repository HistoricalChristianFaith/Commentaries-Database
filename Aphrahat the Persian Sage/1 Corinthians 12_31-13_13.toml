[[commentary]]
quote='''
See again, beloved, how greatly the blessed Apostle magnified love when he said: "If ye are zealous of great gifts I will show you what is a more excellent gift." And he said: "If I have prophecy, and know all mysteries, and all knowledge, and all faith, so that I might remove a mountain, and love is not in me, I have gained nothing. And if I give all that I have to the poor to eat, and also deliver my body that it may be burnt, and love is not in me, again I have gained nothing." For he spake thus: "Love, its spirit is long-suffering and kind, and not envious, and also it is not boastful, and it is not puffed up, and does not seek anything which is pleasant for itself alone, but what is expedient for many. Love hopeth all things, suffereth all things, love is never cast down." Again he said: "Love is greater than all things." And the Apostle shows and demonstrates that after faith love excels, and on it a firm building has been established. And he shows prophecy to be built upon love, and mysteries to be made known by love, and knowledge to be fulfilled by love, and faith to be confirmed by love; and he who having faith moves a mountain, but has not love, profits nothing; and if a man give all that he has to the poor and his alms are not given in love, there is no advantage to him; and even if for the name of his Lord his body has been burnt in the fire, he has been in no wise profited. And again he shows that long-suffering, and patience, and kindness, and for a man not to envy his brother, these things are found in the fulness of love; and also patience, and humility and sweetness have been established in him by love. For faith has been erected upon the rock of a structure, and love is the bonds of the structure, and by it the walls of the house have been held together. And if a defect is found in the bonds of the house the whole structure will fall; so also when dissention is found in love all faith falls. And faith was not able to drive away jealousy and contention until the love of Christ came, just as a structure cannot be well built until the walls have been fastened by bonds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 16"
