[[commentary]]
quote='''
Be ye like, O Pastors, to those righteous Pastors of old. Jacob fed the sheep of Laban, and guarded them and toiled and was watchful, and so received the reward. For Jacob said to Laban:—Lo! twenty years am I with thee. Thy sheep and thy flocks I have not robbed and the males of thy sheep I have not eaten. That which was broken I did not bring unto thee, but thou required it at my hands! In the daytime the heat devoured me and the cold by night. My sleep departed from my eyes. Observe, ye Pastors, that Pastor, how he cared for his flock. He used to watch in the night-time to guard it and was vigilant; and he used to toil in the daytime to feed it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 10 (Of Pastors), Section 1"
