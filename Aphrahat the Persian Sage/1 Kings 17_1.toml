[[commentary]]
quote='''
Elijah also was persecuted as Jesus was persecuted. Jezebel the murderess persecuted Elijah; and the persecuting and murderous congregation persecuted Jesus. Elijah restrained the heavens from rain because of the sins of Israel; and Jesus by His coming restrained the Spirit from the prophets, because of the sins of the people. Elijah destroyed the servants of Baal; and Jesus trampled upon Satan and his hosts. Elijah raised to life the son of the widow; and Jesus raised to life the son of the widow, as well as Lazarus and the daughter of the ruler of the Synagogue. Elijah sustained the widow with a little bread; and Jesus satisfied thousands with a little bread. Elijah was taken up in a chariot to heaven; and our Redeemer ascended and took His seat on the right hand of His Father. Elisha received the spirit of Elijah; and Jesus breathed upon the faces of His Apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 14"
