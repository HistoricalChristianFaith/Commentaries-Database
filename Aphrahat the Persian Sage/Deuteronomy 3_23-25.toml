[[commentary]]
quote='''
And also when the time came that Moses should sleep with his fathers, he was grieved and distressed, and he sought of his Lord and entreated that he might pass over to the land of promise. And why, my beloved, was the righteous Moses grieved because he did not enter into the land of promise? Clearly, because he wished to go and be buried with his fathers, and not be buried in the land of his adversaries, in the land of Moab. For the Moabites hired Balaam the son of Beor to curse Israel. Therefore Moses wished not to be buried in that land, lest the Moabites should come and take vengeance on him by taking up and casting forth the bones of that righteous man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 9"
