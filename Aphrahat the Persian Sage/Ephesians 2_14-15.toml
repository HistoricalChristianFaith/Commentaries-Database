[[commentary]]
quote='''
And how, then, were the law and the prophets lacking, when it was necessary that they should be fulfilled? if not because the testament was hidden in them which is itself the word of promise. For that testament which was given to Moses was not sealed until this last testament should come, which is also the first, because it was promised, it was signed by the death of Him who was to come of the testament, and the two testaments were confirmed (N.B. this whole passage is obscure and the translation, following the Latin rather closely, little more than a guess): "And He made them both one, and the law of the commandments He abolished by His precepts." For the uses of the law are abolished by the advent of our Life-giver, and He offered up Himself in the place of the sacrifices which are in the law, and He was led as a lamb to the slaughter in the place of the lambs of propitiation, and He was killed for us (as) a fattened bull, that there might be no necessity for us to offer the offspring of cattle. He came and He was lifted up upon the cross; oblations and sacrifices are not required from us; He gave His blood in place of all men, that the blood of animals might not be required of us; He entered the sanctuary which was not made by hands, and He became the priest and minister of the holy place. For from the time in which He came He abolished the observances which are of the law, and from the time that they bound Him the festivals were bound for them by chains; and because they wished to judge the innocent One He took the judges away from them; and because they rejected His kingdom He took away the kingdom from them, for He came whose the kingdom is; and He ascended a living sacrifice in our stead and abolished their sacrifices, and the children of Israel remained without sacrifices and without altar, and without putting on the ephod and placing of incense; and He took away from them seers and prophets because they had not heard the great Prophet; and the former covenant was fulfilled by the latter, and the works which are in the law have grown old and become antiquated and fit for destruction, for from the time the new was given the old was abolished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 6"
