[[commentary]]
quote='''
I will instruct thee of that which is written, that the Spirit is not at every time found with those that receive it. For thus it is written about Saul, that the Holy Spirit, which he received when he was anointed, departed from him, because he grieved it, and God sent to him instead of it a vexing spirit. And whenever he was afflicted by the evil spirit, David used to play upon the harp, and the Holy Spirit, which David received when he was anointed, would come, and the evil spirit that was vexing Saul, would flee from before it. So the Holy Spirit that David received was not found with him at every time. As long as he was playing the harp, then it used to come. For had it been with him always, it would not have allowed him to sin with the wife of Uriah. For when he was praying about his sins, and was confessing his offences before God, he said thus:—Take not Thy holy spirit from me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 16"
