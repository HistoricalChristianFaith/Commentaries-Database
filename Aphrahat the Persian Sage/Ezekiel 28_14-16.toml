[[commentary]]
quote='''
For while the Prince of Tyre was walking without fault in the midst of the stones of fire, there was mercy upon him. But when his heart was lifted up, the cherub who overshadoweth, destroyed him.

Now, what are the stones of fire, but the children of Zion and the children of Jerusalem? For in the ancient time, in the days of David and of Solomon his son, Hiram was a friend to those of the house of Israel. But when they were carried away captive from their place, he rejoiced over them and spurned them with his feet, and did not remember the friendship of the house of David. And as to that which I said that the children of Judah were called the stones of fire, it was not of my own thought that I said it, but Jeremiah the Prophet spake concerning them; for when he was calling forth tears for them in the Lamentations, he said:—The children of Zion were more excellent than precious stones. And again he said:—How are the stones of the Sanctuary cast down at the head of all the streets? And again He said by the Prophet:—The stones were holy that were cast down in his land. And as to these very stones, the fire was burning in them, as Jeremiah said:—The word of the Lord became in my heart like burning fire and it was hot in my bones. And again He said to Jeremiah:—Lo! I give My word in thy mouth as fire, and this people shall be as wood. And again He said words shall go forth as fire, and as iron that cutteth the stone. On this account the Prophets, amongst whom Hiram the Prince of Tyre was walking, were called stones of fire.

And again (God) said to him:—Thou wast with the Cherub who was anointed and overshadowing. For the king, who was anointed with the holy oil, was called a Cherub. And he was overshadowing all his people, as Jeremiah said:—The anointed of the Lord is the breath of our nostrils, he of whom we said that in his shadow shall we live amongst the Gentiles. For they were sitting in the shadow of the king, while he was standing at their head. And when the crown of their head fell, they were without shade. And if any one should say that this word is spoken concerning Christ, let him receive that which I write for him without disputation, and thus he will be persuaded that it was said with reference to the king. For Jeremiah said in behalf of the people:—Woe unto us, for the crown of our head has fallen! But Christ has not fallen, because He rose again the third day. For the king fell from the house of Judah, and never again was their kingdom set up. And as for that He said again:—I will destroy the overshadowing Cherub. For the Cherub that He will destroy is Nebuchadnezzar, as it is written:—He performed a work in Tyre, and there was given him by Tyre no hire for his host, and in return for the work of Tyre there was given him the land of Egypt. And why was hire not given by Tyre to Nebuchadnezzar? Clearly because its wealth went away in the sea, so that Nebuchadnezzar did not receive it. And at that time He destroyed the overshadowing Cherub, which is Nebuchadnezzar. For there are two Cherubs, one anointed and overshadowing, and one overshadowing but not anointed. For He said above:—Thou wast with the Cherub anointed and overshadowing. And lower down He said:—I will destroy thee the overshadowing Cherub; and did not say “anointed.” For Nebuchadnezzar was not anointed; but David and Solomon were, and the other kings who arose after them. And how was Nebuchadnezzar called overshadowing? Clearly on account of the vision of the tree, when he saw a tree in the midst of the earth, beneath which dwelt all the beasts of the wilderness and on its branches dwelt all the birds of heaven, and from it all flesh was fed. When Daniel interpreted his dream to him, Daniel said to him:—Thou art the tree, that tree which thou sawest in the midst of the earth and beneath thee dwell all the nations. On this account he was the overshadowing Cherub; who destroyed the Prince of Tyre, because he rejoiced over the children of Israel, for that they were carried away captive from their land, and because his heart was exalted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Sections 7-9"
