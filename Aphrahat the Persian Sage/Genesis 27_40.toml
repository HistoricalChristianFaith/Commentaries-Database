[[commentary]]
quote='''
For first, He gave the Kingdom to the sons of Jacob, and subdued to them the children of Esau; as Isaac said to Esau:—Thou shalt serve Jacob thy brother. And when again they did not prosper in the Kingdom, He took it away from the children of Jacob and gave it to the children of Esau until He should come Whose it is. And they will deliver up the deposit to its Giver, and will not deal fraudulently with it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 24"
