[[commentary]]
quote='''
Moses also by his faith performed many wonderful works of power. By his faith he destroyed the Egyptians with ten plagues. Again, by faith he divided the sea, and caused his people to cross over and sank the Egyptians in the midst of it. By faith he cast the wood into the bitter waters and they became sweet. By faith he brought down manna and satisfied his people. By faith he spread out his hands and conquered Amalek, as is written:—His hands continued in faith till the setting of the sun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 14"
