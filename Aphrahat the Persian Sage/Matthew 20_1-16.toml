[[commentary]]
quote='''
But hear, my beloved, this proof that retribution shall take place at the end. For when the Shepherd divides His flock and sets some on His right hand and some on His left, until He shall have acknowledged the service of the good, then He will cause them to inherit the kingdom; and until He shall have rebuked the evil and they are condemned, then He will send them to the torment. And as to them that sent messengers after the King, saying, This man shall not be king over us, when He shall receive the kingdom and return, then His adversaries shall be slain before Him. And the labourers who hastened and were wearied in the vineyard, shall not receive the reward till the labour shall cease. And the traders who received the money, when the Lord of the money shall come, then shall He exact the usury. And the virgins who, while waiting for the bridegroom, slumbered and slept because He delayed to come, when they shall hear the cry, then they shall awake and trim their lamps; and they that are wise shall enter in; and the foolish shall be shut out. And they who were before us in entering the faith, without us shall not be made perfect.

From all these things, understand thou, my beloved, as it has been made certain for thee, that as yet no one has received his reward. For the righteous have not inherited the kingdom, nor have the wicked gone into torment. The Shepherd has not as yet divided His flock. And lo! the workmen enter into the vineyard, and as yet have not received the reward. And lo! the merchants are trading with the money. And as yet their Lord has not come to take the account. And the King has gone to receive the Kingdom, but as yet He has not returned the second time. And those virgins that are waiting the bridegroom are sleeping up to the present time, and are awaiting the cry when they will awake. And the former men who toiled in the faith until the last men shall come, shall not be made perfect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Sections 21-22"
