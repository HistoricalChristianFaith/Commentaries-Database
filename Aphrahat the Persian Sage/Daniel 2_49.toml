[[commentary]]
quote='''
Daniel besought of the king, and he gave his brethren authority over the affairs of the province of Babylon; and Jesus besought of God, and He gave His brethren, His disciples, authority over Satan and his host.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 18"
