[[commentary]]
quote='''
But as for thee, my beloved, have no doubt as to the Resurrection of the dead. For the living mouth (of God) testifies:—I cause to die and I make alive. And both of them proceeded out of one mouth. And as we are sure that He causes to die, and we see it; so also it is sure and worthy of belief, that He makes alive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 25"
