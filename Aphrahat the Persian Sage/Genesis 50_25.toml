[[commentary]]
quote='''
Thus also Joseph bound his brethren by an oath, and said to them:—When God shall remember you, take up my bones from hence with you. And according to the word of Joseph his brethren did, and kept the oath a hundred and twenty-five years. At that time when the hosts of the Lord went out from the land of Egypt, then Moses took up the bones of Joseph when he went forth. And the bones of the righteous man were more precious and better in his estimation than the gold and the silver that the children of Israel took from Egypt when they spoiled them. And the bones of Joseph were forty years in the wilderness; and at that time when Moses fell asleep, he gave them in inheritance to Joshua the son of Nun. The bones of Joseph his father were better in his estimation than all the spoil of that land which he subdued. And why did Moses give the bones of Joseph to Joshua? Clearly, because he was of the tribe of Ephraim the son of Joseph. And he buried them in the land of promise, that there might be in that land a treasure, (even) that of the bones of Joseph (that were) buried therein.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 8"
