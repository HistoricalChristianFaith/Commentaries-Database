[[commentary]]
quote='''
Therefore, my beloved, when the Holy Spirit departs from a man who has received it, until it returns and comes to him, then Satan draws near unto that man, to cause him to sin, and that the Holy Spirit may leave him altogether. For as long as the Spirit is with a man, Satan fears to come near him. And observe, my beloved, that our Lord also, Who was born from the Spirit, was not tempted by Satan until in baptism He received the Spirit from on high. And then the Spirit led him forth to be tempted by Satan.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 17"
