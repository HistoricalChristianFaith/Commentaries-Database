[[commentary]]
quote='''
And again He said:—No man lighteth a lamp and putteth it under a bushel or under a bed, or putteth it in a hidden place, but putteth it upon the lamp-stand that every one may see the light of the lamp. And the shining lamp is Christ, as David said;—Thy word is a lamp unto my feet and a light to my paths.

And furthermore the Prophet Hosea also said:—Light you a lamp and seek ye the Lord. And our Lord Jesus Christ said:—What woman is there who has ten drachmos and shall lose one of them, and will not light a lamp and sweep the house and seek her drachma that she lost? What then does this woman signify? Clearly the congregation of the house of Israel, to which the ten commandments were given. They lost the first commandment—that in which He warned them saying:—I am the Lord your God, Who brought you up from the land of Egypt. And when they had lost this first commandment, also the nine which are after it they could not keep, because on the first depend the nine. For it was an impossibility that while worshipping Baal, they should keep the nine commandments. For they lost the first commandment, like that woman who lost one drachma from the ten. So the Prophet cried unto them:—Light you a lamp and seek ye the Lord. And furthermore the Prophet Isaiah also said:—Seek ye the Lord and when ye shall have found Him, call upon Him; and when He is near let the sinner abandon his way and the wicked man his thought. For that lamp shone and they did not by it seek the Lord their God. And its light shone in the darkness and the darkness did not comprehend it. And the lamp was set up on the lamp-stand and those who were in the house did not see its light. And what then means this, that the lamp was set up on the lamp-stand? Clearly His being raised up upon the cross. And by this all the house was made dark over them. For when they crucified Him, the light was darkened from them, and shone amongst the Gentiles, because that from the time of the sixth hour (of the day) on which they crucified Him even unto the ninth hour there was darkness in all the land of Israel. And the sun set in midday and the land was darkened in the shining daytime, as is written in Zechariah the Prophet:—It shall come to pass in that day, saith the Lord, I will cause the sun to set in midday, and will make dark the land in the shining daytime.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Sections 10-11"
