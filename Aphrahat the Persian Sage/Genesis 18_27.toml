[[commentary]]
quote='''
Hearken to your first fathers who, even when they were righteous, subjected themselves to humiliation. For Abraham said: "I am dust and ashes" (Gen 18:27), and he held himself lowly as a thing of small consequence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 16"
