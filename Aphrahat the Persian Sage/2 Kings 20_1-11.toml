[[commentary]]
quote='''
Hezekiah also was persecuted as Jesus was persecuted. Hezekiah was persecuted, and was reproached by Sennacherib his enemy; Jesus also was reproached by the foolish people. Hezekiah prayed and overcame his adversary; and by the crucifixion of Jesus was our Adversary overcome. Hezekiah was king of all Israel; and Jesus is King of all the nations. Because Hezekiah was sick, the sun turned backwards; and because Jesus suffered, the sun was darkened from its light. The enemies of Hezekiah became dead corpses; and Jesus, His enemies shall be cast down beneath His feet. Hezekiah was of the family of the house of David; and Jesus was, in the flesh, the son of David. Hezekiah said:—Peace and truth shall be in my days; and Jesus said to His disciples:—My peace I leave with you. Hezekiah prayed, and was healed of his sickness; Jesus prayed, and arose from the abode of the dead. Hezekiah after he arose from his sickness added to his years; and Jesus after His Resurrection received great glory. Hezekiah, after the prolongation of his life, death was given dominion over him; but Jesus, after that He rose, death shall not again have dominion over Him for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 16"
