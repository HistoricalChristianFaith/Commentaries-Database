[[commentary]]
quote='''
In that place they shall forget this world. There they have no want; and they shall love one another with an abundant love. In their bodies there shall be no heaviness, and lightly shall they fly as doves to their windows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 12"
