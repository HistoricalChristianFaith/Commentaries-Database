[[commentary]]
quote='''
Now I must proceed to my former subject of faith, that on it are reared up all the good works of the building. And again, in what I said with regard to the building, it was in no strange fashion that I spoke, but the blessed Apostle wrote in the first Epistle to the Corinthians, saying;—I as a wise master-builder have laid the foundation, but every one buildeth on it. One builds silver and gold and goodly stones; another builds reed and straw and stubble. In the last day that building shall be tried by fire; for the gold and silver and goodly stones shall be preserved in the midst of the fire, because they are a firm building. But as for the straw and reed and stubble, the fire shall have power upon them and they shall be burned. And what is the gold and silver and goodly stones by which the building is raised up? Clearly the good deeds of faith, which shall be preserved in the midst of the fire; because Christ dwells in that secure building, and He is its preserver from the fire. And let us consider and understand (this) from the example that God has given us also in the former dispensation, because the promises of that dispensation will abide sure for us. Let us then understand from (the case of) those three righteous men who were cast into the midst of the fire and were not burned, namely, Hananiah, Azariah and Misael, over whom the fire had no power, because they built a secure building and rejected the commandment of Nebuchadnezzar the king and did not worship the image that he made. And as for those who transgressed the commandment of God, the fire at once prevailed over them and burned them, and they were burned without mercy. For the Sodomites were burned like straw and reed and stubble. Furthermore, Nadab and Abihu were burned, who transgressed the commandment of God. Again, two hundred and fifty men were burned, who were offering incense. Again, two princes and a hundred who were with them were burned, because they approached the mountain on which Elijah was sitting, who ascended in a chariot of fire to heaven. The calumniators also were burned because they dug a pit for righteous men. Accordingly, beloved, the righteous shall be tried by the fire, like gold and silver and goodly stones, and the wicked shall be burned in the fire like straw and reed and stubble, and the fire shall have power upon them and they shall be burned; even as the Prophet Isaiah said:—By fire shall the Lord judge and by it shall He try all flesh. And again he said:—Ye shall go out and see the carcases of the men who offended against Me, whose worm shall not die, nor shall their fire be quenched, and they shall be an astonishment to all flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 12"
