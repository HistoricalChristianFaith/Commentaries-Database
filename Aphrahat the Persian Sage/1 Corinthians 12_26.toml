[[commentary]]
quote='''
Whosoever is sick among you we bear his sufferings, and whosoever offends we are afflicted in his behalf.

For when sickness comes to one of our members we occupy ourselves with his wound until he is made whole; and when one of our members is glorified the whole body shines and is beautiful; and when sickness comes to one of our members fever burdens the whole body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Sections 23-24"
