[[commentary]]
quote='''
And that God might make known to Death that his authority is not for ever over all the progeny of the world, He translated Enoch to Himself, because he was well-pleasing, and made him deathless. And again He took up Elijah to heaven, and Death had no dominion over him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 3"
