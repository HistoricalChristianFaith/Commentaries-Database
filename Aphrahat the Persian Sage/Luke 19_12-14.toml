[[commentary]]
quote='''
But I must proceed to my former statement that Christ is called the Stone in the Prophets. For in ancient times David said concerning Him:—The stone which the builders rejected has become the head of the building. And how did the builders reject this Stone which is Christ? How else than that they so rejected Him before Pilate and said—This man shall not be King over us. And again in that parable that our Lord spake that a certain nobleman went to receive kingly power and to return and rule over them; and they sent after Him envoys saying:—This man shall not be King over us. By these things they rejected the Stone which is Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 6"
