[[commentary]]
quote='''
For from baptism do we receive the Spirit of Christ. For in that hour in which the priests invoke the Spirit, the heavens open and it descends and moves upon the waters. And those that are baptized are clothed in it; for the Spirit stays aloof from all that are born of the flesh, until they come to the new birth by water, and then they receive the Holy Spirit. For in the first birth they are born with an animal souls which is created within man and is not thereafter subject to death, as he said:—Adam became a living soul. But in the second birth, that through baptism, they received the Holy Spirit from a particle of the Godhead, and it is not again subject to death. For when men die, the animal spirit is buried with the body, and sense is taken away from it, but the heavenly spirit that they receive goes according to its nature to Christ. And both these the Apostle has made known, for he said:—The body is buried in animal wise, and rises again in spiritual wise. The Spirit goes back again to Christ according to its nature, for the Apostle said again:—When we shall depart from the body we shall be with our Lord. For the Spirit of Christ, which the spiritual receive, goes to our Lord. And the animal spirit is buried in its nature, and sense is taken away from it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 14"

[[commentary]]
quote='''
Concerning then this Resurrection of the dead, my beloved, according to my power I will instruct thee. For from the beginning God created Adam; moulded him from the dust of the earth, and raised him up. For if, while Adam was not, He made him from nothing, how much easier now is it for Him to raise him up; for lo! as a seed he is sown in the earth. For if God should do those things that are easy for us, His works would not appear mighty to us. For lo! there are amongst men artificers who make wonderful things, and those who are not artificers of the works stand and wonder how they were done; and the work of their fellows is difficult in their eyes. How much more should not the works of God be as a marvel! But for God this was no great thing, that the dead should be quickened. Before seed was sown in the earth, the earth produced that which had not been cast into it. Before it had conceived, it bore in its virginity. How then is this difficult, that the earth should cause to spring up again what had been cast into it, and after conception should bear? And lo! her travail-pains are near; as Isaiah said, Who hath seen anything like this and who hath heard such things as these? that the earth should travail in one day, and a people should be born in one hour? For Adam unsown sprang up; unconceived he was born. But lo! now his offspring are sown, and wait for the rain, and shall spring up. And lo! the earth teems with many, and the time of her bringing forth is at hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 6"
