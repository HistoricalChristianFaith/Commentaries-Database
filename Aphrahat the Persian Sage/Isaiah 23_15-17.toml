[[commentary]]
quote='''
On this account he was the overshadowing Cherub; who destroyed the Prince of Tyre, because he rejoiced over the children of Israel, for that they were carried away captive from their land, and because his heart was exalted. This Tyre also lay waste seventy years like Jerusalem which sat in desolation seventy years. For Isaiah said concerning it:—Tyre shall wander seventy years, as the days of one king, and shall commit fornication with all the kingdoms that are upon the face of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 5 (Of Wars), Section 9"
