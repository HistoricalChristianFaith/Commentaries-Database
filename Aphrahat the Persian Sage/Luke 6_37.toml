[[commentary]]
quote='''
And David also showed an example of love when he was persecuted by Saul, and a trap was continually set for his life so that they might kill him, and David by love was generously performing acts of mercies in behalf of Saul his enemy, who was seeking his life; and he was twice delivered into the hands of David, and he did not kill him and repaid good in place of evil. Because of this good did not depart from his house, and he who forsook him was forsaken. And Saul who repaid evil in place of good, evil did not depart from his house, and He called to God and He did not answer him, and he fell by the sword of the Philistines, and David wept over him bitterly. And David fulfilled beforehand the precept of our Saviour, who said: "Love your enemies," and "forgive, and it shall be forgiven unto you." Thus David loved and was loved, and forgave and it was forgiven unto him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 17"
