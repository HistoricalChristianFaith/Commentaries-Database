[[commentary]]
quote='''
For Jacob our father, when he was dying, bound Joseph his son with an oath, and said to him, Bury me in the tomb of my fathers, with Abraham and Sarah and Isaac and Rebecca. And why, my beloved, did Jacob not wish to be buried in Egypt, but with his fathers? He showed beforehand, that he was looking forward to the quickening of the dead; that, when the Resurrection shout should be raised and the sound of the trumpet (heard), he might rise up near to his fathers, and might not at the time of the Resurrection be mingled with the wicked who shall return to Sheol and to punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Section 7"
