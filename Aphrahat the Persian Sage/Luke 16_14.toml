[[commentary]]
quote='''
And be on thy guard against scorners. For whosoever scorns and mocks his brother, the word that is written in the Gospel fitly applies to him; namely, when our Lord wished to take account with the avaricious and with the Pharisees. For it is written:—Because they loved money, they mocked Him. So also now those that do not agree with these things mock in the same way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 20"
