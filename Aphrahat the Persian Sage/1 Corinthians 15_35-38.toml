[[commentary]]
quote='''
At all times controversies arise on this matter, how the dead shall rise and with what body they shall come? For lo! the body wears out and is corrupted; and the bones also, no doubt, as time lengthens out over them, waste away and are not to be recognised. And when thou enterest a tomb in which a hundred dead men are buried, thou findest not there an handful of dust. And thus say those that reflect on these things:—“We know of course that the dead shall rise; but they will be clothed in a heavenly body and spiritual forms. And if it is not so, these hundred dead that were buried in one tomb, of whom after a long time elapses there remains nothing at all there, when the dead shall be quickened, and shall be clothed in a body and rise, unless they shall be clothed in a heavenly body, from whence shall their body come? For lo! there is nothing in the tomb.”

Whosoever reflects thus is foolish, and without knowledge. When the dead were brought in, they were something; and when they were there for a long time, they became nothing. And, when the time shall have come that the dead shall rise, that nothing shall become something according to its former nature, and a change shall be added to its nature. O thou unwise who reflectest thus, hear that which the blessed Apostle said when he was instructing a foolish man like thee; for he said:—Thou fool, the seed which thou sowest unless it die is not quickened; and that which thou sowest is not like that which grows up into blade, but one bare grain of wheat or barley or some other seedling. And to each one of the seeds is given its own body. But God clothes thy seed with its body as He wills.

Therefore, O fool, be instructed by this, that each of the seeds is clothed in its own body. Never dost thou sow wheat and yet reap barley, and never dost thou plant a vine and yet it produced figs; but everything grows according to its nature. Thus also the body that was laid in the earth is that which shall rise again. And as to this, that the body is corrupted and wastes away, thou oughtest to be instructed by the parable of the seed; that as the seed, when it is cast into the earth, decays and is corrupted, and from its decay it produces and buds and bears fruit. For the land that is ploughed, into which seed is not cast, produces not fruit, even if that land drinks in all the rain. So the grave in which the dead are not buried, from it men shall not issue forth in the quickening of the dead, though the full voice of the trumpet should sound within it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 8 (Of the Resurrection of the Dead), Sections 1-3"
