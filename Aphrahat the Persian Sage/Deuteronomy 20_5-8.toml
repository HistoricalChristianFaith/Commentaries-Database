[[commentary]]
quote='''
O ye who have been called to the conflict, hear the sound of the trumpet and be of good cheer. And also I speak to you, bearers of the trumpets, priests, doctors and wise men, assemble and say to all the people: "He who fears let him turn away from the conflict, lest he break the heart of his brethren, even as his heart (is broken). And he who has planted a vineyard let him return to his husbandry, lest being anxious about it he fail in the battle. And he who has married a wife and wishes to take her, let him return and rejoice with his wife. And he who has built a house let him return to it, lest perhaps he be mindful of his house and does not fight perfectly". Conflict is seemly only for those that, setting their faces to (those things which are) before them, are not mindful of anything which is behind them. For their treasures are before them, and all that which they plunder is their own, and they receive their profit from that which they win. Therefore, I speak to you, sounders of the trumpets, when ye have finished admonishing look to those who are turning back, and care for those who are remaining, and lead down to the waters of probation those who are assembling themselves for battle. Everyone who is strong the waters will prove, and those who are slothful will be separated thenceforth.

Hear then, beloved, this mystery which Gideon foresaw and showed figuratively. When he assembled the people for battle, the scribes, the fulfillers of the law, he admonished (according to) the words which I have written above unto thee; then many people with drew from the army, and when those who were left were chosen for battle, "the Lord said to Gideon, lead them down to the water and there prove them. He who laps up the water with his tongue (Jud. 7: 5) is eager and courageous to go forth to battle; "and he who falls down upon his belly to drink the water" is faint (hearted) and afraid to go forth to battle. Great, then, is this mystery, beloved, which Gideon foresaw, and it shows a type of baptism, and the mystery of the conflict, and an example of anchorites. For he foresaw and warned the people from the first by the probation of the water. Also when he tried them by the water from the ten thousand only three hundred men were chosen to wage war. This also agrees with the word of our Lord, who said: "many are called, few are chosen" (S. Mt. 22: 14).

For this reason it is fitting for the sounders of trumpets, the preachers of the Church, to warn all (who are in) the covenant of God before baptism, and to those who choose for themselves virginity and holiness, young men and virgins and those (wishing to. become) holy; and for the preachers to warn them and say: "He who sets his heart upon the natural state of fellowship (i.e. in matrimony), let him become united before baptism lest, perhaps, he fall in the conflict and be killed. And he who is afraid of this part of the struggle let him turn back lest, perhaps, he break the heart of his brethren as well as his own heart. And he who loves possessions let him turn back from the army lest, perhaps, when the battle shall prevail against him he should remember his possessions and turn back to them, for there is disgrace to him who turns back from the conflict". And he who does not offer himself, and does not yet put on arms, is not blamed if he turns back; but everyone who has offered himself and put on arms is derided if he turns back from the conflict. It is fitting to him to empty himself for the strife, for he may not be mindful of anything which is behind and turn back to it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Sections 18-20"
