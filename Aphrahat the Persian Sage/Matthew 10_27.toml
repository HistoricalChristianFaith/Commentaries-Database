[[commentary]]
quote='''
And also with reference to Christ was this (which follows) said. For he said that He was given as a light to all the Gentiles as the Prophet Isaiah said:—I have given Thee as a light to all the Gentiles, that Thou shouldest be My redemption to the ends of the earth. And furthermore David also said;—Thy word is a lamp unto my feet and a light unto my paths. And also the word and discourse of the Lord is Christ, as is written in the beginning of the Gospel of our Saviour:—In the beginning was the Word. And with regard to the light there again he bore witness:—The light was shining in the darkness and the darkness comprehended it not. What then is this:—The light was shining in the darkness and the darkness comprehended it not? Clearly Christ, Whose light shone in the midst of the people of the house of Israel, and the people of the house of Israel did not comprehend the light of Christ, in that they did not believe on Him, as it is written:—He came unto His own, and His own received Him not. And also our Lord Jesus called them darkness, for He said to His disciples;—Whatsoever I say unto you in the darkness, that speak ye in the light, namely, let your light shine among the Gentiles;because they received the light of Christ, Who is the Light of the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 1 (Of Faith), Section 10"
