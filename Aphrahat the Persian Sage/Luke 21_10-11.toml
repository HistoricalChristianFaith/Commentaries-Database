[[commentary]]
quote='''
The time of summer is at hand, and the fig-tree has budded and its leaves have come out—the signs that our Redeemer gave have begun to be fulfilled. For he said:—People shall rise against people and kingdom against kingdom. And there shall be famines and pestilences and terrors from heaven. And lo! all these things are being accomplished in our days.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 6 (Of Monks), Section 19"
