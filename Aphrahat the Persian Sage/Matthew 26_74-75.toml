[[commentary]]
quote='''
O ye who are entreating penitence, be ye like unto Aaron the chief of the priests who, when he had caused the people to sin by the calf, confessed about his sin and his Lord forgave him. And also David, the chief of the kings of Israel, confessed about his transgression, and it was forgiven him. And also Simon, the chief of the disciples, when he denied, (saying) that Christ hath never seen me, and he cursed and swore, "I do not know Him" (S. Mt. 26: 74) and when repentance came to him he multiplied tears in his weeping; our Lord received him, and made him the foundation, and called him Peter, the edification of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 15"
