[[commentary]]
quote='''
And the cause of their sojourning is designated, for the children of Israel abode four hundred and thirty years in the land of Egypt. And wherefore, beloved, when they dwelt there two hundred and twenty-five years was four hundred and thirty years written for them? if not on account of that hour of which God said to Abraham: "Know of a surety that thy seed shall be a sojourner in a land which is not theirs, and they shall serve among them, and they shall bring them into bondage four hundred years. For at that time in which this word was spoken to Abraham, there shall be unto thee an offspring, by faith it was formed in the heart of Abraham, as it is written: "Abraham believed in God, and it was reckoned unto him for righteousness." And also the word concerning the servitude which his sons should serve in Egypt was conceived in the heart of Abraham, and he began to be anxious as to how his seed should be in servitude, and his heart was serving in Egypt. Likewise also Isaac and Jacob were taking thought about the servitude, and they were in thought serving in the midst of Egypt. And the bondage was promised concerning the seed of Abraham before they were born; for the word was fifteen years before the birth of Isaac, and the promise of the bondage was two hundred and five years before their entering Egypt, and the promise that in the seed of Abraham all peoples should be blessed was four hundred and thirty years before the law. And the law was not able to make void the promise, henceforth the law was an addition with regard to this word of promise until the time should come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 4"

[[commentary]]
quote='''
Hear now, beloved, the persuasiveness of this word. If a man should say: "Why was this word written, that the seat of the children of Israel should remain in the land of Egypt four hundred and thirty years, when in the promise which had been made to Abraham it was said to him that there should be four hundred years? And thirty were received in addition?" Now I will show thee, beloved, even as it was. For when the time of fulfillment of the four hundred years was come, Moses was sent that he might deliver them. "When he killed the Egyptian, and they rejected him as their saviour, and Moses fled to Midian, wrath was upon them so that they remained thirty years in Egypt. For they said to Moses: "Who has appointed thee ruler and judge over us?" And when they rejected their salvation the wrath of God withheld them for thirty years in the midst of Egypt, and Moses was thirty years in Midian. Then, when affliction increased upon them, He lead them out of Egypt. God manifested this patience of His spirit; first He chastised them because they had rejected Moses, and secondly because they had completed the sins of the Amorites. He exceeded that which had been promised to Abraham and added thirty years to the people, and He had patience with the Amorites seventy years, thirty in Egypt and forty in the desert. And when the four hundred and thirty was completed, and the forty years for the consummation of the iniquities of the Amorites, He brought them into the land of promise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 8"
