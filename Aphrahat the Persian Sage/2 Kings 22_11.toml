[[commentary]]
quote='''
Josiah also was persecuted as Jesus was persecuted. Josiah was persecuted, and Pharaoh the Lame slew Him; and Jesus was persecuted, and the people that were made lame by their sins slew Him. Josiah cleansed the land of Israel from uncleanness; and Jesus cleansed and caused to pass away uncleanness from all the earth. Josiah hallowed and glorified the name of his God; and Jesus said:—I have glorified and will glorify (His Name). Josiah because of the iniquity of Israel rent his clothes; and Jesus because of the iniquity of the people rent the vail of the Holy Temple. Josiah said:—Great is the wrath that shall come upon this people; and Jesus said:—There shall come wrath upon this people, and they shall fall by the edge of the sword. Josiah cast out uncleanness from the Holy Temple; and Jesus cast out the unclean traders from His Father’s house. For Josiah the daughters of Israel mourned and wailed, as Jeremiah said:—O daughters of Israel, weep for Josiah; and over Jesus did the daughters of Israel weep and mourn, as Zechariah said:—The land shall mourn, families over families.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 21 (Of Persecution), Section 17"
