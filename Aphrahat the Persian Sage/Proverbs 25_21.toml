[[commentary]]
quote='''
And Elisha also showed love in respect to this, when his enemies came against him to take him so that they might do evil to him, and he, doing good to them, set forth bread and water before them and sent them away from him in peace; and he fulfilled the word which is written: "If thine enemy is hungry feed him, and if he thirsts give him to drink."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25202%2520On%2520love.html'
source_title="Demonstration 2 (Of Love), Section 18"
