[[commentary]]
quote='''
O watchers, watch well, and admonish all the people concerning the sword, lest it come and take away the soul. For that soul is taken away in its sins, and its blood will be required from your hands. But if the soul is taken away after admonition, that soul will be taken away in its own sins, and ye will not be trodden down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FDemonstration%25207%2520On%2520penitents.html'
source_title="Demonstration 7 (Of Penitents), Section 26"
