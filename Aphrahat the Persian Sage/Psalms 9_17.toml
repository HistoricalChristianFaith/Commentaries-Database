[[commentary]]
quote='''
And the wicked shall not arise in the judgment, nor sinners in the congregation of the righteous. And even as the righteous who are perfected in good works shall not come into the judgment to be judged, so of the wicked also whose sins are many, and the measure of whose offences is overflowing, it shall not be required that they should draw nigh unto the judgment, but when they have risen again they shall turn back to Sheol, as David said, The wicked shall turn back to Sheol, and all the nations that forget God. And Isaiah said, All the nations are as a drop from the bucket, and as the turning of the balance. And the isles as a grain of sand shall be cast away, and all the nations are esteemed as nothingness by Him. For destruction and the sword are they esteemed by Him. Therefore learn and be persuaded, that all the nations that know not God their Maker, are esteemed by God as nothingness, and shall not come nigh to judgment, but as soon as they have risen shall turn back to Sheol.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 17"

[[commentary]]
quote='''
My beloved, men who are inferior in understanding, dispute about this that I write to thee, and say:—“What is the place in which the righteous shall receive a good reward; and what is the place in which are torments, in which the wicked shall receive the punishments of their works?” O man that thinkest thus, I will ask thee, and tell thou me, why is death called death, and why is Sheol called Sheol? For it is written that when Korah and his companions made a schism against Moses, the earth opened her mouth and swallowed them up, and they went down alive into Sheol. Therefore that was the mouth of Sheol that was opened in the wilderness. David also said, The wicked shall turn back to Sheol. We say that to Sheol, in which Korah and his companions were swallowed up, thither shall the wicked be turned back.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Aphrahat%2520the%2520Persian%2520Sage%2FThe%2520Demonstrations.html'
source_title="Demonstration 22 (Of Death and the Latter Times), Section 24"
