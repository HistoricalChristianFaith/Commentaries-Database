[[commentary]]
quote='''
Three times I was beaten with rods. This he suffered from the Gentiles. Once I was stoned. He was stoned by the Jews in a city of Lycaonia (Acts 14:18). Three times I suffered shipwreck. For one who is read to have sailed at all times, it was easy, with adverse storms, to suffer shipwreck three times. A night and a day I was in the depth of the sea. This happened when he was sent to Rome, having appealed to Caesar (Acts 25:12). Then, despairing of life, he was on the deep, that is, in the depth of the sea, having death before his eyes. For so it is written in that very place: So that we despaired even of living (2 Cor. 1:8).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
