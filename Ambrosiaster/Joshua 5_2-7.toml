[[commentary]]
quote='''
for at the time when the children of Israel were still together in the desert, before they were neighbors of the Gentiles, they were not circumcised. But when they were to mingle with the Gentiles, then they were circumcised by Joshua the son of Nun with rock (Josh. 5:3), which signifies Christ: For the rock, he says, was Christ (1 Cor. 10:4), so as to designate the future circumcision of the heart through Christ, as Moses and the prophet Jeremiah had said: Circumcise yourselves to God, and circumcise the foreskin of your heart (Deut. 10:16; Jer. 4:4); so that, the darkness being cut away through the remission of sins received, they might become worthy to see the glory of God, which, placed under the Law, they had been unable to see because of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
