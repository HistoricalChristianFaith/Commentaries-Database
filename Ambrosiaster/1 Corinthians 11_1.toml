[[commentary]]
quote='''
Be imitators of me, as I also am of Christ. What he says is a human thing: that we should be imitators of him who has been granted to us by God as a teacher. For if he is an imitator of God, why should we not be imitators of a man? Because just as God the Father sent Christ as the teacher and author of life, so also Christ sent the apostles to us as teachers, so that we might be their imitators, since we cannot be his. For so the Lord says to the Father: As you sent me into this world, so I also have sent them into this world (John 17:18). And because they were worthy imitators of him, he added: And for them I will sanctify myself (ibid., 19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
