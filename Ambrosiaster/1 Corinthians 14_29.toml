[[commentary]]
quote='''
But let the prophets speak, two or three, and let the others examine or question. He kept the same measure in saying: Let two or three speak; but singly, as above. And he permitted the rest to ask questions about things which perhaps come into doubt, or which someone cannot grasp; because minds are diverse, so that they may be made clear by plainer discussion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
