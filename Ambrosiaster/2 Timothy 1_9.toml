[[commentary]]
quote='''
And has called us with his holy calling. It is a holy calling when they are chosen to govern the holy people of God: and the elder who is chosen as a leader in holiness is called to a holy thing. Not according to our merits. It is true; for if you inquire into it clearly, no man can seem worthy to be the vicar of Christ; for all whom he chose had previously been sinners. As far, then, as comparison with others is concerned, these were found worthy; but as far as the thing itself is concerned, all are unworthy. But according to his own purpose, and the grace which was given to us in Christ Jesus before the ages of time. Since God by his condescension decreed long ago to save sinners (for God foreknew what would come about in man before he made him, and before he sinned), he predestined how man should be restored: at what time, and through whom, and by what means they could be saved; so that this gift may be seen to be bestowed neither by the merit of those who are saved, nor by that of those through whom they are called, but by the grace of God, through faith in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
