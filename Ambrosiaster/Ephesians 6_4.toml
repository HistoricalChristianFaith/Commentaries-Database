[[commentary]]
quote='''
And you, fathers, do not provoke your children to anger; but bring them up in the discipline and correction of the Lord. So that the Law may be kept, by which it is provided that children honor their parents, another Law is also given by the Apostle to parents: that they so train their children that they do not despise the commandments of the Law; for if they have been nurtured in the fear of the Lord, they will be able to observe what has been enjoined. For if they provoke their children to anger, they themselves do not keep the measure of the Law either; for they seem to force them into being found transgressors. For in anger no one recognizes what is profitable; therefore they ought to learn temperance from the example of their parents, so that they may follow what is profitable. For fathers ought to remember that they too were once children, and certainly did not wish to be exasperated by their fathers. Children too ought to recognize that they will be fathers, and would not wish to be dishonored by their own children. Therefore let both show to one another what they require of one another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
