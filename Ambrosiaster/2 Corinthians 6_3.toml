[[commentary]]
quote='''
By his faith and vigilance, therefore, he cuts away every offense from the negligent, lest perhaps their sluggishness should give rise to an occasion of offense for the disciples; and in this way they signify that they are free, because with all earnestness they simply preach what brings salvation. Hence he added: So that our ministry may not be blamed; for their ministry would be blamed if, by their own works, they did not give examples so that the things they taught in words might be done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
