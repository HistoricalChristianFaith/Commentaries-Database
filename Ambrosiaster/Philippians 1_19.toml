[[commentary]]
quote='''
For he says that what they had prepared for his death profits him for life; for he says that this is his life, if Christ is preached to all, and that he is ready even to die so that this may be fulfilled, knowing that a great reward can be given to him for this wish and its accomplishment: for unskilled malice always plots against itself, without knowing it. To tread down, then, the malevolence of those who, with a deceitful show of uprightness, were laying snares for his life, he testifies that he is fortified by the defenses of God, those whom he certainly calls the companions of his joy helping him by prayer because of their common eagerness, and by the supply of the Holy Spirit, who, against the will of those men, would also open ways to him as he preached, giving grace and confidence to his words, so that he might quell the seditions that had arisen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
