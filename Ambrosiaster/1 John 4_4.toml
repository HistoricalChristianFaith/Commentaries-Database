[[commentary]]
quote='''
For it pertains to the overthrowing of fate that the dead have risen; that the eyes of a man born blind have been restored; that the sick and paralytics have been strengthened; and the other things that have been done, so that, for those who flee to God, whatever there may be of fate cannot bring any hindrance. For the apostle John says: “He who is in us,” he says, “is greater than he who is in this world” (1 Jn. 4:4). For when he is pleaded, God even removes what he has decreed. For he certainly decreed that sinners should be punished, and yet he forgives those who plead to him; because to him alone it is permitted to bind and to loose.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 115: CONCERNING FATE"
