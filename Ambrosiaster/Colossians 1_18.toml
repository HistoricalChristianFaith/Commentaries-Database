[[commentary]]
quote='''
And he is the head of the body of the Church, who is the beginning, the firstborn from the dead; that he himself may be holding the primacy in all things. Christ is the head of the Church, provided that all, heavenly and earthly, are of one mind, so as to be the Church, that is, of one faith: otherwise, cut off from the head of the whole body, that is, separated from their Creator, they rave in a kind of madness and vanity. Who is the beginning, the firstborn from the dead; that he himself may be holding the primacy in all things. Since all things exist through him, the things that through some negligence had been made perishable had to be re-formed through him once more; lest it should redound to his injury if his work had been restored by another; so that, as he was born before all, so again he should be the first before all from the resurrection of the dead, the former life being restored; for he was born of God before all things, so as to create all things, which were not. But again, having taken flesh, he was born of a virgin, so as to abolish the sin which had entered the world from the virgin Eve. Born, then, and having died, he rose again, so that what he had made at first he might afterwards create anew; because through error they had become as it were dead; so that in all life he might always be first and prince.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
