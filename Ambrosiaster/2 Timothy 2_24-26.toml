[[commentary]]
quote='''
But the servant of the Lord must not quarrel, but be gentle towards all, teachable, patient, modest, correcting those who think otherwise: if at some time God may give them repentance unto the knowledge of the truth, and they may come to their senses out of the snares of the devil, by whom they are held captive by him at his will. These things need no interpretation; for they are plain. Yet he has declared how much modesty profits; for if this is approved in certain heretics, because they seem humble, how much more praiseworthy and fruitful will it be in a catholic, if he is gentle, in whom both a useful understanding and a gravity worthy of imitation are perceived!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
