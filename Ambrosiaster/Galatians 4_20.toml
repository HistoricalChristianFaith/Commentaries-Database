[[commentary]]
quote='''
But I would wish to be present with you now, and to change my voice; for I am confounded in you. He wishes to rebuke them in person, so as to change his voice from praise of them to censure, so that they might be confounded in a twofold way, both by their own error and by the shame of the Apostle, which he suffered before those to whom he had preferred them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
