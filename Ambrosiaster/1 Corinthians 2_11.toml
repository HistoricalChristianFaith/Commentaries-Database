[[commentary]]
quote='''
For who among men knows the things that are of a man, except the spirit of the man, which is in him? It is manifest that our thoughts are known by no one except by our own mind, which he called spirit. Finally, in the Gospel, among other things, it says thus: And her spirit returned to her (Luke 8:55).

So also the things that are of God no one knows, except the Spirit of God. This Spirit of God has taught us what he knows by nature, not by being taught; and he has taught us about the mystery of Christ; for he is not only the Spirit of God, but also of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
