[[commentary]]
quote='''
But if, seeking to be justified in Christ, we ourselves too are found sinners, is Christ then the minister of sin? Far from it! How can Christ be the minister of sin, who forgives sins? Therefore, Far from it, he says. But if, wishing to be justified through the faith of Christ, we serve the Law, we profess that we are under sin; because faith draws a man out from the Law, that he may be righteous. Therefore, if we give ourselves to the Law, we are found sinners; because those who are under the Law are under a curse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
