[[commentary]]
quote='''
I rejoice that in all things I have confidence in you. He was glad not only at their good will, but also at the good works by which they were amending the sins they had committed. Therefore, in all things, he says, I have confidence in you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
