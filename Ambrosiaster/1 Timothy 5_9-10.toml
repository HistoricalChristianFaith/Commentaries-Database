[[commentary]]
quote='''
Let a widow be chosen not less than sixty years old, who has been the wife of one husband, having testimony in good works, if she has brought up children, if she has received guests in hospitality, if she has washed the feet of the saints, if she has ministered to those suffering affliction, if she has followed every good work. If a widow is commended by the prerogative of past works, he teaches that she is to be chosen; for by the judgment of the Lord her name is entered in the ecclesiastical records, since her former life declares her worthy. For, steeped in divine services and wearing away her life in them, she is to be received into the bosom of the Church, to which she long ago vowed herself in lawful services.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
