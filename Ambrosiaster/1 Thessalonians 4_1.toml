[[commentary]]
quote='''
For the rest, therefore, brothers, we ask you and entreat you in the Lord Jesus that, as you have received from us how you ought to walk and to please God, as indeed you do walk, you may abound the more. This is what I said above, that to heap up his joy he wishes them to grow in good works according to the apostolic commands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
