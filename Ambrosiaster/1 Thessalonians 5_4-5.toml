[[commentary]]
quote='''
But you, brothers, are not in darkness, that that day should overtake you like a thief; for you are all sons of light and sons of the day: you are not of the night nor of darkness. By darkness he signifies ignorance and falsehood, but by the day knowledge and truth. Therefore he says that Christians are not in darkness, but that Gentiles or the unbelieving Jews are sons of darkness, because they are worshippers of falsehood. Wherefore he signifies that the faithful ought to be secure, because they are not ignorant of the future coming of the Lord, but await it anxiously, that it may come. But those who are ignorant, distrusting it, it will suddenly overtake off their guard, and will kill them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
