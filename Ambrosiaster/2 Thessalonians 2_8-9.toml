[[commentary]]
quote='''
And then that wicked one will be revealed, whom the Lord Jesus will kill with the spirit of his mouth, and will destroy with the brightness of his presence: whose coming is according to the working of Satan, in all power, and signs and portents of falsehood. He says that the Antichrist will appear after the failing of the Roman kingdom, as has been mentioned. For in the last time the devil, knowing that his destruction is at hand (and, as the Roman kingdom fails, he too will be sent down from the heavens, cast out upon the earth, as is said in the Apocalypse of the apostle John), will suborn for himself one in whom and through whom, performing certain signs of power by the permission of the just God, he may commend himself, so as to be worshipped as though he were God. For he will imitate God, so that, just as the Son of God, born or made man, demonstrated his divinity by signs and powers, so Satan too will appear in a man, so as to show himself God by powers of falsehood, as was said above. And this is the revelation of the mystery of iniquity: when the Antichrist has appeared, he will be recognized to be, as it were, the God of those whom formerly the common people worshipped as gods at his nod, he himself being the first or highest of them, which he will make credible by the powers of his signs. And he spoke of portents of falsehood for this reason, because he wishes himself to be believed through signs to be what he is not, so as to deceive those whom he is going to ensnare; and this has been foretold to the saints so that they may know what to beware of.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
