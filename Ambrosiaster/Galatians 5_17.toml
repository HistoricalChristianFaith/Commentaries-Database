[[commentary]]
quote='''
HOW ARE WE FREE IN CHOICE AND WILL, WHEN THE APOSTLE SAYS, “THE FLESH DESIRES AGAINST THE SPIRIT, AND THE SPIRIT AGAINST THE FLESH, SO THAT YOU DO NOT DO THE THINGS THAT YOU WOULD” (Gal. 5:17)? AND IF THE FLESH DESIRES AGAINST THE SPIRIT, IT IS EVIL. FOR THE SPIRIT SUGGESTS WHAT IS GOOD. — Do not understand “flesh” here as the substance of flesh, but as evil deeds and unbelief signified under the name of flesh. For since all error comes from visible and worldly things, and the flesh is akin to them, because it is composed of elements, he calls every error “flesh.” He calls not only adulteries, fornications, and lusts the works of the flesh, but also idolatry, sorcery, blasphemies, and such things. Does the flesh compel to blasphemy or to idolatry? Are not these vices of the soul, when it consents to error? Yet he rightly says to those who act correctly that they are not in the flesh, but in the spirit. And yet they are in the body for this very purpose. Therefore, whoever walks well and does not despair of the hope of the faithful, though placed in the flesh, is said not to be in the flesh; but one who lives badly and is blasphemous is said to be in the flesh and to be flesh. For just as those who act well are spiritual even with the flesh, so those who live badly are carnal even with the soul itself. This is what he calls it. This error, then, which he calls flesh, desires against the spirit, that is, it suggests evil things against that same spirit, which is the law of God. For he introduces two laws, that of God and that of the Devil. Therefore he says “spirit” because the law of God is spiritual, to resist the flesh, that is, to resist the vices, so as to preserve a person for God; but the law of the Devil, which is error, opposes through the allurements of lust and the sweetness of worldly things. With these in conflict, the human being is in the middle: when he consents to the spirit, the flesh does not want it; but when he gives his hand to the flesh, he spurns the spirit, that is, he despises the law of God. Therefore, when he consents to the flesh, the spirit calls him back so that he does not do what he wishes; but when he agrees to the spirit, the flesh urges him not to do what he thinks beneficial. Yet the spirit rightly and sensibly resists and calls him back, so that it may snatch the person away from the counsels of Satan. But the flesh, which is the opposing law, therefore urges and resists the spirit of the law in order to deceive through trickery. The Apostle therefore proclaims this so as to show to human choice to which side it should commit its will, not to empty the freedom of choice, but to teach the will to which it should join itself. If, however, there were no freedom of will, neither the law of the Devil, which is the flesh, nor the law of God, which is the spirit, by opposing one another, would press a person with their counsels. For whoever entices, persuades; and whoever persuades does not use force, but ensnares; and the one who is ensnared has his will changed by certain deceits. But if there were no free will, a person would, against his will, be dragged to those things which he does not want.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 61: HOW ARE WE FREE IN CHOICE AND WILL"
