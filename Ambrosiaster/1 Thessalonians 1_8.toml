[[commentary]]
quote='''
For from you the word of the Lord has been spread abroad, not only in Macedonia and in Achaia, but your faith, which is toward God, has also gone forth into every place. This is like that saying to the Romans, when he says: That your faith is proclaimed in the whole world (Rom. 1:8). But in these there is more; for not only their faith, but the work of their faith has reached every place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
