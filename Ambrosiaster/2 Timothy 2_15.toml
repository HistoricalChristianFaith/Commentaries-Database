[[commentary]]
quote='''
Take careful heed to yourself, so that you show yourself approved to God, a workman not shameless, rightly handling the word of truth. Since there are some who say that contention benefits the hearers, but the Apostle, knowing that it rather harms them, gives this command: that each should take care to make himself approved by spurning altercation; and he calls shameless those who strive by contentions. For contention necessarily wrests out something, indeed many things that are said against conscience; so that a man loses inwardly in his mind while he goes away outwardly a victor. For no one allows himself to be beaten, even if he knows that what he hears is true: but he handles the word rightly, and with a good conscience, who speaks to the willing and the peaceable. There ought, then, to be conference among the servants of God, not altercation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
