[[commentary]]
quote='''
By revelation the mystery was made known to me, as I wrote before in brief, as you are able, reading, to understand my prudence in the mystery of Christ. He signifies that the revelation of the mystery of God was shown to him, about which he recalls that he wrote briefly before, that is, in measured fashion, as they were able to grasp the prudence of the Apostle in the mystery of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
