[[commentary]]
quote='''
But if they wish to learn anything, let them ask their husbands at home; for it is shameful for women to speak in the church. It is shameful, because it is against discipline that in the house of God, who commanded them to be subject to their husbands, they should presume to speak about the Law, since they know that there men hold the primacy, and that it is more fitting for them to give themselves to prayers in the house of God, holding their tongue, and to open their ears, so as to hear how the mercy of God conquered through Christ the death which reigned through them. For if they dare to speak in the church, it is a disgrace; because they are veiled for this reason, that they may appear humbled; but they show themselves immodest, which is also a reproach to their husbands; for in the insolence of wives the husbands too are branded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
