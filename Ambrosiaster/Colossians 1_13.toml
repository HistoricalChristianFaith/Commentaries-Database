[[commentary]]
quote='''
For, freed from the condition of darkness, that is, rescued from the underworld, in which we were held by the devil as much through our own offence as through the offence of Adam, who is the father of all who sin, we have been transferred through faith into the heavenly kingdom of the Son of God; so that God might show us with what love he loves us, when, raising us from the depths of Tartarus, he brought us into the heavens with his true Son. For now all believers who are devoted with a fixed mind, on departing from the world, are brought into the heavens with the Angel of the Father's right hand as their guide, which was not granted before death was vanquished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
