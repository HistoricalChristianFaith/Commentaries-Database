[[commentary]]
quote='''
Let no one deceive himself: that is, let no one think that he benefits himself by his own, or by human, counsel. He returns to the earlier sense: If anyone among you seems to be wise in this age, let him become foolish, that he may be wise. He says this because, if anyone understands the promised salvation and the mystery of the incarnation of our Lord Jesus Christ, let him become foolish, that is, let him flee the wisdom of the world, so that he is judged foolish by it, and then he will be prudent; for he who is foolish to the age is prudent to God, while he believes that God has done what the reasoning of the world does not grasp, as I recalled above. But the false apostles, wishing to seem prudent in the world, preached neither that God has a Son, nor that the incarnation was true, nor that the flesh can rise again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
