[[commentary]]
quote='''
It is therefore certain that He did not go up to the feast day. But for the Savior, that was the feast day on which by His Passion He redeemed the world. Finally, He says: Now is the Son of Man glorified, and God is glorified in Him (Jn. 13:31). This is His feast day, on which He conquered death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 78: ON THE SAVIOR SAYING HE WOULD NOT GO UP TO THE FEAST, THEN GOING UP"
