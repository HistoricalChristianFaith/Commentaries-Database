[[commentary]]
quote='''
I planted, Apollos watered, but God gave the increase. To plant is to evangelize and to draw to the faith; to water is to baptize with the solemn words; but to forgive sins and to give the Spirit belongs to God alone. If, then, God gives the effect of salvation, there is no glory for man in this matter (Acts 2:4). For we know both that the Holy Spirit was given by God without the laying on of hands (Acts 10:44), and that one who was not baptized obtained the remission of sins. Was he not baptized invisibly here, when he obtained the gift of baptism?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
