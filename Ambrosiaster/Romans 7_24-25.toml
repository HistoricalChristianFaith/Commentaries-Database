[[commentary]]
quote='''
Paul calls the man unhappy because he is born under sin. Is not man truly unhappy, who has come into this inheritance of transgression, having sin as an enemy with him, through which Satan has access to him? For Adam constructed steps by which the despoiler ascends to his sons, unless the most merciful Lord, moved by mercy, had given His grace through Christ; so that the human race, lifted up by the reception of the forgiveness of sins, might from then on be able to recover its senses, with sin repressed and condemned. For once lightened of evils and purified, he can resist the adversary, having received power against him, while he is helped by God. Here he introduces, as it were, a third law of faith, more powerful, which he also calls grace: which nevertheless has its origin from the spiritual law; because through it man is set free, so that since Moses gave the law, and the Lord also gave the law, they may be called two; yet one is understood, as far as meaning and providence are concerned. For that is the initiator of salvation, but this is the perfecter. But I do not mean that part of the law which is in new moons and in circumcision and in foods, but that which pertains to the mystery of God and to discipline. Therefore by the grace of God through Christ man is freed from the body of this death. He calls that death the one that he showed above as found in the killing of man through sin in the underworld, which is called the second death: but the body of death is all sins; for many are one body, the individual sins as it were members, found under one author, from which man, snatched away by the grace of God through baptism, has escaped the aforesaid death. For since he is placed in a fleshly body, he would not say that he has been snatched away from that very body: but he called this the body which above he signifies is destroyed through baptism and the observance of the Law. For when he says: From the body of death, he shows that there is another body that is not of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
