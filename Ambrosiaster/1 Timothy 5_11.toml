[[commentary]]
quote='''
But avoid young widows; for when they have spent their life in delights, they wish to marry in Christ. He forbids young widows to be received into this profession, for faith ought not readily to be placed in a slippery age; especially since the examples of certain women go before, who after their profession, through the allurement of a life of delights, have the name, not the works, of widowhood, and having turned back are enticed by marriages. For he who thinks that he leads a life in delights in Christ by no means remains innocent; for luxury draws him to its own members, so that he is made subject to sin; for delights are the doors of sin. For it is not unknown where he is heading who loves a dissolute life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
