[[commentary]]
quote='''
For who distinguishes you? That is, there are some who, receiving more in baptism or in teaching, say that the rest have obtained less. He says this to those who thought that, being baptized by others, they were something more: by whose eloquence they were seduced, so that through a certain disguise they thought perverse things right. For there was such great discord among the people that there were many factions of different parties; and so the Apostle fitted all his words to all the parties without making names manifest, so that when the epistle was read, each party might take up what was said to it, hearing what it recognized was aimed at its own case.

For what do you have that you have not received? He says that the man has obtained no good from the others beyond what he had received from him, and that he therefore complains in vain; for what they had, they had received from the Apostle. He seems to speak to one person, because he is speaking to a part of the people.

But if you have received, why do you glory as if you had not received? Those who, as it were, insulted the Apostle did this through inexperience: hearing the same things which they had already learned from the Apostle, they made him void and gloried in the teaching of these men; for, commended by their eloquence, these turned the glory of the preaching to themselves. The Apostle, on the other hand, wished to appear contemptible, provided that he made the glory of God acceptable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
