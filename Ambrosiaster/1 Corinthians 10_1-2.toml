[[commentary]]
quote='''
For I do not want you to be ignorant, brothers, that our fathers were all under the cloud, and all passed through the sea, and all were baptized in Moses in the cloud and in the sea (Exod. 13:21; 14:22). By the example of the Jews, who gave offense through their own negligence (Num. 9:22), he wants us to be careful; and therefore he says that they were under the cloud, because all the things that were done were done as a figure of us, so that they had the image of our truth. For, covered by the cloud and kept safe from their adversaries, they are said to have been baptized while they were freed from death. For when those, that is, the Egyptians, had died in the sea, while these, with Moses as their leader, crossed over happily, they were snatched from death: which is what baptism provides. For their past evils were not imputed to them, but, purified through the sea and through the cloud, they were prepared to receive the Law, and the form of our future mystery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
