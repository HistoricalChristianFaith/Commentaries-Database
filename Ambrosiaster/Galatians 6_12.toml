[[commentary]]
quote='''
All who wish to please in the flesh, these compel you to be circumcised, only that they may not suffer persecution for the cross of Christ. To please in the flesh signifies to please men. For, so that they might live with the Jews favorable, or at least not hostile, those whom he calls false apostles preached Christ in such a way as to teach that the law also must be kept: which the Apostle never feared, but steadfastly did not keep silent about what is true, providing both for himself and for those whom he taught. Indeed: I, he says, am ready not only to be bound, but also to die in Jerusalem for the name of our Lord Jesus Christ (Acts 21:13).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
