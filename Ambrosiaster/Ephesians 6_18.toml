[[commentary]]
quote='''
Praying with all prayer and supplication at every time, in the spirit, and watching thereunto with all perseverance and entreaty for all the saints, and for me; that speech may be given me in the opening of my mouth to make known openly the mystery of the Gospel, for which I discharge an embassy in a chain; that in it I may use open freedom, as I ought to speak. If we conduct ourselves rightly, the Holy Spirit remains in us, and we can obtain what we ask. This, then, is to pray in the spirit at all times: to direct prayer to God with a clean conscience and whole faith. For he prays in the flesh who prays with a polluted mind, intending to sin again, not by chance or by being taken unawares, but on purpose. But it is possible not to sin unto death, if one prays perseveringly; so that the soul, with diligent mind, may always be intent on the Law of God, meditating day and night on the things that God loves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
