[[commentary]]
quote='''
For what is our hope, or joy, or crown of glory? Is it not you, before our Lord Jesus Christ at his coming? For you are our glory and joy. It is plain that the perfection of the disciples is the joy and crown of the teacher. For these are the ones who will bring forth the labors of their fruits; for the teacher's fruit is an obedient disciple, whose good way of life, while it profits the teacher, brings forth the labor of his fruit. For the labor of the disciple in good work gives a crown to the teacher, with Christ as judge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
