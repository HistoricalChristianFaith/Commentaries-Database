[[commentary]]
quote='''
Fornication is actually heard of among you, and such fornication as is not even among the Gentiles. To show how grave this sin is, he said that it is not committed even by those who do not know God; so as to show accordingly with what penalty this man ought to be punished, who, though placed under eternal and divine righteousness, had committed the crime of so great a wickedness.

So that someone has his father's wife. He disclosed the kind of crime mentioned before, so as not only to make him openly guilty of death, but also to show that those who adhered to him were not free from the crime; for a sin that is rarely committed makes one the more guilty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
