[[commentary]]
quote='''
Bearing fruit and growing in the knowledge of God, taking strength in all power according to the might of his glory unto all patience and long-suffering, with joy giving thanks to God and the Father, who has called you into a share of the lot of the saints in light, who has delivered us from the power of darkness, and transferred us into the kingdom of the Son of his love. He wants the increase of their works to come about with knowledge, so that they may not be ignorant of the hope of their faith; for they are firm and stable then, if they consider what has been promised for faith, and how great the might of the glory of God's majesty is in patience: that he bears with the human race in long expectation, though by its irreverence it not only neglects the Creator but even persecutes those who love him; so that they too may likewise be patient, so as to bear the reproaches and curses of the unbelievers, or, if affliction is brought upon them, await the judgment of God without doubting of it, but rather rejoicing in the promised life, with thanksgivings to God, who deigned to call the Gentiles and to bring them into the promise of the Jews, which is eternal light, that is, eternal life, everlasting truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
