[[commentary]]
quote='''
Nor seeking glory from men, neither from you nor from others; though we could have been a burden to you, as apostles of Christ. He weighs down the case of the false apostles so far as to say that he refuses, though it was lawful for him to require services, in order to repress those who had neither ability nor shame, and yet demanded honor for themselves; for they wished to commend themselves rather than the teaching of God. But the Apostle, who sought glory not in the present but in the future, made himself humble, so that the preaching of God might be exalted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
