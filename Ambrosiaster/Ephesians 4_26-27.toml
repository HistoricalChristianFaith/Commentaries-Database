[[commentary]]
quote='''
Let not the sun go down upon your wrath: do not give place to the devil. He wants anger to pass and not to be kept in the breast, so that, having arisen in the day, it may fall with the day; because if it remains in the mind, it gives the devil occasion for boasting. For it is inevitable that an angry mind thinks evil things, which is what the devil desires; for he finds a mind prepared for evil, and inserting himself into it, he deceives by his own impulse a man made for life; because to think belongs to man, to carry out belongs to the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
