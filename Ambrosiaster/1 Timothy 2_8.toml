[[commentary]]
quote='''
I will therefore that men pray in every place, lifting up holy hands without anger and disputing. He admonishes that there ought to be a peaceable mind in prayer, so that the prayer may be brought to effect; for hands are holy when the heart is clean. Yet he commands that one pray in every place in such a way that a fitting place be understood, certainly not an unsuitable or filthy place; since indeed the Lord forbids praying in public: but he admonishes this, lest they think that one should pray only in the church (Matt. 6:5–6).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
