[[commentary]]
quote='''
IF THE LAW AND THE PROPHETS WERE UNTIL JOHN, HOW IS IT THAT THE SAVIOR SENDS THE LEPER TO THE PRIESTS TO HAVE OFFERINGS MADE FOR HIS CLEANSING (Matt. 8:4; Mark 1:44; Luke 5:14)? — This was done not because of the time, but for the condemnation of the Jews: so that when they did not understand that the summit of truth, belonging to a better time, had been established for the gain of their salvation, Truth might bend down instead to their accusation. For since they regarded the Savior as an enemy of the Law, because for the sake of mercy he wished to free them from the burden of the Law, just as had been foretold by the prophet Jeremiah, for he says among other things, “And I will give them a new covenant, not like the one I gave to their fathers” (Jer. 31:31–32), then the Savior, so that he might not appear, as they thought, to be an enemy when preaching new things, sent the man who had been cleansed from leprosy to the priests to offer gifts for his cleansing, as Moses had commanded (Lev. 14:2). And to show that this was to serve for their accusation, he said, “For a testimony to them,” so that this matter might be a witness against them in judgment, they who were saying that the Savior was an enemy of the Law. The apostle Paul followed this as well: for although he preached that circumcision was no longer necessary, he himself circumcised Timothy because of the scandal of the Jews (Acts 16:3); for he preferred to do something unnecessary rather than have an uproar stirred up by false brothers; and this in fact contributed to the Jews’ error. Enough was done for them for the moment, through which they might err forever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 60: WHY THE SAVIOR SENT THE CLEANSED LEPER TO THE PRIESTS"

[[commentary]]
quote='''
IF THE LAW AND THE PROPHETS WERE UNTIL JOHN, HOW IS IT THAT THE SAVIOR SENDS THE LEPER TO THE PRIESTS TO HAVE OFFERINGS MADE FOR HIS CLEANSING (Matt. 8:4; Mark 1:44; Luke 5:14)? — The apostle Paul followed this. For although he preached that no one ought any longer to be circumcised, he himself circumcised Timothy because of the scandal of the Jews. For he preferred to do something unnecessary rather than be a cause of offense to the unlearned, from among whom some could be saved. The Lord in a similar way, in order to remove from the Jews what they thought of him, for they said that he was an enemy of Jewish tradition, then ordered the leper to offer gifts for his cleansing, as had been commanded by Moses, and he added, “For a testimony to them”; so that this matter might be a witness against them, because the Savior was not an enemy of the Law. Therefore something was done which already ought to have ceased. But because things that are already unnecessary are usually harmless, it was done so that it might indeed benefit those who held a wrong opinion, in order that they might be satisfied that the Savior was not an enemy of the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 28: WHY THE SAVIOR SENT THE CLEANSED LEPER TO THE PRIESTS"

[[commentary]]
quote='''
WHY DID THE APOSTLE PAUL REBUKE HIS FELLOW APOSTLE PETER BECAUSE, FEARING THOSE WHO WERE OF THE CIRCUMCISION, HE WITHDREW HIMSELF FROM THE GENTILES (Gal. 2:11, 14), WHEN PAUL HIMSELF, ALSO FEARING THOSE WHO WERE OF THE CIRCUMCISION, TOOK TIMOTHY AND CIRCUMCISED HIM, SOMETHING HE WAS FORBIDDING TO BE DONE (Acts 16:3)? — Is he therefore to be rebuked as well? It is unbelievable that so great an apostle would rebuke another for something in which he knew that he himself had done. It is not right to believe that such a thing was done by so great a man; for such things belong to those who live in a carnal way. Therefore the action of the apostle Paul is free from criticism. For while he was preaching that circumcision was not necessary, yet wanting to take Timothy with him, who, although born of a Jewish mother and a Greek father, would be a scandal to the Jews if he took him, uncircumcised, as one born of a Jewess, then he submitted himself to subjection for a time, and took him and circumcised him. He did something unnecessary, with the permission of Him who had suffered. For since he was from a Jewish mother, trained from childhood in the synagogue in the sacred writings, that is, in the books of the Hebrews, he allowed himself to be circumcised in order to remove scandal from the Jews, because they had zeal for their own race. Indeed, “when Titus,” he says, “was a Greek, he was not compelled to be circumcised” (Gal. 2:3). But Timothy, because he was of a Jewish mother, as I said, the Jews did not allow to be received among the teachers while uncircumcised. The Apostle took him on for this purpose, that he might ordain him a bishop, as he did. For, being trained in the prophetic Scriptures, he was found to be a suitable teacher for asserting Christ. The apostle Peter would not have been rebuked if he had separated himself from the Gentiles according to Jewish custom, so as not to be a scandal to them. But this is what was condemned in the apostle Peter: that although he had previously lived in a Gentile manner among believing Greeks, when Jews came from James, subjected by fear, he began to teach that believing Gentiles ought to live as Jews. Therefore he hears, “If you, though a Jew, live like a Gentile, how do you compel the Gentiles to live as Jews?” For he had caused doubt concerning the discipline of the gospel: this is a crime, in that he was destroying what he had built up. Therefore the apostle Paul calls this hypocrisy; and it is clear that if he circumcised Timothy, he did not remain silent that he was doing something unnecessary because of their scandal, and that for this reason he yielded, since he had a Jewish mother. For the Jews would not have insisted, had they not found the excuse of his Jewish mother, since they could in no way disapprove this to the Gentiles, nor easily take scandal concerning those who were not of the stock of Israel. He did this, therefore, not out of hypocrisy, but under compulsion. For the cause mentioned above involved no small element of hypocrisy. For many were reproved in this matter, so that some of the Jews and even Barnabas consented to this hypocrisy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 55: WHY PAUL REBUKED PETER YET CIRCUMCISED TIMOTHY"
