[[commentary]]
quote='''
And those members of the body which we think to be less noble, on these we bestow more abundant honor. The sense is similar: that in those who are thought to be without dignity we find something to praise, as also in the meaner members we find something that pleases us more than what we find in the others. For of what honor are the hands worthy, when we hold what we want! or the feet, with which we go where we want! For this reason we too add honor to them, for example to the feet, which, because they are lowly and without dignity, we adorn with shoes. And our unseemly parts have more abundant honor. It is clear that our private parts, which seem shameful, while they avoid public view, cover themselves with seemliness, lest they should be repellent through irreverence. In like manner some of the brethren too, though they are unseemly in poverty and dress, are yet not without grace, through which they are members of our body: for they are accustomed to go about girded in a drab little garment, with bare feet. Since, then, they seem contemptible, they are the more in honor, because they are accustomed to lead a purer life. For what seems despised to men is usually judged beautiful by God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
