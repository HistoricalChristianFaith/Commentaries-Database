[[commentary]]
quote='''
That the older men be sober, grave, prudent, sound in faith, in love, in patience. He shows who are of sound doctrine, so as to indicate that those who are less sober, less grave, unbelieving, without love and impatient are disciples of unsound doctrine. For by these works God is not known, nor his righteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
