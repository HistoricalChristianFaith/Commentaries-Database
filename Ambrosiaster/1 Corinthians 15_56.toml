[[commentary]]
quote='''
But the sting of death is sin. By sting he signifies authority, because death received authority through sin; as though, if there were no sin, the devil would have grown numb, and there would be no death. But the power of sin is the law. The law is the power of sin for this reason, that sin would not be imputed if there were no law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
