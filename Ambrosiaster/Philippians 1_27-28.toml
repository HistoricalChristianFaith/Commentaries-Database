[[commentary]]
quote='''
So that whether I come and see you, or, being absent, hear of you that you stand in one spirit, of one mind, striving together with the faith of the Gospel, and not terrified in anything by the adversaries, which is to them a display of destruction, but to you of salvation. He wants them to be of one mind in faith and devotion against the adversaries, so that, when absent, he may hear the same things about them which he also saw when present; so that, fearing in nothing the threats or terrors of the adversaries, they may keep the faith, knowing that for those who are afflicted for Christ it profits unto salvation, but for those who afflict, unto perdition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
