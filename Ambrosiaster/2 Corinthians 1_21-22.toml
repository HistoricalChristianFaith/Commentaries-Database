[[commentary]]
quote='''
Yet he speaks of one work of the Father and of the Son; because he says that both Christ and God confirm. For whom the Son confirms, the Father also confirms: and when the Father gives the Spirit, the Son also gives; because the Holy Spirit is of both, as he says to the Romans: But if anyone does not have the Spirit of Christ, he is not his (Rom. 8:9). Since, therefore, he has spoken of the perfection of man, he made mention of the Trinity in this place; for the whole sum of perfection consists in the Trinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
