[[commentary]]
quote='''
WHEN SAMUEL WAS SUPPOSEDLY RAISED UP BY THE PYTHONESS, AND HE WAS SEEN BY HER AND SPOKE TO SAUL—THIS STORY IS REPORTED IN THE BOOK OF KINGS? — I consider it an unworthy deed if assent is given in accordance with the wording of the story. For how could it happen that a man holy by birth and righteous by the works of his life might be drawn by magical art? Or if he was not drawn against his will, did he give consent? To believe either of these about a righteous man is absurd. For if he was brought unwillingly, his justice has no support; but if he came willingly, he lost the spiritual merit which, being in the flesh, he had sought: which is very absurd, because whoever departs from here righteous, remains righteous. Moreover, this is a trick of Satan, by which, so that he may deceive many, he even pretends to have the good in his power. The Apostle, among other things, says, “Satan himself transforms himself into an angel of light” (2 Cor. 11:14). For, in order to cause an error in which he himself might glory, he disguised himself in the guise and name of a righteous man: so that he might lie and claim that the hope proclaimed to the worshipers of God would accomplish nothing, when he pretended that the righteous going forth from here were in his power. But some are deceived by the fact that he did not lie about the death of Saul and his sons: as though it were a great thing for the Devil to foresee the day of a body’s fall beforehand, when certain signs are accustomed to appear in those who are dying, from whom the protection of God seems to have been removed. How much more the Devil, whom prophetic oracles testify to have been exalted with angelic majesty; of whose greatness the Apostle says, “Do you not know the height of Satan?” (see 2 Cor. 2:11). What wonder, then, if he was able to foresee a death that was close at hand, since this is the very thing by which he deceives and wants to be worshiped as if he were in God’s power? For Saul, made senseless by such dullness, fled to the pythoness. Corrupted by the cause of sin, he turned himself to those things which he had condemned. But if someone, on account of the story and the things expressed in words, thinks they should not be passed over, lest the logic of the narrative be empty, he will indeed do rightly, provided he does not drag this into the realm of truth, but keeps it to sight and understanding. For Saul, having become reprobate, could not have a good understanding. The narrator described Saul’s mind and Samuel’s appearance, expressing the things that were said and seen, omitting whether they were true or false. For what does he say? When he heard in what form he had been raised up, “He understood,” he says, “that this was Samuel.” He reported what Saul understood; and because he did not understand rightly, he adored someone other than God, contrary to Scripture; and thinking it was Samuel, he worshiped the Devil, so that Satan might have the fruit of his deceit. For this he strives after, that he may be worshiped as though he were God. For if Samuel had truly appeared to him, surely that righteous man would not have allowed himself to be worshiped, he who had preached that God alone is to be adored. And how could the man of God, who was with Abraham in refreshment, say to a man of disease, worthy of the burning of Gehenna, “Tomorrow you will be with me”? In these two points the unwary Satan betrayed the subtleness of his deception, both because he allowed himself to be worshiped in the guise and name of Samuel contrary to the Law, and because he falsely claimed that a man weighed down by sins, although there is a great distance between sinners and the righteous, would be with Samuel, the most righteous. In truth, it can seem reasonable if the name of Samuel is left aside, since Saul was going to be with the Devil. For he passed over to him whom he worshiped. For the Devil, always lurking under a veil, reveals himself when he invents things that clash with the persons through whom he seeks to deceive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 27: ON SAMUEL RAISED BY THE PYTHONESS"
