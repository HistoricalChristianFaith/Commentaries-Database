[[commentary]]
quote='''
Who indeed destroyed death, and illuminated life with eternity through the Gospel, in which I have been appointed a preacher, and an apostle, and teacher of the Gentiles. He shows in what way Christ saved his people, saying that he destroyed death, which was the enemy of man, so that man could not rise again from the underworld; and then at last he illuminated life with eternity, so that one who rises from the dead can no longer die. For that life is dark which is bounded by time, while it slumbers, while it is ignorant, while it conducts itself badly. And he shows how life is illuminated: because through the Gospel eternity is given to believers, with the teacher of the Gentiles preaching it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
