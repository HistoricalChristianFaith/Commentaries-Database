[[commentary]]
quote='''
Nevertheless, because of fornication, that is, so that nothing be committed against the law, when at times what the law does not forbid is avoided; let each man have his own wife, and let each woman have her own husband. For those who seek a shortcut are accustomed to go astray. For how could it come about that these men should abstain from their wives, whom he found in such great vices? Therefore, then, he does not permit it, lest, abstaining from lawful things, they should presume upon things not granted, as the Manichaeans do.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
