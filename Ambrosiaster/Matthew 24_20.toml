[[commentary]]
quote='''
THEREFORE THE SAVIOR SAYS, PRAY THAT YOUR FLIGHT BE NOT IN WINTER OR ON THE SABBATH (Matt. 24:20); EVEN THOUGH THE TIME OF THIS PERSECUTION CANNOT BE POSTPONED, SINCE THE APOSTLE SAYS, HE WILL BE REVEALED IN HIS OWN TIME (2 Thess. 2:6, 8); AND IN THE ACTS THE APOSTLE SAYS, APPOINTING THE TIMES AND THE BOUNDARIES OF THEIR DWELLING (Acts 17:26). AND WHY DOES HE INDICATE THAT FLIGHT IS NOT ADVISABLE IN WINTER OR ON THE SABBATH? — In winter flight is not safe: for there is cold, continual rains, snow, frost, the rivers overflow; and so it is very hard for those who flee. For they cannot hide in the woods, nor in the mountains, nor in caves. But on the Sabbath, according to the Jews, it is not permitted to go far from the city, nor to climb high, and therefore one cannot flee on the Sabbath. Just as these seasons do not allow a safe flight, because of the obstacles mentioned above, so our flight will not be safe if that foretold persecution finds us bound by carnal obstacles. For worldly desires, that is, worldly possessions, hold men like shackles, so that they cannot escape the decrees of the Devil. Therefore it must be prayed that, at the time when we must flee, there may not be in us the condition of winter and Sabbath, but that the help of God may grant us to be free from these obstacles, so that there may be nothing to enslave us to the world, captured by desire for it. Since, then, the Savior was speaking of the final persecution, which is to come from the Antichrist, he therefore mentioned winter, because it is the last time; and the Sabbath likewise, because it is the last day, so that, just as in those times flight is harsh and difficult, he might signify that at that time persecutions and afflictions will be so grievous that scarcely anyone will be able to escape them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 19: PRAY THAT YOUR FLIGHT BE NOT IN WINTER OR ON THE SABBATH"
