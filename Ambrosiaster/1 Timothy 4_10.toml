[[commentary]]
quote='''
A faithful saying, and worthy of all acceptance. For to this end we labour and suffer persecutions, because we hope in the living God, who is the giver of salvation to all men, especially to the faithful. It is plainly fitting, and to be counted to our credit, to suffer persecutions for the hope which is in God; because in the present life hope is perishable, but in the promise of God it is firm and stable. For he himself is the salvation of all; because from him and through him all live, as far as the present life is concerned; but as far as the promised salvation is concerned, the faithful. For to those who know him he has promised that, after this life, which is ended by death, he will give another, which will flourish in immortality. Therefore, then, he says: Especially to the faithful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
