[[commentary]]
quote='''
The Apostle did not found the Ephesians in the faith, but confirmed them, having suffered many evils for them at the hands of the faithless, as he says: For if, according to man, I fought with beasts at Ephesus, what does it profit me, if the dead do not rise (1 Cor. 15:32)? And since he foresees that his struggle is not without effect for their perfecting, rejoicing in them, he exhorts them in writing to better things from his custody in the city of Rome; for, coming from Jerusalem in custody, he is understood to have lived under a surety, remaining outside the camp in his own hired lodging (Acts 28:16).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
Paul, an apostle of Christ Jesus by the will of God, to all the saints who are at Ephesus, and to the faithful in Christ Jesus. He writes in his usual manner, for he testifies that he is an apostle of Christ Jesus by the will of God. He writes not only to the faithful but also to the saints, so that they may be truly faithful only if they are saints in Christ Jesus. For a good life profits, and is believed holy, only if it is lived under the name of Christ; otherwise it will be a defilement, because it tends to the injury of the Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
