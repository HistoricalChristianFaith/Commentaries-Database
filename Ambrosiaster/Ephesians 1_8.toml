[[commentary]]
quote='''
According to the riches of his grace, which has superabounded in us in all wisdom and prudence. He adds to grace; because after the benefits mentioned above comes the gift of wisdom and of prudence in spiritual things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
