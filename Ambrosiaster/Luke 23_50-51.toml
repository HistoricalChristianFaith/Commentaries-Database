[[commentary]]
quote='''
THE SAVIOR SAYS, IF ANYONE HAS NOT LEFT ALL THAT HE HAS, THAT IS, HOUSE, AND FIELD, AND THE REST, HE CANNOT BE MY DISCIPLE; AND ON THE OTHER HAND THE EVANGELIST SAYS: JOSEPH OF ARIMATHEA CAME, A RICH MAN, WHO WAS ALSO HIMSELF A DISCIPLE OF JESUS, WAITING FOR THE KINGDOM OF GOD (Luke 14:33 and 23:50–51). HOW IS IT THAT THE EVANGELIST ACKNOWLEDGES HIM AS A DISCIPLE WHOM THE SAVIOR DENIED? FOR ZACCHAEUS WAS RICH, AND CORNELIUS THE CENTURION WAS RICH, AND THE WOMEN WHO MINISTERED TO THEM OUT OF THEIR MEANS WERE RICH. — The Apostle resolves this point briefly, saying: Those who have, let them be as though they had not; and those who use this world, as though they did not use it; and those who buy, as though they did not possess (1 Cor. 7:30–31). Whoever therefore has these things in such a way as if he did not have them, seems to have renounced them. For when he does not rely on them, nor boast himself because of them, but walks humbly, not only in appearance but also in mind, understanding himself to be a steward and minister of these things, he seems to have left all that is his. For that is said to be left which departs from desire and has no appeal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 27: ON WHETHER THE RICH CAN BE DISCIPLES"
