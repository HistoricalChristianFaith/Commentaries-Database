[[commentary]]
quote='''
The first man from the earth, earthy; the second man from heaven, heavenly: as is the earthy, such are the earthy also; and as is the heavenly, such are the heavenly also. The first man, Adam, is from the earth, temporal, and death succeeds to him: the second man, Christ, is from heaven, who, having risen, knows not how to die:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
