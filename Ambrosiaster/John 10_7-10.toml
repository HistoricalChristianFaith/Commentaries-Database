[[commentary]]
quote='''
WHAT IS IT THAT THE SAVIOR SAYS, “I AM THE DOOR; THOSE WHO CAME BEFORE ME ARE THIEVES AND ROBBERS” (John 10:7–8)? THIS STATEMENT SEEMS TO STRIKE AT THE PROPHETS. — Because no one goes to God the Father except through faith in Christ, therefore the Savior calls himself the door of the kingdom of heaven. If, then, he uses the word “door,” what need was there for him to speak about those who came before, “As many as came before me,” (Jn. 15:30) when no question was being raised about people of the past, but rather, as a door now present, the concern would naturally be about those of the present? The Savior is speaking about the Jews, who thought they could enter the kingdom of God not through faith, but through the righteousness of the Law. Those who came before the Savior, that is, who stood before him, mocked him and opposed him, so as to turn others away from faith in him. Therefore they are called thieves and robbers. For these words were spoken at the time when the Pharisees were disputing with the man who had been born blind and enlightened, whose eyes the Savior restored when nature had refused them, whom they wished to turn away from faith in the Savior, saying that it was not through him that one could enter, because he violates the sabbath, but through the righteousness of the Law that one enters the kingdom of God. Then the Savior said: “I am the door; if anyone enters through me, he will find pasture; but if anyone seeks to enter by another way, that person is a thief and a robber.” (Jn. 10:9-10) How does this apply to the person of the Prophets? Did the Prophets say, against the teaching of Christ, that through the righteousness of the Law, without faith, one could win God’s favor, those Prophets who knew that Christ would come in the flesh? He said this, then, about those present, so that whoever were before him, standing or sitting, might be understood as thieves and robbers. For by calling the man who had been blind, they wanted to turn him away from faith in the Savior, saying: “Give glory to God; we know that this man is a sinner.” But he refuted them, saying: “From the beginning of the world it has never been heard that anyone opened the eyes of a man born blind; if this man were not from God, he could do nothing” (John 9:24, 32–33). It is therefore about this man, because he persevered in faith, and about those who said, “These are not the words of one who has a demon; can a demon open the eyes of the blind?” that the Savior said, “But the sheep did not listen to them” (John 10:8–9, 21), meaning those whom he called thieves and robbers. For how could the sheep not have listened to the Prophets, when Scripture clearly shows that all good people obeyed the Prophets, and evil people the false prophets?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 34: ON 'I AM THE DOOR' AND THOSE WHO CAME BEFORE"
