[[commentary]]
quote='''
There are both heavenly bodies and earthly bodies, but the glory of the heavenly is one, and that of the earthly another. The heavenly bodies are those of the risen, but earthly ones are those before they die or rise; so that, since Christ is heavenly, bodies are called heavenly from him, but from Adam, because he is earthly, bodies are called earthly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
