[[commentary]]
quote='''
Food for the belly, and the belly for foods; but God will destroy both it and them. The destruction of the belly is when the function of eating ceases; and the destruction of food will come then, when birth has come to a stop. But the false apostles, who went about not, indeed, for the sake of religion but for gain, did not wish to be bitter to those who sinned.

But the body is not for fornication, but for the Lord. Now he returns to the earlier sense: And the Lord for the body. What is the Lord for the body? It is understood: he will grant it immortality when it has been raised; for the body dedicated to God will be rewarded with a spiritual gift by the merit of its leader, that is, of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
