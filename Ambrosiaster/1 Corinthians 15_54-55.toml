[[commentary]]
quote='''
But when this mortal has put on immortality, then will come to pass the word which is written: Death is swallowed up in victory. Where, O death, is your victory? where, O death, is your goad? For after the resurrection of the ungodly and of sinners there will be swallowed up death in victory. For they are the words of one who exults over him, saying: Where, O death, is your victory? where, O death, is your sting? For the victory of conquered death is the resurrection of the dead: and death is the devil, over whom the triumph is raised; and he is called contentious, because through pride, though he was unequal in strength, he kept resisting. When, then, overcome, he is destroyed and the spoils are stripped from him, wrath is vented on him who fought against him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
