[[commentary]]
quote='''
Among whom are Hymenaeus and Philetus, who have strayed from the truth, saying that the resurrection has already taken place, and have subverted the faith of some. Now he has disclosed the names of those very men on whose account he warns that contentions are to be avoided, whom he marked out as both profane and impious, straying from the truth; for they denied that which is the chief point of Christians, that they believe they will rise from the dead in the future. And these men, as we are taught from another Scripture, said that the resurrection takes place in their children; and they did not lack one who gave perverse assent, against the faith which he had obtained at the beginning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
