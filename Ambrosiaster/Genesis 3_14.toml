[[commentary]]
quote='''
WHETHER, WITH THE WOMAN, A SERPENT SPOKE ACCORDING TO ITS NATURE, OR WHETHER THE SERPENT, ACTUALLY MEANING THE DEVIL, DECEIVED HER? — As far as the historical account is concerned, the serpent is called such by nature, being said to be wiser than all the other beasts that the Lord God had made upon the earth. Indeed, God even pronounced a sentence upon the serpent. For what wonder is it if the Devil was wiser than the beasts, of whom the Apostle says among other things, “Do you not know the depths of Satan?” (2 Cor. 2:11). Moreover, it was so truly a serpent by nature that it was told, “Upon your breast and belly you shall crawl, and dust you shall eat all the days of your life” (Gen. 3:14). These things are far removed from the condition of Satan, because he is neither bodily nor mortal. And if the sentence is considered in itself, it will be seen that the sentence given has not harmed the serpent: rather, it was commanded to remain in that state in which it was made. For since it was made a servant of Satan for the overthrow of man, to whom God had subjected all things, God, in that very subjection in which He had subjected all things to man, repressed the pride of the serpent, by which it had begun to be the agent of arrogance. For man seemed to have been placed beneath the serpent, through whom, after receiving counsel, he despised the law given to him. And since serpents are wise, the Lord confirms this in the Gospel, saying, “Be wise as serpents” (Matt. 10:16). Therefore, since it is clear that a true serpent spoke with Eve, what remains is to discern whether it could have been so wise and cunning as to deceive her by trickery. For if it was more wise than the other beasts, it was not, however, more wise than human beings, since no animal is rational except man. Therefore it is impossible that the serpent itself devised such subtlety: although it is called wise, it is not so beyond its nature. For it does not deliberate or devise or take counsel. Therefore, that it was the Devil who through the serpent bypassed the woman is beyond doubt. By associating himself with the serpent, he acted through it as through an instrument, so that the woman would not recognize the hidden deceit of the Devil, knowing that the serpent was wise. And therefore, though the sentence was given in a bodily form, it fell spiritually upon Satan, because a sentence holds the guilty party. For the sentence was not given by man, who might perhaps destroy an innocent person through error or ill will, but by God, who certainly cannot be deceived, so that His sentence binds only him who is guilty. Since Satan is invisible, yet worked his deceit bodily, the sentence appears to have been given bodily, so that it might spiritually bind him whose deed brought about the pronouncement of the sentence. For Satan, having been cast out from the most sacred dwellings of heaven, thrashes upon the earth, always groaning in utmost shamelessness. But it may perhaps be asked, In what language do you think the serpent spoke to the woman? Surely with the serpent’s own mouth. For even today there are people who understand the barking of dogs, the howling of wolves, the trumpeting of elephants, and the crowing of roosters; why then could not the still unrefined woman know and understand the hissing of serpents, since we know many people who can distinguish the voices of birds? And it is also certain that the Devil uses the tongue of that body into which he has entered; otherwise he could not have deceived the woman. And therefore, he spoke through the serpent with the serpent’s mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 31: WHETHER A SERPENT OR THE DEVIL DECEIVED THE WOMAN"
