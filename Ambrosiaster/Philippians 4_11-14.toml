[[commentary]]
quote='''
I do not speak as if on account of want; for I have learned to be sufficient in the things in which I am. I know both how to abound and how to be humbled (everywhere and in all things I have been instructed), both to be filled and to hunger, both to abound and to suffer want: I can do all things in him who strengthens me. He testifies that he rejoices in this work of theirs not for his own sake, but that, with God's help, he is content above all with their own progress; so that he would neither be saddened by want nor exult in abundance, knowing that abundance often lifts a man up, and want endured acquires heavenly riches. Yet he declares that their works toward him were kind; for it was of benefit to the necessities of many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
