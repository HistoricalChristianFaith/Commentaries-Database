[[commentary]]
quote='''
So that, on the contrary, you should rather forgive and console him; lest perhaps one such as this be swallowed up by more abundant sorrow. He commands that help be given to a man afflicted on account of his own sin; because repentance, if it comes from a true heart, that is, if one who is rebuked grieves in his heart at once, immediately bears fruit. Accordingly it is found in the Book of Kingdoms that Ahab, when the prophet had reproved him, being moved in heart, at once obtained pardon (1 Kings 21:29). And David, when he was rebuked in the matter of Uriah the Hittite, because he acknowledged that he had sinned, had his offense blotted out (2 Sam. 12:13). So too the Apostle orders that the man who had committed incest, having his father's wife, and who had been reproved and cast out, should, now that he grieves, be called back; lest, seeing himself, in his grief, spurned for a long time, he should despair of himself and give his mind to enjoying the world, as one who no longer had a place with God. For this is to be swallowed up by greater sorrow: to despair of oneself and turn to committing sins, weighed down by which one is swallowed up by the second death. For this is true repentance: to cease from sin from now on; for so a man proves that he grieves over himself, if he desists for the future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
