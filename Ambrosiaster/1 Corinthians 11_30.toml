[[commentary]]
quote='''
Therefore many among you are weak and sick. And many sleep. In order to prove it true that there is to be an examination of those who receive the body of the Lord, he shows already here an image of the judgment upon those who had received the body of the Lord inconsiderately, in that they were seized with fevers and infirmities, and many were dying: so that the rest might learn from them, and, terrified by the example of a few, be amended, knowing that it does not go unpunished to receive the body of the Lord negligently; and that he whose punishment has been deferred here will be dealt with more severely, because he has despised the example.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
