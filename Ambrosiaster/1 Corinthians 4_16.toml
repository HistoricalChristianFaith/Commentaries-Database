[[commentary]]
quote='''
I beseech you therefore, be imitators of me. O the benevolence of the holy Apostle, who beseeches his sons to imitate their father, that is, of his own accord begs the sick to accept medicine! Yet in these things he wishes them to be imitators of himself: that just as he suffered many deadly perils from unbelievers for their salvation and did not give way, provided that he might preach to them day and night the gift of the grace of God, so they too, abiding in his faith and teaching, should not accept the depraved inventions of the false apostles, but should resist them, despising reproaches or detractions, so as to keep their affection for their spiritual father inviolate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
