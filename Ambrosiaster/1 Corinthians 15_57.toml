[[commentary]]
quote='''
But thanks be to God, who has given us the victory through our Lord Jesus Christ. He says that the triumph of the Savior has profited us; for what the Savior did, he surely did not do for himself, but for us. Wherefore the victory is ours; for this reason he was made man while remaining God, that, conquering the devil by not committing sin, he might acquire the victory for us, who were held in death because of sin; so that the devil, conquered when Christ, who had not committed sin, was slain, might lose all whom he was holding because of sin. But in insulting man he became guilty, and so, the handwriting having been blotted out, that is, the sentence having been blotted out by which the human race was held for death, it was rescued, and souls were led into heaven; so that they might be taken from him not by power, but by righteousness, by God through our Lord Jesus Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
