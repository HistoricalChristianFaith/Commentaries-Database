[[commentary]]
quote='''
Now all these things happened to them in figure; but they were written for our correction, upon whom the ends of the ages have come. We are the ends of the ages; for these things are known to have been done then concerning their requital for this reason, that they might be an example to us, who were to be in the faith of Christ in the last age. For they were done for our benefit, so that if, through the terror of these things, we remain in the fear of God, we may receive the glory promised to them: if not, their punishment will be doubled for us; because greater knowledge of the law makes one more guilty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
