[[commentary]]
quote='''
So he shows the solicitude which he had for their salvation, on account of the glory promised by the Lord, as it was also said in the Law: Lift up your voice like a trumpet; if they hear you, you will gain their souls (Ezek. 33:5). To this the Apostle, ever solicitous, was hastening, that the glory of the salvation he had won for many might increase for him with God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
