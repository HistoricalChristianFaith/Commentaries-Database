[[commentary]]
quote='''
Nor serving images, as some of them did. Now he touches those who, reclining in the idol-temple, thought that it was not a sin. As it is written (Exod. 32:6): The people sat down to eat and drink, and rose up to play: before the idol, of course; so that those who feasted in the idol-temple should not believe themselves free from guilt. For while Moses was placed on the mountain with God, when the image of the calf had been made, after the offering, for the sake of the dedication: The people sat down to eat and drink, and rose up to play. This is self-indulgence, because, ever taking their pleasure, they were found to be unbelievers in the things of God. And therefore he instructs us not to fall into this distrust through consent to self-indulgence in the idol-temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
