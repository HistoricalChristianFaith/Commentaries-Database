[[commentary]]
quote='''
Luke, the dearest physician, greets you, and Demas. Luke was truly dearest to the Apostle, because, putting all things after, he always followed the Apostle: he who is held to have written both the Gospel and the Acts of the Apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
