[[commentary]]
quote='''
Wherefore, if food makes my brother stumble, I will not eat meat for ever, lest I make my brother stumble. He teaches that love is to be pursued to such a degree that lawful things are to be held as unlawful, lest they harm a brother. For how great an evil is it not to transgress through unlawful things, and yet to offend through those that are permitted, so that the Law is kept in unlawful things and is not observed in lawful ones, while they are eaten without consideration? For the Law permitted what it granted in such a way that there should nevertheless be a measure for men to keep. It is certainly lawful to have a wife, but if she has committed fornication, she is to be put away: so too it is lawful to eat meat, but if it has been offered to idols, it is to be rejected.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
