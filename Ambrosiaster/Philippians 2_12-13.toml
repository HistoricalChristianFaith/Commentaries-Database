[[commentary]]
quote='''
Therefore, my dearly beloved, as you have always obeyed, not in my presence only, but much more now in my absence, work out your own salvation with fear and trembling; for it is God who works in you both to will and to work according to good will. He testifies that God helps good endeavours; for he always refers all grace back to God, so that the willing is ours, but the accomplishing is God's. For who would conquer the Princes and Powers, the rulers of this darkness, the spiritual beings of wickedness in the heavenly places, except God alone, since we have them as enemies by reason of envy? For they are indignant that we are called sons of God. What he urges, then, is nothing new: but that, as usual, they be subject to the Gospel, taking care of their own way of life; for a good way of life works salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
