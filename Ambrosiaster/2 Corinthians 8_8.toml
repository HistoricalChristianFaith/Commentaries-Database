[[commentary]]
quote='''
I do not speak by way of command, but on account of the care of others, and approving the good mind of your love. It is plain that he does not command but exhorts: that they send support to those who suffer need and relieve their care, showing their good mind to God and to men, for which they will without doubt receive a reward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
