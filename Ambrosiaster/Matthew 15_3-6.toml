[[commentary]]
quote='''
Sometimes Scripture speaks in brief form, wanting things to be understood from the reasoning presented: just as in that passage where the Savior says among other things to the Jews, Why do you also transgress the commandment of God in order to establish your tradition? For God said, Honor your father and mother; and, Whoever curses father or mother, let him surely die. But you say, Whoever shall say to his father or mother, Whatever gift you might have had from me shall profit you, shall not honor his father or mother (Matt. 15:3–6). Without doubt the Savior said this in summary, so that the Jewish priests may be understood, in that, being devoted to greed, they despised the Law of God. For in sinful conspiracy they gave counsel to sons that, when they cursed father or mother, whatever they might offer as if a gift to God would dissolve the sentence previously given against those who curse: and therefore the sons, made secure, in defiance of God’s commandment despised their parents.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 16: WHY THE ANGEL WHO WANTED TO KILL MOSES WAS APPEASED BY CIRCUMCISION"
