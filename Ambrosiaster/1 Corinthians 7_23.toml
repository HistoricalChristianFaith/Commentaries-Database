[[commentary]]
quote='''
You were bought with a price; do not become slaves of men. It is true, because we were bought so dearly that we could have been redeemed by no one except by Christ, who is rich in all things. He, then, who is bought with a price ought to serve the more, so as to make some return to his buyer. Bought, then, by God, that is, by Christ, they ought not to be slaves of men. Now the slaves of men are those who subject themselves to human superstitions. The Apostle, however, recalls that which he reproved at the head of the epistle, because they were saying: I am of Paul; and another: I of Apollos (1 Cor. 1:12). Yet he has given a ground for confessing Christ as God, when he shows that the slaves of Christ are not to be called slaves of a man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
