[[commentary]]
quote='''
Does not nature itself teach you that if a man has long hair, it is a disgrace to him? This he said according to the Law; for it forbids a man to wear long hair.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
