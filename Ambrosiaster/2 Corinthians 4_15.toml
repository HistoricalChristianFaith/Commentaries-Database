[[commentary]]
quote='''
For all things are for your sakes, so that grace, abounding through the thanksgiving of many, may abound to the glory of God. God willed that no one should be a stranger to his gift: and because not all receive the word of faith, the Apostle, knowing the will of God, did not fear to suffer persecutions and dangers, provided that he preached faithfully to all, so that more might be able to believe; so that the abundant gift of God might not be diminished through the thanksgiving of a few, to the dishonor of God, but, profiting many, might overflow through the thanksgiving of many to the glory of God. How worthy of honor, then, is this man, who always exposed his life to death, so that the gift of God should not profit far otherwise than it was given? Is it not a great dishonor to one who prepares a rich banquet and invites many, if he has only a few in all?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
