[[commentary]]
quote='''
For the whole Law is fulfilled in you in one word: You shall love your neighbor as yourself (Lev. 19:18). This is written in Leviticus; it is what was said above, that the perfection of salvation is accomplished through love; for whoever does not love his brother does not love God, says the apostle John (1 John 4:20).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
