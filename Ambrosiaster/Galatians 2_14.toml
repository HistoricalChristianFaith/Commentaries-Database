[[commentary]]
quote='''
But when I saw that they were not walking by a straight way toward the truth of the Gospel, I said to Peter before all. He inveighs against Peter alone for this reason, that in him who is first, the rest might learn. If you, though you are a Jew, live like a Gentile, how do you compel the Gentiles to judaize? Now he discloses the cause of the reproof; for there would have been no error if, in the presence of the Jews, he had held himself aloof from the Gentiles, fearing a stumbling block; but here is the whole cause of the reproof: that when the Jews came from James, he not only separated himself from those with whom he had lived like a Gentile, but also compelled them to judaize, on account of his fear of those men, so that the Gentiles did not know which of these things was true. For they knew that he himself had lived with them not as a Jew; but afterwards, hearing from him that the manner of the Jews was to be followed, they certainly hesitated as to what was true. For if this was true, that they should judaize, they held him a transgressor, because he had lived like a Gentile; but if that was better and true, that they should live simply, it was the overthrow of the Gentiles through his cowardice, since, the good having been taken from them, a laborious and ineffectual thing was being handed to them. But the Apostle Paul, when he yielded for an hour, did not also urge this; rather he cried out that he was doing a superfluous and empty thing, because of the fury of the Jews. And to this thing indeed he would not have succumbed, had there not been a cause by which the audacity of very many Jews was vaunting itself. Now Timothy was the son of a Jewish woman, but of a Greek father (Acts 16:1); whence it came about that as an infant he was not circumcised according to the Law. They were lying in wait, therefore, spying out whether he would take on uncircumcised one who had been born a Jew, which they thought unlawful for the race of the Jews, seeking an occasion by which they might hold him an overthrower of the Law; for this reason he yielded for an hour to their fury.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
