[[commentary]]
quote='''
This I say, that no one may circumvent you in subtlety of speech. For though I am absent in body, yet I am with you in spirit, rejoicing, and seeing your order, and supplying what is lacking to the profit of your faith in Christ. He warns them that their understanding should not be led astray by the talk of evil men and the cunning of iniquity; because the wise of the world are eager, with a certain art and with the minutiae of disputations, to ensnare the souls of the simple; so as to draw them away, by the reasoning of worldly things, from the hope which is in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
