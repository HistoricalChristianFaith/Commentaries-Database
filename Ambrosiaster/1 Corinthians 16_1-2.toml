[[commentary]]
quote='''
Now concerning the collections which are made for the saints, as I ordered the church of Galatia, so do you also. On the first day of the week let each one of you lay by with himself, storing up whatever he will, so that the collections are not made only when I come. He commands that the collection be made on the Lord's day, just as he had also arranged for the other churches; so that on the day on which the Lord rose, his people may be gathered to the praise and glory of God, death having been vanquished: then the funds are to be gathered for the ministry of the saints, who were suffering affliction for the name of the Lord through the zeal of the Gentiles or of the Jews, who did not allow them to preach the grace of God under the name of Christ; so that they might have relief from those on whose account they are afflicted. So he bids the people be gathered on every Lord's day, and those funds be collected, as they will, for the gifts of God, and each one lay this by with himself as in a treasury; so that when the Apostle comes, it may be found prepared for necessary uses; because what is gathered little by little is not burdensome, and is found to be much.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
