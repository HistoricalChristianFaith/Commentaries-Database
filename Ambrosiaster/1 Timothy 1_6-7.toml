[[commentary]]
quote='''
But some of the Jews, ignorant of the mystery of the Law and of the prophets, that they were handed down to be kept until Christ, went astray, thinking that, once Christ had been preached, the law of deeds too, in new moons and circumcision and the distinguishing of foods, ought to be kept. Therefore he says that they turned aside into vain talk, because they wished to teach what they did not know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
