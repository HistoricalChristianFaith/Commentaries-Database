[[commentary]]
quote='''
In stripes. Often beaten by Jews and Gentiles, he did not keep silent about the grace of Christ. In prisons. Often thrown into prison, with no regard for his own safety, even there he preached the gift of God. In tumults. He was so devoted to God that not even turmoil lessened the confidence he had in God. In labors. He did not cease to labor with his own hands, so as not to be a burden to anyone, sure that this profited him before God. In watchings. He was so careful about the office entrusted to him that he did not stop even at night. In fastings. He endured fasts, sometimes voluntary, sometimes of necessity because of want, and gave thanks to God, who fed him spiritually; for he was content for this reason, so as not to be bent for the belly's sake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
