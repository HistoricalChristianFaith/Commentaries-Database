[[commentary]]
quote='''
For a bishop must be irreproachable. He describes what sort of man a bishop ought to be, so that no one should seek the episcopate unless he is faithful, and one who is able to abstain from all things contrary to it, so that he may not be unworthy of his profession. The husband of one wife. Although it is not forbidden to have a wife who is second in number, yet for anyone to be worthy of the episcopate he ought to spurn even lawful things because of the sublimity of that order itself; for he who is desirous of that see ought to be better than the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
