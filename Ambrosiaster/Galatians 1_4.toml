[[commentary]]
quote='''
Who gave himself for our sins. He shows openly that the Law is of no profit, when he says that Christ offered himself to suffer for us, to justify us, whom the Law held guilty; so that, rescued from the Law through faith in Christ, we should no longer be sinners, but, justified by a second birth, should be called sons of God. For when the human race was held in the dominion of the devil, the Savior offered himself to the devil, who was willing, so that, mocking him by the power of his might (for he wished to receive one whom he could not hold), he might take away from him those whom he held liable by an evil right. And so, having despoiled the underworld, he carried a trophy of souls to the Father, from whom are all things; which the Law certainly could not do. Although it was given to be of profit, yet when we sinned it was turned so as to become hostile; and it began to kill, not to give life. But Christ, forgiving offenses, not only gave us life but also joined us to himself, so that we are called sons of God, having been made so through faith. How great an error it is, then, to return under the Law after grace, that is, after receiving liberty to wish to be a slave; as if a man rescued from the sword, forgetful of the kindness, should sell himself again to the gladiator-trainer! For he who leaves his buyer and goes back again to his former master is his buyer's accuser. That he might deliver us from the present evil age. He says this because the Lord yielded himself to death for this reason, that he might deliver us from the error of the world, that is, that, made strangers to the understanding of this world, which, as its age grows old in its courses, declines toward its end, we might be partakers of the age to come, which knows no setting, in the sense of the one God. For this is the evil of the present age, that it does not render fitting reverence to God the Creator and to Christ the Restorer; while human error invents many gods for itself, or while the honor due to Christ is not kept for him by believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
