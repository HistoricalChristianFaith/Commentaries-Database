[[commentary]]
quote='''
Sober, chaste, orderly, hospitable, teachable, not given to wine; not a striker, but modest; not quarrelsome, not harsh; but ruling his own house well, having his children in subjection with all chastity. He says that a man who keeps these good things which he enumerates ought to be made bishop. For these are the signs of the episcopal dignity. But if anyone, pursuing the better things, has dedicated both his body and his soul to God, so as not to join himself in marriage, he will become so much the more worthy. For he set down the lower thing for this reason, that no one might be in doubt about the better.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
