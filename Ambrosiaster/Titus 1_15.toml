[[commentary]]
quote='''
All things indeed are clean to the clean; but to those who are defiled and without faith nothing is clean, but both their mind and their conscience are polluted. He indicates that those are clean who know both for what reason these things were forbidden and for what reason they were afterwards permitted. For if in Genesis it is read that all things which God made are good (Gen. 1:31), there is no doubt that they are also clean; but those who do not understand are unclean, for they are accusers of Scripture. For if they are read to have been made good, why are they forbidden as if execrable? If they are not execrable, because they are good, they are known to have been forbidden because of hardness of heart, because men were held unworthy to use the whole creation of God. For those who are seen to be prohibited from the better things, their mind and conscience are polluted; because they accuse the creation of God in order to excuse themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
