[[commentary]]
quote='''
In perils among feigned brothers. False brothers are those of whom he speaks to the Galatians: But because of the false brothers brought in secretly, who slipped in to spy out our liberty which we have in Christ Jesus (Gal. 2:4). For these were partly Christians, partly Jews, perfect in neither, who out of zeal for the Law stirred up ill will against the Apostle, because he said that, now that Christ had been preached, the Law was ceasing. Finally, under their pressure, he was compelled to circumcise Timothy. A feigned Christian, then, is one who out of rivalry for the Law persecutes a Christian: and this is a false brother. For if these were only Jews, and he calls them false brothers on account of their Judaism, what need was there to say it again? For he already said above: In perils from my own people. But according to the flesh they are not false brothers, whereas in Christ they are false, because they are not Christians with their whole mind (2 Tim. 1; 4). There were also other false brothers, such as Demas and Hermogenes (2 Tim. 4:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
