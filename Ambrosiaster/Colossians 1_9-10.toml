[[commentary]]
quote='''
Therefore we also, from the day on which we heard, do not cease praying and asking for you, that you may be filled with the knowledge of his will in all wisdom and spiritual understanding, in this: that you walk worthily of him unto all that pleases him, in every good work. The Apostle, hearing of their devoted and ready will concerning the faith of Christ, prays for them, that, having come to know the will of God more fully, they might fulfil by reasonable work the devotion which they had learned on hearing the faith of Christ; lest so faithful a dedication of mind and such strength of faith, while doing something unadvisedly and unskilfully, should lose the fruit of its labour. For that is gladly credited which is done with a devoted mind, and prudently.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
