[[commentary]]
quote='''
According to the will of God and our Father, to whom be glory for ages of ages. Amen. So that what he says, that Christ delivered us, may be firm and full of authority, he adds that he did this with the will of the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
