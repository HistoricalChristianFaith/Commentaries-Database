[[commentary]]
quote='''
For in the Law it is written: That in other tongues and in other lips I will speak to this people, and not even so will they hear me, says the Lord (Isa. 28:11). The Lord said this of those whom he foreknew would not believe even the Savior. For to speak in other tongues and in other lips is to preach the new testament, as the prophet Jeremiah says: Behold, the days will come, says the Lord, and I will accomplish for the house of Israel and for the house of Judah a new testament, not according to that which I appointed for their fathers (Jer. 31:31): that is, with the order changed, to speak otherwise than the words of the old law run; when they hear that the sabbath is loosed, the new moons made void, circumcision ceasing, the sacrifices changed, foods long forbidden permitted to be eaten, Christ preached as God from God: this is to speak in other tongues and in other lips; and not even so were the faithless willing to obey God. It can also be understood thus: that, since many of the Jews were ill-disposed, and therefore it was not fitting to speak the Gospel to them in revelation, he spoke to them in parables; and that, understanding that it was not revealed to them because they were wicked, not even so would they correct themselves, so as to make themselves deserving to hear the words of God through explanation. Hence the disciples say to the Lord: Lord, why do you speak to them in parables (Matt. 13:10)? And the Lord: Because to you it is given, he says, to know the mystery of the kingdom of God, but to them not; that seeing they may not see, and hearing they may not understand (ibid., 11); lest the unworthy should receive salvation; and perceiving that this was done in accordance with their deserts, not even so were they willing to be converted and make satisfaction to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
