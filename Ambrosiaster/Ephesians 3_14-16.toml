[[commentary]]
quote='''
For this reason I bend my knees to the Father of our Lord Jesus Christ, from whom all fatherhood in the heavens and on earth is named, that he may grant you, according to the riches of his majesty, power to be strengthened in his Spirit. He says that he prays this with bent knees: that, since he has deigned to call the Gentiles to know the mystery of his will, he may also grant this, because he is rich: that at his bidding they may be strengthened in the Spirit, that is, that the carnal destructions inflicted by the faithless may not disturb them, but that they may be steadfast, awaiting in the future the reward of this thing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
