[[commentary]]
quote='''
Masters, provide your slaves with what is just and fair, knowing that you also have a Lord in heaven. Lest temporal masters be lifted up by pride, presuming on their lordship, he softens and restrains their minds, so that, taking the human race into consideration, they may observe that God the author created not slaves and free men, but all freeborn. But this came about through the iniquity of the world: while one man invades another's territory, he then leads freeborn men away captive; hence those taken by the hand (manu capti) were, from this, called by the ancients mancipia, slaves. This chance and condition appears even now: some are redeemed, others remain slaves. With God, however, he is held a slave who has sinned (John 8:34). Accordingly, it was because of sin that Ham heard himself called a slave: Cursed be the boy Canaan; a slave of slaves shall he be to his brothers (Gen. 9:25). The ancients assented to this judgment, so that they defined all the wise to be free, and all fools to be slaves; because the wise man abstains from sins, so that he is freeborn who follows what is right, but he is a slave who through the imprudence of folly subjects himself to sin. Hence Ham too, who foolishly laughed at his father's nakedness, was called a slave because of his folly. He shows the masters, therefore, that they are not truly masters, but as it were in an image; for they are masters of bodies, not of souls. For the only master and author of things, the invisible God, rules both bodies and souls; so that, considering these things, they may exact just services from their slaves: such, surely, as they themselves wish to be exacted from them by the common Lord. For while they themselves do not serve God as is fitting, though they do not deny that he has power over all and that his daily gifts are furnished for human uses through the ministries of creation, from their equals (not to say their brothers) they exact services so heavy that they cannot be borne: not taking to heart that they themselves too, willing or not, are slaves; and let them look to it of what merit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
