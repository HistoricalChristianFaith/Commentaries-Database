[[commentary]]
quote='''
For our glory is this: the testimony of our conscience. He says this because they relied on their conscience, which was pure of all pretense; wherefore they did not distrust the help of God. That in simplicity and sincerity, not in carnal wisdom, but in the grace of God, we have conducted ourselves in this world, and more abundantly toward you. This is the glory of conscience of which he spoke: simplicity and sincerity. And because these belong to the teaching of God, he added: Not in carnal wisdom, but in the grace of God; to show that he had offered a free conscience not to human wisdom but to the preaching of the Gospel. He rubs at things past; for this is what it signifies: that in the first letter he reproved a painted preaching fitted to human understanding (1 Cor. 2:4), whose preachers he accuses of carnal wisdom in a twofold way: because they both preached according to the understanding of the world, so as not easily to offend men, and did this for the sake of gain, intent on their own carnal profits. Hence the Apostle never wished to accept support from the Corinthians, lest he give these men an occasion, on the ground that he was like them in this matter. Hence it is that he says: More abundantly toward you we have conducted ourselves simply; because, though he accepted from others, he would not accept from them, lest he lose the authority to rebuke them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
