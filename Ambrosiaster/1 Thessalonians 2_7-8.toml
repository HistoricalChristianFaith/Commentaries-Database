[[commentary]]
quote='''
But we were little ones in your midst, as if a nurse were cherishing her children; so, longing for you, we desire to impart to you not only the Gospel of God, but also our own souls; because you have become dearest to us. He shows that he has so great an affection toward them (which, because it is true, he wishes to be seen proved not by words more than by deeds; for deceit can lie hidden in words), that, stirred by these exhortations, they might hold their whole mind in love of the Apostle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
