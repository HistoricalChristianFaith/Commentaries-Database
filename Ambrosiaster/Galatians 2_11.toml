[[commentary]]
quote='''
But when Peter had come to Antioch, I resisted him to his face, because he had been reproved. After the concord of fellowship and the honoring of the primacy, which by the grace of God they conferred on one another, now, a cause of negligence or error intervening, the apostles seem to disagree among themselves, not in their own cause but in their care for the Church. To his face, he says, I resisted him. What is this, except: I contradicted him in his presence? And he added the cause, saying: Because he had been reproved. Blameworthy, certainly, by the truth of the Gospel, to which this deed was opposed. For which of them would dare to resist Peter, the first apostle, to whom the Lord gave the keys of the kingdom of heaven, unless another such, who, knowing through confidence in his own election that he was not unequal, steadfastly disapproved what the other had done without counsel?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
