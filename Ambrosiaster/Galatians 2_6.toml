[[commentary]]
quote='''
But from those who are reckoned to be something, what they once were matters nothing to me; God does not accept the person of a man. This signifies that the apostles were formerly simple men and unskilled, of no rank in the Law, but that this was no hindrance. For who would accuse one whom God excuses? For the question is not who was what, but what he is. For past things neither condemn nor vindicate. But yet he wishes it to be understood that he was both skilled in the Law and distinguished in life, and accordingly also an outstanding minister in the dispensation of the Gospel. For those who are reckoned to be something conferred nothing on me. He says that he obtained nothing from the apostles, but from God; because he who gave the unskilled the sense of Christian teaching, he himself, he says, deigned to impart to me too, when I was skilled in the law, the sense of a doctrine of this kind. How then could it be that this man should learn from them, whom the grace of Christ, finding him skilled, made more skilled?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
