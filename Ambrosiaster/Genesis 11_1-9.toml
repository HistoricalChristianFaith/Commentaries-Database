[[commentary]]
quote='''
ON THE HEBREW LANGUAGE, WHERE IT TOOK ITS NAME. — Everything that is from God is rational, and for each thing its origin gives the reason why it exists, so that it may not seem to be named or to subsist without sense, but may show a designation which is understood to be the head, as it were, of its own name. Therefore the reason of a man is the cause by which he stands. Now he stands from four elements, namely earth, air, water, and fire, with God alone as author; the fifth is the soul, as it were a charioteer, to drive the material and shaped body, and as its commander. And from the ground [humus] we have taken our beginning, and from its name we are called. For we are called “men” [homines] because of the ground [humus], from which our father has his external origin. Therefore cause and reason bring it about that from the name of one person the others subsisting under the same name are called by it, signifying him in themselves. Accordingly, let us see whether it fits, as some think, that the Hebrews are so called from Heber. For as far as the name is concerned, the origin of this name seems to descend from him; for Heber is earlier than Abraham. But if this were true, those who are of the tribe of Heber ought, after him, to be called by the same name; for from Heber Abraham was born in the seventh generation (Gen. 11:16, 26). If therefore, after Abraham, or Abraham himself, was called a Hebrew, then without doubt the Hebrews are named from Heber; but if it is not read that they were called Hebrews in the time of Abraham, but after Abraham, then clearly they are not said to be from Heber, but from Abraham: since the sons of Abraham are known to have been first called by this name. For in Genesis Joseph and his brothers are called Hebrews (Gen. 43:32). For knowing that Abraham was he who had come down from Syria into Canaan (Gen. 12:4), and had been multiplied, being filled with all resources for the sake of faith, called king and prophet and father of many nations (Gen. 17:4), who with his three hundred and eighteen home-born servants struck down five kings (Gen. 14:14–15); since these things were not done and spoken in a corner, so as to be hidden, they called those who were of his seed Hebrews. It belonged therefore to the rank and merit of Abraham that he should become the head of those who draw their lineage from him. For by God’s judgment he was placed as prince and origin in the land of Canaan, so that those born from him should have another profession and way of life than he had before he went down into the land of Canaan; for he, being renewed, should establish a new people in devotion to God. Therefore it is that the apostle Paul confesses himself to be “a Hebrew of Hebrews” (Phil. 3:5); for this seemed to be a title of dignity. It was a testimony and nobility of lineage that they should be surnamed from his name, who had pleased God in many ways and who was their source. Let this be rejected if it does not agree with reason; let it be despised if it is unlike; let it be torn up if it is foreign to the merits of Abraham; and let us be refuted as his flatterers. What hostility is this against Abraham, what rivalry, by which his enemies belittle him? And who are these, if not those who are called his sons? In what respect does Abraham displease them, that this glory should be thought unfamiliar to him? And what is there in Heber to please them, that he should be said to have this primacy? If his way of life could be investigated, it would perhaps be found that he worshipped idols, like Thare and Nachor and the father of Nachor, who clearly were not far from him, as Joshua testifies, who says they worshipped idols (Josh. 24:2). Or at least let those who are on the other side show by what reasoning this must be claimed for Heber, lest perhaps we suppress his merit; but there is none, because the Scriptures are common to us all, and it is in the open what is owed to each. For if they think this ought to be defended from the name alone, it is weak and unlikely. It would then rightly be vindicated for his name if there were some proofs of causes which confirmed this: for some people of the same name could claim as theirs what does not belong to them. And therefore this is true, because it is established not only by the name, but also by clear reasoning. For since by God’s gracious choice it was brought about that in Abraham the human race should be made alive, and that he should become a saving pattern for men, it is not doubtful to anyone that in him was restored that which had been lost through the fault of human frailty. For he was set as a certain image, that after his likeness the human race might return to God, so that both the worship of God and the word which had previously been given for the use of men might be restored to humankind: because as in the beginning in Adam there was the image of God, so that God might be known on earth, so after the ruins of the human race and the forgetfulness of the true God, in Abraham it was refashioned, so that from him faith in God might begin, and again sprout forth into fruit. Where it is not unreasonable that from his name the people that began from him should obtain their designation. But lest perhaps they suffer doubt because of the name Heber, since the name Heber sounds closer to “Hebrews,” because they are called Hebrews, not Abraheans, let them notice again that they are called Hebrews, not Heberaeans: for he was called Heber, not Hebre. If therefore they think this point must be attacked from here, they suffer what they do, and neither of us will have the victory on this side, except the one who, by giving a reason in order, shows that what he asserts is true. For he who is equal in one matter must be said to have lost if he is found unequal in another. For the letter was changed because of the sound, so that they should say “Hebraei” instead of “Hebrei,” because it sounds better. For also from Juda they are not called “Judai” but “Judaei.” For wherever it seemed awkward, the letter was changed, so that the word might have a harmonious sound. For instead of medio die, we say meridie, and there are many such cases. Therefore it is fitting, as has been shown, that from the name of Abraham both the language and the people should be named. This, then, is the language which we say was first given to Adam and the others, which, because of the presumption shown in building the tower, we believe was scattered into many and confused, so that no longer this one language, but many derived from it, came to exist through the alteration of certain expressions: so that they would have one appearance, and yet it would not be lost, but would be completely mixed in with the other languages. For this was done then, so that people would not understand one another and dare greater things (Gen. 11:8). Therefore, it is understood that as many languages then existed as there were people who, being scattered, each in the places where they lived, established a language of their own. But if this is not thought to be the very language which is written to have been then the one language, it will remain to be said that it was gathered bit by bit from the other languages and fitted together into the form of a single language which Abraham used; so that, because he was the father of many nations, he would have a speech composed from many languages, and would be wholly renewed in every respect. But since those whom the Book of Genesis mentions as of one voice and speech (Gen. 11:31), are read to have migrated from the East, and then again to have been scattered by God over the face of the whole earth, that language certainly did not remain there, so that the language first given should remain. Indeed, it does not have any land among humankind, as the other languages do, nor any nation, except the Jews; because it was given to the first man in Paradise. And after the languages were confused, this language, which is now called Hebrew, was nowhere to be found. If, then, it has nowhere a place or a nation; and Abraham was by race a Syrian; where came this language to Abraham or to the rest of his offspring, unless because it is either that first language, or at least put together from many? For we see that some languages have certain words similar to it. But this does not so well accord with reason as the other view, if it is said to be itself the first: reason shows that this was not done without purpose. Abraham ought to have had the very language which the first man had, so that Moses, when he came to describe the creation and man made by God, would use that speech with which God spoke and named the man Adam, and Adam’s wife was called Eve: so that this speech would be in the book of Moses, which had also been in those whom he describes, so that he might truly show in all things the re-establishment of the first cause and the divine favor in Abraham.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 108: ON THE HEBREW LANGUAGE, WHERE IT TOOK ITS NAME"
