[[commentary]]
quote='''
Yet to the Romans he says that God delivered him up for us all (Rom. 8:32). Now we must ask how God delivered him up, or how he offered himself to God; for as far as the words go, this seems contradictory. God is said to have delivered him up in that he permitted him to be killed, as the Lord says to Pilate: You would have no power against me, unless it had been given you from above (John 19:11). For power was given him, but to one who was willing; that is, he was permitted to do what he wished, and this is to deliver up: for in letting it pass he delivers up; for if he had been unwilling to permit it, he would not have been killed. He permitted him, then, to be killed, but by those who wished to kill him not under compulsion but of their own accord. They are not therefore exempt from punishment because what they wished was permitted them; for condemnation falls on them on this count, that they willed it. Yet God permitted this for this reason: because he knew that this man would stand against the devil on behalf of many. For it was fitting that the enemy, having no foreknowledge of things to come, should be permitted to do what was against himself while he thought he was doing it as if for himself; so that, charging his lack of foreknowledge to himself, he might be tormented with repentance for his deed. But that Christ offered himself, or that God delivered him up, is one and the same; for the will of both is one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
