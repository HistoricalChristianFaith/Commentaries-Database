[[commentary]]
quote='''
But someone will say: How will the dead rise? Or with what body will they come? He said that those have ignorance of God whose words of depraved opinion he brought forward, saying: How will the dead rise? or with what body will they come? To whom he fittingly replied, saying:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
