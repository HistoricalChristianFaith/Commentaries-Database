[[commentary]]
quote='''
Wives, be subject to your husbands, as is fitting, in the Lord. He commanded that wives ought to be subject to their husbands just as God ordained, saying to the woman among other things: And your turning shall be to your husband, and he shall rule over you (Gen. 3:16); so that by this very custom and discipline she may fear her husband as a lord, from whom she began to be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
