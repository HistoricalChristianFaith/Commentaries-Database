[[commentary]]
quote='''
But all things, when they are rebuked, are made manifest by the light. It is true; for sins are seen at the moment they are rebuked, since he who sins, so long as he is not corrected, does not seem to himself to be sinning. For everything that is made manifest is light. In what is manifest there is no ambiguity, nor can what is openly a transgression be excused. For just as, once the sun has appeared, can it now be denied that it is day? So too, once the sin is made manifest, can the rebuke seem false?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
