[[commentary]]
quote='''
Being anxious, therefore, I have sent him, that when you see him you may rejoice again, and I may be of better heart. He indicates that Epaphroditus and the people of the Philippians had a mutual affection, so that on seeing him they might rouse themselves again to gladness, and the Apostle's heart might rejoice; because he becomes of better heart who sends someone to revisit his dear ones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
