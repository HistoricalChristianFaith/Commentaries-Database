[[commentary]]
quote='''
But now that faith has come, we are no longer under a pedagogue; for you are all sons of God through faith, which is in Christ Jesus. He who lives under a pedagogue is not in his own power; for one who is small and prone to sin is kept under the care of a pedagogue. But when Christ came, who as it were makes those under age into those of full age, we were freed from the power of the pedagogue and through the washing away of sins were made sons of God, when we had been slaves of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
