[[commentary]]
quote='''
Again I say, let no one think me foolish; otherwise, receive me as foolish, so that I too may boast a little. Above (2 Cor. 11:1) he already said: Would that you would bear a little of my folly; this he now repeats; for he always sets forth something that he follows up later, after much has been put in between. What, then, he set forth above, he now begins to recount; for, being about to say true things, he calls himself as it were foolish, because they seem to pertain to his praise. So that I too, he says, may boast a little. He said "a little" because it lies in the words, not in the meaning. He does not, then, truly say these things for his own glory, but wishes to show them that those whom they think glorious have nothing more than he has: and so, if these are thought glorious, so am I, he says. He therefore says that it is a fool's part to pursue anything for his own praise, but that he is compelled to speak so. For it grieves him that they should think those men exalted, with him despised, when they had nothing more than he.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
