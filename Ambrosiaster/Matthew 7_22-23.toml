[[commentary]]
quote='''
For because the things mentioned above do not always pertain to merit, the Savior says: Many will say to me on that day, that is, the day of judgment: Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many works of power (Matt. 7:22)? And because this does not pertain to merit, but these are offices of the Church, for the confounding of the Gentiles and for bearing witness to the honor of God, the Lord says to them: Depart from me: I do not know you, workers of iniquity (ibid., 23). For, secure because the working of God was seen in them, they were negligent about themselves; for to the seventy-two disciples too, when they rejoiced because the demons had been subject to them, the Savior says: Do not rejoice in this, that the demons are subject to you; but rejoice in this, that your names are written in heaven (Luke 10:20). Why, unless because they were subject to the name of God, not to the merit of man?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
