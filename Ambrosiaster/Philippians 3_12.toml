[[commentary]]
quote='''
Not that I have already received, or am already justified, or am already perfect: but I follow, if I may apprehend, in which I also was apprehended by Christ Jesus. Since in the whole epistle he testifies that he rejoices in them, and praises their obedience and faith, lest perhaps, being men, they should be lifted up with conceit because they were already worthy, he now declares openly, in his own person, that something is still lacking to him for fulfilling justification, so that they may strive to add to it in good works. For if this man, who is endowed with such great dignity, still confesses that perfection is lacking to him, how much more should these understand that they must labor to obtain the merits of justifications! Therefore he added: But I follow, he says, that I may apprehend, in which I also was apprehended by Christ. For while he was wavering in error and in the turmoil of his mind, distrusting the way of the Lord, the mercy of God apprehended him on the road, as one fleeing the grace of Christ, as he was going to disturb and afflict the Church, to this end, that he might learn the gift of God and the grace which he was rejecting, and might know that for its sake even to die is gain; and therefore that he could do no harm to believers, but to himself, if he did not believe, he who in ignorance was persecuting a thing of salvation. For this, then, he was apprehended, that is, sought out by the foreknowledge of God, he was found and learned the mystery of Christ, so that, making increase of merits throughout his whole life, he may apprehend the appointed prize, having deserved well of him who, as he learned, was slain for his sake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
