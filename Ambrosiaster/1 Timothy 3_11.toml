[[commentary]]
quote='''
The women likewise chaste, not eager for discord, but sober, faithful in all things. Since he commands that a holy man be made bishop, and equally a deacon, he certainly does not wish the people to be unlike them; since the Lord says: Be holy, because I also am holy (Lev. 19:2). And therefore he wishes even the women, who seem inferior, to be without crime, so that the Church of God may be clean. But the Cataphrygians, seizing an occasion of error, because after the deacons he addresses the women, maintain with vain presumption that they too ought to be ordained deaconesses; though they know that the apostles chose seven deacons. Was no woman found suitable then, when we read that there were holy women among the eleven apostles? But in order that the heretics may seem to build up their opinion from the words, not from the sense, of the Law, they strive with the words of the Apostle against the sense of the Apostle; so that, whereas he commands that a woman ought to be in silence in the Church, they on the contrary claim for them even the authority of ministry in the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
