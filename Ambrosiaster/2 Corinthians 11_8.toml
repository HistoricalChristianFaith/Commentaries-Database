[[commentary]]
quote='''
I despoiled other churches, taking wages for the ministry to you. And when I was with you and in need, I was a burden to no one. He weighs upon them; for he shows not only that he was unwilling to receive from them, but also that he received from others and ministered to them. And to show that this was much, not little, he says: I despoiled other churches for the ministry to you. He indicates, then, that he spent no small amount on them; for when he says I despoiled, he indicates many things received and given, not extorted. Hence he added: taking wages; for wages are what a man serving as a soldier receives for his expenses, in place of pay. So he made them blush; because he surely did not refuse out of guile, since he himself ministered to them, and so that through this they might more easily fulfill the ministry they had promised, knowing that they were debtors; so that their ministry would no longer be very glorious, but owed; lest they should boast even of that.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
