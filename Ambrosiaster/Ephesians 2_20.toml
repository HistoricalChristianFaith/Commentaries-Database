[[commentary]]
quote='''
Built upon the foundation of the apostles and prophets, Christ Jesus himself being the chief cornerstone. That is, set upon the New and Old Testament. For what the apostles preached, the prophets said would come; although he says to the Corinthians: God, he says, has set in the Church first apostles, secondly prophets (1 Cor. 12:28). But these are other prophets; for in that place he is discussing the ordering of the Church, but here the foundation of the Church: for the prophets arranged, but the apostles laid the foundations. Hence the Lord says to Peter: Upon this rock I will build my Church (Matt. 16:18), that is, on this confession of the catholic faith I will establish the faithful unto life; for David too arranged the house of God, and marked the place where it should be built: but Solomon founded it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
