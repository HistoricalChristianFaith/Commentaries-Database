[[commentary]]
quote='''
DID LAMECH KILL CAIN, AS SOME THINK? — Those who think this are mistaken, believing that when Lamech spoke of Cain he meant, “I killed a man who hurt me, a young man who covered me with wounds.” (Gen. 4:24) By then Lamech had already been born in the fifth generation from Cain, that is, from Methuselah, Cain’s great‑grandson. Lamech mentions this to show that anyone who sins under a revealed law must be bound more strictly. And therefore, if after Cain his imitator was avenged seven times, how much more must vengeance be taken on the one whom neither Cain’s deed and correction, nor the sentence afterward passed on him, was able to terrify, so as to turn his will away from so wicked and cruel a crime? Therefore, after Cain, Lamech committed this murder, and undoubtedly, in line with what was said above, he paid sevenfold vengeance. And he shows what would happen after Lamech to whoever followed his example, when he says, “But on Lamech seventy‑seven times” (Gen. 4:23–24). Since a wicked deed not followed by repentance is struck with seventy‑seven blows of punishment, therefore also the Savior commanded that one who sins seventy‑seven times, if he turns back, is yet to be forgiven (Matt. 18:22). But so that no one may think another committed murder after Cain and before Lamech, because Lamech said, “Cain is avenged” (Gen. 4:24, according to the LXX), as though it had already happened: how could Lamech say of himself that vengeance had already been taken on him, when the murder he confessed to committing was still recent? For it is certain that every act carries its sentence with it. When there is no other expectation than that, once the deed is complete, its due recompense is known, the future is considered as already done. Indeed it was said to Adam and Eve, “On the day you eat of it, you shall die by death” (Gen. 2:17); and certainly they did not die immediately, but after a long interval of time. Yet because they had already lost the hope of immortality, their future death was called present, since it began to be held in view as certain. Therefore, since Lamech admits that he killed a young man, and since it is clear that Cain could not have lived until that time, or if he did, which seems impossible, he would have been older, Lamech did not kill him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 6: DID LAMECH KILL CAIN?"
