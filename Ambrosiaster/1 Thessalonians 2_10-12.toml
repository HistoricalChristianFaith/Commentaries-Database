[[commentary]]
quote='''
We preached to you the Gospel of God, you are witnesses, and God, how holily and justly and without complaint we conducted ourselves with you who believe, as you know: and how toward each one of you, as a father toward his children, entreating you, and consoling, and adjuring you to this end, that you should walk worthily of God, who called you into his kingdom and glory. These things are plain; for he reminds them how they came to believe while he was preaching, and what manner of man they had found him, and what precepts he had given them, so that they might become worthy of God, who called them from earth to heaven, in order to rouse their joy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
