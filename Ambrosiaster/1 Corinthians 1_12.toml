[[commentary]]
quote='''
Now I say this, that each of you says: I am indeed of Paul, but I of Apollos, and I of Cephas, but I of Christ. He shows the error, but did not reveal the names of its authors; for they did not stay in one place, but went about to overthrow the simple. For those whom he names were without doubt good teachers; but under their guise he touches the false apostles. For if he denies that one should glory in these, how much more in evil teachers, whose perverse doctrine he signifies under the names put in their place! Among them, however, he marks out as persevering those who said that they were of Christ, not of a man, whom he praises above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
