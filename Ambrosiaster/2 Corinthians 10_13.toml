[[commentary]]
quote='''
But measuring ourselves by ourselves, and comparing ourselves with ourselves, we will not boast beyond measure, but according to the measure of the rule which God has apportioned to us, a measure reaching even to you. He says that he uses as much power as has been granted by the Author, and does not go beyond the measure. Therefore, he says, our boasting will not be proud, since we do not overstep the limit of the power given. He put glory in place of the authority which he used in rebuking sins, so as to save them. Yet he does not say that he boasts in exalting his power, but for their building up. For he shows a power of which, if he wished to boast, he would not be ashamed, because it was given to him by the Lord. But he uses it in such a way as not to boast except in the progress of believers, rebuking the vicious with constancy, so that he may boast in their salvation, so that the power given may serve salvation, not elation. In a twofold way, then, he testifies that he does not boast beyond measure: both because it is according to the power given, as he said, and because he did not claim authority for himself beyond where his preaching resounds. For he was confident about those whom he himself had founded in the faith of Christ. For he says that to each one were apportioned those to whom he was directed in preaching, so that each might have certain cities of his own, of whose faith he might boast. For by God's bidding this Apostle was called to preach to the Macedonians; and he was admonished by the Lord to evangelize the Corinthians. To these, then, he speaks boldly, whom he himself founded and to whom he came by God's bidding; to the rest, not with such confidence, because they were in another's rule, that is, in the portion of another evangelist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
