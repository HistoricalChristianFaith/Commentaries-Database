[[commentary]]
quote='''
All the saints greet you, especially those who are of Caesar's household. He indicates that these have a readier affection, with regard to those who are of Caesar's household, and he shows these to be superior also to the brothers mentioned above, because he calls these saints as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
