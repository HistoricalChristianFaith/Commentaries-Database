[[commentary]]
quote='''
He professes, then, that he is very mindful of Timothy, and that he longs for him eagerly because of the remembrance of his tears, which, as is understood, he had shed out of love for the Apostle as he was departing from him. Not without reason, then, does he long for one who loves him, so that he may be filled with joy from their common gladness, on account of the sincere faith which he indicates was in his grandmother and in his mother, and most certainly in him too. All this affection, therefore, is on account of the faith which was inviolate in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
