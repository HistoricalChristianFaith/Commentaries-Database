[[commentary]]
quote='''
But now put away, you also, all things: anger and indignation of mind, malice, blasphemy. Let no foul talk proceed from your mouth. Do not lie to one another. Strip off the old man with his deeds, and put on the new, who is renewed unto knowledge according to the image of him who created him; where there is not Greek and Jew, circumcision and uncircumcision, barbarian and Scythian, slave and free: but Christ is all things and in all. Now he forbids those things which seem lesser sins, lest perhaps, because above he commanded the graver ones to be put to death, these should be thought admissible, or, as though not dangerous, not to be fled; and at the same time so that, having stripped off the old man, that is, seeing themselves undefiled in word as much as in deed, and made new in Christ through the knowledge of the truth, which was once hidden but has now been made manifest to believers through the new law, they may become like the image of him who created them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
