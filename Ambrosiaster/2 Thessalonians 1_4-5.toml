[[commentary]]
quote='''
So that we ourselves glory about you in the churches of God for your patience and faith in all your persecutions and afflictions, which you endure as an example of the just judgment of God, to this end, that you may be counted worthy of the kingdom of God, for which you also suffer. He testifies that his glory lies in their way of life and in the persecution they have endured, so much so that their examples are set forth among the other churches, so that by imitating them these may grow in devotion to suffering for Christ, and may deserve to obtain what has been promised to the saints on the day of the just judgment of God, for love of whom they did not hesitate to despise the world. For these very afflictions are examples of future deserts: in those who suffer, unto glory; but in those who persecute, unto perdition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
