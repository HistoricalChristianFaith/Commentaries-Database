[[commentary]]
quote='''
You are our epistle, written in our hearts. The epistle of the Apostle is the token of salvation. Rightly, then, he says that the salvation of the Corinthians was in the heart of the Apostle and of those who were with him; for they were always thinking about their salvation. Since, then, they are in the heart of the Apostle and of those who were with him, they are an epistle written in their hearts; for when anyone is always mindful of someone, that person is written in his mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
