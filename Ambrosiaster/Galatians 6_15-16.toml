[[commentary]]
quote='''
For in Christ Jesus neither is circumcision anything, nor uncircumcision; but a new creation. And as many as follow this rule, peace be upon them and mercy, and upon the Israel of God. The new creation is our regeneration; it is this that gives progress to those who persevere; for upon these is the peace of God. For he who is at peace with God fears no one's enmity; for he is safe in the protection and mercy of God, which was promised and remains upon the Israel of God, not upon the Israel of man; for the Jews who do not believe are Israelites according to the flesh. He has therefore signified two parts, upon which the peace and mercy of God remain: that of the believing Jews, and that of the faithful Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
