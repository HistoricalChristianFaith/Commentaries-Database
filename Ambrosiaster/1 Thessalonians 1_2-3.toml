[[commentary]]
quote='''
We give thanks to God always for all of you, making remembrance of you in our prayers without ceasing, mindful of the work of your faith and the labors of your love, and of the expectation of our Lord Jesus Christ, before God and our Father. Since all good things are from God, they therefore first render thanks for their advancement to him who deigned not only to give his gift to men placed under sin, but to adopt them as sons, at the same time helping them to endure every deadly peril, that they may become more worthy. For this reason they say that they remember them in their prayers, because in the work of faith they were becoming renowned among the other churches; so that by the will of God they might complete the work begun, prompt in the zeal of love, and of patience, and of hope in the Lord's coming, before God, who deigned to make his Son incarnate for human salvation. For it is God's good pleasure if progress is made in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
