[[commentary]]
quote='''
IF THE LAW AND THE PROPHETS WERE UNTIL JOHN, FROM WHOM THE KINGDOM OF HEAVEN BEGAN TO BE PREACHED (Luke 16:16), FOR HE IS INDEED THE INITIATOR OF THE NEW PREACHING, WHY DID HIS BAPTISM CEASE? — The baptism of John, once begun, did not cease; rather, what was lacking in it was added. For John only baptized; he did not give the Holy Spirit to believers, just as he himself says about the Savior: “I baptize you in water unto repentance, but he will baptize you in the Holy Spirit” (Matt. 3:11). This is what he means: Through me there is forgiveness of sins, yet the Holy Spirit is not given, so that those purified might be called sons; for this was reserved to the Savior, as Lord, so that people might not become sons of God except by receiving the Holy Spirit from the Son of God. Therefore, the effect of John’s baptism, which worked silently without questioning, yet not without mention of the Savior, so that what it accomplished might be firm, is a gift of the Trinity. This is what the Savior's goodness teaches us this by giving the form of three names, which in the beginning, under the name or person of the one God, worked one single and undivided work. Therefore, an interpretation was added to John’s baptism, giving expression to the mystery that had long been hidden; and there was added a greater gift, so that those baptized, having received the Holy Spirit, might be sons of God. It was therefore enlarged, not abolished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 29: WHY JOHN'S BAPTISM CEASED"

[[commentary]]
quote='''
Before the coming of the Lord the Law was preached according to the will of God; for its time was owed to it, that it should be kept: but when the Lord promised in the Law came, the Law had to cease, according to the foretold judgment of the prophets. Hence the Lord says: The Law and the prophets until John (Luke 16:16); for it was not fitting that, with the Lord present, the authority of the Law should be kept. And therefore if anyone henceforth thinks that the Law is to be kept, he no longer obeys the will of the Lord, but resists it; for he satisfies those like himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
