[[commentary]]
quote='''
But I will stay at Ephesus until Pentecost; for a great door has been opened to me, and one full of work, and many adversaries. He shows the cause for which he had remained at Ephesus; for he had found there hearts thirsting for the grace of God, into which he might pour the mystery of Christ. But because the devil is always restless, and envious of those who desire God, he added: And many adversaries; for the more people were found suitable for the faith, the more there was no lack of those who were jealous, contradicting and resisting the teaching of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
