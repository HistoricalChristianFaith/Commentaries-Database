[[commentary]]
quote='''
For he reads that the Lord said: Destroy this temple, and in three days I will raise it up. But he was speaking of the temple of his body (John 2:19). Therefore he himself, raising himself from the dead, signifies that he raised his body from the dead; and nonetheless he is said to have been raised by his Father, because all the power of the Son is from the Father; so that the deeds of the Son are the acts of the Father, from whom are all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
