[[commentary]]
quote='''
Setting forth these things, therefore, to the brethren, you will be a good minister of Jesus Christ, nourished in the words of faith and of the good doctrine which you have attained. What is so true, what so clear and provident, as that the Christian discipline be handed on uncorrupted, so that its fruit may be praised as fertile and firm on the Lord's threshing-floor; that is, that on the day of judgment it may not be judged reprobate and fit to be burned with fire? This is the part of a good teacher and of a fit minister of our Lord Jesus Christ; since he says that he was nourished in the words of faith and of good doctrine, which he declares he attained from infancy. For he who had been thoroughly imbued with all the books of the Hebrews, on receiving the faith, made a perfect teacher.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
