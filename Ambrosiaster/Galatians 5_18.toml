[[commentary]]
quote='''
But if you are led by the Spirit, you are not under the Law. It is not obscure that whoever has the Holy Spirit as his leader does not err; for the law has dominion over those who err, as he says in another place: the law is not laid down for the righteous (1 Tim. 1:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
