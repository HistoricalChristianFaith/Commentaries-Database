[[commentary]]
quote='''
The sins of some men are manifest, going before to judgment, but some they also follow after. In like manner good works also are manifest: and those that are otherwise cannot be hidden. He wishes it to be understood that there will be no excuse for those who cling to men whose sins are openly known, so that, when they ought to be avoided, they are rather held in honor. This, therefore, he signifies: that the man of God should separate himself from these, especially the steward of Christ, who also has the authority to rebuke them; and if they promise to amend themselves, they are to be retained. But he shows that the evil works of others follow after them; because while living they are reckoned good, but when dead they are uncovered, so that those who earlier showed themselves fit are afterwards declared impostors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
