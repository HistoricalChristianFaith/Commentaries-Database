[[commentary]]
quote='''
Behold, I Paul say to you that if you are circumcised, Christ will profit you nothing. Now he does not keep silent about the force of the open truth and of his own authority, saying: Behold, I Paul say to you, that is, I, the teacher of the Gentiles, whose work you are in Christ, say to you openly: That Christ will profit you nothing, if you are circumcised; for the Lord himself says: The Law and the prophets until John; since then the kingdom of heaven is preached (Luke 16:16). Before the new preaching began, therefore, it was right to be circumcised; but now, since the law of faith has succeeded, those things must be followed which the fresh truth commands; for the old and the new must not be mixed together, on the authority of the Lord, who preaches; for he says: No one sews a patch of fresh cloth onto an old garment; for it takes away its strength from the garment, and the tear becomes greater (Matt. 9:16). And thus circumcision, if added, not only will profit the believer nothing, but will even harm him; for it is a greater evil to become a slave after being free than to be born one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
