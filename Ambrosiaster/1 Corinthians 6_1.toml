[[commentary]]
quote='''
Does any of you, having a matter against another, dare to be judged before the unjust, and not before the saints? He means "the unjust" in two senses: both those who do not believe, and those who often interpret with flattery the laws entrusted by God to the world, ascribing their authority to idols, and for this reason they are unjust. And because there is more law in the Church, where the Lord of the law is feared, he says it is better to plead a case before the ministers of God; for out of the fear of God they more readily bring forth a true sentence of the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
