[[commentary]]
quote='''
For I do not wish to see you now in passing. Knowing that he had many things to deal with among them, he does not wish to see them in passing, and lest they be saddened, he promises that he will stay a long time with them; because what he does, he does with providence. For I hope to remain with you some little time, if the Lord permits. If the Lord: for the Lord then permits him to stay with them (he says permits), if they show themselves worthy, amending the vices which he rebukes in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
