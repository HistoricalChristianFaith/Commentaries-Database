[[commentary]]
quote='''
If the Jews had received harsh commandments on account of their distrust and slanders, what had their sons done wrong that they too should be bound by these commandments? The Law was given to the fathers, and it would be a burden also to their similar sons. For afterwards they sinned against God not less, but perhaps even more, than their fathers had. For God, who foreknows all, gave this Law especially for the sons, because all their fathers died in the wilderness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 11: WHY THE SONS WERE BOUND BY THE FATHERS' HARSH LAW"
