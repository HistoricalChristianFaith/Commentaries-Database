[[commentary]]
quote='''
We make known to you, brothers, the grace of God which has been given in the churches of Macedonia, that in much proving of affliction their joy abounds. Since the Macedonians received the word of faith with a devoted mind, he therefore says that grace was given them by God, so that in the tribulation of Paul and Silas, which I mentioned above (2 Cor. 7:5), they should not suffer scandal, but should receive it in exultation of mind, confident of the promised hope, so as to show themselves proved by these sufferings. And that their deep poverty has abounded in the riches of their simplicity. He praises their devotion: because, although they were of slender means, their mind was found rich in the ministry to the saints; for they acted with a pure conscience, not to please men but to please God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
