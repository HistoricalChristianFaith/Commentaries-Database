[[commentary]]
quote='''
But because this iniquity was foreign to Timothy, the man of God, he is bidden to enter upon the good contest of faith. For the victory of faith is when all vices and crimes are subjugated, so that one may come to the rewards of eternal life: the confession of which, made among the very rudiments of the faith, is contained in the ecclesiastical records, with a witness, as the question is put and answered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
