[[commentary]]
quote='''
But what does Scripture say? Cast out the slave woman and her son; for the son of the slave woman shall not be heir with my son Isaac. These are the words of Sarah, who bears the type of the heavenly Jerusalem, bearing Isaac by the promise; so that, the son of the slave woman being cast out, that is, the Jewish people, rejected because of unbelief (for they are slaves of sin, to whom the remission of sins has not been given), the son of the free woman, of that Jerusalem above, may be heir, who is the new people of the kingdom of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
