[[commentary]]
quote='''
Be diligent to come to me as soon as possible; for Demas has forsaken me, loving this world, and has gone to Thessalonica, Crescens to Galatia, Titus to Dalmatia; Luke alone is with me. Take Mark and bring him with you; for he is useful to me in the ministry: but Tychicus I have sent to Ephesus. Although it is clear that the whole instruction of a churchman is contained in the epistle, yet because of his great love he longs for his presence: and he bears witness to Mark for this reason, that he is mindful of his past labours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
