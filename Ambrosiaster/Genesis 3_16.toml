[[commentary]]
quote='''
But how was the kind of sin understood from the sentence? For this sentence applies suitably to a murderer, a criminal, an adulterer, and a disgraced man. Achar also, the son of Charmi, when he had sinned, was condemned to be destroyed along with all his household (Joshua 7:1). How then can this sentence be understood as indicating the kind of sin? It can be recognized that it was a great offense, but not understood what kind of offense it was. For we know that others have been condemned by this sentence, though they are known to have sinned in different ways. Both the Amorites and the Sodomites are known to have perished with all their own. Therefore it happens that people guilty of one sin are struck by different sentences, and sinners of different crimes are punished by one and the same kind. Therefore from the sentence given to Adam and Eve the type of their sin cannot be understood. For although their sin was one, yet each, man and woman, received the sentence according to their own person; and likewise the serpent, so that they would not only fail to remain as they had been made, but that labor would also be added to them as punishment. For when all cattle and living creatures had been made subject to man, as we read (Gen. 1:26), the serpent, contrary to this order, raised itself up and by deceit and fraud brought man, once deceived, into subjection to itself. For without doubt whoever captures someone makes that person beneath himself. Therefore, so that the serpent's cunning would not have its effect, God's sentence calls it back and brings it down further than it had been made, lest it should be above man, so that by its craftiness it would not only grieve that it had gained nothing, but also that it had become worse. For although it is read to have been more wise than the other beasts, after it deceived man it was made more cursed than all the beasts of the earth. After the sentence given upon the man, the sentence upon the woman, the sentence upon the serpent, it follows that the woman also, whom he had joined to himself for the despising of God's law, should receive her sentence. He says to her: "Multiplying I will multiply your hardships and your groaning: in sorrow you shall bear children, and to your husband shall be your turning, and he shall rule over you" (Gen. 3:16). No one confirms what he reproves. If children were therefore granted because she had seized intercourse, then the violation has consulted more. But since he said, "In sorrow you shall bear children," if you think that generation took its beginning from there, where then is what was said, "Increase and multiply"? Understand therefore that this was added only as punishment, so that what had previously been granted with joy should be subjected to sorrow as penalty; and in order that a worse and multiplied punishment should always press upon the woman, the turning to the man is added, so that from this her pain might be renewed again. If the Lord was condemning intercourse, why did he add among the things imposed, "And to your husband shall be your turning"? No one establishes as a punishment what he condemns; for punishment is of course contrary to condemnation, and never arises from the same thing, but from what is opposed to it. If they were in one and the same, no one would fear condemnation. Then someone would award this as a favor, from that very thing in which he saw the law transgressed. This would be to confirm, not to punish, the sin, if for this reason the woman's turning to the man, and, from that which she practices and not from that which is true, turning, given simply before, were believed to have been imposed upon her as punishment together with a final servitude, because through the woman granted to him the man had been made subject. And without doubt she seemed superior, whose advice he used, thinking that what she urged would benefit him, so that the work of God might appear destroyed by the serpent's cunning. This is restored by the sentence established by God, so that the woman returns, humbled, to the subjection of her condition under the man, as it had been ordained; and that is added to her which is added as punishment, when she hears, "Multiplying I will multiply your sorrows and your groaning: in sorrow you shall bear children, and to your husband shall be your turning, and he shall rule over you." Had it been decreed otherwise than that the woman should be subject to the rule of the man? From this, therefore, it is clear that the woman has been called back to what she was, with an addition. Therefore he says, "Multiplying I will multiply your sorrows and your groaning." What he multiplies, he increases in what already exists, not in what does not exist, it seems he is working. By this sentence, therefore, that had gone before, "Increase and multiply" (Gen. 1:22, 28), the work of creating does not begin, but the ruin of the creature to which it had been granted. To the woman, sorrow is added in bearing children, difficulty is imposed, but no new form of procreation is constructed. For if generation is rightly thought to arise from this, it can rather be understood that generation came from the serpent's creativity than from the Lord's; and it is truly, as he said, "Brood of vipers" (Matt. 3:7). But if anyone thinks himself therefore born, let him consider what he deserves, that on account of sin his pain in childbirth might be increased, so that she who was going to have only a little pain, would have it increased because of the sin in having children: for they are born with groaning and sorrow, and those born are not regarded without grief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 127: THE SIN OF ADAM AND EVE"
