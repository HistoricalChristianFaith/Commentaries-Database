[[commentary]]
quote='''
But the wicked advance into worse when they see many giving them assent, so that they send the rest into error. For while they are known to be wicked and deceivers, and nonetheless to flourish and prosper in the world, they draw some to become their imitators, so that they are to be punished not only for their own errors, but also for those of the men whom they ruin by their example.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
