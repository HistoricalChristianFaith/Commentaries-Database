[[commentary]]
quote='''
For if there is glory in the ministration of condemnation, much more will the ministration of righteousness abound in glory. He says this because the gift of the righteousness of God through faith in Christ is greater than that of the old law; because there is more glory in salvation than in death: although he condemns justly, yet it profits his praise more if he pardons, so that the guilty man may be able to correct himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
