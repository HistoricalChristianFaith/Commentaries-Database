[[commentary]]
quote='''
Since God the Father can in no way be called dead, while Christ, his Son, is called dead because of the Incarnation, how is it that he who died is said to be the heir of him who always lives, since heirs are surely heirs only of the dead? But this concerns humanity, not divinity. For with God what is called inheritance among us is a gift of the Father transferred to obedient sons, so that the living may be heir of the living by his own merit, not by the necessity of the deceased. Therefore the Lord in the Gospel, by no less a human than divine meaning, indicated in a parable that he had divided his substance among the living (Luke 15:12); for a parable is not composed with an absurd meaning. Therefore, to make us ready to obey God the Father, he exhorts us with this hope, saying that we shall be heirs of God and fellow heirs with Christ; so that, because the hope of the reward is great, we might be all the more inclined toward the things of God, putting worldly concerns second. What it means to be a fellow heir of the Son of God is taught us by the apostle John; among other things he says: We know that when he appears, we shall be like him (I Jn. 3:2). Paul explains how we can become fellow heirs with Christ, saying: If, however, we suffer with him, so that we may also be glorified together. Let us therefore see what it means to suffer with him. To suffer with him is to endure persecutions for the hope of future things, and to crucify the flesh with its vices and desires, that is, to despise the pleasures and displays of the world. For when all these things have died in a person, he crucifies the world, believing in the life of the age to come, in which he hopes to become a fellow heir with Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
