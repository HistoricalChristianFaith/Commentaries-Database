[[commentary]]
quote='''
But those who sin rebuke before all, that the rest may have fear. Although a charge against a presbyter ought not readily to be believed, yet if it is proved, or it is manifest that he has conducted himself irreverently, he commands that he be rebuked publicly, so that the rest too may be terrified; and this profits not only the ordained but also the people; for when they see a man of rank rebuked because of his error, they must needs take heed for themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
