[[commentary]]
quote='''
But we renounce the hidden things of shame. That a man may be worthy of that glory, he teaches that all base and polluted things that can be done and thought must be put away, so that they are driven out not only from deed but also from thought. These are the words of one who invites; for under his own person and that of his companions he exhorts them to a better life, because of the vices mentioned above, which he often censures in them. These too can be hidden things of shame: the things that some devise with a perverse mind for their preaching, in order to deceive; hence he added: Not walking in craftiness, nor adulterating the word of God. For he who with a deceitful mind fabricates doctrine to deceive the hearts of the simple works toward his own shame and disfigurement; for he will be found base in the day of the judgment of God. For the craftiness of an evil mind, in order to accomplish what pleases it, adulterates the words of God so as to overturn their sense. Now to adulterate is to wish to shut out the true sense by a false one. But by the manifestation of the truth commending ourselves to every conscience of men before God. He says this because in his preaching of the Gospel he made himself suspect to no one, adding something more when he says: Before God; so as to prove this very thing manifest not only to men, but also to God, from whom nothing is hidden. He calls, then, on the testimony of God, so that he may at least be believed, because he preaches just as it was given by the Author: and God is a witness in this way, when he grants signs and wonders to be done by his hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
