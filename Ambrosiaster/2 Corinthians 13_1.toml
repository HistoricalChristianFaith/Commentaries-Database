[[commentary]]
quote='''
This third time I am coming to you. Above he said that he was ready; now he indicates that he is about to come. In the mouth of two or three witnesses every word shall stand. He said this according to the Law (Deut. 19:15), by which a person is either cleared or condemned on the word of two or three witnesses: so he warns these too to be found cleared at the Apostle's third coming.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
