[[commentary]]
quote='''
If then you have risen together with Christ, seek the things that are above, where Christ is, seated at the right hand of God. He asserts that those have risen with Christ in baptism who think on the things above the heavens, where the seat of Christ is, where God the Father has given his right hand to his Son, that he may reign and judge; for it is not for a judge to sit on the left. Yet the resurrection has two forms: first, that the soul rises from the earth to the heavens; then, when the body has been received back, that it rises, caught up to meet Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
