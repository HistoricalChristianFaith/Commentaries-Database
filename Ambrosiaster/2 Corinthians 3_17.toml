[[commentary]]
quote='''
Now the Lord is spirit. And where the Spirit of the Lord is, there is liberty. Since God is Spirit, he gave through Christ a law of the Spirit: not, indeed, written in letters, but imparted to minds through faith; not one that teaches visible things, but one that persuades us to believe invisible things; which the mind grasps spiritually, not which the eye perceives. This law gives liberty, demanding faith alone; so that, because he believes what he does not see, he may merit to be delivered from his condition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
