[[commentary]]
quote='''
A faithful saying: for if we have died with him, we shall also live with him: if we endure, we shall also reign with him. He indicates that the immortality and glory of Christ can be attained thus: if we remain in the form of baptism, in which all offences die; so that, renewed, we may flee all old vices and crimes, so that, having followed the footsteps of our author, we may be seen to be dead to sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
