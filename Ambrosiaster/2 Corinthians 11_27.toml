[[commentary]]
quote='''
In labor and hardship. It is true that there can be labor without hardship; but here he added And hardship for this reason, to show that the labor itself was deadly. In many vigils. His vigils were many, but some were voluntary, others of necessity; for, placed in affliction, he had to keep vigil seeking the help of God, and to teach not only by day but also by night, as he says in the Acts of the Apostles. In hunger and thirst (Acts 20:31). Often put to flight by the Jews who persecuted him, he necessarily suffered hunger and thirst through want. In fastings often. He fasted rather often, so as to deserve to be protected by the help of God: for he fasts who, while he has something to eat, abstains. In cold and nakedness. He was in cold and nakedness when he suffered shipwreck. Finally, he says, the barbarians on the island of Malta made a fire and refreshed us because of the impending rain and the cold (Acts 28:2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
