[[commentary]]
quote='''
And for this reason God will send them the working of error, so that they believe falsehood, in order that all may be judged who did not believe the truth, but consented to iniquity. The working of error is to entrust one's faith to false things, so that those who were unwilling to agree that the brightness of light is day think that darkness ought to be called day; so that, made guilty of a more wilful offence, they may be condemned without contradiction as enemies of the truth and abettors of iniquity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
