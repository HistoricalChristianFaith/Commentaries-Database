[[commentary]]
quote='''
But thanks be to God, who has put this same care for you into the heart of Titus, for he indeed received consolation. God, who is just, knowing that the Corinthians wished to make progress, kindled the affection of Titus toward them, so that by his exhortation he might fulfill their will in good work; and he, seeing their progress, was consoled and rejoiced in them. But being more earnest, he has set out to you of his own accord. That is, seeing them make progress in good actions, he became more earnest regarding their disposition, so much so that he set out of his own accord to those from whom earlier, even when asked, he had excused himself on account of their vices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
