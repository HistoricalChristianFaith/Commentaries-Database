[[commentary]]
quote='''
Paul, an apostle of Christ Jesus by the will of God, and Timothy our brother, to those who are at Colossae, to the holy and faithful brothers in Christ Jesus. Grace to you and peace from God our Father and the Lord Jesus Christ. He writes the head of the letter to them in his usual manner, in which he goes on to say that he is addressing his letter to brothers who are both holy and faithful, for whom he earnestly desires that the grace of God may remain through Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
