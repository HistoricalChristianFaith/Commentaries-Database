[[commentary]]
quote='''
For this cause a man shall leave father and mother, and shall cleave to his wife, and they shall be two in one flesh (Gen. 2:24). To commend unity he gave an example of unity; so that, as man and woman are one by nature, so also Christ and the Church may be understood to be one by faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
