[[commentary]]
quote='''
And what is the exceeding greatness of his power toward you who believe, according to the working of the might of his strength, which he wrought in Christ, raising him from the dead, and he set him at his right hand in the heavenly places, above every Principality and Power, and Virtue, and Dominion, and every name that is named, not only in this age but also in the age to come. He declares that the pattern of the salvation and glory of believers consists in the resurrection of the Savior, so that from it the faithful may know what has been promised to them. For in like manner they will be raised above the heavens, to be with Christ; as he himself says: Father, I will that where I shall be, these also may be with me, and may see my glory (John 17:24). This is on account of the incarnation of the Son of God, so that even having been made man he may be said to be above all the heavens, and above the whole creation, sitting at the right hand of God, having the name of God by nature, not by adoption; so that those who crucified him may know that he is the Son of God. For the honor which the Father gave him by generation was made manifest then, when, born as man, he suffered, and having conquered death rose again, ascending above all the heavens, whence he had descended. Hence it was said that truth has sprung from the earth (Ps. 84:12). For because the Father has given all judgment to the Son (John 5:22), therefore he is said to sit at the right hand of God, as judge. And indeed he himself says to the disciples: Until now you have asked nothing in my name: ask, and I will do it (ibid. 16:24). Hence he says to the Jews: Henceforth you shall see the Son of man sitting at the right hand of the power of God, and coming with the clouds of heaven (Matt. 26:64). For from the time that he became known, he began to be approached and petitioned, as judge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
