[[commentary]]
quote='''
And not as Moses put a veil over his face, so that the sons of Israel should not gaze on his face, which is done away. Since we have been made worthy through the grace of God to see the glory of Christ, for that reason he says: And not as Moses put a veil over his face, so that the sons of Israel should not gaze (Exod. 34:33). He put a veil for this reason, because they could not bear the splendor of his face, on account of sin; when this is taken away, power is given to see the glory of God up to its end; because it is not unveiled until, leaving the Law behind, they turn to the grace of faith, and so it is done away. For when dignity comes through faith, unworthiness is done away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
