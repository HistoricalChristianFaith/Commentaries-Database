[[commentary]]
quote='''
Since Achaia has been ready from the former year. After the Macedonians, Achaia, that is, the churches of the province of Achaia (not all, since the Corinthians too are Achaeans), had prepared themselves, led by emulation of the Macedonians, to minister to the saints. By saying this he exhorts the Corinthians the more, when he says that those were ready from the former year, but were now waiting for this: that their ministry be divided according to the need of each one. And your emulation has stirred up many. He says that after the Macedonians Achaia was ready, then that the Corinthians too were to become ready according to their promise, while the other churches, through emulation of the Corinthians, when they heard that these had earlier been entangled in many errors, but afterward, correcting themselves, had come to be of good will, were incited to the good work; because if those who had conducted themselves badly after receiving the faith had begun to have this will, how much more these, in whom these vices were not found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
