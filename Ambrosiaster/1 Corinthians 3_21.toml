[[commentary]]
quote='''
So let no one glory in man. For since human thoughts and counsels are improvident and weak, he teaches that one must not glory in man, but in God, whose counsel cannot be revoked: for whatever men are wise in without God is foolish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
