[[commentary]]
quote='''
For us who look not at the things that are seen, but at the things that are not seen; for the things that are seen are temporal: but the things that are not perceived are eternal. Having a desire for heavenly and spiritual things, he professes to despise these present and earthly things; because in comparison with spiritual things these are nothing. For these things are to those above as the figure is to the truth: the figure perishes, the truth remains; and on this account the righteous do not fear to depart from this world, but rejoice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
