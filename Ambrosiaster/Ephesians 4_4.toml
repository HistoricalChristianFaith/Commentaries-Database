[[commentary]]
quote='''
One body and one spirit, even as you have been called in the one hope of your calling. He added these things for the sake of peace and concord; so that, because the Church is one body, the people may be of one mind; because that which is believed is one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
