[[commentary]]
quote='''
He who used to steal, let him steal no longer: but rather let him labor, working with his hands what is good, so that he may have something to give to those who suffer need. That the way of life of the new man may remain, he exhorts that there be no return again to past vices and sins; for it will profit nothing to be called new, when one is proved by evil works to be the old man. So the Christian is commanded not only not to take what belongs to others, but also to supply from his own labor those who suffer want; so that, devoted to good works, he may repay what he had previously taken away, and for the rest lay up treasure for himself for the future; for he who ceases from theft can have pardon, not glory. For what great thing is it, or of what merit, to keep one's hands off what belongs to others? For one advances to merit when one gives of one's own to the needy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
