[[commentary]]
quote='''
If, therefore, there is any exhortation in Christ, if any comfort of love, if any participation of the spirit, if there are any bowels and mercies, fulfil my joy, that you be of the same mind, having the same love, like-minded, thinking one thing; let nothing be done through provocation, nor through empty glory, but in humility of mind each esteeming the other better than himself: each looking not to the things that are his own, but to the things that are others'. He says this because: if there is among you a true exhortation of hope in Christ, with which we comfort one another; if there is the comfort of a common love; if there is participation in the Holy Spirit, through which we are joined in one new body; if there are any bowels, that is, if I am in your heart, as you also are in mine; if mercies, that is, if the affection of devotion is present in love: fulfil my joy. The things he enumerates, he indicates, are to be proved true only then, if the things he enjoins below have been kept: that they be like-minded and humble in spirit, not provoking one another, but rejoicing in love, so that the joy of the Apostle may be full in them. Thus, then, he binds them, so that if they do not keep these things, they may not seem approved in the rest either; so that, since in other things they do not wish to seem unapproved, they may keep these also, that they may be perfect. For without doubt there were among them some who disagreed and were restless, and who were eager for empty glory, wishing to contend and to win with fierceness of spirit, where there is no reward: but it breeds quarrels and breaks love. For what people can there be in which there are only vessels of gold and silver, and not also of wood and of earthenware? But by the practice of good they can be changed and become gold and silver; for the fault is not of nature, but of will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
