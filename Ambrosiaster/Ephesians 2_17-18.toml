[[commentary]]
quote='''
Hence he commanded the preaching by which all should be called together to God the Father in the unity of the Spirit, the discord having been torn away, so that whether Jews (who are called near for this reason, because the promise was made to their fathers) or Gentiles (who are called far off for this reason, because they did not receive the law of God given through Moses), the former rite having been removed, they might receive the faith of Christ, through which they should be made one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
