[[commentary]]
quote='''
CAN SOULS, THEN, BE TRANSLATED JUST LIKE BODIES? — I think it is dishonorable to say that souls are generated together with bodies, so that a soul is born from a soul, a thing that does not belong even to the soul itself. Or if indeed each of the heavenly powers was made individually, and from them the rest came to be, then it might seem believable that from the one soul of Adam the other souls are born. But this is not fitting, because this was possible for God alone, that the simple should generate, and was not granted to others. This is so mysterious in the case of the Savior that it is considered unbelievable not only by pagans or Jews alone, but even by those who call themselves Christians. For the Photinians and Arians reject this faith and do not believe that God has generated. For if at the time when the body is sown the soul also is generated from a soul, we read that a rib was taken from Adam, yet we do not read that a soul was born from a soul. But if the rib had a soul with it, then it was not born, but removed as a part. Yet this too is not written. The prophet Zechariah says among other things: “Who formed the spirit of man within him” (Zech. 12:1). Nor does Isaiah disagree with this, for he says: “Therefore says the Lord God who made you and formed you in the womb” (Isa. 44:2). If therefore it is formed in the womb, then it is given to an already shaped body. For when it fills all the members of the body, it is said to be fashioned in the body. Just as water, although without form, when poured into a vessel appears to be shaped, so the soul, though by nature incorporeal and simple, is as it were formed in the body, giving life to each of the members. Moses has handed this down more clearly, saying: “If someone strikes a woman who is pregnant in the womb, and she miscarries: if what is in her is fully formed, let him give soul for soul; but if it is unformed, let him be fined” (Exod. 21:22), so that he might prove that the soul is not present before the form. Therefore, if it is given to a body already formed, it is not born at the conception of the body, derived with the seed. For if the soul exists with the seed and comes from another soul, many souls perish every day, since the seed by a certain outflow does not come to birth. But if we look more closely, we shall see what we ought to follow. Let us consider the making of Adam. In Adam an example was given, so that from him it might be understood that a soul was received by an already formed body. For God could have mixed the soul with the clay of the earth and so have formed the body. But he proceeded with reason, because the house had first to be put together and then the inhabitant brought in. The soul, certainly, since it is spirit, cannot dwell in dryness; therefore it is carried in the blood. Consequently, when the features of the body have not yet been put together, where will the soul be? Does it wander outside until it is put in, although reason teaches that it is given in such a way as to animate the body, not to wander idly? But from whom is it given, let those who think otherwise tell us: from the male, or from the female? If from the female, it is not fitting, because the example is otherwise. For they propose that with the rib taken from the man, a soul was also given; and we have shown by many arguments that this is invalid. From this it might perhaps seem to be given from the female, especially on account of the Savior, whom we know to have been born of a woman from the Holy Spirit, without the union of flesh. But if they suppose this, they give more to women; for they transfer the authority of the man to the woman. Since they claim that the origin of both body and soul is from the man, they turn around and say that what is more important, namely the soul, is from the woman, and what is less, namely the body, is from the male; although it is clear that the order of the example given by God cannot be altered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 23: CAN SOULS BE TRANSLATED JUST LIKE BODIES?"

[[commentary]]
quote='''
DID ADAM HAVE THE HOLY SPIRIT? — I have found that some of our brethren have not fully examined the Scriptures, but in simplicity of mind affirm that when Adam was made, he received the Holy Spirit, which he lost when he sinned, just as it is now given to believers. Led by this reasoning, by which many are accustomed to assert that through faith man is restored so that, being brought back to his former state, he receives all that Adam had obtained in the beginning; and because he is said to be made a perfect man, they say that if he did not have the Holy Spirit, he was imperfect. But I say that not only man, but also all things which God made, which cannot be said to have received the Holy Spirit, are perfect. For all kinds of animals are perfect in their own nature, so that they may accomplish that for which they are made: so also man is perfect in his own kind, so that he is able to discern evil from good, crooked from straight. For he is an intelligible creature, perfect for that for which he was made. He is capable of speaking, planning, and acting, so that what he cannot accomplish by strength, he fulfills by understanding. And how have they dared to say that man ought to be born perfect and to know everything, when they see that he knows nothing beyond what he learns here? For what he does not learn here, he does not know. Finally, since he does not learn here what he is like, he does not know: therefore, since he does not know what he is like, how does he know all things, when knowing oneself is less than knowing other things? But because he learns about other things, and does not learn about himself, he knows about others, but does not know about himself, neither what he is like, nor whether he exists before the body or after the body. For if he had been made so perfect that he needed nothing, he would not have been man, but God; nor would he, being deceived, have transgressed. But to have the Holy Spirit is beyond the nature and perfection of man, so that he may be able to do the things that are of God. Was it not beyond its perfection that the donkey spoke to Balaam (Num. 22:28)? For it received so that it might do what was not of its own nature, but of ours. Therefore, since man is superior to the other animals, must those be said to be imperfect? Or because the holy angels are not what God is, are they imperfect? Or because the luminaries and stars are inferior to the heavenly angels, or because the clouds with their veil obscure the sun and the moon, are they less perfect? And because the members need one another (for the feet cannot do what the hands can), shall they be called imperfect? Far from it. For all things are firm and perfect in their own places and ranks, so that they fulfill that for which they are made. Therefore all things are perfect, because their Creator is also perfect; but in comparison with him they are imperfect. For God is perfect in all things, as the fountain and origin of all. Now the things that have been made are indeed perfect, but with regard to that for which they were made, so that in another respect they are not perfect; because one needs another: so that in that respect in which it does not need, it is perfect, not in that in which it needs: and therefore all things are both perfect and imperfect. Hands need feet; for unless the feet walk, the hands will be idle. Again, the feet need hands; for they cannot shoe themselves nor care for themselves. Therefore, although the body is perfect with its members, it nevertheless cannot fly, nor bear as much as a mule can. And although these (animals) are perfect, they still do not know how to govern themselves, nor can they apply medicine to themselves. Where it is said, Do not be like horse and mule, which have no understanding (Ps. 32:9). And water and fire, though they oppose one another, are perfect in their own kind; for they fulfill that for which they were made. Fire cooks and consumes; it purifies and heats: water, however, washes, cools, irrigates, and refreshes the thirsty. Therefore, since all things are perfect in their own kind, yet without man they can do nothing, nor can man, although he is more perfect, do anything without them. Therefore the Apostle calls us imperfect and perfect. For in comparison with unbelievers we are perfect, because we know God: but because we know less than we ought of the things that are promised, since in this life we cannot comprehend as much as that which is believed, we are imperfect. Therefore, since they think that Adam’s perfection is restored to believers, let us see whether this restoration has anything beyond the divine gift which Adam had obtained. For when Adam was made, he was placed in paradise that he might work there and keep it: that is, that he might cultivate the land and keep the commandments of God, by which he might know that he had received dominion over all things in such a way that he himself should nevertheless live under the law of the Creator, lest his dominion should exalt him, and, puffed up with pride, he should become forgetful of his Maker. He was therefore placed there so that his life might be sustained by food: but through Christ this has been granted, that those who rise again do not need food or drink; because what is mortal in man is transformed into life. Adam was made to dwell on earth; but faith has consented to grant that our dwelling be in heaven. Scripture itself bears witness, for it says, The first man Adam was made a living soul, but the second man a quickening spirit. The first man was of the earth, earthly; the second man was from heaven, heavenly. As is the earthly, such also are the earthly; and as is the heavenly, such also are the heavenly (1 Cor. 15:45–48). What is clearer than that Adam did not have the Holy Spirit? For he was made a living soul; but through Christ (we are made) a quickening spirit, so that man may in some way be similar to the Creator whom he believes. For since the mystery of faith, which is given for salvation, is threefold, he becomes threefold, in body, soul, and Holy Spirit, through whom we are called sons of God: a title which Adam is by no means proved to have received; for he was made earthly. But the sons of God, born not carnally but spiritually, are said to be heavenly. Behold, the gift of God has clearly granted much more grace to man in the time of the Savior than Adam had received; for he has not only been restored, but also improved: restored in that he has been washed from sins; improved in all other respects. For both justice and reason demanded that God’s mercy in granting benefits should be more abundant at the time when He willed the mystery of His divinity to become known to His creature: so that, coming to know what had been unknown for ages and generations, that the mystery of the one God subsists in the Trinity, those cleansed from sins, as though by a kind of dedication to this novelty itself, might furthermore be justified, and, adopted by God, receive the Holy Spirit, by whom they appear to bear the mark of adoption. For adoption from God ought to bear the sign of God the Father, so that they are rightly called sons of God. This gift too was promised through the Prophets, to be given at the time when the mystery of God was to be revealed in the triumph of conquered death, so that the creature might know that the Father and the Son and the Holy Spirit are one God. Therefore the Evangelist says: “The Spirit was not yet given, because Jesus was not yet glorified” (Jn. 7:39). For this is glorification: when, by His power, He is recognized as being what He testified about Himself; because this glorification bestowed that gift which had been promised through the prophet Joel. For God says: “In the last days I will pour out of my Spirit upon all flesh, etc.” (Joel 2:28). And the Apostle says among other things: “But when the kindness and love for man of God our Savior appeared; not by works of righteousness which we have done, but according to His mercy He saved us, by the washing of regeneration and renewal in the Holy Spirit, which He poured out upon us richly through Jesus Christ our Savior, so that, having been justified by His grace, we might become heirs according to the hope of eternal life” (Titus 3:4–7). The Apostle confirmed what had been promised through the prophet Joel, because after Jesus was glorified God fulfilled this: that He should pour out the Holy Spirit upon those who believe in Christ. And this is to become an heir of eternal life: to receive the Holy Spirit; so that, because the Spirit is eternal, the one who receives Him should have eternal life: for He is the pledge of immortality. Whoever receives Him and abides in His love, when this life is passed, goes on to heaven to Him whose Spirit he possesses. For it would be strange that one who departs therefore having the Holy Spirit should be held in the lower regions. The Spirit of Christ is in man as a mark of Christ’s victory by which He conquered death, so that whoever has His Spirit cannot be held in Hades. And therefore in the ancient saints the Holy Spirit was not present in the same way as He is now in the faithful; for when they departed from this world, they were in the underworld: and it cannot be said that the Holy Spirit, because of Adam’s sin, which through the transmission of the race made all his offspring subject to the underworld, was held under the same sentence that was given to Adam. Therefore, that the Holy Spirit was with the Prophets and righteous men is not doubtful: with the Prophets, on account of the dispensation; with the righteous, on account of holiness, as is read of holy Simeon, because, it says, “the Holy Spirit was upon him” (Luke 2:25); not as a mark of adoption in him, but by reason of his merits. For sons of God who believe only began to exist when the Son of God was revealed, death conquered, to the whole creation. But if it is said that the Holy Spirit was in Adam or in others in the same manner as He is now in the faithful, what new gifts did God bestow when He dedicated in us the kingdom of His Son? And how can the time of the Savior’s coming be called happy and blessed above others if He bestowed the same things that had already been bestowed? And where is that saying in which the Savior says to His disciples: “Many Prophets and righteous men have desired to see what you see, and to hear what you hear, and have not heard” (Matt. 13:17)? By what reasoning, then, can it be said that the blessedness of this time has brought no greater gift than was granted to the ancients? This indeed turns to the dishonor of the Savior, as though He had nothing new to give to those who received Him at the rise of His kingdom; although the wealthy are accustomed to labor so that on the festive day of their birthday they may offer rare gifts to their invited guests. How great, then, is the injustice, that God, being said to have invited people to a new and unheard-of festival day, worthy of all praise, should be thought to have had no unprecedented gifts to bestow? And where is that statement of the Evangelist John, who says: “He came unto His own, and His own did not receive Him; but as many as received Him, He gave them power to become sons of God, to those who believe in His name, who were born not of blood, nor of the will of the flesh, nor of the will of man, but of God” (Jn. 1:11–13)? How, then, is it not something unheard-of that God bestowed upon believers in Christ, when He gave them the power to become sons of God, that is, brothers of His own Son, not by the will of the flesh or of man, but of God, so that they might be born spiritually? Or if it is proved that this grace had previously been granted, then it must be said that the coming of Christ brought nothing new. Adam’s making, surely, was carnal and earthly, not spiritual. For he was not born of God without flesh and blood, but made by God from earth: and therefore he could not receive the Holy Spirit, since he was not spiritual, and it had not been granted to him to call God “Father” in prayer. Those who receive the Holy Spirit are given the power that, by reason of having the Holy Spirit, they may call that One the Father of Christians in prayer. Because this had not previously been granted, the ancients cannot be said to have had the Holy Spirit. Those therefore who think that Adam or others had the Holy Spirit do not understand what kind of gift they have from God; nor can they give fitting thanks to Him, since, though receiving more than the others, they say that they have obtained nothing beyond what the others received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 123: DID ADAM HAVE THE HOLY SPIRIT?"

[[commentary]]
quote='''
WHEN ADAM WAS MADE BY GOD AND GIVEN LIFE, HE RECEIVED THE HOLY SPIRIT; FOR IT IS WRITTEN, “GOD BREATHED INTO HIS FACE THE SPIRIT OF LIFE” (Gen. 2:7). — It was not fitting that he should receive the Holy Spirit then; for this was reserved by God for the future, so that in the last days, when the mystery of the one God was revealed, it would be given to believers. From the beginning the Trinity was indeed preached, but the understanding of it was, as it were, under a veil. For the person of God the Father was first preached and revealed without delay and without figure, because all things are from him. But the persons of his Son, our Lord Jesus Christ, and of the Holy Spirit were not kept silent, yet they were not revealed. Accordingly, there arises a question from the faithless concerning the Lord, and concerning the Holy Spirit. For certain madmen say that the Holy Spirit is himself the Father, just as Sabellius says that the Father is the same as the Son. But no one doubts about the person of God the Father. When therefore the revealing of the Trinity takes place, then at last the Holy Spirit is given to believers, so that his person may be revealed, and those who receive him may have the sign that they are children of God, in that they have within themselves the Spirit of God, who is of course from God. For this is the indication of perfection: when it is known that there is both Father and Son and Holy Spirit. This perfection grants this gift. For when the Son of God comes, opening and revealing these things, he must give something more, and it is fitting that he bestow this perfection on believers; for neither in the Son alone, nor in the Father alone is there perfection or salvation, but in the name of the Father and of the Son and of the Holy Spirit. Therefore John the Evangelist says that from his fullness we have all received, grace for grace; “for the Law was given through Moses, but grace and truth came through Jesus Christ” (Jn. 1:16–17). It is clear that when the Savior comes, the fullness of truth is brought about. For the things that were hidden, and that which was promised, when it is revealed and made clear, the fullness of truth comes to be; then, when believers receive the Holy Spirit, they become children of God. For the “breathing” which is said to have been done by God into Adam is the imparting of the soul; for “spirit” is frequently used in place of “soul,” as the Gospel says among other things: “And,” it says, “his spirit returned to her” (Luke 8:55). And in the Psalm: “A contrite spirit and a humbled heart God will not despise” (Ps. 50:19). Yet frequently some manuscripts do not read “God breathed,” but “God blew into his face the breath of life, and man became a living soul.” Not because it says “breath of life” did it thereby signify the Holy Spirit. For it says the same of animals: “In which was the breath of life” (Gen. 7:22). It is called “breath of life” because it animates bodies unto life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 3: WHEN ADAM WAS GIVEN LIFE, DID HE RECEIVE THE HOLY SPIRIT?"
