[[commentary]]
quote='''
But I have sent the brothers, so that our glory, by which we set you forward, may not be made empty in this respect; that, as I said, you may be ready. He mentions the brothers whom he mentioned above, that is, Titus and those he joined to him as helpers, who were to exhort them more earnestly to fulfill their promise in the ministry of the saints, so that not only by letters but also face to face they might coax them with frequent admonitions, lest the exultation of the Apostle, by which he boasted of the splendor of their mind, be made void. By mentioning this more often, then, he shows his care for them, not wishing them to be put to shame.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
