[[commentary]]
quote='''
For I want you to know how great a concern I have for you, and for those who are at Laodicea, and for as many as have not seen my face in the flesh; that their hearts may receive consolation, when they have been instructed in love unto all the riches of the fullness of understanding, unto the knowledge of the mystery of God in Christ, in whom are hidden all the treasures of wisdom and knowledge. He testifies that he was no less concerned for those whom he had not seen at all in the flesh than for those to whom he preached in person; so that they might know that they were loved by him with no less affection, because he had not seen them, than he loved the others among whom he was; so as to cherish their souls in love, and that they might become ready through the letter, and receive the knowledge of the mystery of God in Christ, observing that these are the riches of wisdom and knowledge, if Christ is acknowledged as one to be adored in the fullness of his deity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
