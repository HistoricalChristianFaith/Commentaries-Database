[[commentary]]
quote='''
Not that we are sufficient to think anything of ourselves, as though it were from ourselves: but our sufficiency is from God, who also made us fit ministers of the new testament, not by the letter, but by the spirit. For the letter kills, but the spirit gives life. Although he sets forth the apostolic dignity, he nevertheless breaks out in praise of God, ascribing this not to human merits but to the grace of him who deigned, for the sake of human life, to ordain a saving preaching, which would save those whom the old law held guilty, remission of sins being given through Jesus Christ our Lord. For the letters were given to Moses for this purpose, that it might kill those who despised the Law, according to the right of nature. But the spirit, that is, the law of faith, which is not written but is held in the mind, gives life to those guilty of death; provided, however, that they turn themselves, so that, being justified, they may sin no more thereafter. Rightly, then, the Law had been given, that there might be fear of sinning: but because the human race is frail, the mercy of God was given to the apostles in their preaching, so that, their sins being forgiven, those who believe in Christ might escape death. This is the preaching of the new testament, which God had promised through the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
