[[commentary]]
quote='''
Wherefore God also highly exalted him, and granted him a name which is above every name; that in the name of Jesus every knee should bow, of those in heaven, of those on earth, and of those below: and every tongue confess that the Lord Jesus Christ is in the glory of God the Father. He shows what and how much humility merits, so that we might seek it the more, having trampled boasting underfoot. Hence Solomon says: God resists the proud, but gives grace to the humble (Prov. 3:34). Wherefore the Lord too: Whoever, he says, exalts himself will be humbled; and whoever humbles himself will be exalted (Luke 14:11). This, then, is humility: if one does not claim for oneself even what one knows to be owed. Indeed that Pharisee (Luke 18:11 ff.), saying true things of himself, is said to have exalted himself; and for that reason he was humbled: but Christ did more, who, though he is God, being made flesh bowed himself down to men. Now let us see how the name which is above every name was granted to Christ, as if the Son of God had been in need, or had been imperfect; for he who is in need is imperfect. For if he was in the form of God, he was on a par with and equal to God; how was it granted to him? For he says it was granted to him who humbled himself, and appeared as a man, emptying himself, made obedient unto death. If, then, he was born perfect, how was he in need? Whoever denies that the Son of God was born perfect of God the Father is an Arian; for before the passion he showed himself equal to God the Father, as I also mentioned above. Hence it is established that he was born perfect; for in his birth he is seen to have obtained all things. For he was born in the fullness of divinity to do all the things that he did; so that he had received the gift before he did the things he was born to do. The gift of the Father, then, is seen to be this: to be the Son; and that his name should be above every name, that is: to be God; for the name of God, but by nature, not by appellation alone, is above every name. Hence it is that in the name of Jesus every knee should bow, of those in heaven, of those on earth, and of those below; as he indicates to the Romans, saying among other things: And of whom is Christ according to the flesh, who is God over all, blessed for ever (Rom. 9:5). And what these "all things" are he discloses in this epistle, saying: things in heaven and on earth and below: for there are no others. Yet to some it seems that the name which is above every name was granted to the man, which fits in no way and by no reasoning. For if Christ the Son of God is himself the same one who is also man, God made man, but remaining God, could not be in need of the things that he had: or if, according as he was man, he was in need of the things that are God's, he himself, the Son of God, being God, would have given himself what was lacking to him according as he was man. This indeed is said out of foolishness. And why is the Father said to have given, when he himself who had been made man lacked nothing? Or could the divinity of the Son not supply to its own body and soul whatever was lacking? But perhaps it is because all things are from God the Father that he himself is said to have given. If, then, all things are from the Father, why should he not be said to have given all things to his Son through generation? And although he begot a Son equal to himself, yet order requires that all things be done in the name of the Father. This the Father granted to the Son after the cross: that all things should be saved in the name of the Son. Indeed the Lord says of the disciples to the Father: Father, those whom you gave me I have kept; for they were yours, and you gave them to me (John 17:12). And to the disciples he says: Until now you have asked nothing in my name; ask, and you will receive (John 16:24). This, then, he received at his birth, so that after the cross it might be made manifest what he had received from the Father when he was begotten. For he received the name from the Father then, when he began to be known by creation; for it comes to be recognized that, on account of the things he did, he had received it before he did them. Indeed before the cross he said: All things have been delivered to me by my Father (Matt. 11:27). How, then, can this be referred to the body, so that the name of God was granted to the body, when it is established that Christ is man and God; since it is neither fitting that God be changed into flesh, nor can flesh be made into that which God is? But perhaps [they say] that he was God by adoption: this too is a pretext; for then Christ will begin to be in part true God and in part adoptive, or else two gods. But Scripture signifies otherwise: for it signifies that it was granted to him who emptied himself, who took the form of a servant, who was made man in the likeness of man, who obeyed the Father. If a man obeyed God the Father, what great thing is it that the Apostle has said? But this is the great thing: that, though he was equal, he obeyed. And what praise is there, if a man was made in the likeness of man, so that a man is said to have been made like a man? But that cannot be; for no one is made in the likeness of anyone unless he is something else before he is made in the likeness of the one he wishes; for he was made like by circumstance, not by substance. And who is it that emptied himself? A man. Then he had something. And how did he receive? But of what could a man, a weak thing, empty himself? And was a man in the form of God? But perhaps the man in the form of God was the Son. Come now, the Son of God, in whose form was he? And if the man was already in the form of God, that is, was the Son of God, he was already perfect before the passion. He did not, then, receive anything after the passion. But let us see what is written of him: Wherefore God highly exalted him, and granted him a name which is above every name; that in the name of Jesus every knee should bow, of those in heaven, of those on earth, and of those below: and every tongue confess that the Lord Jesus Christ is in the glory of God the Father. Let us now consider the words, and so attend to the force of the expression. Certainly the name which is above every name is the name of God. But if this name does not hold by nature, it is not above every name; for a name by appellation lies in the word alone, not in the nobility of nature: and creation does not bend the knee to an adoptive God, but to the true one, not to a fellow creature. And how can it be that a man is in the glory of God the Father? Even if the man were an adoptive God, he cannot be in the glory of God the Father; for this belongs to him who was born of God. For to be in the glory of God the Father is to differ in nothing from God; so that there is one glory of the Father and of the Son through a common substance and power; for this is the unity of nature. What, I ask, is there contrary in it, if the Son is said to have received a gift from the Father, since all that is the Son's is from the Father, from whom all things too are believed to be? And we call the substance of God "nature" for this reason: because Christ was born of it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
