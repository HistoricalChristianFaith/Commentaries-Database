[[commentary]]
quote='''
We are cursed and we bless: for they exhorted those who ill-treated them to what is good. We suffer persecution and we endure; because they did not resist those who persecuted them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
