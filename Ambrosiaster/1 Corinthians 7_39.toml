[[commentary]]
quote='''
A woman is bound by the law as long as her husband lives. He pursues these things for this reason, to teach that a woman, even if she has been cast out by her husband, does not have license to marry. But if her husband has died, she is set free. These things too pertain to the causes stated above; to show how blessed the virgin is, since she is subject to no one except God alone. For she seems to overcome natural subjection, when she raises up what was humbled by nature. Let her marry whom she wishes, only in the Lord: that is, let her marry him whom she thinks suited to her, because unwilling marriages usually have bad outcomes. Only in the Lord, that is, that she marry without suspicion of disgrace, and marry a man of her own religion: this is to marry in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
