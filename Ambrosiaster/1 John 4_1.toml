[[commentary]]
quote='''
Hence it is that the epistle of the apostle John too: Do not, he says, believe every spirit, but test the spirits, whether they are from God (1 John 4:1), because if it says many good things, but in some point puts forth what is contrary to the faith, let it be known that it is not the Holy Spirit. For nothing of error can be found in the Holy Spirit. But through the exercise of speech some things are spiritual, and some carnal, because all error is assigned to the flesh; or else by a certain contrivance of cunning it feigns good things, so as to insert evil things among them, as I recalled above: just as in Montanus, and Priscilla, and Maximilla, the prophets of the Cataphrygians, the spirit of the world feigned the good by a certain imitation, so that through many things that were plausible, and true as well, it might lie that it was the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
