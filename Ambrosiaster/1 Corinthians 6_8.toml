[[commentary]]
quote='''
Why do you not rather accept injury? Why not rather fraud? But you do injury and defraud, and that to brethren. Now he rebukes those by whose injustice the quarrel is produced; for they are guilty not only through the fraud they have committed, but they also have a share in the offense of those who, driven by their injury or fraud, ask unbelievers to judge; and whereas they ought not to pursue fraud or injuries inflicted on them, they not only avenge themselves, but they themselves also commit fraud and injuries, so that they give the brethren examples deserving punishment. And what may one believe he does to others, who does not spare his own?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
