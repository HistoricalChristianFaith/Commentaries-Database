[[commentary]]
quote='''
Since we are members of his body, and of his flesh, and of his bones. This is to be understood spiritually; for he said that we are his members for this reason, because he himself is the head of the whole Church; so that, since through him we began to be, he is called our head, as the one from whom the whole body subsists; so that all spiritual creation may be his members, provided that it bends the knee in his name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
