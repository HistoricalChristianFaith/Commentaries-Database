[[commentary]]
quote='''
A humane saying, and worthy of all acceptance, that Christ Jesus came into this world to save sinners, of whom I am the first. But for this reason I obtained mercy, that in me first Christ Jesus might show all magnanimity and patience, for an example to those who are to believe in him, unto eternal life. What is so welcome and so pleasant as to preach pardon to sinners? For who is without sin, that he should not receive this gift with all thanksgiving, setting God before him as its author and praising him in Christ: who, to wash man clean of sins, descending from heavenly things to earthly, took the flesh of sin; mingled himself with earthly things, to make him heavenly; suffered himself to die, to restore him, rescued from death, immortal to paradise? Who would not extol without end these benefits which God has bestowed on man, the Lord on his servant, the Maker on his creature; so that he was greater still in his benefits to men, after he had made them, than when he made the things that were not? For, abandoned by them, and despised, and assailed with insults, he added to his benefits without being asked, that he might be more welcome and more to be preferred in restoring than when he made; to show that he is the one who can do all these things. So then Christ brought help to man in such a way as neither to violate his own purity nor to lose his power. For he willed to be born a man, holding it for certain that he would in no way be violated by the contact of the flesh; he mingled himself with the human way of life, knowing that he could not be corrupted by sins; he suffered himself to be killed, not unaware that death could not lord it over him, but that he would crush it by his own power. These things, therefore, he did to teach that he can do all things. For this humility does not tend to his diminishment but to his glory: and not only his, but also that of those who believe in him; for it is a dignity to be the servant of one who is powerful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
