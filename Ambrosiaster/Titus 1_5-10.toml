[[commentary]]
quote='''
For this reason I left you in Crete, that you should correct the things that are lacking and appoint presbyters city by city, as I also arranged for you: if anyone is without crime, the husband of one wife, having faithful children, not under accusation of luxury, or disobedient. For a bishop must be without crime, as the steward of God: not insolent, not wrathful, not given to wine, not a striker, not seeking shameful gains; but hospitable, kind, prudent, just, holy, continent, holding fast that word which is faithful according to doctrine, so that he may be able to exhort in sound doctrine and to refute those who contradict. For there are many who are not obedient, vain talkers and seducers, especially those who are of the circumcision, who must be reproved: who subvert whole houses, teaching what they ought not, for the sake of shameful gain. What has been read is plain; for he wants a bishop to be ordained who is both holy in works and prudent in words, so that he may be able both to exhort the brethren and to convict those who contradict, especially those who were from the Jews, who under the name of Christ taught men to judaize (Gal. 2:4), whom elsewhere he calls false brethren. For though reborn in Christ, they were not pure Christians; for they wished to venerate partly the Law, partly Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
