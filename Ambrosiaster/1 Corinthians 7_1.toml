[[commentary]]
quote='''
Now concerning those things which you wrote to me: it is good for a man not to touch a woman. Stirred up by the perverse notions of the false apostles, who out of hypocrisy taught that marriage was to be spurned, so that they might seem purer than the rest, they were asking the Apostle about these things by letter; for because they were not pleased with this opinion, they pass over everything else and ask about this alone. To them, however, he replied that it is indeed good not to touch a woman, although those men did not assert it in simplicity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
