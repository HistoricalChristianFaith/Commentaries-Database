[[commentary]]
quote='''
For first. By saying first, he shows the kind of sin from which arose the errors that he rebukes; for where there is dissension, nothing is right. When you come together into the church, I hear that there are dissensions, and I partly believe it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
