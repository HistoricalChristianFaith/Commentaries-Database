[[commentary]]
quote='''
But in doing good let us not fail; for in its own time we shall reap, unwearied. He says this because he who is strong for sowing will also be strong for reaping, that is, he will receive just as he does. Therefore he exhorts us to be ready for doing good, and says that we ought not to suffer weariness, secure that we shall receive great things for small, and eternal things for earthly, at the time that God has promised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
