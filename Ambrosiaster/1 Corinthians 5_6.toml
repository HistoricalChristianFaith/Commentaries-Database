[[commentary]]
quote='''
Is your glorying good? That is, it is not good; for they were glad, when they ought rather to have been grieved at a brother sinning so bitterly, as Samuel was grieved at Saul's sinning. This crime the bad teachers either overlooked or reproved too negligently (as Eli the priest (1 Sam. 2:23) did his sons when they sinned against God), lest they should be disagreeable to men.

Do you not know that a little leaven corrupts the whole lump? So too the sin of one man, which is known and not reproved, defiles many; indeed, all who know of it and do not shun it, or who, when they could reprove it, overlook it. For he does not think he is sinning when he is rebuked or shunned by no one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
