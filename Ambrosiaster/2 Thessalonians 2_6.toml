[[commentary]]
quote='''
Do you not remember that when I was still with you, I used to tell you these things? And now you know what holds him back: to this end, that he may be revealed in his own time. He says that this remains: that he who is to come before the Lord be revealed, so that then the Lord too may be expected to come; which he said above as if under a veil, saying: Unless the failing comes first, which, as I recalled above, is to be understood as the abolition of the Roman kingdom; so that when it has failed, and the Antichrist has come, then the coming of the Lord may be believed to be arriving.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
