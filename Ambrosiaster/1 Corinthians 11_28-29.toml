[[commentary]]
quote='''
But let a man prove himself, and so let him eat of that bread and drink of the cup. For he who eats and drinks unworthily eats and drinks judgment to himself, not discerning the body of the Lord. He teaches that one must approach communion with a devout spirit and with fear, so that the mind may know that it owes reverence to him whose body it approaches to receive. For it ought to judge this within itself: that it is the Lord whose blood it drinks in the mystery, the blood which is the witness of God's benefit. If we receive it with discipline, we shall not be unworthy of the body and blood of the Lord; for we shall be seen to render thanks to the Redeemer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
