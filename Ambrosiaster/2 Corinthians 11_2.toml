[[commentary]]
quote='''
For I am jealous for you with the jealousy of God; for I have prepared you to present you as a chaste virgin to one husband, to Christ. He shows that what he is about to say he will say out of love for them, so that it may serve not so much his own praise as their progress: that they may learn how they ought to support their parent in the Gospel; because the disparagement of a father is the detraction of his sons, and the praise of sons is the glory of the father (Sir. 3:13). He wants them, then, to be virgins in faith; hence he also jealously keeps the corrupters of faith away from them, so that on the day of judgment he may present them undefiled to Christ the judge. Hence it is that in the Apocalypse of John too one reads: These are, he says, those who have not been defiled with women; for they have remained virgins. These follow the Lamb wherever he goes (Rev. 14:4). By women he signified error, because error began through a woman, just as he also speaks of the woman Jezebel on account of the wife of Ahab, who out of zeal for Baal killed the prophets of God (1 Kings 18:40); since what is to be understood is idolatry, by which morals are corrupted, and the truth of faith as well. For if you understand it of women, so as to think that they are called virgins because they kept their bodies undefiled, you exclude the saints from this glory; for all the apostles, except John and Paul, had wives. And see whether it is fitting to accuse the apostle Peter, who is the first among the apostles; how much more among the rest?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
