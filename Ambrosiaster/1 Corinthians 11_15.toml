[[commentary]]
quote='''
But if a woman has long hair, it is a glory to her; since her hair has been given to her for a veil. He means that it is naturally honorable, and almost decreed, that a woman should make satisfaction by being veiled, and give thanks to God. Her hair, then, is a sign of the veil, so that will may be added to nature. Finally, no woman, even an unveiled one, approaches authority.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
