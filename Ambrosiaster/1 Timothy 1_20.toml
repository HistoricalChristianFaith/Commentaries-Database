[[commentary]]
quote='''
He says that he has handed them over to Satan, that they might be amended on account of their blasphemy. Now this handing over is this: the Apostle, moved by their blasphemies, pronounced sentence on them; and the devil, who is ready for this, to receive into his power those who are turned away from God, having heard the sentence, seizes them; so that they might understand that they were bound with punishments for this cause, because they had blasphemed. Hence it is that in the Gospel it was said among other things: now sin no more, lest something worse befall you (John 5:14), showing that on account of sin infirmities are sometimes inflicted on bodies. And that these are done with the devil as minister, the Lord declared, saying among many things: But this woman, since she is a daughter of Abraham, whom Satan had bound for eighteen years, ought she not to be loosed from the bond on the sabbath day (Luke 13:16)?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
