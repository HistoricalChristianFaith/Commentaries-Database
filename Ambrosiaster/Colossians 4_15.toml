[[commentary]]
quote='''
Greet the brothers who are at Laodicea, and Nympha, and the church in her house. Since in like manner he was anxious also for those who are at Laodicea, in their epistle he urges that these be greeted, esteeming Nympha the dearer, whose house too he greets; for she seems to have been so devout that her whole house was marked with the sign of the cross.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
