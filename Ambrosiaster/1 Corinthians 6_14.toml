[[commentary]]
quote='''
But God has both raised up the Lord, and will raise us up by his power. It is the same sense, which he wished to confirm by the example of the Lord's resurrection; for Christ is the power of God, by which he will raise us up, and the Lord himself. He said this because the Lord himself raised up his own body, just as the Lord himself says: Destroy this temple, and in three days I will raise it up. But he said this of the temple of his body (John 2:19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
