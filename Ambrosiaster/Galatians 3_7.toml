[[commentary]]
quote='''
Do you know therefore that those who are of faith, these are the sons of Abraham? It is true that believers are the sons of Abraham; because if Abraham was the first to be justified by faith, as many as believe after him are his sons, whether from the Jews or from the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
