[[commentary]]
quote='''
THE APOSTLE SAYS ABOUT THE PRINCES AND POWERS OF THIS WORLD THAT, IF THEY HAD KNOWN, THEY WOULD NEVER HAVE CRUCIFIED THE LORD OF MAJESTY; BUT, ON THE OTHER HAND, MARK THE EVANGELIST SAYS OF THE DEMONS, “FOR THEY KNEW HIM TO BE.” IF THE DEMONS KNEW, HOW DID THE POWERS NOT KNOW? — To some it seems that by “the rulers and powers of this age” he meant the leading men and chiefs of the Jews, who, according to the words of the Apostle Peter, did not know what evil they were doing. For he says: “I know, brothers, that you acted in ignorance, just as your rulers did.” These were the rulers of the Jews, yet they could not be called rulers of this age, since they had been brought under the power of the Romans, confessing that they had no king but Caesar. But these are the rulers whom the Apostle means elsewhere when he says: “We do not wrestle against flesh, but against the rulers of this world and the princes of these darknesses.” If, then, these are the rulers who, not knowing that the Lord of glory was Christ, crucified him, how could he have been known by the demons? The demons did not know him otherwise than as the rulers of this age knew him. For they knew that he was the one who had been promised in the Law, by the signs of prophecy; but they did not know his mystery, by which he was the eternal Son of God, nor the sacrament of the Incarnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 48: IF THE DEMONS KNEW CHRIST, HOW DID THE POWERS NOT KNOW?"

[[commentary]]
quote='''
And because the heat of the body flares up more strongly through the activity of the enemies to deceive the soul, for it is not the body that desires, but by its heat it generates desires in the soul, the assistance of our God must be pleaded for protection, that he may restrain them: for our struggle is not against flesh and blood, but against principalities and powers (Eph. 6:12). When these are removed, it will be easy to curb the motion of flesh and blood. For a inferno is extinguished if it lacks the material on which it feeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 115: CONCERNING FATE"
