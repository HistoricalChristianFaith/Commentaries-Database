[[commentary]]
quote='''
Tell me, you who wish to be under the Law, have you not read the Law? For it is written that Abraham had two sons: one by the slave woman, and one by the free woman. This is found in Genesis: that since Sarah could not bear children, for she was barren, she offered her slave woman Hagar to her husband Abraham as a concubine, so that she might adopt for herself what was begotten. So it came about that Ishmael was born of Hagar. But afterward, by the will of God, a son was promised to Abraham by Sarah his wife, who was barren: she bore Isaac to Abraham. Then Abraham began to have two sons, one by the slave woman and one by the free woman.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
