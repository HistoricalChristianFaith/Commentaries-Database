[[commentary]]
quote='''
O foolish Galatians! who has bewitched you? These are the words of one who is angry and amazed; for they had been so depraved that they did not even recognize that they had been deceived. He has used a preamble; for everyone who is bewitched passes from good into evil, just as these too passed from freedom and security to slavery and anxiety. Before whose eyes Christ Jesus was proscribed, and crucified in you. It is manifest that to the eyes of the foolish Christ seems proscribed, that is, despoiled or condemned; but to the eyes and senses of the prudent he seems not only not condemned, but rather to have himself condemned death by his cross; for the passion of the Lord is our life, and the destruction of death. But because these, having been transferred to the Law, had begun to think unworthily, he therefore complains that to their minds Christ seems condemned; and so he added: Crucified in you. That is, in your understanding he has been crucified, as a man; for he in whom hope is not full is a man. These therefore did not think that full salvation was in Christ, because they made the Law equal to him. But in those who rightly understand Christ, Christ lives in them; in Photinus he has been crucified. For that man is truly dead in whom Christ is said to be crucified; because this is brought against him by way of accusation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
