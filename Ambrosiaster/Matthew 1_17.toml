[[commentary]]
quote='''
SO, SINCE THERE ARE FORTY-ONE GENERATIONS, THE EVANGELIST SEEMS TO HAVE COUNTED FORTY-TWO (Matt. 1:17). FOR THREE TIMES FOURTEEN, WHAT DO THEY MAKE IF NOT FORTY-TWO?  —  According to the number, forty-one generations are counted; but according to the reasoning, forty-two are demonstrated. Now Jeconiah, who was born at the time of the exile, that is, made king, as is contained in Chronicles, brought the second section to an end. And because after the exile he remained in the kingdom by the permission of King Nebuchadnezzar, the third section begins from him, which runs up to Christ. Therefore Jeconiah is counted twice, so that he both closes the second section and begins the third. For it is written therefore: “And after the exile to Babylon, Jeconiah begot Salathiel” (Matt. 1:12). Up to this Salathiel, those from Judah reigned, namely, those of whose stock Joseph is born. For Jeconiah’s first son was named Assur. But since Joseph derives his lineage through Salathiel, Assur is passed over, and Salathiel is joined to his father Jeconiah, so that the line might lead to Joseph, to whom the Virgin Mary was betrothed. And after Josiah, Jeconiah follows. But because the line comes to Joseph through Joachim, the father of Jeconiah, he (that is, Joachim) is omitted, and Jeconiah is placed in his stead, so that the number of fourteen generations should not be exceeded, and because after Jeconiah come Salathiel and his son, through whom Joseph arises.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 5: ON THE GENERATIONS IN MATTHEW'S GENEALOGY"

[[commentary]]
quote='''
WHAT IS THE REASON THAT THE APOSTLE MATTHEW, MENTIONED ABOVE, DIVIDED ALL THE GENERATIONS INTO THREE PARTS (Matt. 1:17)? — Causes and times produce divisions. Therefore he distinguished from Abraham up to David. For the first part of the cause is from Abraham up to David, because Abraham is the father of faith and David the father of the kingdom. For Saul, having become unworthy, deprived himself of the kingdom. From David, however, up to the exile is another part of the cause, in which the Jews, having become depraved, lost the kingdom. But after the Babylonian exile up to Christ is the third part of weeping and misery, of captivity and dispersion for them; because although after the Babylonian exile and the period of seventy years, when, having been released by Cyrus, they returned to their own, they never afterwards had either cause or rest. For Judea could not rule thereafter, but they were always anxious and wandering everywhere. Indeed, at the time of Christ’s birth they were in captivity, saying: We have no king but Caesar (Jn. 19:15). For this reason Matthew made three stages of the genealogy, in order also to show the changes of merits and causes from the promise that was made up to Christ, while the seasons of the years remain in one grace until the end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 4: ON THE THREE PARTS OF THE GENEALOGY"

[[commentary]]
quote='''
HOW IS IT, THEN, THAT ALTHOUGH IT IS ESTABLISHED THAT FROM DAVID DOWN TO THE BABYLONIAN EXILE THERE ARE SEVENTEEN GENERATIONS, THE EVANGELIST SAYS THERE ARE FOURTEEN (Matt. 1:17), OMITTING AHAZIAH, WHO AFTER JORAM IS THE SON OF JEHOSHAPHAT, AND JOASH THE SON OF AHAZIAH, AND AMAZIAH THE SON OF JOASH? — Nothing should seem more credible than that the Evangelist followed the intention of the Law. And therefore, not without reason, these men were removed by the Evangelist from the number of the others. For their wickedness continued in such a way that their wickedness had no break. The evil that began with Joram ran on in this way as far as Uzziah, the son of Amaziah, so that there was no support from any side by which any one of them might remain, in part by the merit of his father, in the number of the kings. For Joram, acting wickedly, is with good reason preceded by Jehoshaphat in the list; and Uzziah, with good reason, has Jotham preserved in the list. But the continuous wickedness of those three was against God. Solomon too, by the merit of his father, is restored to the kingdom; and Rehoboam, the son of Solomon, acting wickedly, leaves Asa rightly in the number of the kings. But those three, shut in among the evildoers, acting wickedly, are therefore erased. For an example is worse, to the ruin of the line, when wickedness displays itself continually. And, to speak precisely, they are passed over because Joseph did not descend from their stock. For from Abraham the Evangelist followed the line of these generations, from which Joseph, to whom Mary was betrothed, draws his origin, she who bore Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 85: WHY MATTHEW OMITS THREE KINGS FROM THE GENEALOGY"
