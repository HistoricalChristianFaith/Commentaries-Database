[[commentary]]
quote='''
Why then was the Law of works laid down, until the seed should come to whom it was promised? The Law of works, that is, of Moses, was laid down in the middle between the promise once begun and the seed to whom the promise was made, that is, between Abraham and the Savior. It was given long after the promise was made for this reason, that by this very distinction the Law might be seen to be one thing and the promise another; that it might instruct the people of God, separated from the Gentiles, under the fear of God, so that it might become worthy to receive the promise, which is Christ. Yet it is called the Law of works because it teaches what things are to be done bodily, at God's command, concerning sacrifices, firstborn, tithes, and other such things. Ordained through angels in the hand of a Mediator. He calls angels the messengers of God, that is, Moses, and Joshua the son of Nun, and the other prophets up to John the Baptist, of whom God says: Behold, I send my angel before your face (Mal. 3:1). Through these, therefore, the Law, set in order, was ordained by God in the hand, that is, in the power, of the Savior; for he is the mediator or reconciler of God and men (1 Tim. 2:5), to save whom he wills of those who received the Law through the Angels mentioned above. For he himself says: As the Father raises the dead and gives life, so also the Son gives life to whom he wills (John 5:21).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
