[[commentary]]
quote='''
That the spirit may be saved in the day of the Lord Jesus Christ. He hands the aforesaid defiled man over to Satan, so that the spirit may be saved in the men of the Church on the day of judgment; for unless he had been cast out, the spirit of the Church would not be saved on the day of judgment. For it was deserting them all because of the defilement, so that on the day of the Lord, being found bare of the Holy Spirit, they would hear from the Lord their judge: Depart from me, I do not know you (Matt. 7:23); as he says to the Romans: But if anyone does not have the spirit of Christ, he is not his. (Rom. 8:9); and in another epistle: Do not grieve the Holy Spirit of God. (Eph. 4:30). For if he is grieved, he deserts, and will not be saved: not, of course, for himself, who is impassible, but for us to whom he was given, so that through him we may be proved to be sons of God. For a thing that is lost is not safe, not, of course, for itself, since wherever it may be it must still exist, but for him by whom it is lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
[[commentary]]
quote='''
And do not grieve the Holy Spirit of God, in whom you have been sealed for the day of redemption. When we act well, the Holy Spirit, who has been given to us, rejoices in us, seeing his admonitions advance our benefit, as was said by the Lord: So there will be joy in heaven over one sinner repenting (Luke 15:10). The Holy Spirit therefore rejoices for our salvation, not for himself, since he has no need of gladness; so, on the contrary, if we are not obedient to him, he is grieved, because he has no progress in us; for he wants us to belong to life. Yet he is not grieved in such a way as to suffer, since he is impassible: but when he says he is grieved, he signifies this on our account; because he deserts us, in that we have offended him by despising his admonitions. His grieving, therefore, is our unworthiness, which prevents us from being called sons of God; for it is he, the Holy Spirit, who sanctifies the sons of God, remaining in us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
