[[commentary]]
quote='''
I adjure you by the Lord that this epistle be read to all the brothers. He binds them to be careful to read the epistle to all the brothers, so that they may know both his praises and his admonitions, through which they may become perfect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
