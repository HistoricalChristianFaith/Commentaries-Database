[[commentary]]
quote='''
When, then, all things, laid beneath his feet, have confessed Christ as God, then Christ the Lord himself also will be subjected to God the Father: That God may be all in all. He says this because, when the pride of all principalities and powers and dominions has been crushed, and they have worshiped Christ as God, then Christ too, on account of the unique authority of the Father, will indeed show himself God, but from God; so that the sublime and ineffable authority of the one principle may remain. This is the Son's subjecting himself to the Father, this is God's being all in all; because when every creature learns that its head is Christ, and that the head of Christ is God the Father, God the Father is all in all (Phil. 2:10–11), that is, so that every creature may think one thing, so that with one voice every tongue of those in heaven and on earth and under the earth may confess that there is one God, from whom are all things. But if he had said: That God may be in all, it would be understood that he is indeed in all, but by affection, or by a common sense; not, however, that those very things are from him. But when he said: All in all, he signified this: that they are both from him, and he is in them: from him, because they were created by him; and in them, because in the confession of all there is one God. Yet the Son is not subjected to the Father in the way that the creation is subjected to the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
