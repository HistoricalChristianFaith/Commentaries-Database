[[commentary]]
quote='''
Husbands, love your wives, as Christ also loved the Church, and delivered himself up for her, that he might sanctify her, cleansing her by the washing of water in the word; that he might present to himself a glorious Church, not having spot, or wrinkle, or any such thing, but that she may be holy and spotless. So also husbands ought to love their wives. Wives are commanded to be subject and to hold their husbands in reverence; but husbands are admonished so to love their wives that they would even lay down their lives for them, having, for love's sake, a zeal for their affection and their discipline, that they may be devout and holy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
