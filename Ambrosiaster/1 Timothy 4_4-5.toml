[[commentary]]
quote='''
Hence it is that the Apostle shows that all things were made good by God, provided they are taken with thanksgiving; for they will be unclean to him who does not praise the Creator in them. For those things cannot do good to one who takes them in such a way as to treat their author ill.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
