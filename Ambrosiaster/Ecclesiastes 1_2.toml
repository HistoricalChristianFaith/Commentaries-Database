[[commentary]]
quote='''
AGAINST THOSE WHO DENY THAT ANYTHING CONCERNS GOD. — To many whom this worldly darkness has blinded, we are most displeasing if we anxiously keep God’s commandments, if we avoid occasions of sinning, if we strive with saving zeal to accomplish every good thing, if we disregard the seductive allurements of temptations and vices, if we allow ourselves to be captured by no worldly sweetness, if we willingly undergo tortures and punishments for the name of God, if by the strength of the spirit we hold death itself in contempt. To those, namely, whose mortal sense has persuaded them that everything done is worthy neither of praise nor of blame. For they do not want any of these things to pertain to God. Some, so eager to defend their crimes and wicked deeds, say: It is of no benefit whether you live well or badly. For it is not God’s concern now to carefully rush to look upon you as you act in different ways according to your own disposition and disease, and at some point to trouble his eyes with your foul deeds. All things that are celebrated as one pleases are vain: he who pertains to God is hidden and removed from these human affairs, and therefore neither grows angry nor is moved; he has no contemplation of human affairs, none of our actions; the entire course of the whirling age, and a certain mysterious rolling of the worldly sphere, so seizes, snatches, and hurls him away that anyone is considered a fool who thinks he can call him back to the care of God. Not even the disposition of martyrs, then, is to be approved, who suppose that their God, whom they proclaim to be merciful, delights in the shedding of their blood. Nothing in us is dear to him, nothing is hateful; he rejoices in no circumstance of our death, in no integrity of our health; nor does he desire to know what is being done or where: not because it would be impossible for the divine majesty to have knowledge of almost all things that have been done or are being done, but because he does not wish to know the miseries of men and worldly vanities. Therefore, finally, it is written: Vanity of vanities, all is vanity (Eccles. 1:2). Their opinion, fixed in despair, is dissolved by the authority of the divine sense, and is likewise refuted as overthrown by their own sacred popular speech, which is held in highest use. For when amid business and various dealings faith and treachery contend, divine witness is called upon, that witness which, they say, sometimes does not know what we are doing. “God is my witness,” they say; “God see, God judge, God act, God repay.” And when the need for an oath arises, and the mind of the one who swears fears lest something befall him if he perjures himself; he both demands an oath and is confident that it can be exacted from him who has sworn falsely. And when the desired recovery and good health has been obtained, thanks are rendered to the divinity. And when, in some falling matter, one who was in near danger has escaped unharmed, they say that the good God has provided it. And when, with the contrary blowing of the winds, the waves of the stirred sea rise up, and the ship, struck on all sides, is shaken, the crowd of sailors stretch their hands to heaven, with supplicating voice beg God, and are confident that they can be heard and delivered. Where comes all this, if God has no care for us, if he does not know what we are doing? That persuasion therefore is empty. All things are known to God. Let no one flatter himself concerning the freedom of his committed crimes. The good life is of a greatest reward, and of an evil life is eternal punishment and everlasting torments. Therefore, to us who believe that God knows all things, who devoutly rush to martyrdom, an immeasurable reward, eternal life shall be given; but to the wicked, who have tried to teach that God does not know their crimes and hidden wickedness, there will be supplied a consuming flame of fire and a blaze that never ceases.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 1: AGAINST THOSE WHO DENY THAT ANYTHING CONCERNS GOD"
