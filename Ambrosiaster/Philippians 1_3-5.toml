[[commentary]]
quote='''
I indeed give thanks to the Lord upon every remembrance of you, always in every prayer of mine for you all making prayer with joy, for your fellowship in the Gospel. First indeed he gives thanks to the Lord, by whose will all things turn out prosperously for the faithful. In every prayer of his he is mindful of them with exultation, because they have been made partakers of the Gospel, as the apostle Peter, saying among other things: That you may be, he says, sharers of the divine nature (2 Pet. 1:4).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
