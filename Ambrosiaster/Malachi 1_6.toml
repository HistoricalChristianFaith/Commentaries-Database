[[commentary]]
quote='''
He is God because of fear, but Father for the sake of honor, and because from him is every origin; for he himself said in Malachi the prophet: If I am God, where is my fear? and if I am Father, where is my honor (Mal. 1:6)?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
