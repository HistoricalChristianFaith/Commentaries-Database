[[commentary]]
quote='''
For you yourselves know how you ought to imitate us, since we did not live intemperately among you, nor did we eat bread from anyone for nothing; but in labor and toil, working night and day, so that we might not be a burden to any of you: not because we did not have the power, but that we might give ourselves as a pattern to you for imitating us. He says that they are not ignorant of his work and labor, which he carried out diligently to the end, so as not to need another's bread, that he might give them an example for imitating him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
