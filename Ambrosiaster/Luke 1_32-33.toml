[[commentary]]
quote='''
WHAT PROVES THAT MARY, THE MOTHER OF THE LORD, IS OF THE TRIBE AND LINEAGE OF DAVID? — We will bring forward the testimony of a trustworthy witness. For the Angel says to Mary among other things: "And the Lord God will give him the throne of David his father, and he will reign in the house of Jacob forever, and of his kingdom there will be no end" (Luke 1:32–33). How could David be called by a trustworthy witness his father, if his mother Mary were not of the seed of David?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 86: THAT MARY IS OF THE LINEAGE OF DAVID"
