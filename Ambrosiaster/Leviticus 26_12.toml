[[commentary]]
quote='''
As God said (Lev. 26:12): I will dwell in them and walk among them, and I will be their God, and they shall be my people. Therefore go out from their midst and be separated, says the Lord (Isa. 52:11), and do not touch what is unclean; and I will receive you, and I will be a father to you, and you shall be sons and daughters to me, says the Lord almighty. Meanwhile let us explain the sense of the first matter, so that we may make plain whose person's words they are, who says: I will dwell in them and walk among them, and I will be their God, and they shall be my people. These are the words of Christ; for this is what Jeremiah testified among other things, saying: After these things he was seen on earth and conversed among men (Bar. 3:38); for he dwelt in us, as John the apostle says: And the Word was made flesh and dwelt in us (John 1:14). And that he is our God, Jeremiah says again: This is our God (Bar. 3:36). And that we are his people there is no doubt; for the Church is Christ's. And therefore he wishes us to be separated from all defilement, so that he may receive us as sons, as he says: Little children, yet a little while I am with you (John 13:33). And that he is almighty, I think ought not to be doubted. For if, as he himself says, whatever the Father does, the Son also does likewise (John 5:19), this means that the Son can do all things that the Father also can. If there is something the Father cannot do, the Son also cannot. But the Son is trustworthy, who says of the Father: But with God all things are possible (Matt. 19:26). By this testimony he has both exhorted us to a pure life and shown that our Lord Jesus was long ago predestined as our Lord and as the one who would receive us in the affection of his love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
