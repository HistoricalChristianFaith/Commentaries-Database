[[commentary]]
quote='''
But we exhort you, brothers, to abound the more; and to strive to be quiet, and to do your own business, and to work with your own hands, as we commanded you; that you may walk honorably toward those who are outside, and that there may be in you desire of nothing. Again he exhorts them to the same things, that they should take pains to abound in good actions; for he admonishes this often in order to signify that this truly is what pleases God. For the way of righteousness must be held, so that one may come to mercy by right; so that those who are lower in substance may labor with their hands; so that by that very application they may be lifted out of common restlessness and depraved thought, and so that their discipline may be praised even by unbelievers, and they may be provoked to faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
