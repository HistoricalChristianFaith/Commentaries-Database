[[commentary]]
quote='''
But you received me as an angel of God, as Christ Jesus. This he praises in them still more, that he was not disfigured in their eyes by his afflictions, but commended, since they knew that he suffered ruin for those who believe. So they received the Apostle as an angel of God, believing that what he preaches is the gift of God: thus deferring to him as though to the author himself, the Lord Jesus Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
