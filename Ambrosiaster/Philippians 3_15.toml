[[commentary]]
quote='''
As many of us, then, as are perfect, let us be of this mind. Above he denies that he is perfect, but with respect to the promise, so that something may still be added to his merit; in comparison with the rest, however, who attend to divine things more negligently, those are to be called perfect who, applying diligence, walk the road of perfection. This, then, must be their mind: that they advance for the better. And if in anything you are otherwise minded, God will reveal this also to you. He says this so that, if they should devise anything further for the cultivation of an improved way of life, they may consider it to be the gift of God, lest they be puffed up by it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
