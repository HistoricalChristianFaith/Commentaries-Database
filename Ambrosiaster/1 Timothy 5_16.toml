[[commentary]]
quote='''
If any faithful man or any faithful woman has widows, let him minister to them sufficiently, so that the Church is not burdened with their maintenance, so that it may suffice for the true widows. What wonder if Apostolic power could foresee the future? For what he said is plain to see, since the widows of the faithful now greatly burden the Church, and of those who seem rich in the world; because, when the women cease from the work of wool-making on account of old age, they withdraw from them both clothing and food, not all of it, however, but in part, so that through that very want they may turn to the Church in order to live: whereas they ought not only to give generously to their own needy but also to feed and clothe other poor women. This does much harm; for when it is given to these, to the rest either less is given, or nothing, though it ought rather to be given to them, who are worthy to be ministered to at the Church's expense. And thus it is burdened, when it is compelled to clothe many, though it ought to clothe few: and the people, which could gladly and often minister to a few, is compelled to let more go, so that it either murmurs or comes to their aid more slowly. For whereas he commands that a widow be chosen who was the wife of one husband, now there are found among them not only wives of two or three husbands, but even women who have lived more shamefully: which sometimes happens through negligence, sometimes through the power of the one who introduces them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
