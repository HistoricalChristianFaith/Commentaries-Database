[[commentary]]
quote='''
But concerning the affection of brotherhood we have no need to write to you; for you yourselves are taught by God to this end, that you love one another (John 15:17). For you also do this toward all the brothers throughout all Macedonia. Even while he praises them for doing this, he nevertheless warns them to do it more readily; for in saying that they have been taught by God himself, he signifies that they ought to be the readier in brotherly love. For on account of his great love God has had mercy on us; and when we have become his imitators, we show that we have not undeservedly been adopted by God as sons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
