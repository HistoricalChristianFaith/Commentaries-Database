[[commentary]]
quote='''
For I bear them witness that according to their strength, and beyond their strength, they were willing. They had given of their means for the ministry as much as was fitting and pleasing to God, who knew their strength. And because they had given themselves to God with their whole heart, they wished to offer more than their strength allowed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
