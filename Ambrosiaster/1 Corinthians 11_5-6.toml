[[commentary]]
quote='''
But every woman praying or prophesying with unveiled head puts her head to shame; for it is one and the same thing as if she were shaved bald. But if a woman is not veiled, let her be shorn; but if it is shameful for a woman to be shorn or shaved bald, let her veil her head. For a man ought not to veil his head, since he is the image and glory of God. Although man and woman are of one substance, yet because the man is the head of the woman, he is declared to be set before her; so that he is greater by cause and reason, not by substance. The woman, then, is inferior to the man, for she is a portion of him; because the man is the origin of the woman: for she is from him, and for this reason the woman is seen to be bound to the man, so that she is subject to his authority.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
