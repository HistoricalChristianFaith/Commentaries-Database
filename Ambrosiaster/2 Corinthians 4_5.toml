[[commentary]]
quote='''
For we do not preach ourselves, but Christ Jesus our Lord. That is, we do not proclaim our own glory, lest anyone should say that we preach the Gospel for our own sake, so that it might perhaps profit us for a time: but we proclaim Jesus our Lord, subjecting ourselves to his power and majesty. Since, then, we burden no one, extort from no one, and confess Christ our Lord, what reason is there that we should be judged proud, as though we preached for our own advantage, in order to appear glorious? And ourselves your servants for Jesus' sake. He proves himself so much the servant of Christ that, at his command, he testifies that he is their minister in preaching; so that for their benefit they are made subject in the ministry of the Gospel. In saying servants, then, he means ministers: but he spoke so in order to speak humbly, so as truly to show that he preaches the Gospel not for his own glory, but for the splendor of our Lord, whom he obeys, whom he serves, as the Lord himself also says: I am in your midst not to be served, but to serve (Luke 22:27); not because of the merit of those whom he serves, but because of the command of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
