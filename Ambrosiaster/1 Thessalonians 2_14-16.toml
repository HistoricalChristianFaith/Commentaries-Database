[[commentary]]
quote='''
For you, brothers, became imitators of the churches of God which are in Judaea in Christ Jesus; because you too suffered the same things from your own fellow tribesmen, just as we ourselves did from the Jews, who both killed the Lord Jesus and the prophets, and persecuted us, and do not please God, and are opposed to all men, forbidding us to speak to the Gentiles that they may be saved, so as to fill up their sins always; but the wrath of God has come upon them to the end. He complains of the impiety and unbelief of the distrustful Jews, who are enemies not only of their own salvation but also of that of others, forbidding them to believe and be saved, parricides from the beginning; for they ought at least to have spared the common Lord, they who did not spare their fellow servants and their overseers: so that their sins might be filled up, to such a degree that they should never deserve to obtain mercy. Therefore he says that the Thessalonians suffered the same things from their fellow citizens, having imitated the patience of the saints and of our Lord Jesus Christ; and he brings in the Jews as the authors of that crime, so that it may be discerned both of how great glory those are worthy who suffer for the name of the Lord, and what vengeance is prepared for the hostile and the faithless.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
