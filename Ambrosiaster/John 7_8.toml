[[commentary]]
quote='''
IT IS READ IN THE GOSPEL OF JOHN THAT, AFTER THE SAVIOR HAD SAID HE WOULD NOT GO UP TO THE FEAST DAY, HE WENT UP (John 7:8, 14); THIS SEEMS TO BE A SIGN OF INCONSISTENCY. — You always conceal the meaning by abbreviating the statement. For what you call into question took place when, being in Galilee because of the uproar of the Jews, and with His brothers still not believing in Him, He was being urged to go up to Judea, because the feast day of the Jews was at hand, that He might suffer agitation. But He answered them, saying: You go up to this feast day, because the world does not hate you; but it hates Me, because I expose its works. I am not going up to this feast day, because My time is not yet fulfilled. Then His brothers went up to the feast day, but He remained in Galilee. Afterwards, He also went up to the feast day. What appears contrary, when He did not go up at the time He refused, but went up later; and He went up not as if to the feast day, but as if to a dispute? For they all went up rejoicing, as though to enjoy the pleasures of the feast day. It is therefore certain that He did not go up to the feast day. But for the Savior, that was the feast day on which by His Passion He redeemed the world. Finally, He says: Now is the Son of Man glorified, and God is glorified in Him (Jn. 13:31). This is His feast day, on which He conquered death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 78: ON THE SAVIOR SAYING HE WOULD NOT GO UP TO THE FEAST, THEN GOING UP"
