[[commentary]]
quote='''
They profess that they know God, but in deeds they deny him; since they are execrable, disobedient, and reprobate for every good work. Although the saying pertains to all heretics, yet he is understood to have spoken this of the Jews, who say that they alone know the God of Abraham, but deny him by their works, as the Lord says: If you were sons of Abraham, you would do the works of Abraham (John 8:39). How then can they know the God of Abraham, who are ignorant of his mystery and his faith, following not the works of the Gospel but those of the law of deeds, in new moons and circumcision and the rest, disturbers, ungodly and irreverent? These are the works that do not know God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
