[[commentary]]
quote='''
Even so, brother, so may I enjoy you in the Lord: refresh my heart in Christ. Having confidence in your obedience I have written to you, knowing that you will do beyond what I say. Now he coaxes him, so that his obedience may be voluntary, that he may be able to have its fruit. For thus he provokes him to do more than is asked of him; for it usually happens that one who sees that good is thought of him shows himself better.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
