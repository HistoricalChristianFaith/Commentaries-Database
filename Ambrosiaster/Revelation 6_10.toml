[[commentary]]
quote='''
SINCE THE LORD HAS CERTAINLY TAUGHT THAT WE MUST PRAY FOR OUR ENEMIES, WHAT DOES IT MEAN THAT IN THE APOCALYPSE THE SOULS OF THE SLAIN SEEK TO BE AVENGED AGAINST THEM, ASKING GOD FOR VENGEANCE (Matt. 5:44; Rev. 6:10)? — For the souls of the slain cry out in this way, asking to be avenged, just as the blood of Abel cried out from the earth (Gen. 4:10). Therefore, it is the causes themselves that are said to cry out, when they cannot actually speak. For what does spilled blood ask, if not to be avenged, crying out not with a voice but with its very meaning? Likewise, a work is said to praise its maker by the very fact that it delights the one who looks upon it. The saints are not so impatient that they would press for something to happen immediately which they know will take place at its appointed time, something that can neither be anticipated nor delayed. By saying this, he wished to show that God will avenge the blood of His saints, so that, because He now appears so patient, the wicked war waged against the saints would not be thought to remain unpunished; and therefore, while striking terror into those who persecute God’s servants, He might also encourage those who suffer for His sake to persevere. For the soul of the sufferer is revealed when it hears that the Mighty One will avenge it. It bears hope within itself when it hears that its death displeases the Judge: then it is certain that it is innocent. And God indeed is merciful and patient, but in due measure. He waits for the wicked to believe and for sinners to improve themselves; otherwise, they will be punished, because they have despised the long patience of God. He has shown an example of this even in the time when mercy is proclaimed, so that He might not appear unfeeling rather than patient, as though neither anyone’s suffering nor compassion could move Him. Therefore it is that He says through the prophet, “I have kept silent; shall I always keep silent?” (Isa. 42:14); and the Lord says, “Will not God, then, bring about justice for His servants who cry out to Him day and night?” (Luke 18:7). They cry out in just the way we have said above. Therefore, if any Christian exacts justice for a time, not harshly and not with bloodshed, he does not sin; yet he will have done better if he leaves it to God the Judge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 68: ON THE SOULS OF THE SLAIN SEEKING VENGEANCE"

[[commentary]]
quote='''
SINCE THE LORD HAS CERTAINLY TAUGHT THAT WE MUST PRAY FOR OUR ENEMIES, WHAT DOES IT MEAN THAT IN THE APOCALYPSE THE SOULS OF THE SLAIN SEEK TO BE AVENGED AGAINST THEM, ASKING GOD FOR VENGEANCE (Matt. 5:44; Rev. 6:10)? — Since the Apocalypse, while testifying that future evils and tribulations will come as the result of unbelief and a wicked life, with God as avenger, also shows, by a hidden, inward vision, a model of the punishments for each sin, in order to prove that no wickedness or cruelty will remain unpunished, it says that the souls of the slain ask day and night to be avenged. This is not in fact contrary: for God, who gave this law, has promised that He will avenge Himself on the day of judgment, so that He may seem to have given this command for the present which excuses the souls of the slain if, now placed there, they ask for the day of vengeance. And yet, to speak more accurately, it is the cause that is to be understood as crying out. That in itself is never silent, but always demands vengeance: as God says to Cain, “The blood of your brother cries out to me from the earth.” What does this mean if not that the cause of the crime cries out, desiring to be avenged? For if we say, because of its produce, “The earth praises the Lord,” although it has neither voice nor understanding, so also, because of evil deeds, blood is said to cry out. For they were certainly not so impatient nor so ignorant as to ask to be avenged before the future day of judgment, lest they should request that something be done which they knew could not happen before the appointed time. And similarly the Savior says, “Will not God bring about justice for His elect who cry to Him day and night?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 12: ON THE SOULS OF THE SLAIN SEEKING VENGEANCE"
