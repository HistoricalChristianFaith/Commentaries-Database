[[commentary]]
quote='''
Yet things without a soul that give a sound, whether flute or harp, if they do not give a distinction of sound, how will what is piped on the flute or played on the harp be known? For if the trumpet gives an uncertain sound, who will prepare himself for battle? Since examples persuade more easily than words, he commends by examples, through which they may easily grasp that those who cannot interpret ought not to speak in tongues in the Church. For why should he speak whom no one understands?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
