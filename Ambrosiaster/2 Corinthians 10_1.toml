[[commentary]]
quote='''
But I Paul myself beseech you by the meekness and modesty of Christ, I who to your face am indeed humble among you, but when absent am confident toward you. That is what he now says: that he is such when absent as he is also when present. For he was not humble to their face through flattery or through subjection in any matter, he who was so zealous for his constancy that he sometimes refrained even from lawful things, lest he be made to stoop. Hence he says in another letter: All things are lawful for me, but I will be brought under the power of none. Food for the belly, and the belly for food; but God will destroy both it and them (1 Cor. 6:13). Therefore, then, when absent he beseeches them and interposes the modesty of Christ, lest when present he be found harsher, because of their men, than he is in the letter; so that those who had not yet amended themselves, composing themselves, might soften the Apostle's rigor toward them; so that, finding them restrained, he might hold back his severity and rejoice in them. By assurance, therefore, he signified the confidence of severity, which perhaps he was thought to have only in a letter, but not when present, face to face; because in the first letter he seems severe and too rigid: and therefore he warns them, lest he use the same severity when present, as they were not expecting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
