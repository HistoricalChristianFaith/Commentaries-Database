[[commentary]]
quote='''
But if any widow has children or grandchildren, let her learn first to manage her own house with godliness, and to render to her parents a return of gratitude in turn; for this is acceptable before God. He says that the widow is first to be proved in this life and way of life, so that only then may she be worthy to be called a widow of the Church, one who submits to ecclesiastical discipline not for the sake of gain rather than of protection. For merits ought to go before, so that the honor due may be seen to be granted to her when she comes forward; for she who has dealt with her own dear ones with godliness, and has governed her house well, has kept the law of God, and has become worthy of the Church's remuneration.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
