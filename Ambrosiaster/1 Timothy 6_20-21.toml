[[commentary]]
quote='''
Timothy, guard what has been entrusted, avoiding profane novelties of words, and the oppositions of knowledge of a deceitful name, which some, professing it, have fallen away concerning the faith. Grace be with you. He admonishes the same things, that what has been said above be kept, and that the things contrary to religion be avoided, which usurp only the name of knowledge, deceitful in their profession, so as to deceive the simple; for they feign the faith from which they have fallen away, so as to bring in faithlessness. And he subscribed with his own hand, saying: Grace be with you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
