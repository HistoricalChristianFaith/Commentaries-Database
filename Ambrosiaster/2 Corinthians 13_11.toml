[[commentary]]
quote='''
Finally, brothers, rejoice, be perfect, receive consolation, think the same thing, live in peace; and the God of peace and love will be with you. This joy will come from amendment, from which perfection too will be able to result: but first there will be consolation, so that in hope of the things to come they may forsake present delight. Think the same thing: he says this because of the old discord, so that they may now be of one mind. Live in peace. If they are in concord, they will have peace. And the God of peace and love, he says, will be with you. The God of peace is Christ, who said: My peace I give you, peace I leave you (John 14:27). He is also the God of love, because he says again: A new commandment I give you, that you love one another. And by this, he says, all will know that you are my disciples, if you have for one another the love with which I have loved you (John 13:34). Yet the peace of God is one thing, the peace of the world another; for the wicked and the filthy also have peace, but for damnation; whereas the peace of Christ is free from sins. So it flees faithlessness, spurns guile, resists evil deeds. This peace is pleasing to God and his friend, but the enemy of the devil. Whoever has it will have both love and, together with it, their God, for perpetual protection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
