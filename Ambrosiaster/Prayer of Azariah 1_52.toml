[[commentary]]
quote='''
IF A HORSE AND A MULE DO NOT HAVE UNDERSTANDING, HOW MUCH LESS SO DOES THE EARTH, A THING WITHOUT SENSATION? WHAT THEN DOES IT MEAN WHEN THE EARTH IS SAID TO BLESS THE LORD (Ps. 31:9; Dan. 3:74)? — It is not to be understood in the way the words sound. For a work, although it is mute, is said to cry out the praise of its Creator: for it urges those who look upon it to bless the Maker; just as every well‑crafted vessel praises the craftsperson. Indeed, when it is read in the Psalms, Shall the dust give thanks to you, or declare your truth? (Ps. 29:10) Therefore, in every insensible substance, it is not the will, of which there is certainly none, but the works that bless the author. But if you wish to take this spiritually, understand that man is signified by “earth,” according to the saying of the prophet: Remember, O Lord, that we are dust (Ps. 102:14); he whom the works of creation exhort to burst forth in praise of his Maker.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 38: WHAT DOES IT MEAN WHEN THE EARTH BLESSES THE LORD?"

[[commentary]]
quote='''
IF A HORSE AND A MULE DO NOT HAVE UNDERSTANDING, HOW MUCH LESS SO DOES THE EARTH, A THING WITHOUT SENSATION? WHAT THEN DOES IT MEAN WHEN THE EARTH IS SAID TO BLESS THE LORD (Ps. 31:9; Dan. 3:74)? — Let the earth bless the Lord, he says; that is, let it praise and confess your truth. How then in the Psalms does he say, Shall the dust give thanks to you, or declare your truth? (Ps. 29:10) It is not to be understood simply as it is read and as the words sound. For the earth does not have understanding, that it might give thanks to the Creator. But if you take this spiritually, understand “earth” as man, according to the saying of the prophet, Remember, O Lord, that we are dust. (Ps. 102:14) The work of the created world urges him to burst forth into praise of the Creator, so that he may gain the confession of His truth through those things which, although silent, are said to cry out the praise of the Creator, whose work they are. This, then, is the reason why, in the creation, the earth is said to bless God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 16: WHAT DOES IT MEAN WHEN THE EARTH BLESSES THE LORD?"
