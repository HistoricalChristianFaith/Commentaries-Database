[[commentary]]
quote='''
For before certain men came from James, he ate with the Gentiles; but when they had come, he withdrew and separated himself, fearing those who were of the circumcision. And the rest of the Jews also dissembled with him, so that even Barnabas consented to their dissimulation. All these Jews who consented to the dissimulation of Peter and Barnabas were of good faith; but because of the stumbling block of those who came from James (for they were zealots of the Law, who would venerate both the Law and Christ with equal right, which is contrary to the teaching of faith), in their presence they did not mingle with the Gentiles. For they feared the onslaught of the audacity of those who were zealous for the Law. And if that alone had been so, it was not blameworthy; but in what the error lay, he shows in what follows. For he himself too certainly yielded to the animosity and audacity of the Jews, fearing lest, through something that is easy, a stumbling block might creep in that would be hard to calm; for he both purified himself according to the Law under compulsion (Acts 21:26), and circumcised Timothy unwillingly (Acts 16:3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
