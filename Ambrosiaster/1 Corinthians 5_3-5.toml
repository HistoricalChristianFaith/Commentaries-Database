[[commentary]]
quote='''
I indeed, absent in body but present in spirit: that is, absent in face, but present by the authority of the spirit, which is nowhere absent. Have already judged, as though present, him who has done this, in the name of our Lord Jesus Christ, you and my spirit being gathered together, with the power of our Lord Jesus, to hand this man over to Satan for the destruction of the flesh. Since every pleasure of the flesh is from the devil, therefore when one gives himself up to this pleasure, he is handed over to Satan; for the flesh has this in its nature, that it perishes; the soul, then, when it joins itself to its desire, weakening its own spiritual vigor, suffers destruction along with it. Therefore if this man, rebuked for the debauchery he had committed, were to blush at being cast out, he would not perish, repentance following. Not only by the consent and presence of all, but by the power of the Lord Jesus, that is, by the sentence of him whose embassy the Apostle was discharging, he decreed that he must be cast out of the Church. When he is cast out, he is handed over to Satan for the destruction of the flesh; for both soul and body perish when things contrary to the law are done; but in this case the destruction of the flesh is ascribed to the man in another way. For although all sins make a man carnal, yet this is in a special sense the desire of the flesh, through which it hands him over, together with the body, to Gehenna; because the soul, when overcome, stained with filth, becomes flesh through the lust of the flesh; just as the body too, when rightly governed, is called spiritual. It is, however, the mind which either, overcome by enticements, makes the whole man fleshly, or, remaining in the vigor of its own nature, grants the flesh to be called spiritual.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
