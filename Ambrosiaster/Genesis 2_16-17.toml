[[commentary]]
quote='''
WHY DID GOD IMPOSE UPON ADAM THAT HE HAD PLACED IN THE WORLD A COMMANDMENT, A LAW, AFTER HAVING GIVEN HIM DOMINION OVER ALL CREATURES? — Although Adam was placed in the world and received a command or law, while he himself held dominion over the rest, yet, though Adam was set as lord in the world, because he did not receive this from himself but from God, he had to receive the meaning of this reality from the law; so that he who appears to be lord might, through the law, be subject to the One who had given him this power; so that the authority of the Creator, through the law, might inspire reverence in him, lest so great a dominion exalt him and cause him to become forgetful of God, his Maker.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 4: WHY DID GOD IMPOSE A COMMANDMENT UPON ADAM?"

[[commentary]]
quote='''
From this point I will now return to the remaining part of the passage. When man was placed in paradise, he received this command: "From every tree that is in paradise for food, you shall eat. But from the tree by which good and evil are distinguished, you shall not eat from it." (Gen. 2:16-17) All the trees he mentions are fruits for the nourishment of creatures. Indeed, they are called "trees" by one name, but various fruits are understood. Yet all are trees, and there is one kind of eating, though the things eaten are different. For when God had created many fruit-bearing trees for man to eat, as I said, he forbade eating from one tree; so that those who had received everything in their power might have some reverence for the Creator, in that one tree was reserved, whose use they did not have permission for, so that they would remember the condition of the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 127: THE SIN OF ADAM AND EVE"
