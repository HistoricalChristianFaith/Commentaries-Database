[[commentary]]
quote='''
But as then he who had been born according to the flesh persecuted him who was according to the spirit, so it is now also. Not only Ishmael was born according to the flesh, but Esau too; for he too was born as a type of the Jewish people. Of him it is written in the prophet Malachi: Jacob I loved, but Esau I hated (Mal. 1:3). He persecuted Jacob, who, born as a figure of the Christian people, was called Israel, that is, a man seeing God (Gen. 27:41). Likewise he signified that the Jews too persecute the Christians through envy; whence they had deliberately overturned the Galatians with carnal cunning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
