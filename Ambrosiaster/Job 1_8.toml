[[commentary]]
quote='''
ON JOB. — Great is the love, dearest brothers, of Almighty God toward the human race: when it is understood, it leads to the heavenly kingdoms; when it is not understood, it leads down to Hades. For God wills His favor to be received with gratitude and to be fruitful, so that it may profit us and give Him delight in showing mercy. Therefore, since He is good and wills all men to be saved, He has shown us a model of righteousness in His servant Job, as the present reading bears witness, so that by following him we may both avoid evil and attain to good, and not only be freed from punishment, but also receive reward. How admirable, then, is the most holy Job, who, before the written law was given, displayed in his deeds the pattern of the Law; taking no instruction from any external teaching in this matter, but guided by nature itself, in which God decreed that the seeds of righteousness should naturally reside, he preserved reverence for his Creator through devout virtue. How great, then, is the praise he deserves, and with what words should his deeds be celebrated, since we can find no equal to him either before the Law or after the Law? For although someone might be able to imitate his achievements, he is still not to be compared with him, nor will he be rightly called his equal. It would not be his own achievement that he became such a man if he merely followed another’s example. But Saint Job, having seen nothing of the kind, nor read of it in any books, showed himself to be such that he had nothing in himself derived from another, but rather imparted to others, offering the pattern of wondrous deeds by which God might be won. Therefore he is praised by the testimony of the Lord, who says: Have you considered my servant Job? For there is no one like him on the earth, a true worshiper of God (Job 1:8). Who could have deserved so much that the Lord should bear such witness of him, unless it be this man who is found not as an imitator, but as the author of the things he did? Therefore he is proclaimed a true worshiper of God. No counterfeit impression of a fabricated truth can appear in one who has no such predecessor. Everyone who pretends, pretends to what is seen and imitated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 118: ON JOB"
