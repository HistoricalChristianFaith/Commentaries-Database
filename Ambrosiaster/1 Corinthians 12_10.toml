[[commentary]]
quote='''
To another the working of powers. He means that power is given for casting out demons or for doing signs. To another prophecy: that is, that, filled with the Holy Spirit, he may tell things to come. To another the discerning of spirits. He says this: that he may understand and judge whether what is said is of the Holy Spirit or of a worldly spirit. To another kinds of tongues, to another the interpretation of words. To interpret is this: that through the gift of God he faithfully interprets the sayings of those who speak in tongues or in letters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
