[[commentary]]
quote='''
ON FASTING. — It is fitting, dearest brothers, that the priest of God and the leader of the people of Christ should most devoutly exhort the people under his care with sound teaching, as the Apostle commands (Titus 1:9), so that we may perform the work of faith, in keeping with the season, with all care and diligence, with a cheerful and devout mind. For the fasts which are now to be observed as the feast day of Easter approaches, what they accomplish, though it is not unknown, must still not be left unsaid. Devotion is stirred up when those things which may not be unknown are nevertheless recounted. For such is the nature of our disposition that it grows sluggish if the practice of reading ceases. For just as iron, if it is not used, produces rust, so the soul, if it is not more frequently exercised in divine readings, will give birth to sins. Therefore in the Psalm he calls that man blessed who meditates on the law of the Lord day and night (Ps. 1:2). And although the divine sayings are well known, yet when they are recalled in the sacred volumes, the devout heart receives them as if they were new. For the soul’s desire for works of salvation is awakened. Therefore the Apostle says to Timothy among other things: Stir up, he says, the grace of God that is in you (2 Tim. 1:6). Therefore fasting is necessary for us, as medicine is for wounds. It brings healing for eternal life; yet it must be praised by the witness of two things, that is, prayer and mercy. Fasting, then, softens the greed of the body, restrains contrary impulses, removes the oppression of the soul, as the Lord says: Do not give yourselves over to eating and drunkenness, lest your hearts be overcharged (Luke 21:34). For when the soul has been freed from excessive food and drink, then it recognizes itself better. Just as in a tarnished mirror a man does not see himself as he truly is, so if he is weighed down by food and drunkenness, he feels himself to be other than he is. Then lust is roused, anger is kindled, pride is inflamed, and luxury is created. Therefore the Apostle: Do not, he says, be drunk with wine, in which is depravity (Eph. 5:18). But if the body is moderated by the addition of fasting, then, having regained knowledge of itself, the soul understands with what devotion it ought to serve its Redeemer. Therefore in great measure fasting is necessary. For under Queen Esther, when the Jewish people were in danger, they were delivered with the help of fasts (Esther 4:16). And the Ninevites, when they heard from the prophet the appointed day of their overthrow, merited to escape when a fast was proclaimed (Jonah 3:7). And our righteous ones and prophets, whenever they wished to obtain something from God, humbled themselves with fasting, as David says: I humbled my soul with fasting (Ps. 35:13). And the Savior himself, who had no need of it, fasted in order to give us an example (Matt. 4:2). Therefore it is beyond doubt that fasting is beneficial: for in this way a man shows that he truly wishes to obtain what he asks, when he afflicts himself with fasting. Therefore it is said: Prayer is good with fasting (Tobit 12:8). So that prayer may be acceptable, it seeks to have fasting as its companion. And because none of these things is firm without holiness, he added: And almsgiving with righteousness; so that almsgiving, preserved with righteousness, may praise prayer together with fasting. Indeed, the mercy of Cornelius commended his prayer and fasting. (Acts 10) For he, though rich in possessions, fasted; and he also fed those who had nothing, so that their fullness made his fasting acceptable. Therefore fasting needs certain things, and must do without certain things, so that it may be able to obtain what it asks for.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 120: ON FASTING"
