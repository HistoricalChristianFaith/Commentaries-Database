[[commentary]]
quote='''
Which in other ages was not known to the sons of men, as it has now been revealed to his saints and prophets in the spirit, that the Gentiles are fellow heirs and fellow members of the body and partakers of his promise in Christ Jesus. He asserts that what lay hidden was shown by God in the time of Christ: that the Gentiles were to be partakers of the grace promised in the Law. This, he says, was shown to the holy preachers and prophets, that is, to the apostles and the expounders of the Law, not to the ancient prophets. For although Gentiles were admitted to the Law before, yet they were ordered to be circumcised; and the prophets knew that the Gentiles would be partakers of the gift of God (for they signified this too in many places); but this lay hidden: that without circumcision, and sabbaths, and new moons, and the other such things, they would be partakers of the grace of God, and would receive the faith of Christ apart from the Law, and be saved. This is what he says: That in the spirit the Gentiles are fellow heirs and fellow members of the body, and partakers of his promise in Christ. For he who worships God in the spirit has no need of the work of the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
