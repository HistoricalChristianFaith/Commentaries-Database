[[commentary]]
quote='''
Walk in wisdom toward those who are outside, redeeming the time. Let your speech always be seasoned with salt in grace, that you may know how you ought to answer each one. Since we must walk among unbelievers and join in conversation for the sake of our way of life in the world, this is what he warns: that our very conduct be with wisdom because of the scandal of the Gentiles; lest they receive through us an occasion of blaspheming, and be stirred up to persecute. For what need is there to speak with one whom you know to be intractable and of obstinate mind, ready to do insult? Therefore he gives this warning, so that the words of religion may be brought forth in a suitable place and at a suitable time, with modesty as teacher; or, if such a person is present as makes an uproar, one must keep silent. For one must deal in one way with the powerful of the world, in another with those of middle rank, and in another with the lowly. Again, in one way with the meek, in another with the irascible, to whom one must give way: this is to redeem the time. For when you give way to one who lies in wait for the Lord's words and to the raging boldness of the time, you save yourself the injuries of a hostile time. For if the head, that is, the king, assents to the body, then there is freedom to speak the words of God with meekness, so that men may be provoked to good. Yet to those who make an uproar and are spirited for abuse one must always give way; for you conquer while you give way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
