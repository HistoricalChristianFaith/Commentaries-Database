[[commentary]]
quote='''
That Christ may dwell in the inner man through faith in your hearts. In this he asks that they be the more strengthened: that they may not doubt, but rather believe that Christ, whom they do not see with these eyes, dwells in them; that the Spirit who has been given may pour this into them by the gift of God, so that they may be certain about Christ, that he lives, and is the Son of God, and dwells through faith in our hearts, so that, when we have faith in him in our hearts, we may be seen to have him himself. This serves to make us secure of his help, because he does not desert us but is always present because of the faith in him which he sees in us: inasmuch as his Spirit, who is also God the Father's, is given to us for this reason, that in his stead he may keep us safe, if we assent to him, and may also reveal hidden things; through whom, surely, we ought not to doubt that he himself dwells in us. For this is another Paraclete, between whom there is a distinction of persons, not of nature; for he both receives of him and proceeds from God (John 15:26). For those in whom there is unity of nature belong to one another; hence the Lord says: All things of the Father are mine, and all mine are the Father's (John 16:15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
