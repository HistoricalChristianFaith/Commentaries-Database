[[commentary]]
quote='''
But if anyone thinks that he knows something, he has not yet known in what way he ought to know. He shows that those very men who glory in knowledge have not known in the way one ought to know. For as long as they do not pursue love, which is the mother of all good things, they do not know as they ought. So, in order that knowledge may be able to bear fruit, it must subject itself to love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
