[[commentary]]
quote='''
Meditate on these things, be in them, that your progress may be manifest to all. Attend to yourself and to doctrine, persist in them. For by doing this you will save both yourself and those who hear you. He admonishes him to be a pattern to all, not only in good works, but also in the exercise of doctrine. For he signifies that the progress of his exercise ought to appear, not in doctrine only, but also in deeds; for a good tree makes good fruits (Matt. 7:17): so likewise good doctrine cannot have evil works; so that when good works have been seen, they may be understood to be the fruits of divine teaching, and the hearers may be able to advance. For they understand that the things said are true and to be feared only then, when they see them observed with great reverence by the very one who teaches. This profits the ruler of the people in two ways: for he will receive the reward both of his own good works and of his hearers'; just as, if he has been negligent, he will have to render account as much for himself as for them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
