[[commentary]]
quote='''
Alexander the coppersmith showed me many evils: the Lord will repay him according to his works. Avoid him yourself too; for he greatly resisted our words. This Alexander and the Demas mentioned above were colleagues. These were formerly with the Apostle, feigning friendship toward him: and because the deceitful are proved by time, both withdrew from him. But this coppersmith, who was the bolder in evil, so withdrew from him that he even stood forth as an opponent of his words. Since, then, he had dared to contradict the Apostle, not undeservedly does he admonish that he be avoided, leaving him to the judgment of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
