[[commentary]]
quote='''
For whether we are out of our mind, it is for God; or whether we are of sound mind, it is for you. He says this because, if he is thought to have spoken haughtily or proudly, since he seemed to praise himself while speaking the truth, this must be left to God; but if it is understood not as spoken proudly but for the glory of the hearers, he says that it profits the Corinthians; so that what was said is sound for the hearers then, if it is understood as it was said; but if it is thought to have been said boastfully, it must be left to God as something mad; for all pride is held to be a kind of madness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
