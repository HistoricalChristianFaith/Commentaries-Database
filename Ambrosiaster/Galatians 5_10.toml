[[commentary]]
quote='''
I trust in you in the Lord that you will think nothing else. He says that he trusts concerning them with this hope, because they had entered the way of error not of their own accord but because they were circumvented. Therefore he trusts that, once the true road has been shown, they can easily return. But he who troubles you shall bear judgment, whoever he is. As he who makes one who errs turn back is to be rewarded, as the apostle James says in his epistle: He who makes a sinner turn back will save his soul from death and will cover a multitude of sins (Jas. 5:20); so too he who forces one walking on the right way to turn his road aside to a byway incurs condemnation, whoever he may be. He adds this on account of these men, lest any should claim merit for themselves on the ground that they were sons of Abraham according to the flesh. Indeed, exalting themselves, they say to Jesus: We are sons of Abraham (John 8:33).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
