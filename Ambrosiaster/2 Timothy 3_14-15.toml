[[commentary]]
quote='''
But you, persevere in the things which you have learned and which have been entrusted to you, knowing from whom you have learned them, and that from infancy you have known the sacred writings, which are able to instruct you unto salvation. He indicates that it profits much to have knowledge of the Old Testament; for he calls those the sacred writings which intimate the person of Christ and declare his incarnation for redeeming the salvation of men. And he exhorts him to advance in these; for this antiquity is the strength of the newness, since he knows that he from whom he learned is a firm authority; for he saw signs and wonders done through him, to which every word yields.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
