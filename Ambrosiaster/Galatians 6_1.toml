[[commentary]]
quote='''
Brothers, even if a man has been overtaken by some fault, you who are spiritual, instruct such a one in a spirit of meekness, considering yourself, lest you too be tempted; bear one another's burdens. Now he addresses those who were firmer, so that they would not, from the inflation of a good life, think that one who had perhaps been ensnared by sin should be spurned and cast off; and therefore thought must be taken for such as these. For they must be called forth with meekness to reform themselves; because if they are rebuked too sharply, on authority, they will not suffer themselves to be reproved, but will even begin to defend themselves, lest they seem base; and they begin to become worse. For take a man away from contention and boldness, and you will have him submissive; for humility is wont to bend even the proud. And so that it might be done with all gentleness of mind, he added: Lest you too be tempted; so that, if for this reason alone, he would not spurn the sinner, knowing that he too can sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
