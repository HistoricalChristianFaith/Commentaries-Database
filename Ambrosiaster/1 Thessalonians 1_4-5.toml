[[commentary]]
quote='''
Knowing, brothers beloved by God, your election; for our Gospel was not to you in word only, but also in power, and in the Holy Spirit, and in much fullness, as you know what kind of men we were among you for your sake. They signify that they were humble among them, so as to give them a pattern of meekness; not that the mighty works were lacking which might exhort them to faith; for the power of signs and wonders lent strength to the gospel teaching, in the Holy Spirit, that is, not in phantasm but in the truth of fullness; so that help was lacking to no need, but grace was seen to superabound both in teaching and in conduct and in curing the sick; so that the perfect work of the Holy Spirit appeared in the churches of the Thessalonians, so that, seeing themselves inferior in nothing to the churches of the Jews, they might rejoice in the gift of God, who deigned to make them sharers in the promise of Abraham.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
