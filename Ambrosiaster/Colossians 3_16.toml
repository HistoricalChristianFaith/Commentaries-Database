[[commentary]]
quote='''
Let the word of Christ dwell in you abundantly in all wisdom, teaching and admonishing yourselves in psalms and hymns and spiritual songs, singing in grace in your hearts to the Lord. He warns them always to meditate on the things that sound forth Christ, to keep in the heart the things that ever render thanks to God the Father; so that the melodious voice may serve him, the psalm praise him, the hymn extol him. And let it be known to him alone who sees through the hidden things of the mind, from whom the reward too is hoped for. He commanded that he be sung to in the hearts, lest it be done for the favor of men and lose its fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
