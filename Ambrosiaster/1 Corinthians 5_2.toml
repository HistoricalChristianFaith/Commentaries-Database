[[commentary]]
quote='''
And you are puffed up, and have not rather mourned. He humbles their pride so far as to make them no longer querulous but rather suppliant. For they too were sharers, in that they allowed the one guilty of so enormous a deed to assemble with them unrebuked; whereas all of them, with one counsel, should cast him out if he refused to amend himself. But if anyone does not have the power to cast out one whom he knows to be guilty, or is unable to prove it, he is free from guilt; and it is not for a judge to condemn without an accuser, since the Lord too did not cast out Judas, though he was a thief, because he had not been accused.

That he who has done this deed might be taken away from your midst. Once this deed was known, he ought to have been driven out of the gathering of the brotherhood; for all knew his crime and did not reprove it; for he openly had his stepmother in place of a wife. In this matter there was no need of witnesses, nor could the crime be covered by any evasion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
