[[commentary]]
quote='''
For it is written: Rebuking the wise in their craftiness. And again: The Lord knows the thoughts of the wise, that they are vain. This is found in the ninety-third psalm. Finally, the sense is the same; for, knowing their thoughts to be vain, he rebuked their wisdom so as to prove them foolish, showing that what they called false is true, and what they thought true is false.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
