[[commentary]]
quote='''
He asserts that Satan was the hindrance to this, who stretched out hands against even the apostles, lest the reasoning of the truth be laid open to men. For he inflamed the minds of the faithless to hold them back with beatings and chains, lest they speak the word of God. For the elders of the Jews said to the apostles: "Did we not strictly charge you not to speak in the name of Jesus to any man" (Acts 5:40)? But because what is not from God cannot stand, the hindrances of Satan are undone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
