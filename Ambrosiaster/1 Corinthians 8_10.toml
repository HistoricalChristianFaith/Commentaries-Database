[[commentary]]
quote='''
For if anyone sees him who has knowledge reclining in an idol-temple, will not his conscience, since it is weak, be built up to eat of the images? He said this because someone, seeing a skilled brother who has been invited into an idol-temple reclining and eating the meat of sacrifices, thinks that there is some grace there, and he too begins to eat the meat of sacrifices, not with that conscience with which the other, on account of his skill, knows that an idol is nothing, but with the one by which he thinks there is a divine power there, when he sees the skilled brother eating there and not shrinking from it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
