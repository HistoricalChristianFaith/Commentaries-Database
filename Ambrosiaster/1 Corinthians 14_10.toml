[[commentary]]
quote='''
For there are, for instance, many kinds of tongues in this world, and nothing is without voice. Many indeed are the kinds of tongues, he says, but they have their own meanings of words, so that they may be understood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
