[[commentary]]
quote='''
Yet I have received all things, and abound; I am filled, having received from Epaphroditus the things that were sent from you, for an odor of good sweetness, an acceptable sacrifice, pleasing to God. It is not idly that he admonishes that it ought to be done, nor on any other ground that he exhorts to what he professes has been done, except that it seemed to have been done either more negligently or less abundantly than it had been their custom to do it; so that, remembering their former works, they might know that they had done less than they had begun. For although he does not disapprove of what was done, but indicates that they had been more devoted in this work before, yet, he says, it is welcome, and God credits it, as a pleasing sacrifice. Thus the Lord says: Give alms, and behold, all things are clean to you (Luke 11:41). How welcome a work it is, then, that it cleanses away every stain and filth of man!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
