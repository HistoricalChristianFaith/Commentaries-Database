[[commentary]]
quote='''
For you remember, brothers, our labor and weariness, working night and day to this end, that we might not burden any of you. This is what he says in the Acts of the Apostles: All things, he says, that were necessary for me and for those who are with me, these hands have toiled for. Hence also in another epistle he says: Whoever does not work, let him not eat. And this is against the false apostles; for those who ate in idleness pretended that they were preachers. So then, to give an example of how the Christian life is to be governed, and to expose the pretenders, he applied himself to human labor, casting the false apostles into the shade: besides this, because those who apply themselves to labor turn away from evil thoughts, occupying their mind and keeping it from dangers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
