[[commentary]]
quote='''
What I speak, I do not speak according to God. He does not speak according to God, because these things pertain to the swelling of the flesh, and glory before God does not arise from being puffed up; for before God humility is glorious. But as in foolishness, in this substance of boasting. He did not speak of full foolishness, but of partial; for it is the truth. But because self-exaltation is a faulty thing, therefore, although what is said is true, it is nevertheless as it were foolishness for anyone to praise himself. But it is full foolishness if someone praises himself with false things: for the former is proud about what is true, the latter a fool about what is false; the substance of the boasting in this case, however, is carnal; for as the flower of grass, so this glory falls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
