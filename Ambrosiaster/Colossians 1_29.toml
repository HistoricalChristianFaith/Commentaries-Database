[[commentary]]
quote='''
He says that he has a contest over this against the faithless, with signs of power assisting him, so that through these unbelief may be overcome and suppressed. For whoever has dared to contradict his words with a certain subtlety of diabolical cunning must, corrected by shame, yield to power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
