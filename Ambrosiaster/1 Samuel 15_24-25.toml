[[commentary]]
quote='''
WHY IS IT THAT SAUL, WHEN HE SINNED, ASKED THAT PRAYER BE MADE FOR HIM SO THAT HE MIGHT BE FORGIVEN AND COULD NOT OBTAIN IT, WHILE DAVID, WHEN HE SINNED, ASKED AND OBTAINED PARDON? — It is not fitting that God’s judgment be revoked: for human weakness and ignorance ought to be instructed by God’s judgment in what it does not understand, so that from God’s decision it may grasp the truth, and recognize that nothing else ought to have been done than what it sees God has done, knowing that He is not a respecter of persons (Acts 10:34). For if God received David’s prayer and rejected Saul’s, we must not think that God did anything unjust. Knowing with what nature each one spoke, He accepted the petition of the one whom He saw asking for pardon with a troubled heart; but He despised the other, because the pain of repentance had not touched his soul. For God is more a hearer of the heart than of the voice. Therefore it is said, Man looks on the outward appearance, but God on the heart (1 Sam. 16:7). Therefore we too are often deceived, because hoax in words and in countenance misleads us: for we cannot see what is in the heart. Wherefore we must follow God’s judgment, who examines each person according to the heart, in which the nature of each one is found. We discover that the Savior did this as well. For He did not receive the scribe when he presented himself (Matt. 8:19); but He called Levi as he sat at the tax booth (Matt. 9:9; Luke 5:27): because the scribe’s words were not followed by the heart, whereas Levi, in silence, had in his heart what the scribe had in his words. But Jesus, who, as it is written, knew what was in man (Jn. 2:25), chose Levi. Moreover, David did not wish that another should be humbled for him as Saul did, but he himself, as a pleading with a troubled heart, asked for pardon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 18: WHY SAUL WAS DENIED PARDON BUT DAVID FORGIVEN"
