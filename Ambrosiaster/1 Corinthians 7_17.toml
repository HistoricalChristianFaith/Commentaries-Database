[[commentary]]
quote='''
Except as God has apportioned to each. The Lord has apportioned to each when he is to be saved; that is, he knows when he can believe, and he bears with him. And here he teaches that they are to be waited for, and that one ought not to take offense at them, because their hope must be guarded; but if they themselves depart, one must let them go unregarded.

As God has called each one, so let him walk. That is, that if one who believes is joined in marriage, he should not desert, neither husband nor wife: but let him remain so, whether Jew or Greek.

As I teach in all the churches. So as to persuade them that he does not hand down to them anything other than to the rest; so that, when they hear that the others of this faith are taught this, they may follow it more readily. For a person is easily inclined if he sees that his companion has consented.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
