[[commentary]]
quote='''
But we, brothers, bereft of you for the space of an hour, in face, not in heart, hastened the more abundantly to see your face with great longing. Wherefore we wished to come to you, I Paul indeed, once and again, but Satan hindered us. They say that they are torn from them not in mind but in body; for love is not divided, nor is it separated: but for the sake of fuller instruction they say that they long to see their face as well. For in divine matters the fingers fail to take down what can be said; for a day is not enough for the pen for the things that can be uttered in one hour; not to mention that there are certain mystical things of our religion which ought not readily to be made public, on account of carnal minds, lest these suffer scandal: because not all things are to be said to all, but what is said must be tempered to the capacity of each, in one way for the untaught, in another for the grounded. Therefore the presence of the body is required, because thus the truth of love is made perfect. For although love is not divided, yet the absence of the body creates longing: thus the wish of souls is fulfilled by a kiss and an embrace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
