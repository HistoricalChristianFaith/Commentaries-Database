[[commentary]]
quote='''
Under this testimony, therefore, he orders those things to be kept which pertain to the ordering of the Church, and commands that nothing be done without prior judgment: lest anyone readily receive ecclesiastical dignity unless his life and conduct have first been examined, so that, approved as worthy, he may be appointed minister or priest; so that the chief of the people may not afterwards, if the man is seen to be blameworthy, perhaps regret that he did not judge beforehand with clarity what he deserved, whom he ordained without due approval; nor is one whose sins come under suspicion to be ordained, lest the ordainer be stained by his vices and offenses. If, therefore, the offenses are entirely hidden, the ruler will be free of blame, because his conscience is free. For suspicion makes one fearful; for he sins if he does not test the man, and ordains him so. For he who is to be ordained ought to be proved better than the rest; for it is not enough if he is without crime, because the merits of his good works ought to go before him, so that he may be held worthy of ordination. A bishop who keeps these things will show himself chaste for religion: and for this he will obtain a reward in the future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
