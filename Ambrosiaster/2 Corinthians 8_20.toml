[[commentary]]
quote='''
Avoiding this, that anyone should blame us in this abundance which is ministered by us. Since the ministry was in question, he therefore added this, lest he should be judged negligent in caring for the poor or the saints, if he did this more sluggishly. For the apostles had agreed among themselves on this matter, that they should be mindful of the poor, as he indicates to the Galatians. Since, therefore, the Apostle was blameless in all things (Gal. 2:10), lest he be judged careless in this matter, he indicates that he gives this warning beforehand, so that, once this work was fulfilled, his care and providence might appear in all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
