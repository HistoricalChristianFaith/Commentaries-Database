[[commentary]]
quote='''
It is sown in dishonor, it will rise in glory. It is sown in dishonor, because while it is laid in a gloomy place it becomes fetid and swarms with worms: but it will rise in glory, because when raised it will both be light and suffer no injury of squalor. It is sown in weakness, it will rise in power. It is sown in weakness, because it is immobile and ungovernable: but it will rise in power, because it will then be wholly one and vigorous.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
