[[commentary]]
quote='''
Since indeed it is just with God to repay affliction to those who oppress you, and to you who endure affliction, rest with us at the revelation of the Lord Jesus from heaven with the angels of his power, in a fire of flame, giving vengeance on those who have not known God, and on those who do not obey the Gospel of our Lord Jesus Christ, who will pay the penalty in eternal destruction from the face of the Lord, and from the glory of his power. Since he said that an example of the just judgment of God appears, whether upon the good or upon the wicked, he therefore went on to say: Since indeed it is just with God, that he should render to each according to his works. What is so just as that those who in this world oppress the good, and make them exiles by persecutions, should in the future suffer the same things that they do, while the others are at rest with the rest of the saints, who, coming out of great tribulation, will receive the eternal kingdom at the coming of the Lord from heaven, when he begins to come with his heavenly army and with fire as his minister to give vengeance on the pagans, who do not know that God is the Father of Jesus Christ, and on the Jews, who, though they say that they know God, do not believe the Gospel of Christ, which God the Father gave him to hand on to his servants? All these the fire will burn up by the presence of the Lord and the glory of his majesty, so that they may pay the due penalties of destruction for ever, always suffering, yet never wholly failing, so that the penalty itself in a way always generates them, by which they may be consumed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
