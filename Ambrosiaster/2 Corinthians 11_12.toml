[[commentary]]
quote='''
But what I do, I will also go on doing, so as to cut off the occasion of those who want an occasion, that in what they boast of they may be found just as we are. The glory of the false apostles lay in receiving money. Therefore the Apostle refused it, lest he seem like them; because unless this had been avoided by the Apostle, a greater occasion would have been given them of receiving, or of extorting even more, since in this matter they would point to the example given by the Apostle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
