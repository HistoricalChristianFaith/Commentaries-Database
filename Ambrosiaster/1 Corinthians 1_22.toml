[[commentary]]
quote='''
For the Jews ask for signs, and the Greeks seek wisdom. The Jews ask for signs, because they do not doubt that it could have been done, but they ask whether it has been done; knowing that the dry rod of Aaron budded and bore fruit (Num. 17:8), and that Jonah, swallowed by the whale, was in its belly three days and three nights and was cast out alive (Jon. 2:1). Above all, however, they seek to see something such as that which Moses saw, God in fire; whence they say: We know that God spoke to Moses (John 9:29); although it is a greater thing that Lazarus, dead and stinking on the fourth day, came out of the tomb alive (John 11:44). But the Greeks seek wisdom, because they do not wish to hear anything except what is possible by the reasoning of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
