[[commentary]]
quote='''
Christ is divided. He says that Christ is divided because men have shared out his glory among themselves. Just as the heretics, who do not shrink from being called Photinians, or Arians, or Cataphrygians, or Novatianists, or Donatists, or Manichaeans, so too the Corinthians had begun to subject themselves to the names of various heretics, so that they seemed to venerate men in the place of Christ: and these, while they receive different things about Christ, divide Christ. For one accepts Christ as man only, another confesses him as pure God without a man or a body, another says that Christ was foretold by the prophets, another denies that the prophets spoke of Christ. Since, then, Christ is one, God and man, these men, each claiming a different part of him for himself, divide Christ; and because they make many churches under their own name, he added:

Was Paul crucified for you? He began with himself for this reason, lest it should perhaps be thought that he was rejecting the persons of others in order to commend his own. For if Christ, he says, died for us, how is it that we ascribe his grace and benefit to men, to his injury?

Or were you baptized in the name of Paul? But if, he says, believing in Christ, we are baptized so that we may be justified in his name, why is it that we make men the authors of this faith for ourselves, forgetful of the belief with which we began?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
