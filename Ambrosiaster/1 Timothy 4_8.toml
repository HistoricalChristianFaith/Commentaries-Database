[[commentary]]
quote='''
But he urges that attention be given to godliness, because it brings great profit. For those who are devoted to mercy, making a return to their aged parents, will both not lack the help of God in the present life, and in the future will have immortality with glory. But bodily exercise he calls useful for a little; for to fast and to abstain from foods, while the authority of the Creator remains intact, profits not much, unless godliness be added to it, whose work is aided by the prayers of many toward winning the favour of the Lord. Thus the saying of the Gospel testifies that those who are generous to the brethren, and dutiful in various ways, advance to eternal life (Matt. 25:41); but those who hold back from this work, to eternal fire. Bodily exercise is nothing other than the reins of the flesh. If anyone, then, since mercy is a great thing, yet gives way to the slipperiness of the flesh, what will become of such a one? Without doubt he will be beaten; because that ought to be done, and this by no means left undone (Luke 11:42). But if he had only bodily exercise, he will suffer everlasting punishments, as the Lord promised in the Gospel (Matt. 25:41); for the whole sum of our discipline lies in mercy and godliness. Yet the carnal have one bodily exercise, and the spiritual another; for the carnal nourish their bodies with fattening and feasts, so that with swift movement they advance to perdition; but the spiritual temper their bodies with fasts and abstinence, so that, made sluggish toward desires, they may be worthy of the resurrection to come. For the one chastises the body because of the hope to come; but the other, through despair of the future, cherishes it, taking care of it for the time being, so that it is moved the more quickly to sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
