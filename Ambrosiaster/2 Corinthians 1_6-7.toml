[[commentary]]
quote='''
But whether we suffer affliction for your exhortation and salvation, or whether we obtain exhortation for your exhortation, which works through the patience of the same sufferings which we ourselves also suffer; so that our hope for you may be certain; because we know that as you are sharers of the sufferings, so you will also be of the consolation. He speaks in general terms: that, just as they suffered persecutions from the faithless for the sake of believers, subjected to injuries and beatings, so again they were delivered by the help of God for the consolation of believers, lest these, having taken offense, fall away from the faith; because the injuries of the apostles were temptations for believers, as it is written in the prophet Zechariah: I will strike the shepherd, and the sheep of the flock will be scattered (Zech. 13:7). Although the faithful believe the things to come, yet amid the very beginnings afflictions cause offense to the newly converted: for they think the promise empty if they see the preacher overpowered by force. But if the believer is already firm, he suffers together with his teacher, trusting in the hope to come; so that he may be consoled together with him with whom he also suffers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
