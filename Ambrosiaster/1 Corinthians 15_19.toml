[[commentary]]
quote='''
If in this life only we are hoping in Christ, we are more miserable than all men. It is manifest that both in this present life and in the future one we hope in Christ; for neither does Christ desert his servants here, but he gives them grace, and in the future they will be in eternal glory. But if there were no hope of the future life, we would be, as he said, more miserable than all men. For to what purpose are fasts, vigils, departures, a pure life, righteousness, mercy, death, if there will be no reward for these in the future? Unbelievers at least enjoy this life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
