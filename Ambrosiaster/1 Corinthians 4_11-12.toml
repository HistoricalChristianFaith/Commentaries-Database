[[commentary]]
quote='''
Up to this hour we both hunger and thirst, and are naked, and are buffeted, and are unsettled, and labor, working with our own hands. For, preaching Christ freely and according to the true faith without any flattery, and reproving the deeds of a depraved life, they had no favor with men, and they were buffeted, that is, assailed with injuries, and they were unsettled, because they were driven away, lest, staying long in one place, they should teach more people. They also worked with their hands for this reason, that not only did they have no favor with men, but it was also unworthy to receive from those who were devoted to error, as he says in the hundred and fortieth psalm: But let not the oil of the sinner fatten my head (Ps. 140:5). For he who receives from one who gives in order not to be rebuked both loses the freedom to reprove and sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
