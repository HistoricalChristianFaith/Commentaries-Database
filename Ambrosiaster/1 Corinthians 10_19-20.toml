[[commentary]]
quote='''
What then do I say, that what is sacrificed to an image is anything? Not that the image is anything; but what they sacrifice, they sacrifice to demons. An image is truly nothing, because it is seen to be the likeness of a dead thing: but under the covering of images the devil is worshipped.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
