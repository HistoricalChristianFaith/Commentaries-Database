[[commentary]]
quote='''
For out of much affliction and anguish of heart I wrote to you with many tears, not that you might be grieved, but that you might know what love I have more abundantly toward you. It is plain that when someone rebukes another with such feeling that he grieves over his sins more than the other does, he certainly does not rebuke him in order to grieve him, but to show him with what love he loves him. For one who does not rebuke with this feeling grieves his brother; for he who does not grieve with his brother insults him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
