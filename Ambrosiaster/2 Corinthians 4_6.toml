[[commentary]]
quote='''
For God, who said that light should shine out of darkness, has shone in our hearts, for the illumination of the knowledge of the glory of God in the face of Christ Jesus. He says this because it came about by the mercy of God, he says, that through us, who were unbelieving in ignorance, that is, in darkness, God should give light to the other Gentiles. How greatly does he still humble himself, so as to set forth the glory of God alone and of Christ? For enlightenment is given so that they may have knowledge of the glory of God through Christ. For this reason he says "knowledge of the glory of God", that is, not of God alone, but also of Christ, who is his glory; so as to signify that not only God is known, but also his works and mercy and providence, by which he created and saved the human race, seen in Christ through the glory of his power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
