[[commentary]]
quote='''
As I asked you to remain behind at Ephesus, when I was going into Macedonia, that you might charge certain persons not to teach otherwise, nor to attend to fables and endless genealogies, which provide questions rather than the edification of God, which is in faith; so do. A son ought not to have been asked by a father; but out of the affection of love, and to show him a pattern of humility, the bishop entreats his fellow bishop not to allow the Jews to teach the people otherwise than was handed down by the Apostle; that they should not be delighted with the fables which the Jews are accustomed to tell about the generation of their origins, about Abraham and Isaac and the other patriarchs, and about circumcision and the things that were afterwards handed down by Moses; that they should not be ensnared into observing these things, which had been given carnally. For what need is there to make mention of generations, which are known to be endless through descent, and of what was done under each of them, and to what extent; and not rather to seek salvation by the short way through faith? For from this questions arise, when it is discussed what was done, and when, and how, and why: a thing which hinders salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
