[[commentary]]
quote='''
Knowing that he who raised up the Lord Jesus will raise us up also with Jesus, and will set us with you. He says that they labor for the faith in this hope, because the example of the resurrection of the Lord Jesus goes before, showing what those who believe will be; because as in Adam all die, so also in Christ all shall be made alive. For Adam is the pattern of death, because of sin: but Christ the pattern of life, because of righteousness; for he did no sin, nor was guile found in his mouth. And since he has called them sharers of a common faith, raised up, he says, he will set us with you; so that those of one faith may be in one house of peace. For when they understand that these men suffer deadly perils for them, and they themselves are anxious about their sufferings, as suffering with them, they will also be sharers together in the promised life; so that, having grieved together, they may rejoice together. He speaks thus on account of those who denied the resurrection, whom he also reproaches in the first epistle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
