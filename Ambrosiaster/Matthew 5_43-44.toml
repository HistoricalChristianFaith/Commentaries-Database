[[commentary]]
quote='''
There is also another way in which the Law is fulfilled. For the Lord says, “You have heard that it was said, You shall love your neighbor and you shall hate your enemy”; this is justice. But the Lord says, “But I say to you, Love your enemies” (Matt. 5:43–44). He certainly adds, which is to say he “fully fulfills,” because he did not destroy the old things, but, in order to make people perfect, he commanded what is better. For his enemies, that is, the wicked, whom he could not correct and amend by revenge, carried out at the dictate of justice, he willed to make safe through love and service, which also the Law held in its inner meaning. For the Law wished to remove hatred in this way: that, frightened by revenge, people would cease to be enemies. And since through their own boldness people despised the fear of the Law and of nature, growing in evil, the Savior willed that hate be conquered through humility, so that in this way at least people might be bent toward the good, when they saw that hatred was not repaid them; while those who remain in their hardness would be more severely dealt with, because they were not overcome even by the humility of him whose return they ought to have experienced. Justice in revenge, therefore, has not been obliterated, but held in suspense for either outcome; since it ceases with regard to the one who has come to know himself, but, if not, it punishes the stubborn.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 13: HOW CHRIST FULFILLS RATHER THAN DESTROYS THE LAW"
