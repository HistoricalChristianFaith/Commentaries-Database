[[commentary]]
quote='''
According to the grace of God which was given to me, as a wise architect I laid the foundation. He says that grace was given to him, that he might be worthy to preach the Gospel, so as to show that this too was of God, not of man. According to this grace, then, he says that he laid the foundation as a wise architect. A wise architect is one who lays the foundation according to the discipline of the author, that is, who evangelizes according to the tradition of the Savior.

But another builds upon it. The superstructures are the things handed on after the preaching of the apostles by teachers who come after, whether bad or good.

But let each one see how he builds upon it, that is, so that the superstructures may agree with the foundation; lest, if they are crooked and flimsy, they cause a collapse, while the foundation remains unharmed; for if he has taught badly, the name of Christ, which is the foundation, remains, but the bad teaching will perish, as the Lord says: Every planting which my heavenly Father has not planted will be rooted up (Matt. 15:13).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
