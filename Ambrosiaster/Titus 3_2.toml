[[commentary]]
quote='''
To blaspheme no one, not to be quarrelsome, but modest, showing all gentleness towards all men. He wants Christians to appear humble to all men; for thus the faithless can be called to the hope that is to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
