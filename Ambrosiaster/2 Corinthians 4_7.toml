[[commentary]]
quote='''
But having this treasure in earthen vessels, so that the excellence may be of the power of God, and not from us. By the treasure he signified the mystery of God in Christ, which is made manifest to believers, but for unbelievers is covered by a kind of veil; because just as a treasure is placed in hiding, so too the mystery of God is hidden within man, that is, in the human heart. He says, then, that this treasure in mind and body is given by God, so that the eminence of his power may appear through men who are merely preachers; so that every tongue may be reconciled to its Creator, not to the honor of men, but of God, who manifests himself through men: who, though they were lowly and unskilled, received from God the power both to speak great things and to do them. In saying earthen vessels, then, he signifies the weakness of human nature, which can do nothing unless it receives power from God, and God, for his own praise, proclaims himself through these things that are weak; so that the glory may be given to him, not to man, who was fashioned from clay.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
