[[commentary]]
quote='''
A humane saying: if anyone desires the episcopate, he desires a good work. Since a bishop ought to be of good life, therefore whoever longs for the episcopate desires a good work. For in longing for this he is seen to seek a good life; provided, however, that he does not turn aside from the things that are set down in what follows, lest he be seen to have done this out of ambition or desire for money.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
