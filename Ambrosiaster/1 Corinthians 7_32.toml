[[commentary]]
quote='''
I want you to be without anxiety. For when the anxiety of the world is lessened, one keeps watch more readily in the things of God. And how we can be without anxiety he shows, saying: He who is without a wife thinks of the things that are the Lord's. For when the anxiety of the marital matter is cut away, which alone in the world is heavier than the rest, the mind is trained for winning God's favor: if, however, the mind strips itself of these troubles in this hope, that it may serve God more.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
