[[commentary]]
quote='''
For the widow who lives in delights is dead while living. He signifies that a widow, because she is called a widow, ought to be such that she is free for prayers in order to win the favor of the Lord, serving God night and day, so as to show that she despised second marriages for this reason, that she might apply herself to the discipline of the Lord. For if under the name of widow she is free for delights or luxury, she is to be held dead while living; because it is a kind of imposture to do one thing and profess another: such women wish to have not the service and devotion of God but the honor of a widow, whereas the very profession of the name indicates this: that, having spurned a husband, she chose God, to serve him with her whole mind, for the sake of the life that is promised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
