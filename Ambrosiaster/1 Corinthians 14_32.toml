[[commentary]]
quote='''
And the spirit of the prophets is subject to the prophets. For since it is one and the same Spirit who pours himself both into the prophets who tell things to come and into those who disclose the Scriptures, according to the reason and nature of the cases, he therefore said: Is subject to the prophets; so as to kindle their minds with this hope, that the Spirit helps good endeavors. For he comes to the aid of the best desire to set forth the things of God, so as to fulfill the will of a good purpose. For the same was said also of the Savior: And they drank of the spiritual rock that followed, and the rock was Christ (1 Cor. 10:4): that is, to be subject is the same as to follow; for he followed so that, when human support failed, he might be at hand to give help. So also the Spirit is said to be subject, in that he helps good endeavors when he prompts; for he seems subject who completes what another has begun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
