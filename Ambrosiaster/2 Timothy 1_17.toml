[[commentary]]
quote='''
But when I was in Rome, he sought me out diligently and found me. May the Lord grant him to find mercy with the Lord in that day. The Apostle, coming to Rome after he had appealed to Caesar, was kept under guard by soldiers; for at that time Onesiphorus, for love's sake and for the sake of his teaching, sought him with great diligence and found him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
