[[commentary]]
quote='''
Lest we be possessed by Satan; for we are not ignorant of his wiles. He says this, as I mentioned above, because consolation ought to follow upon a brother who weeps over his offense; lest, grieved for a long time and spurned by the love of the Church, he begin to despair of himself, and the subtle devil, who is always lying in ambush, seeing that his mind has become abject, should approach and suggest to him that he at least enjoy present things, since he has been cast down from the hope of a future reward; and so the brother perish, possessed by the devil, the brother to whom repentance had been given for this purpose, that, being converted, he might reform himself, as the prophet Ezekiel says: I do not want the death of the one who dies, so much as that he turn back and live (Ezek. 18:23). And again: Let him be converted, he says, and I will replant them (Jer. 24:6).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
