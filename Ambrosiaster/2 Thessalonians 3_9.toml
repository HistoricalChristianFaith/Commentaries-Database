[[commentary]]
quote='''
For he would not be blameworthy if he received bread for the care of the body from those to whose souls he was supplying spiritual food, which would procure for the body too immortality with glory. For then freedom can be unfettered, if one subjects himself to no one for the sake of the belly or of money, content with his own bread; above all because it advances more to praise if, when it is permitted and there is the power of taking, one refrains: such a man can benefit those who hear him; for they will have reverence for this strictness, and the things commanded by him cannot be passed over.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
