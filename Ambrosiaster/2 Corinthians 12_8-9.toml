[[commentary]]
quote='''
For this I asked the Lord three times that it might depart from me; and he said to me: My grace is sufficient for you; for power is made perfect in weakness. He testifies that he besought the Lord three times that the goads of the devil, which he faithlessly thrusts into minds and incites to harm the servants of God, might cease from him, and that he did not obtain it: not that he says he was disregarded, but because without knowing it he was asking against himself, that the temptations through which he was being made more perfect should cease from him. That is why he says to the Romans: For what we should pray for as we ought, we do not know (Rom. 8:26). Hence he says that this answer was given him, that the grace of God should suffice him, by which either strength to endure was added or the time of affliction was shortened, so that devotion, while it is not broken by the weakness of the affliction that befalls it, might be seen to be proved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
