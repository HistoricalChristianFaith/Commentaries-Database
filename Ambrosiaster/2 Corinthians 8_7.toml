[[commentary]]
quote='''
But as you abound in all things, in faith, and in word, and in knowledge, and in all earnestness, and moreover in that love which is from us and you, see that you abound more in this grace also. He exhorts them, so that he may boast of them before the other churches. For this is the proof of their amendment, if they are ready for the ministry to the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
