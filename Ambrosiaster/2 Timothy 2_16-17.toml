[[commentary]]
quote='''
But avoid profane novelties of words; for they advance greatly towards emptiness, and their speech creeps like a cancer. He still pursues this same point, that contentions should be avoided; for it is not fitting for men of one faith to have contention, but in discussion let them bear with one another and agree to what is well said: and if anything seems unacceptable, let it be passed over in peace. For it is adversaries and those who disagree who are wont to provoke one another, of whom one is catholic and the other profane. This man, then, to whom the Apostle gives the command to spurn and turn aside from empty fables, is the catholic: he ought to be quiet, so that he always utters words from conscience, and does not allow impious words to be brought forth in his presence. For they give some people occasion to advance into worse; for there is no lack of those who, hearing profane things, conceive an evil thought: and therefore contention does harm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
