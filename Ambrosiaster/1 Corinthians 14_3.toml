[[commentary]]
quote='''
For he who prophesies speaks to men for edification and exhortation and consolation; for a man is edified when he learns the solution of questions. And exhortation is given him, so that he may feel the desire to prophesy; and he is consoled, because he sees in hope the contempt borne for the discipline. For knowledge of the law strengthens minds and spurs them on to advance toward a better hope.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
