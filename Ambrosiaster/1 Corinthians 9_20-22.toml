[[commentary]]
quote='''
WHY DID THE APOSTLE SAY THAT HE MADE HIMSELF “ALL THINGS TO ALL MEN” (1 Cor. 9:22), SOMETHING THAT SEEMS LIKE THE BEHAVIOR OF A FLATTERER AND A HYPOCRITE? — A flatterer is someone who agrees merely so as not to offend the person whose favor he wishes to gain. But someone who, in order to avoid scandal, does something that is not dangerous but only unnecessary, is working for the salvation of the one whom he does not wish to scandalize. When the Apostle Paul circumcised Timothy for the sake of the Jews and entered the temple after purification, he thereby showed himself in such a way that those who were zealous for the traditions of their fathers would not be scandalized and either kill him or think our religion was hostile to them. He was willing to allow something lesser so that he might gain something greater. For he could have sinned gravely if he had refused to act as a Jew in order to go into the temple to pray; he therefore subjected himself so that he might benefit them. To those who were under the Law, that is, the Samaritans, he agreed in this way: it is clear that they rightly confess that the books of Moses are from God, and that circumcision and the sabbaths were given by God. From these things he showed them that the Christ they were expecting was the very one he preached. For you have it written, with the Samaritan woman speaking to the Lord: “I know that the Messiah is coming; when he comes, he will tell us all things” (Jn. 4:25). According to this understanding, he followed the words of the books of Moses, who said, “The Lord your God will raise up for you a prophet from among your brothers” (Deut. 18:15). To those who were without the Law he agreed from this standpoint: that they say the world and the human race were made by God. For he says, “As some of your own poets have said, ‘For we too are his offspring’” (Acts 17:28). Therefore he made himself all things to all, so that he might promote their salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 51: WHY DID THE APOSTLE MAKE HIMSELF ALL THINGS TO ALL MEN?"
