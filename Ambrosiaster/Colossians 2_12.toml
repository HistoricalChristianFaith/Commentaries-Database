[[commentary]]
quote='''
With him they were buried in baptism: and they have risen again through faith in God, of whom they believe that after the example of Christ he will raise them from the dead. For there the old man is laid aside, and the new is put on: he dies to sins, that he may live to righteousness: he renounces the elements, that he may be joined to Christ, holding the example of the Savior, who rose from the dead, as the pledge of the resurrection to come. These things, therefore, he urges, that they persevere in the renunciation of the pomp and the deceptions of Satan. Satan urges the worship of the elements for this reason, to call men away from God, wishing to make them sharers in his apostasy. For because he cannot urge worship under his own name, since he is abhorred for that very name, he tries to fulfil his will under the name of another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
