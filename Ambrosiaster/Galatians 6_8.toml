[[commentary]]
quote='''
For whatever a man sows, that he will also reap. For he who sows in his own flesh will reap corruption from the flesh. Here he signifies the carnal vices which are usually committed in the flesh; so that he who has corrupted his flesh may know that he will be liable to corruption. And he corrupts the body who presumes upon things not permitted. But he who sows in the spirit will reap eternal life from the spirit. The Christian man consists of spirit and flesh; for man, in comparison with the holy spirit, is flesh. When, therefore, he gives assent to the spirit, restraining himself from those things which are contrary to it, he sows spiritually, so that he may reap eternal life. For he receives the testimony of the Spirit, and immortality by way of reward. For just as he who corrupts, dishonoring his own body, will belong not to eternity but to corruption, so also he who keeps himself undefiled will obtain eternal life. For this is eternal life: to live without punishment, and to have glory. For if here, for the present, one who is in anxiety denies that he lives, how much more, where he is estranged from God, will he suffer fire as his tormentor!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
