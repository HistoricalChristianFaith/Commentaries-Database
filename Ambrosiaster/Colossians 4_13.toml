[[commentary]]
quote='''
For I bear him witness that he has much labor for you, and for those who are at Laodicea and at Hierapolis. To make them anxious for their own salvation, he shows how great the vigilance of others is on their behalf; for a man becomes more anxious out of shame when he sees another laboring in his cause.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
