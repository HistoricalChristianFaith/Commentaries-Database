[[commentary]]
quote='''
For indeed in this we groan, longing to be clothed over with our habitation which is from heaven; if indeed, being clothed, we are not found naked. He says that they groan in prayer for this reason: that the glory promised from the heavens may clothe them as they rise again. Longing for this, therefore, they persist in prayer, lest, when they rise again, having of course received the body, they be found naked, that is, strangers to the promised glory. For this is what is needed: that the soul, clothed with the body, be clothed over also with glory by the judgment of God, which is the change into brightness. For death is from the earth, but resurrection from the heavens, provided that it is changed into glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
