[[commentary]]
quote='''
If anyone speaks in a tongue, let it be by two, or at the most three, and one at a time, and let one interpret. That is, let two or three, no more, speak in tongues; but singly, not all at once, lest they should seem to be mad. Therefore, then, at the most three, lest those speaking in tongues and their interpreters should take up the day, and the prophets, who are the enlighteners of the whole Church, should have no time for discoursing on the Scriptures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
