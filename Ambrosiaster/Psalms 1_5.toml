[[commentary]]
quote='''
For in the first psalm too it is written: Therefore the ungodly will not rise in judgment, nor sinners in the council of the righteous (Ps. 1:5). For of the ungodly there is nothing to be inquired: but they will rise for this, that they may perish, seeing that what they refused to believe is true: and to perish is to be estranged from God, as he says to the Romans: For whoever have sinned without the law will perish without the law; and those who have sinned in the law will be judged by the law (Rom. 2:12): and so sinners will judge; for they are unworthy to rise with the saints, as he says: Nor sinners in the council of the righteous.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
