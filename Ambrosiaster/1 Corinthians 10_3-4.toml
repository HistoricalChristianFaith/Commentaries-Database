[[commentary]]
quote='''
And all ate the same spiritual food, and all drank the same spiritual drink; for they drank from the spiritual rock that followed them: and the rock was Christ. The manna and the water (Exod. 16:15; 17:6) which flowed from the rock he calls spiritual, because they were not prepared by the law of the world, but were created for the occasion by the power of God without any mixture of the elements, having in themselves the figure of the future mystery which we now take in commemoration of Christ the Lord. Therefore it was also called the bread of angels, because it was created by the power by which the angels subsist: signifying this, that he who would feed them spiritually was to come from heaven. Hence also the manna first came from heaven on the Lord's day, to the satisfying of the people; the rock, however, is called "following", and it is understood to be Christ. For where human help failed them, Christ was present; therefore he followed, so that where it had failed, he might come to their aid. For it was not the rock that gave the water, but Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
