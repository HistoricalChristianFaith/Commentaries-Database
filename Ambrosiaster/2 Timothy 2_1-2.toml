[[commentary]]
quote='''
You therefore, my son, be strengthened in the grace which is in Christ Jesus, and in the things which you have heard from me through many witnesses: entrust these to faithful men, who will be fit to teach others also. He instructs him to be constant and robust in teaching the grace of God which was given in Christ Jesus: and not only in the grace, but also in the mysteries which concern Christ. He wishes the secret things to be handed on to the faithful and worthy, who are able to teach others, not indiscriminately to common and careless men; for a teacher must be chosen with great care.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
