[[commentary]]
quote='''
With God, however, he is held a slave who has sinned (John 8:34). Accordingly, it was because of sin that Ham heard himself called a slave: Cursed be the boy Canaan; a slave of slaves shall he be to his brothers (Gen. 9:25). The ancients assented to this judgment, so that they defined all the wise to be free, and all fools to be slaves; because the wise man abstains from sins, so that he is freeborn who follows what is right, but he is a slave who through the imprudence of folly subjects himself to sin. Hence Ham too, who foolishly laughed at his father's nakedness, was called a slave because of his folly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
