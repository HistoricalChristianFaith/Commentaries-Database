[[commentary]]
quote='''
So even if I am offered up, he says, upon the sacrifice and ministry of your faith, I rejoice. For if he should be crushed by the faithless because he gathered them into his league, he indicates that he is to be congratulated; for he knows that his death has its effect. For it is a great sorrow if one suffers for those in whom one accomplishes nothing. Therefore he testifies that he rejoices in them, and that they ought to congratulate him; so that both the people and their able teacher may share with one another in a common joy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
