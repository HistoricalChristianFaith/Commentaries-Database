[[commentary]]
quote='''
But when it pleased him who set me apart from my mother's womb, and called me through his grace, to reveal his Son in me, that I might preach him among the Gentiles, immediately I did not acquiesce in flesh and blood. Since he had confidence in the Law, unaware that it was no longer the time for keeping the Law, and was striving with all eagerness, thinking that he was doing this by God's will, to resist the Gospel of Christ, God, seeing that his zeal was good but that knowledge was lacking to him, was pleased to call him to his grace, knowing that he was now fit to preach the Gospel of his Son among the Gentiles; because if in a very small matter the boldness of his conscience was so swift and faithful, not through flattery of anyone, how much more constant would he be in preaching the gift of God, in hope of the promised reward? By God's foreknowledge, then, he was set apart from his mother's womb, that is, before he was born, or as soon as he was born, God knew that he would be good, as he says to the prophet Jeremiah: Before I formed you in the womb, I knew you, etc. (Jer. 1:5): so too the apostle Paul: knowing what he would be, he went before him, so as to call him before he was converted, because he was necessary. Then he at once took up the dispensation of God's gift, putting aside every carnal care; for he did not seek anyone's counsel, or refer to anyone what he should do, but forthwith preached Christ, that he is the Son of God. For as those who will be bad are often good before, so too those who will be good are usually bad first.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
