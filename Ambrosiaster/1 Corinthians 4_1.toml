[[commentary]]
quote='''
Let a man so regard us, as ministers of Christ and dispensers of the mysteries of God. He indicated this because some of the Corinthians thought less of him; but so that a man might think of him what God also thought, who had chosen him, he therefore says ministers of Christ and dispensers of the mysteries of God. For since he strove to be understood not by a din of words nor by human wisdom, he had to dispense the mystery of Christ, in which not words but power shone forth, through which not man but God might be seen to be glorious; for as a colleague of fishermen he preached Christ no differently than they did. When, therefore, he proves himself a minister of Christ and of the mysteries of God, he brands the false apostles, and denies that what they hand down is Christ's, in that they disagreed with the apostolic tradition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
