[[commentary]]
quote='''
According to the prince of the power of this air, the spirit that now works in the sons of distrust. By the prince of the power, that is, the devil, he signifies that he corrupted the understanding of the world, so that they withdrew from the one God, taking up the opinion of many gods, in order that he might make them companions of his conspiracy, while they are found in the same ungodliness, denying the one God. He calls this prince of error, then, the spirit of the air for this reason: to show that he usurped this region for himself for the exercise of dominion. For the air is one thing and the prince another: but because he holds dominion in the world or in the air, he is called the spirit of the air.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
