[[commentary]]
quote='''
Children, obey your parents in all things; for this is pleasing to God. Nothing else can please God than what is just and godly. For then children can have God propitious, if they repay due honor to their parents, easy in obeying them, hard to bring to contempt, knowing that children ought never to plot against their parents.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
