[[commentary]]
quote='''
But I wished all men to be as myself. As far, then, as befits a kindly and solicitous teacher, he wished all, if it could be, to be such as he himself was. And what sort he himself was, he shows presently in what follows: But each has his own gift from God, one in this way, another in that; that is, each has the gift of God according to his own desire, so that, if he wishes, he may obtain the ability by the assent of God himself. Therefore no one ought to be constrained, lest, forbidden what is lawful, he commit what is unlawful: but let him choose for himself what to follow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
