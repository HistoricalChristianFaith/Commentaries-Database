[[commentary]]
quote='''
Show therefore the display of your love, and of our exultation on your behalf, in them, in the face of the churches. He admonishes them to show their love in those whom he sends, so that they might prove true the good things they had heard about themselves. For they would show that they had profited by the Apostle's admonitions in this way, if they received those sent by him with honor, so that the other churches might recognize that the good things which had begun to be said of them were true. He therefore spurs their minds on, because one of whom good is thought usually shows himself better.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
