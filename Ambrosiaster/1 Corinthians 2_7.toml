[[commentary]]
quote='''
But we speak the wisdom of God in a mystery, which is hidden. He testifies that he has been sent to make manifest a hidden meaning, which neither the princes nor the powers knew, nor had the world heard; and that for this reason it is thought foolish, because it is unknown: but that it is rational and saving, as power bears witness, to which every effort of human reasoning yields. The wisdom of God, then, is hidden, since it is not in words but in power; not attainable by human reason, but made credible by the efficacy of the spirit.

Which God predestined before the ages for our glory. So true a wisdom is it, and so plainly is it declared to have been always with God, that it is said to have been predestined before the ages for our glory, who believe. For God, foreknowing the errors that were to come in the world which he was going to make, decreed this for the confounding of those who were going to make foolishness their wisdom, but for the glory of us who were going to believe, and do believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
