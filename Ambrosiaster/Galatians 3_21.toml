[[commentary]]
quote='''
Is the Law then against the promises of God? Far from it! Far from it indeed, because the Law is not hostile to the promise, since in fact it confirms it. For Moses first says: God will raise up for you a prophet from your brothers (Deut. 18:15). The apostle Peter proves in the Acts of the Apostles that this was said of Christ. For if a Law had been given which could give life, righteousness would truly be from the Law (Acts 3:22). He means this righteousness which is imputed as righteousness before God, that is, the righteousness of faith; because the Law too had righteousness, but for the present, not one that would justify before God. For it could not remit sins, so as to make righteous men out of sinners; but it was given for this, that it might be a terror, calling men to a good life and punishing the irreverent. And therefore the Law was not given such that it could give life, but such that it could condemn.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
