[[commentary]]
quote='''
And that I should enlighten all, what is the dispensation of the mystery hidden from the ages in God, who created all things. He says that he was sent to teach the Gentiles in a twofold way the mystery which was in God, from whom are all things: that through him they might learn and understand that Christ was always in God and with God, and that God disposed to save the Gentiles without circumcision and the other commandments of the Law. For the Jews were found unworthy to have so great and such a teacher; for the Jews believed in Christ in such a way that they still kept the Law, which is hateful to God. And indeed the apostles say to their fellow apostle Paul: You see, brother, how many thousands of believers there are among the Jews, and all these are zealots of the Law (Acts 21:20). Hence it came about that the vessel of election was sent to teach the Gentiles, so that they at least might have a full hope of their faith, hoping nothing from the Law, but in Christ alone. For once the mystery was made manifest, such a gift of Christ was given as would have the effect of perfect salvation; for as at great vows the largest festal presents are given, so also, when a magnificent mystery was made manifest, men were presented, for the sake of joy and gladness, with so excellent a gift that it is enough for them for a saving abundance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
