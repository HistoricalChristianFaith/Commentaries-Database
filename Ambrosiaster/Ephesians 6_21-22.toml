[[commentary]]
quote='''
But that you also may know the things that concern me, what I am doing, Tychicus, the beloved brother and faithful minister in the Lord, will make fully known to you: whom I have sent to you for this very purpose, that he may learn the things that concern you, and comfort your hearts. Through Tychicus the Ephesians learn what the Apostle is doing, and he likewise learns what the Ephesians were doing. Concerning the Apostle there was no doubt, since the things he did were divine; but this was to be known about him: what he was doing among the faithless and their plots. Concerning the Ephesians, on the other hand, this was to be learned: whether they were making progress or not. So that they might obey, then, and listen gladly to the words of Tychicus, he commends him, calling him a most beloved brother and a fit minister of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
