[[commentary]]
quote='''
I have become foolish; you compelled me. He says that he was forced to show what he was. And certainly he is no fool who has spoken the truth about himself; but he lowers himself, to make it plain that he does not display his merits willingly. For I ought to have been commended by you. It is plain that these, among whom he established the Church and showed the wonders of the signs of apostleship, ought to have borne witness for him against his detractors, so that, while he kept silent about this, they would defend him whom they had as father in the Gospel of Christ. For I have done nothing less than those exceedingly apostles. Exceedingly, that is, too much, as it seemed to some; for they were what the apostle Paul also was. He says this, then, because he is not less, either in preaching or in working signs, than the apostles, his predecessors not in dignity but in time. For if it is thought that a claim should be settled by time, John began to preach before Christ; and yet it was not Christ who baptized John, but John who baptized Christ. Does God, then, judge in this way? Again, Andrew followed the Savior before Peter, and yet it was not Andrew who received the primacy, but Peter. Why then did he not seem an apostle to some, when by the grace of God he could do the same things as the apostles? Therefore he grieves, and, compelled, shows what he merits by the Lord's favor. Hence it is that he was forced to declare not only that he was not less, but also that he had labored more than all. So he displeased them, and he did not seem to be an apostle to those who, out of zeal for their ancestral law, rejected his preaching as that of an enemy of the tradition of Moses, because he said that it was now ceasing; they favored the apostles rather, and humbled him beneath them, because the apostles did not assert anything against the Law so firmly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
