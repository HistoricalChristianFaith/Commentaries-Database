[[commentary]]
quote='''
Wherefore he says: Arise, you who sleep, and rise up from the dead, and you will touch Christ. By this sleep he signifies the stupor of the mind, which is estranged from the true way. And this estrangement is a kind of death, from which he is urged to rise again; so that, coming to his senses, he may acknowledge the truth, which is Christ. The faithless, then, and the vicious, sunk in the mire in despair of life, are admonished to rise again or emerge, and to have part with Christ; that they may pass from darkness to light and from death to life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
