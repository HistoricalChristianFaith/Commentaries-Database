[[commentary]]
quote='''
Which is the first commandment of the promise, that it may be well with you, and that you may be long-lived upon the earth. This promise is contained in Exodus (Exod. 20:12), that parents be held in honor, so that it might be well with them and they might reach a more advanced age. Yet how did he call this the first commandment, when it is certain that the first commandment is contained thus: You shall have no other gods besides me. Then: You shall not make for yourself any likeness of the things that are in heaven above, and on the earth beneath. The third: You shall not take the name of the Lord your God in vain. The fourth: You shall observe, he says, my sabbaths. And the fifth: Honor father and mother, etc. (Exod. 20:3 ff.). But because the first four commandments pertain to God, these are understood to be contained on the first tablet, and the rest pertain to man: that he honor his parents, that he not kill, not commit fornication, not steal, not bear false witness, nor covet anything of his neighbor's. These six commandments are seen to have been written on the second tablet, and the first of them is: Honor father and mother. For this reason, then, he said: Which is the first commandment in the promise; so as to distinguish between the commandments that pertain to God and those that pertain to man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
