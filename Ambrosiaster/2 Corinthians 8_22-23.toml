[[commentary]]
quote='''
And we have sent with them our brother also, whom we have proved in many things to be often earnest, but now much more earnest, with much confidence in you, whether through Titus, who is my partner and helper among you, or through our brothers, apostles of the churches for the glory of Christ. He calls Titus his partner because he too was a bishop, to whom he gave as minister one known in all the churches of that province; to these he adds also a third brother, proved in many good works and earnest. But through the report of Titus, who related the good will of the Corinthians, and of the others who were sent, whom he calls apostles of the churches for the glory of Christ, he shows that he has become more eager to see them and to exhort them to the ministry to the saints. For he received confidence on hearing that the Corinthians had become better. Hence he was eager to go to them, certain that they would obey in doing good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
