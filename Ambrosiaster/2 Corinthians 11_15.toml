[[commentary]]
quote='''
It is no great thing, then, if his ministers also are transformed as ministers of righteousness. The ministers of righteousness are the apostles, whose companions these men falsely claimed to be, so as to deceive their hearers. Whose end will be according to their works. Without doubt, because such men will be judged according to the wickedness of their mind; for not for God's sake but for their own belly's sake they pretend to be ministers of God. Yet he says that their end is according to their works: so that, just as the works and the care of the belly perish, so these too may be understood to perish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
