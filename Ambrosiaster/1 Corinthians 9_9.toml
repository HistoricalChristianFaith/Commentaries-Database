[[commentary]]
quote='''
WHAT DOES IT MEAN IN THE PSALM, “MEN,” HE SAYS, “AND BEASTS YOU WILL SAVE” (Ps. 35:7); AND IN THE PROPHET JONAH, “I WILL NOT SPARE,” HE SAYS, “THE CITY IN WHICH LIVE ONE HUNDRED AND THIRTY THOUSAND PEOPLE, AND MANY ANIMALS” (Jonah 4:11); WHEREAS THE APOSTLE SAYS, “DOES GOD CARE FOR OXEN?” (1 Cor. 9:9). — As far as the wording goes, it seems contradictory; but if the purpose of man and of animals is considered, it will become clear that it is not different. God takes care of all, as the maker of all; but he does not preserve animals for their own sake, he preserves animals for the sake of men, not men for the sake of animals. Therefore, in caring for men, he keeps the animals, so that his concern is not for oxen, but for human beings. For what hope is there in animals?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 7: ON GOD'S CARE FOR MEN AND ANIMALS"

[[commentary]]
quote='''
For in the Law (Deut. 25:4) it is written: You shall not bind the mouth of the ox that threshes. Is it for oxen that God cares? Meanwhile let us settle this in a few words; for in the prophet Jonah it is written: Shall I not spare the city in which there dwell more than a hundred and twenty thousand men, and many cattle (Jon. 4:11). And the Psalmist: Men and beasts, he says, you will save (Ps. 35:7). How, then, does God not care about oxen and cattle? But he does not care about oxen and cattle for their own sake, but for ours, for whose sake they were made; therefore he cares about us, not about them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
