[[commentary]]
quote='''
Therefore let us not sleep, as the others do, but let us watch and be sober. For those who sleep, sleep at night; and those who are drunk, are drunk at night. But let us who are of the day be sober, having put on the breastplate of faith and love, and for a helmet the hope of salvation, because God has not appointed us to wrath, but to the acquiring of salvation through our Lord Jesus Christ, who died for us, so that whether we watch or sleep, we may live together with him. For which reason exhort one another, and build up one another, as you also do. What he says is plain; for he warns that we should not act negligently, secure in the name of the Savior, and that we ought therefore to be fortified with three bulwarks, that is, of faith, and of hope, and of love. For while faith remains, it rouses hope; and hope is necessarily anxious about the promise, and does not sleep; and love offers one devoted to God, for love admits nothing contrary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
