[[commentary]]
quote='''
Rejoice in the Lord always; again I say, rejoice. The Apostle, glad at their works and faith, to heap up his own eagerness, earnestly wishes that they, advancing in this zeal, should always rejoice in the Lord; for this is why he repeats it, to show that he rejoices in them with true affection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
