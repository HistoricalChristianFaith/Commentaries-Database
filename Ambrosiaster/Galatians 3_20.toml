[[commentary]]
quote='''
WHAT NEED WAS THERE FOR THE APOSTLE, WHEN REBUKING THE GALATIANS, TO INSERT THIS STATEMENT? FOR TO THE GALATIANS, WHO AFTER THE GOSPEL WERE TAKING REFUGE IN THE LAW, HE SAYS AMONG OTHER THINGS: “NOW A MEDIATOR IS NOT OF ONE, BUT GOD IS ONE” (Gal. 3:20), AS THOUGH THE GALATIANS DENIED THAT GOD IS ONE. YET IT WAS PRECISELY BY THIS LINE OF REASONING THAT THEY HAD BEEN LED INTO THE LAW: SO THAT THEY MIGHT BELIEVE IN ONE, UNIQUE GOD; AND THAT CHRIST HAD COME ONLY AS A MINISTER BY PREDESTINATION, TO DISPENSE THE GIFT OF GOD’S GRACE. — It is clear that the Galatians were therefore drawn into the Law in such a way that they did indeed profess Christ, but not as he ought to be confessed; rather, in the manner of Photinus, so that, since the Law proclaims one God, it would be contrary to the Law if Christ were called God. This is the device of the Jews, who, overcome by the great deeds of power, believed after the cross of Christ in such a way that, while professing Christ, they nevertheless kept the Law, as though all hope ought not to be placed in Christ. These are the ones whom the Apostle calls “false brethren” (Gal. 2:4; and 2 Cor. 11:26). These, therefore, after the tradition of the Apostles, corrupted the understanding of the Galatians, so that they made them Jews under the name of the Savior. Therefore the Apostle says that Christ came as mediator of the circumcision and the foreskin, as he says to the Ephesians: “making peace in one new man” (Eph. 2:15). If, then, Christ came as mediator, a mediator makes peace between two in such a way that he lays down a new rule, taking away the professions of both, and reconciles them, so that, following his decision, they lose their former discord. For when the Jew insists on circumcision and the Gentile on uncircumcision, there is discord; but when this is taken away from both, there is peace. If, therefore, things stand therefore, how is it, he says, that you Galatians, having become Jews, corrupt the mediation of Christ? Therefore he said to them: “You have been severed from Christ.” (Gal. 5:4) For, despising the right of reconciliation which he had established between them, they turned back to the former way of thinking of the Jews, thereby accusing both themselves and their reconciler. For whatever displeases is accused. And because this matter forced the Galatians to turn to the Law, so that they confessed one God without the mystery, as though it were hostile to the Law if Christ were called God, he says: “The mediator,” that is, the go-between, “is not of one, but of two, of course; but you, turning to the Law, have rejected the mediator; yet God is one.” By saying this, he shows that he proclaims Christ as God in such a way that he does not make him another God, nor confess two, but one God, as is also said in the Law. For when Christ is proclaimed as God from God, this does not result in another God; because that which is from God does not allow itself to be called another God. For whether he is God, or what is from God, he is one God. For there is in fact no difference between God and that which is from God. Yet he is “another.” He is “another” on account of the person by which he is called the Son; but he is the same on account of the unity of substance. Let it not seem blameworthy that I have said “person”; for some are accustomed to reject this. But let us follow the Apostle, who says: “For what I have forgiven, if I have forgiven anything, I have done so for your sakes, in the person of Christ” (2 Cor. 2:10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 57: ON THE MEDIATOR AND THE ONE GOD (GAL. 3:20)"

[[commentary]]
quote='''
But a mediator is not of one. Without doubt a mediator, that is, an arbiter, is not of one, but of two; for when two peoples were fighting against each other, always at variance and enemies through the diversity of their teaching, the Savior came as their arbiter, cutting off from both peoples that through which they were in discord, so that they might be at peace. He therefore took away from the Gentiles the number of gods and the service of the elements, which was a stumbling block to the Hebrews; he also took away from the Jews the works of the Law, that is, new moons, circumcision, and the observance of the sabbath, and the distinctions of foods, and the other things which the Gentiles abhorred; and so those who had formerly been enemies were made peaceable. If then these things are so, why is it that the Galatians, through dullness of mind, corrupt this arbitration, having turned to Judaism? For they bring the judgment of the Savior to nothing when, after peace has been made, as if repenting of it, they subject themselves to those things which had formerly been hostile to peace. According to the Galatians' understanding, therefore, Christ is not an arbiter; because, having been led into the Law, they have made one people out of two, and of one people certainly no one is the arbiter. He pursues this same sense to the Ephesians, saying: For he is our peace, who made both one, and breaking down the middle wall of partition, the enmity in his flesh, making void the law of commandments in decrees; that he might create the two in himself in one new man, making peace (Eph. 2:14). If he makes peace in one new man, he has certainly taken away from both that through which they were at variance; and by giving his own law he established for them that through which they might be at peace. This is what the Galatians broke through, having turned to Judaism: But God is one. He says this lest, by preaching Christ as God, whom he calls an arbiter for the one God, he should be thought to have preached against the Law and the prophets. He teaches, therefore, that this arbiter is to be understood through the assumption of flesh, as he says to Timothy: The arbiter of God and of men, the man Jesus Christ (1 Tim. 2:5); but that according to what he is as God, he is not separated from the Father, but is one with the Father. For whether Father or Son, God is one; for God is the name of a nature and of a power, which, as the very meaning of the names teaches, remains undivided in the Father and the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
