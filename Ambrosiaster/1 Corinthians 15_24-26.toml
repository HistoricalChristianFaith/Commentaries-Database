[[commentary]]
quote='''
Then the end, when he has delivered the kingdom to God and the Father, when he has destroyed every principality and every power and every virtue and every dominion. For he must reign until he puts all enemies under his feet; for he has subjected all things under his feet. And last of all, death the enemy will be destroyed. He says this because, when the kingdom has been delivered, there will be the end of the world, the resurrection having been accomplished. Certain people, frightened by the harshness of this expression, turn aside from the proper sense while they wish to think, as it were, piously. For they shudder at the sound of the word when they hear: When he has delivered the kingdom to God and the Father; thinking that by this delivery of the kingdom, if it is understood according to the sound of the word, he remains empty; so that, if he delivers it, he himself no longer has it: as if the Father, in delivering all things to the Son, had emptied himself. For the Lord himself says: All things have been delivered to me by my Father (Matt. 11:27); and afterward: And this is eternal life, that they may know you, the only true God, and Jesus Christ whom you have sent (John 17:3). See: while the Son reigns, the Father reigns too. And how could the Son be believed to empty himself by delivering the kingdom, when the angel says to Mary: And the Lord God will give him the throne of David his father, and he will reign in the house of Jacob for ever, and of his kingdom there will be no end (Luke 1:32)? And Daniel says of the same kingdom, among other things: The God of heaven will raise up another kingdom, which will never be corrupted; and this kingdom will be eternal (Dan. 2:44). Let no one, then, doubt that the Son will always reign with the Father. But this delivery of the kingdom is this: that when all things have been subjected to the Son, and have worshiped him as God, death having been destroyed, then the Son will show them that he is not the one from whom are all things, but the one through whom are all things: and this will be to deliver the kingdom to God and the Father, to show that he it is from whom all fatherhood in heaven and on earth is named (Eph. 3:15): and then will be the end. The destruction of death, however, is the resurrection of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
