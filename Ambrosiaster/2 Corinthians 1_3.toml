[[commentary]]
quote='''
Blessed be God and the Father of our Lord Jesus Christ. Always, in every letter, when he is about to speak of God the Father and of his gift, he hands down the order of the mystery. The Father of mercies and God of all consolation. He began from the very reason; for he gives much refreshment to those who had been grieved because of the rebuke. For hearing that the Lord is the father not only of all origin but also of mercies, they were lifted up by hope, and made certain that they had been rebuked for this purpose: that, once converted, they might find the mercy of God. But why did he say "father of mercies," unless so that it might be recognized that through mercy he regenerates and reforms the penitent once more, so that there is not pardon alone but the restoration of their former state? And so he says "of mercies" on account of the various sins: to console those who were grieved because of their offenses, that is, not to deny hope to the converted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
