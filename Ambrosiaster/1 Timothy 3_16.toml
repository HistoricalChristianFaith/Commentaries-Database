[[commentary]]
quote='''
And indeed, by the confession of all, great is the mystery of this godliness. He denies that any of the faithful fails to marvel at the mystery of the truth preached in the Church, which he calls godliness; for to those who acknowledge his magnanimity and clemency he grants eternal and divine gifts, besides the remission of sins, which he bestows here in the present. Which was declared in the flesh, justified in the spirit, seen by angels, preached to the Gentiles, believed in this world, taken up in glory. He says that the mystery of God's mystery, which is Christ in the flesh, has been made manifest, which lay hidden in the spirit. For the Son of God, born a man, who was in secret with God, declared himself to the creation by work and preaching; and this is to have been justified in the Spirit: that it became clear by his works and power who he was who was in the flesh; and then that he appeared to angels, no longer in the form of lowliness, but in power. For he was seen lowly in aspect through the flesh only as long as it was until, death having been vanquished, he should rise from the dead, and the majesty of him should be seen who, born as a man, was not wholly man; so that the angels, recognizing the mystery which before lay hidden, declared in the flesh, bending the knee to him as to God, might give thanks, because they have learned the truth which was preached to the Gentiles, that they might be freed from error; in which the world makes progress, so that it may not be condemned. It was believed by the world. For the mystery of God was given to the world to be believed for this reason, that its faithlessness might not be able to merit pardon for its error, as the Lord says of the Jews: If I had not come and spoken to them, they would not have sin; but now they will have no excuse for their sin (John 15:22).

Taken up in glory. Because what they despised as weak and unsightly was taken up in glory; for after the cross, his person and his power having been made manifest, the Savior openly ascended in glory into the heavens, with the clouds serving him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
