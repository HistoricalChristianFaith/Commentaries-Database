[[commentary]]
quote='''
Who also sealed us, giving us his Spirit as a pledge; so that we may not doubt of his promises. For if he has entrusted his Spirit to us while we are still mortal, there is no doubt that he will add to us, once we are immortal, unto glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
