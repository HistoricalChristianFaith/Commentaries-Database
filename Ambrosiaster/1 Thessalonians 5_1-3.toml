[[commentary]]
quote='''
But concerning the times and the moments, brothers, there is no need for anything to be written to you; for you yourselves know diligently that the day of the Lord will come just as a thief in the night. For when they say: Peace and security, then sudden destruction will come upon them, like the pain of childbirth upon a woman with child, and they will not escape. This is what the Lord spoke in the Gospel, saying: Watch, because you do not know the hour at which your Lord will come (Mark 13:32). And again: If anyone says to you: Behold, here is the Christ, or behold, there; do not believe it (Matt. 24:23). For suddenly and unexpectedly he will appear, as lightning appears from the East to the West, having with him the host of the army of God the Father for the destruction of the Antichrist and his henchmen. For when the saints, that is, Enoch and Elijah, have been killed, and the faithless are secure about the kingdom of the devil and glad at their victory, sending gifts to one another, as the Apocalypse says (Rev. 11:7 ff.), then sudden destruction will come upon them suddenly. For at his coming Christ will destroy all these, so that the saints, seeing that they have escaped, may glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
