[[commentary]]
quote='''
But I will most gladly spend and spend over and above, and I myself will be spent for your souls. Now he openly shows the affection and love that he had toward them, when he says that he is ready not only to spend his own goods for them, and to spend them more readily still, but even to die himself for the salvation of their souls, as the apostle John also says, that after the Savior's example we ought even to lay down our lives for the brothers (1 John 3:16). Loving you very much, I am loved less. He provokes them to love, because they themselves ought to love him more, him above all through whom they learned the way of salvation, through whom also they were gained for God, made faithful from faithless, and purified from defiled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
