[[commentary]]
quote='''
Let no one therefore judge you in food, or in drink, or in respect of a festival day, or of the new moons, or of the sabbath: which are a shadow of things to come, but the body is Christ's. Since all hope of life, and confidence, is in Christ, he has commanded that we ought to be subject to no superstition or law. Wherefore those who make a din, or who whisper something that does not pertain to the faith of Christ, are to be despised: but he alone is to be followed through whom death was conquered and the resurrection of the dead restored. For some of the Jews are wont to judge the faithful because they eat of foods which were forbidden through Moses, though God has made all things clean: but the Jews, having been judged unworthy to eat of these, were forbidden the better things. Again, they are wont to reproach us because we spurn their festival days, or because we do not observe the beginnings of months, which they call neomeniae (new moons): but above all because we do not keep the days of the sabbaths, so as to pass them in idleness and feasting with luxury: which pertains rather to offence than to grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
