[[commentary]]
quote='''
I testify before God, and Christ Jesus, and the elect angels, that you keep these things, doing nothing without prior judgment, inclining to the other side. Lay hands hastily on no one, nor share in other men's sins. Keep yourself chaste. He lays down his testimony before God the Father, and Christ his Son, and his elect angels, whom the Lord in the Gospel calls holy (Mark 8:38). These, therefore, are elect, because there are others, reprobate, who are not God's angels but the devil's, assenting to his apostasy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
