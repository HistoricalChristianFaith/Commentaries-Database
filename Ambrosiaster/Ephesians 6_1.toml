[[commentary]]
quote='''
Children, obey your parents in the Lord, for this is right: Honor your father and mother. A law is given to children, that, since they owe their existence to their parents as authors, they should obey them; for it is right that they show reverence to those through whom they exist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
