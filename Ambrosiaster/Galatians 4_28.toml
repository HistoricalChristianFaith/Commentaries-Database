[[commentary]]
quote='''
But you, brothers, are sons of the promise according to Isaac. That is, they are sons not of the flesh but of God; for Isaac was born as a type of the Son of God: and he wants them to understand by implication that, having been made sons of God, they had turned so as to be sons of the flesh; but if they come to their senses, they are sons of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
