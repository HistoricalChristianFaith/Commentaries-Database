[[commentary]]
quote='''
For this we say to you in the word of the Lord, that we who live, who are left behind until the coming of the Lord, shall not go before those who have slept. For the Lord himself will descend from heaven at a command, and with the voice of an Archangel, and with the trumpet of God, and those who have died in Christ will rise first: then we who live, who are left, will be caught up together with them in the clouds to meet the Lord in the air, and so we shall always be with the Lord. Wherefore comfort one another with these words. He professes that he speaks with the mind of the Lord, when he says: This we say to you in the word of the Lord. For in order to demonstrate the faithful hope and the assured glory of the resurrection promised to the saints, he sets out the very order of how it will come about, at the bidding of Christ the judge, the Holy Spirit making it known; so that by this very hope those who have sent their dear ones on ahead may not grieve, learning that at the coming of the Lord those who die in Christ will rise first.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
