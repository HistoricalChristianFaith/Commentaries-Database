[[commentary]]
quote='''
Now I make known to you, brethren, that the Gospel which I preached to you, which you also received, in which you also stand, through which you also will be saved, which I also announced to you in word, you ought to hold fast; unless perhaps you believed without cause. He shows them that if in this matter, which is set out below, they have been seduced away from his tradition, they have lost what they believed; for the whole hope of believers lies in this sense: that the dead will rise. And when he says: In which you also stand, he says it to those who were firm in the faith of this tradition; for he is speaking to a mixed company, so that those who are fixed in the faith may rejoice, and those who waver may grieve at being rebuked, and be corrected.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
