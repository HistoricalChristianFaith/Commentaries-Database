[[commentary]]
quote='''
In whom we have redemption, and the remission of sins. Into the kingdom of this his Son God has transferred us, through whom he redeemed us and set us free; for the remission of sins makes men free, so that, freed from their debts, they cannot be held liable. For without faith in Christ there is no way out of the underworld; because one who is bound by sins cannot go out through the gates of Tartarus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
