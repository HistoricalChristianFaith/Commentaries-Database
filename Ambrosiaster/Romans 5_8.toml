[[commentary]]
quote='''
Therefore He praises His love, while He is still generous toward His enemies and sends One who will save them, even though they certainly do not deserve it.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html"
source_title="COMMENTARY ON ROMANS"
