[[commentary]]
quote='''
But neither do I judge myself; I am indeed conscious of nothing against myself. It is plain that, having a pure conscience, he was not anxious about himself. But I am not justified in this. Now he humbles himself and speaks as a man, who could incur a fault without knowing it. But he who judges me is the Lord. He speaks rightly; for although he humbled himself, yet he granted very much to the Lord Christ, because, when he judges hidden things, he can make manifest what lies hidden from a man, not to make him guilty, but prudent. For though he is holy, he is yet a man, and it cannot be that nothing escapes him. For at times we think something useful which is useless; for we do not have all the members or sides of human conduct written down; but from the things that are grave we have been openly forbidden. For certain matters, arising from some causes, are apt to deceive us, so that we think useful what is not useful; and this indeed is a light thing, because the purpose is free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
