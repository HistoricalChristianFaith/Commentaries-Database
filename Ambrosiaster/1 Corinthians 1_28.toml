[[commentary]]
quote='''
And God chose the ignoble things of this world and the contemptible, and the things that are not, that he might destroy the things that are. He chose, then, the ignoble and contemptible things: not because they are truly ignoble and contemptible, but they are so judged by the world, because they spurn worldly reasonings by believing in Christ; that he might destroy the things that are truly ignoble and contemptible; because those who judge are rather the ones to be judged and condemned. For error invented their assertion, and it was not from the beginning: but our teaching is from the beginning. Theirs is destroyed, then, since it is asserted with bare words without testimony: but ours is proved not by words alone, but also with power as its witness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
