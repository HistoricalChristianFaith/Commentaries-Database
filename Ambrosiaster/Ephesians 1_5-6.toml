[[commentary]]
quote='''
According to the good pleasure of his will, to the praise of his glory. He says that God had such good pleasure that the grace given to men should tend to the praise of his glory, so that our salvation might be the glory of God. By which he has graced us in his beloved Son. God has given us grace because we have believed in his Son Christ; for, loving his only-begotten, he bestows divine gifts on those who love him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
