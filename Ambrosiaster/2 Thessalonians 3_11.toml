[[commentary]]
quote='''
For we have heard that some walk among you intemperately, doing no work, but acting curiously. Those who desire to be idle make it their business that an occasion may arise by which they may make their entrance desirable to the houses of the rich; walking about, they subtly gather up deeds and the opinions of words, knowing what each one wishes to hear about what, so that they may be fed gladly and even sought after. This practice is very far removed from the discipline of the Lord; for the belly is the god of those who provide their necessities with a foul care.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
