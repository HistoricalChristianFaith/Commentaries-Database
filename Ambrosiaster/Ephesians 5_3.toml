[[commentary]]
quote='''
But fornication, and all uncleanness or avarice, let it not even be named among you, as befits saints. What he says is plain. Yet how grave a thing is avarice, which we let pass, since it is compared with fornication and uncleanness! And yet it is regarded by us in this way, as some fault of no moment, though it is a grave sin. They cannot, then, be saints in whom anything of these things that he forbids has been found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
