[[commentary]]
quote='''
We are beginning again to commend ourselves. Since he is marking out the false apostles, pointing to their crooked inventions, while testifying that he himself is a true preacher, he seems to be commending himself again, as in the first epistle. And lest he should seem to do this by some cunning, for the sake of earthly gain, he added: Do we need, as some do, letters of recommendation to you, or from you? In saying this he clears his own intention, and still marks out the false apostles, who, as he shows, go round the churches for the sake of their own honor and gain, to take salvation away, not to bestow it. Of their number were those to whom the Lord says: You devour the houses of widows and orphans, praying long prayers; therefore you will receive the greater judgment (Matt. 23:14). For these were seizing both their property and their souls; but the Apostle did not touch their property, and by the truth of his doctrine he was saving their souls. Therefore he commended himself not carnally but spiritually, for the advancement of their salvation, so that they might believe of him what he was; for he who thinks ill of a good man sins: and on this account this commendation profits them rather.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
