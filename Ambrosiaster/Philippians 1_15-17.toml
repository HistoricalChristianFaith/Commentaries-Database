[[commentary]]
quote='''
Many of the brethren, then, proclaimed Christ with a will that was sincere indeed, but differing; for some did this with good will, for the glory of God alone; but others, stirred by love of the apostle, being certain of God's protection. So again, on the other side, he sets down two other kinds, which did not preach with a sincere mind; for some, envying the Apostle, did this out of contention; but others proclaimed Christ with the cunning of pretense, so that they might stir up seditions against the Apostle, as the author of this sect, who had gathered many into his league. For greater envy grew against the Apostle when many were seen to teach from his side.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
