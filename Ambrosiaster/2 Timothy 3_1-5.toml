[[commentary]]
quote='''
But know this, that in the last days perilous times will be at hand; for men will be lovers of themselves only, avaricious, insolent, proud, blasphemers, disobedient to parents, ungrateful, ungodly, without faith, without love, accusers, incontinent, ungentle, enemies of the good, traitors, wanton, swollen with pride, lovers of pleasures rather than of God, having the form of godliness but denying its power; and avoid these. This is a prophecy of the holy Apostle, in which he foresaw how great would be the evils to come from the heretics and the Jews; for in them all these things that are hostile to the faith are marked out. For the Apostle himself said: For what is it to me to judge those who are outside (1 Cor. 5:12)? For those who think ill of God, and do not fear to profess what tends to his injury, how can they be well-disposed in human conduct? For this is why he said: Having the form of godliness, but denying its power; because they indeed profess themselves Christians, although they are both most wicked in their works and perverse in their understanding. For the praise and power of God lies not in profession more than in deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
