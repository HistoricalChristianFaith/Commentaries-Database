[[commentary]]
quote='''
Grace to you and peace from God our Father, and the Lord Jesus Christ. He says that the grace of God is with the saints and the faithful, God whom he calls our Father, because from him all things are both founded and restored; and Christ our Lord, because he redeemed us, offering himself for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
