[[commentary]]
quote='''
But when I come, those whom you have approved by letters, these I will send to carry your grace to Jerusalem. This consolation brought benefit in a twofold kind, as it does now also; so that it benefited both the saints mentioned above and the poor established in the Church, as it now too benefits both the needs of the aged and the needy. He says that he sends by letter those whom they have chosen as suitable for the dispensation: these letters give testimony to those who are sent, so that they may be received with grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
