[[commentary]]
quote='''
For the flesh of the Savior is for the salvation of the body, but the blood was poured out for our soul, just as had been prefigured earlier by Moses; for so he says: The flesh is offered for your body, but the blood for the soul (Lev. 17:11); and therefore blood is not to be eaten.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
