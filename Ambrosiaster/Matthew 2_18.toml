[[commentary]]
quote='''
WHAT DOES IT MEAN THAT, ALTHOUGH THOSE WHO WERE KILLED WERE THE SONS OF LEAH, FROM THE TRIBE OF JUDAH, RACHEL IS SAID TO BE WEEPING FOR HER SONS (Matt. 2:18)?  — As far as the historical sense goes, Rachel’s sons belong to the tribe of Benjamin. Now, in former times, because of their own crimes, namely the deeds of the Sodomites and the outrage committed against the concubine of the Levite, they were destroyed and wiped out by the other tribes (Judg. 19–20). Therefore she is said to refuse to accept comfort, knowing there is no hope for those who are known to have perished. But the sons of Leah were slain in early childhood for the sake of the Savior. Therefore he does not wish their case to be counted as the cause of her crying, because they were both innocent and killed for God’s sake, and without doubt, by the grace of reward, have been granted eternal life by Him. For this reason he says that Rachel’s crying rightly belongs to her sons, who have been erased both in the present life and in the future. The others, mourned in a bodily sense, have been comforted in a spiritual sense. But Rachel’s sons, who lived in a carnal manner, will be consumed by spiritual flames. The Evangelist therefore bears witness that the crying of Rachel was fulfilled in the death of Leah’s sons, because she began to weep for her sons at the moment when she saw her sister’s sons killed for such a cause that they should become heirs of eternal life. For when something adverse befalls a person, he grieves more bitterly over his own misfortune when he sees the happiness of another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 62: WHY IS RACHEL SAID TO WEEP FOR HER SONS?"

[[commentary]]
quote='''
WHY IS IT THAT, WITH LEAH’S SONS SLAIN, WHO ARE FROM THE TRIBE OF JUDAH, RACHEL IS SAID TO BE WEEPING FOR HER SONS (Matt. 2:18)?  — The children of Rachel, as history teaches us, were formerly devastated and destroyed by the other tribes, in punishment for their crimes against nature, and the infamous attack they levied on the wife of a Levite etc.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 12: WHY IS RACHEL SAID TO WEEP FOR HER SONS?"
