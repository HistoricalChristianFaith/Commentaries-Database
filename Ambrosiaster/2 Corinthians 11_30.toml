[[commentary]]
quote='''
If I must boast, I will boast in the things that belong to my weakness. He says this because, if a Christian must boast, he must boast in the humility by which one grows before God. Hence in another place he says: When I am weak, then I am powerful (2 Cor. 12:10), that is, when I am humbled for the salvation of the brothers, then I am exalted. In this one must boast, not in the progeny of the flesh, because one is of the seed of Abraham.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
