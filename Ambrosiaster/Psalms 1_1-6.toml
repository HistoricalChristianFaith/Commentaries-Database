[[commentary]]
quote='''
ON THE FIRST PSALM. — “Blessed is the man who has not stood in the way of sinners.” (Ps. 1:1a) But if he has stood, he is no longer blessed, but guilty and worthy of blows. For he seems to have some hope of correction, because he is not wicked, but a sinner. But if there is one who has not gone in the counsel of the wicked, and has not stood in the way of sinners, he is blessed in a twofold way. For he cannot be blessed if he does not go into the counsel of sinners yet stands in the way of sinners; for even if he is not destined for destruction, he is still accountable to punishment. Then he added, “And has not sat in the chair of pestilence.” (Ps. 1:1b) He says this is the blessedness which consists in these three steps and is guarded by this threefold rule; that is, that one neither go into the counsel of the wicked, nor stand in the way of sinners, nor sit in the chair of pestilence. But since only two kinds are mentioned, that of the wicked and that of sinners, in the record of those things just mentioned, to which class did he wish to assign this third, which he added, saying, “And has not sat in the chair of pestilence”: to that of the wicked, or of the sinners? But let us see what it is to sit in the chair of pestilence, and then we shall understand to which class he assigns this. We call that the chair of pestilence which is outside the ordering of God, clearly devised for this purpose, that unjust judgments may proceed from it. For this reason it is called the chair of pestilence, because it is a corruption that produces death, just as iniquity produces condemnation. Therefore that chair which is the chair of death is not from God. For Moses received the chair of life. It was given for this purpose, that in it there might be the authority of the just judge or of the creator God. Therefore the Lord says, “The Scribes and Pharisees sit on Moses’ chair” (Matt. 23:2); and the Apostle, “There is,” he says, “no power except from God; and those that exist are ordained by God” (Rom. 13:1). Therefore he says to the leader of the people: “You indeed sit judging according to the Law, and against the Law you order me to be struck” (Acts 23:3). When he said “according to the Law,” he indicated the just and saving authority of the chair. But in that he said “against the Law you order me to be struck,” he showed that very judge to be unjust, so that, sitting in God’s chair, he judged unjustly. Therefore also Daniel says, “The kingdom is God’s, and he will give it to whom he will” (Dan. 4:14). For just as the authority of an earthly emperor runs therefore through all, so that in all there is reverence for him, so God has ordained that from the king the authority of God should begin and run through all: although the world often does not understand this, and subjects itself to others placed in power than it ought, still the ordinance is that there should be one who is feared. Where, then, this ordinance is not, there the chair of pestilence is found. Nowhere is the authority of the one God denied except among those who proclaim fear and reverence of many gods. These, then, are those who sit in the chair of pestilence, because what their priests proclaim is death. For they deem it necessary that worshippers of the one God, as fools and enemies, should either be held up to reproach or removed from this life. This is the very material of wickedness, which also extends into other areas, through which it may display the laws of its own wickedness. For at Jezebel’s command the priests of iniquity sat in the chair of pestilence, who, against the innocent Naboth, though they were not judges, plotting stubbornness, with false witnesses corrupted, pronounced a sentence of death (1 Kings 21:11–13). Therefore also in another Psalm he says, “I will not sit with the wicked” (Ps. 25:5). For this is the judgment of him whose also is the chair of pestilence. Therefore, if, while sitting in God’s chair, they oppress the innocent, the judgment will be unjust, not the chair. For where the chair of pestilence is, the judgment cannot be other than iniquitous, even though they may attach to themselves certain coverings, as it were, by which they cloak their wickedness so that those who see are deceived. For sheer wickedness cannot be put forth by itself, because it finds no buyer; and where the law of the Devil is, if he himself is named, he is shuddered at. But as honey is mixed with poison that it may lie hidden, so too they mix certain just things into the law of the Devil, and apply to it the name of truth; yet each person’s understanding must be judged, because sometimes it shows something true in order to deceive, so that when it proclaims evil things they may be thought good. Since we have asserted that the chair of pestilence is not from the ordering of God, we also call the chair of pestilence that of those who, outside the Church or against the Church, have set up chairs for themselves. For whoever presumes what is not granted is guilty; how much more if he also corrupts the tradition of him whose seat he takes? For they disturb the order begun by the Apostle Peter and preserved up to this time through the succession of bishops in an unbroken line, claiming for themselves an order without an origin, that is, professing a body without a head; therefore it is fitting to call their seat also the chair of pestilence. Nor will it be without punishment merely because they do this under the name of God. For it is clear that they conduct their own causes under the name of God. They do not do this out of zeal for God, but wishing to defend a place for themselves. Though we know that Korah and the two hundred and fifty men, who by presumption made offerings to God, were swallowed up by the opening of the earth (Num. 16:31, 35), and that King Uzziah, when he made an unlawful offering to God, was struck with leprosy on his forehead (2 Kings 15:5 and 2 Chron. 26:21). Since it has become clear that the chair of pestilence belongs to the wickedness mentioned above, let us pursue what follows. For he added: “But his will was in the law of the Lord.” (Ps. 1:2a) He says that his will is in the law of the Lord who, despising the wicked and abandoning sinners, refusing the chair of pestilence, has fixed his will in the law of God. Therefore he called this man blessed. And it continues: “And in his law he will meditate day and night.” (Ps.1:2b) It is clear that such a man, free from all allurements and untouched by those things that are opposed to the law of God, occupies himself with nothing else than the law of God; strengthened by the sacraments of the Son of God, by day he persists in good works, and by night in prayers. For this is he of whom it is said in the Song of Songs that he sleeps and his heart keeps watch (Cant. 5:2). Therefore he says: And he shall be like a tree that is planted beside streams of water. (Ps. 1:3a) Who doubts that one who meditates on the law of God has hope of receiving the reward? For just as a tree planted beside water cannot be barren, so one who diligently studies the law of God by frequent use cannot fail to obtain the effect of his work. And he added: Which will yield its fruit in due season. (Ps. 1:3b) Every plantation that is well tended gives fruit at the proper time; so too the one who obeys the law of God will have fruit at the appointed time. For then he will receive the reward of this devotion, when the Lord Jesus Christ begins to sit in judgment of the living and the dead. Then he subjoined: And its leaf shall not fall. (Ps. 1:3c) It is clear that in a tree whose leaves do not fall, he has signified life. For a tree nourished by the moisture of running water keeps its leaves. And the Lord Jesus also says: If they do these things in the green wood, what will happen in the dry? (Luke 23:31). In the green wood he signified life and fruit. Therefore, just as a tree with the help of running water does not feel dryness, so the one who studies the law of God, when temptation approaches, remains safe by the protection of God and does not lose but gains salvation, as the Apostle says: Through many tribulations we must enter the kingdom of God (Acts 14:21). And it continues: And all that he does shall prosper. (Ps. 1:3d) It is clear what he says, that one who keeps faith with the law of God, eager for his commandments, becomes happy in all his deeds, just like Joseph, who, because he placed the fear of God before this present life, God made all that he did prosper in his hands. And he added: Not so the wicked, not so. (Ps. 1:4a) The repetition of the phrase signifies that it will in no way turn out differently from what he promises, because nothing will be prosperous for the wicked in the future, but all things adverse, even to their destruction. Therefore he says: But like dust which the wind drives away from the face of the earth. (Ps. 1:4b) In the same way he says that the wicked perish like dust which the wind blows away from the face of the earth so that it may vanish. Once lifted away from its own substance, scattered through the air, it gradually disappears; so too the wicked, cast out by the ministering angels from the presence of God their author, without whom one cannot live, will perish. And it continues: Therefore the wicked shall not rise in the judgment. (Ps. 1:5a) What he says is fitting. For why should those rise in the judgment who chose to believe that no business of God was entrusted to them for which they would have to render an account? Since they spurned and denied the law of God, there is nothing from which they might produce an account, so as, when questioned in the judgment according to the law entrusted to them, to present their case. Therefore, found to be arrogant and rebellious against God, they rise only to see that what they refused to believe is true, so that they may perish, because they judged God to be a liar. And he added: Nor sinners in the council of the righteous. (Ps.1:5b) In this psalm the Psalmist denotes three kinds of men: the wicked, sinners, and the just, in the order in which the error began. But the wicked are strangers to these, because, as I said, they refused to live under the decree of God. Sinners, however, who act under the law of God, are to stand before the tribunal of Christ, separated from the righteous, so that they may render an account of the commandments of the law they received, in which they did not labor, so that they may have more praise than blame. The righteous, however, found to be very zealous in the exercise of fulfilling the law, are to be rewarded. And he added: For the Lord knows the way of the righteous. (Ps.1:6a) God is said to know these who, mindful of his precepts, persist in good works so that, counted as righteous, they may be crowned. But to those who, forgetful of him, are negligent about the care of their soul, he will say: Depart from me; I do not know you, workers of iniquity (Luke 13:27). And it continues: And the way of the wicked shall perish. (Ps.1:6b) Therefore the psalm is begun and ended so that, when the case of the wicked is treated, they may be shown to be accountable to nothing other than destruction. For, as I have said, God is therefore said to know the way of the righteous because they walk in his law; but the way of the wicked, because it is outside the law of God, shall perish. For all the ways of the wicked are dark (Prov. 4:19), as Solomon says, but those of the virtuous are very bright, with Christ our Lord as their guide.
'''
