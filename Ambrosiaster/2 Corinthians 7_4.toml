[[commentary]]
quote='''
Great is my confidence toward you, great is my boasting about you: I am filled with consolation, I overflow with joy in all our affliction. This confidence comes from the rebuke of the first letter: because they did not receive it harshly, they gave him confidence to admonish them; for they appeared willing to correct themselves, and that is why he boasts. On their account he declares that his own mind too has been consoled in this respect, so much so that he solemnly affirms that he overflows with joy in all affliction; for seeing that there is hope in those for whom he suffers hardships, he rejoices when he is afflicted, certain that he will receive from God a reward for the salvation won in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
