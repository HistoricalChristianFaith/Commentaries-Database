[[commentary]]
quote='''
Wherefore I ask that you do not lose heart in my tribulations for you, which are for your glory. Having made manifest the hope which is in the mystery of Christ, he admonishes them not to take offense because of the tribulations which are inflicted on the saints by the faithless. For it pertains to their glory if the disciples have not been offended at the tribulation of their teacher, being made firm by this hope: that the afflictions of the faithful will be raised up by the glory of the age to come; for this is the proving of the faithful, if they keep their minds on the hope of their faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
