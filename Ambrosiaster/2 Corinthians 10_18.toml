[[commentary]]
quote='''
For it is not he who commends himself that is approved, but he whom the Lord commends. It is true that the Lord commends him, and he is approved, whom he holds worthy and sends to preach his gift; but him whom he does not send, he does not commend. And he commends himself who preaches without being sent; and therefore he is not fit, but presumptuous and reprobate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
