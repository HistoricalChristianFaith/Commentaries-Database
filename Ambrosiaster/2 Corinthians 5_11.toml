[[commentary]]
quote='''
Knowing therefore the fear of the Lord, we persuade men; but we are manifest to God. Since, then, the judgment of God is to come through Christ to distinguish the works of each person, therefore the Apostle says that he persuades men toward a good mind and life, so that his hearers may be secure from the punishment to come, and he himself may boast, having in them the fruit of his labors; because through the perverse talk of some, the day of God's judgment is brought into doubt: For evil conversations corrupt good morals (1 Cor. 15:33). We persuade men, he says, so that they may believe and take forethought, lest they incur it and repent then, when repentance has no fruit. But we are manifest to God; for he preached what God had commanded, and God is said to know what is good. Lastly, to those who do evil he says, I do not know you. But I hope that we are manifest also in your consciences (Matt. 25:12). Their purity was manifest to the Corinthians, because they had neither ever been caught in flattery, nor had their preaching displeased the saints, nor had they tried to draw anything secretly from any of them, as is usually done, so as to be simple outwardly before the crowds but impostors within. Therefore he appeals to their conscience, so that they themselves might be witnesses for themselves to the apostles' truthfulness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
