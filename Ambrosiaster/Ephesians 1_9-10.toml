[[commentary]]
quote='''
That he might make known to us the mystery of his will, according to his good pleasure, which he purposed in him, in the dispensation of the fullness of times, restoring all things in Christ, which are in the heavens and which are on earth. This pleased God, whose counsel cannot be revoked: to show in Christ the mystery of his will at the time when he willed it to be revealed for the knowledge of creation. And his will was this: that he should then become propitious to all who were in error, whether in the heavens or on earth, when he made Christ manifest as this gift of believers, that sins should not be imputed to those who receive the faith of Christ. Every creature, then, in the heavens and on earth, while it learns the knowledge of Christ, is restored to that for which it was founded. For when it is instructed in the faith of the one God, having known the mystery of the Savior, it is restored from the error into which it had begun to fall, holding for certain that its Creator is the one God and Lord. Hence it is that John too says in the Apocalypse: I saw Michael and his Angels fighting in heaven with the dragon and with his army (Rev. 12:7). This conflict comes partly from error, partly from the presumption of a usurped tyranny.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
