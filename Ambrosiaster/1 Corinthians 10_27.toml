[[commentary]]
quote='''
If any of the unbelievers invites you to dinner, and you go; eat everything that is set before you, inquiring into nothing. That is, eat simply what is set before you, not asking where it comes from.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
