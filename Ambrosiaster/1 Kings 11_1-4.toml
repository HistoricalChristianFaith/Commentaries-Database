[[commentary]]
quote='''
WHY DID SOLOMON HAVE THE SPIRIT OF WISDOM (1 Kings 3), WHEN HE DID NOT HAVE A PURE LIFE? FOR HE TOOK GREAT DELIGHT IN WOMEN, AND BY THIS HE SINNED (ibid. 11). — At first Solomon received the spirit of wisdom by his own merit; but later, when he began to make excessive use of women and thereby to sin, if he had the spirit of wisdom, he had it by reason of his royal office, just as Nebuchadnezzar, by reason of his royal office, saw Christ in the furnace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 18: ON SOLOMON'S WISDOM AND HIS SIN"
