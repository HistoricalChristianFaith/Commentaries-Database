[[commentary]]
quote='''
All these the Father has, and likewise the Son from the Father: but the inaccessible light is the Father's alone, because he has never appeared to anyone. Thus he added: Whom no man has seen nor can see. Not because the light of the Son is another, since it is written in the psalm: And in your light we shall see light. (Ps. 35:10), that is, that the light of the Father is in the Son: but because no one has seen the Father, and for this reason he dwells in light inaccessible. For it belongs to no one's order to see God the Father, except to Christ: he who is from God, he has seen God: but the Son, because he himself does all things, is said both to appear and to be seen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
