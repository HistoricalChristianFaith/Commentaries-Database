[[commentary]]
quote='''
But our seemly parts need nothing. It is plain that the head does not need, nor the face, nor the hands, that something be added to them by which they may be adorned: so also for the brethren in whom zeal for learning and seemliness of manner of life flourish, there is nothing that is added by us; for the honor due to them is rendered to them. But for the despised or lowly, exhortation is necessary, through which some honor may be added to them, so that they may become useful: otherwise, through that very contempt they will become more negligent about themselves, though it is in them that greater progress must be made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
