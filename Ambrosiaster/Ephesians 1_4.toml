[[commentary]]
quote='''
Even as he chose us in him before the foundation of the world, that we should be holy and spotless before him in love. God, foreknowing all things, knows who would believe in Christ, as he says to the Romans: Whom he foreknew, he also called us (Rom. 8:29): not only from the Jews but also from the Gentiles. Those, then, whom God is said to call persevere in faith: these are the ones whom he chose in Christ before the world, that they may be undefiled before God in love, that is, that the love of God may make their way of life holy. For no one obeys another better than he who complies out of love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
