[[commentary]]
quote='''
Now he who supplies seed to the sower will also supply bread to eat, and will multiply your seed, and will increase the fruit of your justice; that you may be enriched in all things in all simplicity. All things are God's, and both seeds and the things that spring up grow by God's bidding and are multiplied for the uses of men: God, then, who gives these things, himself also commands that a share of them be given to those who are in need; and therefore he who gives according to God's will cannot fail to be increased by God's bidding with increments of this kind, to increase the fruit of justice; for he adds to the giver, so that he may have the more from which he can give generously. This is justice: that because God gives, man too should give back out of it to him who lacks. For he wants these to be ministers of those who, choosing better things, spurn the riches of the present time, binding themselves wholly to the things of God. For God grants help to each one according to his good will; for the saints, who wish to possess nothing here except to have food and clothing, God has appointed those who wish to have these things to be their guardians, so that he who has ministered to them well and with simplicity may be increased by God's bidding, so that he may always have something from which to give generously, being enriched both for the present and for the future. For sowing once, he will reap twice; so that, if he has regard for future hopes, he will not wish to have them subject to himself, but will rather bow himself to them, because he will receive the reward for this from God. For if he wishes them to be humbled before him in the present, he loses the hope of the future; for he receives the reward of his work here, not doing this with simplicity, as the Lord says: Amen I say to you, they have received their reward (Matt. 6:16).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
