[[commentary]]
quote='''
Therefore while we have time, let us work good toward all. The Gentiles have time for working evil; for men without God, how can they work good? But those who have become Christians have time for working good toward all men, so that, after faith has been received, good work may avail for the promised reward. For time is granted to life for this reason, that we may now conduct ourselves righteously, giving an example to the Gentiles. But especially toward those of the household of faith. It is true that we ought to be readier and more inclined to good toward the brothers, because we are members of one another. This thing, then, which is profitable, is what must be served; not circumcision, a thing now empty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
