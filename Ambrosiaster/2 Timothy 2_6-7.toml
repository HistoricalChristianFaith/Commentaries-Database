[[commentary]]
quote='''
The labouring farmer ought to be the first to receive of the fruits. Understand what I say; for the Lord will give you understanding in all things. Timothy was a saint of such abstinence that he restrained himself even from lawful things; for this is what he wants to be understood: that he abstained from a share in the treasury, though the Lord decreed this, that those who proclaim the Gospel should live by the Gospel (1 Cor. 9:14). Therefore the Apostle instructs him, since he is the first, to take first, and so to distribute to the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
