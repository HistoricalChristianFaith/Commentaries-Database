[[commentary]]
quote='''
He says, then, that he is in nothing confounded in the teaching of Christ; both because the hope of the promise is great, and because there is nothing in it base, dishonorable or deceitful, as among the pagans, but open simplicity. For hence it is that with all constancy he does not yield to adversities, so that Christ may be magnified in his body, whether he is killed, or escapes after being beaten. For from this is seen what and how great a hope there is in Christ, when he is ready not only to be beaten and afflicted for him, but even to die.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
