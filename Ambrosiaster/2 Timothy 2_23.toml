[[commentary]]
quote='''
But avoid foolish and unlearned questions, knowing that they breed quarrels. Senseless questions belong partly to unbelievers, partly to heretics: on the side of the unbelievers, they are those which drive modest men to quarrelling; for they are changed by the excessive contradiction of their impiety, and in anger say something against their overseer. For some of the heretics are wont to feign patience (although they cannot bear to hear anything harsh from a catholic), in order to commend their perverse discourses; therefore one must pay them no heed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
