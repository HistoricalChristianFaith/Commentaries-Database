[[commentary]]
quote='''
Who ever serves as a soldier at his own wages? Who plants a vineyard and does not eat of its fruit? Who feeds a flock of sheep and does not receive of their milk? Do I say these things according to man? That is, do I follow a human opinion? Does not the Law also say the same? He has taught that the testimonies mentioned above agree with the divine teachings, to show that it is surely not without reason that he is unwilling to accept provisions from them, since by so many examples he shows that one ought both to give and to receive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
