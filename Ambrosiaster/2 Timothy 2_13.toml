[[commentary]]
quote='''
If we do not believe, he remains faithful; he cannot deny himself. No one can take away from the Lord what he has. For who is stronger than he, through whom all things came into being? Nor can anything be added to one who is perfect; for he who believes him confers nothing on him, just as he who does not believe in him takes nothing from him. Whatever, then, is done concerns our own profit, so that we may not remain in ignorance. For he is not made firm by us, since he is firm of himself and in himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
