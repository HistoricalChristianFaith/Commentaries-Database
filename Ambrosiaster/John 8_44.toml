[[commentary]]
quote='''
You have heard what the most holy Gospel declares, when the Lord says to the Jews: “You are born of your father the Devil, and you wish to do the desires of your father. He was a murderer from the beginning, and did not stand in the truth, because there is no truth in him. When he speaks lies, he speaks from what is his own, because he is a liar, as is his father” (Jn. 8:44). Let none of the faithful doubt that the Devil has no author of his apostasy. For he himself is the prince of all error: seeing that he was made by God of no mediocre power, he dared to imagine divinity, so that, because he saw the others beneath him, he set himself above them as a god. In fact, the names by which he is called, “Devil” and “Satan,” are formed from his deeds, not from his nature. For all evil is proved by work, so that guilt lies not in substance, but in the will conceived from causes. For when he saw himself more powerful than the rest, he swelled with pride to exercise dominion. How then is he said to have a father, when he himself is held to be the author of his wickedness? Or how is it proved that he was a murderer from the beginning? But Scripture calls the one who is his imitator by his name, so that, because he received his name from his deed, anyone who has done an evil deed is not unjustly called “devil.” Therefore the Savior in this passage called Cain “devil,” because, as a rival of his works, when he envied his brother he committed murder, leaving an example of the cruelty of murder. So too the Devil, when he envied man who was made in the image of God, he increased the wickedness of his work, presenting a pattern of error. Therefore Cain also proved to be a liar, when God said to him, “Where is Abel your brother?” Imbued with his father’s hatred, bursting out into falsehood, he said, “I do not know” (Gen. 4:9); so that, having torn away his brother’s life, he pretended not to know where he was; therefore blinded by fury, that he answered God as though He were a man whom he thought he could deceive. The Jews, therefore, having become imitators of this sort of behavior, killed even the Lord Himself, choosing to have Cain the murderer rather than God as their father, so that they might become guilty of all the blood that was shed. By killing the Author of life, they proved themselves princes of all wickedness, to such an extent that they bound even their own children to this evil, saying, “His blood be upon us and upon our children” (Matt. 27:25). For, in order to persuade Pilate that what they asked for was not evil, they said that, if it was unjust, it should be turned upon their children: because, in order to satisfy their fury, they did not even wish to spare their own children. Now, because the Devil is not evil by nature, this is more easily stated, since punishment would not be promised to him if he had not done what he did not know. For it is unjust to punish someone who does nothing other than what belongs to his nature. And this is more truly evil, if you demand from someone what you know he cannot do. Therefore, he is justly to be punished, who, though it is clear that he knows and is able to do good, does evil. This can also be observed from the words of the Savior: for He says, as mentioned above, “Your father was a murderer from the beginning, and did not stand in the truth.” (Jn. 8:44) Therefore, if he is a liar by nature, how is he said not to have stood in the truth? For he does not stand in the truth who does not remain in the truth. It is therefore clear that the Devil was in the truth, but did not persevere in it. Indeed we read in the prophet the Lord speaking therefore: “If they had stood,” He says, “in my substance” (Jer. 23:22), that is, in my law. And the Apostle to the Galatians says, “Stand firm, and do not again be held under the yoke of slavery” (Gal. 5:1). What could be clearer? For here He commands that from now they remain in His commandments. If the Devil had kept them, he would have stood in the substance and in the law of God. For the law is a foundation for those who keep it. How then does it seem to some that the Devil was either made evil by God, or has his own origin, that is, arose from nothing, since both views appear contrary to God? For whoever says that he was made for this purpose, that he might be evil, thinks that God is imperfectly good; since one who is perfectly good does not create evil. But whoever does not believe that God is the author of his origin denies His dominion. For by this, since all things are God’s, he thinks that there is something which in no way belongs to God. Such people ought to suffer punishment, when they see everything judged by God through Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 98: ON THE GOSPEL OF SAINT JOHN"

[[commentary]]
quote='''
If the Devil himself is Satan, how is it that among other things the Savior says to the Jews: “You are of your father the Devil, and you wish to do the desires of your father. He was a murderer from the beginning, and did not stand in the truth, because there is no truth in him. When he speaks a lie, he speaks from what is his own; for he is a liar, as is his father” (John 8:44)? — “Devil” is not a proper name, but a common one shared with others. For in whomever the works of the Devil are found, without doubt that person must be called a devil. It is the name of a work, not of a nature. And so in this passage he means Cain as the father of the Jews; since the Jews, wanting to be his imitators, put the Savior to death. Therefore he says that Cain, because he stained himself with murder and made himself guilty of death, did not stand in the truth. For from him the pattern of brotherly murder was first given. It is this same man of whom he says, “When he speaks a lie, he speaks from what is his own,” (Jn. 8:44) to show that each one sins only by his own will. But because he is an imitator of the Devil, he added, “For he is a liar, as is his father.” For when this Devil, in order to condemn the first man to death, did so, he pretended not to know what had been commanded him by God. So too Cain, when questioned, faked ignorance of where his brother Abel was, whom he had killed (Gen. 4:9). Therefore in this passage he called Cain the devil; and his father, the devil whose works he followed. For the son of a devil is a devil. But that Devil who is Satan has no father in his wickedness. He is his own author in evil. He himself sinned first, and therefore whoever imitates him will be called his children, and he their father. Indeed, in faith we have Abraham as our father, because he first believed God; and for this reason we are designated by his name. For we are called faithful, as he is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 90: IF THE DEVIL IS SATAN, WHY DOES CHRIST SAY THE JEWS HAVE THE DEVIL AS FATHER?"

[[commentary]]
quote='''
Certainly, each person is either a son of God or of the Devil: he is therefore always a son, but sometimes of God, and at other times of the Devil. What then we are born as must be inquired. — When the Lord, after bringing the sons of Israel out of Egypt, saw that they often sinned, He grew angry and pronounced a sentence, saying that none of them would enter the promised land except Caleb and Joshua son of Nun, who was previously called Auses. But as for those who had been born in the desert, He declared that they would enter, because they did not know good or evil. Now not to know good or evil is a certain natural simplicity, which has not yet been trained for evil. This is ignorance without hatred. For we are born without understanding, but our nature has this good, that it is capable of learning the truth. A son of the Devil, however, is one who, being born and steeped in evil things, devotes himself to those things that are hostile to the Creator, affirming that there are many gods and that sacrifices must be offered to them as if they were rulers of the world. If such a one comes to his senses and thinks in accordance with his nature, turning himself to the Creator, he will be a son of God. And therefore those who are born are neither sons of God nor sons of the Devil. For what does the Savior say to the Jews? “You are of your father the Devil, and you wish to do the desires of your father” (Jn. 8:44). You see then that by their works and their profession people are made sons of the Devil; but those are sons of God who, confessing that the Father of Christ is their own God, live rightly. For God has so ordered our race that we are born without understanding, yet have the capacity to learn either good or evil, so that we ourselves may acquire either evil or good: that we may rejoice in ourselves when, acting rightly, we are rewarded; or that we may blame ourselves if, following wicked ways, we are condemned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 80: WHETHER WE ARE BORN SONS OF GOD OR OF THE DEVIL"

[[commentary]]
quote='''
Certainly, whoever is not a son of God is of the Devil: therefore he is always a son, but sometimes of God, sometimes of the Devil. What then are we born as? — When the Lord, after bringing the sons of Israel out of Egypt, saw that they often sinned, being angered, He did not allow any of them to enter the promised land, except Caleb and Joshua son of Nun. But He said that their sons, who had been born in the desert, would enter, because they did not know good or evil. Now not to know good or evil is a certain natural simplicity, which has been trained neither to good nor to evil; that is, ignorance without hatred. For we are born without understanding, but our nature is capable of learning the truth. A son of the Devil, however, is one who, born and instilled with evil things, applies himself to what is opposed to the Creator, saying that there are many gods and that sacrifices must be offered to them as if they were rulers of the world. If such a one comes to his senses, returning to his natural righteousness and receiving faith in Christ, he will be a son of God; and therefore those who are born are neither sons of God nor of the Devil. For what does the Savior say to the Jews? “You were born of your father the Devil, and you wish to do the desires of your father.” (Jn. 8:44) You see then that by their works and profession sons of the Devil are brought forth. For God has so ordered our race that, though born without understanding, we can nonetheless be trained in either direction, so that whether to good or to evil we are in some way our own authors: that we may rejoice in ourselves when, acting rightly, we are rewarded; or blame ourselves if, following evil ways, we are subjected to punishments. For this reason He left us to our own judgment, so that we may neither complain about our evils, nor, in vain, as if sons of God by faith, boast of ourselves if we are crowned. God, the creator and author of our being, wished us to have something that is properly our own, so that we might not be ashamed to glory in the faith which we have in God. For whatever a person does not have by his own power is unfamiliar to him, so that he can neither glory in good things nor be held guilty for evil ones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 41: WHETHER WE ARE BORN SONS OF GOD OR OF THE DEVIL"
