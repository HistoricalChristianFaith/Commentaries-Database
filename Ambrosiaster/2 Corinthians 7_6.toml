[[commentary]]
quote='''
But God, who consoles the lowly, consoled us by the coming of Titus. Since God is not unmindful of his own, but always gives them comfort in tribulation, he hastened the coming of Titus, to be a refreshment to those placed in the heat. For it is a great consolation to one who suffers if he has with him someone who suffers with him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
