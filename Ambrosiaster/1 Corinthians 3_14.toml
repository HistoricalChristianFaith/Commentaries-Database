[[commentary]]
quote='''
If anyone's work which he has built upon remains, he will receive a wage. For when nothing of the filth of depraved doctrine has been found in him, as in good gold, it will be with him as with the three brothers in the furnace of fire (Dan. 3:23): he will receive as his wage eternal life with glory; for just as gold and silver and stones are not consumed by fire, so too the good teacher will remain incorruptible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
