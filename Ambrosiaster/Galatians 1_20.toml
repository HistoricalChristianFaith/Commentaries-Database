[[commentary]]
quote='''
But what I write to you, behold, before God, I do not lie. Being about to speak of what pertains to his commendation, he gives God as witness that the things he is about to say are so, lest perhaps it should seem made up; since it does not befit his person to feign anything. But when he commends himself, he wishes these men to profit; for this commendation profits them, so that they may know that the things said by him are most true.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
