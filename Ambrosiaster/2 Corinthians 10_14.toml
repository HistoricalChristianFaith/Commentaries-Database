[[commentary]]
quote='''
For we are not overextending ourselves as though we did not reach as far as you: that is, we are not overextending ourselves in preaching as though we had not come as far as you, but, being appointed, with God sending us, we came to you. Now to overextend oneself is to be extended further than is granted, but not further; because God has given a measure which his evangelists were to keep, and this he testifies that he guards. For he shows this so that they may know that he was directed to them by God; and therefore that they ought to obey his admonitions, lest by despising them they should seem to resist God, by whom he was sent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
