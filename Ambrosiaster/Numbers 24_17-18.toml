[[commentary]]
quote='''
BY WHAT REASONING DID THE CHALDEAN MAGI UNDERSTAND, THROUGH THE STAR THAT APPEARED, THAT CHRIST, THE KING OF THE JEWS, HAD BEEN BORN, SINCE A TEMPORAL KING IS INDICATED BY A STAR AS A SIGN? (Matt. 2:1–2)? — These Chaldean Magi did not out of malevolence, etc. “A star shall rise out of Jacob, and a man shall arise from Israel, and he shall crush the leaders of Moab, and shall despoil all the sons of Seth, and Edom shall be his inheritance,” etc.  (Num. 24:17-18) This, then, is the prophecy of Balaam, not because he was a prophet, but because God pleaded the cause of His people through him, not as a willing but as an unwilling instrument: just as those sent by Saul to seize David are found to have prophesied, and as Saul himself, when it was said, “Is Saul also among the prophets?” (1 Kings 19:20–24). For by this God wished to show how great is the majesty of the God of the Jews, who, when Balaam had come to curse, turned him so that it seemed good to him to bless the people of God. For the Lord could not fear his curse, whose heart He held in His power. It is therefore understood that this prophet revealed this to his associates, who, being inquisitive about the stars, when they saw an unknown star shining with excessive brightness, so that it surpassed the sun in light (for it was seen even by day), comparing notes among themselves, realized that this was the star which Balaam had said would one day appear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 39: ON THE STAR OF THE MAGI"
