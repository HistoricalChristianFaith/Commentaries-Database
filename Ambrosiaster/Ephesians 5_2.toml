[[commentary]]
quote='''
And walk in love, as Christ loved us, and delivered himself up for us as a victim and an offering to God for an odor of sweetness. Just as he wants us to be imitators of God the Father in kindness and mercy, so also of Christ his Son in love; so that, as he loved us, delivering himself up for us, so we too ought to lay down even our lives for one another. This the apostle John also said: that after the Lord's example we must lay down our lives for the brethren (1 John 3:16). If, then, the death of Christ is to God for an odor of sweetness, God accepted his death gladly. And if this is true, those who crucified him according to the will of God did not sin. But it is not so; for Christ is said to have offered himself to God in that he suffered himself to be killed, persevering in the will of God his Father; for whoever is justly put to death, offering himself to the devil, does his will, so as to deserve to be killed. So too Christ, while he cleaved to the will of God, displeased the devil, and the devil killed him for this reason, because he had offered himself to God by carrying out righteousness. For in the offering righteousness and truth are signified; for it is this that God regards, and this is his acceptable sacrifice. Therefore he who is killed undeservedly pleases God; not because he is killed, but because he preserved righteousness even unto death. For Christ undertook this death for the sake of life; hence it is also called an odor of sweetness to God. Yet to the Romans he says that God delivered him up for us all (Rom. 8:32). Now we must ask how God delivered him up, or how he offered himself to God; for as far as the words go, this seems contradictory. God is said to have delivered him up in that he permitted him to be killed, as the Lord says to Pilate: You would have no power against me, unless it had been given you from above (John 19:11). For power was given him, but to one who was willing; that is, he was permitted to do what he wished, and this is to deliver up: for in letting it pass he delivers up; for if he had been unwilling to permit it, he would not have been killed. He permitted him, then, to be killed, but by those who wished to kill him not under compulsion but of their own accord. They are not therefore exempt from punishment because what they wished was permitted them; for condemnation falls on them on this count, that they willed it. Yet God permitted this for this reason: because he knew that this man would stand against the devil on behalf of many. For it was fitting that the enemy, having no foreknowledge of things to come, should be permitted to do what was against himself while he thought he was doing it as if for himself; so that, charging his lack of foreknowledge to himself, he might be tormented with repentance for his deed. But that Christ offered himself, or that God delivered him up, is one and the same; for the will of both is one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
