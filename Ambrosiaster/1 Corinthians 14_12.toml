[[commentary]]
quote='''
So you also, since you are zealous for spirits, seek, for the edification of the Church, that you may prophesy. Because it is profitable to explain the Scriptures (for the mind is stirred and rejoices when it gathers something from the Scriptures; and the more inclined it becomes in this direction, the more it forsakes vices), therefore he advises that zeal should be applied to this part.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
