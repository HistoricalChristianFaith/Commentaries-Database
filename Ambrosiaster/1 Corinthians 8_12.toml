[[commentary]]
quote='''
But sinning thus against the brethren, and striking their weak conscience, you sin in Christ. For when they are not emulators of the love by which Christ set us free, they sin in Christ, not against Christ; for to sin against Christ is to deny Christ, but to sin in Christ is to sin against the things that are Christ's. Just as he also who is under the Law is said to sin in the Law, so too those who are under Christ are said to sin in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
