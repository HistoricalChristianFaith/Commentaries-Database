[[commentary]]
quote='''
For the building up of the body of Christ. He says that the ordering of the Church is composed after the fitting-together of the human body, in the unity of profession; so that, though diverse in dignity, all may be one in Christ, having one head, Christ, that is, the author of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
