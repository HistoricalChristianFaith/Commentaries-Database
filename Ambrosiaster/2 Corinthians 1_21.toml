[[commentary]]
quote='''
But he who confirms us with you is Christ the Lord; and he who anointed us is God: who also sealed us, and gave the pledge, the Spirit, in our hearts. He says that Christ confirms the Gentiles in the faith promised to the Jews; because he it is who made both one (Eph. 2:14), that is, circumcision and uncircumcision, making peace in one new man. The Lord, therefore, confirms, and God, who anointed us, that is, who gave us royal honor, as the apostle Peter says: For we are, he says (1 Pet. 2:9), a royal race through a spiritual anointing, the type of which was in the kings of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
