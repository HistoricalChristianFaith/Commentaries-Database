[[commentary]]
quote='''
I have fought the good contest, I have finished the course, I have kept the faith. As for what remains, there is laid up for me the crown of righteousness, which the Lord, the just judge, will render to me on that day; and not to me only, but also to those who love his coming. He recalls that he has kept all the things that were useful and prosperous for himself and for others; for not only in words but also in works did he present himself as a pattern to his hearers; so that he might both stand forth as a faithful steward to his author by the truth of his preaching, and, having wrestled against the princes and powers of the world with all care and skill, might leave an example of how they were to be overcome; so that inviolate teaching and the lawful contest of the struggle might make them worthy to be crowned; because God, the just judge, will give the most ample rewards to those who love him and await his Son from heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
