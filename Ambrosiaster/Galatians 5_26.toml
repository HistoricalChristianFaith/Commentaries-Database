[[commentary]]
quote='''
But empty glory is wanting to win where there is no prize, so that one devotes himself to contention and zeal, knowing that these breed discords and quarrels: But the servant of the Lord, he says, must not quarrel (2 Tim. 2:24). For it makes the fruits of a good life dry, losing the promised hope of a chaste way of life: for a good and chaste life must be adorned with morals and enriched with benevolence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
