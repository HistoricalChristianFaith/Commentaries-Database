[[commentary]]
quote='''
Grace to you and peace from God our Father, and the Lord Jesus Christ. Lest, because he had said: Who call upon the name of our Lord Jesus Christ, he should seem to have passed over in silence either the name or the gift of the Father, and perhaps give rise to suspicion of a union, or occasion for it, he teaches indeed that Christ is rightly to be invoked, but that all grace is the Father's; so that he might both show the two, who are one through the divinity, and give precedence to the authority of the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
