[[commentary]]
quote='''
What is it then? I will pray with the spirit, I will pray with the mind also; I will sing a psalm with the spirit, I will sing a psalm with the mind also. He says this: that when someone speaks in a tongue which he knows, he prays as much with the spirit as with the mind; because not only does his spirit, which I said is given in baptism, know what is being prayed, but the soul also, in like manner, is not ignorant of the psalm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
