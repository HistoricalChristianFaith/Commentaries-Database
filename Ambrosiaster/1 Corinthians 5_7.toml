[[commentary]]
quote='''
It should be asked whether Pascha is to be interpreted as “passage,” as it appears to the Greeks. — The Apostle could not have been mistaken when he says, “Christ our Pascha has been sacrificed” (1 Cor. 5:7). This is not, of course, his own expression, but a word of the Law, as Moses says: “And it shall be, when your sons say to you, ‘What is this service?’ you shall say, ‘This sacrifice is the Pascha of the Lord’” (Exod. 12:26–27). What more is needed as evidence? The law speaks; the Apostle proves it this remains, that the objector be cast out as stubborn. For it is plain that the passage took place after Pascha. For of the blood of the sacrificed lamb they placed it upon the doorposts and upon the threshold, so that when the angel passed by at night he would not strike the house in which the sign of blood was found. Therefore it was the blood that brought salvation, not the passage; because in order that the passage should not harm, the blood stood in the way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 96: WHETHER PASCHA MEANS “PASSAGE”"

[[commentary]]
quote='''
Purge out the old leaven, that you may be a new dough. This is to be taken in two ways, because leaven is also human teaching, as the Savior says: Beware of the leaven of the Pharisees (Matt. 16:11), that is, of their teaching. It was said, then, both for guarding against bad teaching and for this case, because when the fornicator is cast out, the old leaven is cast out. And it is old because it is the sin of ancient error. The new compound, however, is the teaching of Christ.

As you are unleavened. Unleavened bread was so called from the unleavened flour, when the sons of Israel were driven out of Egypt; so that leaven was held to be oldness, and unleavened bread newness. For having cast away the old errors of the Egyptians, they were led into a new law; so too the Corinthians, after the errors of the pagans, were led into the Gospel of Christ. He exhorts them, then, to live also according to their profession, which they had received from the Apostle under the name of Christ, being now cultivators of a new life: and this is to be unleavened.

Christ our Pasch has been sacrificed. According to the Law he teaches that newness consists in the rationale of the Pasch, and that Christ was slain for this reason, that the new preaching that comes from him might produce a new way of life; so that, since we observe the rationale of the Pasch, we may not follow the old life. The Pasch, then, is a sacrifice (immolatio), not a passing-over (transitus), as it seems to some; for first comes the Pasch, and then the passing-over, because first there is the pattern of the Savior, and then the sign of salvation. For there is no sign before the cross; for when the lamb had been slain in the evening, the sons of Israel kept the Pasch in Egypt, and with its blood they marked the doorposts, so that the Angel, passing over by night, might not touch those places which had been smeared with the blood of the lamb (Exod. 12:28).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
