[[commentary]]
quote='''
If indeed you persevere in the faith, grounded, steadfast and unmoved from the hope of the Gospel which you heard, which has been preached in all the creation that is under heaven. Of which I Paul was made a minister, who now rejoice in my sufferings for you, and fill up what remains of the afflictions of Christ in my flesh for his body, which is the Church. He declares that he exults in the tribulations which he was suffering, because he sees his own advancement in the faith of believers. For tribulation is not in vain when it gains for life the one for whom he suffers. These sufferings he says are inflicted on Christ, whose teaching, indeed, they persecute; so as both to weigh down the faithless with the belief of their impiety, and to proclaim to the faithful the love of God, whose Son even now suffers injuries for us. Now, therefore, he wants it understood for what reason he writes to them, when he says: If however you persevere, grounded in the faith; so that they might know that the passion of Christ profits them then, if they remain in the faith they have received. For this is why he declared from the beginning how great and how infinite the omnipotence of Christ's greatness is: to teach that hope must be placed in him alone; because all things are his, and because nothing can live without him, neither in heaven nor on earth. For he is before all, and all things hold together in him, because he himself holds the primacy in all things; so that if anyone thinks that he ought to be devoted to any of the elements or of the angels, or of the Powers, he may know that he errs. For this is the one Son of God, the head of every principality and beginning, whose Gospel has been preached in the whole world, beginning from Moses, who said to the Jews: The Lord your God will raise up for you a Prophet from your brothers, like me. Him you shall hear; for it shall be that whoever does not hear that prophet shall be rooted out from the people (Deut. 18:15–16). Hence the Lord says to the Jews: Moses wrote of me (John 5:46). Therefore this one alone is to be heard and worshipped, and no one is to be reckoned alongside him; because he who holds the head has the remaining part subject to him. For whoever humbles himself to things that are subject is wholly in error; because, not holding the head, from which the whole body is held together for life, he is a mere trunk.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
