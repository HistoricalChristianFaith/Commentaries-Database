[[commentary]]
quote='''
IN PROVERBS IT IS SAID, "THE RIGHTEOUS MAN IS THE ACCUSER OF HIMSELF AT THE BEGINNING OF HIS SPEECH". HOW IS HE RIGHTEOUS, IF HE IS A SINNER? — All truth is righteous. Therefore, because he confesses what he is, he is righteous: for he speaks the truth; but sinners who defend their own misdeeds cannot be justified. Therefore such a man is rightly called righteous, because in declaring his sin he naturally asks that it be forgiven, begging the mercy of God. For he knows what is written in the Law: "Confess your sins, that you may be justified" (Isa. 43:26). But what does it mean to confess at the beginning of one's speech, if not to admit one's fault not under obligation, but voluntarily? For who, even one who fears God, is without sin, since faults are mixed in even with our thoughts, and at times we sin against our will? Yet this can also be said or thought of one who is called a catechumen, so that when he comes to the faith he may be justified. For when he asks to be changed, he undoubtedly confesses himself a sinner, that he may be justified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 30: THE RIGHTEOUS MAN IS THE ACCUSER OF HIMSELF"
