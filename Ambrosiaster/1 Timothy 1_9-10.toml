[[commentary]]
quote='''
Moreover, because the righteous have no need of the law, that is, those who, having received remission of sins, have been justified, so that they no longer live under the Law, from which they have been freed by the gift of God through faith in Christ; so that for the rest, keeping the law of nature, which receives the knowledge of the Creator and exhorts us not to sin, they may await the day of judgment, in which the righteous are to be rewarded, who keep the natural law; and if the human race had held it as its guide, the law in letters would not have been given through Moses. But because it was held in contempt, as though it were of no authority, Scripture was established, so that it might be known that it was to be kept, both because of the present time and because he who established it will in the future inquire by whom it was neglected and by whom it was kept. Thus he says that the Law was given not only because of evil acts and the vices of the body, but also because of the faithlessness with which they spurned the Creator; so that they might learn to live well and to give thanks to the Maker.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
