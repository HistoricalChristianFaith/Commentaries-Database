[[commentary]]
quote='''
In the word of truth. The word of truth was in his teaching, because he handed on nothing other than what he had received from the Lord. In the power of God. The power of God was in him, which through signs and wonders proved him a fit minister. Through the armor of righteousness on the right hand and on the left. He signifies that he was free from both the faithful and the unbelieving. For the armor of righteousness destroys iniquity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
