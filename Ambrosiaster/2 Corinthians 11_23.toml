[[commentary]]
quote='''
They are ministers of Christ, and I, I speak as one foolish, I more. Saying true things about himself, he declares himself foolish, so that he may be understood to have been compelled to burst out into his own praise. For one who of his own accord relates things that serve his praise does not call himself imprudent. He shows, then, what the things are that make him more a minister of Christ than the other preachers are. For, having found the occasion, he touches the persons of all, even of the apostles, grieving that the grace of God was judged lesser in him in this respect, though he worked the same things as the other apostles, and for the sake of the faith endured greater deadly perils. Hence in another epistle too he says: I have labored more than all of them (1 Cor. 15:10).

In very many labors. He says "in more labors" for this reason: because they too labored, but not so much. For he sought his food with his own hands from morning until the fifth hour, and from then until the tenth hour he disputed publicly with such great labor as to persuade those who contradicted him. In prisons more abundantly. It is evident that he was sent to prison more frequently than they were. In stripes beyond measure. "Beyond measure" for this reason: because more than was fitting. For they too were beaten, but not so much. In deaths more often. It is true, because he endured dangers more frequently than the others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
