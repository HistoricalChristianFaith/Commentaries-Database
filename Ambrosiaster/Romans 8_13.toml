[[commentary]]
quote='''
Nothing is truer, because if we live according to Adam, we will die; for Adam, transgressing, sold himself to sin, assigned to the flesh. For every sin is flesh; therefore, because vices and transgressions arise outwardly from the senses, that is, from hearing, sight, touch, smell, or taste, they are assigned to the flesh. For every thought looking outward suffers transgression; indeed, the sin of the first man was also born outwardly. To live according to the flesh, therefore, is death; for every act of the flesh is outside the Law. The body wishes to be governed by the law of the soul; therefore he shows that if, under the guidance of the Holy Spirit, the deeds and counsels of the flesh, which are devised at the instigation of the powers of this world, are restrained so that they do not receive the power to act, life is granted. They are said to be put to death if they cease: for they do not exist if they cease; because there is no sin if it is not committed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
