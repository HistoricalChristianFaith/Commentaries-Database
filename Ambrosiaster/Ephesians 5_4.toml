[[commentary]]
quote='''
Or filthiness, or foolish talk, or scurrility, which do not pertain to the matter; but rather the giving of thanks. Since some are wont to do something shameful, or to stir up a jest with foolish talk, as if it were not a sin, he forbids this, because the servants of God ought always to appear sober and modest; for through foolish talk one sins. Hence Solomon: The fool, he says, does evil through laughter (Prov. 10:23). And the Lord says in the Gospel that every idle word that men shall have spoken, they shall render an account of it in the day of judgment (Matt. 12:36). Nor can words be judged to go unpunished that are said in order to insult someone; therefore these things do not pertain to any wholesome matter. Wherefore he advises that those things be done and spoken which advance our profit and the praise of God, on whose law we must meditate day and night, as it is written in the psalm (Ps. 1:2). For from their way of life and their conduct the servants of God are to be recognized even when they are silent; so that, as far as the true is distant from the false, so far may the servants of God be distant from the servants of the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
