[[commentary]]
quote='''
For the wisdom of this world is foolishness with God. The wisdom of this world is foolishness with God in this way: when God does what the world denies can be done, he proves its wisdom to be foolishness; and since they speak of many gods, while faith proves there is one, with power as its witness, they will be confounded in their prudence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
