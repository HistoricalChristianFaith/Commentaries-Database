[[commentary]]
quote='''
If anyone teaches otherwise, and does not acquiesce in the sound words of our Lord Jesus Christ, and in the teaching that is according to godliness: he is proud, knowing nothing, but sick about questions and fights of words, from which arise envies, contentions, blasphemies, evil suspicions, conflicts of men who are corrupted in mind and who have been without the truth, supposing godliness, and the worship of God, to be gain; withdraw from such men. He commands that those who dissent from the catholic discipline are to be spurned, especially those who, though convicted and corrected, refuse to acquiesce through the disturbance of a depraved mind, who delight and feed on contentions. For the proud man does not suffer himself to be overcome, seeing that he bursts into conflict to seek favor, which is to be avoided by gentle and good men. For contention is never without strife, and it would be a small matter if strife alone arose; but blasphemies and enmities arise too, which is foreign to the servants of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
