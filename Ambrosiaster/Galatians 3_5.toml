[[commentary]]
quote='''
He then who supplies the Spirit to you, and works with power in you, is it from the works of the Law, or from the hearing of faith? It is the same sense, to which are added the marks of power, which bear witness to faith, that its hope is trustworthy and reasonable. But no power accompanies the Law to draw men to hope in it; because the things that are seen are not hoped for, but are temporal, like the law of works, which we have shown above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
