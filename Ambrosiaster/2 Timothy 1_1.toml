[[commentary]]
quote='''
He writes another letter to Timothy, in order to rouse him by his own example to martyrdom, now that he has been instructed in ecclesiastical discipline and in what the hope of the promise is: and because it is going to come about that some will turn away from sound doctrine, because it seems hard to them, to fables, that is, to human inventions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"

[[commentary]]
quote='''
Paul, an apostle of Jesus Christ by the will of God, according to the promise of life which is in Christ Jesus, to Timothy, his beloved son. He indicates that he was called an apostle of Christ Jesus by the will of God for this reason: to teach what and how great a promise there is for the future in the faith of Christ; so that by the preaching of it he may bring about an increase in those who are to be saved by the discipline of the Lord. For those servants are fit who by their diligence and faith enlarge the business of their masters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
