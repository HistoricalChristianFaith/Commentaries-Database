[[commentary]]
quote='''
Who gave himself as a redemption for all, whose testimony was given in its own times, in which I was appointed a preacher and apostle (I speak the truth, I do not lie), a teacher of the Gentiles in faith and truth. Since man, though reconciled to God, was still liable to the death of the underworld, so that he might be able to ascend to God, to whom he had been reconciled, the Savior, in order to bring his arbitration to effect, suffered himself to die against right; so that, descending to the underworld, he might condemn death for the impiety it had committed against him, taking away from them those whom it held; so that for the rest whoever had his sign could not be held by it. He showed the testimony of this at the time when he rose; for the destruction of death is the resurrection of the dead. This hope this Apostle of the Gentiles was sent to preach, so that they might learn from him what hope there was in Christ; for this is why he was called teacher, that he might teach faith and truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
