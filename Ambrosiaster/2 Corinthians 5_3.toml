[[commentary]]
quote='''
Other codices read thus: If indeed, being stripped, we are not found naked: that is, if, going out of the body, we have been clothed with Christ; because whoever are baptized in Christ put on Christ (Gal. 3:27). Therefore if we remain in the form of baptism and of the tradition, being stripped of the body we are not found naked, because Christ dwells in the inner man; and when we shall be seen clothed with him, or with the Holy Spirit given to us, we shall be worthy to be clothed over with the promised heavenly glory. For the promised brightness will descend upon him whom it sees to have the sign of adoption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
