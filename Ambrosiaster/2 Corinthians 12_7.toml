[[commentary]]
quote='''
And lest I be exalted by the sublimity of the revelations, there was given me a goad of the flesh, an angel of Satan, to buffet me, lest I be exalted. He testifies that God provides for good merits, in that he allows the good to be pressed down by temptations, not only so that they may not be deprived of the fruits of their labors, but also so that by these they may be enriched to the full measure of an eternal possession. This remedy, then, was given to the Apostle, so that, pressed down by injuries, he could not be lifted up in mind on account of the greatness of the revelations; for an idle heart was bound to be lifted up by the things he had seen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
