[[commentary]]
quote='''
Epaphras, my fellow captive in Christ Jesus, greets you: Mark, Aristarchus, Demas, Luke, my helpers. All these he testifies are sharers of his glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
