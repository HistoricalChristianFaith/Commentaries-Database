[[commentary]]
quote='''
For as many of you as were baptized in Christ have put on Christ. He says this because believers, when they are changed, put on Christ; when they are called that which they believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
