[[commentary]]
quote='''
Admonish them of these things, testifying before the Lord. Do not fight with words; for it is useful for nothing but the subversion of the hearers. He warns that contentions are to be avoided, and that precepts are to be given under the fear and dread of God; because contention can breed a scruple in those not yet firmly established. For in contention such things are commonly thrown up, with the polished steel of malice, as to unsettle the minds of brothers who are beginning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
