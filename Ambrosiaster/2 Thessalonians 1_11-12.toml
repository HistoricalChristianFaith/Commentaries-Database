[[commentary]]
quote='''
In which also we pray always for you, that our God may count you worthy of his calling, and fulfil every good pleasure of goodness, and the work of faith in power, so that the name of our Lord Jesus Christ may be glorified in you, and you in him, according to the grace of our God, and of the Lord Jesus Christ. To his joy he adds prayers also, that, because they are devoted, God may deign to help them, so that they may complete the work they have begun, to the glory of our Lord Jesus Christ, so that the perseverance of the disciples may be a testimony to the teacher, unto glory. For the authority of the teacher lies in the confidence of the disciples, when they make themselves more worthy in the grace they have received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
