[[commentary]]
quote='''
You have suffered so much without cause, if indeed without cause. He signifies that they had suffered much for the faith from unbelievers; for at that time those who believed were a reproach to the rest, whether to those of their own household or to strangers: for they were pointed at with the finger as if guilty of treason. Hence the Galatians likewise suffered many things, having met with people more frenzied, and the merit of this they had lost by putting themselves under the Law. But because he added: If indeed without cause, he shows that he hopes they can be reformed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
