[[commentary]]
quote='''
This only I wish to learn from you: Did you receive the Spirit from the works of the Law, or from the hearing of faith? Are you so without understanding? He still speaks with indignation; for he grieves greatly over their error, because he saw that his building, with which he had built them up through the Gospel, had been destroyed. He was not so moved about the Corinthians, because, although he calls them carnal (1 Cor. 3:2), they had nevertheless not been so far taken in mind as to allow themselves to be circumcised. Therefore these are called both foolish and without understanding, because they were not able to take thought even for the pain of their own flesh. For one is usually induced only so far as what delights, or what does not cause pain. These are therefore the words of one who questions, and what he asks is on the side of one who affirms, when he says: This only I wish to learn from you: Did you receive the Spirit from the works of the Law, or from the hearing of faith? He asks them this, a thing in which they both gloried and which they could not deny, that they had received the Holy Spirit through faith, not through the Law; so that, coming to their senses, they might recognize that the gift of God in which they gloried they had received not from the work of the Law but by believing in Christ; so that, being grateful to Christ at least in this way, they might abandon the Law, which they had learned profited them in nothing. He puts forward this, which at that time could not be denied, that the Spirit of God was in believers; for to commend the rudiments of faith, this gift of God was made manifest to men; as happened at the very beginnings in the apostles and the other disciples, and also in those twelve whom (because in an adulterous baptism under the name of the baptism of John they had been not dipped but defiled) the apostle Paul commanded to be baptized in the name of the Trinity; and when hands had been laid on them, the Holy Spirit fell upon them, and supplied the speech of diverse tongues together with their interpretation; so that no one should dare to deny that the Holy Spirit was in them. For this reason he calls the Galatians without understanding, who, being acquainted with this matter and aware of it, degrading themselves, subjected themselves to the care of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
