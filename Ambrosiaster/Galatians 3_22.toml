[[commentary]]
quote='''
But the Scripture has shut up all things under sin, that the promise from the faith of Jesus Christ might be given to believers. He set down this sense also to the Romans, saying: God has shut up all things under sin, that he may have mercy on all (Rom. 11:32). He said this, which I mentioned above, that the Law was given for this purpose, that sinners might know themselves guilty before God. For when their sins had been made manifest, they were shut up, so that they could not excuse themselves, but should seek mercy; so that he who had been promised to Abraham, when he came, might ask of them faith alone, which Abraham had; that they might obtain both pardon for their evils and justification. For God had made this manifest through Isaiah the prophet, saying: He will come from Zion who will rescue and turn away ungodliness from Jacob; and this will be to them a testament from me, when I take away their sins (Isa. 59:20).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
