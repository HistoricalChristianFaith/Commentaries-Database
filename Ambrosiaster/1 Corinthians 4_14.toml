[[commentary]]
quote='''
Not to shame you do I write these things: that is, I write these things not to make you blush, but that you may correct yourselves. But as my dearest sons I admonish you. He still makes himself a suppliant, lest, being rebuked and provoked to anger, they should spurn his admonitions. He acts like a healing physician who, cutting away the rotten parts, soothes the pain he has inflicted with hope and gentle words, so that the sick man allows himself to be cured.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
