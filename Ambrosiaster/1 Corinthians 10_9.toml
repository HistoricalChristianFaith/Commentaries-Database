[[commentary]]
quote='''
Nor let us tempt Christ, as some of them tempted, and perished by serpents. Those who disparaged God are said to have tempted Christ, because it was Christ who spoke to Moses. Finally, lest we be found in the same case, he warns us not to be handed over to the devil, whose figure the serpents bear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
