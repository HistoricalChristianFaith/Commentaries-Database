[[commentary]]
quote='''
But those who have faithful masters, let them not despise them, because they are brothers: but let them serve them the more, because they are faithful and beloved, who receive the benefits. If he commands that profane masters are to be served with all solicitude, how much more the faithful! For a man proves himself subject to the fear of God then, if he has obeyed a faithful and temporal master with his whole mind. Let him not think that his master is to be despised because he is called a brother on account of the common faith; because he will be the more deserving of rebuke who has thought a faithful master fit to be despised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"

[[commentary]]
quote='''
Teach and exhort these things. He wishes the teaching of the Lord to be made manifest, so that its detractors may see that there is nothing in it to be reproached; and that, considering at the same time what shameful things lie hidden in their own rites, they may also blush, through which they will be without excuse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
