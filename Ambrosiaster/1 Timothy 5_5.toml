[[commentary]]
quote='''
For she who is truly a widow and desolate hopes in God, and persists in prayers by night and by day. A widow who has children or grandchildren is not readily to be admitted to the stipends of the Church; because if she has governed her house with godliness and care, a return must be made to her by her own, just as she too rendered it to her kin: but if, as commonly happens, impiety has been at work, so that the old woman is despised by her own, whom she treated with godliness, it is fitting that she be taken up by the Church, because she has lived faithfully in the law of the Lord. The widow, therefore, who is desolate and despised by her own, hopes in God; for, seeing that she has support from no quarter, she is devoted with her whole mind to God, from whom alone she awaits help for her life and salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
