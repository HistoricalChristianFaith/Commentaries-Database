[[commentary]]
quote='''
What then will be my reward? That, announcing the Gospel, I may make the Gospel without expense, so as not to abuse my power in the Gospel. Holding back any boastfulness of words, he glories, and wishes it to be understood how great a reward he is worthy of, because he does not use his power in the Gospel, while he spurns the provisions offered, lest he humble the force of the preaching. This is: it is lawful, but not expedient, for the sake of the brethren's salvation, that they may be corrected. So he wishes to be a pattern to the others, so that where they see it is not expedient, they should not make use even of lawful things: if not, they will become guilty through a lawful thing, since they take it in such a way that it serves to do harm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
