[[commentary]]
quote='''
In which you also once walked, when you lived in them. He does not keep silent about how great a benefit the grace of God has bestowed on them through Jesus Christ, so that they may rejoice that they have escaped the wrath which is to come suddenly upon the unbelievers of the whole earth, and may show themselves such that they can obey the precepts of him by whom they have been freed from the second death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
