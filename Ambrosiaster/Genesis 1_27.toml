[[commentary]]
quote='''
WHAT IT MEANS THAT GOD MADE MAN IN THE IMAGE AND LIKENESS OF GOD, AND WHETHER WOMAN IS THE IMAGE OF GOD? — This is what it means that man was made in the image of God: because the One made one, so that just as all things are from the one God, so also the whole human race is from one man. But the likeness is this: that just as the Son is from the Father, so also the woman is from the man, so that the authority of a single principle may be preserved. Yet the Son was born from God the Father inexpressibly and incomprehensibly; whereas the woman, bodily, as we read (Gen. 2:21–22), was made from the man, so that through her birth might arise. But the Son of God was born for this reason, that through him creation might come into being. In this, therefore, there is a difference. For God was born of God, but a woman from a man: because there, there is simplicity, and it was not possible for the simple to be born except from the simple—spirit from spirit, God from God. Therefore the man is the image of God. For therefore it is written: God made man; in the image of God he made him. Therefore the Apostle also says: “A man indeed ought not to cover his head, since he is the image and glory of God; but the woman,” he says, “should cover her head” (1 Cor. 11:7, 6). Why? Because she is not the image of God. Therefore again the Apostle says: “I do not permit a woman to teach or to exercise authority over a man” (1 Tim. 2:12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 21: ON MAN AS THE IMAGE OF GOD, AND WHETHER WOMAN IS THE IMAGE OF GOD"
