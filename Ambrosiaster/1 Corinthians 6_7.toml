[[commentary]]
quote='''
Now indeed there is altogether a fault in you, that you have lawsuits among you. He indicates that it is a sin that brother goes to law with brother, when effort ought to be made that they be of one heart, like brothers by blood; especially since our faith is devoted to peace. For although a Christian ought not to go to law, nevertheless, if something serious has occurred, and such as cannot be disregarded, let him bring the case to the Church, lest he incur both loss for the present and perhaps offense as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
