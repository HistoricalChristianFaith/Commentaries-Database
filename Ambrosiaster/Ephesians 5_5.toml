[[commentary]]
quote='''
For know this, that every fornicator, or unclean person, or avaricious man, which is idolatry, has no inheritance in the kingdom of God and of Christ. He shows for what reason these things must be put away: because whoever is such will have no part in the kingdom of heaven, which is the Father's and the Son's. Yet in order to teach that avarice is a perilous thing, he calls it idolatry, than which no sin is greater. Let us see, then, why avarice is called idolatry. Idolatry usurps the honor of God and claims it for the creature, when it asserts that his handiwork shares with him in the name of deity, which belongs to the Maker alone. Avarice, moreover, has been made equal to it for this reason, that in like manner the avaricious man usurps for himself and hoards the things that are God's; so that what God granted in common for the use of all, avarice denies, since it gathers these things to itself for this very purpose, that others may not use them; and this causes things to be sold dear, so that the poor cannot live; for if they were not hoarded, the abundance of all things would bring benefit. And indeed among the ancients, because there was no avarice, there was no dearness of prices either. Rightly, then, has it been compared to idolatry, because it harms many. It is likewise hostile to the Creator; for God wills and commands that the poor be relieved from the things he created, and avarice gainsays it. See whether it can exist without the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
