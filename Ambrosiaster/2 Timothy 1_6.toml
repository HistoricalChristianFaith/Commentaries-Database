[[commentary]]
quote='''
For this reason I admonish you that you revive the gift of God which is in you through the laying on of my hands; for God has not given us a spirit of fear, but of power, and of love, and of sobriety. He indicates that he recalled the sincerity of faith of his forebears for this purpose, to make him stronger. For who, hearing the praise of those with whom he is a sharer in that very thing, would not grow, adding courage to such strengths? So, then, he revives in himself the gift of the grace of God received through the ordination of the presbytery, when he warms his spirit with eagerness of mind, rejoicing in himself, as one rejoices in the newness of an ordination.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
