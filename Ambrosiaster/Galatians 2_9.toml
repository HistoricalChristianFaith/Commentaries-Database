[[commentary]]
quote='''
And knowing the grace of God which was given to me, Peter and James and John, who seemed to be pillars, gave to me and to Barnabas the right hands of communion, that we should go to the Gentiles, but they to the circumcision; only that we should be mindful of the poor, which very thing I also took care diligently to do. By the apostles who were more illustrious among the rest, whom he also calls pillars on account of their firmness, and who had always been with the Lord in his secret moments, worthy to behold his glory on the mountain (Matt. 17:2): by these, therefore, he says, the gift which he received from God was approved, so that he was worthy to have the primacy in the preaching to the Gentiles, just as Peter also had it in the preaching to the circumcision. And just as he gives Peter companions, eminent men among the apostles, so too he joins to himself Barnabas, who was joined to him by divine judgment; yet he claims the grace of the primacy as granted by God to himself alone, just as it was also granted to Peter alone among the apostles (Acts 13:2); so that the apostles of the circumcision extended their right hands to the apostles of the Gentiles to show the concord of their fellowship, so that both, knowing that they had obtained from the Lord the spirit of perfection in the dispensation of the Gospel, might show that in nothing did they pick and choose between one another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
