[[commentary]]
quote='''
For superfluous things usually produce greater care; for the Lord too, not doubting the love of the apostle Peter toward himself, says to him a third time: Simon son of John, do you love me (John 21:17)? This threefold repetition seems superfluous, as it were, but it serves the completeness of the admonition, so that he may know that he must attend with great diligence to what is enjoined frequently.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
