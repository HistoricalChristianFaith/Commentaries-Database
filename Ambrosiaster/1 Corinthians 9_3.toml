[[commentary]]
quote='''
My defense to those who question me is this. Now he begins to plead the case which he set out above, saying: All things are lawful for me, but I will not be brought under the power of anyone. Food for the belly and the belly for foods (1 Cor. 6:12). So he begins this case in such a way as to say: My defense to those who question me is this. And what it is he adds, saying:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
