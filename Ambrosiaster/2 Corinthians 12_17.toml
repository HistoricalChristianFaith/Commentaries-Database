[[commentary]]
quote='''
Did I overreach you through any of those whom I sent to you? What he says is this: that those whom he sent did not intimate to them that, if they wished to have the Apostle appeased, they should offer an amount worthy of his person, since he had refused to accept for this reason, that less than was fitting was being offered. They would have understood that as something contrived by the Apostle's cunning, so that what he did would be shown to have been done not out of disdain but out of avarice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
