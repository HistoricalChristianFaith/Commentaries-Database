[[commentary]]
quote='''
But the same Spirit. And there are divisions of ministries. He says that different gifts are bestowed through the same Spirit. But the same Lord. And there are divisions of operations. Now he joins Christ to the Holy Spirit. But the same God, who works all things in all. So far is he from granting this to men, as though it were their own, that he claims it for God alone; so that he calls even the gift of the Holy Spirit and the grace of the Lord Jesus the operation of the one God; lest the grace and the gift be divided on account of the persons of the Father and the Son and the Holy Spirit, but that the one work of the three, of undivided unity and nature, may be understood, so that he may bring back all glory and divinity to one. Now there are divisions of graces assigned to the offices of the Church, not to human merits. For if the Holy Spirit is the same Lord, and the Lord is the same God, the three too are one God; for since the glory and the power and the nature of the Holy Spirit is God's, and the Lord Jesus is the same in nature as God is, then surely the Holy Spirit, and the Lord Jesus, and the Father are one God. For each singly is one God, and the three are one God. Finally, when one works, the three are said to work, so that the mystery of the Trinity may be enclosed in the nature and power of one God, though it is immeasurable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
