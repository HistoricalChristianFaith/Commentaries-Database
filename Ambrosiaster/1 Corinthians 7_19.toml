[[commentary]]
quote='''
Circumcision is nothing, and foreskin is nothing. It is clear that it neither harms nor helps. But the observance of the commandments of God, that is, faith makes God propitious, if it is approved by good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
