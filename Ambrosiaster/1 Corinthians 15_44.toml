[[commentary]]
quote='''
It is sown a natural body, it will rise a spiritual body. If there is a natural body, there is also a spiritual one. It is a natural body while it is sustained by food in order to live; but a spiritual one when it will need none of these things, being changed into life. All that was said above is concluded in this sense; for nothing else is contained in the preceding except that the natural body dies and will rise spiritual, so that it no longer eats, nor drinks, nor falls sick, nor is fetid, nor foul by nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
