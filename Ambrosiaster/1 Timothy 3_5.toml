[[commentary]]
quote='''
But if anyone does not know how to rule over his own house, how will he apply diligent care to the Church of God? It is plain that a man can be proved fit to be a future ruler only then, if he has first governed his own house rightly; for whoever is faithful in the least things is faithful also in great ones (Luke 16:10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
