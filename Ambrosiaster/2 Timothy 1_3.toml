[[commentary]]
quote='''
I give thanks to my God, whom I serve from my forefathers in a pure conscience, that I have an unfailing remembrance of you in my prayers, night and day greatly desiring to see you, mindful of your tears, that I may be filled with joy, receiving the remembrance of the sincere faith which is in you, which dwelt first in your grandmother Lois and in your mother Eunice; and I am sure that it is in you also. Since it is fitting to remember good men, he therefore gives thanks to God that he was mindful of Timothy, an admirable man, so that even this itself is a gift of God; for he who thinks of good men is not without merit. And because the God of the Christians is the same who was the God of the Jews, he testifies that he renders thanks to that God whom he has served from his forefathers. For since his ancestors hoped for this which he had begun to preach, their faith is one. And because he succeeded to the service of his parents, and because he was still in them when they served God, he rightly says: Whom I serve from my forefathers. How? In a pure conscience, he says; for when he once persecuted the Church, he did it in such a way that he acted out of love of God, not out of malice. For in a like way it is also written in the epistle to the Hebrews that Levi, who received tithes, paid tithes to Melchizedek; because Levi, he says, was in the loins of Abraham when he offered tithes to Melchizedek (Heb. 7:9–10): so here too he says that he served God from his forefathers, because Levi also is said to have offered tithes in his great-grandfather. For Levi's father is Jacob, his grandfather Isaac, his great-grandfather Abraham.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
