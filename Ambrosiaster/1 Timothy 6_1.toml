[[commentary]]
quote='''
Let as many slaves as are under the yoke count their masters worthy of all honor, lest the name of the Lord and the teaching be blasphemed. He wishes that through the services of their slaves the masters should give thanks to God; for when through the discipline of God the slaves have shown them faithful service, perhaps the masters too will subject themselves to this same discipline.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
