[[commentary]]
quote='''
WHY IS IT THAT IN MATTHEW JOSEPH'S FATHER IS WRITTEN AS JACOB, AND IN LUKE AS HELI, SO THAT HE SEEMS TO BE IGNORANTLY DESCRIBED AS HAVING TWO FATHERS, OR AT LEAST SO THAT WHO HIS TRUE FATHER IS REMAINS UNKNOWN (Matt. 1:16; Luke 3:23)? — There is no doubt that Jacob was Joseph's father. For the line from David through Solomon maintains its course and, proceeding straight, reaches Jacob, whose son is Joseph. Heli, however, the son of Matthat, holds the line from David through Nathan, David's son, down to the time when the Savior came. Therefore each Evangelist, following from David the line of different brothers, makes, as it were, a fork: so that Matthew descends from David through Solomon to Joseph, while Luke, starting from Heli, who lived in the Savior's time, ascends through the stock of Nathan, the son of David, and joins the tribe of both Heli and Joseph, showing that both are of one and the same stock; so that when he associates Joseph with Heli, he shows them not to differ in lineage, but to be brothers. And by this not only is the Savior shown to be the son of Joseph, but also of Heli. For by the very reasoning by which the Savior is called the son of Joseph, he is also the son of Heli, and of all the others who belong to the same tribe. Therefore the Apostle says, "whose are the fathers, and from whom is the Christ according to the flesh" (Rom. 9:5). Moved by divine prompting, Luke ascends from Heli through the line of Nathan to David, and through Thara, David's father, ascends to Shem the son of Noah, and still further, beyond the Flood, reaches Seth the son of Adam, who was given in place of Abel; and in the same way he makes the Savior the son of Adam as he was said to be the son of Joseph and of Heli. Then, going beyond Adam, he assigns Christ to be the Son of God before all flesh. The opinion held by some, that Heli had taken the wife of Jacob, as the Law commanded that if anyone died without children, his brother or kinsman should take his wife and raise up seed for his brother (Deut. 25:5), and that it therefore happened that Heli fathered Joseph for Jacob, whose wife he had taken, and that in this way the genealogies were joined, so that Joseph is rightly said to have Heli as father, is neither plausible nor useful for anything. Rather, what was said above joins by genealogy two brothers, sons of one man, and shows Christ to be the Son of God before every generation. For when the Evangelist reports, saying, "And Jesus himself, when he began, was about thirty years old, being the son (as was supposed) of Joseph, who was the son of Heli" (Luke 3:23), that is: Jesus was thought to be the son of Joseph; and he was not only Joseph's son, but also Heli's. Not because he calls Joseph the son of Heli, but because in the same sense in which Jesus was called Joseph's son, he was also Heli's son, since Joseph and Heli were sons of brothers, namely of Solomon and Nathan, the sons of David. Therefore, by ascending through David to Abraham and Noah and Seth and to Adam himself, and beyond Adam, he teaches that Christ is the Son of God. For when he says, "who was the son of Seth, who was the son of Adam, who was the Son of God," he indeed calls Christ the son of Adam in the same way that he was called the son of Joseph. For Mary says to him, "Son, why have you done this to us? Behold, your father and I have been seeking you sorrowing" (Luke 2:48). But beyond Adam he joins Christ to God the Father, so that he who was called son of these, from Adam up to Joseph and Heli, may be understood to be before them all as the true Son of God, to the confusion of Photinus, who insists that Christ is only from Mary, and did not exist before. Of those whose son he was not, he was called son; yet of God, whose true Son he was, this was denied. If, however, which is unlikely and of no benefit, Joseph is called Heli's son in the way we mentioned above, it will appear that the Evangelist did not say this of Christ, that he was the Son of God, but of Adam. For by listing fathers in the order of successive sons, he comes to Enos, whose father he calls Seth, and Seth's father he calls Adam, and Adam's father he calls God; and I do not see what good there is in asserting it this way. But if, in the order we have described, all the fathers are said to be Christ's fathers, just as he was said to be Joseph's son, because it is written, "whose are the fathers, and from whom is the Christ according to the flesh," (Rom. 9:5) then by this order he is read as son of Seth and son of Adam. And above all these he is designated the Son of God, so that he is said to exist before those whose son he is called.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 56: WHY JOSEPH'S FATHER IS JACOB IN MATTHEW AND HELI IN LUKE"
