[[commentary]]
quote='''
I speak according to ignobility. He calls "ignobility" what he said above: And I will boast according to the flesh (2 Cor. 11:18). For he does not say that it pertains to praise that he was not weak in that in which those men boasted, whom he touches covertly. Hence he also added: As if we had been weak in this respect. It is plain that he was not weak in this glory in which the believing Jews preferred themselves, whom these were tolerating, as if their Apostle were unlike them in this matter; because he himself too was of the seed of Abraham, and so he was not weak in this glory of the flesh. Those, however, were judged weak who had been attached to the race of Abraham. For these, as being weak in that in which those preferred themselves, because they were Israelites, wish to be borne with in this very thing. To show that in this glory of the flesh they were not unlike them and weak, when he speaks of his own case he also brings in the person of Barnabas, his companion. Hence in the first epistle too he says: Or do I alone and Barnabas not have the power to do this (1 Cor. 9:6)? They were not, then, lesser in this glory in which the Jews boasted, but they did not applaud themselves on that account. Finally he says: In what anyone dares, I speak in foolishness, I too dare: that is, that he was not weak in the glory in which the Israelites boasted; nor yet would he be declared prudent in this matter; for the prudent do not want to prefer themselves. He says, therefore, that he dares in foolishness in that in which those dare who boast that they are sons of Abraham, so as to empty their glory: he declares himself imprudent, lest they should seem prudent in this respect, or noble.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
