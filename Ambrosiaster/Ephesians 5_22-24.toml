[[commentary]]
quote='''
Let wives be subject to their husbands, as to the Lord; since the husband is the head of the wife, as Christ also is the head of the Church, he himself the savior of his body. But as the Church is subject to Christ, so also let wives be subject to their husbands in all things. Women are commanded by natural law to be subject to men, because the man is the author of the woman; hence, he says, as to the Lord, so they ought to be subject to their husbands. Hence Sarah called Abraham lord (Gen. 18:12); for as Christ is the head of the Church, so also the man is the head of the woman. For the Church took its beginning from Christ, and therefore it is subject to him; so also the woman to the man, that she may be subject. Yet there is a difference in this: that the woman is consubstantial with the man, whereas the Church can share with Christ in name, not in nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
