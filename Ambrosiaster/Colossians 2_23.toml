[[commentary]]
quote='''
Which things indeed have a reason of wisdom in the pretence of religion, and in humility of mind for the vexation of the body, not in any honour for the satiety and care of the flesh. Hence they think that they have a reason of wisdom, because they apply the name of religion to human tradition, so that it is called religion, though it is sacrilege; because what is against the author has been invented by a sacrilegious mind. It feigns a name, then, so that it might assert as true things that are false; and it humbles human minds on the earth, lest they raise themselves to the things above: or rather, worshipping earthly things, they fall away from the heavenly things above, and do harm to the body whose head is Christ according to the making of the first reason. For, weighed down by this, they could not be joined upwards to their head, so as to be restored in him, being made honoured: but, as if cut off from the first part of the body, they give themselves wholly to the world to fulfil the sense of the flesh. For human tradition is the fattening of carnal sense, which says that what the providence of the flesh has handed down is sufficient; for it seems to have a reason of wisdom according to the flesh, because every bodily birth is from the elements: and therefore, they say, it is not unfitting to bow down to these by whose governance the human race is ruled, so that a man subjects himself to the things which he sees to be the most brilliant of the world: and spiritual things ought not to be sought; because, they say, it is granted to use these alone as guides; and by this reasoning they neglect the author.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
