[[commentary]]
quote='''
You are not straitened in us, but you are straitened in your own bowels, having the same recompense of reward. He says this because it did no harm to the teachers if the disciples turned out badly, despising the vigor of the teaching; because each one will receive a reward according to his works; because, as far as the teachers were concerned, they did not keep silent, as the Lord says to the prophet Ezekiel: Lift up your voice and speak to the people; if they hear you, you will gain them; if not, you will save your own soul (Ezek. 3:19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
