[[commentary]]
quote='''
These things I write to you, son Timothy, hoping to come to you shortly; but if I delay, that you may know how you ought to conduct yourself in the house of God, which is the Church of the living God, the pillar and firmament of the truth. As far as his own knowledge went, the case was that he would see him quite soon; but because something else is wont to please God, whose providence is known to him alone, therefore, lest perhaps, he says, I delay, I write to you so that you may know how to order the Church, which is the house of God; so that, while the whole world is God's, yet the Church is called his house, whose ruler today is Damasus. For the world is in transgression, troubled by diverse error; therefore the house of God, and the truth, must be said to be there where he is feared according to his will. When his servants professed concerning him what he himself had deigned to teach, lest perhaps it be denied that the words were his, he sealed these things with mighty works which can be done by no one else; so that unbelief, convicted by them, may perish without excuse. For the signs and wonders are the firmament of this truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
