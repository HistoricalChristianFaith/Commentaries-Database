[[commentary]]
quote='''
But we ask you, brothers, by the coming of our Lord Jesus Christ, and of our gathering together to him, that you be not easily moved from your mind, nor be troubled, either by spirit, or by word, or by epistle as if sent from us, as though the day of the Lord were at hand. Let no one deceive you in any way; for unless the failing comes first, and that man of sin is revealed, the son of perdition, who opposes, and is exalted above all that is called God, or that is worshipped, so that he sits in the temple of God, showing himself as though he were God. He beseeches them not to accept lightly and easily the opinion that the coming of the Lord is, as it were, imminent; and he gives such commands that, even if anyone has spoken through the spirit as a prophet, he ought not to be believed; nor is assent to be given if it comes through a treatise, or through an epistle written perhaps in the name of the apostles. For dissemblers, in order to deceive, are accustomed to forge an epistle under the name of some illustrious man, so that the authority of the name may commend what could not be accepted on its own account.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
