[[commentary]]
quote='''
Do you not know that those who run in the stadium all run indeed, but one receives the palm? Now he wishes to set forth something else: and so by this example he shows how great is the advantage of our law, in which the palm is promised not to one, but to all. So run that you may lay hold of it. He wishes the race toward the promise to be run with care, because it is great.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
