[[commentary]]
quote='''
Even if to others I am not an apostle, yet to you I am; because by the Jews who believed, and nonetheless kept the Law, it was denied that he was an apostle. For he was already teaching that men ought not to be circumcised, nor the sabbath kept; but since the other apostles, on account of the stumbling block, held back from this matter, he seemed to teach otherwise; therefore it was denied by these men that he was an apostle; for he was an apostle to those who had seen in him the signs of power. For you are the seal of my apostleship in the Lord; for through his preaching they were converted from idols to faith in the one God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
