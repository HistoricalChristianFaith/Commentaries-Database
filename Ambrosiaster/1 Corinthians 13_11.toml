[[commentary]]
quote='''
When I was a little child, I spoke as a little child, I understood as a little child, I thought as a little child: but when I became a man, I destroyed the things which were of a little child. He says this because the saints, on going out of this world, must necessarily find more than they now suppose, as the apostle John said of the Savior: Then we shall see him as he is (1 John 3:2). In this life, then, we are little children in comparison with the future life; because just as this life is imperfect, so also is our knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
