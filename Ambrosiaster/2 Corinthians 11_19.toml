[[commentary]]
quote='''
For you gladly bear with the foolish, though you yourselves are wise. He calls foolish those who boasted of the circumcision of the flesh; and since they were borne with by the Corinthians so as to seem glorious, the Apostle therefore wishes himself also to be borne with by them, so that he too might show that he was what they were, and yet that he did not boast on this score according to God; hence he calls this glory foolishness. For he says that he boasts according to the flesh; but he professes that this is foolish, so that he might empty this glory, and he shows that he was compelled to break out into praise of the flesh. This, therefore, is irony. For how are they prudent who are often rebuked? Does not the foolishness of the Apostle have more wisdom than the prudence of these men? For the wise man here is one who bears with the imprudent, who endures them by his patience so that they may make progress, lest by provoking them or casting them off he make them worse, or at any rate, if he cannot make progress in them, he guards his own moderation. Of these things there is nothing in the Corinthians. How, then, do they gladly endure the imprudent, when they themselves are wise, unless because he does not want it to be understood as the words sound? This lies in the sense and in the delivery; because the same words do not have the same sense when he pronounces them otherwise, so that at one time he affirms, at another denies, what he says. For these, as prudent men, were bearing with the foolish false apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
