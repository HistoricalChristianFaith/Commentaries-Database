[[commentary]]
quote='''
But we preach Christ crucified, to the Jews indeed a stumbling block, but to the Gentiles foolishness. It is a stumbling block to the Jews when they hear that Christ professed himself the Son of God and made the sabbath void. But to the Gentiles foolishness; because they hear those things preached which, since they do not agree with worldly reason, seem senseless, such as the birth from the Virgin and the resurrection of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
