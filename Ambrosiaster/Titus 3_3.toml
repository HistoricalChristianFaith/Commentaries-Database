[[commentary]]
quote='''
For we too were once ill-advised, disobedient, erring, slaves to various desires and pleasures, living in malice and envy, hateful, hating one another. He recalls that these good things, which unbelief does not have, have been given to Christians, so that, shining in all righteousness, they may be made manifest as worshippers of God. For when those who were once ill-advised are now seen to be of sound counsel in all things, God is praised in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
