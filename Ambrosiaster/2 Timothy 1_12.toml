[[commentary]]
quote='''
For which cause I also suffer these things. Preaching the gift of God, he suffers the devil as his enemy, so that the devil stirs up afflictions against him, because he rescues the people from his jaws. But I am not confounded. Secure in this, that a great reward has been promised for tribulations, he is not confounded, but glories in afflictions. For I know whom I have believed, and I am certain that he is able to guard my deposit unto that day. This is what he says: with what hope and confidence in the magnificence of the Savior he is secure; because what he entrusts to him is in safety. And what does he entrust to him, except his salvation? So that, suffering here for him, he may find salvation with him when he begins to judge; so that, while punishing the unbelievers, he may pronounce this man worthy of eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
