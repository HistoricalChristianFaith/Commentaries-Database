[[commentary]]
quote='''
For in the time of the Antichrist men will be either apostates, or guilty, or in hiding places, or placed in punishment; the rest are Gentiles, whom the Lord Jesus, together with their leader the Antichrist, will slay at his coming with the spirit of his mouth (2 Thess. 2:8), that is, at his command they will be burned up with fire by the angels of his power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
