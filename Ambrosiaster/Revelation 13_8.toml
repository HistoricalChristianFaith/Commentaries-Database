[[commentary]]
quote='''
For I delivered to you first of all that Christ died for our sins according to the Scriptures. He recalls the Scriptures of the old testament, which foretold in song the future passion of the Lord. For Isaiah the prophet says: As a sheep he was led to the slaughter (Isa. 53:7). And among other things: For his life will be taken away from the earth; because of the iniquities of my people he was led to death (ibid., 8): these things are known to have been found fulfilled in Christ. But that the wording seems to signify past time is no objection; for with God, who foreknows all things, nothing is future; therefore he speaks of what is future for us as if it had been done. For in the Apocalypse of John the apostle it is said: The Lamb who was slain from the foundation of the world (Rev. 13:8). For since it will not happen otherwise than as God knows, it is said to have been done; for it happens for us, not for God, since with God there is nothing that may be called future. And in the Psalm he says: The Lord has reigned from the wood (Ps. 95:10). And Moses signified his cross thus, saying: Then you will see your life hanging before your eyes, and you will not believe (Deut. 28:66). For this reason, in the same matter, an expression of future time is also sometimes set down, lest perverse men should maintain that it was not said of Christ, if it all signified as though past.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
