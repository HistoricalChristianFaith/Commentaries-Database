[[commentary]]
quote='''
Brethren, do not become children in your senses; but be little ones in malice, that you may be perfect in your senses. He wishes them to be perfect, so that they may know what is necessary for the instruction of the Church; so that, withdrawing from malice and errors, they might be zealous for those things which would profit the benefit of the brethren. For he is perfect in sense who acts so as to profit someone, above all a brother.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
