[[commentary]]
quote='''
Since the Law proclaims what is just, and he is truly just who possesses full justice, how is it then that Solomon says, "Do not be overly just"? — Excessive justice falls into sin, while moderated justice makes people perfect. For he who is overly just is not without hatred; because if you answer sinners on every single point, you will not fail to find where you yourself sin. Indeed, God's justice is moderated. For sometimes He pardons sinners, sometimes He grows angry, sometimes He repays them not as much as they deserve: He bears with them, so that there may be those who progress. Since the Law cannot soften itself, it must be hardened by us, so that it can be of benefit to those acting under it. Therefore this man is not overly just, who is an imitator of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 15: WHY SOLOMON SAYS 'DO NOT BE OVERLY JUST'"
[[commentary]]
quote='''
Be angry and do not sin. Since one cannot be forbidden to be angry (seeing that anger is a natural motion, conceived from causes, which is wont to serve the progress of the one who offends), he therefore says that one must be angry (Ps. 4:5), but warns that one should not sin through anger. For we are wont to go beyond the measure while we are angry, and we ourselves, who rebuke sinners, are found to sin, when we are angrier and burden the sinner more than he deserves. This then he teaches: that anger itself should be with moderation, and that no one show himself too just toward the offender: because some are wont to sin in such a way that they seem to deserve to be struck with blows as great as they cannot bear: and he who could perhaps have been corrected is taken out of life, not without sin on the part of the one who is angry. Hence it is that Solomon: Do not, he says, be very just; for there is one who perishes in his own justice (Eccles. 7:17). But we ought to be imitators of God, who has a tempered justice; for though it would be just for the wicked to be punished, he bears them with his patience, so that some of them may be corrected. Us ourselves, his servants, he bears with when we sin, nor does he quickly strike anyone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
