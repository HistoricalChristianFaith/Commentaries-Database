[[commentary]]
quote='''
Since the Law proclaims what is just, and he is truly just who possesses full justice, how is it then that Solomon says, "Do not be overly just"? — Excessive justice falls into sin, while moderated justice makes people perfect. For he who is overly just is not without hatred; because if you answer sinners on every single point, you will not fail to find where you yourself sin. Indeed, God's justice is moderated. For sometimes He pardons sinners, sometimes He grows angry, sometimes He repays them not as much as they deserve: He bears with them, so that there may be those who progress. Since the Law cannot soften itself, it must be hardened by us, so that it can be of benefit to those acting under it. Therefore this man is not overly just, who is an imitator of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 15: WHY SOLOMON SAYS 'DO NOT BE OVERLY JUST'"
