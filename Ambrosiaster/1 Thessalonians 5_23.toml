[[commentary]]
quote='''
And may the God of peace himself sanctify you, perfect in all things, that your spirit whole, and soul, and body may be preserved without complaint at the coming of our Lord Jesus Christ. The God of peace is Christ, for he says: My peace I give to you, my peace I leave to you (John 14:27). Since indeed all things that the Father has are the Son's, the Apostle prays that he may sanctify us, that he may enlighten us with the godliness of his clemency, and direct our every act in perfection, so that the spirit given to us may be whole. For it is whole only if we are zealous for a good life, having a clean soul and a body without complaint, so that the whole man may be perfect. For the body can be clean and the soul be defiled through an evil thought; and therefore he says that the spirit in a man ought to be clean. But if an evil life or thought intervenes, the spirit will not be whole, because it deserts the man who is liable to sins. For while the soul and the body are at variance, although it is without feeling, they are made strangers to it, and as though losing them, the spirit will not be whole; for it is given to man for this, that it may remain in him and be, as it were, his head. It will therefore not be whole, because it loses its members, while the man withdraws from it, doing the things which the Holy Spirit hates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
