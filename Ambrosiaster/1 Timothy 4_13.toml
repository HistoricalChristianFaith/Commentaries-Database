[[commentary]]
quote='''
Until I come, attend to reading, exhortation, and doctrine. Do not neglect the grace which is in you, which was given to you through prophecy, with the laying on of hands of the presbytery. He wishes him to be intent upon and devoted to the exercise of reading, so that with all care and diligence he may strive at this, to exhort and to teach. Exhortation is when with a mild word we call some forth to good work; but to teach is when we impart to the minds of the hearers the things that are hidden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
