[[commentary]]
quote='''
In an acceptable time I have heard you, and in the day of salvation I have helped you (Isa. 49:8): this is written in Isaiah the prophet. He teaches that the grace of God was predestined for the time of Christ; for God decreed that his mercy should abound in such a way that he would bestow help on those who ask in the name of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
