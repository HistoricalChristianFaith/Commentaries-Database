[[commentary]]
quote='''
Paul says this because, having received the Holy Spirit, we have been freed from fear of evil deeds, so that from now on we do nothing of that kind for which we might again be afraid. Formerly we were under fear, because, once the Law was given, all were made guilty. Therefore he called the Law the spirit of fear, because it placed people in fear on account of sin. But the law of faith, signified by the spirit of adoption, is the law of security, because it frees us from fear by forgiving sins and thereby makes us secure; and for this reason it is called the spirit not of fear. Freed from fear by God’s grace, we have received the Spirit of adoption as sons, so that, considering what we were and what we have attained by God’s gift, we may order our lives with great diligence, lest the name of God the Father suffer insult in us, and lest, like the ungrateful, we fall again into all those things from which we escaped. For we have obtained such grace that we dare say to God: Abba, that is, Father! Therefore he warns us not to turn the confidence we have received into assumption; for if we display a life unlike this utterance by which we say, “Abba, Father,” we insult God by calling him Father. For this is why, in his goodness, he granted us what is beyond our nature: so that, though unworthy by our substance, we may become worthy by our deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
