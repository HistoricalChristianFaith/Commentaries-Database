[[commentary]]
quote='''
For you know the grace of our Lord Jesus Christ, that for your sake he became poor, though he was rich, so that by his poverty you might be rich. He says Christ became poor, because God deigned to be born a man, humbling the might of his power, in order to acquire for men the riches of divinity; so that, as the apostle Peter says (2 Pet. 1:4), they might be partakers of the divine nature. He was made man, then, in order to take man up into God, as it is written: I said: You are gods (Ps. 81:6). In this way he exhorts them, by giving generously, to become as it were poor; let their poverty profit, just as Christ's poverty profited us. And Christ indeed became poor for our sake, not for his own; but we, so that it may profit us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
