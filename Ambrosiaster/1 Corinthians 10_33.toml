[[commentary]]
quote='''
Just as I please all in all things, not seeking what is useful to me, but what is useful to many, that they may be saved. To please all in all things is to act without being a stumbling-block to anyone, for the advancement of their benefit, so that it may be useful both to them and to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
