[[commentary]]
quote='''
But even if you, or an angel from heaven, should preach a gospel to you other than what we have preached, let him be anathema; as we have said before, and now I say again: If anyone preaches a gospel to you other than what you have received, let him be anathema. Let no one wonder that the Apostle, who used to tame savagery of manners, is so stirred; for it is for the salvation of the Galatians that he is indignant against the enemies of Christian teaching. For this indignation shows that it is no light sin to turn to the Law after receiving the faith: for he asserts that the Gospel which he had preached to them is so firm and true that he taught that even they themselves, that is, the apostles, should not be heard, should they perhaps be changed and preach otherwise, whose fame, that they were apostles of Christ, had certainly spread through every place. Or if perhaps the devil, feigning himself an angel of God so that he could easily be heard, should appear from heaven preaching against these things, he would be known to be an adversary, and would be held an abomination. If then he ordered that the apostles of Christ, whose reputation for working signs and wonders was so illustrious, and an Angel from heaven, whom a spiritual nature could commend, should be anathematized if they taught otherwise than they had been taught by the apostle Paul, how much more those whom no testimony can commend for leading astray? And he repeats the solemn warning for this reason, to confirm them in the first tradition; for a law repeated makes the negligent more careful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
