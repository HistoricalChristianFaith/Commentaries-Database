[[commentary]]
quote='''
Then at last, with the defences of his peace, which surpasses every mind, may he guard your hearts in Christ Jesus. He said this for the reason that he who has peace with God does not fear any hostile mind; for everyone who loves God in Christ Jesus is safe by the peace of God. For who would not fear one whom he knows to be a friend of God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
