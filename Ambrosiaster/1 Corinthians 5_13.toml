[[commentary]]
quote='''
For those who are outside, God will judge. Above: Do not, he says, judge before the time (1 Cor. 4:5); here he does not forbid it. But above he forbade judging unknown things on suspicion, especially concerning a ruler, because it belongs to God alone to judge hidden things; in this place, however, he even commands that brother examine brother (2 Cor. 13:5), as he says in another place: Test yourselves, whether you are in the faith: prove yourselves (2 Cor. 13:5). But those who are outside will be condemned on the day of judgment, for the Lord said: He who does not believe is already judged (John 3:18). For he in whom there is no hope is to be held as dead.

Remove the evil from among yourselves. He still warns them to separate themselves from evil, both works and men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
