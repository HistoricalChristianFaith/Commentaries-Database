[[commentary]]
quote='''
Then I came into the regions of Syria and Cilicia. But I was unknown by face to the churches of Judea which were in Christ: they only heard that he who once persecuted us now preaches the faith which he once fought against: and they magnified God in me. He says this because, when he was defending Judaism against the faith, like these men by whom the Galatians had been overthrown, he was chosen by God and taught to dissociate himself from Judaism and to preach the new Law: so that those of the Jews who believed, whom he had formerly persecuted, rejoiced in him, giving thanks to God, who made a defender out of a persecutor; so that the Galatians might accordingly know that they had been circumvented, so as to profess themselves Jews under the name of Christ, circumcising the flesh of their foreskin, whereas the law of Christ commands something other than Judaism does; for there is circumcision of the flesh, here of the heart; there one serves under the elements, the new moons and the sabbath, here God alone in the spirit, because one believes with the heart; there the condition is the cause of sin, here liberty from the remission of sins. And so the distance is great.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
