[[commentary]]
quote='''
For have this mind in yourselves which was also in Christ Jesus, who, when he was in the form of God, did not think it robbery to be equal to God. Christ was always in the form of God, because he is the image of the invisible God. But the Apostle treats of the Son of God when, incarnate, he was made man, saying: Have this mind in yourselves which was also in Christ Jesus, that is, in God and man. Who, when he was in the form of God: living, of course, among men, he appeared by words and works to be God. For the form of God differs in nothing from God; for he was called the form and image of God for this reason, that it might be understood that he is not himself God the Father, but that he is what God is. He, then, did not think it robbery to be equal to God; for, knowing that he was in the form of God, he did not steal it when he said: I and the Father are one (John 10:30). And elsewhere in John's Gospel: Therefore, he says, the Jews persecuted Jesus, because he not only broke the sabbath, but also called God his own Father, making himself equal to God (John 5:18). Rightly, then, did he make himself equal to God; for he thinks to commit robbery who makes himself equal to one to whom he is inferior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
