[[commentary]]
quote='''
But then indeed, not knowing God, you served those who by nature are not gods. Since formerly they sinned through ignorance in serving idols, he indicates that they are readily forgiven, as Abimelech says to God in Genesis: Lord, he says, will you destroy an ignorant nation (Gen. 20:4)?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
