[[commentary]]
quote='''
"Therefore God handed them over to shameful passions. For their women exchanged natural use for that use which is against nature." This bears witness that these things came upon the human race from an angry God on account of idolatry, so that a woman, with disgraceful desire, would seek another woman for use. Some interpret this differently, not perceiving the force of the statement. For what is it to exchange natural use for that use which is against nature, if not, with the granted use taken away, to use things otherwise, so that one and the same part of each person's body, in relation to the opposite sex, offers itself for use in a way different from that which has been granted? For if it is that part of the body which they suppose, how did they alter the use of nature, since they do not have such a use given by nature? Above Paul had already said that they were given up to uncleanness, yet he had not shown the specific quality of the deed of uncleanness itself, which he now sets forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
