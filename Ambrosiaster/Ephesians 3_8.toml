[[commentary]]
quote='''
To me, the least of all the saints, this grace was given. He humbles himself when he calls himself the least, knowing that humility brings advancement. For he says that so great a grace was given to him that he asserts that this gift, which was unknown before in past ages, was granted to him, so that he might make it manifest to the Gentiles. For how can he seem the least of all the saints who, before he was baptized, was called the vessel of election? That I should preach the gospel among the nations, the inestimable riches of Christ (Acts 9:15). He proves that he was chosen to preach the gift of God in the incomprehensible riches of Christ, which he deigned to bestow on the Gentiles when they were already despaired of, so that they might be saved without works through faith. And it is plain that no one sends an excellent and very great gift by an unworthy person. Showing, therefore, how much he merits from God, he nevertheless humbles himself, so that his merit may grow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
