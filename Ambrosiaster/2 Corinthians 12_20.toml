[[commentary]]
quote='''
For I fear lest, when I come, I may find you not such as I wish. Since not all whom he rebuked in the first letter had yet amended themselves of the vices for which they had been reproved, he therefore wishes to appear as one who will come to them with authority, so that, frightened, they may be corrected, and he may find them such as he wishes. And I may be found by you not such as you wish. He says this so that they may show themselves such that they are in accord with the Apostle, so that they may rejoice together with one another. For he finds someone not such as he wishes who makes himself such as to be at discord with him. Lest perhaps there be among you contentions, rivalries, animosities, dissensions, detractions, whisperings, swellings, seditions. Now he mentions the errors which he reproved in the earlier letter, when, deferring to persons and preferring one to another, they were at odds with one another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
