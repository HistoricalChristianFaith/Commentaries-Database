[[commentary]]
quote='''
For an hour we yielded to subjection; that is, for an hour we submitted ourselves to slavery, humbling ourselves to the Law, so that, Timothy having been circumcised, the guile and the stumbling block of the Jews might cease. For they were ready, as is given to be understood, to stir up a tumult and sedition against him. For there was a cause by which they might have an opening for making a slanderous charge: for Timothy was of a Jewish mother but of a Greek father, whence it came about that as an infant he had not been circumcised according to the Law. But the Apostle, wishing to take him on in order to ordain him bishop, as he did (for all of that place, he says (Acts 16:2), bore him good witness), suffered the plots of the Jews. For they were spying out whether he would receive the uncircumcised son of a Jewish woman, preparing sedition; because, if he argued concerning the Greeks that they were not to be circumcised, just as a letter had also been given by the apostles on this matter (Acts 15:23 ff.), yet he would not forbid the sons of Israel to be circumcised, since the apostles had indicated nothing about them in that same letter; on whose authority the believing Jews raged all the more, because the letter itself did not forbid the Jews to circumcise their sons. Then, he says (Acts 16:3), taking him he circumcised him because of the Jews who were in those places. But concerning the Gentiles they took no offense, whence Titus was not compelled to be circumcised. For an hour, therefore, he yielded, that the truth of the Gospel might remain with the Gentiles, since they do not subject themselves to circumcision. But with the Jews the truth of the Gospel was not, because as believers they circumcised their sons; for in Christ Jesus neither uncircumcision nor circumcision avails anything, but faith working through love (Gal. 5:6).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
