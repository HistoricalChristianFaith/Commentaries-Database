[[commentary]]
quote='''
For you yourselves know, brothers, our coming in to you, that it was not empty: but having first suffered many things and been treated with insults, as you know, at Philippi, we made use of open freedom in our God, speaking to you the Gospel of God in a great contest. This affliction, which he now recalls (Acts 16:16 ff.), he suffered at Philippi with Silas on account of the spirit of divination which he had cast out of a girl, as has already been said in its place. He did not yield to this affliction, but was found the stronger, since he dares to preach and does not fear to speak, in the hope, of course, of the promised reward; so that these too might be secure in persecutions, rejoicing on account of the wage to come. He says, therefore, that this is the sign of a devoted and faithful preacher: if in affliction he does not fear to speak the word of God; and he signifies that man to be empty who, through present terror, is seized with dread of preaching. For he who is secure about the promised hope does not yield, so that he may be crowned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
