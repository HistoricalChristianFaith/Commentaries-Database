[[commentary]]
quote='''
The grace of our Lord Jesus Christ be with you. My love be with you all, in Christ Jesus. He put such a signature for this reason, on account of those who, while they were eager for dissension, did not love the Lord Jesus; seeing that they said: I am of Paul, I of Apollos, but I of Cephas (1 Cor. 1:12). For he who loves Christ does not give glory to men, because there is no hope in men. The grace of our Lord Jesus Christ be with you; and it is understood: you who love the Lord Jesus. And since they did not love one another, therefore he says this: My love be with you all in Christ Jesus; so that they might learn to love one another with that grace with which they were loved by the Apostle, not with the affection of the flesh, but in Christ Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
