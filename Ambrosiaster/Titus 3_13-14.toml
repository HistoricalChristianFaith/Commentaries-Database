[[commentary]]
quote='''
Send ahead Zenas the expert in the Law and Apollos with care, that nothing may be lacking to them; and let ours also learn to take the lead in good works for necessary uses, that they may not be unfruitful. Each is a man distinguished in wisdom and in works; and therefore he bids that the necessary provisions be given them by those who had believed, so that they might refresh them; because it was right that those who handed on spiritual things should not lack carnal things. For although he calls Zenas an expert in the Law, yet Apollos was perfect in the Scriptures; but because Zenas had been of this profession in the synagogue, he calls him so.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
