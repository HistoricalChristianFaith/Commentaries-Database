[[commentary]]
quote='''
Or do we rival the Lord Jesus? Are we stronger than he? It hardly happens that a lowly man is jealous of a powerful one; for he knows that the thing for which the other can be envied does not belong to himself: but one envies either an equal or a near-equal. Therefore the Apostle said that men cannot rival the Lord Jesus, because they know him to be the Lord: otherwise, he of whom they are jealous, lest he be Lord, will not seem to them worthy to be called Lord. For it was out of jealousy that Satan invented idolatry, so that men, by denying that God is Lord, might serve idols as gods and lords.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
