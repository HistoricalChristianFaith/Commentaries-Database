[[commentary]]
quote='''
QUESTION ABOUT ELISHA: DID HE OBTAIN WHAT HE IS SAID TO HAVE ASKED TOO HARSHLY OF ELIJAH? — Elisha, eager in spirit for performing miracles and enticed by the example of his master, when he received the permission to ask for whatever he wished, greedily for good things requested that the spirit be present in him in double measure compared with what it was in his master. To him the man of God Elijah said, “You have asked a hard thing.” For in his eagerness he did not consider that the disciple is not above the master (Matt. 10:24). Yet Elijah, knowing that he had not asked this out of ambition for present glory, replied: “Nevertheless, if you see me taken from you, it shall be so for you.” (2 Kings 2:10) This meaning must be weighed carefully. Having first said with some displeasure, “You have asked a hard thing,” he added, “Yet if you see me taken up, it shall be so for you,” and therefore he did not seem to have refused him. He showed that it would be so for him as was fitting, not as he himself had requested. For Scripture intends many things to be understood completely, so that the sense gathered from the words may not be contrary to the rule of religion. Indeed, such a hard request ought in justice to have lost its reward; but because he desired the good so earnestly, God, who knows what should be given to each person, did not allow him to be deprived of the merits of his good intentions. Let us therefore see whether the merit of Elijah would allow that Elisha should deserve to receive a double portion of his gift. For it was said by the Holy Spirit through Zechariah what the merit of John would be: “He shall go,” he says, “in the spirit and power of Elijah” (Luke 1:17). He therefore shows John to be equal to Elijah. And the Lord says, “Among those born of women there has arisen no greater prophet than John the Baptist” (Matt. 11:11). He did not say, “He is greater than all,” but, “No one is greater than he”; that is, he has an equal, but he has no superior. Elijah therefore is equal to him, certainly not lesser than he; how then is Elisha greater than Elijah, when John, than whom no one is greater, is equal to Elijah? For when Elisha came to the crossing of the waters, he did not receive honor from them so as to be able to cross, unless he invoked the God of Elijah (2 Kings 2:14); so that by this his hard request might appear corrected, since he was heard only in the name of Elijah, lest he be thought to have obtained what he had asked too harshly, as though the dispensation of the Spirit granted to Elijah were not sufficient for the merit of that time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 26: DID ELISHA OBTAIN WHAT HE ASKED TOO HARSHLY OF ELIJAH?"
