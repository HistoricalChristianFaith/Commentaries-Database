[[commentary]]
quote='''
For it is not that there should be relief for others, but distress for you. It is true, for one should give in such a way as not to cause want to the givers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
