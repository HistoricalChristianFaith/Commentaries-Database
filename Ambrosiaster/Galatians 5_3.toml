[[commentary]]
quote='''
And I testify to every man who circumcises himself that he is a debtor to do the whole Law. Some can keep the Law to some extent and not be circumcised: for many of the Romans in Judea kept the Law while uncircumcised. Hence the apostle Paul says to Agrippa, king of Judea: I know, King Agrippa; you believe the prophets, I know that you believe (Acts 26:27). And the centurion, whose slave was about to die, who sent to Jesus asking him to come and heal his slave; to whom the Jews bore witness, saying to Jesus: He is worthy that you should do this for him; for he loves our nation, and he himself built the synagogue for us (Luke 7:4–5). Yet no one who is circumcised fails to keep the whole Law; for he is a debtor, because the Law was given to the circumcised. He said this because they were showing themselves so dull that they deserved to carry all the burdens of the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
