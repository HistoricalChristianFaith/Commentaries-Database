[[commentary]]
quote='''
But now made manifest through the illumination of the coming of our Savior Jesus Christ. He testifies that the gift of God, which before the ages of time lay hidden in mystery, was made manifest by the incarnation and coming of Christ, when men began to receive the remission of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
