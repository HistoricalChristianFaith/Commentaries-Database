[[commentary]]
quote='''
For in whatever I boasted about you, I was not put to shame. Before Titus went to the Corinthians, he heard from them, that is, from the Apostle and those who were with him, that the Corinthians had a good will toward amending their vices; and therefore, when he returned and reported the same things, the Apostle was certainly not put to shame, but was made glad, because Titus had found it no otherwise than he had heard from them.

But as we have spoken all things to you in truth, so also our boasting before Titus has become truth. The Apostle writes these things exulting in spirit, rejoicing in them in such a way as to prove their effectiveness as true as his preaching to them also is, at least in rebuke. For the truthfulness of the one who reproves is seen to be manifest precisely then, if those who are reproved begin to amend themselves; for while those who are rebuked are changed, they bear witness to the one who reproves them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
