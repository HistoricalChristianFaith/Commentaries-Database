[[commentary]]
quote='''
Again I returned to Damascus, but I saw none other of the apostles, except James the brother of the Lord. He saw James at Jerusalem, because he had been appointed bishop there by the apostles; he too had formerly been an unbeliever, as the Evangelist says: For not even his brothers, he says, yet believed in him (John 7:5). This James was the son of Joseph, and was called the brother of the Lord for this reason, because Joseph his father was also named the father of the Lord. For so Mary says to Jesus in Luke's Gospel. What have you done to us, son? I and your father were seeking you, sorrowful and sad (Luke 2:48). And in John's Gospel Philip says to Nathanael: Him of whom Moses wrote in the Law, and the prophets, we have found, Jesus from Nazareth, the son of Joseph (John 1:45). In this way, then, the Lord was called the brother of James and of the others, in which he was also named the son of Joseph. For some, led by madness, contend with impious assertion that these were the true brothers of the Lord, born of Mary, while they say that Joseph was called his father without being his true father. For if these were truly his brothers, Joseph will also be his true father; because the one who called Joseph his father also called James and the others his brothers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
