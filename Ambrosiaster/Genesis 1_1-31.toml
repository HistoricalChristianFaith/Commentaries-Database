[[commentary]]
quote='''
ON GENESIS. — In the beginning God made heaven and earth (Gen. 1:1). If He made heaven in the beginning, and the earth, and if heaven is the firmament, as is evident in what follows, then this is not literally true, because light was made first, and therefore the firmament: for it could not signify some other heaven, since it is describing the making of the world as perfected by the working of God. For this reason, because people were misled by various opinions about the cause of the world, Moses, inspired by God, showed what the true ordering of the world was. To some it seemed that it had no beginning; to others that it did have a beginning, but was fashioned by certain Angels; to others again that it was likewise made, but by a certain Saklas, who is also the god of opposing power; but a few, following the path of truth concerning its origin, asserted that God was its maker. Therefore, because of those who were drawn away by false opinions of diversity, Moses was compelled to show what its true cause was, lest the children of Israel, freed from the power of the Egyptians, should still not be released from their false understanding. For they, more than the rest, pursued the study of error: for in ancient times they above others devoted themselves to vain philosophy. Indeed Moses, because he was adopted by Pharaoh’s daughter, is said to have been taught in all the wisdom of the Egyptians (Acts 7:22). What then is the meaning of his words, In the beginning God made heaven and earth? If it signifies the firmament, according to what we showed above, let us see what he says. We think that Moses, so as to remove all error about the lower creation and about the materials of the world’s construction, indicated that in the beginning the very substances from which the world is constituted were made; for if he had kept silence about this, they might perhaps be thought to be eternal substances, considered to be yoked to God. So that the one who receives testimony about this matter cannot doubt that the world was made, since he confesses that the substances which served for the expenditure of the world were subjected in the beginning. Therefore, In the beginning God made heaven and earth, that is, the upper and the lower substance. The upper is that from which heaven consists; the lower, however, is a certain thick dreg-like concretion which advanced into the dry land that is called earth, and into darkness. Therefore He says in the prophet Isaiah, I am God, who made light and created darkness (Isa. 45:6–7). When these were created, He made at the same time the substance, that is, water, darkness, and earth before times: for times are under the firmament. For the firmament, as some think, is the ice of the waters. And it is therefore called firmament, because the waters, being solidified by divine power, are made firm, which, from covering or concealing, is called heaven. And therefore, because water is the greater element, it is mentioned first, since a part of it advanced into the vault of the world. The earth, however, is the pavement: which indeed David, by the Holy Spirit, confesses to have been created. For he says, And the waters that are above the heavens, let them praise the name of the Lord. For He Himself spoke, and they were made; He Himself commanded, and they were created (Ps. 148:4–5). After these elements, before the joining together of the world, God made light, so that His works should go forth in the light, which light, by a fixed arrangement, completed the course of the day. Night came to be according to the measure of the day, which likewise, when the measure of its span was fulfilled, was illumined by the coming of the morning light: and therefore the first day was completed when the second began; for the night is reckoned to the day, so that together they are called one day: for because darkness is subject to light, it lacks authority and cannot make up a number. For thirty days are called one moon, even though nights are included with them. Therefore the service of light, by which it uses up the space assigned to it, is called day. But the substance of darkness, before it is illumined, is called night. And that space which is between the setting and the rising is night. For it is not darkness that makes the night, just as it is not light that makes the day, because darkness remains in its own nature. The coming of light makes day, and its departure makes night. Not without reason, therefore, is the night subject to the day. So, when light was made, and the course of twelve hours completed, and likewise the space of the night of twelve hours also passed, there was an equinox on the first day: and from then the day began to grow longer than the night, namely throughout three months, which are the spring season. From that increase the day then diminishes through three other months, which are the summer season. And again there is an equinox, so that from then the night grows longer than the day through another three months, which are the autumn season. And again the night, from the greatness by which it surpasses the day, begins to diminish until the end of the fourth season, which is winter. And the equinox returns to the first season, when God created the world, which day is understood to be the eleventh day before the Kalends of April, when the first day of Passover is, that is, the first day of the first month. For in the Law it is commanded that on the tenth day of the first month in the evening they should prepare themselves to celebrate Passover on the fourteenth day of the month, that is, from the eleventh. For already the evening of the tenth day shines into the eleventh, so that from the eleventh day before the Kalends of April the beginning of the first month should be. For at the beginning the moon was made on the fourteenth, because all things were made full. Add three days from the evening of the tenth, and these are the three days before the luminaries that were made, so that the world was made on the eleventh day before the Kalends of April; for the number of the moon from the eleventh comes to the fourteenth, to which the first month of Passover in its entirety is assigned, so that on the solemn day of Passover it should be neither beyond the eleventh day before the Kalends of April, nor beyond the fourteenth moon, because the world was made on the eleventh, and on the fourteenth the moon was made brighter with greater light. Between the beginning, therefore, and the brightness with which the world was illumined, our Savior both suffered and rose again; for He suffered on the fourteenth moon, and rose on the first day, which is therefore called the Lord’s Day, because the Lord Himself made it, who made the multiplied months, and the seasons, and the years. And so that it might never be celebrated in exactly the same way, the course of the moon in its wanings and waxings brings this about. But the earth was invisible and unformed. It is clear that the earth, after it was made, was invisible and unformed: for it was covered by waters, and therefore was invisible; and it was unformed because, being fluid, it was not suitable for cultivation. And darkness was upon the abyss. He says that darkness was upon the abyss, that is, upon the boundless water on every side. And the spirit of God was borne above the water (Gen. 1:2). This water he signifies as the extremity, above which the spirit of God, because it was borne above it, shows that the darkness was upon the infinite depth. As for the spirit of God above the waters, since where the spirit of God was, there was no obscurity, it illuminated the water as far as it could. But it could not illuminate the abyss, that is, the immense depth: that is, it illuminated the higher waters, and beneath there was darkness, and over the abyss. He therefore calls this the spirit of God not because he wishes this to be understood as the Holy Spirit, but because he wishes it to be understood spiritually over the material creation, and by calling him the spirit of God who was moving above the waters, he signifies that he is wholly of God, so as to overturn the perverse assertion used by some, who say there is something that is not of God. For it is neither orderly nor reasonable that the Holy Spirit should be said to have been over the waters, since he is over all creation. For whatever is of God is above all powers and principalities and likewise above all spiritual powers. Nor should anyone’s mind be disturbed because he is called the spirit of God, when it is established that all things are God’s. For God, among other things when he was about to make the flood, says: My spirit shall not remain in these men, because they are flesh (Gen. 6:3); and in Ezekiel, among other things: Therefore says the Lord to these bones, I will spread skin over you, and I will give my spirit in you, and you shall live (Ezek. 37:5). Do these things belong to the office of the Holy Spirit, and not to the soul? Therefore this spirit of God is indeed, like the rest, but is the governor of material substances; for his appointed order is to preside over these. When light was made, and the course of day set in order, and the second day completed, he made the firmament, that is, heaven, so that the light in the earth of the firmament might govern the day, so that it might be as a lamp in a house. This firmament, I say, was made from the aforesaid substance of water. For now the world is being joined together in form, so that from the confusion of things, with substances distinguished, individual parts might be fitted which would contribute to the members of the world. For the substances which we said were first made are expended upon the world. And therefore it is called “world” (mundus), because the things that were mixed together, once separated from one another and brought into form, made it called “world,” to whose structure they contributed. Therefore the firmament, that is, heaven, was made in the midst of the waters, so that it might divide between the water that was above the firmament and the water that was below the firmament; so that by God’s power the firmament might stand in the midst of the waters, having water beneath itself, and within itself, and above and around itself; so that it might be concave on the outside and fortified within, lest the waters, whether inner or outer, should penetrate its concavity, so that it might be as a house fortified and strengthened, that those dwelling in it might be secure. On the third day he commanded the water that was under heaven, that is, within the capacity of the firmament, to be gathered into one place, so that the dry land, which is the earth, might appear, and therefore it came to pass. For the breadth of the earth having been drawn out, there was made as it were a basin, in which all the water that was within the firmament might be sunk down, and the dry land appeared. When the water receded, it was necessary that the earth, made visible, should appear, which before had been invisible. Then the dry land was called earth, and the gatherings of the waters seas. And he commanded the earth to bring forth grass for food, and fruit-bearing trees for seed upon the earth. Then on the fourth day God commanded luminaries to be made in the firmament of heaven, that they might shine upon the earth: the greater luminary at the beginning of the day, and the lesser luminary at the beginning of the night, and the stars. These relate to the conception and birth and nourishment of those things which are begotten in the world, and to the signs of seasons needed for fixed intervals, and also to the adornment of the whole world. For just as it belongs to the adornment of a house if its ceiling has panels marked with gold, so also the stars, shining with diverse light, provide adornment to the world. Therefore to the light which was first made, the brightness of the sun is added, so that these are joined and inseparable. And to the night, which was dark, a luminary is given; and because the moon was at the fourteenth day when it was made, therefore he says, The lesser luminary at the beginning of the night: for when it was made, it shone the whole night. From the part, therefore, it is said “at the beginning of the night,” because it does not always shine in the evening. But the greater luminary, which we call the sun, remains at the beginning of the day, because it was compacted together with the prior light. For three days the world existed without these luminaries; for as yet there were not those for whose benefit their functions would serve. But when the earth brought forth grass for food and fruit-bearing trees, there was need of things that would nourish or preserve what had been brought forth. Because all generation of these is completed through their intervention, it was not fitting that these should be made first, lest, by the effect of those things produced from the earth, they should be thought to have arisen; but he made those first, so that therefore these might be without doubt understood to have been made without them. Then on the fifth day he commanded the waters to bring forth creeping things of living souls, and winged creatures flying over the earth beneath the firmament of heaven, and it was so. And among other things, And God saw, he says, that they were good, and he said, Increase and multiply (Gen. 1:21–22). He added, And God saw that they were good, because some say they are evil, so that at least in this way they may feel shame. For when they please God and their maker, surely they ought to displease no one. For fools are accustomed to say, Therefore, they say, he saw, and they pleased him, because previously he did not know. O dull ones, how could He not know? Whatever He willed came forth. Can anyone will what he does not know? And can He who is able to act be said not to know what He is doing? And what is more, He did not make them Himself, but commanded that they be made; and is He who commands not possessed of the power to make? But because all things are possible for Him, when He commanded that what could not do so should begin to be able, it was in order that it might contribute to His praise. There is therefore a double power, that He should command what is insensible to bring forth what is sensible. On the sixth day He commanded the earth to bring forth living soul, quadrupeds, and beasts of the earth; and so it was done, and they were brought forth. And God saw that they were good, and very good, because all are necessary. On the day mentioned above, therefore, God said: Let us make man in our image and likeness, and, He said, let him have power over all things that have been made upon the earth (Gen. 1:26). First indeed God made the substances out of which He would frame the world; when it was compacted, adorned with all its embellishments, and furnished with what was necessary, He then made man, who would enjoy it and all that is in it. For whereas He had commanded that everything on earth should be brought forth from water and earth, yet when He made man, He is described as having taken clay of the earth in His hands, so that He might teach how greatly man differs from the things He had already made. He wishes it to pertain to the honor of man that he is described as being made by the hands of God, and made in the image and likeness of God, that is, of the Father and the Son. What it is to be in the image and likeness of God, although we have said elsewhere, yet this place and its occasion require that we say it again. The words are from the Father to the Son, saying, Let us make man in our image and likeness: although in the work the person of both is understood, of Him who speaks and of Him who hears. This then is the image of God in man, that one man was made as it were a lord, from whom the rest would arise, having the dominion of God as His vicar; for every king bears the image of God. Therefore woman was not made in the image of God. Therefore it says, And God made man; in the image of God He made him. Therefore it is that the Apostle says, A man indeed ought not to cover his head, because he is the image and glory of God; but the woman covers it for this reason, because she is not the glory or image of God (1 Cor. 11:7). The likeness of God in man is this, that just as from the Father is the Son, so from man is woman. In this plainly there is a difference, because she was made, whereas He was born. Yet to some it seems that God made all things at once. For, they say, if He made by His word, why is it not said that He made everything at once? For it is the custom among men to believe that things are made in stages. For the power of God it seems more fitting if it is said that He made all things in one day. However, we see great providence in this work and order. For He could certainly have made all things together; but diverse reason forbade it, and with all these matters set apart, faith must be given to divine Scripture, which says, and often says, For in six days, it says, the Lord your God made heaven and earth, the sea and all that is in them (Exod. 20:11). First then, they ought to have been made in such a way that they might feel and know that they had been made: for when they did not all see themselves at once, but one today, another tomorrow, they recognized that they are contained in a beginning, and in no way could they suspect eternity, since they recognize each other in parts. For if all things had existed at once, there would be no sense of weakness for them, but they would think that they had not begun. For those things which suddenly exist all together by the word of God do not feel themselves being made, unless they see something before themselves and something after themselves. And lest that which was made first might think itself unmade, by seeing greater things made after itself, it believes of itself what it has seen in the other that is nobler. Finally, the light which is called day has before itself heaven and earth, that is, water and dry land. But when water itself and dry land and the confused darkness had been made, they could not claim eternity for themselves, because none of these dared to claim for itself fixedness and identity. Again, the sun and moon, though they are most bright, have many things before them. Therefore it was brought about that the greater things are later, and the earlier lesser things, when they see each other, none of these claims eternity for itself. Furthermore, the work completed in six days contains within itself the whole age of the world, so that the works of six days have the figure of six thousand years: because what in each age was going to happen is contained in order in the works of the six days; for instance, because in the earlier ages there was not going to be such great knowledge of God upon the earth, the earlier days appear without splendor; and that cattle were made before man, because our forefathers, uncultivated and rural, were going to live in the manner of cattle; but that man should be made on the sixth day, this event was brought about because in the sixth millennium of years the coming of Christ made man so that he should not be subject to death. And that man should be the image of God, because by God’s gift he would be conformed in image to the Son of God, as the apostle John says, We know, he says, that when He shall appear, we shall be like Him (1 Jn. 3:2). And the Vessel of election: being conformed, he says, to the image of the Son of God (Rom. 8:29). Moreover, the tree of life which was set in paradise was the image of God’s future grace, which is the body of the Lord; whoever eats it will live forever. For the tree of the knowledge of good and evil signifies that the Law was given through Moses, which, when it made sin known that previously lay hidden, gave the knowledge of good and evil. For it showed what was good and what was evil. And as to the fact that on the seventh day He rested from His works, this signifies that, once the sixth millennium of years is completed, in the seventh millennium He will rest, with the world ceasing from all secular work. We have said these few things out of many, so that we might open a path for understanding according to what we have shown above.
'''
