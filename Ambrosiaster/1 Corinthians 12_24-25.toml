[[commentary]]
quote='''
But God has tempered the body, giving more abundant honor to that which lacked it, so that there may be no schism in the body, but the members may be solicitous for one another. He says that the human body has been so regulated by God that all its members are necessary, and for this reason are solicitous for one another, because one cannot exist without the other: and what is thought lower is more necessary; as has also been expounded, or argued, concerning the brethren, that no one ought to be despised as useless.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
