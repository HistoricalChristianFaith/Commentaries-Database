[[commentary]]
quote='''
The grace of our Lord Jesus Christ be with your spirit, amen. Since questions arise about the person of the Savior, here, to affirm the solidity of the divinity in him, he wishes for the protection of his grace upon our spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
