[[commentary]]
quote='''
We are Jews by nature, and not sinners from the Gentiles. But knowing that a man is not justified by the works of the Law, except through the faith of Jesus Christ, we too believe in Christ Jesus, that we may be justified by the faith of Christ, and not by the works of the Law. By a manifest argument he shows that they had been deceived into keeping the Law, in which no one is justified before God, since those very men who are Jews by nature, wishing to be justified, leave the Law and flee for refuge to the faith of Christ. Since by the works of the Law no flesh is justified. He says that no man has been justified by the works of the Law; for whoever are righteous have been justified by faith, as Abraham and Isaac and Jacob and the other saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
