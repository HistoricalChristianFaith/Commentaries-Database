[[commentary]]
quote='''
For it is written: Rejoice, barren one, you who do not bear; break forth and cry out, you who are not in labor; for many are the children of the deserted one, more than of her who has a husband (Isa. 54:1). He says that this earthly Jerusalem has a husband, because she bears according to the flesh; but that heavenly Jerusalem, which he calls our mother, he calls barren, because she does not bear according to the flesh, nor suffer pains, that is, she is not in labor. But she bears spiritually, without suffering, crying out in joy; for, once deserted (and by whom, if not by Adam, who deserted life and followed death), she now has more children than this one who has a husband, that is, who bears carnally. For Christians are many more than the Jews, as is said in the Apocalypse: And I saw a great crowd, which no one could number, from every tribe and nation (Rev. 7:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
