[[commentary]]
quote='''
For the grace of God our Savior has shone upon all men, instructing us that, denying impiety and worldly desires, we should live temperately and justly and godly in this world. He says that the gift of God has shone upon men through Christ, that is, the truth of the one God made manifest in Christ: that with a godly profession we should proclaim the Creator in the unity of the Trinity, which before was hidden from the human race, but has now shone forth by the mercy of God; so that, avoiding the darkness of error, that is, fleeing the ignorance and impiety of worldly men, we may be found godly towards God the parent of all, professing him in the truth which the Gospel of his Son hands down; and that we may be able to have the reward of this, let us do good works. For just as there is no hope for him who proclaims the Father alone, if he does not profess the Son also in the same truth, so too the hope of him who has only the profession of faith without good works is in vain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
