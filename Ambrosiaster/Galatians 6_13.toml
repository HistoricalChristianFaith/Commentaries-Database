[[commentary]]
quote='''
For not even those who are circumcised keep the law; but they want you to be circumcised, so that they may boast in your flesh. This is like that which was said to the apostle Peter: If you, though you are a Jew, live like a Gentile, how do you compel the Gentiles to judaize (Gal. 2:14)? So these too, though they themselves did not keep the law, living unrighteously, were zealous for circumcision, so that they might thereby seem avengers and lovers of the law: whereas it is plain that he defends and keeps the law who carries out its righteous requirements, and does not pass over the commandment which was given as pertaining to life. Such, then, was the excuse of the Galatians. He says these things so that at least in this way they may understand that they were being mocked as fools and dullards, over whose pains those men boasted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
