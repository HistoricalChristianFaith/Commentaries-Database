[[commentary]]
quote='''
So also will be the resurrection of the dead. He gives examples so that there may be no doubt that the resurrection of the dead will take place; so that, the reason having been grasped, no one may hesitate. It is sown in corruption, it will rise in incorruption. To sow is to bury, so that it decays; but to rise in incorruption is that, once raised up, it can no longer decay, but has the brightness of immortality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
