[[commentary]]
quote='''
THE APOSTLE PETER SAYS, “CHRIST DIED FOR YOU” (1 Pet. 2:21). BUT THE APOSTLE PAUL DECLARES THAT HE ALSO DIED FOR HIMSELF: “HE BECAME OBEDIENT UNTO DEATH; WHEREFORE GOD HAS GIVEN HIM A NAME WHICH IS ABOVE EVERY NAME” (Phil. 2:8–9). IF THIS IS SO, HE WOULD APPEAR TO HAVE BEEN IMPERFECT, SINCE HE GAINED INCREASE THROUGH HIS WORKS. — No believer doubts that the Son of God was born perfect from God. For in being born of God the Father he received all the fullness of the Father’s divinity. Then, at that moment, he received the name that is above every name, that is, that he should be called what the Father is: God. For nothing is said to be future for him; he has all things before himself. Therefore he was born for the creation and restoration of all these things. Indeed, proper order and reason require that every knee should bend to the paternal name. The Father gave this to the Son on account of what he was going to do; yet he gave it when he begot him. For he begot him in such a way that he should be in the same honor in which the Father himself is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 64: CHRIST DIED FOR YOU, YET RECEIVED THE NAME ABOVE EVERY NAME"
