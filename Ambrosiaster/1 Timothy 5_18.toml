[[commentary]]
quote='''
For Scripture says: You shall not bridle the ox that treads out the grain (Deut. 25:4); and: The workman is worthy of his wage (Luke 10:7). The wage of one who preaches the kingdom of God must be such that by it he is neither saddened nor puffed up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
