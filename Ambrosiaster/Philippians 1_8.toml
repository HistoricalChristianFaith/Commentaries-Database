[[commentary]]
quote='''
For God is my witness, how I long for you all in the bowels of Jesus Christ. He calls God to witness in order to commend the affection of a righteous man; for one who feels much about someone testifies, to make it credible: and by this he also provokes their longing toward himself, so that those who are longed for may long in return. He longs, then, for all of these not with human desire, but in the love of Christ; not with the affection of the flesh, but of the spirit; so that he may have them as partakers in the understanding of the mystery both of the divinity and of the incarnation of our Lord Jesus Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
