[[commentary]]
quote='''
The cloak (paenula) that I left at Troas with Carpus, bring with you when you come, and the books, but especially the parchments. The Apostle was a Jew by nature, and had nothing foreign about him. Whence, then, did he have a cloak? But because he was from Tarsus, whose people are known to have been received into alliance with the Romans, so that thereafter they were called Roman citizens, for that reason they must also have had a curia, into which they would assemble wearing the paenula after the manner of the Romans. For whoever at that time had gone out with gifts to meet the Romans were granted perpetual immunity and were called Roman citizens and their brothers, as the same Apostle bears witness. It may therefore be that he had a cloak, if not his own, since he had given himself wholly to the Law, then his father's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
