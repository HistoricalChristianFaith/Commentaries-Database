[[commentary]]
quote='''
WHY DID THE SAVIOR PAY THE DIDRACHMA ONLY FOR HIMSELF AND PETER, AND NOT ALSO FOR THE OTHER APOSTLES (Matt. 17:26)? SINCE THEY HAD ALL FOLLOWED HIM AFTER LEAVING ALL THEIR POSSESSIONS, HE SEEMS TO HAVE OWED PAYMENT FOR ALL. — ... But when the Savior orders it to be given for himself and Peter, he appears to have paid for all: for just as all were contained in the Savior because of his office as Master, so after the Savior all are contained in Peter. He appointed him to be their head, that he might be the shepherd of the Lord’s flock. For among other things he says to the disciples, “Watch and pray, that you may not enter into temptation” (Matt. 26:41). And to Peter he says, “Behold, Satan has asked to sift you like wheat; but I have prayed for you, that your faith may not fail; and when you have turned back, strengthen your brothers” (Luke 22:31–32). What doubt can there be? Was he praying for Peter and not for James and John, to say nothing of the rest? It is clear that all are contained in Peter: by praying for Peter, he is recognized to have prayed for all. For it is always in the leader that the people are either rebuked or praised. For in another place he says: “I pray for those whom you have given me, Father; and I will that where I am, they also may be with me” (Jn. 17:9, 24).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 75: WHY THE SAVIOR PAID THE DIDRACHMA ONLY FOR HIMSELF AND PETER"
