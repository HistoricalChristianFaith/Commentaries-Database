[[commentary]]
quote='''
But I say, walk by the spirit, and you will not fulfill the desire of the flesh. After he has forbidden them the law of works, in which there are carnal precepts, he now commands them to restrain themselves from the vices of the flesh. For he walks by the spirit who flees sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
