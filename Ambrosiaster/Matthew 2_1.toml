[[commentary]]
quote='''
If all things have been made with reason, why is it that the Savior is said to have been born on the eighth day before the Kalends of January? — No one can be so dulled as to deny that God does all things with reason. Therefore Christ, descending from the heavenly seats to grant salvation to the world, also wished to teach the world itself and the seasons which he had established. He chose to be born as a man at that time when, after a great decrease, the light which is day begins to increase again, so as to turn the decline of the human race into growth in God: that the time of his birth might reasonably agree with the divine teaching, which, from the shadow of death, began to multiply men unto life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 53: WHY THE SAVIOR WAS BORN AT THE WINTER SOLSTICE"
