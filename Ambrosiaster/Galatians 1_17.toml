[[commentary]]
quote='''
Nor did I come to Jerusalem to my predecessors the apostles, but I went away into Arabia, and again I returned to Damascus. He says that, having been chosen by God, he was under no necessity of going to his predecessors the apostles, so as perhaps to learn something from them; because God revealed to him through his Son how he should teach. He says this to show that nothing else is to be held than what he teaches, and that men are not to be believed, but God, from whom he testifies that he learned; and by this that those who had led them into the Law were false teachers, because what they taught had not been handed down by God. From Damascus, then, he set out into Arabia, to preach, where none of the apostles was, so that he himself might found churches there, lest, with false apostles creeping in, Judaism should be sown. And from there he again returned to Damascus, to visit those to whom he had preached the Gospel of the grace of God as a novice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
