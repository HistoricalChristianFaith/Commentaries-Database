[[commentary]]
quote='''
But that no one is justified in the Law before God is manifest; because the righteous lives by faith (Hab. 2:4). And therefore he teaches that one must withdraw from the Law, lest the righteousness sought through faith be lost. But the Law is not of faith, but he who does them shall live in them (Ezek. 20:21). The Law is not of faith, because it commands nothing to be believed. For all its precepts are manifest, so that one who keeps the Law may live; if not, he must be punished, because he committed what he knew was to be avoided. It may be objected from the opposite side, and said: If no one is justified in the Law, why is it that he who passes over anything of the Law is cursed? It is true that no one is justified through the Law, but that is before God; he is, however, justified before the world, so that he may be secure in the present life. But if he wishes to be justified before God, so that it may profit him toward merit on the day of judgment, let him follow the faith of God; otherwise, though secure here, he will be guilty in the future. The Law therefore profits, but that which was written on the tablets; for the rest, as he said, were given to be a burden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
