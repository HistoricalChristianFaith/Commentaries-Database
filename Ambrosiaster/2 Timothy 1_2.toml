[[commentary]]
quote='''
And he writes this to him as to a dearest son so that he may become an imitator of this thing, handing on the same things to others; so that through the transmission of successions there may be an unfailing fit teacher, through whom the truth, once asserted, may win many to the promised life. Grace, mercy and peace from God the Father and Christ Jesus our Lord. He wishes for him the grace of the Father in mercy, that it may be present to him; and that of Christ Jesus our Lord, because God bestows his grace through Christ; so that the grace of both is one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
