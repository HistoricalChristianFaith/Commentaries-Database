[[commentary]]
quote='''
Effective presbyters should be rewarded not only with sublime honor but with earthly as well, that they not be burdened with poverty.
'''
source_url=''
source_title="COMMENTARY ON THE FIRST LETTER TO TIMOTHY"

[[commentary]]
quote='''
This is what he says in another epistle too (1 Tim. 5:17), that presbyters who labor in the word of teaching are to be honored with double honor. For one who suffers want may grow reluctant to carry on an exercise that profits the hearers. For what does it profit to have honor without fruit? Or what great thing is it to offer carnal things to him who bestows spiritual things? For as riches beget neglect of salvation, so poverty, while it seeks to be filled, turns aside from righteousness. Hence Solomon asks to be made neither too rich nor needy (Prov. 30:8).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
