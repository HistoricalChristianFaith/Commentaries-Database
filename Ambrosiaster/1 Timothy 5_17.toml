[[commentary]]
quote='''
This is what he says in another epistle too (1 Tim. 5:17), that presbyters who labor in the word of teaching are to be honored with double honor. For one who suffers want may grow reluctant to carry on an exercise that profits the hearers. For what does it profit to have honor without fruit? Or what great thing is it to offer carnal things to him who bestows spiritual things? For as riches beget neglect of salvation, so poverty, while it seeks to be filled, turns aside from righteousness. Hence Solomon asks to be made neither too rich nor needy (Prov. 30:8).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"

[[commentary]]
quote='''
Let the presbyters who rule well be held worthy of double honor: especially those who labor in the word and teaching. Good and faithful stewards ought to be judged worthy not only of exalted honor but also of earthly honor, so that they may not be saddened by want of means, but rather rejoice in their faith and teaching. For he becomes more earnest if he is not humbled by poverty: and authority grows in him when he sees that even in the present he receives the fruit of his labor; not so that he may abound, but so that he may not be in want.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
