[[commentary]]
quote='''
For if we examine the matter more fully, we shall show that those who are now righteous were previously unrighteous, but, having applied themselves, they were changed. For Abraham himself is read to have been justified by faith (James 2:23 and Rom. 4:3). Therefore, before this he was not righteous, since he is understood to have worshipped idols under the guidance of his father. And Zacchaeus too, to whom after a common sort of life the Lord bears witness (Luke 19:9). And the vessel of election, who also admits this, saying, “We too were by nature children of wrath, like the rest” (Eph. 2:3); because the will yields superiority over nature. For one is judged by the will, not by nature. Without doubt all the martyrs and the righteous became good; for they were not born faithful, but reborn. And how many do we know to have lived a shameful life, extravagant devotees of luxury, who are now self-controlled and holy? For when the fear of God draws near, the vices that once ruled are overcome.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 115: CONCERNING FATE"
[[commentary]]
quote='''
In which we too once had our way of life in the desires of our flesh, doing the will of the flesh and of its counsels: and we were by nature sons of wrath, even as the rest. He signifies faithlessness when he mentions the desires of the flesh. For the will of the flesh is to take delight in visible things, so that it calls gods the elements which God established as the helms of the world; whereas this name is owed to the one God, from whom are all things, so that just as he has no partner among these in power, so he may have no sharer in the name. But this name is not denied to Christ for this reason: because just as their nature is common, so too will the name be. Yet there is this difference between the Father and the Son, that the Father received this from no one, while the Son received all that is the Father's through generation, so that in power and substance and name the Son differs in nothing from the Father. Hence he says: All things that the Father has are mine; and mine are the Father's (John 16:15). It is therefore neither unworthy nor contrary if Christ too is called God, but God from God the Father, so that the authority of the one God may be preserved. For if anyone thinks that he means something else when he reproaches the will of the flesh, let him know that the Apostle too had led a clean life, because according to the righteousness of the Law he had lived without complaint. But because he persecuted the faith of Christ, therefore we had our way of life, he says, in the desires of our flesh. For every sin is called flesh, above all faithlessness, which is the mother of all wickedness. Good works and chastity will profit no one if he is faithless; for faithlessness stains all these things. Hence it is that he added: And we were by nature sons of wrath, even as the rest. For when an evil will is put under nature, it becomes a nature of wrath, that is, one that must be subjected to punishment, changed not in substance but by an evil will. For what it follows is reckoned to the nature; hence he says in Isaiah: A most wicked seed (Isa. 1:4). And why it is a most wicked seed he added: For you have forsaken the Lord, he says, and have provoked the Holy One of Israel to anger; so that the nature which deserts God is called a most wicked seed. For to degenerate is to withdraw from the Author: and when it offers a bad example to the rest, it is a bad seed; for it produces the worst fruits. But if it returns to the Author, the nature will be good, according to the Apostle, who, changed when he acknowledged his Creator, is called the vessel of election (Acts 9:15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
