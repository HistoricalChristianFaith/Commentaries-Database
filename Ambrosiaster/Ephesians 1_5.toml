[[commentary]]
quote='''
Predestining us to the adoption of sons through Jesus Christ unto himself. He says that God decreed this: that those who believe in Christ should be adopted as sons by God, so that their head might be Christ, the true Son of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
