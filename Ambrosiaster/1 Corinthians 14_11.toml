[[commentary]]
quote='''
If then I do not know the force of the voice, I shall be a barbarian to him to whom I speak, and he who speaks will be a barbarian to me. He certainly does not advise zeal for this, that through an unknown tongue they should seem barbarians to one another; but since this is a matter of concord, one must strive for these things, so that through unanimity of understanding they may glory in a common joy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
