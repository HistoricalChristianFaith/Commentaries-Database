[[commentary]]
quote='''
For of these are those who creep into houses and lead captive silly women laden with sins, who are led by various desires, always learning and never coming to the knowledge of the truth. Although this fits all heretics, that, slipping into houses, they capture women with crafty and cunning words, so as to deceive the men through them after the manner of their father the devil, who circumvented Adam through Eve; yet it suits the Manichaeans above the rest. For none are so importunate, so deceitful, so captious as they, who, as is well known, worship one thing and profess another; carry one thing within, and claim another outwardly. For they champion chastity, and, with their law favouring it, live shamefully: they praise mercy, while they are found to be unjust among themselves: they assert that the world is to be spurned, and always go out elegantly dressed; they boastfully proclaim that they persist in fasts, while all of them are seen to be well fattened; only that by a certain art they are seen to be pale, in order to deceive. These things, then, the Apostle prophesied above all of these men, who, as is well known, did not exist in the time of the apostles, any more than the Arians did; seeing that the emperor Diocletian marks them out in his constitution, saying: "This filthy and impure heresy, which", he says, "has lately come out of Persia" (See the Collation of Mosaic and Roman Laws). These men find women who out of vanity desire to hear something new, and through the things that please them they persuade them to foul and unlawful things; for they are eager to learn, though they have no judgment to test what they learn: this is to be always learning and not to have the knowledge of the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
