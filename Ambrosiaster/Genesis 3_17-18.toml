[[commentary]]
quote='''
Now for the third time such a sentence is pronounced upon the man: "Because you have listened," he says, "to the voice of your wife, and have eaten of the tree of which I commanded you not to eat, cursed is the earth in your works, and in sorrows you shall eat of it all the days of your life: thorns and thistles it shall bring forth for you" (Gen. 3:17–18). And here too Adam is called back to that for which he had been made, but with a loss. For previously he had been placed to till the earth simply, so that the result of his labor might follow him; but when he despised God's command, believing that by the serpent's counsel things would be better provided for him than God had made them, he is recalled to his former appointment with the disadvantage of toil; so that the earth would by no means respond to him according to his labor, being cursed not for itself, but for his works, so that it might be shown that God's purpose cannot be overthrown, nor can anyone provide better than God. For no one can love another's work more than he who made it himself, as the Apostle says, because, he says, no one ever hated his own flesh, but nourishes and cherishes it, as Christ also does the Church (Eph. 5:29).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 127: THE SIN OF ADAM AND EVE"
