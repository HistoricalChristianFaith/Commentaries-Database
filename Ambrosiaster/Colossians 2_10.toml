[[commentary]]
quote='''
And you are filled in him, who is the head of every Principality and Power. He signifies that more is given to believers than can be contained in the elements; because he who is in Christ is filled with the abundance of divinity, which the elements do not have. Thus the Holy Spirit dwells in believers, which could not be granted to the elements; because it was unworthy and unfitting that the invisible should dwell in a visible substance, and the incorporeal in things that are sensible. Let their worshippers, therefore, hear and come, and believe in Christ; so that they may become greater than those whom they now worship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
