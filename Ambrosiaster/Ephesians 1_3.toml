[[commentary]]
quote='''
Blessed be the God and Father of our Lord Jesus Christ, who has blessed us with every spiritual blessing, that is, not with a worldly but with a heavenly blessing, not a corruptible but an eternal one; because the glory of Christians is not on earth but in heaven, and it is in Christ. For every gift of the grace of God is in Christ, so that if anyone, having spurned Christ, thinks that he is blessed by God, let him know that he is in error. Yet God is blessed in one way, and men in another. The name of blessing is indeed one, but it must be understood according to the dignity of the person; for God too is said to make, and men make: but God makes impassibly, by his nod alone, while men accomplish things by hand, by effort, by labor, by sweat. God, then, is blessed when he is extolled with worthy praises; but God so blesses men that he imparts to them the gift of his grace, not according to their merits but according to his mercy. And therefore he said: Who has blessed us in spiritual blessing, to show that a perfect blessing of heavenly things is given to those who believe in Christ, so that they may be full of heavenly glory, borne up above the powers of the heavens. For where I shall be, he says, there shall my minister be also (John 12:26).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
