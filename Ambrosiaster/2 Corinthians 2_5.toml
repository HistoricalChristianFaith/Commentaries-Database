[[commentary]]
quote='''
But if anyone has grieved me, he has not grieved me, but in part; so that I may not burden you all. All these whom he here calls in part are saints; for there are two parts in the people, as I mentioned in the first letter. These, then, who are of the part of the saints, are the ones whom he indicates to have been grieved at the error of their brother, as he was himself. But in saying this he burdened the one who sins, that is, the one who had sinned. For he becomes more guilty in whose offense many are afflicted: and therefore he says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
