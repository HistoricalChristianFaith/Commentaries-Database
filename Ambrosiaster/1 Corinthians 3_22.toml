[[commentary]]
quote='''
For all things are yours, whether Paul, or Apollos, or Cephas, or the world, or life, or death, or things present, or things to come: all things are yours, but you are Christ's, and Christ is God's. In another place he says to the same effect: But ourselves your servants for Jesus' sake (2 Cor. 4:5). He put servants for ministers, so that they would not each claim individuals for themselves, since they had the use of all, as the Lord too says: I am in your midst, not to be ministered to, but to minister (Luke 22:27). For the world is indeed ours, but so that we may think about it according to the will of God, and set its appointed courses in the will of God. And the present life has been granted to us, but so that we may pass it modestly and with the glory of God. Or death, so that we may willingly accept dying for Christ in the hope of the promise to come. Or things present, so that we may use present things in such a way as not to give offense. Or things to come, so that, believing in the things to come, we may commend ourselves rather to them, because they are better.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
