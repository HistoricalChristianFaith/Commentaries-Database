[[commentary]]
quote='''
But this I say, brethren, that flesh and blood cannot possess the kingdom of God. By flesh he wants faithlessness to be understood, by blood a base and luxurious life, because this desire is generated by the heat of the blood; to show that not only does the unbeliever not have a worthy resurrection, but also the one who obeys the desires and vices of the flesh. So he admonishes and instructs us by what means we may merit to attain the kingdom of heaven.

Nor will corruption possess incorruption. He says this because corruption and wantonness of life must necessarily suffer punishment. For he set down "corruption" for suffering; for it is certainly established that all men rise immortal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
