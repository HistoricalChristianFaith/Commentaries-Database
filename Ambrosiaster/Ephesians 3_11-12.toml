[[commentary]]
quote='''
According to the purpose of the ages in Christ Jesus our Lord, in whom we have freedom in confidence through faith in him. He says that Christ was made manifest in the age in which God purposed to show his mystery for human salvation, so that the knowledge of the mystery of God might confer salvation on mortals; so that, as it were, the dedication of the kingdom of Christ might bestow this grace on believers as festal presents. For although it was done long ago, yet it seems new to the creation that is ignorant of it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
