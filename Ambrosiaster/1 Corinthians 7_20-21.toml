[[commentary]]
quote='''
Let each one remain in that calling in which he was called. This confirms what he said above. Were you called as a slave? Let it not be a care to you: but even if you can become free, make use of it rather. He exhorts that, by serving his carnal master well out of the fear of God, he should make himself worthy of freedom; lest, hearing perhaps: Were you called as a slave? Let it be no care to you, he should become more negligent regarding good conduct toward his carnal master, and the teaching of Christ be blasphemed, and he should not win the favor of God, he who, serving well in these earthly things, lays up merit for himself with God: because the Lord said: He who is faithful in the least is also in the great (Luke 16:10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
