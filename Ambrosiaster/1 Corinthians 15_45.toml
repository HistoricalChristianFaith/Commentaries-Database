[[commentary]]
quote='''
The first man Adam was made into a living soul. This was said in Genesis (Gen. 2:7): that, having received the spirit of the breath of God, man was made into a living soul; for the office of the spirit is to animate the body, yet in such a way that it does not have continuous life unless it makes use of the help of food and drink. But the last Adam into a life-giving spirit: that is, so that he who before had been made into a soul was made into a spirit through the resurrection, so that he cannot die, because he will become wholly living.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
