[[commentary]]
quote='''
For if anyone thinks himself to be something, when he is nothing, he deceives himself. But let each one prove his own work; and then he will have glory in himself alone, and not in another. It is true, and hidden from no one, that if we consider our acts and our mind, we set ourselves before no one, nor do we readily judge anyone. For he who is lifted up as though he were something errs; for he does not know that one grows through humility. For he does not have before his eyes the words and deeds of the Savior, who, though he is Lord of all, humbled himself (Phil. 2:8), to give us a pattern of what we ought to follow if we wish to grow: and that if we were to raise ourselves up, we would be bowed down, which is what the ignorance of a puffed-up heart does, so that it may seem more commendable among men. For, spurning and despising sinners, he strives to seem righteous, like that Pharisee whom the Lord brands (Luke 18:10). Is not this man truly ignorant, who is greedy for present glory? Does he not truly despair of the things to come, who wants to obtain the reward of righteousness in the present? Why? Because he is not righteous in deed, but feigns righteousness through deceit; for he who wants to be righteous sets another before himself, so that he may be truly righteous. For each one knows his own evils better than another's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
