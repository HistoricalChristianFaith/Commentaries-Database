[[commentary]]
quote='''
That we may no longer be little children, nor wavering, and carried about by every wind of doctrine in the wickedness of men, in craftiness, for the contrivance of error. He wishes us to be grounded and steadfast in the discipline of the catholic faith, which the apostle Peter professed by God's revelation (Matt. 16:16), and not to be tossed about, straying through the pestilent assertions of diverse heresies, invented by human wickedness, so that through them the error of the deceiving enemy may be brought in under the name of truth. For this is the contrivance of falsehood, that it brings in error under the pretext of truth: and not only under the name of truth; but he also warns lest, just as before we received the faith we wandered, lowly in understanding, through diverse errors, so, having become faithful, we should run hither and thither, fragile and doubtful of the promised hope; because, having now become Christians, they ought to be grounded, since there is no ambiguity in our faith; for it is commended by the power of wonders.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
