[[commentary]]
quote='''
Through glory and dishonor. To those who considered the Gospel of God a glory, he says, he was clearly a sound and faithful preacher. In like manner he showed himself a faithful minister of God also to those who thought the words of the divine teaching a dishonor and a disfigurement, since he is not frightened, nor does he suffer shame at telling them things they shudder to hear. Through ill repute and good repute. He presented himself as a sound steward of God also to those who gave the faith a good reputation and to those who gave it a bad one, since he does not fear this ill will but is steadfast.

As deceivers, and truthful. Unbelievers called them deceivers; the faithful, on the contrary, declared them truthful and simple. Nor does he yield to this hatred so as to lay a false color over the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
