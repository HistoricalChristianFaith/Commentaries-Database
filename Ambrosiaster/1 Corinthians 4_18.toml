[[commentary]]
quote='''
As though I were not coming to you, so some are puffed up. Some of the Corinthians, not out of longing but out of pride, were indignant that he was not going to them, as though he held them unworthy; whereas the Apostle's zeal was rather this, to make worthy men of the unworthy. He had, then, the wish to go, but the things he was doing were greater.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
