[[commentary]]
quote='''
Holding the form of sound words which you have heard from me in the faith and love which is in Christ Jesus, guard the good thing that has been entrusted, through the Holy Spirit who dwells in us. He calls his precepts, together with his deeds, the form of saving doctrine, which he commands this man to follow; so that he may guard them, with the Holy Spirit's favour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
