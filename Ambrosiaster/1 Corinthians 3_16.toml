[[commentary]]
quote='''
Do you not know that you are the temple of God, and the Spirit of God dwells in you? He says that we are the temple of God, so that we may know that God dwells in us; for he must dwell in his own temple. And because he says that the Spirit of God dwells in us, he signifies that the Holy Spirit is to be understood as God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
