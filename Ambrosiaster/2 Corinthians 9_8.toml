[[commentary]]
quote='''
God is able to make all grace abound in you. He prays that the power of God may be present to them, so that, just as in amending their vices and by the truth of doctrine it pricks their hearts, so in this too it may favor their undertakings, that they may abound in every good work through the grace of God. That, always having all sufficiency in all things, you may abound in every good work. He says and prays this: that in every matter they may always be sufficient for themselves by God's bidding, and not lack the things that are necessary for their well-being. If, then, they choose for themselves sufficiency alone, they will be able to abound in God's work; for, keeping for themselves what suffices, they must spend the rest on the uses of the saints or of the poor: and this will be to abound in every good work. For although what a man of slender means gives is small, yet it abounds, because it is done with right judgment, and it is asked not only how much, but also out of how much, and with what mind it is given. Indeed, that widow in the Gospel (Luke 21:3) was praised for a little, and those who were casting in much were not praised. For her little is much, because she cast in more than she could; but the rich cast in less, though they could do more; and therefore the small amount of her who cast in beyond her strength was found to be more than the much of the rich, because they cast in out of what they had in abundance. He, then, who gives as much as he can does rightly: yet he has that widow ahead of him, because she cast in all that she had.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
