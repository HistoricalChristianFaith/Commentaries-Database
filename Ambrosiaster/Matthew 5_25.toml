[[commentary]]
quote='''
THE LORD HAS CERTAINLY COMMANDED US TO MAKE THE DEVIL OUR ENEMY: WHAT THEN DOES IT MEAN WHEN IN THE GOSPEL HE SAYS, “BE IN AGREEMENT WITH YOUR ADVERSARY QUICKLY” (Matt. 5:25)? WHO IS A MAN’S ADVERSARY, IF NOT THE DEVIL? — No one doubts that the Devil is the enemy of man, especially of the faithful. For he sharpens his most violent weapons against the servants of God. Just as he is the enemy of the good, so too is the Law opposed to the wicked. For who would not oppose someone who despises him? Therefore the Lord addresses the sinner, that he may agree with the commandments which condemn him as disobedient, so that he may subject himself to their will and, from being an enemy, become a friend. For the despiser of the Law is its enemy, since he resists its will. And so the Lord exhorts the sinner to reconcile himself to the Law by doing good, lest on the day of judgment it accuse him before the Judge, and, having been condemned, he suffer the penalties for having despised the Law. For, he says, to everyone who wishes to act wickedly, the discipline of the Lord seems hostile; and unless he consents to it, he will be sent into Gehenna, prepared for the Devil, who is truly the enemy of the human race.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 70: ON AGREEING WITH YOUR ADVERSARY"
