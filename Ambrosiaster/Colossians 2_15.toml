[[commentary]]
quote='''
And by sin let us understand the princes and powers, at whose instigation the first Adam sinned. For this name must be referred to its authors, whose death he signified in the despoiling; for this is their death, that, conquered by the Savior, they are put to death while they are despoiled of the souls which they held in captivity. For they were made guilty: because, while they held souls with this authority, since these had sinned, they themselves were found to be greater sinners, when they killed him who had conquered them by not sinning. And so they were justly despoiled, as he said, publicly, that is, on the cross; which is to be openly triumphed over by God in Christ. For he is triumphed over who is openly conquered, and whose spoils are made public; for he who used to insult others is shown to all laid low.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
