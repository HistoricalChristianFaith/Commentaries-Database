[[commentary]]
quote='''
ONE WORK VARIES ACCORDING TO PERSONS, INTO PRAISE OR CONDEMNATION. — Mercy is one and the same in rich and poor, but it is ascribed differently to the rich and to the poor, because it is more to be praised in the poor than in the rich. For the poor man did not fear to give out of his small means, hoping that God would repay him both in the present and in the future. For he believes the Scripture which says that he who gives to the poor shall not lack (Prov. 28:27). Therefore that poor widow, while the rich were putting in many gifts, she alone deserved to be highly praised by God, because she did not fear to give out of her want (Luke 21:2–4). The rich give generously, being secure in their riches, but the poor man is secure in the Lord. Therefore the rich do well when they give to those in need, but the poor do much better. And therefore the reward of the poor man is one thing, and that of the rich man another. For if the rich man does not do this, he shall be beaten: such is not so greatly required of the poor man. Therefore the merciful poor man is praiseworthy. Theft in a poor man and in a rich man is one and the same sin, but it makes the rich man more guilty: for the poor man steals because of need, but the rich man, though he has abundance, not being content with what is his own, takes what belongs to others; and what is worse, he is accustomed to rob the poor: and therefore the punishment of each differs. Righteousness in the poor man and in the rich man is one and the same; but it is more praiseworthy in the poor man. For to keep justice in poverty is a magnificent thing. The rich man, however, seems to keep Righteousness because he is free from want. Therefore each is Righteousness, but it is greater to keep Righteousness in necessity. Pride is one thing, but it is more to be condemned in the poor man than in the rich: for the rich man is puffed up by abundance, but the poor man is proud in his hardship, which borders on madness, and therefore the poor man is more guilty. Humility is one thing, but it is more to be praised in the rich man. For what great matter is it if the poor man appears humble, whom poverty itself makes humble? But it is magnificent if the one who is praised by rank and wealth bends himself down, not claiming for himself what he knows he deserves. Therefore humility is good in all, but much more in the rich man. The cause of learning and study is one and the same; but it is more praiseworthy in the rich man. For the poor man, since no privilege praises him, has taken pains to have something for which he might be sought after: but the rich man, since he already had that by which he might be praised, by applying effort has increased himself, so that he might be necessary in a double way; for he has not allowed his mind to be drawn off by his riches so as not to flourish by his own qualities. And therefore he is more worthy of praise than the poor man, who, if he had not devoted himself to studies, would have remained utterly of no account. The former, then, was made eager for study by his will, the latter by necessity. Lust is the same in poor and rich, but it is more damnable in the poor man than in the rich. For poverty itself ought to call the poor man back from the desire for luxury: he ought to consider that he has nothing with which to fulfill this desire, and that while he rushes to satisfy it, he must necessarily commit many other evils, by which perhaps he will not even escape in the present; or at least, by spending even what he has, he will remain a beggar with a bad reputation. But the rich man is stirred to sensual pleasure by the abundance of delights: moreover, the rich are secure of freedom, knowing that judgments are for sale, and that they will not even be criticized by anyone. For who would dare to rebuke a man supported by status and wealth? Therefore they are more inflamed, so that they even carry this out violently. For they are not only not criticized at all, but are held in great honor, and can glory that they are such. But if both, that is, poor and rich, are chaste, the chastity of the rich man differs greatly from the chastity of the poor man. For the poor man can be restrained by humility, so that he cannot fulfill what he desires, or by fear of the laws: but the rich man, who can be attracted to pleasure by many supporting causes, is praiseworthy if he turns his mind away from it. Therefore the chaste rich man is worthy of one sort of reward, and the chaste poor man of another. But if a king is chaste, it is a very glorious thing, that having everything in his power he does not touch what he knows he can do with liberty. He truly fears God, he truly keeps his commandments, who, having the laws in his power, contemplates the future judgment of God. And so it is a great thing that he who in the present has no one to fear, overcomes that which delights; since delight can do so much that it not only does not fear future things, but not even present ones. Therefore those who overcome this earn much, but more so those who in the present rule over laws and men. For the others fear both men and laws; and on this account they keep their resolve. Lest they be ashamed before men, they keep what they have long maintained; and lest they be condemned, they abstain from forbidden things: but he who through his dominion fears neither laws nor is ashamed of men, is of great glory if he restrains himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 124: ONE WORK VARIES ACCORDING TO PERSONS, INTO PRAISE OR CONDEMNATION"
