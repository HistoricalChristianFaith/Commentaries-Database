[[commentary]]
quote='''
Paul, a servant of God, but an apostle of Jesus Christ according to the faith of the elect of God and the acknowledgement of his truth, which is according to godliness, in hope of eternal life, which God, who is true, promised before the ages of time; but in his own times he manifested in the preaching his word, which has been entrusted to me according to the command of God our Savior; to Titus, my genuine son according to the common faith. Grace and peace from God the Father and the Lord Jesus Christ our Savior. He declares that the gift decreed by God, which he had promised before the ages, was manifested in the time of the Savior in the preaching of the apostles; for so he had promised. This too he says was entrusted to him, that he might make known to the Gentiles the predestined mercy of God; so that Titus also, his true son, that is, according to the Gospel (for this is true, what is eternal), also revering this will of God with care, might preach the grace of God and peace, so that, having received the gift, they may become peaceable with God and the Father, because all things are from him; and with Christ Jesus our Savior, because he too freed us from death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
