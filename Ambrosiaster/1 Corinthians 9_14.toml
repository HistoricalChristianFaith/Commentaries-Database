[[commentary]]
quote='''
So also the Lord Jesus ordained that those who announce the Gospel should live by the Gospel. God, then, did not follow the pattern of the Gentiles through Moses; but natural reason itself holds this, that a man should live from the place where he labors. This principle, then, he decreed for nature itself and for human life. Yet by adding these things still to the heap, he gives weight to the case, so as not to make light or odious what he commends by so many testimonies: and yet he does not wish to profit by it himself, lest he humble the freedom of rebuking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
