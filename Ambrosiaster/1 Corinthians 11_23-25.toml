[[commentary]]
quote='''
For I received from the Lord what I also handed on to you, that the Lord Jesus, on the night in which he was being betrayed, took bread, and giving thanks, broke it, and said: Take, and eat. This is my body, which is broken for you: do this in remembrance of me. In like manner also the cup, after supper, saying: This cup is the new testament in my blood; do this, as often as you shall drink it, in remembrance of me. He shows them that the mystery of the eucharist, celebrated during supper, is not a supper; for it is a spiritual medicine, which, tasted with reverence, purifies the one devoted to it. For it is the memorial of our redemption, so that, mindful of the Redeemer, we may deserve to obtain greater things from him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
