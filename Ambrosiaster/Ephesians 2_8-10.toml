[[commentary]]
quote='''
For by grace you have been saved through faith. The grace of faith has been given, that believers may be saved. And this not of yourselves; for it is the gift of God, not of works, lest anyone should boast. For we are his handiwork, created in Christ Jesus for good works, which God prepared that we should walk in them. It is true that every thanksgiving for our salvation must be referred to God, who shows us his mercy, that he might call back to life those who were wandering and not seeking the true way. And therefore we must not glory in ourselves, but in God, who has regenerated us by a heavenly birth through the faith of Christ, to this end, that, exercised in the good works which God has decreed for us now reborn, we may merit to receive the promises.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
