[[commentary]]
quote='''
Pursue love, be zealous for spiritual things, but rather that you may prophesy. After love he urges that zeal for prophesying should be held above the rest: because, although the spiritual ranks which he enumerates are great, this one is nevertheless better, which advances the benefit of the Church, so that all may learn the reasoning of the divine law. For in whatever a man has set his mind on, in that very thing he receives a gift, as Solomon says: To know the law is the mark of a most excellent mind (Prov. 9:33); for knowledge supported by love is not puffed up, but is gentle, profiting all for their benefit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
