[[commentary]]
quote='''
I speak as to sons: be enlarged you also, and do not bear the yoke with unbelievers. He exhorts them to good conduct and hope, so that, being confident and cleansing their consciences, they may be able to rejoice in themselves, having the confidence of a pure mind, as their teachers also do, separating themselves from the fellowship of unbelievers in evil works. So he wants them to be enlarged in spirit both by doing good and by hoping for the things to come; for he who labors and does not believe in the things to come, like an unbeliever, is narrow of spirit through despair of the future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
