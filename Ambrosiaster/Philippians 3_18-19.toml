[[commentary]]
quote='''
For many walk, of whom I often told you, and now tell you even weeping, enemies of the cross of Christ: whose end is destruction, whose God is their belly, and their glory is in their shame, who mind earthly things. Those whom he indicates are of the number of those who had overthrown the Galatians. For, walking with guile, they were subverting the Churches of God, preaching under the name of Christ that Judaism was to be practised, as though Christ had been promised to them. He mentions them with grief and tears because they were obstructing the salvation of believers, raising questions about foods to be eaten and not to be eaten, as though salvation lay in food, or the belly were God, which they thought, according to the Law, was delighted with clean foods, glorying in their circumcised shameful parts; this is to mind earthly things. But he who minds spiritual things glories in faith, in hope, in love. It does not belong to this passage, however, that he said on account of gain or of gluttony: Whose God is their belly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
