[[commentary]]
quote='''
Suffering persecution, but not forsaken. It is true, because God was taking care of them, so that their enemies should not have their fill of them. Cast down, but we do not perish: that is, laid low by blows, but, since God stood in the way, not put to death; for whether shut up or bound, by the help of God they escaped the hands of their enemies. Indeed, when Paul and Silas were shut up, already beaten, and their feet already fastened in the stocks, they were eagerly singing a hymn to God, made stronger than those who had not been beaten.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
