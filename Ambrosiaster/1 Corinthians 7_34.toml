[[commentary]]
quote='''
The woman is divided, and the virgin. Divided not, of course, in nature, but in conduct; because we read in Numbers that women were called virgins (Num. 31:9). The anxiety of a woman, then, is one thing, that of a virgin another; yet when "woman" is said, it is uncertain what it signifies, unless a specification follows: but when "virgin" is said, the expression is clear. Here the Apostle placed virgin after woman, so as to signify a woman who is not a virgin: for by this he wished to show that the virgin is free from the wearinesses and labors which a woman joined to a husband suffers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"

[[commentary]]
quote='''
For she who is not married is anxious about the things that are the Lord's, that she may be holy both in body and in spirit: that is, in mind; for while, in the hope of heavenly things, she does not take on the anxiety of husband and children, she thinks of the Lord, how she may guard the purpose devoted to God; if, however, in a pure body the mind, casting off earthly things, is zealous for heavenly things. For it is the mind that either sanctifies or pollutes the body. For what does it profit to have a pure body and a polluted soul, since by the merit of the soul the body is either honored or condemned? But she who is married thinks of the things that are of this world, how she may please her husband. For, bound by the marital law, she is anxious how to fulfill the right of the marital duty, subject to worldly necessities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
