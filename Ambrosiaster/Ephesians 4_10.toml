[[commentary]]
quote='''
He who descended is the same who also ascended above all the heavens, that he might fill all things. This is what the Lord says: No one has ascended into heaven except he who descended from heaven, the Son of Man, who is in heaven (John 3:13). That indeed is also contained in the psalm; for it says: His going forth is from the highest heaven, and his return even to its height (Ps. 18:7). He, therefore, descending from the heavens to the earth, was born a man: afterwards, having died, he descended to the underworld, from which, rising on the third day, he ascended before all mortals above all the heavens, so that he might show creation that death had been mocked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
