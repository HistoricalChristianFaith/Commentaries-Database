[[commentary]]
quote='''
WHAT DOES IT MEAN THAT, WHEN HE WAS GOING TO PERFORM A MARVELOUS AND UNKNOWN ACT OF POWER, NAMELY, TO RAISE LAZARUS FROM THE DEAD, HE WEPT, OR ASKED WHERE HE HAD BEEN LAID AS THOUGH HE DID NOT KNOW (John 11:34–35)? — The Savior is both God and man, and therefore he always acted in two ways: since he has human feelings, he wept; but since he was also God, he raised the one over whom he had wept. Therefore he always proceeds from lesser things to greater: since he was seen as a man, he showed that what he appeared to be was not all he was; rather, he proved himself to be God by his works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 35: ON WHY CHRIST WEPT AND ASKED WHERE LAZARUS WAS LAID"
