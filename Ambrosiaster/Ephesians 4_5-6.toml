[[commentary]]
quote='''
One Lord, one faith, one baptism, one God and Father of all, who is above all, and through all, and in us all. He still commends unity, so that, because it is a unity to which we are called, we may disagree in nothing. For if there is one Lord, that is, Christ, as he himself also says in the Gospel: For one is your teacher, Christ (Matt. 23:10); one faith, one baptism, one God and Father of all, who is above all things, and through all, and in all believers: then there ought also to be one mind and one heart of the people; because these things which he enumerates belong to unity, for they agree in all things. Yet he said that God the Father, because he owes what he is to no one, is above all things, and through all. Through all for this reason, that all are from him: and it is necessary that he be above all these things which are from him. And in us all, that is, in the faithful. For he is in us through confession; because we confess him, and because he has given us his spirit, through whom without doubt he is in us: in pagans he is not; because it is denied by them that he is the Father of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
