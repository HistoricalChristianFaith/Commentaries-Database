[[commentary]]
quote='''
And you became imitators of us and of the Lord himself, receiving the word in much affliction with the joy of the Holy Spirit, so that you were an example to all who believe in Macedonia and in Achaia. Eager for belief, they endured the reproaches and injuries they suffered from their fellow citizens, in confidence of the things to come. Hence they are called emulators of the apostles and of the Lord himself; because the Lord too suffered the same things from the Jews, and the apostles, following the faith of God, suffered persecutions, rejoicing that they had been counted worthy to suffer insults for the name of the Lord (Acts 5:41), knowing that great rewards had been promised for these things; for a slave is proved fit when, for love of his master, he offends his master's enemies. Mindful of this, they rejoiced in affliction in the hope of the promise. And so it is a great exhortation to advancement when he says that they have been made like both Christ and the apostles, so as to offer a pattern to the other believers in those places through which their fame went abroad.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
