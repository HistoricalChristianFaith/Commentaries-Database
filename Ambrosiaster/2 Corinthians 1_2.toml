[[commentary]]
quote='''
Grace to you and peace from God our Father, and the Lord Jesus Christ. Since the gift of God and of Christ is one, he therefore wishes them to be sharers in the grace of God, which is also Christ's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
