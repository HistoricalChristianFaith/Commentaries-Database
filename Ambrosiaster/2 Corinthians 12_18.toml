[[commentary]]
quote='''
I asked Titus, and I sent the brother with him. Was Titus avaricious toward you? Did we not walk in the same spirit? Not in the same footsteps? It is plain that, since nothing of the sort was said or done by those whom he sent, their single mind is proved to be for good, the suspicion of avarice being excluded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
