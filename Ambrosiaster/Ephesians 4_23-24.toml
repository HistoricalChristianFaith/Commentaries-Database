[[commentary]]
quote='''
But be renewed in the sense of your mind, and put on the new man, who according to God has been created in truth and justice. It is just and true to follow the right way: and he follows the right way who, devoted to his Creator, walks in his will, which the Gentile world does not know. For he who is renewed in the spirit of his mind is said to have put on the new man, who is Christ; for he puts on Christ who, reborn in Christ through faith, is an emulator of the life which Christ handed down; so that he may be seen to have been created according to God: for a man is created in that in which he is wise; and therefore the truth and justice of God are unknown to the Gentiles. For when believers acknowledge God as Creator, keeping his commandments, they are created in justice and truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
