[[commentary]]
quote='''
"For the wrath of God is revealed from heaven against all ungodliness and injustice of those men who hold down the truth of God in unrighteousness." For just as in the one who believes the righteousness of God is revealed, as I mentioned above, so also in the one who does not believe ungodliness and injustice are revealed. From the very structure of heaven God appears to be angry with them; for this is why He fashioned such beautiful stars, so that from them it might be recognized how great and how wonderful their creator is, and that He alone should be worshiped. Therefore it is written in the Psalm: The heavens declare the glory of God, and the firmament proclaims the work of his hands (Ps. 18:2). By the natural law, therefore, the human race is made guilty; for they could have grasped, through the law of nature and the witness of the world's structure, that God alone, the author, is to be loved, which Moses handed down in writing (Deut. 6:5): but they became godless by not worshiping the Creator, and injustice appears in them, since, seeing, they turn away from the truth, not acknowledging one God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
