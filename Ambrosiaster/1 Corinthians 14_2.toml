[[commentary]]
quote='''
For he who speaks in a tongue speaks not to men but to God; for no one hears, but in the spirit he speaks mysteries. This is what he says: that he who speaks in an unknown tongue speaks to God, because he knows all things; but men do not know, and therefore no one profits from this. But in the spirit he speaks mysteries, not with understanding; because he does not know what he says.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
