[[commentary]]
quote='''
That he might show in the ages to come the superabounding riches of his grace in goodness toward us in Christ Jesus. This signifies that in the age to come the immortal gift of God will appear in the reward of the faithful: what eye has not seen, nor ear heard, nor has it entered into the heart of man, the things which God has prepared for those who love him (1 Cor. 2:9). These are the superabounding riches: that so much is given to believers as the mind cannot search out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
