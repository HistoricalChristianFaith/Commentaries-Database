[[commentary]]
quote='''
Whatever you do, work at it from the heart, as for the Lord and not for men, certain that from the Lord you will receive the recompense of the inheritance of the Lord Christ, whom you serve. For he who acts unjustly bears that which he did unjustly: and there is no respect of persons with God. To make them prompt in obedience and faithfulness, he promises that they will receive from God the wage of good works in the kingdom of Christ. And that this may be approved and accepted, he wants them to obey as they would the Lord, from whom they expect the wage. But if a slave acts unjustly, he will offend not only a man but God too, whom he despised in the fraud committed against his master according to the flesh. But if he acts well, he will not be, with God, the slave of a man, as though more despised; but he will be rewarded as a free man among men, yet a slave of Christ, which is a name of dignity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
