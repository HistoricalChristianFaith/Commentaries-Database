[[commentary]]
quote='''
See that no one plunders you through philosophy and empty deceit according to the tradition of men, according to the elements of this world, and not according to Christ; because in him dwells all the fullness of the divinity bodily. He means earthly philosophy, by which those are wont to be seduced who desire to be judged prudent in the world. It is composed of arguments and of the subtlety of certain minutiae, as though it had investigated the reasons of nature, having some things mixed in which may serve as encouragements or lessons for a good life, and ordered sometimes concerning measures, and also concerning numbers, sometimes concerning the qualities and quantities of the elements. Whoever falls into its disputations escapes barely and rarely; for he is held fast by plausible causes and fictitious matters, thinking nothing so true as what is seen and understood in the elements. And because the things that are present and are seen with the eyes seem pleasant and delightful, they seduce a good many, who, in despair of the future, think the spiritual account is to be despised and laughed at, assigning all power to the stars, being subject to carnal reasoning; holding that heavy things are not to be believed able to be raised into heaven, nor light things to come down to the earth, nor anything bodily to be generated without a mixing of things, and so opposing the power and providence of God. For they know that it is read in the ancient divine volumes of the Hebrews that many things were done through Moses which human reason does not grasp; and in like manner in the new books, things done by the Lord, or through the apostles, which carnal treatment forbids to be believed. This tradition, then, or philosophy, he calls deceitful and empty; because it was ordered not by the power of God, but by the weakness of human reasoning, which confines the power of God within its own knowledge, so that he is not believed to act otherwise than carnal reason confines itself; because they assign a diversity of divinity to the individual elements for worship, so as to bind the souls of the unskilled, lest they reach out to the true God. Wherefore he warns that this tradition is to be guarded against; because it is a worshipper of the world, not of God, who is one: nor does it draw towards Christ, but away from Christ, in whom is the perfection of divinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
