[[commentary]]
quote='''
Love is magnanimous, it is pleasant. Love is not envious, is not puffed up, does not act wrongly, is not ambitious, does not seek the things that are its own, is not provoked, does not think evil, does not rejoice in iniquity, but rejoices with the truth: it tolerates all things, believes all things, hopes all things, endures all things. Love never falls. He has taught such great praises of love that he would seem, not undeservedly, to set it before the rest, and to show that those labor in vain who give their attention to the other commandments while not obeying this one. Hence the apostle John says: Love is God (1 John 4:8); so that he who does not have love may know that he does not have God; whence also in another epistle the same apostle Paul says: But God, who is rich in mercy, on account of his great love has had mercy on us (Eph. 2:4). He, then, who does not have love is ungrateful for the mercy of God, because he does not love that through which he has been saved. So that they might accordingly learn that those sinned gravely who put food before brotherly love. For this is what both profits in the present and abides with God for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
