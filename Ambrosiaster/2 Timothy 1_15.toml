[[commentary]]
quote='''
For you know this, that all who are in Asia have turned away from me, among whom are Phygelus and Hermogenes. These whom he mentions were full of deceit; for they feigned friendship with the Apostle, so that by keeping close to him they might learn the grounds on which they could bring a false charge against him, or bring one in through others. After they saw that they had been exposed, they withdrew from him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
