[[commentary]]
quote='''
Paul signified by the night the old man, who has been renewed through baptism. He says that it has passed like the night, while the day has drawn near, by whose light the truth has appeared to us, so that we might know what we ought to do. For previously, not knowing Christ, we were in darkness; but when we learned of him, light arose within us; for we passed from falsehood to truth. The works of darkness are a carnal life, driven by worldly enticements; this is deserving of darkness, as the Lord says: Take him away; and, binding his hands and feet, cast him into the outer darkness (Matt. 22:13). But putting on the armor of light consists in performing good deeds; for just as evil acts are assigned to darkness, because they are done secretly by those who do evil, so those who do good act openly, because they are not afraid but rejoice. Good deeds, therefore, are the armor of light, waging war against darkness, which is the vices of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
