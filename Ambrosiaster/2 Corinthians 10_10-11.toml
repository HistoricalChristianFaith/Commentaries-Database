[[commentary]]
quote='''
For the letters indeed are weighty and strong, but the bodily presence weak and the speech contemptible. Let him who is such consider this: that such as we are in word through letters when absent, such we are also in deed when present. He proves that he is not other when absent than he is when present for this reason, because he was not presumptuous. For he had received power from the Lord; for one to whom power has not been given can be bold when absent, but when present he suffers shame. Therefore the Apostle does not blush when he rebukes, because he does this in the confidence of his power. He says these things on account of those who, without being sent, were preaching with flattery, because they wanted to commend themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
