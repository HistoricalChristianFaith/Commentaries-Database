[[commentary]]
quote='''
It is clear that, with God bearing witness for us, who would dare accuse us, when he himself who is the judge foreknew us and judged us worthy?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
