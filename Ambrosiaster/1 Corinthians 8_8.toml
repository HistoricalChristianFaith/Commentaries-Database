[[commentary]]
quote='''
But food does not commend us to God. That is true, for we shall not please God on that account, if we eat everything, or offend him if we have spurned some things. For neither, if we eat, shall we abound; nor, if we do not eat, shall we be in want. For if the food of sacrifices is spurned, there will surely be no lack of something to eat; but if it is taken, it will not make one abound, so that nothing further is needed: and for this reason it is to be rejected, since it is not the case that one cannot live without it, and it is a stumbling block to the brethren.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
