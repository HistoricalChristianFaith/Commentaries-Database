[[commentary]]
quote='''
So we from this time know no one according to the flesh. And if we have known Christ according to the flesh, now we no longer know him. It is true, because, Christ having risen from the dead, the carnal birth now ceases in him, the weakness of the body ceases, and the suffering of death ceases too. For up to the cross there was a suspicion of weakness in Christ; but afterwards he appeared to be what he was not believed to be, as he himself also says: When you have lifted up the Son of man, then you will know that I am (John 8:28). The Apostle mentions this, therefore, in order to show with what devotion Christ is to be obeyed. For for the salvation of men he not only did not disdain to be born a man, but also willed to be treated with insults and to die, so that, understanding how precious his death is, they may serve him the more readily, repaying him not as a man but as God; because to each one service is to be rendered according to his person and merits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
