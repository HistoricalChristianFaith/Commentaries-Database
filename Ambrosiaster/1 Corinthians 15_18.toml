[[commentary]]
quote='''
Then those also who have fallen asleep in Christ have perished. He adds this to their terror, because they are unwilling to reckon the departure of their dear ones as perdition. For those who left the world under this hope, or who did not fear to be killed because they believed that they would rise after the example of Christ, have perished, if it is not true. He tells them this, which out of love for their departed they are unwilling to hear, so as to cut away from them what earlier, through error, they were willing to hear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
