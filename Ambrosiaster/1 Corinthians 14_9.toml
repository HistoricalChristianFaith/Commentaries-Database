[[commentary]]
quote='''
So you also, unless you give through the tongue speech that signifies, how will it be known what you are saying? For you will be speaking into the air; that is, profiting nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
