[[commentary]]
quote='''
But if anyone seems to be contentious, we have no such custom, nor has the Church of God. Having given the reason, he interposes authority in order to overcome the contentious; because not even Judaism had this, whence he says: Neither we, nor the Church of God, meaning that neither Moses nor the Savior handed it down so.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
