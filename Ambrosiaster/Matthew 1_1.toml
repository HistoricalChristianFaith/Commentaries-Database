[[commentary]]
quote='''
WHY DOES MATTHEW, WHEN WRITING THE GOSPEL OF CHRIST, SAY, “THE BOOK OF THE GENERATION OF JESUS CHRIST, THE SON OF DAVID” (Matt. 1:1), WHEN ABRAHAM CAME EARLIER? — Matthew began this way so that he might first speak about him, describing his genealogy from the promise of his incarnation, just as the Apostle says, “whose are the fathers, and from whom, according to the flesh, Christ came” (Rom. 9:5). Therefore he said, “The book of the generation,” because the incarnation of Christ is constituted from many and diverse people, so that, since many began to exist from one, he might draw bodily lineage from all. From Jews and Gentiles, and from the worthy and the unworthy: for Ruth was a Moabitess, and Bathsheba became a wife from being an adulteress; so that, drawing the flesh of all to himself, he might call them back to their true unity. For this reason he says, “Jesus Christ, the son of David,” though Abraham came earlier, because Christ is called in a special way the son of David on account of the kingdom: so that, just as God is from God, so also a king should take his origin from a king according to the flesh. For therefore it was said to David: “Of the fruit of your womb I will set one upon your throne” (Ps. 131:11).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 3: WHY MATTHEW CALLS CHRIST THE SON OF DAVID"
