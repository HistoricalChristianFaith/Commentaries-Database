[[commentary]]
quote='''
Therefore take up the whole of the armor, that you may be able to resist in the evil day, and stand perfect in all things, having your loins girded in love, and having put on the breastplate of righteousness, and having your feet shod in the preparation of the Gospel of peace. Above all these, taking up the shield of faith, in which you will be able to quench all the fiery darts of the wicked one; and take the helmet of salvation, and the sword of the spirit, which is the word of God. Since we wage war against most savage enemies, cunning in every kind of evasion, we must therefore keep watch with all caution and care, so that whatever they attempt, they may find us fortified and prepared. For it must needs be that God helps those whom he sees keeping watch in prayer and expecting victory from his armor. But in a war of this kind there is need of a sober mind and a pure conscience, because the fight is not against carnal forces of wickedness but against spiritual ones. For against earth-born enemies the body is strengthened with rich feeding, and the mind is fired with drink, so that it may take on the daring to fight back; but against the spiritual forces of wickedness one must fight spiritually, and the armor of sobriety and abstinence must be taken up; so that, filled with the Holy Spirit, we may overcome the unclean and wandering spirits. Thus, then, we shall gird our loins in truth, if we are prepared to resist error. For everyone who wishes to work girds himself, so that, with the hindrance removed, he may work more diligently.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
