[[commentary]]
quote='''
Through his Gospel I was made a minister according to the gift of the grace of God which was given to me according to the working of his power. He asserts that through the preaching of his ministry the gift became known which God disposed for the Gentiles according to the working of his power. For the working of his power is this, that he raised Christ from the dead, death having been overcome, in which he saved all. Yet the dispensation of his Gospel is this, by which the will of God has been known: that he decreed to save the Gentiles without the work of the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
