[[commentary]]
quote='''
He calls him a true son, but in faith, as he says to the Corinthians: In Christ Jesus, he says, I begot you through the Gospel (1 Cor. 4:15). This is the true and firm generation, which knows no setting, knows no diseases and pestilence, and which is ignorant of hunger and thirst: but it has learned to lack nothing in the kingdom of God; because by the gift of God there will be a glorious immortality in the kingdom of God and of Christ, whose grace, mercy and peace he desires to remain with him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
