[[commentary]]
quote='''
I therefore thought it necessary to ask the brothers to go ahead to you and to prepare this promised blessing of yours to be ready: but thus, as a blessing, not as an overreaching. To show his care still further, he said that he had asked the brothers, so that, admonished through them, they might fulfill what they had promised and were not fulfilling. Although above he says that Titus set out of his own accord, that is, that it was not extorted from him, but as soon as he heard, he gladly embraced it, so that he might be seen to have set out to them willingly because of his hope in them: now he signifies that he did not ask these because they were unwilling to go; but he proves his affection toward them when he asks them besides, though they are willing to go, so that what both they wish and he begs may be done without any delay. This, then, is what he is doing with them: that they be faithful in their promise, and that he admonishes them for the sake of their reputation, not to overreach them; but that they offer only so much as they will not regret.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
