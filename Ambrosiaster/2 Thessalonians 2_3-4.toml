[[commentary]]
quote='''
He does this so that, while they were found off their guard in this very disturbance, they might not be led astray into worshipping the devil, who will boast these things for this reason: that, appearing under the name of the Savior and deceiving the saints, he may wish to be worshipped, so as to deceive those who believe in Christ. But so that most shameless Satan may not have the place or occasion of deceiving which he thinks he has, he has marked out the time and the signs of the coming of the Lord: that the Lord will not come before the failing of the Roman kingdom takes place, and the Antichrist appears, who will kill the saints, freedom having been restored to the Romans, yet under his own name. For knowing that the Lord will come to crush him, he will usurp his name for himself; and so that his kingdom may seem to be true, he will draw with him those who are to perish together with him, so that he sits in the house of the Lord in the seat of Christ, and asserts that he himself is God, not the Son of God. Hence in the Gospel the Lord says to the Jews: I have come in the name of my Father, and you have not received me; if another comes in his own name, him you will accept (John 5:43). Wherefore it is to be expected that he will come from the circumcision, or circumcised, so that the Jews may have the confidence to believe him. And so, in writing to the Thessalonians, the Apostle teaches all that they ought to be cautious in a matter of this kind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
