[[commentary]]
quote='''
If anyone is reckoned to be a prophet or spiritual, let him acknowledge that the things I write to you are the commandments of the Lord. In saying this he touches the false apostles mentioned above, by whom they had been corrupted, who, following the desires of men, taught not divine but earthly things. Therefore he says here that he hands down nothing of his own, but the Lord's, so that those whom he persuades may be seen to be won for God, not for men; with which confidence he also preaches steadfastly, having a free conscience, because he wishes to please not men but God. Hence he does not flatter sinners so that they may grow, but admonishes them so that they may cease.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
