[[commentary]]
quote='''
Have I then become your enemy, telling you the truth? He says this because it cannot be, he says, that I should be an enemy to you, from whom I have experienced such great kindnesses. But because no one wishes to be reproved when he errs, therefore I seem an enemy to you, since I justly reprove you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
