[[commentary]]
quote='''
Do not rebuke an elder, but exhort him as a father, younger men as brothers, old women as mothers, young girls as sisters, in all chastity. Out of respect for age he teaches that one older in years is to be summoned to good work with gentleness, so that he may more readily accept the admonition; for, once admonished, he may fear being rebuked afterwards, which is shameful for an elder. For among all nations, certainly, old age is honorable: hence both the Synagogue and afterwards the Church had elders, without whose counsel nothing was done in the Church. Through what negligence this has fallen into disuse I do not know, unless perhaps through the sloth, or rather the pride, of the teachers, since they alone wish to seem to be something. Younger men he judges are to be admonished as brothers, with the affection of love, so that, seeing that they are admonished for love's sake, they may more readily correct themselves, especially since they see that his works do not differ from his preaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
