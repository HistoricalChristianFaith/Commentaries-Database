[[commentary]]
quote='''
But as it is written: What eye has not seen, nor ear heard, nor has it gone up into the heart of man, the things which God has prepared for those who love him. This is written in the Apocalypse of Elijah, among the apocrypha. By this example he says that an unlooked-for thing has been done, one which not only would not fall within human understanding but was hidden even from the heavenly powers, namely, the Son of God incarnate; so as to confirm what he had said above, that if the princes of this age did not understand that God had been made man, how much less did men! But if the words made an obstacle or a stumbling-block, faith still ought not to have been refused to the mighty works and signs. For power ought to have been set above human weakness and ignorance, and what seemed impossible to human reason ought to have been believed; and therefore he has prepared this gift for those who love God, that is, for believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
