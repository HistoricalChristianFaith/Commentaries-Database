[[commentary]]
quote='''
All things are lawful for me, but not all things are expedient. He says that all things are lawful according to the law of nature; for all things are clean. For the question concerned foods, and meat sacrificed to idols. For how can things that are prohibited and forbidden be said to be lawful, when here he indicates that even the very things which are permitted are sometimes not expedient? as the apostle Peter says: If this is the case of a man with his wife, it is not expedient to marry (Matt. 19:10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"

[[commentary]]
quote='''
All things are lawful for me, but not all things edify. The sense is the same, because it is lawful to eat all things: but what is sacrificed to idols does not edify, because it causes a stumbling-block to a brother, as was said above: and therefore one must sometimes refrain from lawful things, so as to be of benefit. Hence it is that he was unwilling to accept support from them, although it was lawful for him, knowing that it was not expedient.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
