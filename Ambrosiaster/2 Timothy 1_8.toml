[[commentary]]
quote='''
Do not, therefore, be ashamed of the testimony of our Lord, nor of me his prisoner. He teaches that constancy must be kept, and that one ought not to tremble in confessing the faith. For there is nothing in it to be ashamed of; for if Christ was seen as a man, yet by his deeds he appeared as God; although he was crucified, yet he rose from the dead and, while many looked on, a cloud receiving him, he ascended into heaven (Acts 1:9). It is not, then, a matter of weakness but of power; for where weakness is supposed, there power appears. So he who is proved to have conquered is foolishly said to have been made weak. In this way there is nothing in the Apostle either that should cause a blush; for if he is said to have been humbled by afflictions and beatings, from that side he confounds his detractors, because he is plainly seen to be wonderful, by his mere command, in signs and wonders; so that it may be understood that he is humbled not through weakness but willingly, for a certain advance of merits. For God permits his servants to be humbled by the wicked for this reason, lest he seem to give them rewards unjustly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
