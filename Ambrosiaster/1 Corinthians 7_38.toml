[[commentary]]
quote='''
So also he who gives his virgin in marriage does well. He does well, because what he does is lawful. And he who does not give her in marriage does better. He does better, because he both lays up merit for her with God and frees her from the anxiety of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
