[[commentary]]
quote='''
What then is Apollos? And what is Paul? Ministers of him in whom you have believed. So that, because they are ministers, hope may not be in them, but in God, whose ministers they are. For thanksgiving must be rendered to him whose gift it is; but these are servants, who must dispense it even against their will. Was not Moses compelled to go to Pharaoh, and Jonah sent unwilling to preach to the Ninevites, and Ananias sent, though he objected, to lay his hand on Saul?

And to each as the Lord has given: that is, as he willed and knew, he distributed to each the offices of the ministry.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
