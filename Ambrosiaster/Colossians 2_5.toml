[[commentary]]
quote='''
Hence the Apostle says that he is present there in spirit, so that, having reverence for him before their eyes, they might keep themselves from men of this kind. For if the spirit of Elisha the prophet saw the fraud of Gehazi as he went to Naaman the Syrian to receive in his name what had not been commanded him, and saw that Naaman, coming down with a ready mind, had given him more than he had been asked (2 Kings 5:26); how much more could the Apostle see in the spirit the things he spoke of! For there was greater grace in the apostles than in the prophets. And to make them more ready concerning the tradition of the Gospel, he says that he rejoices in the ordering of their way of life; so that, knowing whereby God is pleased, they might become firmer in that through which, being made worthy, they might learn the understanding of it for the advancement of the profit of their faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
