[[commentary]]
quote='''
One of themselves, their own prophet, said: The Cretans are always liars, evil beasts, lazy bellies. This testimony is true. One of the Cretans, made better by the discipline of the Lord, expressed what was to be thought of the untaught Cretans: that they were both evil and wished to eat while idle; for they wished to feed on malice, men who, though they are of no use, are eager also to do harm. So the evil is twofold. Such were the Cretans; hence he calls this man a prophet, but in the matter of the Cretans. For he asserts that this man spoke things so true of them as to be a prophet; for it is impossible for a prophet to be deceived.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
