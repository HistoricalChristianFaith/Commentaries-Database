[[commentary]]
quote='''
The Lord, he says, is near. Be anxious in nothing: that is, they ought to be prepared, and to watch in prayer and supplication, giving thanks to God, and, setting aside the care of the world, to hope for and keep before their eyes what the Lord has promised; whence he teaches that thanks are also to be given to him; for when the Lord is at hand, the care of the world ceases. For why should they be anxious about a thing that will soon perish? And therefore, let your requests, he says, be made known before God. This making known comes about through assiduity and watchfulness in prayer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
