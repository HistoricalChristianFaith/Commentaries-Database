[[commentary]]
quote='''
But if this is added to the case, that we also suffer tribulations and afflictions for the name of the Lord without resentment, then, enduring these things, we shall reign together with him; for it is fitting that he who suffers reproaches and deadly perils for him should appear glorious in his kingdom. If we deny him, he also will deny us. It is true, for if we have not confessed him before men, then he too will say to us in that hour of need of the judgment to come: I do not know you (Matt. 25:12). This signifies punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
