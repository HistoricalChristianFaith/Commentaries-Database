[[commentary]]
quote='''
But when he says: All things are subjected to him, clearly except him who subjected all things to him. And when all things have been subjected to him, then the Son himself also will be subjected to him who subjected all things, that God may be all in all. It is the same sense, which he now opens up, to make plain what it is for the Son to deliver the kingdom to God and the Father: but he adds this to the sense, that the Father, in delivering the kingdom to the Son, did not subject himself to him, as the Son subjected himself to the Father; for it is incongruous that the Father should be subjected to the Son. So the Father subjected all things to the Son, that he might be honored in like manner, just as the Father too is honored.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
