[[commentary]]
quote='''
I think, therefore, that this is good because of the present necessity; because it is best for a man to be so. He says that it is good to remain a virgin. And to show this more absolutely, he says because of the present necessity; because it is best, so that it might be recognized that between good and best nothing is so excellent and useful as virginity; because he teaches that virginity is more commendable not only with God but also in respect of the present life, since it does not know the necessities of the time which married life suffers, and is ignorant of the sorrows of childbirth together with the bereavements of children. In order, then, to encourage them to aspire to it, he teaches that those women who have loved it are spared the ruinous effects of the present necessity; so that, when they learn that it holds a better place not only with God but also in the present, they might seek it with all diligence. For there is one thing in which it labors: to overcome the affection of the flesh, being free in all other things. For because the flesh is in its origin and nature, its use seems pleasant and its affection sweet; therefore to overcome these things is no slight glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
