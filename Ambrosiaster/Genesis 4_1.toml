[[commentary]]
quote='''
THE APOSTLE SAYS, “WE WHO ARE JEWS BY NATURE” (Gal. 2:15): THEREFORE HE SHOWS THAT JEWS ARE BORN FROM JEWS; I AM NOT SPEAKING OF PROSELYTES, WHO ARE CLEARLY MADE INTO JEWS. INDEED, THOSE WHO WERE BORN IN THE WILDERNESS WERE NOT CIRCUMCISED, AND YET THEY WERE JEWS. THEREFORE IT IS NOT CIRCUMCISION THAT MAKES A JEW, BUT BIRTH BROUGHT FORTH UNDER DEVOTION TO GOD THE CREATOR. IF THEN JEWS ARE BORN FROM JEWS, WHY NOT ALSO CHRISTIANS FROM CHRISTIANS? FOR PAGANS TOO ARE BORN FROM PAGANS. — Not everything that is born is the same as that from which it is born. Gold comes from the earth, and yet it is not earth; and so do gems and many other things. Food comes from wood, and a chick from an egg. But in the case of Pagans, the reason that Pagans are born from Pagans is this: since every pagan is in ignorance, and the one born from him is without understanding, both are ignorant. Yet there is this difference between the two, that the one who begets is without doubt a blasphemer, and so is a son of the Devil; but the newborn infant does not know how to blaspheme, just as it does not know how to bless; nevertheless it is pagan, because it is without understanding. From a Jew, however, a Jew is born for this reason, that he is generated under devotion to the Creator. As Adam said about Cain, “I have gotten a man through God” (Gen. 4:1). For just as the Pagans, being without devotion to the Creator, give thanks to demons for everything they do, so the Jews, as petitioners of God the Creator, praise him in all their actions, to their own criticism in this, that they do not know Christ, through whom are all things. In this way also a Jew is born from a Jew. For it is not, as some think, that circumcision makes a Jew. Circumcision is a sign of Judaism, not Judaism itself; for it was not Abraham’s circumcision that was righteousness, but the sign of righteousness, so that those born from Abraham might have a sign by which they would be proved to be Abraham’s children. Since from Judas Maccabeus they were given this name, so that not only those from Judah, but also the rest from all the sons of Jacob, were called Jews, because Judas had been their leader. Therefore those born Jews receive the sign, so that those who they are may be recognized. But from a Christian, a Christian is not born, because the one who begets is not born a Christian, but made a Christian. Therefore the one who is born must likewise be made, in order to be so. For he is not born by substance, but by the faith that comes to those already born. Ignorance is born together with the flesh, but faith is afterwards grafted in by spiritual reasoning. But someone objects on the other side: “If the one who begets has indeed been made what he is, then he ought now to beget that which he himself is, so that the dignity he has received should produce an offspring like itself. For senators beget senators.” But the dignity of senators has no merit before God. Nor does nature itself, that is, substance, obtain this benefit; rather, the dignity is confined to reputation and speech alone. Therefore the title indeed is passed down through fleshly descent, but it provides nothing more than an opinion of dignity; just as those who are consuls, or are honored with statues, rejoice in vanity. But when people become Christians, dignity is added to their very nature, so that the human essence itself receives the eternal benefit of incorruptibility, and there is not only the opinion, but also the reality in effect before God. It is like this: if some eloquent poor man is praised and yet lacks bread or other necessities. True praise would be this, if the dignity he has acquired benefited him so that he lacked nothing, while this is granted to his nature, that it might live by itself, and live well, without requiring any help from outside, that is, truly to become rich and glorious.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 81: THE APOSTLE SAYS, “WE WHO ARE JEWS BY NATURE”"
