[[commentary]]
quote='''
But to each one of us grace has been given according to the measure of the gift of our Lord Jesus Christ. Now, lest, because the gifts in men are diverse, they should be thought to hinder unity, he clears this up, showing that it is not contrary to it; because in the gifts the diversity is one of offices, not of nature. He says, moreover, that to each is given as much grace as the Lord has deigned to give; yet not without a measure of equity, because he bestows on each according to his strength, so that he may draw as much as he thirsts for.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
