[[commentary]]
quote='''
And so that this may not be arduous or difficult to bring about, he commands the teacher to be a pattern, that he may show how the things he teaches are done; so that those who are profane and enemies of the faith may blush, seeing that what he teaches in words he proves true by deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
