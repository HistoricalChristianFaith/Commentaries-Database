[[commentary]]
quote='''
Would that they were even cut off, who are overturning you! This is like that saying in the first epistle to the Corinthians: Whoever does not, he says, love the Lord Jesus, let him be anathema (1 Cor. 16:22). These too, whom he joins to their sentence, are of that same diseased flock: so that those who stripped the Galatians of the grace of God should be cut off from the mercy of the Lord; and he curses them not only spiritually but also carnally, so that, since they were forcing the Galatians to be circumcised, they themselves should be cut off, that their bodily pain might be multiplied.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
