[[commentary]]
quote='''
And you are not your own; for you have been bought at a great price. It is clear that he who has been bought is not at his own disposal, but at that of him by whom he was bought, so that he does not do his own will, but that one's. And because we have been bought at a dear price, we ought to serve our Lord the more readily, lest, offended, he give us back to the death from which he redeemed us. For at how very dear a price did he buy us, that he should give his own blood for us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
