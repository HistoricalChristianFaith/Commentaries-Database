[[commentary]]
quote='''
Every man praying or prophesying with veiled head disgraces his head. By "praying" he means making supplication; and by "prophesying", declaring after the prayer, in the words of the creed, that the coming of the Lord is to be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
