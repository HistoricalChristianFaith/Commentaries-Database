[[commentary]]
quote='''
You observe days, and months, and times, and years. He now declares which things he called elements. The sun makes the day, the course of the moon the months; and the times are spring, summer, autumn, winter: these four, when their own number is completed, make the year. So those observe days who say, for example: One must not set out tomorrow; for on the day after tomorrow nothing ought to be begun: and in this way they are usually all the more deceived. Those, on the other hand, worship months who scrutinize the courses of the moon, saying, for example: On the seventh day of the moon instruments ought not to be drawn up; again, on the ninth day of the moon a purchased slave, for example, ought not to be brought home: and through these things adversities are apt to come about the more readily. And they observe times thus, when they say: Today is the beginning of spring, it is a festival; the day after tomorrow is the Vulcanalia. And again they say such things as: It is a day-after; it is not lawful to go out of the house. They worship years thus, when they say: On the Kalends of January is the new year, as if years were not completed every day; but in order to recall the memory of that two-faced Janus, they practice this superstition, which ought to be far from the servants of God. For if God is loved with the whole heart, with him being gracious there ought to be no dread, nor suspicion of these things; for whatever is done simply in devotion to God can turn out prosperously.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
