[[commentary]]
quote='''
He who had much did not abound, and he who had little did not have less. This is read in Exodus (Exod. 16:18). For the saints have more in the hope of the world to come, and indeed more than those who seem rich at this time; and yet both will be made equal there: so that, just as the want of these saints is sustained by the kindness of those, so by the kindness of the saints these too may become rich in the world to come, in which they seem poor. For they did not give themselves wholly to God, so as to be poor here and rich there; but in this respect, because they are rich here and poor there, they will be enriched by the support of the saints, who, though placed here, are already there in mind. For it is no ordinary merit to minister to the saints from one's just labors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
