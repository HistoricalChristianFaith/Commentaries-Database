[[commentary]]
quote='''
For what participation has righteousness with iniquity? Or what fellowship has light with darkness? Or what agreement has Christ with Belial? Or what part has the believer with the unbeliever? Or what concord has the temple of God with idols? It is plain that these things he enumerates are contrary; and for this reason he teaches that they must be fled, because the Lord says: No one can serve two masters (Matt. 6:24). For the Law preaches righteousness, so that iniquity may be fled; it shows the light, which is the truth, so that one may withdraw from ignorance, which is darkness; it proclaims Christ in the mystery of God, so that one may depart from the devil, who wishes falsely to pass himself off as God; it promises eternal life to believers, so that, stripped of faithlessness, they may be strangers to every error of unbelievers; it forbade idols to be worshipped, because they are hostile to the temple of God. For you are the temple of the living God. Nothing is so hostile to man as idols, because they force him to withdraw from faith in the one God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
