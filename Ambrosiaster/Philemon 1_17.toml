[[commentary]]
quote='''
If then you hold me as a partner, receive him as me. He shows that he has such affection for Onesimus that he calls Philemon, whom he praises above, his sharer only if he receives this man as he would the Apostle. For this is what Solomon said: Free men will serve a wise slave (Sir. 10:28). This saying is meant to make Philemon fear, so that he might receive him at least for this reason, if he could not be moved by love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
