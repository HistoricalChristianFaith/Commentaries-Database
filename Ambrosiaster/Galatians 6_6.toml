[[commentary]]
quote='''
But let him who is catechized in the word (that is, who is a hearer of the word of God) share with him who catechizes him in all good things: He says this so that hearers may share with their teachers in all good things. But if they act otherwise than they teach, in these things one must not share with them, but dissent; so that the law may be your guide rather than a man. For he will harm himself, not you; because you observe what he has taught.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
