[[commentary]]
quote='''
But this I say: that he who sows sparingly will also reap sparingly. By the sparing man he means the miser, from whom it is extorted that he contribute; for he regrets that he promised. This he infers from their slowness, who had promised long ago and were deliberating a long time. For this sparing man the harvest is small, because he sows with doubt; for he does not know that what he does profits him. But he who sows in blessing will also reap of blessing. He sows in blessing who does this with good will, in hope of a future reward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
