[[commentary]]
quote='''
These words pertain to the person of God the Father, whom he therefore calls alone immortal and invisible, because all immortality is from him, so that it belongs in truth rather to him alone; for whoever is immortal has it not from himself but from him. In a similar way it is read in the Gospel too, the Lord saying: That no one is good but the one God (Mark 10:18). And again he himself says: A good man out of a good treasure brings forth good things (Matt. 12:35). Yet no one is good but the one God, because he himself is the fountain of goodness, from which the rest are given to drink so that they may be good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
