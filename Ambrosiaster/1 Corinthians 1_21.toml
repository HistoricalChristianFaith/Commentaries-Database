[[commentary]]
quote='''
For since, in the wisdom of God, the world did not know God through wisdom, it pleased God through the foolishness of preaching to save those who believe. The world, that is, men, did not know God in his wisdom; because they gave his unique majesty to figments or to the elements, disregarding him, thinking through the wisdom of the flesh that these things which are seen ought to be worshipped. Therefore it pleased God to ordain a preaching that would seem foolishness to them, so that those who believe what they distrust might be saved, while they are condemned. This, then, is the reversal by which, through the counsel of God, the false is condemned by the true.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
