[[commentary]]
quote='''
He commends him in such a way as to signify his own mind towards him: that from unprofitable he has been made fit for worldly as well as divine services.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
