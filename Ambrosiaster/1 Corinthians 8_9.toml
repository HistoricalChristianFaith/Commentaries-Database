[[commentary]]
quote='''
See, however, lest perhaps your liberty become an offense to the weak. That is, lest, because you say that it is lawful for you to eat meat from the sacrifice, on the ground that you know that an idol is nothing, you cause offense to the brethren who do not yet know that an idol is nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
