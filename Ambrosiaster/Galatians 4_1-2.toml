[[commentary]]
quote='''
Now I say that as long as the heir is a little child, he differs in nothing from a slave, though he is lord of all; but he is under guardians and stewards until the time fixed beforehand by the father. It is true, for the fathers ordained the law and determined up to what age one who is grown must be subject; so that, as long as he is a little child, he cannot use his freedom, nor exercise lordship as an heir; but he is almost like slaves in his condition under guardians or stewards. By this example he proves that those who were under the Law were little children as regards merit, and did not have freedom; for they were subject to the condition of the Law because of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
