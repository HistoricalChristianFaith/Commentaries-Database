[[commentary]]
quote='''
Let no one seek what is his own, but what is another's. It is true that, while each one reclines in the idol-temple, he satisfies his own will, and puts a stumbling-block before a brother weak in conscience. Wherefore we must make haste for the love of our Lord Jesus Christ; so that we may rather safeguard the things that are necessary to our neighbor's salvation than our own will, as the same Apostle, the vessel of election and the spiritual physician, says: Not seeking what is useful to me, but what is useful to many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
