[[commentary]]
quote='''
Nevertheless, to what we have attained, that we mind the same thing, and walk in it. Lest some presumption should arise from this, and something be supposed that had not been revealed by God, he therefore added, saying: To what we have attained, that we mind the same thing; that is, not to mind things outside the rule of discipline in the way of life of faith, but to mind this, which is common and modest in the truth of the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
