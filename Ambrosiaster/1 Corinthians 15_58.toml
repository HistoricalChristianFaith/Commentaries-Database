[[commentary]]
quote='''
Therefore, my beloved brethren, be steadfast and immovable, abounding in the work always, knowing that your labor is not vain in the Lord. Having set out all the things that are necessary for ordering the Church's teaching, and having shown either what is to be avoided or what is to be followed, he now exhorts them to be fixed in the good, and always ready and abundant in the works that bear fruit with the Lord; because through these things which have been set out, they will in future receive the reward of good work from the Lord, so that they could not be overthrown by depraved conversations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
