[[commentary]]
quote='''
If the ear should say: Because I am not the eye, I am not of the body; is it for that reason not of the body? He says that one who is a little lower ought not to be thought unnecessary to the body because he is not among the first.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
