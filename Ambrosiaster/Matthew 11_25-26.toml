[[commentary]]
quote='''
You have heard, dearest brothers, what the Gospel proclaims when the Lord says: I confess to you, Lord of heaven and earth, because you have hidden these things from the wise and sensible, and have revealed them to little ones. Yes, Father, for so it was pleasing in your sight (Matt. 11:25–26). Therefore, if we look into the meaning of these words, we shall see that they were spoken by the Lord for the encouragement of believers, of those who, because they despise worldly wisdom, appear as little ones to the wise of this world, who, though praised by no testimony, still wish to be called wise. So it seemed unworthy to God to show the truth to such as these; but to the humble, who presume nothing of themselves and bend themselves to the divine will, equity requires that saving things be revealed. For this is the one who is wise before God and mindful of his own salvation: the one who sets the law of God above his own learning, seeing that it is supported not by the clatter of words, but by the power of deeds. And without doubt, he is foolish and vain who commits himself to a thing that is backed by no privilege of signs. Therefore God did not promise the kingdom to the learned of this world, but to the faithful; nor does he offer eternity to the examiners of the stars, but to those who act rightly; nor does he give glory to scholars, who try by trickery and tiny arguments to exclude the truth, but to men of good will, who are more exact in life than in speech. For God rejects those who wish to rely more on the brilliance of eloquent speech than on good deeds. Indeed, he also tries to turn the glory of God onto himself who thinks he is adorning God's cause with words. The realities themselves ought to please by their own nature, so that not speech, but meaning is praised. For if meaning is the author of writing, and words were invented to signify things, why should not the things themselves be set forth with pure sense, so as to stir the mind more effectively toward salvation? And so our Lord chose fishermen as Apostles, simple and uneducated men, who, by keeping the faith without any deceit and by living well, might show forth God's truth in themselves. Therefore also the Apostle Paul says: And I, coming to you, brothers, did not come with loftiness of speech or of wisdom (1 Cor. 2:1). And among other things: For, he says, the kingdom of God is not in word, but in power (1 Cor. 4:20); so that, because words are liable to contradiction, power might stand as witness to the law of God, before which every loftiness of speech yields. These things, therefore, have been set forth first, dearest brothers, for the benefit of simpler folk, lest they should perhaps think themselves unworthy of the grace of God because they are by no means trained in secular learning, whereas their simplicity advances them more toward praise; since what the worldly wise, blinded by the pride of letters, do not see, these believe, being wise not in words but in judgment. For they know that God rests in good works, and seeks faith, not polished speech. For they read that the Lord says: On whom shall I rest, if not on the humble and meek and one who trembles at my words? (Isa. 66:2). Therefore, that we may be made worthy of the promised rewards, we must do the things that are commanded by the Lord, confident that the Lord loves those who keep his words. For so he says to his disciples: If you love me, keep my commandments (Jn. 14:15); so that by serving the Lord in these things we may be able to be heirs of his kingdom through Jesus Christ our Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 100: ON THE GOSPEL OF MATTHEW"
