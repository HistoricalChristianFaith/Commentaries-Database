[[commentary]]
quote='''
God is faithful, through whom you were called into the fellowship of his Son Jesus Christ our Lord. Who would doubt the promises and the faithfulness of God, that it will not be otherwise than he said, namely that we who believe in Christ are adopted as sons to himself? For he grants us this, which we believe: that, because we believe that Christ is the Son of God, we may begin to be this ourselves, to remain in the same dignity, as Christ remains, whom we believe to be the Son of God. For fellowship is brotherhood; so that, just as he shows that the faithfulness of God will be unimpaired for us in this matter, so we may not be found distrustful and faithless, but persevering in the adoption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
