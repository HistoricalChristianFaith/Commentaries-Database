[[commentary]]
quote='''
Or did the word of God go forth from you, or did it come to you alone? These are the words of one rebuking; for they were so puffed up, as though this salvation had been promised to them, and the other nations were being called to the faith by their example, or as though there were no others who could receive the grace of God at the preaching of the apostles. For they boasted as if, in coming to the faith, they were conferring a favor rather than receiving one; hence he says: Or did the word of God come to you alone? For everyone who wishes to buy something which he knows is not sought by others approaches the purchase with a certain disdain, as though about to do the seller a favor. Therefore the Apostle rebukes this in the Corinthians, who showed themselves such through the pride of vanity, as if, were they themselves not to obey the words of faith, there would be no one who would believe; as he says to the Jews: It was necessary to speak the words of this life to you first; but since you rejected them, making yourselves unworthy of eternal life, behold, we turn to the Gentiles (Acts 13:46).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
