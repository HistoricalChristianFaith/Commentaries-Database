[[commentary]]
quote='''
Or do you not know that the saints will judge this world. The Apostle says nothing idly; for he said "this world" in order to show that there is another as well; for John the apostle too (1 John 2:15): Do not, he says, love this world. And the Lord in the Gospel: So, he says, God loved the world, etc. (John 3:16). This world, then, is in error, not that higher one, in whose likeness this one was made. Hence man was placed here, made in the image of God, so that, just as in the higher world all things are from one God, so in this one too all might have their origin from one man. Hence it is that Moses in Deuteronomy: When the Most High, he says, divided the nation, as he scattered the sons of Adam, he set the bounds of the nations according to the number of the angels of God. (Deut. 32:8). What is so plain as that this world is, for a definite reason, the image of the higher one? For there is both a lower Jerusalem and that higher one, which the same Apostle calls our mother (Gal. 4:26); there is a lower paradise, in which man was placed and received the command both to work there and to keep it (Gen. 2:8). There is also that heavenly one, into which the Apostle was caught up and heard secret words (2 Cor. 12:2). The saints, then, will judge this world, because by the example of their faith the faithlessness of the world will be condemned.

And if the world is to be judged in us. This world will be judged in us then, if the work of faithless men is not found in us. Are such men, then, unworthy to judge even concerning the smallest matters? That is, those who are going to judge the world itself are surely not unworthy to judge the things that belong to the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
