[[commentary]]
quote='''
That your faith may not be in the wisdom of men, but in the power of God; yet we speak wisdom among the perfect; that is, among those who, by the testimony of power, confess the cross of Christ to be wisdom. For those are wise and perfect who hold the faith no more in words than in deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
