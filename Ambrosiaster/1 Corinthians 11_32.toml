[[commentary]]
quote='''
And our being corrected is nevertheless for our sake: so that we may be amended by fear itself. For in a few lies the amendment of all. Lest with this world, that is, with the unbelievers, we be condemned. For he who approaches the table of the Lord inconsiderately differs in nothing from an unbeliever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
