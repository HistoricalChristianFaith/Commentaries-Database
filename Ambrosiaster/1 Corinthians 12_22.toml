[[commentary]]
quote='''
But much more those members of the body which seem to be weaker are more necessary. It is clear that, although someone may be exalted in dignity, yet if a subordinate is lacking who by his services makes him glorious, the dignity itself will be contemptible: for it is the office through which the dignity stands. It is as if an emperor lacked an army. However great the emperor may be, then, he nevertheless has need of an army; for it is a member of his body, having before it tribunes, counts and masters. Lower than all these are the soldiers, and they are more necessary, like the members of the body which, while they seem lower, are more useful; for without the eyes the hand works, and the foot, by walking, seeks food.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
