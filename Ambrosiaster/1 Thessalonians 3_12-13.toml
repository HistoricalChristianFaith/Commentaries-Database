[[commentary]]
quote='''
And may the Lord multiply you, and make you abound in love toward one another, toward you, and toward all, as we also do toward you, to strengthen your hearts unblamed in holiness before God and our Father at the coming of our Lord Jesus Christ with all his saints. To heap up his joy, with which he rejoices over them, he earnestly wishes them to be multiplied in all good things; so that, on coming to them, he may find in them more that is worthy of praise than he had heard from Timothy; so that they may be found irreprehensible with the saints in the love of God the Father, and at the coming of our Lord Jesus Christ, when the examination before his tribunal has begun to approve each one. He calls him God on account of the terror of his majesty, but Father on account of the kindness by which he deigns to adopt believers to himself as sons, which will be made manifest at the coming of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
