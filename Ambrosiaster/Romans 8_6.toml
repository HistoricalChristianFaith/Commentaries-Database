[[commentary]]
quote='''
The wisdom of the flesh is sin, which brings forth death. For it is called wisdom, though it is a foolish thing, because to worldly men the errors conceived from visible things, whether in thought or in deed against the law of God, seem to be wisdom: especially because all their effort and cunning is directed toward sinning. For they think themselves to be wise if they pursue this more diligently, though nothing is more foolish than to sin. There is also another wisdom of the flesh, which, puffed up by worldly reasoning, denies that something can be done, so that the world may lack reason for it. Therefore it mocks the Virgin birth, the resurrection of the flesh. Truly this is wisdom, which gains life and peace; for by following spiritual things, with the enticements of the present life despised, one will have eternal life with peace, that is, without disturbance; where there is no turmoil and no punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
