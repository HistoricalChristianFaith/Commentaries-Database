[[commentary]]
quote='''
Let a woman learn in silence with all subjection. For it is not permitted to a woman to teach, nor to have dominion over a man, but to be in silence. He commands that a woman ought not only to have humble attire, but also that authority should be denied her and that she should be made subject to the man; so that both in attire and in obedience she may be under the power of the man, from whom she draws her origin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
