[[commentary]]
quote='''
And may my God fill all your desire according to his riches in glory in Christ Jesus. He made a distinction for this reason, saying: My God, so that, in accordance with what he granted to his merits, help might be present to their desires also, in the abundance of the greatness of his goodness, in the glory of Christ Jesus. It is the glory of Christ Jesus when, by the will of God, the desires of Christians are fulfilled according to the discipline of the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
