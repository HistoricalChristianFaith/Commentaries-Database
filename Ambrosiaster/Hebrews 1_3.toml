[[commentary]]
quote='''
ON THE ETERNITY OF THE SON. — Since there are some who, the darkness of error not yet dispelled and the decay of an old and stagnant life not yet cleansed or wiped away, still think in an earthly way and hesitate either about the Son of God, or whether the two are one (for the treacherous and stubborn nation of the Jews, to whom the fountain of the Law and the treasures of the mysteries were opened, does not merely doubt, but denies with wicked words), I will briefly explain as far as the short scope of this discussion allows. For hope is kept intact for the ignorant, if they are willing to learn; punishment is appointed as eternal for those who refuse. Since God Almighty, in His greatness and goodness, surpasses all, He ought to have brought forth and revealed from Himself something great and supremely good. But if He had produced something that fell short of the standard of His own excellence, it would seem either that He was unable to do more, which cannot apply to the Almighty, or that He was unwilling, which cannot apply to One most gracious. Certainly, for the supreme God it would not have been great to make something placed beneath Himself, which could not possess the power of complete supremacy. Above Himself, then, there was nothing; for there is nothing that can surpass God. Beneath Himself, it would have been too little, because what is less is not fitting for what is greatest. Therefore, creating His Son as His own very likeness, He brought forth from Himself, as it were, another Himself; and therefore that highest and greatest good which comes to us from God has overflowed to us through His extension to us. We must also understand this reasoning at the same time: God, who founded this world, and who among the other wonders of beauty and order also granted to created nature the power of generating offspring sufficient for each kind of its own, must surely first have possessed in Himself what He would later give. For no one gives what he himself does not possess. He who therefore had a Son perfectly corresponding to Himself in every aspect of likeness, that is, One with one, the virtuous with the virtuous, the good with the good, the blessed with the blessed, the greatest with the greatest, the everlasting with the eternal, certainly had before the world the primacy of a begotten offspring, from which He imparted a pattern to things that were to come into being, so that the seeds of all that would be begotten would be compelled to match their own generative principles. But when we say that the Son was brought forth, we must not understand this as if He had a birth similar to ours, and was born in the way we see mortals being born, when, at the breaking forth of offspring, things come into existence which did not exist before. For those creatures, conceived from seeds implanted from elsewhere, are fused together from the union of underlying elements into the form proper to their kind; but this (generation) is divine: without any aid of external mixture, God brought forth and produced from Himself that which He always had in Himself and with Himself. For if we say that light is born from the sun because it proceeds and flows from it, we do not say this in such a way as though the sun could ever be, or ever was, without light, so that at some point in time it generated from itself something later than itself, but rather in the sense that what it has always possessed with itself, that light, born from it, so to speak, without any distinction of beginning from when it first started to shine, it always illuminates from itself like a renewing gift. In this way, the Son of God, adhering to the Father absolutely from eternity, has also retained this likeness to Him, so that He has neither a beginning nor an end. And as God is eternal without origin, so also the Son is eternal; and as God is one, simple, and the same, so He is joined with the Father in such a way that, though distinguished by names and relations, they are yet the same, one in both, and each in the one, united in an inseparable majesty. Therefore God, having brought forth the Son not drawn from conflicting materials, but produced out of the simple and unique stock and seedbed of His own nature, always possessing Him in Himself, and never at any time having let Him go by any separation from Himself, holds and embraces Him in such a way with Himself that nothing in either of them is altered from that unity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 9: ON THE ETERNITY OF THE SON"
