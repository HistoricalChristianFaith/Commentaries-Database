[[commentary]]
quote='''
And he himself gave some indeed as apostles, and some as prophets, others as evangelists, and some as pastors and teachers, for the perfecting of the saints, for the work of the ministry. The apostles are bishops (Acts 11:26); the prophets, on the other hand, are expounders of the Scriptures; although in the very beginnings there were prophets, such as Agabus, and the four virgins who prophesied (Acts 21:9), as is contained in the Acts of the Apostles, for the commending of the rudiments of the faith (Acts 7:2 ff.): but now interpreters are called prophets. The evangelists are deacons, as Philip was; although they are not priests, yet they can preach the gospel without the chair, as did both blessed Stephen and the Philip mentioned (Acts 8:5). The pastors can be readers, who feed the listening people with reading; because man does not live by bread alone, but by every word which proceeds from the mouth of God (Matt. 4:4). The teachers, moreover, are exorcists, because in the Church it is they who restrain and beat the unruly: or else those who used to instruct in letters and readings the children who were to be instructed, as is the custom of the Jews, whose tradition passed over to us, and which has fallen into disuse through negligence. Among these, after the bishop, he is understood to be the greater who is said to prophesy because he has unlocked the hidden sense of the Scriptures; especially because he brings forth words of future hope; which order can now be that of the presbyterate. For in the bishop are all the orders: because he is the first priest, that is, he is the chief of the priests, and prophet, and evangelist, and the other offices of the Church to be fulfilled in the ministry of the faithful. Yet after churches had been established in all places, and offices ordained, the matter was arranged otherwise than it had begun. For at first all taught, and all baptized, on whatever days or times there was occasion; for neither did Philip seek a time or a day on which to baptize the eunuch (Acts 8:38), nor did he interpose a fast; nor did Paul and Silas put off the time at which to baptize the jailer with all his household (Acts 16:33); nor did Peter have deacons, or seek a day, when he baptized Cornelius with all his house (Acts 10:48): nor did he do it himself, but he commanded the brothers who had gone with him to Cornelius from Joppa to baptize; for as yet no one had been ordained except the seven deacons. So then, that the people might grow and be multiplied, it was granted to all at the beginning both to preach the gospel, and to baptize, and to explain the Scriptures in the Church; but when the Church had embraced all places, assemblies were established, and rulers, and the other offices in the churches were ordained; so that none of the clergy who had not been ordained should dare to presume upon an office which he knew had not been entrusted or granted to him. And the Church began to be governed by another order and providence; because if all could do the same things, it would be irrational, and the thing would seem common and most cheap. Hence therefore it is that now neither do deacons preach among the people, nor do clergy or laity baptize, nor are believers dipped on just any day, except the sick. Therefore the writings of the Apostle do not in all respects agree with the ordering which is now in the Church; because they were written in the very beginnings. For he also calls Timothy, a presbyter created by himself, a bishop; because the first presbyters were called bishops; so that when one departed, the next might succeed him. Indeed in Egypt the presbyters seal, if the bishop is not present. But because the presbyters who followed began to be found unworthy to hold the primacy, the arrangement was changed, a council providing for it, so that not order but merit should create a bishop, appointed by the judgment of many priests, lest an unworthy man should rashly usurp the office and be a scandal to many. In the Law the priests were born of the stock of Aaron, Levites (Exod. 28:43): but now all are of priestly stock, as the apostle Peter says: Because you are a royal and priestly race; and therefore a priest can be made from the people (1 Pet. 2:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
