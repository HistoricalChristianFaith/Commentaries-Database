[[commentary]]
quote='''
And we charge you, brothers, in the name of our Lord Jesus Christ, that you separate yourselves from every brother walking intemperately, and not according to the tradition which you received from us. Since in every people not all are obedient to the word of teaching, following not the Law's pleasure but their own pleasure and counsel; on this account he commands that they be shunned, so that they may recognize that they themselves are going astray.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
