[[commentary]]
quote='''
In whom you too, when you had heard the word of truth, the Gospel of your salvation, believing, were sealed with the holy Spirit of promise, who is the pledge of our inheritance, unto the redemption of acquisition, to the praise of his glory. It is the praise of God's glory when many are gained for the faith, just as it is the glory of a physician if he cures many. And therefore it belongs to the glory of God that he called the Gentiles, that they might obtain the remedy of their salvation through the faith promised to the Jews, having the sign of redemption and of the inheritance to come, the Holy Spirit given after baptism. For the redeemed have been designated heirs if they persevere in regeneration, so that the first faith may merit pardon, but a holy way of life persevering with faith may merit the crown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
