[[commentary]]
quote='''
If anyone, then, purges himself from these, he will be a vessel for honour, sanctified, useful to the Lord, prepared for every good work. Now another heresy is convicted of its deceit, which asserts that certain souls are evil by nature and cannot be brought to the good; whereas he says here that the evil can be changed into good, and the unclean be purified. For Hymenaeus and Philetus could have cleansed their minds, had they wished, so as to become a sanctified vessel, prepared for honour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
