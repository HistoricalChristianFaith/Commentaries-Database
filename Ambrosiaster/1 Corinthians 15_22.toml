[[commentary]]
quote='''
For as in Adam all die, so also in Christ all will be made alive. He says this because, just as Adam by sinning found death, and held all who are of his origin, so that they are dissolved, so also Christ, not sinning, and through this conquering death (for he who does not sin conquers death, since death comes from sin), acquired life for all who are of his body, that is, resurrection. Although, then, he has granted a general resurrection, so that just as in Adam all, whether righteous or unrighteous, die, so also in Christ all, believers as well as those who distrust, rise, though the unbelievers rise to punishment; yet they seem to be made alive, because they will receive their bodies, no longer to die, but to suffer punishment in them without end: for they refused to believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
