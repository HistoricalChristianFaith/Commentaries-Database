[[commentary]]
quote='''
JOHN TO THE LORD: "ARE YOU THE ONE WHO IS TO COME, OR SHOULD WE EXPECT ANOTHER?" (Matt. 11) — In his own person he is acting on behalf of his disciples. For John was not doubting, he who had said: "Behold the Lamb of God, behold him who takes away the sins of the world" (Jn. 1:29); but to satisfy his disciples he sends them with his own words, so that by the mouth of the Savior he might confirm what he himself was teaching about him, in order that after his own departure his disciples might follow Christ without any doubt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 14: JOHN TO THE LORD, 'ARE YOU THE ONE WHO IS TO COME?'"
