[[commentary]]
quote='''
To be magnified in you according to our rule in abundance, and that I may evangelize even in the regions that are beyond you. Gladder because of their faith, he professes that he must of necessity preach beyond them, to increase the glory of his preaching, where it had not yet been preached. That we may not boast in things prepared in another's rule. It is plain that a prudent man does not trust in, nor hope for glory from, things that rest on the labors of others. Therefore the Apostle too is not bold toward those who believed through the preaching of others, lest he seem to boast in others' labors; but he strives for this: to preach to those to whom it had not been announced, so as to seek glory by his own labor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
