[[commentary]]
quote='''
ON THE ORDER OF DAY AND NIGHT. — As far as the structure of the world is concerned, we read of darkness before we read of light. For those things which contributed to the making of the world, and which appear to have been made together, are considered to have been without light; that is, water, earth, darkness, from which the world was compacted, as is contained in Wisdom, which is called Solomon’s, “out of formless matter” (Wis. 11:18), that is, dark matter. For both darkness and water are testified by the sacred books to have been made by the very voice of the Lord through the prophet Isaiah: “I,” he says, “am God, who made the light and created the darkness” (Isa. 45:6–7). Likewise, through David, the Holy Spirit shows both that the waters were made and that the earth was established upon the waters (Ps. 135:6). This agrees both with the authority of the Gospel and the tradition of the Apostles, in which all things are read as having been made; and so that nothing might be excepted, he says, “whether things in heaven or things on earth” (Jn. 1:3; Col. 1:16). Therefore, in this part which pertains to earthly things, we read of darkness before light. This, however, is only in respect to the order of the reading, not in respect to dignity; for of course light is much better than darkness. Yet in the ordering of the world light receives the name by which it is called day, and darkness is called night; but specifically for this reason, that when the darkness is illumined and the light passes, that span of time until the light returns is called night; and that span of time during which the darkness is illumined is called day. When night is named, then, the coming day is expected; and when day is named, the coming night is expected. But when these functions cease, with the passing away of the world, they will be called only darkness and light. For it cannot be called night when there are perpetual shades, nor day when the light has ceased to set. Where eternity is, these names cease, because they began with the world. Indeed, before light was made, which was called day, it is not read that there was night, but darkness; which, after they were illumined and the light passed, were called evening and night. Therefore, as far as appears, night is lesser to day. For just because darkness is mentioned before light, it should not therefore seem to be preferred; since heaven existed before the sun, and yet the sun is greater in brightness; and the earth before man, and cattle and the other animals, and yet they are subject to man. Night therefore must not be set before day merely because darkness is read first; since it is clear that in dignity light precedes darkness, and in time day precedes night. For as was shown above, when there was darkness, light was made. “And God called the light Day, and the darkness he called Night; and there was evening and morning, one day” (Gen. 1:5). For if there had been no day, there would not even be night; there was, in fact, darkness, which, when it was illumined and the day had passed, its course completed, became evening. And when after evening it grew light, the first day came to be, the night having passed, so that night might follow day. This is both fitting and rationally praiseworthy: that a lower nature in all things be subject to a higher. How then is night said to be before day, when you read its name after day? For it would not have been called night, nor evening, unless, once light was made, it had run its course as day; when that ended, evening came to be, which is night. The day indeed became evening, so that you may know that night is a part of day. For the day is completed only when night too has passed. Therefore we say, “The year has three hundred and sixty-five days,” not, of course, without nights. For when we say “days,” we are there including nights as well. Under the authority of “day” we signify night; for if night were the leading term, under the name of night day too would be counted. Who among men says, “After five nights I will see you,” and not, “after five days”? Nor do we remember ever to have read anywhere that night was named before day. For “Moses,” he says, “was on the mountain forty days and forty nights” (Exod. 24:18). And in the Psalm: “The sun,” he says, “shall not burn you by day, nor the moon by night” (Ps. 120:6). And to give an example from the very beginnings: “Let there be,” he says, “luminaries in the firmament of heaven, and let them give light upon the earth: the greater luminary for the beginning of the day, and the lesser luminary for the beginning of the night” (Gen. 1:14). But the moon cannot be set before the sun, just as night cannot be set before day; rather, as the moon is under the sun, so night is under day. And in the Gospel we have both days and nights indicated under the authority and numbering of days. For the Lord says, among other things, “There are some standing here who will not taste death until they see the Son of Man in his kingdom.” And he added, “And it came to pass after eight days” (Luke 9:27, etc.). Are not nights included in this number? And in another place: “These things,” he says, “were done in Bethany beyond the Jordan, where John was baptizing. On the next day he saw Jesus coming.” Did he say, “On the next night”? Again it follows: “On the following day he wished to depart into Galilee” (John 1:28–29, 43). And in what follows: “And on the third day there was a wedding in Cana of Galilee” (Jn. 2:1). See how everywhere day is shown to have authority, having night as its subordinate. For if all were contained under the name of night, night would precede day. Therefore, because the Romans have the rule, the Spaniards and Gauls and Africans and the rest who are subject to them are called Romans under their name; so also night, because it is subject to day, is contained under its name. But some are deceived on this point, because the Jews are ordered to enter the sabbath in the evening, and they do not consider why such a command was given. For indeed they necessarily have to buy food for themselves the day before, and prepare it for the sabbath, and go to wash. Can they do these things by night, so as to enter the sabbath at sunrise? The Lord certainly rose again in the evening, and this is reckoned to the day. For the resurrection is celebrated on a day, which is called the Lord’s Day. Therefore you read, “This is the day which the Lord has made” (Ps. 117:24); yet not “the Lord’s night,” because day holds the primacy. For whether on the past day or on the future, night is always placed beneath; because it is lower both in order and in nature, as the Apostle says: You are children of the day and of the light, not of the night nor of darkness (1 Thess. 5:5). And if we judge by the consuls, we shall see that he is named first who is chosen first. Indeed it is customary to say, With him who will be consul? If therefore night were also before day, it would be named first. For the reckoning so truly begins from the day, that, for example, if we say, Tomorrow is the sixth day before the calends, it is of course from morning until another morning is reached, so that a day and a night having passed, the count is complete. For the moon too, of course, was made on the morning of the fourteenth day; for it had to be made to shine for the whole night, and on the next morning the fifteenth began. Why then is there any doubt, that the beginnings are to be taken from the day? On account of the disputes of certain persons about a matter that is obvious, we have been forced to speak at greater length, although the reading itself explains itself, in which day is signified before night with clear reasoning. All these things mentioned above we have said according to the origin of the world. But if we wish to speak more deeply, lifting up our understanding with spiritual strength, we discover it to be unfitting to assert that darkness was created before light. For if the nature of light is heavenly and that of darkness earthly, it is surely senseless to think that light was made after darkness; because Moses says that light was made in that part in which the world now is, not that it was then created; for all spiritual things were created before carnal things, so that the light which was in the heights might come to be in the lower regions, like a lamp in a house. But in what way are darknesses said to be before light, when they are always seen after light? Indeed, heavenly and spiritual things are believed by nature to be light, earthly and carnal things to be darkness; so that the nature of darkness seems to subsist by the power of light, because all that is lowest belongs to what is highest. For if we question, we discover darkness even in the sun itself. For when you are close to it, it appears so very bright that it cannot be looked at; but at a certain distance, still very bright, yet such that it can be seen; but if far away, less bright: the farther, the less bright. From this there appears a certain defect which proclaims darkness, and therefore it comes about that darkness seems to take its rise from light. Therefore he who made light created darkness also in this way, just as in making water he at the same time created earth: so that, as earth is the solid support of water, so darkness is the defect of light. But God alone is he who does not suffer defect, who, although he is everywhere, or rather has all things within himself, is so exceedingly bright that he is seen by no one, unless he is willing to moderate himself. Indeed, although the Savior was in the body and was not shut in, yet he was not seen, unless he willed it. For when he was transfigured on the mountain and appeared in great glory (Matt. 17:1–2), that which, as it were, lay hidden in the body he revealed when he willed. How then was he hidden, who was not enclosed? For if, with his body, he entered to the disciples through closed doors (Jn. 20:19), how does his divinity not penetrate all things? that is, it cannot be shut in, because it does not suffer defect. Since therefore God is absent from nowhere, yet he is said to be there where he appears and wills to be seen. And since all things are in God, because he surpasses all things, as the Apostle says, For in him we live and move and are (Acts 17:28); he himself, nonetheless, is in nothing except in what he wills. By a certain mystery he is in all things, and by a certain providence he appears where he wills.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 107: ON THE ORDER OF DAY AND NIGHT"

[[commentary]]
quote='''
WHY DO WE, WHO ARE KEEPING THE PASSOVER FEAST (EASTER) BY THE PHASE OF THE MOON, REPROACH THE PAGANS FOR OBSERVING THE DAYS AND THE DIFFERENT PHASES OF THE MOON? — Far be it from Christians to be said to worship the stars, when they have been granted a spiritual cultivation, so that, despising what is seen, they may be united to what is invisible and above the heavens, and surpass all these things, destined to be with the Angels of God. For the worshipers of the stars will either be with them, or below them. How can it happen that someone should be above the things he worships? The pagans therefore do not observe the calculation of the moon, but worship the moon itself as a goddess. And having persuaded themselves that they have grasped the effects of its courses, they determine what must be done or avoided on particular days, subjecting their life and conduct in an ordered way to its supposed authority. Because they have dared to take these things outside God’s ordinance, we frequently discover that they are deceived. For God appointed these luminaries as signs for the seasons. Therefore we too keep the count of the moon, but we do not cultivate the moon itself; so that from the fourteenth moon, which according to the Law is for us the first, we may observe the rule of Easter. For God established all things in fullness: and therefore from the fourteenth up to the twenty-first, in these seven days it has been granted to us to celebrate Easter, so that some of these seven days may be enclosed between the preparation (Parasceve) and the resurrection of the Lord: so that neither the thirteenth day be in the Passion, nor the fourteenth or fifteenth in the Resurrection, lest the Passion of Christ be before the first moon as we count it, nor His Resurrection be on a day other than the first day on which the world was begun. For all the seasons of the world are numbered by the cycles of a single week, because in these days God composed the parts and ornaments of the world. In six days He fitted the world, and on the seventh He ceased, which He called the sabbath. In these seven days the order and number of the entire world are contained. For they ever return into themselves, increasing the number of the seasons. After the sabbath, therefore, it always repeats from the first day up to the seventh day, that is, the sabbath; so that we may learn that the Lord’s resurrection took place on the first day of the world’s beginning, which is called the Lord’s Day. For the Lord made that day one with the evening, and being unfolded into the sevenfold number, it begins again, so as to be the first after the week. This was so decreed from the beginning because of the mystery of the Lord’s incarnation, Passion, and Resurrection. For in the body of the Lord almost the whole world rose again and was renewed. It is settled that we do not worship the moon, but keep the number that has been established by the moon’s course. But the Devil, who is Satan, in order that he may attach some authority to his deceit and color his fabricated lies with truth, in the first month in which he knows the Lord’s mysteries are to be celebrated, since he is not of small power, instituted mysteries for the pagans to observe, so that he might hold their souls in error for two reasons: since deceit has anticipated truth, it might seem that deceit is something better, as if by its antiquity influencing the truth. And because in the first month, in which the Romans have the equinox, as we do, that same observance is kept by them, so that they even say that expiation is made by blood, just as we by the cross: by this trickery he keeps the pagans in error, so that they think our truth to appear rather an imitation than truth, as though invented through a certain superstition in rivalry. “For,” they say, “what has been discovered later cannot be judged true.” But since among us truth is for certain, and this is from the beginning, signs of powers and wonders bear witness, so that, with power as a witness, the wickedness of the Devil may be made known. For since truth alone easily persuades, it has been set against the cunning and pre-emption of the Devil, to reveal his deception. For no one, not even among enemies, would dare deny that there is truth where power appears.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 84: ON KEEPING EASTER BY THE PHASES OF THE MOON"
