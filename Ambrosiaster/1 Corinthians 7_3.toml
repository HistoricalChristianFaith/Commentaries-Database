[[commentary]]
quote='''
Let the husband render the debt to the wife, and likewise also the wife to the husband. They are subject to each other in this matter, so that, since they are one body, theirs may also be one will in the law of nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
