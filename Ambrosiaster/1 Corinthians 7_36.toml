[[commentary]]
quote='''
But if anyone sees himself disgraced over his virgin, if she is past puberty, and so it ought to be done; let him do what he wishes, he does not sin, if she marries. Since above he so exhorted, with his reason given, that virginity and continence be held, that in comparison with them marriages almost seem useless and to be cast aside, now, lest he be thought to deny marriage, he shows that the virgin does not sin if she marries; but that she undertakes a matter of the greatest labor, and one that has no reward before God, just as it has no punishment: for he wants Christians to be better in all things. If, then, a girl is in desire of marriage, already ripe for its use, it is better that she marry publicly according to the law that has been granted, than that she do it shamefully in secret, and shame be brought on in her case.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
