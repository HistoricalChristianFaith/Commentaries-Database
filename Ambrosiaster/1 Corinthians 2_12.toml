[[commentary]]
quote='''
But we have not received the spirit of this world; but the Spirit who is from God. From this we know that we have received the Spirit who is from God: because the spirit of the world cannot know the things that have been made known to us by him. The spirit of the world, however, is this one, by whom fanatics are seized, who are without God; for among the worldly spirits he is the stronger; whence he is accustomed to divine by conjectures the things that belong to the world, and they call him python. This is he who through likelihoods is deceived and deceives: this is he who spoke through the Sibyl, following our sense, wishing to have a place among the heavenly beings.

That we may know the things that have been given to us by God. For because the Spirit of God has been given to us, we know the things that have been given to us by God. For we could not know these things if we had the spirit of the world; for the spirit of the world cannot know them. For no one knows the mind of God except the one who is from God, the Spirit of God; for lower things cannot know the counsel of higher ones, nor can a creature discern the will of its maker.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
