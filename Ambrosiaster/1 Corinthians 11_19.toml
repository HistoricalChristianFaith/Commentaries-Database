[[commentary]]
quote='''
For there must also be heresies, so that those also who are approved may become manifest among you. Knowing that some were corrupted in mind by the cunning of the devil, he says: There must be heresies. He did not, of course, will it or wish it; but because he knew it would come, he said so, just as the Lord also: It must be, he says, that scandals come (Matt. 18:7). And: The Son of man must suffer (Luke 9:22), foreknowing that Judas would be the betrayer. That the approved, moreover, may become manifest among you: when he says this, he signifies those who, persevering in the tradition they had received, were an example of the proof of the gospel discipline, to the condemnation of the rest. These are those whom he signifies at the head of the letter, in that they said: But we are Christ's; while others said: I am Paul's, I am Apollos' (1 Cor. 1:12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
