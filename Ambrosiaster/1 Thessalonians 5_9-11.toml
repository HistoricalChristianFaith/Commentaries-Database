[[commentary]]
quote='''
For it was for this reason that the Lord Jesus died for us and rose again: that whether we watch, that is, live, or sleep, that is, die, we may enjoy eternal life together with him. This is what he said above, that at the coming of the Lord the faithful, the dead as well as the living, will be taken up to meet the Lord, and will live with him always. He teaches that this is to be meditated upon, so that they may build one another up in this understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
