[[commentary]]
quote='''
Keeping in memory, you who were once Gentiles in the flesh, who are called uncircumcision by that which is called circumcision, made by hand in the flesh, that you were at that time without Christ, alienated from the way of life of Israel, and strangers to the testaments, and having no hope of their promise, and without God in this world. He admonishes the Gentiles that, remembering what they had been (for they were carnal, and without hope, having no share in the promise of the Jews in Christ; for Christ had been promised to the Jews, not to the Gentiles), they may give thanks more readily to God through Christ, who in his mercy made them partakers of spiritual things when they were carnal. Yet he says circumcision made by hand in the flesh for this reason: to signify another, spiritual one, not made by hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
