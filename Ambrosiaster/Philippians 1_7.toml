[[commentary]]
quote='''
Nor ought he to have thought otherwise about those whom he had found always unbending in devotion to God, seeing their course so straight and untiring, so that he would consider them worthy to be partakers of his joy. For men of one faith ought to rejoice together over the hope of future immortality and glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
