[[commentary]]
quote='''
Being confident, therefore, always, and knowing that while we dwell in this body we are abroad from the Lord; for we walk by faith, not by sight. It is plain that we are with the Lord by faith, not by presence, and for this reason we are abroad not in faith but in sight. And why, when the same man says in the Acts of the Apostles, For in him we live and move and are (Acts 17:28), does he say in this place that we are abroad from the Lord? If he is everywhere, how are we, placed here, abroad from the Lord? Without doubt he is everywhere; rather, all things are in God; but because the seat of God is in the heavens and there he is always seen, therefore, placed here, where he is not seen, we are said to be abroad from him. For when we do not see him, although he is present, we are absent from him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
