[[commentary]]
quote='''
For though I am free from all, I have made myself the servant of all, that I might gain more. He is free from all, since he handed on the Gospel to no one in flattery, nor coveted anything of anyone's except his salvation, nor, in order to have luxuries, accepted from anyone more lavish provisions as the wage of hypocrisy. But he says that he made himself the servant of all in this way, while through humility he showed himself like all who are weak in mind, so that through patience he might strengthen them for the future salvation, cherishing the minds of those who were either sinning or following divine things too slowly, so that they would not take it harshly to be rebuked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
