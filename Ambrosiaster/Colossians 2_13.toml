[[commentary]]
quote='''
And you, when you were dead in offences and in the foreskin of your flesh, he made alive together with him, forgiving us all offences, having blotted out the handwriting which was against us, the decree which was contrary to us: and he took it out of the way, and fixed it to the cross, and stripping off the principalities and powers, he made a show of them with authority, triumphing over them in himself. He says that the Gentiles were dead: first, indeed, because they refused to receive the Law, which was given as a testimony to the Creator and to condemn vices: then, because of the impiety of their sins, they were unworthy of life; and so he distinguished them from the Jews, as men who had been enemies of the one God. But the Jews, living in the confession of the one God, at the coming of Christ learn the mystery of God, which they were awaiting for their justification: so that in that which had crept upon them unawares, since it is impossible to be without sin, they might receive remission. Hence, after the case of the Gentiles, he brings in the Jews too, saying: Forgiving us all offences; so that after the particular he might add the general; because he forgave all men all offences. But because, as the Lord says, He to whom more has been forgiven ought to love more (Luke 7:43): for this reason he admonishes the Gentiles that, considering the causes of their evils, and what grace they have received from God in Christ, they should be solicitous with all devotion for the service of him by whom they have been freed from the various penalty of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
