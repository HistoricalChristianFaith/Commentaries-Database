[[commentary]]
quote='''
And he warns that these very things be done in love; because what is done with love has the fear and zeal of God; for whatever is done with offense to a brother has no fruit. For some are to be provoked to good, not saddened: for example, if you do not show mercy, by dissuading another, or are inhuman, or brand others, or eat something, insulting him who abstains from it, so as to cause him a scruple. All things are to be done in such a way that there is exhortation to better things, not insult, and then there is peace. Hence the Lord says, by this it is known if you are my disciples, if you love one another (John 13:35): but where there is contention and dissension, there is no love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
