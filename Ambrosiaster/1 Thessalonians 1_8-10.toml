[[commentary]]
quote='''
So that we have no need to speak anything. For they themselves announce concerning us what kind of entrance we had to you: and how you turned to God from idols, to serve the living and true God, and to wait for his Son from heaven, Jesus, whom he raised from the dead, who has rescued us from the wrath to come. They say that the report of their entrance and of the Thessalonians' conduct, together with the preaching of the Gospel, had travelled so far that there was no need to tell of these things; for it is superfluous to speak of what is known. For it had reached all round about, so that they even announced to others with what devotion they had received the apostles. And because they had been the more ready for all the things they had heard from them, leaving dead gods: and were waiting for Christ from heaven, who, they had heard, died for the sake of human salvation, and rose again with death vanquished, and was taken up into heaven with his flesh, a cloud ministering to him, to the confusion of the wise of the world, who, having regard to worldly things, think that the nature of flesh, because it is heavy, cannot be raised up into heaven. This is done by the working of the Holy Spirit, so that the earthborn wise may blush.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
