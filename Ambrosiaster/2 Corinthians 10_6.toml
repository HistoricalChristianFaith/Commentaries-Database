[[commentary]]
quote='''
And ready in all things to punish all disobedience, when your obedience has been fulfilled. It is plain that he punishes disobedience when he condemns it through obedience, destroying it at the moment when he leads those who resist to the faith; so that faithlessness is condemned by those by whom it used to be defended.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
