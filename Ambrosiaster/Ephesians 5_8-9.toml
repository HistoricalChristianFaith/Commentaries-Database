[[commentary]]
quote='''
Walk as sons of light, for the fruit of light is in all goodness, and righteousness, and truth. He says this so that they may so conduct themselves that they are not undeservedly called sons of light. For the works of light are done openly, without fear; but the works of darkness in secret, because they are unlawful; for every sin fears to be done openly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
