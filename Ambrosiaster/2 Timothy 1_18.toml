[[commentary]]
quote='''
His visit was so welcome to the Apostle that he commends him to the Lord in such a way that he may find mercy with the Lord on the day of judgment; so that, just as he found the Apostle by seeking him, so also, seeking mercy, he may find it with the judge. For this is what he prays: that the Lord, the Father of heaven and earth, may grant him to find grace with the Lord of the human race, that is, the Son. This is like that passage in Genesis: And the Lord rained, he says, sulphur and fire upon Sodom and Gomorrah from God out of heaven (Gen. 19:24).

And how much he ministered to me at Ephesus, you know better. Since some are wont to serve persons rather than causes, wishing to gratify their superiors, the Apostle therefore shows the general goodness of Onesiphorus, lest he should perhaps seem to have commended himself to a person when he ministered to the Apostle; since it was clear that he had been great-hearted towards all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
