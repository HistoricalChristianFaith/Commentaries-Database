[[commentary]]
quote='''
Bring him on his way in peace, that he may come to me; for I am waiting for him with the brothers. He records so great a merit in Timothy that he not only commands that he be honored among them, but shows that he is to be brought on his way with deference as an apostle of the Lord; so that he himself was also waiting for him with the brothers for the sake of the Gospel of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
