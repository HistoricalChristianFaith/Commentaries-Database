[[commentary]]
quote='''
For if righteousness is through the Law, then Christ died for nothing. Nothing is so clear: because if a man could have been justified through the Law, Christ need not have died. But because the Law could not give the remission of sins, nor, triumphing over the second death, despoil it of the captives whom it held on account of sin, therefore Christ died, so that he might provide those things which the Law could not; and accordingly he did not die for nothing; for his death is the justification of sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
