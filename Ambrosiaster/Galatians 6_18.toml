[[commentary]]
quote='''
The grace of our Lord Jesus Christ be with your spirit, brothers. He does not speak of the grace of the Law, but says that the grace of our Lord Jesus Christ is with the spirit of those whom he calls spiritual brothers; for not all of them had been utterly overthrown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
