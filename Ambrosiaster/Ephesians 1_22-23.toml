[[commentary]]
quote='''
And he has subjected all things under his feet, and has given him as head over the whole Church, which is his body and fullness, who is fulfilled all in all. He says that the Father has subjected the whole creation to the Son, so that, because he made all things through him (John 1:3), he himself may be the head and Lord of all. He subjected all things to him then, when he begot him before all things, so that through him he might make the things that were not. In saying the whole Church, he comprehends in sum all that is in heaven and on earth, so that they may be made his members into a new man, while they confess that he is the one through whom they were made by God. For they are subjected to him as members to the head from which they draw their origin, so that all things may be fulfilled in all. For when they have returned to the confession of the one God, bending the knee to Christ, it is fulfilled in all that he may be all; because they are from him: and thus he himself is in them, because they subsist by his power; for those who withdraw from God seem to make him void. Hence he says in another place: That all things may grow unto the increase of God (Col. 2:19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
