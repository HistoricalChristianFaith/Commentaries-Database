[[commentary]]
quote='''
Therefore they are said to tell fables, not the truth; for they think that one must never depart from the things that Moses handed down, as, for example, concerning foods, or marriages, or new moons, or the blood of a weasel, or a house unclean for seven days; though they know that their forefathers Abraham, Isaac and Jacob were justified without these things and were called friends of God; and as the prophet Ezekiel testifies that, because they had profaned the law of God and his justifications, they received precepts and commandments that were not good, in which they could not be justified. Hence the Lord too says to the Jews: Because Moses wrote these things for the hardness of your heart (Mark 10:5). Hence it is that the apostle Peter too: Why do you lay, he says, a yoke upon the necks of the brethren, which neither our fathers nor we have been able to bear (Acts 15:10)? For if they had been useful, they would have been given then, when the Law too was given on the tablets; but because, after such great signs of wonders and after the Law had been published, they were found irreverent and distrustful and stiff-necked, they received commandments of such a kind and so many, in which they could not draw breath. Hence it came about that the good also laboured along with the bad, though they would receive a reward. These things, therefore, were given as a punishment, so that at the time when the promised gift of God came, the mercy of God should loosen all the things that it had previously forbidden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
