[[commentary]]
quote='''
But up to this very day, when Moses is read (Exod. 34:33), a veil is laid over their heart. It is manifest that when this part of the Law is read, the sentence of those who are under the Law is recited.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
