[[commentary]]
quote='''
He who does this work will be manifest; for the day will declare it, because it will be revealed in fire. That is, bad doctrine will appear to all in the fire; for now it deceives some. And the fire will prove what sort each one's work is. For since the examination will be made by fire, if it finds nothing in someone to burn up, it shows that he was a good teacher; for bad and adulterous doctrine was signified by wood, hay and stubble for this reason, to show that it is food for fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
