[[commentary]]
quote='''
If, therefore, we who live are delivered to death for Jesus' sake, so that the life of Jesus also may become evident in this mortal flesh of ours. What he says is plain: for this reason, he says, we do not refuse to be delivered to death for Jesus' sake, though we could live, so that the life by which Christ rose from the dead may be granted to this mortal flesh of ours, that is, not to fear to die, because of the promised resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
