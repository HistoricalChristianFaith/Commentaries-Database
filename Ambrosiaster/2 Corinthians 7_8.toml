[[commentary]]
quote='''
So that I rejoiced the more; hence, even if I grieved you in the letter, I do not regret it. It is plain that he ought not to regret this matter, from which such an effect followed, namely that in the first letter he rebuked their errors rather severely. I do not regret, he says, having written rather harshly, because the case demanded it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
