[[commentary]]
quote='''
But labour together in the Gospel according to the power of God, who has saved us. Since death was conquered by the power of God so that we might be able to be saved, accordingly it is fitting that we make the Redeemer some return, at least in part. For since we cannot respond to all his benefits, let us at least carry out his embassy faithfully and earnestly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
