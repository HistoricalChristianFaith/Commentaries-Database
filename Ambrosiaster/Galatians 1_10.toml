[[commentary]]
quote='''
For do I now satisfy men, or God? that is, do I satisfy men by persuading you to return to the grace of Christ, or God? Not men, certainly, but God; so that through satisfaction they may return to God, whom they had spurned. Then he immediately added: Or do I seek to please men? If I were still pleasing men, I would not be a servant of Christ. He signifies therefore that those by whom they had been overthrown were pleasing not God but men in subverting the Galatians, as he himself also had done long ago, when he persecuted the Church to vindicate the tradition of the Fathers. For, so that they might be praised by the Jews, they said, according to their will, that the Law must be kept, lest, if they preached the true Gospel of Christ, they should make them their enemies. But this apostle Paul, who taught that one should please God with all devotion, did not fear to offend men, provided he commended the glory of God; for, putting all present things after those to come, he commended himself to hopes, as a fit servant of Christ: but those cannot be fit servants who under the name of the Lord pursue their own gains. But perhaps someone may object: Then those who preached the Law, which God is said to have given, were serving men. How then is the Law said to be fit, whose preaching is related to have been tempered according to the wills of men? Before the coming of the Lord the Law was preached according to the will of God; for its time was owed to it, that it should be kept: but when the Lord promised in the Law came, the Law had to cease, according to the foretold judgment of the prophets. Hence the Lord says: The Law and the prophets until John (Luke 16:16); for it was not fitting that, with the Lord present, the authority of the Law should be kept. And therefore if anyone henceforth thinks that the Law is to be kept, he no longer obeys the will of the Lord, but resists it; for he satisfies those like himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
