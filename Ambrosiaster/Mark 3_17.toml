[[commentary]]
quote='''
WHY DID THE SAVIOR CALL HIS DISCIPLES “SONS OF THUNDER” (Mark 3:17), WHO WOULD SEEM FAR MORE TO BE CALLED SONS OF GOD? FOR THUNDER IS SAID TO BE PRODUCED BY THE COLLISION OF CLOUDS. —Since thunder inspires fear, for this reason He called the disciples sons of thunder, as if they were sons of Him who is to be feared. For although thunder is caused by the collision of clouds, yet it happens by the will of God and is terrifying.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 24: WHY THE DISCIPLES WERE CALLED SONS OF THUNDER"
