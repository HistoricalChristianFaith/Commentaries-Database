[[commentary]]
quote='''
But all things are from God. Although Christ has redeemed us, yet all things are from God, because from him is all fatherhood (Eph. 3:15); and therefore the person of the Father must be put first.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
