[[commentary]]
quote='''
But God is faithful, that our word with you is not Yes and no. This is what he also says to the Galatians: If I build up again these same things which I destroyed, I make myself a transgressor (Gal. 2:18). Therefore he says that the preaching of God is faithful in him: for flatterers do the other thing. For often, so as not to offend men, they pass over the things that are true.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
