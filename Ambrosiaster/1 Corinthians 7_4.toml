[[commentary]]
quote='''
Let the woman not have power over her own body, but the husband; likewise also let the husband not have power over his own body, but the woman. He says this: that it is lawful neither for the husband nor for the wife to hand over his or her body to another; for they are debtors to each other in this matter, lest an occasion of sinning be given.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
