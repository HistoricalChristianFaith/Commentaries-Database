[[commentary]]
quote='''
Which is known and read by all men: made manifest that you are an epistle of Christ, ministered by us. It is plain that when they are called Christians, they are an epistle of Christ, indicating the salvation which God gave in Christ to all men, the apostles doing the writing; for while they teach, they write. Written not with ink, but with the Spirit of the living God. Since the things that are promised are eternal, for that reason they are said to be written with the Spirit of God, who always is; but temporal things with ink, which fades and loses its memory. Not on tablets of stone, but on carnal tablets of the heart. Now he strikes at the old law, which, first given on tablets of stone, was abolished when the tablets were broken by Moses beneath the mountain. But the new law is written in the mind (Exod. 32:19), that is, in the heart, not with a pen, but by the Spirit; because faith is an eternal thing, it is written by the Spirit, so that it may remain: but the old precepts will cease when the world fails. As, then, law differs from law, so the stewards of that law differ from the stewards of the law of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
