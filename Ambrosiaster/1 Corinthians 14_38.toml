[[commentary]]
quote='''
But if anyone does not know, he will not be known. Rightly; for he who does not know that the things the Apostle speaks are the Lord's will himself also not be known by the Lord on the day of judgment, as the Lord says: Amen I say to you, I do not know you. (Matt. 25:12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
