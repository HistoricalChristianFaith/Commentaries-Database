[[commentary]]
quote='''
We give thanks to God and the Father of our Lord Jesus Christ, praying always for you, having heard of your faith in Christ Jesus, and of the love which you have toward all the saints because of the hope which is laid up for you in heaven, which you heard before in the word of the truth of the Gospel, which has come to you, as it has also into the whole world. Since God has thought them worthy to have his Son entrusted to them, he returns thanks to him in his prayers. Then, because of the love which they had toward the saints, they being confident that for this love a firm hope stands with God, by which he is believed to be going to reward those who believe and love one another, Christ being the author, whose name has come to all the Gentiles, so that they may be multiplied in faith in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
