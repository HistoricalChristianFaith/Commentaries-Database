[[commentary]]
quote='''
He loves his own body who loves his wife. By natural reason the woman is a portion of the man's body, and therefore the man loves himself in the woman; just as, if he commits fornication, he sins against himself, because the two are in one flesh. The persons, then, do not divide the substance, so that through the persons a number of natures should arise; rather, they are in the unity of nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
