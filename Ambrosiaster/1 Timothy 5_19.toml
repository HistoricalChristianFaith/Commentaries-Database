[[commentary]]
quote='''
Do not receive an accusation against a presbyter. Since the honor of this order is exalted (for such men are vicars of Christ), for that reason an accusation against this person ought not readily to be admitted. For it ought to seem incredible that this man, who is a prelate of God, has conducted himself criminally, just as it is credible that an actor is utterly base.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
