[[commentary]]
quote='''
For we rejoice when we are weak, but you are strong. This is to be weak: not to exercise power; and he wishes them to be strong, so that by acting well they may conquer vices and keep punishment or rebuke away from themselves. This too we pray for, and your perfection. In prayer he asks that they may be made perfect in this, and, perfected in the power of a good life and in uncorrupted faith, may not sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
