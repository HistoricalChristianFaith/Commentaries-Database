[[commentary]]
quote='''
For what is there in which you had less than the other churches, except that I myself did not burden you? Forgive me this wrong. He still commends himself through humility; for he shows that they had not had anything less than the other churches, but rather more; for he preached the Gospel of God to them free of charge, which was granted to no churches, since the Lord says: For the laborer is worthy of his wage (Luke 10:7). If then, he says, I deserve a wrong in return for a good work, forgive me: for every fool is an accuser of the good. So, to show them to be ignorant, he asks their pardon for that deed for which he deserves praise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
