[[commentary]]
quote='''
IF THE WILL OF THE RIGHTEOUS MAN IS GOOD, WHY DID NOT ISAAC BLESS ESAU AS HE WISHED, BUT JACOB WHOM HE WOULD NOT BLESS? — The righteous man’s will is good, as far as his own conscience is concerned; but with respect to foreknowledge, it is free from opposing events. For God alone is the one who judges things to come. Therefore Isaac, righteous as to his present human understanding, considered his elder son more worthy to receive the blessing. But God, who is the knower of hidden things, showed that the younger deserved the blessing, so that in the blessing He might show the benefit to be not from man, but from God; for the dignity of the office, not the merit of the man, is what God’s blessing follows. Accordingly, it was said by God in Numbers to Moses and Aaron the priests, You shall place my name upon the children of Israel; I, the Lord, will bless them (Num. 6:27): so that the grace, by the handing-on through the minister who ordains, might be poured out upon men, and the will of the priest could neither harm nor benefit, but only the merit of the one seeking the blessing. We may see from this how great is the dignity of the priestly order. For it is said of the most wicked Caiaphas, the killer of the Savior, among other things, This he did not say of himself; but since he was the high priest of that year, he prophesied (Jn. 11:51). By this it is shown that the spirit of graces follows not the person, whether worthy or unworthy, but the ordination of the tradition: so that even if someone is of good merit, he still cannot bless unless he has been ordained, so that he may exercise the office of ministry. It is God’s part to grant the effect of the blessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 11: WHY ISAAC BLESSED JACOB AND NOT ESAU"
