[[commentary]]
quote='''
Therefore comfort one another with these words. With this hope he bids them comfort one another, those who still, in the manner of the Gentiles, thought that the passing of their dear ones must be mourned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
