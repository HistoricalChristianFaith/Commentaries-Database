[[commentary]]
quote='''
But if Christ is preached, that he rose from the dead, how do some among you say that there is no resurrection of the dead? If then there is no resurrection of the dead, neither has Christ risen. But if Christ has not risen, our preaching is vain, and your faith also is empty. These things had been handed down by the false apostles, who asserted that Christ was neither born, nor suffered in the flesh, nor rose again: these John the apostle also marks out, because they denied that Christ had come in the flesh. Hence he says: He who denies that Christ has come in the flesh, this is the Antichrist: and he who denies the Son does not have the Father either (1 John 4:3). These men went about and subverted the faith of certain people, lest they be judged unwise by the wise of the world; because the prudent of this age judge it foolish when they hear of the resurrection of the dead. But if, he says, it is true that Christ has not risen, we are false preachers, and your faith is vain. For this is what they believed when the Apostle preached, that the dead will rise, and by this hope they were drawn to the faith. He asserts that this would surely turn to their loss, if they believed what is not going to be: and it is a matter of shame for anyone to profess that he believed what is false. So he both strikes shame into them and calls their labors fruitless, if what they heard from the false apostles is true, that the dead will not rise: which surely no one bears to hear said of himself; so that, seeing that this was against them, they might return to their first faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
