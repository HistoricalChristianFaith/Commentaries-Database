[[commentary]]
quote='''
For the word of the cross is foolishness to those who are perishing. It is clear that those to whom the cross of Christ is foolishness are in perdition, for they have not been snatched from the death of hell.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"

[[commentary]]
quote='''
But to those who are being saved it is the power of God. It is not obscure that to those who believe it is the power of God; for they believe that the cross of Christ is not weakness but power, understanding that death was conquered on the cross: those who have its sign are saved, because they cannot be held by it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
