[[commentary]]
quote='''
WHY IS IT SAID THAT THE LAW AND THE PROPHETS WERE UNTIL JOHN, AND THAT AFTERWARD THEY RIGHTLY CEASED (Matt. 11:13)? BECAUSE THE ONE ABOUT WHOM THEY PROPHESIED HAD NOW ARRIVED. WHY THEN "UNTIL JOHN" WITH REGARD TO THE LAW, SINCE THE APOSTLE SAYS THAT WE OUGHT TO BE SUBJECT TO THE LAW: "FOR THOSE THAT EXIST," HE SAYS, "HAVE BEEN ORDAINED BY GOD" (Rom. 13:1)? — Law indeed is one name, but it has a threefold meaning. For the first part of the Law concerns God. Therefore the Law is said to be from "reading," so that from many things you may know what to choose. Therefore, placed amid errors, they received it so that they might choose what is true, that is, with the Devil rejected, they might choose God. But the second part of the Law is this, which is contained in the commandments, which therefore begins: "Honor your father and your mother." The third, however, has to do with new moons and the sabbath, and with distinguishing and choosing foods, and with circumcision and the offering of animal victims. This Law, therefore, he says is to be observed only until John, and no longer. For therefore it was given, that when the appointed time was fulfilled it should cease; nor was it from the beginning, but was given for a reason, for a time, so that with the coming of the Savior the Law should cease. Therefore, what is of God remains, both the Law of the commandments and his nature, which without doubt cannot be abolished by him. For through him one progresses to the promised reward. For fear produces watchfulness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 15: WHY THE LAW AND THE PROPHETS WERE UNTIL JOHN"
