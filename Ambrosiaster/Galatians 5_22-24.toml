[[commentary]]
quote='''
But the fruit of the Spirit is love, joy, peace, long-suffering, kindness, hope, gentleness, continence, chastity, goodness: against such there is no law. And those who are Christ's have crucified their flesh with its vices and desires. He did not say: The works of the spirit are love, but the fruit of the spirit; for the law of the spirit bears as fruit these things which he mentioned above, so that from them the inheritance of the kingdom of heaven may be sought; for those who are devoted to Christ, these he calls christs, that is, anointed ones. These crucify the flesh, that is, the world, when they condemn those things from which errors arise. Following this sense, the apostle John also says: Do not love this world, nor the things that are in this world. If anyone loves the world, the love of the Father is not in him; for all that is in this world is the desire of the flesh and the desire of the eyes (1 John 2:15). He, then, who does not desire the world and what is in the world crucifies the flesh. For these vices are not to be ascribed to the human body, that is, idolatry, sorceries, heresies, envyings, enmities, angers and the like: but they are called carnal for this reason, that they are from the side of the world, as I mentioned above. Meanwhile he set down no more than ten things which he signifies as the fruit of the spirit, so that in these he may be seen to have embraced everything, in keeping with the tablets of the Testament of God, on which no more than ten words of commandments were handed down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
