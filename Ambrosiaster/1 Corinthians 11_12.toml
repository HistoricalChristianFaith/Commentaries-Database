[[commentary]]
quote='''
For just as the woman is from the man, so also the man is through the woman. He has confirmed what he said, because both are one in nature, and the man is the origin of the woman, as we read in Genesis that it was done by the Lord the Creator. But all things are from God (Gen. 2:22). After setting out each point step by step, in order to subject all things to God, keeping one principle, he says: But all things are from God; so that neither should the woman be saddened because of her subjection, nor the man be proud as if exalted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
