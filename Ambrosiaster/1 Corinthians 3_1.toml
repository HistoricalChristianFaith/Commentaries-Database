[[commentary]]
quote='''
And I, brethren, could not speak to you as to spiritual men, but as to carnal. He now speaks to those who were carnal because they were still serving the pleasures of the age. Although they had already been baptized and had received the Holy Spirit, yet because after baptism they had at once gone back to the old man, whom they had renounced, they are called carnal. For the Holy Spirit remains in the one into whom he has poured himself only if that one remains in the purpose of regeneration: if not, he departs; yet in such a way that, if the man reforms himself, he returns to him. For he is always ready for good, loving repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
