[[commentary]]
quote='''
But now in Christ Jesus you who once were far off have been made near by the blood of Christ. He still commends the gift and grace of God, to whom he wishes us, as those always under obligation, to return thanks; for this reason he recalls that we have been made near to God in the blood of Christ: to show how great an affection God has toward us, who allowed his Son to die for us; so that we too, enduring in faith in him, may not give way to any destructions brought on us for his sake, knowing that he deserves more from us than whatever can be inflicted by enemies: for he, though he is the Lord and needs no one, offered himself for us, so that it might profit not him but us. For even if it did not profit us, we would perhaps be compelled to die for him, as servants for our very lord: how much more when not only his death but ours too brings about its effect for us!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
