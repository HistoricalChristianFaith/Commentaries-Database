[[commentary]]
quote='''
Therefore let him who speaks in a tongue pray that he may interpret. He advises that he who desires to speak in tongues ought to pray that he may receive the gift of interpreting, so that his zeal may profit the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
