[[commentary]]
quote='''
Do not be seduced: evil conversations corrupt good morals. He signifies that a good purpose can be overthrown by the talk of evil men; for constant depraved conversation vitiates the mind, and therefore one must beware of them. For whoever wishes to guard the faith he has received must avoid those who clamor against it, above all at the very beginnings, so that he may fulfill what he has judged useful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
