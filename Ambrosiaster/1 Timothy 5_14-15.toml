[[commentary]]
quote='''
I will therefore that the younger women marry, bear children, be mothers of families, give no occasion to the adversary for the sake of reviling. For already some have strayed after Satan. Since what he said above about such women is contrary and unlawful, and will lead them to death, for that reason he gives counsel and commands that those things be done which are lawful. For it is better to have the care of one's own house than to commit adultery in another's house: and it is far more expedient to marry than, under a good and godly profession, to walk notoriously in evil: and it is a greater thing to seek one's living with one's hands in modesty than shamelessly to wait in idleness for other people's goods. For thus Satan finds an occasion for overthrowing ill-advised souls, when those who profess godly things conduct themselves unjustly; for nothing is so dangerous as when deeds contradict a profession. For Satan is not jealous of open evil, because he rejoices in it: but this one whom he sees deceiving, he works to make manifest as his own son, not God's: which deed does not displease God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
