[[commentary]]
quote='''
But doing the truth in love, let us grow in him in all things, who is the head, Christ. He says that this is the truth: that, looking to the love of Christ, with which he loved us and gave himself up for us, we subject all things to him, knowing that he is the author of the life of all, so that the members may be subject as to a head; so that, if others, through error or ill will, do not confess that all things have Christ as head, because they were made by him by the will of the Father, we nevertheless who adhere to the catholic faith ought to do this with all devotion and care, so as to bring to this faith not loss but gain, persevering in this assertion; so that the talk of a depraved mind, armed against the truth, may be suppressed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
