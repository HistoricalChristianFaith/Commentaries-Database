[[commentary]]
quote='''
I, Paul, have written with my own hand: I will repay; not to say to you that you owe me even your own self. If there is any offence on the part of Onesimus, he testifies that his own bond is sufficient to make satisfaction for him. And to speak the truth, he draws himself up and says that he demands less from him than he is proved to owe. For in the case of the slave he is compelled to make satisfaction, because he burdens himself with the debt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
