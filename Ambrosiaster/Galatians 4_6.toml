[[commentary]]
quote='''
And because you are sons of God, God sent the spirit of his Son into our hearts, crying: Abba, Father. He began with those to whom he is also writing, saying: And because you are sons of God; and he adds the Jews when he says: God sent the Spirit of his Son into our hearts. Now when he said that the Gentiles who believe in Christ, who had formerly been enemies, are sons of God, there was no doubt that the believing Jews are called sons of God, who, as is well known, had long ago been called by this name. For they had received the name of God as in an image, so that it might afterwards be confirmed through Christ; for without the spirit it was not full. This is what he also says to the Romans: The Spirit himself bears witness to our spirit that we are sons of God (Rom. 8:16). For, that we might be proved to have been adopted by God as sons, he gave us his Spirit, who shows the sign of the Father toward the sons; so that, since we would not dare to say this in our weakness and unworthiness, he prompts us to dare to say: Abba, which is father. Indeed, it was not granted to the Jews of old to say this.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
