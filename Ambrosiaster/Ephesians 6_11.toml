[[commentary]]
quote='''
Put on the armor of God, that you may be able to stand against the nations. The armor of God is steadfast faith, by which alone Satan has always been conquered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
