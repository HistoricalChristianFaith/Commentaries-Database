[[commentary]]
quote='''
So that we asked Titus that, as he began, so he would complete in you this grace also. Since he knew that Titus's affection toward them was sincere, and also that they were obedient to him, he therefore indicates that through him he could more easily exhort them to this work also; so that, as in other matters he had the fruit of his exhortation in them, he might have it also in this grace, making them ready for the ministry to the saints; so that, since they were already amending their vices, they might have the fruit of this generosity. For those who give to this end, that they may not be reproved, will have no fruit of it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
