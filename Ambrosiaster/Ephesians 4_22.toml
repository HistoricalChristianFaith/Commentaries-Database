[[commentary]]
quote='''
That you put off, according to your former way of life, the old man, who is corrupted according to the desires of error. He who has heard Christ has learned this: to depart from his former way of life, which he calls the old man because of the past time of ignorance. Man, therefore, is one and the same, who, if he follows his former vices, is called old: but if he walks in newness of life, a stranger to the error of the world, which lies either in deed or in thought, he is called fresh; not, of course, in the substance of flesh or soul, but in understanding and in the way of life. Yet the old man is called corrupted because of his adulterated mind and shameful life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
