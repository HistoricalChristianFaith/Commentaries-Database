[[commentary]]
quote='''
Then after fourteen years I went up again to Jerusalem with Barnabas, taking Titus also. And I went up according to a revelation; and I set forth to them the Gospel which I preach among the Gentiles, but privately, to those who seemed to be something, lest perhaps I should run, or had run, in vain. Since for a long time his fame had been growing among all the Jews, but he was not seen face to face (for he was going about to found and strengthen the Church among the Gentiles with his usual constancy), and among the Jews an evil opinion of him arose on account of the Law, as if he disagreed with the preaching of the other apostles; and from this a scruple arose for many, so that the Gentiles could be disturbed, lest they were being led by him into something other than what the apostles who had been with the Lord handed down. For on this very occasion the Galatians were subverted by the Jews, who said that Peter handed down one thing and Paul another; hence it came about that, admonished by a revelation of the Lord, he went up to Jerusalem with witnesses of his preaching, that is, Barnabas and Titus, the one from the Jews and the other from the Gentiles, so that if any had a stumbling block concerning him, it might be removed by their testimony, as he opened to them the sense of his preaching. With the apostles, however, he conferred privately, so that they might know that he did not disagree with the rule of the Gospel, that is, so that they might not think that he was running or had run in vain, as some of the Jewish believers supposed. For he could not learn anything from them, since he had been instructed by God; but it was done for the sake of concord and peace at God's bidding, so that the scruple or suspicion might be removed for his brothers and fellow apostles, and so that it might profit the Gentiles, when they recognized that his Gospel agreed with the apostles. Moreover, when they had given a law that those who believed from among the Gentiles should not be troubled, but that they should keep themselves only from these things, that is, from blood and fornication and idolatry (Acts 21:25). Now let the sophists of the Greeks, who claim expertise for themselves and that they naturally excel in subtlety of mind, tell us: what things were handed down to the Gentiles to be observed? Things they did not know, or things they knew? But how can it be that someone learns the things he knows? Therefore those things were shown to the Gentiles to be unlawful which they thought lawful; and accordingly they were certainly not forbidden murder when they are commanded to keep from blood. But they received this, which Noah had learned from God, that they should keep themselves from eating blood with flesh (Gen. 9:4). For how could it be that men steeped in the Roman laws, whose authority in keeping commandments is so great, did not know that murder must not be committed, since indeed the Roman laws punish adulterers and murderers, and false witnesses, and thieves, and sorcerers, and the perpetrators of all other evils? Finally, these three commandments are found to have been given by the apostles and elders, of which the Roman laws know nothing, that is, that they should abstain from idolatry, and from blood, as Noah did, and from fornication. The sophists of the Greeks, not understanding these things, yet knowing that one must abstain from blood, adulterated the Scripture, adding a fourth commandment, that one must also keep from what is strangled; which, I think, they will now understand at God's bidding, since what they added had already been said above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
