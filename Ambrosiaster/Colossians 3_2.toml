[[commentary]]
quote='''
Mind the things that are above, not the things that are upon the earth. He exhorts us to seek the heavens above, which are the dwellings of the Eternal, and to pay no heed to all those things that are in the firmament and under the firmament. For whoever occupies himself with these superstitions will suffer a hindrance; for he will not be able to pass beyond these things to which he has bowed himself, as to masters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
