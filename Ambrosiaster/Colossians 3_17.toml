[[commentary]]
quote='''
And everything whatever you do in word or in deed, do all in the name of the Lord Jesus, giving thanks to God and the Father through him. Since above he commanded that God be praised in the heart and that thanks be rendered to him, now he exhorts that the name of the Lord Jesus be praised and exalted both in word and in the deed of our whole way of life; so that, when our words are free of reproach and our works are good, the Lord Jesus may be magnified, by whose teaching his disciples are beyond blame. For then we give true thanks to God through him, if we keep the measure of his precepts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
