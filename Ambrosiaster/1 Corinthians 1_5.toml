[[commentary]]
quote='''
That in all things you have been enriched in him, in all speech and in all knowledge. He means this: that in the grace they had received, and in the word of truth, having attained the spiritual knowledge of the teaching, they persevered; and therefore he gives thanks to God for these.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
