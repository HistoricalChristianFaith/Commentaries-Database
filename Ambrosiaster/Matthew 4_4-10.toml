[[commentary]]
quote='''
WHY DOES THE SAVIOR, WHEN THE DEVIL IS TESTING HIM, RESIST IN NO OTHER WAY THAN WITH EXAMPLES FROM THE LAW (Matt. 4:4–10)? — The Savior not only replied to the Devil who was tempting Him, but also to the Jews through whom the wickedness of their cruelty was carried out against the Savior. For, foreseeing that the Jews would call Him an enemy of the Law, He checked the shamelessness of their father, the Devil, with testimonies from the Law, so that He might condemn the father in the sons, and the sons in the father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 8: WHY THE SAVIOR RESISTS THE DEVIL WITH THE LAW"
