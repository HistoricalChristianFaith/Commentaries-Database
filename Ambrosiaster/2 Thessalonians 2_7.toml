[[commentary]]
quote='''
For the mystery of iniquity is already at work, only that he who now holds may hold, until such time as he is taken out of the midst. The mystery of iniquity was begun by Nero, who out of zeal for idols killed the apostles at the instigation of his father the devil, and runs down to Diocletian, and most recently Julian, who with a certain art and subtlety could not complete the persecution he had begun, because it had not been granted from above. For Satan uses these ministers so that meanwhile, under cover of the throng of gods, he may make a mockery of the manifestation of the one true God in order to seduce men, as long as the Roman kingdom stands; this is what he says: Until he is taken out of the midst.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
