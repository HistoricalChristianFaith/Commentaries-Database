[[commentary]]
quote='''
But I make known to you, brothers, the Gospel that was preached by me, that it is not according to man; for neither did I receive it from man, or learn it, but through the revelation of Jesus Christ. Now he lays open the principles of the epistle; for he wishes to make the very sense plain, that what he taught, he had not learned from man, lest perhaps there should be doubt about what he taught. Nor had his preaching been fitted to human judgment, so as to seem unworthy of divine authority: but he says that he learned it from the Son of God through revelation, when he was already in heaven after the resurrection, as I mentioned before; and that what he learned agrees with the will and majesty of him from whom he testifies that he learned it. For those things are spiritual which, when kept, lay up merit with God: for those things are carnal which, kept in their time, procured neither merit nor demerit with God; not kept, they did harm; because both those who had not done the Law were under the curse, and those who had done it were not justified with God, since the righteous lives by faith. For those things were commanded to be kept so as to be a burden, not for dignity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
