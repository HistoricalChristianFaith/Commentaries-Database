[[commentary]]
quote='''
To another the grace of healings in the one Spirit; that is, that he may bestow a remedy on the infirm or the sick.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"

[[commentary]]
quote='''
To another faith in the same Spirit. He says this: that, shame being suppressed, he receives the capacity for professing and defending the faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
