[[commentary]]
quote='''
But the Spirit says plainly that in the last times some will depart from the faith, giving heed to deceitful spirits and doctrines of demons, in the pretence of speakers of falsehood, having a cauterized conscience, forbidding to marry and to abstain from foods, which God created to be received with thanksgiving by the faithful and by those who have known the truth; because every creature of God is good, and nothing is to be rejected that is received with thanksgiving. For it is sanctified through the word of God and prayer. What the Holy Spirit revealed to him as to come, for the instruction and caution of the churches, he does not keep silent, so that the churches, being forewarned, may be watchful lest they be circumvented by men of this kind. For what could he have foretold with a plain voice so clear and so open, for avoiding or rather condemning the men of this pestilent doctrine, than to call their assertion deceitful, and a feigned doctrine of demons; so that, when the words of this assertion are heard, it might be known that this doctrine was composed by the devil, the doctrine which the Holy Spirit had foretold, which asserts false things about the incarnation of the Savior, and which is now marked in the Marcionites, although they have all but failed, in the Patricians, or above all in the Manichaeans? For these both deny that Christ was born, and forbid marriage, and teach that one must abstain from foods. Their conscience he calls cauterized, that is, corrupted by pretence; because as a cautery spoils the hide and inflicts a brand, so too deceit marks out for perdition the conscience which, through the guile of malevolence, knows one thing and professes another. For he says that these men are no longer changed so as to be saved; because as a cautery cannot be changed, so neither can their mind be amended; for nothing is worse than pretence. For they are such as the Jews also were, those who, though they understood that Christ worked by the power of God, said that these things were done by him in Beelzebub. For in order to treat the maker of man ill, though they are not sorry to have been born, they nevertheless forbid marriage, and take away flesh from Christ; and to advance in doing him injury, they teach that one must abstain from the things he instituted for our uses, so that, by the very fact that these are despised, they may seem to be evil and devised by an evil author.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
