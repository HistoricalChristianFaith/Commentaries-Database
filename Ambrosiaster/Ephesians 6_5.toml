[[commentary]]
quote='''
Servants, obey your carnal masters with fear and trembling in the simplicity of your heart, as to Christ. Since our religion is the most sublime of all and alone powerful, and one that promises the kingdom of heaven to believers, lest pride should for this reason arise in men, all are commanded to discharge what they owe in their present conditions or offices; so that they may the more stir the minds of the faithless toward the worship of God, which they see to be both just and humble. For when masters see that their servants have become better, and have made faithful progress in rendering their services, they render them with all freedom what they deserve. Servants too, when they perceive the gentleness of their masters, desire with all eagerness the faith by whose so gentle reins human duties are governed. For even he who is in servitude, if he has a servant of his own, does not want to be despised by him; and therefore neither ought he to despise his own master: and just as he wants his master to deal with him, so ought he too to deal with his servant, and so he will be able to please God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
