[[commentary]]
quote='''
But above all these things have love, which is the bond of unity: and let the peace of God exult in your hearts, in which you also were called in one body: and be thankful. Because love is the greatest of all, he exhorts them to be the more zealous for it. For then all the things which he commanded above to be kept can be brought to the effect of rewards, if, with love as their guide, they walk the road of the law; for he works with his whole mind who does anything out of love. Hypocrisy and pretence are not in love; wherefore John the apostle too: Fear, he says, is not in love. For he who fears is not perfect: Perfect indeed love casts out fear (1 John 4:18); hence the Lord too prefers to be loved rather than feared. For this is the love that embraces unity, this is what makes all one body, this is what has true peace, which it guards with a pure heart. For a thing can be called peace and yet not have love; but love always has peace with it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
