[[commentary]]
quote='''
For if I grieve you, who then is it that gladdens me, except the one who is grieved by me? He says this because he does not wish to grieve them: but since they had given themselves to sins, it was necessary for them to be grieved, against the Apostle's will; yet in such a way that, having become obedient for the future, they might gladden those who were grieved with them; so that he who had grieved them by rebuking them might be gladdened by them while they are being corrected.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
