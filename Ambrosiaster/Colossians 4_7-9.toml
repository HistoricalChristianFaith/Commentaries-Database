[[commentary]]
quote='''
All the things concerning me Tychicus, the beloved brother and faithful minister and fellow slave in the Lord, will make known to you: whom I have sent to you for this very purpose, that he may know the things concerning you and comfort your hearts, with Onesimus, the dearest and faithful brother, who is one of you; he will make known to you all the things that are here. He says that he has sent the brothers for this, that the things done by each might become known to the other. Although above he says that he is present among them in spirit and sees what they do, yet there is need of messengers. For a man becomes more careful when he sees someone coming to him to observe his conduct; for he fears more if he perceives that what he does is seen. For although God sees all things, and we know that all things are known to him, yet because we do not see ourselves being seen by him, we do contrary things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
