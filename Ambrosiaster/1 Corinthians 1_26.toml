[[commentary]]
quote='''
For consider, brothers, your calling; that not many are wise according to the flesh, not many powerful, not many noble. It is clear that those are few who are puffed up rather than educated by the reasonings of the world, that is, who observe and distinguish the motions of the stars. He calls the same people strong according to the flesh whom he also calls prudent. And strong for this reason, that they assert that the passion of the cross of Christ is weak; for iniquity is strong, and seems to itself to conquer for a time. They are also the noble, through whom they assign the origin of their superstition to antiquity, calling us new. God, therefore, did not choose this assertion, which is found in a few.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
