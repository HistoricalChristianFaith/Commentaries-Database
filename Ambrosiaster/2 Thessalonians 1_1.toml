[[commentary]]
quote='''
Since in the first epistle given to the Thessalonians he wrote, among other things, some things also about the coming of the Lord and about the resurrection of the saints, he now writes another to them, in which he signifies, although obscurely (for he could not write openly), concerning the abolition of the Roman kingdom, and concerning the appearance and condemnation of the Antichrist, and concerning the restlessness of certain brothers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"

[[commentary]]
quote='''
Paul, and Silvanus, and Timothy, to the church of the Thessalonians in God our Father, and in the Lord Jesus Christ. Grace to you and peace from God our Father, and the Lord Jesus Christ. He writes to them in solemn words; for the head of the epistle is contained in the customary manner of address; and they are the same three in whose name it is written, as also in the first epistle (1 Thess. 1:1).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
