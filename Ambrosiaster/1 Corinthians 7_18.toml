[[commentary]]
quote='''
Was anyone called circumcised? Let him not bring on a foreskin. This is what he said, that he should walk as he was called; so that a Jew made a Christian may not perhaps think himself unworthy because he does not have a foreskin, giving glory to the foreskin. Was anyone called with a foreskin? Let him not be circumcised. So that a Gentile who has been called may not judge that he ought to be circumcised, by the fact that he hears the sons of Abraham preferred. For they are not preferred because they are circumcised, but by the merit of Abraham, whose sons they are in both respects, if they believe: if not, they will be worse than the Gentiles; for it is worse to have been and not to be, than never to have been.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
