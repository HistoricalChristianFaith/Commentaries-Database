[[commentary]]
quote='''
But I fear lest, as the serpent seduced Eve by his cunning, so your minds be corrupted from the chastity that is in Christ Jesus. He shows for what reason he is compelled to declare true things about himself; for he professes the glory given to him for this purpose, not to praise himself, but to discredit those who under the name of Christ were preaching against Christ, by whom the Corinthians were being led astray; and this truth would profit them more than him. For he did this so that the seducers should not be listened to, whom he compared to the devil because of the cunning of their malice; for they try to corrupt the hearts of the faithful away from the truth of Christ. Fearing this, then, he is always anxious about them, lest they be violated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
