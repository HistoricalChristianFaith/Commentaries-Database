[[commentary]]
quote='''
And he is before all. He is before all, because he alone was born of God the Father, indeed of the unbegotten substance of God. But these things came to subsist by his power, which he has from the Father through generation; not so that they have communion of substance with him, but they began from nothing at the nod of God the Father, the Son acting. And all things hold together in him. They hold together in him because without him they are nothing; for unless they were subject to him, straying through error, they would become liable, as it were, to perdition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
