[[commentary]]
quote='''
And in this I give advice; for this is useful to you, who began not only to do but also to will from the former year: now therefore complete the doing also; so that, as the will is ready in you to will, so may it be also to perform, out of what you have. He says this so that their will may appear in deed, if it is true, according to their strength; that one should give as much as one can and as the mind wills, so that the conscience may be pure: not in pretense, to please men, and so have no reward with God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
