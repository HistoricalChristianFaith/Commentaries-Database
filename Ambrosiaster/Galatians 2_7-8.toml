[[commentary]]
quote='''
But on the contrary, when they had seen that the Gospel of the uncircumcision was entrusted to me, as that of the circumcision to Peter; for he who worked in Peter for the apostleship of the circumcision worked also in me toward the Gentiles. He names Peter alone and compares him with himself, because he had received the primacy for founding the Church; and he says that he himself was likewise chosen, so that he might have the primacy in founding the churches of the Gentiles; yet in such a way that Peter too would preach to the Gentiles, if there were cause, and Paul to the Jews. For each is found to have done both; but yet full authority is recognized to have been given to Peter in the preaching to Judaism, and Paul's perfect authority is found in the preaching to the Gentiles. Hence he also calls himself the teacher of the Gentiles in faith and truth (2 Tim. 1:11); for each one was allotted a dispensation according to his strength. For it was more difficult to draw and persuade to their faith those who were far from God than those who were near.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
