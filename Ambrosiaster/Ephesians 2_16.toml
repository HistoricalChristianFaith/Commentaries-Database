[[commentary]]
quote='''
That he might present and reconcile both in one body to God through the cross. The enmity removed, Christ by his death first reconciled the peoples among themselves, then made them at peace with God the Father, so that men of one nature, because they had been made diverse through error, might be made members of one new body, whose head is Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
[[commentary]]
quote='''
Slaying the enmities in himself, and coming he preached peace to you who were far off, and peace to those who were near; because through him we both have access in one Spirit to the Father. The sense is the same; for he slew the enmity in himself when he died for all, Jews as well as Gentiles. For the death of the Savior profits all; for rising from the dead, death, which held all, having been condemned, he showed what hope those who believe in him would have.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
