[[commentary]]
quote='''
Do not touch, do not defile, do not taste, do not handle, things which all are unto destruction and corruption through misuse, according to the precepts and doctrines of men. He forbids them in every way from hope in worldly things, because it is empty: that they should not worship them, not assent to them, not think of them, because the things they promise belong to corruption. For their use and worship generate destruction; because the precepts and doctrines are not of God but of men, and in them there is vain hope: seeing that human error invented these things against the Creator; so that, forbidding men the faith of the one God, it might bring in the superstition of many gods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
