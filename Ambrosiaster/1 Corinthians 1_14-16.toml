[[commentary]]
quote='''
I give thanks to God that I baptized none of you except Crispus and Gaius, lest anyone should say that I baptized in my own name. I baptized also the household of Stephanas; beyond that I do not know whether I baptized anyone else. He gives thanks to God that he did not baptize many of them; lest, since the error had begun on this ground, there should be an error among very many arising from his name; by this both the baptizers and the baptized are to be reproved, who, to the injury of the Savior, were ascribing the grace of his baptism to men, the baptizers conniving for the sake of glory. For they were then just as the Novatianists and Donatists are now, who claim baptism for themselves, rejecting those baptized by our people; and those baptized by them glory in their persons. In short, having renounced the name of Christ, they glory in being called Novatianists and Donatists. Crispus, then, and Gaius are Corinthians, whom he names as witnesses, because they were baptized by the Apostle in such a way that they asserted that no glory was to be given to him on that account. The household of Stephanas, moreover, are the firstfruits of Achaia, as he indicates in the last part of the epistle, and to them he bears witness that they had appointed themselves to the ministry for the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
