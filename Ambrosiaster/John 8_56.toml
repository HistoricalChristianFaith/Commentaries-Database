[[commentary]]
quote='''
Abraham did not have this sign, nor did the Prophets, because their time did not encounter it; instead, it was reserved for the Son of God, who, when he came, would conquer death and bestow this grace upon believers. From this comes the saying of the Lord to the Jews: Your father Abraham rejoiced that he might see my day; and he saw it, and was glad (Jn. 8:56). For Abraham, knowing that Christ was promised for the deliverance of the human race, necessarily and always had to await his coming for those placed in the underworld; and when he saw that he had been born in spirit, he rejoiced, certain that in a short time he would be snatched from hell and brought into the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 56: ON BEING A JEW OR CHRISTIAN BY BIRTH"
