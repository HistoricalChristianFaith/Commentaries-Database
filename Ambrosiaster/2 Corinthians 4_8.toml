[[commentary]]
quote='''
Suffering affliction in all things, but not straitened. Now he shows why they were fit preachers: because God was always present to them in need. Therefore suffering affliction, he says, but not straitened: that is, God did not allow us to be oppressed so greatly, so that we might believe. Suffering want, but not abandoned: that is, God was present as a shepherd to those placed in want.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
