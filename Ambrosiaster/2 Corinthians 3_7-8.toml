[[commentary]]
quote='''
But if the ministration of death, formed in letters on stones, was in glory, so that the sons of Israel could not gaze on the face of Moses because of the glory of his countenance, which is done away: how shall not the ministration of the Spirit be rather in glory? It is manifest that the grace of the law of faith is greater than that of the law of Moses; for although the law of Moses was given for this purpose, to be of profit, yet, being despised, it became a law of death. Therefore, because it could not provide for sinners, the law of faith came to save them, not only pardoning but also justifying them. There is, then, a great difference between law and law; for at that time, stained with sin, they could not gaze on the face of Moses as he came down from the mountain with the law received on the tablets; because his face had been made glorious, so that it could not be looked upon by sinners, who were worthy of death (Exod. 34:30). This glory is now done away through the law of the Spirit, since, having received the remission of sins and been made righteous, they are worthy to behold the glory of God, and are able to, as Peter and John, and James saw the glory of Christ on the mountain (Matt. 17:2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
