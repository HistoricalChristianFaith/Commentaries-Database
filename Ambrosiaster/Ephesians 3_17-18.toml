[[commentary]]
quote='''
That, rooted and grounded in love, you may be able to comprehend with all the saints what is the breadth, and length, and height, and depth. He says that Christ, or the Spirit, dwelling in us accomplishes this: that we be grounded in the love of God, bound by his benefits, and be able, with the saints, who are the apostles and prophets, to know God, immeasurable and inestimable, exceeding all things by the majesty of his power. For when he says: Breadth, and length, and height, and depth, he certainly signifies this: that as in a sphere the length is as great as the breadth, and the height as great as the depth, so too in God all things are equal by the immensity of his infinity. For a sphere is enclosed within a definite measure; but God not only fills all things but also exceeds them; for he is not enclosed, but holds all things within himself, so that he alone is held to be ineffable and infinite; and thanks are rendered to him insufficiently, because, though he is so great, he deigned through Christ to visit man, who was subject to sins and death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
