[[commentary]]
quote='''
And I was with you in weakness, and fear, and much trembling. For by preaching Christ in the foolishness of human wisdom he provoked hatred and persecutions against himself, as one announcing a vain thing, and one hostile to Jews and Gentiles alike.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
