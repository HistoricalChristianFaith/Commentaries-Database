[[commentary]]
quote='''
But I rejoice in the presence of Stephanas, and Fortunatus, and Achaicus; because they have supplied what was lacking to you. For they have refreshed both my spirit and yours. Acknowledge therefore those who are of this sort. For the contribution which he says is made for the saints is one thing, and to make return to the ministers of the Gospel is another, as the Lord says: For the laborer is worthy of his wage (Luke 10:7). For he signifies that the house of Stephanas was devoted in both respects, both in the ministry of the saints and toward those who served the churches; so that they benefited the Apostle together with the brothers Fortunatus and Achaicus; so that those also benefited who were from among them. Hence he says: For they have refreshed both my spirit and yours. And since the Apostle denies that he will receive anything from them, for he says: This boasting shall not be broken in me in the regions of Achaia, how have they refreshed both my spirit and yours? But I believe his spirit was refreshed in those whom they had benefited; for he says that what benefits those whom he wished is given to himself. Acknowledge therefore those who are of such a kind; that is, imitate them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
