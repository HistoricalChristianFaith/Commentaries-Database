[[commentary]]
quote='''
If the authority of the letter does not correct him, he commands that he be marked and that no one live in company with him, so that, put to shame, being shunned by all, he might submit himself to the precepts of the Apostle. Yet he wishes this to be done without anger and insult, so that he be patiently avoided; yet in such a way that, if the matter requires speaking with him, he should be admonished to suffer himself to be corrected and no longer to despise the precepts of the Apostle: and he wishes also that no familiarity be kept with him until he becomes obedient. For if he is provoked to anger by insults, he will become worse than he is; for he will be stirred up to contention and will begin to want to defend his error, and afterwards to be ashamed to amend himself, lest he seem afterwards to confess what before he excused.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
