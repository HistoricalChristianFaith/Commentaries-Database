[[commentary]]
quote='''
WHEN THE SAVIOR SAYS, “I PRAY FOR THEM WHOM YOU HAVE GIVEN ME; I DO NOT PRAY FOR THE WORLD” (John 17:9), BUT THE APOSTLE JOHN, ON THE CONTRARY, SAYS, “WE HAVE AN ADVOCATE WITH THE FATHER, A MEDIATOR FOR OUR SINS, AND NOT ONLY FOR OURS, BUT FOR THE WHOLE WORLD” (1 John 2:1–2), THIS SEEMS TO BE A CONTRADICTION. — Although the sense is not far different, still what the Savior says is one thing, and what the apostle John affirms is another. For the Savior prays for the disciples, that they may be kept safe from the assaults of evil; indeed he says, “I do not ask that you take them out of the world, but that you keep them from evil.” The apostle John, however, introduces another kind of prayer; for he says, “We have an advocate who intercedes for our sins, and for those of the whole world.” Therefore, for Christians intercession is made in a twofold way: both that their sins may be prayed for, and that they may be kept safe from the assaults of the Devil. But for those who do not believe, there is only this kind of intercession: that although they deserve to be punished for their sins and unbelief, goodness and patience may wait for them, in case they should wish to be corrected. For it is not asked that their sins be forgiven while they remain unbelieving, but that they may receive a long delay, so that, if they improve themselves, their offenses may be forgiven them. This, then, is what the Savior asks for them, as we have said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 36: ON CHRIST PRAYING FOR HIS OWN AND JOHN FOR THE WHOLE WORLD"
