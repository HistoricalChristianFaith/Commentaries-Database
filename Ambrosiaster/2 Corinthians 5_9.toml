[[commentary]]
quote='''
And therefore we strive, whether present or abroad, to please him. He says that we must act on this and persist in good works, so that whether still placed in this life or present before the judgment seat of Christ, we may please him. Hence, if discipline is kept, we shall please him both here and there; because he who pleases here will not displease there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
