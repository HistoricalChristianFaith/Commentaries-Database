[[commentary]]
quote='''
And this has been granted to you by God for Christ, not only that you believe in him, but also that you suffer for him, having the same contest which you both saw in me and now hear of me. Although he extols the grace of God in all things, yet it redounds to their praise that he says that God granted them to suffer for Christ; for he does not grant or give this except to lovers of Christ. Therefore he says: For Christ it has been granted to you; so that it has been granted by God the Father to those who love Christ that, as proof of their merits, they suffer for Christ, and, following the examples of their teacher, strive with all confidence to triumph over the unbelievers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
