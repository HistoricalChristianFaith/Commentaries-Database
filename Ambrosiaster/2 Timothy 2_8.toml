[[commentary]]
quote='''
Remember that Christ Jesus, of the seed of David, has risen from the dead according to my Gospel, in which I labour even to bonds, as a robber; but the word of God is not bound. Since there were going to be many sons of the devil who would deny that the Son of God was incarnate, he therefore recalls this, because they strive deceitfully to assert this under the name of the apostles. He added, according to my Gospel, so as to shut out the false discourses of an evil mind; for heretics are not to be believed about the Apostles more than these very men bearing witness to their own preaching, a preaching which he complains that he carries on with labour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
