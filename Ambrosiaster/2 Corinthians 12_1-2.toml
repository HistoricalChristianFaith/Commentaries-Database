[[commentary]]
quote='''
But I will come to visions and revelations of the Lord. Now he is going to show to where he was caught up, so that it may accordingly be understood how great and of what kind were the things shown and told to him, lest, as it seemed to some, he should be believed to be less than the other apostles. I know, he says, a man in Christ fourteen years ago, whether in the body, I do not know, or outside the body, I do not know, God knows, such a one caught up as far as the third heaven. He affirmed both, because he did not deny that both could happen: that he could have been caught up both without the body and in the body. And perhaps to some it may seem no great thing if a man of Christ was caught up as far as the third heaven, since the moon is said to be in the third circle. But it is not so, for he is understood to have been caught up beyond all the stars of the world; and therefore what he relates is magnificent and wonderful; for he means that he himself was caught up above the firmament, into the heaven that is third in number among the spiritual heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
