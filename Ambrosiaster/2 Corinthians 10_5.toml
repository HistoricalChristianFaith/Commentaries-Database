[[commentary]]
quote='''
For the destruction of fortifications, destroying thoughts, and every height that exalts itself against the knowledge of God. The spiritual weapons are the faith of incorrupt preaching. Through these God conquers the principalities and powers, which, it is evident, exalt themselves against the faith of Christ in order to usurp rule for themselves, inserting themselves into the thoughts of men so as to call them away from the dominion of God; and these thoughts the truth of faith destroys. By fortifications, then, he means the principalities and powers and the spiritual forces of wickedness, which exalt themselves and arm the minds of unbelievers to speak against Christ: against these the law of God fights, scattering their counsels. And bringing every understanding into captivity, and leading it to the obedience of Christ. He takes the understanding captive when he overcomes by reason one who speaks against him, and leads him, humble and meek, to the faith of Christ, which he had previously resisted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
