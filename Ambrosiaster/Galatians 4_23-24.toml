[[commentary]]
quote='''
But he who was of the slave woman was born according to the flesh; while he who was of the free woman, through the promise; which things are spoken through allegory. Ishmael, who was born of the slave woman Hagar, was born according to the flesh, because he was born according to custom; but Isaac, because he was born through the promise, was born not according to custom but according to the providence of God, by his power, seeing that Sarah was both old and barren. For Isaac was born as a type of Christ; therefore he asserts that these things are spoken through allegory, so that the persons of Ishmael and Isaac signify one thing by another. For Ishmael signifies the birth of the Jews, or of those who are slaves of sin; but Isaac that of the Christians, because they are born in freedom; for he who receives the remission of sins becomes free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
