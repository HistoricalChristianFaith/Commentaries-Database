[[commentary]]
quote='''
DID ADAM HAVE THE HOLY SPIRIT? — Therefore, since they think that Adam’s perfection is restored to believers, let us see whether this restoration has anything beyond the divine gift which Adam had obtained. For when Adam was made, he was placed in paradise that he might work there and keep it: that is, that he might cultivate the land and keep the commandments of God, by which he might know that he had received dominion over all things in such a way that he himself should nevertheless live under the law of the Creator, lest his dominion should exalt him, and, puffed up with pride, he should become forgetful of his Maker. He was therefore placed there so that his life might be sustained by food: but through Christ this has been granted, that those who rise again do not need food or drink; because what is mortal in man is transformed into life. Adam was made to dwell on earth; but faith has consented to grant that our dwelling be in heaven. Scripture itself bears witness, for it says, The first man Adam was made a living soul, but the second man a quickening spirit. The first man was of the earth, earthly; the second man was from heaven, heavenly. As is the earthly, such also are the earthly; and as is the heavenly, such also are the heavenly (1 Cor. 15:45–48). What is clearer than that Adam did not have the Holy Spirit? For he was made a living soul; but through Christ (we are made) a quickening spirit, so that man may in some way be similar to the Creator whom he believes. For since the mystery of faith, which is given for salvation, is threefold, he becomes threefold, in body, soul, and Holy Spirit, through whom we are called sons of God: a title which Adam is by no means proved to have received; for he was made earthly. But the sons of God, born not carnally but spiritually, are said to be heavenly. Behold, the gift of God has clearly granted much more grace to man in the time of the Savior than Adam had received; for he has not only been restored, but also improved: restored in that he has been washed from sins; improved in all other respects. And this is to become an heir of eternal life: to receive the Holy Spirit; so that, because the Spirit is eternal, the one who receives Him should have eternal life: for He is the pledge of immortality. Adam’s making, surely, was carnal and earthly, not spiritual. For he was not born of God without flesh and blood, but made by God from earth: and therefore he could not receive the Holy Spirit, since he was not spiritual, and it had not been granted to him to call God “Father” in prayer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 123: DID ADAM HAVE THE HOLY SPIRIT?"
