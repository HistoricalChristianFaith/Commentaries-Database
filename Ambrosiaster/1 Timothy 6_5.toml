[[commentary]]
quote='''
And to keep away from those who, corrupted in mind, are deprived of the truth is judged useful; for they suppose the worship of God and godliness to be gain, hoping for nothing of the future, but providing for how they may get through the present, like the worldly sects too, which are known to have been invented for the sake of present gains; they are not unaware that some gladly hear this, that one must flourish in this life; and therefore one must withdraw from such men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
