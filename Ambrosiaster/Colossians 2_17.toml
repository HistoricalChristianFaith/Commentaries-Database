[[commentary]]
quote='''
Now all these things are the body of Christ, because they are names of the elements through their effects. Hence it is that he says in the Gospel: For the Son of man is Lord even of the sabbath (Matt. 12:8); for all things are through him, which indeed were given through Moses in such a way as to be a shadow or figure of things to come, so that, when the truth appeared, the figure should cease. For just as, when the emperor is absent, his image has authority, but when he is present it has none; so also these things were to be observed in their time before the coming of the Lord, but now that he is present they lack authority. Does anyone acting in the master's stead hold dominion while the master himself is present? If the deputies of prefects become private persons when the prefects are present, how much more ought slaves, when their master is present, to be seen themselves also in service!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
