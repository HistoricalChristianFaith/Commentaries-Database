[[commentary]]
quote='''
Otherwise, if you bless with the spirit; that is, if you speak the praise of God in a tongue unknown to the hearers: who fills the place of the uninstructed? How does he say Amen over your blessing, since he does not know what you are saying? For the unskilled man, hearing what he does not understand, does not know the end of the prayer and does not respond "Amen", that is, "true", so that the blessing may be confirmed. For the confirmation of the prayer is fulfilled through those who respond "Amen", so that all that is said may be confirmed in the minds of the hearers by the testimony of truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
