[[commentary]]
quote='''
And all the brothers who are with me, to the churches of Galatia. After commending his authority, he adds still more to the case, so as to show that the others who were with him were all stirred against them. Although his authority would have sufficed, so that it could not be refuted, yet to make their deed weigh more heavily, by which they had departed from their first faith, he indicates that many with him were inflamed to rebuke their error. For anyone will easily be able to understand that he errs, if he sees himself reproved by many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
