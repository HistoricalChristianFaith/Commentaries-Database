[[commentary]]
quote='''
All things are lawful for me, but not all things are expedient. To some it seems that the Apostle said All things are lawful for me, etc., on account of the freedom of choice that has been granted, so that it is lawful to commit fornication, yet not expedient. But how is what is forbidden lawful? Or surely, if all things are lawful, nothing can be called unlawful. "But it is lawful, yet not expedient." These things they whisper rather than assert, being either forgetful or careless. For John the Baptist says to Herod: It is not lawful for you to have your brother's wife (Mark 6:18). But perhaps John was unacquainted with human speech, having been inspired in the womb; for if this is so, he ought to have said: It is lawful for you, but not expedient. But the Lord too likewise says to the Canaanite woman: It is not lawful to take the children's bread and throw it to the dogs (Matt. 15:26). And again the Lord says to the Jews: Have you not read what David did when he was hungry; how he entered the house of the Lord, and took the loaves of proposition, which it was not lawful for him to eat, etc. (Mark 2:25). Everything, then, that is forbidden is not lawful; and everything that is not lawful is forbidden; but sometimes, when some cause intervenes, a thing is lawful, but not expedient.

All things are lawful for me, but I will not be brought under anyone's power. He says that all things are lawful for him, namely those things which were lawful for his fellow apostles too, which the natural law also contains, not the law of Moses; for Moses forbade many things on account of the hardness of heart of an unbelieving and stiff-necked people (Matt. 19:8). Yet if you look to the occasion, something else was in the Apostle's mind when he said these things; for he set these words first, being about to deal with this matter later, just as he did also concerning the man who had committed incest; for he puts it forward, indicating what he would deal with later. Then he at once returns to the earlier sense, having for the moment briefly commended the matter; for he said this because it was lawful for him to receive support from them. But since he knew that the false apostles were seeking an occasion for receiving, he would not receive from them, lest for the belly's sake the vigor of the truth of the Gospel should grow torpid. For if he received from those whom he was reproving for such great vices, he would be bending the authority of teaching granted to him by the Lord; for one from whom something is received cannot be reproved with firmness: especially since such a man is ready to give for this very reason, that he may humble the one set over him to himself. Hence he also says: But I will not be brought under anyone's power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
