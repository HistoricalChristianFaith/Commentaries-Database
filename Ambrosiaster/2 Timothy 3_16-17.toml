[[commentary]]
quote='''
All Scripture divinely inspired is useful for teaching, for correction, for restoration, for reproof, for instruction which is in righteousness itself, so that the man of God may be ready, complete for every good work. It is plain that all scripture of which God is shown to be the author is useful; for it was given for this purpose: to profit the unskilled and restore the misshapen, drawing the unrighteous to righteousness, so that the man of God may be perfect in every good work; for, advancing by degrees in the new man, it makes him a man of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
