[[commentary]]
quote='''
For knowing that the Lord will come to crush him, he will usurp his name for himself; and so that his kingdom may seem to be true, he will draw with him those who are to perish together with him, so that he sits in the house of the Lord in the seat of Christ, and asserts that he himself is God, not the Son of God. Hence in the Gospel the Lord says to the Jews: I have come in the name of my Father, and you have not received me; if another comes in his own name, him you will accept (John 5:43). Wherefore it is to be expected that he will come from the circumcision, or circumcised, so that the Jews may have the confidence to believe him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
