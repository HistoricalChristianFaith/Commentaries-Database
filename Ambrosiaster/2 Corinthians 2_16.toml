[[commentary]]
quote='''
To some indeed we are the odor of death unto death. He says this because to unbelievers the preaching of the cross of Christ is an odor of death; for when they hear the word of God, they receive it as a pestilence from which death arises: and it must be done to them according to their faith. But to others the odor of life unto life. It is true, because to those who trust, the word of God, once heard, is the messenger of eternal salvation, and it will befall them according to their faith. Whether, then, among those who perish or among those who are saved, the apostles were the good odor of Christ to God; because they preached sincerely and without flattery. For those who did not believe were putting a noose around themselves, while the apostles remained free, as the Lord says to the prophet Ezekiel: Preach; if they hear you, you will gain their souls: but if not, let them see to it themselves; you, however, will be free of their perdition (Ezek. 3:19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
