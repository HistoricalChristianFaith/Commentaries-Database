[[commentary]]
quote='''
So the Law was our pedagogue in Christ Jesus, that we might be justified by faith. It is the same sense: that we were under the care of the Law until Christ came, who would justify us as believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
