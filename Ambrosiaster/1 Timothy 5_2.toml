[[commentary]]
quote='''
Old women, however, as mothers, so that, while they see themselves taught with gentle speech, they may not take it harshly, since they profit in an honorable way: for it is harsh for elders when they are rebuked by the young. This he wishes to be softened by a certain moderation, so that there may be profit both for the one who speaks and for the one who hears. Young girls he advises are to be taught as sisters, so that they may readily accept the discipline of a good way of life. For when she sees that the things which pertain to a good life are being instilled into her not with command, she consents, showing herself humble to the one who admonishes her. For by blandishments are usually obtained the things that cannot be obtained by authority; for animals, when they are jealous over their own limbs, nevertheless yield to blandishments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
