[[commentary]]
quote='''
With all humility of mind and modesty, with magnanimity, bearing with one another in love, carefully keeping the spirit of unity in the bond of peace. Now he forbids dissension, and warns that love must be pursued, lest they lose the spirit of unity and peace; and thereby, that they bear with one another with patience. For modesty begets progress; because when they tolerate one another, admonishing with gentleness of mind, they are corrected to good effect, and peace will remain in them, through which they will not undeservedly be called sons of God; for the Lord said: Blessed are the peacemakers, for they shall be called sons of God (Matt. 5:9). For agitation or restlessness produces contention, which is wont even to wish to defend the things it knows to be evil, lest it seem to yield. Hence arises discord, which corrupts the covenants of peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
