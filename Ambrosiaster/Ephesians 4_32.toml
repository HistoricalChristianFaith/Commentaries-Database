[[commentary]]
quote='''
But be kind to one another, merciful, forgiving one another, just as God also in Christ has forgiven you. By the example of God the Father he exhorts them to become kind and merciful to one another, as the Lord also does: Be, he says, merciful, that you may be like your Father, who is in heaven (Luke 6:36). For if the Lord through his Son has had mercy on servants, how much more ought the servants themselves to have mercy on one another, and to forgive, if one sins against another? These are the precepts of him who has shown mercy: who, if he is despised in these, will without doubt revoke the sentence by which he had given mercy: and so it will happen as the Lord says in the Gospel about him who, having received mercy from the Lord, was caught being ungodly toward his fellow servant (Matt. 18:33).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
