[[commentary]]
quote='''
Whether therefore you eat, or drink, or do anything, all things to the glory of God. By these words added he has declared that to eat in the idol-temple, with whatever conscience it may be, is to be an enemy of God; for these things are dedicated to the devil to the reproach of the one God. For to eat and drink and do anything to the glory of God is this: that a banquet be celebrated with moderation under the invocation of the Creator; for something is done to the glory of God when God is praised in the actions and conduct of a Christian, or when the procreation of children is hoped for from God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
