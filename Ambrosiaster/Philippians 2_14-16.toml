[[commentary]]
quote='''
Do all things without murmurings and hesitations, that you may be blameless and simple, as sons of God, spotless in the midst of a crooked and perverse nation: among whom you shine as lights in the world, holding fast the word of life, to my glory in the day of Christ; because I have not run in vain, nor laboured to no purpose. But even if I am offered up upon the sacrifice and ministry of your faith, I rejoice and congratulate you all. And for this same reason do you also rejoice and congratulate me. So that they may have the fruits of their faith and of their works, he admonishes them to do all things that pertain to Christian discipline without hesitations and murmurings; because if anything is done negligently and without devotion, it does not reach its effect, since it falls under reproach: but that they should work in all simplicity, as spotless sons of God, so that, mindful of their profession, they may answer to it; so that among the distrustful they may appear as bright in life, way of life and conduct as the sun and the moon stand high in splendour among the stars. For as the stars are darkened when the sun appears, so the unrighteous and unfaithful, in the presence of the faithful and the righteous, appear base and disfigured; so that the Apostle may have glory at the coming of the Son of God, since his planting has produced such fruits. For then his labour and its effectiveness will be proved not to have been empty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
