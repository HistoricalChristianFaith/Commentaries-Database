[[commentary]]
quote='''
As it is written: He has scattered, he has given to the poor; his justice remains forever. This is written in the hundred and eleventh psalm, and by the example he adds to their care for the poor, so that they may abound in every good work. For if the justice of this man who gives generously to the poor remains forever, how much more that of him who ministers to the saints? For those can be called poor who are publicly needy; but the saints are distinguished from these, because these are servants of God, devoting themselves to prayers and fasts, leading a pure life, as did Anna the prophetess (Luke 2:37), who did not depart from the temple, serving with fasts and prayers night and day, setting aside all care of the world. This mercy, then, has been called justice, because he who gives generously, knowing that God gives all things in common to all, since his sun rises for all, and he rains for all, and he has given the earth to all, therefore shares with those who do not have the abundance of the earth, lest they seem deprived of God's benefits. He, then, is just who does not keep for himself alone what he knows was given to all: and just not only in this time, but also forever, because in the world to come he will have it with him perpetually.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
