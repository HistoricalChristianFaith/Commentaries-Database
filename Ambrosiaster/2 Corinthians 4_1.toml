[[commentary]]
quote='''
Wherefore, having this ministration, according as we have obtained mercy, let us not fail. He says that he has such great hope of this ministration that he does not fail in afflictions, strengthened by faith in the promises. Hence he said above: Let us use great confidence (2 Cor. 3:12); for those who trust in the things that are promised endure whatever adversity befalls them. This he does not attribute to human merits, but to the mercy of God, which first washes a man, then justifies him, adopting him as a son to God, so as to endow him with a glory like the glory of God's own Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
