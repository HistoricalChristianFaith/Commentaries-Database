[[commentary]]
quote='''
For we do not want you to be ignorant, brothers, of the affliction which befell us in Asia; that we were weighed down beyond measure, beyond our strength, so that we despaired even of living. He points out the sufferings of the afflictions inflicted on them almost to the point of death for this reason: to show what evils they were suffering for the sake of their salvation, so that they might not take it too hard if their errors were rebuked by those who endured such harsh things for them. For what physician would not reprove his patient for treating himself too carelessly, lest the care of his medicine remain without effect?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
