[[commentary]]
quote='''
This was said in Deuteronomy, which the Apostle here interprets concerning Christ. This is proper to the Apostle. Therefore he says that this righteousness belongs to faith, if there is no doubt about the hope of God, which is in Christ; lest anyone, distrusting, say: “Who could ascend into heaven?” For he suffered for this reason: that, having stripped the underworld by the power of the Father, and conquered death, he might rise again and ascend into heaven with the souls he had rescued. For everyone who, upon seeing the Savior in the underworld, hoped for salvation from him was delivered, as the Apostle Peter testifies; for he says that “the gospel was preached even to the dead” (1 Pet. 4:6). Whoever, therefore, does not doubt these things in his heart is justified by faith. But fear causes one to be justified by the law; for he fears the law because he sees that it inflicts punishment on sinners. Therefore the righteousness of the law is not great, nor does it confer merit before God, but only for the present; whereas faith, though foolishness to unbelievers, has a reward with God, from whom what is not seen is hoped for.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
