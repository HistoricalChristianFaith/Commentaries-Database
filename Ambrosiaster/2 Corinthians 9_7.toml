[[commentary]]
quote='''
Each one according to the purpose of his heart, not out of sadness or necessity; for God loves a cheerful giver. He teaches them that this profits for the future only if it is done with a glad mind. For of those who contribute, God has chosen this one to be rewarded, who works with a devoted heart, as if laying up treasure with God; because he who does it unwillingly on account of present shame, lest he be found disgraceful while others contribute, has no reward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
