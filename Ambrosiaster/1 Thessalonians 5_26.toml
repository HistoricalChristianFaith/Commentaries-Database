[[commentary]]
quote='''
Greet all the brothers with a holy kiss. Holy kisses are those in the Christian greeting; the rest are carnal, because whatever is done without Christ is carnal, and through this also mortal. For he who despises the author of life is in death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
