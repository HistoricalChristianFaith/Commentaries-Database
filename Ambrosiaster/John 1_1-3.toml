[[commentary]]
quote='''
WHEN IT IS READ IN THE APOCALYPSE OF JOHN: “GO,” HE SAYS, “AND TAKE THE BOOK FROM THE HAND OF THE ANGEL, AND DEVOUR IT, AND IT WILL MAKE YOUR BELLY BITTER, BUT IN YOUR MOUTH IT WILL BE SWEET AS HONEY” (Rev. 10:8–9): WHAT IS THIS BOOK THAT MAKES THE BELLY BITTER WHILE IT IS SWEET? — Very often, one who seeks brevity is accustomed to err. Why is it that you do not present everything that was spoken for the purpose at hand, but suppress some things so that the meaning becomes more obscure? For it was said to John: “Go and take the book that is in the hand of the angel, and devour it; and it will be in your mouth sweet as honey, but it will make your belly bitter.” And he said: “You must,” he says, “prophesy again before many peoples and nations.” Therefore, as far as the reasoning of truth is concerned, he is proved to have written the Gospel after the exile. For while in exile on the island of Patmos, to which he had been banished by the Emperor Domitian, he saw the revelation, as he says, on the Lord’s day; afterwards, as I said, he wrote the Gospel, which is bitter to heretics, who are signified in the belly. For they are carnal, because they understand Christ wrongly. “But in your mouth,” he says, “it will be sweet as honey”: as though he were making of all Christians one body, so that individuals are members one of another, such that in the mouth, which is, of course, a part of the head, he signifies the more honorable and more faithful, for whom the truth concerning Christ is sweet; in the belly he signifies the heretics, because they are carnal. For the truth that speaks of Christ as true God is bitter to them. The whole Gospel of John is indeed against heretics. Against Photinus, who denies that Christ existed before Mary, he proves that the Savior descended from heaven. Against Arius, moreover, he shows that Christ has no beginning: because “in the beginning” Christ the Son of God was God with God the Father, and because nothing was made without him, he himself cannot be called a creature. For if he were a creature, something would have been made without him; but because nothing was without him, he always existed. Sabellius, however, who accepts a merging of Father and Son so that one individual is called by two names, he refutes in this way, when he says: “If you loved me, you would indeed rejoice, because I go to the Father, for the Father is greater than I” (Jn. 14:28); where he made clear the persons of two, when the Son calls the Father greater. For the single one is not greater than himself. He likewise convicts Marcion, who denies the flesh of Christ. For he said: “And the Word was made flesh and dwelt among us” (Jn. 1:14). With this meaning he also reproves Manichaeus, who does not know that Christ came in the flesh and blocks the entrance to marriage, ignorant that the Savior rewarded the marriage feast. In like manner it was said also to the prophet Ezekiel by the angel that he should take a scroll (Ezek. 3:1) and devour it, and it would be sweet in his mouth but would fill his belly. This was said to the prophet when he was sent to reprove a faithless and undisciplined people, who likewise are signified in the belly because they were carnal. From these are those whom Scripture in the prophet Isaiah, though they are evil, nevertheless calls brothers. For it says: “You who fear God, say to those who hate you and have not heard my precepts, ‘You are our brothers’” (Isa. 66:5, according to the LXX).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 65: ON THE BOOK SWEET IN THE MOUTH AND BITTER IN THE BELLY"

[[commentary]]
quote='''
GOD IS CERTAINLY PERFECTION AND IN NEED OF NOTHING; WHAT NEED THEN HAD CHRIST THE SAVIOR TO BE BORN OF GOD, AND FOR GOD TO HAVE A SON THROUGH WHOM HE MIGHT MAKE ALL THINGS? — When God willed that things which had not existed should come into being, and understood that this work was in no way worthy of His majesty, He first generated from Himself, since He is by nature simple and incorporeal, the Son, who in no way differed from Him, so that an effect might correspond fittingly to His greatness. For what more could He do than to generate from Himself another who is perfect? This therefore is the perfect work, beyond which nothing else can appear more excellent. [For all other things are lesser: for the more Christ excels all these, the more the creation of those things is inferior to His generation. And there is another point:] For God, from whom are all things, wishing to create the creature, first generated the Word which He held with Himself in mystery, that is, He caused it to exist. This Word He therefore called Son, so as to show that He came forth from Himself and is consubstantial with Him: in order that the law by which sons are from their parents might make this credible, through which He would reveal to the creature the mystery that lay hidden in Him from eternity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 48: WHY GOD BEGOT A SON THROUGH WHOM TO MAKE ALL THINGS"
