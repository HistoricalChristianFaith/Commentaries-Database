[[commentary]]
quote='''
And through him to reconcile all things unto himself, making peace through the blood of his cross, whether the things that are in heaven or the things that are on earth. This is what he mentioned above: that in order to restore through him all the things which he had made, since through a certain error they had already begun to be at variance with one another, and also with their author (for there is still error in the fleshly heavens), he humbled him by making him incarnate, so that, made man, he might show and teach how the things that are in the firmament and upon the earth could be reconciled to the Creator. And to bring this to completion, he suffered himself to be killed for the sake of men; so that those whom he had taught in the upper world, going out from here, cannot be held by the second death; so that his teaching might have the fruit of the first institution, and all things made through him might live in him as in their author, as Peter confesses in the Acts of the Apostles (Acts 3:15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
