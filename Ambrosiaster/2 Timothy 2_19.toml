[[commentary]]
quote='''
But the firm foundation of God stands, having this seal: for the Lord has known those who are his: and let everyone who names the name of the Lord depart from iniquity. The foundation of God is faith, which holds what God has promised; and this faith cannot be broken by the inventions of the faithless and the heretics; for although these deny the things to come which we believe, yet God will give what we believe he will give, his promise bearing witness. The seal of God's promise, therefore, is our faith, which makes firm the words of God. On the day of judgment God will know those who have his sign, dissenting from the iniquity of the faithless and the heretics, which thinks it weakens God's promise; for nothing is so iniquitous as to go against the faithfulness of God. And so it was said by Moses to Dathan, and Abiram, and Korah, when they presumed to offer sacrifices against the precept of God (Num. 16:35): The Lord has known, he says, those who are his. By this saying he showed what destruction awaited those who would pervert the words of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
