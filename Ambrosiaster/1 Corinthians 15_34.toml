[[commentary]]
quote='''
Be watchful, be righteous, and do not sin. He warns that they must be watchful, lest, caught by the deceit of a depraved sense and led away from the faith, they be corrupted by not believing in the resurrection of the dead. He commanded them to be righteous, so that they might cultivate not only earthly righteousness but also heavenly; for earthly righteousness does not produce merit, just as it does not make one guilty either. For what great thing is it not to take what belongs to another, since this comes of fear? But it is a great thing to give of one's own to one who has not; this is true righteousness. And he added that they should not sin; from which he wished it to be understood that he had not commanded temporal righteousness to be kept, but divine; for he who keeps heavenly righteousness is without doubt perfect in this present one.

For some have ignorance of God; I speak to your shame. Ignorant of God's purpose, those who were being converted among them said that it was foolish to believe that the dead would rise. Therefore he strikes shame into them as being imprudent; for they believed those who, having ignorance of God, taught contrary to God's decrees.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
