[[commentary]]
quote='''
Be imitators of me, brothers, and observe those who walk so, as you have our pattern. He wants them to be watchful, lest they be caught by the subtlety of wicked men, and to take note of each one, how he both lives and teaches, so that they may join themselves to those in whom they have recognized the mind of their teacher.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
