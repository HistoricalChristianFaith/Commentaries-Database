[[commentary]]
quote='''
Greet one another with a holy kiss. This greeting is the Church's; for these kisses are not carnal but spiritual, joining souls by the embrace of bodies, not with the desire of the flesh but of the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
