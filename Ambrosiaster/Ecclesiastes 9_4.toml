[[commentary]]
quote='''
WHAT IS THIS THAT IS READ IN SOLOMON: “THERE IS HOPE,” HE SAYS, “FOR ONE WHO IS JOINED TO ALL THE LIVING; FOR A LIVING DOG IS BETTER THAN A DEAD LION” (Eccles. 9:4)? — The “darkness” signifies paganism and ignorance. By what he then adds, “A living dog is better than a dead lion,” he wants us to understand that there is greater hope in the pagan people than in the apostate. For just as the lion is stronger than all wild beasts, so is Christianity stronger than all sects. If therefore anyone has turned away from it, he loses salvation, so that he is worse than a pagan. For it can happen that a pagan comes to believe and gains the salvation which the apostate has lost. But if he does not believe, still the apostate is worse; for it is worse to have lost salvation than never to have had it. The Savior shows that the “dog” signifies the pagan when he says, “It is not permitted to take the children’s bread and throw it to the dogs” (Matt. 15:26).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 39: ON ECCLESIASTES 9:4 (THE LIVING DOG AND THE DEAD LION)"

[[commentary]]
quote='''
In Solomon it is said, “Hope is in the darkness, and a living dog is better than a dead lion.” (Eccles. 9:4). — “Darkness” signifies ignorance and paganism: because there is more hope in the pagan than in the apostate. He calls the latter the “dead lion,” that is, the Christian apostate: for as long as he remained in the faith, he was a lion; but when he fell away, he is called dead. The “dog,” however, is the pagan in whom there is hope that he may believe: for as long as he lives, there is hope for him. But the apostate’s hope will perish. For the Savior shows that the “dog” signifies the pagan when he says, “It is not permitted to take the children’s bread and throw it to the dogs.” (Matt. 15:26)
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 19: ON A LIVING DOG AND A DEAD LION"
