[[commentary]]
quote='''
Therefore let him also who thinks he stands take heed lest he fall. He says this to those who, presuming on the knowledge by which it is lawful to eat all things, were a stumbling-block to weak brothers: and thinking that they were making some progress through the teaching of the false apostles, they had grown worse; and they judged the Apostle, when they themselves were guilty. He therefore cuts off pride, lest through it they be tempted, as the Jews were tempted, and perished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
