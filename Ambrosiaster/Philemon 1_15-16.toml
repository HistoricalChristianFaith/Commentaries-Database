[[commentary]]
quote='''
For perhaps he departed for an hour for this reason, that you might receive him for ever: no longer as a slave, but instead of a slave a beloved brother, especially to me; but how much more to you, both in the flesh and in the Lord? Onesimus, having offended his own master, fled by a long journey to the Apostle, so as to show that he had not withdrawn in order to be liable for an offence, but so that, his sins blotted out, he might return useful to such a degree that he would not only become equal to his master in merits, but a brother also to the teacher himself. And lest Philemon, as is usual, should feel some disdain of pride, as a master against a slave, he humbles him when he calls him a brother both in the flesh and in the Lord; so that, the consideration of human condition being removed, since we are all from the one Adam, we may recognize ourselves as brothers: especially when faith comes between, which cuts off all pride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
