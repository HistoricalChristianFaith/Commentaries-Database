[[commentary]]
quote='''
Persevere in prayer, watching in it with thanksgiving: praying at the same time for us also, that God may open to us a door of the word to speak the mystery of Christ (on account of which I am also in chains), that I may make it manifest as I ought to speak. He shows that those who are now wise in the mystery of the Lord Christ, and wary in avoiding the vices of sins, must persevere in prayer, so that they may grow in merits while the temptations of the adversary fail. He holds them so worthy that he judges they can even help him by their prayers to assert boldly the Gospel, for the making manifest of which he had received his embassy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
