[[commentary]]
quote='''
Therefore, brothers, when you come together to eat, wait for one another. If anyone is hungry, let him eat at home. He says to wait for one another so that the offering of many may be celebrated together, and that all may be ministered to: and if anyone is impatient, let him feed on earthly bread at home.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
