[[commentary]]
quote='''
Now I wish you all to speak in tongues, but rather that you may prophesy. He could not forbid speaking in tongues, since he says above that this is a gift of the Holy Spirit; but zeal for prophesying is to be held higher for this reason, that it is more useful. For he who prophesies is greater than he who speaks in a tongue, unless he interprets. For if he is able to interpret, he will not be less, because he edifies the Church; for that is greater which benefits all. For that man speaks in tongues by the gift of God who also interprets, as did those twelve in the Acts of the Apostles (Acts 2:4).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
