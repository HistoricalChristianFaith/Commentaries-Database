[[commentary]]
quote='''
But I say this by way of indulgence, not by way of command. It is clear that he gives this counsel to exclude fornication, not to close the road to those striving toward a better life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
