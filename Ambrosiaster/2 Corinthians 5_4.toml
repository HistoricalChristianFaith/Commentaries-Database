[[commentary]]
quote='''
For while we are in this body, that is, the mortal one, we groan, being burdened, because we do not wish to be unclothed, but to be clothed over, so that this mortal may be swallowed up by life. The sense is the same. For he says this: that we, burdened by the sufferings of the body and by the storms of the world itself, direct our petitions to God, lest we be changed, overcome, and become unworthy; but that, when our departure has come, persevering in faith, we may be found clothed with the Holy Spirit, who in substance is Christ. For then we shall be able to be clothed over with the promised glory, if, unclothed of the body, we have not been stripped of the Holy Spirit. Thus the mortal is swallowed up by life, that is, so that, rising again, we are clothed over with immortality together with glory, so that it can no longer die or be entangled in sufferings; and this is to be swallowed up by life. For he is not to be said to be swallowed up by life who rises for this, that he may be driven to punishments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
