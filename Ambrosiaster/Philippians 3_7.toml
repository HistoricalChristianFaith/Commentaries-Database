[[commentary]]
quote='''
But the things that seemed gains according to human understanding were found, in comparison with Christ, to be losses. Why losses, unless because it was no longer the time for the Law to be kept? For all these things were empty, and hindrances to approaching grace; and because these are carnal, but ours are spiritual.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
