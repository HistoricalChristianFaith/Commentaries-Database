[[commentary]]
quote='''
God, then, was in Christ. How? As in a vicar or an ambassador, as he was in the prophets, or otherwise? Can he not be understood to have been in the Son as well, just as he was in the prophets? For the Son is by nature the ambassador of God the Father. Hence he says: Because the Father is in me, and I in the Father (John 14:11); for the Father is understood to be in the Son by this, that their substance is one. For there is unity where there is no difference; and for this reason they are in one another, because both their image and their likeness are one, so that he who sees the Son is said to have seen the Father, as the Lord himself also says: He who sees me sees the Father also (John 14:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
