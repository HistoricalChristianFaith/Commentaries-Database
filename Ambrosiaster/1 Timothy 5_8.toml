[[commentary]]
quote='''
But if anyone does not have care of his own, and especially of those of his household, he has denied the faith and is worse than an unbeliever. This widow, who was negligent toward her own dear ones, so as not to bring them up in the discipline and correction of the Lord, he says is not to be honored; because, like the faithless, she has not obeyed the law of the Lord, so that she is held to be worse. For he must needs be worse who, living under the law and the fear of God, is a despiser, than he who is not subject to the law; for this one does not know, but that one despises knowingly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
