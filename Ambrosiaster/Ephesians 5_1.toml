[[commentary]]
quote='''
Be therefore imitators of God, as most dear sons. This is what he said above: that by this exhortation we are commanded to be imitators of God the Father, so that, if we obey, we may be held to be most dear sons of God. For that son is most dear to his father who is an imitator of his good qualities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
