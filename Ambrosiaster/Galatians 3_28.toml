[[commentary]]
quote='''
There is neither Jew nor Greek: there is neither slave nor free: there is neither male nor female; for you are all one in Christ Jesus. He says that there is no distinction among believers, so that no one is prejudged by what he was before he believed; for to all of these one gift has been decreed. For with God there is no distinction of persons, except of conduct and life; so that men of one faith are distinguished by merits, not by persons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
