[[commentary]]
quote='''
Now may God himself and our Father, and our Lord Jesus Christ, direct our way to you. He asks that his journey be arranged in its complete order: first by God the Father, because from him are all things; then by the Lord Jesus Christ, through whom are all things; so that the power and providence of the Father and of the Son may commend his coming, and that he may become acceptable to those who hear him, and that the hindrances of the devil might be loosed for the directing of his journey.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
