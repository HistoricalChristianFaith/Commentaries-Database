[[commentary]]
quote='''
BY WHAT REASONING DID THE CHALDEAN MAGI UNDERSTAND, FROM THE APPEARANCE OF A STAR, THAT CHRIST, THE KING OF THE JEWS, HAD BEEN BORN, SINCE A TEMPORAL KING IS USUALLY SIGNIFIED BY A STAR AS A SIGN (Matt. 2:1–2)? — These Chaldean Magi did not observe the course of the stars out of malevolence, but out of a curiosity about things. For, as can be understood, they were following the tradition of Balaam: who, when he had been summoned by Balak to curse the people of God, by divine prompting began to bless them. From his report, therefore, they had learned that, by the providence of God, there would arise from Jacob one who would reign. Therefore, what is well known, he prophesied, saying, “A star shall rise out of Jacob,” etc. (Num. 23, 24). Following this tradition, then, the Magi, seeing a star outside the order of the cosmos, understood this to be the one which Balaam had prophesied would appear as the sign of the future King of the Jews. This indeed was done against the enemies of religion. For from the very quarter where it is usually discredited, it received testimony. For astrologers are enemies of the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 63: HOW THE MAGI KNEW THE STAR SIGNIFIED CHRIST'S BIRTH"
