[[commentary]]
quote='''
Therefore do not become imprudent, but understanding what the will of the Lord is. The Lord Jesus warns that we must be zealous for peace. And the vessel of election: If it can be, he says, as far as lies in you, having peace with all men (Rom. 12:18). And to Timothy: The servant, he says, of the Lord must not quarrel, but be gentle toward all (2 Tim. 2:24). This is the will of the Lord, that what is to be done by his servants should be done with modesty; for disturbance and uproar, or contention with animosity, breed enmity. He added these things, then, on account of what precedes, where he wants the servants of God to correct the transgressions of sinful men; so that, since dissension and brawling are wont to arise from this, they may reprove sinners with moderation and gentleness, lest, being provoked to anger, they rush into strife. And so he warns that this must be seen to prudently, that there may be progress.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
