[[commentary]]
quote='''
But be filled with the Holy Spirit, speaking to yourselves in psalms and hymns and spiritual songs, singing and making melody in your hearts to God. The Holy Spirit loves a rational life; for if we live well, we shall be filled with him, as he relates, to confess and extol the gift of God with varied melody of voice, so that praise may be sung to God in every tongue. For he in whom the Spirit is always meditates on spiritual things; so that it may not be on the lips only, but may burst forth from the heart, because of the ancient saying of the Lord through the prophet. For he says: This people honors me with their lips, but their heart is far from me (Isa. 29:13).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
