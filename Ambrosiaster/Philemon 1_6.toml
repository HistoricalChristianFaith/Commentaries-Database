[[commentary]]
quote='''
The Apostle, however, says that he adds this to his prayers, that his working may be done with knowledge of goodness; that is, that he may do this work with such a mind as to expect the reward of it in the future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
