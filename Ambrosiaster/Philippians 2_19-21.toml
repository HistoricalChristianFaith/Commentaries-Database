[[commentary]]
quote='''
But I hope in the Lord Jesus to send Timothy to you shortly, that I also may be of good heart when I have been informed about you. For I have no one so like-minded, who would bear a sincere concern for you; for all seek the things that are their own, not the things that are Jesus Christ's. But you know his proof, that as a son with a father he served with me in the Gospel. Him, therefore, I hope to send at once, as soon as I see how things stand with me. And I trust in the Lord that I myself also shall come to you soon. These things are plain and need no interpretation; for he indicates that after this epistle he will send Timothy, through whom he may learn reliably what is being done concerning them. For he was like-minded with the Apostle; that is why he is also marked out as more concerned for them, not like certain men who, while they wished to commend themselves, were negligent of the discipline and way of life of the brethren. For they did not preach with a devoted mind, but for their own gain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
