[[commentary]]
quote='''
But when the goodness and kindness of our saving God shone forth, not by works of righteousness which we did, but according to his mercy he saved us through the washing of regeneration and renewal of the Holy Spirit, whom he poured out upon us abundantly through Jesus Christ our Savior; that, justified by his grace, we may be made heirs according to the hope of eternal life. This good that is seen to flourish in Christians springs from the root of the divine godliness; for God by his mercy has saved us through Christ, reborn by whose grace we have received the Holy Spirit abundantly, so that we may be able to lean upon good works, he himself helping us in all things, that through these we may be able to attain the inheritance of the kingdom of heaven. Wherefore we ought to submit to him with all devotion and obey his precepts; because whatever is beautiful in us, he himself paints with spiritual strokes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
