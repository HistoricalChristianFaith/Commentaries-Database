[[commentary]]
quote='''
For he is our peace, who has made both one, and loosing the middle wall of the partition, the enmities in his flesh. The passion of the Savior made peace between circumcision and uncircumcision. For the enmity which was like a wall in the middle, and divided circumcision from uncircumcision and uncircumcision from circumcision, this the Savior loosed, giving a law that neither should the Jew, presuming on circumcision, reject the Gentile, nor the Gentile, trusting in uncircumcision, that is, in paganism, abhor the Jew: but that both, made new, should follow faith in the one God in Christ. For all that the Savior taught he confirmed then, when he rose from the dead. Yet the wall that was in the middle, dividing between the law of deeds and the Gentile world, he signified as a partition or hedge, that is, not a stable wall, nor a strong one; because neither was the Gentile world a firm thing, being as it were invented by man, nor were circumcision, and new moons, and the observance of foods and of sacrifices or of sabbaths stable and fixed; for they were given in such a way that they should cease at the coming of Christ. For although God gave these things, yet he gave them for a time: but the preaching of faith is firm and without successor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
