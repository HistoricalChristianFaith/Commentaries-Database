[[commentary]]
quote='''
Planning this, then, did I use levity? Or the things I plan, do I plan according to the flesh, so that with me there is Yes, yes, no, no? Since he said: I had wished to come to you, and did not go, therefore did I use levity, he says, since one who says something and does not do it seems to use levity? So, lest they perhaps think this of the Apostle, he clears it away: that he did not do this lightly, but with counsel, in not fulfilling what he had arranged. Or the things I plan, he says, do I plan according to the flesh? For one who plans according to the flesh fails to fulfill what he arranges when he either defers to more important persons, or else is overcome by gains or by display, which the Apostle always despised. But the spiritual man fails to fulfill what he arranged when he considers something more providently for the salvation of the soul; just as the Apostle too did not fulfill what he had wished for this reason, that through this very thing they might be made better, knowing that he had put off coming because some among them had not yet purified themselves from their sins. So that there is, he says, with me Yes, yes; no, no. This signifies that he did nothing other than what he knew ought to be done; because advantage is to be put before will. This is the spiritual understanding; but the carnal understanding is changed in such a way that it puts will before advantage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
