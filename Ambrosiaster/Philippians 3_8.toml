[[commentary]]
quote='''
But indeed I count all things to be losses because of the eminence of the knowledge of Christ Jesus my Lord, for whose sake I have counted all things losses, and count them dung, that I may gain Christ, and be found in him not having my own righteousness, which is from the Law, but that which is through the faith of Christ, which is from God, the righteousness upon faith, to know him, and the power of his resurrection, and the fellowship of his sufferings, conforming myself to his death; if in any way I may arrive at the resurrection which is from the dead. Since above he was speaking of the race of Abraham, and of the Law and its righteousnesses, and of the merits of those who observe it, reckoning all these things a loss in comparison with the promises of the Savior, he now adds not only these things: But even all things to be loss because of the eminence, he says, of the knowledge of Christ Jesus my Lord. After the Law and its righteousnesses, what will all these things be, unless it means that the knowledge of Christ is to be put before the very life of body and soul? For if, as he says to the Colossians, in Christ are hidden all the treasures of wisdom and knowledge (Col. 2:3), all things whatsoever that exist are to be reckoned of no account, so that one may succeed in attaining to the excellence of this wisdom and knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
