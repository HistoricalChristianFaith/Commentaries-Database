[[commentary]]
quote='''
But in all things let us commend ourselves as ministers of God. The ministers of God teach without flattery, so as to please him whose ministers they are; not like the false apostles, who, knowing that they had not been sent by God, were eager for present advantage. In much patience. It is patience that saves men; for unless he had used patience, how would he have saved the Corinthians, whom after his preaching he had found entangled in such great vices of conduct and in the errors of various sects, and whom by his patience he is gradually calling back to the true doctrine? In afflictions. He bore afflictions, knowing what has been promised by God for them. In necessities. It was a necessity for him to teach even when placed in affliction, because he had been sent by the Lord. In straits. Hard pressed, in the hope of what is to come he did not yield to the opposition of the faithless.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
