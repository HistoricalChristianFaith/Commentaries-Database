[[commentary]]
quote='''
The Apostle writes a second letter to the Corinthians, and this is its principal reason. Since in the first he had chiefly rebuked their teachers on account of the sins of certain persons, and they had been much grieved, he now consoles them, setting his own example before them and teaching that they ought not to take it ill that they were rebuked for the salvation of others, since he himself, for the salvation of others, is daily exposed to dangers and to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"

[[commentary]]
quote='''
Paul, an apostle of Jesus Christ. Now secure about them, he confidently proclaims himself an apostle of the Lord. For in the first letter he says that he was called an apostle, though not approved by those who had been led away from his tradition. Through the will of God. To prove his apostleship valid, he says that he was made an apostle by the will of the Lord Christ: for so the Lord says to the Jews: The things that are pleasing to him, that is, to God the Father, I do always (John 8:29). And Timothy the brother. He writes this together with the one through whom he sent the first letter to them, that is, with Timothy; to show them that he had heard from him of their good will, by which they submitted themselves to be rebuked. To the church which is at Corinth with all the saints who are in Achaia. Now he joins them to the saints of the other churches, so that they may know that they have made progress.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
