[[commentary]]
quote='''
And that he was seen by Cephas: that is, by Peter. This too the disciples told Cleopas and his companion, as in the Gospel κατὰ Λουκᾶν (according to Luke): that he had appeared to Peter alone. Afterward by the eleven (Luke 24:34). And this is contained in the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
