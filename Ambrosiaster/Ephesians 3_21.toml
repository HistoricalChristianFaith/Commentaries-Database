[[commentary]]
quote='''
To him, therefore, is glory in Christ Jesus, because through him he furnishes all things to us; and because the honor of the Father is in the Son, and in the Church, that is, in the people whom he has deigned to adopt for himself. For in the splendor of the sons is the glory of the father, as the Lord says (Matt. 5:16): So let your light shine before men, that they may see your good works and magnify your Father, who is in the heavens. Unto the ages of ages. Amen, that is, truth unto eternity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
