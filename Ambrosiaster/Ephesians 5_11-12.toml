[[commentary]]
quote='''
But rather even rebuke them; for the things that are done by them in secret it is shameful even to speak of. He wants them not only to be strangers to evil deeds, but also to reprove the evil deeds of those who work shamefully in secret. For sins are proven only when they are reproved; so that they may admire the sons of light, whom, when they are justly reproved by them, they will not be able to gainsay, but will rather revere.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
