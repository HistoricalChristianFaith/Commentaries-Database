[[commentary]]
quote='''
He, then, who does not draw back his soul from death hands it over to destruction as regards the present life, as the Lord also says: For whoever wishes to save his soul will lose it (Matt. 16:25). This losing is the destruction; because he who hands over his soul for Christ loses it as regards the world; yet he will preserve it for the future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
