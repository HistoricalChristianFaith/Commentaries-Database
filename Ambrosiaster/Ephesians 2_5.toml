[[commentary]]
quote='''
And when we were dead in sins, he made us alive together in Christ. Estranged from God we were dead: but by his grace he called us back, that is, he gave us life in Christ. For because he made us through him, through him he has again reformed us in him, that is, so that we may be his members; and he is our head; for we have him, by God's gift, as the author of our life, as Peter the apostle says: But you killed the Author of life (Acts 3:15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
[[commentary]]
quote='''
By whose grace you have been saved. To this gift he adds the Gentiles too, signifying that we have been saved by the grace of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
