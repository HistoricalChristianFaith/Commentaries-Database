[[commentary]]
quote='''
Even as the testimony of Christ has been confirmed in you. The testimony of Christ has been confirmed in them, because, strengthened in faith, they hoped for nothing from men; but all their hope was in Christ, and they were caught by no enticements of pleasure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
