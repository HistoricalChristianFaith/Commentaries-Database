[[commentary]]
quote='''
Are all apostles? It is true, because in the Church there is one bishop. Are all prophets? It is not doubtful that prophecy is not granted to all. Are all teachers? He is a teacher to whom it is granted to instruct others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"

[[commentary]]
quote='''
Are all powers? He can have power to whom God grants to cast out demons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
