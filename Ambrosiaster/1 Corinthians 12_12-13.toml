[[commentary]]
quote='''
For just as the body is one and has many members, and all the members of the one body, though they are many, are one body, so also is Christ. For indeed in one Spirit we have all been baptized into one body, whether Jews or Greeks, whether slaves or free; and we have all drunk one Spirit. By these words he teaches that no one's person is to be scorned as though despised, nor is anyone's to be preferred as though he were perfect; nor is the glory which is owed to God alone to be attributed to men, since in all one and the same God is glorious: inasmuch as we all have both one baptism and one and the same Holy Spirit. This is on account of the cause mentioned above, because they gloried in some, but spurned others as contemptible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
