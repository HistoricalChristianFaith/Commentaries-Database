[[commentary]]
quote='''
WHY DID THE SAVIOR, AFTER HIS BAPTISM, FAST FOR FORTY DAYS AND THEN AFTERWARD GROW HUNGRY (Matt. 4:2)? FOR ONE WHO FASTED FORTY DAYS COULD HAVE ALREADY CEASED TO FEEL HUNGER. — It is written: “My son, when you come to serve God, stand fast in righteousness and fear, and prepare your soul for temptation” (Sirach 2:1). Therefore the Savior, to give us a pattern, fasted; so that we too, persistently devoted to fasting in like manner, may, with God’s help, overcome every movement of the Devil directed against us, knowing from the example of the Savior that we must especially beware of the snares of our adversary when we draw near to the fear of God. For he is grieved that we have departed from him; therefore he rages more fiercely against us. The Savior did this for us, not for Himself. Likewise His growing hungry was not for His own sake, but for ours. For when, by fasting, the temptations of the Devil had been overcome, temptations which are not recorded, precisely because they do not pertain to the advancement of doctrine, then afterward, that is, after forty days, He allowed Himself to suffer hunger (which belonged to His human nature); so that the Devil, already defeated, seeing in Him the weakness of hunger, would be stirred up once more to tempt Him, recognizing that it was a man who was overcoming him. For this was the mystery of the Savior: that because he had mocked and ruled over man when man was defeated, he should be conquered by man, so that the power of God might win victory for man; and therefore Satan became more shameful, since he sees a man and yet perceives no merely human power. He marveled, dulled with astonishment, that there was a mystery present which escaped him: that he had the power to approach, but not to ensnare. He was tormented for two reasons: seeing weakness, he drew near, and then found strength; seeing a man, he became suspicious of the power of God. Therefore He hungered, in order to make sport of Satan’s cunning. And He did not fast longer, so that He might be in harmony with Moses and Elijah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 9: WHY THE SAVIOR FASTED FORTY DAYS THEN GREW HUNGRY"
