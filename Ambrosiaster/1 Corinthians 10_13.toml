[[commentary]]
quote='''
WHAT IS THAT SAYING OF THE APOSTLE, “LET NO TEMPTATION TAKE HOLD OF YOU EXCEPT WHAT IS HUMAN” (1 Cor. 10:13)? — Not without providence, as I judge, does our Apostle, the teacher of the Gentiles, desire that temptation should take hold of us, but only such as is human; because divine temptation brings destruction. By this kind of temptation the Jews were seized by serpents and perished. For while acting under God’s law, they doubted his providence; and therefore he urges us that we be not seized by divine, but by human temptation. For a person is said to be tempted by God in this sense: one who acts under his name yet looks for salvation from idols, because he does not have a God who has been approved. For everything that has not been approved is put to the test; and what is put to the test is brought into doubt. And therefore divine temptation is deadly, whereas human temptation is saving: for just as doubting God is destructive, so despairing of man for the sake of God’s law is most health-giving. Accordingly, with foresight the Apostle says, “Let no temptation take hold of you except what is human,” (1 Cor. 10:13) so that, being tempted by men on account of God’s law, we may be found strong, while those carnal men doubt us, but we may be approved by God. For those who are not approved by God are tempted so that they may be corrected. There is therefore a twofold temptation: at times we are tempted as though faithful, at times as though untrusting; so that the temptation of the faithful is human. For on account of faith we are afflicted by men: they tempt us to see if they can draw us away from the faith. On account of distrust, however, people are tempted so that, being pressed hard, they may repent and return to the way; as also happened to the Jews. For when they lacked trust in the providence of God, they were tempted by serpents, so that, corrected by pain, they might be corrected. For God so tempts such people that he may correct them. There is also another kind of temptation, by which Abraham was tempted, and Job as well, and Tobias, the servants of God: so that Abraham, through the trial of offering his only and most beloved son (Gen. 22), might have a richer fruit of righteousness for eternal glory; while Job, by the loss of all his possessions, might be increased in wealth, being made rich in heaven and on earth (Job 1, 2; 42:12–13). Tobias too, having suffered the blindness of his eyes, advanced so far that in the present he became glorious when his sight was restored, and for the future there was kept for him a perpetual brightness (Tob. 2:11; 11:15). For the righteous are tested for this purpose, that they may make progress. And therefore in temptation we ought to be strong in spirit, knowing that this tends not to our decrease but to our increase, provided only that we endure with an even mind through Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 99: ON HUMAN VERSUS DIVINE TEMPTATION"

[[commentary]]
quote='''
WHAT DOES THE APOSTLE MEAN WHEN HE SAYS, “LET NO TEMPTATION SEIZE YOU EXCEPT WHAT IS HUMAN” (1 Cor. 10:13); AS THOUGH HE WERE WISHING THIS TO HAPPEN? AND WHAT IS THIS HUMAN TEMPTATION? FOR BY THIS HE SHOWS THAT THERE IS ALSO A DIVINE TEMPTATION. — Every question, so that it can be made clear, must be brought back to its origin. Now the Apostle, when he was complaining about the faithlessness of the Jews, and because they tempted God in the wilderness, where he says, “Nor let us tempt Christ, as some of them tempted” (1 Cor. 10:9)—while he recalled these things and explained what they suffered on account of such evils, in order to inspire fear, so that by that very example he might draw us back from the hatred or from the temptation which is directed against the Lord (for it is a divine temptation if, while acting under God’s law, someone from another quarter or from idols seeks help, distrusting God), this it is that the Apostle warns us to avoid. But that human temptation should hold us, he exhorts: because human temptation is, in a cause of God, to despair of man and to be resolute in faith toward God. For this enticement is understood as distrust, in order that they may not distrust the promises of God. In human matters, because in every error of seduction there is human temptation, which, hostile through worldly reasoning, opposes God’s law, despairing of his promises. You therefore have set forth what is temptation directed toward God, and what is human temptation, which we ought not to reject, if we are sharers in the faith of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 52: ON HUMAN VERSUS DIVINE TEMPTATION"
