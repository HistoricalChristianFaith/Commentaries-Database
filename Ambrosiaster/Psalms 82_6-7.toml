[[commentary]]
quote='''
For when one says: I am of Paul; and another: I of Apollos; are you not men? For just as those who glory in God and hope for every grace from him are called gods, adopted by God, so too those who glory in man are called both men and carnal, shut in by the sentence of God, who says: I said, You are gods; but you shall die like men (Ps. 81:6). He begins, then, with his own person, lest perhaps he be thought to be tearing down their persons rather out of envy, showing that it is a great error, and one that amounts to an insult to God, when, after God has been preached, glory is given to men. In what, then, does it fall short of paganism, so long as something is still hoped for from men?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
