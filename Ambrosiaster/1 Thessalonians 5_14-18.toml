[[commentary]]
quote='''
And we ask you, brothers: rebuke the restless, console the faint-hearted, help the weak, be patient towards all. See that no one renders evil for evil to anyone, but always pursue what is good, both towards one another and towards all. Always rejoice in the Lord, pray without ceasing, give thanks in all things. For this is the will of God in Christ Jesus in all of you. Since it is inevitable that among the people some are unrestrained, some faint-hearted, that is, timid, and some weak in faith, he therefore exhorts with entreaty those who are moderate and great-hearted and grounded in faith to take thought for these, bearing with them, so that they may be able to make progress; lest, if evil is repaid, they become worse. Therefore he exhorts that nothing other than the good is to be pursued, not only in the case of the brothers, but also in that of all. For by good works unbelievers can be drawn to belief, from which there may always be rejoicing in the Lord, that is, unto good. And one must pray without ceasing, for assiduous prayers move the mind of the judge to grant mercy. And in all good actions thanks are to be given to God, who has bestowed this teaching in Christ Jesus our Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
