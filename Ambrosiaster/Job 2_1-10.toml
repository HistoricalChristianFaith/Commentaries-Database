[[commentary]]
quote='''
And yet even greater things than these are said. For in these praises there were no proofs of tribulations, but only a purpose dedicated to God, established in exercise and observance. Since this did not appear to the tempter to be complete for the crown of merits, he asked that he might be allowed to test Job’s righteousness with various temptations, so that, pressed in many ways, he might somewhere be entangled and exceed due measure. For it is for this end that various punishments are usually inflicted on sinners: since no one can bear all forms of torment, one of them may wring from him a confession of the truth. Therefore the tempter was allowed to destroy and ruin all his possessions, even to the death of his sons: so that if he could bear the loss of his oxen, he might not bear that of his sheep; or if he could bear the loss of his sheep, he might not bear the loss of his camels, nor of his servants, nor of his entire substance; or if, because he was of great spirit and of pure devotion, he was not overcome by all these things, then at least he might be broken by the compelling affection of love through the immediate death of all his children. But because, before the written Law was given, he had the Law written in his heart, neither losses nor griefs made him any less devoted to God, so that he gave a pattern of loving God with all the heart above all things. How great, then, is the glory he deserves, who before the Law kept the Law, so that the Law that was to come might be shown in deeds, not words, as to how it should be observed, he being its author in action? And because the tempter is disrespectful, this glory did not seem sufficient to him for proving the righteous man, unless he manufactured something else against him which he knew could not be tolerated by a man; he asked again that he might strike Job himself with a cruel wound from the crown of his head to the nails of his feet. And when this was granted, since no trust should be placed in him, he was commanded to spare his soul for the sake of free will, and not to dare anything violent against him whom he could not overcome by right reason. Having received this power, and his cruelty raging anew within him, he struck the righteous man with a very great blow, so that there was nothing in his body that was free from injury, something no man could have endured except Job alone, who was able to conquer Satan. And when even so the hatred of the Devil could not draw from the righteous man any murmur against God, remembering his former cunning by which he deceived Adam, he strove to see if he could also deceive this man through a woman; for one is more easily deceived by someone of one’s own household. And in all these things Satan, utterly shameless, achieved nothing, indeed suffered loss: he not only found God’s servant immovable, but even his teacher. For in the very extremity of his necessity, Job not only persevered in the fear of God, but also, rebuking his wife who suggested the opposite, taught that all things which happen by God’s permission must be bravely endured (Job 2:1–10): which belongs to a double punishment of the foolish Satan, because he neither persuaded what he wished, and while envying this man, he made others learn what he did not even want this man to know. How much temptation profits the servants of God and harms the Devil we are more fully taught by this reading. For when he thinks he is harming them, he is advancing them; and when he persecutes one, he rouses many to virtue. Seeing this man protected by the helps of God, many become his imitators. Therefore, wishing to make a gain, he suffers loss. His rage is always ruinous to himself. For when he persecutes the righteous so that they may not be rewarded, he makes them more worthy; and when he envies Saint Job, he doubles his excellence in heaven and on earth; for here he is increased, and in heaven he is received with the Savior; so that all these things may contribute to the glory of the saints, and to the punishment of the Devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 118: ON JOB"
