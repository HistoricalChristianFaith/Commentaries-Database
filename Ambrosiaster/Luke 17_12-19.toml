[[commentary]]
quote='''
WHY IS IT THAT THE SAVIOR AT FIRST REFUSED MERCY TO THE FOREIGN WOMAN, THAT IS, THE CANAANITE (Matt. 15:22–28), WHEN HE DID NOT DENY THE GRACE OF GRANTING SALVATION TO THE FOREIGN CENTURION AND TO THE LEPER WHOM JESUS HIMSELF CALLED A FOREIGNER (Luke 7:2–10 and 17:12–19)? — The very reason itself shows that the Savior’s action was fitting. For it would have been absurd, and would have resulted in an insult to the promise made to the Fathers, if a woman who had not confessed the God of the Jews had received the benefit promised to the nation that confessed God. Therefore at the beginning it was denied to her. But when, with neck bent, she did not deny faith in the words of the Savior, but confessed that the believing Jews are children and the Gentiles are dogs or servants, by which she joined herself to the Lord’s faith; for servants point to a master, and a master does not exist without servants, a unity was formed between the subject and the one who subjects. Therefore it is that she deserved to obtain what she had prayed for. But the centurion, who received a favor from the Savior without delay, had already involved himself in the things of God. For the leading men of the Jews say to the Lord: “He is worthy that you should grant this to him; for he loves our nation, and he himself has built us a synagogue.” (Luke 7:4-5) As for the foreign leper, the Lord called him foreign not in respect of faith but of nation. For he was a Samaritan, who are known by origin to be from the Babylonians. Yet he too did not obtain the benefit without a confession. For it had been said by the Lord to the disciples: “Do not go into the way of the Gentiles, and do not enter into the cities of the Samaritans, but go rather to the lost sheep of the house of Israel” (Matt. 10:5–6); that is, that the Gospel should not be preached first to the Samaritans and the Gentiles, but to the Jews, to whom this promise had been made. But when the Jews began to reject faith in Christ, then the Savior also presented Himself to the Samaritan woman, and after the cross to the centurion Cornelius; and when sought by the Canaanite woman, He received her, because the time had not yet come for salvation to be offered to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 17: WHY THE SAVIOR AT FIRST REFUSED THE CANAANITE WOMAN"
