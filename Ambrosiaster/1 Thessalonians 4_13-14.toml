[[commentary]]
quote='''
But we do not want you to be ignorant, brothers, concerning those who sleep; that you may not be grieved, as the others also who have no hope. For if we believe that Jesus died and rose again, so also God will bring with him those who have slept through Jesus. The reasoning is plain: that if the resurrection of the dead is believed to be coming, those who depart with the sign of the cross are not to be mourned. But the unbelievers are truly to be mourned, who pass from here into Gehenna, so that they may learn that what they refused to believe is true. But the faithful will rise to glory, so that those who were held to be fools in the world on account of their faith may be seen to be wise; for they provided glory for themselves. These are the ones who, departing through Jesus, that is, under the hope of this faith, will be brought with him at his coming, so that they may be seen by men. Yet while he himself forbids the passing of one who has died to be mourned, he himself says elsewhere: Lest I should have sorrow (Phil. 2:27). But this has already been resolved in its place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
