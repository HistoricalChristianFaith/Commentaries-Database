[[commentary]]
quote='''
And will the brother who is weak perish in your knowledge, for whom Christ died? The weak man will perish if he eats of the things sacrificed against faith in the one God: these indeed are the words, as it were, of one who is angry and who shows what evil knowledge can bring forth if it has not been tempered by love. In your knowledge: that is, your skill kills him, when he sees done by you what he understands otherwise. And you will be the occasion of death to your brother, to redeem whom Christ allowed himself to be crucified. And so he teaches that knowledge must sometimes be disregarded for the sake of love; for without doubt the salvation of a brother is worth more than food: for it is lawful indeed, but it is not expedient. This will be to have known as one ought to know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
