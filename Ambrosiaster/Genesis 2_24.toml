[[commentary]]
quote='''
For this cause a man shall leave father and mother, and shall cleave to his wife, and they shall be two in one flesh (Gen. 2:24). To commend unity he gave an example of unity; so that, as man and woman are one by nature, so also Christ and the Church may be understood to be one by faith. This mystery is great, but I speak in Christ and in the Church. He signifies that the great sacrament of the mystery lies in the unity of man and woman. Yet this is not what he brings forward; rather, he calls for another cause, not at odds with the mystery mentioned, which he knows pertains to the progress of the human race, that is, to the Church and the Savior; so that, just as a man, having left his parents, cleaves to his wife, so also the Church, having left all error, may cleave and be subject to its head, which is Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
