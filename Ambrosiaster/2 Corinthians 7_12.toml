[[commentary]]
quote='''
Therefore, even if I wrote to you, it was not on account of him who acted wickedly. He calls him who acted wickedly the one who had committed incest; and he also touches those whom in the first letter he indicates had done injury and fraud to their brothers. Nor on account of him who was treated wickedly (1 Cor. 6:7). These were treated wickedly, because they suffered wrongs from their brothers. This is the sense he recalls at the head of the letter, where he says: If you have forgiven anyone anything, I too (2 Cor. 2:10). For he shows that he wrote that they ought to be forgiven not so much for the sake of those who had sinned as rather for the sake of the Church; because when one does evil there are many who are put to shame, and when one suffers insult or fraud there are many who are indignant; for if one member suffers anything, all the members suffer with it. But that our earnestness, which we have for you before God, might be made manifest. By amending the unjust, and sanctifying the polluted, and reconciling them to the Church, he shows that he has earnestness for the whole people, according to what I mentioned above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
