[[commentary]]
quote='''
So those who are of faith are blessed with faithful Abraham; for as many as are of the works of the Law are under a curse. It is manifest that the faithful are blessed with the faithful one, just as unbelievers are punished with unbelievers. For those who live under the Law are under a curse, because they are transgressors of the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
