[[commentary]]
quote='''
But if he has wronged you in anything, or is a debtor, charge this to me. Now he tears away the excuse of anger, lest perhaps Philemon should complain that he had been so wronged by him that he seemed by no means to deserve pardon. But if it were so, he says that it is to be charged to himself, through whom those who sinned before are to be heirs of the kingdom of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
