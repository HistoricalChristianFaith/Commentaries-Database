[[commentary]]
quote='''
But he must also have good testimony from those who are outside. Following the mind of the Lord, he says that the future bishop must have good testimony from outsiders; because whoever is faithful in the least things is so also in great ones, as the Lord says. And if you have not been faithful in another's mammon, who will give you what is your own? So that there may be no doubt that this man, who is found by no means faithful in worldly matters and in human conduct, will not be fit in divine things either; but if he has kept faith with men, much more will he with God. Lest he fall into reproach and the snare of the devil. If a bishop does not have the fear of God before his eyes, but rather accommodates himself to the times, God abandons him as an unbeliever and a false prophet, and he will appear disfigured and stained to all; because he does otherwise than he preaches, accusing himself by his own words, because he has been assigned to the flock of Satan; for he proves that he preaches true things only then, if he also tries to carry them out. Therefore he who receives the house of God to rule must be chosen with great care; for if fit stewards of earthly things are to be sought, how much more of heavenly ones!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
