[[commentary]]
quote='''
WHAT DOES THE BLESSING OF JACOB, WHICH HE GAVE TO HIS SONS (Gen. 48, 49), CONTAIN? — Jacob not only foretold, on the basis of present causes, the future of each tribe, but also, from future causes, future events whose shadow did not yet exist, and he signified these in the Jewish people. For he showed what the future character of each tribe would be in morals, faith, discipline, excess, immorality, and contempt of faith; so that, although they were from one and the same ancestor, they would not preserve unity. Some advanced for the better, others became worse, others remained as they were: so that they might not claim a privilege for themselves on account of their lineage, since it had been foretold by him that some of those who were certainly of his origin would turn out depraved, indeed that many would perish, in such wise that others were signified as coming in to take their place, who, to their shame and condemnation, would be grafted into the nature from which they had fallen. Therefore he declared that the people in all the tribes would be mixed: by this variety it was to be understood that the good would be few, and the evil many. And although he gave the scepter to his son Joseph for a time, he nevertheless set Judah over all. Not because all from Judah were going to be worthy, but because the Savior, who is truly King, was according to the flesh to arise from that tribe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 6: ON THE BLESSING OF JACOB"
