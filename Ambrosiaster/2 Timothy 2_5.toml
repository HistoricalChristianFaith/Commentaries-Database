[[commentary]]
quote='''
Even if someone contends, he is not crowned unless he has contended lawfully. He wants the soldier of God to be so well trained in the works of God, or in the office assigned to him, that he may be able to attain the merit of glory: watchful with his whole mind in divine services, despising the present things, loving the heavenly; for he has proved himself for this purpose, that, labouring here, he may be rewarded in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
