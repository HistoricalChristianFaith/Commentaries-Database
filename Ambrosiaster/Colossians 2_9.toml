[[commentary]]
quote='''
For all that the Father has, he gave to the Son, when he begot him bodily in the divinity of fullness; so that, since he himself is the head, and his creation is his body, whatever the heavenly creation is thought able to do, all this may be believed to be fully in Christ; so that no one may suppose that anyone else is to be worshipped. For whatever one has thought great in anyone, he will find more of it in him; because all have from him, as the members from the head: but he himself is always full.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
