[[commentary]]
quote='''
Epaphras, who is one of you, a slave of Christ, greets you. He makes the epistle dearer to them when he bears witness to one who is from among themselves. Always anxious for you in his prayers, that you may stand perfect and abundantly fulfilled in all the will of God. He testifies that he desires such salutary things for them, so as to show that the man who is their fellow citizen, and most dear in the affection of oneness of mind, is a sharer in his own devotion for their advancement.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
