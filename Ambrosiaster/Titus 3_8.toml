[[commentary]]
quote='''
A faithful saying: and concerning these things I wish you to affirm firmly, so that those who have believed God may be careful to accomplish good works. These things are good and useful to men. Nothing is so plain as that mercy and kindness are good for the present and useful for the future; for here it has praise, and on the day of judgment a crown. For everyone who believes God ought to be zealous for mercy, through which he lives. The ruler of the people, therefore, is admonished to be careful about these things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
