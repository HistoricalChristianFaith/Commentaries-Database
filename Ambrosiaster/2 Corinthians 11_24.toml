[[commentary]]
quote='''
From the Jews five times I received forty, less one. He says this because he was flogged five times by the Jews according to the law of Moses, receiving thirty-nine stripes, as is written in Deuteronomy (Deut. 25:3). What was done on five occasions, then, he here reports in sum.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
