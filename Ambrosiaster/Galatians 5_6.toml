[[commentary]]
quote='''
And thus neither uncircumcision avails anything, nor circumcision: but faith alone is needed, in love, for justification; for faith must be fortified by brotherly love, so that the believer may have perfection. Accordingly, the Savior answered the scribe who asked what the first commandment was: You shall love the Lord your God with your whole heart and with your whole soul: and your neighbor as yourself. On these, he says, two commandments hangs the whole Law, and the prophets (Matt. 22:37 ff.). So the other things are imperfect, since perfection is contained in these two commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
