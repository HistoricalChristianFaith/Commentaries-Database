[[commentary]]
quote='''
If, then, you have secular judgments, appoint those who are contemptible in the Church to judge. Secular judgments are those that pertain to the body, or bodily ones. And because it ought not to be done so, he added: I say this to your shame. He says this lest, because above he named a "matter" but did not indicate of what kind, it be misunderstood; for there are also divine matters, as the same Apostle says: helper of my business (Rom. 16:2). And he says "secular judgments" perhaps because, since he had forbidden them to be conducted before the faithless, they thought that, though in the Church, as they had heard, they might nevertheless be heard or settled by anyone whatever; to make them blush he says: Appoint those who are contemptible in the Church to judge. For there are wooden vessels too in the Church; for he indicated that they were so intractable and thoughtless that they would perhaps choose unskilled men from among the brethren as judges. This the Apostle says from experience; for he knew how lukewarm and improvident they had been found to be in other matters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
