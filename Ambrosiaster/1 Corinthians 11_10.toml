[[commentary]]
quote='''
For the man is not from the woman, but the woman from the man: for indeed the man was not created for the sake of the woman, but the woman for the sake of the man. Therefore the woman ought to have power over her head, also because of the angels. By "power" he meant the veil; by "angels" he means bishops, as is taught in the Apocalypse of John (Rev. 2:1 ff.). And because they are, of course, men, they are rebuked for not correcting the people, and what is right in them is praised. The woman, therefore (Gratian, Decretum C. 33, q. 5, c. Mulier), ought for this reason to veil her head: because she is not the image of God, but so that she may be shown to be subject. And because transgression began through her, she ought to have this sign, so that in church, out of reverence for the bishop, she may not have her head free, but covered with a veil; nor may she have the power of speaking, because the bishop bears the person of Christ. As before a judge, then, so before the bishop, since he is the vicar of the Lord, she ought to be seen to be subject, on account of the origin of guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
