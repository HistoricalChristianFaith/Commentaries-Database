[[commentary]]
quote='''
But you, man of God, flee these things. He exhorts and commands the man of God to cut himself off from this, so that he may both be secure here and be rewarded in the future with divine prizes. For not undeservedly is he to be crowned who spurns this thing, which persuades many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"

[[commentary]]
quote='''
But pursue righteousness, godliness, faith, love, patience, tranquillity of mind. Contend in the good contest of faith, lay hold of eternal life, to which you were also called, and you have confessed the good confession before many witnesses. Since avarice is an iniquitous thing, he bids the man of God, so as to keep apart from it, to pursue righteousness and godliness and the other things he mentions; for he will not be able to avoid it unless he cleaves to these things, which are opposed to avarice. But how can it be that an avaricious man is faithful, who denies by his works what he seems to confess with words? And how can he be a lover of the brotherhood whose hands are dry? And how patient, who always reaches out after what belongs to others? Or how far can he have quiet of mind, who day and night is inflamed with the greed of covetousness?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
