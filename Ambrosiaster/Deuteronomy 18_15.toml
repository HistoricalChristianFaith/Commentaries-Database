[[commentary]]
quote='''
For this is the one Son of God, the head of every principality and beginning, whose Gospel has been preached in the whole world, beginning from Moses, who said to the Jews: The Lord your God will raise up for you a Prophet from your brothers, like me. Him you shall hear; for it shall be that whoever does not hear that prophet shall be rooted out from the people (Deut. 18:15–16). Hence the Lord says to the Jews: Moses wrote of me (John 5:46). Therefore this one alone is to be heard and worshipped, and no one is to be reckoned alongside him; because he who holds the head has the remaining part subject to him. For whoever humbles himself to things that are subject is wholly in error; because, not holding the head, from which the whole body is held together for life, he is a mere trunk.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
