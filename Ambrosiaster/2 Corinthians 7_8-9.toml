[[commentary]]
quote='''
And if I did regret it, I see that that letter, even if it grieved you for an hour, now I rejoice. He says this: for if I did regret it, he says, on account of love, because I grieved you, the consolation of joy would follow, because it was profitable that I grieved you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
