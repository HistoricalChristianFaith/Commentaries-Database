[[commentary]]
quote='''
Otherwise what will they do who are baptized for the dead, if the dead do not rise at all? Why are they also baptized for them? So firmly does he wish to show the resurrection of the dead to be ratified and stable that he gives the example of those who were so secure about the future resurrection that they were even baptized for the dead, if death had perhaps overtaken someone: fearing lest one who had not been baptized should rise either badly or not at all, a living person was dipped in the name of the dead. Hence he added: Why are they also baptized for them? By this example he does not approve their deed, but shows their fixed faith in the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
