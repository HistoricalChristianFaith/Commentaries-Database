[[commentary]]
quote='''
What is it that the Apostle says to the Galatians: “I am amazed that you are so quickly deserting him who called you in grace, for another gospel, which is not another” (Gal. 1:6–7)? If it is “another,” surely it is not the same; if it is not the same, how is it not “another”? — Therefore he calls it “another gospel” in relation to the gospel to which they had been called, because it is not the one that the Galatians later began to follow. For, led away from the Gospel of Christ, they had been drawn into Judaism under the name of Christ, as though that were what should be followed; and they affirmed something different from what the Apostle preached. Therefore the phrase is understood, “As they persuade you.” For false apostles, when they were deceiving the believing Gentiles, claimed that what they themselves taught had been handed down by the Savior, as is contained in the Acts of the Apostles: “Unless you are circumcised according to the custom of Moses, you cannot be saved” (Acts 15:1). Moved by grief at their downfall, the Apostle writes to them, saying: “I am amazed that you are so quickly deserting him who called you in grace, for another gospel, which is not another.” (Gal. 1:6-7) He is amazed because, after something light and less burdensome, they were striving after harshness and burden: that is, that after the simplicity of faith they allowed themselves to be circumcised for the sake of the elements, that they observed new moons and the sabbath; they were subjected and driven by the elements, that is, to grace, not to the works of the Law. And lest he seem to have given the false apostles an opening, by allowing them to say that what the Galatians had received was different from what the tradition of truth holds, he immediately adds: “Which is not another, except that there are some who trouble you and want to distort the gospel of Christ.” (Gal. 1:7) So, the gospel to which they had been called by the Apostle was different from what they began to follow under the influence of the false apostles; yet it was not different from what Christ had handed down, so that by this they might recognize that they had been led into error, and follow faith alone, confessing Christ as God and that he is sufficient to grant salvation, through whom they had obtained the remission of sins, and not through the Law: for without the Law, the grace of God forgives sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 10: ON GALATIANS 1:6-7 (\"ANOTHER GOSPEL, WHICH IS NOT ANOTHER\")"
