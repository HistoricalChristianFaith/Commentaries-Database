[[commentary]]
quote='''
This precept I commend to you, son Timothy, according to the prophecies that went before concerning you, that by them you may wage the good warfare, having faith and a pure conscience, which some, thrusting it away, have made shipwreck concerning the faith: among whom are Hymenaeus and Alexander, whom I have handed over to Satan, that they may learn not to blaspheme. After he has recalled what and how great are the benefits of God the Father and of Christ his Son towards sinful men, whom, though they deserved to be punished, he not only pardoned but also justified and adopted as sons for himself, he shows in what follows in what order he should imbue the people with ecclesiastical discipline, admonishing holy Timothy, mindful of his election, to fulfil that to which he was predestined. For he was predestined when he was taken up by the Apostle for this, to be ordained, judged worthy to be a future bishop, that he might fulfil the warfare of the Gospel in faith and a pure conscience; for he who teaches faithfully cannot have a bad conscience. For he displays the faith of his preaching then, if he abstains from all things contrary to it; because by the example of good works he provokes many to belief, trusting in the hope of the preaching; for he who spurns faith is without doubt of a bad conscience. For he is proclaimed either a hypocrite or an open blasphemer, as were Hymenaeus and Alexander, who, deserting the faith, became shipwrecked, that is, stripped of the truth, or deprived of life. For what is truth, if not life?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
