[[commentary]]
quote='''
For of him you are in Christ Jesus. Of him, that is, it is of God, who is almighty, that we are in the faith of Christ; for it is the purpose of God that we should learn his truth and mercy through Christ. The truth is the mystery of the Trinity; and the mercy, that when we were captives, he redeemed us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"

[[commentary]]
quote='''
Who was made wisdom for us from God, and righteousness, and sanctification, and redemption. For the confirmation of believers he says that Christ did by the will of God what he did; so that we may know that we have truly learned wisdom, and have been sanctified, and justified, and redeemed by God through Christ; for no one redeems except what had been his own. Whether, then, that we have been redeemed, or that we have been sanctified, that is, cleansed from the work of the flesh and the uncleanness of idols, or that we have been justified (for it is righteous to worship the Creator, the rest being spurned), or that we are wise through the fact that we have learned that the worldly are ignorant, all this is the benefit of God through Christ. This, however, is our redemption: for Christ offered himself to the devil, who desired him, so that he might take away the contradiction of sin in himself, and so rescue his captives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
