[[commentary]]
quote='''
And what do you sow? You do not sow the body that is to be, but a bare grain, of wheat, say, or of some one of the others: but God gives it a body as he wills, and to each of the seeds its own body. If, then, a bare grain is sown, and by God's will, in a certain way through the ministry of the elements, rises clothed, having with it many increases for human use, why should it not be credible that by God's power a dead man can rise, with his substance only improved, not multiplied in number? Why, then, does the unbeliever ask with what body the dead rise, when examples go before to lead to this faith in a resurrection that is improved, not one of lost substance? For he will receive his own body, in which Adam was created, according to the examples mentioned above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
