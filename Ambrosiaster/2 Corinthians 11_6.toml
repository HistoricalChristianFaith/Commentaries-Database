[[commentary]]
quote='''
But even if I am unskilled in speech, yet not in knowledge. This does not pertain to the apostles, because they were not eloquent, being as they were without letters, yet full of the Holy Spirit; but he touches those whom the Corinthians preferred on account of their polished speech; whereas in religion what is needed is the force of speech, not a sweet sound. How, though, does he humble himself so as to say that he is unskilled in speech? And where is that which Festus says: Paul, he says, Paul, much learning makes you senseless (Acts 26:24)? In saying this, then, he did not wish to be understood as not knowing how to speak, but he said it on account of those who wished to be commended not through faith but through eloquence. And yet he called himself unskilled in that which carries no guilt; but in that which acquires salvation, and ignorance of which is not without guilt, he did not declare himself unskilled; because he who is unskilled in speech is not guilty before God, but he who does not have the knowledge of God is guilty of ignorance; for it is not permitted to be ignorant, above all of what pertains to salvation. Therefore the Apostle, despising eloquence, aimed at this, that faith should be acceptable with power as its witness; so that it would not be eloquence that commended faith, but power, to which eloquence yields. But in all things I am manifest to you. He says that he is manifest to the Corinthians in all things; because they were not unaware that he also had skill in speaking, and, knowing this, they favored others in a matter in which they did not know him to be inferior: and therefore he speaks with feeling, because this was worse: that though they knew him to be lacking in nothing, they abased him beneath the others, when they had seen through him not only the preaching fulfilled, but also apostolic signs and wonders done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
