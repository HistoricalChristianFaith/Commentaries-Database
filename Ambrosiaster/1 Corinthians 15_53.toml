[[commentary]]
quote='''
For this corruptible must put on incorruption, and this mortal put on immortality. Above he said, and the dead will rise incorrupt, that is, they will be immortal, yet not impassible; for those of whom he speaks will suffer punishments according to the qualities of their offenses, so that they go out from there when the debt has been paid: but the ungodly are tormented with eternal punishment; for he says: He who does not believe is already judged (John 3:18). Hence Isaiah the prophet also says: Their fire will not be quenched, and their worm will not die (Isa. 66:24). At the coming of the Lord, however, both the saints will rise, and those who are found alive will be caught up to meet the Lord in the air, undergoing death as if it were sleep; for in the very catching up they will have both death and resurrection, as the same Apostle writes to the Thessalonians (1 Thess. 4:16 ff.). For in the time of the Antichrist men will be either apostates, or guilty, or in hiding places, or placed in punishment; the rest are Gentiles, whom the Lord Jesus, together with their leader the Antichrist, will slay at his coming with the spirit of his mouth (2 Thess. 2:8), that is, at his command they will be burned up with fire by the angels of his power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
