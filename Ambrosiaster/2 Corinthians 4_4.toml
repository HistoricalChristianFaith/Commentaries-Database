[[commentary]]
quote='''
In whom the God of this world has blinded the minds of unbelievers, so that they do not see clearly the light of the Gospel of the majesty of Christ, who is the image of God. He says that God blinds the minds of worldly men, because they are ill-disposed toward faith in Christ, so that they do not see the truth of the Gospel of the majesty of Christ. He grants them, then, what they want. For because they are ill-willed men, and, though they understand the truth, say that it is false, they are helped in that very thing, so that they cannot believe what they do not want to. But Christ, though he is the image of God, they assert to be bodily only: and, leaving aside his deeds, they make mention of the flesh alone; of them Isaiah said: He has blinded their eyes, so that they may not see; and their ears, so that they may not hear, up to this very day (Isa. 6:10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
