[[commentary]]
quote='''
Hence he says to Philip: Philip, whoever sees me sees the Father also. How do you say, "Show us the Father"? Do you not believe that I am in the Father, and the Father is in me (John 14:9)? This is the unity and substantiality of Father and Son, that they are in one another; so that whoever sees the Son sees the Father also. Now let us see how the Son was seen, so that we may accordingly understand in what way Philip, by seeing the Son, sees the Father also. Certainly it was by understanding the divine works that they saw the Son, not with fleshly eyes. What the Son worked he said was the Father's, to show the unity of power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
