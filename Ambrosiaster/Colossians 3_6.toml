[[commentary]]
quote='''
On account of which the wrath of God comes. He says that because of the evils mentioned the judgment of God will come, so that vengeance may be taken on those who, despising God and his Law, preferred to follow what is forbidden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
