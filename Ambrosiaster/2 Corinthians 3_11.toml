[[commentary]]
quote='''
For if what is done away was in glory, much more what remains is in glory. He does not deny that there was glory in the law, or in the face of Moses, but it did not remain; because in Moses it was something yet to come, not the truth. Therefore, when the Savior came, the figure ceased; because the truth appeared, remaining forever; so that as great as the difference is between image and truth, so great is the difference between the glory of the face of Moses and the glory of Christ. Therefore he said above: Because of the surpassing glory. For that glory was as great as was fit to be entrusted to a servant: but this one is as great as is that of his Begetter; because the Lord Jesus Christ is in the glory of God the Father (Phil. 2:11). For just as in the evening the stars are glorious, but when the sun rises their brightness is done away; so too the glory of Moses is done away when the glory of Christ appears.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
