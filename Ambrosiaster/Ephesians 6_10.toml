[[commentary]]
quote='''
For the rest, brethren, be strengthened in the Lord, and in the might of his power. After all his admonitions and exhortations, after the order of discipline devoutly handed down and the plan of the mystery made manifest, he wants them to be strong in faith through confidence in the power of God; so that, knowing that the hope of the promise is firm, they may be ready in the service of God, holding the helm upright against the waves stirred up by the recklessness of the enemy. For he stirs up a storm against the servants of God, but it is he himself who suffers shipwreck.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
