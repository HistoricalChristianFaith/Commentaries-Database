[[commentary]]
quote='''
Sufficient, therefore, nay overflowing, for salvation is the righteousness which is from faith, not from the Law, which has been granted by the grace of God from the knowledge of Christ. For the knowledge of the mystery of his incarnation, and passion, and resurrection is the perfection of life and the treasure of wisdom; for where there is wisdom, there is also life, because there is no life where there is folly. Thus Solomon: The fool, he says, does evil through laughter (Prov. 10:23). For he who understands that Christ was made man and suffered for his sake, and, having conquered death, rose again, despises and spurns all things and follows him by whose protection he sees himself freed from death, seeking occasions to deserve well of him, so that he may be able to make him some return in at least something, and so deserve to obtain still greater promises in the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
