[[commentary]]
quote='''
For you indeed give thanks well. He says this of the one who speaks things known to himself, because he knows what he is saying. But the other is not edified. If indeed you come together to edify the Church, those things ought to be said which the hearers understand. For what does it profit that someone should speak in a tongue which he alone knows, so that he who hears profits nothing? Therefore he ought to be silent in the Church, so that those may speak who profit the hearers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
