[[commentary]]
quote='''
Thus he added: For neither, he says, has God given us a spirit of fear, but of power. For the renewed man goes out of fear, receiving a spirit of gladness because of justification; for every unrighteous man is in fear: not strong but weak; not in love but in hatred; not in sobriety of mind, but wounded by error. But if he is rid of these, through faith he will be strong, and beloved, and sober.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
