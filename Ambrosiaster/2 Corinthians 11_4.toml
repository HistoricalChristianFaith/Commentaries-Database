[[commentary]]
quote='''
For if he who comes preaches another Christ, whom we did not preach; or you receive another Spirit, whom you did not receive; or another Gospel, which you did not accept, you would rightly bear it. Why does he say, You would rightly bear it, if another Christ had been preached to you, or if another Spirit or another Gospel had been delivered to you, when he says to the Galatians: If anyone announces to you anything besides what you have received, let him be anathema (Gal. 1:9)? If it was perverse for the Galatians to receive anything other than what had been handed down by the apostles, how was it right for the Corinthians if another Christ had been preached to them? But the Apostle, knowing that no other Christ is ever preached than this one who was crucified, therefore says: You would rightly bear it, if another, greater Christ had been preached to you by those who come. To the Galatians, however, he pronounced anathema if they heard anything else, which would surely not be greater, but contrary. Furthermore, he says, if the same Christ is preached by them who is announced by us, and this same Gospel, what reason is there that we should be held inferior, when nothing more is learned from them? Above he speaks of the false apostles, corrupters of the faith, but in this place of true preachers; because the people of the Corinthians were tossed about by various errors, so that some favored the false apostles, some those from whom they heard, in polished words, the same things they had heard from the Apostle; while others favored the apostles, because they had been with the Lord, disparaging their own apostle Paul, because he had not seen the Lord in the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
