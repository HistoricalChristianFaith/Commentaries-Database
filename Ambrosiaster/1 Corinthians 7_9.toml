[[commentary]]
quote='''
But if they do not contain themselves, let them marry. In this matter he wants them to strive, so as to be continent. But if they see that, because of the impulse of the flesh, they cannot persevere, because they are not very ready in this very thing so as to be helped by God (for God helps him whom he sees striving with all his strength), let them by all means marry, if they fear to burn. For perhaps they will be able to attain this afterwards; for once the hindrance has been worked off, the will restores itself with sturdier strength.

For it is better to marry than to burn. He did not say: For it is better to marry than to burn, as though it were good to burn, and therefore to marry were better: but he followed common usage. For we are accustomed to say: It is better to make a profit than a loss. To burn, however, is to be driven or overcome by desires; for when the will consents to the heat of the flesh, it burns: for to suffer desires and not be overcome is the mark of an illustrious and perfect man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
