[[commentary]]
quote='''
He warns, therefore, that all things that are said are to be tested, and whatever has been said soberly and well is to be retained. For whatever agrees with the sayings of the apostles and of the Lord himself is to be held as well said and retained; but one must abstain from the things that seem hostile to the faith. For the spirit of the world is accustomed deceitfully, as if by imitation, to speak good things, and to slip perverse things in among them, so that through the things which are good the evil may also be credited; so that, because they are thought to be the sayings of one spirit, they may not be distinguished from one another, but through what is lawful the unlawful may be commended by the authority of a name, not by the reason of virtue. For they are accustomed, under the name of the apostles and of the Lord himself, to teach unspeakable and contrary things; and therefore he warns that all things are to be tested, because the utterances of the Lord cannot be at variance with one another. Hence it is that the epistle of the apostle John too: Do not, he says, believe every spirit, but test the spirits, whether they are from God (1 John 4:1), because if it says many good things, but in some point puts forth what is contrary to the faith, let it be known that it is not the Holy Spirit. For nothing of error can be found in the Holy Spirit. But through the exercise of speech some things are spiritual, and some carnal, because all error is assigned to the flesh; or else by a certain contrivance of cunning it feigns good things, so as to insert evil things among them, as I recalled above: just as in Montanus, and Priscilla, and Maximilla, the prophets of the Cataphrygians, the spirit of the world feigned the good by a certain imitation, so that through many things that were plausible, and true as well, it might lie that it was the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
