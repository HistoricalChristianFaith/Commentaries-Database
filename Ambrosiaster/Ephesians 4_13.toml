[[commentary]]
quote='''
Until we all meet in the unity of faith and of the knowledge of the Son of God. He says that the ordering remains for as long as it takes for all who are destined to life to be of one faith in the knowledge of Christ. Unto a perfect man, unto the measure of the age of the fullness of Christ. He exhorts them to labor so that the perfection of faith may be grasped: and its principle is this, that faith hold Christ as perfect and full God, and not measure him by a human measure, but hold him as perfect God in the fullness of divinity. For in saying "perfect" he does not signify a man of temporal age and measure: but by this saying he wishes us to become perfect in the fullness of understanding of the divinity of the Son of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
