[[commentary]]
quote='''
Put to death your members which are upon the earth: fornication, uncleanness, lust, evil desire, and avarice, which is the servitude of idols. Since in the epistle to the Romans he signifies that all sins together are a body (Rom. 6:6), therefore now, describing the offences one by one, he calls them members; so that, having received and kept the gospel account of the Savior's fullness, they might give themselves to a good life, abstaining from all baseness and evil desire, so that they may not lose the fruit of divine knowledge. For it does great harm to know the account of the truth and to affirm it while one's deeds in no way follow it. Hence it is that the Lord too says, among other things: But he who knows the will of his lord and does not obey him will be beaten with many stripes (Luke 12:47). Yet he compared avarice to idolatry, to show that nothing is more wicked than it. Under one name he designated two most evil and impious kinds, which he warns must be fled by every means; for idolatry is the first and a very grave crime. For what is so pernicious and so deadly as, to the injury of God the creator, to bestow the name of his honor upon wood and stones or other metals, when men themselves do not suffer a slave to be called by the name of his master, a slave whom not nature, surely, but a certain condition subjects to servitude? On the other side is the crime of avarice, not unlike in wickedness, but different in name. Hence he says to Timothy: For the root of all evils is avarice (1 Tim. 6:10); for it is capable of all offences in order to fill the desire of its greed, which is impossible, always drinking and always thirsting. Not without reason, then, does he show both evils under one name; for they are accomplished almost by one work: because, just as idolatry strives to take glory away from the one God, so that he may not alone have what is peculiarly his, the name of divinity befitting him alone, so also avarice stretches itself out over the things of God, so that, if it can be done, one man alone may usurp for himself God's creation, which God made common to all. Hence God says through the prophet: Mine is the gold, and mine is the silver (Hag. 2:9). Both, therefore, are hostile to God; for both deny to God the things that are his.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
