[[commentary]]
quote='''
For the rest, brothers, whatever things are true, whatever magnificent, whatever just, whatever holy, whatever lovable, whatever praiseworthy, if any virtue, if any praise of discipline: think on these things. The things which you have both learned and received, and heard and seen in me, do these, and the God of peace will be with you. In conclusion he sets out the things that remained, for the imitation of perfection, so that, both thinking and doing the things which not only do not fall under blame but are even worthy of praise, and following the pattern of the Apostle, they may have the God of peace with them. Our God is truly the God of peace, who exhorts to peace unasked, as one mighty, and not out of fear, as one weak, so far as even to forgive the sins committed against him; though he could certainly, by the terror of his power made manifest and of his ineffable greatness, compel even the unwilling, not to peace, but to subjection. But peace of that kind belongs to the world, not to God, whose very nature is peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
