[[commentary]]
quote='''
Let your women be silent in the church. Now he hands down what he had passed over; for above he commanded women to be veiled in the church; now he shows that they should be quiet and modest, so that it may be worthwhile that they are veiled (1 Cor. 11:5). For if man is the image of God, not woman, and she is subject to the man by the law of nature, how much more ought they to be subject in the church, out of reverence for him who is the envoy of the one who is also the head of the man! For it is not permitted to them to speak, but to be in silence, as the Law also says. What does the Law say? Your turning shall be to your husband, and he shall have dominion over you. (Gen. 3:16). This is a special law; hence Sarah called Abraham her husband lord; and for this reason they are ordered to be in silence, lest the sentence of the law mentioned above be weakened, mindful of which Sarah was subject to her husband, as has been said (Gen. 2:24). Although she is one flesh, yet she is ordered to be subject for two reasons: because she is both from the man, and through her sin entered in.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
