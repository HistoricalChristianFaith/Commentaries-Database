[[commentary]]
quote='''
Make room for us. We have harmed no one, we have burdened no one, we have overreached no one. He wants them to consider what he says, so that, having taken these things into their mind, they may weigh within themselves that what he speaks is true; and, spurning those at whom he touches, may transfer their whole mind to those whom they see love them with true affection. For it was the false apostles who both harmed them, corrupting their understanding, and burdened their purses by the overreaching of a serpent's cunning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
