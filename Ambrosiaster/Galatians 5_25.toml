[[commentary]]
quote='''
If we live by the spirit, let us also walk by the spirit. Let us not be pursuers of empty glory, provoking one another, envying one another. He says this because, if we live well and honorably, we ought also to have good morals; for this is to live by the spirit, to have an undefiled life: and thus we walk by the spirit if we are zealous for peace; for this begets love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
