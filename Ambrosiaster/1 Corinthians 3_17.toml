[[commentary]]
quote='''
If anyone violates the temple of God, God will destroy him; for the temple of God is holy, which you are. He set these things down beforehand for this reason, to prick the consciences of those who, living shamefully, had corrupted their bodies by violating them; above all him who had his father's wife; so that he would be guilty before his case burst out into the open. Finally, in a similar, indeed in the same way, when he judges his case, he speaks, saying: Or do you not know that your bodies are the temple of the Holy Spirit, who is in you, whom you have from God (1 Cor. 6:19). Above he said the temple of God; but in this place, the temple of the Holy Spirit. Who here could doubt that he signified the Holy Spirit to be God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
