[[commentary]]
quote='''
Behold, this third time I am ready to come to you, and I will not burden you. Lest it perhaps be thought that he had done this at the beginning to commend himself, but afterwards wished to accept a reward for preaching the Gospel, he shows that he persists in that resolve, lest he seem afterwards to correct what he had done, and there be something for his detractors to find fault with. For I do not seek what is yours, but you. He shows that he is unwilling to accept from them for this reason, that he might win them themselves, so that, understanding that he puts them before money, they might at last recognize his affection toward them. For children ought not to lay up treasure for parents, but parents for children. He indicates that he is their father, as he says in the first letter: Through the Gospel I begot you (1 Cor. 4:15). Yet it is carnal parents who lay up treasure for their children; for spiritual parents it is fitting to receive support from their children to sustain the present life. For it is no great thing that those who hand on spiritual things should obtain carnal things. But here he proves so far that he is unwilling to accept, that he transfers the case of the carnal father to the spiritual one; so that not only does he not accept from them, but, if it can be done, he even gives to them himself, as I have already said above: I despoiled other churches, taking wages for your ministry (2 Cor. 11:8). By saying this he touches them, so that they may understand how great he is and what those deserve who neglected the providence of so great an apostle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
