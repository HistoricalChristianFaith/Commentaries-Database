[[commentary]]
quote='''
Therefore I take pleasure in weaknesses, in insults; for when I am weak, then I am powerful. It is true that the Christian conquers then when he is thought to lose, and faithlessness loses then when it congratulates itself on having conquered. So he applauds when he is insulted, and rises when he is pressed down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
