[[commentary]]
quote='''
Your persuasion is not from God, who calls you. It is true, for the Jews were doing these things by human counsel, to put them under the yoke of the Law: not by the judgment of God, who was calling them through his Apostle to grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
