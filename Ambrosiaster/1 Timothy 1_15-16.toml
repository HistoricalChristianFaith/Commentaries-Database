[[commentary]]
quote='''
Though before the Apostle many of the Jews had certainly believed, of those who killed the Lord himself, yet the Apostle, to humble himself, still grieving over his unbelief, calls himself the first of all sinners. For since beyond the others he steeped himself in the mystery of the Savior, coming nearer to knowing his magnificence, he accuses himself the more, as one who recognized so great a good late, and not of his own accord, but forestalled by his mercy, so that he himself should be a witness to the divinity of him whom before he reckoned a dead man. This is his accusation of himself, but the praise of the Savior, who, for an example to the other believers, called his persecutor to grace; so that through his patience and magnanimity in him he, who had shown himself so benevolent to an enemy, might show the others what he would be to those who run to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
