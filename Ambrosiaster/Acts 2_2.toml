[[commentary]]
quote='''
And in the Acts of the Apostles we read in the same way: “And suddenly there came a sound from heaven as of a mighty rushing wind, and it filled the whole house” (Acts 2:2), etc. Behold, clearly by the example of the wind he indicates that the Holy Spirit therefore came from heaven and made a sound, just as a strong wind upon the earth. For Jeremiah also calls the wind “spirit,” saying, “The wind blows in every region.” Because it is in this world and is carried about through various places, we do not know where it comes or where it goes. But the Holy Spirit comes from heaven, as we read, to enlighten believers. [This is offered in exposition of the Savior’s words to Nicodemus, “The Spirit blows where it wills, and you hear its sound, but you do not know where it comes or where it goes” (John 3:8): just as the sound of the wind is heard but not seen, so also the coming of the Holy Spirit is announced and heard, yet the manner in which it works is not seen.]
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 59: ON THE EARTHLY AND HEAVENLY THINGS SPOKEN TO NICODEMUS"

[[commentary]]
quote='''
We do know, however, that the Holy Spirit came from heaven, so that he might pour himself into believers, as we read that it happened to the Apostles at the beginning, and that the sound was then called a voice. For it is therefore written, “And suddenly there came a sound from heaven as of a mighty rushing spirit.” (Acts 2:2) This sound he calls a “voice” in the passage in question. By the example of the spirit, that is, the wind, he shows the works of the Holy Spirit, so that the saying of the Savior might stand. For what else is it when he says, “And there came a sound from heaven as of a mighty rushing spirit”? Therefore indeed he said that the Holy Spirit descended and sounded like a mighty wind. This, then, is the spirit he gave as an example. Finally he says, “So is everyone who is born again.” And as for this one, we do not know where he comes; but the Holy Spirit came from heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 16: ON EARTHLY AND HEAVENLY THINGS SPOKEN TO NICODEMUS"
