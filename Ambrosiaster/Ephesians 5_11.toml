[[commentary]]
quote='''
And do not share in the unfruitful works of darkness. He warns that we should not be polluted by the deeds of the wicked through consent; for they are unfruitful toward good, and profitable for evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
