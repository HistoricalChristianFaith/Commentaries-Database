[[commentary]]
quote='''
This therefore I say and testify in the Lord, that you do not walk as the Gentiles also walk in the vanity of their mind, darkened in understanding, alienated from the faith of God through the ignorance which is in them. The Creator having been made manifest, and the reasoning shown which creation ought to follow, in the faith of its God alone, he solemnly charges them before God that they go and think no otherwise than they are taught; lest they be found like the Gentiles, who receive neither the faith nor the way of life which the Law commands, having their understanding darkened, so that they do not contemplate the truth of the divine name. For, following vain things, which are idolatry, they are bridled by the devil, lest they walk the way of the one God, so that he may make them companions of his own perdition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
