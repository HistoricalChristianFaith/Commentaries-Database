[[commentary]]
quote='''
Such things as happened to me at Antioch, at Iconium and at Lystra, such persecutions as I endured: and out of them all the Lord delivered me. But all who wish to live godly lives in Christ Jesus will suffer persecution. But wicked men and deceivers will advance into worse: themselves straying, and entangling others in errors. He recalls what and how great things he suffered for this reason: to show the help of God, by which he defends his servants and keeps them safe from the impudence of Satan; so as to make them secure and raise them up, lest they fear what can be inflicted by the faithless, but that they may be eager in persecution, certain that all who conduct themselves rightly in Christ are held in hatred even by the members of their own body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
