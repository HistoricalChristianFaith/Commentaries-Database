[[commentary]]
quote='''
The aged women in like manner, in a bearing worthy of religion, not slanderers, not enslaved to much wine, teaching good things; that they may train the young women to love their husbands, to love their children, to be prudent, modest, chaste, having care of the house, subject to their own husbands: that the word of God be not blasphemed. He commands the older women to be such that they may be an example of good conduct to the younger; so that, if they have unbelieving husbands, these may rather rejoice with them than blaspheme the name of God, when they see that for the fear of God they obey their husbands more readily.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
