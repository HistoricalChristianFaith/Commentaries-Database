[[commentary]]
quote='''
And when this epistle has been read among you, see that it is read also in the church of the Laodiceans, and that you read the one which is the Laodiceans'. Because the instructions of the Apostle are general, and his epistles were written for the advancement of all the Churches, therefore he commands that this epistle be read to the Laodiceans too, so that through it they might learn what they had to do; and that the Colossians should read theirs, in accordance with the sense stated above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
