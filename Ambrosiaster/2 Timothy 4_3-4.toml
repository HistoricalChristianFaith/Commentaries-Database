[[commentary]]
quote='''
For the time will come when they will not endure sound teaching; but according to their own desires they will heap up teachers for themselves, itching in their ears: and they will indeed turn their hearing away from the truth, but will be turned to fables. This too, in like manner, is a prophecy of the holy Apostle, who, foreknowing things to come, earnestly commands that one be insistent in teaching; so that, formed in faith and good works and instructed in sound discipline, they may remain strong, so that in the last time, when certain people have begun to be turned from the truth to error, they may persevere unmoved. For he says that there will be such as wish to be taught according to their own desires; so that from steadfast and truthful teachers they turn to those who teach them the things they gladly hear; because the truth will seem harsh to them, so that, having abandoned their own teaching, they give their time to fables. For they do not want their wicked works to be reproved: therefore they want such teachers as will serve their habits; for their ears itch to hear fables of vanities composed under the name of teaching, in which they may take delight. This is proper to none so much as to the Manichaeans, who have I know not what various fictions called by inflated names, though they are frivolous things and a kind of ravings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
