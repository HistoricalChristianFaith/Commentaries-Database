[[commentary]]
quote='''
But we ought always to give thanks to God for you, brothers beloved by the Lord, because God has taken you up from the beginning unto salvation, in sanctification of the spirit and faith of the truth, to which he called you through our Gospel, for the acquiring of the glory of our Lord Jesus Christ. In this place the foreknowledge of God resounds, because he knows the minds of all before their birth; for it is not hidden from him who are going to believe. Therefore he knows from the beginning that those will be faithful who, believing, bring increase to the faith, not loss; for, sanctified through the faith of the truth of the Gospel of the Son of God, they are acquired for the increase of the glory of the body of Christ, as he says in another epistle too: that all things, he says, may grow unto the increase of God (Col. 2:19). For whoever, having deserted the devil, take refuge in the faith of Christ bring increase to God in the body of Christ, though before they had brought loss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
