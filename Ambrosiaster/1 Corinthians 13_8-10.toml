[[commentary]]
quote='''
Whether prophecies will be made void, or tongues will cease, or knowledge will be made void. For we know in part, and we prophesy in part: but when that which is perfect has come, those things which are in part will be made void. He said that all the gifts of grace are made void, because they cannot comprehend as much as the truth itself contains. Nor can we either grasp or tell out the fullness of the truth. For how can it be that a human tongue should embrace all that is God's? Therefore it is our imperfection that will be destroyed; that which is true will not be made void: but while what is lacking is added to the imperfect, it will be destroyed. For the destruction of imperfection is when that which is imperfect is filled out into the true.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
