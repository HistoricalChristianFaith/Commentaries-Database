[[commentary]]
quote='''
Command the rich of this world not to be high-minded, nor to hope in the uncertainty of riches, but in the living God, who provides us with all things abundantly to enjoy, in the will for good works; to be rich in good deeds, ready to impart, and willing to share, to treasure up for themselves a good foundation for the future, that they may lay hold of the true life. The true life is that which we hope for in the future, which is ended neither by setting nor by times; for it is eternal, and therefore it is rightly called true: for this present life is an image of life, not the truth. And because an image is not altogether emptiness, that life is acquired in this one: and, so that one may hasten towards it, one learns from the image how far the truth excels it, the truth which is attained neither by pride nor by the hope of riches, but by humility and by hope in God, who promised it. For hope must be placed in him, because he himself provides what is necessary for our uses: not in the riches themselves, but in their author. For what hope is seen in a thing perishable and uncertain? since a good many depart from them: and those who seem to remain in them take no profit from them for the future, but loss, unless they share them with the needy: for they are not eternal, that they should be preferred to the future life. They make men proud just as though they promised immortality. We have the example of resurrection in Christ; and yet by many Christ is not loved as riches are, of which no example is seen that they ever freed anyone from death. Christ redeemed us, not riches; for he himself showed the likeness of the future life, so that, spurning all these things, we may follow him, in order that we may come to immortal and heavenly riches. Therefore we ought to strive for this, that we may be rich in good deeds, and by these earthly riches acquire spiritual riches; let us sow on earth, that we may reap in the heavens, where the eternal treasure is laid up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
