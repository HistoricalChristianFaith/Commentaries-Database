[[commentary]]
quote='''
Having condemnation, because they have made void their first faith. He shows what awaits such women, so that they may not readily venture what is hard to fulfill: or, if the mind is given to this devotion, let her keep it to herself for the meantime, because she has learned that it is rash to profess what ought not yet to be entrusted to a youthful age. For he becomes liable to condemnation who turns aside from this, which he had rightly done. For as praiseworthy as it is if one fulfills what is believed to be beyond one's strength, so much the more will one deserve punishment if one dares, through the presumption of rashness, to impose upon oneself what one cannot bear: nor ought he to have any claim to pardon who has been found unfaithful from the very beginning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
