[[commentary]]
quote='''
Let no evil speech proceed from your mouth; but if there is any good for the building up of faith, that it may give grace to the hearers. In a servant of God all things ought to appear good, nor ought his purity to be stained in any part. For what does it profit to have a clean life and a filthy mouth, since the Lord says that each one will be either justified or condemned by his words (Matt. 12:37)? Nor can it seem credible that he lives well who speaks evil; for evil speaking draws one to many vices. For he can speak evil who talks shamefully, and he who disparages the good, and he who chatters with guile, and he who lies. These things produce horror; but good and sober talk gives grace and example to the hearers, so that they may honor God in his words, built up in the faith of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
