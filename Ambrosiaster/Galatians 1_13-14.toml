[[commentary]]
quote='''
For you have heard of my conduct formerly in Judaism, that beyond measure I persecuted the Church of God and fought against it, and I advanced in Judaism beyond many of my contemporaries in my race, being more abundantly a zealot of my fathers' traditions. He briefly recalls his purpose, in which he formerly flourished according to the flesh, opposing the Church; but he says that he left this in order to be a servant of Christ. For he indicates that he was more devoted than they in vindicating the Law; not, however, for the favor of men, but thinking this useful with God. For through ignorance, while he pleased men, he thought that he was serving God, having a free conscience; for he did not know that it was no longer the time for asserting the Law, following the doctrine of fathers placed either in error or in ill will; and with all diligence and fervor of mind he strove to seem more eminent than the others of his own age in zeal for the Law, raging so against the teaching of Christ that he spared no man who had obtained the covenant of faith. But when he had learned by God's revelation that this labor was empty, and rather contrary, he recalls that he desisted from it and submitted himself to the faith of grace, so that it might be advancement for him with God. If then this man, who is an Israelite, and who was supported by the dignity of a teacher among the Jews, instructed by Gamaliel, a most prudent man, holding a place with men of the best life, left the Law, how much more ought those who were outside the Law not to have subjected themselves to the Law? And if he rejoices that he has come out from under the yoke of slavery, why is it that they have bound their liberty with the chains of the Law?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
