[[commentary]]
quote='''
Therefore tongues are for a sign. That is, the words of God were obscured by the veil of an unknown tongue, so that they might not be seen by the faithless; so that, when unknown tongues are heard, it may be a sign that this was done because of faithlessness, so that the hearer may not understand. Not, to be sure, to those who believe, but to those who do not believe: this is what he said, that tongues serve to hide the meaning from unbelievers. But prophecy is not for unbelievers, but for those who believe. That is, it is not fitting for the faithful to hear tongues which they do not understand, but for unbelievers, who are not worthy to understand, as the prophet Isaiah says: Go and say to this people: With the ear you shall hear and shall not understand, etc.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
