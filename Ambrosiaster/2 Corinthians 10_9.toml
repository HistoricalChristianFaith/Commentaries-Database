[[commentary]]
quote='''
But that we may not be thought to frighten you, as it were, by letters. He can be seen to frighten by letters who is neither of any authority nor, when present, has the confidence to reprove: but he is bold when absent for this reason, because when present he is afraid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
