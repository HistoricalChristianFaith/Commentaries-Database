[[commentary]]
quote='''
The grace of our Lord Jesus Christ be with you. Thus he wishes them to make progress in good works, so that the grace of our Lord Jesus Christ may remain in them for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
