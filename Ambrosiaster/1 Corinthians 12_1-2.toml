[[commentary]]
quote='''
Now concerning spiritual things I do not want you to be ignorant, brethren. You know that you were Gentiles, going in the form of images, as you were led. Being about to deliver spiritual things to them, he recalls the example of their former manner of life; so that, just as they were the form of the images, worshipping idols, and were led with the will of the demons as their leader, so also, now worshipping God, they may be the form of the Lord's law, walking as pleases the Lord. For the form of each law ought to be seen in the profession and manner of life of its worshipper; for he is the form and image of the law of God in whose faith and manner of life the truth of the Gospel shines.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
