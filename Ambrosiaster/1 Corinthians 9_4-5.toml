[[commentary]]
quote='''
Do we not have the power of eating and drinking? This is what he had said: All things are lawful for me. Do we not have the power of leading a woman about, as also the other apostles and the brothers of the Lord, and Cephas? He added And Cephas for this reason: because, although he was the first among the apostles, he did not refuse the provisions offered. Cephas is Simon Peter himself. For women, out of desire for the Lord's teaching and eager for virtues, followed the apostles, supplying them both provisions and services, just as they also followed the Savior, ministering to him from their means.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
