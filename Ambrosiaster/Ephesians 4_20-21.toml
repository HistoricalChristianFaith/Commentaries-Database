[[commentary]]
quote='''
But you have not so learned Christ, if indeed you have heard him, and have been taught in him, as the truth is in Jesus. It is clear that Christians have not learned despair after this death, but hope as regards both; for to the faithful life is promised, but to the faithless death, which is eternal punishment; so that, whether death or life, it is learned in Christ; because he who follows him will rise through him to life: but he who separates himself from him will through him be handed over to Gehenna; for he will be condemned with him as judge. And since there are some in the Church who, under the name of Christ, do not follow the truth of Christ; therefore: As the truth is, he says, in Jesus; so that if they have been taught in such a way as the truth is in Jesus, then they may be seen to have learned Christ, and to have heard him, and to have been taught in him: for Christ teaches concerning himself what he is, and how great he is to be believed, and what hope there is in him, and what sort believers ought to be. For he who has learned Christ knows that he rose from the dead, that he might be a pattern for the faithful; and therefore there is great hope, in return for this death, for those who love God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
