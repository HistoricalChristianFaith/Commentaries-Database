[[commentary]]
quote='''
But if Timothy comes, see that he is without fear among you; for he does the work of the Lord, as I also do. Therefore let no one despise him. For although Timothy preached the things which he had received from the Apostle, and was a suitable evangelist, yet because he was not of the same authority, he commends him; lest perhaps he should not be received as he deserved by those among the people who were at variance, and his coming should profit nothing for their salvation. For the Gentiles too could be stirred up to sedition and to the discord of the people, once they had an occasion to rush upon Timothy; therefore let no one despise him, because he does the work of the Lord, he says, as I also do; that is, that he should be received on my authority, by which he was an apostle; for he himself was a bishop.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
