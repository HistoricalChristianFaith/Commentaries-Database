[[commentary]]
quote='''
But avoid foolish questions, and enumerations of origins, and contentions, and battles over the Law; for they are useless and vain. He calls those questions foolish which have no effect for salvation and confer no skill of knowledge for any use. With these words he marks out the dogmas of many heretics. Although all things that are not true are to be called foolish, yet it is one man who brings in fabulous things, and another who with cunning evasion puts forward a thing full of poison, as Arius does, and Photinus. Now what is fabulous is not the Law but heresy, as far as concerns that time of the Jews, when certain of them claimed for themselves the prerogative of the origins of the patriarchs, which arose from marriages, though there is no merit with God from this. Others, again, taught the baptism of pitchers and other vessels, and that the blood of a weasel must be expiated with great care (Lev. 11:29); and that the burial place of Moses was hidden for this reason, that he might not be raised up by magicians (if this were true, the burial places of the other saints too would have had to be hidden); and that Solomon built the temple with the help of demons, though a huge multitude laboured at that work: what is so fabulous?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
