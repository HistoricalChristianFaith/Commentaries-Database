[[commentary]]
quote='''
But just as Jannes and Mambres resisted Moses, so these also resist the truth, men corrupt in mind, reprobate concerning the faith. But they will not advance further; for their ignorance will be evident to all, as theirs also was. This example is from the apocrypha (Exod. 7:1 ff.); for Jannes and Mambres were brothers, magicians or sorcerers of the Egyptians, who thought that by the art of their magic they were resisting, with a counterfeit rivalry, the mighty works of God which were done through Moses. But when the power of Moses increased in his works, they were humbled, and with the pain of their wounds confessed that God was at work in Moses. Hence he says that these likewise will advance no further in the impiety of their assertion; because their lack of skill and their seduction will become plain: and, although unwilling, they will nevertheless confess their lack of skill at the last.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
