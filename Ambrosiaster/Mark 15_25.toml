[[commentary]]
quote='''
If they spoke with one mouth and one reasoning as evangelists, how did it happen that, while three say—namely Matthew, Luke, and John—that the Lord was crucified at the sixth hour, Mark on the contrary says that the Savior was crucified at the third hour (Matt. 27:45; Luke 23:44; John 19:14; Mark 15:25)? — It is not good to wrap the truth in obscurity. For the three evangelists had one and the same meaning, but Mark wished to reveal a fact that they had omitted, knowing it to be necessary. Nor could he be mistaken, who, following the examples of the other authors, learned what he wrote with great devotion and effort, and did nothing without the Holy Spirit. Therefore what he wished to show by this must be fully explained. We must observe, then, that the Savior was crucified not by Pilate, but by the Jews. For as far as Roman law was concerned, he declared the Savior to be innocent. Pilate said to the Jews, “I find no cause in him.” And when they said, “Crucify him,” he replied, “For what evil has he done?” Finally, persisting and wishing to rescue him from their hands, he suffered slander from them when they said, “If you release this man, you are not a friend of Caesar. For everyone who makes himself a king opposes Caesar.” Therefore it came about that he handed him over to their judgment (Jn. 19:4–13). Therefore Pilate did not pronounce the sentence, but the Jews did. Indeed, they were warned, he says, by the chief priests to say, “Let him be crucified.” He (Mark) wants the sentence given at the third hour to be understood in this way: that, continuing with constant cries over an interval of almost three hours, during which there was going and returning from Herod, they crucified the Savior. For everyone who is condemned to death is already counted as dead from the moment he receives the sentence. Mark therefore has made clear that the Savior was not crucified by the sentence of the judge. For it is hard to prove innocent the one who is punished by the judge’s sentence. Therefore he allowed himself to appear conflicting in wording, so that he might teach that what was begun at the third hour was completed at the sixth hour: not by laws, but by the persistent ill-will of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 65: ON THE HOUR OF THE CRUCIFIXION"

[[commentary]]
quote='''
THREE EVANGELISTS SAY THAT THE SAVIOR WAS CRUCIFIED AT THE SIXTH HOUR, BUT THE EVANGELIST MARK SAYS THAT HE WAS CRUCIFIED AT THE THIRD HOUR. — It is not good to wrap the truth in obscurity. For the very harmony of the three evangelists testifies that they spoke the truth. But the fact itself shows that Mark wished to reveal some hidden meaning. Nor could he be mistaken, who, following the examples of the other authors, learned what he wrote with great devotion and effort. Therefore what he wanted to reveal by this statement must be investigated with careful watchfulness. Nor did he allow himself to differ from the three evangelists in words for no reason. Let us consider whether those may be speaking truth who said that the sentence was given at the third hour and therefore that the Savior was crucified at the third hour, although they were not able to prove it. Perhaps they know the meaning, but they do not know how to defend it. And so, with Pilate’s role for the moment set aside, let us see from where the sentence given against the Savior took its beginning, and then it will appear whether what we say can seem true. It is therefore clear that the leaders of the Jews had beforehand instructed the Jews to ask for Barabbas the robber to be released to them on the feast day, but that Jesus ought to be crucified. In opposition to this, Pilate, long resisting and wishing to release the Savior, frequently going in and out to the Jews, kept saying that he saw in him no cause of death. But they, insisting, kept saying, “Let him be crucified.” Therefore there were delays; and while he is mocked by the soldiers, and brought out, and clothed in a purple garment, and a crown of thorns is made for him, and he is adored, and spat upon, and scourged, and struck with the palms of the hands, for this reason he was placed on the cross at the sixth hour. He had been brought to Pilate: then Pilate went out to them, because they themselves did not enter the praetorium; and he addressed them, and heard their false accusations, and sent him to Herod, and he came back, and again Pilate questioned Jesus, and he in turn answered him, and afterward he again went out to the Jews and in conversation said that he found no cause of death in the Savior. Meanwhile, through these delays, they reached the third hour. Then, when Pilate wanted to release him, the Jews said, “Let him be crucified.” Against them Pilate resisted for a long time, and when he could not prevail, he handed Jesus over to their sentence at about the sixth hour. For therefore it is written, “Then he handed him over to their will.” Therefore it was rightly said that the sentence was given at the third hour, because it was not given by Pilate, but by the Jews. Pilate, however, seems to have consented unwillingly: above all because of the envy of those who said, “If you release this man, you are not a friend of Caesar.” (Jn. 19:12) Let us see, then, what Mark, wishing to clear this up, has followed. He wished to show that the Savior was not killed by the judge’s sentence, because it is difficult for one who receives the sentence of a judge not to seem to have been justly killed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 21: ON THE HOUR OF THE CRUCIFIXION"
