[[commentary]]
quote='''
For if the will is ready, it is acceptable according to one's means, not according to what one does not have. Since the Corinthians are being called to this work of ministry, this is enjoined on them, that they give no more than they can; lest perhaps, offering more under compulsion, not willingly, they should seem burdened and be left without reward; for he who does anything under compulsion has no reward. For the churches of Macedonia offered of their own accord, with prayers, so as to prove that they were doing this with their whole will, to the point of offering more than they could; and therefore it was acceptable. For the more they offered, the more they will receive. For if someone gives as much as he wills or can, it is accepted; for he is seen to do this by judgment; and therefore let him give as much as he can and as the mind wills, so that he may have a reward for this thing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
