[[commentary]]
quote='''
Brothers, I do not count myself yet to have apprehended. But one thing: forgetting indeed the things that are behind, and stretching myself out to those that are before, I press on toward the mark, to the palm of the heavenly calling of God. This is what he said above, for he indicates that he labors for this reason, that he may advance daily for the better, always stretching himself out toward greater things, so that, forgetting the things that are past, he may pursue better ones: not because they are bad, but because they are small for laying up merit. But one must advance for the better, so as to arrive at the appointed heavenly prize; for he declares that for the sake of so admirable and invisible a prize one must certainly strive, and not lightly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
