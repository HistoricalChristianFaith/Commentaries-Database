[[commentary]]
quote='''
If this man were not thrown out, the spirit of the church would not be saved on the day of judgment, because the source of the contamination was infecting them all.
'''
source_url=''
source_title="COMMENTARY ON PAUL'S EPISTLES"

[[commentary]]
quote='''
WHOSE SPIRIT DOES THE APOSTLE SAY IS TO BE SAVED, WHEN HE SAYS, “I HAVE HANDED OVER SUCH A MAN TO SATAN FOR THE DESTRUCTION OF THE FLESH,” ETC. (1 Cor. 5:5)? — The destruction of the flesh is when a person, given over to carnal pleasures and desires, obtains hell for himself: for he acquires destruction through the work of the flesh. From these things he becomes wholly carnal, because just as a man who lives according to the Law becomes wholly spiritual, so that even the flesh is called by the same name as the soul; so too, if he lives according to the desire of the world and the pleasures of lusts, the whole man becomes flesh, making progress toward the destruction of the flesh; that is, just as the flesh, because it is frail and corruptible and mortal, when it loses the soul is deformed, lacking form, and sinks into destruction, for it perishes when it loses the strength of all its members, so also the soul is deformed by such a body, whose strength it had despised, and is punished together with the flesh in which it stained itself with vices. So that there is no advantage to the flesh through the soul, but the soul has destruction through the flesh, because it did not govern the body spiritually, though it was given to the flesh as queen, but itself teaches carnal works. Therefore, when the Church has cast out such a man, it has a spirit that is safe, namely the Holy Spirit, who is the guardian of the Church: for if they were willing to have such a man among them, who defiled his father’s wife by lust, so that they would have to be compelled by the Law not to allow him to defile everyone, and the Holy Spirit would withdraw from the Church on account of the polluted one, the Church would not have a safe spirit. For what is lost is not safe, and on the day of the Lord, found naked of the Spirit, they will not be able to be counted among the sons of God. For the Spirit bears witness that we are the sons of God (Rom. 8:16). The Apostle says this to the laity, because as yet bishops had not been appointed over the Churches in every place. Therefore he commands the people to do what he would have done if he had been ordained bishop there, namely, that by joining together with one accord they should cast him out from their company, lest they seem to consent to his deeds. For he who does not rebuke someone whom he can rebuke, but receives him as though he were not in error, provides him fuel for sinning, and for this reason he himself is defiled and drives the Holy Spirit away from himself. For to the Thessalonians likewise, among other things, he says: “May your whole spirit and soul and body be kept blameless at the coming of our Lord” (1 Thess. 5:23). The sense is the same: for to be safe is to be whole. Therefore the king says to Daniel, “Are the seals safe, Daniel?” and he answered, “They are safe, O king” (Dan. 14:16); that is, intact. So that our spirit may be whole when he does not desert us. For those whom the Spirit deserts will no longer be whole in respect to the cause of regeneration, because they do not have him through whom they were called sons of God. Nor is it contrary to this if we say that the Holy Spirit, when we sin, deserts us and is not whole in us. For he is not whole in us when he deserts us, who was our leader and ruler; because if he is our head and we are his members, then when we do something contrary, it is not he who seems to desert us, but we who seem to desert him; and then he appears not to be whole when he loses us. For this is true and evident, that it is not he who turns away from us, but we from him when we sin. And to the Colossians, among other things, he says: “From whom the whole body, supplied and knit together, grows with a growth from God” (Col. 2:19). If we take this according to the sound of the words, it does not fit: for God does not lack anything, so as to make growth through us. But when we return to the author of our life and confess him, the Godhead, by gaining us for salvation, makes growth in us; therefore, in those who depart from him there is loss. This, then, is not to be whole, which is also to suffer loss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 49: WHOSE SPIRIT IS TO BE SAVED"
