[[commentary]]
quote='''
For even if I wish to boast, I shall not be foolish; for I shall speak the truth. He says this because, if he declares the merit that he has with God, he will not be imprudent; for he speaks what is true. So if someone speaks of his merits, which have been shown to him, he is certainly not foolish; but if he keeps silent, he is even prudent. But why he does not boast openly here he now adds, saying: But I refrain, lest anyone think of me beyond what he sees in me, or hears anything from me. So he shows why he does not boast openly: Lest anyone think, he says, that I stretch my glory further than the boundary of my merits allows. He means those whom he had as detractors because of the Law, as I mentioned above. For it is certainly good not to keep silent about the glory of one's merits, so that believers may be drawn on.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
