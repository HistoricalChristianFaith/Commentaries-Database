[[commentary]]
quote='''
In whom we have redemption through his blood, the remission of sins. He calls for a twofold grace, because he both redeemed us with his blood and did not impute our sins to us, that is, he redeemed and set free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
