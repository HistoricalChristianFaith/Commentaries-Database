[[commentary]]
quote='''
I wrote to you in the epistle not to mix with fornicators. He indicates that he had written earlier, where he warns them not to join themselves to men of evil life. And because they seemed perhaps not to have understood what he had written, he now interprets in this epistle what he wrote, saying: Not at all the fornicators of this world: but I wrote that one must withdraw from such brothers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
