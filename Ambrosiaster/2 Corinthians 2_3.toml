[[commentary]]
quote='''
And I wrote this very thing for this reason, lest, when I had come, I should have sorrow from those from whom I ought to have rejoiced: being certain that my joy is the joy of you all. He says that he wrote these things for this reason: so that, coming afterwards, he would have nothing to grieve him, the vices having been removed, but might rejoice with them as with most dear sons; so that, since he was being afflicted with tribulations by unbelievers, he might at least rejoice in those who had believed. For the joy of the Apostle is the purification of the people; for he rejoices for this reason, because there is no blame in those with whom he must rejoice together.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
