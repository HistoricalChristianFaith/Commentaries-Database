[[commentary]]
quote='''
See Israel according to the flesh: that is, learn, you men who see God, how carnal things stand, that is, idolatry. Are not those who eat the sacrifices partakers of the altar? For just as we, receiving of the one bread and of the one cup, are partakers and sharers of the body of the Lord, so also those who eat the sacrifices are partakers of the altar of error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
