[[commentary]]
quote='''
Therefore, my dearest and most longed-for brothers, my joy and crown, so stand in the Lord, most beloved. He admonishes them to persevere in the same faith; for his joy at present is their constancy, and in the future his crown. For when the disciples are victors in the contest, the teacher will be worthy of a crown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
