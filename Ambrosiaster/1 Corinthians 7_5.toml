[[commentary]]
quote='''
Do not defraud one another. He says this so that they may agree in the marital matter, lest disagreement beget fornication. Except by consent for a time; that is, that they abstain by agreement, for the sake of thanksgivings. That you may be free for prayer. For although one must pray without ceasing, since this meditation is to be practiced every day, yet so that they may apply themselves to prayer, he directs that they make themselves free for this, with times set between for winning the Lord's favor; for that he may have mercy, he must be entreated with greater purity. Although marriages are pure, yet one must abstain even from lawful things, so that prayer may more easily be brought to its effect. For in the law too, those who wished to be sanctified, among other things, also refrained from raisins at the Lord's command, that they might become holier (Num. 6:4). For when someone does not touch even things that are allowed, he shows that he wishes to receive what he prays for.

And return again to the same thing. Since he gives counsel to married people that after the days of prayer they ought to return to natural use: Lest Satan tempt you because of your intemperance; he advises that they abstain with days set between, lest an occasion be given to the devil, as the apostle Peter says: Behold, the devil, like a roaring lion, goes about seeking whom he may devour (1 Pet. 5:8). For if a wife is taken for the sake of begetting children, not much time seems to be granted for that use itself; because both feast days, and days of procession, and the very reckoning of conception and childbirth according to the law show that there ought to be a cessation at these times.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
