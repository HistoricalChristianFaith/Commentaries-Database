[[commentary]]
quote='''
"Praying that somehow at last I may have a successful journey to come to you, in accordance with the will of God." Paul shows the sense of his prayer for them; for he says that he asks God that he might come to the city for their improvement, with the will of God, whose gift he proclaims. For progress is present only if what must be done is done with the will of God. He therefore prays that for whatever reason an opportunity might now be given for him to come to the city, because he was occupied with preaching to others; therefore he considers it a successful journey if he comes, God willing, because the will of God is provident. A successful journey, then, is to undergo the labor of travel not in vain. This he asks that God may fulfill, by calling them to His grace. He speaks with eagerness of soul; for he desires them, knowing that it benefits both them and himself, as he says elsewhere: What is our joy and crown? Is it not you in the presence of the Lord's coming? (1 Thess. 2:19). For the Apostle's fruit is richer if he gains many. Likewise, there is greater joy if the powerful of this world are converted to God, because the more tough the enemies are, the more necessary they are when reconciled. Therefore an occasion was given to his will in such a way that he was compelled to appeal to Caesar and was sent for another reason to the city of Rome, by God's will, so that he might fulfill the purpose of his will. Finally, when he was in shipwreck, the Lord stood by him, saying: Do not be afraid, Paul; for as you have borne witness about me in Jerusalem, so you must also in Rome (Acts 27:24).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
