[[commentary]]
quote='''
As sorrowful, yet always rejoicing. It is true, because this sorrow works joy, and those who saddened them with insults were heightening their joy. As poor, yet enriching many. As far as the present life is concerned, they seemed poor; but they bestowed spiritual riches on believers: needy on earth, rich in the heavens. As having nothing, yet possessing all things. This was glorious in the apostles: that without anxiety and without the name of possessing, they possessed not only the things that were in possessions but even their owners themselves; for everything had to be laid at their feet because of their powers, as we read in the Acts of the Apostles (Acts 4:35).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
