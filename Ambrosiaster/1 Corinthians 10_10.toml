[[commentary]]
quote='''
Nor murmur, as some of them murmured (Num. 14:1). To murmur is to complain falsely to one another about superiors and rulers, as far as pertains to the meaning of the passage; for murmuring also commonly arises from a just cause. And they perished by the destroyer. That is, they passed into the place of Judas, anticipating him; for, because he betrayed Christ, he was cast out of the number of the apostles by God the judge. Through these examples he calls us to a more corrected life; so that by his warnings we may merit either a reward, if we are obedient, or a heavier punishment if we are disobedient. For there is no doubt that those sinners are to be subjected to torments more, to whom the punishments of sinners were recounted precisely for this, that they should not sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
