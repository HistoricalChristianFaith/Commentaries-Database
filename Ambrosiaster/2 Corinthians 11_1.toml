[[commentary]]
quote='''
Would that you would bear a little of my folly! But do bear with me too. As he begins to tell true things about himself, he calls himself foolish, because this seems to pertain to his own praise. For which reason it has been said: Let not your own lips praise you, but your neighbors (Prov. 27:2). But here he is driven by grief on account of those who, though they ought to have thought well of him above the others, thought of him unworthily.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
