[[commentary]]
quote='''
Receive him, therefore, in the Lord with all joy, and hold such men in honour; because for the work of Christ he came near even to death, handing over his soul to destruction, that he might supply what was lacking to you regarding my service. Although the love between Epaphroditus and the people was undivided, yet he is also commended by the Apostle, so as to make him dearer still: above all on account of those who were perhaps not so warm in their affection toward him; for in every people there is diversity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
