[[commentary]]
quote='''
Fool, what you sow is not made alive, unless it first dies? With the natural man he certainly does not deal by the authority of the Law, so as to persuade him by examples which, if he accepted them, he would not err; but by physical reasoning, with which he flatters himself so as not to believe that dissolved and dead bodies rise. For he shows that dead things are restored again to life, and multiplied, so that human error may be confounded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
