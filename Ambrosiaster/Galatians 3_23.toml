[[commentary]]
quote='''
For before faith came, we were kept under the Law, shut up for that same faith which was beginning to be revealed. This is what he says: that before the Savior came we lived under the custody of the Law, lest we should sin, so that when the promise came we might be worthy. For by this hope the Law kept us safe, so as to offer us to Christ at his coming, that is, us Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
