[[commentary]]
quote='''
Therefore all have died, and Christ died for all, so that those also who live may no longer live for themselves, but for him who died for them and rose again. Because all must die on account of Adam, Christ died for all, to free them from the second death; and therefore those who live in the body, knowing that Christ died for them, should be subject to him, professing him as Lord. For his resurrection bears witness that his death benefits them. Therefore he does not live for himself who is ready to do the will of his lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
