[[commentary]]
quote='''
And if I pay out all my substance. It is plain that if all one's substance is spent, it profits nothing if love is neglected; because love is the head of religion, and he who does not have the head does not have life. And if I hand over my body that I may burn, it profits me nothing. Without love it profits nothing; because love is the foundation of religion. Whatever, then, is done without love is perishable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
