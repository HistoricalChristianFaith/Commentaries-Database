[[commentary]]
quote='''
WHAT IS THE MEANING OF WHAT MARK THE EVANGELIST SAYS ABOUT CHRIST AMONG OTHER THINGS: “ENTERING THE HOUSE, HE WISHED NO ONE TO KNOW, AND HE COULD NOT REMAIN HIDDEN” (Mark 7:24)? IF THEREFORE HE WISHED AND COULD NOT, HIS WILL SEEMS TO HAVE BEEN WEAKENED. — It is utterly impossible that the Savior’s will should not be fulfilled; nor can he will what he knows ought not to be done. Therefore, he must be said to have willed what in fact was done. For his will is never outside his nature. Just as his nature cannot fall under criticism, so neither can his will. For what is set forth was done in the regions of Tyre: then he entered the house and did not wish anyone to know. Now it is to be asked how or why he did not wish anyone to know. We must observe that this took place in the territory of the Gentiles, for whom the time for preaching had not yet come. Indeed, when he sent his disciples he commanded them, saying, “Do not go into the way of the Gentiles, and do not enter the cities of the Samaritans; but go rather to the lost sheep of the house of Israel” (Matt. 10:5–6). Therefore he did not wish it to be made known that he was in the house; yet he did not refuse to be sought out, but welcomed it gladly. For although it was not yet the time to preach to the Gentiles, it would have been an act of envy not to receive those who came of their own accord to the faith. Therefore it came about that, while the Savior was not made known by the disciples, he was nevertheless made known by others who had seen him enter the house; and it began to be known that he was in the house, so that those who wished to obtain blessings might enter to him. By his own people, therefore, he did not wish it to be proclaimed that he was in the house. For he wished to be sought; and so it happened. For he did not remain hidden, since it was pointed out by others that he was in the house. Indeed the Canaanite woman, hearing about him, entered to him and begged that he would cast the demon out of her daughter; and she would not have obtained the blessing if she had not first subjected herself to the God of the Jews. Therefore the will of the Savior was fulfilled according to what we have explained: for when we examine those things which the Evangelist, aiming at brevity, has summarized, we discover what was concealed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 77: ON WHY CHRIST WISHED TO REMAIN HIDDEN IN THE HOUSE"
