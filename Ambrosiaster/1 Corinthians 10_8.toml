[[commentary]]
quote='''
Nor let us commit fornication, as some of them committed fornication, and there fell in one day twenty-three thousand men (Num. 25:1). This was paid back to them when they defiled themselves with the Midianite women; for the wrath of God arose against them, and it was quieted by the zealous ardor of Phinehas the priest, who had the zeal of God, so that no more should die.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
