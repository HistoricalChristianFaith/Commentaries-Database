[[commentary]]
quote='''
But even if our Gospel is still covered, it is so in those who are perishing. It is true that unbelievers, blinded by faithlessness, do not see the splendor of the power of God; for a veil is over their heart, and the dullness of unbelief, among the Jews most of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
