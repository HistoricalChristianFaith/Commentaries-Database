[[commentary]]
quote='''
Do all have the grace of healings? How can it come about that all have gifts of healings? Do all speak in tongues? Certainly not, except him who receives the gift in this matter. Do all interpret? He can interpret words to whom God grants it. These things are to be inserted into the sense stated above. For he has explained, giving the reason, that all have different graces, and that the whole is not granted to anyone, by the example of the members. For by the example of the body of flesh he suggests the spiritual body: and for this reason God is to be blessed in all things, and glory is to be had in his name, whose grace it is. This reasoning we find also in physical things: for though gold is better than silver, yet silver is more in use; and though bronze is necessary, yet there is more need of iron; for almost nothing is done without iron, though it is lower. And after this:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
