[[commentary]]
quote='''
But now, when Timothy had come to us from you, and had announced to us your faith and love: and that you always have a good remembrance of us, longing to see us, as we also you; therefore we have obtained consolation, brothers, in you, over all our necessity and affliction, through your faith; since now we live, if you stand firm in Christ. He has made clear why he writes to them in eager language; for this is the reason: when the messenger came and made known the firmness of their devotion in faith and in love of the Apostle, being gladdened by their common concord, he writes to them, holding the fruit of their faith and good way of life as secure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
