[[commentary]]
quote='''
IF GOD IS ONE, WHY IS HOPE OF SALVATION IN THREE, AND NOT IN TWO OR FOUR, OR SURELY IN THE ONE HIMSELF? AND WHY WAS THE TRINITY NOT PREACHED FROM THE BEGINNING? — Almost nothing new has been brought about: for the Trinity is preached in such a way that one God is believed. Nothing, therefore, has been added, but the mystery of the one God has been revealed. Yet in the very beginnings it was not fitting that it should be revealed; because first it had to be preached, and afterwards that which was preached had to be revealed: so that you may know that the Father is the one from whom all things are; that the Son is so called, through whom all things are; and that the Holy Spirit is called the one through whom all things, which are indeed from the Father but through the Son, are reborn into faith in the one God. Therefore these three indeed exist, but there is one divinity. Reason therefore requires that they be three, neither more nor fewer. For every number reaches up to nine, because when three are mutually in each other, they make the number nine; since in the one there are three, and the three are one. For whoever sees the one, sees the three, since one does not differ from another. Therefore three are one, and three times three are one. For in the number nine this is perfection, as far as number is concerned, because from the one all things exist. And when the one is added, from which or in which the three who are counted as nine come to be, they become ten or twenty. Yet one always goes only as far as nine, and one is added, because nine are one, so that the perfection of unity may be complete.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 87: WHY IS HOPE OF SALVATION IN THREE"

[[commentary]]
quote='''
Yet for us there is one God the Father, from whom are all things, and we in him. For all things, whatever they are, wherever they are, are from him. But when he says: And we in him, he has distinguished us from the rest, who, although they are from him, are nevertheless not in him, as long as they do not yet believe. And one Lord Jesus, through whom are all things, and we through him. For all things are indeed from the Father, but they were created through the Son. But when he says: And we through him, he signifies that we have been re-formed in the knowledge of God through him through whom we had been created; for, having been made through him together with the rest, after the stupor of mind and of ignorance we have through him acknowledged the mystery of the one God. So he called the Father one God, and Jesus his Son one Lord, so that, since God cannot fail to be Lord, the Lord likewise might be understood to be God as well, and so he might show that God and Lord are one, preserving the manner of one principle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
