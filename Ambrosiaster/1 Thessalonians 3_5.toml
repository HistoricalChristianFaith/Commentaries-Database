[[commentary]]
quote='''
Therefore I too, no longer bearing it, sent to this end, that I might know your faith; lest by some means the tempter had tempted you, and your labor should become empty. He says this on account of certain people who could be seduced by the cunning of Satan; because in every people there is a firm part and a weak one, on whose account he was anxious, lest he lose the fruit of their belief. And because he could not endure any longer not to know what was more certainly happening concerning them, he sent Timothy, the bishop created by him, from whom he could know for certain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
