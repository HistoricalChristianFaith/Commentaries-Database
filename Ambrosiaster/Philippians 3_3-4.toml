[[commentary]]
quote='''
For we are the circumcision, who serve God in spirit, and glory in Christ Jesus, and have no confidence in the flesh; although I might have confidence even in the flesh. It is clear that believers themselves circumcise their heart, so that, the mist of error being cut away, they may behold and acknowledge the Lord of creation. This is to serve God in spirit and to glory in the Lord Jesus Christ, who gave the law of the spirit, so that the glory of the flesh might be emptied. Yet the Apostle also had this confidence, so that, if he wished, he could glory in the circumcision of the flesh; but knowing that this glory is empty, he rejected it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
