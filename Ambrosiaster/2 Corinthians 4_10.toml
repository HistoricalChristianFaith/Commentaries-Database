[[commentary]]
quote='''
Always carrying about the death of the Lord Jesus in our body, so that the life of Jesus also may be manifested in our body. There is no doubt that Christ is killed in the martyrs, and that in those who suffer for the faith, deaths or chains or blows are sufferings of Christ; so that his life also may become evident in their body. For they are sufferings which show merit for the future life which Christ promised. Hence he says in another place: When I am weak, then I am strong (2 Cor. 12:10). And again: Through tribulations we must enter into the kingdom of God (Acts 14:21).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
