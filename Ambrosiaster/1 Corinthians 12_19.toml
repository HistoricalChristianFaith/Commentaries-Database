[[commentary]]
quote='''
But if all were one member, where would the body be? It is clear that if all had been of one dignity, they would not be called members, nor a body; and therefore they are governed together by the various offices of the members; for all could not be one member. And they are many for this reason, that they differ from one another in dignity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
