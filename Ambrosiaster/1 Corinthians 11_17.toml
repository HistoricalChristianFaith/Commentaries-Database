[[commentary]]
quote='''
But this I command, not praising that you come together not for the better but for the worse. Just as he amends their way of life point by point by rebuke, so too he amends their traditions, not praising them, of course, but censuring them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
