[[commentary]]
quote='''
May the Lord grant mercy to the house of Onesiphorus; for he often refreshed me, and was not ashamed of my chain. This refreshment is to be understood in a twofold way: for he both refreshed him with his comfort in the hardship of custody, and supplied whatever was needed, whether by him or by the needy. For through the hope of the things that have been promised, he was not ashamed to approach and seek out a man held in custody; for those whom he mentions above, because they were ashamed of the cross of Christ, deserted the Apostle in his need.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
