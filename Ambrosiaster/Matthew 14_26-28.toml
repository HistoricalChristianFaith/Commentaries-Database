[[commentary]]
quote='''
And the apostles in the boat, terrified, thought it was a phantom. Hence the apostle Peter, when the Lord said: Do not fear, it is I (Matt. 14:27), not readily believing, said: If it is you, bid me come to you upon the waters (ibid., 28), so that, if he had set his foot firmly upon the waters, he would know it to be true that what appeared was not a phantom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
