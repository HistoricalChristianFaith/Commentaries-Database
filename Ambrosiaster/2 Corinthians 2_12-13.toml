[[commentary]]
quote='''
But when I had come to Troas for the Gospel of Christ, and a door had been opened to me in the Lord, I had no rest for my spirit, because I did not find Titus my brother: but having bidden them farewell, I set out for Macedonia. He indicates that he went to Troas to preach the Gospel of Christ to them, and that when he had begun to preach, there were those who received the word of faith: but because the support of Titus was lacking, the labor was unbearable on account of those who were raising an uproar. For although some of them had opened their hearts to receive the word of God, yet the impudence of the unbelievers was by no means slight, rising up against the Apostle out of jealousy toward the believers: and these two tasks could not be accomplished by one man, namely both to instruct the faithful and to fight off the unbelieving. And so, having bidden farewell to those who had received him, he set out for Macedonia.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
