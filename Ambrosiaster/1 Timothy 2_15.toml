[[commentary]]
quote='''
She will be saved, he says, through the generation of children; if, however, she remains in faith, and love, and a pure life. For he calls those children who are regenerated through faith in Christ; for if these persevere in their generation, the woman will be set free with them, rising from the dead, not that she will be set free by them, but through their generation; for when those who are destined to eternal life believe, the resurrection from the dead is reached, and she will be saved, as they believe and lead a chaste life. For the resurrection is held in suspense for so long, until all who are predestined to salvation believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
