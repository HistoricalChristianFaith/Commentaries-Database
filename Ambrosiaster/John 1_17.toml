[[commentary]]
quote='''
IN THE GOSPEL, JOHN SAYS, “THE LAW WAS GIVEN THROUGH MOSES, GRACE AND TRUTH CAME THROUGH JESUS CHRIST” (John 1:17). THEREFORE, GRACE AND TRUTH DID NOT EXIST BEFORE. HOW THEN IS THE LAW SAID TO HAVE BEEN GIVEN BY GOD, IF THERE WAS NO TRUTH IN IT? — This should not simply be passed over, but we must consider what it means. “The Law was given through Moses.” Through Moses the given Law has clear commandments; but he also wrote the history, which is itself also called Law. Let us see if anything in its commandments is not true: perhaps what it says, “You shall not kill, you shall not commit adultery, you shall not steal” (Exod. 20:13–15)? The rest are of the same kind. But as for its history, it is clear that before the coming of Christ the truth was not present. For the things that were under a veil were uncertain in what they signified. But when it was made clear through Christ whose person it is that speaks in Genesis, “Let us make man in our image and likeness” (Gen. 1:26), and who is the one who made him; and who it was that was seen by the patriarchs in the bush (Exod. 3:2); and who acted in the rock that gave water in the desert (Exod. 17:6), “for the Rock,” he says, “was Christ” (1 Cor. 10:4), therefore truth came through Christ, when the things that had been hidden, or had become doubtful as to what they signified, were shown by Christ. For among other things the Lord says, “Moses wrote about me” (Jn. 5:46). This had previously been concealed; indeed there was error. For he who was the Son was thought to be God the Father; and he who was supposed to be an angel was recognized as the Son of God. And a promise had been made to Abraham, which, so long as it was not fulfilled, remained in uncertainty; but when it was fulfilled with the coming of Christ, it became truth: when both what was promised was rendered, and it began to be known what it was that had been promised. For the faith of the one who promises is then proved true when he fulfills the promise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 76: HOW GRACE AND TRUTH CAME THROUGH CHRIST"

[[commentary]]
quote='''
IN THE GOSPEL, JOHN SAYS, “THE LAW WAS GIVEN THROUGH MOSES, GRACE AND TRUTH CAME THROUGH JESUS CHRIST” (John 1:17). THEREFORE, GRACE AND TRUTH DID NOT EXIST BEFORE. HOW THEN IS THE LAW SAID TO HAVE BEEN GIVEN BY GOD, IF THERE WAS NO TRUTH IN IT? — We must see what this means, “The Law was given through Moses.” Through Moses, however, the given Law has clear commandments, and what in it would not be true? “You shall not kill, you shall not commit adultery”? (Exod. 20:13–15) Such are the rest as well. But he also wrote the history in which, up to the coming of the Savior, what the truth was had not been revealed. When therefore it is revealed through Christ whose person says, “Let us make,” (Gen. 1:26) and who it is that acts; and who it was that was seen in the bush or by the patriarchs; (Exod. 3:2) and who it was that acted in the rock when he himself brought forth water (Exod. 17:6), “for the Rock,” he says, “was Christ” (1 Cor. 10:4): truth therefore comes through Christ, as those things that had been in doubt are understood in what they signify. Therefore the Law given through Moses makes sinners guilty; but the grace that was promised in the Law, when it comes, by forgiving sins deprives sinners of death. There was therefore an order: first to give the Law, and afterwards mercy, which then becomes grace when it forgives sins. For before, it was a promise, which afterwards becomes grace. “For,” he says, “there shall come out of Zion one who will deliver and turn away ungodliness from Jacob” (Isa. 59:20, LXX). This promise, through Christ, became grace, when he freely forgives sins. But how could he forgive sins if he had not first given the Law, through which, when people had become guilty, he might grant pardon? For he would not give except what was owed to himself. But it could not be owed unless the Law had gone before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 30: HOW GRACE AND TRUTH CAME THROUGH CHRIST"
