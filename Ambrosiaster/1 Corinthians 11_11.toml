[[commentary]]
quote='''
Nevertheless neither is the woman without the man, nor the man without the woman, in the Lord. In the Lord for this reason: because God made both from one, and made them one; for they are one flesh and one body in the Lord, that is, according to the Lord, who created them. Finally, those who do not believe that the woman was taken from the man believe in an origin of human beings without the Lord, or not according to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
