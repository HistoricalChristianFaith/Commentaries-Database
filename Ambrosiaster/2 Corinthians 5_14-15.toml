[[commentary]]
quote='''
The Apostle says that Christ died for all; for therefore he says, “Therefore all have died, and he died for all” (2 Cor. 5:14–15). But the Lord himself says, “The Son of Man came to give his life as a ransom for many” (Matt. 20:28). In this way it seems contrary. — The words indeed are different, but the meaning is one; just as again the same words can have a different meaning, for example, “Whatever is not from faith is sin” (Rom. 14:23); and, “The Law,” he says, “is not of faith” (Gal. 3:12), and yet it is not sin. Those whom the Savior called “many,” the Apostle indicated by “all.” For they are many, because the greatest part from every people and nation will come to believe in the Savior. These the Apostle called “all believers.” Therefore, among other things, he says, “He died for all”; that is, of course, for those who have believed and will believe. Yet He also died for those who are unwilling to believe; but since they do not accept the benefit, they are unwilling that Christ should have died for them; and therefore He does not appear to have died for those to whom He has brought no profit, but rather harm. But He is rightly said to have died for those for whom a victory has been won, who, understanding the mystery, give thanks to God through Christ our Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 54: WHETHER CHRIST DIED FOR ALL OR FOR MANY"
