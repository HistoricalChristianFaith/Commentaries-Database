[[commentary]]
quote='''
They are Hebrews, and so am I: they are Israelites, and so am I: they are the seed of Abraham, and so am I. In these things he shows himself the equal of those whom he indicated above, so as to show to be false their detractions, by which he was judged unworthy by them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
