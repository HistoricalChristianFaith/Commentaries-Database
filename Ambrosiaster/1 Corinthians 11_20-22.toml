[[commentary]]
quote='''
When you come together, therefore, into one, it is no longer to eat the Lord's supper. For each one of you takes his own supper beforehand in eating: and one is hungry, and another is drunk. Do you not have houses for eating and drinking? Or do you despise the Church of God, and put to shame those who have not? He marks out those who came together into the church in such a way that, offering their gifts, when the presbyters arrived (because rulers had not yet been established for the churches in all places), those who had offered claimed the whole for themselves, for the sake of schism. For the false apostles had sown dissensions among them, so that they were jealous over their own offerings, although the offerings of all were blessed with one and the same prayer; so that those who, as usually happens, had not offered, or did not have the means to offer, were overcome with shame and confounded, taking no share; and they did this so quickly that those who came later did not find anything to eat. And therefore, he says, if you come together in such a way that each one takes his own, these things should be done at home, not in church, where people come together for the sake of unity and of the mystery, not of dissension and the belly. For the gift offered should belong to the whole people, because in one bread all are signified. For by the fact that we are one, we must all take from one bread.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
