[[commentary]]
quote='''
When Christ, your life, appears, then you also will appear with him in glory. Christ is our life; for we read in the Acts of the Apostles that he is the author of life, he whom the faithless do not believe to be the judge to come (Acts 3:15). But when he comes in heavenly power, and is seen to be what was least believed, then those also who believed in him will appear with him; and it will be made manifest to all faithlessness that he lives with his own in glory. This consolation begets the confidence of hope, so that, secure about the life to come and putting all things after him, we may follow Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
