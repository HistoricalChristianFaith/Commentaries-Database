[[commentary]]
quote='''
I ask Euodia, and I beseech Syntyche, to mind the same thing in the Lord. And I ask you also, true yokefellow, help those women who labored with me in the Gospel, with Clement and the rest who are my partners in the works, whose names are in the book of life. He exhorts Euodia and Syntyche to increase their prudence, with the help of those whom he mentions, so that, as they had made progress in the works of the Gospel, they might make progress also in the knowledge and wisdom of God; and he declares that all of these, by the merit of faith, are held in the book of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
