[[commentary]]
quote='''
You know that through infirmity of the flesh I preached the gospel to you long ago: and your trial in my flesh you did not despise nor reject. He recalls to their memory the time when he first preached to them the Gospel of God. For at that very time the Apostle was beset with injuries and weakened by beatings; for he seems weak who is humbled and does not resist, for the sake of the Gospel of God. And in this he praises their constancy, that they were not drawn away from the faith: for the injuries of the Apostle were the trial of the Galatians, in which they were found firm, not doubting about the faith. For they could have taken offense and said: What power or hope is there in this faith, when its minister is so humbled? But because they had already steeped their minds in the hopes of things to come, they did not dread present perils for the name of Christ, certain that our faith has its dignity not on earth but in heaven, and that for these tribulations great rewards are repaid. He makes them blush, because after these praiseworthy things they had been circumvented, so that they appeared blameworthy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
