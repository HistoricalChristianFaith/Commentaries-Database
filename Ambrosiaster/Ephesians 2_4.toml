[[commentary]]
quote='''
But God, who is rich in mercy, because of his great love with which he has had mercy on us. These are the true riches of mercies: that mercy should be shown of his own accord to those who did not seek it, as Isaiah says: I was made manifest to those who did not seek me (Isa. 65:1); for this is to abound in mercy, that it be bestowed even on those who do not ask. Yet this is the love of God toward us: that because he made us, he does not will us to perish; for he loves his own work. For he made it for this reason, that he might love what he made; for no one holds his own labor in hatred.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
