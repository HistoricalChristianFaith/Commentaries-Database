[[commentary]]
quote='''
But I rejoiced in the Lord greatly that at last you have flourished again to this, that you are mindful on my behalf, as you were indeed mindful; for you were occupied. Now he shows his eagerness made more ready, because in the matter in which they had become more negligent they applied diligence and repeated their former work, having become mindful of their Apostle, so as to send their fruits to him to be laid up in the heavenly granary, where neither moth nor rust destroys (Matt. 6:19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
