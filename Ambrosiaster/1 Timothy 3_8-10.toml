[[commentary]]
quote='''
Deacons likewise chaste, not double-tongued, not given to much wine, not occupied with shameful gains, holding the mystery of the faith in a pure conscience. And let these also be proved first, and so let them minister without crime. He who gives such great precepts about choosing deacons, who are known to be the ministers of the priests, what sort of men does he wish bishops to be, if not, as he himself says, irreproachable, having no public business, no shameful and base gains? For he knows that men engage in trade for this reason, to get gains, and that they profess nothing other than what they do. But he says that these are shameful gains, if under a godly profession one is eager for gain; for such a man is found out as shameful, since he makes a show of being pure. Yet after the bishop he has subjoined the ordination of the diaconate. Why, if not because the ordination of bishop and presbyter is one? For each is a priest, but the bishop is first; so that every bishop is a presbyter, yet not every presbyter a bishop; for he is bishop who is first among the presbyters. Thus he indicates that Timothy was ordained a presbyter; but because he had no other above him, he was bishop. Hence he also shows how he is to ordain a bishop; for it was neither right nor permitted that an inferior should ordain a greater; for no one gives what he has not received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
