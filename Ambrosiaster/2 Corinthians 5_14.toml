[[commentary]]
quote='''
For the love of Christ urges us, judging this, that if one died for all. Since Christ, loving the human race, gave himself up to death to redeem them, therefore the apostles, in order to repay him, exhort men in some measure to his service; and to draw them, they must bear witness that they preach the truth while others teach perverse things; nor should they keep silent about their own merit, so that they may point out the punishment of the evil teachers. They did these things, then, not from pride of mind, but so that the gift of Christ might be understood by all, and that, faithfully devoted, they might render thanks to him. Because of the love of Christ, therefore, they do not keep silent about what and how great his gifts are toward those who love him: not for the sake of boasting, but to invite their hearers to devotion to him, lest the death of Christ seem fruitless, not so that the praise of the apostles might be recognized. For through the merit and glory of the apostles the grace of Christ and the kindness of God are recognized.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
