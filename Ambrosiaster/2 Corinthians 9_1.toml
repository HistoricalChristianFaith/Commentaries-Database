[[commentary]]
quote='''
For concerning the ministry that is done for the saints, it is superfluous for me to write to you; for I know your ready will, for which I boast of you among the Macedonians. These too are the words of one coaxing them. For he says that it is superfluous for him to write about the ministry that is done for the saints, so that he may be seen to think well of them: for it is superfluous to remind one whom you know will do it. But to show his diligence, it is necessary that he write, both to make them readier and to make plain what he proclaims about them to the others. For superfluous things usually produce greater care; for the Lord too, not doubting the love of the apostle Peter toward himself, says to him a third time: Simon son of John, do you love me (John 21:17)? This threefold repetition seems superfluous, as it were, but it serves the completeness of the admonition, so that he may know that he must attend with great diligence to what is enjoined frequently.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
