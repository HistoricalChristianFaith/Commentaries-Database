[[commentary]]
quote='''
In chastity. By defending chastity, whether of the body or of the Gospel, he made not a few enemies. In knowledge. Asserting the knowledge of the Law and of the Gospel not in human wisdom nor in pretense, he showed himself to God a faithful steward of Christ. In magnanimity. He was of great soul in bearing the weaknesses of the brothers and in contempt of this world; hence in another place he says: The world is crucified to me, and I to the world (Gal. 6:14). In kindness. He was kind, because just as he reproved, so also he coaxed, so that after rebuke he might console with gentle exhortation. In the Holy Spirit. The Holy Spirit flees from what is feigned (Wis. 1:5). Since, then, he taught sincerely, he handed on the gift of God in the Holy Spirit. In love unfeigned. Feigned love is in those who desert the brothers in need; hence he, always making the needs of the brothers his own, was simple in love (Gratian, Decretum, De poenitentia, dist. 2, c. Ficta charitas). For he suffered with all, as he says in another place: Who is made to stumble, and I do not burn (2 Cor. 11:29)? For this is true love: if, disregarding one's own advantage, one takes care of him whom one professes to love; which the Apostle always did.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
