[[commentary]]
quote='''
But each one in his own order. Now he wishes to set out the order of the resurrection, lest they should think it a fable because it has not yet happened in the rest: he sets out for them the orders and the times, when it happened and when it is going to happen that the dead rise. Christ the beginning. As he testifies in the Acts of the Apostles that it is written in Moses (Acts 26:23): If Christ is capable of suffering, if he is the first to rise from the dead, etc. He rose first, then, that he might become a pattern for those who believe in him. Then those who are Christ's, who believed in his coming. This is to be understood in a twofold way: because both at his second coming the saints will rise, according to the faith of the Apocalypse of John (Rev. 20:12), and also at the first coming, when he rose, many bodies of the saints rose (Matt. 27:52), as a public witness that death had been conquered and despoiled. Under one signification, then, he includes a twofold coming of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
