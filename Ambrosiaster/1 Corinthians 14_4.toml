[[commentary]]
quote='''
He who speaks in a tongue edifies himself; but he who prophesies edifies the Church. For through this, that perhaps he alone knows what he is saying, he edifies himself alone; but he who prophesies edifies the whole people, since what he says is understood by all. He calls prophets the interpreters of the Scriptures; for just as a prophet foretells things to come which are not known, so this man too, when he makes plain the meaning of the Scriptures which is hidden from many, is said to prophesy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
