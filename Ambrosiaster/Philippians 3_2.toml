[[commentary]]
quote='''
Beware the dogs, beware the evil workers, beware the concision. He means those who, envious of the Gentiles, had overthrown the Galatians by the depravity of their talk, persuading them to be circumcised. He teaches that they are to be avoided and spurned in every way, like dogs that first bark and then, with a savage bite, work evil upon the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
