[[commentary]]
quote='''
In whom you also have been circumcised with a circumcision not made by hand, in the despoiling of the body of the flesh, in the circumcision of Christ, buried together with him in baptism: in whom also you have risen together through faith in the working of God, who raised him from the dead. Those are circumcised in Christ who, having cut away the worship of all human tradition, are joined to Christ, circumcised in heart, not in flesh, that is, serving in the spirit, not in the flesh; so that they may be converted from earthly things to heavenly, from human things to divine, from error to truth, coupled through love to their head and author.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
