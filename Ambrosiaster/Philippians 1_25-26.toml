[[commentary]]
quote='''
And although he considers it much better to be dissolved and to be with Christ, yet he declares that he knows this for certain, that he will remain in the flesh for the advancement of the faithful, so that their glory may abound in the Lord, redounding to the praise of the Apostle, when they see him again. For they make growth in knowledge, and are more fully grounded in faith. How great was the affection he had toward believers, that he does not choose what he says is much better for himself, but wills this, which benefits many, being certain also that this pleases the Lord, that it profits the salvation of many! Who, eager for the third heaven, would not spurn every present care? who, from desire for the upper paradise, would not set all these things aside? who, mindful of the secret words, would not shun human speech? who, after so many deadly perils, would not choose rest? But because he put love before all things, he followed this, which would profit the brethren.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
