[[commentary]]
quote='''
For how do you know, woman, whether you will save your husband? Or whence do you know, man, whether you will save your wife? He says this because those who do not shrink in horror from the name of Christ may perhaps believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
