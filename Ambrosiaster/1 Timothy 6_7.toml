[[commentary]]
quote='''
For we brought nothing into the world, and truly we cannot take anything away; but having food, and that with which we may be covered, let us be content with these. He declares with open voice that mortal men strive in vain after plenty and wish in vain to become rich, since they know that they have nothing of their own in the world. To what does human greed profit, except that it stands as its own enemy? For he brought nothing into the world; he will be able to take nothing away. Why does he strike anxiety into himself and seek to amass? He will go out from here such as he came. This Job too writes, and confesses in his suffering, saying: Naked I came out of my mother's womb, naked I shall return to the earth.... blessed be the name of the Lord (Job 1:21). But if the avaricious did not hoard to their own ruin, a few would lay up what could profit many, to the advantage of those very men as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
