[[commentary]]
quote='''
Because in him it pleased the Father that all fullness should dwell. The fullness is and remains in him; because he can always do all things, so that nothing is excepted which cannot be accomplished through him; so that he both made, and re-formed, and raised up what had fallen, and gave life to the dead. Hence he says: As the Father has life in himself, so he has given to the Son also to have life in himself (John 5:26); and: As the Father raises the dead and gives them life, so the Son also gives life to whom he wills. For the Father judges no one, but has given all judgment to the Son (ibid., 21–22). What is so just as that he should give to him the judgment of the things which he made through him, so that all the fullness of divinity should dwell in him, through this, as we have said, that he has all that power in himself: that is, that he is perfect God? For whoever does not have all these things is not God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
