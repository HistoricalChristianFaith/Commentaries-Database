[[commentary]]
quote='''
But God is faithful, who will establish them and guard them from evil. Since God has promised that his help will not be lacking in need to the faithful and to men of good life, for their strengthening, and these were emulators of the good as much in faith as in work; therefore he calls God faithful in his promises, because his providence was over them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
