[[commentary]]
quote='''
So he is no longer a slave, but a son. He is not a slave, because he has been taken away from the power of the Law, made a sharer in the blessing of God's own Son. And if a son, also an heir through God. There is no doubt that someone adopts a son for himself for this purpose, that he may leave him as his heir. But an inheritance comes from someone's death: how is it, then, that mortals are called the heirs of him who lives forever? But Scripture speaks in our manner, so that we can understand; for, to show that the father will give to his sons from his goods, it calls these things which he will give an inheritance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
