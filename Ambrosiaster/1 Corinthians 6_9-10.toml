[[commentary]]
quote='''
Or do you not know that the unjust will not possess the kingdom of God? By saying this he shows that they do not sin in ignorance, and that for this reason it must be punished more severely. For if the unmerciful are guilty before God, how much more the unjust? Do not be deceived: for neither fornicators, nor those who serve idols, nor adulterers, nor the effeminate, nor those who lie with males, nor thieves, nor the covetous, nor drunkards, nor revilers, nor robbers will possess the kingdom of God. He did not mention these things as though they did not know them, they among whom he stayed a year and six months, teaching the Gospel of God; but he reminded them, in order to restore in them reverence for the Law, and merit for the kingdoms of heaven (Acts 18:11).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
