[[commentary]]
quote='''
Awaiting the blessed hope and the coming of the glory of the blessed God and of our Savior Jesus Christ, who gave himself for us, to redeem us from all iniquity and to cleanse for himself a people abounding, zealous for good works. He says that this is the blessed hope of believers: that they await the coming of the glory of the great God, which is to be revealed with Christ as judge, in whom the power and glory of God the Father will be seen; so that they may obtain the reward of their faith. For to this end Christ redeemed us, that, following a pure life and filled with good works, we may be able to be heirs of the kingdom of God. These things speak and exhort, and rebuke with all authority. Let no one despise you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
