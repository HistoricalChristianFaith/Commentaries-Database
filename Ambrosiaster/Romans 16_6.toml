[[commentary]]
quote='''
Paul reminds these by the name of Mary, whom we understand to have labored especially diligently for their encouragement, so that they may give her thanks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
