[[commentary]]
quote='''
And I hope that you will know to the end, as you have also known not in part, that we are your glory, as you also are ours, in the day of our Lord Jesus Christ. He hopes that they are making progress, because they had already begun to be made better, having come to know the Apostle's affection toward them, and they boasted in him as sons in a most dear father. Hence the Apostle too testifies that his glory is seen in obedient sons; and that it ought to be seen at the time when it profits, that is, in the day of God's judgment. In saying this he admonishes them to persevere.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
