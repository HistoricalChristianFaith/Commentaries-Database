[[commentary]]
quote='''
I give thanks to my God that I speak in the tongue of you all. Since he said above that speaking in tongues is a gift of the Holy Spirit, he therefore refers it to God that he spoke in the tongue of all. And lest perhaps he should seem to say this as a rival, out of envy, he shows that he does indeed speak the tongues of all these, and that it is not of much profit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
