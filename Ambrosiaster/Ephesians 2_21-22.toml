[[commentary]]
quote='''
In whom the whole structure, fitted together, grows into a holy temple in the Lord, in whom you too are built together into a dwelling place of God in the spirit. This is the sense from which the Lord says: upon this rock I will build my Church. For the Savior took up into himself two peoples, and made them one in the Lord, just as a cornerstone too holds together two walls, made firm in the unity of the house; for the faithful are the surface of the temple of God, living in the spirit, so that they may become heirs of the heavenly dwelling.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
