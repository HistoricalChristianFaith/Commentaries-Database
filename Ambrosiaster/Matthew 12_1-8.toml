[[commentary]]
quote='''
WHAT DOES IT MEAN THAT, WHEN THE JEWS ACCUSED THE DISCIPLES OF BREAKING THE SABBATH BY RUBBING EARS OF GRAIN IN THEIR HANDS AND EATING THEM, THE SAVIOR PUT FORWARD THE EXAMPLE OF DAVID, BECAUSE HE ATE THE LOAVES WHICH IT WAS NOT LAWFUL TO EAT EXCEPT FOR THE PRIESTS ALONE (Matt. 12:1–4)? BY THIS THEY DO NOT SEEM TO BE EXCUSED, BUT RATHER TO BECOME GUILTY TOGETHER WITH DAVID: ESPECIALLY SINCE DAVID DID NOT DO THIS ON THE SABBATH. — The Savior wishes to expose the hypocrisy of the Jews by many examples, showing greater transgressions committed under the Law, and that no one dared to accuse them: so that he might show not only that the sabbath was broken once and again in the Law, but also that the priestly bread, with the priest himself permitting it, was unlawfully presumed upon; and what is more, by men under the lofty authority of his Law. For first Joshua son of Nun, by divine command, did not keep the sabbath; and when he did this, the walls of Jericho fell of their own accord (Josh. 6:15–20). How much more profitable it was not to keep the sabbath, but to keep faith! And the Maccabees, after first having been slaughtered, fought on the sabbath and triumphed over their enemies (1 Macc. 2:38, 41). And the priests, in order to attend to the rites of the Lord, disregarded the sabbath in the temple. But David, already anointed as king, after he had, by the power of God, slain the Philistine and stripped him of his arms, when he was on a journey and suffered the necessity of hunger, received bread from the priest (1 Sam. 21:6), which it was not lawful for him to eat. It was not lawful except in case of necessity; but it was lawful if necessity demanded it. Accordingly, the priest, seeing the necessity, did not refuse; and David, chosen by God, accepted it without hesitation. Such also is the case with the sabbath, for which reason circumcision too is not forbidden on the sabbath. For these commands which are not dangerous are to be observed in such a way that if, because of necessity, they are transgressed, it does no harm: because they were commanded not for salvation but for reverence. But that which is in no way permitted is never permitted, nor is it diminished by any necessity so that, once done, it does no harm. For what is always unlawful is forbidden by the laws because it is criminal. Those earlier things, however, which we said are sometimes lawful, are of the sort of legitimate fasts, which, when relaxed because of necessity, do not make people guilty if the cause is the stomach or the weakness of fevers. Knowing this, the Jews wickedly accused the disciples, as if they were breaking the sabbath, as was said above. But the Savior did not wish to anticipate for them the time of the fulfillment of the Law, lest they should rush further into madness; rather, from the past, from which they thought the sabbath ought more to be vindicated, he showed them to be slanderers: and they were confused not only in the matter of the sabbath, but also in the matter of the priestly bread, as has been shown above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 61: ON THE SABBATH AND THE SHEWBREAD DAVID ATE"
