[[commentary]]
quote='''
Exhort the younger men likewise to be continent, in all things showing yourself an example of good works, in doctrine, in integrity, in gravity, a sound word, irreproachable; that he who is on the opposite side may be abashed, having nothing worthy of reproof to say of us. Since youth is wont to go beyond measure, indeed to be the readier to fall, therefore he bids it be held in with wholesome reins, so that, bridled, it may be governed by the divine laws.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
