[[commentary]]
quote='''
Concerning, then, the foods of things sacrificed to images. Now he treats the matter itself, to show by reason that knowledge, when love is despised, not only does not profit but even does harm. We know that an image is nothing, and that there is no God but one. That is true; for among Christians there is one God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
