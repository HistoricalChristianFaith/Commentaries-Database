[[commentary]]
quote='''
And this I pray, that your love may abound more and more in knowledge and all understanding, that you may approve the things that are useful; that you may be sincere and without offense unto the day of Christ, filled with the fruit of righteousness through Jesus Christ unto the glory and praise of God. With God as helper, he wishes to instruct them in the order of the Christian discipline, so that, since they are established in faith, they may not be ignorant of the mystery of their belief; and that, knowing how to discern useful things from their contraries, they may adorn the teaching of the Lord with works of righteousness, producing the fruit of immortality unto the abundance of all good things, so that the teacher of the Gentiles may appear glorious in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
