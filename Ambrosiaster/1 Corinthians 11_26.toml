[[commentary]]
quote='''
For as often as you eat this bread and drink of the cup, you will proclaim the death of the Lord, until he comes. For because we have been set free by the death of the Lord, being mindful of this, in eating and drinking the flesh and blood which were offered for us, we signify that we have obtained in these the new testament, which is the new law, which delivers the one who obeys it to the heavenly kingdoms. For Moses too, having taken the blood of a calf in a bowl, sprinkled the children of Israel, saying: This is the testament which God has appointed for you (Exod. 24:8). This was a figure of the testament which the Lord called new through the prophets, so that that one which Moses handed down might be the old. The testament, then, was established with blood, because blood is the witness of the divine benefit. As a type of this we receive the mystical cup of blood for the protection of our body and soul; because the blood of the Lord has redeemed our blood, that is, has saved the whole man. For the flesh of the Savior is for the salvation of the body, but the blood was poured out for our soul, just as had been prefigured earlier by Moses; for so he says: The flesh is offered for your body, but the blood for the soul (Lev. 17:11); and therefore blood is not to be eaten. If, then, among the ancients there was an image of the truth which has now appeared and been made manifest in the Savior's coming, how does the old seem contrary to the new to the heretics, when they bear witness to each other?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
