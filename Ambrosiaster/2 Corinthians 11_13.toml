[[commentary]]
quote='''
For such false apostles are deceitful workers, transforming themselves into apostles of Christ. They are deceitful because they preached Christ for the sake of avarice, not with a religious mind nor as men sent, usurping for themselves the apostolic name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
