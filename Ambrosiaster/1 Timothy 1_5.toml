[[commentary]]
quote='''
For the end of the precept is love from a pure heart, and a good conscience, and unfeigned faith, from which some, straying, have turned aside into vain talk, wishing to be teachers of the Law, understanding neither what they say nor concerning what they affirm. Since love is the greatest of all, he said that it is the end, that is, the consummation of perfection, of all the precepts; provided, however, that it is from a pure heart and a good conscience. For true love cannot have a bad life nor a feigned faith; in these the whole Law is fulfilled, and the Prophets (Matt. 7:12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
