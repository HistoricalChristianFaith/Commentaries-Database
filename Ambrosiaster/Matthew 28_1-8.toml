[[commentary]]
quote='''
WHAT WAS THE REASON THAT THE LORD ALLOWED HIMSELF TO BE CRUCIFIED AT THAT TIME, WHEN THE JEWS WERE ABOUT TO CELEBRATE PASSOVER ON THE EIGHTH DAY BEFORE THE KALENDS OF APRIL? — The Savior accomplished all things in their proper places and times. For, in order to show that he had rightly created all things according to the will of the Father, he chose to redeem and restore the world by his passion at the same time when he had created it; that is, at the equinox, from which the world began and the day starts to grow longer than the night. Therefore, since he acted under the Roman rule, he had to suffer on the eighth day before the Kalends of April, when the Romans have their equinox. For at that time this part of the world was first illuminated, and from then on the day began to increase. And so by the Savior’s passion the world was then led from darkness into light. Therefore no rebuke can be seen to fall upon the Creator, since he restored the fallen creature at the same time as he had made it. Nor can the beginning of the creation of a fallen thing be blamed, when its restoration returns to that point. For he willed that the joy of renewal should be on the same day on which there had been dedication.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 55: ON THE TIMING OF THE CRUCIFIXION"
