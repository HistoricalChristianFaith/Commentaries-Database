[[commentary]]
quote='''
But now, knowing God, or rather known by God, how are you turning again to the weak and needy elements, which you wish to serve anew? He notes their grave offense; for after the knowledge of God they had begun to follow the things that belong to the pagans. And he adds more: that they did not know God, but rather were known by God. For when these were not seeking God, he called them to his grace; and these, ungrateful, had begun to turn to the things they worshipped at the time when they did not know God: so as to venerate the weak and needy elements, and not Christ with their whole mind, in whom all divinity dwells. He calls the elements weak and needy because they are imperfect; for to rule the world they need one another, but in Christ is perfect salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
