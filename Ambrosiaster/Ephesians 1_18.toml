[[commentary]]
quote='''
That the God of our Lord Jesus Christ, the Father of glory, may give you the spirit of wisdom and of revelation in the knowledge of him, to have the eyes of your heart enlightened, to this end, that you may know what is the hope of his calling, and what the riches of the inheritance of his glory in the saints. It is plain that he says he prays for them for this reason: that they may know the hope of their faith in the heavenly reward; because when they fully know what the fruit of believers is, they will become more eager to cultivate religion. For it seems that there will already be progress of this kind, because if they are so devout before they know the glory of the promise, they will necessarily become more eager when they have come to know it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
