[[commentary]]
quote='''
And everyone who strives in the contest abstains from all things: from all those things which that same discipline teaches are to be avoided, although they know that only one is to be crowned; how much more must this be observed by us, since salvation is promised to all! And they indeed do it to receive a corruptible crown, but we an incorruptible one. In this too the gift is very unequal, and for this reason we ought to be the more diligent, for whom a spiritual crown is kept, set not with earthly and withering flowers but with eternal gems, in the manner of a royal diadem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
