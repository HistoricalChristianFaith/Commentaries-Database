[[commentary]]
quote='''
But at the same time prepare a lodging for me as well; for I hope that through your prayers I shall be given to you. To make him more careful and more obedient, he indicates that he is going to come to him; for the absent are wont to be despised. And why does the Apostle not disdain to be still here, he who always suffered wearinesses and deadly perils, beatings, persecutions and chains, and whose rest was nowhere but in Christ alone? But for the advancement of believers, and that he might confound the enemies of the cross of Christ so as to increase the glory of God, he offered his flesh to sufferings, that he might acquire crowns of immortality for his soul and his body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
