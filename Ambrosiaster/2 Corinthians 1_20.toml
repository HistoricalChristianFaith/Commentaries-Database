[[commentary]]
quote='''
For as many as are the promises of God, they are in him: and through him the amen to God for glory through us. It is plain that truth is always in God, that is, the amen, made manifest through Christ, afterwards preached through the apostles to the glory of God, the powers of signs bearing witness that the things God promised through Christ our Lord are true. For it is the glory of God when all things are said to be from him, and through him, and in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
