[[commentary]]
quote='''
Scripture calls the one who is his imitator by his name, so that, because he received his name from his deed, anyone who has done an evil deed is not unjustly called “devil.” Therefore the Savior in this passage called Cain “devil,” because, as a rival of his works, when he envied his brother he committed murder, leaving an example of the cruelty of murder. So too the Devil, when he envied man who was made in the image of God, he increased the wickedness of his work, presenting a pattern of error. Therefore Cain also proved to be a liar, when God said to him, “Where is Abel your brother?” Imbued with his father’s hatred, bursting out into falsehood, he said, “I do not know” (Gen. 4:9); so that, having torn away his brother’s life, he pretended not to know where he was; therefore blinded by fury, that he answered God as though He were a man whom he thought he could deceive. The Jews, therefore, having become imitators of this sort of behavior, killed even the Lord Himself, choosing to have Cain the murderer rather than God as their father, so that they might become guilty of all the blood that was shed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 98: ON THE GOSPEL OF SAINT JOHN"

[[commentary]]
quote='''
And so in this passage he means Cain as the father of the Jews; since the Jews, wanting to be his imitators, put the Savior to death. Therefore he says that Cain, because he stained himself with murder and made himself guilty of death, did not stand in the truth. For from him the pattern of brotherly murder was first given. It is this same man of whom he says, “When he speaks a lie, he speaks from what is his own,” (Jn. 8:44) to show that each one sins only by his own will. But because he is an imitator of the Devil, he added, “For he is a liar, as is his father.” For when this Devil, in order to condemn the first man to death, did so, he pretended not to know what had been commanded him by God. So too Cain, when questioned, faked ignorance of where his brother Abel was, whom he had killed (Gen. 4:9). Therefore in this passage he called Cain the devil; and his father, the devil whose works he followed. For the son of a devil is a devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 90: IF THE DEVIL IS SATAN, WHY DOES CHRIST SAY THE JEWS HAVE THE DEVIL AS FATHER?"
