[[commentary]]
quote='''
Behold, I tell you a mystery: we shall all indeed rise; that is, believers as well as unbelievers. But we shall not all be changed. Now he signifies each one's merit in the resurrection, of what kind it will be in each individual.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
