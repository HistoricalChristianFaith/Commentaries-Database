[[commentary]]
quote='''
And I know such a man, whether in the body or outside the body, I do not know, God knows, that he was caught up into paradise and heard secret words which it is not lawful for a man to speak. On behalf of such a one I will boast. He says that he was caught up twice, that is, first from here as far as the third heaven, then into the heavenly paradise, the one of which the Lord told the thief that he would be with him in paradise, he says (Luke 23:43), the Father's paradise: there where the city of God, Jerusalem our mother, is also said to be. What wonder is it, then, if it is believed that after the resurrection the body, by then cleansed and made fine, will be immortal in the heavens (Gal. 4:26), when the Apostle does not doubt that a body still mortal could be lifted up into the heavens and taken into the heavenly paradise of God the Father?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
