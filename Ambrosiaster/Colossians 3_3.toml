[[commentary]]
quote='''
For you are dead, and your life is hidden with Christ in God. To the mind of the world Christ seems dead, and his disciples too, though it is certain that he lives with all of these. Therefore the life of Christ and of his own is hidden from the carnal and worldly, in God, outside the world, in his heavenly kingdom, in which they live.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
