[[commentary]]
quote='''
For neither was that made glorious which was glorified in this respect, because of the surpassing glory. It is manifest that what was seen as glorious in the face of Moses was not made glorious (Exod. 34:29). For since the glory of his face profited no one, but rather did harm, it did not have the fruit of glory, though not through its own fault but through that of those who sinned; yet in this respect there is no glory. But that is rather glory which abounds in grace; so that men, purified by the gift of God, the darkness wiped away, may be able to see the glory of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
