[[commentary]]
quote='''
Why? Because I do not love you? God knows. Having given his reason, he also gives the knowledge of God as witness of the love which he had toward them; that it was not because he did not love them that he was unwilling to accept, but rather the more because he loved them, so that this very thing might benefit them, as I have said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
