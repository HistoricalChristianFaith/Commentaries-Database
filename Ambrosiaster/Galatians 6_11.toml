[[commentary]]
quote='''
Know with what letters I have written to you with my own hand. He gives authority to his epistle; for when he says, I have written with my own hand, he wants these letters to be obeyed. For where there is a hand in his own writing, it cannot be called false; lest perhaps those who had been ensnared, being unwilling to be reproved, should make excuses about the epistle, as though it were either false or not the Apostle's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
