[[commentary]]
quote='''
WHY WAS THE SAVIOR BAPTIZED, SINCE HE WAS BORN HOLY, AND WAS CALLED CHRIST THE LORD AT HIS VERY BIRTH, WHEN BAPTISM EXISTS FOR THE SAKE OF PURIFICATION AND OF SIN (Luke 2:11; Matt. 3:16)? — It is true and evident that the Savior did not need baptism; for Christ was not made but was born, as the angel said to the shepherds, “Behold, today there is born for you a Savior, who is Christ the Lord.” Indeed, John, knowing His holiness, tried to prevent Him from being baptized; but the Savior insisted that it had to be done, not, of course, on account of any sin of His, but for the fulfillment of righteousness. For it was fitting that He Himself should be an example to the future children of God, whom He taught to become children of God through Baptism; and since He promised that the Holy Spirit would be given by God to believers, He had to show this visibly in Himself, so that, once this was recognized, believers might hope to possess the Holy Spirit invisibly. For the Savior, being born of the Holy Spirit, assuredly had a purified body. The anointing of His flesh was given spiritually in the womb of the Virgin. For the Holy Spirit purified that which proceeded from the Virgin Mary into the body of the Savior; and this is the anointing of the flesh of the Savior’s body. Therefore He was called Christ also at His birth. For what God used to grant through the anointing with oil by the ministry of the prophets to those who were anointed as kings, the Holy Spirit granted to the man Christ, with an additional explanation: the predecessors of Christ received only the authority of rule through anointing, but the Savior, as man, received both authority when He was born and purification when He was born. For it would have been unfitting that the Son of God should be born in a body subject to sins. Therefore, since He took up the cause of man and taught that through rebirth people become children of God, He had to be baptized, in order to show this as confirmed in Himself. What is said is easily proved and praised if it is seen to be done by the teacher; and so, too, the marks of virtue had to be revealed, so that, now appearing as the Son of God, He might, through the mystery of regeneration, bring healing to the sufferings of the body, and be an example to His future brothers, because through regeneration each person receives the power of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 49: WHY WAS THE SAVIOR BAPTIZED"
