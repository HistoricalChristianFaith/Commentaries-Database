[[commentary]]
quote='''
If the whole body were the eye, where is the hearing? If the whole were hearing, where is the smelling? That is, if all were of one office and work, how would the rest of the body's need be fulfilled, since it is evident that many offices are needed for governing the body?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
