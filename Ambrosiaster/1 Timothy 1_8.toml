[[commentary]]
quote='''
But we know that the Law is good, if one uses it lawfully, holding this as certain, that the law is not laid down for the righteous, but for the unrighteous and disobedient, for the ungodly and sinners, for the wicked and profane, for parricides and matricides, for fornicators, murderers, those who lie with males, kidnappers, liars, perjurers: and whatever else is opposed to sound doctrine, which is according to the Gospel of the glory of the blessed God, which has been entrusted to me. He does not deny that the law which was given through Moses is good; yet in such a way that its sense be known, and that it be received as it was given. For he knows the Law, and for what cause it was given, who, once Christ has been preached, abandons it in that part in which it is called the law of deeds; but in what concerns the love of God he uses it, asserting and affirming the things which were spoken by the Savior in the Law and the prophets. For he uses the Law lawfully who can distinguish the things that were given for a time from those that are perpetual: and knows that the things which pertain to the mystery of Christ ought no longer to be kept for the future, as though he who has already come were believed to be still to come. If then all things are taken in their own places, they are good: if not, they will be bad for one who asserts them perversely; for it is a sin not to expound each thing in its own place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
