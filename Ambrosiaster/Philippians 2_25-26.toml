[[commentary]]
quote='''
But I thought it necessary to send to you Epaphroditus, my brother and fellow soldier, and your apostle, and the minister of my work; since he longed for you all, and was impatiently anxious, because you had heard that he had been sick. For indeed he was sick near to death: but God had mercy on him, and not on him only, but on me also, lest I should have sorrow upon sorrow. All these things are plain; for he indicates that he will send Epaphroditus to them with this epistle. For both were sorrowful in their longing for one another on account of his sickness, both the people and Epaphroditus; so that on seeing him they might be refreshed by his recovered health, and he might be free of the anxiety he bore to see them. For he had been made their apostle by the Apostle, when he sent him to them to exhort them: and because he was a good man, he was longed for by the people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
