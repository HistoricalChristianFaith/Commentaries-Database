[[commentary]]
quote='''
But now God has placed the members, each one in the body, as he willed. He says that the will of God, because it is provident and rational, has fitted the members to the body, so that nothing may be lacking to the body, but it may be perfect with many members.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
