[[commentary]]
quote='''
Therefore we also received consolation. He says that he received consolation, and through this also gives it. He received it when he learned that those whom he had reproved wished to correct themselves, so as to reform themselves through repentance; and he gives it while he calls them back to the Church, lest, grieved for a long time, they should despair of themselves and turn aside to a public and deadly way of life. But in our consolation we rejoiced still more and more over the joy of Titus, because his spirit was refreshed by all of you. Hearing that those rebuked by the first letter wished to correct themselves, he received consolation. But learning from Titus that they felt grief for their error, he was increased in consolation, filled with joy; because their will had begun to be proved in deed, Titus, a fit witness, reporting this with gladness of heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
