[[commentary]]
quote='''
You cannot drink the cup of the Lord and the cup of demons; you cannot share in the table of the Lord and the table of demons. As the Lord also says: You cannot serve God and mammon (Matt. 6:24): because he who drinks the cup of demons insults the cup of the Lord: and when he shares in the table of demons, he raises an outcry against the table of the Lord, that is, the altar, and crucifies the body of the Lord. For Christ was crucified for this reason, that he might destroy the works of the devil. He, then, who does the works of the devil fights against Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
