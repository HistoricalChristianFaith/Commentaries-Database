[[commentary]]
quote='''
For though he was crucified from our weakness, yet he lives from the power of God. It is true that Christ was crucified because of our sins, so that, destroying death, he might free from it those who believe in him. So he suffered himself to be made weak for our sake, that he might conquer death for us. For descending to the underworld, he who knew no sin at all, and was slain as though a sinner, blotted out the bond of Adam, so that thereafter those who died under his name should not be held by death, but should have confidence of going to the heavens. So, slain on account of our weakness, he came back to life by the power of the Father, that he might prove to the disciples that what he had taught was true, by the example shown in himself. For we too are weak in him. This pertains to the person of the apostles, who, preaching him, that is, Christ, were made weak, while they were subjected to injuries, imprisoned, beaten. But we live with him from the power of God toward you. It is plain that if they were made weak by the faithless, in the eyes of believers this was not weakness but advancement; for the faithful become more powerful from this, while they are made weak. So death inflicted by the faithless is life with respect to believers; for by the power of God they will rise again, to live with Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
