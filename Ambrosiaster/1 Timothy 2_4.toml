[[commentary]]
quote='''
This is, he says, eternal life, that they may know you, the only true God, and Jesus Christ whom you have sent (John 17:3). If God, who is certainly called almighty, wills all men to be saved, is his will not fulfilled? But in every utterance a sense and a condition lies hidden; hence the apostle Peter says: Every Scripture needs interpretation (2 Pet. 1:20). For God wills all men to be saved, but if they come to him; for he does not so will it that the unwilling should be saved: but he wills them to be saved if they themselves also will it. For certainly he who gave the law to all excepted no one from salvation. Does not a physician set himself up in public precisely to show that he wishes to save all, provided, however, that he is sought out by the sick? For it is not true salvation if it is bestowed on one who is unwilling: nor can he rejoice in the salvation he has received who received the medicine against his will, if that can even happen; not to say that the medicine cannot have its effect unless the sick man has applied his mind to it; because this medicine is not bodily but spiritual, and it profits neither the doubtful nor the unwilling. For it is faith that gives salvation, and unless the mind has received it with its whole will, it will not only profit nothing, but will even do harm. For the grace of faith has this power: that it pours a divine remedy into those devoted to it, but on the undevoted it confers a disease through which the whole man perishes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
