[[commentary]]
quote='''
The greeting itself is mine, by the hand of Paul. Be mindful of my chains. The grace of our Lord Jesus Christ be with you. To confirm the epistle he says it is subscribed with his own hand, reminding them to keep in mind his ordeals, which he was suffering for the salvation of the Gentiles, and to show themselves such that he would not take it ill to suffer injuries for them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
