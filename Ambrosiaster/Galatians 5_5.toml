[[commentary]]
quote='''
But we by the spirit, from faith, await the hope of righteousness; for in Christ Jesus neither circumcision avails anything, nor uncircumcision: but faith, which works through love. What he says is plain: that the hope of justification is in faith through the spirit, not through the works of the Law; for in faith God is served spiritually, by devotion of mind and purity of heart. Hence the Lord says to the Samaritan woman: God is spirit; and those who worship him must worship in spirit and truth (John 4:24).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
