[[commentary]]
quote='''
The cup of blessing which we bless, is it not the communion of the blood of the Lord? The bread which we break, is it not the communion of the body of the Lord? Because we, being many, are one bread, one body; for we all partake of the one bread and of the one cup. Since we are one, members one of another, he says that we ought to be of one mind; so that one faith may have one mind and one work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
