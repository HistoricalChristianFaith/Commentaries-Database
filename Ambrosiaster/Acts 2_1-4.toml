[[commentary]]
quote='''
WHAT WAS THE ORIGIN OF THE FEAST OF PENTECOST AND THE REASON FOR ITS INSTITUTION? — There is no doubt that every aspect of our religion is strengthened by ancient testimony and marked by the entitlement of the Old Law. For all past events of the Old Law are known to have been done and set forth as a figure of our future faith, so that we might not hesitate to hold the truth, when we see that the things which we now both hear and believe were predestined before the ages, commended not only by words, but also by the powers of signs. But now the question is whether they are understood by us in the same way as they were prefigured, so that we may rightly recognize where and for what reason the day of Pentecost is derived. For the meanings of the Lord’s Scriptures are opened to those who are diligent and devout, and closed to the negligent. Nor was it fitting that things reserved for the worthy and deserving should be casually seen by all. Pentecost, therefore, which is the fiftieth day counted from Easter, has this basis: just as after a week the Lord’s Day is the first day, on which the mystery of Easter was fulfilled for the redemption of human salvation, because after the cycle of seven days it is always necessary to return to the first, so that it may be shown that the age of the world is completed in the number seven and comes to rest, so also after seven weeks the first day is Pentecost. Therefore Pentecost is never on any other day than the Lord’s Day, so that everything that contributes to human salvation may be known to have been both begun and fulfilled on the Lord’s Day. For on the Lord’s Day the world was made, and after the Fall it was again renewed on the Lord’s Day; a figure of this renewal was first given in circumcision, in which there was a sign of the faith to come. For after the week, the eighth day is, in mystery, the first. This is the day which the Lord has made. He made that one day from which the other courses of days would be derived. And therefore on this very day He rose, which He had made; and according to the number explained above, on this very day He gave the Law on Mount Sinai through His servant Moses: so that just as the lamb was a figure of the Lord’s Passion in the sacrament of Easter, so the giving of the Law was a figure of the preaching of the Gospel. For on the same day, that is, on Pentecost, the Law was given, on which also the Holy Spirit descended upon the disciples, so that they might receive authority and know that they had the right to preach the Gospel. This event is confirmed by a double testimony, because it is shown to have been predestined, and is also proved by the revealed outpouring of the Holy Spirit to be divine and heavenly, in order to bear witness to our Law. For when unlearned men, unknown to one another, speak the mighty works of God in various languages, they show that they are divinely inspired. Therefore to the sons of Israel the Law was given by Moses on the third day of the third month, as is contained in the book of Exodus (Exod. 19:16), which day, counted from the fourteenth day of the first month, on which day the Passover was celebrated in Egypt (Exod. 12:18), is the fiftieth day, that is, Pentecost. Therefore it came about that, for the preaching of the law of faith, on Pentecost the Holy Spirit descended upon the Apostles (Acts 2:1–4), so that the deeds of the ancients might be regarded as images of future things, for the assurance of our faith, because what has been proclaimed from the beginning cannot be considered false. Therefore the time of forgiveness and renewal is described in the fiftieth Psalm, so that the same providence of the fiftieth day, which is also that of the first, might be recognized. From this it happened that manna was given for the first time on the first day, which is the Lord’s Day, from heaven to the people of the Jews; and this is proved by the sequence of six days during which they gathered it, and on the seventh day, that is the Sabbath, they rested (Exod. 16:22, 23). Now manna is a type of spiritual food, which, through the Lord’s Resurrection, became reality in the mystery of the Eucharist. All things therefore were done so that they might return unharmed to the cause of the first resurrection, and that Satan might not boast but grow dull, he who cast man down by false hope, lest man remain in that which was brought about through Christ the Lord. Now it remains that we prove whether the things we have said are to be understood as we have already mentioned. The first month, in which the Passover on the fourteenth day was celebrated in Egypt, had this day as Wednesday. Therefore also the Law was given on a Wednesday. This may be understood from the fact that on the fifteenth day of the second month after the departure of the sons of Israel, a Sabbath is seen to have occurred; therefore the flock of quails was not sent to them in the daytime but in the evening. In the morning, however, manna rained from heaven (Exod. 16:13, 14), that is, on the Lord’s Day, which is the first found in repetition after the week. Indeed, for six consecutive days they gathered manna, and on the seventh day, which is the Sabbath, they rested. From this day therefore up to the third day of the third month, on which the Law was given, examine and you will find that it was a Wednesday when the Law was given. For from the fifteenth day of the second month, when it was a Sabbath, up to the third day of the third month, on which the Law was given, there are nineteen days. Hold therefore these nineteen days, and go back to the fifteenth day of the second month, when it was a Sabbath, which, counted from the first day, is the fourteenth; and go back to the first day of the second month, and you will have another fourteen days; add these to the nineteen mentioned above, and you will find that the first day of the second month was a Sabbath. Add further to the beginning of the first month seventeen days, because thirteen days of the first month, which were before Passover, must be subtracted: for the Passover took place on the fourteenth day of the first month. With thirteen days removed, and seventeen added, you will find that the fourteenth of the first month was a Wednesday. And so that you may not suffer weariness in reading, or carefully examine each part of the question, I give you a summary, so that you may be certain of the number of days from Passover up to the giving of the Law, and from this more easily learn on which weekday Passover took place. The Law was given on the third day after the second month. There are therefore two months and three days. Subtract from these the thirteen days which were before Passover, and fifty days remain. Since the Law was given on a Wednesday, this is easily seen Manna was given on the first weekday, because they gathered it for six continuous days, and this first weekday was on the sixteenth day of the second month. From this first weekday, therefore, up to the eighteenth day, on which the Law was given, you will find a Wednesday. And from Wednesday, whether you count forward or backward to the fiftieth day, it is a Wednesday: for the Jews celebrated Passover in Egypt on a Wednesday, and on a Wednesday they received the Law; but on a Thursday they set out from Egypt. Therefore, the dedication of the Law is Pentecost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 95: ON THE ORIGIN OF THE FEAST OF PENTECOST"

[[commentary]]
quote='''
WE MUST ASK WHETHER THE APOSTLES HAD THE HOLY SPIRIT DURING THE TIME WHEN THEY WERE ON EARTH WITH THE LORD, BECAUSE AMONG MANY THINGS THE EVANGELIST SAYS, “THE SPIRIT HAD NOT YET BEEN GIVEN, BECAUSE JESUS HAD NOT YET BEEN GLORIFIED” (John 7:39); AND IN ANOTHER PLACE, “IF YOU LOVE ME, KEEP MY COMMANDMENTS, AND I WILL ASK THE FATHER, AND HE WILL GIVE YOU ANOTHER PARACLETE, THAT HE MAY REMAIN WITH YOU FOREVER, THE SPIRIT OF TRUTH, WHOM THE WORLD CANNOT RECEIVE, BECAUSE IT NEITHER SEES HIM NOR KNOWS HIM; BUT YOU KNOW HIM, BECAUSE HE DWELLS WITH YOU AND IS IN YOU” (John 14:15-17). WHAT DOES THIS MEAN? HE DENIES THAT THE SPIRIT WAS GIVEN BEFORE THE PASSION; YET HE PROMISES THAT HE WILL ASK THE FATHER TO SEND HIM. AGAIN HE ADDS THAT THE SPIRIT WAS WITH THEM AND REMAINED AMONG THEM. AFTER THE RESURRECTION, HOWEVER, IT IS WRITTEN THAT HE BREATHED ON THEM AND SAID, “RECEIVE THE HOLY SPIRIT” (John 20:22). AND AT PENTECOST IT IS WRITTEN THAT THE HOLY SPIRIT DESCENDED UPON THE APOSTLES (Acts 2:1-4). I SEE SO MANY DIFFICULTIES IN THIS MATTER THAT I DO NOT KNOW WHAT OUGHT TO BE HELD. — In all these things that have been set forth, there is not one single cause. For the forms of the individual causes have been briefly indicated; for although there is one Spirit, he has many gifts. Therefore, when the Holy Spirit is mentioned, his office must be understood, in which way he is meant. For that he was both with them and was yet to come is not false, provided you do not refer this to the person, but to the nature. For Christ promised that another would come from the Father, so that since their divinity is indistinguishable, the Holy Spirit should not be thought absent when Christ is present, and when the Holy Spirit comes and appears, Christ should be considered present as well. Therefore, when he promises that he will come, he says, “You will see him, because he will dwell with you and will be in you,” (Jn. 14:17) so that the Apostles might be confident that after the Lord’s Ascension they would not have a lesser or inferior shepherd or king for their protection. For there is no doubt that the Spirit was not given to believers except, as the Evangelist testifies, after the Lord, having conquered death, rose again and was glorified. For these are the words of the triumphant Lord himself, who says, “For John indeed baptized with water, but you will be baptized with the Holy Spirit, whom you will receive not many days from now” (Acts 1:5); this he is seen to have said at the time when he determined to ascend to the Father. As for that which is read, that the Lord breathed upon the disciples a few days after his Resurrection and said, “Receive the Holy Spirit,” (Jn. 20:22) this is understood to be the transfer of ecclesiastical power. For since all things in the Lord’s tradition are carried out through the Holy Spirit, therefore, when the rule and pattern of this discipline are handed down to them, it is said to them, “Receive the Holy Spirit.” And because this truly belongs to ecclesiastical jurisdiction, he immediately added, saying, “Whose sins you retain, they shall be retained; and whose you forgive, they shall be forgiven” (John 20:23). This breathing, therefore, is a certain grace poured in through ordination, by which they might be held in greater esteem. Therefore the Apostle says to Timothy, “Do not neglect the grace that is in you, which was given you through the laying on of the hands of the presbytery” (1 Tim. 4:14). It had to be done once, so that thereafter this tradition might not be believed to exist without the gift of the Holy Spirit. For just as in the Savior a visible pattern was given, so that after Baptism the Holy Spirit might from this time be believed to be given invisibly to believers without doubt, so also in the case mentioned above a pattern was given in the beginning, so that from then on the Holy Spirit might be believed to be poured into ecclesiastical tradition. But in order that the Apostles might work miracles while the Lord was present, power was given, as it had been previously to the Prophets. Therefore the forms of three offices of the gift of the Holy Spirit were shown in the Apostles. The first is this, which relates to ecclesiastical jurisdiction in the work of regeneration and other offices. The second is that which was given at Pentecost, which is general; for the Holy Spirit fell not only upon the Apostles, but also upon all believers. The third form is that which was granted only to the Apostles for the working of signs and wonders, until the seeds of faith could be sown for growth. For the miracles performed by the Apostles are the seeds of faith; for they themselves were appointed overseers of this truth, who, by signs and wonders, might bear witness that our faith is not irrational. For there is no greater proof of truth than power; this is what condemns all earthly philosophy, because it has always labored only in words, not having the testimony of power, which might show that what was established by words was stable. Therefore the Holy Spirit is given once, in a general way, to all believers, by whom they are proved to be sons of God, while he remains in them. But in the working of signs and wonders, he does not remain in man, but comes when called, or suggests what is necessary, and departs. Likewise, in tradition or ordination from without he bestows grace, also bringing protection to those devoted to the faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 93: WHETHER THE APOSTLES HAD THE HOLY SPIRIT BEFORE PENTECOST"

[[commentary]]
quote='''
WE MUST ASK WHETHER THE APOSTLES HAD THE HOLY SPIRIT DURING THE TIME WHEN THEY WERE ON EARTH WITH THE LORD, BECAUSE AMONG MANY THINGS THE EVANGELIST SAYS, “THE SPIRIT HAD NOT YET BEEN GIVEN, BECAUSE JESUS HAD NOT YET BEEN GLORIFIED” (John 7:39); AND IN ANOTHER PLACE, “IF YOU LOVE ME, KEEP MY COMMANDMENTS, AND I WILL ASK THE FATHER, AND HE WILL GIVE YOU ANOTHER PARACLETE, THAT HE MAY REMAIN WITH YOU FOREVER, THE SPIRIT OF TRUTH, WHOM THE WORLD CANNOT RECEIVE, BECAUSE IT NEITHER SEES HIM NOR KNOWS HIM; BUT YOU KNOW HIM, BECAUSE HE DWELLS WITH YOU AND IS IN YOU” (John 14:15-17). WHAT DOES THIS MEAN? HE DENIES THAT THE SPIRIT WAS GIVEN BEFORE THE PASSION; YET HE PROMISES THAT HE WILL ASK THE FATHER TO SEND HIM. AGAIN HE ADDS THAT THE SPIRIT WAS WITH THEM AND REMAINED AMONG THEM. AFTER THE RESURRECTION, HOWEVER, IT IS WRITTEN THAT HE BREATHED ON THEM AND SAID, “RECEIVE THE HOLY SPIRIT” (John 20:22). AND AT PENTECOST IT IS WRITTEN THAT THE HOLY SPIRIT DESCENDED UPON THE APOSTLES (Acts 2:1-4). I SEE SO MANY DIFFICULTIES IN THIS MATTER THAT I DO NOT KNOW WHAT OUGHT TO BE HELD. — In the matters he has set forth, there is not just one cause. Briefly, etc. For there is no doubt that the Spirit was not given to believers until after the Lord, having conquered death, was glorified. For before the Ascension the Lord gave the disciples a pattern of how those who had been baptized ought to receive the Holy Spirit, a pattern which is now preserved by the bishops. Therefore, three forms of the office of the gift of the Holy Spirit were given to the Apostles. The first is the general one, which was given at Pentecost; for the Holy Spirit fell not only upon the Apostles, but also upon all believers, so that men of one nation spoke the mighty works of God in different tongues. The second form is specific. For it does not belong to all believers, but only to bishops, that by the laying on of hands they may give the Holy Spirit to the baptized; this, among bishops, may be called general. The third form is that which was granted to the Apostles alone, in the working of signs and miracles for the increase of faith. For the powers wrought by the Apostles are the seeds of faith. Therefore, in due order of offices, the Holy Spirit was given to the Apostles: first, that He might fall upon them, as upon the other believers, at Pentecost. Then, as the first priests, that, like bishops, they might lay hands on believers and give them the Holy Spirit. For that wonders should be done through the Apostles is a grace of time, not of persons; but they are blessed because the time found them when the Lord poured out His gift upon the earth, that they might receive power, as an example for believers, to work powers through the Holy Spirit. But when, while the Lord was present, they were sent to cast out demons and perform the other powers, power was given to the Apostles to command demons, or other ailments of the sick, without the call of the name, and the effect of salvation followed. This, namely, is the power of reason which the prophets used, Elijah and Elisha, in the working of powers. Finally, the Savior says to His disciples, “Amen, amen, I say to you; if you ask anything of the Father in my name, He will give it to you. Until now you have asked nothing in my name; ask, and you shall receive” (John 16:23–24). Therefore, since they worked powers without the invocation of the name, as I said above, yet not entirely without the power of the name. For by the fact that they were sent by Him who was a terror to demons and to sufferings, by that very fear the demons fled, and illnesses were cured. Therefore the name of the Lord was working silently. Finally, the Apostle Peter says to the Jews among other things: “In the name of Jesus Christ of Nazareth, whom you denied and crucified, this man stands before you whole” (Acts 3:16); indeed, no other name has been given under heaven in which we must be saved.
'''
