[[commentary]]
quote='''
And we have sent with him our brother, whose praise is in the Gospel throughout all the churches; and not only that, but he was also appointed by the churches as companion of our journey in this grace, which is ministered by us through the glory of the Lord and our care. They commend him because he was unknown to them, so that they might know in how good a reputation they already stood, to whom such men were being sent; so that these might rejoice together with them, increasing them in faith in the working of God, to whose glory the vicars of Christ were earnestly doing this, so that God, the maker of heaven and earth, might be acknowledged in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
