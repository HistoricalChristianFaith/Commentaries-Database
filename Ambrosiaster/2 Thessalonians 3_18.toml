[[commentary]]
quote='''
The grace of our Lord Jesus Christ be with you all. This greeting was written by the hand of the Apostle, in which he wishes the grace of our Lord Jesus Christ to be with them. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
