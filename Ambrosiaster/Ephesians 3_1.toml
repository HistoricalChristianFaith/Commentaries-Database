[[commentary]]
quote='''
For this reason I Paul, the prisoner of Christ Jesus for you brothers. Since he has shown the disposition of the divine mercy toward the salvation of the Gentiles, which existed before the world, he now declares that by God's provision, Christ sending him, he discharges the embassy of this gift. For the Lord after his resurrection sent his apostles in his stead to preach (Matt. 28:19), directing this one to the conversion of the Gentiles; for thus he said to him: Go, I will send you far away to the Gentiles (Acts 22:21). He has therefore used the Lord's word when he says: Peace to you who are far off, and to those who are near.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
