[[commentary]]
quote='''
Do not extinguish the Spirit: do not despise prophecies. Test all things: hold fast what is good: abstain from every evil appearance. He says this so that one who speaks through the spirit should not readily be forbidden (for it is extinguished if the fervor of one beginning to speak is lulled to sleep by contradiction), lest perhaps, not understanding that spiritual things are being said by him, they do injury to the Holy Spirit and sin through ignorance; and that anyone who, as it were, reveals the Scriptures ought not to go without a patient hearing, but that all that is said should be examined, and so judged; lest perhaps, while they reject the grace given to a brother, they resist its author.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
