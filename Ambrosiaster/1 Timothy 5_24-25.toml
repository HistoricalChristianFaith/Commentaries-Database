[[commentary]]
quote='''
By the reasoning above, just as evil deeds, so also good deeds are manifest; for a good life and modest acts cannot be hidden, which, when godliness is joined to them, make men perfect: but just as some evils are hidden for the present, so also are some good things; for no one can know everything in men, but from what he sees and hears he tests and judges. For he weighs whether the things that are said fit him of whom they are said, whether good or bad: but whatever has been hidden from men will become manifest on the day of judgment. For this reason, therefore, these things were said, that such men may know that they have a graver case than the rest. For he is worse who, though he is evil, shows himself good, than he who is openly evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
