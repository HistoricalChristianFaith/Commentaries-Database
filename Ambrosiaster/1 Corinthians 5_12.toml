[[commentary]]
quote='''
For what is it to me to judge those who are outside? It is true that a bishop cannot judge the faithless; but with a brother in whom these vices are found, he teaches that not only are the mysteries not to be eaten, but not even common food, so that he may blush when he is shunned, and correct himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"

[[commentary]]
quote='''
Do you not judge those who are within? One judges when he discerns which brother he should cleave to, whom he should reprove, whom he should shun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
