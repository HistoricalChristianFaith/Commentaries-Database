[[commentary]]
quote='''
But I, brothers, if I preach circumcision, why do I still suffer persecution? What he says is plain; for he was held as an enemy by the Jews, and they did not cease from persecuting him, because he taught that circumcision no longer stood. Finally, when the Jews pressed him and repeatedly brought false accusations against him, seeing a biased judge, he was forced to appeal to Caesar. Then the scandal of the cross has been made void (Acts 25:11). The preaching of the cross was a scandal to the Jews, because it made void the sabbath and circumcision. But if he admitted circumcision, there would be no scandal, and the Jews would be at peace with us. For they said of the Savior: This man is not from God, who does not keep the sabbath (John 9:16).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
