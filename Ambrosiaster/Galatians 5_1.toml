[[commentary]]
quote='''
Stand, therefore, and do not be held again by the yoke of slavery. He warns them to stand in the grace they have received, lest, going back to the old things, they lose the gift of freedom which they had obtained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
