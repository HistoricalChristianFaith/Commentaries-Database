[[commentary]]
quote='''
But the spiritual man judges all things, and he himself is judged by no one. Since true reason belongs to the spiritual, that is, to believers (for each is named by what he believes), therefore they themselves judge all things. For by their example unbelief will be judged, but they themselves will be judged by no one. For who would condemn one who speaks the truth? For since it is established that all the enemies of the faith hold false things for true, their accusation has already been brought to nothing, condemned by the judgment of truth; for he who has not believed, says the Lord, has already been judged (John 3:18).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
