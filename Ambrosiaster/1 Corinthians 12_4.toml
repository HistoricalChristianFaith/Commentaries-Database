[[commentary]]
quote='''
Now there are divisions of graces. He does not want this to be ascribed to human merits, but to the grace of God, for the honor of his name; for just as he who says Lord Jesus says it in the Holy Spirit, whatever sort of man he may be, so also he who is placed in the position of the order of ecclesiastical office has grace, whatever sort of man he may be: not indeed his own, but that of the order, through the efficacy of the Holy Spirit. Hence at the beginning too he says: Neither is he who plants anything, nor he who waters, but God who gives the increase (1 Cor. 3:7).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
