[[commentary]]
quote='''
God of peace is Christ, who said: "My peace I give to you, my peace I leave you." He is also God of love; for again he says: "A new commandment I give to you, that you love one another. And in this all will know that you are my disciples, if you have love for one another." However, there is a different peace of God and a different peace of the world; for even the wicked and impure have peace, but it is for their damnation; for the peace of Christ is free from sins. Therefore he avoids treachery, despises deceit, and resists evil deeds. This is pleasing to God and friendly, but hostile to the devil. Whoever possesses this will have both love and their God for perpetual protection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="COMMENTARY ON 2 CORINTHIANS 13.11.2"

[[commentary]]
quote='''
HOW IS IT TO BE UNDERSTOOD WHEN THE SAVIOR SAYS, MY PEACE I GIVE TO YOU; MY PEACE I LEAVE WITH YOU: NOT AS THIS WORLD GIVES, DO I GIVE TO YOU (John 14:27)? — Whoever receives the peace of the Savior will suffer the hatred of the world. For unless a person becomes separated from the Devil, he will not have peace with Christ. For no one can serve two masters (Matt. 6:24). Therefore, the one who faithfully keeps the law of God is the one who is at variance with the world. Armed with the peace of Christ, he crushes the darts of all his adversaries. For who would dare to attack one whom he knows to be a friend of the King? Yet the world gives peace in a different way from that which the Savior promised to give. For the world gives peace either out of fear or out of appeal. But the Savior, since he is the strongest of all and fears no one, gives peace unasked. This, then, is the peace of the Savior, which is given for this reason: that it may be a defense against enemies. Peace indeed is called by one and the same name, yet the peace of God and the peace of the world are separated by a massive distance. For this peace is fragile, that one strong; this one carnal, that one spiritual; this one earthly, that one heavenly; this one arises from necessity, that one from free will. For Christ, needing nothing, offers peace to the weak and unarmed, the Lord to his servants, the good to the wicked, God to human beings. Rightly, therefore, he says, Not as this world gives, do I give to you: in saying this, he wished his kindly good will to be understood. For whereas everyone else gives peace so that he himself may benefit, he, namely, the Savior, gives it in such a way that it may benefit not himself, but those to whom he gives it. Therefore the world gives peace in a different manner from that in which the Savior has given it. And the peace of the world does not teach a good life, does not encourage patience, does not stir up to righteousness, does not encourage to be merciful, does not promise eternal life. For whoever receives the peace of Christ will be a stranger to the corruptions of this world, which wage war against the soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 92: ON THE PEACE CHRIST GIVES"
