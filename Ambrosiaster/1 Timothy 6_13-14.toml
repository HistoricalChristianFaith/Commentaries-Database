[[commentary]]
quote='''
I command you in the sight of God, who gives life to all things, and of Christ Jesus, who testified the good confession under Pontius Pilate: that you keep the commandment spotless, irreproachable unto the coming of our Lord Jesus Christ: whom in his own times the blessed and only mighty one will show, the King of kings and Lord of lords, who alone has immortality, and dwells in light inaccessible, whom no man has seen nor can see, to whom be honor and eternal power, amen. With great vigilance and foresight he gives precepts to the ruler of the Church; for in his person the salvation of the whole people consists. He is so circumspect not because he is anxious about Timothy's diligence, but on account of his successors, so that by Timothy's example they might keep the ordering of the Church, and they too, handing on a pattern to those who were to come, might begin from themselves. Thus he says: that you keep the commandment spotless until the coming of our Lord Jesus Christ. This he binds so tightly that he testifies that he commands it before God and Christ; and, to strike terror, he recalls the passion of Christ, of which passion he must needs become guilty who spurns that for which Christ suffered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
