[[commentary]]
quote='''
Labour as a good soldier of Christ Jesus; for no one serving as a soldier to God entangles himself in worldly business; so that he may please him to whom he has proved himself. What he says is plain; because no one can serve two masters (Matt. 6:24); for worldly business must needs serve avarice: and unless men have lied, they cannot have concluded it. It is, then, a sin, but a light one. But the churchman proves himself to God for this reason: so that, devoted to him, he may fulfil the office which he has pledged, careful in the things of God, a stranger to worldly business; for it is not fitting for one man to have a double profession.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
