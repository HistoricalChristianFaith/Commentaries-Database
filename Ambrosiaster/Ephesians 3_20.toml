[[commentary]]
quote='''
Now to him who is able to do all things, and more superabundantly than we ask or understand, according to the power which works in us: to him be glory in Christ Jesus, and in the Church, and unto all the ages of ages. Amen. He refers this to the person of the Father: so that, because he knows better what things are useful, and what things are not to be asked for, and when they are to be given, and of what kind and how great they need to be, he himself may govern by his providence and power those who believe in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
