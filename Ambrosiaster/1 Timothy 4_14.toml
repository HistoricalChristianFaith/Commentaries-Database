[[commentary]]
quote='''
For if the ruler of the people turns a blind eye to these things, he neglects the grace given to him; for a leader is made for the people to this end, that he may bear the care of its salvation, by admonishing, by teaching, so that his ordination may bear fruit: for God has appointed him for this very purpose, that he may advance the salvation of his people. Whoever, then, being placed in this authority, is negligent will be held a despiser of God, called least in the kingdom of heaven; for neither will he be able to do, who does not deign even to teach (Matt. 5:19). Yet he signifies that the grace of the ordainer is given through prophecy and the laying on of hands. Prophecy is that by which one is chosen as a fit future teacher; but the impositions of the hand are mystic words, by which the one chosen for this work is confirmed, receiving authority, with his conscience as witness, so that he may dare to offer sacrifice to God in the Lord's stead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
