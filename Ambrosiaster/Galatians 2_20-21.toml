[[commentary]]
quote='''
But that I now live in the flesh, I live in the faith of the Son of God, who loved me and gave himself up for me. I am not ungrateful to the grace of God. Since the future life has been promised to Christians, therefore he who now in this life lives fortified by the help of God lives in faith in the promised life. For he contemplates its image, as having a pledge of the future life, which has been obtained for us at God's bidding through the love of Christ. He, therefore, is not ungrateful to Christ who perseveres in his faith, knowing that he has a benefit from no one but him, and that it serves to insult him if he compares to him another, whose help he could not have.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
