[[commentary]]
quote='''
Now concerning virgins I have no commandment of the Lord. This he answered to their writings, as he said above: But concerning the things of which you wrote to me, etc. (1 Cor. 7:1). But I give counsel, as one who has obtained mercy from the Lord to be faithful. He says that he has not received a commandment about virgins, because the author of marriage could not command a thing opposed to marriage, lest he accuse his own former deed. But counsel, he says, I give: not something that displeases, nor something colored by flattery; because he obtained grace to this end, that he might be fit in giving salutary counsels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
