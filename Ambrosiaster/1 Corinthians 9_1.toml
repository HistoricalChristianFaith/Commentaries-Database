[[commentary]]
quote='''
Am I not an apostle? Am I not free? Have I not seen Jesus our Lord? While he seems to deny, he affirms; for he speaks in anger. For he proves himself an apostle, because he was sent to the Gentiles, the Lord saying to him: I will send you to the Gentiles (Acts 22:21). And he shows himself free, because he coveted nothing of anyone's, nor did he teach in flattery. And he saw Jesus our Lord while he was praying in the temple at Jerusalem (Acts 22:18). Are you not my work in the Lord? They are his work for this reason, because he himself planted them in the Lord, preaching to them the word of God for a year and six months.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
