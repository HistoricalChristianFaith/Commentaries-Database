[[commentary]]
quote='''
For to one is given through the Spirit the word of wisdom. That is, prudence is given him, not from letters, but by the flashing fire of the Holy Spirit, so that he may have an enlightened heart and be prudent, so as to discern what is to be avoided and what is to be followed. But to another the word of knowledge according to the same spirit: that is, that he may have knowledge of divine things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
