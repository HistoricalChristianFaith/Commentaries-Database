[[commentary]]
quote='''
If Christ was born of the Holy Spirit, that is, if by his working flesh was made from Mary, why is it said, "Wisdom, which is certainly Christ, has built a house for herself" (Prov. 9:1)? — This question can be heard from a double point of view. First, the house of Jesus Christ is the Church, which was built by his blood. His body may also be called his house, just as it is called his temple. If it is called its temple because it is inhabited, it can also very well be called its home, as we read in the law. But if the body was formed by the operation of the Holy Spirit and we thought we could give it the name of house, we will ask why we attribute this formation to the person of Jesus Christ. The Son's operation is the Father's operation, because they have one and the same virtue. In the same way the operation of the Holy Spirit is the operation of the Son of God, because of the unity of nature and will. Whether the action comes from the Father, or from the Son, or from the Holy Spirit, it is the Trinity who acts, and all that is done by the three divine persons is the work of one God. The Son's operation is the Father's operation, because the Father and the Son have one and the same virtue. In the same way, the operation of the Holy Spirit is the operation of Christ, because the Holy Spirit has received from what was his. If we consider the action of persons, it is by the operation of the Holy Spirit that Christ was made flesh, that is, made man; but if we consider the action of the divine nature, it is Christ who has worked in the virgin to become flesh; for the Holy Spirit and Jesus Christ have one and the same divinity, and therefore the work of the Holy Spirit is the work of Jesus Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 52: WHY IS WISDOM (CHRIST) SAID TO HAVE BUILT HERSELF A HOUSE"

[[commentary]]
quote='''
IF CHRIST WAS BORN OF THE HOLY SPIRIT, THAT IS, IF BY HIS WORKING FLESH WAS MADE FROM MARY, WHY IS IT SAID, “WISDOM, WHICH IS CERTAINLY CHRIST, HAS BUILT A HOUSE FOR HERSELF” (Prov. 9:1)? — This question can be understood in a twofold way. First, the house of Christ is the Church, which He built for Himself by His own blood. Next, His body also can be called His house, just as it is called His temple. For if it is called the temple of God on account of His dwelling there, it will not be incorrectly called a house as well, as we read in the Law. But since the body was made by the working of the Holy Spirit, and we judge that it can be called a house, the question arises why this is referred to the person of Christ. The work of the Son is the work of the Father, because the power of both is one. In like manner, the work of the Holy Spirit is the work of the Son of God, on account of the unity of nature and will. For whether the Father acts, or the Son, or the Holy Spirit, it is the Trinity that works; and whatever the Three have done is the operation of the one God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 52: ON WISDOM BUILDING HER HOUSE"
