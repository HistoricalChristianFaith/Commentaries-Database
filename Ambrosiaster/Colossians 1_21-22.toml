[[commentary]]
quote='''
And you, who were once estranged and enemies of his counsels in wicked works, but now are reconciled in the body of his flesh through death, ought to present yourselves holy and spotless and irreproachable in his sight. He recalls what the gift of God toward the Gentiles is, to show that they are debtors, and greatly so, in thanksgiving to God; for when they were enemies of his counsels, by which he had decreed to visit the human race through his servant Moses, whose teaching and authority they did not receive, being devoted to their idols, or rather to wicked works (for they worshipped their own works, which they had made), the mercy and providence of God nevertheless sought them out; so that they might obtain the grace of God freely, returning to him with a clean conscience; so that on the day of judgment, when nothing of the old error should be found in them, they might be incorporated into their Creator, who, to benefit the human race, became incarnate and was made man, so as to conquer death in his flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
