[[commentary]]
quote='''
When he comes to be glorified in his saints, and to be made wonderful in all who have believed; because our testimony concerning you has found faith, on that day of the coming of the Lord. It contains a twofold sense; for he will come to punish the wicked and to glorify the good. For he himself will be seen glorious and wonderful towards those who believe through the example and faith of the apostles, when they have been crowned, the Gospel rendering testimony to them on the day of the Lord; but he will appear severe towards the unbelieving, when they begin to be confined in eternal penalties. For the crown of the disciples is the glory of the teacher, and his truth is the penalty of the unbelieving, because what was preached was not believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
