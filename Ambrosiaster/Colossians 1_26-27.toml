[[commentary]]
quote='''
But now it has been made known to his saints, to whom God willed to show what are the riches of the majesty of the mystery of God among the nations, which is Christ in you, the hope of glory, whom we proclaim. He asserts that the mystery which lay hidden from the ages has now been revealed, that is, shown in the time of the apostles: that the Gentiles too were to be admitted, without circumcision of the flesh, to the faith of Christ, who had been promised to the Jews. For formerly, before the preaching of the faith, Gentiles were commanded to be circumcised if they wished to come to the Law: but now, by the mercy of God, they have been ordered to be received into the faith just as they are. This the Jews thought unworthy: that Christ, in whom was the hope of the Jews, should make the Gentiles too sharers of his glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
