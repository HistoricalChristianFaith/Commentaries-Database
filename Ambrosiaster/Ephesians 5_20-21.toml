[[commentary]]
quote='''
Giving thanks always for all things in the name of our Lord Jesus Christ to God and the Father, being subject to one another in the fear of Christ. We are commanded to give thanks to God in all his gifts, who has also deigned to adopt us through Christ, his own Son, through whom we have known him, and have learned that God is to be worshipped in the Spirit (because God is spirit), each subjecting himself to the other on account of the fear of Christ, who commanded that humility be practiced (John 4:24).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
