[[commentary]]
quote='''
Indeed, we ourselves received in ourselves the answer of death; so that we should not be trusting in ourselves, but in God, who raises the dead. He indicates that so great an insolence of iniquity had risen up against the preachers of the faith that they had death before their eyes; and so, rescued from that very affliction, they say that they were raised up again. For they had been so afflicted that they despaired of the present life. But since God does not deny his protection to those placed in need, above all to his own, he rescued them as they despaired of themselves but trusted in God. For they professed that under that excessive affliction they would have failed, had God not been present.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
