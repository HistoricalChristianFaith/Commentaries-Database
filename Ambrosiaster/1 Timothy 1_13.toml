[[commentary]]
quote='''
For he did not do this out of malice, but out of error, which can easily be pardoned when a man comes to his senses. But he who knows that the things he denies are true does this not out of error but out of malevolence; his wound is incurable; for he is driven by envy to call false what he knows to be true.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
