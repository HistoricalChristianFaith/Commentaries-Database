[[commentary]]
quote='''
Which works thanksgiving to God through us. Since the ministry of this service not only supplies the things that the saints lack, but will also abound through the thanksgivings of many in God, through the proof of this ministry, glorifying God in the subjection of your confession in the Gospel of Christ, and in the simplicity of your sharing toward them, and their prayers for you, as they long to see you because of the superabundant grace of God in you. But thanks be to God for his unspeakable gift. He says this because whoever, through the stewards of God's gift, does this work by which thanks are given to God by those who receive the necessary support in the name of Christ, subject not to beggary but to God, by whose goods they know they are fed: thanks are returned to them not only by these, but also by the rest of the brothers, who give thanks to God for them, commending their deed to the Lord; so that, giving to a few, they are commended to God by the entreaties of many. For, approving their mind in this work, they magnify the Lord in them, strengthened by hope in whom they obey the Gospel of Christ in subjection of mind: not wishing to have them humbled before them in order to supply what is necessary for the saints. And this will be to give thanks in simplicity for their sharing, commending themselves to their prayers and to their desires. For who would not long to see with his eyes those who, for the name of God, are made subject to his needs? Accordingly they are called gifts of God; for he who ministers to these gives to God; because what is given is credited to him who commands it to be done. But they give thanks to God in these things, and for his ineffable gift. For it is the gift of God that incites men to the good work; for the promised hope spurs them on to the ministry spoken of above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
