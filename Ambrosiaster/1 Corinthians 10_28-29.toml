[[commentary]]
quote='''
But if anyone says: This has been sacrificed to idols, do not eat, for the sake of him who pointed it out, and for conscience' sake. Now I say conscience, not your own, but the other's. He says this to the perfect, who, despising idolatry, are able to eat of the sacrifice, because it is nothing, being certain that what is eaten under the name of God the Creator cannot pollute: but because another, who serves idols, will boast when you eat of the things sacrificed, as though you venerated the idols; therefore it ought not to be eaten. For that man will rejoice in his own conscience, because he sees you eagerly seeking what has been sacrificed to idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
