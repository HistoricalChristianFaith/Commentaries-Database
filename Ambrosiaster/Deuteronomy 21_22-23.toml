[[commentary]]
quote='''
For it is written: Accursed is everyone who hangs on a tree (Deut. 21:23). Moses said this in Deuteronomy concerning those guilty of death: that it should suffice for those hanged on a tree to be there until evening, and then to be taken down for burial. For accursed is everyone, he says, who hangs on a tree; so that this should suffice for one guilty of death, that being hanged he died on a tree; lest, if he were hanged longer, his death should carry greater reproach than it ought, and a stain should come upon his family if his death were made public any further. And therefore the Savior, hanged on a tree though innocent, is not accursed, but the curse of those by whom he was hanged. Yet as far as concerns the Jews, offering him to Pilate to be killed as a sinner, they made him a curse, so that he might be killed as guilty though he was innocent, since one worthy of death is accursed according to the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
