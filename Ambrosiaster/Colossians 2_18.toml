[[commentary]]
quote='''
Let no one deceive you, wishing, in humility of mind and the superstition of angels, the things which he sees, puffing himself up in vain, inflated by the mind of his flesh, and not holding that head, from which the whole body, supplied and knit together through joints and connections, grows unto the increase of God. What above he warned them to guard against under the name of philosophy, he now teaches more openly is to be watched for from those who, devoted to earthly wisdom, assert that those things are to be worshipped which lie before the gaze or appear to it; so that souls held fast by the worship of these may be kept bound beneath the firmament, lest they stretch themselves above the firmament to the higher heavens to adore the God of all. This is brought about by the work of the enemy, so as always to keep souls humbled upon the earth, where he knows that he himself, cast down from the heavens, will always be by the just judgment of God, feigning religion, though it is the greatest sacrilege. For they are puffed up as they survey the motion of the stars, which he calls angels, not by divine authority, but by human superstition, which profits for nothing except for loss: unwilling to hold the faith of Christ, who is the creator and Lord of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
