[[commentary]]
quote='''
But in the Church, he says, I wish to speak five words through the Law, that I may edify others also, rather than ten thousand words in a tongue. He says it is more useful to speak in a few words, in openness of speech, what all may understand, than to hold a lengthy discourse in obscurity. These were of the Hebrews, who sometimes used the Syriac tongue, but mostly Hebrew, in their discourses or oblations, to commend themselves. For they gloried in being called Hebrews because of the merit of Abraham, which the same Apostle counted as nothing, saying: But far be it from me to glory, save in the cross of our Lord Jesus Christ (Gal. 6:14). Some, imitating these, preferred to speak in the church to the people in a tongue unknown to themselves rather than in their own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
