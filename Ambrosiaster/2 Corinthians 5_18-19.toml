[[commentary]]
quote='''
Who reconciled us to himself through Christ, and gave us the ministry of reconciliation; since indeed God was in Christ, reconciling the world to himself, not reckoning to them their own offenses, and placing in us the word of reconciliation for Christ, for whom we act as ambassadors, as though God were exhorting through us: beseeching on behalf of Christ to be reconciled to God. For him who had not known sin he made sin for us, so that we might be the righteousness of God in him. God almighty, the begetter of Christ (since all the things that he had made through Christ had been rendered fallen by error, forgetful of their Creator), deigned that Christ our Lord should come from the sacred seats to earthly things, made flesh in the form of man, so that he might be a pattern for men of how they might make God their Creator at peace with them. God, then, was in Christ. How? As in a vicar or an ambassador, as he was in the prophets, or otherwise? Can he not be understood to have been in the Son as well, just as he was in the prophets? For the Son is by nature the ambassador of God the Father. Hence he says: Because the Father is in me, and I in the Father (John 14:11); for the Father is understood to be in the Son by this, that their substance is one. For there is unity where there is no difference; and for this reason they are in one another, because both their image and their likeness are one, so that he who sees the Son is said to have seen the Father, as the Lord himself also says: He who sees me sees the Father also (John 14:9). Rightly, then, it is said: God was in Christ; that is, the Father in the Son, reconciling the world to himself; not reckoning to them their offenses; since the creature sinned against God and did not repent so as to return to him, God, not wishing his work to perish, sent his Son, so that, the remission of sins having been preached to them through him, he might reconcile them to himself through the very one through whom he had created us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
