[[commentary]]
quote='''
But to us God has revealed it through his Spirit. And because the princes of the age did not know this, God revealed it through his Spirit to believers; for the things of God cannot be learned without the Spirit of God. For he says that he has been sent to declare this mystery not only to men, but also to the principalities and powers in the heavenly places, who crucified the Lord; so that, as he preaches it on earth, those may learn who are in the carnal heavens, who dwell beneath the elements of the firmament. This, then, is a singular apostle, who obtained this grace; for the mystery of the Trinity could be explained by no one as it was by him: whence he was also called a vessel of election by divine judgment (Acts 9:15).

For the Spirit searches all things, even the depths of God. For because this Spirit is from God, he knows all things. And he says the depths of God for this reason, because he knows all his power and foreknowledge: which is wholly impossible for a creature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
