[[commentary]]
quote='''
IT IS EVIDENT THAT THE SAVIOR WAS BORN, THE SON OF GOD AND CALLED CHRIST: WHY THEN, AFTER BAPTISM, DID THE TEMPTER APPROACH HIM, SAYING, “IF YOU ARE THE SON OF GOD,” ETC. (Matt. 4:3)? — The Savior was born of the Virgin in such a way that He was both Christ and the Son of God, not by making, but by birth. Yet while He was still at a younger age, emptying His power, that is, concealing His own authority, He did not provoke the shamelessness of the Devil. But after He was baptized and the Holy Spirit descended upon Him, when He had appeared to human beings with the testimony of God the Father, the enemy was driven by the zeal of envy to insult Him, seeing that this event worked to his disadvantage: for he understood that the institution of baptism had been arranged for the salvation of human beings. Therefore he approaches the Savior, the author of this matter, not to approve it, but to find an opportunity to overthrow it. For temptation sometimes occurs for testing, sometimes under deceit for rebellion. He thought that he had drawn from the Savior a response in accordance with the trickery of his own will, so that he might securely possess his entire kingdom; for if, under the guidance of the Savior’s teaching, people were brought into subjection, no one would escape His condemnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 7: WHY THE TEMPTER APPROACHED CHRIST AFTER BAPTISM"
