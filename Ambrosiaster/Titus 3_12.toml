[[commentary]]
quote='''
When I send Artemas or Tychicus to you, hasten to come to me at Nicopolis; for there I have decided to winter. After sending the letter he wishes also to see him in person, for affection's sake, and to establish him more fully in ecclesiastical discipline.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
