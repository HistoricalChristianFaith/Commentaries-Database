[[commentary]]
quote='''
Having begun in the spirit, are you now being finished in the flesh? He says this because, while the ascent is from lower things to the heights of faith, these on the contrary have slipped down from the heights into the depths. For having been made spiritual through faith, when they turned to the Law they had lost the grace of the Spirit which they had obtained; for being finished signifies perdition, that is, of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
