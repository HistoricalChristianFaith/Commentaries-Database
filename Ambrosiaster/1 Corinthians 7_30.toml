[[commentary]]
quote='''
And those who weep, as though not weeping; for, knowing that, since the end of the world is near, consolation will soon come for those who are perhaps oppressed for the righteousness of God, let them console themselves among themselves with this hope. And those who rejoice, as though not rejoicing; for let those who rejoice in the present know that mourning will soon come, namely to those who rejoice in the world, doubting about the judgment of God. And those who buy, as though not possessing; for those who buy, believing that little time remains to the world, should so act as not to spend all their care on a thing that will soon perish: but rather let them take care of their soul, which they know to be eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
