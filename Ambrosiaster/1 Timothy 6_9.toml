[[commentary]]
quote='''
For those who wish to become rich fall into temptation and a snare, and into many useless and harmful desires, which plunge men into ruin and destruction. For the root of all evils is avarice, which some, coveting, have strayed from the faith, and have thrust themselves into many sorrows. Nothing is so harsh and so pernicious as when a churchman, especially one who is in a high place, is eager for the riches of this world; because he harms not only himself but others too. For he gives men a contrary pattern; for many imitators of him must needs arise, to their perdition. For the more honorable he is in rank, the more he persuades others to imitate him, especially in this thing, to which there is a ready slope in this life; for avarice can commit all evils.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
