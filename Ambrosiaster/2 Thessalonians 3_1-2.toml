[[commentary]]
quote='''
As for what remains, brothers, pray for us, that the word of the Lord may run and be glorified, as also among you, and that we may be delivered from importunate and wicked men; for faith is not of all. For the rest he urges them to pray that God may deign to direct his teaching on a tireless course and to pour it through the mouth of his Apostle into the ears of the hearers, and that he would restrain and calm the seditions of evil men who distrust the truth, and that confidence in speaking might grow in the Apostle, for its fruit and the conversion of many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
