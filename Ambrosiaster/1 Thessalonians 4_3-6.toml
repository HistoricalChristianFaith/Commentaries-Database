[[commentary]]
quote='''
For you know what precepts I gave you through our Lord Jesus. For this is the will of God, your sanctification: that you abstain from fornication, and that each one of you know how to possess his own vessel in holiness and honor; not in the passion of desire, as also the Gentiles who do not know God: and that no one overstep or circumvent his brother in business; because the Lord is the avenger of all these things, as we also told you beforehand and testified. Although he praises them in the whole epistle, he nevertheless warns them not to be led by any stealthy encroachment into unlawful things, and so incur the vengeance which they have learned to be the avenger of evils: knowing that this pleases God, if they keep their bodies undefiled, and also deal simply with their brothers; lest, being found like the Gentiles, they be disinherited of the name of adoption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
