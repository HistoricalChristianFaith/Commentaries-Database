[[commentary]]
quote='''
What is it then, brethren? When you come together, each one of you has a song: that is, he utters the praise of God in a song. He has a doctrine: that is, he has an exposition of meanings through spiritual prudence. He has a revelation: that is, there is in him a prophecy of hidden things, which may reach the mind of all, with the favor of the Holy Spirit. He has a tongue; so as not to grieve those who were able to speak in a tongue, he permitted them to speak in tongues, yet on this condition, that interpretation should follow. Therefore he says: He has an interpretation; so that, if an interpreter were present, room might be given for speaking in tongues.

Let all things be done for edification. This is the conclusion: that nothing should be done to no purpose in the Church, and that one should labor rather for this, that even the unskilled may profit, lest any part of the body be in darkness through want of skill. For this reason he wishes all to come together prepared with various spiritual gifts, so that, wakeful through the very eagerness of their minds, exhorting one another, they might be zealous for the better gifts, for the enlightenment of the brethren.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
