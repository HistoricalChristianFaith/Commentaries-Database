[[commentary]]
quote='''
For since there are rivalries and contentions among you, are you not carnal, and do you not walk according to man? He shows the cause of their unworthiness; for he who hopes for help from man is carnal. But he who scorns what is human and hopes in God is spiritual; for God is spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
