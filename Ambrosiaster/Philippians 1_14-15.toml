[[commentary]]
quote='''
And therefore he says that many of the brethren, having followed his example, dared to speak the word of God with confidence; for his constancy encouraged many, so that they did not neglect to evangelize, having learned from the Apostle's example that God is at hand to protect those who love him; but he says that others too, false brethren, preach the word of God, stirred not by confidence nor by love of God but by the contention of jealousy, as envious men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
