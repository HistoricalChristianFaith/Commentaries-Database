[[commentary]]
quote='''
ON PSALM FIFTY. — The Fiftieth Psalm is placed here not according in chronological order, but according to rationale. For its title is governed not by number, but by meaning. As far as history is concerned, it comes before the third. For the prophet Nathan rebuked him for his sin before his son Absalom rose up against him to deprive him of both life and kingdom. This is therefore the reason why the Fiftieth is placed here, as is evident from the Law. For there it is established that the number fifty carries remission. It comes after seven weeks and is the first that bears the type of the Lord’s Day: because just as after seven days, the first day is that which was made at the beginning, and which, after each completed week, is always the first; so also, after seven weeks, the fiftieth, when counted, is in mystery the first, and is called in a double sense the Lord’s Day: first, because it was made at the beginning by the Lord, and, always recurring upon the completion of the weekly cycle, is the first; then, because on it the Lord rose again, having triumphed over death, it is also called the Lord’s Day. Not without reason, then, in the number fifty, which we observe as mystically signifying the first, remission is contained. Indeed, the Law was given on the fiftieth day. For from the departure of the children of Israel out of Egypt, they were commanded on the forty-eighth day to be washed, so that, purified for two days, on the third day they might be ready to receive the Law (Exod. 19:10, 11). And what else does that washing indicate but that remission was granted on the fiftieth day, so that, purified, they might receive the Law? From that point on, with past things blotted out, they should render an account of their conduct according to the Law entrusted to them. For this same reason the Law also commanded that a purchased possession be restored in the fiftieth year (Levit. 25:10). From this, therefore, comes the title of the Fiftieth Psalm. In it King David asks for remission according to this prefigured meaning; therefore he says: Have mercy on me, O God, according to your great mercy. (Ps. 50:1a) Knowing that he had sinned gravely, King David therefore asks, saying: Have mercy on me, O God, according to your great mercy. For mercy is great when great sins are forgiven. And he adds: And according to the multitude of your tender mercies, blot out my iniquity. (Ps. 50:1b) To make clear that he had sinned grievously, he calls his sin “iniquity,” because iniquity is no light fault; and he who blots out iniquity, that is, does not credit it, abounds in mercy. He therefore tries in no way to excuse himself in his case, so that he may not only soften the mind of the Judge toward him, but also move Him to compassion. For the mind is stirred to mercy when it sees the accused confess his sins in such a way as to show that he is grieved because he has sinned. For whoever does not grieve seems to mock the judge; for he prays only to escape, meaning to commit the same again. And he continues: Wash me thoroughly, he says, from my injustice, and cleanse me from my sin. (Ps. 50:2) Since he proclaims the abundant mercy of God, he begs to be cleansed completely, so that nothing of fault or injustice may remain in him that could cause suspicion. And that he might obtain or secure this very thing, he adds: For I know my iniquity, and my sin is always before me. (Ps. 50:3) Because he knows that he has sinned grievously, he is anxious lest it be not entirely forgiven him. Considering the greatness of his sins, he fears, knowing that grave sins are not easily forgiven; and therefore he confesses with tears, keeping his sin before his eyes, in order in every way to make the Judge merciful toward him. For he knows it is written: Declare your iniquities first, that you may be justified (Isa. 43:26). And he continues: Against you alone have I sinned, and done evil before you. (Ps. 50:4a) Now, from another angle, he provides a remedy for his fault, so as to bring his petition to its effect. By this line of argument he declares himself innocent in the primary matter: for whoever sins against another god is an enemy of the God who is Creator. For he chooses another in place of Him, to whom he attributes His authority. Therefore, showing that he is free from such iniquity, he says: Against you alone have I sinned, and done evil before you; (Ps. 50:4b) that is, because I have sinned against you, and not against any other whom through error I might call god, my guilt is less than that of others, who are subject to punishment. For I am not wicked, but a sinner, because I have not sinned against you yourself, but against your Law; nor have I denied you, but, confessing you as God and Lord, I have sinned against a man. Therefore, since in that which is your own proper cause I am not guilty, forgive what I have done against a fellow-servant. For therefore I have sinned that I neither denied the honor of your name nor gave it to another. There was therefore reason for the Judge to be moved to mercy. For although many sin against Him, whom He even urges to turn back to Him, yet when those who do not sin directly against Him nevertheless ask pardon for other reasons, He readily receives them. For the Lord always wills His servants to flee to His help. Therefore he adds: That you may be justified in your words, and prevail when you are judged. (Ps. 50:4c) While asking for mercy, he prays that God may not change His justice, since justice is ordinarily a middle course such that it is not equal toward those who do not sin and those who do, that is, that it renders to each according to his works; but the innocent man in the mystery of God does not fail to understand what he asks. For knowing that God has frequently said in the Law, For I am merciful, says the Lord your God (Exod. 22:27), from there he begs that this faith may remain firm, and that God may be justified in His words, by remaining in what He has spoken, and not be overcome by the sins of men so as not to show mercy. For those who sin, knowing what God has promised to those who live well, and that He perseveres in this, judge Him to be a liar. For by living badly they do not believe that what He promised is true. Therefore King David asks that God may overcome this opinion men entertain, and may give what He has promised, so that those who, not keeping the commandments, judge that He will not give, may be put to shame. And he continues: Behold, I was conceived in iniquities. (Ps. 50:5) Now, with this added, he recalls the cause of the weakness of the human race, namely that it is easy for man to sin, so that he might soften the severity of the judgment upon himself. For he makes mention of the first fault, by which Adam, through transgression, made the human race subject to sin. Under the persuasion and deceit of the enemy, conceiving iniquity, he subjected all his offspring to iniquity, so that all born from him by breeding should be liable to sin. Therefore he added, “And in sins my mother conceived me,” (Ps. 50:5b) so that the transmission of sin from Adam would be an obstacle for those conceived and born, hindering them from living a good life; and therefore mercy should not be denied to the suppliant, since he has a hostile enemy who urges him to sin. For through sin the Devil, having subjected the first man to himself, received power to mingle with his flesh and, with a certain restraint of offenses, suggest pleasures, by which he strips captive man of life. Remembering this, the teacher of the Gentiles says: “I see another law in my members, warring against the law of my mind” (Rom. 7:23); so that, seeing this, the Judge may stretch out his hand to one in sorrow and under assault. And it continues: “Behold, you have loved truth.” (Ps. 50:6a) Because you love truth, he says, come to the aid of the one who prays, the one whom you know lays bare the true impairments of his heart, and to every guilty person you once, moved by mercy, decreed to give help, so that the error committed on earth might be corrected by heavenly providence. For this reason he adds: “You have made known to me the uncertain and hidden things of the heart.” (Ps. 50:6b) By “uncertain and hidden things of the heart” he means those things which God has provided for the protection of the human race, just as the Apostle says: “What eye has not seen, nor ear heard, nor has entered into the heart of man, the things that God has prepared for those who love him” (1 Cor. 2:9). Who are those who love God, if not those who consent to his law, neither hiding nor excusing sins? These “hidden things of the heart” are revealed to those who love God, so that, because they grieved at being overwhelmed by sins, they might not deny it when corrected, crediting it both to themselves and to their origin, and not transferring to God as author the things they did in sin. Their hearts were illumined by spiritual brightness, so that they might see God’s providence in Christ, namely that he was going to come to condemn the sin which, from Adam’s transgression, ruled over the human race. This, then, King David prays for: that what God had decreed for the future, seeing the human race toil, he might first grant to himself, constrained by the same necessity in which he had decreed to help all; so that the gift which was to be free and could not be given before the time, might, to him, be granted in advance for his prayer and tears. He does not remain silent about how this is to happen, saying: “You will sprinkle me with hyssop, and I shall be cleansed.” (Ps. 50:7a) Rightly does he ask to be cleansed by the sprinkling of hyssop. For with this the sons of Israel smeared their doorposts with blood, that they might be kept safe from death (Exod. 12:22–23); so here too he prays by the sprinkling of hyssop to be cleansed from his sins, lest he be touched by death. And it continues: “You will wash me, and I shall be whiter than snow.” (Ps. 50:7b) Clearly, God’s work differs from man’s work: therefore he says, “I shall be whiter than snow,” because what God has done is much better than what man has done. For this reason he asks to be cleansed by the sprinkling of hyssop, so that as the bodily flesh is washed with water, in the same way, through the signification of hyssop, the stains of souls may be washed away by spiritual means. For the sprinkling of hyssop is a kind of purification, so that by means of what is visible, one may be cleansed invisibly. And it continues: “You will give joy and gladness to my hearing.” (Ps. 50:8a) There is no doubt that the voice of one proclaiming forgiveness brings joy to sinners. For who does not rejoice when he hears that pardon is being granted? For when God forgives, he is safe both in the present and the future. “And the bones that have been humbled shall rejoice.” (Ps. 50:8b) There is a twofold sense in which the bones are humbled: both in that he was humbled so that he might sin, for no one who sins is exalted, and in that afterward he, as a suppliant, might beg pardon. For he certainly, rolling in sackcloth and ashes, begged for mercy; which, once obtained, he was raised up in the exultation of his mind and the restoration of his body. And he added: “Turn your face away from my sins, and blot out all my iniquities.” (Ps. 50:9) With this form of words he asks for forgiveness, just as it was established for the future through faith in Christ, that the Savior, who is promised to him spiritually, should begin with him to grant all sins to those who are converted. For the one whose sins are not looked upon and whose iniquities are all blotted out has no basis on which he may be found guilty, and the mouths of his enemies are closed. For whoever does not look upon sins does not assign them. This is what it means to turn one’s face away from someone’s sins: not to accept an accusation against him. And what does it mean that, though he was corrected for two sins, he adds by accusing himself of many? And when he heard from the prophet Nathan that his sin was forgiven, why does he still ask with diligent prayer that he might attain pardon, unless it is because he is not acting only on his own behalf, but under the accusation of his sin he recounts the miseries of the whole people? For he asks for restoration for himself, since no one to whom forgiveness is granted is without shame, unless he is restored to his own place, so that the dignity of his position may excuse his shame; but for the others he signifies the blessing of God that was going to be in Christ, washing away all sins. And it continues: “Create in me a clean heart, O God, and establish a right spirit within my inner parts.” (Ps. 50:10) This is to ask for mercy with a good heart. He not only prays concerning past things, but is also concerned about future things, so that, as a sinner resolving to hate sin lest he sin, he may be helped by God through the spirit of righteousness which he prays to have established within his inner parts; that is, that a new spirit may be placed in him for this purpose: that it may guard him from sins, lest he be forced to do what he is known to be unwilling to do. And he can have a clean heart if he does not sin either within or without; that is, neither in deed nor in thought. Because it is almost impossible that this be observed in all things, at least in the cause of God it must be observed, which is the principal thing: that a clean heart be kept in the mystery of God and of Christ, while faith in them is preserved unaltered; for it is also said elsewhere: Who can boast that he has a pure heart, or that he is free from sins? (Prov. 20:9). Finally, King David had a clean heart in the cause of God, because he neither ever sought help from vanity, which is idolatry, nor failed to fulfill anything else that was commanded from him by God. Therefore of the rest he added: Cast me not away from your face, and take not your Holy Spirit from me. (Ps. 50:11) This is the meaning which I mentioned above: that, though assured of pardon, he is anxious about renewal. For he to whom there is only forgiveness is usually separated from the face of the Lord. For although vengeance is not taken on him, yet in the mind of the Lord or of the judge his crime is not blotted out. Therefore he prays that his sin may be utterly wiped away, and that he may be worthy to approach the face of the Lord and to prophesy again; and this came to pass. For this is what he says: And take not thy Holy Spirit from me. This is the Spirit of the prophets. And it follows: Restore to me the joy of your salvation, and strengthen me with a princely Spirit. (Ps. 50:12) He asks that the joy be given to him which was promised in Christ, that, washed from every stain and renewed, he might rejoice in the salvation he had sought; and that he might not be moved, but confirmed in the kingdom by the Holy Spirit. This Spirit he therefore called princely, because he is above every creature, through whom kings reign. And he adds: I will teach the wicked your ways, and sinners shall be converted to you. (Ps. 50:13) He says this in order that in him the wicked may learn the mercy of God, who receives and advances sinners that confess to him; nor does he neglect sinners who are converted, but encourages them while he has mercy on others. And it follows: Deliver me from blood-guiltiness, O God, God of my salvation. (Ps. 50:14) By saying this he shows his sin to be deserving of death, that he may proclaim how great the mercy of God is. By this he also stirs others to flee for refuge to the mercy of God. Therefore he subjoined: My tongue shall exult in your righteousness, O Lord. (Ps. 35:28) He says that he rejoices in the righteousness of the Lord, because he abides in that which he promised, saying: But my mercy I will not take away from them (Ps. 88:34). Therefore King David, joyful and secure in this respect, proclaims the righteousness of his God. And it follows: You shall open my lips, and my mouth shall declare your praise. (Ps. 50:15) So he opens his lips, while he does not allow him to be kept down on account of sin. For once freed, his mouth stands open; but the sinner’s mouth is shut: seized by shame and fear, he does not dare to speak; whereas the one absolved and liberated, exulting, proclaims the praise of the Judge. For the Apostle also, as he himself testifies, because he was free from men, says: Our mouth is open to you, O Corinthians (2 Cor. 6:11). And he added: For if you had desired a sacrifice, I would indeed have given it. (Ps. 50:16a) He speaks from what is known, knowing that holy Samuel said to King Saul, who thought that his sin could be wiped out not by sorrow of mind nor by the mercy of tears, but by the offering of sacrifice: God does not will sacrifice rather than that his voice be heard (1 Sam. 15:22); because sacrifices of that sort can do harm, but cannot appease God. For God is appeased in this way: if the soul, mindful of its sin, in tribulation and sorrow of heart, weeps over what it has done. And it follows: With burnt offerings you will not be delighted. (Ps. 50:16b) Nor is God delighted with burnt offerings in such cases. For the soul itself must make satisfaction for itself, not redeem itself from outside. These things indeed can give help. For as the mind was delighted in sins, so it must be afflicted in repentance, and then it will please God to wipe out its sins. Therefore he subjoined: A sacrifice to God is a troubled spirit: a contrite and humbled heart, O God, you will not despise. (Ps. 50:17) He shows what kind of sacrifice for sins God accepts; for he cannot appease God who has rejoiced against his own salvation, unless he has been troubled in heart, and therefore is restored to life. Finally, every restless or undisciplined person often comes to harm, so that he injures the members of his body, which certainly cannot receive the remedy of health without pain: so also sinners cannot redeem their sins, unless the soul that has sinned has felt pain. For this is just: that because he rejoiced against reason, he should, according to reason, suffer grief. And it follows: Deal kindly, O Lord, in thy good will with Sion. (Ps. 50:18a) By Sion he means the Church, so that our perseverance may not seem unacceptable; to which, that God may fulfill his promise, he suggests this, knowing that he would then receive full remission when God should have accomplished in Christ what he had decreed: that is, that those who hope in the promised salvation may be freed from every sin; because through Christ they will be delivered not only from their own sins, but from Adam’s sin, which has come down to all by propagation. And he added: And the walls of Jerusalem shall be built up. (Ps. 50:18b) Were they destroyed? But by “the walls of Jerusalem” he means the Church, which was to be built up, ordered by faith in Christ. Its walls are understood to be holy men, as the Apocalypse of the apostle John teaches us; for both the city of Jerusalem and its walls are to be understood as the servants of God (Rev. 21:12). Knowing also through Christ the promise that was to be fulfilled for the liberation of the servants of God, the king David prays that it may be fulfilled; that is, that by faith the Church may be built up, and that those who hope for salvation from this faith may be delivered. And it follows: Then shall you accept the sacrifice of righteousness, oblations and burnt offerings. (Ps. 50:19a) He says this because he would then have oblations and burnt offerings as acceptable to himself when the Church had been built; and not at random or according to every custom, but, he says, you shall accept the sacrifice of righteousness. A sacrifice is just when a worthy gift is offered; moreover, nothing is so just and worthy a sacrifice as that we offer ourselves to God. For since God is spirit (Jn. 4:24), spiritual sacrifices are to be offered to Him, so that a living victim may be offered by one who lives. Since he had said, in the matter of sin, that God is by no means delighted with carnal sacrifices, he shows that in the future it was to be offered to God in a spiritual manner, and that He would accept it; because these are the sacrifices worthy of God: that is, in the past they were lesser, because they were carnal; now they are greater, because they are spiritual. And he added: Then they will place calves upon your altar. (Ps. 50:19b) If, by the ceasing of former sacrifices, he indicated that spiritual sacrifices would follow, what does it mean that he said, Then they will place calves upon your altar, unless that by these bodily things he signifies spiritual realities; especially since he had said that He does not take delight in carnal things? Therefore, in speaking of calves, he signified the new people, reborn through faith in Christ, whose devotion is daily poured out upon the altar of the Lord. For since he is understood to have spoken concerning the Church, the sacrifices of the Church must also be understood to have been meant as spiritual.
'''
