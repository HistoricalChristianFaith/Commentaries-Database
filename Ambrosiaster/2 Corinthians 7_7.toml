[[commentary]]
quote='''
And not only, he says, by his coming, but also by the consolation with which he himself was consoled in you. He adds more to the consolation, because he indicates that he has heard from Titus of their ready will to conversion, so much so that Titus, who was grieved at their disobedience, received consolation from their repentance. The Apostle shows how great an affection he had toward them: such that he took no account of the depths of the prison, nor of the pain of the blows on his torn body, nor of the stocks in which his feet were shut; but, having heard of their correction, he rejoiced, and, become forgetful of his sufferings, gave thanks to God for their salvation, regarding this as a kind of recompense for his tribulations. Announcing to us your longing. Titus announced that they had a longing to amend themselves; for learning what has been promised to those who live well, they were stirred to a longing for these things. Your weeping. Being rebuked, they wept, grieving that they had sinned, nor did they attempt to excuse themselves; that is why the Apostle boasts of them. Your zeal for me; for learning the Apostle's love toward them, they began to defend him against his adversaries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
