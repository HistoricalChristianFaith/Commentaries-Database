[[commentary]]
quote='''
For Adam was created first, then Eve: and Adam was not seduced, but the woman, being seduced, came to be in transgression (Gen. 1:27). But she will be saved through the generation of children, if she remains in faith and love, and holiness with purity (Gen. 3:6). He ranks the man above the woman because he was created first; so that the woman is inferior, because she was created after the man and from the man. He adds another point too, that the devil seduced not the man but the woman, while the man was deceived through the woman: and for this reason no boldness is to be granted to her, but she ought to be in humility; because through her death entered into the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
