[[commentary]]
quote='''
But she will be more blessed if she remains so, according to my counsel. When he says above, let her marry, he speaks by natural law; although first marriages are from God, second ones are permitted. Indeed, first marriages are celebrated sublimely under the blessing of God: second ones, however, lack glory even in the present; they are granted, though, because of incontinence: and because the younger of the widows are wont to fall; and for this reason he grants second marriages. But because it is better that she contain herself, so that she may be more worthy in the future, he gives a counsel, excellent by spiritual reasoning, that she contain herself. For I think that I too have the Spirit of God; to show his counsel to be settled and provident, he commends it by humility of word with a lofty sense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
