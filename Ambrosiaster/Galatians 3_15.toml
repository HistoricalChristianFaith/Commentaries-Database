[[commentary]]
quote='''
Brothers, I speak according to man. He says this because he wishes to commend the reason of the divine promise by the example of a human case. A man's testament, yet once confirmed, no one makes void, or adds to it. It is true that the testament of a deceased person, lawfully made, cannot be torn up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
