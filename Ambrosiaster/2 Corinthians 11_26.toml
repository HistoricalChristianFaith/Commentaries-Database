[[commentary]]
quote='''
In journeys often. Now he recalls other perils, to show that he was harassed for Christ on land and sea according to the flesh. In perils, he says, of rivers. If he is recounting the perils of journeys, why is it that he says: In perils of rivers? But traveling in winter, since rains are of course continual, he incurred danger when the rivers overflowed. In perils from robbers. When the devil could not kill him in the city, he stirred up robbers against him on the road, though he carried nothing that robbers would desire. In perils from my own people. He means the persecutions of the Jews, who were his brothers according to the flesh; for they grieved that, having deserted the Law, he had turned to the Gospel of Christ. In perils from the Gentiles. From the Gentiles he suffered persecutions on account of the mystery of the incarnation of our Lord Jesus Christ, and the preaching of one God. In perils in the city. So great was the peril in the city that he escaped through a window from the hands of those lying in wait for him (2 Cor. 11:33). In perils in the desert. This peril was contrived by the Jews when, having laid an ambush, they wanted to kill him on the road (Acts 27:43). In perils in the sea. He already said above: Three times I suffered shipwreck, a night and a day I was in the depth of the sea; what other peril at sea was there? But this is the peril: when at sea, that is, in the ship, the soldiers had planned to kill all the prisoners, lest anyone should swim away and escape. The centurion prevented this peril from being inflicted, lest Paul be killed, so that he might bring him alive to Rome. In perils among feigned brothers. False brothers are those of whom he speaks to the Galatians: But because of the false brothers brought in secretly, who slipped in to spy out our liberty which we have in Christ Jesus (Gal. 2:4). For these were partly Christians, partly Jews, perfect in neither, who out of zeal for the Law stirred up ill will against the Apostle, because he said that, now that Christ had been preached, the Law was ceasing. Finally, under their pressure, he was compelled to circumcise Timothy. A feigned Christian, then, is one who out of rivalry for the Law persecutes a Christian: and this is a false brother. For if these were only Jews, and he calls them false brothers on account of their Judaism, what need was there to say it again? For he already said above: In perils from my own people. But according to the flesh they are not false brothers, whereas in Christ they are false, because they are not Christians with their whole mind (2 Tim. 1; 4). There were also other false brothers, such as Demas and Hermogenes (2 Tim. 4:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
