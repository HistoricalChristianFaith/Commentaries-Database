[[commentary]]
quote='''
But I will come to you when I have passed through Macedonia: and with you perhaps I will remain, or even winter; so that you may bring me on my way wherever I go. After all his instruction, to make them glad, he promised them his coming, by which he also strengthens all the more all his admonitions with which he corrects them. One who hears that the one from whom he received the law is coming will be more careful, lest he be put to shame when he arrives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
