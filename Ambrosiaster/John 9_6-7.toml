[[commentary]]
quote='''
What does it mean that, although the Savior healed almost everyone by a word, he nonetheless restored the blind man's eyes with mud made from his spittle (John 9:6–7)? — The Savior did this to confuse those who accuse the Creator. For when he corrected a defect that had occurred in the body in no other way than the Maker had formed it, he praised the author of this work. He revised it by that very thing through which it had been created. For whatever is made, if a fall is repaired by means of that through which it was made, the workmanship will be shown to be right. And if the Savior thereby bears witness that he is God, because he repaired the damage and defects of the body, how much more is he God who is the very inventor of that body?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 33: ON HEALING THE BLIND MAN WITH MUD"
