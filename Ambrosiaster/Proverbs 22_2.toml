[[commentary]]
quote='''
WE READ IN SOLOMON: “THE RICH AND THE POOR HAVE MET TOGETHER; THE LORD MADE BOTH OF THEM”. HOW THEN IS THERE NO RESPECT OF PERSONS WITH GOD? — Far be this wicked claim from the minds of the faithful. For, lest Scripture should teach that the poor are to be despised and the rich to be honored, it shows that God is the maker of both, not, of course, in their poverty and riches, but in the fact that they exist. For if they differ from one another in wealth, they do not differ in the substance of their nature. Nor, because the circumstances of this world bring some people gain, whether prosperous in riches or unfortunate in poverty, are those to be despised whom God has not cast down, or those to be esteemed to whom truth has not developed witness. Those are indeed to be despised who corrupt morals and are sacrilegious against the Law of God; but those are to be honored who love God and cultivate discipline. For these are held as rich before God, who live a good life; and the more they are despised in the world, the more they are honored in heaven. For those who have the benefit of time for increasing their resources, if they know themselves and understand the will of God, who has given the earth to all, and commands His sun to rise on everyone, and pours out His rain without distinction (Matt. 5:45), while the injustice of the times, or of chance, or of want denies to some what God has given to all, they themselves supply it to them, so that by fulfilling God’s will they may be rich not only in this world, but also in heaven, lest the riches of a brief time shut them out from eternal riches. But those whom people think should be despised because of their poverty, if they reflect on God’s future judgment, there they will always be rich, where the rich of this age will be in need, repenting that they were not poor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 32: ON THE RICH AND THE POOR"
