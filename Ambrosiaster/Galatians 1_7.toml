[[commentary]]
quote='''
Which is not another, except that there are some who trouble you and wish to convert the Gospel of Christ. It is plain that they were acting so as to convert the Gospel of Christ by changing the traditions, so that under the name of Christ they might be Jews: and this is to convert the Gospel of Christ into the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
