[[commentary]]
quote='''
Greet every saint in Christ Jesus. Greet in Christ Jesus him who sanctifies himself, so that he may be held worthy of Christ, who said: Be holy, because I am holy, the Lord your God (Lev. 19:2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"

[[commentary]]
quote='''
The brothers who are with me greet you. The greeting of brothers affords mutual comfort, for it presents, as it were, images of those who are parted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
