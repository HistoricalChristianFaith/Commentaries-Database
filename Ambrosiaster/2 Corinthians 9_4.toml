[[commentary]]
quote='''
Lest, when the Macedonians come with me and find you unprepared, we blush, not to say all of you, in this respect. It is plain that if what he testified about them is not found, he himself would blush for them, and they would be the more confounded, who did not strive, even because the Apostle had stood forth as their witness, to do what would make it true, if only on account of the person of so great a man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
