[[commentary]]
quote='''
For what? Provided only that in every way, whether in pretext or in truth, Christ is proclaimed: in this too I rejoice, and moreover I will rejoice. For I know that this will turn out for me to salvation through your prayer and the supply of the spirit of Jesus Christ according to my contemplation and hope; that in nothing shall I be confounded, but in all open confidence, as always, so now also Christ will be magnified in my body, whether through life or through death; for to me to live is Christ, and to die is gain. His first joy is in the brethren who proclaim Christ with good will; then he says that he rejoices also in this, that it had been contrived against him by the deceit of men that Christ should be preached to bring envy and affliction upon him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
