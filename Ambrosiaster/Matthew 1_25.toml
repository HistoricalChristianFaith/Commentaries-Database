[[commentary]]
quote='''
IF CHRIST WAS BORN OF THE HOLY SPIRIT, THAT IS, IF BY HIS WORKING FLESH WAS MADE FROM MARY, WHY IS IT SAID, “WISDOM, WHICH IS CERTAINLY CHRIST, HAS BUILT A HOUSE FOR HERSELF” (Prov. 9:1)? — The work of the Son is the work of the Father, because the power of the Father and the Son is one. Therefore the work of the Holy Spirit is the work of Christ, because He received from Him. According to His person, therefore, Christ was made flesh, that is, born as a man, by the working of the Holy Spirit; but according to His divinity, Christ worked in the Virgin so that He might become flesh. For the divinity of the Holy Spirit and of Christ is one; and therefore the work of the Holy Spirit is the work of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 52: ON CHRIST BEING MADE FLESH BY THE HOLY SPIRIT"
