[[commentary]]
quote='''
Therefore I endure all things for the sake of the elect; so that they too may obtain the salvation which is in Christ Jesus, with heavenly glory. In order to save by his preaching men predestined to life, he was subjected to deadly perils, knowing that he would have profit from the salvation of theirs that he had sought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
