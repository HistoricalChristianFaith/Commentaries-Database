[[commentary]]
quote='''
Then he appeared to more than five hundred brethren at once. This he states on his own credit. Of whom many remain until now, but some have fallen asleep. Of those to whom the Lord appeared after the resurrection, he says that many were then still in the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
