[[commentary]]
quote='''
Now that he ascended, what is it, unless that he also first descended into the lower parts of the earth? It is true that he descended for this reason, that he might ascend; and not like men, who descended for this, that they might remain there. For they were held in the underworld by a sentence, a sentence which could not hold the Savior, because he conquered sin. Having therefore triumphed over the devil, he descended into the heart of the earth, so that his showing of himself might be a preaching to the dead, and as many as were desirous of him might be set free. Nor could he fail to ascend, since he had descended for this: that by the might of his power, death having been trampled underfoot, he might rise again with the captives for whose sake he allowed himself to suffer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
