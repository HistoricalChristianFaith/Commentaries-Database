[[commentary]]
quote='''
If any brother has an unbelieving wife, and she consents to live with him, let him not put her away. And if any woman has an unbelieving husband, and he consents to live with her, let her not leave her husband. He said this because in those beginnings, when both were of course Gentiles, it happened that one of them believed: and because the faithless shrank in horror from the worship of God, and likewise the believers from the defilement of their former error, therefore he directs that, if those were content to live with the ones who had been changed, the faithful too should be content to be with them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
