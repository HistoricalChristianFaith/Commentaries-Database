[[commentary]]
quote='''
As unknown, and yet known. To the wicked they were unknown, to the good known; for these recognized the truth in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"

[[commentary]]
quote='''
As dying, and behold, we live. Those who held them in hatred thought every day that they would not escape the threats of wickedness; but these men, because they taught with God's favor, were kept safe by the help of Christ from present and future death. As tempted, but not delivered to death. They seemed tempted when they were so treated that they were thought to be giving way; and because they were not overcome, they were not consigned to death. For he is consigned to death who does not remain in the faith; and to death not this one, but the one to come. It can also be understood of present death; for God allowed them to be tempted so that through afflictions they might grow in merit, yet he did not permit them to be killed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
