[[commentary]]
quote='''
What then was your blessedness? He says that they were held blessed among the other churches, because they were not broken by the Apostle's injuries, but grew in faith. For I bear you witness that, if it could have been done, you would have plucked out your eyes and given them to me. He shows that their devotion toward religion was so full that not only was he well received by them, but they were also found strong in faith: and, what goes further to their praise, they offered him almost all their goods to be spent. Hence he grieves the more, because so great a love had been overturned by perverse doctrine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
