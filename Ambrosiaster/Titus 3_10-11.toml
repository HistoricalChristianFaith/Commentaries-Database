[[commentary]]
quote='''
Avoid a heretical man after the first correction, knowing that such a one is perverse, and sins, being condemned by himself. These are heretics, who attack the Law through the words of the Law; for they build their own sense upon the words of the Law, so as to commend the depravity of their mind by the authority of the Law. For impiety, knowing that the authority of the Law has great power, composes its deceit under its name, so that, since an evil thing cannot be acceptable by itself, it may be commended by the goodness of the name. Therefore, so that men of this kind may be without excuse, he says that they must be corrected once: for if they are corrected more often, they will become more practised in evil. And he who corrects them often seems to drive them on, so that they become more zealous for the ruin of many: therefore they are to be let go, so that, having become more careless, they may perhaps perish alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
