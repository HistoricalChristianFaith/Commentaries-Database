[[commentary]]
quote='''
I give thanks to my God always for you. Although he writes to all in the church, yet he signifies things in such a way, when he sometimes rebukes and sometimes praises, that each one, when the epistle is read, may understand what is said for him and what against him. For within one congregation he writes to two peoples, so that when he reproves, those who conduct themselves badly may know that these things are written to them; and likewise when he praises, he who remains in the rule may know that these things are said to him. And therefore he says:

I give thanks to my God always for you for the grace of God which has been given to you in Christ Jesus. He says that grace has been given by God in Christ Jesus, and this grace was given in Christ Jesus in this way: because it was ordained by God that whoever believes in Christ should be saved without works: by faith alone he receives the remission of sins freely.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
