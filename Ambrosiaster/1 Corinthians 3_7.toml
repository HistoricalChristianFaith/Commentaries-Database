[[commentary]]
quote='''
So neither he who plants is anything, nor he who waters: but God, who gives the increase. For things planted often die, and things watered often fail to reach the effect of fruitfulness, unless God gives them vigorous life. As far, then, as the honor of God is concerned, man is nothing; but as far as the ministry is concerned, he is necessary; so that he is honored as a servant, not so that anything should be hoped for from him to the injury of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
