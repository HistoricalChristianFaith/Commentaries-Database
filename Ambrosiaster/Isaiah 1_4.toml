[[commentary]]
quote='''
Hence it is that he added: And we were by nature sons of wrath, even as the rest. For when an evil will is put under nature, it becomes a nature of wrath, that is, one that must be subjected to punishment, changed not in substance but by an evil will. For what it follows is reckoned to the nature; hence he says in Isaiah: A most wicked seed (Isa. 1:4). And why it is a most wicked seed he added: For you have forsaken the Lord, he says, and have provoked the Holy One of Israel to anger; so that the nature which deserts God is called a most wicked seed. For to degenerate is to withdraw from the Author: and when it offers a bad example to the rest, it is a bad seed; for it produces the worst fruits. But if it returns to the Author, the nature will be good, according to the Apostle, who, changed when he acknowledged his Creator, is called the vessel of election (Acts 9:15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
