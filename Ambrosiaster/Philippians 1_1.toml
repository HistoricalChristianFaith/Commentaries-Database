[[commentary]]
quote='''
The Apostle delivered the word of faith to the Philippians; for he was warned in a dream, as is contained in the Acts of the Apostles (Acts 16:9), to go to them and open their ears to receive the word of the Lord. Having stayed with them, then, for many days, he instructed them in the teaching of the Lord. And because after his departure they were not carried over to something else, as the Galatians were, but remained in the faith, not receiving the false apostles, he praises them highly by letter, rejoicing in the purpose of their heart. In the praise of these is contained the reproach of others: for the Corinthians, though they had heard the Apostle for a long time, were overthrown by various false apostles when he withdrew; hence these are rightly praised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"

[[commentary]]
quote='''
Paul and Timothy, servants of Jesus Christ. He is silent about his being an apostle, because he is writing to those who thought rightly about him; therefore he suppresses his dignity, for it was manifest to them: but he confesses his status; because whoever confesses Christ as lord is by these things the more free, and has salvation. To all the saints in Christ Jesus. He writes to the saints according to his custom, but to those who are saints in Christ Jesus, that is, who confess Christ as God and man; for Photinus denies that Christ is God, and Mani that he is man: and therefore they are unclean. So he does not write to those who suppress the truth with their own lies. Who are at Philippi. He indicates to whom he is writing. With the bishops and deacons: that is, with Paul and Timothy, who were certainly bishops; at the same time he also indicated the deacons, who ministered to him. For he is writing to the people; for if he were writing to the bishops and the deacons, he would be writing to their persons, and he would have had to write to the bishop of that place itself, not to two or three, as he also wrote to Titus and Timothy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
