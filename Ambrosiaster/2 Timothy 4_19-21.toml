[[commentary]]
quote='''
Greet Priscilla, and Aquila, and the household of Onesiphorus. Erastus remained at Corinth: but Trophimus I left sick at Miletus. Be diligent to come before winter. These are Aquila and Priscilla, with whom he lodged and worked with his hands (Acts 18:3). And this is the Onesiphorus to whom he bears witness in the second epistle (2 Tim. 1:16). Yet how is it that, with the Apostle present, who raised the dead, Trophimus was sick? But signs were done for the sake of the unbelieving: and because merit is laid up with God from different causes; so that whether in tribulation or in sickness, he who gives thanks to God and does not seek help from the opposing side may advance in merits with God. And because of the rains and the cold he urged him to come to him in autumn. Eubulus greets you, and Pudens, Linus and Claudia, and all the brothers. In the customary manner the epistle is completed with the greeting of the brothers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
