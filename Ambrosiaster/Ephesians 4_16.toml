[[commentary]]
quote='''
From whom the whole body, fitted together and connected through every joint of supply according to the working in the measure of each part, makes the increase of the body for the building up of itself in love. He teaches on what reasoning he said that Christ is the head of all; for from him, he says, the whole body, that is, the entire choir of Archangels and Potencies, of Principalities and Powers, subsists. For although each of these has its own numbers, and they are legions, as the Lord himself said (Matt. 26:53); yet because they are from one and through one, he calls them all together one body. For just as members, though they are of one body, are yet diverse in action and dignity: so too creation was founded by God through Christ in such a way that, from the Cherubim and Seraphim, potencies which are beneath the seat of God, and from the Angels whom the Lord himself calls holy (Mark 8:38), there is as it were a kind of chain, descending in order down to the firmament; so that the whole is both joined and yet distinguished by merits: by merits, I say, not only of offices, but also of natures. For it is not that, because he says all things are joined, they will be of one nature: but whereas in the body the members make things distinct by their offices, not by nature; so in all these it is not members but the natures themselves that make the distinctions. This therefore is what is labored for: that creation be brought back to one mind, and in mind be one body, while the profession of all is one, so that it may agree in the love of the Creator to its own advancement; for it is rebuilding itself into a temple of the Lord, for it had been destroyed by the madness and fury of the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
