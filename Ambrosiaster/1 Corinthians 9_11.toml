[[commentary]]
quote='''
If we have sown spiritual things for you, is it a great thing if we reap your carnal things? He says that it is neither a great thing nor an equal one, if those who preach the kingdom of God and fatten the Church with heavenly food were to take nourishment for the body, so that, while handing on eternal things, they should obtain temporal ones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
