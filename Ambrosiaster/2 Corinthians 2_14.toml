[[commentary]]
quote='''
But thanks be to God, who always triumphs through us in Christ Jesus. For God to triumph through the apostles in Christ is this: to make them victors in the faith of Christ; so that, faithlessness having been trampled down, faith may have its trophy, while the faithless are made faithful, and the malevolent make no headway in persecuting believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"

[[commentary]]
quote='''
And to manifest the odor of his knowledge through us in every place; for we are the good odor of Christ to God among those who are being saved, and among those who are perishing. The odor of the knowledge of God is in Christ, and through Christ. And he said "odor" for this reason: because, just as certain things, though they are not seen, are nevertheless recognized by their odor, and you understand that something you do not see is in a certain place, so too God, since he is invisible, willed to be understood through Christ; so that the preaching of Christ (which indeed reaches the ears invisibly, as odor reaches the nostrils) might make known God the Father as Creator, and his only-begotten Son; and that the apostles, discharging the embassy for this (as the Lord says to God, the Son to the Father: As you sent me into this world, so I also send them into this world) (John 17:18), might manifest the odor of the knowledge of God and of Christ through signs and wonders. That this preaching about God and Christ is true is proved by the testimony of power: and this is signified by odor for this reason, because, though God is not seen, he is understood through this power, which works invisibly, to be in the apostles, so that the truth of their teaching may be made manifest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
