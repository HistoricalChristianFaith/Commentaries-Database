[[commentary]]
quote='''
Paul says this so that you will not think you have already escaped, just because God's goodness allows you to go on sinning for a long time; nor should you consider His patience something to be despised, as though He does not care about human affairs. Rather, understand that He refrains from acting against you now because God's judgment is not promised for this life, but for the life to come, so that then you may regret not having believed that God is a judge: for when you are under punishment, without any benefit from your repentance, you will repent because you did not believe in God's judgment, which you then see to be true. For it is necessary that the one whom the long patience has not corrected should be more sharply chastised, indeed, tormented with everlasting punishments. He speaks with great severity, knowing that an evil mind can scarcely be turned away from its vices except by fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
