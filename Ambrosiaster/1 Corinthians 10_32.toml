[[commentary]]
quote='''
Be without offense to Jews and Greeks, and to the Church of God. He teaches that our conduct must be so tempered that no one suffers a stumbling-block in it. Offense, then, is given to the Jews when they see that a Christian, who says that he accepts the Law and the prophets, does not shrink from idols, which they abominate. But to the Greeks, that is, the Gentiles, this is the offense, if in the state in which they are, they are not only not reproved, but even become more ready, while the votive offerings of those idols of theirs are not avoided. And a stumbling-block is made for the Church of God when she sees some of her own number cleaving to the things that are hostile to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
