[[commentary]]
quote='''
And it is bearing fruit and growing, as also among you, from the day on which you heard and knew the grace of God in truth, as you learned from Epaphras, our beloved fellow servant, who is a faithful minister of Christ for you, who also made known to us your love in the spirit. He goes on, in eager words, to say that we grow and bring forth life-giving fruit as an example to the other Gentiles; so that, from their having received the grace of God, they might advance both in number and in work, joining to their faith those who would become their brothers in Christ. For many were drawn by the example of their good works, as Epaphras testifies for them, who ministered the grace of Christ to them in the Apostle's stead, which they at once drank in as a spiritual drink in the love of the Lord, a love which is not in the flesh but in the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
