[[commentary]]
quote='''
I fear for you, lest I have labored in vain among you. The Galatians had been overturned in a twofold way, so that after the grace of God they were turned not only to the Law, but to their former errors. For, misled or overthrown, they had easily turned aside into the Law, to the observance of days and months; for the observance of the sabbath and of the new moons drew them to these things. Therefore he says: I fear lest I have labored without cause among you; for he saw them advancing for the worse in such a way that they might even withdraw wholly from Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
