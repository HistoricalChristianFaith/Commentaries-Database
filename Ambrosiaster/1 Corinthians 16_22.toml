[[commentary]]
quote='''
If anyone does not love the Lord Jesus Christ, let him be anathema maranatha, which is interpreted: If anyone does not love the Lord Jesus, who has come, let him be cut off. For Maranatha means: the Lord has come. This is on account of the Jews who said that Jesus had not come; these, then, are anathema from the Lord, who has come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
