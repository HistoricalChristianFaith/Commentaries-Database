[[commentary]]
quote='''
Since many boast according to the flesh, I too will boast. He says this because some of the Jews who believed were presuming on the fact that they were sons of Abraham. This is to boast according to the flesh: to claim for oneself the nobility of the flesh. For on this ground they defend for themselves the prerogative of their race; because those are called his sons who have believed God: Since the soul that has sinned, it shall die (Ezek. 18:20). If, then, this is glory, he says, I too will boast; for I too am a son of Abraham. But it profits nothing before God to be a son of Abraham; for it is faith that saves, not descent from the race of Abraham. And therefore this glory is a glory of the flesh, as if, for instance, it were said: a noble son of a man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
