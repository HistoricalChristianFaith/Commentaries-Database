[[commentary]]
quote='''
For he says that Christ is his life, whether in the present or in the future, as John the evangelist also testifies, saying: What was made, in him was life, and the life was the light of men (John 1:3–4). For this life he hands over his mortal body, so that he may receive it for eternity: and for this reason he counts it gain to die for Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
