[[commentary]]
quote='''
And say to Archippus: See to the ministry which you have received in the Lord, that you fulfill it. Through the people themselves he admonishes their overseer to be anxious for their salvation; and because the epistle is written for the sake of the people alone, it is therefore addressed not to their ruler, but to the Church. For after Epaphras, who instructed them, this man received their Church to rule.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
