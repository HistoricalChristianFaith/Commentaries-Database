[[commentary]]
quote='''
For the Son of God, Jesus Christ, who is in you, who was preached by us, by me and Silvanus and Timothy, was not Yes and no: but in him was Yes. As far as fit preachers are concerned, this is how it ought to be: that with them there is Yes, yes, no, no; so that they do nothing other than what they know to be advantageous. For since we often wish something other than what is advantageous, the Apostle, lest will overcome advantage, therefore set advantage before his will, so as not to go to them. For in Christ Jesus there was not Yes and No, but in him was Yes; because he never willed anything other than what is advantageous. For his will is always joined with advantage: nor was he changed, so as to do unwillingly, like a man, what is advantageous; or so as to waver about anything and change his will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
