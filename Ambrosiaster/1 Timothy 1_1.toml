[[commentary]]
quote='''
Timothy was the son of a believing Jewish woman, his father being a Greek, on whose account he could not be circumcised as a little child. Through his mother's zeal he learned the sacred letters, and, applying himself to them, he established a good life for himself (Acts 16:5). When the Apostle wished to take him on, knowing that he would be a fit steward of the truth of the Gospel, he was compelled for the sake of the Jews to circumcise him, since they insisted that one who had been born of a Jewish mother ought not to be taken on uncircumcised for the office of teacher, because of the testimony of his race. So, now that he has been made bishop, he instructs him by letter how he ought to order the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"

[[commentary]]
quote='''
Paul, an apostle of Christ Jesus according to the command of God our Savior, and of Christ Jesus our hope, to Timothy, genuine son in faith. Grace, mercy and peace from God our Father, and Christ Jesus our Lord. He shows that he was made an apostle by the command of the Father and of the Son, so that he might preach salvation in God the Father and hope in Christ his Son; so that, since no one denies that salvation is in God, no one should doubt either that hope is in Christ Jesus, whom he would recognize, raised from the dead, as having given the example of this hope. He writes to Timothy in this way so that he might be secure about his own ordination, because he was chosen to teach by the command of the Father and of the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
