[[commentary]]
quote='''
Let all bitterness, and anger, and indignation, and clamor, and blasphemy be taken away from you with all malice. All these things which can bring ruin to souls he records as things to be removed; for through anger comes indignation, through indignation clamor, as it were the voice of one raving, which is foreign to a servant of God: through clamor creeps in blasphemy, which cannot but be evil. This makes life bitter, drawing it to death: and therefore one must beware of all these; for the fear of God ought to temper and set a limit to the causes that arise. But because some can, with anger and clamor held down in the mind, keep their malice for retaliation when an occasion is found, he therefore added that these should be taken away with all malice; because not only is it malice to blaspheme, but also to feign peace in the face and in the mind to meditate discord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
