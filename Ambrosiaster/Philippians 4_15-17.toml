[[commentary]]
quote='''
And you also know, Philippians, that in the beginning of the Gospel, when I set out from Macedonia, no Church shared with me in the account of giving and receiving except you alone; for when I was in Thessalonica, you sent once and again for my needs: not that I seek a gift, but I seek the fruit that increases to your account. He recalls these things for this reason: that, hearing that their works are held in remembrance and praise, they may not doubt that they are credited before God, but may rather apply zeal for the faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
