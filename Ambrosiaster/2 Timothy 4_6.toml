[[commentary]]
quote='''
For the Apostle, knowing that his passion was imminent, wishes to leave in holy Timothy an example of a godly way of life and of sound teaching; so that through a line of transmission suitable teachers might never be lacking: yet he calls his passion a libation; for he who suffers for God's righteousness is sacrificed to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
