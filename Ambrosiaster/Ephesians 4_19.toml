[[commentary]]
quote='''
And the blindness of their heart, who, despairing, have given themselves up to lewdness, unto the working of all uncleanness, and of avarice. He indicates that the Gentiles have blindness of heart through despair of the future resurrection. For, as though they were not to exist any longer, they defile their life with most shameful working, unwilling to submit themselves to the law of faith; because it forbids pleasure for the sake of the hope of the life to come, which these men judge should be laughed at for this reason, that they may seem with right to dishonor themselves and to covet the goods of others with greedy desire, as though after this passage (of life) there were no life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
