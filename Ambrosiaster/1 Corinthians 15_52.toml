[[commentary]]
quote='''
In a moment, in the twinkling of an eye, that is, quickly, without any delay. At the last trumpet; last for this reason, because the final war is waged against the demons, and princes, and powers, and the devil himself. For this will take place after the thousand years in which the Savior will reign here, the Antichrist having been destroyed, when Satan will be let loose from his prison to seduce the nations Gog and Magog, who are demons, so that they may fight against the camp of the saints; for temporal men will not be able to contend against eternal ones. For John the apostle too says: I saw Michael and his angels in heaven fighting against the dragon and his angels, who is the devil and Satan (Rev. 12:7). And therefore he says here last trumpet, because the battle against him has been fought more than once; because both in the Antichrist (the false prophets, who worked signs and wonders before him, and he himself the victor) and in this place he will be fought against for the last time, so that he may now be sent into Gehenna. And the Savior, among other things, says: Now the prince of this world will be cast down (John 12:31). So both then and often he has been conquered, as Isaiah the prophet says: How Lucifer has fallen from heaven, who rose in the morning (Isa. 14:12).

For the trumpet will sound, and the dead will rise incorrupt, and we shall be changed. For when sinners and the ungodly rise, the saints will be changed in brightness, so that the flesh becomes spiritual with glory, as if lead were to become gold. For the saints will rise at the coming of the Lord, as he said above (1 Cor. 15:23): Christ the beginning: then those who are Christ's at his coming, as is contained in the Apocalypse; for sinners are not Christ's, who hear from the Lord: I do not know you (Matt. 7:23). For in the first psalm too it is written: Therefore the ungodly will not rise in judgment, nor sinners in the council of the righteous (Ps. 1:5). For of the ungodly there is nothing to be inquired: but they will rise for this, that they may perish, seeing that what they refused to believe is true: and to perish is to be estranged from God, as he says to the Romans: For whoever have sinned without the law will perish without the law; and those who have sinned in the law will be judged by the law (Rom. 2:12): and so sinners will judge; for they are unworthy to rise with the saints, as he says: Nor sinners in the council of the righteous.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
