[[commentary]]
quote='''
And if I am nothing, yet the signs of an apostle were done among you in all patience, by signs, and wonders, and mighty works. Thus he humbles himself in order to raise himself up; yet he mentions patience first, because for a long time he bore with them as with impatient sick people, so that, applying the medicine of signs and mighty works, he might heal the wounds of their error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
