[[commentary]]
quote='''
My little children, of whom I am again in labor until Christ be formed in you. At first he had begotten them through faith in baptism; but because, born as if by a miscarriage, they were found deformed and weak, he now, with the pain of counsel, re-forms them into Christ. For, conceiving faith but paying no heed to the meaning of faith, they are said not to have Christ formed in their souls; for if they had understood the grace of God in Christ, they would not have been carried over into Judaism after faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
