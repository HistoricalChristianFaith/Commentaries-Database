[[commentary]]
quote='''
And we are also found false witnesses of God, because we have borne witness against God, that he raised up Christ, whom he did not raise up. Whoever asserts that God raised Christ from the dead is a false witness, if it was not done; yet he proclaims the power of God, surely not as an enemy, since he ascribes so wonderful a deed to his power. But if it is true that he raised Christ from the dead, what must be said to this man, who is both a false witness against God and asserts that his work is folly?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
