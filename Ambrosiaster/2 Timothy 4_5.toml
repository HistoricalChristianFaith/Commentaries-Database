[[commentary]]
quote='''
But you, be sober, patient in all things; do the work of an evangelist, fulfil your ministry; for I am already being offered as a libation, and the time of my dissolution is at hand. He admonishes and exhorts him to keep watch in ecclesiastical discipline, to act manfully, to explain the Scriptures, so that the prudent and learned may avoid empty fables.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
