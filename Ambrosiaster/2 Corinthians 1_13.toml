[[commentary]]
quote='''
For we write to you no other things than what you have read and know. He says that he writes the things which they not only saw in his letters but also had manifest in his works; to prove that he fulfills by his deeds the things he says, deeds by which the mind and purpose of each person is learned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
