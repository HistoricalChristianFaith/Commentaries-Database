[[commentary]]
quote='''
If, then, to live in the flesh, this is for me the fruit of work: and what I shall choose I do not know. But I am hemmed in between these two, having the desire to be dissolved and to be with Christ, for it is much better; but to remain in the flesh is very necessary for your sake. And having this as certain, I know that I shall remain and continue with you all for your advancement and joy of faith, so that your glory may abound through Christ Jesus in me, through my coming to you again. What he says is manifest: that if he is placed in the flesh, his living is not idle; for he has the fruit of his work. What I shall choose, he says, I do not know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
