[[commentary]]
quote='''
Whether, then, through the Son or through servants, God exhorts the people; because the whole sum must be referred to him by whose will and providence Christ was incarnate to redeem the salvation of men; who, when he wished to return to the Father, gave to the disciples the dispensation he had received from the Father.

Beseeching you on behalf of Christ to be reconciled to God. This is what I said: that in place of Christ he gave the apostles as vicars, so that in his stead they might preach being reconciled to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
