[[commentary]]
quote='''
For the body too is not one member, but many. By saying this he shows that unity has varieties of offices, and that this diversity does not disagree in the unity of power; since the unity of the body consists not in singleness but in many members, so that they may render to one another what they owe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
