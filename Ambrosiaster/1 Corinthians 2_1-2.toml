[[commentary]]
quote='''
And I, when I came to you, brethren, came not with eminence of speech or of wisdom, preaching to you the mystery of God. For I did not judge that I knew anything among you, except Christ Jesus, and him crucified. Since above he has shown, step by step, the form of our teaching, he now proves that he handed on to them nothing other than what he has shown; for he spoke to them of the mystery of Christ both in lowliness of speech and in the foolishness of preaching, as it seems to the world. He calls it a mystery for this reason: because what became incarnate was hidden from the ages with God, God the Word. But those in whom they gloried were heretics, because they both commended a depraved doctrine through eloquence and, following the prudence of the world, emptied the cross of Christ, ashamed to be called foolish by the world; so that they neither preached that Christ was born of the Virgin nor taught that he was truly crucified; for it seems foolish to confess that the Son of God was born a man and crucified. These too the apostle John points out, saying: He who denies that Christ has come in the flesh is antichrist; and he who denies the Son does not have the Father either (1 John 2:23–24); for they said that the Father himself was called Son to himself; and from these Marcion drew his error. The things he censures seem closed; for he does not make them plain, but wishes them to be understood from the fact that the prudence of the world is found there, which is hostile to religion. And what the things are that he rebukes, he wishes to be learned from his judgment; so that, whatever of ours it derides as foolish, he may show that he reproves all these things in the Corinthians. For he mentions the body itself, so that from it the condition of its members may be discerned: to the Corinthians, however, they were plain; for they were not ignorant of the causes for which they were being reproved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
