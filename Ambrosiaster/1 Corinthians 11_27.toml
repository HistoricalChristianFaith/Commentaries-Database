[[commentary]]
quote='''
Therefore whoever eats this bread or drinks the cup of the Lord unworthily of the Lord will be guilty of the body and blood of the Lord. He says that he is unworthy of the Lord who celebrates the mystery otherwise than it was handed down by him. For he cannot be devout who takes it otherwise than it was given by its author. And therefore he warns beforehand that the mind of one approaching the eucharist of the Lord should be devout according to the order handed down; since there is to be a judgment, so that each one, according to the manner in which he approaches, may render account in the day of the Lord Jesus Christ; because those who approach without the discipline of tradition and of way of life are guilty of the body and blood of the Lord. And what is it to be guilty, if not to pay the penalty for the Lord's death? For he was slain for those who make his benefit void.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
