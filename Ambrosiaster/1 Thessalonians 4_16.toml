[[commentary]]
quote='''
For the Lord Christ himself, by the will of the Father, as the first angel of the heavenly army, as is contained in the Apocalypse of John the apostle (Rev. 12:7 ff.), will descend from heaven to wage war in the name of God against the Antichrist. When he has been destroyed, the dead will rise at his command. This, then, is to descend with the trumpet of God: to wage war in the name of God; for he is, as he himself said to Joshua the son of Nun (Josh. 5:14), the leader and prince of the army of the Lord, on which account he is called archangel. But when he descends with the trumpet of God, he is God; because the Scriptures contain both, as in Exodus: he whom we read appeared to Moses as an angel in the flame, we at once recognize in what follows to be God himself, that is, the Son of God, as the same Scripture says: And Moses, approaching, he says, turned himself away; because he could not look upon the face of God (Exod. 3:6). He is God, therefore, because the Son of God is true God: and leader and prince for this reason, because he is the head of all; because through him are all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
