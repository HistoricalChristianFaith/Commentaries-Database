[[commentary]]
quote='''
But we know that if our earthly house of this dwelling is dissolved, that we have a building from God, a house not made with hands, eternal in the heavens. With this confidence he says that one should not fear to be dissolved from the body by the violence of unbelievers or by the lot of life, because for men of this kind an eternal dwelling has been prepared in the heavens, so that, driven out of the temporal and earthly one, they may be received into a perpetual house. Hence this too is to be wished for, if it can happen; but since it is not to be wished for, lest another perish in your glory, yet if it should happen, it is to be borne gladly. For he called this flesh an earthly house because it is mortal, so that if we are dissolved from it, we shall find a house built in the heavens, eternal. This house signifies the immortal body, in which, rising again, we shall exist forever, and whose form has already been shown forth in the heavens in the body of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
