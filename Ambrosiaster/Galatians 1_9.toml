[[commentary]]
quote='''
Why does he say, You would rightly bear it, if another Christ had been preached to you, or if another Spirit or another Gospel had been delivered to you, when he says to the Galatians: If anyone announces to you anything besides what you have received, let him be anathema (Gal. 1:9)? If it was perverse for the Galatians to receive anything other than what had been handed down by the apostles, how was it right for the Corinthians if another Christ had been preached to them? But the Apostle, knowing that no other Christ is ever preached than this one who was crucified, therefore says: You would rightly bear it, if another, greater Christ had been preached to you by those who come. To the Galatians, however, he pronounced anathema if they heard anything else, which would surely not be greater, but contrary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
