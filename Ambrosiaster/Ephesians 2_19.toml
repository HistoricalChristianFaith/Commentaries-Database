[[commentary]]
quote='''
Therefore you are now no longer strangers and sojourners, but you are fellow citizens of the saints, and members of the household of God. He admonishes them to be mindful of the benefits of God; because when they were far from the knowledge and fear of God, they were joined by his mercy, so as to become partakers with those who were near to God, made fellow citizens of the sons of God. For just as whatever nation desired to pursue the peace of the Romans was received upon offering gifts, so that they became Roman citizens, as the Tarsians of Cilicia, whence the Apostle says that he is a Roman citizen (Acts 22:26): so too whoever has joined himself to the Christian faith becomes a citizen of the saints and a member of the household of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
