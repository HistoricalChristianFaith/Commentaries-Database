[[commentary]]
quote='''
Here now it is required among dispensers that one be found faithful. What he says here pertains not only to the person of the false apostles, but also to that of the others who, having received a dispensation, out of bashfulness, or fear, or surely for the sake of their own commendation, were afraid to reprove steadfastly either evil opinions or evil morals. For he was so steadfast that he did not spare even his own life, provided that he performed all things faithfully.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
