[[commentary]]
quote='''
For if I build up again the things which I destroyed, I make myself a transgressor. It is plain that one who comes to Christ leaves the Law; for from a slave he becomes free. But if he returns again to the Law, he becomes his own accuser, because he condemns his own act.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
