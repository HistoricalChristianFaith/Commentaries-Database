[[commentary]]
quote='''
For Moses too, having taken the blood of a calf in a bowl, sprinkled the children of Israel, saying: This is the testament which God has appointed for you (Exod. 24:8). This was a figure of the testament which the Lord called new through the prophets, so that that one which Moses handed down might be the old. The testament, then, was established with blood, because blood is the witness of the divine benefit. As a type of this we receive the mystical cup of blood for the protection of our body and soul; because the blood of the Lord has redeemed our blood, that is, has saved the whole man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
