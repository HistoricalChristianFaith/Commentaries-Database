[[commentary]]
quote='''
DID LAMECH KILL CAIN, AS SOME THINK? — Those who think this are mistaken, believing that when Lamech spoke of Cain he meant, “I killed a man who hurt me, a young man who covered me with wounds.” (Gen. 4:24) By then Lamech had already been born in the fifth generation from Cain, that is, from Methuselah, Cain’s great‑grandson. Lamech mentions this to show that anyone who sins under a revealed law must be bound more strictly. And therefore, if after Cain his imitator was avenged seven times, how much more must vengeance be taken on the one whom neither Cain’s deed and correction, nor the sentence afterward passed on him, was able to terrify, so as to turn his will away from so wicked and cruel a crime? Therefore, after Cain, Lamech committed this murder, and undoubtedly, in line with what was said above, he paid sevenfold vengeance. And he shows what would happen after Lamech to whoever followed his example, when he says, “But on Lamech seventy‑seven times” (Gen. 4:23–24). Since a wicked deed not followed by repentance is struck with seventy‑seven blows of punishment, therefore also the Savior commanded that one who sins seventy‑seven times, if he turns back, is yet to be forgiven (Matt. 18:22).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 6: DID LAMECH KILL CAIN?"
