[[commentary]]
quote='''
For if I do this willingly, I have a reward. It is plain that no one receives a recompense for a thing which he does against his will. For if he is willing, he is worthy of a reward, because he is in agreement with his master; and what is done by will is done better. But if against my will, a dispensation has been entrusted to me. Nor is this obscure, for one who does something without devotion does it not by will but by necessity. For because he is not in his own power, he does against his will what he has been commanded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
