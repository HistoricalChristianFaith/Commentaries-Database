[[commentary]]
quote='''
As therefore you have received Christ Jesus the Lord, walk in him, rooted and built up in him, and confirmed in faith, as you have also been taught, walking in it with thanksgiving. This he warns and exhorts, that their devotion should not be diminished, and that they should not withdraw from the faith which they had attained, and, overthrown by wicked fables, receive Christ otherwise than they had learned. For many corrupters of the faith were going about to seduce the simple, proclaiming Christ deceitfully and with pretence; and he warns them to avoid these with great caution; so that, stable and firm upon the foundation of the Trinity, in the hope of things to come they might give abundant thanks for the mercy of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
