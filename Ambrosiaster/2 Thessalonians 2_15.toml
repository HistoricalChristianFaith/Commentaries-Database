[[commentary]]
quote='''
Therefore, brothers, stand firm, and hold our traditions, which you have learned, whether by word or by our epistle. So that the foreknowledge of God may remain unto their salvation, he therefore warns that they must stand and persevere in the tradition of the Gospel, so that they may take care lest, growing torpid in the works of God through sloth and idleness, they fail to complete what they have begun. For he foreknows that they believe and can remain on this condition: if they are roused by frequent admonition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
