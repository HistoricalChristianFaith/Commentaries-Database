[[commentary]]
quote='''
For we have come as far as you in the Gospel of Christ, not boasting beyond measure in others' labors. Here what he says appears more plainly: that he himself had founded them. Therefore he speaks to them with such confidence; for they had not been won to the faith by another's labor, as he says in another letter: For in Christ through the Gospel I have begotten you (1 Cor. 4:15). He, then, does not boast beyond measure who boasts in his own labor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
