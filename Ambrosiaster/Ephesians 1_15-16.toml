[[commentary]]
quote='''
Therefore I too, having heard of your faith in the Lord Jesus, and of your love toward all the saints, do not cease giving thanks for you, making remembrance of you in my prayers. Since, according to the decree of God by which he determined that the Gentiles should become partakers of the promise of the Jews, the Ephesians, having heard the word of God, received the faith of Christ, loving all the saints as the Lord commanded, for this reason he gives thanks to God for their conversion and love, to God who deigned to make the Gentiles one body with the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
