[[commentary]]
quote='''
They emulate you not well: but they wish to shut you out, so that you may emulate them. He signifies that they were overturned by the envy of the Jews; for, seeing them advance so in the Gospel and have such great love for the Apostle, these contrived to deceive them. For they were enemies to the apostles because of the Law, so that, while the name of the Savior remained, they might make them Jews, rejoicing in their overthrow; for they could not bear to hear that the grace promised to themselves had been given to the uncircumcised Gentiles. Therefore they wished them to become their imitators, so that they might be circumcised after their manner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
