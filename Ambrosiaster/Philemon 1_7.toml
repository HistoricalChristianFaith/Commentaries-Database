[[commentary]]
quote='''
For I have had great joy and consolation over your love, because the hearts of the saints have found rest through you, brother. It is plain that he indicates that he is glad for this reason, that Philemon was supplying necessities for the needs of the saints: hence he rejoices the more, being sure from this that he would also obey the commands of him who, it is agreed, is the greater.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
