[[commentary]]
quote='''
If I speak with the tongues of men and of angels, but do not have love, I am one like sounding bronze, or a tinkling cymbal. Great indeed seems the grace of speaking in diverse tongues; but it is something more if one can know even the tongue of angels, that is, if one can have the motion of angels known spiritually. But that this is not to be ascribed to merit, but to the glory of God, he shows in what follows, saying that it is like sounding bronze, or a tinkling cymbal. Because, just as bronze resounds at the impulse of another, and a cymbal tinkles, so also this man who speaks in tongues has the effect and motion of the Holy Spirit, so that he can speak, as the Savior also says in another place: For it is not you who speak, but the Spirit of your Father who speaks in you (Matt. 10:20). For even the ass spoke with a human tongue to Balaam son of Beor, that he might learn the majesty of God (Num. 22:28); and infant children burst forth into the praise of God, to the confusion of the Jews (Matt. 21:16). And the Savior showed that not only these but even the stones could cry out, for the condemnation of the faithless and the glory of God (Luke 19:40). And at the very beginnings, for the commendation of the faith, those who were baptized spoke in tongues (Acts 10:46).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
