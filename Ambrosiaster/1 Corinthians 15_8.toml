[[commentary]]
quote='''
And last of all, as to one untimely born, he was seen by me also. He appeared to him first in heaven, afterward while he was praying in the temple (Acts 9:4; 22:17). He called himself one untimely born because, born in Christ outside the due time, he received the apostleship when Christ had already been taken up into heaven with the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
