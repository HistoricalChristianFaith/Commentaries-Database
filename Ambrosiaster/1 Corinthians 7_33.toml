[[commentary]]
quote='''
But he who is with a wife is anxious about the things that are of this world, how he may please his wife. For care of a wife and children is a thought of the world: for among other things men sometimes commit punishable deeds, so as not to offend them, as Zerubbabel, one of the three chamberlains of Artaxerxes, relates (1 Esd. 4:13): for a sad wife is great bitterness in a house. He is called divided for this reason, because he cannot both apply himself to divine things and do his wife's will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
