[[commentary]]
quote='''
What does the Apostle mean when he says, “No one can say, Lord Jesus, except in the Holy Spirit” (1 Cor. 12:3)? Can Photinus, who denies that Christ is God, confess our Lord Jesus Christ in the Holy Spirit? And Marcion and Manichaeus, who deny that Christ came in the flesh, can they say “Lord Jesus Christ” in the Holy Spirit? Or prostitutes and the impure, when the Holy Spirit does not dwell in a body subject to sins, and wisdom does not enter into a hateful soul (Wis. 1:4)? — Truth is neither proved nor disproved by a person’s status; for whatever is spoken well and truly is undoubtedly spoken in the Holy Spirit. Therefore, if someone is guilty in other matters, he should not on that account be opposed in this one also, when he speaks the truth. Yet he is not really being opposed, but the Lord Christ is being contradicted. For whoever denies that this man speaks the truth does an injury to Christ. But if what is said is true, and it is denied that what is true is spoken in the Holy Spirit, something which Christ himself accepts (for no good person reproves someone who speaks truth about him; nor is what is learned by tradition learned by revelation), no one who speaks the truth can be condemned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 53: ON \"NO ONE CAN SAY, LORD JESUS, EXCEPT IN THE HOLY SPIRIT\""

[[commentary]]
quote='''
Therefore I make known to you that no one speaking in the Spirit of God says anathema to Jesus; and no one can say Lord Jesus except in the Holy Spirit. Since, being ignorant of the reason of spiritual things, they gave the glory for the individual gifts to men rather than to God, not having grasped that this gift is ministered through the Holy Spirit; and because he who calls Jesus Lord does not say this without the Holy Spirit (for in that very thing he has the grace of his faith on account of the glory of the name of Christ; for it is not without a gift of God that one says Jesus is Lord): by this he shows them that in all things the praise and the grace are God's. For just as the image of idols is in its ministers, having its order through the individual ranks, and yet the whole is man's; so also in the Lord's law there are ranks of gifts for the offices of the Church, granted certainly not to human merits, but as members pertaining to the edification of the Church, which have glory through themselves and in themselves, as is also the case in human offices. For there are colleges which give dignity to those placed in them, so that it is the honor of the place that makes a man glorious, not his own praise. He says, then: No one speaking in the Spirit of God says anathema to Jesus. For the utterance which says anathema to Jesus is brought forth by human error; for whatever is false is from man. And no one can say Lord Jesus except in the Holy Spirit. For the very saying by which Jesus is signified as Lord has been poured forth not from the flattery of men, as idols too are called gods, but from the truth of the Holy Spirit; for whatever true thing is said by anyone is said by the Holy Spirit. So that they should not, then, suppose that there is human favor in the Christian rule, and on that account should by no means suffer themselves to be reproved, as is the case with images too (for man contrived that he should be called God who is not; and for this reason the priests are subject to them), he shows them that there is no human benefit in it when Jesus is called Lord, but rather a gift of God, who deigned to declare his mystery to men. For indeed the profession itself acquires the remission of sins, just as the dedication of idols claims to do. He teaches them, then, that in saying Lord Jesus they do not confer a benefit on religion, but receive one; lest, after the manner of idols, they should think that the favor in the law of the Lord is men's, as when one is called God who is not. Finally, not understanding that the gift of God lies in faith, they had each chosen for themselves individual men to follow, saying: I am of Paul, but I of Apollos (1 Cor. 1:12). He therefore humbles their pride, so that they may suffer themselves, as I said, to be reproved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
