[[commentary]]
quote='''
Wherefore, beloved, flee from the worship of idols. He exhorts them even now to abstain from all fellowship with idolatry, so that not only hope but also the mind may be taken away from it, lest through this a temptation against God should arise. For no one who is assiduous in the idol-temple hopes for nothing from it; for to hope from that quarter is to doubt about God, just as Saul too, having abandoned God, who was angry with him because of his offense, betook himself to idolatry, hoping for something from it (1 Sam. 28:12 ff.). This both harmed him in the present, and provided for him an avenging Gehenna in the future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
