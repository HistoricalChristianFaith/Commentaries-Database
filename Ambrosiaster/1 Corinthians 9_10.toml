[[commentary]]
quote='''
Or rather, he says, he says it for our sake: for it was written for our sake. For through a figure all the things said pass over to us. Because he who ploughs and threshes in hope ought to receive the fruit of his hope. That is true, for one labors in this hope, that the fruit may be gathered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
