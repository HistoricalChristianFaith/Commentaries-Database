[[commentary]]
quote='''
Let no one lead you astray with empty words; for because of these the wrath of God comes upon the sons of distrust. Do not, therefore, become partakers with them. Empty discourses are vain; and vanity is the worship of idols, which certainly takes its beginning not from God but from error. He teaches, then, that assent should not be given to the words of these men; for they are always clamoring, and with a certain seductive deceit they hold up the custom of antiquity against the faith, judging that the reckoning of present things, not the hope of things to come, is what must be maintained. Therefore vengeance comes upon them from heaven, that they may know that what they refused to believe is true. From this vanity he teaches that the servants of God ought to be kept far apart, lest they become partakers of their punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
