[[commentary]]
quote='''
All the saints greet you. He provokes them to holiness, so that they too may venture to return the greeting to the saints; for they are greeted by the saints for this reason, that they may imitate them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
