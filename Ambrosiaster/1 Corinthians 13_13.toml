[[commentary]]
quote='''
But now there remain faith, hope, love, these three: but the greater of these is love. Deservedly love is greater, because it was love that brought it about that faith should be preached and that there should be hope of the future life, as I mentioned above. Hence also the apostle John: By this we know, he says, his love; that he laid down his life for us (1 John 3:16). Rightly, then, love is greater, through which the human race has been refashioned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
