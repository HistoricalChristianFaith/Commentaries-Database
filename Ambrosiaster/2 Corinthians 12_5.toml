[[commentary]]
quote='''
On behalf of such a man, that is, one so worthy of God that he should experience this, he says that he will boast; and he does not wish to say openly that he is speaking of himself, lest he seem to praise himself. So too John the apostle, though it is known that he is speaking of himself: This is, he says, the disciple whom Jesus loved, who also reclined at supper on his breast (John 21:20), lest he seem to speak gloriously of himself. But on my own behalf I will not boast, except in my weaknesses. Thus he does not boast of himself, as long as he does not declare openly that it is himself. In my weaknesses, he says, I will indeed boast. For to set out the afflictions of sufferings and the weaknesses of straits does not seem glorious, but lamentable. Therefore he says that he boasts in these, knowing nevertheless that they lead to the gain of heavenly rewards. For what will be so glorious for a Christian in the future as to recount the deadly perils inflicted on him for Christ?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
