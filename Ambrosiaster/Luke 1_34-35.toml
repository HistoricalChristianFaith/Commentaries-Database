[[commentary]]
quote='''
HOW IS IT TO BE UNDERSTOOD THAT, WHEN MARY SAID TO THE ANGEL, “AND HOW SHALL I KNOW THIS, FOR I DO NOT KNOW MAN?”, THE ANGEL GABRIEL REPLIED, “THE HOLY SPIRIT WILL COME UPON YOU, AND THE POWER OF THE MOST HIGH WILL OVERSHADOW YOU” (Luke 1:34–35)? — To Mary, who was uncertain about the conception, the angel proclaims its possibility, saying, “The Holy Spirit will come upon you”; that is, Do not doubt because you do not know a man: for what I said, that you will conceive, the Holy Spirit, coming upon you, will bring about that you conceive without a man. And he says, “And the power of the Most High will overshadow you.” The power of the Most High is without doubt Christ: for this relates to his own person. Therefore, when the Holy Spirit came upon the Virgin, he sanctified her by his working, producing from her a holy body, in which the Power who is called the Son of God would be born. This overshadowing of the Virgin is this: that from the immensity of the Godhead there should be something in the womb of the Virgin, as much as human nature could receive, which, as it were from the brightness, would be called an overshadowing, and would be the power of God; which power of God is also God. For there is nothing that is from God which is not called God. For this is a property of what is bodily: that there can be something in flesh that cannot be called flesh, such as hair, and bones, and strengths, and the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 51: ON THE OVERSHADOWING OF THE VIRGIN"

[[commentary]]
quote='''
HOW IS IT TO BE UNDERSTOOD THAT, WHEN MARY SAID TO THE ANGEL, “AND HOW SHALL I KNOW THIS, FOR I DO NOT KNOW MAN?”, THE ANGEL GABRIEL REPLIED, “THE HOLY SPIRIT WILL COME UPON YOU, AND THE POWER OF THE MOST HIGH WILL OVERSHADOW YOU” (Luke 1:34–35)? — “To Mary, who was uncertain about the conception,” etc. “The power of the Most High is without doubt Christ.” For this saying pertains to his own person; for this is a sign of the Son of God, that is, when he is called the Power of God. According to the Godhead, however, the Father is power, and the Holy Spirit is power, and of these three there is one power, because there is one substance. Therefore the Holy Spirit made flesh for the Savior from the Virgin; but the power of the Most High, that is Christ, overshadowed her by coming into the flesh made by the Spirit, so that in body and soul the power of the Son might lie hidden. But for it to lie hidden means that for a time it is not understood. It must be considered, however, what “overshadowing” is to be understood as in full. If the force of this word is expressed, the overshadowing of the power of God is understood as some kind of coming upon, so that when the body is overshadowed, it is recognized as receiving something from the power of God. But this “something” is the whole, because the divinity cannot be divided. It therefore follows: “Therefore also the holy one who will be born of you shall be called the Son of God.” (Luke 1:35) For that which is born of the Holy Spirit, having in itself the overshadowing of the power of God, which is the Son of God, is without doubt born holy; that is, the body of the Son of God. For the body of the Holy One is holy. Therefore the holy Son of God was born in a holy body. Therefore indeed David spoke of the flesh of Christ: “You will not allow your Holy One to see corruption” (Ps. 16:10), so that in the holy body he himself is signified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 38: ON THE OVERSHADOWING OF THE VIRGIN"
