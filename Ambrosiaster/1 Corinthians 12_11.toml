[[commentary]]
quote='''
But all these things one and the same Spirit works, dividing to each one as he wills. What he said above of the three persons, he now professes to be done through the one Holy Spirit; so that, because they are of one nature and power, what one works, the three work: yet there is one God, whose grace is divided to individuals as he wills, not according to the merits of men, but rather for the edification of his Church; so that all the things which the world wants to imitate but does not fulfill, because it is carnal, may be seen here in the Church, which is the house of God, granted to the offices of individuals both by the gift and by the teaching of the Holy Spirit, for the proof of the truth, in those who are contemptible to the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
