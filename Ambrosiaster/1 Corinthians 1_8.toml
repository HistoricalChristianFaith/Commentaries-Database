[[commentary]]
quote='''
Who will also confirm you to the end without reproach at the coming of our Lord Jesus Christ. With an eager mind, confident of their hope, he is secure, because they will remain unharmed until the future judgment. For those who, amid so many conflicts of opinions and disturbances of differing views, could not be changed at all, show beyond doubt that they will remain in the same state. While he praises these, he invites those who had been corrupted in the error of the false apostles: for while he proclaims the faith of the former, he calls the latter to repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
