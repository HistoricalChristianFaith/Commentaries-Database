[[commentary]]
quote='''
If then you are all one in Christ Jesus, then you are the seed of Abraham, heirs according to the promise. All believers are the seed of Abraham, because Abraham is the father of all believers; and if they are sons, they are necessarily also heirs of his promise, so that they may obtain through faith what was promised to Abraham, so that we may be partakers of his justification in the kingdom of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
