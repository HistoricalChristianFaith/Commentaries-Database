[[commentary]]
quote='''
But I decided this with myself, not to come to you again in sorrow. It is clear that he did not wish to go for this reason: lest perhaps, in rebuking a few, he should grieve many, being himself grieved as well; for all the members suffer together in the grief of one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
