[[commentary]]
quote='''
IF BAPTISM IS A HEAVENLY MYSTERY, WHY DOES THE LORD, WHEN SPEAKING WITH NICODEMUS WHO DOUBTED CONCERNING BAPTISM, SAY: “IF I HAVE TOLD YOU EARTHLY THINGS, AND YOU DO NOT BELIEVE, HOW WILL YOU BELIEVE IF I TELL YOU HEAVENLY THINGS?” (John 3:12)? — Whoever thinks Baptism consists in a merely bodily way is not a spiritual man; nor can he obtain the heavenly gift if he does not believe that he is changed not by water only, but by faith. For the water is seen, but the unseen Spirit is at work, so that faith may be in him. For just as water washes bodily filth, so the Spirit cleanses the soul from sins; so that, as visible things profit from visible means, so also the Spirit benefits spiritual things. And therefore a spiritual understanding is applied in Baptism. For there is more there in what is heard than in what is seen. Therefore, when Nicodemus, instructed by carnal reasoning, doubted, the Savior, in order to draw him to faith, used a fitting example, so as to give a visible example to confirm an invisible reality, one that consists only in hearing, not in sight, and is not disputed, and yet is earthly because it concerns a thing of this world. Therefore the Lord said to Nicodemus, urging him: “The Spirit blows where it wills, and you hear its sound, but you do not know where it comes or where it goes. So it is with everyone who is born again of water and the Holy Spirit”; so that just as the sound of the coming spirit, that is, of the wind, is indeed heard but not seen, as has been said, so also the nature of Baptism is heard when it is spoken of, yet the manner in which it is effected by the Spirit is not seen. Nevertheless, what is to come is announced by the one who conveys the words and is preached, so that what is heard may be believed to happen, although the explanation of how it happens is not given. But when even by this example Nicodemus was not led to faith, then he heard from the Savior: “If I have told you earthly things,” he says, “and you do not believe, how will you believe if I tell you heavenly things?” These words he called “earthly,” which he had set forth by way of example; that is: “If by an earthly reasoning,” he says, “from the example given, of the spirit, that is, of the wind, you do not believe that it can happen, because how it happens is not seen, how could it be that, if I were to give heavenly examples, which you certainly do not know, you would believe?” For a man can be persuaded of what he does not know by means of what he does know; for instance, God says of Christ that He is truly His Son, in a way that cannot be comprehended as to how this is so. Yet through what we know according to the flesh about how sons exist, we believe that God therefore said, “Christ is my true Son,” in order to signify that He is from His own substance. In this way, the Savior, whose reality can be explained neither by words nor by the mind, wished to praise Him by means of something perceptible and audible to the ears, namely, by the example of the spirit which is the wind, which the senses grasp and the ear hears, but one does not know where it comes. In this manner He wished to make credible the work of the Holy Spirit, which cannot be comprehended. And in the Acts of the Apostles we read in the same way: “And suddenly there came a sound from heaven as of a mighty rushing wind, and it filled the whole house” (Acts 2:2), etc. Behold, clearly by the example of the wind he indicates that the Holy Spirit therefore came from heaven and made a sound, just as a strong wind upon the earth. For Jeremiah also calls the wind “spirit,” saying, “The wind blows in every region.” Because it is in this world and is carried about through various places, we do not know where it comes or where it goes. But the Holy Spirit comes from heaven, as we read, to enlighten believers. How then does it seem to some that the Savior spoke about the Holy Spirit when He said, “The Spirit blows where it wills, and you hear its sound, but you do not know where it comes or where it goes,” when it is clear that the Savior spoke this by way of example? Indeed, He added: “So is everyone who has been born again of water and the Holy Spirit.” What is more obvious, that “spirit” here means “wind”? Yet they think that wind is not meant because He says, “where it wills it blows,” as if every creature, subject to a law imposed upon it, were not nevertheless released to its own freedom of action. We too go and do what we will, acting under law; for which reason we shall render an account. Or is it thought possible, and not foolish, that in wishing to indicate the operation of the Holy Spirit He should give that very Spirit as the example? Therefore I consider the question to be resolved in every respect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 59: ON THE EARTHLY AND HEAVENLY THINGS SPOKEN TO NICODEMUS"

[[commentary]]
quote='''
SINCE THE SAVIOR SAYS THAT THE BAPTISM OF JOHN IS FROM HEAVEN, WHY, WHEN HE SPEAKS TO NICODEMUS ABOUT BAPTISM AND HE IS IN DOUBT, DOES HE SAY: “IF I HAVE TOLD YOU EARTHLY THINGS AND YOU DO NOT BELIEVE,” ETC.? — What he said, “If I have told you earthly things, and you do not believe,” does not refer to Baptism; because we know that our baptism is spiritual, although it is celebrated through water: but the reasoning there is of a heavenly kind. For it is not the water that purifies, but God, invisibly and incomprehensibly. It does, however, apply to the imitation of the example given, that is, to what he said, “The Spirit blows where he wills, and you hear his voice, but you do not know where he comes or where he goes.” By this example he wished to instruct Nicodemus unto faith, so that he would believe that a man is reborn through water and the Spirit, yet that it cannot be grasped how this happens: for it happens spiritually. For just as you hear the voice of the spirit, that is, of the wind, which is a sound, but you do not know where it comes or where it goes, so also with one who is reborn: you do not know how he is changed, yet you sense that it happens, because you perceive the change itself. For if the wind blows where it wills, how much more does the Spirit who is from God sanctify whom he wills? But he said, “He blows where he wills,” because every creature, although governed under the Law, is nevertheless left to its own choice. If, however, anyone thinks that this spirit is to be understood as the Holy Spirit, it does not stand; since for the sake of an example he set forth this spirit, by which he might persuade what he had said, that a man must be reborn of water and the Spirit, and this was not believed by Nicodemus. For surely the example is one thing, and that which is confirmed by the example is another. If therefore it is given as an example, it is not the Holy Spirit, but the worldly spirit which is called wind. For wishing to praise a spiritual reasoning to unbelieving Nicodemus, he gave the example of the spirit, so that through it the operation and working of the Holy Spirit might be believed. We do know, however, that the Holy Spirit came from heaven, so that he might pour himself into believers, as we read that it happened to the Apostles at the beginning, and that the sound was then called a voice. For it is therefore written, “And suddenly there came a sound from heaven as of a mighty rushing spirit.” (Acts 2:2) This sound he calls a “voice” in the passage in question. By the example of the spirit, that is, the wind, he shows the works of the Holy Spirit, so that the saying of the Savior might stand. For what else is it when he says, “And there came a sound from heaven as of a mighty rushing spirit”? Therefore indeed he said that the Holy Spirit descended and sounded like a mighty wind. This, then, is the spirit he gave as an example. Finally he says, “So is everyone who is born again.” And as for this one, we do not know where he comes; but the Holy Spirit came from heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 16: ON EARTHLY AND HEAVENLY THINGS SPOKEN TO NICODEMUS"
