[[commentary]]
quote='''
But knowledge is not in all. That is, not all believers know the mystery of the one God; therefore some of those who believe think that there is something of a divine power in images.

For some, with conscience of the idol until now, eat as though it were something sacrificed to an image. For some of the people were still eating of the things sacrificed with veneration for the image, as though there were some divinity there. And the conscience of others, since it is weak, is defiled. The conscience is stained if it is weak in regard to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
