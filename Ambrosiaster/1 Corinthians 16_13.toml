[[commentary]]
quote='''
Watch, stand in the faith, act manfully, be made strong: let all your things be done in love. Watch, he says, lest they be circumvented in the faith. Act manfully: this is to warn them to be strong concerning the things which had been handed down to them: not like children, who do not know what they should follow. Be strengthened: so that they may be robust as much in word as in deed; because profession and good acts make men perfect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
