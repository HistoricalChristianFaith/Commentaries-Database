[[commentary]]
quote='''
That no flesh may glory in his sight. That is, that the wisdom of the flesh may blush at its error, with God as judge; for it is the mind of the flesh to distrust that a virgin gave birth by the power of God, etc., because the reasoning of the world, which is kin to the flesh, does not accept this.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
