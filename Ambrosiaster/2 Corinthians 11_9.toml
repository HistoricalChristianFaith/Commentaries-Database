[[commentary]]
quote='''
And when I was with you and in need, I was a burden to no one. He wished to profit them so much that he consoled himself in his own want for the sake of their salvation. For, suffering want, he was content, so that they would not suffer any stumbling block. For he who gives thinks that he is exalted, and no longer allows himself to be reproved. For the brothers who came from Macedonia supplied my need. From the Macedonians he always received, because they had first corrected their vices. And just as he was not to receive from the Corinthians, lest it turn into a stumbling block for them, so again he was to receive from the Macedonians, lest, sowing well, they lose the fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"

[[commentary]]
quote='''
And in all things I have kept myself from being a burden to you, and will keep myself so. He says that he will always persist in this, so that they may thus correct themselves, on account of the false apostles, who were seeking an occasion to plunder them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
