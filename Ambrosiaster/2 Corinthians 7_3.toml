[[commentary]]
quote='''
I do not say this to condemn you. That is, I do not cast you off, but I admonish you to correct yourselves; for he who condemns someone does not forgive him. For I have already told you before that you are in our hearts, to die together and to live together. From what he said before he wants them to recognize with what mind he speaks to them. For those whom he wishes to have as sharers both in present sufferings for Christ and in the life to come, he certainly does not cast off; rather he exhorts them to make themselves worthy of that sharing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
