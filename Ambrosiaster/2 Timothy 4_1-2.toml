[[commentary]]
quote='''
I charge you before God and Christ Jesus, who is to judge the living and the dead, by his coming and his kingdom: preach the word, be insistent in season, out of season; reprove, exhort, rebuke in all magnanimity and teaching. So earnestly does he command that the gift of God be preached inviolate that, with the witness of God the Father and of Christ his Son, he warns that care must be taken over this and that one must be insistent in it; so that by assiduous preaching and frequent reproof, as occasion offers, he may call them on to better progress: and, so that they may more readily assent to the one who reproves them, he exhorts that this be done without bitterness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
