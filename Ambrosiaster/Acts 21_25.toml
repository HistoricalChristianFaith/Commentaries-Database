[[commentary]]
quote='''
Moreover, when they had given a law that those who believed from among the Gentiles should not be troubled, but that they should keep themselves only from these things, that is, from blood and fornication and idolatry (Acts 21:25). Now let the sophists of the Greeks, who claim expertise for themselves and that they naturally excel in subtlety of mind, tell us: what things were handed down to the Gentiles to be observed? Things they did not know, or things they knew? But how can it be that someone learns the things he knows? Therefore those things were shown to the Gentiles to be unlawful which they thought lawful; and accordingly they were certainly not forbidden murder when they are commanded to keep from blood. But they received this, which Noah had learned from God, that they should keep themselves from eating blood with flesh (Gen. 9:4). For how could it be that men steeped in the Roman laws, whose authority in keeping commandments is so great, did not know that murder must not be committed, since indeed the Roman laws punish adulterers and murderers, and false witnesses, and thieves, and sorcerers, and the perpetrators of all other evils? Finally, these three commandments are found to have been given by the apostles and elders, of which the Roman laws know nothing, that is, that they should abstain from idolatry, and from blood, as Noah did, and from fornication. The sophists of the Greeks, not understanding these things, yet knowing that one must abstain from blood, adulterated the Scripture, adding a fourth commandment, that one must also keep from what is strangled; which, I think, they will now understand at God's bidding, since what they added had already been said above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
