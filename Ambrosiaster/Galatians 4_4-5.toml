[[commentary]]
quote='''
But when the fullness of time came, God sent his Son, made of a woman, made under the Law, that he might redeem those who were under the Law, that we might receive the adoption of sons. The fullness of time is the completed time which had been fixed beforehand by God the Father, when he would send his Son, so that, made from a Virgin, he might be born as a man, subjecting himself to the Law until the time of his baptism; that he might give a pattern of how sinners, washed and rescued from the yoke of the Law by the condescension of God, might be adopted to him as sons, as he had promised to those redeemed by the blood of his Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
