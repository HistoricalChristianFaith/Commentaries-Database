[[commentary]]
quote='''
For if you should have ten thousand tutors in Christ, yet not many fathers. For in Christ Jesus through the Gospel I have begotten you. By these words he shows that no one could love them with the affection with which he himself loved them. For who would put other men's sons before his own in love? And therefore they ought not to spurn the warnings of one who has also suffered such great evils on their behalf.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
