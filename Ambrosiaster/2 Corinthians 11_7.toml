[[commentary]]
quote='''
Or did I commit a sin in humbling myself so that you might be exalted, because I preached the Gospel of God among you free of charge? Since they were puffed up because he had been unwilling to accept support from them, and on account of this they set others before him; therefore he says, Did I sin, because I humbled myself so as to judge myself unworthy to receive; because you are angry with me for this, when this is not a matter of sin, but of glory? Thus he humbled himself in this way, when he did not exact what was owed to him. For it was owed to him that he should receive support from those to whom he preached the Gospel of God, as the Lord established, saying: The laborer is worthy of his pay (Luke 10:7); but so that it might serve their advantage, he refused it. For he refused the support offered for two reasons: so that he would not be found like the false apostles, who were preaching not for the glory of God but for their own advantage, so that they would not get an occasion for plundering, for when one does not accept, the other cannot demand much; and so that the vigor of the Gospel's authority would not grow numb; for he who receives from those who sin loses the authority to reprove. Thus, then, they are exalted, when nothing is accepted from them precisely so that, being rebuked, they may be amended, raised from death to life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
