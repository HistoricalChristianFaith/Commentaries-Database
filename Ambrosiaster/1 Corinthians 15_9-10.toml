[[commentary]]
quote='''
For I am the least of all the apostles. He humbles himself, and ascribes the reason to time; for he is lesser in time, not in dignity. But because he was also a persecutor, he bows himself down, saying: Who am not worthy to be called an apostle, because I persecuted the Church of God. But by the grace of God I am what I am. He gives the glory to God, who chose him; and he does not claim his dignity for himself, but calls himself unworthy. Hence he truly merits more, knowing that the Lord said: He who humbles himself will be exalted (Luke 14:11).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
