[[commentary]]
quote='''
But to whom you have forgiven anything, I also. It is plain that what he commands to be done he himself does: nor can he refuse this, which he writes even beseeching that it be done, though he had the power to command. But in the first letter he had denounced the man's crime as grievous, so that all would abhor him: now, when he wants him to be received back, he pleads, lest, with their minds still embittered against him, it be hard for them to have the communion of the Church with him. For there was not as much foresight in them as in the Apostle, that they should at once understand that what the Apostle said must be done, at least in this man's case: therefore he beseeches them to forgive him, indicating that God had pardoned him; because the Apostle did nothing without the Spirit of God. For what I have forgiven, if I have forgiven anything, I have forgiven for your sake in the person of Christ. By saying this he presses them; because if the master, at his disciples' request, forgave the sin of the one they wished, how much more ought the disciples to obey their master? And to show that what he forgave was ratified before God for the one to whom he forgave it, he says that he forgave what he forgave in the person of Christ: that is, that Christ, whose embassy he was discharging, had accepted it; so that the act of the Apostle is the act of Christ, as he said: Whatever you loose on earth will be loosed also in heaven (Matt. 18:18). If, therefore, Christ pardoned this man, for whom they asked through the Apostle, how much more had he already been pardoned, whom the Apostle himself even exhorts them to forgive?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
