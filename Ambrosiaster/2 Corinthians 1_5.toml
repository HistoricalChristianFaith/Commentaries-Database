[[commentary]]
quote='''
For as the sufferings of Christ abound in us, so through Christ our consolation also abounds. It is plain that he for whom we suffer is himself present to us, consoling us through deliverance, rescuing us from affliction by the intervention of his majesty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
