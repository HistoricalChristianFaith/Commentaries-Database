[[commentary]]
quote='''
But now Christ has risen from the dead, the beginning of those who sleep; since indeed through a man came death, and through a man the resurrection of the dead. In saying these things he touches the false prophets, who denied that Christ was born, and therefore that the flesh had risen; because one who has not been born does not die either. Thus he proves that Christ rose from the dead because he was a man, so that there may be no doubt that a man was raised from the dead by God; so that, since death was found through the sin of a man, the righteousness of Christ has merited the resurrection of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
