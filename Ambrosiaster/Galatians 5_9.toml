[[commentary]]
quote='''
A little leaven corrupts the whole lump. He says this because those who mix anything whatever of the Law with faith violate faith, so that it has no fruit and is not acceptable. He added this lest perhaps they should think they kept the grace of faith unharmed if they observed a few things of the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
