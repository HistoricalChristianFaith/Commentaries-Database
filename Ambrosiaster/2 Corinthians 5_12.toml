[[commentary]]
quote='''
We do not commend ourselves to you again. Since above, in calling to witness his true preaching, he seemed to praise himself, therefore he now signifies that he says these same things not for his own praise but for their glory, so that they may rejoice that they have learned the preaching whole from these men announcing it. But we give you an occasion of boasting about us, so that you may have something against those who boast in appearance and not in heart. He says this because many through pride boasted in themselves about the apostles, professing that they had been taught by those who were always with the Lord; and therefore he says here that he gives them a reason by which they too might boast against those men, because he was an Apostle, from whom these too had learned. Hence in another place he says: I have done nothing less than those who are apostles in the highest degree (2 Cor. 12:11). This he says under compulsion, lest his silence harm these people. He, then, who boasts in the heart restrains pride, knowing that God gives grace to the humble, but resists the proud (Jas. 4:6); for the mind of the proud does not bear fruit worthy of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
