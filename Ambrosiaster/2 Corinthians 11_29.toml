[[commentary]]
quote='''
Who is weak, and I am not weak? He says that he suffers with all, and grieves with them with that affection by which he provides medicine for a wound. And he pursues this in order to show with what care he guards and rules the Church entrusted to him, and on this account that he ought to be judged in nothing less than the other apostles, since, as he has declared, he labored more than all of them. For he labored under greater ill will among the Jews than the other apostles; because, when he was persecuting the Church, he was suddenly changed and became its defender, testifying and confirming that he had heard Christ, whom he had previously reckoned a dead man, speaking with him from heaven (Acts 9:6 ff.). Many would necessarily follow his testimony, knowing that it was surely not without reason that from a persecutor he had become a defender. For this reason the Jews were tormented, and always sought to kill him. Who is scandalized, and I do not burn? To be scandalized is to suffer the desire of the flesh, as far as this place is concerned. And because people are often scandalized even against their will, enticed by the form or the beauty of a body, or by the heat of their own flesh, the Apostle, considering the necessity of human nature, says that he burns, so as to provide for such people, suffering with their weakness: not condemning them, but admonishing them in humility of speech, so that by the hope of the promised reward they may resist the goads of the flesh; lest any of those who hear him, overcome by the desires of the flesh and despairing of themselves, thinking that God would no longer accept it if they corrected themselves, and remaining in the same things, should perish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
