[[commentary]]
quote='''
Who delivered us from such great deaths, and delivers: in whom we have hoped that he will also deliver, your prayer for us also coming to our aid; so that the gift bestowed on us through the faces of many may be celebrated through many in thanksgiving for us. He says this because the grace of God consoled the apostles for the sake of many, that is, of all believers, for whose sake afflictions were also heaped upon them: and therefore, because it is for the sake of all, let all give thanks to God when the trial ceases; or, when it arises, let them make supplication together.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
