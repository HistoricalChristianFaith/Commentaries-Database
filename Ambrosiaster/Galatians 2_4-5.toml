[[commentary]]
quote='''
But because of false brothers brought in secretly, who slipped in to spy out our liberty, which we have in Christ Jesus, that they might subject us to slavery, for an hour we yielded to subjection, that the truth of the Gospel might remain with you. He denies that Titus was circumcised, because he was a Greek like the Galatians. By this statement he rebukes those who allowed themselves to be circumcised though they were Greeks. But lest perhaps it be objected to him that he himself had circumcised Timothy, he now sets out the reasons why he did what he said should not be done, saying: But because of false brothers brought in secretly, who slipped in to spy out our liberty, which we have in Christ Jesus, that they might subject us to slavery, for an hour we yielded to subjection, that the truth of the Gospel might remain with you (Acts 16:3). The Greeks say the contrary: "Not even for an hour did we yield", and they say that this fits the case; because, they say, one who forbade it to be done ought not to say that he had done it, lest he prove that it should be done. But the Apostle, a divine man, knowing that this could be objected, himself puts it forward, to forestall the slanderers; and he gives the reasons by which he was compelled to do what he did not wish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
For not only the history but also the wording indicates this, that he yielded. For above he says that Titus, though he was a Greek, was not compelled to be circumcised; and he adds, saying: But because of false brothers brought in secretly. What does this now mean, except that he yielded for an hour because of false brothers brought in secretly? If not, how would the words or the sense follow? He certainly denies that Titus was compelled to be circumcised: but "because of false brothers brought in secretly", what does it mean, except that he yielded? But if because of false brothers brought in secretly he did not yield, then it was not by his will that he did not yield; for he indicated that he would have yielded, if this is so, but that because of false brothers brought in secretly he did not yield. If therefore there was no need to yield, why are they called false brothers, by whose kindness he did not do what was not to be done? So, if this is so, they did the Apostle a kindness, since because of them he did not yield what he had to yield. Why then were they called spies, if they did not want him to do this which he was going to do, but because of them he did not do it? But if he was not going to do it, without doubt he did it because of them: for it is nothing else. For the wording indicates this, that he yielded, and the history cries out the deed. For how could he deny that he yielded for an hour, when it is proved that he circumcised Timothy because of the Jews, which is to have yielded for an hour, and that, purified according to the Law, he went up into the temple (Acts 21)? For that man could say that he had not yielded even for an hour who was never found to have yielded. For either, being about to yield, he did not yield because of the false brothers; or, not being about to yield, he yielded because of the false brothers. So accept one of the two. But those are called false brothers who, as believers, judaized.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
