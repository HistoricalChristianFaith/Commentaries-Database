[[commentary]]
quote='''
If the whole church comes together in one place, and all speak in tongues, and unbelievers and the uninstructed come in, will they not say that you are mad? It is plain that if all speak in different tongues, there arises a kind of disordered uproar of the people, as of one suffering a frenzy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
