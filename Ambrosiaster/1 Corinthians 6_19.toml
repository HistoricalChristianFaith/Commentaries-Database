[[commentary]]
quote='''
Or do you not know that your bodies are the temple of the Holy Spirit, who is in you, whom you have from God? Above (1 Cor. 3:16) he said the temple of God, here the temple of the Holy Spirit; because in substance the Spirit is what God is. He said this so that we may keep our bodies undefiled, so that the Holy Spirit may be able to dwell there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
