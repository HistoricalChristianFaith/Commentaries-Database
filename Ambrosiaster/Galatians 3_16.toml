[[commentary]]
quote='''
To Abraham the promises were spoken, and to his seed. He does not say: And to seeds, as of many; but as of one: And to your seed, which is Christ. This is what is written in Genesis to Abraham: And in your seed all nations shall be blessed (Gen. 22:18). This was certainly fulfilled in Christ, in whose name all nations shall be blessed through faith. Therefore the promise was established not in many, but in one, who is Christ. By this argument of his the Apostle marks out as guilty, as it were, of falsifying a testament those who, believing in Christ, also hope for something from the Law; as if salvation were promised not only in Christ but also in the Law. Therefore he proves that the promise of blessing was made in Christ alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
