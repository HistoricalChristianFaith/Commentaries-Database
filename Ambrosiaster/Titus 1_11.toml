[[commentary]]
quote='''
These are the ones he means, who were subverting houses with that perverse doctrine. For they were eager for shameful gains of a twofold kind; because they did these things all the more in order to please the Jews, from whom they hoped for support, that they might gain money and the foreskin. These were their gains, as the Lord says to the Jews: You walk sea and dry land to make one proselyte (Matt. 23:15). These two he calls shameful gains; because he who teaches under the name of God, and not for the sake of devotion but of gain, is a hunter of shameful gain; likewise also he who wishes to acquire someone through circumcision. Hence elsewhere he says: And glory in their shameful parts (Phil. 3:19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
