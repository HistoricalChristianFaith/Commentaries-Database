[[commentary]]
quote='''
Therefore I have sent to you Timothy, who is my dearest son and faithful in the Lord. He exhorts them by this same Timothy, whom he solemnly declares his dearest and faithful son in the Lord for this reason, that in this they might learn how they were sinning; for in bearing witness to him he reproves them.

Who may remind you of my ways which are in Christ Jesus, as I teach everywhere in every church. Through this man, whom he confirms as a faithful son in the Lord, he wants them to return to the rule of the truth handed down by himself, so that, reminded by his words and by the examples of his works, they might come to their senses, recognizing that they had not been wrongly taught by the Apostle, when they learned that all the churches hold the same things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
