[[commentary]]
quote='''
But if all prophesy, and some unbeliever or uninstructed man comes in, he is reproved by all, he is convicted by all, the secrets of his heart are made manifest; and then, falling on his face, he will worship God, declaring that God is truly among you. For when he understands and is understood, hearing God praised and Christ worshiped, he perceives that the religion is true and to be revered, in which he sees nothing counterfeit, nothing done in darkness, as among the pagans, whose eyes are veiled, lest, seeing clearly the things they call sacred, they should perceive that they are being mocked by various vanities. For every imposture seeks darkness and displays false things for true; therefore among us nothing is done craftily, nothing under a veil, but simply one God is praised, from whom are all things, and one Lord Jesus, through whom are all things (1 Cor. 8:6). For if there were no one who understood, or by whom he himself might be examined, he could say that it is some deception and vanity, which is chanted in tongues for this reason, that it would be a matter of shame if it were revealed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
