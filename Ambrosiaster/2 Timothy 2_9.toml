[[commentary]]
quote='''
For he was troubled with afflictions and prisons, because he offended both Jews and Gentiles by preaching, as it seemed to them, incredible things; for he had the Jews angry with him on account of the Law, which he taught had ceased: and he made the Gentiles his enemies, because he preached one God in Christ. Hence they treated him as a robber, binding him, shutting him up, to see whether he could be silenced, not knowing that the word of God could not be bound. Thus, often shut up, he suffered no loss but made a gain; for there was no lack of someone to whom he might preach in prison, so that those whom he could not invite freely to the faith, he might, placed in bonds, feed with the word of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
