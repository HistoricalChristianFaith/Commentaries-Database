[[commentary]]
quote='''
Now I beseech you, brothers, by the name of our Lord Jesus Christ, that you all say the same thing. He now begs all to be of one mind, namely in that in which, reborn, they were called sons of God. Now he speaks to the whole church, so that those who had begun to dissent might return to the faith with which they began, which they saw praised in those who persevered in it.

And let there be no schisms among you, but be perfect in the same mind and in the same knowledge. He wants them to be perfect in the same mind which he had handed on to them, so that they might not disagree. For he spurs these on to the example of those whom he praises above, so that they may hold and defend this.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
