[[commentary]]
quote='''
Not serving to the eye, as pleasing men, but as servants of Christ, doing the will of God from the heart, serving with kindness as to the Lord, and not as to men; knowing that whatever good each one has done, this he will receive from the Lord, whether servant or free. On account of the fear of God he wants just and faithful services to be rendered to men; for he serves God whose rights he keeps in his services to a carnal master, God who, as he hears, will repay him for his just deeds in the day of judgment and will bear witness before all others. This can benefit even the salvation of the masters; for seeing servants made faithful ministers through the grace of God, which is a difficult thing, they have been able to praise the glory of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
