[[commentary]]
quote='''
I have been fixed to the cross with Christ. He is fixed to the cross with Christ who, emulous of his footsteps, is captured by no desire of the world, so that, living to God, he may be seen to be dead to the world. For whoever does not do the things that are of the world, or of error, is dead to the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
But I live, no longer I, but Christ lives, who is in me. It is not doubtful that in him who is set free from death through faith, Christ lives; for while he forgives the sins of one worthy of death, he himself lives in him; for by his protection he has been rescued from death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
