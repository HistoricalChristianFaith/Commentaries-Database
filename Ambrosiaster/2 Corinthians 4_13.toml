[[commentary]]
quote='''
But having the same spirit of faith: that is, we have with you a common spirit, through which faith is strengthened. For this is why he suffered such great ills for them, so that they might be joined to one another in faith. According to what is written: I believed, for which reason I have spoken; and we believe, for which reason we also speak (Ps. 115:1). He gave an example from the hundred and fifteenth psalm for this reason, to show that he is ready to endure all things because he believes in the future resurrection. Secure, then, about the future life, he has no care for the present life; since indeed this is what is believed: that the blessed life to come is hoped for if this one is despised. Secure, then, because what he believed is true, he dares to preach it, so as to make others sharers in his hope.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
