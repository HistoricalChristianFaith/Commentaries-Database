[[commentary]]
quote='''
If no one is justified before God by the Law, why is it written: “Cursed is everyone who does not continue in all things that are written in the book of the Law, to do them” (Deut. 27:26)? If people are justified by faith and not by the Law (Gal. 2:16), why is the one who has not fulfilled the Law called cursed, since it does not lead to righteousness? — The Law given through Moses did indeed have righteousness, but an earthly one; so that those who kept the Law were righteous for the present, so that they would not become guilty. For the one who harms no one is righteous according to the Law. Therefore the Apostle says: “The Law is not of faith; but ‘the one who does them shall live in them’” (Gal. 3:12): that is, the one who does the Law will not die, but lives for the present; but the righteousness that is from faith justifies people before God, so that they may be rewarded in the future age. For to temporal righteousness they added the righteousness of faith. It is right to know from whom and through whom we exist, so that the true confession of the Father and the Son and the Holy Spirit may lead us to the heavenly kingdoms. For the ancients also, who not only kept the precepts of the Law but also loved God, having hope in the promise, were justified before God. He says that the Law alone does not justify people before God, just as faith alone, without good works, does not praise them before God; but the observance of both earthly and divine righteousness makes them perfect. Therefore the Lord says: “Unless your righteousness exceeds that of the scribes and Pharisees, you will not enter the kingdom of heaven” (Matt. 5:20).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 5: IF NO ONE IS JUSTIFIED BY THE LAW, WHY THE CURSE?"
