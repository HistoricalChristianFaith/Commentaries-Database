[[commentary]]
quote='''
But to those who are joined in marriage I give charge, not I, but the Lord. After he has spoken to the unmarried and to widows, he addresses those who are joined in marriage, with the Lord's mouth: That a wife not depart from her husband; but if she has departed, that she remain unmarried. This is the Apostle's counsel: that if she has departed because of the bad conduct of her husband, she should from then on remain unmarried. Or be reconciled to her husband. But if, he says, she cannot contain herself, because she does not wish to fight against the flesh, let her be reconciled to her husband; for a woman is not permitted to marry if she has put away her husband on account of fornication, or of apostasy, or if, driven by unlawful lust, he seeks the use of his wife; because the inferior does not in every respect enjoy this law which the superior enjoys. If, however, the husband has apostatized, or seeks to pervert the use of his wife, the woman can neither marry another, nor return to him. And that a husband not put away his wife. It is understood, however: except for the cause of fornication. And therefore he did not add, as he did about the woman: but if he has departed, that he remain so; because it is lawful for the husband to marry a wife if he has put away a sinning wife: because the husband is not bound by the law in the same way as the woman; for the man is the head of the woman.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
