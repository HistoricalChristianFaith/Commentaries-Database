[[commentary]]
quote='''
WHY DOES SOLOMON SAY, "JUSTIFY YOUR SOUL BEFORE YOUR DEATH," AS WE READ IN A PSALM, "NO LIVING MAN WILL BE JUSTIFIED IN YOUR PRESENCE?" —A person justifies his soul before death when, through hope of future life, he reaches faith, so that he may not die in transgression. But Solomon is speaking of someone who lives under the Law and does not conduct himself justly. If such a person corrects his mind so as to walk in the paths of righteousness, he justifies his soul before death. For Solomon, because of the coming judgment, has given this advice, lest anyone careless about himself should die in his sins. David, however, spoke about the perfection of righteousness: for no one will be justified before God so as to be worthy of the promise, unless he has died in righteousness. As long as a person lives, he does not yet possess the full merit of what is to come. Therefore the Savior says, “He who perseveres to the end, he shall be saved” (Matt. 10:22; 24:13).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 22: JUSTIFY YOUR SOUL BEFORE YOUR DEATH"
