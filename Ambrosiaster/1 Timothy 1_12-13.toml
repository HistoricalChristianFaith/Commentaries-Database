[[commentary]]
quote='''
And I give thanks to him who strengthened me in Christ Jesus our Lord, because he judged me faithful, putting me into the ministry, because I was formerly a blasphemer, and a persecutor, and insolent; but I obtained mercy, because I acted in ignorance, not yet believing. And the grace of our Lord superabounded with the faith and love which is in Christ Jesus. Because every unbeliever suffers a weakness of mind, constrained by carnal reasoning so as not to believe the spiritual, he therefore says that he gives thanks to Christ, because the appearance of his majesty strengthened the feebleness of his mind; for he thought impossible what was preached about the power of the Lord, and his twofold birth, and resurrection, and hope. But once strengthened, he was seen to be such a one as was worthy and able to be a steward of the mystery of the Lord; so as to confirm as true through the Law the things which before, out of love of the Law, he judged incredible, and to rejoice in the persecutions which before he inflicted, as if justly, on believers, grieving because he had done it, glad because he was suffering. For he had learned so great a hope in him whom before he denied that he rejoiced more in suffering than he had before exulted in persecuting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
