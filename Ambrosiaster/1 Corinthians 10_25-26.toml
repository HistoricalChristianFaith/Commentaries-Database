[[commentary]]
quote='''
Eat everything that is sold in the market, asking nothing for conscience' sake; for the earth is the Lord's and its fullness. To show that all things are clean, he strengthened this by the example of the twenty-third psalm; because what is the Lord's cannot be unclean. And since above he said about foods: All things are lawful, he immediately followed it up: Eat everything that is sold in the market, asking nothing for conscience' sake. He added this so that the conscience may be free; for although something may be polluted by an accident, that is, by its offering to an idol, yet when the one who buys it does not know this, he suffers no scruple, and is guiltless before God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
