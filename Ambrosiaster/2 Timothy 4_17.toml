[[commentary]]
quote='''
But the Lord stood by me and strengthened me, so that through me the preaching might be fulfilled, and all the Gentiles might hear. Because he says that he was fortified by the aid of our Lord and increased in power, so that he might fulfil the preaching among all the Gentiles, for that reason he asks pardon for those by whom he was forsaken in his need; so that, being well accepted by God, he may not seek vengeance. For on this account he believes that he was helped the more by God, because he was forsaken by men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"

[[commentary]]
quote='''
And I was delivered from the mouth of the lion. The Lord will deliver me from every evil work, and will bring me safe into his heavenly kingdom: to whom be glory for ever, amen. In like manner Peter too, his fellow apostle, says: For our adversary the devil goes about, roaring like a lion, seeking whom he may devour (1 Pet. 5:8). But because he found no occasion in the Apostle by which to deceive him, he stirred up affliction and punishments against him through his sons; so that, if not as a sinner, then at least as a righteous man he might yet be removed from this life, lest he exhort many to the faith. When he had all but accomplished this, the Apostle, delivered by the providence of God, mocks him, testifying that he is weak, because he was snatched from his mouth; because what he desired he could not accomplish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
