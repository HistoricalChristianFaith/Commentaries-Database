[[commentary]]
quote='''
For you have been called into freedom, brothers. They were called into freedom because, when they were liable to sins, they received the remission of offenses by the grace of God and were freed. Only do not give your freedom as an occasion to the flesh. He says this lest an occasion of the flesh take away the freedom they had received: for they wished them to be circumcised for this purpose, that they might enter into the condition of the Law. Therefore he warns them not to give occasion by consenting to them. But through the love of the spirit serve one another. He exhorts them that love is to be had not through the affection of the flesh but through the love of the spirit, so that they may be subject to one another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
