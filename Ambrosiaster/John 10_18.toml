[[commentary]]
quote='''
Knowing that a Jewish war against Him was to come, the Lord told His disciples to get swords for themselves. (Luke 22:36) When this had been done and the war had begun under the leadership of Judas Iscariot, Peter the apostle, seeing the enemies rising up, drew his sword and cut off the ear of the servant of the priests. Then the Lord ordered Peter to put his sword back into its sheath: “For everyone,” He said, “who takes the sword will perish by the sword” (Matt. 26:51–52). Why did He order swords to be prepared, when He forbade striking, even declaring liable to death the one who strikes with the sword, since the apostle does not seem to have struck unjustly? For as far as Peter is concerned, he struck the one whom he saw armed against him. He ought indeed to have resisted the thankless servants armed for killing the Lord. If you examine each part of the case whose force we wish to explain, you will also find other points you may seek beyond these words. For what need was there that He, who relied on spiritual power, should order carnal swords to be prepared, and He who had previously commanded that on the way they should carry neither bag, nor money, nor staff (Matt. 10:10), should now order that those things be possessed which He had previously forbidden? Let us therefore begin to explain why He ordered swords to be prepared and yet forbade killing. For the sake not only of the enemies, but also of His own disciples, He commanded that arms be acquired for the coming war. For a new and marvelous thing was about to happen, that He who worked new and unheard‑of signs should so suddenly be humbled as to be subjected both to scourging and to death. Lest He should appear to suffer these things as one unaware, as if power had somehow departed from Him, He foretold all this in such a way that He would not be doubted in these matters but, foreknowing them, would prepare Himself against them; and because He was humbled willingly, He would not command a fierce resistance to His enemies. He showed Himself to be the same as He had been to such a degree that, already arrested, He restored the ear that had been cut off, so that what had fallen by the operation of the sword He gave back: not as a bodily physician, but as the Maker of bodies He refashioned His work when it had been mutilated. For physicians cannot restore limbs once cut off from the body. But in order that the power of God in Him might appear not diminished, but present as it had been, and to confirm what He had said: “I have power to lay down my life, and I have power to take it up again” (Jn. 10:18), for this reason He ordered swords to be prepared, yet did not order killing. Now it remains to show why, contemplating Peter the apostle’s act, He said that the one who has used the sword will perish by the sword, though Peter does not seem to have struck unjustly. For as is indicated in Luke, he struck with the Lord Himself permitting it, and then, being forbidden, heard these words (Luke 22:49–50). It was permitted, indeed, so that He might appear able to avenge Himself but unwilling to do so; and so that His power might be shown to remain in Him as it had been, so that in both respects it would not be doubted that He could avenge Himself; while the enemies, on the other hand, would know for certain that power had been given to them by Him to do this. For He did not appear as one defeated, but as one giving Himself over to their will. Why then was the sentence given that whoever takes the sword will perish by the sword, unless because no one is permitted, except the judge, to kill anyone with the sword? But to the apostle Peter it was permitted only to the extent that he might inflict pain, not that he might kill. For this reason he was told not to strike again. He also learned that once people have become Christians, they are no longer allowed to kill. For those who are placed in mercy, it is not permitted to use harshly the law of justice, which has been entrusted to the world. But that instruction which He seems to have given to the disciples going before Him on the road, that they should take nothing for the journey, is for the sake of peace, and the grace of miracles, and the charm of teaching. For what need was there to carry anything on the road for those to whom, for the sake of signs, all things were to be offered? But when the time came in which He allowed Himself to suffer, for which rather a quarrel than a war was awaiting, He commanded His disciples to be armed: not that He who wished to suffer might resist, but, as I said, that He might show Himself foreknowing this matter and having His passion in His own power; yet humbling Himself for the sake of human salvation, which will be discussed in its proper place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 104: ON THE GOSPEL OF LUKE"

[[commentary]]
quote='''
AGAINST THE PAGANS. — [The pagans] accuse our faith and its generations to come; but they do not deny that nothing in its teachings can be criticized. Those who accuse our faith do not take their stand so much against us as against our author. For they declare us fools, because we have put faith in a seemingly foolish matter; but Him they pronounce a liar and deceiver, and even hateful, who would deliver a faith by which we might be deceived. But, they say in reply, what is believed is foolish. For it does not stand up to reason that God should have a Son, nor that bodies dead and dissolved could be restored again to life. If anyone denies works of virtue by accusing the Scriptures, how can he call our faith foolish while denying the Scriptures? For wherever it is written about Christ that He is to be believed as the Son of God, in that same place the testimony of virtue is found. And if it seems absurd to anyone reading that Christ, the Son of God, was crucified, let him read further and he will find that He rose from the dead; and let him understand that He did not die idly nor unwillingly, He who could rise again, but that it is a mystery. Whoever he may be, he will either be silent about the cross, for if he calls the cross foolish, he will not be able to call the resurrection foolish, for the resurrection excuses the cross, or if he speaks of the cross, he will not be able to deny that there is providence in it, which he sees confirmed by the testimony of the resurrection. Either both are accepted, or both are rejected, so that whoever does not defend them does not even dare to accuse them. The reason why He allowed Himself to be crucified is a mystery to be reserved for His kindred. But He so praised this death that He declared He was glorified through it. For He says: “I have power to lay down my life, and I have power to take it up again” (Jn. 10:18). Therefore He was not compelled to die, since He had the power both to die and to rise. Whoever denies this cannot say that death was inflicted on Him by force. For if he denies this, he cannot even declare that He died, because this is contained in the very place where He is read to have been handed over to death. No one condemns the last statements of a text by its earlier ones, or the earlier by the later; for what belongs to one and the same body is not in contradiction. Yet even now demons are terrified at the name of the cross of Christ; and if it is invoked more earnestly, they take flight; and the gods of the pagans, through fear and dread of the named cross, cannot give responses. If the death of Christ is a reproach, why is it a terror? For a thing that comes from a crime ought not to be feared, but despised. Who would fear a man killed for his crime? And if he were innocent, he still would not be feared, but mourned. Therefore, unless the demons, or the gods of the pagans, knew that the cross of Christ is a mystery, they would not be terrified when it is named; and, to speak more plainly, unless they were guilty, they would not be afraid. For all those who are on the Devil’s side consented to the death of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 114: AGAINST THE PAGANS"

[[commentary]]
quote='''
What shall we say of certain Christians who, in the Savior, as if only changed in name, still defend the vanity of their former error, so dulled in mind that they struggle that God Himself acted under fate, saying, “He Himself said, My hour has not yet come” (Jn. 2:4); as though this hour were not a matter of will, but a necessity of fatal condition, whereas He meant the hour of His own will, in which He would allow Himself to be handed over. Indeed He says, “I have power to lay down my life, and I have power to take it up again” (Jn. 10:18). Therefore, where there is the power of the will, the necessity of fate ceases. And how is He called Savior by us, if the things we do or that happen to us are of fate? For He is called Savior because He showed us the way of salvation; and so, if this way has been shown by Him, it was not of fate, because before it was hidden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 115: CONCERNING FATE"
