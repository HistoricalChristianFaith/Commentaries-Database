[[commentary]]
quote='''
Admonishing every man, and teaching in all wisdom, that we may present every man perfect in Christ: in which I labour, striving according to his working, which works in me in power. He says that this is the true wisdom, which is in the discipline of the Lord, when Christ is acknowledged. The Apostle testifies that he himself does this with great care; so that, instructing every man in this wisdom, he may present him complete to God in the understanding of Christ, so that he may attain the mystery of his birth from God, and of his birth from Mary, and of his whole work in things heavenly and earthly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
