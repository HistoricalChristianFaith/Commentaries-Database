[[commentary]]
quote='''
But I will come to you soon, if the Lord permits. After the admonition he promises to go to them, but if the Lord should permit; so that, since God knows more than man, he would therefore permit it if he knew it to be worthwhile; and if he did not go, he would show that the Lord had not allowed it, surely by reason of their unworthiness.

And I will recognize not the speech of those who are puffed up, but their power. He puts them to shame, because, though they were living crookedly, they were indignant, as though they were worthy to be visited by the Apostle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
