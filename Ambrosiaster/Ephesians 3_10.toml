[[commentary]]
quote='''
That the manifold wisdom of God might be made known to the Princes and Powers in the heavenly places through the Church. God thought so well of this that he not only gave this teacher to the Gentiles, but also that through him the truth of Christ might become known to the spirits in the heavenly places, who are the Princes and Powers. Powers for this reason, because they are more powerful among the other spirits; and Princes, because they are princes over the Powers; so that, recognizing through the Church, which has been drawn to life in manifold ways, that the mystery of the one God abides in Christ, they may cease from error. For this is what is being done: that the preaching of the Church may profit these also, and that they may abandon their assent to the devil's tyranny, with which he has armed himself in ungodly presumption against the faith of the one God. This sense was set down beforehand in the twenty-third psalm, where God is shown to be the Lord of the universe, the Spirit of God saying through David: The earth is the Lord's, and its fullness, the world, and all who dwell in it (Ps. 23:1). And in what follows: Lift up the gates of your Prince, and be lifted up, eternal gates, and the King of glory shall enter in. Who is this King of glory? The Lord of powers, he is the King of glory (ibid., 7 ff.). It is said, therefore, to these Princes who are in error in the heavenly places, or to his ministers on earth, that they should take away the gates of their prince, that is, of the devil, from their minds, the gates through which the error of asserting many gods entered. For they are temporal, because all deceit is shut in by time: For the way of the ungodly shall perish (Ps. 1:6). But they are admonished, justice exhorting them, to lift up the eternal gates, because truth endures unto everlasting ages. Hence he says in the hundred and seventeenth psalm: This is the gate of the Lord, the just shall enter by it (Ps. 117:20). For it is plain that the just enter through faith into the heavens, into the kingdom of God, which is never corrupted, as Daniel the prophet testifies, saying among other things: Another kingdom shall arise, incorruptible (Dan. 2:44); but the ungodly, because of unbelief, enter Tartarean hell. This King of glory, then, is Christ, who, rising after he had overcome death, appears to be the Lord and the King of glory. For by the strength of his power, by which he subdued the underworld, it is made manifest that he is the Son of God, who preached that the kingdom of the one God is in the heavens and on earth, to the condemnation of the devil's tyranny.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
