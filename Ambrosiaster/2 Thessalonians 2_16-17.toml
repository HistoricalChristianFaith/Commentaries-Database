[[commentary]]
quote='''
And may our Lord Jesus Christ himself, and God and our Father, who loved us, and gave eternal consolation and good hope in grace, console your hearts, and establish them in every good work and word. Since the Father and the Son are one power, and one divinity and substance, he therefore did not hesitate to name first our Lord Jesus Christ, then God, our Father by his condescension, not by truth of nature, who loved us so much that he gave his Son for us (John 3:16), God for men, the Lord for servants, the true Son for adopted sons; so that his death might be our life, and his resurrection our justification, and his second coming the repose of our life, and glory for ever; so that this hope might be the consolation of present afflictions, and through it, grounded, they might grow in good works and teaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
