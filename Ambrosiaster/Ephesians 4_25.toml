[[commentary]]
quote='''
Wherefore, having put away lying, speak truth each one with his neighbor (Zech. 8:16); for we are members of one another. Because we have been created in truth and justice, reborn in baptism, therefore, that we may remain in it, we are commanded to put away lying, having taken up truth, and not to deal with a brother in anything by guile; so that, because we are members of one body, we may support one another's causes in truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
