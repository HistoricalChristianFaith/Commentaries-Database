[[commentary]]
quote='''
But godliness with sufficiency is great gain. He says that there are great riches and great acquisition in this, if one of the faithful is content with what is his; for he is godly both in himself and towards others who, acquired by the mercy of God for the life to come, thinks that what he has suffices him for the present, not hesitating to give generously from that very thing. For every avaricious man is ungodly, harming both himself and others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
