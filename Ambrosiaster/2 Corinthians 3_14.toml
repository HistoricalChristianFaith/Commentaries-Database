[[commentary]]
quote='''
But their senses were dulled up to this very day. He calls them dulled for as long as they do not believe. This dullness comes about on account of unbelief; therefore, when they are converted to faith, the edge of the mind is sharpened, so that they may see the splendor of the divine light.

This same veil remains in the reading of the old testament, while it is not unveiled; because in Christ it is done away. This dullness, he says, remains in the reading of Exodus until they believe. For it is not unveiled unless they believe; for in Christ it is done away, that is, through faith in Christ the veil is taken away; for when the offense is removed, they will begin to see what, while sin stood in the way, they could not see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
