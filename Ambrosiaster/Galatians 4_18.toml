[[commentary]]
quote='''
But emulate the better gifts, emulate the good always, and not only when I am present with you. The better gifts are the spiritual ones; having imitated these, they will have effect before God. These are the spiritual goods which he wishes them always to imitate, not for a time, as before, or only while he is present, only afterward to turn to something else; but he wishes them to persevere in the good from now on.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
