[[commentary]]
quote='''
Put on, therefore, as the elect of God, holy and beloved, bowels of mercy, benignity, humility, meekness of mind, long-suffering, showing patience to one another, and forgiving one another, if anyone has a complaint against another; as Christ also forgave you, so do you also. So that they may have gain, he exhorts them to do these things which lay up merit with God. Now fear brings about abstaining from sins; for a man fears lest, doing evil, he be subjected to punishments. But these things which he now urges them to do belong to the advancement of merits; for they are of the will, not of necessity. He, then, who abstains from unlawful things has praise; but he who refrains even from lawful things has both praise and reward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
