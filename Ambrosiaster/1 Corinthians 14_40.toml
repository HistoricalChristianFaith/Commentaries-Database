[[commentary]]
quote='''
But let all things be done decently and according to order; that is, according to the order stated above. And that is done decently which is done with peace and discipline.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
