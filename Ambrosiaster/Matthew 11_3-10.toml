[[commentary]]
quote='''
WHAT DOES IT MEAN THAT, ALTHOUGH JOHN THE BAPTIST HAD PREVIOUSLY BORNE WITNESS TO THE SAVIOR, HE LATER SEEMED TO DOUBT, SAYING THROUGH HIS DISCIPLES: "ARE YOU THE ONE WHO IS TO COME, OR ARE WE TO EXPECT ANOTHER?" (Matt. 11:3–10). — Those who think that doubt may have entered the soul of John the Baptist slander the Savior. For either they correctly claim that John doubted, or else they in fact accuse the Savior of lack of discernment; because, as they suppose, he praised someone who was thinking wrongly about him. But since it is impossible for the Savior to be mistaken, John was rightly praised by him. If he was rightly praised, he did not doubt. For at the very time when John sent his disciples from prison to Jesus, saying, "Are you the one who is to come, or are we to expect another?" Jesus then answered his disciples, saying: "Go and tell John what you see and hear. The blind see, the deaf hear, lepers are cleansed, the lame walk, the dead are raised, and blessed is he who is not scandalized by me." (Matt. 11:3-6) And as the messengers of John were leaving, Jesus began to speak to the crowds about John the Baptist: "What did you go out into the desert to see? A reed shaken by the wind, or a man clothed in soft garments? Look, those who wear soft garments are in kings' houses. But what did you go out to see? A prophet? I tell you, yes, and more than a prophet. This is he of whom it is written: Behold, I send my messenger before your face, who will prepare your way before you." (Matt. 11:7-10) Then the tax collectors, having been baptized with John's baptism, praised God. How great a praise was given to John, that it should be said he is more than a prophet, and that the Savior calls blessed the one who is not scandalized in him. How then is John praised if, by doubting, he was scandalized? But surely he did not doubt. For this praise proves that he is blessed, because he was not scandalized. And the Savior also, for that very reason, broke out at that moment into praise of John, to show that John's mind was free from the doubt of his disciples. For John, wishing to strengthen his disciples, who were amazed, in faith in the Savior, knowing that his own end was near, wanted what he said about him to be confirmed by the Savior's own mouth. Therefore, in order to be a true witness, he calls upon the testimony of the greater one, so that by their agreement all uncertainty might be removed. This is John's strategy: to send his doubting disciples, as it were, with his own words, so that, hearing from the Savior the same things they had heard from John, they might be made firm, knowing that the testimony of a worthy steward and of the heavenly Lord cannot be called into question. For this reason the Savior also answered as though to John, so that between John, who asks, and the Savior, who answers, they might learn the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 10: ON JOHN THE BAPTIST'S QUESTION"
