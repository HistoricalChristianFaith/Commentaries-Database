[[commentary]]
quote='''
But for me it is a very small thing that I should be judged by you, or by a human day. He says it is a wretched thing to be judged by those whom he rebukes for such great vices, since indeed he knew that he was not to be judged even by the righteous. Or by a human day, that is, because he was not to be judged even by the laws entrusted to the world. For having passed beyond human righteousness, he devoted himself to heavenly righteousness, as the Lord says: Unless your righteousness abounds more than that of the scribes and Pharisees, you shall not enter into the kingdom of God. (Matt. 5:20). When, therefore, he says a human day, he signifies also a divine one, on which Christ is to judge; for just as jurists or pontiffs, whom they call priests, have decreed fixed days on which judgment is given, so too the day of the Lord has been appointed, on which he is to judge the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
