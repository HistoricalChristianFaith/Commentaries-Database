[[commentary]]
quote='''
For it has been reported to me about you, brothers, by those who are of Chloe, that there are contentions among you. Although they had been subverted, he nevertheless calls them brothers; just as in the prophet Isaiah God says to those who were with him that they should say to those who believed the false prophets: You will be our brothers (Isa. 66:5); so that by this they might not separate themselves from them, as being brothers. As for his saying: By those who are of Chloe, to some they seem to be people remaining and bearing fruit in the faith of God; to some, it seems to be a place, as if one were to say: By those who are of Antioch; to others again it seems that she was a woman devoted to God, with whom there were many worshipping God, to whom credence would not be refused; so that what they reported about the Corinthians was true, that there were contentions among them. He said that there were contentions among them in order to show the diversity of their minds concerning the Lord's teaching. And what it was, he added, saying:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
