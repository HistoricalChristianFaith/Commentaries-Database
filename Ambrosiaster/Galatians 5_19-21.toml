[[commentary]]
quote='''
Now the works of the flesh are manifest, which are adultery, fornication, impurity, obscenity, idolatry, sorceries, enmities, contentions, dissimulations, angers, feuds, dissensions, heresies, envyings, murders, drunkenness, revelings, and things like these, of which I forewarn you, as I also foretold, that those who do such things will not obtain the inheritance of the kingdom of God. All these and things like them are members of the law of sin, which the Apostle calls works of the flesh; because these errors are from the world, from which the flesh also is. For all sins arise from outside, from the side of the flesh, not from the side of the spirit; therefore they are not unreasonably called works of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
