[[commentary]]
quote='''
HOW MAN WAS MADE IN THE IMAGE OF GOD, AND WHETHER THIS WAS FOR DOMINION, AND WHETHER WOMAN TOO? — “Let us make,” he says, “man in our image and likeness” (Gen. 1:26). Some think this should be understood in light of another passage of Scripture, namely that in which we read that God said, “Come, let us go down and confuse their languages” (Gen. 11:7). For, as far as outward appearance goes, it seems similar: it is one voice speaking in the plural; but it differs in meaning, because the reasons are not the same. There, he speaks of creating man, whom God wills to be created in his image and likeness. But when he says, “Come, let us go down and confuse their languages,” this refers to the fact that men should not understand one another; therefore God can be seen as speaking to the angels, like a commander to his army. He speaks in common, because he was going to act through them, as their Creator; and therefore he says, “Let us confuse their languages.” For when he says, “Let us make man in our image and likeness,” it cannot be said that he spoke to the angels, because one cannot say that there is one single image of God and of the angels, as of an emperor and his companions. For where there is one single image, the dignity and nature cannot be different. Accordingly he added, “And God made man; in the image of God he made him” (Gen. 1:27): so that it is God who said, and God who made; not another or a different god, but the same God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 45: HOW MAN WAS MADE IN THE IMAGE OF GOD"
