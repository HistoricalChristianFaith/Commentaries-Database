[[commentary]]
quote='''
Now Sinai is a mountain in Arabia, which is joined to this which is now Jerusalem, in slavery with her children. He says that the case of Hagar signifies the earthly Jerusalem, that is, the Synagogue, which bears children into slavery; for those whom it bears are under sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
