[[commentary]]
quote='''
Fathers, do not provoke your children to anger, lest they become faint-hearted. He commands that fathers ought to be moderate toward their children, lest the children, hard pressed by them, sin against them and offend God, which they do not wish. For anger is a thoughtless thing, so much so that sometimes he who is angry does not spare even himself. For fathers ought to remember that they too were once children, and children to consider that they are going to be fathers; so that, the counsel of each side being equally weighed, the children may be subject and the fathers moderate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
