[[commentary]]
quote='''
Therefore, brethren, be zealous to prophesy. Although he rebukes them, and in many things reproves and corrects them, because they had withdrawn from his tradition, he nevertheless calls them brethren; because Isaiah says to the people of the Lord: Say to those who do not walk rightly in my ways: You are our brethren (Isa. 66:5). So then, to console them after his corrections, he calls them brethren; and he urges them to zeal for prophecy, so that by constant discussion and explanation of the divine law they might become better instructed, so that they might be able to learn that the preachings of the false apostles were perverse.

And do not forbid speaking in tongues. This too is for the sake of love, so that those who can speak in tongues, if an interpreter is present, may not be forbidden, lest dissension arise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
