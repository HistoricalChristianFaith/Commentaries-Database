[[commentary]]
quote='''
How is it that you seek a proof of him who speaks in me, Christ? They seek a proof of Christ speaking in the Apostle when they do not obey his precepts, wishing to prove whether he would dare to punish, so that by this he might be understood to be of trustworthy authority and be feared thereafter. For he who despises his teacher seeks to be corrected. Who is not weak in you, but is powerful in you. Christ is powerful in them, because they saw in his name the dead raised, demons put to flight, paralytics made well, the deaf hearing, speech restored to the mute, the lame running, the blind seeing. All these belong to power, not to weakness: indeed, it was for this reason that they were drawn to the faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
