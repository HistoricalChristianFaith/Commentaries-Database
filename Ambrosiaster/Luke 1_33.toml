[[commentary]]
quote='''
IN THE GOSPEL WE READ THAT THE ANGEL SAYS TO MARY, THE LORD’S MOTHER, THAT HIS KINGDOM, THAT IS, CHRIST’S, WILL HAVE NO END (Luke 1:33). AND DANIEL SAYS THE SAME; FOR HE SAYS: THEN THERE SHALL ARISE AN EVERLASTING KINGDOM WHICH SHALL NEVER BE DESTROYED (Dan. 7:14). ON THE OTHER HAND, THE APOSTLE SAYS OF THE LORD: WHEN HE SHALL HAVE DELIVERED UP THE KINGDOM TO GOD AND THE FATHER (1 Cor. 15:24). HOW WILL HE HAVE AN ETERNAL KINGDOM, IF HE IS SAID TO BE GOING TO DELIVER THAT KINGDOM UP TO GOD AND THE FATHER? — In the case of the Father and the Son, that is, of God and Christ, “delivering up” is to be understood not as abolition. Consider how the Father delivered the kingdom to the Son, with the Lord Himself declaring this: All things, He says, have been delivered to Me by My Father (Matt. 11:27). If, therefore, the Father ceased to have it when He delivered it, then it could also be said of the Savior that when He delivers it, He loses it. For after the Son said that the kingdom had been delivered to Him by the Father, still preferring the Father, He said: Now this is eternal life, that they may know You, the only true God, and Jesus Christ whom You have sent (Jn. 17:3). According to this understanding, then, the Son does not lose the kingdom when He delivers it, so that what is said by the angel and by Daniel may remain true and both be said not to differ from this sense. Whoever thinks that the testimony of either of these should be withdrawn is full of unbelief. But now, remaining in this faith, let us see what it means that the Son delivers the kingdom to the Father; for this is what, among other things, the Apostle says elsewhere: Then the Son Himself will also be subject to Him who subjected all things to Him, that God may be all in all (1 Cor. 15:28). This subjection, therefore, is the very delivering up of the kingdom. Therefore in this passage an interpretation seems necessary, so that the Son being subject to the Father is not denied, and nonetheless He is said to have an eternal kingdom. This is the kingdom of the Son, because at the name of Jesus every knee bends, in heaven, on earth, and under the earth (Phil. 2:10). Peter the Apostle also confirms this, saying: There is no other name given under heaven by which we must be saved (Acts 4:12). And the Lord Himself says to the disciples: Until now you have asked nothing in My name; ask, and I will do it (Jn. 16:24). Therefore the Son reigns, since all are saved in His name, and the things that are asked are given, until the end of the world. But after all things will have confessed Christ, whether by force or by will, and have been subjected to His power to which they had resisted, the mystery of the one God will be revealed to all, and every act of thanksgiving will be referred to the Father, from whom are all things; so that, when preaching ceases, one God may be known in the mystery of the Trinity. For when all powers, all principalities and dominions will have bent the knee to Christ, then the Son will show that He is not the One from whom are all things, but His Son, and that He is seen in Him. This is the subjection and the delivering up of the kingdom. For by showing that the Father is the One from whom are all things, He subjected Himself to Him when He says that He is from Him. So great is the majesty and glory that will be seen in the coming of the Son, that all powers and choirs of angels will think that this is the unique God. But when the Savior will have said that He is not the One who is called the Father, but His Son, reigning He delivers the kingdom to the Father. In this fact both the subjection and the delivering up of the kingdom are revealed; because when He acknowledges that He is from the Father, He confesses that whatever He has belongs to the Father, referring the whole sum to Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 26: ON THE ETERNAL KINGDOM DELIVERED UP TO THE FATHER"
