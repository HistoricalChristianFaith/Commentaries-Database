[[commentary]]
quote='''
WHAT DOES IT MEAN THAT THE SAVIOR SAYS TO MARY, WHO WANTS TO TOUCH HIM OUT OF JOY, “DO NOT TOUCH ME; FOR I HAVE NOT YET ASCENDED TO THE FATHER” (John 20:1–17), WHEN IT IS READ THAT HE WAS BOTH TOUCHED AND ADORED BY THE OTHER WOMEN? — “Do not touch me” are the words of one who is impatient. For although she desired the Savior, yet while others believed in his resurrection, she stood at the tomb weeping, when she ought already to have been rejoicing. For she had heard from the apostles John and Peter that the Lord had risen. You have it therefore: “He saw the linen cloths and the napkin in one place, and he believed; for as yet he did not know the Scripture, that he must rise from the dead.” (Jn. 20:7) But because Mary did not see him as risen, she did not believe. Excessive love made her doubt. Indeed, those whom we love, if they suffer hardship, we do not readily believe that they will escape it; whereas those whom we hate, if they are already near death, it seems unbelievable to us. Therefore to Mary, since she was astonished and suffered grief through love, though she ought to have followed the faith of the disciples, the Lord first showed himself, so that she might cease from her sorrow, yet not without reproach. Therefore she hears, “Do not touch me”; that is: You seek a carnal understanding. Hold back, and follow the spiritual realities which are not seen. “For I have not yet,” he says, “ascended to the Father.” (Jn. 20:17) This is like that saying of blessed John the Baptist, who sent his disciples to Jesus and said, “Go, say, John the Baptist has sent us to you, saying, Are you the one who is to come, or should we expect another?” (Luke 7:19–20). In his own person he is pleading the cause of his disciples. For John did not doubt, he who had said, “Behold the Lamb of God, behold him who takes away the sins of the world” (Jn. 1:29); but in order to satisfy his disciples, he sends them with his own words, so that by the mouth of the Savior he might confirm what he himself taught about him, so that after his departure his disciples might follow Christ without any doubt. In the same way the Savior rebukes Mary in himself, saying, “I have not yet ascended to the Father”; that is: Your heart is still weighed down to the earth; if you do not see, you do not believe. For if she had lifted up her heart to God, she would have believed, together with the disciples, that the Lord had risen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 37: ON CHRIST'S WORDS TO MARY, 'DO NOT TOUCH ME'"

[[commentary]]
quote='''
Yet he calls God the Father of glory, and the God of Christ, although God is the true Father of Christ, and the God of creation. But the Lord himself too says the same: I go to my Father and your Father, to my God and your God (John 20:17). He is therefore the Father of all glory, because from him is all glory, and power, and dignity. He is also the Father of Christ, but in another way, because this one is the true Son, and he is the God of all, but he is not the God of Christ in the same way. For he is the God of Christ in this way: because Christ is God from God; but to the rest he is God as a cause of fear, as he himself says in Malachi the prophet: If I am God, where is my fear (Mal. 1:6)?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
