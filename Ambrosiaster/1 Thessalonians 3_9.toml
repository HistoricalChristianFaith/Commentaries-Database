[[commentary]]
quote='''
For what thanksgiving can we render to God for you, for all the joy with which we rejoice on your account before our God, praying night and day most abundantly that we may see your face, and supply what is lacking to your faith? He says that there is nothing so worthy that it could suffice as a recompense for the salvation of the Gentiles that has been gained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
