[[commentary]]
quote='''
For I think that God has shown us apostles as the last, as though destined to death. He ascribes this to his own person for this reason, that he was always in distress, suffering persecutions and afflictions beyond the rest, as Enoch and Elijah are to suffer, who are to be apostles in the last time. For they are to be sent before Christ to prepare the people of God and to fortify all the churches to resist antichrist; and the reading of the Apocalypse testifies that they will both suffer persecutions and be killed. The Apostle, then, compared their time with his own time, saying: As though destined to death (Rev. 11:8 ff.); for they will come for this purpose, that they may be killed.

Because we have been made a spectacle to this world, both to angels and to men. Because Enoch and Elijah will be a spectacle to such a degree that their bodies will be cast out into the street in the sight of the whole unbelieving people, so too the apostles were made a spectacle, because they were publicly mocked, exposed to injury and to the death which they suffered. He spoke of the world, angels and men, because there are also evil angels, as David says in the seventy-seventh psalm: He troubled them by evil angels; and there are evil and unbelieving men; to these the injuries of the apostles are a delight. The world, moreover, stands for unbelief, because it follows visible things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
