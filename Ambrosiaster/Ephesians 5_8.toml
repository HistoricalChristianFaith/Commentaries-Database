[[commentary]]
quote='''
For you were once darkness, but now light in the Lord. Darkness is ignorance, because no one sees in darkness; and ignorance is the Gentile world, or the faithlessness from which they have been drawn to faith by the grace of God, being made light, that is, truth; for in the light the things that are are made manifest. Indeed pagans, celebrating their mysteries in darkness in a cave, are made sport of with their eyes veiled. Those of them who have become Christians, having come to know the truth, are called sons of light, because God is light, whose faith they receive in truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
