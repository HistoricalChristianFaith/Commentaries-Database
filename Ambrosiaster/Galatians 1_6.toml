[[commentary]]
quote='''
I marvel that you are so quickly being transferred from him who called you through the grace of Christ into another Gospel. Gospel means good news, and by this the old law too is Gospel, except for the Law of works; but rather this one, in which what was promised has been fulfilled, through which sinners are called together to forgiveness. He says, then, that he marvels for this reason, because, falling away from the best and greatest kindness, they had made themselves over to the Law of works, so as to lose what they had obtained, so as to rush from the liberty they had received into slavery, quickly overthrown: whereas the custom is that one passes little by little from evil to good, but these were easily led over from good to the works of the flesh, which are heavy. For it rarely happens that someone flees from gladness to ruin; and by this he wonders at the dullness of those who, placed in security, subjected themselves to empty labor. It is as if a mad sailor, standing in harbor, safe from the storm, should let his ship loose onto the deep, to be tossed by various gales: so these too through folly subjected themselves, so as to suffer the pains of their cut shame and to take up the yoke of the slavery of the Law, though no hope had been preached for this thing. They had been called, then, into another gospel than that which these men preached who had subverted them; yet not another than that which the apostles announced, which these false apostles asserted was another, to bring odium on the Apostle who had instructed them. And to circumvent the Galatians by this deceit, it was necessary for them to say that the Apostle's Gospel was other than what the Savior's reasoning taught, but that this one was true which they preached in concord with the old law. These are those who raised questions with Paul and Barnabas about this matter, as is contained in the Acts of the Apostles (Acts 15:2); for they taught the believers from the Gentiles that unless they were circumcised after the custom of Moses, and judaized, they could not be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
