[[commentary]]
quote='''
Not all flesh is the same flesh: but one is of man, another of cattle; one flesh of birds, another flesh of fish. Since all flesh is of the same mass, whence and how is there such diversity in these, that one material should produce diverse kinds? Let the sophists of the world and the searchers of the stars now say whether they are able to comprehend what is outside themselves, when they do not know what is within themselves. In fact, all the worldly philosophers, who were unwilling to humble their mind to the law of God so as to receive faith in it, always asserting different and contrary things, have confounded one another with the emptiest disputations; because in none of them was a sign of attested truth recognized which, set before their words, might commend their doctrine, as God also decreed for our teaching, which is proved not by words but by power, which words cannot resist. As, then, from one material the flesh of living creatures is diverse, so also men of one flesh will be diverse in dignity in the resurrection, so that each will appear such as his merit has been: seeing that even here we see a diversity of bodies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
