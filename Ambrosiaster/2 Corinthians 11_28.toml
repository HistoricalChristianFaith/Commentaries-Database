[[commentary]]
quote='''
Besides those things that are from without, there is my pressing burden, the daily care of all the churches. This care, which he calls daily, comes down from the practice of tradition, that every day he should instruct the people entrusted to him; but the things he mentions above were laid on him in addition, under the constraint of necessity. For the day is given for works, the night for rest; but because necessity pressed upon him to help all, he taught even by night. For he did not hesitate to afflict himself, lest the grace of God be idle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
