[[commentary]]
quote='''
Wherefore, though I have much confidence in Christ to command you what is fitting, yet for love's sake I rather beseech you, since you are such a one as Paul, an old man: but now also a prisoner of Christ Jesus. As far as reason required, it was fitting for the teacher to command the disciple out of confidence in his apostolic authority; but because Philemon was a good man, he calls him to obey through affection, as being of the same age, and a prisoner of Christ Jesus, that is, bound to the business of the Lord, or subjected to chains for his name, as the apostles themselves also were. For such were Judas and Silas, who, though they were of the people, were leading men among the brethren and had bound themselves to the works of the Lord (Acts 15:22 ff.), so that together with the apostolic men they might contend jointly for the faith of God. Hence Silas is found to be a sharer in the labours of the Apostle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
