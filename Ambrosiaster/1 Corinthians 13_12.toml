[[commentary]]
quote='''
We see now through a mirror in an enigma, but then face to face. It is plain that now images are seen through faith, then the realities themselves. Now I know in part; but then I shall know, even as I am known: that is, I shall see the things which have been promised, as I am seen; that is, I shall be present with the Lord, where Christ is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
