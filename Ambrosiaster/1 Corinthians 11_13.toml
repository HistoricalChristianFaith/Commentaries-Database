[[commentary]]
quote='''
Judge for yourselves: is it fitting for a woman to pray to God unveiled? Hence it is that above he is angry with them by irony, saying: I praise that you keep all my things in memory: and that, as I hand them on everywhere, you hold my traditions (above, 1 Cor. 11:2). For since the rationale of the tradition was this, that women should be veiled in church, they on the contrary allowed them to be unveiled in church. And therefore he now strives to persuade them of the truth no longer by the authority of tradition, which they had neglected, but through nature itself, saying:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
