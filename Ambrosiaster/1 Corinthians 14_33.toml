[[commentary]]
quote='''
For he is not the author of dissension, but of peace. Since, then, he is the author of peace, as the Savior says: My peace I give to you, peace I leave to you (John 14:27), let no one fail to allow another to speak, nor ought he, out of zeal for contradiction, to resist one who is speaking, lest discord arise in the body. For those who are called in peace ought to be zealous for patience, lest the rights of peace be dissolved. As I teach in all the churches of the saints. By this saying he exhorts them to do what he has commanded, since he testifies that he preaches in like manner to the churches of the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
