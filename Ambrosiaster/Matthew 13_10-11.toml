[[commentary]]
quote='''
It can also be understood thus: that, since many of the Jews were ill-disposed, and therefore it was not fitting to speak the Gospel to them in revelation, he spoke to them in parables; and that, understanding that it was not revealed to them because they were wicked, not even so would they correct themselves, so as to make themselves deserving to hear the words of God through explanation. Hence the disciples say to the Lord: Lord, why do you speak to them in parables (Matt. 13:10)? And the Lord: Because to you it is given, he says, to know the mystery of the kingdom of God, but to them not; that seeing they may not see, and hearing they may not understand (ibid., 11); lest the unworthy should receive salvation; and perceiving that this was done in accordance with their deserts, not even so were they willing to be converted and make satisfaction to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
