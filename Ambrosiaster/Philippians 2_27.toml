[[commentary]]
quote='''
THE APOSTLE PAUL INDICATES THAT WE MUST NOT BE GRIEVED OVER THE DEAD (1 Thess. 4:12). FOR IT IS THOSE WHO DESPAIR WHO ARE GRIEVED; AND HE HIMSELF SAYS ABOUT EPAPHRODITUS, “HE WAS SICK, NEAR TO DEATH, BUT GOD HAD MERCY ON HIM; AND NOT ONLY ON HIM, BUT ALSO ON ME, SO THAT I SHOULD NOT HAVE SORROW UPON SORROW” (Phil. 2:27). — How does he forbid grief, when he declares that he himself would have had to grieve if he had died? He meant that he would have had to grieve in one way if the death of Epaphroditus had come to pass, and yet in another way he forbids grief. For here he said he would have been grieved if he had died because of the comfort of his assistance, which he was using in the Gospel. But he forbids us to grieve in such a way that we mourn the dead as though they were extinguished and lost, despairing of the resurrection. It is one thing, therefore, to seek the comfort of someone as if absent, and another to lament the destruction of someone who will not be in the future. Here comfort ceases; there despair is excluded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 11: ON NOT GRIEVING OVER THE DEAD"

[[commentary]]
quote='''
WHAT DOES IT MEAN THAT, ALTHOUGH THE APOSTLES HEALED ALL THE AILMENTS BROUGHT BEFORE THEM, THEY DID NOT GIVE HEALING TO THEIR OWN INFIRMITIES? FOR EPAPHRODITUS CERTAINLY WOULD NOT HAVE BEEN SICK ALMOST TO DEATH (Philippians 2:27), IF THE APOSTLE’S INTERCESSION HAD BEEN HEARD. WHO COULD DOUBT THAT THE APOSTLE OFTEN PRAYED FOR THIS AND DID NOT OBTAIN IT? FOR IF HE HAD BEEN HEARD, THE SICKNESS WOULD IMMEDIATELY HAVE BEEN TAKEN AWAY. — Signs and wonders were therefore performed by the Apostles so that unbelief might be compelled to faith; so that, seeing deeds that are impossible for men, people might recognize from this that the preaching is of God, and prove by power that there is reason in the faith. Since words are always contradicted, a confirming power has been set as witness, and when words yield to that power, it shows that there is reason in faith which cannot be expressed in words. Among the faithful, therefore, signs and wonders are no longer necessary, but firm hope. For once it is learned that the promises are true, the soul arms itself for this purpose: that, despising present things, it may be found worthy of future ones, laying up merit for itself through labor. This is attested by Solomon, who says: “My son, when you come to the service of God, stand in righteousness and fear, and prepare your soul for temptation” (Sirach 2:1). Since man advances through temptations, these warnings are given. Therefore the Apostle says: “Through tribulations we must enter into the kingdom of God” (Acts 14:21). These trials of tribulation occur in various ways, so that a persevering soul in the faith it has received may be crowned. For man is tempted not only in faith, but also in sickness, in loss, in persecution, and in the death of loved ones, so that if in these sufferings he is not drawn to seek the help of demons, he may obtain martyrdom without the shedding of blood. The Apostle therefore did not fail to obtain what he asked for Epaphroditus to his disadvantage, but to his progress: because in his own case, when he had requested, he heard, “My grace is sufficient for you; for power is made perfect in weakness” (2 Cor. 12:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 63: WHY APOSTLES HEALED OTHERS BUT NOT THEIR OWN INFIRMITIES"

[[commentary]]
quote='''
Why is it, then, that with the Apostle present, who raised the dead, this Epaphroditus was sick even to death? Did the Apostle not pray for him, and not obtain that he be healed more quickly? But signs are done for the sake of unbelievers; for this sickness befell him not to his loss, but to his increase. For the trials of believers are various: for one is tried through sickness, another by the loss of dear ones, another through loss of money, another through tribulations, to see whether he is found steadfast in necessity, not seeking help from the opposite side, so that he may make an increase of merits. The Apostle's request, then, was not despised, but better provision was made for him for whom he was asking. But what does this mean, that, whereas in another epistle he warns that one ought not to be saddened at the departure of the brethren, in this one he indicates that he would have been saddened if Epaphroditus had departed from the body? He had said that, if he had departed, he would have had sorrow upon the sorrow that he had over his sickness; for he was necessary to the Churches. For to the Thessalonians: See, he says, that you be not saddened concerning those who sleep, as also the rest who have no hope (1 Thess. 4:12). But he had said that he would be sorrowful at the departure of Epaphroditus because he needed his comfort and help; not, however, so as to mourn him as one lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
