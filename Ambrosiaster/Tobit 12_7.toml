[[commentary]]
quote='''
ON TOBIT. — Such is the providence of the Lord God toward us that, unwilling for us to go astray, He has given both the law and examples of good works, by which life can be conducted modestly and peacefully in the fear of God. For He who is the author of life certainly does not will that His work be subject to death. Although nature itself is not without a law, yet because the Lord is good and merciful, He has shown by writings and examples, as the present reading shows, so that there might be a greater knowledge both of what must be followed and of what must be avoided. Therefore the holy servant of God, Tobit, has been given to us as an example after the law, so that we may know how those things which we read are to be carried out; and if temptations come, we may not depart from the fear of God, nor hope for help from any other than Him, remembering that it is written: I have been young, and now am old, and I have never seen the righteous man forsaken, nor his offspring begging bread (Ps. 36:25). Therefore, whoever hopes in God with his whole mind can never be deceived. Although for a time tribulations may arise through the plots of Satan, the examples of holy men teach us that these are not permitted by God except for the increase of our merits: for if they are accepted with a calm spirit, here comfort with effect will be given to us, and in the future eternal life with glory. For since our God is just, and with Him there is no respect of persons (Rom. 2:11), He allows us to be tempted because He loves us, so that after toil He may be able to bestow upon us the richest rewards. Accordingly, when the Apostle prayed that temptations might depart from him, the Lord said, My grace is sufficient for you; for strength is made perfect in weakness. Therefore the Apostle added, When I am weak, then I am strong; and he says, I rejoice in my tribulations, that the power of Christ may dwell in me (2 Cor. 12:9–10). We are taught by Scripture how praiseworthy the holy Tobit is: neither captivity diminished his devotion, nor did the loss of his eyes persuade him to cease blessing God, nor did the exhaustion of his substance turn him aside from the path of righteousness and truth (Tob. 1–3). For necessity tests the righteous man; and to preserve righteous in poverty is true and perfect righteousness. From that very source from which the devotion of some is diminished, the praiseworthy Tobit drew increase. For, it is said, poverty humbles a man; and one who is humbled cannot preserve righteousness. But the soul of the holy Tobit, lifted up toward God, was neither broken by captivity nor cast down by poverty: for even against the edict, he committed the bodies of the slain to burial, and, confident in the generosity of God, he showed mercy out of that very little he had, knowing that mercy shown from limited resources is especially pleasing to God; as also did that widow whom the Lord in the Gospel praised highly (Luke 21:2–4). For he is truly faithful, he does not doubt the promises of God, who gives from the little he has. Therefore, consoling his soul with the hope of future things, Tobit, consecrated to God, was found strong and unwavering in temptation, showing that in necessity one must be all the more watchful in the fear of God; for if necessity does not drive us to seek God’s help, how much less will security? Holy men, being certain that God has reserved to Himself the judgment of all things that happen in this world, not only bore with tribulations and losses and other disasters or insults without distress, but even accepted them gladly: as did our apostles, who rejoiced after being beaten, because they were found worthy to suffer dishonor for the name of Christ (Acts 5:41). For the misfortunes that unjustly happen to the faithful, whether in tribulations or in insults, are signs of future merits. Therefore the just Tobit pleased God so greatly that by a double kind of merit he obtained his reward: for in the present life he recovered the sight he had lost through the ministry of an angel, and was enriched also with possessions pertaining to this present life; and in the future he was made an heir of the kingdom of heaven. In this we are taught that whoever obeys the law of God with all his heart and does not doubt His promises, God often increases his riches even in this world, and in the future grants him eternal life. There is also another point that invites us to divine service. For holy Tobit not only obtained rewards for his own righteousness; there is added to the fullness of his glory also the good that comes from those who become his imitators. For in imitators examples are praised. This too can happen for us, if we live in such a way that it is fitting for us also to have imitators.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 119: ON TOBIT"

[[commentary]]
quote='''
IN TOBIT IT IS SAID: “TO REVEAL AND CONFESS THE WORK OF GOD IS HONORABLE” (Tob. 12:7). BUT THE SAVIOR, WHEN PERFORMING THE WORK OF GOD, SAYS: “TELL NO ONE” (Mark 8:26). — The Savior did not say that the work of God ought to be concealed; for elsewhere he says: “Go and tell how great things God has done for you” (Mark 5:19). Rather, he sometimes rejected their testimony and checked their boasting, lest he should appear, as would seem absurd to the wise, to be bearing witness to himself as a deceiver.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 8: ON REVEALING THE WORK OF GOD VS. 'TELL NO ONE'"
