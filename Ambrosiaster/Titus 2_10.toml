[[commentary]]
quote='''
That slaves be subject to their masters in all things, excellent, not answering back, not defrauding, but showing all good faith; that they may adorn the doctrine of God our Savior in all things. He says that the doctrine of the Lord is adorned by good works and faith; for the doctrine is pleasing then, if he who professes it does not make it hateful, denying it by his deeds, but makes it lovable and true; for what is true cannot be unseemly. When, therefore, words are fulfilled by the deeds that follow, they are shown to be true, and through this seemly. Then masters can not only not hold their slaves back from the faith, but even rejoice in it; because they see that their faith profits them too. For no one who keeps the faith of God can be unfaithful to men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
