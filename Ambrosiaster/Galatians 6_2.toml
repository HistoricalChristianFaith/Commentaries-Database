[[commentary]]
quote='''
And so you will fulfil the law of Christ; for the law of Christ wills all to be saved: and therefore he who takes thought for a sinning brother, that he may return to his purpose, fulfils the will of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
