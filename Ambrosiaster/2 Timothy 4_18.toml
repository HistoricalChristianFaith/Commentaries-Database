[[commentary]]
quote='''
Therefore he rejoices that by the aid of God he was snatched from death, and he is so secure about the providence of God that he believes he will be delivered from future temptations: and not only delivered for the present, but also that he will be saved on the day of judgment and will reign with the Lord Christ for eternal ages.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
