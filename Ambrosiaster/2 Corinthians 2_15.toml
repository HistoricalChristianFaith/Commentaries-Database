[[commentary]]
quote='''
Whoever, therefore, rightly asserts Christ is a good odor to God, worthy of praise in one who believes, and not blameworthy in one who does not believe: but whoever does not rightly assert Christ is a bad odor to God, both among those who trust and among those who distrust; for he will be guilty on behalf of both. For he who distrusts seems not to believe for this reason, because what he hears is perverse; and he who believes believes wrongly. The Apostle, therefore, has spoken according to the pattern of the Law: that just as in the Law he who offered victims with a good vow was a good odor to God and acceptable, so now too the power of preaching renders the odor of teaching fragrant to God. For this reason God kept the apostles safe by his help, so that they might pour the words of his knowledge into open ears, whether of Jews or of Gentiles, adding to these the mystery of the birth of the Lord Jesus according to the will of God and his Father, in the unity of the saving faith, for the salvation of believers and the perdition of those who distrust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
