[[commentary]]
quote='''
So he was a pattern to those in the people who were of moderate or slender means, that they might learn how not to lose their freedom. Hence Solomon also: Seldom, he says, shall you bring your foot to your friend, lest, sated with you, he hate you (Prov. 25:17). For he who frequently comes to another's table, given over to idleness, must flatter the one who feeds him; whereas our religion calls men to freedom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
