[[commentary]]
quote='''
Now to the King of the ages, immortal and invisible, to the only God be honor and glory for ever and ever, amen. These words pertain to the person of God the Father, whom he therefore calls alone immortal and invisible, because all immortality is from him, so that it belongs in truth rather to him alone; for whoever is immortal has it not from himself but from him. In a similar way it is read in the Gospel too, the Lord saying: That no one is good but the one God (Mark 10:18). And again he himself says: A good man out of a good treasure brings forth good things (Matt. 12:35). Yet no one is good but the one God, because he himself is the fountain of goodness, from which the rest are given to drink so that they may be good. He is also the only invisible God, because he has never been seen by anyone; for he does all things through the Son, whom we therefore say was seen; so that we signify that, although otherwise than he is, he nevertheless appeared. He therefore proclaims honor and glory in truth to God the Father, by whose godliness and providence Christ freed sinners from death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
