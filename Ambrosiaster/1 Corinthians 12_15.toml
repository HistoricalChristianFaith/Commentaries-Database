[[commentary]]
quote='''
If the foot should say: Because I am not the hand, I am not of the body; is it for that reason not of the body? That is, he who seems weak among the brethren cannot be denied to be of the body because he is not powerful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
