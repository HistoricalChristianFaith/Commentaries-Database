[[commentary]]
quote='''
But to those who are called, both Jews and Greeks, Christ the power of God and the wisdom of God. With power persuading them, which is stronger than words, those who believe in Christ understand, the Jews first, who were seeking a sign, that Christ is the power of God; and the Greeks likewise see that Christ is the wisdom of God, and that the worldly wisdom which they formerly thought prudence is the greatest foolishness. He is the power of God, then, because through him God the Father made all things; and the wisdom, because through him God has been known. For God could not be known except through him who was from him; because No one has known or seen the Father except the Son, and he to whom the Son wills to reveal (Matt. 11:27).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
