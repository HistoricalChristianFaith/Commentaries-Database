[[commentary]]
quote='''
Our mouth is open to you, O Corinthians. He speaks this because of his freedom and pure conscience; for a mind conscious of evil is afraid to speak, loses its sense, and errs in its words. Our heart is enlarged. The heart of those is enlarged who rejoice within themselves through confidence in their good conduct, or at least who, in the hope of a future reward, are not straitened in tribulation; because just as in this life no return follows unless labor has gone before, so also in divine things, if deaths have not gone before, the reward will not follow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
