[[commentary]]
quote='''
For if I pray in a tongue, my spirit prays, but my mind is without fruit. It is plain that our soul is ignorant if it speaks in a tongue which it does not know, as Latin men are accustomed to sing in Greek, delighted by the sound of the words, yet not knowing what they are saying. But the Spirit who is given in baptism knows what the soul is praying while it speaks or pleads in a tongue unknown to itself; but the mind, which is the soul, is without fruit. For what fruit can he have who does not know what he is saying?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
