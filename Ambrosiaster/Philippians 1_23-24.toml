[[commentary]]
quote='''
For he is pressed by two causes; for he has the desire to depart and to be with Christ, judging it much better, so that he may now be present with God, so as to enjoy the things longed for and promised; but that he should still be in the flesh he calls necessary for the instruction of believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
