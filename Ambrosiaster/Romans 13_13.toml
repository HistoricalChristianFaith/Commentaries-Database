[[commentary]]
quote='''
It is true; since one does not sin publicly, let us act as one acts publicly; for nothing is so public as truth. Festivities are luxurious banquets, which are either celebrated by contributions from all, or customarily hosted in turn by companions; so that no one there is ashamed to say or do anything dishonorable, because each person assumes that it is his own banquet. For at another's table they are usually restrained by shame; but here they gather for the purpose of doing shameful things freely, with an abundance of wine, and of arousing various pleasures of lust. Therefore Paul commands that such banquets be avoided. After the luxurious banquet and drunkenness Paul added what follows, namely, immodest intercourse; for this is the fruit of such wantonness. Paul rightly urges restraint from these, because every dispute and jealousy produces enmity, which he calls darkness; for they cannot attain the reward of light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
