[[commentary]]
quote='''
For faithful is God, who called you, who will also do it. Brothers, pray for us. He calls God faithful in his promises, so that, secure of the reward, they may conduct themselves rightly. And because those who live rightly according to the Gospel will easily be able to obtain what they ask, he therefore exhorts them to pray for him; for many easily obtain what they desire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
