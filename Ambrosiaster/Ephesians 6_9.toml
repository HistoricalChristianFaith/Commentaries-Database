[[commentary]]
quote='''
And you, masters, do the same things to them, forbearing threats: knowing that both their Lord and yours is in heaven, and there is no respect of persons with him. Since carnal masters are certainly not ignorant that God is the common Lord of all, let them require such services as they would not take it ill to have required of themselves. For with what measure anyone has measured, it shall be measured back to him (Matt. 7:2); for the Lord, a just judge, discerns causes, not persons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
