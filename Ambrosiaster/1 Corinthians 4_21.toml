[[commentary]]
quote='''
What do you want? Shall I come to you with a rod, or in love and the spirit of gentleness? He adds words of terror, so that those who were puffed up, being put to shame, might be humbled; so that, if they truly desired the Apostle's presence, they would prepare themselves to receive him, that is, would wash themselves from every stain of crime, so that on coming to them he might have joy as with his dearest sons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
