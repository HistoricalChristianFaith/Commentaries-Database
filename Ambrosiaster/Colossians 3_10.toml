[[commentary]]
quote='''
This image is to be understood in the conduct of a good life, as he says to the Corinthians in the first epistle: As we have borne the image of him who is of the earth, so let us bear also the image of him who is from heaven (1 Cor. 15:49). He, then, is the creator of man whose image he bids us bear in holiness and good works, which descend from the knowledge of the Son of God. For no one can have a good and clean life unless he has someone to whom he may display it, from whom he may expect, if not a reward, at least praise. But with God both praise and reward are hoped for; for the justice of God does not allow that he who has conquered the vices of the flesh should go uncrowned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"

[[commentary]]
quote='''
Yet this image, which he says is created from the knowledge of the Savior, is one thing, and the image to which the first man was made is another. For this image is in the woman too, when she acknowledges him who created her and, obeying his will, abstains from a base life and perverse conduct; but that image is in the man alone, as he likewise says in the first epistle to the Corinthians: A man indeed ought not to veil his head, since he is the image and glory of God (1 Cor. 11:7). But if the woman too did not veil her head, she too would be the image of God. But it was unfitting that she, having been made subject to the man, should be said to be the image of God; for in Genesis too it says thus: And God made man; to the image of God he made him (Gen. 1:27); so that, as God is one, one man should be made by him: so that, as all things are from the one God, so from one man the whole race should be upon the face of the whole earth. The One, therefore, made one man, who should have the image of his unity. And in man and woman there is that very likeness of the mystery of the Father and the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
