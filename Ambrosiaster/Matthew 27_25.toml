[[commentary]]
quote='''
The Jews, therefore, having become imitators of this sort of behavior, killed even the Lord Himself, choosing to have Cain the murderer rather than God as their father, so that they might become guilty of all the blood that was shed. By killing the Author of life, they proved themselves princes of all wickedness, to such an extent that they bound even their own children to this evil, saying, “His blood be upon us and upon our children” (Matt. 27:25). For, in order to persuade Pilate that what they asked for was not evil, they said that, if it was unjust, it should be turned upon their children: because, in order to satisfy their fury, they did not even wish to spare their own children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 98: ON THE GOSPEL OF SAINT JOHN"
