[[commentary]]
quote='''
If then I am a partaker of grace, why am I blasphemed for that for which I give thanks? That is, if I share in the grace of God, because I eat in his name: what need is there for anyone to think this of me, that I am devoted to an idol, while I do not shrink from the things that have been offered to an idol, that is, am I blasphemed? So he both blasphemes me, and that man rejoices in his idol-temple; while he thinks me a partaker, he has occasion to remain in error, and a bad example is given to the brothers. For if it is commanded in the Law that the groves and the altars and the pillars and the idols themselves be broken, see whether it is not a sin not only not to do these things, but even to take part in feasts of this kind; therefore it is not expedient to eat of things sacrificed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
