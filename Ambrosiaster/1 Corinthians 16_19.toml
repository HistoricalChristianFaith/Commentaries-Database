[[commentary]]
quote='''
The churches of Asia greet you. By their greeting he reminds them to become like those who are of one province. Aquila and Priscilla greet you in the Lord, with the church of their household. He mentions two churches, the public and the household one: he calls public the one where all come together; household the one in which people are gathered through friendship. Wherever presbyters celebrate the solemn rites, it is called a church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
