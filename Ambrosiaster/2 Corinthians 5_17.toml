[[commentary]]
quote='''
Wherefore if there is any new creature in Christ, the old things have passed away, and behold, all things have been made new. It is plain that through Christ all things have been renewed, if they consider his dignity. For he becomes new to those to whom he formerly seemed only a man, when he is understood to be God: so that, as the weakness recedes, the divinity may be recognized, and, as the old error ceases which, by introducing the belief in many gods, had led the human race away from faith in the one true God, all things may return to the profession of simplicity, adoring one God in the Trinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
