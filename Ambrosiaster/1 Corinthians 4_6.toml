[[commentary]]
quote='''
Now these things, brothers, I have transfigured in myself and Apollos for your sakes, that in us you may learn that no one be puffed up beyond what is written, one for one against another. He transfigured these things in himself and Apollos, in that under his own person and that of Apollos he makes void the glories and the perverse traditions of the false apostles, designating them summarily, not one by one, lest perhaps a greater discord should arise among the people. For no one who hears his own name censured, or that of the one he favors, is content to keep silent; but if the name is left unspoken, whoever hears, even if he understands that it is said of him, pretends otherwise. Under this proposition, then, he made void their persons when he says: I planted, Apollos watered, etc. (1 Cor. 3:6), so that in these they might learn that nothing is to be given to men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
