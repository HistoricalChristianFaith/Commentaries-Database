[[commentary]]
quote='''
So then death is at work in us, but life in you. He says this because they were subjecting themselves to death for their salvation; for in preaching to the Gentiles they stirred up enmities against themselves, from Jews as much as from Gentiles, even to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
