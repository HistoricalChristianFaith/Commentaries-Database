[[commentary]]
quote='''
For even if I boast somewhat more of our power, which the Lord gave us for building up, and not for your destruction, I shall not blush. Now he signifies that above he humbled himself by comparing himself with them, whereas if he were to raise himself up he would not blush, because he received from the Lord the power of preaching, to save, not to destroy, those who obey. If, then, this man, who was sent by the Lord, bows himself and compares himself with inferiors, how much more ought those who had no testimony at all not to compare themselves, not to say prefer themselves, to their betters?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
