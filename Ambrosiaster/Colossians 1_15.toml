[[commentary]]
quote='''
Who is the image of the invisible God. The image of the invisible God cannot be visible, otherwise it is not an image; for what is invisible cannot be painted, nor can one who is visible see the invisible; for what is seen is either a body, or a shape, or some formed substance which the eyesight can take in, yet the whole of it is body: but God, who is foreign to all these, how can he have a visible image? But it is said thus so that the Son may be understood to be such as the Father is; so that, because he is from him and differs from him in nothing in the divinity of nature, he is called his image and form; lest he be believed by the faithless to be another God, although this is contained in the very name; for he is called the true Son of God for this reason, that he may be believed to be from him. But because of wrong understanding this too was added, that he should also be called his image; so that when he appears, whether in human shape or indeed in fire, as to Moses (Exod. 3:2), it may be understood that it is not the Father himself but the Son: and through his being called his image, he may be believed to differ from him in nothing. Hence he says to Philip: Philip, whoever sees me sees the Father also. How do you say, "Show us the Father"? Do you not believe that I am in the Father, and the Father is in me (John 14:9)? This is the unity and substantiality of Father and Son, that they are in one another; so that whoever sees the Son sees the Father also. Now let us see how the Son was seen, so that we may accordingly understand in what way Philip, by seeing the Son, sees the Father also. Certainly it was by understanding the divine works that they saw the Son, not with fleshly eyes. What the Son worked he said was the Father's, to show the unity of power. In the same way he was seen by Jacob also; whence he received the name Israel, that is, a man seeing God (Gen. 32:28). For this reason, then, he was called the image of the invisible God: so that he might be understood to be the one who was seen as God through the understanding; but that the Father has never appeared in any way, as is said in the Gospel: No one has ever seen God (John 1:18).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"

[[commentary]]
quote='''
The firstborn of all creation. He testifies that the Son was begotten before all creation, not created, so as to distinguish his birth from the making of creation: and so that this may become thoroughly clear, he added:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
