[[commentary]]
quote='''
Having therefore these promises, dearly beloved, let us cleanse ourselves from all defilement of the flesh, perfecting the holiness of the Spirit in the fear of God. What he says is plain; yet the defilement of the flesh is to be understood in many ways. For this is why he did not say, from defilement of the flesh, but from all defilement: so that we may flee all carnal vices entirely; for everything that the law forbids is carnal. That we may perfect the holiness of the spirit in the fear of God. We perfect the holiness of the spirit in this way, if in the fear of God we follow what is right, so that, abstaining from sins under the name of Christ, we may be holy. For those who appear to restrain themselves from vices without the profession of Christ are sanctified according to the world, not according to the Spirit of God; because according to God those are clean who are faithful, while the rest, whatever sort they may be, are unclean. For whatever is without Christ is unclean, as he says to Titus: For to unbelievers nothing is clean; for both their mind and conscience are defiled (Titus 1:15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
