[[commentary]]
quote='''
For I reckon that I have been in nothing inferior to those who are exceedingly apostles. He does not want the grace of God in him to seem inferior; because he taught in like manner, and did the same things that the apostles did, who seemed of greater weight, because they had begun to teach earlier and had been with the Lord, whence they were thought to be of greater authority; whereas the election of this apostle was proved by a notable testimony, and he himself labored more than the others, and saw the Lord while praying in the temple, and spoke with him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
