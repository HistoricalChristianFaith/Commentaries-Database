[[commentary]]
quote='''
Then after three years I went up to Jerusalem to see Peter, and I stayed with him fifteen days. It was fitting that he should desire to see Peter, because he was first among the apostles, he to whom the Savior had delegated the care of the churches: not, certainly, to learn anything from him, because he had already learned from the author from whom Peter himself too had been instructed, but out of affection for the apostleship, and so that Peter might know that this license had been given to him which he himself too had received. Coming to him, then, he was received with hospitality, and stayed with him fifteen days, as a fellow apostle of one mind. He makes these things known for this reason, to show that he had concord with the apostles and had dissented in nothing, as the false apostles whispered about him, so as to disfigure him before the churches of the Gentiles and to insinuate their own evils into the simpler, saying that these agreed with the doctrine of the greater apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
