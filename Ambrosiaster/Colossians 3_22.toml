[[commentary]]
quote='''
Slaves, obey in all things your masters according to the flesh, not serving to the eye, as pleasing men, but in simplicity of heart, fearing the Lord. Since God cannot be served otherwise than with a pure heart, for he sees through the hidden things of souls, so too he commands that men should be served. For he who serves to the eye does something else in secret; but he who serves from the heart is the same outside as he is within. If, then, he is faithful in this obedience, he will earn the favor of the Lord; for he himself said: He who is faithful in the least is faithful also in much (Luke 16:10). For if he has not been faithful to him who punishes in the present, how can it be that he will show faith to him who he hears will judge after death? Therefore in the business of his master according to the flesh he wants the slave to be just and obedient, so that he may be both faithful and obedient in the things of God too. For if he has been fit in the present, where he knows there are none but corruptible rewards, how much more ready will he be in devotion to God, who he knows will give immortal rewards to the faithful!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
