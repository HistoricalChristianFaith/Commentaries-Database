[[commentary]]
quote='''
Wherefore he says (Ps. 67:19): Ascending on high, he led captivity captive, he gave gifts to men. This is written in the sixty-seventh psalm. Yet he began to bestow these gifts after his triumphs; for, conquering death, he was exalted on the cross, as he himself had said. For he says: When I am exalted from the earth, I will draw all things to myself (John 12:32). He despoiled the underworld when he took away, consenting to him, the captives whom it was holding in that state, taken through the transgression of Adam or by their own sins, and, ascending thence, led them into the heavens (Matt. 27:52). Of these, some, rising in their bodies, appeared to many as a testimony of death overcome; so that those who perhaps would not believe the resurrection of Christ might be made guilty by the resurrection of these men, whom they knew to have been dead; for they saw these, whom they recognized to have lived formerly. Although captives are led unwilling and as strangers, yet the Savior led both his own and the willing. For since by his appearing he stirred those who longed to be set free, he is said to have taken them captive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
