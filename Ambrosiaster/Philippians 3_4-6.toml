[[commentary]]
quote='''
If anyone seems to have confidence in the flesh, I more: circumcised on the eighth day, of the race of Israel, of the tribe of Benjamin, a Hebrew of Hebrews, according to the Law a Pharisee, according to zeal persecuting the Church of God, according to the righteousness which is from the Law, having lived without blame. But the things that were gains to me, these I have counted losses for Christ. As far as concerns the observance of the Law, and the keeping of its righteousness, and devotion to the sect of the Pharisees, and, in keeping with zeal for the tradition of the fathers, the persecuting of the Church, he had no equal; for in the other things those who were likewise Jews by nature were his partners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
