[[commentary]]
quote='''
Now those who are such we charge and exhort in the Lord Jesus Christ, that working with quietness they eat their own bread. To persuade them more easily, interposing the name of the Lord Jesus Christ, he exhorts them to obey, since it would be useful to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
