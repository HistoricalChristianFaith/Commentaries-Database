[[commentary]]
quote='''
IF CHRIST, FROM THE SEED OF DAVID, HAS BEEN MADE THE SON OF GOD ACCORDING TO THE FLESH—THAT IS, IF HE WAS BORN ALREADY THE SON OF GOD IN BOTH RESPECTS, BECAUSE HE WAS BORN HOLY—HOW THEN, AFTER HE WAS BAPTIZED, WAS IT SAID TO HIM BY THE LORD GOD, “YOU ARE MY SON, TODAY I HAVE BEGOTTEN YOU” (Ps. 2:7)?  —  Christ, the Son of God, is from eternity according to the spirit of holiness; but according to the flesh, from the seed of David He was born the Son of God, so that in both respects He is not regarded as having been made the Son of God, but as having been born. Yet that which He hears at His baptism belongs to the mystery, and is not for His own sake. For this is what everyone who is baptized hears. He alone, however, is pointed out, so that from this it may be seen that in a man, by virtue, God is revealed; whereas the others are confirmed, because from this they begin to be sons of God when they receive the Holy Spirit. For although the body of the Lord was born holy, nevertheless Christ as man would not have been confirmed as the Son of God by the sacrament of regeneration, unless He had received the Holy Spirit, according to the appointed gift of being reborn. Indeed, even the Jews were called sons of God in their devotion, not in the sacrament which now works, by which, having received the remission of sins and with the Holy Spirit coming upon them, they are called sons of God. Therefore the Savior both was born according to the flesh as the Son of God, and later was confirmed in the mystery. For that which was born of the Holy Spirit could not but be born of God; but so that the purpose of the mystery might be fulfilled, when the Spirit came upon Him nothing was diminished, but increased.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 54: ON CHRIST'S SONSHIP CONFIRMED AT HIS BAPTISM"

[[commentary]]
quote='''
IF CHRIST WAS MADE THE SON OF GOD ACCORDING TO THE FLESH FROM THE SEED OF DAVID, THAT IS, IF HE WHO WAS BORN IS ALREADY THE SON OF GOD IN BOTH RESPECTS, BECAUSE HE WAS SANCTIFIED AT BIRTH, HOW THEN, AFTER HE WAS BAPTIZED, WAS IT SAID TO HIM BY GOD, “YOU ARE MY SON; TODAY I HAVE BEGOTTEN YOU”? (Ps. 2:7)?  —  Christ, the Son of God according to the spirit, is from eternity; but according to the flesh, He is the Son of God from the seed of David by birth. He was not made so through baptism, because, born of the Holy Spirit, He had a purified body. In baptism, however, He hears, “You are my Son, today I have begotten you,” so that He might show through the mystery of Baptism that sons of God are made. Indeed, when the Spirit descends and remains upon Him, He hears these words, because before one has received the Holy Spirit, one is not a son of God. He hears them, therefore, not for Himself, but for us, so that in Him we might learn how we could be sons of God. For He was not baptized for Himself, but for us; just as, in another place, the Lord Himself says, “This voice has not come for my sake, but for yours, that you may believe” (Jn. 12:30), so also this was done, that He might become a pattern for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 45: WHY CHRIST HEARS 'TODAY I HAVE BEGOTTEN YOU' AT HIS BAPTISM"
