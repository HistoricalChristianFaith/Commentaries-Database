[[commentary]]
quote='''
For the unbelieving husband is sanctified through the faithful wife, and the unbelieving woman is sanctified by the faithful husband. He shows that they have the benefit of a good will, because they do not have a horror of the name of Christ: and it pertains to the protection of the household in which the sign of the cross is made, by which death was conquered; for it is a sanctification.

Otherwise your children would be unclean. Their children would be unclean if they put away those willing to live with them and joined themselves to others; for they would be adulterers, and through this their children too would be bastards; therefore unclean. But now they are holy. They are holy, because they are born of lawful marriages: and because they are born under the veneration of the Creator on the more devoted side. For just as whatever is done through dedication to idols is unclean, so whatever is done under the profession of God the Creator is holy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
