[[commentary]]
quote='''
But if there is no interpreter, let him be silent in the church; but let him speak to himself and to God; that is, let him pray silently within himself, or speak to God, who hears all things that are mute; for in the church that man ought to speak who profits all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
