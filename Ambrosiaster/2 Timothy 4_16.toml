[[commentary]]
quote='''
At my first defence no one stood by me; but all forsook me: may it not be imputed to them. He calls the afflictions and tribulations inflicted on him his defence; for to Christians suffering is life, and persecution a defence: for affliction inflicted for righteousness' sake defends him on the day of judgment, establishing the faithless as guilty. So he complains that at the very beginning of the affliction brought upon him he was forsaken: and because he knows that this is the custom, he does not want it imputed to them; for the disciples too left the Lord when he was seized by the Jews; since indeed it is written in the prophet: I will strike the shepherd, and the sheep of the flock will be scattered (Zech. 13:7).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
