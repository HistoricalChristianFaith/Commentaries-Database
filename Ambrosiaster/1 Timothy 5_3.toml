[[commentary]]
quote='''
Honor widows who are truly widows. He says those widows are to be honored who are widows of set purpose: who, though they could marry, in order to be better and worthy of God, rejected second marriages, knowing that wedlock is blessed once, imitators of the most holy Anna, who served God with fastings and supplications night and day, having known the bed of one husband only (Luke 2:36).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
