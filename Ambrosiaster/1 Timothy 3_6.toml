[[commentary]]
quote='''
Not a neophyte, lest, lifted up into pride, he fall into the judgment of the devil. It is true that those who are raw in the faith are apt to be carried away by pride, especially if they receive an order; for such a man is puffed up by novelty and by power, thinking himself more worthy than the rest. For seeing an honour conferred on him in the first year of his birth, he thinks that he has been called not so much for his own advancement as for that of others, as though he were giving a benefit to religion rather than receiving one from it; and lifted up by this, he runs into the snare of the devil. For having found the occasion of his pride, Satan casts him down headlong. And therefore it is read in Solomon: God resists the proud (Prov. 3:34). Hence the same Apostle also says in another epistle: Whoever thinks himself to be something, when he is nothing, deceives himself (Gal. 6:3). And the Lord: Whoever, he says, exalts himself will be humbled (Luke 14:11).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
