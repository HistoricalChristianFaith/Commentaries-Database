[[commentary]]
quote='''
But I hope that you will know that we are not reprobates. He provokes them to the knowledge of faith and of right living. For when they begin to know the sure authority and merit of their apostle with God, they will also be able to be careful about themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
