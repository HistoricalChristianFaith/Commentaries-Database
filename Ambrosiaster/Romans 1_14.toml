[[commentary]]
quote='''
"I am a debtor to Greeks and barbarians, to the wise and the foolish." Paul calls himself a debtor to those whom he mentions, because he was sent for this purpose, to preach to all; by this he also signifies that all are debtors, for to confess God the Creator, from whom are all things and through whom are all things, is both a due honor and the salvation of the one who confesses. By "Greeks" he means the Gentiles, but those who are called Romans either by birth or by adoption; by "barbarians" he means those who are not Romans, whose race is opposed, and they are Gentiles. He calls "wise" those who, instructed in worldly reasoning, are called wise in this age, whether they are observers of the stars, or devoted to measurements, or numbers, or the art of grammar, rhetoric, or music. To all these he shows that none of these things profits, nor are they truly wise, unless they believe in Christ. He calls "fools" those who, following simplicity, are unskilled in these matters. To all of these he bears witness that he has been sent to preach. But he is silent about the Jews, because he is the teacher of the Gentiles. And therefore he declares himself a debtor, because he has received doctrine for this purpose, that he might hand it on; and when he hands it on, he gains.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
