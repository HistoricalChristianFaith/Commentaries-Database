[[commentary]]
quote='''
And not as we hoped; but rather they gave themselves first to God, then to us by the will of God. Therefore, he says, it was right to accept from them, because, first amending their former errors and the vices of their life and conduct, they devoted themselves to God beyond what was hoped. For it was seen that they did this in simplicity, so that he to whom it was offered need not fear to accept it; because they certainly did not offer it with this intent, that, buying over their overseers, these should tolerate their vices and not reprove them; for gifts blind the eyes and bend the force of authority. Giving themselves therefore to God, while they amend their vices, and then to the brothers, while they offer support, they ought to have been grieved, they who wished to be perfect almost before they had begun. By their example, therefore, he invites the Corinthians, so that, strengthened by this exhortation, they may with diligent mind complete what they had begun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
