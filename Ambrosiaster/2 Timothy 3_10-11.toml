[[commentary]]
quote='''
But you have followed my doctrine, instruction, purpose, faith, long-suffering, love, patience, persecutions, sufferings. He wants him to be an emulator of the things he enumerates; for at the last these will profit not for repentance but for gladness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
