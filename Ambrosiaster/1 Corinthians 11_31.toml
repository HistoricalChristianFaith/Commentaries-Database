[[commentary]]
quote='''
But if we discerned ourselves, we would surely not be judged. But while we are judged, we are corrected by the Lord, so that we may not be condemned with this world. He says this because if we ourselves corrected our errors, we would not be judged by the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
