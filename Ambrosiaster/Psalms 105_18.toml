[[commentary]]
quote='''
So it is also said of Joseph, that “iron passed through his soul” (Ps. 105:18). For he, though innocent, was long held in prison; it is no wonder if he doubted somewhat regarding God’s judgment about him; but because he hoped more in God, he did not remain in uncertainty. For a person is judged in that point to which he is most inclined. The Apocalypse of John confirms this. For it says: “The fearful and unbelieving shall have their part in the lake which burns with fire and sulphur” (Rev. 21:8). Therefore, the one who does not remain in doubt is snatched from death: this is to escape death; for to doubt about God or about Christ is death. And therefore, the one who ceases to doubt escapes death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 73: ON SIMEON'S PROPHECY TO MARY"
