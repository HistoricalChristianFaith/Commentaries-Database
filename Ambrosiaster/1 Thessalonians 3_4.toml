[[commentary]]
quote='''
They had foretold that they would suffer this persecution for this reason: so that, by declaring that they had foreknowledge of this thing, they might show that they could have escaped and avoided these injuries: but because great hope lies in them, he therefore says that they bear them, when inflicted, willingly indeed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
