[[commentary]]
quote='''
Having therefore such hope, let us use great confidence. He says that we have the hope of seeing glory, not such as was in the face of Moses, but that which the three apostles saw on the mountain, when the Lord revealed himself (Matt. 17:2). From this, therefore, we ought to gather how much the divine clemency has conferred on us, and how much it has deigned to enrich us with the gift of a higher grace than that which it had given to the Jews. For the Jews, though the glory of the face of Moses was lesser, could not gaze upon it: but we believe that we shall see not the glory of Moses, which is inferior, but the surpassing glory of the Savior. The Jews, then, did not merit to see the glory of a servant: but we are to see the glory of the common Lord. And therefore we too ought to make a return, as far as we can, to the benevolence of God, so that we may be the more devoted in love of him who, washing us from our sins, gave us confidence of seeing the glory of God. Now, therefore, there is need that confidence, prepared by good deeds, should grow in us; for we shall see as much as we believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
