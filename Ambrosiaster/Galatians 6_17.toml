[[commentary]]
quote='''
For the rest, let no one trouble me. He did not want troubles to be caused him from now on, such that he might perhaps be forced to write again: but he wants them now to become more corrected, so that, their errors cut away, he might have rest after such great wearinesses. But if they showed themselves harder, and inflexible to conversion, let them leave him alone, so that he might spend his labors and his efficacy on those from whom he could hope for reward or gain. For I bear the marks of the Lord Jesus Christ in my body. He says this in anger, because he saw that the sufferings which he endured for the sake of believers were ineffective in them; since, for the constancy and faith of his teaching, he did not fear to suffer blows and chains for Christ: but out of love for believers he endured to have the scars of the blows in his body, so that he might preach to them no less faithfully, as the false apostles also did, who had deceived the Galatians. He therefore wants no one to trouble him who is not devoted to this cause; for these marks, that is, the scars of the blows, are testimonies of those believers who suffer, that they are worthy of the future promise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
