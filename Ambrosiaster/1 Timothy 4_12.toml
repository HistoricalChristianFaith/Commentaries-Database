[[commentary]]
quote='''
Command these things, and teach. Let no one despise your youth, but be a pattern of the faithful in word, in conduct, in love, in faith, and in chastity. Timothy, as far as his age was concerned, was young; as far as his character and way of life, he was an elder and grave. He admonishes him thus for this reason, that his progress might in all things be an example of good works; so that in a young man there might be seen a discipline wonderful and grave, so that his acts might excuse his age, and he might be held not as a youth but as an elder; and those older in years might blush, unless they showed themselves grave in way of life and character after his pattern; while the young would have one of their own age as their teacher. A wonderful young man was the most holy Timothy, by whose example undisciplined youth is to be restrained, and the irreverence of elders punished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
