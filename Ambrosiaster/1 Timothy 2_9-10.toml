[[commentary]]
quote='''
Likewise also women in ordered attire, with modesty and purity, adorning themselves not with twisted hair, or gold, or pearls, or costly clothing: but, as befits women professing godliness, through good works. He admonishes that women ought to pray in humble attire, not in ostentation; for one who wishes to be heard ought to bow himself down, with pomp put away from him, so as to call forth the mercy of God. For proud attire neither obtains what it asks nor causes right things to be believed of the wearer. For who among the prudent would not shudder at a woman ostentatiously adorned? How much more God, her author, who sees the body that was made free by him bound up in metals! For humble attire befits a good profession, so that one may be reckoned nothing other than what is seen: but she who prefers to be seen with pomp in the house of God attains what she wants, certainly not on account of God but on account of men, namely that she should appear glorious, while she will attain nothing from God but a stain. For the more splendid she appears to men, the more she is despised by God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
