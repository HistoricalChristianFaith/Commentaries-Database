[[commentary]]
quote='''
See therefore how you walk cautiously, not as unwise, but as wise, redeeming the time, since the days are evil. Since above he commanded that faithlessness and the vices of life be reproved by the servants of God, he now adds that these very things are to be reproved prudently, on account of scandal; so that one must conduct oneself with prudence among the faithless, especially at a time when the faithless reign, relying on a profane king; so that if a Christian sees a restless and wrathful opponent, he should let him be, and not even provoke him to blasphemy and to stirring up a storm; but he should speak where opportunity is given. For just as, when he is asked among powerful faithless men what he is, he ought not to keep silent, nor deny what he is; so also, if there is fear in disputing among them, he must hold back; since indeed it is a loss to sow upon thorns. For this is the part of a prudent man, to know how he should answer each one; for there is one who, though he is faithless, is yet not utterly intractable, so as not to suffer himself to hear the words of faith. There is again one in whom the zeal of faithlessness so burns that the faith must be discussed not only not with him but not even in his presence; for as he clamors and blasphemes, a scandal arises for many. Hence Paul and Barnabas, when they heard men blaspheming against them, shook out their garments and withdrew from them (Acts 13:46).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
