[[commentary]]
quote='''
Christians do not serve under the elements, but above the elements they serve God, hurrying toward the heavenly Jerusalem; they adore God in spirit, not in visible and worldly things, but having the worship of God in the mind, serving the invisible in an invisible manner, as the Lord says in the Gospel: “The hour is coming when the true worshipers will worship the Father in spirit and in truth” (Jn. 4:23). This, then, is the truth: to serve God in spirit, in mind rather than in body, so that, because God is spirit, he may be worshiped spiritually.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 59: ON BONDAGE UNDER THE ELEMENTS"
