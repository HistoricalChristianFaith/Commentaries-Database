[[commentary]]
quote='''
Who consoles us in all our affliction. This is what he said: the God of all consolation, who is present in every affliction; that we too may be able to console those who are in every affliction, through the exhortation with which we are exhorted by God. He introduced two kinds of consolation: one by which those are consoled who suffer affliction unjustly for the name of Christ, so that they are set free; the other, that of those who, grieved because of their sins, receive consolation, while hope is promised to them, as they amend, by those who, consoled by the Lord, were rescued from affliction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
