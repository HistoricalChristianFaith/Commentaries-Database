[[commentary]]
quote='''
And my speech and my preaching were not in the persuasion of human wisdom. He shows that he did not seek to please human wisdom so as to gain the favor of men, nor give himself to the art of words, but showed faith to the Author, who willed that his teaching be acceptable not by the adornment of human tradition, by the din of words, but by the realities themselves; for realities come before words.

But in the showing of the spirit and of the power of God. For since, by words, which are weak in comparison with power, foolish things, once adorned, seem wise, God willed that his preaching be commended not by the testimony of words but by that of power; so that, when the word had been pronounced foolishness, it might show itself by deeds to be wisdom founded on spiritual reason.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
