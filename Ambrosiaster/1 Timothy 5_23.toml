[[commentary]]
quote='''
Do not drink water any longer, but use a little wine for your stomach's sake and your frequent infirmities. Now he gives a special counsel, that he should govern himself by wholesome teaching; for God wishes to be served prudently, not so that men become weak by their own excess and afterwards seek the help of physicians. For one must use moderation, so that, if it can be done, the service begun may be advanced step by step rather than diminished through want of consideration. For intemperance makes the soul itself restless, so that, when it is anxious about infirmity, it is not so wholly given to divine services. For improvidence brings loss; the soul set in tranquillity lifts the whole heart up to God, entreating with undivided counsel the things that are to be asked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
