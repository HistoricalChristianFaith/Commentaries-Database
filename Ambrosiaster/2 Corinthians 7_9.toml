[[commentary]]
quote='''
Not because you were grieved, but because you were grieved unto repentance; for you were grieved according to God. This is why he says he rejoiced: because they were grieved with shame, not with anger. For he who, when reproved, suffers shame promises to correct himself; but he who grows angry shows that he will be worse. So that you might suffer loss in nothing from us. So that all that is ours, he says, may have its effect in you; even our grieving you is for your sake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
