[[commentary]]
quote='''
But I do all things for the sake of the Gospel, that I may become a partaker of it. That is, I do all the things mentioned above so that I may be made a partaker of the Gospel's will, which it has concerning human salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
