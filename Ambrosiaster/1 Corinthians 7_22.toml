[[commentary]]
quote='''
For he who was called in the Lord as a slave is the Lord's freedman. For, rescued from sins, which truly prove men slaves, he becomes a freedman; for he is altogether a slave who acts imprudently, as also seemed right to the ancients, who called all the wise free, but all the imprudent slaves. Hence also Solomon: To a wise slave, he says, the free will be slaves (Sir. 10:28). This man, then, who believes, even if he is a slave for a time, because he does a prudent thing in believing in Christ, becomes the Lord's freedman. If, then, sins make slaves, as Ham the son of Noah was made a slave on account of sin and imprudence, when someone receives the remission of sins, he is made a freedman.

Likewise he who was called free is a slave of Christ. It is an advance, from a free man to become a slave of Christ: for he was free from God, which is the greatest crime: and therefore, having lost a bitter and hostile freedom, he has obtained a condition that would profit him, as the Lord says: Take my yoke upon you, for it is sweet: and my burden, for it is light (Matt. 11:29). Thus he has cut off pride and made unity; so that neither the slave, from shame at his condition, should think himself despised, nor the free man, puffed up with elation of mind, should set himself above the slave.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
