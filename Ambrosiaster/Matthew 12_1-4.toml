[[commentary]]
quote='''
WHAT DOES IT MEAN THAT, WHEN THE JEWS ACCUSED THE DISCIPLES OF BREAKING THE SABBATH BY RUBBING EARS OF GRAIN IN THEIR HANDS AND EATING THEM, THE SAVIOR PUT FORWARD THE EXAMPLE OF DAVID, BECAUSE HE ATE THE LOAVES WHICH IT WAS NOT LAWFUL TO EAT EXCEPT FOR THE PRIESTS ALONE (Matt. 12:1–4)? BY THIS THEY DO NOT SEEM TO BE EXCUSED, BUT RATHER TO BECOME GUILTY TOGETHER WITH DAVID: ESPECIALLY SINCE DAVID DID NOT DO THIS ON THE SABBATH. — The Savior did not wish to anticipate for the Jews the time of the fulfilled sabbath. He did not judge them worthy to hear openly what is true, as being unbelievers; but he wished to convict them on the very point of which they were arrogant, that is, concerning the time when the sabbath still seemed to keep its force, when they accused the disciples because on the sabbath they plucked ears of grain and, rubbing them in their hands, ate them, although the time for keeping the sabbath was already fulfilled. Passing over this, he showed them that even then, when the law of the sabbath was still in force, the sabbath had been violated for the sake of necessity: for David did what was not lawful; and Joshua son of Nun did what was forbidden, when he ordered the armed men to march around the walls of Jericho for seven days; (Josh. 6:15–20) and the Maccabees did what was prohibited, defending themselves on the sabbath; (1 Macc. 2:38, 41) And “in the temple,” he says, “the priests violate the sabbath and are without guilt.” By these things he showed that the disciples were accused by the Jews more out of hatred than out of error; since, knowing that all these things were done on the sabbath by men who were willing and by holy men indeed, they accused the innocent. For the command was given to keep the sabbath in such a way that, if there were necessity, the one who violated the sabbath would not be guilty. Therefore circumcision was not forbidden on the sabbath, because there was a necessity that it be done. Therefore the disciples, being hungry, plucked ears of grain; which was not lawful according to the former time, but was made lawful by the necessity of hunger: just as David also did what was not lawful when he was hungry, knowing that hunger would excuse this. This case is like that today with legitimate fasts. If someone who is sick breaks a fast, is he made guilty? Certainly not, because there is no danger. This is sometimes permitted, just as the sabbath was among the ancients. For what is never permitted has no excuse of necessity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 23: ON THE DISCIPLES PLUCKING GRAIN ON THE SABBATH"
