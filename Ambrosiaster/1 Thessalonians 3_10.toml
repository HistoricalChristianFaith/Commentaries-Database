[[commentary]]
quote='''
And since they had advanced themselves by the perseverance of their faith and by the conduct of a better life, he longs more and more to see them, so that they may thoroughly learn the things that pertain to their perfection, namely the mysteries of spiritual things, which ought not readily to be made public; so that they might know who and how immense he is whom they hoped for as judge. For it is one thing to receive the faith, and another to receive the exposition of the faith; for one discussion is about the nature of the Father and of the Son, and another about the persons. The Father is unbegotten, but the Son begotten: as far as the persons are concerned, there seems to be a difference, though the unity of nature is undivided; for the unity is not in the person but in the substance: and let the Holy Spirit not be thought inferior because he is placed third. He, therefore, who has no doubt about the second person admits the third also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
