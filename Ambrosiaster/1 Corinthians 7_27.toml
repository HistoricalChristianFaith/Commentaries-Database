[[commentary]]
quote='''
Are you bound to a wife? Do not seek release. These are counsels of remedies; for he says that no one ought to be released from his wife except for the cause of fornication. For frequently those who put away their own wives under cover of continence deceive other women, their purpose growing cold. But if, placed with his wife, he wishes to live better, let him exhort her, that they may live more purely without scandal.

Are you released from a wife? Do not seek a wife. So that, knowing this to be more acceptable to God and free from necessity, he may not seek a wife; but in such a way that he restrains himself from other things. If not, what does it profit to suppress the desire of the flesh, that is, to spurn a lawful thing, and lie subject to unlawful things?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
