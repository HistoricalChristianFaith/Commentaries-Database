[[commentary]]
quote='''
Why are we also in danger every hour? Daily I die for your glory, which I have in the Lord. By saying: Why are we also in danger? he distinguished the persons, showing that those who were baptized for the dead were not catholics. Indeed he said above: Why are they also baptized for them? Are we also baptized for them? For Jephthah too, though in a matter that could not be made acceptable, was found faithful, offering his daughter according to his vow, which he had foolishly vowed (Judg. 11:39); so it is not the deed that is approved, but perseverance in faith is held up as an example. He recalls the dangers and labors of the preachers, saying: Why are we also in danger? and there is understood: unless because we hope for the future resurrection, as he recalls above. For, secure that after this death true life will follow, they do not fear the dangers brought on them by unbelievers, because of their zeal for those whom the unbelievers grieve to have lost, because they became believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
