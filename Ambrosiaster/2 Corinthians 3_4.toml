[[commentary]]
quote='''
But such confidence we have through Christ toward God. How great the dignity of the apostles is, he shows when he says: But such confidence we have toward God through Christ. This is to show that the men of old did not have this confidence toward God; because the ministration was lesser.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
