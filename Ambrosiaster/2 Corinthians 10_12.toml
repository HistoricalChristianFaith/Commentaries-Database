[[commentary]]
quote='''
For we do not dare to join or compare ourselves with some who commend themselves. Those who commend themselves are those who, without having received power, want to lord it, claiming authority for their own name. For he who is sent claims power not for himself but for him by whom he is sent: by which he also shows that he was chosen by the Lord as a steward. Thus, then, he does not join or compare himself with those who preach without being sent, since he presumes nothing beyond what has been granted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
