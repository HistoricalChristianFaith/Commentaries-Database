[[commentary]]
quote='''
Therefore we do not fail. It is manifest that these words belong to the sense above; for, to show his devotion still more ready in the things of God, he added these words, by which he proves that he in no way fails to see that what is pleasing to God is fulfilled; secure, however, about the promised resurrection. And even though our outer man is being corrupted, yet the inner is renewed from day to day. By afflictions, blows, hunger, thirst, cold and nakedness the flesh is corrupted, but the soul is renewed by the hope of the future reward; because it is purged by constant tribulations. For it advances in affliction, it does not perish, so that, as temptations come upon it, it daily gains merit; because this corruption also profits the body toward immortality, by the merit of the soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
