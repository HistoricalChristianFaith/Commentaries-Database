[[commentary]]
quote='''
HOW CAN DAVID STILL CALL SAUL THE ANOINTED OF THE LORD, AND DO HIM HONOR IN THIS EXCELLENCE AFTER THE LORD HAD DEPARTED FROM HIM? — David is not unaware that there is a divine institution in the office of the royal order; therefore he honors Saul, who is still placed within that same institution, lest he seem to do injury to God, who has decreed honor for these orders. For the king bears the image of God, just as the bishop does that of Christ. As long, therefore, as he is within that institution, he is to be honored, if not for his own sake, then for the sake of the order. Therefore the Apostle says, Be subject to the higher powers. There is no power except from God; and the powers that exist are ordained by God (Rom. 13:1). From this it follows that we honor even a pagan who holds power, although he himself is unworthy, since, while holding God’s order, he gives thanks to the Devil. For authority demands honor, because it deserves it. Therefore the dream of the coming famine was revealed to Pharaoh (Gen. 41:1–37); and Nebuchadnezzar, while others stood by him, alone saw the Son of God in the fiery furnace (Dan. 3:92), not indeed by his own merit, he who wished to be adored in an idol, but by the merit of the royal order.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 35: WHY DAVID STILL HONORED SAUL AS THE LORD'S ANOINTED"
