[[commentary]]
quote='''
With what hope, then, do Christians lend their ears to astrologers, when they hear the Apostle John crying out and saying: “Do not love this world, nor the things that are in this world” (1 Jn. 2:15)? Therefore, if these are the precepts of our faith or law, that the world should not be loved, nor the things that are in the world; why is it that some among us complain, saddened by the prosperity of others which is in the world, and which perhaps is regarded as misfortune before God; whereas they ought rather to rejoice because the world does not grant them the things by which they would be bound and held liable to earthly affairs? For this so‑called happiness, received as an opportunity for security, is devoid of concern for divine things. For such a man must necessarily be careless about divine oracles, who, being filled with all necessities, has nothing to trouble him. But men of this sort usually begin to be troubled by another kind of anxiety, namely, that they may increase their greatness in this world, which cannot happen without sin. Yet if one looks more closely, it will be seen that the world is rather an enemy of those whom it is said to make happy. For scarcely any one of them thinks of heavenly things. Christians must therefore rejoice when, while they live rightly, they are oppressed in this age. For he conquers the world who, being content with how things turn out for him in this life, gives thanks to God, from whom, if certain temporal things seem to be denied here, he hopes that eternal ones will be repaid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 115: CONCERNING FATE"
