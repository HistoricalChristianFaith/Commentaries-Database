[[commentary]]
quote='''
But far be it from me to boast, except in the cross of our Lord Jesus Christ, through whom the world has been crucified to me, and I to the world. Just as the false apostles, through hypocrisy, bought themselves off from tribulations for the name of Christ, as though they would profit nothing, being ashamed of them, so the Apostle boasted of them, knowing that there would be a great reward for them: as did his fellow apostles also, as it is written in the Acts of the Apostles: Then, he says, the apostles went out from the council beaten, rejoicing that they had been held worthy to suffer insult for the name of Christ (Acts 5:41). He, therefore, whose every hope is in Christ boasts in his cross, and to him the world is crucified, since he is certain that love of the cross of Christ is life, but that love of the world brings forth death. Therefore they are dead to one another, both the world to the Apostle and the Apostle to the world; while the Apostle covets nothing of the world, and while the world has nothing of its own that it may recognize in the Apostle, as the Lord also says: Behold, he says, the prince of this world comes, and in me he will find nothing (John 14:30).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
