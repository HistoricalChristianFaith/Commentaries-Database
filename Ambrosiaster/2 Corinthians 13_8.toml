[[commentary]]
quote='''
For we can do nothing against the truth, but for the truth. He says this because power was not given against the truth, to reprove one who lives well, but for the truth, to punish one who is an enemy of the law. And so power will lie idle if they do what is good. Hence he also says to the Romans: Do you wish not to fear the power? Do good, and you will have praise from it (Rom. 13:3). So when someone does not fear, because he does good, the power has been made void in his case: this is to be as a reprobate, because that by which the power is proved ceases in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
