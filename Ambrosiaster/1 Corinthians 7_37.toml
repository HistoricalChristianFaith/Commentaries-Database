[[commentary]]
quote='''
For he who has resolved in his heart, steadfast, having no necessity, but has power concerning his own will, and has decided this in his heart, to keep his virgin, does well. He says this so that he who has a virgin whose mind is not set on marriage may keep her, and not thrust upon her the kindling of marriage, when he sees that she has no will to marry. If benefits are to be bestowed, how much more are they not to be taken away?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
