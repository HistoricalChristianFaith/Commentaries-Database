[[commentary]]
quote='''
But to each one is given the manifestation of the Spirit for profit. That is, he receives the gift so that, governing his life by divine reins, he may be useful both to himself and to others, while he shows an example of a good manner of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
