[[commentary]]
quote='''
But I want you to know, brethren, that the things which concern me have come to the advancement of the Gospel; so that my bonds have been made manifest in Christ in the whole praetorium, and in all the rest; and that many of the brethren, trusting in the Lord through my bonds, have begun to dare more to speak the word of God without fear. Some indeed both through envy and contention, but some also through good will, preach Christ. Some indeed out of love, knowing that I am set for the defense of the Gospel; but others out of contention proclaim Christ, not purely, thinking that they stir up affliction for my bonds. These things need no explanation; yet, because of our solicitude, lest any of them come into doubt, let us go through them in order more plainly. Since above he declared them partakers of his joy, he therefore makes known, as to dear ones, what progress his preaching has made, so that his sufferings for Christ have become known to all. By this humility he shows himself glorious, so that those who love him may have occasion to rejoice; because the dignity of one whose bonds are made manifest in Christ grows. In the whole praetorium, and in all the rest, that is, in all Judaism, and throughout all the Churches of the Gentiles; for Judaism comes first, because the promise was made to it, as it is said: For salvation is from the Jews (John 4:22).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
