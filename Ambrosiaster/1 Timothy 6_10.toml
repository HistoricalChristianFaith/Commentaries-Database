[[commentary]]
quote='''
It is the root of all evils for this reason, that, in order to fulfill its desires, which is impossible, it perpetrates evil deeds, and homicides, and obscenity, and whatever crime there is; it is not secure in the present, because it is always covetous, and in the future it is condemned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
