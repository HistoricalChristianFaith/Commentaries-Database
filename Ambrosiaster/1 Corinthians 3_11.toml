[[commentary]]
quote='''
For no one can lay another foundation besides that which has been laid, which is Christ Jesus. No one can lay another foundation for this reason: because, although some are heretics, they still do not teach except under the name of Christ. For they cannot commend the fabrications of their error unless they preach with the name of the Savior set before them, so that the dignity of the name may make contrary and absurd things acceptable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
