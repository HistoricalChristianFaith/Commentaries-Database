[[commentary]]
quote='''
And his inward affection is more abundantly toward you. He says that the mind and affection of Titus are toward them, because he saw their progress; for the mind of a holy man is in every good thing. As he remembers the obedience of you all, how you received him with fear and trembling. The Corinthians, knowing that Titus had been sent to them by the Apostle, since they had already been rebuked by him for such great vices, were terrified at his coming. And because they had begun to amend their life, they were careful to obey his precepts, so that on his return he might soften the Apostle's mind toward them: this is why he indicates that Titus praised them, for in Titus they revered the Apostle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
