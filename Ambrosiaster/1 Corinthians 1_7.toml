[[commentary]]
quote='''
So that you lack no grace in anything, as you await the revelation of our Lord Jesus Christ. It is clear that he who is circumspect and careful awaits the day of judgment. He speaks of the future judgment of God, in which our Lord will be revealed to the faithful and the unfaithful alike; so that the unbelieving may recognize and know that what they refused to believe is true, and perish; but the faithful may rejoice, finding more good than they had supposed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
