[[commentary]]
quote='''
This is what it is to “fully fulfill” the Law: to add new things while the former remain, as, for example, “You have heard,” he says, “that it was said to those of old, An eye for an eye, and a tooth for a tooth. But I say to you, do not resist the evil one; but if anyone strikes you on your right cheek, offer him the other also.” (Matt. 5:38-39) This was to fully fulfill. For he did not destroy that law, but added what is better, not so that the one who takes vengeance would appear to sin, but so that the one who does not repay might be better. Therefore he willed nothing other than what the Law has in its meaning, but he brings its will to perfection. For the Law, in order to teach man righteousness and through this to make him safe, commanded that if someone struck out another’s eye, he should lose his own eye; and so that, terrified by this fear, people would not do to others what they did not want done to themselves, and through this would have salvation. But since the human race is frail and inclined to sin, it comes about that a person suffers what he does not want done to himself. Therefore the Savior, by changing the words, taught what would profit salvation, so that he might fully fulfill the sense of the Law: since people could not be saved by fear of the Law, they might, overcome by patience, be corrected as they amend themselves. This command was given so that the wicked might not live off the patience of the good, while the good do not repay them as they deserve; so that, if they wish to be corrected, the good may gain benefit from this, but the others suffer a double punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 13: HOW CHRIST FULFILLS RATHER THAN DESTROYS THE LAW"
