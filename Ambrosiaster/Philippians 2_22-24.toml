[[commentary]]
quote='''
And because Timothy was an excellent man, he says that he held him proved; for he was with him as a dearest son, serving the Gospel of Christ. He calls him son because he had been ordained by him: he says that he is sending him ahead, and that he himself will also go to them shortly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
