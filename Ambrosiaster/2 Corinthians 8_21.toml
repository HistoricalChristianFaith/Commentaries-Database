[[commentary]]
quote='''
For we provide good things not only before God but also before men. He provides good things before God while he teaches that what God commands concerning the ministry to the saints or the poor should be done; and he provides good things before men, because he sends to encourage this work such men as by their uprightness would not give them scandal, but would spur them on; lest the good teaching of the Apostle should fall into blame through his improvident ministers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
