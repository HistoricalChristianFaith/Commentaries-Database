[[commentary]]
quote='''
Now may the God of peace himself give you peace always in every place. The Lord be with you all. Always, as is his way, he follows them with a good wish, as his dearest sons, desiring that peace always remain with them, which is the guide to eternal life. For the Lord promised that he would be with those who are peacemakers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
