[[commentary]]
quote='''
But you are Christ's: so that, as these things have been granted and subjected to our judgment, so we too may be subject to Christ, seeing that it was through him that we began to be, both in our first origin and in regeneration. And Christ is God's. Christ is God's as the proper Son of his Father, doing his will, so that we too may do his. If, then, we are Christ's servants, why should we hope for anything from men, to his injury?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
