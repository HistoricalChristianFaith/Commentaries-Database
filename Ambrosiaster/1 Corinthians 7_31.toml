[[commentary]]
quote='''
And those who use this world, as though they did not use it: that is, that they should not presume upon this use, because it will quickly perish when the world collapses. For the figure of this world passes away. Because he said that the world is coming to an end, he shows that its figure passes away; and that this is the end, that is, that not its substance passes away, but its form. Therefore, if the form of the world will perish, there is surely no doubt that all things that are in the world perish. It passes away because the world grows old every day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
