[[commentary]]
quote='''
But if anyone loves God, this one is known by him. He loves God who moderates his knowledge for the sake of love, so as to benefit his brother, for whom Christ died.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
