[[commentary]]
quote='''
For the weapons of our warfare are not carnal, but strong for God. Strong for this reason, because they are incorrupt; for all carnal things are corrupt. Weapons, then, for this reason, because they fight against vices, bearing the standard of their emperor Christ, who is the enemy of vices; for just as an emperor defends his realm through his soldiers, so too the Savior, through us his servants, defends the confession and discipline of the one God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
