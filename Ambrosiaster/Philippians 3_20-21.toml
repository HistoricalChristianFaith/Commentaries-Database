[[commentary]]
quote='''
But our way of life is in heaven; whence also we await the Savior, our Lord Jesus Christ, who will transfigure the body of our lowliness, conformed to the body of his glory, according to his working, by which he is able also to subject all things to himself. Those who care for spiritual things are said to live in heaven, though they themselves are still on earth; just as the wicked Princes and Powers, though they themselves are still in the firmament, are nevertheless on earth in their way of life. The acts of Christians, then, are in heaven, where also is the hope of their salvation, which is Christ, whom every believer awaits for the transfiguration of the body of flesh, so that what is from the earth, clothed with a spiritual garment, he may make conformed, at the coming of his majesty, to the body of his glory, according to his working, that is, according to his power, by which he is able to subject all things to himself: that is, because through the resurrection of the dead and the change into glory the power of the Lord will appear made manifest, subduing all the Princes and Powers, so that he himself may be manifested to be God and Lord of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
