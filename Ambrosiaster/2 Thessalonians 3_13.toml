[[commentary]]
quote='''
But you, brothers, do not fail in well-doing. And if anyone does not obey our word through the letter, mark him, and do not live in company with him, that he may be confounded with shame: and do not regard him as an enemy, but admonish him with counsels, as a brother. Because above he commanded that each one ought to eat his own bread, lest perhaps some of them should seize on it as an occasion for stinginess and unkindness, he therefore at once added: But you, brothers, do not grow weary doing good. For it is not he who is kind and generous that comes under reproach, but he who, though he can bear labor, wishes to spend his life in idleness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
