[[commentary]]
quote='''
Do you not know that your bodies are members of Christ? Our bodies are members of Christ, but in respect of the new man, who is created according to God; for he is the head of the Church. Shall I then take the members of Christ and make them members of a harlot? Far from it (Eph. 4:24). He says, Far from it, because members that cleave to a harlot cease to be members of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
