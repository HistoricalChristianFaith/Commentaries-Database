[[commentary]]
quote='''
But the eye cannot say to the hand: I do not need your work. That is, the greater cannot say to the lower: I have no need of you; because the eye indeed sees, but it is the hands that work. Or again the head to the feet: You are not necessary to me: that is, he who is greater in rank and dignity cannot be without him who is lowly; because there is something the lowly can do which the exalted cannot, just as iron can do what gold cannot; and for this reason the feet do honor to the head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
