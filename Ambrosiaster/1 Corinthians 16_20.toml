[[commentary]]
quote='''
All the brothers greet you. He lifts their spirits when he shows that all these are mindful of them. Greet one another with a holy kiss. The holy kiss is a sign of peace, in which he teaches that they should cleave to one another, discord having been removed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
