[[commentary]]
quote='''
When the Lord, after bringing the sons of Israel out of Egypt, saw that they often sinned, He grew angry and pronounced a sentence, saying that none of them would enter the promised land except Caleb and Joshua son of Nun, who was previously called Auses. But as for those who had been born in the desert, He declared that they would enter, because they did not know good or evil. Now not to know good or evil is a certain natural simplicity, which has not yet been trained for evil. This is ignorance without hatred. For we are born without understanding, but our nature has this good, that it is capable of learning the truth. A son of the Devil, however, is one who, being born and steeped in evil things, devotes himself to those things that are hostile to the Creator, affirming that there are many gods and that sacrifices must be offered to them as if they were rulers of the world. If such a one comes to his senses and thinks in accordance with his nature, turning himself to the Creator, he will be a son of God. And therefore those who are born are neither sons of God nor sons of the Devil. For what does the Savior say to the Jews? “You are of your father the Devil, and you wish to do the desires of your father” (Jn. 8:44). You see then that by their works and their profession people are made sons of the Devil; but those are sons of God who, confessing that the Father of Christ is their own God, live rightly. For God has so ordered our race that we are born without understanding, yet have the capacity to learn either good or evil, so that we ourselves may acquire either evil or good: that we may rejoice in ourselves when, acting rightly, we are rewarded; or that we may blame ourselves if, following wicked ways, we are condemned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 80: WHETHER WE ARE BORN SONS OF GOD OR OF THE DEVIL"

[[commentary]]
quote='''
When the Lord, after bringing the sons of Israel out of Egypt, saw that they often sinned, being angered, He did not allow any of them to enter the promised land, except Caleb and Joshua son of Nun. But He said that their sons, who had been born in the desert, would enter, because they did not know good or evil. Now not to know good or evil is a certain natural simplicity, which has been trained neither to good nor to evil; that is, ignorance without hatred. For we are born without understanding, but our nature is capable of learning the truth. A son of the Devil, however, is one who, born and instilled with evil things, applies himself to what is opposed to the Creator, saying that there are many gods and that sacrifices must be offered to them as if they were rulers of the world. If such a one comes to his senses, returning to his natural righteousness and receiving faith in Christ, he will be a son of God; and therefore those who are born are neither sons of God nor of the Devil. For what does the Savior say to the Jews? “You were born of your father the Devil, and you wish to do the desires of your father.” (Jn. 8:44) You see then that by their works and profession sons of the Devil are brought forth. For God has so ordered our race that, though born without understanding, we can nonetheless be trained in either direction, so that whether to good or to evil we are in some way our own authors: that we may rejoice in ourselves when, acting rightly, we are rewarded; or blame ourselves if, following evil ways, we are subjected to punishments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 41: WHETHER WE ARE BORN SONS OF GOD OR OF THE DEVIL"
