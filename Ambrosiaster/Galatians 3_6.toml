[[commentary]]
quote='''
As it is written (Gen. 15:6): Abraham believed God, and it was reckoned to him as righteousness. By the example of Abraham, who is the father of faith, he shows that righteousness is imputed not from the works of the Law but through faith; for by believing he was justified: and therefore that they had foolishly and improvidently subjected themselves to the Law, which was not given for justification.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
