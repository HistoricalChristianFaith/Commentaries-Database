[[commentary]]
quote='''
Let deacons be husbands of one wife, ruling their children well, and their own houses; for those who have ministered well acquire for themselves a good standing, and much confidence in the faith which is in Christ Jesus. The things he had said less fully about the ordination of the diaconate he now subjoins. He shows that they too ought to be husbands of one wife, so that those may be chosen for the ministry of God who have not gone beyond what God has established. For God decreed one wife for a man, with whom he is blessed; for no one is blessed with a second. If they govern their children well, and their houses, that is, their home-born slaves or their household servants, they will be able to become worthy of the priesthood, and to have confidence before God, so that they may know that they can obtain what they ask, restraining themselves henceforth from the use of a woman. For to the Levites or priests of old it was granted for this reason to have wives for use, because for a long time they were at leisure from the ministry or the priesthood (for there was a multitude of priests, and a great abundance of Levites, and each served the divine ceremonies at a fixed time according to the institution of David (1 Chron. 6:31–32); for he established twenty-four classes of priests, that they might serve in turns: whence Abijah had the eighth class, in whose turn Zechariah performed the priesthood, as is contained in the book of Chronicles (1 Chron. 23:4 ff.)), so that at the time when it did not fall to them to serve the altar, they took care of their houses; but when the time of their ministry drew near, having been purified for some days, they came to the temple to offer to God. But now there must be seven deacons, and some presbyters, so that there may be two in each church, and one bishop in a city; and for this reason all ought to abstain from intercourse with a woman, because they must be present in the Church every day, and have no interval in which to be lawfully purified after intercourse, as the men of old had. For the offering must be made every week, even if not daily for strangers, yet for residents at least twice in the week; though there is no lack of those who are baptized almost daily when sick. For it was granted to the men of old for this reason, because for a long time they were not seen in the temple, but were private persons. For if he commands common people to abstain for a time for the sake of prayer, so that they may be free for prayer, how much more Levites or priests, who must pray day and night for the people entrusted to them! They ought therefore to be cleaner than the rest, because they are God's agents.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
