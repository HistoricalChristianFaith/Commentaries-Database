[[commentary]]
quote='''
Although there are those who are called gods and lords, whether in heaven or on earth. For by the pagans the sun and the moon and the other stars are called heavenly gods; on earth they call Apollo, Aesculapius, Hercules and Minerva gods and lords.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
