[[commentary]]
quote='''
Aristarchus, the companion of my captivity, greets you, and Mark the cousin of Barnabas (concerning whom you received a command, that if he comes to you, you receive him), and Jesus who is called Justus: who are of the circumcision. These alone are my helpers in the kingdom of God, who have been a comfort to me. This Aristarchus appears to be a man of good conduct and merit, who is designated a sharer and companion of the Apostle's labors in devotion to the Lord. And to commend Mark, he does not keep silent about who he is, so that, when he is learned to be a kinsman of Barnabas, a praiseworthy man, he may be held in honor. He adds Jesus too, who he says is called by the name Justus. To these alone he bears witness that, being of the circumcision, they were a help to him, assenting to and sharing his judgment, so as to preach that men ought no longer to be circumcised; therefore he calls them his sharers in the kingdom of God. But to preach that one must be circumcised, and that sabbaths and new moons must be kept, is not spiritual but earthly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
