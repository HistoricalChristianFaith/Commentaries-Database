[[commentary]]
quote='''
But you are the body of Christ, and members of a member. He shows openly that he has treated our case through the reasoning of the carnal members; because we cannot all do the same things, but each of us has also had grace granted according to the quality of his faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
