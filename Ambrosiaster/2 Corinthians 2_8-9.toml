[[commentary]]
quote='''
Wherefore I beseech you to confirm your love toward him: for to this end I wrote, to test whether you are obedient in all things. As far as can be understood, he finds that they have become obedient in other matters; for they had amended the things that pertain to ecclesiastical order. Hence he wishes them to be obedient in this too: to confirm their brother in love, receiving him into communion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
