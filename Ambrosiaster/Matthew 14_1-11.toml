[[commentary]]
quote='''
WHAT IS THE MEANING OF THE FACT THAT ABOVE WE READ THAT HEROD DIED (Matt. 2:19), BUT LATER ON, AFTER MANY YEARS, WE READ THAT HEROD KILLED JOHN (Matt. 14:1–11), EVEN THOUGH JOHN OUTLIVED THE EARLIER HEROD WHO HAD DIED? — Herod was king of Judea; he had four sons: Archelaus, Herod, Philip, and Lysanias. But when Herod their father died, Archelaus succeeded him; when Archelaus died, the kingdom of the aforesaid Herod was divided into four parts, in such a way that Pilate was admitted to the fourth part of the kingdom as governor, not as king (Matt. 2:22 and Luke 3:1), while the sons of Herod were called kings. Finally, when Philip also died, his brother Herod took Philip's wife, and it was because of this that he was criticized by John the Baptist; for this reason Herod, the son of the above-mentioned Herod, killed him. For what does it say? "Herod," it says, "the tetrarch," that is, placed over the fourth part of the kingdom of his father Herod. Why then is there any doubt, when the meaning of the added surname shows that this is another Herod? He is the very one who also killed James, the brother of John, with the sword, and who later, struck by the angel of God, burst forth with worms and died.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 11: ON THE TWO HERODS"
