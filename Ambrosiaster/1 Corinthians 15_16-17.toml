[[commentary]]
quote='''
For if the dead do not rise, neither has Christ risen. And if Christ has not risen, your faith is vain; for you are still in your sins. Then those also who have fallen asleep in Christ have perished. He frightens them, so that, since no one wishes ill to himself, they may grieve that they have begun to believe this, which is against themselves. For who would not wish to hear that his sins are forgiven?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
