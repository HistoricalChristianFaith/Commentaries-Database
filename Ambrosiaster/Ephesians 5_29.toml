[[commentary]]
quote='''
For no one ever hated his own flesh, but nourishes and cherishes it, as Christ also the Church. By the example of the Savior he exhorts husbands to love their wives: as Christ nourishes and cherishes his body, so also the husband his wife, because she is his flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
