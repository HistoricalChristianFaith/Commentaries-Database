[[commentary]]
quote='''
The Father God and of our Lord Jesus Christ, who is blessed forever, knows that I do not lie. He gives God as witness, so that what he says may readily be believed; and this only on account of those who did not honor him as a true apostle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
