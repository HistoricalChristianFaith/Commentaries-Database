[[commentary]]
quote='''
Though placed in the flesh, they are said not to be in the flesh if, agreeing with the apostle John, they do not love worldly things (1 Jn. 2:15); for a person’s judgment, as it were, shapes his own nature, so that he is called what he thinks. Paul says this somewhat obscurely because, having been introduced to the Law, their faith was not yet perfect; but he saw in them the hope of perfection. Therefore sometimes he speaks as to those already perfect, sometimes as to those about to be perfected, that is, sometimes he praises, sometimes he admonishes; so that if, according to what was mentioned above, they conduct themselves according to the law of nature, they may be said to be in the Spirit; because the Spirit of God cannot dwell in one who follows carnal things. The Spirit whom above Paul called the Spirit of God, he now calls the Spirit of Christ, because all things of the Father are the Son’s. This, then, is what he says: that whoever is subject to the above-mentioned errors does not belong to Christ; for he does not have His Spirit, which he had received that he might be a son of God. For the Holy Spirit abandons a person for two reasons: when he has either the mind of the flesh or the deeds of the flesh. And so by these admonitions he urges them to good conduct; for although men are raised up by the goodness of God, yet the sons of God who are called are burdened, unless they so live that they may not appear unworthy of the name granted to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Romans.html'
source_title="COMMENTARY ON ROMANS"
