[[commentary]]
quote='''
For he who plants and he who waters are one. They are one because both are hired workers, although their offices are different. But each will receive his own wage according to his own labor. For although they are one, yet because he who evangelizes is greater than he who baptizes, he has therefore distinguished their wages; and this pertains not only to that, but to the purity of doctrine: so that he who hands on doctrine inviolate is worthy of a greater wage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
