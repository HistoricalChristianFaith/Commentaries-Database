[[commentary]]
quote='''
One is the brightness of the sun, another the brightness of the moon, and another the brightness of the stars; for star differs from star in brightness. He uses a comparison of one nature to give an account of an undifferentiated substance; because just as the sun and moon and stars, though they are indeed of one nature, are yet of diverse brightness, so men too, though they are of one kind, will nevertheless be unlike in glory according to merit; so that the dignity of those who have the hundredfold number may be made equal to the brightness of the sun, those who, to be perfect, strove for the first degree, of whom it was said: Then the righteous will shine like the sun in the kingdom of their Father (Matt. 13:43). To the brightness of the moon are to be compared those who have purchased the sixtyfold number by good works, so as to have the merit of the second degree. And to the brighter stars are to be compared the merits of those who by righteous labors have sought the thirtyfold number, the dignity of the third degree. But to the following stars, which are midway between the bright and the darker ones, sinful men are to be fitted, who were unwilling to attain the honor of any of the three degrees. And to the gloomy stars, the last of all, the resurrection of the faithless is like; because, having followed error, they are to be compared to the stars that lead into error, as Jude the apostle says in his Epistle (Jude 13). For unbelief cannot have a bright resurrection; because as a coal covered with its own ash is darkened, so these too, surrounded by the darkness of error through their faithlessness, will lack light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
