[[commentary]]
quote='''
And may the Lord direct your hearts in the love of God and the patience of Christ. He wishes for them from God this, which he does not doubt can be granted: that in the love of God their heart may advance to awaiting the coming of the Lord, so that, the world being condemned, the coming of him who conquered the world may be longed for.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
