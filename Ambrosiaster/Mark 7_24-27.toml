[[commentary]]
quote='''
WHAT DOES IT MEAN THAT, ACCORDING TO THE ACCOUNT OF THE EVANGELIST MARK, CHRIST’S WILL WAS NOT FULFILLED: FOR “ENTERING,” HE SAYS, “INTO A HOUSE, HE WISHED NO ONE TO KNOW, AND HE COULD NOT REMAIN HIDDEN” (Mark 7:24)? IF THEREFORE HE WISHED TO BE HIDDEN AND COULD NOT, HIS WILL HAS BEEN WEAKENED. — This, which has been presented in brief so that it might conceal more meaning, is read as having taken place in the regions of Tyre: for when the Savior had come into the borders of Tyre, he entered a house. And because he ought not yet to preach to the Gentiles, he ordered that no one should announce his coming to anyone: that is, he did not wish anyone to know; and it is understood that he did not wish it to be reported by his own people to anyone that he was in the house. Yet he did not wish to be sought, because the time for offering grace to the Gentiles had not come. Indeed, when the woman came, having learned from others who had seen him enter the house, she begged that the demon might be cast out of her daughter. But the Savior, knowing that it was not yet the time to grant grace freely to the Gentiles, said, “Let the children first be filled. For it is not right to take the children’s bread and throw it to the dogs.” (Mark 7:27) Then the woman agreed with the Savior’s words and received the blessing she desired. For by agreeing she joined herself to the God of the Jews. For this reason, therefore, he did not wish it to be known by his own people that he was in the house; and therefore it happened as he willed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 25: ON WHY CHRIST COULD NOT REMAIN HIDDEN"
