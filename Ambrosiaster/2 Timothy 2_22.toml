[[commentary]]
quote='''
But flee youthful desires. Youthful desires are hostile; for they are worldly pleasures, which are enslaved to every allurement; and for this reason they are to be fled by the servant of God. But pursue righteousness, faith, love, peace, with those who call upon the Lord from a pure heart. He bids him pursue these things, which seem out of the way and harsh to youthful age. For he who chooses righteousness does nothing contrary to it; and he who loves faith keeps the commandments: and he who follows love is humble towards all; and the guardian of peace provokes no one to a quarrel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
