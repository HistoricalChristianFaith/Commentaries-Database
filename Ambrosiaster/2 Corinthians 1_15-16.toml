[[commentary]]
quote='''
And in this confidence I had wished to come to you first, so that you might have a second grace; and to pass through you into Macedonia, and again to come from Macedonia to you, and to be brought on my way by you into Judea. This confidence comes from their amended life; for he indicates that he now even longs for those whom before it was unfitting to see. They would, then, have had full grace from his coming; because a letter is an image, but presence is the truth. So it is not idle that he had wished to go and did not go; for he wants it understood that there are some among them because of whom he did not fulfill his wish, so that, once effort had been applied, they might be purified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
