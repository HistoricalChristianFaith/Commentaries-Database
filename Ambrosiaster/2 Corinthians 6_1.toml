[[commentary]]
quote='''
But helping, we also beseech you not to receive the grace of God in vain. The Apostle strives to undertake the care of human salvation in a twofold way: so that he might both be devoted to the providence of God and show men the service of love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
