[[commentary]]
quote='''
Begging with many prayers to be received into the grace and fellowship of the ministry which is done for the saints. He proclaims that they offered the ministry, which was beyond their strength, with such simplicity and devotion of mind that they offered it entreating with tears, so that even in this way they might compel the acceptance from them of what did not seem fit to be accepted, because it was more than their substance could bear; lest perhaps afterwards want should persuade them to regret their good work. But because they showed themselves such that, with a pure mind already setting present things aside, they strengthened themselves in the future promises by the confidence of faith, it seemed right to accept from them, lest the grace of a good heart should lose its fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
