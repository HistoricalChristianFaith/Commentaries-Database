[[commentary]]
quote='''
Therefore, as we have borne the image of that earthy one, let us bear also the image of this heavenly one: that is, as we had the form of mortality through the sin of Adam, having been made slaves of sin, so let us also have the form of life through the righteousness of the Savior, having been made slaves of righteousness, not of the world but of God, while we do the things that are worthy of immortality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
