[[commentary]]
quote='''
Only conduct yourselves worthily of the Gospel of Christ. He wants them to show a way of life worthy of the Lord's discipline, so that he may not regret having wished to remain in the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
