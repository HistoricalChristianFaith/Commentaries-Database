[[commentary]]
quote='''
Do you think again that we are excusing ourselves to you? What he says is this: You have long been in doubt about us, thinking that we do not deal with you sincerely. For they were being stirred up by the false apostles, who, wishing to plunder them, asserted that the Apostle was doing this by subterfuge, as if in order to be able to receive more. We speak before God in Christ; but all things, beloved, for your edification. He so desires that they should think truly and well of him that he satisfies them both by reasoning and by attestation: that he shows himself to be such not to profit himself, but to further their edification; so that even in this way he may provoke their love toward himself, while he does not burden their means and does not bend the authority of his power in reproving vices. For without doubt it benefits the one who is rebuked, so that he amends, if the one set over him refuses what is offered for this reason, that he may reprove freely.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
