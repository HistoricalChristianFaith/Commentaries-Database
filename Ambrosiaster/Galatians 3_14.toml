[[commentary]]
quote='''
That the blessing of Abraham might come among the Gentiles through Christ Jesus: and that we might receive the blessing of the Spirit through faith. He says this because, the Jews having been reproached and cursed, since they flattered themselves on the righteousness of the Law, when the Savior had been killed as a violator of the sabbath, the blessing of the promise to Abraham passed over to the Gentiles through faith in Christ Jesus. Hence the Lord says to the Jews: The kingdom of God shall be taken from you, and shall be given to a nation producing its fruits (Matt. 21:43).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
