[[commentary]]
quote='''
But brother goes to law with brother, and that before unbelievers. It is clear that by unbelievers he means either arbiters called in, as is customarily done, or a public judge, to whom it is commonly said: Today is a day of sacred rites; justice cannot be pronounced.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
