[[commentary]]
quote='''
The rulers of this age are not only those who were great among the Jews and the Romans but also every spiritual power which sets itself up against God. The Jewish rulers cannot be called rulers of this age, because they were subject to the Romans. Nor did the Romans crucify Jesus, because Pilate himself said that he found no fault in him. The rulers who crucified him were the demons. They knew that Jesus was the Messiah but not that he was the Son of God, and so it can be said that they crucified him in ignorance.
'''
source_url=''
source_title="COMMENTARY ON PAUL'S EPISTLES"

[[commentary]]
quote='''
HOW IS IT THAT MARK THE EVANGELIST SAYS THAT THE DEMONS RECOGNIZED AND PROFESSED JESUS, WHILE ON THE OTHER HAND THE APOSTLE DENIES THAT THE RULERS AND POWERS OF THIS AGE KNEW THE DIVINITY OF THE LORD JESUS? FOR MARK, AMONG OTHER THINGS, SAYS: “THEY KNEW THAT HE WAS THE ONE”; BUT THE APOSTLE SAYS, “NONE OF THE RULERS OF THIS AGE KNEW HIM. FOR IF THEY HAD KNOWN, THEY WOULD NEVER HAVE CRUCIFIED THE LORD OF GLORY” (Mark 1:34; 1 Cor. 2:8). IF THE DEMONS KNEW, HOW DID THE RULERS NOT KNOW? — To some it seems that by “the rulers of this age” he meant the leaders of the Jews, as if in line with what the Apostle Peter says: “You know, brothers, that you acted in ignorance, just as your rulers did” (Acts 3:17). Therefore they were rulers of the Jews, yet they were not rulers of this age. Hence he says “your rulers,” not “the rulers of the age,” since they said that they had Caesar as their king, under whose power they had been placed. But these are those rulers whom the Apostle indicated elsewhere, saying: “We do not wrestle against flesh and blood, but against the rulers and powers of this world, against the princes of these present darknesses” (Eph. 6:12). So the question is rightly asked: if these did not know Jesus, how could it be that the demons recognized him? But what he says about the demons having known Christ is one thing, and what he says about the rulers of this age not having known him is another. For the demons knew that he was indeed the one who had been promised in the Law. They saw in him all the signs that the Prophets had said would come: that the Redeemer of Israel would come from the seed of David and from a virgin. But they did not know the mystery of his divinity, just as their rulers did not. Accordingly, the devil, though cunningly, asks the Savior: “If you are the Son of God,” etc. (Matt. 4:3). For seeing at one time divine power and at another human weakness, and hesitating as to what was true, he was in torment. Thus the Scriptures agree according to what has been revealed; for it is impossible that men inspired by one and the same Spirit should be at variance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 66: HOW DEMONS KNEW CHRIST BUT THE RULERS OF THIS AGE DID NOT"

[[commentary]]
quote='''
THE APOSTLE SAYS ABOUT THE PRINCES AND POWERS OF THIS WORLD THAT, IF THEY HAD KNOWN, THEY WOULD NEVER HAVE CRUCIFIED THE LORD OF MAJESTY; BUT, ON THE OTHER HAND, MARK THE EVANGELIST SAYS OF THE DEMONS, “FOR THEY KNEW HIM TO BE.” IF THE DEMONS KNEW, HOW DID THE POWERS NOT KNOW? — To some it seems that by “the rulers and powers of this age” he meant the leading men and chiefs of the Jews, who, according to the words of the Apostle Peter, did not know what evil they were doing. For he says: “I know, brothers, that you acted in ignorance, just as your rulers did.” These were the rulers of the Jews, yet they could not be called rulers of this age, since they had been brought under the power of the Romans, confessing that they had no king but Caesar. But these are the rulers whom the Apostle means elsewhere when he says: “We do not wrestle against flesh, but against the rulers of this world and the princes of these darknesses.” If, then, these are the rulers who, not knowing that the Lord of glory was Christ, crucified him, how could he have been known by the demons? The demons did not know him otherwise than as the rulers of this age knew him. For they knew that he was the one who had been promised in the Law, by the signs of prophecy; but they did not know his mystery, by which he was the eternal Son of God, nor the sacrament of the Incarnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 48: IF THE DEMONS KNEW CHRIST, HOW DID THE POWERS NOT KNOW?"

[[commentary]]
quote='''
For they say that fate grants what concerns human conduct. Yet how can fate be said reasonably to grant what it is found to be ignorant of? From this comes what the Apostle says, “None of the princes of this world knew” (1 Cor. 2:8). These are the princes and powers who have evil angels under them and, under the name of “fates,” bring about their pleasures as they wish, just as sorcerers are accustomed to confess. For there are some whom they love, others they do not love, some they hate. And each of them suggests to each person that which he loves, since they themselves have different pleasures: for some they acquire lust of varied wickedness, for others gifts, for others pleasure, for others immorality, for others anger, for some greed, for others gains, for others losses, for others favor, for others hatred, and also hindrances. And sometimes, at certain times, when they are gratified, they rest in idleness; at other times for a reason, at other times they do not intrude upon an occupied mind; for they do not rule, but creep in, seeking an opportunity by which they may ensnare. Therefore the decision of the will is free; but when through some desire we become negligent toward ourselves, those who trouble us suggest adversities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 115: CONCERNING FATE"
