[[commentary]]
quote='''
For the sorrow which is according to God works repentance unto steadfast salvation. It is plain that he who is sorrowful because he has sinned is sorrowful according to God; for he grieves because he did what God hates. This pertains to the steadfastness of salvation. But the sorrow of this world works death. He says this: just as sorrow according to God works life, for one repents and hopes for God's mercy, so sorrow according to the world works death. For the sinner who is found out is sorrowful as one about to be punished, having no one from whom to hope for mercy; and even if for the present there should happen to be no one to punish him, he will nevertheless not be able to escape the judgment of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
