[[commentary]]
quote='''
ON PSALM 23. — The title of the Psalm hints at its meaning. For, about to speak of the mystery of Christ our Lord, he marked the Lord’s day, saying: For David, on the first day of the week. For when it is said, For David, it relates to the one of whom this David bears the image, of whom the prophet says: And my servant David shall pasture them (Ezek. 37:24). Now the “first of the sabbath” is the first weekday. For after the sabbath the first day is the Lord’s day, as the Gospel affirms, saying: Now on the first of the sabbath Mary Magdalene and the other Mary came to the tomb, etc. (Matt. 28:1). On the Lord’s day he signified the mystery of the Savior. But so that the Psalm might be expounded according to the order of reason, he began from the person of God the Father, so that the mystery of the divinity might not be revealed to men without order. For whoever wants to lay out some case, unless he grasps its head and origin, will not be able to show its proper nature or teach what its truth is. And so the Prophet began therefore and said: The earth is the Lord’s and its fullness. (Ps. 23:1a) He preserved the truth of things by saying: The earth is the Lord’s and its fullness. For he followed the authority of the ancient saints, who said that the earth and the things that are in it belong to the Lord God. And he added: The world and all who dwell in it. (Ps. 23:1b) Lest perhaps it be thought that he had signified something less when he said, The earth is the Lord’s and its fullness, he revealed his meaning by saying, the world and all who dwell in it, so that he might teach that absolutely all the earth is the Lord’s, and the things that are in it, so that nothing should be excepted that is not God’s. As some heretics think, who, according to the saying of the apostle Peter, deny dominion to God (2 Pet. 2:10), about whom the prophetic oracles have taught that all things belong to God for condemnation. And it continues, He has founded it upon the seas; (Ps. 23:2a) that is what he expressed in another psalm, saying, You formed the earth upon the waters (Ps. 135:6): so that testimony might follow faith, he shows how he made it. For while there was confusion of things, and neither earth nor water had its own distinct form, at God’s command the earth was gathered together and fixed upon the waters, so that both earth and water might have the proper character of their origin. Therefore in the book of Kings there is the voice of God saying, Did I not make the waters? And he added: And he prepared it upon the rivers. (Ps. 23:2b) Therefore it is prepared upon the rivers, since it contains within itself stored waters, which, flowing as though through the pipes of veins, give it solidity, lest it be completely dry, fragile, and useless for cultivation. For they grant a vital effect to the roots of growing things, and at the same time they are a help against thirst in dry places. And to show that profession without a good life does not profit greatly, he says: Who shall ascend the mountain of the Lord, or who shall stand in his holy place? (Psalm 23:3-4) He sets forth what sort of person one must be who professes God as creator, lest, because he has shown that those who, as I said, deny God’s dominion are to be punished, those who confess him should think themselves free from punishment if they do not live rightly. By the mountain of the Lord he means heaven. Therefore in another psalm he says: I have lifted up my eyes to the mountains, from where help will come to me (Ps. 120:1). The place of the Lord is where he appears. It is said to Joshua son of Nun, when the Lord had appeared to him, The place on which you stand is holy ground (Josh. 5:16); and Jacob, where he saw God, said, This is the house of God (Gen. 28:17). And it continues: Innocent of hands and pure of heart. (Ps. 23:4b) This person he calls worthy to ascend the mountain of the Lord, that is, into heaven, or to stand in his holy place, if someone is innocent in works and has a pure heart in the cause of God, that is, of faith. A person of this kind can ascend into heaven and stand in his holy place. For when he departs from this life he ascends into heaven. Then, when the city Jerusalem descends from heaven at the coming of the Lord, he will be worthy to stand where the Lord is going to judge the living and the dead as one who is innocent; but the ungodly and sinners will be unworthy to stand in the holy place of God’s judgment, because the ungodly will rise to destruction, sinners to punishment. For if the sons of Israel, because of sin, could not bear to look upon the glorified face of Moses when he came down from the mountain (Ex. 34:29–30), how much more will a conscience burdened by sins dread to behold the Lord himself of glory sitting on the throne of his majesty? For they will hear, I do not know you, workers of iniquity (Matt. 7:23). And he added: Who has not taken his soul in vain. (Ps. 23:4c) Now he touches on the very kinds of sins. First of all, in this place, he is innocent and has a pure heart, who is free from the fornication of idolatry. For this is vanity itself, and whoever bends himself to it brings his soul into bondage to corruption. And it continues: Nor has sworn deceitfully to his neighbor. He has mentioned two causes, which are principal: those of God and of neighbor; because whoever is found upright in these will without doubt be approved in other matters also, as the Lord says, You shall love the Lord your God with all your heart and with all your strength. This is the first commandment. And the second is like it, You shall love your neighbor as yourself. On these two commandments hang the whole Law and the Prophets (Matt. 22:37–40). Who then, loving God with all his heart, would not keep his law? Or who, having love for his neighbor, would strive after sins? since it is because of fear of God that he loves his neighbor. And he added: He shall receive blessing from the Lord, and mercy from God his Savior. (Ps. 23:5) Now he shows what is the reward of one who has had faith and love in the cause of God and man, of the creator and of neighbor: that he will both be blessed by the Lord, so that he may appear praised, and will obtain mercy in those things which he has not been able to fulfill. For no one can be so watchful as never to err at all; but because he is found zealous and faithful in great matters, he may also receive mercy from his God in lesser ones. He is therefore called Savior, because he does not will the death of one who is dying, but that he should turn back and live (Ezek. 18:32). And it continues: This is the generation of those who seek the Lord, who seek the face of the God of Jacob. (Ps. 23:6) He has said there is one generation of those who seek God, and of those who seek the face of the God of Jacob, and this is not idle. For although both are good, yet by these words he has indicated two degrees. It is a good thing to seek God; it is a fullness of good to seek the face of the God of Jacob. For those are more worthy who are before the face of the judge. Of these merits, therefore, this is the generation: because innocence and purity of heart bring one to this point; just as, in turn, if one is to come to evil, unrighteousness and iniquity go before. For there are two generations: one on the side of iniquity, which is the mother of Cain; the other on the side of righteousness, which is the mother of Abel: the latter consists in faith and good conduct; the former in treachery and crooked works. These are the two laws, of good and of evil, of God and of the Devil; and whichever one a person has followed, he will be called its son. And therefore this is the generation of those who seek God: faith in God and love for neighbor, as we have said above. For whoever has faith in God is always seeking his help; nor does he show himself unjust to men who wishes to have God as his gracious protector. The sign of this is when he is called the God of Jacob, because God is known in Judah (Ps. 75:2). But why are they said to seek his face, when Moses heard, For, he says, my face shall not be seen by you (Ex. 33:20)? If therefore even Moses sought the face of God and could not see it, then these are said to seek in vain, because they are not better than Moses. But no one should be said to seek the face of God in vain, because they are therefore said to seek the face of God so that it may be known whom they seek, since they are worthy also to see him. For everyone who is sought is then known if his face is seen. But since the face of God cannot be seen by mortals, this expression stands for “face” when it is said, the God of Jacob. Diapsalma. In this passage Diapsalma signifies a change of person. For after those things which pertain to the person of God the Father, he adds those which pertain to the mystery of God the Son, so that the full order of Father and Son is preserved. For the Law was given through Moses so that it might be as an instructor for men, instructing and preparing them as a teacher of righteousness, so that they might become worthy of the year of the Lord’s expiation and the day of recompense; so that those who under the hope of the future Christ had been faithful might receive him and be able to escape Adam’s sin, being secure regarding their own, because his coming, which they had hoped for, would grant them mercy concerning those things in which it slipped upon them so that they sinned. This is what he mentioned above, saying, He shall receive mercy from God his savior. He therefore says: Lift up your gates, you princes. (Ps. 23:7a) This is the voice of the holy angels, of whom he says in the Gospel that, he says, angels came and ministered to him (Matt. 4:11). These then speak to the princes and powers against whom the Apostle says we have our wrestling (Eph. 6:12), that they should lift up the gates of their prince, that is, of the Devil, who is the prince of princes set in error, through which one goes into Gehenna. These gates are unbelief and the deceit of idolatry. And it continues: And be lifted up, you everlasting gates. (Ps. 23:7b) Faith and hope with love are everlasting gates, because what is proclaimed through truth cannot be abolished. But those gates which I said are unbelief and the deceit of idols are temporal, because no lie remains. For when the truth is revealed, it will perish. They are therefore taught to take away the gates of their prince of darkness, that is, that with the error of many gods removed, the faith of the one God may be brought in, in Christ. This is what the Apostle testifies that he was sent to teach, that he might show not only to men, but to princes and powers in the heavenly places the mystery of the one God in Christ (Eph. 3:8–12). And he added: And the king of glory shall enter. (Ps. 23:7c) He commands that the deceitful gates, subtly fashioned by the Devil, be taken away, these are presumption, through which he thought himself a god, so that the king of glory may enter, who is Christ Jesus our Lord. For faith in God enters no one’s mind unless he has removed from himself the error invented by the Devil’s transgression. And the princes mentioned above cannot receive Christ the king into the faith of the one God unless they cast from themselves the tradition by which slander is brought upon the one God; not only the earthly slander, but also that which in heavenly places has been seized by the prince of princes, Satan. For the error which they conspired among themselves, so that at the Devil’s instigation they called themselves gods, they also arranged here on earth, so that this error might be its image here. And it continues: Who is this king of glory? (Ps. 23:8) Lest it might perhaps be thought that Christ was called king of glory unnecessarily, he introduces the person of one asking and saying, Who is this king of glory? As though he were in amazement or wished to be taught whether it is true and fitting to call Christ king of glory. And therefore they answered him: The Lord strong and mighty, the Lord mighty in battle, so that by this being added he might learn Christ to be king of glory, not by basic words but with testimony. For the strength and power by which he subdued and crushed the Devil with his attendants show him to be the king of glory. And he added: Lift up your gates, you princes, and be lifted up, you everlasting gates; (Ps. 23:9a) that is, since by the testimony of his power, which it is wicked to contradict, you have learned that it is worthy that Christ be called king of glory, remove error from your minds. And in that he says, The king of glory shall enter, it is shown that they cannot share in the faith of Christ unless they have cleansed their hearts from all impurity of idolatry. For unless man has been renewed, the Holy Spirit will not enter him. And it continues: Who is this king of glory? (Ps. 23:9b)  This repetition brings confirmation. For everything that is heard as new is not grasped in the heart unless it is repeated. And it brings wonder and astonishment when that which has never been heard before is spoken. And he added: The Lord of hosts, he is the king of glory. (Ps. 23:10) By repeating the same, he teaches that it is rightly said that this one is king of glory, who is the Lord of hosts. For he is not undeservedly called king of glory who rules over the powers. Where the Apostle: For if they had understood, he says, they would never have crucified the Lord of majesty (1 Cor. 2:8).
'''
