[[commentary]]
quote='''
In whom we too have obtained our lot, predestined according to the purpose of God, who created all things according to the counsel of his will, that we should be to the praise of his glory, we who before hoped in Christ. This is what he says: that the dispensation of preaching was decreed by God for those who from among the Jews believed in Christ. Hence none from the Gentiles was chosen for the apostolate; for it was fitting that preachers should be chosen from those who before hoped for the salvation that had been promised to them in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
