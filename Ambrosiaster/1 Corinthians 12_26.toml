[[commentary]]
quote='''
And if one member suffers anything, all the members suffer with it. This is not doubtful concerning the members of the body of flesh: because if the eye, or the foot, or the hand is seized by some sickness of infirmity, the whole body grieves with it: so he teaches us also to grieve with the brethren, if anything of this kind, or of need, has arisen. Or if one member is glorified, let all the members rejoice with it. It is clear that the head or the other members are glad if the feet have been well tended or are healthy. So we too ought to become cheerful if we see some brother to be a worshipper of God and increased in seemliness of morals, that is, sound in counsel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
