[[commentary]]
quote='''
For we are sharers in God's work: you are God's tillage, God's building. This pertains to the person of the apostles, who, it is established, are God's helpers; for they are vicars of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
