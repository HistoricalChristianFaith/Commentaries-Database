[[commentary]]
quote='''
Therefore let us celebrate the feast, not with the old leaven. That is, having the joy of renewal, let us flee old deeds, casting away from us all uncleanness, which is corruption; because just as leaven corrupts the whole lump, so too a bad life corrupts the whole man. So, that we may guard ourselves not only from baseness of life but also from the pursuit of iniquity, he added:

Nor with the leaven of malice and wickedness, but with the unleavened bread of sincerity and truth. That is, that sincerity may make life clean, and truth exclude all fraud.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
