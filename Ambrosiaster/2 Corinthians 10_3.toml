[[commentary]]
quote='''
For though walking in the flesh, we do not wage war according to the flesh. That is, though placed in the body, we live spiritually; for he lives spiritually who does what pleases God. He, then, wages war according to the flesh who obeys the desires of the flesh; for all error is called flesh. But he wages war for Christ who obeys him in faith and discipline.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
