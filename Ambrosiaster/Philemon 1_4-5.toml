[[commentary]]
quote='''
I give thanks to my God, always making mention of you in my prayers, hearing of your faith and love which you have towards the Lord Jesus and towards all the saints; that your sharing may become acceptable in the acknowledgement of every good that is in us in Christ. He says that he rejoices and gives thanks to God in his prayers, because Philemon was firm in faith and pressed on in good works: for he who loves Christ ought to prove this towards his servants, knowing that the Lord will reckon to himself whatever is shown to have been spent on his servants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philemon.html'
source_title="Commentary on Philemon"
