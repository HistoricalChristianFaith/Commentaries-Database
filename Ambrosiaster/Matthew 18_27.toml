[[commentary]]
quote='''
Such is the case of careless and murderous Cain, like that of the wicked servant who, though his master had forgiven him, went out ungrateful and throttled his fellow servant, so that he might be condemned without excuse both for the past crime forgiven him and for his cruelty against his fellow servant (Matt. 18:27). And yet Cain was not at that moment condemned, but, shamed and guilty, was sent forth under terror upon the earth, so that, if he repented, he might be forgiven. From this envy flared up so that he killed his brother, so that the unrighteous man killed the one who had first shown righteousness, and a bad example might be given to mankind. Therefore, blinded by the rivalry of jealousy, he not only failed to give thanks that he had not been made guilty, and had learned how to correct this, but even added something worse by which he would deserve condemnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 5: WHY WAS ABEL’S SACRIFICE ACCEPTED, AND CAIN’S REJECTED?"
