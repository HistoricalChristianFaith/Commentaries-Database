[[commentary]]
quote='''
But I praise you, brothers, that you keep all my things in memory, and that, as I hand them on everywhere, you hold my traditions. After rebuking their morals and way of life, he now wishes to correct their traditions. So he is not affirming this, but is angry with them; because, though he was their apostle, they were unmindful of his traditions; nor did they follow, from the tradition of other churches, what they had not yet learned; and for this reason he hands it on to them as if anew, saying:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
