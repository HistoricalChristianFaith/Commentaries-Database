[[commentary]]
quote='''
I exhort therefore, first of all, that entreaties, prayers, petitions and thanksgivings be made for all men, for kings, and for all who are placed in a higher station; that we may lead a calm and quiet life in all godliness and chastity. For this is good and acceptable before God our Savior, who wills all men to be saved and to come to the knowledge of the truth. This is the ecclesiastical rule, handed down by the teacher of the Gentiles, which our priests use, that they make supplication for all, entreating for the kings of this world, that they may hold the nations in subjection, so that, set in peace, we may be able to serve our God in tranquillity of mind and in quiet. Praying also for those to whom high power has been entrusted, that they may govern the commonwealth in righteousness and truth, with an abundance of goods supplied, so that, the disturbance of sedition being removed, gladness may follow; for bread strengthens the heart, and wine gladdens the mind (Ps. 103:15). Petitioning, moreover, for those who are in various need, that, rescued and set free, they may praise God as the author of their safety. Rendering thanksgivings also for the things which are bestowed on us daily by the providence of God for our life; so that in all these God the Father may be praised, from whom are all things (1 Cor. 8:6), and his Son, through whom are all things; so that, all that is hostile and inimical to this empire being laid to rest, we may be able to serve God in the disposition of godliness and chastity; for disturbance and captivity preserve neither godliness nor chastity. For how is he godly who is naked? And how chaste, when he is not in his own power? So that these things may be preserved, then, quiet is necessary; so that services pleasing to God may be rendered, who wills all men to be saved and to know the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
