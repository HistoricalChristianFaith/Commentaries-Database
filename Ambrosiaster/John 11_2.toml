[[commentary]]
quote='''
IT MUST BE ASKED WHETHER JUDAS ISCARIOT, THE TRAITOR OF THE LORD, ENDED HIS LIFE BY HANGING BEFORE THE PASSION OF THE SAVIOR. — After the Savior was betrayed, and as the preparation day was dawning, all the chief priests and scribes and elders gathered in the house of the high priest Caiaphas, to which they knew Jesus was to be brought, so that they might hear Him. This is confirmed by the evangelists Matthew and Mark, and from them it is clear that none of these men left the house of the governor before their wicked work was completed, since all their urgency and devotion in celebrating the Passover was that the death of the Savior should take place. Since they were therefore occupied with putting the Lord to death from morning until the ninth hour, how can Judas be shown to have returned to them the price of blood which he had received, before the Lord’s crucifixion, and to have said to them in the temple, “I have sinned in betraying innocent blood” (Matt. 27:1–5), when it is certain that all the chief priests and elders were not in the temple before the Lord’s Passion? For even when He was on the cross they were still insulting Him (ibid. 41). Nor can it be proved from this that it was reported before the Passion, since there are many things which, though known to have happened earlier, are placed later in order; and again, when the context allows, something that took place afterwards may be set before what came earlier. For it is evident that the fiftieth psalm is earlier than the third. Therefore it sometimes happens that later events are anticipated. Therefore also Mary, although she is shown to have anointed the Lord’s feet with ointment at supper after the resurrection of her brother Lazarus, six days before the Passover, is mentioned beforehand by the evangelist because of the meaning of that act, who, among other things, says: “It was Mary,” he says, “who anointed the Lord with ointment” (Jn. 11:2). He reports this before Lazarus had died; and if we did not find that it happened later, we would not know at what time it took place. But perhaps it occurred after the ninth hour, so that when the wicked and most cruel Judas saw the Savior slain, and on account of this the veil of the temple torn, the earth shaken, the rocks split, the elements terrified, being seized with fear he was grieved, not unaware that he had betrayed the Just One, in whose Passion God the Judge had therefore shown His anger. Yet even after the ninth hour, as I think, the elders and chief priests were occupied; for that same evening they were going to celebrate the Passover, and on the Sabbath it was not permitted by the Law to carry money. Consequently, it seems unlikely to me on which day, indeed at what time, Judas Iscariot ended his life by hanging.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 94: ON THE DEATH OF JUDAS ISCARIOT"
