[[commentary]]
quote='''
I beseech you therefore, brothers, I, a prisoner in the Lord, that you walk worthily of the calling with which you have been called. He exhorts them that, going rightly in the precepts of the Lord, they may be able to arrive at the promised glory. For just as a skilled physician beseeches the sick that, by conducting themselves well, they may be able to recover healthful soundness; so too the teacher of the Gentiles exhorts that, by doing works worthy of their faith, they may be able to receive what has been promised to the saints, knowing that the progress of this matter is to his own glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
