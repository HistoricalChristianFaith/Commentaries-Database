[[commentary]]
quote='''
But if something is revealed to another who is sitting, let the first be silent: that is, let the superior give way to the inferior, so that he may speak if he can; and let him not take it ill, because to that one too, though he seems inferior, a gift may be given to say what has not been granted to the superior. For just as everything cannot be granted to one man, even to the superior, so neither can nothing be imparted to anyone, however inferior; so that no one is empty of the grace of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
