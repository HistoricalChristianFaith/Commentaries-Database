[[commentary]]
quote='''
Husbands, love your wives, and do not be bitter toward them. He softens the rigor of the man's law, lest anyone, by the power in which he prevails, be excessive in his lordship over his wife; but he ought to have regard to affection, because the woman is his flesh; lest, humbling her too much, he embitter her and she think contrary thoughts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
