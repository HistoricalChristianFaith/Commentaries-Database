[[commentary]]
quote='''
Grace to you and peace from God our Father, and the Lord Jesus Christ. It is manifest that God is father; but that Christ Jesus is our Lord. Does not a lord seem to be more than a father? But that is among men in the world: with God the Father, however, and with Christ the lord there is concord. For here, that is, in the world, a lord is more than a father for this reason: because either he is lord even of the father himself, or the father begets a son not of his own status but of another's; but God so begot that those whom he begot are in his power, so that, though born free, they are nevertheless his servants: when he hands them over to his own Son, he makes them also servants of his Son, so that he is their lord, as he says: Father, those whom you gave me were yours, and you gave them to me; so that in the Father and the Son they are servants of the one God (John 17:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
