[[commentary]]
quote='''
For to the rest I say, not the Lord. He said this to show what the Lord commanded with his own mouth, and what he granted to this man's authority; because the Lord speaks through him too. For he says: Or do you seek a proof of him who speaks in me, Christ (2 Cor. 13:3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
