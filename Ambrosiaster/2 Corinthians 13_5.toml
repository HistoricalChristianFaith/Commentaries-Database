[[commentary]]
quote='''
Test yourselves, whether you are in the faith: prove yourselves. He instructs the brothers to examine one another; for they become more careful if they confer with one another. So he meant this testing to be understood as proving; for every proving is a testing, yet not every testing is a proving. For if God is said to test, it is a proving; but if the devil is said to test, it is a temptation, because he strives to overthrow. And a man sometimes tests in order to prove, sometimes in order to ensnare. Or do you not know yourselves, that Christ Jesus is in you, unless you are reprobates? He says this because, if you do not know how to prove one another, you do not know that Jesus Christ is in you; and this is to be a reprobate: not to know the faith of one's own religion and profession. For whoever holds in his heart the sense of his faith knows that Christ Jesus is in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
