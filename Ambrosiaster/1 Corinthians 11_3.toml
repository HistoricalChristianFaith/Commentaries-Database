[[commentary]]
quote='''
I want you to know that the head of every man is Christ. He has referred it to authorship; because man is indeed from God, but through Christ. But the head of the woman is the man. Because although the woman too is through Christ, she was nevertheless made from the man, and for this reason she is subject to the man. But the head of Christ is God. It is fitting that the Father be called the head of the Son, as being his begetter. Yet Christ is the head of the man in one way, and the man of the woman in another, and God is the head of Christ in another. Now God is the head of Christ for this reason, that he was begotten of him, or by him. But the man is the head of the woman for this reason, that she was formed from his rib by the power of God (Gen. 2:21). And Christ is the head of the man for this reason, that when the man did not exist, he was created through him. So one word has a different meaning, because both the persons and the substances differ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
