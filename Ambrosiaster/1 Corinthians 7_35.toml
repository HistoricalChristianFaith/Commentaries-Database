[[commentary]]
quote='''
But I say this for your own advantage; not to cast a snare upon you, but for that which is honorable. Since to some what is more useful or better seems harsh and heavy because of the habit of temporal use, therefore, after giving his reason, he exhorts with the affection of love that what he says is simply more useful, more honorable. It is honorable because it is holy and pure; useful, because it is more worthy before God, and light in the world. What then shall we say? If virgins think of God, and those joined to husbands of the world, what hope is left before God for those who marry? For if it is so, their salvation is in doubt: for we see virgins thinking of the world, and those joined in marriage devoting themselves to the Lord's works. To these virgins holiness will not be credited by God, and these marriages will have a reward before God; because, though they were bound by earthly ties and the ties of the flesh, they gave their effort to merit some immortal reward for the future. To those, however, not only will virginity not be credited, but they will also be subjected to punishments, who, under cover of a better hope, occupying their life and conduct with worldly care and anxiety, have made themselves sluggish in doing the works of God; as Jeremiah the prophet says: Cursed is he who does the works of God negligently (Jer. 48:10). These are those of whom he says in another epistle: Having indeed the appearance of piety, but denying its power (2 Tim. 3:5). The Apostle, however, speaks to those who desire with wonderful devotion to obey the heavenly precepts, showing and teaching by what shortcut one goes more quickly to God; because he who wishes to remain a virgin for the sake of winning God's favor, knowing what reward he can receive who refrains from what is lawful so as to become better, at the same time spurns all the hindrances of the flesh, not unaware that these are the things which hold back the step of the runner as if with the weights of fetters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
