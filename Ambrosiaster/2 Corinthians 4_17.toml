[[commentary]]
quote='''
For that which at present is momentary and light in our affliction works in us beyond measure, in sublimity, an eternal weight of glory. The tribulations of the present time, which are inflicted for the sake of faith, he calls momentary and light, because they are temporal; yet beyond measure, in sublimity, they work an eternal weight of glory for those who suffer. For a great reward is rendered for small labors, and for light tribulation a sublimity of everlasting glory beyond measure will be weighed out in return.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
