[[commentary]]
quote='''
Finally, my brothers, rejoice in the Lord. To write the same things to you is indeed not irksome to me, but for you it is necessary. He shows the concern which he bears for their progress, because he is unwearied in writing to them the things that are necessary for their benefit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
