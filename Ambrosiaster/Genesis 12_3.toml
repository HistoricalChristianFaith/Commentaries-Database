[[commentary]]
quote='''
But the Scripture, foreseeing that God justifies the Gentiles by faith, foretold to Abraham: That in you all nations shall be blessed (Gen. 12:3). He says this because Abraham is the pattern of all believers, so that those who believe are blessed in him; for by following his faith they become partakers of the same blessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
