[[commentary]]
quote='''
Or do you not know that he who cleaves to a harlot becomes one body? He says this because he who mingles himself with defilement becomes one with the one with whom he mingles himself. For fornication makes both one, so that, as they are one in nature, so they are one in stain as well. They shall be, he says, two in one flesh (Gen. 2:24). It is clear that, because the woman is from the man, both are in one flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
