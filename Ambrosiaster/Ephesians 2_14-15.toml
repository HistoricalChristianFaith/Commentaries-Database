[[commentary]]
quote='''
Without doubt a mediator, that is, an arbiter, is not of one, but of two; for when two peoples were fighting against each other, always at variance and enemies through the diversity of their teaching, the Savior came as their arbiter, cutting off from both peoples that through which they were in discord, so that they might be at peace. He therefore took away from the Gentiles the number of gods and the service of the elements, which was a stumbling block to the Hebrews; he also took away from the Jews the works of the Law, that is, new moons, circumcision, and the observance of the sabbath, and the distinctions of foods, and the other things which the Gentiles abhorred; and so those who had formerly been enemies were made peaceable. If then these things are so, why is it that the Galatians, through dullness of mind, corrupt this arbitration, having turned to Judaism? For they bring the judgment of the Savior to nothing when, after peace has been made, as if repenting of it, they subject themselves to those things which had formerly been hostile to peace. According to the Galatians' understanding, therefore, Christ is not an arbiter; because, having been led into the Law, they have made one people out of two, and of one people certainly no one is the arbiter. He pursues this same sense to the Ephesians, saying: For he is our peace, who made both one, and breaking down the middle wall of partition, the enmity in his flesh, making void the law of commandments in decrees; that he might create the two in himself in one new man, making peace (Eph. 2:14). If he makes peace in one new man, he has certainly taken away from both that through which they were at variance; and by giving his own law he established for them that through which they might be at peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
