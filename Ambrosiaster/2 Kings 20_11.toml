[[commentary]]
quote='''
Surely God made the world, and created the sun and the stars, assigning them courses by which mankind is governed: does he not have the power to command them at times to do something other than what has been decreed for them? For he established them in such a way that they are subject to his will, and only then do they carry out the courses decreed for them, if no other command has been given. Therefore, although no pause is granted to the sun, under Joshua it was ordered to stand still, and it obeyed his command (Joshua 10:12–13), contrary to what had been prescribed for it in the order of the world. Under Hezekiah, however, something greater is read to have been done; for, in order that Hezekiah might not doubt that what had been promised to him was true, he received a sign of such a kind that it was new and unheard of by human ears. For it was not, as before, that the sun was ordered to stand still, but to go back (2 Kings 20:11): seeing this, Hezekiah could be certain that he who had made the ninth hour become the sixth could add fifteen years to his life. And because what was granted to Hezekiah is against the astrologers, for they deny that life can be lengthened, he again receives a sign in this matter which is against the astrologers. For they assert that it is impossible for the stars to do anything other than what has been fixed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 115: CONCERNING FATE"
