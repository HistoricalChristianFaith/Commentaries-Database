[[commentary]]
quote='''
And we trust in the Lord concerning you, that what we have commanded you both do and will do. On this account they deserved that he should trust they would be kept safe by God's protection; therefore he does not doubt that the things he commanded them in the name of the Lord are being done by them and will be done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
