[[commentary]]
quote='''
If someone hangs himself or kills himself with a dagger, he does not sin against his body but against his soul, on which he inflicts violence. But to fornicate is a sin of the body which touches both the body and the soul.
'''
source_url=''
source_title="COMMENTARY ON PAUL'S EPISTLES"

[[commentary]]
quote='''
Since many sins seem to be committed in the body, for anyone who inflicts violence on any part of his body sins, of course, against his own body; for there is one who has mutilated himself, one who has ended his life by a noose, one who has driven a sword into himself, why then does the Apostle say, “Every sin whatsoever a man shall commit is outside the body; but he who fornicates sins against his own body” (1 Cor. 6:18)? — Do you think the Apostle was unskilled, or do you want the force of this saying explained? For when the Apostle says “body,” he does not mean the individual man alone, but he includes the woman as well, because the woman is a portion of the man. For all the above-mentioned crimes that each person violently commits against himself do not stain the whole body; it is the individual alone who sins, and therefore he alone becomes guilty. In fornication, however, the whole body is defiled, because the consent to contamination involves both the man and the woman; therefore fornication is a serious offense. It is a most wicked sin when someone seeks a partner in his crime for their joint destruction. For if a righteous man will receive a reward even on behalf of the one whom he has gained, then likewise an evil man is made guilty not only in himself, but also in the one whom he has wished to have as a sharer in his condemnation. How much more, then, does the fornicator, who is clearly by one offense in a certain way defiling himself twice? For if he sins against the flesh that is from himself, he doubly commits adultery against himself. If anyone thinks he can reshape this question so as to apply this statement either to the Church or to the body of Christ, it will not stand. For it would be said improperly and would resemble Novatian, who, in order to support the cause of his own frenzy, declares that the one who commits fornication does not sin against his own body but against Christ’s, because Christians are the members and body of Christ; so that fornication would be the same as sacrilege, and such a person would be said to sin against Christ just as one who denies Christ. But this is weak and fragile, because from every side it falls into a snare and does not escape. For if the one who fornicates sins against the body of Christ, then other sins would not be committed against Christ, such as if a Christian kills his brother, or sacrifices to idols, or commits some other kind of sin, since every sin is outside the body, except fornication. But if not every sin is outside the body, and whatever sin there is, is committed against Christ, then the one who steals, or who fabricates himself, or who lies, or who strikes his brother, or commits some such act, would be said to sin against Christ or against the Holy Spirit, which is very absurd. And yet the Apostle calls the members of the Church the body of Christ, so that we are members one of another. How, then, does the one who fornicates sin against his own body and not rather against Christ’s, since according to the mystery of the Church we are said not to be our own body, but Christ’s? And this is far from the point at issue, because the one who fornicates sins against his own body for this reason: that the whole Adam is defiled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 50: WHY FORNICATION SINS AGAINST ONE'S OWN BODY"
