[[commentary]]
quote='''
Since many sins seem to be committed in the body, for anyone who inflicts violence on any part of his body sins, of course, against his own body; for there is one who has mutilated himself, one who has ended his life by a noose, one who has driven a sword into himself, why then does the Apostle say, “Every sin whatsoever a man shall commit is outside the body; but he who fornicates sins against his own body” (1 Cor. 6:18)? — Do you think the Apostle was unskilled, or do you want the force of this saying explained? For when the Apostle says “body,” he does not mean the individual man alone, but he includes the woman as well, because the woman is a portion of the man. For all the above-mentioned crimes that each person violently commits against himself do not stain the whole body; it is the individual alone who sins, and therefore he alone becomes guilty. In fornication, however, the whole body is defiled, because the consent to contamination involves both the man and the woman; therefore fornication is a serious offense. It is a most wicked sin when someone seeks a partner in his crime for their joint destruction. For if a righteous man will receive a reward even on behalf of the one whom he has gained, then likewise an evil man is made guilty not only in himself, but also in the one whom he has wished to have as a sharer in his condemnation. How much more, then, does the fornicator, who is clearly by one offense in a certain way defiling himself twice? For if he sins against the flesh that is from himself, he doubly commits adultery against himself. If anyone thinks he can reshape this question so as to apply this statement either to the Church or to the body of Christ, it will not stand. For it would be said improperly and would resemble Novatian, who, in order to support the cause of his own frenzy, declares that the one who commits fornication does not sin against his own body but against Christ’s, because Christians are the members and body of Christ; so that fornication would be the same as sacrilege, and such a person would be said to sin against Christ just as one who denies Christ. But this is weak and fragile, because from every side it falls into a snare and does not escape. For if the one who fornicates sins against the body of Christ, then other sins would not be committed against Christ, such as if a Christian kills his brother, or sacrifices to idols, or commits some other kind of sin, since every sin is outside the body, except fornication. But if not every sin is outside the body, and whatever sin there is, is committed against Christ, then the one who steals, or who fabricates himself, or who lies, or who strikes his brother, or commits some such act, would be said to sin against Christ or against the Holy Spirit, which is very absurd. And yet the Apostle calls the members of the Church the body of Christ, so that we are members one of another. How, then, does the one who fornicates sin against his own body and not rather against Christ’s, since according to the mystery of the Church we are said not to be our own body, but Christ’s? And this is far from the point at issue, because the one who fornicates sins against his own body for this reason: that the whole Adam is defiled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 50: WHY FORNICATION SINS AGAINST ONE'S OWN BODY"

[[commentary]]
quote='''
Flee fornication. Rightly he warns that fornication is to be fled, through which the sons of God become sons of the devil. Every sin whatever that a man commits is outside the body. Because other sins, although they are produced through the body, nevertheless do not make the soul so bound and subject to carnal concupiscence as the practice of lust, acting in the work of carnal fornication, makes the soul to be mingled with the body itself; for the soul is glued to the body to such a degree that at that very moment a man can think of or attend to nothing else; for the very submersion and absorption in lust and carnal concupiscence subjugates the mind itself as a captive. Hence there follows:

But he who commits fornication sins against his own body. He shows that it is a most grave sin, because by it the whole body perishes, whereas in other sins a portion perishes, not the whole. For the whole body is man and woman, because the woman is a portion of the man. For whoever commits another sin sins outside himself; but the fornicator sins against his own flesh. Come now: if a man ends his life with a noose, or butchers himself with the sword, he does not seem to sin against his own body, but against the soul, to which he does violence. But to commit fornication is a bodily offense, which touches both the body and the soul: for the soul does not desire without the craving of the flesh (for the flesh too has its own motion), so as to sin against the flesh; although without the soul it can do nothing. By this, then, that he sins against the flesh which is from himself (for he referred it to its origin), he is said to sin against his own body; so that he may cease from fornication, as though sparing himself. To Novatian, however, he who commits fornication here seems to sin not against his own body but against Christ's; for he declares this otherwise, so as to say that even he who commits fornication sins against the Holy Spirit: on account of the cause for which he was cut off from the Church. This can by no reasoning be maintained; for the body of Christ is not one or two Christians, but all, while each one individually is a member. How then does he who commits fornication sin against the body of Christ, when he does not defile all? But if it were so, as it seems to Novatian, all other sins would be outside God, and fornication alone would be a sin against God. Even he who goes over to the idols does not sin against God, nor he who denies in persecution; because every sin whatever that a man commits is outside the body of Christ, as it seems to him. But if he chooses to declare this too otherwise, so as to deny that any sin is outside the body of Christ, he will be forced to say that everyone, whatever sin he has committed, sins against God and against the Holy Spirit; so that the thief, the perjurer and the liar would be said to sin against the Holy Spirit. And how does that stand which the Lord says: That all sins and blasphemy will be forgiven to men: but he who sins against the Holy Spirit, it will not be forgiven him, neither here nor in the future (Matt. 12:31)? It is clear, surely, that, apart from the other sins, there is another sin, which is called the sin against the Holy Spirit. Again, to some it seems that he who commits fornication is said to sin against his own body for this reason, that he is a member of the Church, and, defiling himself, sins against the Church, of which he is a member. Then it would have to be said of him who is a member of the Church, when he commits fornication, that he sins not against himself, but against the Church. But in fact the Apostle says that he who commits fornication, by the fact that he offends against his own portion, sins against his own body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
