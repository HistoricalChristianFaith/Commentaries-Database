[[commentary]]
quote='''
For if I preach the gospel, there is no glorying for me; for necessity lies upon me. As the Lord says: When you have done what I tell you, say: We are unprofitable servants: we have done what we ought to do (Luke 17:10). For woe will be to me, he says, if I do not preach the Gospel. For a servant sent by his master does, even against his will, what he has been commanded: if not, he must be held to it with blows. Thus Moses was sent against his will to Pharaoh (Exod. 4:14); and Jonah was compelled to preach to the Ninevites (Jon. 1:3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
