[[commentary]]
quote='''
Therefore I write these things while absent, so that when present I may not act more harshly. It is plain that he admonishes them while absent for this reason, that he may find them more amended, and not, when placed there, rebuke them with shame, so that he who sins should blush in the assembly of the brothers. According to the power which the Lord gave me for building up, and not for destruction. This is the power which above he wishes to lie idle while they act well; if otherwise, he wishes to exercise himself in it, so that sinners, being rebuked, may be built up, not put to death. For those who are reproved in order to be corrected are not destroyed, but built up for life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
