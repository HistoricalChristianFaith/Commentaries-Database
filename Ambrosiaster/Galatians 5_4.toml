[[commentary]]
quote='''
You have been emptied out from Christ. Those whom Christ profits nothing have been emptied out from Christ; for they were full of his grace, and when it withdrew, they were emptied. For he speaks to those who, after receiving the gift of the grace of God, preferred to be circumcised. For you who glory in the Law have fallen from grace. The righteousness of the Law consists in keeping the things that were given. And so he who wishes to be justified in these after faith loses grace; for the gift of God came for this purpose, that, the burdens of the Law ceasing, it might justify believers before God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
