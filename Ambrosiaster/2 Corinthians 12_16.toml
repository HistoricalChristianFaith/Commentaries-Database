[[commentary]]
quote='''
But be it so: I did not burden you; but being crafty I took you by guile. He does not keep silent about anything that could be put forward from the other side, so as to clear himself in every respect; for he did nothing with them by overreaching, but in simplicity, providing for himself once, for them in a twofold way: both to provide for them before God and not to seek their means here, while for himself what is promised by God for the future was enough. For perhaps they might suspect that he had spurned what was offered because it was small, so that he might obtain greater things: that, considering his merits, he was not refusing money, but despising the amount, judging it unworthy of himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
