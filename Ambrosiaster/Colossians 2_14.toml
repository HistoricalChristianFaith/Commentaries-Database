[[commentary]]
quote='''
How, then, did he forgive us all offences? Having blotted out, he says, the handwriting which was adverse to us. And what it is to blot out, he added, saying: And he took it out of the way. So, then, he blotted it out when he took it out of the way. And he took it out of the way thus, when he fixed it, he says, to the cross. And to fix it to the cross, he said, is to despoil the principalities and powers publicly, and to triumph over them in Christ. These things, as they appear, are obscure, and therefore they must be made clear with care applied. This is the protection of God, which the Apostle sets forth by signifying various causes. For he recounts many things done whereby the human race might come to pardon; so that he not only forgave us our own offences, but also took away that sin which was from the transgression of Adam (which he called the handwriting in decrees), which did not allow us to rise from the dead; because if he had not taken this too out of the way, those who had received remission would, on departing hence, be held there in the underworld. Moreover, all offences were forgiven for this reason, that they might rise from the dead. For because death is from sin, when sin is taken away the resurrection of the dead comes about: which indeed could not have happened, unless he had fixed sin to the cross. For while the Savior, by not sinning, conquers sin, which held man liable, and moreover, though innocent, is killed by it: thus he crucified sin. For sin conquered is said to be put to death, for the cross is the death not of the Savior but of sin. For an innocent man who is killed in this way makes guilty those by whom he is killed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"

[[commentary]]
quote='''
But the decree of which he speaks is not that which the pagans call fate; because they do not assert that that is contrary to all; for they say that some are happy from it, others unhappy. For he says that this decree was contrary to all; for it was a sentence adverse to all men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
