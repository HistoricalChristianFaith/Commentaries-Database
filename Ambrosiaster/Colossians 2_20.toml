[[commentary]]
quote='''
If then you have died with Christ from the elements of this world, why do you still, as though living in this world, make decrees? Everyone who is baptized in Christ dies to the world; for he renounces all the errors of superstitions, so as to worship the faith of Christ alone. For when the things that are added to natural righteousness have been removed, there remains the discipline given by God, through which one lives to God through the hope which is in Christ: but he dies to those to whom he had been subject through error, when he denies those whom he had presumed to be gods. And so it comes about that, through the enmity of renunciation, man and the worship of the elements are said to be dead to each other. For in saying "world" he signifies the error of the flesh; for everything that is seen is assigned to the flesh. Hence it is that John the apostle too says: Do not, he says, love the world, nor the things that are in the world (1 John 2:15); that is, let us love neither the elements, of which the world is compacted, nor the errors which human tradition has invented: but Christ alone, who died for us; so as to join us to his body from among the lost. Those, therefore, who are buried together with Christ are dead to the elements, so as to care nothing for any of these; for they have learned that the things above are to be held, which can give perpetual life. For these things do not even give the present life, and they hinder the things to come from being laid hold of. But he who after baptism is in doubt about some things, thinking that certain of the old things are to be venerated, shows that he lives to the elements, which he decrees are to be worshipped, or doubts are to be despised; such a one will remain within the circles of the world, a stranger to God; because, clothed with the old man, he will not be able to pass beyond carnal things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
