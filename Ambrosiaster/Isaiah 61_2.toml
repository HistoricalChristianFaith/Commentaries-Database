[[commentary]]
quote='''
WHY HAVE THE DEEDS AND SAYINGS OF THE LORD BEEN ARRANGED IN WRITING IN FOUR BOOKS BY FOUR AUTHORS? — It was fitting that the acceptable year of the Lord, as the prophet says (Isa. 61:2), should be contained in four books as if in four seasons. For just as the year unfolds in four seasons, in such a way that they need one another, so too the deeds and sayings of the Lord have been set forth in four books, in such a way that each one needs the others; yet together they form perfect fullness. And as to why they were ordered by four writers, this was the reason: because the names of the seasons are different, so also the titles of the Gospels should be different. And if anything in their wording seems contrary, yet in meaning they do not differ, thanks to an interpretation suitably adapted to the matter: just as the seasons, although they clearly differ in name, in climate, and in the course of the stars, yet do not differ in the effects of the things they bring forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 1: ON WHY THERE ARE FOUR GOSPELS"
