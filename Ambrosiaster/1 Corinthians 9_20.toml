[[commentary]]
quote='''
And to the Jews I became as a Jew, that I might gain the Jews. He seems, as it were, to have dissembled, in order to become all things to all, as flatterers are accustomed to do; but it is not so. For a man of God and a spiritual physician, knowing the causes and wounds of all, cherishes them with great diligence and suffers with them; for we have certain things in common with all men. So he became to the Jews as a Jew, because on account of the stumbling block to them he circumcised Timothy (Acts 16:3), and, having been purified, went up into the temple, lest they take occasion through him to blaspheme (Acts 21:26). So he did a thing which ought already to have ceased, but he did it according to the Law. For he both agreed with them that the Law and the prophets are from God, and from them showed that this is the Christ who was promised, so that his assent might have its effect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"

[[commentary]]
quote='''
To those who are under the Law, as if I were under the Law (though I myself am not under the Law), that I might gain those who are under the Law. Those who are under the Law are known to be the Samaritans; for they accept the Law alone, that is, the five books of Moses. They are of the stock of the Persians and Assyrians, whom the king of the Assyrians, when the children of Israel had been carried off into captivity, settled to inhabit the regions of Samaria (2 Kings 17:6); therefore they also worship fire after the manner of the Persians. To these, then, the Apostle, while he did not deny that the Law is from God, became as if under the Law: but from it, with a gentle word, he handed on to them how Christ was to be understood, just as that Samaritan woman too, who said to the Lord: I know that the Messiah comes (John 4:25), having been taught through the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
