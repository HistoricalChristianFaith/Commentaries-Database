[[commentary]]
quote='''
For behold, this very thing, being grieved according to God, how great an earnestness it produces in you. It is true that he who repents is earnest not to sin again. But excuse. Rightly, because repentance has no excuse, but confession. But fear. He shows fear in the sinner who, because of his offense, asks for pardon. But longing. He who knows that he has been made deformed through sin longs to be reformed. But zeal. He who understands that his being rebuked is for his own good begins to feel zeal for accomplishing good works. But vindication. It is necessary that one vindicate him whose affection toward himself he feels; and he takes vengeance on himself who afflicts himself because of his offense. In all things you have shown yourselves to be pure in this matter. Since they are seen to have meditated on all things that pertain to progress toward a better hope, having zeal for the Apostle, their teacher, in all the duties of human conduct, with faith as their guide, they strive to be seen as upright.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
