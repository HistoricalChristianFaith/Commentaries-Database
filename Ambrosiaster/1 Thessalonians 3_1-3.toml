[[commentary]]
quote='''
Therefore, no longer bearing it, we thought it best to be left alone at Athens: and we sent Timothy, our brother and sharer in the work of God in the Gospel of Christ, to this end, that he might both strengthen you and pray for your faith, that no one be moved in these afflictions. For you yourselves know that we are appointed to this; for even when we were with you, we foretold to you that we would suffer affliction, as has come to pass, and you know. He has set out the causes of the longing mentioned above. For this is why they wished to be present with them: to strengthen their minds; lest any of them should suffer scandal at the afflictions of the apostles, that men who worked such great signs should at times be made weak, so humbled as to be subjected to beatings and chains. To account for this matter he testifies that Timothy was sent, a fit teacher, to show that merits grow for Christians from this, if, having suffered for the name of the Lord, they give thanks to him from whom they expect the wage of this thing, and that at the same time they should pour out prayers to God, so that they might be steadfast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
