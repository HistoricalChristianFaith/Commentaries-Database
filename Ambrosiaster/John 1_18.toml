[[commentary]]
quote='''
JACOB IS CALLED “THE MAN WHO SEES GOD,” AND MOSES SAW GOD FACE TO FACE; LIKEWISE ISAIAH SAYS, “I HAVE SEEN THE LORD OF HOSTS WITH MY EYES.” BUT ON THE OTHER HAND JOHN THE EVANGELIST SAYS, “NO ONE HAS EVER SEEN GOD” (Gen. 32:28; Exod. 33:11; Isa. 6:5; 1 John 4:12); THIS, AS FAR AS IT APPEARS, IS CONTRADICTORY. — As far as true faith is concerned, absolutely no one has ever seen God, neither the Father nor the Son. For what is called “seeing” refers to understanding; for sight is as in an image. Just as when we do not know emperors personally, we see them in likeness, not in reality; so too God was seen so that it might be understood that the one who appeared was God, by reason, not by substance; because in His own nature God cannot be seen. And to reveal more truly the hidden things of the question set before us, let us strive to explain the Evangelist’s meaning. For John wished to disclose something hidden, which he knew apply to saving teaching: therefore he says, “No one has ever seen God, except the only‑begotten Son who is in the bosom of the Father, He has made Him known.” Let us observe the Evangelist’s meaning: in order to show that it is true that no one has ever seen God, he teaches that the Son has revealed this; and it is utterly impossible for Him to be mistaken, because He is in the bosom of the Father. But what is the bosom of the Father, if not the affection of the true Father in love, through the unity of nature in the Son? Wherefore no one has seen God except the only Son: this John the Apostle heard the Son of God saying among other things, “Not that anyone has seen the Father, except Him who is from God; He has seen the Father.” (Jn. 6:46) Therefore, in order to advance the condemnation of the Jews, who were unwilling to hear or believe that Christ is the Son of God, the Evangelist shows that this is the Christ who had appeared to the Fathers as God; but that the One who is the Father is never seen except by the Son. For when He denies that God the Father has been seen, and yet confesses that God appeared to the Fathers, He wishes to make it clear that He, the Son of God, is the One who has always been seen by the Fathers as God. Therefore, among other things, He says to the Jews about the Father, “You have never at any time heard His voice, nor seen His form” (John 5:37). Behold, it is not contradictory that God is both seen and unseen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 71: ON WHETHER GOD CAN BE SEEN"

[[commentary]]
quote='''
THE GOSPEL BEARS WITNESS THAT NO ONE HAS SEEN GOD (John 1:18; 6:46; and 1 Tim. 6:16); YET JACOB AND MOSES AND ISAIAH ASSERT THAT THEY HAVE SEEN GOD (Gen. 32:30 and Isa. 6:1). BUT SOMEONE SAYS, “NO ONE HAS SEEN THE FATHER.” WHAT OF IT? IF THE SON HAS BEEN SEEN, THEN THE FATHER HAS BEEN SEEN AS WELL, SINCE THE FATHER AND THE SON ARE ONE AND THE SAME GOD, BOTH IN SUBSTANCE AND IN IMAGE, BECAUSE OF TWO THERE IS ONE IMAGE; AND, AS HE HIMSELF SAYS, “HE WHO SEES ME, SEES THE FATHER ALSO” (John 14:9). HOW THEN HAS NO ONE SEEN GOD THE FATHER, WHEN THE SON SAYS THAT THE FATHER IS SEEN WHEN HE HIMSELF IS SEEN? BECAUSE HE IS NOT A DIFFERENT GOD. IF THEREFORE HE IS NOT ANOTHER, THEN HE, BEING ONE AND THE SAME, IS THE GOD WHO HAS BEEN SEEN. — As far as the Evangelist is concerned, he said this about God the Father, that no one has seen God, except the only-begotten Son who is in the bosom of the Father, He has declared Him. Let us believe the Son; for He has declared that no one, except Himself, has seen God. But He said this in order to teach that He Himself had always appeared to the Patriarchs and the Prophets. Therefore this does not refer to God in His unity, but to the person of the Father, of whom nothing else can be said than “God the Father.” The Son, however, says that He has been seen in such a way that He remains invisible even at the very moment when He is thought to be seen. For “seen” here is to be understood as “understood”; since He was certainly not seen with the eyes, but comprehended by the mind, and this was what it meant “to have seen”: to have understood that in what appeared there God was present. But when the Savior says, “He who sees me, sees the Father also,” He surely did not refer this to the sight of the eyes, but to that of the mind, and in order that nothing might be thought different between the Father and the Son. Neither of them, therefore, has been seen according to substance. Yet, in outward appearances, the Son alone has been seen by the mind, not by bodily eyes, because He is invisible just as the Father is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 2: THE GOSPEL BEARS WITNESS THAT NO ONE HAS SEEN GOD"
