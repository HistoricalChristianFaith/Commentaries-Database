[[commentary]]
quote='''
But he who perfects us for this very thing is God, who also gave us the Spirit as a pledge. This which we ask with groaning, that is, that we may be found worthy not to be unclothed but to be clothed over, according to the sense stated above, he says God brings to perfection on the day of judgment, because he has promised and he is faithful, giving the Spirit as a pledge of the fulfillment of this thing; for he is the seal of our adoption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
