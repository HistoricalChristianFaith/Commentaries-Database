[[commentary]]
quote='''
The greeting itself is mine, by the hand of Paul, which is the sign in every letter: so I write. Because of interpolators and corrupters of the Scriptures, he testifies that he always subscribes the greeting with his own hand in every letter of his, so that a letter which was not subscribed by his hand could not be credited under his name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
