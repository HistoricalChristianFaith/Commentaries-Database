[[commentary]]
quote='''
Do you not know that we shall judge angels? He added something more by saying: we shall judge angels, that is, spiritual powers, which he teaches in another place dwell in the heavenly places; meaning that the angels are to be judged by us in the same way as the world also will be judged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
