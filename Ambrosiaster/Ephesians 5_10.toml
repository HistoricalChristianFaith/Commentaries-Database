[[commentary]]
quote='''
Prove what it is that pleases God. From the magnificence of holiness and goodness it can be weighed in what works God delights; for he himself said: Be holy, as I also am holy, the Lord your God (Lev. 19:2). And the Lord: Be, he says, merciful, as also your Father (Luke 6:36). These things please God; for in holiness there is purification, and in mercy full and perfect righteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
