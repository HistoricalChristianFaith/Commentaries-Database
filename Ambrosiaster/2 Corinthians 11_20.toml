[[commentary]]
quote='''
For you bear it if someone brings you into slavery. This is true; because they were being brought into slavery, not through prudence but through foolishness, so as to serve the false apostles. If someone devours. Nor is this false, because they were content that their goods should be devoured by the false teachers. If someone takes. To take is to catch someone by guile; and so he means that these were caught by deceitful teachers, and bore what was not expedient. If someone is lifted up. Being lifted up is pride. He touches, then, those who were proud, wrongly censuring the Apostle; and to these they were not displeasing. If someone strikes you in the face. He is struck in the face upon whose face an insult is inflicted. Now he means those who, because they were of the race of Abraham, disparaged them for being uncircumcised, preferring themselves and humbling them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
