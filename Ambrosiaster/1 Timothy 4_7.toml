[[commentary]]
quote='''
But refuse profane and old wives' fables, exercising yourself unto godliness. For bodily exercise is useful for a little, but godliness is useful for all things, having the promise of the present life and of the future. Profane words are understood to be adverse ones; and old wives' fables are certain ravings. These things are wont to be drawn into contention by the voices of certain clamorous men, so that a sort of treatise is held on an empty matter, whose effect is nothing but vanity. He warns, therefore, that one must turn aside from the things that are contrary, and in like manner also from those that are old-womanish, put together out of a certain vanity; for there are some who in the heat of their mind throw themselves into disputations of this kind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
