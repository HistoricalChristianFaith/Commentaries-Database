[[commentary]]
quote='''
Then they can also pray for the saints; for it is not unworthy that the members should be solicitous for one another; nor could it seem rash if fit disciples intercede for their teacher, helping him, so that, setting hindrances aside, he may use freedom to preach, as it was handed down by the Author; lest, pressed by the force of tribulations, he should through very fear blunt the edge of his teaching, its severity lost. He exhorts, then, that prayer be made for him in two ways: that his understanding be filled with the spirit to utter the mystery fully, and that the capacity of boldness in asserting it be given him; and God certainly hears this prayer gladly, for he sees his embassy despised in his Apostle; hence, indignant in his own cause, he will surely not deny its effect. For if it is the custom and the law not to inflict destruction on the ambassadors of men, with what presumption and audacity is not only destruction but even death inflicted on the ambassadors of God! Wherefore he also says: For which I discharge an embassy in a chain. For he was not permitted to speak freely, but, delivering the words of God in subjection and under constraint, he was subjected to bonds, to blows, and to deaths: for he was both stoned and fought with beasts at Ephesus (1 Cor. 15:32).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
