[[commentary]]
quote='''
For our exhortation is not from deceit, nor from uncleanness, nor in guile, but as we have been approved by God, that the Gospel might be entrusted to us, so we speak, not as pleasing men, but God, who tests our hearts. He says this on account of the false apostles, who preached in guile and deceit without being sent, so as to circumvent the Gentiles into serving the law of deeds. But he proves by many things that he preaches as one chosen and sent; because he was both found the stronger in afflictions and irreprehensible in his way of life, so that there was nothing in him that might seem less worthy of God, signs following besides. For some preached Christ for the sake of gain, serving the favor of men; because they were both rather slack in rebuking, since indeed they had no authority, and weak in tribulation; because their speech was not from the heart, but in deceit. For everyone who does anything without hope succumbs when tribulation arises.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
