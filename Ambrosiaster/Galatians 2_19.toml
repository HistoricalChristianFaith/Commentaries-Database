[[commentary]]
quote='''
For I through the Law have died to the Law, that I may live to God. He says this because through the law of faith he died to the law of Moses; for he dies to the law who is set free from it; and he lives to God, whose servant he becomes, bought by Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
