[[commentary]]
quote='''
But if it is worthy that I also go, they will go with me. He says this: if the collection is plentiful, he too can go; for it is worthy, and so it is needful, that if he himself goes, he should carry much with him for the relief of the saints. This is what he signifies when he says to the Romans: For if the Gentiles have shared in their spiritual things, these ought to minister to them in carnal things (Rom. 15:27); for they were of the Jews, of whom the Lord says that salvation is from the Jews, and at Jerusalem they were in great ill will among the Jews who did not believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
