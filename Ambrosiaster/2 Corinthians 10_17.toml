[[commentary]]
quote='''
But he who boasts, let him boast in the Lord. By saying this he signified that this very assurance and glory must be given to the Lord, whose grace it is; so that he who is confident in the power of the Gospel may be confident with God as its author; so that all the gain of the divine business may accrue as profit to the Lord. But he who does not receive power from God cannot boast in the Lord, because he seeks his own glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
