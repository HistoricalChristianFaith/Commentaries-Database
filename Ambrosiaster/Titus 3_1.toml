[[commentary]]
quote='''
Admonish them to be subject to principalities and powers, to obey what is said, to be ready for every good work. He admonishes them what the salvation of believers is, to make it plain, when they are rebuked, so that they may know for what good they are being fitted: that they may not take it harshly, being sure that they are corrected for their own salvation; and that they may be slow to evil but ready for good, not ignorant of what ought to be rendered to each.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
