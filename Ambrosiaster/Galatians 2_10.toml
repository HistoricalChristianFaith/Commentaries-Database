[[commentary]]
quote='''
This alone, however, he says they agreed among themselves: that, in what they had not been instructed by a precept or gift of the Lord, because it was easy to learn this from the Law, they should command those to whom they preached to be mindful of the poor, so that they might cultivate the mercy through which they were redeemed by God. For this reason, therefore, he makes known these things which took place between himself and the apostles, so that the Galatians may know that what they had received from him is true and approved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
