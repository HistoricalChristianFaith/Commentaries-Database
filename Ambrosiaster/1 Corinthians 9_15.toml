[[commentary]]
quote='''
But I have used none of these things. This after he has shown in many ways that it is lawful to receive, yet that he himself has no need of it; for it is harmful to receive from those who sin, as I mentioned above. But I have not written these things so that it may be done so in my case; for it is better for me rather to die. No one shall make my glory void. He says that his glory lies in this, if the severity of the Gospel remains: and he chose rather to die than to violate the rights of the Gospel, knowing that this profits him more toward future salvation. For he refused that the service due to him should be rendered to him by these men, lest through this they gain confidence in sinning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
