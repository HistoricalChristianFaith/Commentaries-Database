[[commentary]]
quote='''
For we must all be made manifest before the judgment seat of Christ, so that each one may receive the things proper to the body, according as he has done, whether good or evil. Therefore if, when Christ judges, each of us will receive the deeds of the body, he will certainly not be adjudged to good or to evil without the body. And he did not say "the deeds of the flesh," because the vices of the flesh are always to be punished, but "the deeds of the body"; it acts spiritually, sometimes carnally.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
