[[commentary]]
quote='''
We are bold, therefore, and consent rather to be abroad from the body and to be present with God. Rightly he says, we are bold; for, having confidence in the promise of God and knowing that it is much better to be there than in the world, they consent to and desire departing from the body, so that they may rest under the altar of God until the day of resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
