[[commentary]]
quote='''
And command these things, that they may be irreproachable. He wishes the widow to have such diligence in her acts and conduct that she cannot be reproached; for, removed from the hope of a worldly way of life and from the duty of caring for a body, she has betaken herself to God for this reason, that she may lead an approved life. For when the occasions that usually open the way to sins are taken away, a good way of life can remain unharmed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
