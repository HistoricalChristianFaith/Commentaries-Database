[[commentary]]
quote='''
If according to man I fought with beasts at Ephesus, what does it profit me, if the dead do not rise? That is, if according to human sense (which, seeing that it does not fall within the nature of things that flesh once dissolved should be re-formed to life, by no means believes in the future resurrection of the dead) I did not fear to be thrown to beasts and to die, I have gained nothing. But this is not so, since, certain of the promised life, he not only did not fear, but even willingly allowed himself to be thrown to beasts, as among other things he says in the Acts of the Apostles: For I am ready not only to be bound, but also to die in Jerusalem for the name of the Lord Jesus Christ (Acts 21:13).

Let us eat and drink, for tomorrow we shall die. This was said by Isaiah the prophet on account of those who, as if there were to be nothing after death, cared only for the belly, like cattle (Isa. 22:13), as did those also who were corrupting the Corinthians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
