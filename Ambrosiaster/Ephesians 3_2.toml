[[commentary]]
quote='''
If indeed you have heard of the dispensation of the grace of God which was given to us toward you. He wants them to know that by the judgment of God he was sent by Christ to preach to the Gentiles the mystery of the grace of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
