[[commentary]]
quote='''
Grace to you and peace from God our Father, and the Lord Jesus Christ. He shows that the human race has been lifted up by the kindness of both, of the Father as much as of the Son. Nor does he signify that the Son is less when he calls him our Lord, nor the Father greater because he calls him our God; for the Father will not be true God unless he is also Lord, nor the Son true Lord unless he is also God. If then the grace of the Father and of the Son toward us is one, why is it, he says, that, thinking less of the Son, you make the Law equal to him, so as to serve partly Christ, partly the Law, when you have read the Lord saying: For the Son of man is Lord even of the sabbath (Luke 6:5)? so that by this they may see how great an insult is inflicted on the Lord by them, when they compare the Lord with a handmaid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
