[[commentary]]
quote='''
For each one will carry his own load. At the last he wished to make this known to the proud: that no one is defiled by another's sin, provided he dissents from it, so that no one should be afraid to join himself to a sinner, or to receive one who approaches him, in order to win him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
