[[commentary]]
quote='''
But God did not think well of most of them. He said this because they did not understand the benefit they had received. For they were laid low in the desert (Num. 26:65). It is fitting that one who, having obtained great things, is distrustful in small ones, should not only not obtain these, but should also lose those. Since, then, he exhorted them above to better things, he says that he himself also labors at this, that he may come worthy to the promise; now, in order to bind them to this and persuade them by the terror of an example, he says that the Jews at that time in like manner received the gift and grace of God as their lot, just as we too have: and because they were careless and doubtful about God's promise, they were laid low in the desert; so that he might show that he afflicts himself for this reason, lest he be found in their number: and accordingly they must labor to become his imitators.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
