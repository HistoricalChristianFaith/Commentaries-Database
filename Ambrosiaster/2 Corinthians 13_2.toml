[[commentary]]
quote='''
For I have foretold and I foretell, as when present on my second visit, and being absent I now write to those who sinned before and to all the rest, that if I come again, I will not spare. He indicates that he said earlier, when present, that they should correct themselves, lest they be rebuked with shame; and now he declares that, being absent, he says the same things again, so that after the second rebuke, if they have not amended themselves, there ought to be no sparing them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
