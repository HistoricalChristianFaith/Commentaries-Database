[[commentary]]
quote='''
Be zealous for the better gifts. This he soon resolves in what follows. And still I show you a more excellent way. Step by step he advances them to more useful things, showing them that the grace of every gift mentioned above which is seen in men, whether of speaking, or of healing, or of prophesying, does not pertain to the merit of man, but to the honor of God. And therefore he now says that he is showing them a plainer way, by which one goes to heaven, a way which places merit with God. For because the things mentioned above do not always pertain to merit, the Savior says: Many will say to me on that day, that is, the day of judgment: Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many works of power (Matt. 7:22)? And because this does not pertain to merit, but these are offices of the Church, for the confounding of the Gentiles and for bearing witness to the honor of God, the Lord says to them: Depart from me: I do not know you, workers of iniquity (ibid., 23). For, secure because the working of God was seen in them, they were negligent about themselves; for to the seventy-two disciples too, when they rejoiced because the demons had been subject to them, the Savior says: Do not rejoice in this, that the demons are subject to you; but rejoice in this, that your names are written in heaven (Luke 10:20). Why, unless because they were subject to the name of God, not to the merit of man? And why does it not happen so now, that men have the grace of God? At the beginning it had to happen, so that the foundations of the faith might receive firmness: but now there is no need, because people bring people to the faith, when their good works and simple preaching are seen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
