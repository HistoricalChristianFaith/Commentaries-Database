[[commentary]]
quote='''
But I pray God that you do nothing evil: not that we may appear approved, but that you may do what is good, and that we may be as reprobates. With that affection with which he always prays for them, that they may refrain from evils. Not that we, he says, may appear approved, that is, not that we may be seen to be in authority while you sin. But that you may do what is good, and that we may be as reprobates. What is this? Does the Apostle pray to be a reprobate? Certainly not; but he prays for this: that, these acting well, since the apostles would not dare to rebuke them, they may be as it were humbled, and, humbled, may appear even as reprobates. For they are seen to be approved by God when they judge sinners by the authority granted them. If, then, there are none for them to judge, since their authority lies idle in these, they are seen as reprobates, as it were.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
