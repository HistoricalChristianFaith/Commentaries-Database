[[commentary]]
quote='''
But if you bite one another and accuse, see that you are not consumed by one another. It is clear that dissension among brothers is the enemy of love; therefore he warns them to be peaceable, advancing in the good. For contentions breed quarreling, whose fruit is the consuming of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
