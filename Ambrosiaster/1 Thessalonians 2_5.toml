[[commentary]]
quote='''
For neither at any time have we conducted ourselves in a word of flattery, as you know, nor for an occasion of avarice. God is witness. Now he opens up what he signified above, when he says: Not on an occasion of avarice, giving God as witness that he did this from the heart, not in hypocrisy, as if despising small things so that perhaps more might be offered. Hence he also appeals to them themselves, as those who knew and could prove that he had flattered no one; for the false apostles wished a pattern of avarice to be given them, so that by that very occasion, while they saw the true apostles accepting everything that was brought, they themselves might plunder simpler men without incurring odium.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
