[[commentary]]
quote='''
And you, when you were dead in your offenses and sins, in which you once walked according to the age of this world. He calls them dead because they follow the errors of the world; for whatever withdraws from the profession of the one God is held to be dead, because it does not remain in the root from which it draws its origin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
