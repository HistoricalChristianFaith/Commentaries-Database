[[commentary]]
quote='''
For God has not called us to uncleanness, but to holiness. Wherefore he who despises these things despises not man, but God, who has given the Holy Spirit in us. To bind them more strongly to what he teaches, he interposes the person of God, saying: Not man does he despise who passes over the precepts, but God. And he says that God has given us the Holy Spirit for this reason, that we may live holily; because the Holy Spirit does not dwell in a body subject to sins (Wis. 1:4).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
