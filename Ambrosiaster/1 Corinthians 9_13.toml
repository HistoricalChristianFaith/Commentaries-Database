[[commentary]]
quote='''
Do you not know that those who work in the sanctuaries live from the sanctuary, and those who serve the altar partake of the altar? By "in the sanctuaries" he signifies the law of the Gentiles, but by "the altar" that of the Jews. For thus the Lord decreed through Moses (Deut. 18:3), that the priests should take a part of the things that were offered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
