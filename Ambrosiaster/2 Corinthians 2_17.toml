[[commentary]]
quote='''
And for these things who is fit? For we are not like most, adulterating the word of God: but out of sincerity, as from God, before God, in Christ we speak, This verse touches the false apostles, who with corrupted teaching adulterated the words of God through evil interpretation, and, taking away the divine sense, put a human one in its place. Some of them, having zeal for the Jewish tradition, did not teach rightly about Christ either; therefore he calls them less fit: but the apostles, he says, preached sincerely, as it was given from God, before God; that is, they spoke in Christ as God gave it, with him as witness, seeking not their own glory but God's. This is to speak in Christ: to preach his honor and power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
