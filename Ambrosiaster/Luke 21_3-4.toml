[[commentary]]
quote='''
For although what a man of slender means gives is small, yet it abounds, because it is done with right judgment, and it is asked not only how much, but also out of how much, and with what mind it is given. Indeed, that widow in the Gospel (Luke 21:3) was praised for a little, and those who were casting in much were not praised. For her little is much, because she cast in more than she could; but the rich cast in less, though they could do more; and therefore the small amount of her who cast in beyond her strength was found to be more than the much of the rich, because they cast in out of what they had in abundance. He, then, who gives as much as he can does rightly: yet he has that widow ahead of him, because she cast in all that she had.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
