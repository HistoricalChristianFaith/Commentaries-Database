[[commentary]]
quote='''
But now there are indeed many members, but one body. He says this because the many members, since they need one another, do not disagree in the unity of nature, although they are diverse; because this diversity runs together into one, so that the usefulness of the body may be fulfilled, just as the things too of which the world itself consists, though they are diverse not only in their offices but also in their natures, nevertheless contribute to the perfection of the one world; and from all these arises a certain temperate blending in the fruits, which contribute to human usefulness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
