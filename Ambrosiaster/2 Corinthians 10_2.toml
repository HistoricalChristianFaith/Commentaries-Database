[[commentary]]
quote='''
But I ask that, when present, I may not be bold with that confidence with which I am thought to be bold against some who think that we walk according to the flesh. It is the same sense, which he repeats in order to make it clear; for he prays that he may find them such that he is not compelled to be angry, but may rest with them. Here, then, he has disclosed what he signified above, and he shows it still more fully in what follows: that this assurance, which here he called confidence, is that of the power given to him by Christ, whose vicar he is, to punish those who, acting under the name of Christ, do not obey so as to correct the things for which they are reproved. He means those who, not receiving the spiritual things that were said by the Apostle, thought of him as though he were speaking carnal things that were not to be received. Therefore he says: Who think that we walk according to the flesh; because he who spurns spiritual things thinks them carnal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
