[[commentary]]
quote='''
But in a great house there are not only vessels of gold and silver, but also of wood and of earthenware: and some indeed for honour, but some for dishonour. By this saying he indicated that there are different men in the Church: some good and eminent men, whom he wants to be understood by the gold; some only good, whom he designates by the silver; but others not good, whom he calls vessels of wood and earthenware. I think this is doubtful to no one; for in the church of the Corinthians the frequent speech of the Apostle as he rebukes them proves it. And now in our own Church it is plain, and in the temple at Jerusalem, in which there was a type of the Church, it is proved by clear readings. For there were the Sadducees there, from whose root were Hymenaeus and Philetus: when the Apostle had spoken of their perverse opinion, he at once added this, that it is not to be wondered at that men who dissent are seen in the Church. For in the church of the Corinthians too, of which I have spoken, there were some who, dissenting, denied the resurrection. Yet the mad Novatian, in order to flatter his own error, teaches that this is to be understood otherwise, so that the great house is believed to signify the whole world, which holds a diversity of men; whereas it is clear that the Apostle used the example of the house of a rich and wealthy man, which, although it is well supplied, nevertheless has vessels of wood and earthenware: in this way the Church too, although it is called holy, nevertheless has both the vicious and those who hold perverse opinions, as I mentioned above. These he shows to be worthy of dishonour, yet not to perish, but to be purged through fire; because they are in some respect necessary to the house. But Novatian, puffed up with pride, in order to defend the truth and general holiness of his own church, decreed that it is to be understood in this way, as though the Church were in his keeping and had all its members purified, on account of those causes for which he accuses us, who are innocent. But what need was there in this place to say anything about the world, or why should he affirm that the great house signifies the world? For the Lord says to the apostles: You are not of the world, but I have chosen you out of the world (John 15:19). How, then, are those to be enclosed within the world who are denied to be of the world? And the same Apostle says: What is it to me, he says, to judge those who are outside? (1 Cor. 5:12). For in one house all are under one name; for all are reckoned by the one name of their Lord: but the world contains men of different professions; so much so that they profess to have different gods and lords. He does not, then, call the world the great house, but the Church, in which all are under the name of one Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Timothy.html'
source_title="Commentary on 2 Timothy"
