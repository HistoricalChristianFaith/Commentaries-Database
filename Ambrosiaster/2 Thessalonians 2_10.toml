[[commentary]]
quote='''
And in all the deceit of iniquity, for those who are perishing, because they did not receive the love of the truth, that they might be saved. He says that the deceit of the iniquity of his prodigies prevails with those who are going to perish; for because they spurned the love of the truth, through which they could have been saved when the apostles preached, they have been handed over to the devil; for being unwilling to be saved, they are deserted by God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
