[[commentary]]
quote='''
So I run, not as into uncertainty. He professes that he runs with great hope, holding as certain what has been promised. So I fight, not as one beating the air. That is, I contend not with words so much as about realities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
