[[commentary]]
quote='''
But I say to the unmarried and to widows: it is good for them if they remain so, even as I. He would not say: it is good for the unmarried that they be even as I, unless he were intact in body. Nor would he say: I wished all men to be as myself; for if he had had a wife and said this, he did not want them to be virgins. But far be it; for from boyhood he served in such a way that he had no interest in this thing, seeing that as a youth he was forestalled by the grace of God. After he said that each has his own gift from God, he shows in which matter it is better to be more inclined; because a person is helped in that which he is seen to seek with eagerness of mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
