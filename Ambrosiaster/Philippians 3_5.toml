[[commentary]]
quote='''
And he says that he is of the tribe of Benjamin in order to exalt his lineage above those who trace their origin from the patriarchs, the sons of Jacob by his concubines, or on account of those who were proselytes. Hence he says: I more, by circumcision of the eighth day, of the race of Israel, to show that he was first among the Jews, but that he despised this for the sake of the hope promised by Christ. The Hebrews, however, were named after Abraham; for a letter was changed for the sake of the sound, so that they were called not "Abraei" but "Hebraei": just as among the ancients, when "medidie" was said and it was absurd, a letter was changed so that "meridie" was said. For if their origin is from Abraham, their name too ought to be drawn from him, not from Heber, who is in the sixth generation above Abraham (Gen. 11:14). For if in Abraham the human race began to be formed anew, and he himself is the father of faith, from him come both the name and the Hebrew tongue. For the first tongue, which was without a name, when it is restored to him, takes its name from him. For there is no reason why it should draw its name from Heber; for Abraham was a Chaldean, and yet the Hebrews do not have the Chaldean tongue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
