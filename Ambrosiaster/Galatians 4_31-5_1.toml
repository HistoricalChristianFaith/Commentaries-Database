[[commentary]]
quote='''
So we are not sons of the slave woman, but of the free, with the freedom by which Christ has freed us. We were, then, sons of the slave woman while we were liable to sins; but having received the remission of sins from Christ, we have been freed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
