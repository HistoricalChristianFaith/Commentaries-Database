[[commentary]]
quote='''
And at the same time, being idle, they learn to go about: and not only idle, but also wordy and curious, speaking what they ought not. Certain virgins or widows, recommended by their profession (for the name of this thing is glorious), are welcome in the houses of the rich, and they make it their business to comply with their wishes, walking about and seeking out things to carry to them with which they may be delighted, so that, being idle, they may be rewarded with gifts: and by a bad habit they seek more by tales than by what they work with their hands, so that they go out puffed up and dressed up, acting against their profession. This thing usually turns against them even in this life; for that is revealed which they think will always be hidden. For what does it mean, that they speak the things they ought not? For they are close to marriages, sharers in many secrets, flatterers, complainers about servants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
