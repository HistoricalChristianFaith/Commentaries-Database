[[commentary]]
quote='''
For when we were with you, we commanded you this, that if anyone does not wish to work, neither let him eat. He taught not only by words, but exhorted also by deeds; for it belongs to a fit teacher to fulfil in works what he teaches in words. For then learners know that what they hear is true, if they do not see it neglected by the teacher. For although it is not unknown that what is taught is manifestly true, yet if it begins to be neglected by the teacher, it will hardly profit the hearers: for works persuade more than words. Wherefore those are to be repaid with great rewards who, while their teachers are negligent, profit from words alone both in work and in understanding. So he was a pattern to those in the people who were of moderate or slender means, that they might learn how not to lose their freedom. Hence Solomon also: Seldom, he says, shall you bring your foot to your friend, lest, sated with you, he hate you (Prov. 25:17). For he who frequently comes to another's table, given over to idleness, must flatter the one who feeds him; whereas our religion calls men to freedom. And therefore if anyone, he says, scorns to eat, let him cease from work: but since no one can live without food, let him apply himself to laboring, so that, living by his own choice, he may have God favorable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Thessalonians.html'
source_title="Commentary on 2 Thessalonians"
