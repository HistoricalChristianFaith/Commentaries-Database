[[commentary]]
quote='''
And therefore we too give thanks to God without ceasing, that when you had received from us the word of the hearing of God, you took it up not as the word of men, but as it truly is, the word of God, which also works in you who have believed. They render thanks to God, who opened their understanding to receive his Gospel. For it is the glory of preachers when the hearers readily believe; for they received the word with such devotion that they proved they had understood it to be the teaching of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
