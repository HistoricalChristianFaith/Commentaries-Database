[[commentary]]
quote='''
For it is certain that every act carries its sentence with it. When there is no other expectation than that, once the deed is complete, its due recompense is known, the future is considered as already done. Indeed it was said to Adam and Eve, “On the day you eat of it, you shall die by death” (Gen. 2:17); and certainly they did not die immediately, but after a long interval of time. Yet because they had already lost the hope of immortality, their future death was called present, since it began to be held in view as certain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 6: DID LAMECH KILL CAIN?"
