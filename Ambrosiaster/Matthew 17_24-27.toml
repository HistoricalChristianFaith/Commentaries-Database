[[commentary]]
quote='''
WHY DID THE SAVIOR PAY THE DIDRACHMA ONLY FOR HIMSELF AND PETER, AND NOT ALSO FOR THE OTHER APOSTLES (Matt. 17:26)? SINCE THEY HAD ALL FOLLOWED HIM AFTER LEAVING ALL THEIR POSSESSIONS, HE SEEMS TO HAVE OWED PAYMENT FOR ALL. — The didrachma is understood as a head tax, not a tax on estates [what is now called “ragged gold,” because even the poor are taxed]; for indeed the Savior possessed nothing in the world, though he is Lord of the world. He was buried at the expense of others when he died; yet we, for whom the world is foreign, desire to increase our possessions, so that when we die we may protest that the world has trespassed upon us, not only by our voice but also in writing, so that by our own profession we may be condemned by him whose the world is. Therefore the Lord says, “Whoever does not leave all things and follow me, cannot be my disciple” (Luke 14:26). [Whoever therefore holds his possessions in such a way that he does not place his hope in them, but is ready to cast them aside for the faith, is walking the path that leads to Christ our Lord.] Therefore the didrachma was to be exacted from those who conducted some business or practiced trades. But since the Savior cared for none of these things, nor did his disciples, he was in fact not accountable to be taxed. Yet because the enemy, the Devil, was always lying in wait, seeking an opportunity to overthrow the Savior if he could, he took hold of the minds of the tax collectors of the didrachma, to make them do his will, so that they came to Peter, who was the first among the Apostles, and said that the didrachma ought to be paid by their master, who was free from such burdens. For they did nothing in the world that belonged to the world; so that, since he had nothing from which to pay, he might either become a stumbling block to them, or in humility seek support from someone to pay it. Then the Lord, to show that the shortsighted Devil always plots against himself, commands the Apostle Peter to go to the sea, open the mouth of the fish he would catch, and there find the coin owed for the tax. By paying it, he would not only avoid giving offense to the collectors, nor be forced by the need of help to pay it, but would also display a sign of the greatest power, by which he might draw to himself those captured by the Devil, so that the Devil would be tormented by his own scheme and by this proof. Therefore the collectors of the didrachma say to the Apostle Peter, “Your Master does not pay the didrachma,” etc. By saying this, they approached the Master as though he should pay for all the disciples. But when the Savior orders it to be given for himself and Peter, he appears to have paid for all: for just as all were contained in the Savior because of his office as Master, so after the Savior all are contained in Peter. He appointed him to be their head, that he might be the shepherd of the Lord’s flock. For among other things he says to the disciples, “Watch and pray, that you may not enter into temptation” (Matt. 26:41). And to Peter he says, “Behold, Satan has asked to sift you like wheat; but I have prayed for you, that your faith may not fail; and when you have turned back, strengthen your brothers” (Luke 22:31–32). What doubt can there be? Was he praying for Peter and not for James and John, to say nothing of the rest? It is clear that all are contained in Peter: by praying for Peter, he is recognized to have prayed for all. For it is always in the leader that the people are either rebuked or praised. For in another place he says: “I pray for those whom you have given me, Father; and I will that where I am, they also may be with me” (Jn. 17:9, 24).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 75: WHY THE SAVIOR PAID THE DIDRACHMA ONLY FOR HIMSELF AND PETER"
