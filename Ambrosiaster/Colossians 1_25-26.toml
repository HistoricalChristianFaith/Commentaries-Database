[[commentary]]
quote='''
Of which I was made a minister according to the dispensation of God which was given to me for you, to fulfil the word of God in the mystery which was hidden from ages of ages and from generations. He says with confidence that he was made by God through Christ a minister of the Gospel among the Gentiles, so that the mystery begun by the Lord, which had been unknown from the ages, might be fulfilled through a fit and effective servant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
