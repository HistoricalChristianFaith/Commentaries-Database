[[commentary]]
quote='''
For who has known the mind of the Lord? who has instructed him (Isa. 40:13)? The mind of God is this, that he commanded these things to be done spiritually, by which the wisdom of the world, denying that what has been done can be done, would be proved foolish. There is no one who has known this mind and is displeased with it, so as to correct the counsel of God; for he who has known it praises the power of God, whereas he who denies that God can do all things does not believe that he made the world either. For what great thing is it that he should be believed to have begotten from himself, who is not doubted to have made all things out of nothing? seeing that the Savior says: But with God all things are possible (Matt. 19:26).

But we have the mind of the Lord. He says this because, as believers, we are sharers in the same divine judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
