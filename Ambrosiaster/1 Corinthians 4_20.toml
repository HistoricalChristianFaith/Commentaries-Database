[[commentary]]
quote='''
For the kingdom of God is not in speech, but in power. So that, just as the kingdom of God is commended not by the splendor of words but by the power of signs, so these too should show themselves worthy to be visited by the Apostle not by bare words but by the power of spiritual works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
