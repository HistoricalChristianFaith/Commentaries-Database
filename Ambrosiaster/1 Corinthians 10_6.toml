[[commentary]]
quote='''
Now these things were done as a figure of us, that we may not be desirers of evil things, as they also desired. This is the sense and reasoning which I mentioned above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
