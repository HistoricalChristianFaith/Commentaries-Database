[[commentary]]
quote='''
But God is one. He says this lest, by preaching Christ as God, whom he calls an arbiter for the one God, he should be thought to have preached against the Law and the prophets. He teaches, therefore, that this arbiter is to be understood through the assumption of flesh, as he says to Timothy: The arbiter of God and of men, the man Jesus Christ (1 Tim. 2:5); but that according to what he is as God, he is not separated from the Father, but is one with the Father. For whether Father or Son, God is one; for God is the name of a nature and of a power, which, as the very meaning of the names teaches, remains undivided in the Father and the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
