[[commentary]]
quote='''
But God is one. He says this lest, by preaching Christ as God, whom he calls an arbiter for the one God, he should be thought to have preached against the Law and the prophets. He teaches, therefore, that this arbiter is to be understood through the assumption of flesh, as he says to Timothy: The arbiter of God and of men, the man Jesus Christ (1 Tim. 2:5); but that according to what he is as God, he is not separated from the Father, but is one with the Father. For whether Father or Son, God is one; for God is the name of a nature and of a power, which, as the very meaning of the names teaches, remains undivided in the Father and the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
For there is one God, and one mediator of God and men, the man Christ Jesus. He signifies that the will of God and of Christ is one in saving men; hence he confesses that God the Father, because all authority is from him, is one, and that the one mediator of God and men is Christ Jesus. For, sent by the Father and made arbiter, he reconciled God and men, by reforming them to the knowledge of him; for since the Father and the Son are one, not in person but by the indistinction of their nature, the Son of God, in order to be the arbiter of God and men, took flesh and was born a man; so that the mediator of God and men might be the man Christ Jesus, that is, not without divinity; because the man was in God, and God in the man: and so that he might be mediator from both, and might reconcile both, he did this first in himself. For one who guards the unity of God could not be called mediator of God and men as though there were another God who should call man, at odds with God, back into favor: but a man who would not transgress the law that was given was made arbiter between him who sinned and him who knew not how to sin; so that the latter might pardon, and man might for the rest remain in the faith of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Timothy.html'
source_title="Commentary on 1 Timothy"
