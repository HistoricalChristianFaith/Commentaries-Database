[[commentary]]
quote='''
To know also the love of Christ which surpasses knowledge. After the infinite and incomprehensible knowledge of God the Father and his unspeakable mercy, he wants us also to recognize the love of Christ; because it surpasses knowledge, and "human" is understood with it; so that the love of Christ is held to be above the knowledge of men. For who can gather the reason of the mystery of this love: that God should both be born a man for man's sake, and then die for men, the Lord for slaves, the Creator for the creature, the godly for the ungodly? Why did he so love us? Or to have what of ours, he who needs nothing? Is not this love above the knowledge of men? Or who among men will be able to show this love to anyone, although it be unequal, and for this reason it surpasses human devising? This, therefore, he wants us to know: that our understanding cannot attain to, nor see through, the depth of the benefits of Christ toward us; so that accordingly we may always be suppliant and devoted to him, and that we, who can in no way satisfy what we owe, may at least persevere in faith in him even to death. For he, in keeping with the magnificence of his majesty, did for us things that were unworthy of him, so that we too, as far as we can, may serve him. That you may be filled unto all the fullness of God. Because faith is neither whole in the Father alone nor perfect in the Son alone, he therefore added: That you may be filled unto all the fullness of God; so that in confession and thanksgiving honor may be reserved for the Son as for the Father, and that all things which are from God the Father may be believed to have been made and restored through the Son; so that there may be full perfection of the divinity in the profession of believers. For nothing will be lacking to a Christian when he knows God the Father to be immeasurable in all things, and professes also that the love of Christ is ineffable and surpasses human knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
