[[commentary]]
quote='''
For you can all prophesy one by one, that all may learn and all may be exhorted. This is the tradition of the Synagogue, which he wishes us to follow; because he writes indeed to Christians, but to those made so from the Gentiles, not from the Jews: that they should sit and discuss, the elders in rank on chairs, those next to them on benches, the last on the floor upon mats. If something is revealed to any of these, he commands that room to speak be given them, and that they not be despised, because they are members of the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
