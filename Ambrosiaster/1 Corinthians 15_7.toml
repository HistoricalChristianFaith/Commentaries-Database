[[commentary]]
quote='''
Then he appeared to James. He appeared to James individually, as also to Peter: which I think was done for this reason, that appearing in many ways he might make faith in the resurrection firm. Afterward to all the apostles. Again he was seen by all the apostles on the mountain where Jesus had appointed them, as Matthew the evangelist relates (Matt. 28:16). Before that, in Jerusalem, eight days after his resurrection, that is, on the Lord's day, he came in to the disciples when the doors were shut, so that the mind of Thomas might be made firm, as John the apostle says (John 20:26). For it is on the mountain that he is understood to have given them his commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
