[[commentary]]
quote='''
Being confident of this very thing, that he who began a good work in you will perfect it until the day of Christ Jesus, as it is right for me to think this for you all; because I have you in my heart and in my bonds, and in the defense and confirmation of the Gospel; since you are all partakers of my joy. Secure about the goodness and justice of God, and not doubting about their faith, he is confident that, aided by the help of God, they will persevere in faith until the day of the Lord, on which those who persist in faith are to be rewarded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
