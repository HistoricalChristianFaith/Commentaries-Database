[[commentary]]
quote='''
All who are with me greet you. For brevity's sake he indicates that all greet him together. Greet those who love us in the faith. He wishes those to be seen as worthy of his greeting who love him faithfully with the affection of Christ our Lord. The grace of God be with you all. Now he greets in general all the brethren and the household of Titus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
