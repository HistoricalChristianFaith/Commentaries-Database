[[commentary]]
quote='''
WAS ADAM'S BODY, WHEN IT WAS CREATED, IMMORTAL OR SUBJECT TO DEATH? — God made man in such a way that, as long as he did not sin, he would flourish in immortality: so that he himself would be the author for himself either of life or of death; that by guarding himself from sin, he would, by his own effort, rejoice that he was immortal; but by becoming careless, he would blame himself, because he had begun to be mortal. For as long as he continued in the law of his Creator, he was worthy to eat from the tree of life, so that he could not die. For his body was not of such a kind that it would seem impossible for it to be dissolved; rather, the taste of the tree of life restrained the body’s corruption. Indeed, even after the sin, it could have remained everlasting, if only it had been permitted him to eat from the tree of life. For how could he have had an immortal body if it was sustained by food? For the immortal does not need food or drink. Food supplied strength, while the tree of life, in the manner of a medicine, prevented all corruption. Therefore it was for man as though it were an secure wall.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FQuestions%2520on%2520the%2520Old%2520and%2520New%2520Testaments.html'
source_title="QUESTIONS ON THE OLD AND NEW TESTAMENTS, QUESTION 19: WAS ADAM'S BODY IMMORTAL OR SUBJECT TO DEATH?"
