[[commentary]]
quote='''
But I beseech you, brothers: you know the house of Stephanas and of Fortunatus, that they are the beginning of Achaia, and have appointed themselves to the ministry of the saints; that you also be subject to men of this kind, and to everyone who works with us and labors. The Achaeans are Corinthians; and therefore he speaks to them about these men, through whom he provokes them to a work of this sort; for they are from among them. For this is a great thing in Christians, that, avarice trodden underfoot, they bestow from their labors on those who have not, made imitators of God the Father, who is rich in mercy. But when he says: That you be subject to such, he exhorts them all the more: that, having become emulators of this work, they themselves may have others subject to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
