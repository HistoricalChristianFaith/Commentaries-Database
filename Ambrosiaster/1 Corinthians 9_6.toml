[[commentary]]
quote='''
Or do I alone and Barnabas not have the power of doing these things? That is, we have the power of doing so, but we do not wish to. Yet he says of doing in place of "of receiving", so as to speak more decently. And to confirm this, he adds examples, saying:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
