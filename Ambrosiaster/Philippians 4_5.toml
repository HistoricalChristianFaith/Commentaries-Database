[[commentary]]
quote='''
Let your modesty be known to all men; the Lord is near. Be anxious in nothing, but in all things by prayer and supplication, with thanksgiving, let your requests become known before God. And may the peace of God, which surpasses every mind, guard your hearts and your understandings in Christ Jesus. Now he wishes to gain others by their example; for when their modesty, that is, their reasonable way of life, has been made manifest, their works will shine, and there will be no lack of those who imitate their good, so that they may obtain increase not only from their own deeds but also from those of others; so that, as it is said (Ps. 127:2), they may eat the labours of their fruits. For when the fruit of their works gains others for good work, the labours of those who have been gained will profit those by whose example they began to imitate good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Philippians.html'
source_title="Commentary on Philippians"
