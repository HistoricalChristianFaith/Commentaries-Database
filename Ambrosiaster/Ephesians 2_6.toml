[[commentary]]
quote='''
And he raised us up together, and made us sit together in the heavenly places in Christ Jesus. He says what I mentioned above: that the saints, even from the Gentiles, will be there where Christ, their head, also is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
