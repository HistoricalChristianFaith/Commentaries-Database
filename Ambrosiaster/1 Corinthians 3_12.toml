[[commentary]]
quote='''
But if anyone builds upon this foundation gold, silver, precious stones. Precious stones are those which fire does not corrupt. He has set down three kinds of things that are splendid in the world, by which he signified good doctrine. Wood, hay, stubble: he has set down three other kinds, but flimsy ones. In these, corrupt and empty doctrine is recognized as designated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
