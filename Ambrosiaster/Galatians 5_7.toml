[[commentary]]
quote='''
You were running well; who hindered you from obeying the truth? He testifies that their exercise in the works of faith was good, but that they were held back by the wickedness of evil men, so that they did not complete their course with persevering efficacy. Hence he exhorts them to come to their senses, believing from now on none of those who, by persuading them that the works of the Law must be kept, would not let them obey the gospel truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
