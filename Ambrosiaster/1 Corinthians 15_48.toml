[[commentary]]
quote='''
As is that earthly one, such are the earthly ones also: that is, because the earthy one is mortal, the earthy are mortal too: for Adam by sinning found death, so that all who are from him are mortal. And as is that heavenly one, such let the heavenly ones be also: that is, because Christ did not sin, conquering death he is heavenly; so let those be who believe in him: although unbelievers too will be spiritual, but like the spiritual powers of wickedness, so that they are dark. For he is now speaking of the saints, who will rise to glory; for just as those who do not believe are already judged, so those who believe are already called heavenly (John 3:18).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
