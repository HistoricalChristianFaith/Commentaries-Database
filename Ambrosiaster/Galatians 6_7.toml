[[commentary]]
quote='''
Do not err; God is not mocked. No one doubts that no imposture can be practised on God, but that each one obtains from him what he deserves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
