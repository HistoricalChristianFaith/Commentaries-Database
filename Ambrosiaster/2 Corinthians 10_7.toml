[[commentary]]
quote='''
Look at the things that are before your face. Now he wants them to consider the things that are in plain view, that is, the things he is about to say, because they are open to judgment. He says, then: If anyone is confident that he is a servant of Christ, let him consider this again within himself, that as he is Christ's, so are we also. He speaks to those whose pride he touches, who, presuming upon themselves with a puffed-up mind, thought less of the Apostle than was fitting, as though they had no need of his precepts. These he admonishes: that if they were confident about themselves, because they were servants of Christ, they certainly ought not to have doubts about the Apostle, but ought to think at least the same of him, though he is unequal to them, when they certainly ought rather to prefer to themselves the teacher of the Gentiles. But here he teaches them humility in his own person, making himself equal to them, though he was a vessel of election and the teacher of the Gentiles in faith and truth. This, then, he wants them to consider, which is certainly seen in clear light: that there is none of the believers who would not esteem the Apostle more than himself; how much more, then, ought no one to esteem him less than himself? This, then, he solemnly declares and teaches, lest through elation of mind they lose the merit of a good life. For let him who knows that he is something humble himself, that he may become greater.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
