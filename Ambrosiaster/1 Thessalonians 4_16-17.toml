[[commentary]]
quote='''
At the coming of the Lord, however, both the saints will rise, and those who are found alive will be caught up to meet the Lord in the air, undergoing death as if it were sleep; for in the very catching up they will have both death and resurrection, as the same Apostle writes to the Thessalonians (1 Thess. 4:16 ff.).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
