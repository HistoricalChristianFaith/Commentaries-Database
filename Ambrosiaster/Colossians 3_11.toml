[[commentary]]
quote='''
In this knowledge, therefore, no one is excepted as unworthy, as though he did not deserve to come to the faith of Christ; for all who come become one, blotted out as to what they were, and written down as what they have begun to be; so that, because they are of one faith, in that very thing they may also be of one merit, so that those whom faith joins cannot be distinguished on the ground that they are different in nature and race or condition. For Christ is all things and in all these; for because all are his members, Christ is all things; so that, while their confession about hope in him is one, Christ is in all: and thus all things are his body, so that their profession and their nature agree.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"

[[commentary]]
quote='''
Yet he separated the barbarian from the Scythian, as the slave from the free, not indeed in Christ, in whom all are one, but in the ferocity of their manners and in the savagery of the race. For he wished these to be understood as worse than barbarians before they believe, although the books of the Greeks proclaim their justice, which they followed with nature as their guide; so much so that among them theft is held a great sin; the paths of justice which the Greeks, he says, tracked down with great industry and learning, they praise these men for having grasped by nature. But as all things degenerate, they afterwards began to be more blameworthy than they had been praiseworthy before. For after their women, who they assert were originally called Amazons, began to use the law of men, subjecting all Asia against nature, so it came about that the men too were made rabid after the manner of dogs, savage, wild, uncultivated, more than barbarians, so changed that they were trained to feed on human flesh. What wonder, when the Romans themselves too were far other than they are now? For to their women also, for chastity's sake, the use of wine was unknown, as the use of water is now; for so strong was the authority of discipline that the subject vessel did not do what it wished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%2520Colossians.html'
source_title="Commentary on Colossians"
