[[commentary]]
quote='''
But now I have written to you not to mix. If he who is called a brother among you is a fornicator, or covetous, or a server of idols, or a reviler, or a drunkard, or rapacious, with such a one not even to take food. He forbids taking food with a brother, but did not forbid it with an unbeliever, since indeed he says: If anyone of the unbelievers invites you to dinner and you wish to go, eat whatever is set before you (Luke 10:8). Therefore he says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
