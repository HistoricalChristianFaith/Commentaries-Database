[[commentary]]
quote='''
At Damascus the governor of the nation of King Aretas was guarding the city of the Damascenes in order to seize me: and through a window I was let down in a basket through the wall, and I escaped his hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
[[commentary]]
quote='''
If it is necessary to boast, yet there is no need for me. The governor of Damascus, seeing the Jews laying snares for the Apostle, wanted to carry out their evil design by his power, so that he himself, if he could, might seize him, both to please the Jews and to appear diligent in the office entrusted to him, if for the sake of peace he put to death the man he heard publicly called a disturber. The Jews had been inflamed at this in the very beginnings, at the time when the Lord appeared to him on the road as he was going to Damascus, seeing that the man who had come to bring believers in Christ in chains to Jerusalem was preaching the sect he had come to condemn (Acts 9:2 ff.); and so it came about that he escaped, let down by the disciples through a window, through the wall, in a basket. Some say that this was done unworthily, because he was not set free by God's help. But what need was there for him to be set free by God's aid in a thing that could be done by men, since God's aid is needed only when human help fails? Having done this, he says that it is not expedient for him to boast, because the joy of the present life is fragile; for if he had not escaped, he would have achieved martyrdom. But since it is commanded to flee in persecution (Matt. 10:23), he deliberately escaped; for no one ought to wait for sin to be committed against himself. So he says that he should boast, because he escaped; but it is not expedient, he says, because of pride: for one grows through humility, and God's help benefits the meek, not the proud. Moreover, since he would be boasting that he had escaped a death that is inflicted for the faith, he indicates that suffering for Christ would seem a vain thing; therefore it is not expedient to boast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25202%2520Corinthians.html'
source_title="Commentary on 2 Corinthians"
