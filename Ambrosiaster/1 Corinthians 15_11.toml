[[commentary]]
quote='''
Whether then it was I or they, so we preach, and so you believed. This is what he indicated above, that he received in preaching no grace inferior to that of the other apostles, but one and the same. Hence he reproves the faithlessness of the Corinthians all the more, because, although this belief had been made manifest among all the churches, they had fallen away from this faith and hope, which he set down next, saying:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Corinthians.html'
source_title="Commentary on 1 Corinthians"
