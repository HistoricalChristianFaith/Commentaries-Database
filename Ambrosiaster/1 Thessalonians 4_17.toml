[[commentary]]
quote='''
So when those who have died in Christ have risen first, then we who live shall be caught up together with them, borne on the clouds, to meet Christ in the air; so that all may come with the Lord to the battle, and that he may see alive those whom he had slain; because, as the clouds served the Lord, so too will they serve those whom he deigned to call his brothers. And so we shall always be with the Lord; for in the very rapture death will come, and as through sleep, so that the soul, having gone out, may be restored in a moment. For when they are taken up, they will die; so that, on reaching the Lord, they may receive back their souls in the presence of the Lord; because with God they cannot be dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrosiaster%2FCommentary%2520on%25201%2520Thessalonians.html'
source_title="Commentary on 1 Thessalonians"
