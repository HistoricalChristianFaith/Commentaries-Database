[[commentary]]
quote='''
The joy of God is not found in just any soul but, if some one has mourned much and deeply his own sin with loud lamentations and continual weepings, as if he were bewailing his own death, the mourning of such a one is turned into joy. That it is praiseworthy to mourn is evident from the boys who sit in the market place, saying: ‘We have sung dirges, and you have not wept; we have piped to you, and you have not danced.’ The flute is a musical instrument which needs wind for the melody. Wherefore, I think that every holy prophet was called figuratively a flute because of the inspiration of the Holy Spirit. For this reason he says: ‘We have piped to you, and you have not danced.’ The prophetical words, indeed, urge us on to the rhythmic action of the holy prophecy, which is called dancing. But, the prophets make lamentation for us, summoning us to mourn, in order that, becoming aware from the prophetic words of our own sins, we may bewail our destruction, afflicting our flesh with hardships and toils. By such a person, the mourning garment, which he put on when bewailing his sin, is rent, and the tunic of joy is placed around him and the cloak of salvation, those bright wedding garments, with which, if one is adorned, he will not be cast out from the bridal chamber.

‘Thou hast cut my sackcloth, and hast compassed me with gladness.’ The sackcloth is a help to penance, since it is a symbol of humility. ‘They would have repented long ago,’ it is said, ‘sitting in sackcloth and ashes.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
