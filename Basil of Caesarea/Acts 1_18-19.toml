[[commentary]]
quote='''
These things come of covetousness. Now covetousness is the root of all evil and is called idolatry. Do not then price idols above Christ for the sake of a little money. Do not imitate Judas and once more betray for a bribe Him who was crucified for us. For alike the lands and the hands of all that make such gain shall be called Aceldama.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252053.html'
source_title="Letter 53, Section 2"
