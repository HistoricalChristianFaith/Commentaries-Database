[[commentary]]
quote='''
Let us not be deceived by the ambiguity of the word laughter. For it is often the custom of Scripture to call the joy of the soul, and its cheerful feelings at good fortune, laughter. So Sarah says: “God made laughter for me.” And, “Blessed are ye that weep now, for ye shall laugh.” And the passage in Job—“He will fill a true mouth with laughter.” For in all these places the word is used for spiritual joy in place of hilarity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 17"
