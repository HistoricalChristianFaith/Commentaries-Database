[[commentary]]
quote='''
Play the man, then, and be strong, and walk before the people whom the Most High has entrusted to your hand. Like a skilful pilot, rise in mind above every wave lifted by heretical blasts; keep the boat from being whelmed by the salt and bitter billows of false doctrine; and wait for the calm to be made by the Lord so soon as there shall have been found a voice worthy of rousing Him to rebuke the winds and the sea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520161.html'
source_title="Letter 161, Section 2"
