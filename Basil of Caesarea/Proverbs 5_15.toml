[[commentary]]
quote='''
‘He hath opened a pit and dug it.’ We do not find the name of ‘pit’ (lákkos) ever assigned in the divine Scriptures in the case of something good, nor a ‘well’ of water (phréar) in the case of something bad. That into which Joseph was thrown by his brothers is a pit (lákkos). And there is a slaughter ‘From the firstborn of Pharao unto the firstborn of the captive woman that was in the prison (lákkon).’ And in the psalms: ‘I am counted among them that go down to the pit (lákkon).’ And in Jeremia it is said: ‘They have forsaken me, the fountain of living water, and have digged to themselves cisterns (lákkous), broken cisterns, that can hold no water.’ Moreover, in Daniel the lions’ den (lákkos), into which Daniel was thrown, is described. On the other hand, Abraham digs a well (phréar); so do the sons of Isaac; and Moses, coming to a well (phréar), rested. We also receive the order from Solomon to drink water from our own cisterns (angeíōn) and from the streams of our wells (phreátōn). And beside the well (pēgé) the Savior conversed with the Samaritan woman concerning the divine mysteries. As to the reason for the pits being assigned among the worse things and the wells among the better, we think it is this. The water in the pit is something acquired, having fallen from the sky; but, in the wells streams of water, buried before the places were dug out, are revealed when the heaps of earth covering them and the material of any sort whatsoever, lying upon them, which is also all earth, have been removed. Now, it is as if there were a pit in souls in which the better things, changed and debased, fall down, when a person, having resolved to have nothing good and noble of his own, puts to flight the thoughts of the good and noble that have slipped into it, twisting them to evil-doing and to contradictions of truth. And again, there are wells, when a light and a stream of water unimpaired in word and in doctrines break forth after the baser materials which had been covering it are removed. Therefore, it is necessary for each one to prepare a well for himself, in order that he may guard the command mentioned previously, which says, ‘Drink water out of thy own cistern, and the streams of thy own well.’ Thus we shall be called the sons of those who have dug the wells, Abraham, Isaac, and Jacob. But, a pit must not be dug lest we fall into the hole, as it is said in this place, and so fail to hear the words written in Jeremia in reproach of sinners, for, God says concerning them what we have briefly mentioned before: ‘They have forsaken me, the fountain of living water, and have digged to themselves cisterns, broken cisterns, that can hold no water.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"

[[commentary]]
quote='''
‘Drink water out of thy own cistern.’ that is, examine your own resources, do not go to the springs belonging to others, but from your own streams gather for yourself the consolations of life. Do you have metal plates, clothing, beasts of burden, utensils of every kind? Sell them; permit all things to go except your liberty. ‘But I am ashamed,’ he says, ‘to put them out in public.’ Why, pray tell me, seeing that a little later another will bring them forth, and, selling your possessions at an auction, will dispose of them at a price too low in your eyes? Do not go to another’s doors. ‘For truly another’s well is narrow.’ It is better to relieve the necessity gradually by various devices, than, after having been suddenly lifted up by others’ resources, to be later deprived of all your belongings at once. If, therefore, you have anything by means of which you may pay, why do you not put an end to your present need from those resources? If you are without means for the payment, you are treating evil with evil. Do not take on a creditor to pester you. Do not endure, like a prey, to be hunted and tracked down. Borrowing is the beginning of falsity; an opportunity for ingratitude, for senseless pride, for perjury. The words of a man when he is borrowing are of one kind, those when payment is being demanded are of another. ‘Would that I had not met you, I would have found opportunity to deliver myself from my necessity. Did you not put the money into my hand, although I was unwilling? Your gold was mixed with copper and your coin was counterfeit.’ If, then, your creditor is a friend, do not suffer the loss of his friendship; if he is an enemy, do not come under the control of a hostile person.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252014.html'
source_title="Homily on Psalm 14"
