[[commentary]]
quote='''
‘Turn away from evil and do good, seek after peace and pursue it.’ These counsels are elementary and are channels to piety; they describe accurately how to prevail over the tongue, how to refrain from deceitful schemes, how to turn away from evil. Mere abstinence from evil is not a characteristic of a perfect man; but, for one recently instructed in basic principles it is fitting to turn aside from the impulse to evil and, being delivered from the habits of a depraved life as from a bad road, to pursue the performance of good. In fact, it is impossible to cleave to the good unless one has withdrawn entirely and turned away from the evil, just as it is impossible to repair one’s health unless one rids himself of the disease, or for one who has not completely checked a chill to be in a state of warmth; for, these are inadmissible to each other. So also, it is proper for him who intends to live a good life to depart from all connection with evil. ‘Seek after peace and pursue it.’ Concerning this peace the Lord has said: ‘Peace I leave with you, my peace I give to you; not as the world gives peace do I give to you.’ Seek, therefore, after the peace of the Lord and pursue it. And you will pursue not otherwise than running toward the goal to the prize of the heavenly calling. For, the true peace is above. Yet, as long as we were bound to the flesh, we were yoked to many things which also troubled us. Seek, then, after peace, a release from the troubles of this world; possess a calm mind, a tranquil and unconfused state of soul, which is neither agitated by the passions nor drawn aside by false doctrines that challenge by their persuasiveness to an assent, in order that you may obtain ‘the peace of God which surpasses all understanding and guards your heart.’ He who seeks after peace, seeks Christ, because ‘he himself is our peace,’ who has made two men into one new man, making peace, and ‘making peace through the blood of his cross, whether on earth or in the heavens.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
