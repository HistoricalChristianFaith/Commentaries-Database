[[commentary]]
quote='''
But, if you place yourself in the hands of a man rich in virtue, you will become the heir of the good qualities he possesses and you will be supremely blessed with God and men. On the other hand, if, to spare the body, you seek a master who will condescend or, rather, degrade himself to the level of your vices, all in vain did you endure the struggle of renunciation, since you have surrendered yourself to a life of gratifying your passions by choosing a blind guide who will lead you into the pit.
'''
source_url=''
source_title="ON RENUNCIATION OF THE WORLD"

[[commentary]]
quote='''
Now we say we desire the Kingdom of heaven, but we have no care for those things by which it may be gained. And though we undertake no labour to fulfil the Lord’s commands yet we imagine in the folly of our heart that we shall receive equal honours with those who have resisted sin even unto death. Who has ever remained at home idle or asleep at the time of sowing, and then, when harvest has come, filled his bosom with sheaves? Who has ever gathered grapes from a vine which he has not planted and laboured for? Those who have laboured receive the fruits; honours and crowns are for conquerors. Who would ever crown him who had not even stripped to meet a foe? For it is necessary not only to conquer, but also to contend lawfully, according to the words of the apostle; that is, not to neglect even the smallest of such things as are commanded, but to do each thing even as we have been ordered. For it is said: “Blessed is that servant, whom the Lord when he cometh shall find,” not doing anywise, but “so doing.” And “if thou hast offered rightly, but hast not divided aright, thou hast sinned.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Preface"
