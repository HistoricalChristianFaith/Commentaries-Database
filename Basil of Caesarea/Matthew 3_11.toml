[[commentary]]
quote='''
Furthermore, from this too may be apprehended the difference between the grace that comes from the Spirit and the baptism by water: in that John indeed baptized with water, but our Lord Jesus Christ by the Holy Ghost. "I indeed," he says, "baptize you with water unto repentance; but he that cometh after me is mightier than I, whose shoes I am not worthy to bear: he shall baptize you with the Holy Ghost and with fire." Here He calls the trial at the judgment the baptism of fire, as the apostle says, "The fire shall try every man's work, of what sort it is." And again, "The day shall declare it, because it shall be revealed by fire."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 15"
