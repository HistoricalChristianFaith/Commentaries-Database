[[commentary]]
quote='''
The sun ought not to go down upon a brother’s wrath, lest haply night come between brother and brother, and make the charge stand in the day of judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252022.html'
source_title="Letter 22, Section 3"
