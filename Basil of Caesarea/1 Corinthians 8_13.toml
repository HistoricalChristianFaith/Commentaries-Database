[[commentary]]
quote='''
But sometimes one must refrain even from things permitted and necessary for life, when refraining means the benefit of our brethren. As the Apostle says: “If meat maketh my brother to stumble, I will eat no flesh for evermore.” And having a right to live of the gospel, he did not use the right, lest he should give offence to the gospel of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 17"
