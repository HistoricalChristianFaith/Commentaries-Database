[[commentary]]
quote='''
They, then, that were sealed by the Spirit unto the day of redemption, and preserve pure and undiminished the first fruits which they received of the Spirit, are they that shall hear the words "well done thou good and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things." In like manner they which have grieved the Holy Spirit by the wickedness of their ways, or have not wrought for Him that gave to them, shall be deprived of what they have received, their grace being transferred to others; or, according to one of the evangelists, they shall even be wholly cut asunder,—the cutting asunder meaning complete separation from the Spirit. The body is not divided, part being delivered to chastisement, and part let off; for when a whole has sinned it were like the old fables, and unworthy of a righteous judge, for only the half to suffer chastisement. Nor is the soul cut in two,—that soul the whole of which possesses the sinful affection throughout, and works the wickedness in co-operation with the body. The cutting asunder, as I have observed, is the separation for aye of the soul from the Spirit. For now, although the Spirit does not suffer admixture with the unworthy, He nevertheless does seem in a manner to be present with them that have once been sealed, awaiting the salvation which follows on their conversion; but then He will be wholly cut off from the soul that has defiled His grace. For this reason "In Hell there is none that maketh confession; in death none that remembereth God," because the succour of the Spirit is no longer present.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 16"
