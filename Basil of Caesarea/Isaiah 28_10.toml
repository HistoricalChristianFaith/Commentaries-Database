[[commentary]]
quote='''
Only let our spirit be kept unbroken, the firmness of our faith in Christ be maintained unshaken, and ere long our Champion will appear; He will come and will not tarry. Expect tribulation after tribulation, hope upon hope; yet a little while; yet a little while. Thus the Holy Ghost knows how to comfort His nurslings by a promise of the future. After tribulations comes hope, and what we are hoping for is not far off, for let a man name the whole of human life, it is but a tiny interval compared with the endless age which is laid up in our hopes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520140.html'
source_title="Letter 140, Section 1"
