[[commentary]]
quote='''
But apart from this the fashion of the love of Christ does not allow us to look each at his own good. For “love” we read “seeketh not its own.” Now the solitary life has one aim, the service of the needs of the individual. But this is plainly in conflict with the law of love, which the apostle fulfilled when he sought not his own advantage but that of the many, that they might be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 7"
