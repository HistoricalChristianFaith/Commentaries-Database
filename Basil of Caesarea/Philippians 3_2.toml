[[commentary]]
quote='''
Now in season remember the voice of him who when preaching to you used always to say “Beware of dogs, beware of evil workers.” The dogs are many. Why do I say dogs? Rather grievous wolves, hiding their guile under the guise of sheep, are, all over the world, tearing Christ’s flock. Of these you must beware, under the protection of some wakeful bishop.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252028.html'
source_title="Letter 28, Section 2"
