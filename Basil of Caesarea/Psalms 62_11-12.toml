[[commentary]]
quote='''
Then he brings up a decision for all that was said, not now from his own words, but one which he heard from God Himself. ‘God hath spoken once, these two things have I heard,’ he says. And let it not disturb anyone that what was said is, as it were, incredible, namely, that God spoke once and the prophet heard two things. For, it is possible for someone to speak once, but for the things spoken on the one occasion to be many. A certain man, in fact, when he met someone once, discussed many things, and he who heard his words is able to say: ‘He talked with me once, but he spoke about many things.’ This is what was meant on the present occasion, the manifestation of God occurred to me once, but, there are two matters of which He talked. He did not say: ‘God spoke of one thing, but I heard these two’; for, thus the statement would seem to have some discrepancy in it. What were the two things which he heard? ‘That power belongeth to God, and mercy to thee, O Lord.’ God is powerful, he says, in judgment, and likewise merciful. Trust not, therefore, in iniquity, do not hand yourself over to riches; do not choose vanity; do not carry around the corrupt tribunal of your soul. Knowing that our Lord is mighty, fear His strength, and do not despair of His kindness. Now, in order that we may not do wrong, fear is good; and in order that he who has once slipped into sin may not throw himself away through despair, the hope of mercy is good. For, power belongs to God, and mercy is from Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252061.html'
source_title="Homily on Psalm 61"
