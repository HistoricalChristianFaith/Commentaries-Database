[[commentary]]
quote='''
‘And in my abundance I said: I shall never be moved.’ As the prosperity of a city is dependent upon the supply of goods for sale in the market, and as we say that a country is prosperous which produces much fruit, so also there is a certain prosperity of the soul when it has been filled with works of every kind. It is necessary first for it to be laboriously cultivated, and then to be enriched by the plentiful streams of heavenly waters, so as to bear fruit thirtyfold, sixtyfold, and a hundredfold, and to obtain the blessing which says: ‘Blessed shall be thy barns and blessed thy stores.’ He, therefore, who is conscious of his own constancy, will say with sure confidence and will strongly maintain that he will not be turned away by any opponent, like a full field which the Lord has blessed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
