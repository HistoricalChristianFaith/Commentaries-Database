[[commentary]]
quote='''
‘But the counsel of the Lord standeth for ever: the thoughts of his heart to all generations.’ Do you not see the teachings of the nations, this empty philosophy, how subtle and farfetched they are concerning the inventions of their teachings, both in the rational speculations and in the moral injunctions, and in certain natural sciences and the other so-called esoteric teachings? How all things have been scattered and rendered useless, and the truths of the Gospel alone now hold place in the world? For, many are the counsels in the hearts of men, but the counsel of the Lord has prevailed. And it is necessary, at least if the counsel from God is to remain in our souls firm and steadfast, for the human thoughts which we formerly held, first to be rejected. Just as he who intends to write on wax, first smooths it down and thus puts on whatever forms he wishes, so also the heart which is to admit clearly the divine words must be made clean of the opposite thoughts. ‘The thoughts of his heart to all generations.’ Since, then, there are two chosen peoples, and two testaments were given to them according to the saying, ‘The thoughts of his heart to all generations (eis geneàn kaí geneán),’ since ‘generation’ is named twice, there can be understood also two thoughts, the one, according to which we received the previous testament, but the second, bestowing upon us the new and saving teaching of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
