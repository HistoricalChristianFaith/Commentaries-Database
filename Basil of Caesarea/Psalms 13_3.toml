[[commentary]]
quote='''
Further, living together has other benefits, all of which are not easily enumerated. For it is both more useful than solitude for keeping the good things given us by God, and as regards warding off the external attacks of the enemy a rousing from sleep by the watchers is safer, should it happen to any man to slumber in that sleep which leads unto death, which we have been taught by David to pray may not be our fate, when he said: “Lighten mine eyes, lest I sleep in death.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 7"
