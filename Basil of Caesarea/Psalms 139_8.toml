[[commentary]]
quote='''
If they really conceive of a kind of degradation of the Son in relation to the Father, as though He were in a lower place, so that the Father sits above, and the Son is thrust off to the next seat below, let them confess what they mean. We shall have no more to say. A plain statement of the view will at once expose its absurdity. They who refuse to allow that the Father pervades all things do not so much as maintain the logical sequence of thought in their argument. The faith of the sound is that God fills all things; but they who divide their up and down between the Father and the Son do not remember even the word of the Prophet: "If I climb up into heaven thou art there; if I go down to hell thou art there also."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 6"
