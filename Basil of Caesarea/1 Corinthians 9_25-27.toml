[[commentary]]
quote='''
Clearly the rule of continence is necessary. In the first place the Apostle numbers it among the fruits of the Spirit. Secondly, he says that through continence it comes to pass that our ministration is not blamed—“in labours, in watchings, in fastings, in pureness.” And elsewhere: “In labour and travail, in watchings often, in hunger and thirst, in fastings often.” And again: “Every man that striveth in the games is temperate in all things.” And the buffeting of the body and bringing of it into bondage is accomplished by nothing so much as by continence. For the ferment of youth and its inability to resist impulses is controlled by continence as by a bit in a horse’s mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 16"
