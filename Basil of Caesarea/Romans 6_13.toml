[[commentary]]
quote='''
We exhort you still more to serve God, ever increasing your fear more and more, and advancing on to perfection, that we may be made wise stewards of our life, for which the goodness of God has reserved us. For if it is a command to all of us “to yield ourselves unto God as those that are alive from the dead,” how much more strongly is not this commanded them who have been lifted up from the gates of death? And this, I believe, would be best effected, did we but desire ever to keep the same mind in which we were at the moment of our perils. For, I ween, the vanity of our life came before us, and we felt that all that belongs to man, exposed as it is to vicissitudes, has about it nothing sure, nothing firm. We felt, as was likely, repentance for the past; and we gave a promise for the future, if we were saved, to serve God and give careful heed to ourselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252026.html'
source_title="Letter 26"
