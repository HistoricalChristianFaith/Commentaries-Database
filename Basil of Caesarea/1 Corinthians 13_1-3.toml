[[commentary]]
quote='''
Again, the apostle clearly sets before us the good of charity where he tells us that love is the fulfilling of the law; and again where he says that charity is a good thing to be preferred to all great and good things, in the words, “Though I speak with tongues of men and of angels and have not charity, I am become as sounding brass or a tinkling cymbal. And though I have the gift of prophecy and understand all mysteries, and all knowledge; and though I have all faith, so that I could remove mountains, and have not charity, I am nothing. And though I bestow all my goods to feed the poor and though I give my body to be burnt and have not charity, it profiteth me nothing.” Not that each of the points enumerated could be performed without love, but that the Holy One wishes, as He Himself has said, to attribute to the commandment super-eminent excellency by the figure of hyperbole.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520204.html'
source_title="Letter 204, Section 1"
