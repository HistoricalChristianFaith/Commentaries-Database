[[commentary]]
quote='''
Be “like a green olive tree in the house of God,” never destitute of hope, but decked through faith with the bloom of salvation. Thus you will resemble the eternal verdure of this plant and will rival it in fruitfulness, if each day sees you giving abundantly in alms.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25205-The%2520Germination%2520of%2520the%2520Earth.html'
source_title="The Hexaemeron, Homily 5: The Germination of the Earth"
