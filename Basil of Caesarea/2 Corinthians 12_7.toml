[[commentary]]
quote='''
We find yet another cause for illnesses happening to the Saints, as in the case of the apostle. For lest he should seem to surpass the limits of human nature, and lest any one should think that he had something unusual in his natural constitution (as the Lycaonians thought, when they brought him garlands and oxen), illness was his lot continually, to show that his nature was fully human.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 55"
