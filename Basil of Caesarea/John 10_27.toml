[[commentary]]
quote='''
And these titles do not set forth His nature, but, as I have remarked, the variety of the effectual working which, out of His tender-heartedness to His own creation, according to the peculiar necessity of each, He bestows upon them that need. Them that have fled for refuge to His ruling care, and through patient endurance have mended their wayward ways, He calls "sheep," and confesses Himself to be, to them that hear His voice and refuse to give heed to strange teaching, a "shepherd." For "my sheep," He says, "hear my voice."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
