[[commentary]]
quote='''
‘The king is not saved by a great army.’ Not the extent of the military force, not the walls of cities, not an infantry phalanx, not cavalry troops, not equipment of naval power, will procure safety for the king. For, the Lord establishes kings and removes them, and ‘there exists no authority, except that appointed by God.’ Therefore, the king is saved, not through much power, but through divine grace. So that the saving is true for them also: ‘By grace you have been saved.’ So also, a farmer does not obtain his portion of harvest as much through his agricultural diligence as through God, who causes the crops to grow. For ‘neither he who plants is anything, nor he who waters, but God who gives the growth.’ And if ‘the heart of the king is in the hand of God,’ he will not be saved through power of arms, but through the divine guidance. Now, not any random person is in the hand of God, but he who is worthy of the name of king. And some have defined the kingly office as lawful authority, or the universal control that is not liable to sin.

‘Nor shall the giant be saved by his own great strength.’ He calls him a giant who uses physical power and bodily force. Therefore, neither the king has aid enough from his soldiery, nor is the strong man able to suffice for himself against everything. All things that are at once human, when compared with the true power are weakness and infirmity. Therefore, ‘The weak things of the world has God chosen to put to shame the strong,’ and ‘out of the mouths of infants and of sucklings He has perfected praise, that He may destroy the enemy and the avenger.’ Divine grace operating in the infants and the unintelligent is especially conspicuous.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
