[[commentary]]
quote='''
‘For he hath delivered my soul from death: my eyes from tears, my feet from falling.’ He describes the future rest by a comparison with things here. Here, he says, the sorrows of death have compassed me, but there he hath delivered my soul from death. Here the eyes pour forth tears because of trouble, but there, no longer is there a tear to darken the eyes of those who are rejoicing in the contemplation of the beauty of the glory of God. ‘For God has wiped away every tear from every face.’ Here there is much danger of a fall; wherefore, even Paul said: ‘Let him who thinks he stands take heed lest he fall.’ But, there the steps are firm; life is immutable. No longer is there the danger of slipping into sin. For, there is neither rebellion of the flesh, nor cooperation of a woman in sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%2520114.html'
source_title="Homily on Psalm 114"
