[[commentary]]
quote='''
Now, since the Apostle ‘with face unveiled is transformed into his very image from glory to glory,’ he calls the grace given to him by the Lord his own glory.

‘To the end that my glory may sing to thee.’ The glory of the just man is the Spirit which is in him. Therefore, let him who sings by the Spirit say: ‘To the end that my glory may sing to thee, and I may not regret.’ He means, ‘No longer shall I do things which deserve the pricking and piercing of my heart at the remembrance of my sins.’ ‘O Lord my God, I will give praise to thee for ever.’ This is instead of ‘I will give thanks.’ For, when You granted me pardon because of my repentance and led me back into glory, taking away the shame of my sins, for this I shall give praise to You for all eternity. In fact, what space of time could be so great, that it could produce in my soul forgetfulness of such mighty benefits?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
