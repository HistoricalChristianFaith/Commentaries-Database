[[commentary]]
quote='''
He could not say what is false Who said “All things that the Father hath are Mine,” but one of the things which the Father hath is knowledge of that day and of that hour. In the passage in Matthew, then, the Lord made no mention of His own Person, as a matter beyond controversy, and said that the angels knew not and that His Father alone knew, tacitly asserting the knowledge of His Father to be His own knowledge too, because of what He had said elsewhere, “as the Father knoweth me even so know I the Father,” and if the Father has complete knowledge of the Son, nothing excepted, so that He knows all knowledge to dwell in Him, He will clearly be known as fully by the Son with all His inherent wisdom and all His knowledge of things to come. This modification, I think, may be given to the words of Matthew, “but my Father only.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520236.html'
source_title="Letter 236, Section 2"
