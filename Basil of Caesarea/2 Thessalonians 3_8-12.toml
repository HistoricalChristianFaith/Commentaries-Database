[[commentary]]
quote='''
You should know this, that he who works should do so, not to minister to his own needs by his works but to fulfil the commandment of the Lord Who said: “I was an hungred and ye gave me meat, etc.” For to be anxious for one’s self is absolutely forbidden by the Lord, when He says: “Be not anxious for your life, what ye shall eat, nor yet for your body, what ye shall put on,” and added: “For after all these things do the Gentiles seek.” Each therefore should put before himself as the aim in his work the service of those in want, not his own need. For thus he will both escape the charge of self-love and will receive the blessing bestowed on love of the brethren by the Lord—“Inasmuch as ye did it unto one of these my brethren, even these least, ye did it unto me.” And let no one think that the apostle’s words are opposed to ours—“that working they eat their own bread.” For this is addressed to the unruly and idle, meaning that for each to minister at least to himself and not to be burdensome to others is preferable to a life of idleness. “For we hear of some,” he says, “that walk among you disorderly, that work not at all, but are busybodies. Now them that are such we command and exhort that with quietness they work and eat their own bread.” And “working night and day, that we might not burden any one” has the same meaning, since the apostle for the sake of brotherly love and to exclude the disorderly submits himself to labours above what were prescribed to him. But it befits him who strives after perfection to work night and day, that he may have to give to him that is in need.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 42"
