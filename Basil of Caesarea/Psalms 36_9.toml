[[commentary]]
quote='''
And when, by means of the power that enlightens us, we fix our eyes on the beauty of the image of the invisible God, and through the image are led up to the supreme beauty of the spectacle of the archetype, then, I ween, is with us inseparably the Spirit of knowledge, in Himself bestowing on them that love the vision of the truth the power of beholding the Image, not making the exhibition from without, but in Himself leading on to the full knowledge. "No man knoweth the Father save the Son." And so "no man can say that Jesus is the Lord but by the Holy Ghost." For it is not said through the Spirit, but by the Spirit, and "God is a spirit, and they that worship Him must worship Him in spirit and in truth," as it is written "in thy light shall we see light," namely by the illumination of the Spirit, "the true light which lighteth every man that cometh into the world." It results that in Himself He shows the glory of the Only begotten, and on true worshippers He in Himself bestows the knowledge of God. Thus the way of the knowledge of God lies from One Spirit through the One Son to the One Father, and conversely the natural Goodness and the inherent Holiness and the royal Dignity extend from the Father through the Only-begotten to the Spirit. Thus there is both acknowledgment of the hypostases and the true dogma of the Monarchy is not lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 18"
