[[commentary]]
quote='''
Our eyes, however, do not always see her in her full size. Now she presents a perfectly rounded disc, now when diminished and lessened she shows a deficiency on one side. When waxing she is shadowed on one side, and when she is waning another side is hidden. Now it is not without a secret reason of the divine Maker of the universe, that the moon appears from time to time under such different forms. It presents a striking example of our nature. Nothing is stable in man; here from nothingness he raises himself to perfection; there after having hasted to put forth his strength to attain his full greatness he suddenly is subject to gradual deterioration, and is destroyed by diminution. Thus, the sight of the moon, making us think of the rapid vicissitudes of human things, ought to teach us not to pride ourselves on the good things of this life, and not to glory in our power, not to be carried away by uncertain riches, to despise our flesh which is subject to change, and to take care of the soul, for its good is unmoved. If you cannot behold without sadness the moon losing its splendour by gradual and imperceptible decrease, how much more distressed should you be at the sight of a soul, who, after having possessed virtue, loses its beauty by neglect, and does not remain constant to its affections, but is agitated and constantly changes because its purposes are unstable. What Scripture says is very true, “As for a fool he changeth as the moon.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25206-The%2520Creation%2520of%2520Luminous%2520Bodies.html'
source_title="The Hexaemeron, Homily 6: The Creation of Luminous Bodies"
