[[commentary]]
quote='''
For wherewith shall a man show humility, if he has no one in comparison with whom to show himself humble? Wherewith shall he show compassion, when he is cut off from the communion of the many? How can he practise himself in long-suffering, when there is none to withstand his wishes? If a man says he finds the teaching of the divine Scriptures sufficient to correct his character, he makes himself like a man who learns the theory of building but never practises the art, or who is taught the theory of working in metals but prefers not to put his teaching into practice. To whom the apostle says: “Not the hearers of the law are just with God, but the doers of the law shall be justified.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 7"
