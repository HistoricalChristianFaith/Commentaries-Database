[[commentary]]
quote='''
I am living, O evil thought, in the desert in which the Lord lived. Here is the oak of Mamre; here is the ladder going up to heaven, and the stronghold of the angels which Jacob saw; here is the wilderness in which the people purified received the law, and so came into the land of promise and saw God. Here is Mount Carmel where Elias sojourned and pleased God. Here is the plain whither Esdras withdrew, and at God’s bidding uttered all the God inspired books. Here is the wilderness in which the blessed John ate locusts and preached repentance to men. Here is the Mount of Olives, whither Christ came and prayed, and taught us to pray. Here is Christ the lover of the wilderness, for He says “Where two or three are gathered together in my name there am I in the midst of them.” “Here is the strait and narrow way which leadeth unto life.” Here are the teachers and prophets “wandering in deserts and in mountains and in dens and caves of the earth.” Here are apostles and evangelists and solitaries’ life remote from cities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 5"
