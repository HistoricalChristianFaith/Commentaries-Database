[[commentary]]
quote='''
And again we must rise for prayer preventing the dawn so that we are not caught by the day sleeping in bed, according to him who said: “Mine eyes prevented the dawn, that I might meditate on thy words.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 37"
