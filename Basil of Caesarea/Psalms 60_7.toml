[[commentary]]
quote='''
‘Galaad is mine, and Manasses is mine.’ Galaad is a grandson of Manasses; this is said in order that he may show that the succession of the patriarchs, from whom is Christ according to the flesh, comes down from God. ‘And Ephraim is the support of my head. Juda is my king.’ He will join together by agreement the parts that are severed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252059.html'
source_title="Homily on Psalm 59"
