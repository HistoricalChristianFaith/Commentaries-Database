[[commentary]]
quote='''
We must find out whether a man who has been involved in sins confesses the hidden things of shame despising the same, and becomes his own accuser; by which he both puts to shame and renounces his companions in evil doing, according to the words of the Psalmist, “Depart from me, all ye workers of iniquity,” and makes his future life secure from a further fall into like sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 10"
