[[commentary]]
quote='''
“And God said, Let the waters bring forth abundantly the moving creature that hath life” after their kind, “and fowl that may fly above the earth” after their kind. After the creation of the luminaries the waters are now filled with living beings and its own adornment is given to this part of the world. Earth had received hers from her own plants, the heavens had received the flowers of the stars, and, like two eyes, the great luminaries beautified them in concert. It still remained for the waters to receive their adornment. The command was given, and immediately the rivers and lakes becoming fruitful brought forth their natural broods; the sea travailed with all kinds of swimming creatures; not even in mud and marshes did the water remain idle; it took its part in creation. Everywhere from its ebullition frogs, gnats and flies came forth. For that which we see to-day is the sign of the past. Thus everywhere the water hastened to obey the Creator’s command. Who could count the species which the great and ineffable power of God caused to be suddenly seen living and moving, when this command had empowered the waters to bring forth life? Let the waters bring forth moving creatures that have life. Then for the first time is made a being with life and feeling. For though plants and trees be said to live, seeing that they share the power of being nourished and growing; nevertheless they are neither living beings, nor have they life. To create these last God said, “Let the water produce moving creatures.”

Every creature that swims, whether it skims on the surface of the waters, or cleaves the depths, is of the nature of a moving creature, since it drags itself on the body of the water. Certain aquatic animals have feet and walk; especially amphibia, such as seals, crabs, crocodiles, river horses and frogs; but they are above all gifted with the power of swimming. Thus it is said, Let the waters produce moving creatures. In these few words what species is omitted? Which is not included in the command of the Creator? Do we not see viviparous animals, seals, dolphins, rays and all cartilaginous animals? Do we not see oviparous animals comprising every sort of fish, those which have a skin and those which have scales, those which have fins and those which have not? This command has only required one word, even less than a word, a sign, a motion of the divine will, and it has such a wide sense that it includes all the varieties and all the families of fish. To review them all would be to undertake to count the waves of the ocean or to measure its waters in the hollow of the hand. “Let the waters produce moving creatures.” That is to say, those which people the high seas and those which love the shores; those which inhabit the depths and those which attach themselves to rocks; those which are gregarious and those which live dispersed, the cetaceous, the huge, and the tiny. It is from the same power, the same command, that all, small and great receive their existence. “Let the waters bring forth.” These words show you the natural affinity of animals which swim in the water; thus, fish, when drawn out of the water, quickly die, because they have no respiration such as could attract our air and water is their element, as air is that of terrestrial animals. The reason for it is clear. With us the lung, that porous and spongy portion of the inward parts which receives air by the dilatation of the chest, disperses and cools interior warmth; in fish the motion of the gills, which open and shut by turns to take in and to eject the water, takes the place of respiration. Fish have a peculiar lot, a special nature, a nourishment of their own, a life apart. Thus they cannot be tamed and cannot bear the touch of a man’s hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25207-The%2520Creation%2520of%2520Moving%2520Creatures.html'
source_title="The Hexaemeron, Homily 7: The Creation of Moving Creatures"

[[commentary]]
quote='''
“Let the earth bring forth the living creature.” Perhaps many of you ask why there is such a long silence in the middle of the rapid rush of my discourse. The more studious among my auditors will not be ignorant of the reason why words fail me. What! Have I not seen them look at each other, and make signs to make me look at them, and to remind me of what I have passed over? I have forgotten a part of the creation, and that one of the most considerable, and my discourse was almost finished without touching upon it. “Let the waters bring forth abundantly the moving creature that hath life and fowl that may fly above the earth in the open firmament of heaven.” I spoke of fish as long as eventide allowed: to-day we have passed to the examination of terrestrial animals; between the two, birds have escaped us. We are forgetful like travellers who, unmindful of some important object, are obliged, although they be far on their road, to retrace their steps, punished for their negligence by the weariness of the journey. So we have to turn back. That which we have omitted is not to be despised. It is the third part of the animal creation, if indeed there are three kinds of animals, land, winged and water.

“Let the waters” it is said “bring forth abundantly moving creature that hath life and fowl that may fly above the earth in the open firmament of heaven.” Why do the waters give birth also to birds? Because there is, so to say, a family link between the creatures that fly and those that swim. In the same way that fish cut the waters, using their fins to carry them forward and their tails to direct their movements round and round and straightforward, so we see birds float in the air by the help of their wings. Both endowed with the property of swimming, their common derivation from the waters has made them of one family. At the same time no bird is without feet, because finding all its food upon the earth it cannot do without their service. Rapacious birds have pointed claws to enable them to close on their prey; to the rest has been given the indispensable ministry of feet to seek their food and to provide for the other needs of life. There are a few who walk badly, whose feet are neither suitable for walking nor for preying. Among this number are swallows, incapable of walking and seeking their prey, and the birds called swifts who live on little insects carried about by the air. As to the swallow, its flight, which grazes the earth, fulfils the function of feet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25208-The%2520Creation%2520of%2520Fowl%2520and%2520Water%2520Animals.html'
source_title="The Hexaemeron, Homily 8: The Creation of Fowl and Water Animals"

[[commentary]]
quote='''
“Let the waters bring forth the moving creatures that have life, and fowl that may fly above the earth in the open firmament of heaven.” They received the command to fly above the earth because earth provides them with nourishment. “In the firmament of heaven,” that is to say, as we have said before, in that part of the air called οὐρανός, heaven, from the word ὁρᾶν, which means to see; called firmament, because the air which extends over our heads, compared to the æther, has greater density, and is thickened by the vapours which exhale from the earth. You have then heaven adorned, earth beautified, the sea peopled with its own creatures, the air filled with birds which scour it in every direction. Studious listener, think of all these creations which God has drawn out of nothing, think of all those which my speech has left out, to avoid tediousness, and not to exceed my limits; recognise everywhere the wisdom of God; never cease to wonder, and, through every creature, to glorify the Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25208-The%2520Creation%2520of%2520Fowl%2520and%2520Water%2520Animals.html'
source_title="The Hexaemeron, Homily 8: The Creation of Fowl and Water Animals"

[[commentary]]
quote='''
If we simply read the words of Scripture we find only a few short syllables. “Let the waters bring forth fowl that may fly above the earth in the open firmament of heaven,” but if we enquire into the meaning of these words, then the great wonder of the wisdom of the Creator appears. What a difference He has foreseen among winged creatures! How He has divided them by kinds! How He has characterized each one of them by distinct qualities! But the day will not suffice me to recount the wonders of the air. Earth is calling me to describe wild beasts, reptiles and cattle, ready to show us in her turn sights rivalling those of plants, fish, and birds. “Let the earth bring forth the living soul” of domestic animals, of wild beasts, and of reptiles after their kind. What have you to say, you who do not believe in the change that Paul promises you in the resurrection, when you see so many metamorphoses among creatures of the air? What are we not told of the horned worm of India! First it changes into a caterpillar, then becomes a buzzing insect, and not content with this form, it clothes itself, instead of wings, with loose, broad plates. Thus, O women, when you are seated busy with your weaving, I mean of the silk which is sent you by the Chinese to make your delicate dresses, remember the metamorphoses of this creature, conceive a clear idea of the resurrection, and do not refuse to believe in the change that Paul announces for all men.

But I am ashamed to see that my discourse oversteps the accustomed limits; if I consider the abundance of matters on which I have just discoursed to you, I feel that I am being borne beyond bounds; but when I reflect upon the inexhaustible wisdom which is displayed in the works of creation, I seem to be but at the beginning of my story. Nevertheless, I have not detained you so long without profit. For what would you have done until the evening? You are not pressed by guests, nor expected at banquets. Let me then employ this bodily fast to rejoice your souls. You have often served the flesh for pleasure, to-day persevere in the ministry of the soul. “Delight thyself also in the Lord and he shall give thee the desire of thine heart.” Do you love riches? Here are spiritual riches. “The judgments of the Lord are true and righteous altogether. More to be desired are they than gold and precious stones.” Do you love enjoyment and pleasures? Behold the oracles of the Lord, which, for a healthy soul, are “sweeter than honey and the honey-comb.” If I let you go, and if I dismiss this assembly, some will run to the dice, where they will find bad language, sad quarrels and the pangs of avarice. There stands the devil, inflaming the fury of the players with the dotted bones, transporting the same sums of money from one side of the table to the other, now exalting one with victory and throwing the other into despair, now swelling the first with boasting and covering his rival with confusion. Of what use is bodily fasting and filling the soul with innumerable evils? He who does not play spends his leisure elsewhere. What frivolities come from his mouth! What follies strike his ears! Leisure without the fear of the Lord is, for those who do not know the value of time, a school of vice. I hope that my words will be profitable; at least by occupying you here they have prevented you from sinning. Thus the longer I keep you, the longer you are out of the way of evil.

An equitable judge will deem that I have said enough, not if he considers the riches of creation, but if he thinks of our weakness and of the measure one ought to keep in that which tends to pleasure. Earth has welcomed you with its own plants, water with its fish, air with its birds; the continent in its turn is ready to offer you as rich treasures. But let us put an end to this morning banquet, for fear satiety may blunt your taste for the evening one. May He who has filled all with the works of His creation and has left everywhere visible memorials of His wonders, fill your hearts with all spiritual joys in Jesus Christ, our Lord, to whom belong glory and power, world without end. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25208-The%2520Creation%2520of%2520Fowl%2520and%2520Water%2520Animals.html'
source_title="The Hexaemeron, Homily 8: The Creation of Fowl and Water Animals"
