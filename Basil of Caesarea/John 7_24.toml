[[commentary]]
quote='''
But you must put up with my plain speaking. You have opened both ears to my slanderers. You heartily welcome all you hear without any enquiry. Not one of you distinguishes between lies and truth. Who ever suffered for lack of wicked accusations when struggling all alone? Who was ever convicted of lying in the absence of his victim? What plea does not sound plausible to the hearers when the reviler persists that such and such is the case, and the reviled is neither present nor hears what is urged against him? Does not even the accepted custom of this world teach you, in reference to these matters, that if any one is to be a fair and impartial hearer, he must not be entirely led away by the first speaker, but must wait for the defence of the accused, that so truth may be demonstrated by a comparison of the arguments on both sides? “Judge righteous judgment.” This precept is one of those most necessary for salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520204.html'
source_title="Letter 204, Section 2"
