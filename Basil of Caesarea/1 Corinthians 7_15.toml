[[commentary]]
quote='''
Married men who want to be admitted to such a life as ours must be questioned whether their action is approved by their wives, according to the apostle’s commandment, “The husband hath not power over his own body,” after which the applicant may be received before a number of witnesses. For obedience towards God takes precedence of everything else. But if the other party dissent and resist the step caring little for pleasing God, then let the apostle’s words be remembered, “God hath called us in peace”; and let the Lord’s commandment be fulfilled, “If any man cometh unto me, and hateth not his own father, and mother, and wife, and children, and the rest, he cannot be my disciple.” For obedience towards God takes precedence of everything else. However, we have known many cases in which through earnest prayer and perseverance in fasting the life of chastity has been attained, since as a result of bodily austerities the Lord often leads the recalcitrant to acquiesce in a right decision.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 12"
