[[commentary]]
quote='''
The right noble athlete Paul, wishing us not to rest in easy security on so much of our life as may have been lived well in the past, but, every day to attain further progress, says “Forgetting those things which are behind, and reaching forth unto those things which are before, I press toward the mark for the prize of the high calling.” So truly stands the whole of human life, not contented with what has gone before and fed not so much on the past as on the future. For how is a man the better for having his belly filled yesterday, if his natural hunger fails to find its proper satisfaction in food to-day? In the same way the soul gains nothing by yesterday’s virtue unless it be followed by the right conduct of to-day. For it is said “I shall judge thee as I shall find thee.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 1"
