[[commentary]]
quote='''
Concerning fallen virgins, who, after professing a chaste life before the Lord, make their vows vain, because they have fallen under the lusts of the flesh, our fathers, tenderly and meekly making allowance for the infirmities of them that fall, laid down that they might be received after a year, ranking them with the digamists. Since, however, by God’s grace the Church grows mightier as she advances, and the order of virgins is becoming more numerous, it is my judgment that careful heed should be given both to the act as it appears upon consideration, and to the mind of Scripture, which may be discovered from the context. Widowhood is inferior to virginity; consequently the sin of the widows comes far behind that of the virgins. Let us see what Paul writes to Timothy. “The young widows refuse: for when they have begun to wax wanton against Christ, they will marry; having damnation because they have cast off their first faith.” If, therefore, a widow lies under a very heavy charge, as setting at naught her faith in Christ, what must we think of the virgin, who is the bride of Christ, and a chosen vessel dedicated to the Lord? It is a grave fault even on the part of a slave to give herself away in secret wedlock and fill the house with impurity, and, by her wicked life, to wrong her owner; but it is forsooth far more shocking for the bride to become an adulteress, and, dishonouring her union with the bridegroom, to yield herself to unchaste indulgence. The widow, as being a corrupted slave, is indeed condemned; but the virgin comes under the charge of adultery. We call the man who lives with another man’s wife an adulterer, and do not receive him into communion until he has ceased from his sin; and so we shall ordain in the case of him who has the virgin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520199.html'
source_title="Letter 199, Canon 18"

[[commentary]]
quote='''
A widow whose name is in the list of widows, that is, who is supported by the Church, is ordered by the Apostle to be supported no longer when she marries.

There is no special rule for a widower. The punishment appointed for digamy may suffice. If a widow who is sixty years of age chooses again to live with a husband, she shall be held unworthy of the communion of the good gift until she be moved no longer by her impure desire. If we reckon her before sixty years, the blame rests with us, and not with the woman.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520199.html'
source_title="Letter 199, Canon 24"
