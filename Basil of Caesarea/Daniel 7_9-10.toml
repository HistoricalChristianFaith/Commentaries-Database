[[commentary]]
quote='''
Remember the vision of Daniel, and how he brings the judgment before us: “I beheld till the thrones were cast down, and the Ancient of days did sit, whose garment was white as snow, and the hair of His head like the pure wool;…and His wheels as burning fire. A fiery stream issued and came forth before Him; thousand thousands ministered unto Him, and ten thousand times ten thousand stood before Him: the judgment was set, and the books were opened,” clearly disclosing in the hearing of all, angels and men, things good and evil, things done openly and in secret, deeds, words, and thoughts all at once. What then must those men be who have lived wicked lives? Where then shall that soul hide which in the sight of all these spectators shall suddenly be revealed in its fulness of shame?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252046.html'
source_title="Letter 46, Section 5"
