[[commentary]]
quote='''
“Husbands love your wives.” Although formed of two bodies you are united to live in the communion of wedlock. May this natural link, may this yoke imposed by the blessing, reunite those who are divided. The viper, the cruelest of reptiles, unites itself with the sea lamprey, and, announcing its presence by a hiss, it calls it from the depths to conjugal union. The lamprey obeys, and is united to this venomous animal. What does this mean? However hard, however fierce a husband may be, the wife ought to bear with him, and not wish to find any pretext for breaking the union. He strikes you, but he is your husband. He is a drunkard, but he is united to you by nature. He is brutal and cross, but he is henceforth one of your members, and the most precious of all.

Let husbands listen as well: here is a lesson for them. The viper vomits forth its venom in respect for marriage; and you, will you not put aside the barbarity and the inhumanity of your soul, out of respect for your union? Perhaps the example of the viper contains another meaning. The union of the viper and of the lamprey is an adulterous violation of nature. You, who are plotting against other men’s wedlock, learn what creeping creature you are like. I have only one object, to make all I say turn to the edification of the Church. Let then libertines put a restraint on their passions, for they are taught by the examples set by creatures of earth and sea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25207-The%2520Creation%2520of%2520Moving%2520Creatures.html'
source_title="The Hexaemeron, Homily 7: The Creation of Moving Creatures"
