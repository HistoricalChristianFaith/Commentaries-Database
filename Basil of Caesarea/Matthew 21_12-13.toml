[[commentary]]
quote='''
Scripture shows us that buying and selling conducted at martyrs’ tombs is not fitting for us. For it is incumbent on Christians to be seen at the martyrs’ tombs or in their neighbourhood for no other reason than that of prayer and in order that, remembering how the Saints contended even unto death on behalf of godliness, we may be incited to a like zeal. We must remember the most fearful wrath of the Lord, Who though He was always and everywhere meek and lowly of heart, as it is written, yet on one class—those that bought and sold in the temple precincts—inflicted a castigation, since their trafficking turned the house of prayer into a den of thieves. Others may have corrupted the accustomed order of the Saints, and in place of praying for one another, worshipping God and lamenting to Him in company with others, asking His mercy for their sins, giving thanks for His benefits, and edifying people by the word of exhortation—all of which conduct we have known observed within our own memory—in place of this, I say, may have used the time and place as a market and fair and common emporium.

But it ill befits us now to follow their example and encourage such evil courses by joining in the matter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 40"
