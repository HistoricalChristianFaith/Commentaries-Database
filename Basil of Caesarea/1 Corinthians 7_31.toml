[[commentary]]
quote='''
Howbeit on every occasion careful preparation and a hospitable table are essential, provided we never pass the bounds of what is necessary. Let this be the limit of our hospitality, what is required by the needs of each visitor. “As using this world,” we read, “and not abusing it.” Now unnecessary expenditure is abuse. Have we no money? So let it be. Are our barns not full? Our life is lived from day to day, and the labours of our hands ensure its continuance. Why should we spend the food given by God to the hungry on the pleasures of the luxurious? In so doing we sin doubly, inflicting on the one side the sufferings caused by want and on the other the consequences of satiety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 20"
