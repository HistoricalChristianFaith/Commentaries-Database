[[commentary]]
quote='''
‘I will incline my ear to a parable; I will open my proposition on the psaltery.’ The prophet still introduces his own person, in order that his words may not be despicable as if brought forward from human invention. The things that I teach, he says, from the Spirit, these I proclaim to you, saying nothing of my own, nothing human; but, since I have been hearkening to the propositions of the Spirit, who hands down in mystery to us the wisdom of God, I am opening for you and am making manifest the proposition; moreover, I am opening not otherwise than through the psaltery. The psaltery is a musical instrument which gives out its sounds harmoniously with the melody of the voice. Accordingly, the rational psaltery is opened especially at that time when actions in harmony with the words are displayed. And he is a spiritual psaltery who has acted and has taught. He it is who opens the proposition in the psalms, setting forth the possibility of the teaching from his own example. As, therefore, he is conscious that there is nothing incongruous or out of tune in his life, so with confidence he utters the following words: ‘Why shall I fear in the evil day? The iniquity of my heel shall encompass me.’ By the evil day he means the day of judgment, concerning which it is said: ‘The day of the Lord, an incurable day, will come upon all the nations.’ ‘in which,’ says the prophet, ‘his own devices will beset each.’ At that time, then, because I have done nothing lawless on the way of life, I shall not fear the evil day. For, the signs of sinners will not stand around me nor beset me, in silent accusation bringing the proof against me. No one else will stand as accuser except yourself, or your deeds themselves, each standing near in its own form—adultery, theft, fornication—with the night, with the manner, with the peculiar circumstances characterizing it, and in general, each sin with its own character will be at hand bearing a clear reminder. The signs of sinners, then, will not beset me, ‘because I inclined my ear to a parable, I opened my proposition on the psaltery.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
