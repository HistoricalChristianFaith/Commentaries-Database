[[commentary]]
quote='''
We would not know that we were having these kindnesses done to us, unless ‘Thou hast made us drink the wine of sorrow.’ By wine he means the words which lead the hardened heart to conscious perception.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252059.html'
source_title="Homily on Psalm 59"
