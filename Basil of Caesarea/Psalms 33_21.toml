[[commentary]]
quote='''
‘For in him our heart shall rejoice; and in his holy name we have trusted.’ This agrees with the words in the beginning of the psalm: ‘Rejoice in the Lord, O ye just.’ And ‘For in him our heart shall rejoice.’ And it seems to me that consistently with these words the Apostle said: ‘In all these things we overcome because of him who has loved us,’ and ‘Not only this, but we exult in tribulations also.’ For, the psalmist in saying: ‘Our soul waiteth for the Lord,’ in order that he might show that it was not through force nor because he was oppressed by afflictions that he displayed patience, but that with all joy he accepts the ill-treatment for the name of the Lord, says, ‘Not only do we endure, but also “In him our heart shall rejoice, and in his holy name we have trusted.”’ It is sufficient for us to be named Christians to escape all abuse from our adversaries. The name of God is said to be holy, not entirely because it has a certain sanctifying power in its syllables, but because the whole specific character of God and the thought contained in what is specially contemplated concerning Him is holy and pure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
