[[commentary]]
quote='''
So too would groan the companies of the Saints. Phinehas, the zealous, because he can now no more take his spear into his hands and avenge the outrage on the bodies; and John the Baptist, because he cannot quit the realms above, as in his life he left the wilderness, to hasten to convict iniquity, and if he must suffer for the deed, rather lose his head than his freedom to speak. But, peradventure, like the blessed Abel, he too though dead yet speaks to us, and now exclaims, more loudly than John of old concerning Herodias, “It is not lawful for thee to have her.” For even if the body of John in obedience to the law of nature has received the sentence of God, and his tongue is silent, yet “the word of God is not bound.” John, when he saw the wedlock of a fellow servant set at nought, was bold to rebuke even to the death: how would he feel on seeing such an outrage wreaked on the marriage chamber of the Lord?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252046.html'
source_title="Letter 46, Section 1"
