[[commentary]]
quote='''
Since the Lord said: “Sell that thou hast, and give to the poor, and thou shalt have treasure in heaven: and come, follow me”; and again: “Sell that ye have, and give alms”; I consider that the man who leaves his family with such an end in view ought not to feel contemptuously towards his possessions, but to make an accurate survey of them all, as consecrated henceforward to the Lord, and dispose of them with all care, either personally if he has the power and necessary experience, or through men who have been chosen for the work after careful testing and have given proof of their powers of faithful and wise administration. He must realise that it is dangerous either to leave them to his relations or to dispose of them through any chance-comer. For if the man who is entrusted with the care of the King’s property, though often he has filched nothing from the store but only lost by neglect the interest he might have gained, is not absolved from blame; what condemnation must we expect them to undergo who have been slothful and negligent in the administration of possessions already dedicated to the Lord? Will they not be subject to the condemnation of the negligent? As it is written: “Cursed is every one that doeth the works of the Lord negligently.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 9"
