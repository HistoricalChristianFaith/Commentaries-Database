[[commentary]]
quote='''
Since the Lord said: “Sell that thou hast, and give to the poor, and thou shalt have treasure in heaven: and come, follow me”; and again: “Sell that ye have, and give alms”; I consider that the man who leaves his family with such an end in view ought not to feel contemptuously towards his possessions, but to make an accurate survey of them all, as consecrated henceforward to the Lord, and dispose of them with all care, either personally if he has the power and necessary experience, or through men who have been chosen for the work after careful testing and have given proof of their powers of faithful and wise administration. He must realise that it is dangerous either to leave them to his relations or to dispose of them through any chance-comer. For if the man who is entrusted with the care of the King’s property, though often he has filched nothing from the store but only lost by neglect the interest he might have gained, is not absolved from blame; what condemnation must we expect them to undergo who have been slothful and negligent in the administration of possessions already dedicated to the Lord? Will they not be subject to the condemnation of the negligent? As it is written: “Cursed is every one that doeth the works of the Lord negligently.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 9"

[[commentary]]
quote='''
In sum, however, what he said about poverty was this, that the rule ought to be that every one should limit his possessions to one garment. For one proof of this he quoted the words of John the Baptist “he that hath two coats let him impart to him that hath none;” and for another our Lord’s prohibition to His disciples to have two coats. He further added “If thou wilt be perfect go and sell that thou hast and give to the poor.” He said too that the parable of the pearl bore on this point, because the merchant, who had found the pearl of great price, went away and sold all that he had and bought it; and he added too that no one ought even to permit himself the distribution of his own property, but should leave it in the hands of the person entrusted with the duty of managing the affairs of the poor; and he proved the point from the acts of the apostles, because they sold their property and brought and laid it at the feet of the apostles, and by them it was distributed to each as every man had need. For he said that experience was needed in order to distinguish between cases of genuine need and of mere greedy begging. For whoever gives to the afflicted gives to the Lord, and from the Lord shall have his reward; but he who gives to every vagabond casts to a dog, a nuisance indeed from his importunity, but deserving no pity on the ground of want.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520150.html'
source_title="Letter 150, Section 3"

[[commentary]]
quote='''
Much time had I spent in vanity, and had wasted nearly all my youth in the vain labour which I underwent in acquiring the wisdom made foolish by God. Then once upon a time, like a man roused from deep sleep, I turned my eyes to the marvellous light of the truth of the Gospel, and I perceived the uselessness of “the wisdom of the princes of this world, that come to naught.” I wept many tears over my miserable life and I prayed that guidance might be vouchsafed me to admit me to the doctrines of true religion. First of all was I minded to make some mending of my ways, long perverted as they were by my intimacy with wicked men. Then I read the Gospel, and I saw there that a great means of reaching perfection was the selling of one’s goods, the sharing them with the poor, the giving up of all care for this life, and the refusal to allow the soul to be turned by any sympathy to things of earth. And I prayed that I might find some one of the brethren who had chosen this way of life, that with him I might cross life’s short and troubled strait.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520223.html'
source_title="Letter 223, Section 2"
