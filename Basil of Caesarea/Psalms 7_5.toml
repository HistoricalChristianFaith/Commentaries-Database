[[commentary]]
quote='''
‘And bring down my glory to the dust.’ The glory of the saints who possess citizenship in heaven and who store up for themselves good things in the everlasting treasuries is in heaven; but the glory of earthly men and those living according to the flesh is said to settle in the dust. He who has gloried in earthly wealth and who pursues the short-lived honor of men and has put his trust in corporeal advantages possesses a glory for himself which does not look up to heaven but remains in the dust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
