[[commentary]]
quote='''
Some again who are able to bear suffering even unto death are brought forward by God as an example to those who are loth to suffer trouble; as Lazarus, who, oppressed by so many wounds, is nowhere recorded to have asked anything of the rich man or to have complained at his fate. Wherefore also he received rest in the bosom of Abraham, as one who had had his evil things in his lifetime.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 55"
