[[commentary]]
quote='''
When I say this I am not forgetful of the words of the Apostle, who fled from human tribunals and reserved the defence of all his life for the unerring judgment seat, when he said, “With me it is a very small thing that I should be judged of you or of man’s judgment.” Your ears have been preoccupied by lying slanders, slanders that have touched my conduct, slanders that have touched my faith in God. Nevertheless, knowing, as I do, that three persons at once are injured by the slanderer, his victim, his hearer, and himself; as to my own wrong, I would have held my tongue, be sure; not because I despise your good opinion, (how could I, writing now as I do and earnestly pleading as I do that I may not lose it?) but because I see that of the three sufferers the one who is least injured is myself. It is true that I shall be robbed of you, but you are being robbed of the truth, and he who is at the bottom of all this is parting me from you, but he is alienating himself from the Lord, inasmuch as no one can be brought near to the Lord by doing what is forbidden. Rather then for your sakes than for mine, rather to rescue you from unendurable wrong am I pleading. For who could suffer a worse calamity than the loss of the most precious of all things, the truth?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520204.html'
source_title="Letter 204, Section 3"
