[[commentary]]
quote='''
‘Thou hast brought forth, O Lord, my soul from hell.’ For this healing, he who was going down from illness into hell but was led up from hell through the power of Him who overthrows for our sake the ruler of death, gives thanks to God. ‘Thou hast saved me from them that go down into the pit.’ Frequently, underground ditches which have been made into a prison for captives are called pits. Thus, there is the expression in Exodus: ‘From the firstborn of Pharao, unto the first-born of the captive woman who was in the pit.’ But, they even threw Jeremia also into a pit; and his brothers through jealousy confined Joseph in a pit without water. Each act, therefore, either draws us downward by oppressing us with sin, or lifts us upward by raising us on wings toward God. Therefore, You have saved me, who formerly lived a wicked life, and have separated me from those who go down to the dark and frigid region. This is the meaning of the words: ‘Thou hast upheld me.’ That is to say, ‘You have led me back from my downward course, so as not to give my enemies an occasion to rejoice over me.’ Now, this he said in another place: ‘Who hath made my feet like the feet of harts: and who setteth me upon high places.’ He calls the deliverance from the pit and the uplifting, the return to high places.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
