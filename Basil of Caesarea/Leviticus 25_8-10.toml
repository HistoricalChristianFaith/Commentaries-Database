[[commentary]]
quote='''
After seven years the Hebrew used to be freed from slavery. Seven weeks of years used in old times to make the famous jubilee, in which the land rested, debts were remitted, slaves were set free, and, as it were, a new life began over again, the old life from age to age being in a sense completed at the number seven. These things are types of this present life, which revolves in seven days and passes by, wherein punishments of slighter sins are inflicted, according to the loving care of our good Lord, to save us from being delivered to punishment in the age that has no end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520260.html'
source_title="Letter 260, Section 3"
