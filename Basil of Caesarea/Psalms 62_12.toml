[[commentary]]
quote='''
‘For thou wilt render to every man according to his works.’ ‘For with what measure you measure, it shall be measured back to you.’ Have you afflicted your brother? Expect the same. Did you snatch away the means of your inferiors, maltreat the poor, cover with disgrace by reproaches, blackmail, make false accusations, tamper with other’s marriages, swear falsely, change your ancestral boundaries, attack the possessions of orphans, oppress widows, prefer the present pleasure to the blessings in the promises? Expect the reciprocal measure of these. In fact, what each one sows, such also shall he reap. And yet, if you have performed any good acts, expect also manifold compensations in return for these. ‘For thou wilt render to every man according to his works.’ If you remember this sentence throughout all your life, you will be enabled to flee many sins, in Christ Jesus our Lord, to whom be glory and power forever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252061.html'
source_title="Homily on Psalm 61"
