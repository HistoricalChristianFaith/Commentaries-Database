[[commentary]]
quote='''
A proof of what I say lies in the fact that even many inferior objects are designated by this name. Nay, Holy Scripture does not even shrink from using this term in the case of things of a totally opposite character, as when it applies the title god to idols. “Let the gods,” it is written, “who have not made heaven and earth, be taken away, and cast beneath the earth;” and again, “the gods of the nations are idols.” And the witch, when she called up the required spirits for Saul, is said to have seen gods. Balaam too, an augur and seer, with the oracles in his hand, as Scripture says, when he had got him the teaching of the demons by his divine ingenuity, is described by Scripture as taking counsel with God. From many similar instances in Holy Scripture it may be proved that the name of God has no pre-eminence over other words which are applied to the divine, since, as has been said, we find it employed without distinction even in the case of things of quite opposite character. On the other hand we are taught by Scripture that the names holy, incorruptible, righteous, and good, are nowhere indiscriminately used of unworthy objects. It follows, then, that if they do not deny that the Holy Spirit is associated with the Son and with the Father, in the names which are specially applied, by the usage of true religion, to the divine nature alone, there is no reasonable ground for refusing to allow the same association in the case of that word alone which, as I have shown, is used as a recognised homonym even of demons and idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520189.html'
source_title="Letter 189, Section 5"
