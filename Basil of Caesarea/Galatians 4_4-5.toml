[[commentary]]
quote='''
You write that there are men among you who are trying to destroy the saving incarnation of our Lord Jesus Christ, and, so far as they can, are overthrowing the grace of the great mystery unrevealed from everlasting, but manifested in His own times, when the Lord, when He had gone through all things pertaining to the cure of the human race, bestowed on all of us the boon of His own sojourn among us. For He helped His own creation, first through the patriarchs, whose lives were set forth as examples and rules to all willing to follow the footsteps of the saints, and with zeal like theirs to reach the perfection of good works. Next for succour He gave the Law, ordaining it by angels in the hand of Moses; then the prophets, foretelling the salvation to come; judges, kings, and righteous men, doing great works, with a mighty hand. After all these in the last days He was Himself manifested in the flesh, “made of a woman, made under the law, to redeem them that were under the law, that we might receive the adoption of sons.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520261.html'
source_title="Letter 261, Section 1"
