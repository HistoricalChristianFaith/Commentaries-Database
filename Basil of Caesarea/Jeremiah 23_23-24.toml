[[commentary]]
quote='''
We ought therefore to fulfil every act as happening beneath the eyes of the Lord, and every thought as presided over by Him, remembering the voice of Him Who said: “Do not I fill heaven and earth? saith the Lord”; and: “I am a God at hand, and not a God far off”; and: “Where two or three are gathered together in my name, there am I in the midst of them.” For thus fear will continue steadily, hating iniquity, as it is written, and insolence and arrogance and the ways of evil men, and love will be perfected, fulfilling the Lord’s words: “I seek not mine own will, but the will of the Father that sent me,” since the soul is steadily convinced that good deeds are acceptable with the Judge and Umpire of our life, while their opposites receive condemnation from the same source.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 5"
