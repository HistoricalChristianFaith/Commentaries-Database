[[commentary]]
quote='''
‘The voice of the Lord is in power.’ As there is a voice in a wheel, so the voice of the Lord is in power. For, he who prevails over all things in Christ who strengthens him, he it is who hears the commands of the Lord and does them. Therefore, the voice of the Lord is not in the weak and dissolute soul, but in that which vigorously and powerfully achieves the good.

‘The voice of the Lord in magnificence.’ Magnificence is virtue extraordinarily great. He who performs great actions becomingly, such a one hears himself called magnificent. When the soul is not enslaved by the pride of the flesh, but assumes a greatness and dignity proper to it because of its awareness of its attributes received from God, in this soul is the voice of the Lord. Therefore, they who entertain noble thoughts of God, contemplating sublimely the reasons for creation, and being able to comprehend to a certain extent at least the goodness of God’s providence, and who besides are unsparing in their expenditures and are munificent in supplying the needs of their brothers, these are the magnificent men in whom the voice of the Lord dwells. In truth the magnificent man despises all bodily things, judging them deserving of no account in comparison with the unseen world. No difficult conditions will grieve the magnificent man; nor, in short, will any suffering greatly trouble him, nor will the sins of paltry and contemptible little men move him, nor the impurity of the flesh humble him. He is difficult of access to the humiliating passions, which cannot even look upon him because of the loftiness of his mind. There is mentioned also a certain magnificence of God, according to the saying: ‘Thy magnificence is elevated above the heavens.’ Those, then, who give great glory to God, elevate His magnificence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"
