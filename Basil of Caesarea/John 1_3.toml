[[commentary]]
quote='''
We are not to suppose that He used assistance in His action, or yet was entrusted with the ministry of each individual work by detailed commission, a condition distinctly menial and quite inadequate to the divine dignity. Rather was the Word full of His Father's excellences; He shines forth from the Father, and does all things according to the likeness of Him that begat Him. For if in essence He is without variation, so also is He without variation in power. And of those whose power is equal, the operation also is in all ways equal. And Christ is the power of God, and the wisdom of God. And so "all things are made through [by, A.V.] him," and "all things were created through [by, A.V.] him and for him," not in the discharge of any slavish service, but in the fulfilment of the Father's will as Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
