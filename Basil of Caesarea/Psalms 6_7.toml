[[commentary]]
quote='''
Do you hear what he says when he confesses his sin? ‘My eye is troubled through indignation.’ Yet, not only indignation, but also concupiscence and cowardice and envy trouble the eye of the soul; and, on the whole, all the passions are confounding and disturbing to the clear-sightedness of the soul. As it is not possible for a disturbed eye to apprehend accurately visible objects, so neither is it possible for a disturbed heart to devote itself to a consideration of the truth. It is necessary, then, to withdraw from the affairs of the world and, neither through the eyes nor the ears nor through any other means of perception, to introduce alien thoughts into the soul. The wars which arise from the pride of the flesh fill the interior with noises that are never silent and with irreconcilable discords.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
