[[commentary]]
quote='''
“Adam knew his wife.” Did he know her essence? It is said of Rebekah “She was a virgin, neither had any man known her,” and “How shall this be seeing I know not a man?” Did no man know Rebekah’s essence? Does Mary mean “I do not know the essence of any man”? Is it not the custom of Scripture to use the word “know” of nuptial embraces?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520235.html'
source_title="Letter 235, Section 3"
