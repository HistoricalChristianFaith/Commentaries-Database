[[commentary]]
quote='''
‘What profit is there in my blood, whilst I go down to corruption?’ ‘Why,’ he says, ‘have I cried out? And for what have I prayed to You, my Lord and my God? What need is there for me,’ he says, ‘of bodily comfort and much blood, since presently my body will be handed over to the general dissolution.’ ‘But I chastise my body and bring it into subjection,’ lest at any time, because my blood is in good condition and overheated, my corpulence may become an occasion of sin. Do not flatter your flesh with sleep and baths and soft coverings, but say always these words: ‘What profit is there in my blood, whilst I go down to corruption?’ Why do you treat with honor that which a little later shall perish? Why do you fatten and cover yourself with flesh? Or, do you not know that the more massive you make your flesh, the deeper is the prison you are preparing for your soul?

‘Shall dust confess to thee, or declare thy truth?’ How, indeed, shall man, made of clay and flesh, confess to You, his God? And how will he declare the truth, who has never given time to learning and has buried his mind in such a mass of flesh? For this reason, therefore, I waste away my flesh and I am unsparing of my blood which, indeed, is wont to be converted into flesh, that there may be no obstacle to me for confession or for the knowledge of truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
