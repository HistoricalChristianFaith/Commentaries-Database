[[commentary]]
quote='''
For, he says: ‘All my bones shall say: Lord, Lord, who is like to thee?’ Do you know the nature of intellectual bones? Perhaps, in reference to the mystery of our resurrection, the Church might use this expression, ‘All my bones shall say.’ Indeed, it is said: ‘Thus saith the Lord to these bones: Behold, I will send spirit of life into you, and I will lay sinews upon you, and will cause flesh to grow over you, and you shall live, and you shall know that I am the Lord.’ So, these bones, having taken on life and giving thanks for their resurrection, will say, ‘Lord, Lord, who is like to thee?’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
