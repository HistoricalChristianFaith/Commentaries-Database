[[commentary]]
quote='''
Assailants of robbers, if they are outside, are prohibited from the communion of the good thing. If they are clerics they are degraded from their orders. For, it is said, “All they that take the sword shall perish with the sword.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520217.html'
source_title="Letter 217, Canon 55"
