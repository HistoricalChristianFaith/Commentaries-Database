[[commentary]]
quote='''
Then further, it is plain to the fair enquirer that our Lord says many things to men, in the character of man; as for instance, “give me to drink” is a saying of our Lord, expressive of His bodily necessity; and yet the asker was not soulless flesh, but Godhead using flesh endued with soul. So in the present instance no one will be carried beyond the bounds of the interpretation of true religion, who understands the ignorance of him who had received all things according to the œconomy, and was advancing with God and man in favour and wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520236.html'
source_title="Letter 236, Section 1"
