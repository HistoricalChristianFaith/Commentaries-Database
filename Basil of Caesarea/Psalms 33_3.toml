[[commentary]]
quote='''
‘Sing to the Lord a new canticle.’ That is, not in the antiquity of written word, but in the newness of the spirit serve God. He who understands the law not in a corporeal sense, but who becomes acquainted with its spiritual meaning is the one who sings the new canticle. For, the ancient aged testament has passed and the new renewed canticle of the teaching of the Lord has succeeded, which revives our youth like an eagle, when we destroy the exterior man and are renewed day by day. But, he who ‘strains forward to what is before,’ always becomes newer than he was formerly. Therefore, becoming always newer than he was, he sings a newer canticle to God. But according to custom, that is said to be newer which is admirable or which has recently come into existence. If, then, you relate the wondrous manner and the whole surpassing nature of the Incarnation of the Lord, you will sing a newer and an unusual canticle; and, if you go on through the regeneration and renewal of the whole world which had grown old under its sin, and proclaim the mysteries of the Resurrection, you thus sing a canticle both new and recent.

‘Sing well unto him with a loud noise.’ Hear the command. ‘Sing well,’ with unwavering mind, with sincere affection. ‘Sing with a loud noise.’ Like certain brave soldiers, after the victory against the enemy, pour forth hymns to the Author of the victory. ‘Take courage,’ it is said, ‘I have overcome the world.’ What man is capable of fighting against the evil one, unless, fleeing to the protection of the power of our Commander in chief, by our faith in Him we smite our enemy and shoot him with arrows? Therefore, ‘sing well with a loud noise.’ But, the loud noise is a certain inarticulate sound, when those who are fighting side by side in a war shout out in unison with each other. Sing, then, in harmony and in agreement and in union through charity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
