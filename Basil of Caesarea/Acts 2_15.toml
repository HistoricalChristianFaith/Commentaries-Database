[[commentary]]
quote='''
Again at the third hour we must rise to prayer and collect the brotherhood, should they happen to be scattered to their various occupations and, remembering the gift of the Spirit given to the apostles at the third hour, we must worship all together that we too may become worthy to receive sanctification, at the same time asking that He may guide us and teach us what is expedient, after the fashion of him that said: “Create in me a clean heart, O God, and renew a right spirit within me. Cast me not away from thy presence, and take not thy holy spirit from me. Restore unto me the joy of thy salvation, and stablish me with thy guiding spirit.” And elsewhere: “Thy good spirit shall lead me into a straight land.” And then we resume our work again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 37"
