[[commentary]]
quote='''
‘Come, children, hearken to me: I will teach you the fear of the Lord.’ It is the voice of the devoted teacher, encouraging you to learn through his paternal mercy. In fact, the disciple is the spiritual child of the teacher. That one who receives from another formation in piety is, as it were, molded by him and is brought into existence, just as the fetus formed within her is brought into existence by one who is pregnant. For this reason Paul also taking up again the whole Church of the Galatians, which had fallen from its earlier teachings and which was abortive, as it were, and forming Christ in them anew, called them little children; and, when with pain and affliction he corrected those who had erred, he said that he was in labor in soul because of his grief at those who had fallen away. ‘My dear children, with whom I am in labor again, until Christ is formed in you.’ Therefore, ‘Come, children, hearken to me.’

What, really, does our spiritual father intend to teach? ‘I will teach you the fear of the Lord.’ When he ordered us above to fear the Lord, he also showed the profit that comes from fear, saying: ‘There is no want to them that fear him.’ At present also, they hand down to us a certain teaching of divine fear. Now, it is in the power of every one, even of the private individual, to say that it is necessary to be healthy; but, to say how health must be obtained, that certainly belongs to him who understands the art of medicine. Every fear is not a good and saving feeling, but there is also a hostile fear, which the prophet prays may not spring up in his soul, when he says: ‘Deliver my soul from the fear of the enemy.’ Fear of the enemy is that which produces in us a cowardliness with regard to death and misleads us to cower before distinguished persons. How, in fact, will he who fears these things be able in time of martyrdom to resist sin even to death and to pay his debt to the Lord, who died and rose again for us? He also, who is easily scared by the demons, has the fear of the enemy in him. On the whole, such a fear seems to be a passion born of unbelief. For, no one who believes that he has at hand a strong helper is frightened by any of those who attempt to throw him into confusion.

The fear, however, which is salutary and the fear which is productive of holiness, fear which springs up in the soul through devotion and not through passion, what kind would you have me say it is? Whenever you are about to rush headlong into sin, consider that fearful and intolerable tribunal of Christ, in which the Judge is seated upon a certain high and sublime throne, and every creature stands trembling beside His glorious presence, and we are about to be led forth, one by one, for the examination of the actions of our life. And beside him who has done many wicked deeds throughout his life certain horrible and dark angels stand, flashing fire from their eyes and breathing fire because of the bitterness of their wills, and with a countenance like the night because of their dejection and their hatred of man. Then, there is the deep pit and the darkness that has no outlet and the light without brightness, which has the power of burning in the darkness but is deprived of its splendor. Next is the poisonous and flesh-devouring class of worms, which eat greedily and are never satiated and cause unbearable pains by their voracity; and lastly, the severest punishment of all, that eternal reproach and shame. Fear these things, and being taught by this fear, check your soul, as with a bit, from its desire for wickedness.

The father promised to teach us this fear of the Lord, and not to teach indiscriminately, but to teach those who wish to heed him; not those who have long fallen away, but those who run to him through a desire of being saved; not ‘strangers to the covenants,’ but those who are reconciled through baptism by the word of the adoption of sons. Therefore, he says, ‘Come,’ that is, ‘because of your good deeds approach me, children,’ since you are considered worthy because of your regeneration to become sons of light. You, who have the ears of your heart open, hear; I shall teach you fear of the Lord, that fear which a little while ago our sermon described.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
