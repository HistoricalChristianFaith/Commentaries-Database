[[commentary]]
quote='''
The type is an exhibition of things expected, and gives an imitative anticipation of the future. So Adam was a type of "Him that was to come." Typically, "That rock was Christ;" and the water a type of the living power of the word; as He says, "If any man thirst, let him come unto me and drink." The manna is a type of the living bread that came down from heaven; and the serpent on the standard, of the passion of salvation accomplished by means of the cross, wherefore they who even looked thereon were preserved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 14"
