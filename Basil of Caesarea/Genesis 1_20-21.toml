[[commentary]]
quote='''
I am astonished at your requiring exactitude in Scripture, and arguing that there is something forced in the diction of the interpretation which gives the meaning of the original, but does not exactly render what is meant by the Hebrew word. Yet I must not carelessly pass by the question started by an enquiring mind. At the creation of the world, birds of the air and the fishes of the sea had the same origin; for both kinds were produced from the water. The reason is that both have the same characteristics. The latter swim in the water, the former in the air. They are therefore mentioned together. The form of expression is not used without distinction, but of all that lives in the water it is used very properly. The birds of the air and the fishes of the sea are subject to man; and not they alone, but all that passes through the paths of the sea. For every water-creature is not a fish, as for instance the sea monsters, whales, sharks, dolphins, seals, even sea-horses, sea-dogs, saw-fish, sword-fish, and sea-cows; and, if you like, sea nettles, cockles and all hard-shelled creatures of whom none are fish, and all pass through the paths of the sea; so that there are three kinds, birds of the air, fishes of the sea, and all water-creatures which are distinct from fish, and pass through the paths of the sea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520188.html'
source_title="Letter 188, Canon 15"
