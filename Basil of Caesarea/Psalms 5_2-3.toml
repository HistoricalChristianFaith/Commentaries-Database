[[commentary]]
quote='''
However, we must not imagine that because giving of thanks at every season has been commanded by the law and has been shown to be necessary to our life both by nature and reason, the formal times of prayer should be neglected in the brotherhoods, times which we have necessarily chosen because each has its own special memorial of blessings received from God. These are the times:

To begin with, dawn, so that the first movements of the soul and mind may be dedicated to God and nothing taken into consideration before we are gladdened by thoughts of God, as it is written: “I remembered God and was gladdened”; and so that we do not stir the body to work before doing what is said: “Unto thee will I pray, O Lord. In the morning thou shalt hear my voice: in the morning I shall stand before thee, and I shall see thee.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 37"
