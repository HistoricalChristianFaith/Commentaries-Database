[[commentary]]
quote='''
‘Keep thy tongue from evil, and thy lips from speaking guile.’ If you wish to live in the good days, if you love life, fulfill the precept of life. ‘He who loves me,’ He says, ‘will keep my commands.’ The first command is, ‘Keep thy tongue from evil, and thy lips from speaking guile.’ The most common and varied sin is that committed through the tongue. Were you provoked to anger? The tongue is already running on. Are you possessed by concupiscence? Before all things you have a tongue, a sort of pimp and promoter, as it were, assistant to the sin, subduing your neighbors by histrionic arts. Your tongue is also a weapon for your injustice, not uttering the words from the heart, but bringing forth those inspired by deceit. But, what need is there to put in words all the sins committed through the tongue? Our life is filled with faults due to the tongue. Obscenity, scurrility, foolish talk, unbecoming words, slanders, idle conversation, perjuries, false testimony, all these evils, and even more than these, are the work of the tongue. But, they who open their mouth against the glory of God and talk of injustice on high, do they perform their act of impiety by some other instrument and not through the instrumentality of the tongue? Since, then, ‘by thy words thou wilt be justified, and by thy words thou wilt be condemned,’ check your tongue from evil, and do not fabricate empty treasures with a deceitful tongue. Stop also your lips from speaking guile; instead, let the whole organ, which was given to you for the service of speech, have nothing to do with wicked deeds. Guile is hidden wrongdoing brought to bear against the neighbor under a pretense of better things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
