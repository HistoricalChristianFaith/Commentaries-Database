[[commentary]]
quote='''
‘The voice of the Lord breaketh the cedars.’ The cedar is at times praised by Scripture as a stable tree, free from decay, fragrant, and adequate for supplying shelter, but at times it is attacked as unfruitful and hard to bend, so that it offers a representation of impiety. ‘I have seen the wicked highly exalted, and lifted up like the cedars of Libanus.’ In this sense it is now accepted. For ‘the voice of the Lord breaketh the cedars.’ As this even happens in a magnificent soul, so He is said to break those vainly puffed up and magnifying themselves in the things of this world which are considered exalting, wealth, glory, power, beauty of body, influence, or strength. ‘Yea, the Lord breaks the cedars of Libanus.’ They who trample upon others’ affairs and from that gather false glory for themselves, they are cedars of Libanus. Just as the cedars, which are lofty in themselves, because they are produced on a high mountain become more conspicuous through the added height of the mountain, so also those leaning upon the perishable things of the world are cedars indeed through their false glory and vanity of mind; and they are called cedars of Libanus because they are glorying in the elevation which belongs to another and are raised up to their false glory by the earth and earthly circumstances, as if by the summit of Libanus.

However, the Lord does not break all the cedars, but those of Libanus. Since Libanus is a place of idolatry, the souls which lift themselves up, opposing the means of knowing God, are called cedars of Libanus and they deserve to be broken. There are also some cedars of God, which are covered by the branches of the vine transferred from Egypt, as we have learned in psalms: ‘The shadow of it covered the hills; and the branches thereof the cedars of God.’

Then, among other concepts of Christ, our Lord is said to be a vine: ‘I am the vine,’ He says, ‘you are the branches.’ The cedars are God’s, which for a time were unfruitful and fit for burning, but, coming under the protection of Christ and, as it were, clothed in Him, by the grace coming from Him they veil the unfruitfulness of their life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"
