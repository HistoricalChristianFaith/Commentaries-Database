[[commentary]]
quote='''
But if anyone wishes to know with accuracy and clearness the vigour which is linked with the desire of those who follow the Lord let him remember the words of the apostle about himself, spoken for our instruction: “If any man thinketh to have confidence in the flesh, I yet more: circumcised the eighth day, of the stock of Israel, of the tribe of Benjamin, a Hebrew of Hebrews; as touching the law a Pharisee; as touching zeal, persecuting the Church; as touching the righteousness which is in the law, found blameless. Howbeit what things were gain to me, these have I counted loss for Christ. Yea verily, and I count all things to be loss for the excellency of the knowledge of Christ Jesus our Lord; for whom I suffered the loss of all things and do count them to be but dung, that I may gain Christ.” Now let me say something bold but true. If the apostle likened the privileges given by God in the law for a season to the loathsome matters which are cast out from the body, which we hasten to remove out of sight, thinking them hindrances to the knowledge of Christ and the righteousness that is in Him and conformity with His death, what would anyone say about the regulations of men?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 8"
