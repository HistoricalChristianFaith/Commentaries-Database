[[commentary]]
quote='''
‘Who is the man that desireth life: who loveth to see good days?’ If anyone wishes life, he says, he does not live this common life, which brute beasts also live, but the true life which is not cut short by death. ‘For, now,’ it is said, ‘you have died and your life is hidden with Christ in God. When Christ, your life, shall appear, then you too will appear with him in glory.’ Therefore, Christ is, in truth, life; and our way of life in Him is true life. In like manner, also, the other days are good, which the prophet set forth in the promise. ‘Who is the man that desireth life: who loveth to see good days?’ For, the days of this life are evil, since this life, being the measure of the world, concerning which there is the saying: ‘The whole world is in the power of the evil one,’ is made quite like the nature of the world which it measures. But, these days are parts of this time. Therefore, the Apostle says: ‘Making the most of your time, because the days are evil.’ Likewise Jacob says: ‘The days of my pilgrimage are short and wretched.’ We are not, then, in life, but in death. And so the Apostle prayed, saying: ‘Who will deliver me from the body of this death?’ There is, however, a certain other life, to which these words call us; and, although at present our days are evil, yet some others are good, which night does not interrupt; for God will be their everlasting light, shining upon them with the light of His glory. Consequently, when you hear of the good days, do not think that your life here is set forth in the promises. In fact, these are the destructible days, which the sensible sun produces; but, nothing destructible could suitably be a gift for the indestructible. Now, if the soul is indestructible, its gifts are also indestructible. ‘This world as we see it is passing away.’ If the law has some shadow of the good things to come, consider I pray, certain sabbaths pleasant, holy, brought from the eternal days, new moons, festivals; but, consider, I pray you, in a manner proper to the spiritual law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
