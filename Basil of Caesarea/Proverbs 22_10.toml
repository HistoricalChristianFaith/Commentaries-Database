[[commentary]]
quote='''
But if some abide in disobedience, finding fault secretly but not making their discontent public, let them be expelled from the brotherhood since they cause doubts among the brethren and shake their readiness to fulfil the commandments, and teach disobedience and disaffection. For “cast out the pestilent fellow from the assembly and contention will go out with him.” And elsewhere: “Put away the wicked man from yourselves.... For a little leaven leaveneth the whole lump.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 47"
