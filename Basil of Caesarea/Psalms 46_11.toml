[[commentary]]
quote='''
‘The Lord of armies is with us: the God of Jacob is our protector.’ Exulting in the help of God, twice he called out the same words: ‘The Lord of armies is with us,’ as if trampling and leaping upon the enemy, inasmuch as he would suffer nothing from him because of his perfect trust in the Savior of our souls. ‘If God is for us, who is against us.’ He who gave the victory to Jacob and after the contest designated him as Israel, He it is who is our Protector; He fights for us. But we are silent, because ‘He himself is our peace, he it is who has made both one, that of the two he might create one new man.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"
