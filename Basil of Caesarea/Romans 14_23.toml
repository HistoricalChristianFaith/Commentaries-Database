[[commentary]]
quote='''
If "all that is not of faith is sin, and faith comes by hearing, and hearing by the Word of God," then everything outside holy Scripture, not being of faith, is sin.
'''
source_url=''
source_title="THE MORALS 80.22"

[[commentary]]
quote='''
If a man does not accept the decisions of the Superior he must gainsay him publicly or privately, if he has any strong reason on his side consonant with Scripture, or else keep silence and do what he is told. But if he is too shy to speak let him use others as intermediaries for this purpose, in order that if the command be contrary to Scripture he may deliver both himself and his brethren from harm; but if it be shown to have good reason on its side then he may free himself from vain and perilous doubts. “For he that doubteth is condemned if he eat because he eateth not of faith”—and that the simpler brethren fall not into the snare of disobedience. “For it is profitable,” saith the Lord, “that a great millstone should be hanged about his neck, and that he should be cast into the sea, than that he should cause one of these little ones to stumble.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 47"
