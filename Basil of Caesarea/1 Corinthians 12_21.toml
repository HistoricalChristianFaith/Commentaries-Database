[[commentary]]
quote='''
Our Lord Jesus Christ, Who has deigned to style the universal Church of God His body, and has made us individually members one of another, has moreover granted to all of us to live in intimate association with one another, as befits the agreement of the members. Wherefore, although we dwell far away from one another, yet, as regards our close conjunction, we are very near. Since, then, the head cannot say to the feet, I have no need of you, you will not, I am sure, endure to reject us; you will, on the contrary, sympathize with us in the troubles to which, for our sins, we have been given over, in proportion as we rejoice together with you in your glorying in the peace which the Lord has bestowed on you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520243.html'
source_title="Letter 243, Section 1"
