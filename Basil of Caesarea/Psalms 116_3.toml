[[commentary]]
quote='''
‘The sorrows of death,’ he says, ‘have compassed me; and the perils of hell have found me.’ Properly the sorrows of death have been agreed upon as the pains of childbirth, when the womb, distended with its burden, thrusts out the fetus; then, the generative parts, being compressed and stretched around the fetus by spasms and contractions of the muscles, produce in the mothers the sharpest pains and most bitter pangs. He transferred the name of these pains to those which besiege the animal in the division of soul and body at death. He says that he has suffered nothing moderately, but that he has been tried even to the sorrows of death and has arrived at the peril of the descent into hell. Now, did he endure only these things for which he is exalted, or did he endure these things frequently and unwillingly? Nothing that is forced is praiseworthy. But, look at the nobility of nature of the athlete. When ‘the sorrows of death compassed me, and the perils of hell found me,’ I was so far from succumbing to these trials that I willingly proposed to myself even much greater trials than these. Trouble and sorrow, I, as it were, willingly devised for myself; I was not unwillingly seized by them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%2520114.html'
source_title="Homily on Psalm 114"
