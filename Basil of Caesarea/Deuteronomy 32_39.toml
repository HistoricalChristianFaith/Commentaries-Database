[[commentary]]
quote='''
It is customary for Scripture to place sad conditions before the more auspicious ones, because the pleasure is sweeter when grief has gone before it. ‘I will kill,’ it says, ‘and I will make to live.’ He Himself causes the suffering and again restores; He struck, and His hands healed. The afflictions precede, in order that the graces may be lasting, since we then exert ourselves exceedingly for the preservation of what has been given.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
