[[commentary]]
quote='''
The man who is guilty of unintentional homicide has given sufficient satisfaction in eleven years. We shall, without doubt, observe what is laid down by Moses in the case of wounded men, and shall not hold a murder to have been committed in the case of a man who lies down after he has been struck, and walks again leaning on his staff. If, however, he does not rise again after he has been struck, nevertheless, from there being no intent to kill, the striker is a homicide, but an unintentional homicide.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520188.html'
source_title="Letter 188, Canon 11"
