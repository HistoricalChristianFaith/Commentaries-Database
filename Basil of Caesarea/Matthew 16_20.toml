[[commentary]]
quote='''
God alone is substantially and essentially God. When I say “alone” I set forth the holy and uncreated essence and substance of God. For the word “alone” is used in the case of any individual and generally of human nature. In the case of an individual, as for instance of Paul, that he alone was caught into the third heaven and “heard unspeakable words which it is not lawful for a man to utter,” and of human nature, as when David says, “as for man his days are as grass,” not meaning any particular man, but human nature generally; for every man is short-lived and mortal. So we understand these words to be said of the nature, “who alone hath immortality” and “to God only wise,” and “none is good save one, that is God,” for here “one” means the same as alone. So also, “which alone spreadest out the heavens,” and again “Thou shalt worship the Lord thy God and Him only shalt thou serve.” “There is no God beside me.” In Scripture “one” and “only” are not predicated of God to mark distinction from the Son and the Holy Ghost, but to except the unreal gods falsely so called. As for instance, “The Lord alone did lead them and there was no strange god with them,” and “then the children of Israel did put away Baalim and Ashtaroth, and did serve the Lord only.” And so St. Paul, “For as there be gods many and lords many, but to us there is but one god, the Father, of whom are all things; and one Lord Jesus Christ by Whom are all things.” Here we enquire why when he had said “one God” he was not content, for we have said that “one” and “only” when applied to God, indicate nature. Why did he add the word Father and make mention of Christ? Paul, a chosen vessel, did not, I imagine, think it sufficient only to preach that the Son is God and the Holy Ghost God, which he had expressed by the phrase “one God,” without, by the further addition of “the Father,” expressing Him of Whom are all things; and, by mentioning the Lord, signifying the Word by Whom are all things; and yet further, by adding the words Jesus Christ, announcing the incarnation, setting forth the passion and publishing the resurrection. For the word Jesus Christ suggests all these ideas to us. For this reason too before His passion our Lord deprecates the designation of “Jesus Christ,” and charges His disciples to “tell no man that He was Jesus, the Christ.” For His purpose was, after the completion of the œconomy, after His resurrection from the dead, and His assumption into heaven, to commit to them the preaching of Him as Jesus, the Christ. Such is the force of the words “That they may know Thee the only true God and Jesus Christ whom thou hast sent,” and again “Ye believe in God, believe also in me.” Everywhere the Holy Ghost secures our conception of Him to save us from falling in one direction while we advance in the other, heeding the theology but neglecting the œconomy, and so by omission falling into impiety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 3"
