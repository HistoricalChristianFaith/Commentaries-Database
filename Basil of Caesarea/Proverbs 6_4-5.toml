[[commentary]]
quote='''
Give then no sleep to your eyes or slumber to your eyelids that you may be delivered “as a roe from the net and a bird from the snare.” For, behold, you are passing through the midst of snares; you are treading on the top of a high wall whence a fall is perilous to the faller; wherefore do not straightway attempt extreme discipline; above all things beware of confidence in yourself, lest you fall from a height of discipline through want of training.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 2"
