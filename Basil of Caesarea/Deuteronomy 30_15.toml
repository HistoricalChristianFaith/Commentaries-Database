[[commentary]]
quote='''
What is it, then, that he means? That there is a certain balance constructed in the interior of each of us by our Creator, on which it is possible to judge the nature of things. ‘I have set before thee life and death, good and evil,’ two natures contrary to each other; balance them against each other in your own tribunal; weigh accurately which is more profitable to you: to choose a temporary pleasure and through it to receive eternal death, or, having chosen suffering in the practice of virtue, to use it to attain everlasting delights.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252061.html'
source_title="Homily on Psalm 61"
