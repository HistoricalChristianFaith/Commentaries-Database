[[commentary]]
quote='''
Who would not grieve over such things and say, “How is the faithful city become an harlot?” How would not the Lord Himself say to some of those who are now walking in the spirit of Jeremiah, “Hast thou seen what the virgin of Israel has done to me?” I betrothed her to me in trust, in purity, in righteousness, in judgment, in pity, and in mercy; as I promised her through Hosea the prophet. But she loved strangers, and while I, her husband, was yet alive, she is called adulteress, and is not afraid to belong to another husband.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252046.html'
source_title="Letter 46, Section 3"
