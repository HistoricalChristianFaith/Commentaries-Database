[[commentary]]
quote='''
I write all this with a view to testing the fruits of repentance. I do not decide such matters absolutely by time, but I give heed to the manner of penance. If men are in a state in which they find it hard to be weaned from their own ways and choose rather to serve the pleasures of the flesh than to serve the Lord, and refuse to accept the Gospel life, there is no common ground between me and them. In the midst of a disobedient and gainsaying people I have been taught to hear the words “Save thy own soul.” Do not then let us consent to perish together with such sinners. Let us fear the awful judgment. Let us keep before our eyes the terrible day of the retribution of the Lord. Let us not consent to perish in other men’s sins, for if the terrors of the Lord have not taught us, if so great calamities have not brought us to feel that it is because of our iniquity that the Lord has abandoned us, and given us into the hands of barbarians, that the people have been led captive before our foes and given over to dispersion, because the bearers of Christ’s name have dared such deeds; if they have not known nor understood that it is for these reasons that the wrath of God has come upon us, what common ground of argument have I with them?

But we ought to testify to them day and night, alike in public and in private. Let us not consent to be drawn away with them in their wickedness. Let us above all pray that we may do them good, and rescue them from the snare of the evil one. If we cannot do this, let us at all events do our best to save our own souls from everlasting damnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520217.html'
source_title="Letter 217, Canon 84"
