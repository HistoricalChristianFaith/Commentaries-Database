[[commentary]]
quote='''
However, where friendship is involved, to be defeated is in my opinion to win, and so I am quite ready to give you precedence, and retire from the contest as to which should maintain his own opinion. I have been the first to betake myself to writing, because I know that “charity beareth all things…endureth all things…seeketh not her own” and so “never faileth.” He who subjects himself to his neighbour in love can never be humiliated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252065.html'
source_title="Letter 65"
