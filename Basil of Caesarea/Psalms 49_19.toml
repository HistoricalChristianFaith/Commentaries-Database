[[commentary]]
quote='''
‘You shall go in to the generations of your fathers.’ I believe that he is saying about the sinner that he knows God as much as the practice of his fathers has handed down, but that he has acquired nothing more by his own power of thinking, nor has he added to his knowledge of the truth by himself. You, O God, he says, are as near and he has as great an idea about You as existed in the generation of his fathers. And here he displays the idle, wholly earthly and carnal spirit of a man who rolls in riches and luxury and who has his mind choked with the cares of life. Therefore, ‘he shall never see light.’ Having entrusted their guidance to blind teachers, they have deprived themselves of the advantage of light. This saying: ‘He shall go in to the generations of his fathers,’ also has some such meaning. That is to say, as regards those who are overtaken in an evil life and in doctrines coming, indeed, from their fathers, but alien to piety, not only will You punish them but You will also seek out the authors of the depraved teachings. This is what is meant by: ‘He shall go in to the generations of his fathers.’ Not only he who has evil thoughts about God is blameworthy, but also he who has led others to this destruction. Such are they who have received this evil from their forefathers, and who, because it has been strengthened by long continued custom, have difficulty in washing it out. ‘He shall never see light.’ For, they are sent ‘Into the darkness outside, there will be the weeping, and the gnashing of teeth.’ This they endure according to the just judgment of God, since in this life they hated the light because they did evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
