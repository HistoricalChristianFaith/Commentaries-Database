[[commentary]]
quote='''
(in Esai. 2.) Or the tower is a lofty watch-tower fitted for the guardianship of the city and the discovery of the enemy's approach. In like manner was our understanding given us to preserve the good, to guard against the evil. For the building up whereof the Lord bids us sit down and count our means if we have sufficient to finish.

But our Lord's intention in the above-mentioned example is not indeed to afford occasion or give liberty to any one to become His disciple or not, as indeed it is lawful not to begin a foundation, or not to treat of peace, but to show the impossibility of pleasing God, amidst those things which distract the soul, and in which it is in danger of becoming an easy prey to the snares and wiles of the devil.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Many men have had the courage to enter upon the solitary life; but to live it out to the end is a task which perhaps has been achieved by few. The end is not necessarily involved in the intention; yet in the end is the guerdon of the toil. No advantage, therefore, accrues to men who fail to press on to the end of what they have in view and only adopt the solitary’s life in its inception. Nay, they make their profession ridiculous, and are charged by outsiders with unmanliness and instability of purpose. Of these, moreover, the Lord says, who wishing to build a house “sitteth not down first and counteth the cost whether he have sufficient to finish it? lest haply after he hath laid the foundation and is not able to finish it,” the passers-by “begin to mock him saying,” this man laid a foundation “and was not able to finish.” Let the start, then, mean that you heartily advance in virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 1"
