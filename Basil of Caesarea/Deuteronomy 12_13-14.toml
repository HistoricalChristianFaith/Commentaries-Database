[[commentary]]
quote='''
It is an extraordinary statement, but it is none the less true, that the Spirit is frequently spoken of as the place of them that are being sanctified, and it will become evident that even by this figure the Spirit, so far from being degraded, is rather glorified. For words applicable to the body are, for the sake of clearness, frequently transferred in scripture to spiritual conceptions. Accordingly we find the Psalmist, even in reference to God, saying "Be Thou to me a champion God and a strong place to save me" and concerning the Spirit "behold there is place by me, and stand upon a rock." Plainly meaning the place or contemplation in the Spirit wherein, after Moses had entered thither, he was able to see God intelligibly manifested to him. This is the special and peculiar place of true worship; for it is said "Take heed to thyself that thou offer not thy burnt offerings in every place . . . but in the place the Lord thy God shall choose." Now what is a spiritual burnt offering? "The sacrifice of praise." And in what place do we offer it? In the Holy Spirit. Where have we learnt this? From the Lord himself in the words "The true worshippers shall worship the Father in spirit and in truth." This place Jacob saw and said "The Lord is in this place." It follows that the Spirit is verily the place of the saints and the saint is the proper place for the Spirit, offering himself as he does for the indwelling of God, and called God's Temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 26"
