[[commentary]]
quote='''
The good Shepherd, Who left them that had not wandered away, is seeking after you. If you give yourself to Him He will not hold back. He, in His love, will not disdain even to carry you on His own shoulders, rejoicing that He has found His sheep which was lost. The Father stands and awaits your return from your wandering. Only come back, and while you are yet afar off, He will run and fall upon your neck, and, now that you are cleansed by repentance, will enwrap you in embraces of love. He will clothe with the chief robe the soul that has put off the old man with all his works; He will put a ring on hands that have washed off the blood of death, and will put shoes on feet that have turned from the evil way to the path of the Gospel of peace. He will announce the day of joy and gladness to them that are His own, both angels and men, and will celebrate your salvation far and wide. For “verily I say unto you,” says He, “there is joy in heaven before God over one sinner that repenteth.” If any of those who think they stand find fault because of your quick reception, the good Father will Himself make answer for you in the words, “It was meet that we should make merry and be glad for this” my daughter “was dead and is alive again, was lost and is found.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252046.html'
source_title="Letter 46, Section 6"
