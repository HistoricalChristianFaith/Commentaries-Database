[[commentary]]
quote='''
I am told that there are some who are endeavouring to deprave the right doctrine of the Lord’s incarnation by perverse opinions, and I therefore call upon them through you to hold off from those unreasonable views, which some are reported to me to hold. I mean that God Himself was turned into flesh; that He did not assume, through the Holy Mary, the nature of Adam, but, in His own proper Godhead, was changed into a material nature.

This absurd position can be easily confuted. The blasphemy is its own conviction, and I therefore think that, for one who fears the Lord, the mere reminder is enough. If He was turned, then He was changed. But far be it from me to say or think such a thing, when God has declared, “I am the Lord, I change not.” Moreover, how could the benefit of the incarnation be conveyed to us, unless our body, joined to the Godhead, was made superior to the dominion of death? If He was changed, He no longer constituted a proper body, such as subsisted after the combination with it of the divine body. But how, if all the nature of the Only-begotten was changed, could the incomprehensible Godhead be circumscribed within the limit of the mass of a little body?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520262.html'
source_title="Letter 262, Sections 1-2"
