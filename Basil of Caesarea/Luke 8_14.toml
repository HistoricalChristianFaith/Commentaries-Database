[[commentary]]
quote='''
For how can contrition of heart, or humility of mind, or freedom from anger, grief, worries, and, in brief, from all harmful passions of the soul, be achieved in the midst of wealth and the cares of this life, attachment to and familiarity with external things? Finally, when a man is not allowed to be careful even about necessary things, such as food and clothing, who could suppose that he may be detained by the bad cares of wealth as if by thorns, which hinder the seed sown by the Husbandman of our souls from bearing fruit? For our Lord said: “But these are they which fell among the thorns, which are choked by cares and riches and pleasures of life, and bring no fruit to perfection.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 8"
