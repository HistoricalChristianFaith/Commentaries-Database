[[commentary]]
quote='''
(Hom. in Ps. 14.) Now this mode of avarice is rightly called in the Greek τόκος, from producing, because of the fruitfulness of the evil. Animals in course of time grow up and produce, but interest as soon as it is born begins to bring forth. Animals which bring forth most rapidly cease soonest from breeding, but the money of the avaricious goes on increasing with time. Animals when they transfer their bringing forth to their own young, themselves cease to breed, but the money of the covetous both produces an increase, and renews the capital. Touch not then the destructive monster. For what advantage that the poverty of to-day is escaped, if it falls upon us repeatedly, and is increased? Reflect then how canst thou restore thyself? Whence shall thy money be so multiplied as that it will partly relieve thy want, partly refresh thy capital, and besides bring forth interest? But thou sayest, How shall I get my living? I answer, work, serve, last of all, beg; any thing is more tolerable than borrowing upon interest. But thou sayest, what is that lending to which the hope of repayment is not attached? Consider the excellence of the words, and thou wilt admire the mercifulness of the author. When thou art about to give to a poor man from regard to divine charity, it is both a lending and a gift; a gift indeed, because no return is hoped for; lending, because of the beneficence of God, who restores it in its turn. Hence it follows, And great shall be your reward. Dost thou not wish the Almighty to be bound to restore to thee? Or, should He make some rich citizen thy security, dost thou accept him, but reject God standing as security for the poor?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Listen, you rich men, to what we advise the poor because of your inhumanity: rather to persevere in their terrible situations than to accept the misfortunes which come from the payment of interest. But, if you obey the Lord, what need is there of these words? What is the counsel of the Master? ‘Lend to those from whom you do not hope to receive in return.’ ‘And what sort of a loan is this,’ he says, ‘to which there is no hope of a return attached?’ Consider the force of the statement, and you will admire the kindness of the Lawmaker. Whenever you have the intention of providing for a poor man for the Lord’s sake, the same thing is both a gift and a loan, a gift because of the expectation of no repayment, but a loan because of the great gift of the Master who pays in his place, and who, receiving trifling things through a poor man, will give great things in return for them. ‘He that hath mercy on the poor, lendeth to God.’ Do you not wish to have the Lord of the universe answerable to you for payment? Or, if one of the rich men in the city would promise you the payment for the others, would you accept his pledge? But, you do not accept God as the surety for the poor. Give the money, since it is lying idle, without weighing it down with additional charges, and it will be good for both of you. There will be for you the assurance of its safety because of his custody; for him receiving it, the advantage from its use. And, if you are seeking additional payment, be satisfied with that from the Lord. He Himself will pay the interest for the poor. Expect kindly acts from Him who is truly kind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252014.html'
source_title="Homily on Psalm 14"
