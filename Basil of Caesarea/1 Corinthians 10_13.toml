[[commentary]]
quote='''
But if the temptation is for a season, bear it, ye noble athletes of Christ. If the world is being delivered to complete, and final destruction, let us not lose heart for the present, but let us await the revelation from heaven, and the manifestation of our great God and Saviour Jesus Christ. If all creation is to be dissolved, and the fashion of this world transformed, why should we be surprised that we, who are apart of creation, should feel the general woe, and be delivered to afflictions which our just God inflicts on us according to the measure of our strength, not letting us “be tempted above that we are able, but with the temptation giving us a way to escape that we may be able to bear it”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520139.html'
source_title="Letter 139, Section 1"

[[commentary]]
quote='''
Are we paying the penalty of our sins? Then our plagues are such as to save us for the future from the wrath of God. Are we called upon through these temptations to fight for the truth? Then the righteous Giver of the prizes will not suffer us to be tried above that which we are able to bear, but, in return for our previous struggles, will give us the crown of patience and of hope in Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520140.html'
source_title="Letter 140, Section 1"

[[commentary]]
quote='''
The Lord ordereth “all things in measure and weight,” and brings on us the temptations which do not exceed our power to endure them, but tests all that fight in the cause of true religion by affliction, not suffering them to be tempted above that they are able to bear. He gives tears to drink in great measure to all who ought to show whether in their affections they are preserving their gratitude to Him. Especially in His dispensation concerning you has He shown His loving-kindness, not suffering such a persecution to be brought on you by your enemies as might turn some of you aside, or cause you to swerve from the faith of Christ. He has matched you with adversaries who are of small importance and easy to be repelled, and has prepared the prize for your patience in your victory over them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520219.html'
source_title="Letter 219, Section 1"
