[[commentary]]
quote='''
But I see that for a long time you have been asking me for an account of the creation of man, and I think I can hear you all cry in your hearts, We are being taught the nature of our belongings, but we are ignorant of ourselves. Let me then speak of it, since it is necessary, and let me put an end to my hesitation. In truth the most difficult of sciences is to know one’s self. Not only our eye, from which nothing outside us escapes, cannot see itself; but our mind, so piercing to discover the sins of others, is slow to recognise its own faults. Thus my speech, after eagerly investigating what is external to myself, is slow and hesitating in exploring my own nature. Yet the beholding of heaven and earth does not make us know God better than the attentive study of our being does; I am, says the Prophet, fearfully and wonderfully made; that is to say, in observing myself I have known Thy infinite wisdom. And God said “Let us make man.” Does not the light of theology shine, in these words, as through windows; and does not the second Person show Himself in a mystical way, without yet manifesting Himself until the great day? Where is the Jew who resisted the truth and pretended that God was speaking to Himself? It is He who spoke, it is said, and it is He who made. “Let there be light and there was light.” But then their words contain a manifest absurdity. Where is the smith, the carpenter, the shoemaker, who, without help and alone before the instruments of his trade, would say to himself; let us make the sword, let us put together the plough, let us make the boot? Does he not perform the work of his craft in silence? Strange folly, to say that any one has seated himself to command himself, to watch over himself, to constrain himself, to hurry himself, with the tones of a master! But the unhappy creatures are not afraid to calumniate the Lord Himself. What will they not say with a tongue so well practised in lying? Here, however, words stop their mouth; “And God said let us make man.” Tell me; is there then only one Person? It is not written “Let man be made,” but, “Let us make man.” The preaching of theology remains enveloped in shadow before the appearance of him who was to be instructed, but, now, the creation of man is expected, that faith unveils herself and the dogma of truth appears in all its light. “Let us make man.” O enemy of Christ, hear God speaking to His Co-operator, to Him by Whom also He made the worlds, Who upholds all things by the word of His power. But He does not leave the voice of true religion without answer. Thus the Jews, race hostile to truth, when they find themselves pressed, act like beasts enraged against man, who roar at the bars of their cage and show the cruelty and the ferocity of their nature, without being able to assuage their fury. God, they say, addresses Himself to several persons; it is to the angels before Him that He says, “Let us make man.” Jewish fiction! a fable whose frivolity shows whence it has come. To reject one person, they admit many. To reject the Son, they raise servants to the dignity of counsellors; they make of our fellow slaves the agents in our creation. The perfect man attains the dignity of an angel; but what creature can be like the Creator? Listen to the continuation, “In our image.” What have you to reply? Is there one image of God and the angels? Father and Son have by absolute necessity the same form, but the form is here understood as becomes the divine, not in bodily shape, but in the proper qualities of Godhead. Hear also, you who belong to the new concision, and who, under the appearance of Christianity, strengthen the error of the Jews. To Whom does He say, “in our image,” to whom if it is not to Him who is “the brightness of His glory and the express image of His person,” “the image of the invisible God”? It is then to His living image, to Him Who has said “I and my Father are one,” “He that hath seen me hath seen the Father,” that God says “Let us make man in our image.” Where is the unlikeness in these Beings who have only one image?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25209-The%2520Creation%2520of%2520Terrestrial%2520Animals.html'
source_title="The Hexaemeron, Homily 9: The Creation of Terrestrial Animals"
