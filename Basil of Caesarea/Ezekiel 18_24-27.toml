[[commentary]]
quote='''
Vain then is the labour of the righteous man, and free from blame is the way of the sinner, if a change befall, and the former turn from the better to the worse, and the latter from the worse to the better. So we hear from Ezekiel teaching as it were in the name of the Lord, when he says, “if the righteous turneth away and committeth iniquity, I will not remember the righteousness which he committed before; in his sin he shall die,” and so too about the sinner; if he turn away from his wickedness, and do that which is right, he shall live. Where were all the labours of God’s servant Moses, when the gainsaying of one moment shut him out from entering into the promised land? What became of the companionship of Gehazi with Elissæus, when he brought leprosy on himself by his covetousness? What availed all Solomon’s vast wisdom, and his previous regard for God, when afterwards from his mad love of women he fell into idolatry? Not even the blessed David was blameless, when his thoughts went astray and he sinned against the wife of Uriah. One example were surely enough for keeping safe one who is living a godly life, the fall from the better to the worse of Judas, who, after being so long Christ’s disciple, for a mean gain sold his Master and got a halter for himself. Learn then, brother, that it is not he who begins well who is perfect. It is he who ends well who is approved in God’s sight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 2"
