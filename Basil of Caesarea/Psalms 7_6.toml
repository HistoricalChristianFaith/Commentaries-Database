[[commentary]]
quote='''
‘Rise up, O Lord, in thy anger: and be exalted in the borders of my enemy.’ The prophet prays that the mystery of the Resurrection be accomplished now, or the elevation on the cross, which was to take place after the wickedness of the enemies had mounted to its uttermost limits. Or the expression, ‘And be thou exalted in the borders of my enemy,’ suggests some such meaning as this: to whatever peak the evil shall ascend, even if it shall go on, pouring out to an immeasurable and unlimited degree, you are able in the abundance of your power, like a good physician, anticipating the limits of its spreading, to stop the disease which is increasing as it creeps along, and to break off its course by corrective blows.

‘And arise, O Lord my God, in the precept which thou hast commanded.’ This saying can also be referred to the mystery of the Resurrection, since the prophet is exhorting the Judge to arise in order to avenge every sin and to bring to fulfillment the commands previously laid on us. It can also be accepted in reference to the state at that time of the affairs of the prophet, who was exhorting God to rise in order to avenge the precept which He had enjoined. There was a command, ‘Honor thy father and thy mother,’ given by God, which indeed his son had transgressed. Therefore, he urges God, for the correction of that son himself and for the restraint of the many, not to be long-suffering, but to rise in anger and, having risen up, to avenge His own command. ‘For You will not avenge me,’ he says, ‘but Your own despised precept, which You Yourself enjoined.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
