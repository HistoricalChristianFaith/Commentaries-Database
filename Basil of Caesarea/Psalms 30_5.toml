[[commentary]]
quote='''
‘For wrath is in his indignation; and life in his good will.’ First, he mentioned something depressing, wrath in the indignation of God; then, something brighter, life in His good will. This seems to be tautology to those who are not able to attain to an exact understanding of the meanings, since the prophet says that wrath is in the indignation of God, as if wrath and indignation were the same thing; but, there is a very great difference. Indignation is the decision to inflict some particular sad punishments upon a man deserving of them; but wrath is the suffering and the punishment already being inflicted by the just Judge according to the measure of the wrong done. What I say will become clearer from an example. The doctor, having diagnosed the swollen and festering part, judges that an incision is necessary for the sufferer. This, Scripture calls indignation. But, after the decision of the doctor on the remedy, the operation then follows, bringing the remedies decided upon to accomplishment; and the knife, cutting in, also causes pain for the one who is being cut. This is called the wrath of God. Come, then, to the proposition, and you will find the consequence of this opinion. ‘For wrath is in his indignation,’ a penalty, according to the just judgment of God; but, ‘life in his good will.’ What, then, does he say? That what God wills is this, that all share His life; and misfortunes are not wrought by His will but are brought on by the just deserts of those who have sinned. Therefore, God grants life to each one according to His own will, and each one stores up wrath for himself ‘On the day of wrath and of the revelation and of the just judgment of God.’ It is customary for Scripture to place sad conditions before the more auspicious ones, because the pleasure is sweeter when grief has gone before it. ‘I will kill,’ it says, ‘and I will make to live.’ He Himself causes the suffering and again restores; He struck, and His hands healed. The afflictions precede, in order that the graces may be lasting, since we then exert ourselves exceedingly for the preservation of what has been given.

‘In the evening weeping shall have place, and in the morning gladness.’ Recall the time of the passion of the Lord, and you will find the meaning. For, in the evening, weeping overwhelmed the disciples of the Lord when they saw Him hanging on the cross; but, in the morning, gladness, when after the Resurrection they ran about with joy, giving each other the good tidings of the appearance of the Lord. Or, perhaps, even in general this time is called evening in which those who have wept blessedly will be consoled when morning comes. ‘Blessed are they who mourn, for they shall be comforted.’ ‘Blessed are they who weep, for they shall laugh.’ They, therefore, who spend the days of their life, which is already at its consummation and declining toward its setting, in weeping for their sins, these will be glad in that true morning which is approaching. ‘They that sow in tears shall reap in joy,’ of course, in the future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
