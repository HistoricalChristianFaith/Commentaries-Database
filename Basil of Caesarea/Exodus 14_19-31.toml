[[commentary]]
quote='''
The sea and the cloud for the time being led on through amazement to faith, but for the time to come they typically prefigured the grace to be. "Who is wise and he shall understand these things?"—how the sea is typically a baptism bringing about the departure of Pharaoh, in like manner as this washing causes the departure of the tyranny of the devil. The sea slew the enemy in itself: and in baptism too dies our enmity towards God. From the sea the people came out unharmed: we too, as it were, alive from the dead, step up from the water "saved" by the "grace" of Him who called us. And the cloud is a shadow of the gift of the Spirit, who cools the flame of our passions by the "mortification" of our "members."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 14"
