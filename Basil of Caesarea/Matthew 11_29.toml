[[commentary]]
quote='''
This subject has already been treated summarily, but since quite rightly you want it to be further elucidated, because as is the superintendent and ruler so for the most part the ruled is wont to become, it is necessary not to pass it over cursorily. The Superior then, mindful of the apostle’s injunction, “Be thou an example to them that believe,” must make his life a clear example of every commandment of the Lord so as to leave the taught no chance of thinking that the commandment of the Lord is impossible or may be despised. First of all then—which truly comes first—humility must be so practised by him in the love of Christ that even when he is silent the example of his deeds may stand out more strongly than any word as a means of teaching. For if this is the standard of Christianity, the imitation of Christ according to the measure of His Incarnation as is appropriate to the calling of each, those who are entrusted with the guidance of the many ought by their own mediation to lead on the weaker to the imitation of Christ, as the blessed Paul says: “Be ye imitators of me, even as I also am of Christ.” So they should first make themselves an accurate model by observing the standard of humility handed down by our Lord Jesus Christ. For “learn of me” He says “for I am meek and lowly of heart.” Let meekness of character then and lowliness of heart characterise the Superior. For if the Lord was not ashamed of ministering to His own bond-servants, but was willing to be a servant of the earth and the clay which He had made and fashioned into man (for “I am in the midst of you as he that serveth” He saith), what must we do to our equals that we may deem to have attained the imitation of Him? This one thing then is essential in the Superior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 43"
