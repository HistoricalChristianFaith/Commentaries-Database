[[commentary]]
quote='''
The ninth hour is handed down to us as necessary for prayer by the apostles themselves in the Acts, which tell how Peter and John went up into the temple at the ninth hour of prayer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 37"
