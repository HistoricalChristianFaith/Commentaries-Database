[[commentary]]
quote='''
Again, the Spirit is conceived of, in relation to the distribution of gifts, as a whole in parts. For we all are "members one of another, having gifts differing according to the grace that is given us." Wherefore "the eye cannot say to the hand, I have no need of thee; nor again the head to the feet, I have no need of you," but all together complete the Body of Christ in the Unity of the Spirit, and render to one another the needful aid that comes of the gifts. "But God hath set the members in the body, every one of them, as it hath pleased Him." But "the members have the same care for one another," according to the inborn spiritual communion of their sympathy. Wherefore, "whether one member suffer, all the members suffer with it; or one member be honoured, all the members rejoice with it." And as parts in the whole so are we individually in the Spirit, because we all "were baptized in one body into one spirit."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 26"
