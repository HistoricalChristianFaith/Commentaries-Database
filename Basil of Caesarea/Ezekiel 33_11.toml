[[commentary]]
quote='''
If you have any hope of salvation; if you have the least thought of God, or any desire for good things to come; if you have any fear of the chastisements reserved for the impenitent, awake without delay, lift up your eyes to heaven, come to your senses, cease from your wickedness, shake off the stupor that enwraps you, make a stand against the foe who has struck you down. Make an effort to rise from the ground. Remember the good Shepherd who will follow and rescue you. Though it be but two legs or a lobe of an ear, spring back from the beast that has wounded you. Remember the mercies of God and how He cures with oil and wine. Do not despair of salvation. Recall your recollection of how it is written in the Scriptures that he who is falling rises and he who turns away returns; the wounded is healed, the prey of beasts escapes; he who owns his sin is not rejected. The Lord willeth not the death of a sinner but rather that he should turn and live.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252044.html'
source_title="Letter 44, Section 2"
