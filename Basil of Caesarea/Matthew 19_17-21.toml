[[commentary]]
quote='''
Since our loving God and Saviour Jesus Christ proclaims: “Come unto me, all ye that labour and are heavy laden, and I will give you rest,” it is perilous to reject those that come to the Lord through us and wish to take upon them His kindly yoke and the burden of His commandments that raises us to heaven. Yet we must not allow any to tread the hallowed ground of these precepts with unwashed feet. But just as our Lord Jesus Christ asked the young man that came to Him about his former life, and having learned that it was good, bade him fulfil what was still lacking to perfection and then allowed him to follow, so, obviously, it befits us to learn the former life of applicants. If they have already led a good life we shall deliver to them the more perfect precepts; but when they are turning from an evil life or have set out from a state of indifference towards the strict life of the knowledge of God, then we must examine their characters, whether they are unstable and prone to sudden decisions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 10"
