[[commentary]]
quote='''
God is good, but He is also just. And it is the nature of the just to recompense worthily, as it is written: “Do well, O Lord, unto those that are good and true of heart. As for those that turn back unto crooked ways, the Lord shall lead them forth with the workers of lawlessness.” He is merciful, but He is also a judge. For He says: “The Lord loveth mercy and judgment.” And therefore it is said: “I will sing of mercy and judgment unto thee, O Lord.” And we have learned who they are that receive mercy, for He says: “Blessed are the merciful, for they shall obtain mercy.” Thou canst see with what discernment He uses mercy, being neither unjustly merciful nor mercilessly unjust. For “the Lord is both merciful and just.” Let us not then know God by halves, nor make His kindness an occasion of sloth. For this cause are thunders and lightnings, that His goodness may not be despised. He that maketh the sun to rise also punishes with blindness. He that giveth the rain also rains fire. Those show His goodness, these His severity. Let us then either love Him for those, or fear Him for these, that it not be said to us: “Or despisest thou the riches of his goodness and forbearance and long-suffering, not knowing that the goodness of God leadeth thee to repentance? but after thy hardness and impenitent heart treasurest up for thyself wrath in the day of wrath.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Preface"
