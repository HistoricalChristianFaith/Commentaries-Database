[[commentary]]
quote='''
So also, if thou alterest thy table for thy brother’s pleasure piling up the food and fussing over it, thou art accusing him of being an epicure and by thy preparations reproaching him with gluttony, since thou art convicting him of delight in such things. Have we not often guessed who or what was expected after seeing the appearance and quality of the preparations? The Lord did not praise Martha, cumbered about much serving, but said: “Thou art anxious and troubled about many things; but few things, or only one, are needed”—“few,” referring to the preparations: “one,” referring to the end, the satisfying of the need.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 20"
