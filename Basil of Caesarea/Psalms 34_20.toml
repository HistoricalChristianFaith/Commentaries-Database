[[commentary]]
quote='''
‘The Lord keepeth all their bones, not one of them shall be broken.’ Is it necessary to hold fast to the word and to be satisfied with the thought which readily falls upon our ears, that these bones of the just, the props of the flesh, will not be broken because of the protection given to them by the Lord? Or, will only the bones of the just man who is alive and engaged in life be guarded unbroken? Or, when the bonds of the body have been loosened, will it happen that there will be no cause of breaking for the just man? And truly, we have learned by experience that many bones of the just have been broken, when some among them handed themselves over to all forms of punishment for the sake of giving testimony for Christ. Already the persecutors have broken the legs of some and have frequently pierced hands and heads with nails. And yet, who will deny that of all, it is the most just who were brought to perfection in the testimony?

Perhaps, just as the term man is used for the soul and the human mind, so also his members are similarly named in accordance with the members of the flesh; thus, frequently Scripture names the members of the inner man, for example, ‘The eyes of a wise man are in his head,’ that is, the hidden part of the wise man is foreseeing and farseeing. And again, it means equally the eyes both of the soul and of the flesh, not only in that saying which we have set forth, but also in the statement that ‘the commandment of the Lord is lightsome and enlightening the eyes.’ But, what should we say concerning this: ‘He who has ears to hear, let him hear’? It is evident, indeed, that some possess ears better able to hear the words of God. But, to those who do not have those ears, what does he say? ‘Hear, ye deaf, and, ye blind, behold.’ Also ‘I opened my mouth, and panted,’ and ‘Thou hast broken the teeth of sinners.’ All these things were said in reference to the faculties which render service for spiritual food and spiritual doctrines. Such also is this saying, ‘My bowels, my bowels are in pain,’ and this, ‘And the foot’ of the wise man ‘shall not stumble.’ All such expressions are used in reference to the inner man.

According to the same reasoning there should also be certain bones of the inner man in which the bond of union and harmony of spiritual powers is collected. Just as the bones by their own firmness protect the tenderness of the flesh, so also in the Church there are some who through their own constancy are able to carry the infirmities of the weak. And as the bones are joined to each other through articulations by sinews and fastenings which have grown upon them, so also would be the bond of charity and peace, which achieves a certain natural junction and union of the spiritual bones in the Church of God. Concerning those bones which have been loosened from the frame and have become, as it were, dislocated, the prophet says: ‘Our bones are scattered by the side of hell.’ And, if at any time disturbance and agitation seizes upon them, he says in prayer: ‘Heal me, O Lord, for my bones are troubled.’ When, however, they preserve their own systematic arrangement, protected by the Lord, not one of them will be broken, but they will be worthy to offer glory to God. For, he says: ‘All my bones shall say: Lord, Lord, who is like to thee?’ Do you know the nature of intellectual bones? Perhaps, in reference to the mystery of our resurrection, the Church might use this expression, ‘All my bones shall say.’ Indeed, it is said: ‘Thus saith the Lord to these bones: Behold, I will send spirit of life into you, and I will lay sinews upon you, and will cause flesh to grow over you, and you shall live, and you shall know that I am the Lord.’ So, these bones, having taken on life and giving thanks for their resurrection, will say, ‘Lord, Lord, who is like to thee?’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
