[[commentary]]
quote='''
‘Thy Throne, O God, is forever and ever; the sceptre of thy kingdom is a sceptre of uprightness. Thou hast loved justice and hated iniquity; therefore God, thy God, hath anointed thee with the oil of gladness above thy fellows.’ After he has directed his attention to mankind and discoursed much about it, he now elevates his sermon to the heights of the glory of the Only-begotten. ‘Thy Throne,’ he says, ‘O God, is forever and ever,’ that is to say, Thy Kingdom is beyond the ages and older than all thought. And beautifully after the subjection of the people does he celebrate the magnificence of the kingdom of God. ‘The sceptre of thy kingdom is a sceptre of uprightness.’ For this reason also he gave Him His own name, clearly proclaiming Him God: ‘Thy Throne, O God.’ The sceptre of God is punitive, and while correcting, it brings forth upright and not perverse judgments. Therefore, the sceptre of uprightness is called the sceptre of His Kingdom. ‘And if his children forsake my law, and walk not in my judgments, I will visit their iniquities with a rod.’ Do you see the just judgment of God? He does not make use of it in the case of chance persons, but of sinners. It is also called a rod of consolation: ‘Thy rod,’ he says, ‘and thy staff, they have comforted me.’ It is a rod of affliction, too: ‘Thou shalt rule them with a rod of iron, and shalt break them in pieces like a potter’s vessel.’ Things of earth and clay are broken in kindness toward those who are governed, as it is handed down, ‘for the destruction of the flesh, that his spirit may be saved.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252044.html'
source_title="Homily on Psalm 44"
