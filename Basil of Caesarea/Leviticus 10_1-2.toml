[[commentary]]
quote='''
The work of a man who has murmured or has been detected in pride must not be mixed with that done by men humble in heart and of a contrite spirit; it must not be used at all by the pious. “For that which is exalted among men is an abomination before God.” And there is another command of the apostle: “Neither murmur ye, as some of them murmured, and perished by the destroyer.” Then there is this: “Not grudgingly or of necessity.” So the work of such men is unacceptable, like a blemished sacrifice—which it was impious to mingle with the offerings of other men. For if those who brought strange fire to the altar experienced such great wrath, surely it is perilous to accept a work springing from a mind hostile to God to assist us in keeping God’s commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 29"
