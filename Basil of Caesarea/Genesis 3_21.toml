[[commentary]]
quote='''
The apostle has taught us the end to be aimed at in a single phrase, saying: “Having food and raiment, we shall be therewith content,” as if to say that we need covering only; let us not fall any more into the forbidden vanity of embroidery and the ostentation which proceeds from it—to say nothing worse. For these evils were later importations into human life caused by vain contrivances. But the original use of coverings is clear, for God Himself gave it to those in need. For “God made them coats of skins,” it says. For the covering of our shameful parts such use of clothes was sufficient. But since there is another object also, that of being warmed by coverings, both things must have been aimed at, to cover our shameful parts, and to be protection against the inclemency of the weather. Since however of the actual clothes some are very useful, others less so, it befits us to prefer whatever can be made to serve several needs, so that the principle of poverty is in no way prejudiced; and that we do not have some things for show and others for use at home; or again one set of clothes for the day and another for the night; but that we decide to get such one garment as can suffice for all our needs, both for a decent covering by day and necessary warmth at night.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 22"
