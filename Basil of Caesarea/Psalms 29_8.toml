[[commentary]]
quote='''
‘The voice of the Lord shaketh the desert.’ The shaking of the desert is dispensed as a benefit to it from the Lord, in order that, having changed from its desolate state, it may become an inhabited land and, having laid aside the reproach of barrenness, it may receive the praise of fecundity (‘For many are the children of the desolate, more than of her that hath a husband.’), and being filled with the spirit of the waters, that which before was desert may be made into pools of standing water. ‘The Lord shall shake the desert of Cades.’ Now, the Lord will not shake every desert, but that of Cades, that is, sanctification. For, Cades is interpreted ‘sanctification.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"
