[[commentary]]
quote='''
Some give the definition that a city is an established community, administered according to law. And, the definition that has been handed down of the city is in harmony with the celestial city, Jerusalem above. For, there it is a community of the first-born who have been enrolled in heaven, and this is established because of the unchanging manner of life of the saints, and it is administered according to the heavenly law. Therefore, it is not the privilege of human nature to learn the arrangement of that city and all its adornment. Those are the things ‘Eye hath not seen nor ear heard, nor has it entered into the heart of man, what things God has prepared for those who love him,’ but there are myriads of angels there, and an assembly of saints, and a Church of the first-born that are enrolled in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"
