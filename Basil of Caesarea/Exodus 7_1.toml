[[commentary]]
quote='''
I am, however, at a loss to understand how our opponents with all their ingenuity can adduce the title of Godhead in proof of nature, as though they had never heard from Scripture that nature does not result from institution and appointment. Moses was made a god of the Egyptians when the divine voice said, “See I have made thee a god to Pharaoh. The title therefore does give proof of a certain authority of oversight or of action.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520189.html'
source_title="Letter 189, Section 8"
