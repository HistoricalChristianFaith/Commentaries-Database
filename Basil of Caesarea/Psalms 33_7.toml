[[commentary]]
quote='''
‘Gathering together the waters of the sea, as a vessel; laying up the depths in storehouses.’ He did not say, ‘Gathering together the waters of the sea as in a vessel,’ but, ‘as a vessel,’ thus ‘gathering together the waters of the sea.’ Consider, I beg of you, the nature of a vessel, now inflated, when the skin is stretched tight by the enclosed air; now reduced, when that which is stretching it yields. In this way, therefore, the sea at times swells and, becoming wild and swollen with the winds, it seethes; again, at other times, in a calm, it is reduced to a lower level. As a vessel, then, the Lord thus gathers together and reduces the water of the sea. However, we have found in certain copies, ‘Gathering together as in a vessel the waters of the sea,’ where Scripture refers us to ancient history, when the Red Sea, although no one was dividing it nor enclosing it, of itself stood firm, as if held in some vessel, because the divine command did not permit it to be poured forth.

‘Laying up the depths in storehouses.’ It would be more consistent as regards the general notion to say: ‘Placing storehouses in the depths,’ that is, enclosing its wealth in mystery. But, now he says that the depths are like certain treasures worthy of the divine storehouses. Are, then, the words concerning the divine judgment, which are unutterable and incomprehensible to human understanding, never called depths, since the reasons according to which He dispenses all things individually are stored up only in the knowledge of God? In fact, we learned in another psalm, which said, ‘Thy judgments are a great deep,’ that the judgments made about each one are called a deep. Therefore, if you seek to know why the life of a sinner is continued, but the days of sojourning of the just man are cut short; why the unjust man thrives, but a just man is afflicted; why the young child is snatched away before coming to maturity; whence are wars; why there are shipwrecks, earthquakes, droughts, heavy rains; why things destructive of men are created; why one man is a slave, another, free, one is rich, another is poor (and the difference in sins and in virtuous actions is great; she who was sold to a brothelkeeper is in sin by force, but she who immediately obtained a good master grows up with virginity); why this one is treated with kindness, and that one condemned; and what is the reward in the case of each of these from the Judge; taking all these questions into your mind, consider that the judgments of God are the depths and, because they are enclosed in the divine storehouses, are not easily grasped by those encountering them. To him who believes, a promise is given by God: ‘I will give thee hidden treasures, unseen ones.’ When we have been deemed worthy of knowledge face to face, we shall see also the depths in the storehouses of God. If you will gather together the sayings in Scripture about vessels, you will better comprehend the prophetic meaning. Those, then, who are renewed day by day and who take new wine from the true vine, are said in the Gospel to be new vessels. But, they who have not yet put off the old man are old vessels, unable to be trusted for the reception of new wine. For, no one puts new wine into old wineskins, lest the wine be spilt, and those skins be entirely ruined, inasmuch as they are considered worthy of no excuse hereafter, if they spill the good new wine. New wine must be poured into fresh skins. The new and spiritual wine and that which is glowing with the Holy Spirit, the perception of truth which never becomes old, must be put in the new man, who, because ‘he always bears about in his body the dying of Jesus,’ might justly be said to be a new vessel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
