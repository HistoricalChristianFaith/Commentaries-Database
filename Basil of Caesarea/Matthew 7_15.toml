[[commentary]]
quote='''
The bold and shameless heresy of the Arians, after being publicly cut off from the body of the Church, still abides in its own error, and does not do us much harm because its impiety is notorious to all. Nevertheless men clad in sheep’s clothing, and presenting a mild and amiable appearance, but within unsparingly ravaging Christ’s flocks, find it easy to do hurt to the simpler ones, because they came out from us. It is these who are grievous and hard to guard against.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520263.html'
source_title="Letter 263, Section 2"
