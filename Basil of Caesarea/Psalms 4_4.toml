[[commentary]]
quote='''
When the day is finished let us give thanks for what has been given us during the day and for what we have done rightly, and let us confess what we have left undone, every sin whether voluntary or involuntary, or perhaps unknown to us, either in word or deed or in the heart itself, beseeching God’s mercy for all in our prayers. For to review the past day is a great safeguard against falling into the like again. Wherefore it says: “What ye say in your hearts, feel compunction for upon your beds.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 37"
