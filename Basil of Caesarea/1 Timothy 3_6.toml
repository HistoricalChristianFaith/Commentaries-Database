[[commentary]]
quote='''
But, my dear Sir, do not in a few words bring serious charges, indeed the most serious of all. Forgetfulness of one’s friends, and neglect of them arising from high place, are faults which involve every kind of wrong. Do we fail to love according to the commandment of the Lord? Then we lose the distinctive mark imprinted on us. Are we puffed to repletion with empty pride and arrogance? Then we fall into the inevitable condemnation of the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252056.html'
source_title="Letter 56"
