[[commentary]]
quote='''
‘The senseless and the fool shall perish together, and they shall leave their riches to strangers; and their sepulchres shall be their houses forever. Their dwelling places to all generations; they have called their lands by their names.’ Above, he called the wise by one general name, whom now subdividing, he says are senseless and fools. Openly he said that they are wise, borrowing the term from their own opinion. As he calls those gods, who are not so by nature, following the practice of those who are deceived, so also he calls the senseless and foolish, wise. Therefore, it is possible to separate the senseless from the foolish in our thinking.

The senseless is, in fact, one who lacks common sense and who is not clear-sighted as regards ordinary human affairs. In the same way, custom calls those prudent who in the affairs of life discern the useful and the harmful, as it is expressed in the Gospel: ‘For, the children of this world are in relation to their own generation more prudent than are the children of the light.’ They are not absolutely more prudent, but in respect to the manner of their present life in the flesh. They are also called the ministers of injustice because of their prudence in the management of their life. According to this meaning, the prudent are also serpents, who prepare hiding places for themselves and who in dangers avoid in every manner blows on the head.

A fool is said to be one who does not have the qualities characteristic of man. These are an understanding of God the Father and the acceptance of the Word, which ‘was in the beginning with God’; also the light which comes from the Holy Spirit. And those persons have this mind who are able to say with Paul: ‘But we have the mind of Christ.’ Nevertheless, the practice of Scripture has used these words reversely, saying that the impious man is senseless, in the following words: ‘The fool hath said in his heart: “There is no God,”’ and again, he calls that which is harmful to life, foolish, as the Apostle does in speaking about those who fall into foolish and harmful desires. Thus the senseless and the fool are borne down to one common end, destruction. And one can say that he who lives as the heathens has been called senseless, but he who conducts his life as a Jew according to the bare observance of the law is a fool. For, God said to this senseless man because of the godlessness present in him: ‘Thou fool, this night do they demand thy soul of thee.’ But Israel which followed the flesh was called a fool according to the prophet, who says: ‘And Ephraim was like a foolish dove; they called upon Egypt, and they went to the Assyrians.’ Since these were completely destroyed by their own ignorance, we aliens become the heirs of their wealth. The commandments are ours, the prophets and patriarchs are ours, and so are the just in the world ours. They who perished in their own folly left us their wealth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
