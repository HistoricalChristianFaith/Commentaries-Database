[[commentary]]
quote='''
‘Our soul waiteth for the Lord: for he is our helper and protector.’ This word contains an exhortation to endurance, so that, even if we are seized by one of those who are oppressing us, we do not depart from the love of God which is in Christ Jesus, but with our whole soul endure the sufferings, awaiting help from God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
