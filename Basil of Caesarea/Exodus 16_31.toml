[[commentary]]
quote='''
Philo, on the authority of some Jewish tradition, explains the manna to have been of such a nature that it changed with the taste of the eater: that of itself it was like millet seed boiled in honey; it served sometimes for bread, sometimes for meat, either of birds or beasts; at other times for vegetables, according to each man’s liking; even for fish so that the flavour of each separate kind was exactly reproduced in the eater’s mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520190.html'
source_title="Letter 190, Section 3"
