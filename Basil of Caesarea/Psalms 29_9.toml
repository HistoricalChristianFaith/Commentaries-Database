[[commentary]]
quote='''
‘The voice of the Lord prepareth the stags.’ The words concerning the preparation of the stags, which was made by the voice of the Lord, must be explained with the same esteem as those previously mentioned. Accordingly, since the stag obtained such a preparation that it is unharmed by the bite of serpents; on the contrary, that the meat of the viper is even a purgative for it, as they say who have observed these things, and since all poisonous animals are accepted for the representation of the wicked and contrary powers (for, the Lord says: ‘I have given you power to tread upon serpents and scorpions, and over all the power of the enemy.’ and again, the psalm promises to the prophet: ‘Thou shalt walk upon the asp and the basilisk,’), it is necessary, whenever we hear the word ‘stag’ in the Scripture, to take the word for the representation of the better power. ‘The high hills are for the harts,’ and ‘The hart panteth after the fountains of water.’ Since, then, every just man has his abode on the heights ‘pressing on toward the goal, to the prize of the heavenly call,’ he returns to the fresh fountains, searching for the first sources of theology. But, the hart draws out with the breathing of his mouth the hidden venomous animals, and leads them out from their hiding places by the force of his breath. Just as the holy man is called an eagle because he walks on high and because he is separated very far from the earth, and a sheep because of his gentleness and the free gift of what he possesses, and a ram because of his authority, and a dove because of his innocence, so also, he is called the hart because of his opposition to wickedness. Therefore Solomon says: ‘Let thy dearest hind and most agreeable fawn consort with thee,’ showing us that the harts, as mentioned previously, are suitable in the teaching of theology.

‘The voice of the Lord prepareth the stags.’ When, then, we see some man of God perfect and prepared, we seek for profit from intercourse with him. Wherever a stag is present, all the evil of serpents is banished. The venomous animals do not endure the odor of this animal and, in truth, when its horns are burnt for fumigation, they withdraw elsewhere. ‘And he will discover the thick woods.’ First, the voice of the Lord prepares the stags, then it discovers the thick woods, natural spots made dense with wild and unfruitful material, to which, especially, the venomous animals are wont to flee. Since, therefore, the stag has already been perfected by the preparation made by the Lord, the just man, made like to it, discovers the thick woods, so that, uncovered and ready, the corruptors of our life may be delivered up. And because ‘every tree that is not bringing forth good fruit is to be cut down by the axe and thrown into the fire,’ necessarily, the thick woods, the woody souls in which, like some wild beasts, the varied passions of sins lurk, are cleared out by that word, which is ‘keener than any two-edged sword.’ When many men, laden with the cares of life, keep their souls like some thorn-producing land and do not allow them to be trained to bear the fruit of the word, the Lord discovers the thick woods, that is, the deformity and unseemliness and harmfulness of the cares of this life, in order that, when the place of good and evil has been made plain, men may not through ignorance hold perverse judgments concerning their affairs. Many think that the good, when it is painful, is evil, and they pursue the bad, because of the pleasure attached to it, as good. The misconception about such things among men is unspeakably great. Therefore, the fruitful woods and all cedars, which also receive praise, belong to the nature of the good; but, the thick woods, which the voice of God discovers and reveals in order that those who think that they will find some useful fruit in them may not be deceived, belong to the nature of the bad.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"

[[commentary]]
quote='''
‘And in his temple all shall speak his glory.’ Let those who give themselves to long conversations hear the words of the psalm and take heed. What does the psalm say? He who is in the temple of God does not speak out abuse nor folly nor words full of shameful matters, but, ‘in his temple all shall speak his glory.’ Holy angels stand by, who write the words; the Lord is present, who sees the affections of those entering. The prayer of each is manifested to God; one seeks heavenly things affectionately and one seeks them learnedly; one utters his words perfunctorily with the tips of his lips, but his heart is far from God. Even though he prays, he seeks the health of his flesh, material wealth, and human glory. None of these should be sought, as Scripture teaches, but, ‘in his temple all shall speak his glory.’ ‘The heavens show forth the glory of God.’ The praise of God is a duty belonging to angels. This one duty, referring glory to the Creator, belongs to every army of heavenly creatures. Every creature, whether silent or uttering sound, whether celestial or terrestrial, gives glory to the Creator. But, wretched men, who leave their homes and run to the temple, as if to enrich themselves somewhat, do not lend their ears to the words of God; they do not possess a knowledge of their nature; they are not distressed, although they have previously committed sin; they do not grieve at remembering their sins, nor do they fear the judgment; but, smiling and shaking hands with one another, they make the house of prayer a place of lengthy conversations, pretending not to hear the psalm which solemnly protests and says: ‘In the temple of God all shall speak his glory.’ You not only do not speak His glory, but, you even become a hindrance to the other, turning his attention to yourself and drowning out the teaching of the Spirit by your own clamor. See to it that you do not at some time leave condemned along with those blaspheming the name of God instead of receiving a reward for glorifying Him. You have a psalm, you have a prophecy, the evangelical precepts, the preachings of the apostles. Let the tongue sing, let the mind interpret the meaning of what has been said, that you may sing with your spirit, that you may sing likewise with your mind. Not at all is God in need of glory, but He wishes you to be worthy of winning glory. Therefore, ‘What a man sows, he will also reap.’ Sow glorification, that you may reap crowns and honors and praises in the kingdom of heaven. This statement, ‘In his temple all shall speak his glory,’ was made not unfittingly in a digression, because some in the temple of God talk endlessly until their tongue aches; and these enter without profit. Would that it might be only without profit and not with harm!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"
