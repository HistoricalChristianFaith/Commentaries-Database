[[commentary]]
quote='''
‘Give praise to the Lord on the harp; sing to him with the psaltery, the instrument of ten strings.’ First, it is necessary to praise the Lord on the harp; that is, to render harmoniously the actions of the body. Since, indeed, we sinned in the body, ‘when we yielded our members as slaves of sin, unto lawlessness,’ let us give praise with our body, using the same instrument for the destruction of sin. Have you reviled? Bless. Have you defrauded? Make restitution. Have you been intoxicated? Fast. Have you made false pretensions? Be humble. Have you been envious? Console. Have you murdered? Bear witness, or afflict your body with the equivalent of martyrdom through confession. And then, after confession you are worthy to play for God on the ten-stringed psaltery. For, it is necessary, first, to correct the actions of our body, so that we perform them harmoniously with the divine Word and thus mount up to the contemplation of things intellectual. Perhaps, the mind, which seeks things above, is called a psaltery because the structure of this instrument has its resonance from above. The works of the body, therefore, give praise to God as if from below; but the mysteries, which are proclaimed through the mind, have their origin from above, as if the mind was resonant through the Spirit. He, therefore, who observes all the precepts and makes, as it were, harmony and symphony from them, he, I say, plays for God on a ten-stringed psaltery, because there are ten principal precepts, written according to the first teaching of the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
