[[commentary]]
quote='''
But generally speaking we must not permit either relative or stranger to converse with the brethren unless we are persuaded in regard to them, that they frame their discourse with a view to the edifying and perfecting of souls. But if it be necessary to speak to those who have been once admitted let it be left to those who have been entrusted with the gift of utterance, since they have power to speak with knowledge and to hear in a way that builds up faith. For the apostle plainly teaches that not all have the power of speech, but that the gift belongs to but few, when he says: “For to one is given through the Spirit the word of wisdom, to another the word of knowledge,” and elsewhere: “that he may be able to exhort with sound knowledge, and to convict the gainsayers.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 32"
