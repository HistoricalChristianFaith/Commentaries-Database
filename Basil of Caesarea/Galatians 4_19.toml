[[commentary]]
quote='''
In fact, the disciple is the spiritual child of the teacher. That one who receives from another formation in piety is, as it were, molded by him and is brought into existence, just as the fetus formed within her is brought into existence by one who is pregnant. For this reason Paul also taking up again the whole Church of the Galatians, which had fallen from its earlier teachings and which was abortive, as it were, and forming Christ in them anew, called them little children; and, when with pain and affliction he corrected those who had erred, he said that he was in labor in soul because of his grief at those who had fallen away. ‘My dear children, with whom I am in labor again, until Christ is formed in you.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
