[[commentary]]
quote='''
[What say I, brethren? Not that I am a sinless person; not that my life is not full of numberless faults. I know myself; and indeed I cease not my tears for my sins, if by any means I may be able to appease my God, and to escape the punishment threatened against them. But this I say: let him who judges me, hunt for motes in my eye, if he can say that his own is clear.] I own, brethren, that I need the care of the sound and healthy, and need much of it. If he cannot say that it is clear, and the clearer it is the less will he say so—(for it is the part of the perfect not to exalt themselves; if they do they will certainly come under the charge of the pride of the Pharisee, who, while justifying himself, condemned the publican) let him come with me to the physician; let him not “judge before the time until the Lord come, who both will bring to light the hidden things of darkness, and will make manifest the counsels of the hearts.” Let him remember the words, “Judge not, and ye shall not be judged;” and “Condemn not, and ye shall not be condemned.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520204.html'
source_title="Letter 204, Section 4"
