[[commentary]]
quote='''
The decision I have come to in my own mind is, not to surrender offenders to the magistrates; yet not to rescue those already in their custody, since it has long ago been declared by the Apostle, that the magistrates should be a terror to them in their evil-doings; for, it is said, “he beareth not the sword in vain.” To surrender him, then, is contrary to my humanity; while to release him would be an encouragement to his violence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520289.html'
source_title="Letter 289"
