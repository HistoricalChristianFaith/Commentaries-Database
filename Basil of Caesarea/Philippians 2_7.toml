[[commentary]]
quote='''
If, then, the sojourn of the Lord in flesh has never taken place, the Redeemer paid not the fine to death on our behalf, nor through Himself destroyed death’s reign. For if what was reigned over by death was not that which was assumed by the Lord, death would not have ceased working his own ends, nor would the sufferings of the God-bearing flesh have been made our gain; He would not have killed sin in the flesh: we who had died in Adam should not have been made alive in Christ; the fallen to pieces would not have been framed again; the shattered would not have been set up again; that which by the serpent’s trick had been estranged from God would never have been made once more His own. All these boons are undone by those that assert that it was with a heavenly body that the Lord came among us. And if the God-bearing flesh was not ordained to be assumed of the lump of Adam, what need was there of the Holy Virgin? But who has the hardihood now once again to renew by the help of sophistical arguments and, of course, by scriptural evidence, that old dogma of Valentinus, now long ago silenced? For this impious doctrine of the seeming is no novelty. It was started long ago by the feeble-minded Valentinus, who, after tearing off a few of the Apostle’s statements, constructed for himself this impious fabrication, asserting that the Lord assumed the “form of a servant,” and not the servant himself, and that He was made in the “likeness,” but that actual manhood was not assumed by Him. Similar sentiments are expressed by these men who can only be pitied for bringing new troubles upon you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520261.html'
source_title="Letter 261, Section 2"
