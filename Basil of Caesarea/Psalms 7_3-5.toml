[[commentary]]
quote='''
‘O Lord my God, if I have done this thing, if there be iniquity in my hands; if I have rendered to them that repaid me evils, let me deservedly fall empty before my enemies. Let the enemy pursue my soul, and take it.’ It is usual for Scripture to use the word ‘repaying’ not only in the case of customary acts, as when some good or evil is already in existence, but also in the case of acts beginning, as in the case of ‘Repay thy servant.’ Instead of ‘give,’ it says ‘repay.’ A giving is the beginning of beneficence; but payment is the reciprocal measuring out of equal value on the part of him who has received benefits; repayment is a sort of second beginning and cycle of benefits or evils stored up for certain ones. In my opinion, since the expression, making, as it were, a re-petition in place of a petition, requests repayment, it presents some such meaning as this: the debt of care necessarily owed through nature to children by their parents, this provide for me. Indeed, care for their livelihood is owed to children by a father through natural love. ‘For the parents,’ it is said, ‘should save up for the children,’ in order that in addition to life, they may still provide for them the means for their livelihood. Such is frequently the offering or repayment found in Scripture in initial activities. But here, he who is speaking seems to have confidence because he has not rendered to those repaying evils, nor repaid the like. ‘If I have done this thing, and if I have rendered to them that repaid me evils, let me deservedly fall empty before my enemies.’ He falls empty before his enemies who falls from grace, which is the fullness of Christ. ‘Let the enemy pursue my soul, and take it, and tread down my life on the earth.’ The soul of the just man, severing itself from affection for the body, has its life hidden with Christ in God, so that it can say like the Apostle: ‘It is now no longer I that live, but Christ lives in me. And the life that I now live in the flesh, I live in faith.’ But, the soul of the sinner and of him who lives according to the flesh and is defiled by the pleasures of the body is wrapped up in the passions of the flesh as in mud; and the enemy, trampling upon this soul, strives to pollute it still more and, as it were, to bury it, treading upon him who has fallen, and with his feet trampling him into the ground, that is, trampling the life of him who has slipped into his body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
