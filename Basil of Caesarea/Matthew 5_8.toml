[[commentary]]
quote='''
But I trust in God that you, because of your pure lives, will bring forth fruit thirty, sixty, and a hundred fold. For, it is said, Blessed are the pure in heart, for they shall see God. And, my brethren, entertain no other conception of the kingdom of the heavens than that it is the very contemplation of realities. This the divine Scriptures call blessedness. For “the kingdom of heaven is within you.”

The inner man consists of nothing but contemplation. The kingdom of the heavens, then, must be contemplation. Now we behold their shadows as in a glass; hereafter, set free from this earthly body, clad in the incorruptible and the immortal, we shall behold their archetypes, we shall see them, that is, if we have steered our own life’s course aright, and if we have heeded the right faith, for otherwise none shall see the Lord. For, it is said, into a malicious soul Wisdom shall not enter, nor dwell in the body that is subject unto sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 12"
