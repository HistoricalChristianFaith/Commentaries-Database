[[commentary]]
quote='''
The physical structure of the body is, speaking figuratively, a harp and an instrument harmoniously adapted for the hymns of our God; and the actions of the body, which are referred to the glory of God are a psalm, whenever in an appropriate measure we perform nothing out of tune in our actions. Whatever pertains to lofty contemplation and theology is a canticle. Therefore, the psalm is a musical sermon when it is played rhythmically on the instrument with harmonic sounds. But the canticle is a melodious utterance expressed harmoniously without the accompaniment of the instrument. Accordingly, since this was entitled, ‘A psalm of a canticle.’ we believe that the expression suggests action following contemplation. This psalm of a canticle, according to the title, embraces certain words of the dedication of the house. And the speech, in its material form, seems to have been delivered in the time of Solomon, when the renowned temple was raised, and to have been adapted to the harp; but, in its spiritual meaning, the title seems to signify the Incarnation of the Word of God and to make known the dedication of a house, which same house had been constructed in a novel and incredible manner. We have found many things in this psalm announced by the Lord in person. Or, perhaps, it is proper to consider the house as the Church built by Christ; just as Paul writes in his letter to Timothy: ‘In order that thou mayest know how to conduct thyself in the house of God, which is the Church of the living God.’ The dedication of the Church must be understood as the renewal of the mind, which takes place through the Holy Spirit in each, individually, of those who make up the body of the Church of Christ. It is a divine and musical harmony, not which includes words that gladden the ear, but those that calm and soften the wicked spirits which trouble souls that are exposed to harm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"

[[commentary]]
quote='''
‘I will extol thee, O Lord, for thou hast upheld me: and hast not made my enemies to rejoice over me.’ How is He who dwells on high extolled by those who have as their portion the lowly places? For, if God is in heaven above and you on the earth below, in what manner could you extol God? What, then, does this message mean to the prophet? Or, is He, perhaps, said to be extolled by those who are able to have noble and holy thoughts about Him and to live for the glory of God? Therefore, he who with understanding is hastening toward bliss extols God, but, he who is turning the opposite way, which rightly should not even be mentioned, abases God as much as lies in his power.

We attribute to God, as it were, every state that corresponds to our circumstances. For this reason, when we are half asleep and behaving slothfully, God, since He judges us unworthy of His observant watchfulness over us, is said to be asleep. But, when, after noticing at some time the harm that comes from the sleep, we shall say, ‘Arise, why sleepest thou, O Lord?’ ‘Behold he shall neither slumber nor sleep at that time, that keepeth Israel.’ Some others, as it were, turn their eyes away from God because of their shameful deeds and their acts unworthy of the eyes of God; these, on repenting, say: ‘Why turnest thou thy face away?’ Besides these, there are others who have cast out the memory of God and, as it were, are producing in Him forgetfulness of themselves, and these say: ‘Why forgettest thou our want and our trouble?’ In a word, men do the very things that are humanly spoken about God, making God in their own regard such as each has formerly made himself. Therefore, ‘I will extol thee, O Lord, for thou hast upheld me: and hast not made my enemies to rejoice over me.’ And I will suffer nothing low or abject in my life.

Why is the power of extolling present in me? Because You have first upheld me. Very clearly David said, ‘Thou hast upheld,’ instead of, ‘Thou hast raised me up,’ and You have made me superior to those rising up against me, just as if some one, taking by the hand a child who was inexperienced in swimming, would draw him up above the water. He, then, who by the help of God has raised himself up from a fall, through gratitude promises God glorification by his good works. Or, as if someone, by supporting a certain weak wrestler from a possible fall and making him superior to his antagonist, provides for the one an opportunity of victory but deprives the other of the pleasure of his fall. It is not the afflictions, which are sent upon the saints for a trial, that procure happiness for our invisible enemies, but, when we refuse afflictions and our thoughts are anxious, because we have grown weary of our frequent sufferings, then they are made glad and they clap and rejoice. Such it was in the case of Job. He lost his possessions; he was bereft of his children; his flesh oozed forth putrid matter and worms. This was not yet, however, a pleasure to the antagonist. But, if, yielding to his sufferings, he had uttered any blasphemous word according to the advice of his wife, then the enemy would have rejoiced over him. It is the same in the case of Paul, who was hungry and thirsty, naked, buffeted, wearied, and never at rest; the enemy did not rejoice. On the contrary, the enemy was crushed, seeing him enduring the conflicts, so that Paul said with disdain: ‘Who shall separate us from the love of Christ?’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
