[[commentary]]
quote='''
After the return let the Superior question the traveller, what he has done and what sort of men he has met; what words he has used to them; what have been the thoughts of his heart; whether he has completed every day and night living in the fear of God—or whether he has swerved aside and violated any of the rules, either giving way to external difficulties or falling through his own slothfulness.

Let the Superior set the seal of his approval on what has been rightly accomplished, but correct failures by diligent and skilful admonition. For in this way both the travellers will be more watchful through anxiety as to the account they must render, and we shall seem not to have been neglecting their spiritual life during the period of separation. That this was the custom of the Saints is shown us by the narrative of the Acts, which teaches us that Peter on his return to Jerusalem gave them there an account of his intercourse with the Gentiles; and how that Paul and Barnabas when they arrived, having called together the Church, told what God had done with them; and again, that all the multitude kept silence and hearkened to Barnabas and Paul, rehearsing what God had done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 44"
