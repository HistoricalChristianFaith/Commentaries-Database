[[commentary]]
quote='''
If therefore anyone think that he is lacking in anything, let him bring it forth that all may examine it in common. For it is easier through the careful scrutiny of the many to find out that which is hidden, seeing that God allows us to find that for which we seek, by means of the teaching and guidance of the Holy Spirit. Since, then, “necessity is laid upon me, and woe is unto me, if I preach not the gospel,” so also there is equal danger for you, if you are slothful in your search, or if you show yourselves careless and negligent in the keeping of tradition, or in fulfilling it by good works. Wherefore the Lord says: “The word which I spake, the same shall judge him in the last day.” And “that servant which knew not his Lord’s will, and did things worthy of stripes, shall be beaten with few stripes; but he that knew, and did not, neither made himself ready according to his will, shall be beaten with many stripes.” Let us pray then that I may blamelessly dispense the word, and that the teaching may bear fruit in you. And since, then, we know that the words of divine Scripture will rise up before us at the judgment seat of Christ—“For I will reprove thee,” He says, “and set before thee thy sins”—let us hearken diligently to that which is spoken, and seek earnestly to carry out the divine decrees; for we know not on what day or at what hour the Lord will come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Preface"
