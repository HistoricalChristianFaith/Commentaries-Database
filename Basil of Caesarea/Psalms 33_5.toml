[[commentary]]
quote='''
The Lord ‘loveth mercy and judgment; the earth is full of the mercy of the Lord.’ If the judgment of God, who renders precisely according to our deserts what is due to us for our deeds, should be by itself, what hope would there be? Who of all mankind would be saved? But, as it is, ‘He loveth mercy and judgment.’ It is as if He had made mercy a coadjutor to Himself, standing before the royal throne of His judgment, and thus He leads each one to judgment. ‘If thou, O Lord, wilt mark iniquities: Lord, who shall stand it?’ Neither is mercy without judgment, nor judgment without mercy. He loves mercy, therefore, before judgment, and after mercy He comes to judgment. However, these qualities are joined to each other, mercy and judgment, lest either mercy alone should produce presumption, or judgment alone cause despair. The Judge wishes to have mercy on you and to share His own compassion, but on condition that He finds you humble after sin, contrite, lamenting much for your evil deeds, announcing publicly without shame sins committed secretly, begging the brethren to labor with you in reparation; in short, if He sees that you are worthy of pity, He provides His mercy for you ungrudgingly. But, if He sees your heart unrepentant, your mind proud, your disbelief of the future life, and your fearlessness of the judgment, then He desires the judgment for you, just as a reasonable and kind doctor tries at first with hot applications and soft poultices to reduce a tumor, but, when he sees that the mass is rigidly and obstinately resisting, casting away the olive oil and the gentle method of treatment, he prefers henceforth the use of the knife. Therefore, He loves mercy in the case of those repenting, but He also loves judgment in the case of the unyielding. Isaia says some such thing, too, to God: ‘Thy mercy in measure.’ For, he compares the mercy with the judgment of Him who gives compensation by scale and number and weight according to the deserts of each.

‘The earth is full of the mercy of the Lord.’ Here mercy is separated from judgment. The earth is full of only the mercy of the Lord, since His judgment is stored up for the appointed time. Here, then, mercy is apart from judgment; indeed, He did not come ‘in order that He might judge the world, but that He might save the world.’ But there, judgment is not apart from mercy because man could not be found clean from stain, not even if he had lived for only one day. And so, if anyone sees the evil spreading daily and the mortal race of man, so far as it merits for its sins, deserving of countless deaths, he will admire the riches of the goodness of God and of His forbearance and patience. Of course, while we are on earth, we need mercy. Those in heaven, indeed, merit to be called happy, not to be pitied. Or, the explanation is, perhaps, that, because of the sentence laid upon us for sin, it is we who are called earth, since we hear from God, ‘Earth you are, and unto earth you shall return,’ we, who are full of the mercies of God. For, ‘when we were dead by reason of our’ offenses and ‘sins,’ God, having mercy, ‘brought us to life together with Christ.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
