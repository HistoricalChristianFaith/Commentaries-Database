[[commentary]]
quote='''
Harshness is ever to be put aside, even in censuring. [The more you shew modesty and humility yourself, the more likely are you to be acceptable to the patient who needs your treatment. There are however many occasions when we shall do well to employ the kind of rebuke used by the prophet who did not in his own person utter the sentence of condemnation on David after his sin, but by suggesting an imaginary character made the sinner judge of his own sin, so that, after passing his own sentence, he could not find fault with the seer who had convicted him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25202.html'
source_title="Letter 2, Section 5"
