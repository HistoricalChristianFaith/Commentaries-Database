[[commentary]]
quote='''
And, in short, I perceive three different dispositions which by inevitable necessity lead us to obey. Either through fear of punishment we turn away from that which is evil, and so are of a slavish disposition; or, seeking to profit by the reward, we fulfil the commandments for the sake of our own benefit, and are accordingly like hirelings; or else we do good for the sake of the good itself and from love of Him Who gave us the law, rejoicing that we are thus thought worthy to serve the glorious and great God, and so we have the disposition of sons. Nor will he who keeps the commandments from fear, and is always expecting the penalty of sloth, obey some orders and neglect others, but he will dread as equally terrible the judgment which comes upon every disobedience. Accordingly he is pronounced blessed who fears always with reverence. And he stands firm in the truth, for he can say: “I have seen God always before me, for he is on my right hand lest I should be shaken,” as never choosing to neglect anything that is right. Again, “Blessed is the man that feareth the Lord.” Why? Because “he will delight greatly in his commandments.” Wherefore it is not possible for those who fear to neglect any of God’s orders, or to perform them carelessly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Preface"
