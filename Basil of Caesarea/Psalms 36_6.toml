[[commentary]]
quote='''
‘Laying up the depths in storehouses.’ It would be more consistent as regards the general notion to say: ‘Placing storehouses in the depths,’ that is, enclosing its wealth in mystery. But, now he says that the depths are like certain treasures worthy of the divine storehouses. Are, then, the words concerning the divine judgment, which are unutterable and incomprehensible to human understanding, never called depths, since the reasons according to which He dispenses all things individually are stored up only in the knowledge of God? In fact, we learned in another psalm, which said, ‘Thy judgments are a great deep,’ that the judgments made about each one are called a deep. Therefore, if you seek to know why the life of a sinner is continued, but the days of sojourning of the just man are cut short; why the unjust man thrives, but a just man is afflicted; why the young child is snatched away before coming to maturity; whence are wars; why there are shipwrecks, earthquakes, droughts, heavy rains; why things destructive of men are created; why one man is a slave, another, free, one is rich, another is poor (and the difference in sins and in virtuous actions is great; she who was sold to a brothelkeeper is in sin by force, but she who immediately obtained a good master grows up with virginity); why this one is treated with kindness, and that one condemned; and what is the reward in the case of each of these from the Judge; taking all these questions into your mind, consider that the judgments of God are the depths and, because they are enclosed in the divine storehouses, are not easily grasped by those encountering them. To him who believes, a promise is given by God: ‘I will give thee hidden treasures, unseen ones.’ When we have been deemed worthy of knowledge face to face, we shall see also the depths in the storehouses of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
