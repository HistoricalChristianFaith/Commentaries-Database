[[commentary]]
quote='''
Whatever then is calculated to free us from our need with the least trouble, that is to be employed. The Lord Himself shows this by the manner in which He entertained the wearied multitude in the desert, “lest they should faint in the way.” For though He had the power to extend the miracle in the desert by devising a sumptuous repast, He prepared a meal for them so frugal and simple as to consist of barley loaves and a little fish besides the bread. Drink is not even mentioned, since all could get water, which is available by nature for all, and is sufficient for our needs; unless indeed such a beverage is harmful to anyone owing to his infirmities and therefore to be avoided in accordance with Paul’s advice to Timothy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 19"
