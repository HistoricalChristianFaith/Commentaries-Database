[[commentary]]
quote='''
For as with the flesh both the putting away of foreign elements and the addition of what is lacking are necessary; so also with our soul, it is fitting that what is alien be removed and what is according to our nature be received. Because “God made man upright,” and created us for good works, that we should walk in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 55"
