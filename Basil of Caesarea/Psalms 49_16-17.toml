[[commentary]]
quote='''
‘Be not thou afraid, when a man shall be made rich, and when the glory of his house shall be increased.’ ‘Be not thou afraid,’ he says, ‘when a man shall be made rich.’ This proclamation is necessary to the inhabitants of the world, both to the earthborn and to the sons of men, to the rich and also to the poor. ‘Be not thou afraid, when a man shall be made rich.’ When you see, he says, the unjust man becoming rich and the just man poor, do not fear for yourself; do not be dismayed in mind, as if the providence of God is nowhere looking upon human affairs, or perhaps, somewhere there is a divine watchfulness, but it does not reach to places near the earth, so as to watch over our affairs; for, if there were a providence, it would be apportioning to each man what is proper to him, so that the just, who understand how to use wealth, would be rich, but the wicked, who have wealth as the instrument of their wickedness, would be poor.

Now, since there are many in the nations and among the earthborn who have such notions and who, because of the apparent inconsistency of the distribution of the fortunes of life, assume that the world is not the work of providence, the Scripture addresses these to calm their uninstructed emotion. In the very beginning it had also invited them to hear the doctrines. And surely, it alludes particularly to only the person of the poor when it says: ‘Be not thou afraid, when a man shall be made rich.’ These, especially, need consolation, so as not to cower before the more powerful. For, it says, a rich man has no advantage when he is dying, since he is not able to take his wealth with him; at any rate, he gained only as much from the enjoyment of it as for his soul to be deemed happy in this life by flatterers. But, in dying he will not take all these possessions, it says; he will take only just the garment that covers his shame, and this, if it shall seem best to those of his household who are clothing him. He must be content to obtain a little earth; and, since this is given to him through pity by those who are burying him, they provide it for him out of reverence for our common human nature, not granting a favor to him, but honoring humanity. Do not, then, be faint about present affairs, but await that blessed and everlasting life. Then you will see that poverty and contempt and the lack of luxuries befall the just man for his good. And do not be troubled now about imagined good things, as though they were unjustly divided. You will hear how it will be said to a certain rich man: ‘Thou in thy lifetime hast received good things,’ but to the poor man that he receives evils in his life. As a consequence, therefore, the latter is consoled, but the former suffers pain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
