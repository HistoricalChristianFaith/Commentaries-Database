[[commentary]]
quote='''
In truth the most difficult of sciences is to know one’s self. Not only our eye, from which nothing outside us escapes, cannot see itself; but our mind, so piercing to discover the sins of others, is slow to recognise its own faults. Thus my speech, after eagerly investigating what is external to myself, is slow and hesitating in exploring my own nature. Yet the beholding of heaven and earth does not make us know God better than the attentive study of our being does; I am, says the Prophet, fearfully and wonderfully made; that is to say, in observing myself I have known Thy infinite wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25209-The%2520Creation%2520of%2520Terrestrial%2520Animals.html'
source_title="The Hexaemeron, Homily 9: The Creation of Terrestrial Animals"
