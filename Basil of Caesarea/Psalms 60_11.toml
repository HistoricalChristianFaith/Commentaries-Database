[[commentary]]
quote='''
‘Give us help from trouble.’ Let us not seek help from strength, nor from a good condition of body; let us not ask to obtain succor from anyone of those among men who are considered renowned. Not in the amount of money, not in the pride of power, not in the height of glory is victory gained, but the Lord freely gives His help to those who seek Him through excessive affliction. Such was Paul, who made his afflictions his boast. Therefore, he was able to say: ‘When I am weak, then I am strong.’ ‘Give us, therefore, O Lord, help from trouble,’ since ‘tribulation works out endurance, and endurance tried virtue, and tried virtue, hope. And hope does not disappoint.’ Do you see where affliction leads you? To hope that does not disappoint. Are you ill? Be of good cheer, because ‘whom the Lord loves, he chastises.’ Are you poor? Rejoice, because the blessings of Lazarus will receive you in turn. Are you held in dishonor because of the name of Christ? You are blessed, because your shame will be changed into the glory of an angel. Let us persuade ourselves, brothers, in the time of temptation not to run away to human hopes, nor to seek assistance for ourselves from them, but in tears and in groanings and in assiduous prayers and in strenuous watchfulness to make our petitions. For, that man receives help from troubles who despises human help as vain and stands firmly on the hope that is founded on Him who is able to save us, in Christ Jesus our Lord, to whom be glory and power forever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252059.html'
source_title="Homily on Psalm 59"
