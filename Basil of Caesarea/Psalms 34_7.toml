[[commentary]]
quote='''
‘The angel of the Lord shall encamp round about them that fear him: and shall deliver them.’ He explained whom he reckons as the poor man—him who fears the Lord. Therefore, he who fears is still in the rank of the slave. But, he who had been made perfect by love now mounted quickly to the dignity of son. Hence the slave is said to be also poor, because he has nothing of his own; but the son is said to be already rich, because he is the heir of the paternal goods. ‘The angel of the Lord,’ therefore, ‘shall encamp round about them that fear him.’ An angel attends everyone who believes in the Lord if we never chase him away by our evil deeds. As smoke puts the bees to flight, and a foul smell drives away the doves, so also the lamentable and foul sin keeps away the angel, the guardian of our life. If you have in your soul works worthy of angelic custody, and if a mind rich in the contemplation of truth dwells within you, because of the wealth of your esteemed works of virtue God necessarily establishes guards and custodians beside you and fortifies you with the guardianship of angels. Consider what the nature of the angels is, that one angel is compared to a whole army and a crowded encampment. So, through the greatness of him who guards you the Lord bestows upon you an encampment; and through the strength of the angel He surrounds you on all sides with His protection as with a wall. For, this is what the word ‘round about’ signifies. Just as the encircling walls, put round about all the cities, keep off the attacks of the enemies on all sides, so also the angel shields from the front and guards the rear and does not leave the two sides unprotected. For this reason, ‘A thousand shall fall at thy side, and ten thousand at thy right hand; but’ the stroke of the enemy ‘shall not come nigh thee,’ because He will give commands to His angels concerning you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
