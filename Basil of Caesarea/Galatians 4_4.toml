[[commentary]]
quote='''
And it is not only in the case of the theology that the use of the terms varies, but whenever one of the terms takes the meaning of the other we find them frequently transferred from the one subject to the other. As, for instance, Adam says, "I have gotten a man through God," meaning to say the same as from God; and in another passage "Moses commanded . . . Israel through the word of the Lord," and, again, "Is not the interpretation through God?" Joseph, discoursing about dreams to the prisoners, instead of saying "from God" says plainly "through God." Inversely Paul uses the term "from whom" instead of "through whom," when he says "made from a woman" (A.V., "of" instead of "through a woman"). And this he has plainly distinguished in another passage, where he says that it is proper to a woman to be made of the man, and to a man to be made through the woman, in the words "For as the woman is from [A.V., of] the man, even so is the man also through [A.V., by] the woman." Nevertheless in the passage in question the apostle, while illustrating the variety of usage, at the same time corrects obiter the error of those who supposed that the body of the Lord was a spiritual body, and, to shew that the God-bearing flesh was formed out of the common lump of human nature, gave precedence to the more emphatic preposition.

The phrase "through a woman" would be likely to give rise to the suspicion of mere transit in the generation, while the phrase "of the woman" would satisfactorily indicate that the nature was shared by the mother and the offspring. The apostle was in no wise contradicting himself, but he shewed that the words can without difficulty be interchanged. Since, therefore, the term "from whom" is transferred to the identical subjects in the case of which "through whom" is decided to be properly used, with what consistency can these phrases be invariably distinguished one from the other, in order that fault may be falsely found with true religion?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 5"
