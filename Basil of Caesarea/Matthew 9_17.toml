[[commentary]]
quote='''
If you will gather together the sayings in Scripture about vessels, you will better comprehend the prophetic meaning. Those, then, who are renewed day by day and who take new wine from the true vine, are said in the Gospel to be new vessels. But, they who have not yet put off the old man are old vessels, unable to be trusted for the reception of new wine. For, no one puts new wine into old wineskins, lest the wine be spilt, and those skins be entirely ruined, inasmuch as they are considered worthy of no excuse hereafter, if they spill the good new wine. New wine must be poured into fresh skins. The new and spiritual wine and that which is glowing with the Holy Spirit, the perception of truth which never becomes old, must be put in the new man, who, because ‘he always bears about in his body the dying of Jesus,’ might justly be said to be a new vessel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
