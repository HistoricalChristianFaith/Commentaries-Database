[[commentary]]
quote='''
To my reflections has been added this thought too; can the Lord have wholly abandoned His Churches? Has the last hour come, and is “the falling away” thus coming upon us, that now the lawless one “may be revealed, the son of perdition who opposeth and exalteth himself above all that is called God and is worshipped”? But if the temptation is for a season, bear it, ye noble athletes of Christ. If the world is being delivered to complete, and final destruction, let us not lose heart for the present, but let us await the revelation from heaven, and the manifestation of our great God and Saviour Jesus Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520139.html'
source_title="Letter 139, Section 1"
