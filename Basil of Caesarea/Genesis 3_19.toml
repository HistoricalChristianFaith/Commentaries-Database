[[commentary]]
quote='''
Just as each of the arts has been given us by God as a help to supplement the deficiencies of nature—for instance, agriculture, because what grows out of the earth of itself is not sufficient to relieve our necessities; weaving, because the need of coverings is paramount in view both of decency and the damage inflicted by the weather, and similarly with building—so it is with the medical art. Since our body, so subject to disease, is liable to various kinds of harm, both what attacks it from without, and what arises from within by reason of the foods we eat, and is distressed by both excess and deficiency, the medical art—a type in this respect of the healing of the soul—has been given us by God Who directs all our life to advise the removal of what is in excess or the addition of what is wanting. For just as, if we were still in the Paradise of delight, we should have no need of the cares and toils of agriculture, so too if we enjoyed freedom from disease according to the gift bestowed before the Fall at our creation we should be needing no medical remedies to relieve us. But just as after we were exiled to this place and were told: “In the sweat of thy brow shalt thou eat thy bread,” then by long experience and painful toil on the earth we contrived the art of agriculture to relieve the ills which came from the curse, God having given us understanding and apprehension of this art—so also when we were bidden to return again to the earth from which we were taken and were yoked to the painful flesh, condemned to destruction because of sin and therefore subject to these diseases, so also has been given us the help which is afforded, in a measure at least, by the healing art.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 55"
