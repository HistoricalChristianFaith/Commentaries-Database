[[commentary]]
quote='''
We are also bound to anathematize all who speak of the Holy Ghost as ministerial, inasmuch as by this term they degrade Him to the rank of a creature. For that the ministering spirits are creatures we are told by Scripture in the words “they are all ministering spirits sent forth to minister.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520125.html'
source_title="Letter 125, Section 3"
