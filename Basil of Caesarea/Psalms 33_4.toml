[[commentary]]
quote='''
Now, what should those say who are singing? ‘That the word of the Lord is right.’ Therefore, he first summons the righteous to praise, since the Word of the Lord is righteous and is destined to be glorified, who ‘was in the beginning with God and was God.’ The Father, then, is righteous; the Son is righteous; the Holy Spirit is righteous.

‘And all his works are done with faithfulness.’ What does this mean? His work is the heavens, His work is the earth, His work is the sea, the air, all things inanimate, animate, rational, and irrational. How, then, are all things done with faithfulness? What sort of faith is there in inanimate objects? What is the faith of the brute beasts? What faith is there in a stone? What faith in a dog? Neither the inanimate object nor the beast is in faith. Nevertheless, the assertion excludes nothing, but includes all things when it says: ‘All his works are done with faithfulness.’ What, then, does this mean? ‘If you see the heavens,’ he says ‘and the order in them, they are a guide to faith, for through themselves they show the Craftsman; and, if you see the orderly arrangement about the earth, again through these things also your faith in God is increased. In fact, it is not by acquiring knowledge of God with our carnal eyes that we believe in Him, but by the power of the mind we have perceived the invisible God through visible things. Therefore, ‘all his works are done with faithfulness.’ Even if you consider the stone, it also possesses a certain proof of the power of its Maker: likewise, if you consider the ant or the gnat or the bee. Frequently in the smallest objects the wisdom of the Creator shines forth. He who unfolded the heavens and poured out the boundless expanses of the seas, He it is who hollowed out the very delicate sting of the bee like a tube, so that through it the poison might be poured out. Therefore ‘all his works are done with faithfulness.’ Do not say: ‘This happened by chance’ and ‘that occurred accidentally.’ Nothing is casual, nothing indeterminate, nothing happens at random, nothing among things that exist is caused by chance. And do not say ‘It is a bad mishap,’ or ‘it is an evil hour.’ These are the words of the untaught. ‘Are not two sparrows sold for a farthing? And yet not one of them will fall’ without the divine will. How many are the hairs of your head? Not one of them will be forgotten. Do you see the divine eye, how none of the least trifles escapes its glance?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
