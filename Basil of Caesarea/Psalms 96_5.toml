[[commentary]]
quote='''
For God in essence or substance is co-essential or con-substantial with God in essence or substance. But when even man is called “god” as in the words, “I have said ye are gods,” and “dæmon” as in the words, “The gods of the nations are dæmons,” in the former case the name is given by favour, in the latter untruly. God alone is substantially and essentially God. When I say “alone” I set forth the holy and uncreated essence and substance of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 3"
