[[commentary]]
quote='''
Accurately has the statement been added: ‘The death of the wicked is very evil,’ because there is a certain death of the just, not evil by nature, but good. In fact, those who die together with Christ have come into a good death; and those who have died to sin have died a good and salutary death. However, ‘the death of the wicked is very evil.’ Punishment follows after them, as also after the rich man who ‘clothed himself in purple and fine linen, and who feasted every day in splendid fashion.’

‘And they that hate the just shall be guilty.’ They also, who, since they are living in sin, hate the just, are thus convicted by the ways of the just man because of their proximity to the better, as by the straightness of a rule. Since they are living in sin, they conduct themselves hatefully toward the just man, being in fear of reproach; and because they hate, they again involve themselves in sins. Many are the pretexts on which the just man might be hated, outspokenness, for instance, in his reproofs. They hate the man who reproves them in the gate, and they loathe holy speech. Also, love for the first place and love of power have roused many to hatred of the rulers; sometimes, even ignorance of the reputation of the just man and of who is a just man. ‘The death of the wicked is very evil.’ Or, he even calls all life death, because the Apostle called this flesh death, when he said: ‘Who will deliver me from the body of this death?’ Those who use this body wickedly and make it the servant of sin prepare an evil death for themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
