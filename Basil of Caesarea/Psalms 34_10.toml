[[commentary]]
quote='''
‘The rich have wanted, and have suffered hunger; but they that seek the Lord shall not be deprived of any good.’ Let this word, which teaches the unreliability of excessive wealth, edify us even to the contempt of corporal riches. For, wealth is unstable and like a wave accustomed to change hither and thither by the violence of the wind. Perhaps he says that the people of Israel are rich, who have the adoption of sons and divine worship, the promises, and the fathers. They, however, have been poor because of their sin against the Lord. ‘But they that seek the Lord shall not be deprived of any good.’ They have wanted in a certain way and have suffered hunger. For, when they had put to death the Bread of life, a hunger for the Bread came upon them, and the chastisement from the thirst was imposed on them; but ‘the hunger was not for sensible bread nor the thirst, for water, but a hunger to hear the word of God.’ Therefore, ‘they have wanted and have suffered hunger.’

They, however, who have learned from the Gentiles to seek the Lord have not suffered the loss of every good. God Himself is absolute Good, and they who seek Him will not be without Him. Let no uninstructed person who considers the position concerning good and evil indistinguishable call him good who has a pleasure that is temporary and that departs with the death of the body. He who reduces bodily wealth and bodily advantages to the order of good draws down to matters cheap and not deserving of account a name that is holy and proper to God alone, and at the same time encounters the most serious contradiction. Either he will say that the apostles did not obtain bodily goods because they did not seek the Lord; or, if they did seek Him and failed to obtain such goods, he will bring a charge against the Scripture itself which says that they who seek the Lord do not suffer the loss of good. But, the saints also sought the Lord, and they did not fail in the knowledge of Him who was sought, nor were they deprived of the blessings stored up in the eternal rest. Concerning them one might say ‘of every good.’ For, bodily joys have more pain than pleasure; marriages involve childlessness, widowhood, corruption; agriculture, fruitlessness; trade, shipwrecks; wealth, plots; luxuries and satiety and continual pleasures, a variety of diseases, as well as sufferings of many kinds. Paul also sought the Lord and no blessing was wanting to him. And yet, who could enumerate the annoyances of the body, in which he lived during his whole life? ‘Thrice he was scourged, once he was stoned, thrice he suffered shipwreck, a night and a day he was adrift on the sea, in journeyings often . . . in hunger and thirst, in fastings often, in labor and hardships,’ in distresses frequently. A man hungering and thirsting and being naked and buffeted even to his last hour, surely, was suffering the loss of bodily blessings. Lift up your mind, I pray, to what is truly good in order that you may recognize the harmonious agreement of the Scripture, and may not let yourself fall into uncertainty of thought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
