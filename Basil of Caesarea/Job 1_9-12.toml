[[commentary]]
quote='''
Leaving the poor man, he now addresses his words to God; in the charge against the rich man he takes up the fact that he gives thanks to God only in prosperity, but no longer remains the same when some of the circumstances are darker. Such is also the accusation employed in the charge of the devil against Job, that Job did not reverence the Lord gratuitously, but he had a reward for his piety—wealth and the rest of his possessions. Therefore, for a proof of the virtue of the man, God stripped him of what he had in order that the gratitude of the man toward God might shine through all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
