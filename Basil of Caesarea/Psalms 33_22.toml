[[commentary]]
quote='''
‘Let thy mercy, O Lord, be upon us, as we have hoped in thee.’ Do you see how wisely he prayed? He has made a proper disposition the measure of the number of God’s mercies. ‘To such an extent,’ he says, ‘let thy mercy be upon us, as we have previously hoped in thee.’ All our hope is to return to eternal rest, in order that, after the body of our lowly condition has been changed, we may realize that this same body has been made like to the glorified Body of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
