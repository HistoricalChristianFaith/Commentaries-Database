[[commentary]]
quote='''
Supposing them to object to the word “God,” let them learn what this word means. God is called Θεὸς either because He placed (τεθεικέναι) all things or because He beholds (Θεᾶσθαι) all things. If He is called Θεὸς because He “placed” or “beholds” all things, and the Spirit knoweth all the things of God, as the Spirit in us knoweth our things, then the Holy Ghost is God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 11"

[[commentary]]
quote='''
But the greatest proof of the conjunction of the Spirit with the Father and the Son is that He is said to have the same relation to God which the spirit in us has to each of us. "For what man" it is said, "knoweth the things of a man, save the spirit of man which is in him? even so the things of God knoweth no man but the Spirit of God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 16"

[[commentary]]
quote='''
Do you call the Spirit a servant? But, it is said, "the servant knoweth not what his Lord doeth," and yet the Spirit knoweth the things of God, as "the spirit of man that is in him."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 19"
