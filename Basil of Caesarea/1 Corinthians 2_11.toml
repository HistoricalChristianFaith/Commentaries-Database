[[commentary]]
quote='''
Supposing them to object to the word “God,” let them learn what this word means. God is called Θεὸς either because He placed (τεθεικέναι) all things or because He beholds (Θεᾶσθαι) all things. If He is called Θεὸς because He “placed” or “beholds” all things, and the Spirit knoweth all the things of God, as the Spirit in us knoweth our things, then the Holy Ghost is God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 11"
