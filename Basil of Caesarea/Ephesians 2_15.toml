[[commentary]]
quote='''
But where have the promises of the Gospel been blunted and destroyed as by his figments? So meanly and poorly has he dared to explain the blessed hope laid up for all who live according to the Gospel of Christ, as to reduce it to mere old wives’ fables and doctrines of Jews. He proclaims the renewal of the Temple, the observance of the worship of the Law, a typical high priest over again after the real High Priest, and a sacrifice for sins after the Lamb of God Who taketh away the sin of the world. He preaches partial baptisms after the one baptism, and the ashes of a heifer sprinkling the Church which, through its faith in Christ, has not spot or wrinkle, or any such thing; cleansing of leprosy after the painless state of the resurrection; an offering of jealousy when they neither marry nor are given in marriage; shew-bread after the Bread from heaven; burning lamps after the true Light. In a word, if the law of the Commandments has been done away with by dogmas, it is plain that under these circumstances the dogmas of Christ will be nullified by the injunctions of the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520265.html'
source_title="Letter 265, Section 2"
