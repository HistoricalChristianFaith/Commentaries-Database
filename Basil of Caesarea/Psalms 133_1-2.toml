[[commentary]]
quote='''
How will that good and pleasant thing, the dwelling of brethren together, which the Holy Spirit likens to unguent flowing down from the High Priest’s head, be accomplished by dwelling solitary? So it is an arena for athletics, a method of travelling forward, a continual exercise and practising in the Lord’s commandments, when the brethren dwell together.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 7"
