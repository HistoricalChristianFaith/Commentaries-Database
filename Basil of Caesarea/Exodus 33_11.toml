[[commentary]]
quote='''
All the Saints were famous for continence. The life of all the Saints and holy men, and the example of the Lord Himself when He sojourned in the flesh, will help us in this respect. Moses received the Law as a result of long continence in fasting and prayer, and heard the words of God “as if a man spoke to his own friend.” Elijah was deemed worthy of the vision of God at a time when he too had practised a similar measure of continence. And what of Daniel? How did he come to behold marvellous visions? Was it not after the twentieth day of his fast? How did the Three Children quench the power of the fire? Was it not by continence? And John’s whole life was inaugurated by continence. Even the Lord began His appearance by this.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 16"
