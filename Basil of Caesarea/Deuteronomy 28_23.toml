[[commentary]]
quote='''
In the curses on Israel it is said, “And thy heaven that is over thy head shall be brass.” What does this mean? It threatens him with a complete drought, with an absence of the aerial waters which cause the fruits of the earth to be brought forth and to grow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25203-On%2520the%2520Firmament.html'
source_title="The Hexaemeron, Homily 3: On the Firmament"
