[[commentary]]
quote='''
And He links these commandments in such a way that He transfers to Himself benefits conferred on one’s neighbour. For He says: “I was an hungred and ye gave me to eat,” and so on. To which He adds: “Inasmuch as ye did it to one of the least of these my brethren, ye did it unto me.”

Consequently, in keeping the first commandment one keeps also the second; and through the second one returns again to the first. And he who loves the Lord loves also, so it follows, his neighbour. For “he that loveth me” said the Lord “will keep my commandments.” But “this” He says “is my commandment, that ye love one another, as I have loved you.”? But again he who loves his neighbour fulfils love towards God, since God accepts the favour as conferred on Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 3"
