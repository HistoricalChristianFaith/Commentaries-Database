[[commentary]]
quote='''
‘Useless is the horse for safety; neither shall he be saved by the abundance of his strength.’ The horse has been excluded from the use of holy men. Neither does Israel, when she was successful in wars, seem to have used cavalry forces nor did any one of the holy men accept the private use of horses as proper for them. Pharaoh used a cavalry, and the arrogant Sennacherib took pride in the great number of his horses. Wherefore, He cast into the sea Pharaoh’s cavalry and the riders; and all the horsemen of Sennacherib slept. Whence, also, the law given by Moses, which ordains the duties of kings, says: ‘He shall not multiply horses to himself.’ ‘Neither shall he be saved by the abundance of his strength.’ ‘For when I am weak, then I am strong.’ For the abundance of bodily strength is a hindrance to the safety of the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
