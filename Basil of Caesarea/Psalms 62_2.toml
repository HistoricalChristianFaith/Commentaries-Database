[[commentary]]
quote='''
‘For he is my God and my savior: he is my protector, I shall be moved no more.’ The Son, who is from God, is our God. He Himself is also Savior of the human race, who supports our weakness, who corrects the disturbance that springs up in our souls from temptations. ‘I shall be moved no more.’ Humanly he confesses his disturbance. ‘More.’ For, it is impossible that there should not be some disturbance from temptations in the soul of man. While we are committing small and few sins, we are in a way mildly disturbed, being tossed about like the leaves by a gentle breeze; but, when our vices are more and greater, in proportion to the increase of our sins the disturbance is wont to be intensified. And some are moved more; but others, to the extent of being thrown down, even the self-rooted being overturned, whenever the spirits of evil, more violently than any hurricane, sever the roots, as it were, of the soul, by which it was supported through faith in God. I, accordingly, he says, was disturbed as a man; but, I shall not be disturbed more, because I am supported by the right hand of the Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252061.html'
source_title="Homily on Psalm 61"
