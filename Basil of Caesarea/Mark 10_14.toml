[[commentary]]
quote='''
Since the Lord says: “Suffer the children to come unto me,” and the Apostle praises him who from a babe has learned sacred letters, and elsewhere enjoins the bringing up of children in the nurture and admonition of the Lord, we judge every time, even that of early youth, to be fitting for the reception of novices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 15"
