[[commentary]]
quote='''
Then he says: ‘And he labored forever, and shall live unto the end.’ His self-existence, His might, His untiring nature labored in this life, when ‘wearied from the journey, he was sitting at the well.’

‘He shall not see destruction, when he shall see the wise dying’ (for, the Father will not permit His Holy One to see corruption), when they shall die who boast of their wisdom which is ceasing. But, if you wish to take the words in reference to just men, remember the saying of Job: ‘Man is born to labor,’ and again, that of the Apostle: ‘I have labored more than any of them,’ and also: ‘In many more labors.’ He, then, who has labored in this life will live unto the end; but he who spends his time in softness and all laxity because of his luxurious living, ‘who is clothed in purple and fine linen, and feasting every day in splendid fashion,’ and flees the labors imposed by virtue, has neither labored in this life nor will he live in the future, but he will see life afar off, while being racked in the fire of the furnace. But, he who has sweated in numberless contests for the sake of virtue, and who, to attain it, has been proved in many more labors, he is the one who is going to live unto the end, just as Lazarus, who labored much in afflictions, and just as Job, who was very weary in the contests against the adversary. ‘For, there,’ he says, ‘the wearied are at rest.’ Therefore, the Lord calls to rest those who labor and are burdened.

Now, how are those who are laboring in good works said to be burdened? Because ‘Going they went and wept, casting their seeds. But coming they shall come with joyfulness, carrying their sheaves’ full of fruits, which were rendered to them in the proportion in which they were sown. So they are said to be burdened, who, because ‘they sow bountifully, also reap bountifully,’ and with everlasting joy lay upon their shoulders the sheaves of spiritual fruits. He, then, who has been redeemed by God who gave the ransom for him, labored for this life, but, after this he will live unto the end. He also ‘shall not see destruction, when he will see the wise dying.’

He who chose the narrow and wearisome road instead of the smooth and open one, at the time of the visitation of God, when those who did not believe in the words of God, but went after the desires of their vain hearts, will be led away to everlasting punishment, he, I say, will not see the everlasting destruction, the eternal misery. But he says, indeed, that the wise are skilled in knavery, and Jeremia says concerning them: ‘They are wise to do evil, but to do good they have no knowledge.’ Or, he says also, that the wise are the disciples of the perishing princes of this world, who, ‘While professing to be wise, have become fools.’ For, ‘The wisdom of this world is foolishness with God.’ And because this wisdom makes men foolish, God says that He will destroy the wisdom of the wise and will set at naught the prudence of the prudent. Therefore, these persuasions of falsely called knowledge provide a cause of death to those who receive them. But, this death he will not see who was redeemed by Him who was well pleased to save those trusting in the foolishness of His proclamation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
