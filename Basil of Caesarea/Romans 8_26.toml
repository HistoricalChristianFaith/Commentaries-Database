[[commentary]]
quote='''
But, it is said that "He maketh intercession for us." It follows then that, as the suppliant is inferior to the benefactor, so far is the Spirit inferior in dignity to God. But have you never heard concerning the Only-begotten that He "is at the right hand of God, who also maketh intercession for us"? Do not, then, because the Spirit is in you,—if indeed He is at all in you,—nor yet because He teaches us who were blinded, and guides us to the choice of what profits us,—do not for this reason allow yourself to be deprived of the right and holy opinion concerning Him. For to make the loving kindness of your benefactor a ground of ingratitude were indeed a very extravagance of unfairness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 19"
