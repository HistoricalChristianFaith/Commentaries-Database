[[commentary]]
quote='''
For, behold, the Lord for the greatness of His love of men was not content with teaching the word only, but that accurately and clearly He might give us a pattern of humility in the perfection of love He girded Himself and washed the feet of the disciples in person. Whose feet then wilt thou wash? Whom wilt thou care for? In comparison with whom wilt thou be last if thou livest by thyself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 7"
