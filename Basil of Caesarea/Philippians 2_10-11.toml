[[commentary]]
quote='''
Among these titles, it is when He is styled Door, or Way, that the phrase "through Him" is very appropriate and plain. As, however, God and Son, He is glorified with and together with the Father, in that "at, the name of Jesus every knee should bow, of things in heaven, and things in earth, and things under the earth; and that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father." Wherefore we use both terms, expressing by the one His own proper dignity, and by the other His grace to usward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
