[[commentary]]
quote='''
For this cause the Lord, who is the Dispenser of our life, gave us the covenant of baptism, containing a type of life and death, for the water fulfils the image of death, and the Spirit gives us the earnest of life. Hence it follows that the answer to our question why the water was associated with the Spirit is clear: the reason is because in baptism two ends were proposed; on the one hand, the destroying of the body of sin, that it may never bear fruit unto death; on the other hand, our living unto the Spirit, and having our fruit in holiness; the water receiving the body as in a tomb figures death, while the Spirit pours in the quickening power, renewing our souls from the deadness of sin unto their original life. This then is what it is to be born again of water and of the Spirit, the being made dead being effected in the water, while our life is wrought in us through the Spirit. In three immersions, then, and with three invocations, the great mystery of baptism is performed, to the end that the type of death may be fully figured, and that by the tradition of the divine knowledge the baptized may have their souls enlightened. It follows that if there is any grace in the water, it is not of the nature of the water, but of the presence of the Spirit. For baptism is "not the putting away of the filth of the flesh, but the answer of a good conscience towards God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 15"
