[[commentary]]
quote='''
Yet they never stop dinning in our ears that the ascription of glory "with" the Holy Spirit is unauthorized and unscriptural and the like. We have stated that so far as the sense goes it is the same to say "glory be to the Father and to the Son and to the Holy Ghost," and glory be to the Father and to the Son with the Holy Ghost." It is impossible for any one to reject or cancel the syllable "and," which is derived from the very words of our Lord, and there is nothing to hinder the acceptance of its equivalent. What amount of difference and similarity there is between the two we have already shewn. And our argument is confirmed by the fact that the Apostle uses either word indifferently,—saying at one time "in the name of the Lord Jesus and by the Spirit of our God;" at another "when ye are gathered together, and my Spirit, with the power of our Lord Jesus," with no idea that it makes any difference to the connexion of the names whether he use the conjunction or the preposition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 27"
