[[commentary]]
quote='''
Further, to the sinner it is easier to depart from sin when he fears the condemnation passed by a number in agreement, so that the words apply to him: “Sufficient to such a one is this punishment, which was inflicted by the many”; while the virtuous man receives much assurance when the many approve and assent to his work. For if in the mouth of two or three witnesses every word shall be established, much more stedfastly to be sure will he who accomplishes a good work be confirmed by the testimony of the many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 7"
