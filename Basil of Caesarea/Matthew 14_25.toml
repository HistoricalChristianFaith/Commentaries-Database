[[commentary]]
quote='''
Continency is a grace of God. Jesus seemed to be continency, when He was made light to land and sea; for He was carried neither by earth nor ocean, and just as He walked on the sea, so He did not weigh down the earth. For if death comes of corruption, and not dying comes of not having corruption, then Jesus wrought not mortality but divinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520366.html'
source_title="Letter 366"
