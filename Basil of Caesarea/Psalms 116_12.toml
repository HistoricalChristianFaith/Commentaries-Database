[[commentary]]
quote='''
Moreover He took our weaknesses and bore our diseases, and was wounded on our behalf, that by His stripes we may be healed. And He redeemed us from the curse, having become a curse on our behalf, and underwent the most dishonourable death, that He might bring us to the life of glory. And He was not content merely to quicken us when we were dead, but He bestowed the dignity of divinity, and prepared eternal resting-places, surpassing all human thought in the greatness of their delight. What then shall we render to the Lord for all the benefits which He hath bestowed upon us? He is so good as to ask no recompense but is content merely with being loved in return for His gifts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 2"
