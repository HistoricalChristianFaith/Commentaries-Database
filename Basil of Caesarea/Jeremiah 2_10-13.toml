[[commentary]]
quote='''
Even that last horror has come to pass which I shrink from saying, and yet cannot leave unsaid, for it is as a burning and blazing fire in my bones, and I am undone and cannot endure. You have taken the members of Christ and made them the members of a harlot. This is an evil with which no other can be matched. This outrage in life is new. “For pass over the Isles of Chittim and see; and send unto Chedar and consider diligently, and see if there be such a thing. Hath a nation changed their gods which are yet no gods.” But the virgin has changed her glory, and her glory is in her shame. The heavens are astonished at this, and the earth is horribly afraid, saith the Lord, for the virgin has committed two evils; she has forsaken Me, the true and holy Bridegroom of holy souls, and has betaken herself to an impious and lawless destroyer of body and soul alike. She has revolted from God, her Saviour, and yielded her members servants to uncleanness and to iniquity. She forgot me and went after her lover from whom she will get no good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252046.html'
source_title="Letter 46, Section 3"
