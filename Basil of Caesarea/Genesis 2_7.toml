[[commentary]]
quote='''
And He did not leave Him when He had risen from the dead; for when renewing man, and, by breathing on the face of the disciples, restoring the grace, that came of the inbreathing of God, which man had lost, what did the Lord say? "Receive ye the Holy Ghost: whose soever sins ye remit, they are remitted unto them; and whose soever ye retain, they are retained."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 16"

[[commentary]]
quote='''
He has fallen a little below the dignity of the angels because of his union with the earthly body. In fact, He made man from the earth, ‘And his ministers a flame of fire.’ But still, the power of understanding and recognizing their own Creator and Maker also belongs to men. ‘And he breathed into his nostrils,’ that is to say, He placed in man some share of His own grace, in order that he might recognize likeness through likeness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
