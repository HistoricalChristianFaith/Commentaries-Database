[[commentary]]
quote='''
"And he breathed into his nostrils," that is to say, he placed in man some share of his own grace, in order that he might recognize likeness through likeness. Nevertheless, being in such great honor because he was created in the image of the Creator, he is honored above the heavens, above the sun, above the choirs of stars. For which of the heavenly bodies was said to be an image of the most high God?
'''
source_url=''
source_title="HOMILY ON PSALM 48"

[[commentary]]
quote='''
And He did not leave Him when He had risen from the dead; for when renewing man, and, by breathing on the face of the disciples, restoring the grace, that came of the inbreathing of God, which man had lost, what did the Lord say? "Receive ye the Holy Ghost: whose soever sins ye remit, they are remitted unto them; and whose soever ye retain, they are retained."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 16"
