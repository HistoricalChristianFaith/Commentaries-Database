[[commentary]]
quote='''
For instance, whenever the Lord is called the Way, we are carried on to a higher meaning, and not to that which is derived from the vulgar sense of the word. We understand by Way that advance to perfection which is made stage by stage, and in regular order, through the works of righteousness and "the illumination of knowledge;" ever longing after what is before, and reaching forth unto those things which remain, until we shall have reached the blessed end, the knowledge of God, which the Lord through Himself bestows on them that have trusted in Him. For our Lord is an essentially good Way, where erring and straying are unknown, to that which is essentially good, to the Father. For "no one," He says, "cometh to the Father but ["by" A.V.] through me." Such is our way up to God "through the Son."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
