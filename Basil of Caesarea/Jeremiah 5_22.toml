[[commentary]]
quote='''
For ye are not ignorant that we, being exposed to all, as rocks running out in the sea, sustain the fury of the heretical waves, which, in that they break around us, do not cover the district behind. I say “we” in order to refer it, not to human power, but to the grace of God, Who, by the weakness of men shows His power, as says the prophet in the person of the Lord, ‘Will ye not fear Me, who have placed the sand as a boundary to the sea?’ for by the weakest and most contemptible of all things, the sand, the Mighty One has bounded the great and full sea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520203.html'
source_title="Letter 203, Section 1"

[[commentary]]
quote='''
For fear the water should spread beyond its bed, and in its successive invasions cover one by one all countries, and end by flooding the whole earth, it received the order to gather unto one place. Thus we often see the furious sea raising mighty waves to the heaven, and, when once it has touched the shore, break its impetuosity in foam and retire. “Fear ye not me, saith the Lord.…which have placed the sand for the bound of the sea.” A grain of sand, the weakest thing possible, curbs the violence of the ocean. For what would prevent the Red Sea from invading the whole of Egypt, which lies lower, and uniting itself to the other sea which bathes its shores, were it not fettered by the fiat of the Creator? And if I say that Egypt is lower than the Red Sea, it is because experience has convinced us of it every time that an attempt has been made to join the sea of Egypt to the Indian Ocean, of which the Red Sea is a part. Thus we have renounced this enterprise, as also have the Egyptian Sesostris, who conceived the idea, and Darius the Mede who afterwards wished to carry it out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25204-Upon%2520the%2520Gathering%2520Together%2520of%2520the%2520Waters.html'
source_title="The Hexaemeron, Homily 4: Upon the Gathering Together of the Waters"
