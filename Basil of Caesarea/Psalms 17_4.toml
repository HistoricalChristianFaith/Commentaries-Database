[[commentary]]
quote='''
Do not trouble yourself about worldly life; from it no good can come to you. It is said, “That my mouth speak not the works of men.” The man who is fond of talking about sinners’ doings, soon rouses the desire for self indulgence; much better busy yourself about the lives of good men for so you will get some profit for yourself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 2"

[[commentary]]
quote='''
I only hope that I may never have time enough on my hands to tell of all their doings—who were gathered together, how each one had been ordained, and from what kind of earlier life each arrived at his present dignity. I have been taught to pray “that my mouth may not utter the works of the men.” If you enquire you will learn these things for yourself, and, if they are hidden from you, they will not assuredly continue hidden from the judges.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520244.html'
source_title="Letter 244, Section 7"
