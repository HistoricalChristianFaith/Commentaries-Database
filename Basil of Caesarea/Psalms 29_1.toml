[[commentary]]
quote='''
The twenty-eighth psalm has a general title, for it says, ‘A psalm of David,’ and it has something specific also, since it adds, ‘at the finishing of the tabernacle.’ But, what is this? Let us consider what the finishing is and what the tabernacle is, in order that we may be able to meditate on the meaning of the psalm. Now, as regards the history, it will seem that the order was given to the priests and Levites who had acquitted themselves of the work to remember what they ought to prepare for the divine service. Scripture, furthermore, solemnly declares to those going out and departing from the tabernacle what it is proper for them to prepare and to have for their assembly on the following day: namely, ‘offspring of rams, glory and honor, glory to his name’; likewise it declares that nowhere else is it becoming to worship except in the court of the Lord and in the place of holiness. But, according to our mind which contemplates the sublime and makes the law familiar to us through a meaning which is noble and fitted to the divine Scripture, this occurs to us: the ram does not mean the male among the sheep; nor the tabernacle, the building constructed from this inanimate material; and the going out from the tabernacle does not mean the departure from the temple; but, the tabernacle for us is this body, as the Apostle taught us when he said: ‘We who are in this tabernacle sigh.’ And again, the psalm: ‘Nor shall the scourge come near thy dwelling.’ And the finishing of the tabernacle is the departure from this life, for which Scripture bids us to be prepared, bringing this thing and that to the Lord, since, indeed, our labor here is our provision for the future life. And that one who here bears glory and honor to the Lord through his good works will treasure up for himself glory and honor according to the just requital of the Judge.

In many copies we find added the words, ‘Bring to the Lord, O ye children of God.’ And, since indeed not everyone’s gift is acceptable to God, but only his who brings it with a pure heart, for Scripture says: ‘The vows of a hired courtesan are not pure’; and again, Jeremia says: ‘Shall not your vows and the holy flesh take away from you your crimes, or shall you be pure on account of these?’ therefore, the psalm first wants us to be the children of God, then to seek to carry our gifts to God, and not just any gifts, but whatever ones He Himself has appointed. First, say ‘Father,’ then ask for what follows from that. Examine from what kind of life you have presented yourself; whether you are worthy to call the Holy God your Father. Through holiness we have affection for the Holy One. If you wish to be always the son of the Holy One, let holiness adopt you as a son. Therefore, ‘bring to the Lord,’ not you who are just any persons nor who are sons of just any persons, but you who are children of God. You may be sure that He demands great gifts; therefore, He chooses great men to offer them. In order that he may not cast your thoughts down to earth, and make you seek a ram, that irrational beast and bleating animal, as if you expected to appease God by sacrificing it, he says: ‘Bring to the Lord, O ye children of the Lord.’ There is no need of a son that you may offer the son himself, but, if a son is something great, it is proper for the offering to be something great and worthy of the affection of a son and of the dignity of the Father. He says: ‘Bring the offspring of rams,’ that, when they are offered by you, they may be changed from the state of offspring of rams into that of children of God.

The ram is an animal capable of leading, one which guides the sheep to nourishing pastures and refreshing waters, and back again to the pens and farmhouses. Such are those who are set over the flock of Christ, since they lead them forth to the flowery and fragrant nourishment of spiritual doctrine, water them with living water, the gift of the Spirit, raise them up and nourish them to produce fruit, but guide them to rest and to safety from those who lay snares for them. Scripture wishes, then, the children of these to be led forth to the Lord by the children of God. If the leaders of the rest are the rams, their children would be those formed to a life of virtue through zeal for good works by the teaching of the leaders. Therefore, ‘Bring to the Lord, O ye children of God; bring to the Lord the offspring of rams.’ Have you learned to whom it was addressed? Have you learned concerning whom he spoke?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"

[[commentary]]
quote='''
‘Bring to the Lord,’ he says, ‘glory and honor.’ Now, how do we, dust and ashes, offer glory to the great Lord? And how honor? Glory, through our good works, when our works shine before men, so that men seeing our works give glory to our Father in heaven. And through temperance and holiness which is incumbent upon those who profess piety it is possible to give glory to God, according to the admonition of Paul, who said: ‘Glorify God in your members.’ The Lord also demands this glory from those who believe in Him and who have been honored with the gift of the adoption of sons. ‘The son’ it is said, ‘honoreth the father,’ and, ‘if then I be a father, where is my honor?’ He truly bears honor to God, who according to the proverb honors God by his just labors and offers to Him the first fruits of his justice. Everyone who discusses divine matters in an orderly way so as always to hold the correct opinion concerning the Father, the Godhead of the Only-begotten, and the glory of the Holy Spirit, brings glory and honor to the Lord. And, because His providence penetrates even to the smallest things, he increases the glory who is able to give the reasons for which all things were created and for which they are preserved, and also for which, after this present stewardship, they will be brought to judgment. He who is able himself to contemplate each individual creature with clear and unconfused thoughts and, after having contemplated them himself, is able to present to others also the facts concerning the goodness of God and His just judgment, he is the one who brings glory and honor to the Lord and who lives a life in harmony with this contemplation. For, the light of such a man shines before men, since by word and work and through manly deeds of every kind the Father in heaven is glorified.

He does not bring glory and honor to the Lord who becomes passionately stirred over human glory, nor he who prizes money, nor he who sets great store on the pleasures of the body, nor he who regards with admiration strange religious beliefs. Just as through good works we bring glory to the Lord, so through wicked works we do the opposite. What, indeed, does He say to sinners? ‘My name is blasphemed through you among the Gentiles.’ Again, the Apostle says: ‘Dost thou dishonor God by transgressing the Law?’ For, contempt and disregard of the laws is an insult to the Lawgiver. When a house is badly managed, and in it are found passion and screaming, insolence and mocking laughter, wantonness and profligacy, impurity and licentiousness, the disgrace and shame of what happens fall upon him who is its master. Consequently, we believe that, as in good works God is honored, so in wicked works the enemy is honored. When ‘I shall take the members of Christ and make them members of a harlot,’ I have transferred the glory from Him who saved me to him who destroys me. The unbeliever ‘changes the glory of the incorruptible God for an image made like to corruptible man and to birds and four-footed beasts and creeping things’ on earth. And he who worships and serves the creature more than the Creator does not bring glory to God, but to the creatures. Therefore, let him who says that a creature is some great thing and then worships it, know with what party he himself will be placed.

Let us fear lest, by bringing glory and occasions of exultation to the devil through our sins, we may be handed over to everlasting shame with him. That our sin becomes glory for him who effects it in us, understand by a similitude. When two generals make an attack upon each other, and one army wins, its commander receives the glory; but, when the opposing one is victorious, the honor is in turn transferred to him. Thus, the Lord is the One honored in your good deeds, but in your contrary acts His opponent is honored. Do not, I pray, consider that the enemy is far from you, and do not look at the leaders from afar, but examine yourself and you will find all the truth of the similitude. For, when the mind wrestles with passion, if, indeed, it prevails through vigor and attention, it wins the prize of victory over the passion and by its own means, as it were, it crowns God. But, when it becomes soft and stoops to pleasure, being made a slave and captive of sins, it gives to the enemy a cause of boasting and conceit and an opportunity for pride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"
