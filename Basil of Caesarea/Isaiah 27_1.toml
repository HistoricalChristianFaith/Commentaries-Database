[[commentary]]
quote='''
In the same way the serpent, which is the author of sin, is called crooked, and the sword of God is drawn against the dragon, the crooked serpent, which makes many twists and turns in its progress. As the coiling movement of the serpent trails along, it is traced unevenly on the ground, since, if it were otherwise, the first parts would hasten along, the next follow transversely and the tail bend aside in the opposite direction. Therefore, he who follows the serpent shows that his life is crooked, uneven, and filled with contrarieties; but, he who follows after the Lord makes his paths straight and his footprints right.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
