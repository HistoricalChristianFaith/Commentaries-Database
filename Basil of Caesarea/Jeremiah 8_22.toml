[[commentary]]
quote='''
And just as in the one case we put up with operations and cauterisings and the taking of bitter drugs for the treatment of the body, so also in this case we must receive the cutting effects of words of rebuke and the bitter drugs of blame for the cure of the soul. This is what the prophetic word says by way of rebuke to those who have not received correction: “Is there no balm in Gilead? Is there no physician there? Why has not the healing of the daughter of my people gone up?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 55"
