[[commentary]]
quote='''
And just as in the one case we put up with operations and cauterisings and the taking of bitter drugs for the treatment of the body, so also in this case we must receive the cutting effects of words of rebuke and the bitter drugs of blame for the cure of the soul. This is what the prophetic word says by way of rebuke to those who have not received correction: “Is there no balm in Gilead? Is there no physician there? Why has not the healing of the daughter of my people gone up?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 55"

[[commentary]]
quote='''
In such a state of things as this, “Shall they fall and not arise? Shall he turn away and not return?” Why did the virgin turn shamefully away, though she had heard Christ her bridegroom saying through the mouth of Jeremiah, “And I said, after she had done all these things (committed all these fornications, LXX.), turn thou unto me, but she returned not?” “Is there no balm in Gilead; is there no physician there? Why then is not the health of the daughter of my people recovered?” You might indeed find many remedies for evil in Scripture, many medicines to save from destruction and lead to health; the mysteries of death and resurrection, the sentences of terrible judgment and everlasting punishment; the doctrines of repentance and of remission of sins; all the countless illustrations of conversion, the piece of money, the sheep, the son who wasted his substance with harlots, who was lost and was found, who was dead and alive again. Let us not use these remedies for ill; by these means let us heal our soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252046.html'
source_title="Letter 46, Section 5"
