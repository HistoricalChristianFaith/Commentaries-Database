[[commentary]]
quote='''
But we, thinking perhaps that we have fulfilled one commandment—I would not say having actually fulfilled, for the commandments are joined one to another according to the sound meaning of Scripture, so that, if one be broken, the others are of necessity also broken—do not expect the wrath of God for those which we have transgressed, while for the keeping of one commandment we actually look for honours.

He who from the ten talents entrusted to him has retained one or two, and has restored the others, is not declared to be good because he has restored the greater part, but is shown to be both wicked and grasping because he has kept back the smaller part. Why do I say “kept back”? He that was entrusted with one talent, and gave back that very one whole and unharmed as he had received it, is nevertheless condemned because he did not add anything to that which was given him. He that has honoured his father for ten years and then inflicts one single blow upon him is not honoured as a benefactor, but is condemned as a parricide. “Go ye,” said the Lord, “and make disciples of all the nations, teaching them,” not to observe some things and neglect others, but “to observe all things whatsoever I commanded you.” And the apostle writes in like manner: “Giving no occasion of stumbling in anything, that our ministration be not blamed; but in everything commending ourselves as ministers of God.” For if all these things had not been necessary for the attainment of our salvation, all the commandments would not have been written; nor would they all have been prescribed of necessity for our observance. What is the use of my other virtues, if through calling my brother a fool I am in danger of hell? What is the use of being free from the majority of sins, if one is held in bondage by one single sin? For it is said, “Every one that committeth sin is the bond servant of sin.” And what gain has he who is free from many diseases, if his body is afflicted with one disease?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Preface"
