[[commentary]]
quote='''
Now it is urged that the Spirit is in us as a gift from God, and that the gift is not reverenced with the same honour as that which is attributed to the giver. The Spirit is a gift of God, but a gift of life, for the law of "the Spirit of life," it is said, "hath made" us "free;" and a gift of power, for "ye shall receive power after that the Holy Ghost is come upon you." Is He on this account to be lightly esteemed? Did not God also bestow His Son as a free gift to mankind? "He that spared not His own Son," it is said, "but delivered Him up for us all, how shall He not with Him also freely give us all things?" And in another place, "that we might truly know the things that are freely given us of God," in reference to the mystery of the Incarnation. It follows then that the maintainers of such arguments, in making the greatness of God's loving kindness an occasion of blasphemy, have really surpassed the ingratitude of the Jews. They find fault with the Spirit because He gives us freedom to call God our Father. "For God hath sent forth the Spirit of His Son into" our "hearts crying Abba, Father," that the voice of the Spirit may become the very voice of them that have received him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 24"
