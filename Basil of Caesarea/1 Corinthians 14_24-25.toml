[[commentary]]
quote='''
Let us then revert to the point raised from the outset, that in all things the Holy Spirit is inseparable and wholly incapable of being parted from the Father and the Son. St. Paul, in the passage about the gift of tongues, writes to the Corinthians, "If ye all prophesy and there come in one that believeth not, or one unlearned, he is convinced of all, he is judged of all; and thus are the secrets of the heart made manifest; and so falling down on his face he will worship God and report that God is in you of a truth." If then God is known to be in the prophets by the prophesying that is acting according to the distribution of the gifts of the Spirit, let our adversaries consider what kind of place they will attribute to the Holy Spirit. Let them say whether it is more proper to rank Him with God or to thrust Him forth to the place of the creature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 16"
