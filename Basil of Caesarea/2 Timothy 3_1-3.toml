[[commentary]]
quote='''
That incontinence is a fearful thing, the Apostle showed, when he mentioned it among the characteristics of apostasy and said: “In the last days grievous times shall come. For men shall be lovers of self.” Then after enumerating various forms of vice he added, “slanderers, incontinent.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 16"
