[[commentary]]
quote='''
So it is an arena for athletics, a method of travelling forward, a continual exercise and practising in the Lord’s commandments, when the brethren dwell together. It has as its object the glory of God according to the commandment of our Lord Jesus Christ Who said: “Let your light so shine before men that they may see your good works and glorify your Father which is in heaven.” And it keeps the stamp of those Saints told of in the Acts, of whom it is written: “And all that believed were together and had all things common.” And again: “And the multitude of them that believed were of one heart and soul; and not one of them said that aught of the things which he possessed was his own; but they had all things common.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 7"

[[commentary]]
quote='''
Those who have been once received into the brotherhood must not be allowed by the Superior to be led away by any distraction: they must not leave the brethren and lead a life free from observation, under pretext of visiting relations, nor must they be permitted to have the anxieties of looking after their kinsmen according to the flesh. For the Scripture absolutely forbids the words “mine” and “thine” to be used in the brotherhood. “For” it says “all that believed had one heart and soul; and not one of them said that aught of the things he possessed was his own.” So let a man’s parents or brothers according to the flesh, if they live in godly fashion, be cared for by all the brethren, as fathers or friends of all. “For whosoever shall do the will of my Father which is in heaven,” saith the Lord, “he is my brother and sister and mother.” The care of such we judge should devolve upon the Superior of the brotherhood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 32"

[[commentary]]
quote='''
And the Saints in the Acts bear witness to this frequently, of whom it is written, in one place: “The multitude of them that believed were of one heart and soul,” and in another place: “All that believed were together, and had all things common.” So it is obvious that there was no division among them all, nor did each live under his own authority, but all had one and the same care—and that too although the total number was five thousand, and with such a number one would think perhaps there were no few obstacles to union. But where men living in a single parish are found so inferior in numbers to those, what in reason allows them to remain separated from one another?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 35"
