[[commentary]]
quote='''
A man has passed away who surpassed all his contemporaries in all the good things that are within man’s reach; a prop of his country; an ornament of the churches; a pillar and support of the truth; a stay of the faith of Christ; a protector of his friends; a stout foe of his opponents; a guardian of the principles of his fathers; an enemy of innovation; exhibiting in himself the ancient fashion of the Church, and making the state of the Church put under him conform to the ancient constitution, as to a sacred model, so that all who lived with him seemed to live in the society of them that used to shine like lights in the world two hundred years ago and more. So your bishop put forth nothing of his own, no novel invention; but, as the blessing of Moses has it, he knew how to bring out of the secret and good stores of his heart, “old store, and the old because of the new.” Thus it came about that in meetings of his fellow bishops he was not ranked according to his age, but, by reason of the old age of his wisdom, he was unanimously conceded precedence over all the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252028.html'
source_title="Letter 28, Section 1"
