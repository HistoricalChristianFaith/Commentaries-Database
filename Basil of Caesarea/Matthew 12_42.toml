[[commentary]]
quote='''
There is still another meaning for the word ‘judge,’ as when the Lord says: ‘The queen of the South will rise up in the judgment and will condemn this generation.’ He says that those who refuse the divine teaching and are without love for the noble and good, and who abandon completely the doctrines which tend to teach wisdom, by comparison and contrast with those of their own generation who excel in zeal for the noble and good, receive a more severe condemnation in the matters which they neglected.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
