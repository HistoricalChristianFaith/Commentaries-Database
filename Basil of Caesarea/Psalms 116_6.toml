[[commentary]]
quote='''
‘The Lord is the keeper of little ones; I was humbled, and he delivered me.’ According to natural reason human nature would not stand unless the little ones and those still infants were kept by the Lord. For, unless it was preserved by the custody of God, how could the fetus in the mother be nourished or moved while it was in such narrow spaces, with no room for turning, and while it lived in dark and moist places, unable to take a breath or to live the life of men, but, on the contrary, was borne around in liquids like the fish? And how would it last even for a short time after it had come out into this unaccustomed place and, lacking the warmth within the mother, had become chilled all over by the air, unless it was preserved by God? Therefore, ‘the Lord is the keeper of little ones; I was humbled, and he delivered me.’ Or, you may understand these words thus. When I was turned and became as a little child and received the kingdom of heaven as a child and through innocence brought myself down to the humility of children, ‘the Lord, the keeper of little ones,’ since I was humbled, ‘delivered me.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%2520114.html'
source_title="Homily on Psalm 114"
