[[commentary]]
quote='''
The Holy God has promised a happy of issue out of all their infirmities to those that trust in Him. We, therefore, though we have been cut off in a mid-ocean of troubles, though we are tossed by the great waves raised up against us by the spirits of wickedness, nevertheless hold out in Christ Who strengthens us. We have not slackened the strength of our zeal for the Churches, nor, as though despairing of our salvation, while the billows in the tempest rise above our heads, do we look to be destroyed. On the contrary, we are still holding out with all possible earnestness, remembering how even he who was swallowed by the sea monster, because he did not despair of his life, but cried to the Lord, was saved. Thus too we, though we have reached the last pitch of peril, do not give up our hope in God. On every side we see His succour round about us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520242.html'
source_title="Letter 242, Section 1"
