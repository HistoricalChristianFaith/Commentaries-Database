[[commentary]]
quote='''
Since then it is impossible to be saved, unless we do those works which are according to the commandment of God, nor is it without danger to neglect any precept—for it is terrible arrogance to make ourselves the judges of our Lawgiver, and to approve some of His laws and reject others—let us who endure the conflict of piety and lead the life of calm and rest, regard such a life with honour, as being our fellow worker in keeping the Gospel decrees, and one and all take careful heed that no commandment escape us. For if the man of God must be perfect—as it is written, and as our words have already shown—it is before all things necessary that he be made perfect in every commandment, according to “the measure of the stature of the fulness of Christ”; for by the divine law a beast with a blemish, even if he was clean, was not accepted as a sacrifice to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Preface"
