[[commentary]]
quote='''
Moreover the surpassing excellence of the nature of the Spirit is to be learned not only from His having the same title as the Father and the Son, and sharing in their operations, but also from His being, like the Father and the Son, unapproachable in thought. For what our Lord says of the Father as being above and beyond human conception, and what He says of the Son, this same language He uses also of the Holy Ghost. "O righteous Father," He says, "the world hath not known Thee," meaning here by the world not the complex whole compounded of heaven and earth, but this life of ours subject to death, and exposed to innumerable vicissitudes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 22"
