[[commentary]]
quote='''
What shall we say of your having by tremendous oaths bound souls which fled for refuge to God, when what is more than yea and nay is carefully attributed to the devil? You have made yourself security for fatal perjury; and, by setting the ascetic character at nought, you have cast blame even upon the Apostles and the very Lord Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252045.html'
source_title="Letter 45, Section 2"

[[commentary]]
quote='''
Oaths were shunned by Gregory, that pure soul, worthy of the fellowship of the Holy Ghost, content with yea and nay, in accordance with the commandment of the Lord Who said, “I say unto you swear not at all.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520207.html'
source_title="Letter 207, Section 4"
