[[commentary]]
quote='''
Wherefore let them hear yet another testimony which distinctly calls the Spirit Lord. "The Lord," it is said, "is that Spirit;" and again "even as from the Lord the Spirit." But to leave no ground for objection, I will quote the actual words of the Apostle;—"For even unto this day remaineth the same veil untaken away in the reading of the Old Testament, which veil is done away in Christ. . . . Nevertheless, when it shall turn to the Lord, the veil shall be taken away. Now the Lord is that Spirit." Why does he speak thus? Because he who abides in the bare sense of the letter, and in it busies himself with the observances of the Law, has, as it were, got his own heart enveloped in the Jewish acceptance of the letter, like a veil; and this befalls him because of his ignorance that the bodily observance of the Law is done away by the presence of Christ, in that for the future the types are transferred to the reality. Lamps are made needless by the advent of the sun; and, on the appearance of the truth, the occupation of the Law is gone, and prophecy is hushed into silence. He, on the contrary, who has been empowered to look down into the depth of the meaning of the Law, and, after passing through the obscurity of the letter, as through a veil, to arrive within things unspeakable, is like Moses taking off the veil when he spoke with God. He, too, turns from the letter to the Spirit. So with the veil on the face of Moses corresponds the obscurity of the teaching of the Law, and spiritual contemplation with the turning to the Lord. He, then, who in the reading of the Law takes away the letter and turns to the Lord,—and the Lord is now called the Spirit,—becomes moreover like Moses, who had his face glorified by the manifestation of God. For just as objects which lie near brilliant colours are themselves tinted by the brightness which is shed around, so is he who fixes his gaze firmly on the Spirit by the Spirit's glory somehow transfigured into greater splendour, having his heart lighted up, as it were, by some light streaming from the truth of the Spirit. And, this is "being changed from the glory" of the Spirit "into" His own "glory," not in niggard degree, nor dimly and indistinctly, but as we might expect any one to be who is enlightened by the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 21"
