[[commentary]]
quote='''
Let leave to travel be given only to the man who is able to complete his journey with benefit to his fellow-travellers, and without damage to himself. So that, if no suitable person be available, it is better to endure all affliction and distress, even unto death by reason of lack of necessaries, rather than, for the sake of bodily comfort, to overlook certain harm to the soul. “For it were good for me” says the apostle “rather to die than that any man should make my glorying void.” And if this was true of things which were permitted to the apostle, how much rather does it apply to matters of commandment?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 44"
