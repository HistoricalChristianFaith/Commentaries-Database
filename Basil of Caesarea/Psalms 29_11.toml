[[commentary]]
quote='''
‘The Lord will give strength to his people: the Lord will bless his people with peace.’ From His erring people the Lord will take away the strong man and the strong woman, but to him who acts honestly He gives strength. Therefore, ‘to everyone who has shall be given.’ He who is confirmed in the performance of good works becomes worthy of the blessing of God. Peace, which is a certain stability of mind, seems to be the most perfect of blessings, so that the peaceful man is distinguished by the calmness of his character, but, he who is attacked by his passions has not yet participated in the peace from God, which the Lord gave to His disciples, and which, surpassing all understanding, will keep the souls of the worthy. For this, the Apostle also prays for the churches, saying: ‘Grace and peace be multiplied to you.’ May it be granted to us, after we have struggled nobly and subdued the spirit of the flesh, which is an enemy to God, when our soul is in a calm and tranquil state, to be called the sons of peace, and to share the blessing of God in peace, in Christ Jesus our Lord, to whom be glory and power, now and always, and forever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"
