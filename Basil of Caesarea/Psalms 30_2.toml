[[commentary]]
quote='''
‘O Lord my God, I have cried to thee, and thou hast healed me.’ Blessed is he who knows his own interior wound so that he can approach the physician and say: ‘Heal me, O Lord, for my bones are troubled,’ and ‘I said: O Lord, be thou merciful to me: heal my soul, for I have sinned against thee.’ Here, however, there is thanksgiving for the healing that has been conferred; for he says, ‘O Lord my God.’ God is not the God of all, but of those who are united with Him through love. He is the God of Abraham, and the God of Isaac, and the God of Jacob.’ If He were the God of all, He would not have borne this witness to them as something special. Again, Jacob says: ‘My God has helped you.’ And Thomas, embracing the Lord with the fullest assurance, says: ‘My Lord and my God.’ The expression, then, ‘O Lord my God,’ is spontaneous, and is proper to the state of the prophets. ‘I have cried to thee, and thou hast healed me.’ There was no interval between my voice and your grace, but at the same time that I cried out the healing came to me. While you are still calling, it is said, ‘I shall say, “Behold I am here.”’ In praying to God, therefore, we should speak loudly, in order that a speedy healing may be sent forth to us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
