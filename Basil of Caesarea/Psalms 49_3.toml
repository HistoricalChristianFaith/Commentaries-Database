[[commentary]]
quote='''
‘My mouth shall speak wisdom: and the meditation of my heart understanding.’ Since, according to the Apostle, ‘With the heart a man believes unto justice, and with the mouth profession of faith is made unto salvation,’ truly, the action of both in men suggests perfection; therefore, the sentence has brought the two together in the same place, the action of the mouth and the attention of the heart. If, indeed, goodness had not been stored up beforehand in the heart, how would he who did not possess it in secret bring forth the treasure through his mouth? And if, having good things in his heart, he would not make them public by speech, it will be said to him: ‘Wisdom that is hid, and treasure that is not seen: what profit is there in them both?’ Therefore, for the profit of others let my mouth speak wisdom, and for our own progress let my heart meditate prudence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
