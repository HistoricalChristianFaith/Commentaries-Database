[[commentary]]
quote='''
The great Physician of souls, Who is the ready liberator, not of you alone, but of all who are enslaved by sin, is ready to heal your sickness. From Him come the words, it was His sweet and saving lips that said, “They that be whole need not a physician but they that are sick.…I am not come to call the righteous but sinners to repentance.” What excuse have you, what excuse has any one, when He speaks thus? The Lord wishes to cleanse you from the trouble of your sickness and to show you light after darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252046.html'
source_title="Letter 46, Section 6"
