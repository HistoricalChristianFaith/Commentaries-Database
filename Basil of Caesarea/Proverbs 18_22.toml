[[commentary]]
quote='''
If a man living with a wife is not satisfied with his marriage and falls into fornication, I account him a fornicator, and prolong his period of punishment. Nevertheless, we have no canon subjecting him to the charge of adultery, if the sin be committed against an unmarried woman. For the adulteress, it is said, “being polluted shall be polluted,” and she shall not return to her husband: and “He that keepeth an adulteress is a fool and impious.” He, however, who has committed fornication is not to be cut off from the society of his own wife. So the wife will receive the husband on his return from fornication, but the husband will expel the polluted woman from his house. The argument here is not easy, but the custom has so obtained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520199.html'
source_title="Letter 199, Canon 21"
