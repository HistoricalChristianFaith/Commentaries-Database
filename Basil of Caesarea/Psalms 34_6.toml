[[commentary]]
quote='''
‘This poor man cried, and the Lord heard him.’ Poverty is not always praiseworthy, but only that which is practiced intentionally according to the evangelical aim. Many are poor in their resources, but very grasping in their intention; poverty does not save these; on the contrary, their intention condemns them. Accordingly, not he who is poor is by all means blessed, but he who has considered the command of Christ better than the treasures of the world. These the Lord also pronounces blessed, when He says: ‘Blessed are the poor in spirit,’ not those poor in resources, but those who from their soul have chosen poverty. For, nothing that is not deliberate is to be pronounced blessed. Therefore, every virtue, but this one especially before all others, is characterized by the action of the free will. So it is said: ‘This poor man cried.’ By the demonstrative word for the man who was poor because of God, and hungry and thirsty and naked, he calls forth your understanding; ‘This poor man,’ all but pointing with his finger; this disciple of Christ. It is possible also to refer this expression to Christ, who being rich by nature, because all things belonging to the Father are His, became poor for our sakes in order that by His poverty we might become rich. Nearly every work that leads to the blessing, the Lord Himself began, setting Himself forth as an example to His disciples. Return to the blessings and you will find on examining each that He anticipated the teaching contained in the words by His deeds. ‘Blessed are the meek.’ How, then, shall we learn meekness? ‘Learn from me, for I am meek and humble of heart.’ ‘Blessed are the peacemakers.’ Who will teach us the beauty of peace? The Peacemaker Himself, who makes peace and reconciles two men into one new man; who made peaceful by the blood of His cross both things of heaven and those of earth. ‘Blessed are the poor.’ He Himself is the one who was poor and who emptied Himself in the form of a slave in order that ‘of his fullness we might all receive, grace for grace.’ If anyone, then, led by the holy and benevolent Spirit, not being presumptuous, but humbling himself in order that he may exalt the others, should call upon the Spirit, offering great prayers, and should utter nothing base or lowly because he is seeking terrestrial and worldly things, the cry of such a man will be heard by the Lord. What, therefore, is the aim of the prayer heard? To be delivered from all troubles, unwounded, unbent, and unenslaved by the pride of the flesh. Now, what is the manner in which the poor man is delivered?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
