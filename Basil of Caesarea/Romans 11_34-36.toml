[[commentary]]
quote='''
That the phrases are not opposed to one another and do not, like squadrons in war marshalled one against another, bring the natures to which they are applied into mutual conflict, is perfectly plain from the passage in question. The blessed Paul brings both phrases to bear upon one and the same subject, in the words "of him and through him and to him are all things." That this plainly refers to the Lord will be admitted even by a reader paying but small attention to the meaning of the words. The apostle has just quoted from the prophecy of Isaiah, "Who hath known the mind of the Lord, or who hath been his counsellor, and then goes on, "For of him and from him and to him are all things." That the prophet is speaking about God the Word, the Maker of all creation, may be learnt from what immediately precedes: "Who hath measured the waters in the hollow of his hand, and meted out heaven with the span, and comprehended the dust of the earth in a measure, and weighed the mountains in scales, and the hills in a balance? Who hath directed the Spirit of the Lord, or being his counsellor hath taught him?" Now the word "who" in this passage does not mean absolute impossibility, but rarity, as in the passage "Who will rise up for me against the evil doers?" and "What man is he that desireth life?" and "Who shall ascend into the hill of the Lord?" So is it in the passage in question, "Who hath directed [lxx., known] the Spirit of the Lord, or being his counsellor hath known him?" "For the Father loveth the Son and sheweth him all things." This is He who holds the earth, and hath grasped it with His hand, who brought all things to order and adornment, who poised the hills in their places, and measured the waters, and gave to all things in the universe their proper rank, who encompasseth the whole of heaven with but a small portion of His power, which, in a figure, the prophet calls a span. Well then did the apostle add "Of him and through him and to him are all things." For of Him, to all things that are, comes the cause of their being, according to the will of God the Father. Through Him all things have their continuance and constitution, for He created all things, and metes out to each severally what is necessary for its health and preservation. Wherefore to Him all things are turned, looking with irresistible longing and unspeakable affection to "the author" and maintainer "of" their "life," as it is written "The eyes of all wait upon thee," and again, "These wait all upon thee," and "Thou openest thine hand, and satisfiest the desire of every living thing."

But if our adversaries oppose this our interpretation, what argument will save them from being caught in their own trap?

For if they will not grant that the three expressions "of him" and "through him" and "to him" are spoken of the Lord, they cannot but be applied to God the Father. Then without question their rule will fall through, for we find not only "of whom," but also "through whom" applied to the Father. And if this latter phrase indicates nothing derogatory, why in the world should it be confined, as though conveying the sense of inferiority, to the Son? If it always and everywhere implies ministry, let them tell us to what superior the God of glory and Father of the Christ is subordinate.

They are thus overthrown by their own selves, while our position will be on both sides made sure. Suppose it proved that the passage refers to the Son, "of whom" will be found applicable to the Son. Suppose on the other hand it be insisted that the prophet's words relate to God, then it will be granted that "through whom" is properly used of God, and both phrases have equal value, in that both are used with equal force of God. Under either alternative both terms, being employed of one and the same Person, will be shewn to be equivalent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 5"
