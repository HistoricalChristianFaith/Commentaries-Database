[[commentary]]
quote='''
Not in the amount of money, not in the pride of power, not in the height of glory is victory gained, but the Lord freely gives his help to those who seek him through excessive affliction. Such was Paul, who made his afflictions his boast. Therefore he was able to say, "When I am weak, then I am strong." … Do you see where affliction leads you? To hope that does not disappoint..
'''
source_url=''
source_title="HOMILY 20 ON PSALM 59"

[[commentary]]
quote='''
Other virtues being practised in secret are seldom apparent to men; but continence makes the possessor conspicuous the moment one meets him. For as firm flesh and clear skin characterise the athlete, so the Christian is betokened by emaciation of body and paleness, which is the bloom of continence, showing that he is truly an athlete of Christ’s commandments. For he overcomes his enemy by the weakness of his body, and displays his strength in the contests of religion, as it is written: “When I am weak, then I am strong.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 17"

[[commentary]]
quote='''
My view is, that the Lord is for falling and rising again, not because some fall and others rise again, but because in us the worst falls and the better is set up. The advent of the Lord is destructive of our bodily affections and it rouses the proper qualities of the soul. As when Paul says, “When I am weak, then I am strong,” the same man is weak and is strong, but he is weak in the flesh and strong in the spirit. Thus the Lord does not give to some occasions of falling and to others occasions of rising. Those who fall, fall from the station in which they once were, but it is plain that the faithless man never stands, but is always dragged along the ground with the serpent whom he follows. He has then nowhere to fall from, because he has already been cast down by his unbelief. Wherefore the first boon is, that he who stands in his sin should fall and die, and then should live in righteousness and rise, both of which graces our faith in Christ confers on us. Let the worse fall that the better may have opportunity to rise. If fornication fall not, chastity does not rise. Unless our unreason be crushed our reason will not come to perfection. In this sense he is for the fall and rising again of many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520260.html'
source_title="Letter 260, Section 7"
