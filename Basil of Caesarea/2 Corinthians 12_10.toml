[[commentary]]
quote='''
Not in the amount of money, not in the pride of power, not in the height of glory is victory gained, but the Lord freely gives his help to those who seek him through excessive affliction. Such was Paul, who made his afflictions his boast. Therefore he was able to say, "When I am weak, then I am strong." … Do you see where affliction leads you? To hope that does not disappoint..
'''
source_url=''
source_title="HOMILY 20 ON PSALM 59"

[[commentary]]
quote='''
Other virtues being practised in secret are seldom apparent to men; but continence makes the possessor conspicuous the moment one meets him. For as firm flesh and clear skin characterise the athlete, so the Christian is betokened by emaciation of body and paleness, which is the bloom of continence, showing that he is truly an athlete of Christ’s commandments. For he overcomes his enemy by the weakness of his body, and displays his strength in the contests of religion, as it is written: “When I am weak, then I am strong.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 17"
