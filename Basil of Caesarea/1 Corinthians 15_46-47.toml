[[commentary]]
quote='''
Enough has been now said to prove, in contravention of their error, that the communion of Nature is in no wise dissolved by the manner of subnumeration. Let us, however, make a concession to our contentious and feeble minded adversary, and grant that what is second to anything is spoken of in subnumeration to it. Now let us see what follows. "The first man" it is said "is of the earth earthy, the second man is the Lord from heaven." Again "that was not first which is spiritual but that which is natural and afterward that which is spiritual." If then the second is subnumerated to the first, and the subnumerated is inferior in dignity to that to which it was subnumerated, according to you the spiritual is inferior in honour to the natural, and the heavenly man to the earthy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 18"
