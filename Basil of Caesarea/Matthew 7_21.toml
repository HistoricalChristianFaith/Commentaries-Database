[[commentary]]
quote='''
Yet some one may say that it is written: “Whosoever shall call upon the name of the Lord shall be saved,” so that the mere calling upon the name of the Lord is enough to save him that calls. Let him rather hearken to the apostle who says: “How shall they call upon him in whom they have not believed?” And if thou believest, hear the Lord Who says: “Not every one that saith unto me Lord, Lord, shall enter into the kingdom of heaven; but he that doeth the will of my Father which is in heaven.” For indeed when a man does the will of God, but not as God wills, nor with a disposition of love towards God, his zeal for good works is fruitless, according to the will of our Lord Jesus Christ, Who says: “This they do that they may be seen of men; verily I say unto you, they have received their reward.” Wherefore Paul was taught to say: “And if I bestow all my goods to feed the poor, and if I give my body to be burned, but have not love, it profiteth me nothing.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Preface"
