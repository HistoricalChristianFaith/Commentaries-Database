[[commentary]]
quote='''
Thus also we understand “No man knoweth,” to refer to the Father the first knowledge of things, both present and to be, and generally to exhibit to men the first cause. Otherwise how can this passage fall in with the rest of the evidence of Scripture, or agree with the common notions of us who believe that the Only-Begotten is the image of the invisible God, and image not of the bodily figure, but of the very Godhead and of the mighty qualities attributed to the essence of God, image of power, image of wisdom, as Christ is called “the power of God and the wisdom of God”? Now of wisdom knowledge is plainly a part; and if in any part He falls short, He is not an image of the whole; and how can we understand the Father not to have shewn that day and that hour—the smallest portion of the ages—to Him through Whom He made the ages? How can the Creator of the universe fall short of the knowledge of the smallest portion of the things created by Him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520236.html'
source_title="Letter 236, Section 1"
