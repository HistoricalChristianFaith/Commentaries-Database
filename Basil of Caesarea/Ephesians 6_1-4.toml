[[commentary]]
quote='''
Children love your parents, and you, “parents provoke not your children to wrath.” Does not nature say the same? Paul teaches us nothing new; he only tightens the links of nature. If the lioness loves her cubs, if the she wolf fights to defend her little ones, what shall man say who is unfaithful to the precept and violates nature herself; or the son who insults the old age of his father; or the father whose second marriage has made him forget his first children?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25209-The%2520Creation%2520of%2520Terrestrial%2520Animals.html'
source_title="The Hexaemeron, Homily 9: The Creation of Terrestrial Animals"
