[[commentary]]
quote='''
Meekness is indeed the greatest of the virtues; therefore, it is counted among the beatitudes. ‘Blessed are the meek,’ it is said, ‘for they shall possess the earth.’ For, that earth, the heavenly Jerusalem, does not become the booty of those who fight, but is appointed as the inheritance of the patient and meek. Moreover, the expression, ‘Let the meek hear,’ means the same as ‘Let the disciples of Christ hear.’ Perhaps, the wonder of the beneficence of God toward him is meant prophetically to pass over to us. In fact, let those hear, who many generations later will become disciples of Christ. For, he called those meek to whom the Lord said: ‘Learn from me, for I am meek and humble of heart.’ Those of calm character and so free from all passion that they have no confusion present in their souls, they are the ones called meek. Wherefore, Moses is acknowledged to be meeker than all men on the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
