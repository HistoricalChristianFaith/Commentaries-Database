[[commentary]]
quote='''
But if brethren go to one place or another in order to keep the commandment of the Lord, such men are not severing themselves but fulfilling their duty. But no other cause of separation from one’s brethren can be allowed. In the first place, any other cause dishonours the name of our Lord Jesus Christ which has brought us together; secondly, because (if other causes are admitted) the minds of individuals towards others cannot be pure but they will be suspicious of each other. And this is clearly opposed to the commandment of the Lord Who said: “If thou art offering thy gift at the altar, and there rememberest that thy brother hath aught against thee, leave there thy gift before the altar, and go thy way, first be reconciled to thy brother, and then come and offer thy gift.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 36"
