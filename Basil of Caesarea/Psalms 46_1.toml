[[commentary]]
quote='''
Unto the end, for the sons of Core, ‘a Psalm for the hidden.’

This psalm seems to me to contain the prophecy concerning the end of time. Paul, having knowledge of this end, says: ‘Then comes the end, when he delivers the kingdom to God the Father.’ Or, since our actions lead us to the end, each one to the end proper to itself, the good leading toward happiness, and the base toward eternal condemnation, and since the counsels delivered by the Spirit in this psalm lead those obeying them to the good end, therefore it has been entitled: ‘Unto the end,’ inasmuch as it is the record of the teachings for the happy end of human life. ‘For the sons of Core.’ This psalm is also said to be for the sons of Core, whom the Holy Spirit does not separate, since, as with one soul and one voice, with complete harmony toward each other, they utter the words of prophecy, while no one of them prophesies anything at all contrary to the others, but the gift of prophecy is given to them equally because of the equality of their mutual affection for the good. Moreover, the psalm is said to be ‘for the hidden,’ that is to say, for secret things, and those buried in mystery. Having meditated on the expressions of the psalm in turn, you will learn the hidden meaning of the words, and that it is not the privilege of any chance person to gaze at the divine mysteries, but of him alone who is able to be a harmonious instrument of the promise, so that his soul is moved by the action of the Holy Spirit in it instead of by the psaltery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"

[[commentary]]
quote='''
‘Our God is our refuge and strength: a helper in troubles, which have found us exceedingly.’ Because of the weakness present in him from nature, every man has need of much assistance, if many troubles and labors befall him. Seeking a refuge, therefore, from all precarious situations, like one fleeing to a place of sanctuary or having recourse to some sharp summit surrounded by a strong wall because of the attack of the enemy, so he flees to God, believing that a dwelling in Him is his only rest. Therefore, because flight to God was agreed upon by all, the enemy produced great illusion and confusion concerning the choice of the Savior. Plotting as an enemy, again he deceives the victims of his plots into thinking that they should flee to him as to a protector. Consequently, a twofold evil surrounds them, since they are either seized by force or destroyed by deceit. Therefore, the unbelievers flee to demons and idols, having the knowledge of the true God snatched away by the confusion which is produced in them by the devil.

They who recognize God err in the judgment of their affairs, making demands for useful things foolishly, asking for some things as good, which frequently are not for their advantage, and fleeing others as evil, though at times they bring great assistance to them. For example, is someone sick? Because he is fleeing the pain from the sickness, he prays for health. Did he lose his money? He is exceedingly pained by the loss. Yet, frequently the disease is useful when it will restrain the sinner, and health is harmful when it becomes the means for sin to one who possesses it. In the same manner, money also has already served some for licentiousness, while poverty has taught self-control to many who had begun badly. Do not flee, then, what you do not need to flee, and do not have recourse to him to whom it is unnecessary. But, one thing you must flee, sin; and one refuge from evil must be sought, God. Do not trust in princes; do not be exalted in the uncertainty of wealth; do not be proud of bodily strength; do not pursue the splendor of human glory. None of these things saves you; all are transient, all are deceptive. There is one refuge, God. ‘Cursed be the man that trusteth in man,’ or in any human thing.

Therefore, ‘God is our refuge and strength.’ To him who is able to say: ‘I can do all things in him,’ Christ, ‘who strengthens me,’ God is strength. Now, it is the privilege of many to say: ‘God is our refuge,’ and ‘Lord, thou hast been our refuge.’ But, to say it with the same feelings as the prophet is the privilege of few. For, there are few who do not admire human interests but depend wholly upon God and breathe Him and have all hope and trust in Him. And our actions convict us whenever in our afflictions we run to everything else rather than to God. Is a child sick? You look around for an enchanter or one who puts superstitious marks on the necks of the innocent children; or finally, you go to a doctor and to medicines, having neglected Him who is able to save. If a dream troubles you, you run to the interpreter of dreams. And, if you fear an enemy, you cunningly secure some man as a patron. In short, in every need you contradict yourself— in word, naming God as your refuge; in act, drawing on aid from useless and vain things. God is the true aid for the righteous man. Just as a certain general, equipped with a noble heavy-armed force, is always ready to give help to an oppressed district, so God is our Helper and an Ally to everyone who is waging war against the wiliness of the devil, and He sends out ministering spirits for the safety of those who are in need. Moreover, affliction will find every just man because of the established way of life. He who avoids the wide and broad way and travels the narrow and close one will be found by tribulations. The prophet formed the statement vividly when he said: ‘In troubles which have found us exceedingly.’ For, they overtake us like living creatures, ‘working out endurance, and through endurance tried virtue, and through tried virtue hope.’ Whence also, the Apostle said: ‘Through many tribulations we must enter the kingdom of God.’ And ‘Many are the afflictions of the just.’ But, he who generously and calmly endures the trial of affliction will say: ‘In all these things we overcome because of him who has loved us.’ And he is so far from refusing and shrinking from the afflictions that he makes the excessive evils an occasion of glory, saying: ‘And not only this, but we exult in tribulations also.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"
