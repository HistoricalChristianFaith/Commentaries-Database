[[commentary]]
quote='''
Because some make a wrong use of the medical art, that is no reason why we should shun all benefit derived from it. For when the intemperate followers of pleasure abuse the arts of cooking or baking or weaving to devise luxury, overstepping the bounds of what is necessary, we should not then shun all these arts alike: on the contrary, by using them rightly, we show up the corrupt use of them. So also in the case of medicine, it is wrong to slander God’s gift because of the evil use made of it. For to put the hope of one’s health in the hands of doctors is worthy of the lower animals—which we see happening in the case of some wretches, who do not shrink from calling them Saviours! While to avoid entirely the benefit of medicine shows a contentious spirit. But just as Hezekiah did not think the cake of figs the prime cause of his recovery, nor ascribe to it the cause of the healing of his body, but added to his praise of God his thanksgiving for the creation of the figs; so also we, receiving blows from God Who so kindly and wisely contrives our life, ask from Him first that we may know the reason why He inflicts stripes, then relief from pain and endurance, so that with the temptation He may also give us a way out, that we may be able to bear it.

We receive with thanksgiving the grace of healing that is given us, either by oil and wine as in the case of him that fell among robbers, or by figs, as in the case of Hezekiah. And it will make no difference to us whether the care of God has come to us invisibly or through some bodily means, which often leads us to perceive the grace of the Lord more effectively.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 55"
