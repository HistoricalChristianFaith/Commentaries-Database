[[commentary]]
quote='''
Let us not remain in this slothful ease, always losing through our slothfulness the present opportunity, and putting off to the morrow or distant future the beginning of our works, lest, being found unprovided with good works by Him Who demands our souls, we be cast forth from the joy of the bridechamber, shedding vain and useless tears, and lamenting our ill-spent life, at a time when repentance can no longer avail. “Now is the acceptable time,” says the apostle, “now is the day of salvation.” This is the age of repentance, that of reward: this of labour, that of recompense: this of patience, that of comfort. Now God is the helper of such as turn from the evil way: then He will be the terrible and inexorable examiner of all human deeds, words and thoughts. Now we enjoy His long-suffering: then we shall know His justice, when we shall rise again, some to eternal punishment, others to eternal life, and each shall receive according to his works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Preface"
