[[commentary]]
quote='''
The Apostle says, “Take heed lest there be in any of you an evil heart…in departing from the living God. But exhort one another…(and edify one another) while it is called to-day.” To-day means the whole time of our life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 5"
