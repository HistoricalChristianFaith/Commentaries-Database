[[commentary]]
quote='''
Do not be a stumbling block in any way to those you meet. Be cheerful, a lover of the brethren, gentle, humble. Do not demean the aim of hospitality by seeking extravagant foods. Be content with what is at hand. 
'''
source_url=''
source_title="Letter 42"

[[commentary]]
quote='''
He who has once forsworn marriage will, needless to say, forswear much more those cares which the apostle says distract the married man, namely, how he may please his wife, and will purge himself by every means from every care to please women, fearing the condemnation of Scripture: “God hath scattered the bones of the men-pleasers.” Accordingly he will not even consent to meet a man in order to please him; but if need demands, he will arrange a meeting for the sake of the service which according to God’s command every man has a right to expect from his neighbour. Such meetings are not to be allowed to anyone who wishes, nor is every time and place fitting for them. But if we mean according to the precept of the apostle to be without offence both to Jews and Greeks and to the Church of God, and to do all things decently and in order and with a view to edifying, then it is necessary that person, time, occasion, and place be carefully and fittingly chosen. By such precautions every shadow of evil suspicion will be banished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 33"
