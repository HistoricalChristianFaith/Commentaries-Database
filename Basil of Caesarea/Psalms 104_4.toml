[[commentary]]
quote='''
But there is no sanctification without the Spirit. The powers of the heavens are not holy by nature; were it so there would in this respect be no difference between them and the Holy Spirit. It is in proportion to their relative excellence that they have their meed of holiness from the Spirit. The branding-iron is conceived of together with the fire; and yet the material and the fire are distinct. Thus too in the case of the heavenly powers; their substance is, peradventure, an aerial spirit, or an immaterial fire, as it is written, "Who maketh his angels spirits and his ministers a flame of fire;" wherefore they exist in space and become visible, and appear in their proper bodily form to them that are worthy. But their sanctification, being external to their substance, superinduces their perfection through the communion of the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 16"
