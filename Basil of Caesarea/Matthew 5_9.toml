[[commentary]]
quote='''
I need hardly tell the sons of peace how great is the blessing of peace. But now this blessing, great, marvellous, and worthy as it is of being most strenuously sought by all that love the Lord, is in peril of being reduced to the bare name, because iniquity abounds, and the love of most men has waxed cold. I think then that the one great end of all who are really and truly serving the Lord ought to be to bring back to union the Churches now “at sundry times and in divers manners” divided from one another. In attempting myself to effect this, I cannot fairly be blamed as a busybody, for nothing is so characteristically Christian as the being a peacemaker, and for this reason our Lord has promised us peacemakers a very high reward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520114.html'
source_title="Letter 114"

[[commentary]]
quote='''
I am very anxious that you should know that he is great before God who humbly submits to his neighbour and submits to charges against himself, without having cause for shame, even though they are not true, that he may bring the great blessing of peace upon God’s Church.

I hope that there will arise among you a friendly rivalry, as to who shall first be worthy of being called God’s son, after winning this rank for himself because of his being a peacemaker.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520219.html'
source_title="Letter 219, Section 2"
