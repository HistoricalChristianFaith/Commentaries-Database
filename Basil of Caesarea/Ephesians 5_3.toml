[[commentary]]
quote='''
And how many other forms of unclean lust have been found out in the devils’ school, while divine scripture is silent about them, not choosing to befoul its dignity with the names of filthy things and condemning their uncleanness in general terms! As the apostle Paul says, “Fornication and all uncleanness…let it not be once named among you as becometh saints,” thus including the unspeakable doings of both males and females under the name of uncleanness. It follows that silence certainly does not give license to voluptuaries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520160.html'
source_title="Letter 160, Section 3"
