[[commentary]]
quote='''
Every fear is not a good and saving feeling, but there is also a hostile fear, which the prophet prays may not spring up in his soul, when he says: ‘Deliver my soul from the fear of the enemy.’ Fear of the enemy is that which produces in us a cowardliness with regard to death and misleads us to cower before distinguished persons. How, in fact, will he who fears these things be able in time of martyrdom to resist sin even to death and to pay his debt to the Lord, who died and rose again for us? He also, who is easily scared by the demons, has the fear of the enemy in him. On the whole, such a fear seems to be a passion born of unbelief. For, no one who believes that he has at hand a strong helper is frightened by any of those who attempt to throw him into confusion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
