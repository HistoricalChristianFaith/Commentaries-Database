[[commentary]]
quote='''
Since it often happens, either through bodily infirmity or the necessity of taking a journey or for some other reason, that the brotherhood is deprived of its Superior, let another be chosen, after full consideration by the Superior and others able to decide, for this purpose, that in the Superior’s absence he may take over the care of the brethren, so that those who remain there may have one from whom to receive the consolations of the word. This will ensure that the brotherhood does not assume a democratic appearance in the absence of the Superior, violating the rule and the traditional discipline; and that the accepted regulations are kept, to the glory of God; and that when strangers visit the monastery there is one to answer wisely, that they who seek the word may be edified in a manner worthy of the occasion, and that the community of the brethren be not put to shame. For that all alike should rush to speak causes disorders and argues lack of discipline, and the apostle did not allow even those who had been counted worthy to receive the grace of teaching to speak at once, saying: “But if a revelation be made to another, let the first keep silence,” and again he rebukes the wrongness of this lack of discipline in these words: “If therefore the whole Church be assembled together, and all speak with tongues, and there come in men unlearned and unbelieving, will they not say that ye are mad?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 45"
