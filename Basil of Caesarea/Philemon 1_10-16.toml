[[commentary]]
quote='''
When slaves who are under the yoke flee to the brotherhoods, they should be admonished and made better, and then restored to their masters. So doing we imitate the blessed Paul, who, though he had begotten Onesimus through the gospel, yet sent him back to Philemon, persuading the servant that the yoke of slavery borne in a manner well pleasing to the Lord renders him worthy of the Kingdom of heaven, and exhorting the master not only to forbear his threats against Onesimus, remembering the words of his true Master: “If ye forgive men their trespasses, your heavenly Father will also forgive your trespasses,” but also to have kinder feelings towards him—writing thus: “For perhaps he was therefore parted from thee for a season, that thou shouldest have him for ever, no longer as a servant, but more than a servant, a brother beloved.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 11"
