[[commentary]]
quote='''
When then He says, "I have not spoken of myself," and again, "As the Father said unto me, so I speak," and "The word which ye hear is not mine, but [the Father's] which sent me," and in another place, "As the Father gave me commandment, even so I do," it is not because He lacks deliberate purpose or power of initiation, nor yet because He has to wait for the preconcerted key-note, that he employs language of this kind. His object is to make it plain that His own will is connected in indissoluble union with the Father. Do not then let us understand by what is called a "commandment" a peremptory mandate delivered by organs of speech, and giving orders to the Son, as to a subordinate, concerning what He ought to do. Let us rather, in a sense befitting the Godhead, perceive a transmission of will, like the reflexion of an object in a mirror, passing without note of time from Father to Son. "For the Father loveth the Son and sheweth him all things," so that "all things that the Father hath" belong to the Son, not gradually accruing to Him little by little, but with Him all together and at once. Among men, the workman who has been thoroughly taught his craft, and, through long training, has sure and established experience in it, is able, in accordance with the scientific methods which now he has in store, to work for the future by himself. And are we to suppose that the wisdom of God, the Maker of all creation, He who is eternally perfect, who is wise, without a teacher, the Power of God, "in whom are hid all the treasures of wisdom and knowledge," needs piecemeal instruction to mark out the manner and measure of His operations? I presume that in the vanity of your calculations, you mean to open a school; you will make the one take His seat in the teacher's place, and the other stand by in a scholar's ignorance, gradually learning wisdom and advancing to perfection, by lessons given Him bit by bit. Hence, if you have sense to abide by what logically follows, you will find the Son being eternally taught, nor yet ever able to reach the end of perfection, inasmuch as the wisdom of the Father is infinite, and the end of the infinite is beyond apprehension. It results that whoever refuses to grant that the Son has all things from the beginning will never grant that He will reach perfection. But I am ashamed at the degraded conception to which, by the course of the argument, I have been brought down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
