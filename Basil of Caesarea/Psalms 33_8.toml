[[commentary]]
quote='''
‘Let all the earth fear the Lord, and let all the inhabitants of the world be in awe of him.’ Since the fear of the Lord is the beginning of knowledge, let those who are earthly minded be taught through fear. In fact, fear is necessarily employed as introductory to true religion, but love, now taking over, brings to perfection those who have been prepared by a fear that is capable of knowledge. To the whole earth, therefore, Scripture advises fear. ‘Let all the inhabitants of the world,’ it says, ‘be in awe of him.’ Let them make every movement, as it were, whether effected by the mind or by bodily action, according to the will of God. At least I understand the words, ‘Let them be in awe of him,’ in this way. For example, let neither the eye be moved without God, nor the hand be put in motion without God, nor the heart think on things not well pleasing to God. In short, let them be in awe of no one else, and let nothing move them except the fear of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
