[[commentary]]
quote='''
‘The Lord will judge the people.’ Words about judgment are scattered in many places in Scripture, as most cogent and essential for the teaching of true religion to those who believe in God through Jesus Christ. Since the words concerning the judgment are written with various meanings, they seem to hold some confusion for those who do not accurately distinguish the meanings. ‘He who believes in me is not judged; but he who does not believe is already judged.’ But, if he who does not believe, is the same as an impious man, how has it been said that the impious will not rise up in judgment? And, if those who believe have been made sons of God through faith, and for this reason are worthy of being called gods themselves, how does God stand in a congregation of gods, and in the midst will judge gods? Well, it seems that the word ‘judge’ is at times employed by Scripture in place of ‘approve,’ as in the expression, ‘Judge me, O Lord, for I have walked in my innocence,’ for, it continues there, ‘Prove me, O Lord, and try me’; and for ‘condemn’ as in the expression, ‘But if we judged ourselves, we should not thus be judged.’ If we examine ourselves well, it says, we would not be subjected to condemnation. Again, it says that the Lord will enter into judgment with all flesh, that is, in the examination of the actions in the lives of each He subjected Himself to judgment and compared His own precepts with the actions of sinners, defending Himself with proofs that He has done all things depending upon Him for the salvation of those judged, in order that the sinners, being persuaded that they are liable to punishment for sins and acknowledging the divine justice, may willingly accept the penalty falling to their lot.

There is still another meaning for the word ‘judge,’ as when the Lord says: ‘The queen of the South will rise up in the judgment and will condemn this generation.’ He says that those who refuse the divine teaching and are without love for the noble and good, and who abandon completely the doctrines which tend to teach wisdom, by comparison and contrast with those of their own generation who excel in zeal for the noble and good, receive a more severe condemnation in the matters which they neglected. But, I believe that all who have received this earthy body will not be judged in the same manner by the just Judge since outside influences, which are far different for each of us, cause the judgment in the case of each to vary. For the combination of circumstances not in our power, but involuntary, either makes our sins more grievous, or even lightens them. Suppose that the matter to be judged is fornication. But, one who was trained from the beginning in evil practices committed this sin. Now, he was not only brought into life by licentious parents but also was reared with bad habits, with drunkenness and revelings and shameful tales. On the other hand, if another who had many challenges to the most excellent things, education, teachers, hearing of more divine words, salutary reading, advice of parents, tales which mold to seriousness and self-control, an ordered manner of life, if he, then, was carried away into a like sin as the other and gives an account of his life, how is it possible that such a one will not rightly be considered deserving of a heavier penalty in comparison with the former? The one will be accused only on the ground that he did not use rightly the salutary inclinations implanted among his thoughts, but the other, in addition to this, because, although he obtained much assistance for salvation, through want of self-control and of attention, in a very short time he betrayed himself. Similarly also, he who has been trained from the beginning in piety and has escaped all perversion in the doctrines concerning God, and who has been brought up in the law of God which attacks every sin and invites to the opposite, will not have the same excuse for idolatry as he who was educated by lawless parents and by people taught from the beginning to worship idols.

‘The Lord will judge the people.’ In one way the Jew, and in another the Scythian. The first, indeed, rests content in the law and glories in God and approves the better things. Since he has been instructed by the law, and in addition to the general concepts has been taught the prophetic and legal writings by song and by training, if he is found to have made a false step contrary to the law, he will have far more grievous sins imputed to him. But, as for the Scythian nomads, who have been brought up with wild and inhuman practices, accustomed to robbery and acts of violence against each other, with no control of their temper and easily roused to bitter wrath against each other, accustomed, moreover, to judge all rivalry by the sword, and taught to put an end to fights with blood, if ever they show any humanity or goodness toward each other, they procure a more severe penalty for us because of their own virtuous actions.

‘Judge me, O Lord, according to my justice, and according to my innocence in me.’ These words seem to contain some boastfulness and to be very much like the prayer of the Pharisee who was exalting himself, but, if one considers them reasonably, the prophet will be seen to be far from such a disposition. ‘Judge me, O Lord,’ he says, ‘according to my justice.’ ‘There are many sayings about justice,’ he says, ‘and the limits of perfect justice are hard to reach.’ For, there is a justice of the angels, which transcends that of men, and, if there is any power above the angels, it has also a supremacy of justice proportionate to its greatness; and there is the justice of God Himself, which exceeds all understanding, which is inexpressible, and is incomprehensible to all created nature. ‘Judge me, therefore, O Lord, according to my justice,’ that is, according to that attainable by men and possible for those living in the flesh. ‘And according to my innocence in me.’ Thus especially, the disposition of the speaker proves to be very far from pharisaical arrogance; for, he names his innocence as if it were simplicity and ignorance of things useful to know according to the saying in the Proverbs: ‘The innocent believeth every word.’ Since, therefore, we men through ignorance fall unguardedly into many sins, he entreats God and asks to meet with pardon because of his innocence. From this it is evident that these words show the humility of the speaker rather than arrogance. ‘Judge me,’ he says, ‘according to my justice, and judge me according to the innocence which is in me.’ Comparing my justice with human frailty, thus judge me, and understanding the simplicity of my character, do not, as though I were shrewd or circumspect in the affairs of the world, at once condemn me as a sinner.
'''
