[[commentary]]
quote='''
He is not a slave, it is said; not a master, but free. Oh the terrible insensibility, the pitiable audacity, of them that maintain this! Shall I rather lament in them their ignorance or their blasphemy? They try to insult the doctrines that concern the divine nature by comparing them with the human, and endeavour to apply to the ineffable nature of God that common custom of human life whereby the difference of degrees is variable, not perceiving that among men no one is a slave by nature. For men are either brought under a yoke of slavery by conquest, as when prisoners are taken in war; or they are enslaved on account of poverty, as the Egyptians were oppressed by Pharaoh; or, by a wise and mysterious dispensation, the worst children are by their fathers' order condemned to serve the wiser and the better; and this any righteous enquirer into the circumstances would declare to be not a sentence of condemnation but a benefit. For it is more profitable that the man who, through lack of intelligence, has no natural principle of rule within himself, should become the chattel of another, to the end that, being guided by the reason of his master, he may be like a chariot with a charioteer, or a boat with a steersman seated at the tiller. For this reason Jacob by his father's blessing became lord of Esau, in order that the foolish son, who had not intelligence, his proper guardian, might, even though he wished it not, be benefited by his prudent brother. So Canaan shall be "a servant unto his brethren" because, since his father Ham was unwise, he was uninstructed in virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 20"
