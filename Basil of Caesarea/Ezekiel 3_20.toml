[[commentary]]
quote='''
Let him who is entrusted with the care of all behave as one who must give account for each individual; knowing that if one of the brethren fall into sin without his having declared to him beforehand the ordinance of God, or if having fallen into sin he abides therein, without having been taught the method of reformation, his blood will be required of the Superior’s hands, as Scripture says. And especially if he has knowingly neglected what pleases God and has weakened the discipline of the community by bearing with the evil ways of individuals in order to win their favour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 25"
