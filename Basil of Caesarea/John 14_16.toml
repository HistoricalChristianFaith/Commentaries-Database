[[commentary]]
quote='''
He is called Paraclete, like the Only begotten, as He Himself says, "I will ask the Father, and He will give you another comforter." Thus names are borne by the Spirit in common with the Father and the Son, and He gets these titles from His natural and close relationship. From what other source could they be derived?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 19"
