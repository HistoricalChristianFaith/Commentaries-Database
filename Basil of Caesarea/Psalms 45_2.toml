[[commentary]]
quote='''
It seemed best to us to interpret the next expression as beginning with itself and not to join it with the preceding, but to associate it with what follows. For the words, ‘Thou art ripe in beauty’ we think are spoken to the Lord by way of apostrophe.

‘Thou art ripe in beauty, above the sons of men: grace is poured abroad in thy lips.’ Both Aquila and Symmachus introduce us to this thought; the first saying, ‘Thou art adorned with beauty above the sons of men,’ and Symmachus, ‘Thou art beautiful with a beauty above the sons of men.’ Now, he [David] calls the Lord ripe in beauty when he fixes his gaze on His divinity. He does not celebrate the beauty of the flesh. ‘And we have seen him, and he had no sightliness, nor beauty, but his appearance was without honor and lacking above the sons of men.’ It is evident, then, that the prophet, looking upon His brilliancy and being filled with the splendor there, his soul smitten with this beauty, was moved to a divine love of the spiritual beauty, and when this appeared in the human soul all things hitherto loved seemed shameful and abominable. Therefore, even Paul, when he saw His ripe beauty ‘counted all things as dung that he might gain Christ.’ Those outside the word of truth, despising the simplicity of expression in the Scriptures, call the preaching of the Gospel folly; but we, who glory in the cross of Christ, ‘to whom the gifts bestowed on us by God were manifested through the Spirit, not in words taught by human wisdom,’ know that the grace poured out by God in the teachings concerning Christ is rich. Therefore, in a short time the teaching passed through almost the whole world, since grace, rich and plentiful, was poured out upon the preachers of the Gospel, whom Scripture called even the lips of Christ. Moreover, the message of the Gospel in its insignificant little words possesses great guidance and attraction toward salvation. And every soul is overcome by the unalterable doctrines, being strengthened by grace to an unshaken faith in Christ. Whence the Apostle says: ‘Through whom we have received grace and apostleship to bring about obedience to faith.’ And again: ‘I have labored more than any of them, yet not I, but the grace of God with me.’

‘Grace is poured abroad in thy lips; therefore hath God blessed thee forever.’ In the Gospel it has been written: ‘They marvelled at the words of grace that came from his mouth.’ The psalm, wishing to bring forward vividly the great amount of grace in the words spoken by our Lord, says: ‘Grace is poured abroad in thy lips,’ because of the abundance of grace in the words. ‘God hath blessed thee forever,’ it says. It is evident that these words refer to His human nature, as it advances ‘in wisdom and age and grace.’ According to this we clearly perceive that grace has been given to Him as the prize for His brave deeds. Similar to this is the saying: ‘Thou hast loved justice and hated iniquity: therefore God, thy God, hath anointed thee with the oil of gladness above thy fellows.’ The saying of Paul to the Philippians is also much like to this: ‘He humbled himself, becoming obedient to death, even to death on a cross. Therefore God also has exalted him.’ So that it is clear that these words were spoken concerning the Savior as a man. Or, there is this explanation. Since the Church is the body of the Lord, and He Himself is the head of the Church, just as we have explained that those ministering to the heavenly Word are the lips of Christ (even as Paul, or anyone else much like to him in virtue, had Christ speaking in himself), so also we, as many of us as are believers, are the other members of the body of Christ. Now, if anyone refers to the Lord the praise given to the Church, he will not sin. Therefore, the saying: ‘God hath blessed thee’; that is to say, He has filled thy members and thy body with blessings from Himself for eternity, that is to say, for time without end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252044.html'
source_title="Homily on Psalm 44"
