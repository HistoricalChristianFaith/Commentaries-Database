[[commentary]]
quote='''
God alone is substantially and essentially God. When I say “alone” I set forth the holy and uncreated essence and substance of God. For the word “alone” is used in the case of any individual and generally of human nature. In the case of an individual, as for instance of Paul, that he alone was caught into the third heaven and “heard unspeakable words which it is not lawful for a man to utter,” and of human nature, as when David says, “as for man his days are as grass,” not meaning any particular man, but human nature generally; for every man is short-lived and mortal. So we understand these words to be said of the nature, “who alone hath immortality” and “to God only wise,” and “none is good save one, that is God,” for here “one” means the same as alone. So also, “which alone spreadest out the heavens,” and again “Thou shalt worship the Lord thy God and Him only shalt thou serve.” “There is no God beside me.” In Scripture “one” and “only” are not predicated of God to mark distinction from the Son and the Holy Ghost, but to except the unreal gods falsely so called.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 3"
