[[commentary]]
quote='''
‘And man when he was in honor did not understand; he is compared to senseless beasts, and is become like to them. This way of theirs is a stumbling block to them: and afterwards they shall delight in their mouth.’ ‘Man is a great thing, and pitiful man is something honorable,’ who has his honor in his natural constitution. For, what other things on earth have been made according to the image of the Creator? To which of the animals that live on the land, or in the water, or in the air, has the rule and power over all things been given? He has fallen a little below the dignity of the angels because of his union with the earthly body. In fact, He made man from the earth, ‘And his ministers a flame of fire.’ But still, the power of understanding and recognizing their own Creator and Maker also belongs to men. ‘And he breathed into his nostrils,’ that is to say, He placed in man some share of His own grace, in order that he might recognize likeness through likeness. Nevertheless, being in such great honor because he was created in the image of the Creator, he is honored above the heavens, above the sun, above the choirs of stars. For, which of the heavenly bodies was said to be an image of the most high God? What sort of an image of his Creator does the sun preserve? What the moon? What the other stars? They possess only inanimate and material bodies that are clearly discernible, but in which nowhere there is a mind, no voluntary motions, no free will; on the contrary, they are servile through the necessity imposed upon them, through which they always behave precisely the same in the same circumstances.

Man, then, having been advanced above these things in honor, did not understand; and neglected to follow God and to become like his Creator, and, becoming a slave of the passions of the flesh, ‘He is compared to senseless beasts, and is become like to them’: now he is like an amorous horse which neighs after his neighbor’s wife, now like a ravenous wolf, lying in wait for strangers, but at another time, because of his deceit toward his brother, he makes himself like the villainous fox. Truly, there is excessive folly and beastlike lack of reason, that he, made according to the image of the Creator, neither perceives his own constitution from the beginning, nor even wishes to understand such great dispensations which were made for his sake, at least, to learn his own dignity from them, but that he is unmindful of the fact that, throwing aside the image of the heavenly, he has taken up the image of the earthly. In order that he might not remain in sin, for his sake ‘The Word was made flesh, and dwelt among us,’ and He humbled Himself to such an extent as to become ‘obedient to death, even to death on a cross.’ If you are not mindful of your first origin, because of the price paid for you, accept at least some idea of your dignity; look at that which was given in exchange for you and realize your own worth. You were bought with the precious blood of Christ; do not become a slave of sin. Understand your own honor, in order that you may not be made like the senseless beasts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
