[[commentary]]
quote='''
It is on thy account that He knows not the hour and the day of judgment. Yet nothing is beyond the ken of the real Wisdom, for “all things were made by Him;” and even among men no one is ignorant of what he has made. But this is His dispensation because of thine own infirmity, that sinners be not plunged into despair by the narrow limits of the appointed period, no opportunity for repentance being left them; and that, on the other hand, those who are waging a long war with the forces of the enemy may not desert their post on account of the protracted time. For both of these classes He arranges by means of His assumed ignorance; for the former cutting the time short for their glorious struggle’s sake; for the latter providing an opportunity for repentance because of their sins. In the gospels He numbered Himself among the ignorant, on account, as I have said, of the infirmity of the greater part of mankind. In the Acts of the Apostles, speaking, as it were, to the perfect apart, He says, “It is not for you to know the times or the seasons which the Father hath put in His own power.” Here He implicitly excepts Himself. So much for a rough statement by way of preliminary attack.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 6"

[[commentary]]
quote='''
Our Saviour’s holy disciples, after getting beyond the limits of human thought, and then being purified by the word, are enquiring about the end, and longing to know the ultimate blessedness which our Lord declared to be unknown to His angels and to Himself. He calls all the exact comprehension of the purposes of God, a day; and the contemplation of the One-ness and Unity, knowledge of which He attributes to the Father alone, an hour. I apprehend, therefore, that God is said to know of Himself what is; and not to know what is not; God, Who is, of His own nature, very righteousness and wisdom, is said to know righteousness and wisdom; but to be ignorant of unrighteousness and wickedness; for God who created us is not unrighteousness and wickedness. If, then, God is said to know about Himself that which is, and not to know that which is not; and if our Lord, according to the purpose of the Incarnation and the denser doctrine, is not the ultimate object of desire; then our Saviour does not know the end and the ultimate blessedness. But He says the angels do not know; that is to say, not even the contemplation which is in them, nor the methods of their ministries are the ultimate object of desire. For even their knowledge, when compared with the knowledge which is face to face, is dense. Only the Father, He says, knows, since He is Himself the end and the ultimate blessedness, for when we no longer know God in mirrors and not immediately, but approach Him as one and alone, then we shall know even the ultimate end. For all material knowledge is said to be the kingdom of Christ; while immaterial knowledge, and so to say the knowledge of actual Godhead, is that of God the Father. But our Lord is also Himself the end and the ultimate blessedness according to the purpose of the Word; for what does He say in the Gospel? “I will raise him up at the last day.” He calls the transition from material knowledge to immaterial contemplation a resurrection, speaking of that knowledge after which there is no other, as the last day: for our intelligence is raised up and roused to a height of blessedness at the time when it contemplates the One-ness and Unity of the Word. But since our intelligence is made dense and bound to earth, it is both commingled with clay and incapable of gazing intently in pure contemplation, being led through adornments cognate to its own body. It considers the operations of the Creator, and judges of them meanwhile by their effects, to the end that growing little by little it may one day wax strong enough to approach even the actual unveiled Godhead. This is the meaning, I think, of the words “my Father is greater than I,” and also of the statement, “It is not mine to give save to those for whom it is prepared by my Father.” This too is what is meant by Christ’s “delivering up the kingdom to God even the Father;” inasmuch as according to the denser doctrine which, as I said, is regarded relatively to us and not to the Son Himself, He is not the end but the first fruits. It is in accordance with this view that when His disciples asked Him again in the Acts of the Apostles, “When wilt thou restore the kingdom of Israel?” He replied, “It is not for you to know the times or the seasons which the Father hath put in His own power.” That is to say, the knowledge of such a kingdom is not for them that are bound in flesh and blood. This contemplation the Father hath put away in His own power, meaning by “power” those that are empowered, and by “His own” those who are not held down by the ignorance of things below. Do not, I beg you, have in mind times and seasons of sense but certain distinctions of knowledge made by the sun apprehended by mental perception. For our Lord’s prayer must be carried out. It is Jesus Who prayed “Grant that they may be one in us as I and Thou are one, Father.” For when God, Who is one, is in each, He makes all one; and number is lost in the in-dwelling of Unity.

This is my second attempt to attack the text. If any one has a better interpretation to give, and can consistently with true religion amend what I say, let him speak and let him amend, and the Lord will reward him for me. There is no jealousy in my heart. I have not approached this investigation of these passages for strife and vain glory. I have done so to help my brothers, lest the earthen vessels which hold the treasure of God should seem to be deceived by stony-hearted and uncircumcised men, whose weapons are the wisdom of folly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 7"

[[commentary]]
quote='''
Enquiry has already frequently been made concerning the saying of the gospels as to our Lord Jesus Christ’s ignorance of the day and of the hour of the end; an objection constantly put forward by the Anomœans to the destruction of the glory of the Only-Begotten, in order to show Him to be unlike in essence and subordinate in dignity; inasmuch as, if He know not all things, He cannot possess the same nature nor be regarded as of one likeness with Him, who by His own prescience and faculty of forecasting the future has knowledge coextensive with the universe. This question has now been proposed to me by your intelligence as a new one. I can give in reply the answer which I heard from our fathers when I was a boy, and which on account of my love for what is good, I have received without question. I do not expect that it can undo the shamelessness of them that fight against Christ, for where is the reasoning strong enough to stand their attack? It may, however, suffice to convince all that love the Lord, and in whom the previous assurance supplied them by faith is stronger than any demonstration of reason.

Now “no man” seems to be a general expression, so that not even one person is excepted by it, but this is not its use in Scripture, as I have observed in the passage “there is none good but one, that is, God.” For even in this passage the Son does not so speak to the exclusion of Himself from the good nature. But, since the Father is the first good, we believe the words “no man” to have been uttered with the understood addition of “first.” So with the passage “No man knoweth the Son but the Father;” even here there is no charge of ignorance against the Spirit, but only a testimony that knowledge of His own nature naturally belongs to the Father first. Thus also we understand “No man knoweth,” to refer to the Father the first knowledge of things, both present and to be, and generally to exhibit to men the first cause. Otherwise how can this passage fall in with the rest of the evidence of Scripture, or agree with the common notions of us who believe that the Only-Begotten is the image of the invisible God, and image not of the bodily figure, but of the very Godhead and of the mighty qualities attributed to the essence of God, image of power, image of wisdom, as Christ is called “the power of God and the wisdom of God”? Now of wisdom knowledge is plainly a part; and if in any part He falls short, He is not an image of the whole; and how can we understand the Father not to have shewn that day and that hour—the smallest portion of the ages—to Him through Whom He made the ages? How can the Creator of the universe fall short of the knowledge of the smallest portion of the things created by Him? How can He who says, when the end is near, that such and such signs shall appear in heaven and in earth, be ignorant of the end itself? When He says, “The end is not yet.” He makes a definite statement, as though with knowledge and not in doubt. Then further, it is plain to the fair enquirer that our Lord says many things to men, in the character of man; as for instance, “give me to drink” is a saying of our Lord, expressive of His bodily necessity; and yet the asker was not soulless flesh, but Godhead using flesh endued with soul. So in the present instance no one will be carried beyond the bounds of the interpretation of true religion, who understands the ignorance of him who had received all things according to the œconomy, and was advancing with God and man in favour and wisdom.

It would be worthy of your diligence to set the phrases of the Gospel side by side, and compare together those of Matthew and those of Mark, for these two alone are found in concurrence in this passage. The wording of Matthew is “of that day and hour knoweth no man, no, not the angels of heaven, but my Father only.” That of Mark runs, “But of that day and that hour knoweth no man, no, not the angels which are in heaven, neither the Son, but the Father.” What is noticeable in these passages is this; that Matthew says nothing about the ignorance of the Son, and seems to agree with Mark as to sense in saying “but my Father only.” Now I understand the word “only” to have been used in contradistinction to the angels, but that the Son is not included with His own servants in ignorance.

He could not say what is false Who said “All things that the Father hath are Mine,” but one of the things which the Father hath is knowledge of that day and of that hour. In the passage in Matthew, then, the Lord made no mention of His own Person, as a matter beyond controversy, and said that the angels knew not and that His Father alone knew, tacitly asserting the knowledge of His Father to be His own knowledge too, because of what He had said elsewhere, “as the Father knoweth me even so know I the Father,” and if the Father has complete knowledge of the Son, nothing excepted, so that He knows all knowledge to dwell in Him, He will clearly be known as fully by the Son with all His inherent wisdom and all His knowledge of things to come. This modification, I think, may be given to the words of Matthew, “but my Father only.” Now as to the words of Mark, who appears distinctly to exclude the Son from the knowledge, my opinion is this. No man knoweth, neither the angels of God; nor yet the Son would have known unless the Father had known: that is, the cause of the Son’s knowing comes from the Father. To a fair hearer there is no violence in this interpretation, because the word “only” is not added as it is in Matthew. Mark’s sense, then, is as follows: of that day and of that hour knoweth no man, nor the angels of God; but even the Son would not have known if the Father had not known, for the knowledge naturally His was given by the Father. This is very decorous and becoming the divine nature to say of the Son, because He has, His knowledge and His being, beheld in all the wisdom and glory which become His Godhead, from Him with Whom He is consubstantial.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520236.html'
source_title="Letter 236, Sections 1-2"
