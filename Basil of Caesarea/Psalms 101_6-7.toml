[[commentary]]
quote='''
Wherefore the works of the hesitating and gainsaying man are to be removed from the brotherhood. The Superiors must give strict attention to this matter, lest they violate the decree of him that said: “He that walked in a perfect way, he ministered unto me. He that wrought proudly did not dwell in the midst of my house”; and lest when a man mingles sin with his observance of the commandment and defiles his work by lazy shrinking from toil, or else by elation because of his achievement, they allow him to remain in his depravity in view of what they receive from him, not permitting him to attain a perception of his own sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 29"
