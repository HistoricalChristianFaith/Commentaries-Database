[[commentary]]
quote='''
We have learnt from the Apostle, "the Lord direct your hearts into the love of God and into the patient waiting for Christ" for our tribulations. Who is the Lord that directs into the love of God and into the patient waiting for Christ for tribulations? Let those men answer us who are for making a slave of the Holy Spirit. For if the argument had been about God the Father, it would certainly have said, 'the Lord direct you into His own love,' or if about the Son, it would have added 'into His own patience.' Let them then seek what other Person there is who is worthy to be honoured with the title of Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 21"
