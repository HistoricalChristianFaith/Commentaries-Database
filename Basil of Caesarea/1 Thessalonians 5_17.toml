[[commentary]]
quote='''
Now since some get off work under pretext of prayers and psalmody, you must know that for each separate task there is a special time, as Ecclesiastes says: “There is a time for everything.” But for prayer and psalmody, as for many other things, every time is suitable; so that we praise God with psalms and hymns and spiritual songs while we move our hands in work with the tongue if it is possible, and conducive to the edification of the faith,—but if not, then in the heart, giving thanks to Him Who gave both strength of hand to work and wisdom of brain to know how to work, and also bestowed means by which to work both in the tools we use and the arts we practise, whatever the work be. We pray moreover that the works of our hands may be directed towards the mark of pleasing God.

Thus then we secure stedfastness in our soul, by asking God to prosper our work in every undertaking, rendering thanksgiving to Him Who gave the power to work, and observing the aim of pleasing Him, as we said before. For, unless these are our methods, how can we make what was said by the apostle consistent: “Pray without ceasing” and “working night and day”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 37"
