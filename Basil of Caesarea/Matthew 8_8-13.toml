[[commentary]]
quote='''
Do not be anxious to go travelling about from village to village and house to house; rather avoid them as traps for souls. If any one, for true pity’s sake, invite you with many pleas to enter his house, let him be told to follow the faith of the centurion, who, when Jesus was hastening to him to perform an act of healing, besought him not to do so in the words, “Lord I am not worthy that thou shouldest come under my roof, but speak the word only and my servant shall be healed,” and when Jesus had said to him “Go thy way; as thou hast believed, so be it done unto thee,” his servant was healed from that hour. Learn then, brother, that it was the faith of the suppliant, not the presence of Christ, which delivered the sick man. So too now, if you pray, in whatever place you be, and the sick man believes that he will be aided by your prayers, all will fall out as he desires.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 2"
