[[commentary]]
quote='''
This psalm seems to be one that is adapted to perfecting human nature and that provides assistance for attaining the prescribed end for those who have elected to live in virtue. Indeed, in order that those advancing may attain perfection, there is need of the teaching which is provided by this psalm with the inscription, ‘Unto the end, for those that shall be changed.’ It really says in an obscure manner, ‘For men.’ For, we especially of all rational beings are subject to variations and changes day by day and almost hour by hour. Neither in body nor in mind are we the same, but our body is in perpetual flux and disintegration; it is in motion and transition, either increasing from smaller to larger, or reducing from perfection to deficiency. The child now frequenting the school and fit to acquire the arts and sciences is not the same as the newly born infant; and again, the adolescent is admittedly different from the child, since he is already able to join with the young men. And beyond the adolescent is another man, one with firmness and great stature of body and perfection of reasoning. Having come to the peak of his vigor and attained the stability of manhood, he again begins little by little to reduce to a smaller man as the condition of his body imperceptibly declines and his bodily energies are lessened, until, bent down by age, he waits for the last withdrawal of strength. Accordingly, we are the ones who are changing and the psalm wisely alludes to us men through these words.

Angels do not admit any change. No one among them is a child, nor a young man, nor an old man, but in whatever state they were created in the beginning, in that state they remain, their substance being preserved pure and inviolate for them. But, we change in our body, as has been shown, and in our soul and in the inner man, always shifting our thoughts with the circumstances. In fact, we are one sort of person when we are cheerful and when all things in our life are moving forward with the current; but, we are another sort in precarious times, when we stumble against something that is not according to our wishes. We are changed through anger, assuming a certain savage state. We are also changed through our concupiscences, becoming like beasts through a life of pleasure. ‘They are become as amorous horses,’ madly in love with their neighbors’ wives. The deceitful man is compared to a fox, as Herod was; the shameless man is called a dog, like Nabel the Carmelian. Do you see the variety and diversity of our change? Then, admire him who has fittingly adapted this title to us.

For this very reason, a certain one of the interpreters seems to me to have handed over beautifully and accurately the same thought through another title, saying, ‘For the lilies,’ in place of, ‘For them that shall be changed.’ He thought that it was appropriate to compare the transitoriness of human nature with the early death of flowers. But, since this word has been inflected in the future tense, (it is said: ‘For them that shall be changed,’ as if at some time later this change will be shown to us), let us consider whether there is suggested to us the doctrine of the resurrection, in which a change will be granted to us, but a change for something better and something spiritual. ‘What is sown in corruption,’ he says, ‘rises in incorruption.’ Do you see the change? ‘What is sown in weakness rises in power; what is sown a natural body rises a spiritual body,’ when every corporeal creature will change together with us. Also, ‘The heavens shall grow old like a garment and as a vesture’ God ‘shall change them, and they shall be changed.’ Then, according to Isaia, ‘The sun will be sevenfold, and the moon like the present size of the sun.’

Since the sayings of God have not been written for all, but for those who have ears according to the inner man, he wrote the inscription, ‘For them that shall be changed,’ as I think, for those who are careful of themselves and are always advancing through their exercises of piety toward something better. This is surely the best change which the right hand of the most High will bestow; of which the blessed David also had an understanding when, having tasted the blessings of virtue, he strained forward to what was before. For, what does he say? ‘And I said, Now I have begun: this is the change of the right hand of the most High.’ Therefore, one who is advancing in virtue is never unchanged. ‘When I was a child,’ it is said, ‘I spoke as a child, I felt as a child, I thought as a child. Now that I have become a man, I have put away the things of a child.’

Again, when he had become a man, he did not rest from his work, but ‘forgetting what was behind, he strained forward to what was before, he pressed on towards the goal to the prize of the heavenly calling.’ There is a change, therefore, of the inner man who is renewed day by day.

Since he, the prophet, is about to announce to us what concerns the Beloved, who for our sake took upon Himself the dispensation of the Incarnation, for those who are worthy of this grace he says that he has given this canticle for the sons of Core. For it is a canticle and not a psalm; because it is sung with harmonious modulation by the unaccompanied voice and with no instrument sounding in accord with it. And it is a canticle for the Beloved. Shall I describe to you whom the Scripture says the Beloved is? Or do you know, even before our words, recalling the voice in the Gospel? ‘This is my beloved Son, in whom I am well pleased; hear him.’ The Beloved is to the Father as the Only-begotten One; and to every creature as a kind Father and a good Ruler. The same thing is by nature both beloved and good. Wherefore, some have rightly given the definition, saying that ‘good’ is what all things desire.

It is not the privilege of any chance person to go forward to the perfection of love and to learn to know Him who is truly beloved, but of him who has already ‘put off the old man, which is being corrupted through its deceptive lusts, and has put on the new man,’ which is being renewed that it may be recognized as an image of the Creator. Moreover, he who loves money and is aroused by the corruptible beauty of the body and esteems exceedingly this little glory here, since he has expended the power of loving on what is not proper, he is quite blind in regard to the contemplation of Him who is truly beloved. Therefore, it is said: ‘Thou shalt love the Lord thy God with thy whole heart, and with thy whole soul, and with thy whole mind.’ The expression, ‘With thy whole,’ admits of no division into parts. As much love as you shall have squandered on lower objects, that much will necessarily be lacking to you from the whole. Because of this, of all people few have been called friends of God, as Moses has been described as a friend; likewise, John: ‘But the friend’ he says, ‘of the bridegroom, who stands, rejoices exceedingly,’ that is to say, he who has a steadfast and immovable love for Christ, he is worthy of His friendship. Therefore, the Lord said to His disciples who were already perfect: ‘No longer do I call you servants,’ but friends; ‘because the servant does not know what his master does.’ Accordingly, it is the privilege of a perfect man truly to recognize the Beloved. In reality, only holy men are the friends of God and friends to each other, but no one of the wicked or stupid is a friend. The beauty of friendship does not fall into a depraved state, since nothing shameful or incongruous can be capable of the harmonious union of friendship. Evil is contrary not to the good only, but also to itself. But, now let us proceed to an examination of the words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252044.html'
source_title="Homily on Psalm 44"

[[commentary]]
quote='''
‘My heart hath uttered a good word.’ Some have already thought that these words were spoken from the Person of the Father concerning the Word who was with Him from the beginning, whom He brought forth, they say, as it were, from His Heart and His very Vitals; and from a good Heart there came forth a good Word. But, it seems to me that these words refer to the person of the prophet, since what follows the saying no longer makes the explanation concerning the Father equally smooth for us. The Father would not say concerning His own tongue: ‘My tongue is the pen of a scrivener that writeth swiftly. Thou art beautiful above the sons of men.’ Not, indeed, by a comparison with men does He possess a superiority of beauty. And continuing, he says: ‘Therefore God, thy God hath anointed thee with the oil of gladness.’ He did not say: ‘I, God, anointed you,’ but, ‘He anointed you,’ so that it is shown from this that the one speaking is another person. What else is this, therefore, than the prophet spreading the action of the Holy Spirit which has come upon him? ‘My heart hath uttered a good word,’ he says. Now, since belching is hidden breath which is blown upwards when the bubbles due to the effervescence of the food burst, he who is fed with the ‘living bread which came down from heaven and gives life to the world’ and who is filled ‘by every word that comes forth from the mouth of God,’ according to the customary allegorical interpretation of the Scripture, this soul, I say, nourished with the divine learning, sends forth an utterance proper to its food. Therefore, since the food was rational and good, the prophet uttered a good word. For ‘the good man from the good treasure’ of his heart brings forth the good. Let us ourselves, therefore, seek after the nourishment from the Word for the filling of our souls (‘The just,’ it is said, ‘eateth and filleth his soul’), in order that, in correspondence with what we are fed, we may send up, not some vulgar word, but a good one. The wicked man, nourished by unsound doctrines, utters in his heart a wicked word. Do you not see what sort of words the mouths of heretics pour forth? How harsh and foul, indicating some serious disease in the innermost part of the wretched ones? ‘The evil man from the evil treasure’ of his heart brings forth evil. ‘Do not, therefore, having itching ears, heap up for yourself teachers’ who are able to produce disease in your vitals and to procure for you the utterance of evil words for which you are going to be judged on the day of judgment. ‘For by thy words thou wilt be justified,’ he said, ‘and by thy words thou wilt be condemned.’

‘I speak my works to the king.’ These words also lead us especially to understand the person of the prophet. ‘I speak my works to the king,’ that is, I will confess to the judge and get ahead of the accuser by reporting my own deeds. Certainly, we have received the command which says: ‘Tell first your transgressions that you may be justified.’

‘My tongue is the pen of a scrivener that writeth swiftly.’ As the pen is an instrument for writing when the hand of an experienced person moves it to record what is being written, so also the tongue of the just man, when the Holy Spirit moves it, writes the words of eternal life in the hearts of the faithful, dipped ‘not in ink, but in the Spirit of the living God.’ The scrivener, therefore, is the Holy Spirit, because He is wise ‘and an apt teacher of all; and swiftly writing, because the movement of His mind is swift. The Spirit writes thoughts in us, ‘Not on tablets of stone but on fleshy tablets of the heart.’ In proportion to the size of the heart, the Spirit writes in hearts more or less, either things evident to all or things more obscure, according to its previous preparation of purity. Because of the speed with which the writings have been finished all the world now is filled with the Gospel.
'''
