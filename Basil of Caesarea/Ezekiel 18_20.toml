[[commentary]]
quote='''
How can you fail to bear in mind that the father shall not bear the iniquity of the son, nor the son bear the iniquity of the father, but each shall die in his own sin? I have neither father nor son slandered by you; I have had neither teacher nor disciple. But if the sins of the parents must be made charges against their children, it is far fairer for the sins of Arius to be charged against his disciples; and, whoever begat the heretic Aetius, for the charges against the son to be applied to the father. If on the other hand it is unjust for any one to be accused for their sakes, it is far more unjust that I should be held responsible for the sake of men with whom I have nothing to do, even if they were in every respect sinners, and something worthy of condemnation has been written by them. I must be pardoned if I do not believe all that is urged against them. since my own experience shows me how very easy it is for accusers to slip into slander.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520223.html'
source_title="Letter 223, Section 5"
