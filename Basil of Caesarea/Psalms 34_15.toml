[[commentary]]
quote='''
‘The eyes of the Lord are upon the just: and his ears unto their prayers.’ Just as the saints ‘are the body of Christ, member for member, and God indeed has placed some in the Church,’ as eyes, some as tongues, others taking the place of hands, and still others that of feet; so also some of the holy spiritual powers and those which are about the heavenly places are called the eyes because they are entrusted with our guardianship, and others ears, because they receive our petitions. Now, therefore, he said that the power which watches over us and that which is aware of our prayers are eyes and ears. So, ‘the eyes of the Lord are upon the just: and his ears unto their prayers.’ Since every act of the just man is worthy in the sight of God, and every word, because no just man speaks idly, is active and efficacious, for this reason these words say that the just man is always watched over and always heard.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
