[[commentary]]
quote='''
Naaman was not a great man with the Lord, but with his lord; that is, he was one of the chief princes of the King of the Syrians. Read your Bible carefully, and you will find the answer to your question there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520188.html'
source_title="Letter 188, Canon 16"
