[[commentary]]
quote='''
In the case of her being beaten, and refusing to submit, it would be better for her to endure than to be separated from her husband; in the case of her objecting to pecuniary loss, even here she would not have sufficient ground. If her reason is his living in fornication we do not find this in the custom of the church; but from an unbelieving husband a wife is commanded not to depart, but to remain, on account of the uncertainty of the issue. “For what knowest thou, O wife, whether thou shalt save thy husband?” Here then the wife, if she leaves her husband and goes to another, is an adulteress.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520188.html'
source_title="Letter 188, Canon 9"
