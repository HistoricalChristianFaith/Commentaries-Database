[[commentary]]
quote='''
And midnight Paul and Silas have handed down to us as a necessary time for prayer, so the story of the Acts proclaims: “But about midnight Paul and Silas were singing hymns to God.” And the Psalmist too, saying: “At midnight I rose to give thanks to thee because of the judgments of thy righteousness.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 37"
