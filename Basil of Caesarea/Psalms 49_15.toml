[[commentary]]
quote='''
‘But God will redeem my soul from the hand of hell, when he shall receive me.’ Clearly he predicts the descent of the Lord into hell, who will redeem the soul of the prophet along with the others, so that he may not remain there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
