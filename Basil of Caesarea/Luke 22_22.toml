[[commentary]]
quote='''
But still, he urges, this was no new thing in her case; she was no longer a maid; if I had been unwilling, she would have been corrupted by some one else. Yes; and it is written, the Son of Man was ordained to be betrayed, but woe unto that man by whom He was betrayed. It must needs be that offences come, but woe to that man by whom they come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252046.html'
source_title="Letter 46, Section 4"
