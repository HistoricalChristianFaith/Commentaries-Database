[[commentary]]
quote='''
He teaches us hereby to keep ever before us as the aim of the work set us the will of Him Who gave the order, and to direct our efforts towards Him, as also He says elsewhere: “I am come down from heaven, not to do mine own will, but the will of the Father that sent me.” For as the arts of daily life, having set before themselves certain proper objects, accommodate their particular activities in accordance with these, so also, as there is one rule and canon prescribed for our works, to fulfil God’s commandments in a manner pleasing to Him, it is impossible for our work to be carefully done unless it is performed in accordance with the will of Him Who has prescribed it. But in the careful endeavour to do our work as God wills we shall be joined to God in memory. For just as a smith in making, say, an axe, mindful of the man who set the task and having him always in his thoughts, plans the right shape and size and directs the work according to the will of him that ordered it—for if he forgets he will produce something other than or different from what he set out to make—so also the Christian, directing all his energies small and great to the fulfilment of God’s will, at one and the same time accomplishes the work carefully and preserves the intention of Him Who gave the order and fulfils what was said: “I have seen the Lord always before me, for he is on my right hand, lest I be shaken.” And he performs what is commanded: “Whether ye eat or drink, or whatever ye do, do all to the glory of God.” But if anyone corrupts the exactness of the commandment in doing it, clearly his memory of God is weakened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 5"

[[commentary]]
quote='''
Other virtues being practised in secret are seldom apparent to men; but continence makes the possessor conspicuous the moment one meets him. For as firm flesh and clear skin characterise the athlete, so the Christian is betokened by emaciation of body and paleness, which is the bloom of continence, showing that he is truly an athlete of Christ’s commandments. For he overcomes his enemy by the weakness of his body, and displays his strength in the contests of religion, as it is written: “When I am weak, then I am strong.” How profitable it is only to see the continent man, reluctantly and sparingly using the necessaries of life, paying nature her dues as a burdensome service, discontented when the time comes to be occupied with them and quickly springing away from table to attend to his work. For I think that no words touch the heart of him who is intemperate in eating or move him to alter his habits so much as merely meeting the continent man. This, I think, is the meaning of eating and drinking to the glory of God; so that even at the table our good works shine forth to the glorifying of our Father Who is in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 17"

[[commentary]]
quote='''
But if we too are to be guilty of the same fault and according to our opportunities both seek pleasures and make preparations for display, then I fear we shall seem to be building up what we are destroying, and in judging others shall condemn ourselves in that our life is insincere and we assume different guises from time to time, even going so far as changing our clothes when we have to meet illustrious persons. But if this is disgraceful, much more disgraceful is it that our table should be altered on account of luxurious-living men. The life of the Christian is consistent, and has one aim—the glory of God. “For whether ye eat or drink, or whatsoever ye do, do all to the glory of God,” says Paul speaking in Christ. Whereas the life of men of the world is inconsistent and varied, constantly altered in different ways to please chance-comers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 20"

[[commentary]]
quote='''
So whether we use the precepts of medicine or avoid them according to one of the principles laid down above, let us keep the aim of being well-pleasing to God and contrive what is beneficial to the soul, and fulfil the commandment of the apostle who said: “Whether ye eat, or drink, or whatsoever ye do, do all to the glory of God.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 55"
