[[commentary]]
quote='''
If any one in Syria is writing, this is nothing to me. For it is said “By thy words thou shalt be justified, and by thy words thou shalt be condemned.” Let my own words judge me. Let no one condemn me for other men’s errors nor adduce letters written twenty years ago in proof that I would allow communion to the writers of such things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520226.html'
source_title="Letter 226, Section 4"
