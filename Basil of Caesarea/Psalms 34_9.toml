[[commentary]]
quote='''
‘Fear the Lord, all ye his saints: for there is no want to them that fear him.’ Unless fear disciplines our life, it is impossible successfully to attain holiness in body. ‘Pierce thou my flesh with thy fear.’ As those who are pierced by nails have the members of their bodies immovable for any activity, so those who are possessed by the divine fear in their soul escape all annoyance from sinful passions. In him who fears there is not want, that is, he is failing with regard to no virtue who is prevented by fear from every absurd act, since he falls short of nothing good that belongs to human nature. As he is not perfect in body who is lacking in any necessary part, but is imperfect because of what he lacks, so also he who is disposed contemptuously about one of the commands, because he is wanting in it, is imperfect in that in which he lacks. But, he who has assumed perfect fear and through piety shrinks beneath all things will commit no sin because he despises nothing; he will not experience any want because he will possess fear sufficiently in all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
