[[commentary]]
quote='''
How do you think my heart was pained at hearing of the slanders heaped on me by some of those that feel no fear of the Judge, who “shall destroy them that speak leasing”? I spent nearly the whole night sleepless, thinking of your words of love; so did grief lay hold upon my heart of hearts. For verily, in the words of Solomon, slander humbleth a man. And no man is so void of feeling as not to be touched at heart, and bowed down to the ground, if he falls in with lips prone to lying.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252051.html'
source_title="Letter 51"

[[commentary]]
quote='''
In my own case this is now the third year of my silence, and my boast has become like that of the Psalmist, “I was as a man that heareth not and in whose mouth are no reproofs.” Thus I shut up in the bottom of my heart the pangs which I suffered on account of the calumnies directed against me, for calumny humbles a man, and calumny makes a poor man giddy. If, therefore, the mischief of calumny is so great as to cast down even the perfect man from his height, for this is what Scripture indicates by the word man, and by the poor man is meant he who lacks the great doctrines, as is the view also of the prophet when he says, “These are poor, therefore they shall not hear;…I will get me unto the great men,” he means by poor those who are lacking in understanding; and here, too, he plainly means those who are not yet furnished in the inner man, and have not even come to the full measure of their age; it is these who are said by the proverb to be made giddy and tossed about.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520223.html'
source_title="Letter 223, Section 1"
