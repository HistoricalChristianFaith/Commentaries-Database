[[commentary]]
quote='''
Secondly, in such separation the man will not even recognise his defects readily, not having anyone to reprove him and to set him right with kindness and compassion. For it often happens that reproof even from an enemy induces in a good man a desire to be cured; but a skilful cure of sin is carried out by a man who has loved sincerely. “For he that loveth chasteneth diligently.” Such a guide it is difficult to find in solitude, unless one has already formed a link with him in community life. There happens to him in consequence what has been said: “Woe to the solitary man, since if he fall there is none to raise him up.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 7"
