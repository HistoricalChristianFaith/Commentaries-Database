[[commentary]]
quote='''
However, the brethren must accept bodily services as well when they are rendered by such as seem to hold the highest positions in the brotherhood. For the principle of humility both teaches the greater to serve and shows the lesser that to be served is not unbecoming. For the example of the Lord leads us to this conclusion, since He did not disdain to wash the feet of His disciples and they did not dare to withstand Him in this. Moreover Peter, who at first from excess of reverence did not accept His ministrations, at once submitted when he learned the peril that would arise if he were disobedient. The subordinate therefore need have no fear of weakening his ideal of humility if he ever accepts services from a Superior. For the service is often rendered to teach him and give him an effective example, rather than because of any urgent need. So let him show humility by submission and imitation, and let him not display pride and arrogance by resisting under the pretext of humility. For gainsaying is a mark of self-will and lack of discipline; it proves that a man is puffed up and contemptuous rather than humble and obedient in all things. Wherefore it is necessary to obey him that said: “Forbearing one another in love.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 31"
