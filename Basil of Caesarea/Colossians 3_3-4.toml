[[commentary]]
quote='''
The life of them that have trusted in the Lord "is hidden," it would seem, "with Christ in God, and when Christ, who is our life, shall appear, then shall" they themselves also "appear with Him in glory;" and is the Spirit of life Himself, "Who made us free from the law of sin," not with Christ, both in the secret and hidden life with Him, and in the manifestation of the glory which we expect to be manifested in the saints?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 28"
