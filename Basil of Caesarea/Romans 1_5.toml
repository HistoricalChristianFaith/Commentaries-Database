[[commentary]]
quote='''
When, then, the apostle "thanks God through Jesus Christ," and again says that "through Him" we have "received grace and apostleship for obedience to the faith among all nations," or "through Him have access unto this grace wherein we stand and rejoice," he sets forth the boons conferred on us by the Son, at one time making the grace of the good gifts pass through from the Father to us, and at another bringing us to the Father through Himself. For by saying "through whom we have received grace and apostleship," he declares the supply of the good gifts to proceed from that source; and again in saying "through whom we have had access," he sets forth our acceptance and being made "of the household of God" through Christ. Is then the confession of the grace wrought by Him to usward a detraction from His glory? Is it not truer to say that the recital of His benefits is a proper argument for glorifying Him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
