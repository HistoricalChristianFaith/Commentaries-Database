[[commentary]]
quote='''
I would say that the exercise of piety resembles a ladder, that ladder which once the blessed Jacob saw, of which one part was near the earth and reaching to the ground, the other extended above, even to the very heavens. Therefore, those who are being introduced to a life of virtue must place their foot upon the first steps and from there always mount upon the next, until by gradual progress they have ascended to the height attainable by human nature. As withdrawal from the earth is the first step on the ladder, so in a manner of life in harmony with God the departure from evil is the first.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25201.html'
source_title="Homily on Psalm 1"
