[[commentary]]
quote='''
But, for my part, to every one who is thinking about marriage I testify that, “the fashion of this world passeth away,” and the time is short: “it remaineth that both they that have wives be as though they had none.” If he improperly quotes the charge “Increase and multiply,” I laugh at him, for not discerning the signs of the times. Second marriage is a remedy against fornication, not a means of lasciviousness. “If they cannot contain,” it is said “let them marry;” but if they marry they must not break the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520160.html'
source_title="Letter 160, Section 4"
