[[commentary]]
quote='''
And do not think me so simple and credulous as to accept depreciatory remarks from any one without due investigation. I bear in mind the admonition of the Spirit, “Thou shalt not receive a false report.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252024.html'
source_title="Letter 24"
