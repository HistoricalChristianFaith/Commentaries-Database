[[commentary]]
quote='''
Never neglect reading, especially of the New Testament, because very frequently mischief comes of reading the Old; not because what is written is harmful, but because the minds of the injured are weak. All bread is nutritious, but it may be injurious to the sick. Just so all Scripture is God inspired and profitable, and there is nothing in it unclean: only to him who thinks it is unclean, to him it is unclean.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 3"

[[commentary]]
quote='''
How can he who calls Scripture "God-inspired," because it was written through the inspiration of the Spirit, use the language of one who insults and belittles Him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 21"
