[[commentary]]
quote='''
He who has set at naught a marriage of man, with no mercy shewn him, in the presence of two or three witnesses, dies. Of how much sorer punishment, suppose you, shall he be thought worthy who hath trodden under foot the Son of God, and defiled His pledged bride and done despite unto the spirit of virginity?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252046.html'
source_title="Letter 46, Section 4"
