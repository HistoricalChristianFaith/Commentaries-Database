[[commentary]]
quote='''
Do not allow another to do the work that is rightly yours, so that the reward as well may not be taken from you and given to another and he be enriched with your wealth while you are put to shame. Perform the duties of your ministry decently and with care as if you were serving Christ, for "cursed," says the prophet, "is everyone who does the work of the Lord negligently." Fear, as if the eye of the Lord were on you, the perversity that arises from fastidiousness and contempt, even though the task in hand seems to you a menial one. The work of the ministry is an exalted work and leads to the kingdom of heaven.
'''
source_url=''
source_title="ON RENUNCIATION OF THE WORLD"


[[commentary]]
quote='''
Elsewhere, he expresses his condemnation more vividly: "Depart from me, you cursed, into everlasting fire that was prepared for the devil and his angels." Then he alleges not the commission of any forbidden act but the omission of commended ones, saying, "For I was hungry, and you gave me nothing to eat; I was thirsty, and you gave me nothing to drink," and so on. There are many passages like that that one might find to prove that not only are those who do wicked things worthy of death—for whom has been prepared the inextinguishable fire as well—but that along with these those are condemned who leave good works undone or who perform them negligently. For it is written, "Cursed is every person who does the work of the Lord negligently."
'''
source_url=''
source_title="CONCERNING BAPTISM 2:6"

[[commentary]]
quote='''
Since the Lord said: “Sell that thou hast, and give to the poor, and thou shalt have treasure in heaven: and come, follow me”; and again: “Sell that ye have, and give alms”; I consider that the man who leaves his family with such an end in view ought not to feel contemptuously towards his possessions, but to make an accurate survey of them all, as consecrated henceforward to the Lord, and dispose of them with all care, either personally if he has the power and necessary experience, or through men who have been chosen for the work after careful testing and have given proof of their powers of faithful and wise administration. He must realise that it is dangerous either to leave them to his relations or to dispose of them through any chance-comer. For if the man who is entrusted with the care of the King’s property, though often he has filched nothing from the store but only lost by neglect the interest he might have gained, is not absolved from blame; what condemnation must we expect them to undergo who have been slothful and negligent in the administration of possessions already dedicated to the Lord? Will they not be subject to the condemnation of the negligent? As it is written: “Cursed is every one that doeth the works of the Lord negligently.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 9"

[[commentary]]
quote='''
Since the apostle says: “Let all things be done decently and in order,” we reckon that to be a decent and orderly manner of life among the society of the faithful, in which the principle of the members of the body is preserved. So that one has the powers of the eye, being entrusted with the general oversight, both approving what has been done, and foreseeing and arranging what is to be done; and another the powers of the ear or hand in respect of hearing or doing what is necessary—and so on. Know therefore that just as with our members it is dangerous for any one limb to neglect its functions, or not to make use of another for the purpose for which it was made by God the Creator—for if the hand or foot obey not the guidance of the eye, the one will inevitably touch dangerous things to the destruction of the whole body, and the other will knock against them or be precipitated from a height; or if the eye be closed so as not to see it will of necessity be destroyed with the other members, all suffering the same fate—so also both neglect on the part of the Superior is fraught with blame since he has to answer for all, and disobedience on the part of the subordinates is harmful and wrong, and especially dangerous if it causes others to offend. Each man therefore in his own place showing willing zeal and fulfilling the apostle’s command, “in diligence not slothful,” receives praise for his zeal: but if he is negligent the contrary is true, namely a pronouncement of misery and woe. For “cursed” it says “is every one that doeth the works of the Lord carelessly.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 24"

[[commentary]]
quote='''
Wherefore on account of what has been said, and for many other similar reasons, it is essential that those who distribute necessaries to the brotherhood should be free absolutely from favouritism and contention. Indeed they ought to be conscious of such a disposition in themselves and to show such zeal—both they and those that perform the other works for the service of the brethren—as if they were serving not men but the Lord Himself, Who of His great goodness reckons as done unto Himself the honour and zeal shown to those who are dedicated to Him, and promises in return an inheritance in the kingdom of heaven. For He says: “Come, ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world. For inasmuch as ye did it unto one of the least of these my brethren, ye did it unto me.” And on the other hand we must recognise the peril of negligence, remembering the words: “Cursed is he that doeth the work of the Lord negligently.” Because not only are they ejected from the kingdom, but also they receive the horrible and fearful sentence of the Lord pronounced against such men: “Depart from me, ye cursed, into the eternal fire which is prepared for the devil and his angels.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 34"
