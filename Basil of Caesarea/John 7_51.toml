[[commentary]]
quote='''
I beg to state that I am perfectly ready to rid myself, in your presence, of the charges urged against me, but only on condition that my revilers are admitted to stand face to face with me before your reverences. If I am convicted, I shall not deny my error. You, after the conviction, will receive pardon from the Lord for withdrawing yourselves from the communion of me a sinner. The successful accusers, too, will have their reward in the publication of my secret wickedness. If, however, you condemn me before you have the evidence before you, I shall be none the worse, barring the loss I shall sustain of a possession I hold most dear—your love: while you, for your part, will suffer the same loss in losing me, and will seem to be running counter to the words of the Gospel: “Doth our law judge any man before it hear him?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520203.html'
source_title="Letter 203, Section 2"

[[commentary]]
quote='''
I have never accepted communion with any one of those who have since been introduced into the see, not because I count them unworthy, but because I see no ground for the condemnation of Meletius. Nevertheless I have heard many things about the brethren, without giving heed to them, because the accused were not brought face to face with their accusers, according to that which is written, “Doth our law judge any man, before it hear him, and know what he doeth?” I cannot therefore at present write to them, right honourable brother, and I ought not to be forced to do so.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520258.html'
source_title="Letter 258, Section 3"
