[[commentary]]
quote='''
And what evidence have you that this custom was not followed in the time of the great Gregory? You have kept none of his customs up to the present time. Gregory did not cover his head at prayer. How could he? He was a true disciple of the Apostle who says, “Every man praying or prophesying, having his head covered, dishonoureth his head.” And “a man indeed ought not to cover his head forasmuch as he is the image of God.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520207.html'
source_title="Letter 207, Section 4"
