[[commentary]]
quote='''
In the case of trigamy and polygamy they laid down the same rule, in proportion, as in the case of digamy; namely one year for digamy (some authorities say two years); for trigamy men are separated for three and often for four years; but this is no longer described as marriage at all, but as polygamy; nay rather as limited fornication. It is for this reason that the Lord said to the woman of Samaria, who had had five husbands, “he whom thou now hast is not thy husband.” He does not reckon those who had exceeded the limits of a second marriage as worthy of the title of husband or wife.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520188.html'
source_title="Letter 188, Canon 4"
