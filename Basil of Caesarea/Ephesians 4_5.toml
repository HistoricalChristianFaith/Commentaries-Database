[[commentary]]
quote='''
Now it is the Nicene Creed, brought by themselves from the west, which they presented to the Synod at Tyana, by which they were received. But they have an ingenious theory as to changes of this kind; they use the words of the creed as physicians use a remedy for the particular moment, and substitute now one and now another to suit particular diseases. The unsoundness of such a sophism it is rather for you to consider than for me to prove. For “the Lord will give you understanding” to know what is the right doctrine, and what the crooked and perverse. If indeed we are to subscribe one creed to-day and another tomorrow, and shift with the seasons, then is the declaration false of him who said, “One Lord, one faith, one baptism.” But if it is true, then “Let no man deceive you with [these] vain words.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520226.html'
source_title="Letter 226, Section 3"
