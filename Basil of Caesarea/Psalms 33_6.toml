[[commentary]]
quote='''
Where are those who set at naught the Spirit? Where are those who separate it from the creative power? Where are those who dissever it from union with the Father and Son? Let them hear the psalm that says, "By the word of the Lord the heavens were established; and all the power of them by the spirit of his mouth." The term "Word" will not be considered as this common form of diction that consists of names and expressions; nor will the Spirit be considered as vapor poured out in the air but as the Word, which was in the beginning with God, and as the Holy Spirit, which has obtained appellation as its own. As, then, the Creator, the Word, firmly established the heavens, so the Spirit, which is from God, which proceeds from the Father, that is, which is from his mouth (that you may not judge that it is some external object or some creature but may glorify it as having its substance from God) brings with it all the powers in him.… Since, then, the Savior is the Word of the Lord and the Holy Spirit is the Spirit from his mouth, both joined with him in the creation of the heavens and the powers in them, and for this reason the statement was made: "By the word of the Lord the heavens were established; and all the power of them by the spirit of his mouth." For nothing is made holy except by the presence of the Spirit.
'''
source_url=''
source_title="HOMILIES ON THE PSALMS 15:4 (PS 33)"

[[commentary]]
quote='''
If we ought to advance our argument yet further, and turn our inspection to higher themes, let us contemplate the divine nature of the Holy Spirit specially from the following point of view. In Scripture we find mention of three creations. The first is the evolution from non-being into being. The second is change from the worse to the better. The third is the resurrection of the dead. In these you will find the Holy Ghost cooperating with the Father and the Son. There is a bringing into existence of the heavens; and what says David? “By the word of the Lord were the heavens made and all the host of them by the breath of His mouth.” Again, man is created through baptism, for “if any man be in Christ he is a new creature.” And why does the Saviour say to the disciples, “Go ye therefore and teach all nations, baptizing them in the name of the Father and of the Son and of the Holy Ghost”? Here too you see the Holy Ghost present with the Father and the Son. And what would you say also as to the resurrection of the dead when we shall have failed and returned to our dust? Dust we are and unto dust we shall return. And He will send the Holy Ghost and create us and renew the face of the earth. For what the holy Paul calls resurrection David describes as renewal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 11"

[[commentary]]
quote='''
And in the creation bethink thee first, I pray thee, of the original cause of all things that are made, the Father; of the creative cause, the Son; of the perfecting cause, the Spirit; so that the ministering spirits subsist by the will of the Father, are brought into being by the operation of the Son, and perfected by the presence of the Spirit. Moreover, the perfection of angels is sanctification and continuance in it. And let no one imagine me either to affirm that there are three original hypostases or to allege the operation of the Son to be imperfect. For the first principle of existing things is One, creating through the Son and perfecting through the Spirit. The operation of the Father who worketh all in all is not imperfect, neither is the creating work of the Son incomplete if not perfected by the Spirit. The Father, who creates by His sole will, could not stand in any need of the Son, but nevertheless He wills through the Son; nor could the Son, who works according to the likeness of the Father, need co-operation, but the Son too wills to make perfect through the Spirit. "For by the word of the Lord were the heavens made, and all the host of them by the breath [the Spirit] of His mouth." The Word then is not a mere significant impression on the air, borne by the organs of speech; nor is the Spirit of His mouth a vapour, emitted by the organs of respiration; but the Word is He who "was with God in the beginning" and "was God," and the Spirit of the mouth of God is "the Spirit of truth which proceedeth from the Father." You are therefore to perceive three, the Lord who gives the order, the Word who creates, and the Spirit who confirms. And what other thing could confirmation be than the perfecting according to holiness? This perfecting expresses the confirmation's firmness, unchangeableness, and fixity in good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 16"

[[commentary]]
quote='''
And it is not from this source alone that our proofs of the natural communion are derived, but from the fact that He is moreover said to be "of God;" not indeed in the sense in which "all things are of God," but in the sense of proceeding out of God, not by generation, like the Son, but as Breath of His mouth. But in no way is the "mouth" a member, nor the Spirit breath that is dissolved; but the word "mouth" is used so far as it can be appropriate to God, and the Spirit is a Substance having life, gifted with supreme power of sanctification. Thus the close relation is made plain, while the mode of the ineffable existence is safeguarded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 18"

[[commentary]]
quote='''
And if you think of the creation, the powers of the heavens were established by the Spirit, the establishment being understood to refer to disability to fall away from good. For it is from the Spirit that the powers derive their close relationship to God, their inability to change to evil, and their continuance in blessedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 19"
