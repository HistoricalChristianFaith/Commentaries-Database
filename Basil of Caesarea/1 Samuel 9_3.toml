[[commentary]]
quote='''
“Asses are lost” that there may be a king of Israel. David, however, being an Israelite was granted to Israel; but the land which has nursed you and brought you to such a height of virtue, possesses you no longer, and sees her neighbour beautified by her own adornment. But all believers in Christ are one people; all Christ’s people, although He is hailed from many regions, are one Church; and so our country is glad and rejoices at the dispensation of the Lord, and instead of thinking that she is one man the poorer, considers that through one man she has become possessed of whole Churches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520161.html'
source_title="Letter 161, Section 1"
