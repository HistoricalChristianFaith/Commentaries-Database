[[commentary]]
quote='''
Just as we said that the Superior must apply healing methods to the weak without personal feeling, so again the recipients must not accept the penalties as a mark of hatred, nor consider a tyranny the care which he gives out of compassion in order to save the soul. For it is disgraceful if those who are sick in body should trust doctors to such an extent that whether they operate or cauterise or vex with bitter drugs they are deemed benefactors, but that we as regards the physicians of our souls when they work for our salvation by laborious discipline do not have the same feelings. The apostle said: “And who is he that maketh me glad but he that is made sorry by me?” and again: “For behold this self same thing, that ye were made sorry after a godly sort, what earnest care it wrought in you!” Accordingly, looking to the end, he that implants sorrow in us ought to be accounted a benefactor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 52"
