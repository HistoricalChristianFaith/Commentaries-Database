[[commentary]]
quote='''
I do not think that any condemnation ought to be passed on women who professed virginity while in heresy, and then afterwards preferred marriage. “What things soever the law saith, it saith to them who are under the law.” Those who have not yet put on Christ’s yoke do not recognise the laws of the Lord. They are therefore to be received in the church, as having remission in the case of these sins too, as of all, from their faith in Christ. As a general rule, all sins formerly committed in the catechumenical state are not taken into account. The Church does not receive these persons without baptism; and it is very necessary that in such cases the birthrights should be observed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520199.html'
source_title="Letter 199, Canon 20"
