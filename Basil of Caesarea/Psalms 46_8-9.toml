[[commentary]]
quote='''
‘Come and behold ye the works of God: what wonders he hath done upon earth, making wars to cease even to the end of the earth.’ The Scripture invites those who are far from the word of truth to nearness through knowledge, saying: ‘Come and behold.’ Just as in the case of bodily eyes great distances make the perception of visible objects dim, but the nearer approach of those viewing offers a clear knowledge of the objects seen, so also in the case of objects of contemplation in the mind, he who has not been made familiar with God through His works nor has drawn near to Him is not able to see His works with the pure eyes of his mind. Therefore, ‘Come,’ first approach, then see the works of the Lord which are prodigious and admirable, by which He struck down and converted to quiet peacefulness nations, formerly warlike and factious. ‘Come, children, hearken to me,’ and ‘Come, all you who labor and are burdened.’ It is the paternal voice of One with outstretched arms calling to Himself those who until then were rebelling. He who has heard the call and has approached and cleaves to the One commanding, will see Him who through the cross made all things peaceful ‘whether on the earth or in the heavens.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"
