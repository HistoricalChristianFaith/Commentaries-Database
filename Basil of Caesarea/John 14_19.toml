[[commentary]]
quote='''
And when discoursing of Himself He says, "Yet a little while and the world seeth me no more, but ye see me;" again in this passage, applying the word world to those who being bound down by this material and carnal life, and beholding the truth by material sight alone, were ordained, through their unbelief in the resurrection, to see our Lord no more with the eyes of the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 22"
