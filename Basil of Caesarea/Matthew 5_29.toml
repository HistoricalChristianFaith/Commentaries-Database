[[commentary]]
quote='''
As for one who shows hesitation in obeying the commandments of the Lord, in the first instance all should sympathise with him as a sick member of the body and the Superior should try to cure his infirmity by his private admonitions; but if he perseveres in disobedience and will not amend, then the Superior must correct him sharply before all the brethren and apply methods of healing by every method of exhortation. But if after much admonition he is still unabashed, and shows no improvement in his conduct, he becomes his own destroyer, as the saying is, and with many tears and lamentations, but nevertheless firmly, as a corrupted and utterly useless member, we must cut him away from the body after the practice of doctors. For they too, whenever they find one member affected by an incurable disease, are accustomed to remove it by surgery and cauterisation, so that the harm may not spread further, corrupting the neighbouring parts by its continuity with them. We too must of necessity adopt this course in the case of those who hate or oppose the commandments of the Lord, following the precept of the Lord Himself Who said: “If thy right eye causeth thee to stumble, pluck it out, and cast it from thee.” For kindness in such cases resembles the uninstructed complacence of Eli, which he showed towards his sons in a manner displeasing to God and was punished accordingly. So such spurious kindness towards the wicked is a betrayal of the truth, a plot against the common good, an accustoming of men to sin lightly, since the Scripture is no longer observed—“Why did ye not rather mourn, that he that had done this deed might be taken away from you?”—and what is appended inevitably comes to pass—“a little leaven leaveneth the whole lump.” “Them that sin” says the apostle “reprove in the sight of all,” and immediately gives the reason, “that the rest also may be in fear.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 28"
