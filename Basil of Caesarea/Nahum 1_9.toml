[[commentary]]
quote='''
A deacon who commits fornication after his appointment to the diaconate is to be deposed. But, after he has been rejected and ranked among the laity, he is not to be excluded from communion. For there is an ancient canon that those who have fallen from their degree are to be subjected to this kind of punishment alone.

Herein, as I suppose, the ancient authorities followed the old rule “Thou shalt not avenge twice for the same thing.” There is this further reason too, that laymen, when expelled from the place of the faithful, are from time to time restored to the rank whence they have fallen; but the deacon undergoes once for all the lasting penalty of deposition. His deacon’s orders not being restored to him, they rested at this one punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520188.html'
source_title="Letter 188, Canon 3"

[[commentary]]
quote='''
Clerics who are guilty of the sin unto death are degraded from their order, but not excluded from the communion of the laity. Thou shalt not punish twice for the same fault.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520199.html'
source_title="Letter 199, Canon 32"
