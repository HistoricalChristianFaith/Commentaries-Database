[[commentary]]
quote='''
But let us see if we can bethink us of any defence of this usage of our fathers; for they who first originated the expression are more open to blame than we ourselves. Paul in his Letter to the Colossians says, "And you, being dead in your sins and the uncircumcision . . . hath He quickened together with" Christ. Did then God give to a whole people and to the Church the boon of the life with Christ, and yet the life with Christ does not belong to the Holy Spirit? But if this is impious even to think of, is it not rightly reverent so to make our confession, as They are by nature in close conjunction?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 28"
