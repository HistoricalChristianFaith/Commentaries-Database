[[commentary]]
quote='''
‘Because he hath inclined his ear unto me.’ ‘He inclined,’ he said, not that you might take some corporeal notion about God having ears and inclining them to a gentle voice, as we do, putting our ear close to those who speak low, so that by the nearness we may perceive what is said, but he said, ‘He inclined,’ in order that he might point out to us his own weakness. Because through kindness He came down to me while I was lying on the ground, as if, when some sick man is not able to speak clearly because of his great weakness, a kind physician, bringing his ear close, should learn through the nearness what was necessary for the sick man. Therefore, ‘He hath inclined his ear unto me.’ The divine ear, indeed, does not need a voice for perception; it knows how to recognize in the movements of the heart what is sought. Or, do you not hear how Moses, although he said nothing, but met the Lord with his inexpressible groanings, was heard by the Lord, who said: ‘Why criest thou to me?’ God knows how to hear even the blood of a just man, to which no tongue is attached and of which no voice pierces the air. The presence of good works is a loud voice before God.

‘And in my days I will call upon him.’ If we have prayed on one day, or if in one hour for a brief time we were saddened by our sins, we are carefree as if we had already made some compensation for our wickedness. However, the holy man says that he is disclosing his confession which is measured by the whole time of his life, for he says: ‘In all my days I will call upon him.’ Then, in order that you may not think that he called upon God because he was fortunate in this life and because all his affairs were successful, he describes in detail the magnitude and difficulty of the circumstances in which, when he was involved, he did not forget the name of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%2520114.html'
source_title="Homily on Psalm 114"
