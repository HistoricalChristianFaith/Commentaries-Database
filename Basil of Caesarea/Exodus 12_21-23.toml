[[commentary]]
quote='''
So in like manner, the history of the exodus of Israel is recorded to shew forth those who are being saved through baptism. For the firstborn of the Israelites were preserved, like the bodies of the baptized, by the giving of grace to them that were marked with blood. For the blood of the sheep is a type of the blood of Christ; and the firstborn, a type of the first-formed. And inasmuch as the first-formed of necessity exists in us, and, in sequence of succession, is transmitted till the end, it follows that "in Adam" we "all die," and that "death reigned" until the fulfilling of the law and the coming of Christ. And the firstborn were preserved by God from being touched by the destroyer, to show that we who were made alive in Christ no longer die in Adam.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 14"
