[[commentary]]
quote='''
Afterwards he came to Cilicia, and, on meeting with a certain Gelasius, showed him the creed which only an Arian, or a thorough disciple of Arius, could subscribe. Then, indeed, I was yet more confirmed in my alienation from him. I felt that the Ethiopian will never change his skin, nor the leopard his spots, nor a man nurtured in doctrines of perversity ever be able to rub off the stain of his heresy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520130.html'
source_title="Letter 130, Section 1"
