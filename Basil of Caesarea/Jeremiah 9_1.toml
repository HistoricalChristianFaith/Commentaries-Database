[[commentary]]
quote='''
Now is the time to quote the words of the prophet and to say, “Oh that my head were waters, and mine eyes a fountain of tears, that I might weep day and night for the slain of the daughter of my people.” Though they are wrapped in profound silence and lie stunned by their misfortune, robbed of all sense of feeling by the fatal blow, I at all events must not let such a fall go unlamented. If, to Jeremiah, it seemed that those whose bodies had been wounded in war, were worthy of innumerable lamentations, what shall be said of such a disaster of souls? “My slain men,” it is said, “are not slain with the sword, nor dead in battle.” But I am bewailing the sting of the real death, the grievousness of sin and the fiery darts of the wicked one, which have savagely set on fire souls as well as bodies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252046.html'
source_title="Letter 46, Section 1"
