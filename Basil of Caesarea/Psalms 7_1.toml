[[commentary]]
quote='''
The inscription of the Seventh Psalm seems in a way to be opposed to the history of the kingdoms where the facts about David are recorded. For in the history, Chusi is mentioned as the chief companion of David and the son of Arachi, but in the psalm, Chusi is the son of Jemini. Neither he nor any other of those appearing in the history was the son of Jemini. Perhaps, he was called the son of Jemini for this reason, because he displayed great valor and manliness through a mere pretense of friendship, going over, as he pretended, to Absalom, but, in reality, thwarting the plans of Achitophel, a very skilled man, well trained in military affairs, who was giving his counsel. ‘The son of Jemini’ is interpreted ‘the son of the right hand.’ By his proposals he prevented the acceptance of the plan of Achitophel—that no time should intervene in the affairs but that an attack should be made immediately on the father while he was unprepared—‘in order that,’ as Scripture says, ‘the Lord might bring all evils upon Absalom.’ At all events, he seemed to them to introduce more plausible reasons for postponement and delay, while his real purpose was to give time to David to gather his forces. Because of his counsel he was acceptable to Absalom, who said: ‘The counsel of Chusi the Arachite is better than the counsel of Achitophel.’

However, Chusi informed David through the priests Sadoc and Abiathar of the decision and bade him not to camp in Araboth in the desert, but urged him to cross it. Since, then, he was on the right hand of David through his good advice, he obtained the name from his brave deed. Surely, it is because of this that he is called ‘son of Jemini,’ that is, ‘son of the right hand.’ It is a custom of Scripture not only to give those who are more wicked a name from their sin rather than from their fathers, but also to call the better sons from the virtue characterizing them. Accordingly, the Apostle calls the devil the son of perdition. ‘Unless the impious one is revealed, the son of perdition.’ And in the Gospel the Lord called Judas the son of perdition. ‘And not one of them perished,’ it says, ‘except the son of perdition.’ But, He calls those formed in the knowledge of God children of wisdom, ‘For, wisdom,’ He says, ‘is justified by her children.’ He also says: ‘If a son of peace be there.’ It should not, then, seem strange that the father of his body was not mentioned, and that the chief companion of David was called the son of his right hand, receiving a title belonging to him because of his deeds.

‘O Lord my God, in thee have I put my trust; save me.’ Although the saying, ‘O Lord my God, in thee have I put my trust; save me,’ is thought to be a simple prayer and one that can be offered up rightly by anyone, perhaps such is not the case. For, he who puts his trust in man or is buoyed up by some other concerns of life, such as power, or possessions, or any of the things considered by the many to be glorious, is not able to say, ‘O Lord my God, in thee have I put my trust.’ In fact, there is a command that we should not put our trust in rulers, and ‘Cursed be the man that trusteth in man.’ As it is proper not to worship anything else besides God, so also is it proper not to trust in any other except God the Lord of all things. ‘The Lord’ it is said, ‘is my hope and my praise.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
