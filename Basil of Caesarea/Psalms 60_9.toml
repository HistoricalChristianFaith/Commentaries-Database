[[commentary]]
quote='''
In this hope, pronouncing blessed, the time of the coming of the Lord, the prophet says: ‘Who will bring me into the fortified city.’ Perhaps, he means the Church, a city, indeed, because it is a community governed conformably to laws; and fortified, because of the faith encompassing it. Whence one of the interpreters gave out a very clear translation: ‘Into a city fortified all around.’ Who, then, will permit me to see this great spectacle, God living among men? These are the words of the Lord: ‘Many prophets and just men have longed to see what you see, and they have not seen it.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252059.html'
source_title="Homily on Psalm 59"
