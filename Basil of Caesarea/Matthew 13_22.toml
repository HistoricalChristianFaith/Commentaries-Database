[[commentary]]
quote='''
As far as we are engaged in affairs outside of God, we are not able to make progress in the knowledge of God. Who, anxious about the things of the world and sunk deep in the distractions of the flesh, can be intent on the words of God and be sufficiently accurate in such mighty objects of contemplation? Do you not see that the word which fell among the thorns is choked by the thorns? The thorns are the pleasures of the flesh and wealth and glory and the cares of life. He who desires the knowledge of God will have to be outside of all these things, and being freed from his passions, thus to receive the knowledge of God. For, how could the thought of God enter into a soul choked by considerations which preoccupied it?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"
