[[commentary]]
quote='''
‘The Lord hath looked from heaven: he hath beheld all the sons of men from his habitation which he hath prepared.’ The Lord looks from above on those who stand fast in their proper dignity and perform the duties that belong to human nature. But, He regards differently those who fall into the utmost evils because He Himself came down. ‘Because,’ He said, ‘the outcry against Sodom and Gomorrah is great, and their sin is very grave, I will go down to see whether they have done all that the outcry which has come to me indicates.’ And again, ‘He came down to see the city and the tower which men had built.’ But here it says, ‘The Lord hath looked from heaven: he hath beheld all the sons of men.’ Consider the lofty spectator; consider Him who is bending down regarding the affairs of mankind. Wherever you may go, whatever you may do, whether in the darkness or in the daytime, you have the eye of God watching. ‘From his habitation which he hath prepared.’ The gates are not being opened, the curtains are not being drawn together, the habitation of God is ready for viewing. He looks upon all the sons of men. No one escapes His sight; no darkness, no concealing walls, nothing is a hindrance to the eyes of God. He is so far from failing to look upon each individually, that He even looks into the hearts, which He Himself formed without any admixture of evil. God, the creator of men, made the heart simple according to His own saving image; but later we made it, by union with passions of the flesh, a complicated and manifold heart, destroying its likeness to God, its simplicity, and its integrity. Since He is the Maker of hearts, therefore, He understands all our works. But, we call both words and thoughts and, in general, every movement of man, his works. With what feelings or for what purpose they are, whether to please men or to perform the duties of the commands given us by God, He alone knows, who understands all our works. Therefore, for every idle word we give an account. Even for a cup of cold water, we do not lose our reward, because the Lord understands all our works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
