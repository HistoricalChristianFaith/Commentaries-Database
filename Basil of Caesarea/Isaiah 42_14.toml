[[commentary]]
quote='''
“I have long time holden my peace. Am I to hold my peace for ever? Shall I still further endure to enforce against myself the hardest punishment of silence, by neither writing myself, nor receiving any statement from another? By holding fast to this stern determination up to the present time I am able to apply to myself the prophet’s words, “I endure patiently like travailing woman.” Yet I am ever longing for communication either in person or by letter, and ever, for my own sins’ sake, missing it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252059.html'
source_title="Letter 59, Section 1"

[[commentary]]
quote='''
Nevertheless I thought that I ought to bear my troubles in silence, waiting for some indication to come out of them. I did not even think that what was said against me proceeded from ill will; I thought it was the result of ignorance of the truth. But now I see that hostility increases with time, and that my slanderers are not sorry for what they said at the beginning, and do not take any trouble to make amends for the past, but go on and on and rally themselves together to attain their original object. This was to make my life miserable and to devise means for sullying my reputation among the brethren. I, therefore, no longer see safety in silence. I have bethought me of the words of Isaiah: “I have long time holden my peace, shall I always be still and refrain myself? I have been patient like a travailing woman.” God grant that I may both receive the reward of silence, and gain some strength to confute my opponents, and that thus, by confuting them, I may dry up the bitter torrent of falsehood that has gushed out against me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520223.html'
source_title="Letter 223, Section 1"
