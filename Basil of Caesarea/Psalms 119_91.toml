[[commentary]]
quote='''
You say that the Holy Ghost is a creature. And every creature is a servant of the Creator, for “all are thy servants.” If then He is a servant, His holiness is acquired; and everything of which the holiness is acquired is receptive of evil; but the Holy Ghost being holy in essence is called “fount of holiness.” Therefore the Holy Ghost is not a creature. If He is not a creature, He is of one essence and substance with the Father. How, tell me, can you give the name of servant to Him Who through your baptism frees you from your servitude? “The law,” it is said, “of the Spirit of life hath made me free from the law of sin.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 10"
