[[commentary]]
quote='''
‘O taste, and see that the Lord is sweet.’ Frequently we have noticed that the faculties of the soul are called by the same name as the external members. Since our Lord is true Bread and His flesh is true Meat, it is necessary that the pleasure of the enjoyment of the Bread be in us through a spiritual taste. As the nature of honey can be described to the inexperienced not so much by speech as by the perception of it through taste, so the goodness of the heavenly Word cannot be clearly taught by doctrines, unless, examining to a greater extent the dogmas of truth, we are able to comprehend by our own experience the goodness of the Lord. ‘Taste’ he said, but not ‘be filled,’ because now we know in part and through a mirror and in an obscure manner we see the truth; but the time will come when the present pledge and this taste of grace will attain to the perfection of enjoyment for us. Just as those who are suffering from a disordered stomach and from loss of appetite, and who turn away from food, are cured of this annoyance by the doctors, who stir up their appetites through special attention to the food, so that, when their taste is provoked by the savory cooking, their appetites will increase always more and more, so also in the case of the word of truth, experience itself will always, he says, excite in you an insatiable desire. Therefore, he says, ‘Taste,’ in order that you, hungering and thirsting after justice, may always be blessed. ‘Blessed is the man that hopeth in him.’ He who always has a desire of the Word will put his hope in nothing else than in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
