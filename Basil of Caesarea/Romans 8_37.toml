[[commentary]]
quote='''
He conquers who does not yield to those who lead on by force, but he is more than conqueror who voluntarily invites sorrows for a demonstration of his endurance.
'''
source_url=''
source_title="HOMILIES 22"

[[commentary]]
quote='''
The apostle, it is true, says, "In all these things we are more than conquerors through him that loved us." But in a phrase of this kind there is no suggestion of any lowly and subordinate ministry, but rather of the succour rendered "in the power of his might." For He Himself has bound the strong man and spoiled his goods, that is, us men, whom our enemy had abused in every evil activity, and made "vessels meet for the Master's use" us who have been perfected for every work through the making ready of that part of us which is in our own control. Thus we have had our approach to the Father through Him, being translated from "the power of darkness to be partakers of the inheritance of the saints in light." We must not, however, regard the oeconomy through the Son as a compulsory and subordinate ministration resulting from the low estate of a slave, but rather the voluntary solicitude working effectually for His own creation in goodness and in pity, according to the will of God the Father. For we shall be consistent with true religion if in all that was and is from time to time perfected by Him, we both bear witness to the perfection of His power, and in no case put it asunder from the Father's will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
