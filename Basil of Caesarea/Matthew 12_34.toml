[[commentary]]
quote='''
He grants us two means of becoming acquainted; one by personal intercourse, another by epistolary correspondence. Now I have become acquainted with you through what you have said. I do not mean that my memory is impressed with your outward appearance, but that the beauty of the inner man has been brought home to me by the rich variety of your utterances, for each of us “speaketh out of the abundance of the heart.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520197.html'
source_title="Letter 197, Section 1"
