[[commentary]]
quote='''
To those who are just being introduced to piety, instruction through fear is more profitable, according to the advice of Solomon, wisest of men, who said: “The fear of the Lord is the beginning of wisdom.” But you, who have passed the stage of infancy in Christ, and no longer need milk but are able to be perfected in the inner man by the solid food of teachings, require the more important commandments, in which the whole truth of the love in Christ is perfected; taking care, needless to say, lest the abundance of God’s gifts become a cause to you of heavier condemnation, if you show an ungrateful disposition towards your Benefactor. For, He says, “to whom they have committed much, of him will they ask the more.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 4"

[[commentary]]
quote='''
Moreover, the Lord coupled slothfulness with wickedness, saying: “Thou wicked and slothful servant.” And the wise Solomon not only praises the worker in the words just recorded, but also rebukes the slothful man by comparing him with the smallest creatures, saying: “Go to the ant, thou sluggard.” And so we should fear lest this be brought up against us in the day of judgment when He that gave us power to work demands of us work commensurate with the power. For He says: “To whom they committed much, of him they will ask the more.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 37"
