[[commentary]]
quote='''
‘O magnify the Lord with me.’ He adopts a refrain that is becoming to him for glorifying the Lord. Let no one who is confused, no one who is disturbed, no one who is provoking his soul with the passions of the flesh, be united with me; but you, the meek, who have successfully attained to stability and firmness of soul, and who shake off sluggishness and drowsiness in the performance of your duties, you ‘magnify the Lord with me.’ But, he magnifies the Lord who endures trials for the sake of piety with keen understanding and an exulting and exalted spirit. Then, he also does, who observes with keen understanding and most profound contemplation the greatness of creation, so that from the greatness and beauty of the creatures he may contemplate their Creator. The deeper one penetrates into the reasons for which things in existence were made and are governed, the more he contemplates the magnificence of the Lord and, as far as lies in him, magnifies the Lord. Since, therefore, one mind and the attention of one man do not suffice even for a brief time for the comprehension of the splendors of God, he associates with himself all the meek for a participation in this activity. It is necessary, in fact, to achieve complete tranquility from outside confusions, and bringing about an entire silence in the hidden recesses of the heart, thus to devote oneself to the contemplation of the truth. Do you hear what he says when he confesses his sin? ‘My eye is troubled through indignation.’ Yet, not only indignation, but also concupiscence and cowardice and envy trouble the eye of the soul; and, on the whole, all the passions are confounding and disturbing to the clear-sightedness of the soul. As it is not possible for a disturbed eye to apprehend accurately visible objects, so neither is it possible for a disturbed heart to devote itself to a consideration of the truth. It is necessary, then, to withdraw from the affairs of the world and, neither through the eyes nor the ears nor through any other means of perception, to introduce alien thoughts into the soul. The wars which arise from the pride of the flesh fill the interior with noises that are never silent and with irreconcilable discords.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
