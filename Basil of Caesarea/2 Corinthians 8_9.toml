[[commentary]]
quote='''
And why does the appellation "poor man" disturb you? Remember your nature—that you came into the world naked and naked will leave it again. What is more destitute than a naked man? You have been called nothing that is derogatory, unless you make the terms used really applicable to yourself. Who was ever hauled to prison because he was poor? It is not being poor that is reprehensible but failing to bear poverty with nobility. Recall that the Lord, "being rich, became poor for our sakes."
'''
source_url=''
source_title="AGAINST ANGER 10"

[[commentary]]
quote='''
Renunciation then, so we have seen, is a loosing of the chains which bind us to the present material and transitory life, a freeing from human obligations, making us more ready to start on the God-ward way. It is an opportunity without drawbacks of acquiring and using those precious things which are “more to be desired than gold and much precious stone.” And, in brief, it is a removal of the human heart to the citizenship in heaven, so as to be able to say, “Our citizenship is in heaven.” And, greatest of all, it is the beginning of our being made like unto Christ, Who “though he was rich, yet for our sakes became poor”; which likeness unless we have first attained, it is impossible to reach the manner of living prescribed by the Gospel of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 8"
