[[commentary]]
quote='''
Furthermore man is "crowned with glory and honour," and "glory, honour and peace" are laid up by promise "to every man that worketh good." There is moreover a special and peculiar glory for Israelites "to whom," it is said "pertaineth the adoption and the glory . . . and the service," and the Psalmist speaks of a certain glory of his own, "that my glory may sing praise to Thee;" and again "Awake up my glory" and according to the Apostle there is a certain glory of sun and moon and stars, and "the ministration of condemnation is glorious." While then so many things are glorified, do you wish the Spirit alone of all things to be unglorified? Yet the Apostle says "the ministration of the Spirit is glorious." How then can He Himself be unworthy of glory? How according to the Psalmist can the glory of the just man be great and according to you the glory of the Spirit none? How is there not a plain peril from such arguments of our bringing on ourselves the sin from which there is no escape? If the man who is being saved by works of righteousness glorifies even them that fear the Lord much less would he deprive the Spirit of the glory which is His due.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 24"
