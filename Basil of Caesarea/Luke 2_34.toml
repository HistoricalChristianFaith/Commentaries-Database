[[commentary]]
quote='''
(ep. 260. ad Opt.) The sign which is spoken against is called in Scripture, the cross. For Moses, it says, made a brazen serpent, and placed it for a sign. (Numb. 21:8.)

(ubi sup.) For a sign betokens something marvellous and mysterious, which is seen indeed by the simple minded.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
About the words of Simeon to Mary, there is no obscurity or variety of interpretation. “And Simeon blessed them, and said unto Mary His mother, Behold, this Child is set for the fall and rising again of many in Israel; and for a sign which shall be spoken against; (yea, a sword shall pierce through thine own soul also,) that the thoughts of many hearts may be revealed.” Here I am astonished that, after passing by the previous words as requiring no explanation, you should enquire about the expression, “Yea, a sword shall pierce through thy own soul also.” To me the question, how the same child can be for the fall and rising again, and what is the sign that shall be spoken against, does not seem less perplexing than the question how a sword shall pierce through Mary’s heart.

My view is, that the Lord is for falling and rising again, not because some fall and others rise again, but because in us the worst falls and the better is set up. The advent of the Lord is destructive of our bodily affections and it rouses the proper qualities of the soul. As when Paul says, “When I am weak, then I am strong,” the same man is weak and is strong, but he is weak in the flesh and strong in the spirit. Thus the Lord does not give to some occasions of falling and to others occasions of rising. Those who fall, fall from the station in which they once were, but it is plain that the faithless man never stands, but is always dragged along the ground with the serpent whom he follows. He has then nowhere to fall from, because he has already been cast down by his unbelief. Wherefore the first boon is, that he who stands in his sin should fall and die, and then should live in righteousness and rise, both of which graces our faith in Christ confers on us. Let the worse fall that the better may have opportunity to rise. If fornication fall not, chastity does not rise. Unless our unreason be crushed our reason will not come to perfection. In this sense he is for the fall and rising again of many.

For a sign that shall be spoken against. By a sign, we properly understand in Scripture a cross. Moses, it is said, set the serpent “upon a pole.” That is upon a cross. Or else a sign is indicative of something strange and obscure seen by the simple but understood by the intelligent. There is no cessation of controversy about the Incarnation of the Lord; some asserting that he assumed a body, and others that his sojourn was bodiless; some that he had a passible body, and others that he fulfilled the bodily œconomy by a kind of appearance. Some say that his body was earthly, some that it was heavenly; some that He pre-existed before the ages; some that He took His beginning from Mary. It is on this account that He is a sign that shall be spoken against.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520260.html'
source_title="Letter 260, Sections 6-8"
