[[commentary]]
quote='''
Do you not, O man, fear the Apostle when he says "Ye are the temple of God, and the Spirit of God dwelleth in you"? Could he ever have brooked to honour with the title of "temple" the quarters of a slave?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 21"
