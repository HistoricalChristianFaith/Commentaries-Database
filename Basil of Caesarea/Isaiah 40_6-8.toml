[[commentary]]
quote='''
For the present I beseech you not to faint. Do not despair because your troubles follow so closely one upon another. Your crowns are near: the help of the Lord is near. Do not let all you have hitherto undergone go for nothing; do not nullify a struggle which has been famous over all the world. Human life is but of brief duration. “All flesh is grass, and all the goodliness thereof is as the flower of the field.…The grass withereth, the flower fadeth; but the word of our God shall stand for ever.” Let us hold fast to the commandment that abideth, and despise the unreality that passeth away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520220.html'
source_title="Letter 220"
