[[commentary]]
quote='''
I do beg you, then, at all events for the future, show the first and greatest fruit of the Spirit, Love; away with the angry man’s sullenness which you are showing me by your silence, and recover joy in your heart, peace with the brothers who are of one mind with you, and zeal and anxiety for the continued safety of the Churches of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252065.html'
source_title="Letter 65"
