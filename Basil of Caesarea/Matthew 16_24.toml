[[commentary]]
quote='''
Since our Lord Jesus Christ after much demonstration confirmed by many actions says to all: “If any man comes to me let him deny himself, and take up his cross, and follow me”; and again: “So therefore whosoever he be of you that renounceth not all that he hath, he cannot be my disciple,” we think that this commandment extends to the many things alienation from which is necessary. For first of all we who have given up the hidden things of shame renounce the devil and the lusts of the flesh, and physical relationships, and human friendships, and any manner of life which conflicts with the strictness of the gospel of salvation. And, what is still more necessary, he that has put off the old man with his works, which waxeth corrupt according to the lusts of deceit, renounces himself. He renounces also all affections of this world which can hinder the aim of godliness. Such a man will consider his true parents those who in Christ Jesus begat him through the Gospel; as his brethren, those who received the same spirit of adoption; and he will deem all possessions foreign to him, as indeed they are. In a word, how can he to whom the whole world has been crucified on account of Christ, and he to the world, be partaker any longer of the cares of the world? For our Lord Jesus Christ goes to extremes in hatred of the soul and denial of self, when He says: “If any man will come after me, let him deny himself, and take up his cross”; and He added then: “And follow me.” Again: “If any man cometh unto me, and hateth not his father, and mother, and wife, and children, and brothers, and sisters, yea, and his own life also, he cannot be my disciple.” Accordingly perfect renunciation consists in a man’s attaining complete impassivity as regards actual living and having “the sentence of death,” so as to put no confidence in himself. Whereas its beginnings consist of alienation from external things, such as possessions, vainglory, the common customs of life, or attachment to useless things. Examples are given us by the holy disciples of the Lord: John and James, who left their father Zebedee and even the boat, their sole source of livelihood; Matthew, who rose up from the receipt of custom itself and followed the Lord, not only leaving the gains in the custom-house, but also despising the dangers that were likely to come upon himself and his family at the hands of the authorities for leaving the accounts of the custom-house in disorder; Paul, to whom the whole world was crucified, and he unto the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 8"

[[commentary]]
quote='''
I have abandoned my life in town, as one sure to lead to countless ills; but I have not yet been able to get quit of myself. I am like travellers at sea, who have never gone a voyage before, and are distressed and seasick, who quarrel with the ship because it is so big and makes such a tossing, and, when they get out of it into the pinnace or dingey, are everywhere and always seasick and distressed. Wherever they go their nausea and misery go with them. My state is something like this. I carry my own troubles with me, and so everywhere I am in the midst of similar discomforts. So in the end I have not got much good out of my solitude. What I ought to have done; what would have enabled me to keep close to the footprints of Him who has led the way to salvation—for He says, “If any one will come after me, let him deny himself and take up his cross, and follow me”—is this.]

We must strive after a quiet mind. As well might the eye ascertain an object put before it while it is wandering restless up and down and sideways, without fixing a steady gaze upon it, as a mind, distracted by a thousand worldly cares, be able clearly to apprehend the truth. He who is not yet yoked in the bonds of matrimony is harassed by frenzied cravings, and rebellious impulses, and hopeless attachments; he who has found his mate is encompassed with his own tumult of cares; if he is childless, there is desire for children; has he children? anxiety about their education, attention to his wife, care of his house, oversight of his servants, misfortunes in trade, quarrels with his neighbours, lawsuits, the risks of the merchant, the toil of the farmer. Each day, as it comes, darkens the soul in its own way; and night after night takes up the day’s anxieties, and cheats the mind with illusions in accordance. Now one way of escaping all this is separation from the whole world; that is, not bodily separation, but the severance of the soul’s sympathy with the body, and to live so without city, home, goods, society, possessions, means of life, business, engagements, human learning, that the heart may readily receive every impress of divine doctrine. Preparation of heart is the unlearning the prejudices of evil converse. It is the smoothing the waxen tablet before attempting to write on it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25202.html'
source_title="Letter 2, Sections 1-2"
