[[commentary]]
quote='''
Here you have that unconquered athlete. These bones, which shared in the conflict with the blessed soul, are known to the Lord. These bones He will crown, together with that soul, in the righteous day of His requital, as it is written, “we must stand before the judgment seat of Christ, that each may give an account of the deeds he has done in the body.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520197.html'
source_title="Letter 197, Section 2"
