[[commentary]]
quote='''
Brothers, martyrs’ crowns await you. The companies of the confessors are ready to reach out their hands to you and to welcome you into their own ranks. Remember how none of the saints of old won their crowns of patient endurance by living luxuriously and being courted; but all were tested by being put through the fire of great afflictions. “For some had trial of cruel mockings and scourgings, and others were sawn asunder and were slain with the sword.” These are the glories of saints. Blessed is he who is deemed worthy to suffer for Christ; more blessed is he whose sufferings are greater, since “the sufferings of this present time are not worthy to be compared with the glory that shall be revealed in us.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520139.html'
source_title="Letter 139, Section 1"
