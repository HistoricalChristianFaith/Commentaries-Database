[[commentary]]
quote='''
Other virtues being practised in secret are seldom apparent to men; but continence makes the possessor conspicuous the moment one meets him. For as firm flesh and clear skin characterise the athlete, so the Christian is betokened by emaciation of body and paleness, which is the bloom of continence, showing that he is truly an athlete of Christ’s commandments. For he overcomes his enemy by the weakness of his body, and displays his strength in the contests of religion, as it is written: “When I am weak, then I am strong.” How profitable it is only to see the continent man, reluctantly and sparingly using the necessaries of life, paying nature her dues as a burdensome service, discontented when the time comes to be occupied with them and quickly springing away from table to attend to his work. For I think that no words touch the heart of him who is intemperate in eating or move him to alter his habits so much as merely meeting the continent man. This, I think, is the meaning of eating and drinking to the glory of God; so that even at the table our good works shine forth to the glorifying of our Father Who is in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 17"
