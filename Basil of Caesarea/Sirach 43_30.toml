[[commentary]]
quote='''
Those who "know not what they ought to pray for," even though they be induced to utter a word of the Spirit with awe, as though coming near His dignity, yet prune down all that exceeds the exact proportion of their speech. They ought rather to bewail their weakness, in that we are powerless to express in words our gratitude for the benefits which we are actually receiving; for He "passes all understanding," and convicts speech of its natural inability even to approach His dignity in the least degree; as it is written in the Book of Wisdom, "Exalt Him as much as you can, for even yet will He far exceed; and when you exalt Him put forth all your strength, and be not weary, for you can never go far enough."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 28"
