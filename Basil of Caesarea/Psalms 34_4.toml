[[commentary]]
quote='''
‘I sought the Lord, and he heard me.’ Let the meek hear these things, he says, that in that difficult time when all the wrath of the malicious was roused against me and every hand was armed against me, and I, stripped and unarmed, was exposed to the enemy, ready for every outrage, even at that time I was not confounded in my thoughts through fear; I was not distracted from the thought of God; I did not despair of my safety; but, I sought the Lord. I not only asked with a kind of simple and temporal hope in the Lord, but I sought. Indeed, the meaning of the word ‘sought’ signifies something more than the word ‘ask,’ just as a search is more than an inquiry. ‘For those searching have failed in their search,’ Therefore, these words suggest much leisure and calmness throughout the search.

‘And he delivered me from all my troubles.’ The whole life of the just man is filled with affliction. ‘How narrow and strait the road’; and ‘Many are the afflictions of the just.’ For this reason the Apostle said: ‘In all things we suffer tribulations’; and ‘That through many tribulations we must enter the kingdom of God.’ But, God delivers His saints from their afflictions. Though He does not leave them without trial, yet He bestows on them patient endurance. For, if ‘tribulation works out endurance, and endurance tried virtue,’ he who excludes tribulation from himself deprives himself of his tried virtue. As no one is crowned without an adversary, so also he cannot be declared tried except through tribulations. Therefore, ‘he delivered me from all my troubles,’ not permitting me to be afflicted, but with the temptation giving me a way out that I might be able to bear it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
