[[commentary]]
quote='''
Therefore, there is no male and female in the resurrection, but there is one certain life and it is of one kind, since those dwelling in the country of the living are pleasing to their Lord. This world itself is mortal and is the place of mortals. Since the substance of visible things is composite, and every composite thing is wont to be destroyed, we who are in the world, being part of the world, necessarily possess the nature of everything. Therefore, even before the soul is separated from the body by death, we men frequently die. And let not the saying appear incredible to you, but consider the truth of the matter.

In twenty-one years man is wont to undergo three variations and vicissitudes of age and life, and in each week its proper boundary circumscribes the past and displays a visible change. The age of infancy is limited by the loss of his teeth about the first week. The prescribed time for a child who is capable of learning is until youth. The youth, having attained to his twenty-first year, when he begins to cover his cheeks with the first growth of beard, imperceptibly disappears, since the adolescent has already changed into the man. Accordingly, when you see a man who has laid aside the progressive increase according to age, who is already advanced in his reasoning, and who bears no trace of youth, will you not think that the past has died in him? Again, the old man, transposed into another form and another disposition of soul, is evidently another man, as compared with the former. So that the life of men is wont to be fulfilled through many deaths, not only by the change in the passing from one age to another, but also by the lapses of the souls through sin.

But, where there is no alteration either of body or soul (for there is no deviation of reasoning, nor change of opinion unless some difficult circumstances take away the constancy and tranquillity of the reason), that is truly the country of the living, since they are always like themselves. In this, especially, the prophet promises that he will be pleasing to the God of the universe, since he will be interrupted by nothing from the outside in his pursuit of a true servitude and of equal honor with the angels. ‘We strive,’ it is said, ‘whether in the body, or out of it, to be pleasing to him.’ That is the country of the living, in which there is no night, in which there is no sleep, the image of death, in which there is no eating, no drinking, the supports of our weakness; in which there is no disease, no pains, no remedies, no courts of justice, no businesses, no arts, no money, the beginning of evil, the excuse for wars, the root of hatred; but a country of the living, who have not died through sin, but live the true life in Christ Jesus, to whom be glory and power forever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%2520114.html'
source_title="Homily on Psalm 114"
