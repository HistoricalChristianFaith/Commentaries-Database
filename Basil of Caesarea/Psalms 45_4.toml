[[commentary]]
quote='''
‘Set out, proceed prosperously, and reign.’ That is to say, having begun your care of men through the flesh, make that care earnest and lasting and never weakening. This will provide a way and a course for the preaching, and will subject all to your power. Let it not astonish us that the expression, ‘proceed prosperously,’ is spoken in the imperative mood, because of the custom of Scripture which always arranges its expressions of desire in this way. For example, ‘Thy will be done,’ instead of, ‘May Thy will be done.’ And ‘Thy kingdom come,’ instead of ‘May Thy kingdom come.’

‘Because of truth and meekness and justice: and thy right hand shall conduct thee wonderfully.’ In the same way again, this saying is fashioned figuratively, just as if the Lord were receiving as a reward these favors, namely, to proceed prosperously and to reign, because of His truth and meekness and justice. We must understand it in this way: since things human have been distorted by deceit, rule among men who are governed by sin in order that You may sow the truth again, for You are the Truth. And, ‘because of meekness,’ in order that by Your example all may be led forth to clemency and goodness. Wherefore, the Lord also said: ‘Learn from me, for I am meek and humble of heart.’ And He showed this meekness in His works themselves; ‘when he was reviled, he was silent;’ when He was scourged, He endured. ‘And thy right hand shall conduct thee wonderfully.’ Not a pillar of cloud, nor the illumination of fire, but Thy right hand itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252044.html'
source_title="Homily on Psalm 44"
