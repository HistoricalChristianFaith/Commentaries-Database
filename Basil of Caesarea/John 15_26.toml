[[commentary]]
quote='''
One point must be regarded as settled; and the remark is necessary because of our slanderers; we do not speak of the Holy Ghost as unbegotten, for we recognise one Unbegotten and one Origin of all things, the Father of our Lord Jesus Christ: nor do we speak of the Holy Ghost as begotten, for by the tradition of the faith we have been taught one Only-begotten: the Spirit of truth we have been taught to proceed from the Father, and we confess Him to be of God without creation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520125.html'
source_title="Letter 125, Section 3"
