[[commentary]]
quote='''
In the next place, the Lord declared that it is impossible to gain one’s end when the mind is divided among a variety of cares, saying, “No man can serve two masters”; and again, “Ye cannot serve God and mammon.” We must choose therefore the one heavenly treasure, that we may have our heart in it. “For where thy treasure is, there will thy heart be also.” If then we reserve to ourselves some earthly possession and corruptible riches, our mind is buried therein as it were in mud, and in consequence our soul cannot see God, nor can it be stirred to desire the heavenly beauty and the good things stored up for us in God’s promises. In fact these things are unattainable without an undistracted and passionate desire leading us to ask for them and lightening the toil necessary to win them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 8"
