[[commentary]]
quote='''
It may however be thought that the account here given of the hypostasis does not tally with the sense of the Apostle’s words, where he says concerning the Lord that He is “the brightness of His glory, and the express image of His person,” for if we have taught hypostasis to be the conflux of the several properties; and if it is confessed that, as in the case of the Father something is contemplated as proper and peculiar, whereby He alone is known, so in the same way is it believed about the Only-begotten; how then does Scripture in this place ascribe the name of the hypostasis to the Father alone, and describes the Son as form of the hypostasis, and designated not by His own proper notes, but by those of the Father? For if the hypostasis is the sign of several existence, and the property of the Father is confined to the unbegotten being, and the Son is fashioned according to His Father’s properties, then the term unbegotten can no longer be predicated exclusively of the Father, the existence of the Only-begotten being denoted by the distinctive note of the Father.

My opinion is, however, that in this passage the Apostle’s argument is directed to a different end; and it is looking to this that he uses the terms “brightness of glory,” and “express image of person.” Whoever keeps this carefully in view will find nothing that clashes with what I have said, but that the argument is conducted in a special and peculiar sense. For the object of the apostolic argument is not the distinction of the hypostases from one another by means of the apparent notes; it is rather the apprehension of the natural, inseparable, and close relationship of the Son to the Father. He does not say “Who being the glory of the Father” (although in truth He is); he omits this as admitted, and then in the endeavour to teach that we must not think of one form of glory in the case of the Father and of another in that of the Son, He defines the glory of the Only-begotten as the brightness of the glory of the Father, and, by the use of the example of the light, causes the Son to be thought of in indissoluble association with the Father. For just as the brightness is emitted by the flame, and the brightness is not after the flame, but at one and the same moment the flame shines and the light beams brightly, so does the Apostle mean the Son to be thought of as deriving existence from the Father, and yet the Only-begotten not to be divided from the existence of the Father by any intervening extension in space, but the caused to be always conceived of together with the cause. Precisely in the same manner, as though by way of interpretation of the meaning of the preceding cause, and with the object of guiding us to the conception of the invisible by means of material examples, he speaks also of “express image of person.” For as the body is wholly in form, and yet the definition of the body and the definition of the form are distinct, and no one wishing to give the definition of the one would be found in agreement with that of the other; and yet, even if in theory you separate the form from the body, nature does not admit of the distinction, and both are inseparably apprehended; just so the Apostle thinks that even if the doctrine of the faith represents the difference of the hypostases as unconfounded and distinct, he is bound by his language to set forth also the continuous and as it were concrete relation of the Only-begotten to the Father. And this he states, not as though the Only-begotten had not also a hypostatic being, but in that the union does not admit of anything intervening between the Son and the Father, with the result that he, who with his soul’s eyes fixes his gaze earnestly on the express image of the Only-begotten, is made perceptive also of the hypostasis of the Father. Yet the proper quality contemplated in them is not subject to change, nor yet to commixture, in such wise as that we should attribute either an origin of generation to the Father or an origin without generation to the Son, but so that if we could compass the impossibility of detaching one from the other, that one might be apprehended severally and alone, for, since the mere name implies the Father, it is not possible that any one should even name the Son without apprehending the Father.

Since then, as says the Lord in the Gospels, he that hath seen the Son sees the Father also; on this account he says that the Only-begotten is the express image of His Father’s person. That this may be made still plainer I will quote also other passages of the apostle in which he calls the Son “the image of the invisible God,” and again “image of His goodness;” not because the image differs from the Archetype according to the definition of indivisibility and goodness, but that it may be shewn that it is the same as the prototype, even though it be different. For the idea of the image would be lost were it not to preserve throughout the plain and invariable likeness. He therefore that has perception of the beauty of the image is made perceptive of the Archetype. So he, who has, as it were mental apprehension of the form of the Son, prints the express image of the Father’s hypostasis, beholding the latter in the former, not beholding in the reflection the unbegotten being of the Father (for thus there would be complete identity and no distinction), but gazing at the unbegotten beauty in the Begotten. Just as he who in a polished mirror beholds the reflection of the form as plain knowledge of the represented face, so he, who has knowledge of the Son, through his knowledge of the Son receives in his heart the express image of the Father’s Person. For all things that are the Father’s are beheld in the Son, and all things that are the Son’s are the Father’s; because the whole Son is in the Father and has all the Father in Himself. Thus the hypostasis of the Son becomes as it were form and face of the knowledge of the Father, and the hypostasis of the Father is known in the form of the Son, while the proper quality which is contemplated therein remains for the plain distinction of the hypostases.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252038.html'
source_title="Letter 38, Sections 6-8"

[[commentary]]
quote='''
If they really conceive of a kind of degradation of the Son in relation to the Father, as though He were in a lower place, so that the Father sits above, and the Son is thrust off to the next seat below, let them confess what they mean. We shall have no more to say. A plain statement of the view will at once expose its absurdity. They who refuse to allow that the Father pervades all things do not so much as maintain the logical sequence of thought in their argument. The faith of the sound is that God fills all things; but they who divide their up and down between the Father and the Son do not remember even the word of the Prophet: "If I climb up into heaven thou art there; if I go down to hell thou art there also." Now, to omit all proof of the ignorance of those who predicate place of incorporeal things, what excuse can be found for their attack upon Scripture, shameless as their antagonism is, in the passages "Sit thou on my right hand" and "Sat down on the right hand of the majesty of God"? The expression "right hand" does not, as they contend, indicate the lower place, but equality of relation; it is not understood physically, in which case there might be something sinister about God, but Scripture puts before us the magnificence of the dignity of the Son by the use of dignified language indicating the seat of honour. It is left then for our opponents to allege that this expression signifies inferiority of rank. Let them learn that "Christ is the power of God and wisdom of God," and that "He is the image of the invisible God" and "brightness of his glory," and that "Him hath God the Father sealed," by engraving Himself on Him.

Now are we to call these passages, and others like them, throughout the whole of Holy Scripture, proofs of humiliation, or rather public proclamations of the majesty of the Only Begotten, and of the equality of His glory with the Father? We ask them to listen to the Lord Himself, distinctly setting forth the equal dignity of His glory with the Father, in His words, "He that hath seen me hath seen the Father;" and again, "When the Son cometh in the glory of his Father;" that they "should honour the Son even as they honour the Father;" and, "We beheld his glory, the glory as of the only begotten of the Father;" and "the only begotten God which is in the bosom of the Father." Of all these passages they take no account, and then assign to the Son the place set apart for His foes. A father's bosom is a fit and becoming seat for a son, but the place of the footstool is for them that have to be forced to fall.

We have only touched cursorily on these proofs, because our object is to pass on to other points. You at your leisure can put together the items of the evidence, and then contemplate the height of the glory and the preeminence of the power of the Only Begotten. However, to the well-disposed hearer, even these are not insignificant, unless the terms "right hand" and "bosom" be accepted in a physical and derogatory sense, so as at once to circumscribe God in local limits, and invent form, mould, and bodily position, all of which are totally distinct from the idea of the absolute, the infinite, and the incorporeal. There is moreover the fact that what is derogatory in the idea of it is the same in the case both of the Father and the Son; so that whoever repeats these arguments does not take away the dignity of the Son, but does incur the charge of blaspheming the Father; for whatever audacity a man be guilty of against the Son he cannot but transfer to the Father. If he assigns to the Father the upper place by way of precedence, and asserts that the only begotten Son sits below, he will find that to the creature of his imagination attach all the consequent conditions of body. And if these are the imaginations of drunken delusion and phrensied insanity, can it be consistent with true religion for men taught by the Lord himself that "He that honoureth not the Son honoureth not the Father" to refuse to worship and glorify with the Father him who in nature, in glory, and in dignity is conjoined with him? What shall we say? What just defence shall we have in the day of the awful universal judgment of all-creation, if, when the Lord clearly announces that He will come "in the glory of his Father;" when Stephen beheld Jesus standing at the right hand of God; when Paul testified in the spirit concerning Christ "that he is at the right hand of God;" when the Father says, "Sit thou on my right hand;" when the Holy Spirit bears witness that he has sat down on "the right hand of the majesty" of God; we attempt to degrade him who shares the honour and the throne, from his condition of equality, to a lower state? Standing and sitting, I apprehend, indicate the fixity and entire stability of the nature, as Baruch, when he wishes to exhibit the immutability and immobility of the Divine mode of existence, says, "For thou sittest for ever and we perish utterly." Moreover, the place on the right hand indicates in my judgment equality of honour. Rash, then, is the attempt to deprive the Son of participation in the doxology, as though worthy only to be ranked in a lower place of honour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 6"

[[commentary]]
quote='''
What our fathers said, the same say we, that the glory of the Father and of the Son is common; wherefore we offer the doxology to the Father with the Son. But we do not rest only on the fact that such is the tradition of the Fathers; for they too followed the sense of Scripture, and started from the evidence which, a few sentences back, I deduced from Scripture and laid before you. For "the brightness" is always thought of with "the glory," "the image" with the archetype, and the Son always and everywhere together with the Father; nor does even the close connexion of the names, much less the nature of the things, admit of separation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 7"

[[commentary]]
quote='''
Thus the good things that come from God reach us "through the Son," who works in each case with greater speed than speech can utter. For not lightnings, not light's course in air, is so swift; not eyes' sharp turn, not the movements of our very thought. Nay, by the divine energy is each one of these in speed further surpassed than is the slowest of all living creatures outdone in motion by birds, or even winds, or the rush of the heavenly bodies: or, not to mention these, by our very thought itself. For what extent of time is needed by Him who "upholds all things by the word of His power," and works not by bodily agency, nor requires the help of hands to form and fashion, but holds in obedient following and unforced consent the nature of all things that are? So as Judith says, "Thou hast thought, and what things thou didst determine were ready at hand."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"

[[commentary]]
quote='''
If you remain outside the Spirit you will not be able even to worship at all; and on your becoming in Him you will in no wise be able to dissever Him from God;—any more than you will divorce light from visible objects. For it is impossible to behold the Image of the invisible God except by the enlightenment of the Spirit, and impracticable for him to fix his gaze on the Image to dissever the light from the Image, because the cause of vision is of necessity seen at the same time as the visible objects. Thus fitly and consistently do we behold the "Brightness of the glory" of God by means of the illumination of the Spirit, and by means of the "Express Image" we are led up to Him of whom He is the Express Image and Seal, graven to the like.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 26"
