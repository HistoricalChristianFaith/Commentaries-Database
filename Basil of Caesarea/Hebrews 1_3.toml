[[commentary]]
quote='''
It may however be thought that the account here given of the hypostasis does not tally with the sense of the Apostle’s words, where he says concerning the Lord that He is “the brightness of His glory, and the express image of His person,” for if we have taught hypostasis to be the conflux of the several properties; and if it is confessed that, as in the case of the Father something is contemplated as proper and peculiar, whereby He alone is known, so in the same way is it believed about the Only-begotten; how then does Scripture in this place ascribe the name of the hypostasis to the Father alone, and describes the Son as form of the hypostasis, and designated not by His own proper notes, but by those of the Father? For if the hypostasis is the sign of several existence, and the property of the Father is confined to the unbegotten being, and the Son is fashioned according to His Father’s properties, then the term unbegotten can no longer be predicated exclusively of the Father, the existence of the Only-begotten being denoted by the distinctive note of the Father.

My opinion is, however, that in this passage the Apostle’s argument is directed to a different end; and it is looking to this that he uses the terms “brightness of glory,” and “express image of person.” Whoever keeps this carefully in view will find nothing that clashes with what I have said, but that the argument is conducted in a special and peculiar sense. For the object of the apostolic argument is not the distinction of the hypostases from one another by means of the apparent notes; it is rather the apprehension of the natural, inseparable, and close relationship of the Son to the Father. He does not say “Who being the glory of the Father” (although in truth He is); he omits this as admitted, and then in the endeavour to teach that we must not think of one form of glory in the case of the Father and of another in that of the Son, He defines the glory of the Only-begotten as the brightness of the glory of the Father, and, by the use of the example of the light, causes the Son to be thought of in indissoluble association with the Father. For just as the brightness is emitted by the flame, and the brightness is not after the flame, but at one and the same moment the flame shines and the light beams brightly, so does the Apostle mean the Son to be thought of as deriving existence from the Father, and yet the Only-begotten not to be divided from the existence of the Father by any intervening extension in space, but the caused to be always conceived of together with the cause. Precisely in the same manner, as though by way of interpretation of the meaning of the preceding cause, and with the object of guiding us to the conception of the invisible by means of material examples, he speaks also of “express image of person.” For as the body is wholly in form, and yet the definition of the body and the definition of the form are distinct, and no one wishing to give the definition of the one would be found in agreement with that of the other; and yet, even if in theory you separate the form from the body, nature does not admit of the distinction, and both are inseparably apprehended; just so the Apostle thinks that even if the doctrine of the faith represents the difference of the hypostases as unconfounded and distinct, he is bound by his language to set forth also the continuous and as it were concrete relation of the Only-begotten to the Father. And this he states, not as though the Only-begotten had not also a hypostatic being, but in that the union does not admit of anything intervening between the Son and the Father, with the result that he, who with his soul’s eyes fixes his gaze earnestly on the express image of the Only-begotten, is made perceptive also of the hypostasis of the Father. Yet the proper quality contemplated in them is not subject to change, nor yet to commixture, in such wise as that we should attribute either an origin of generation to the Father or an origin without generation to the Son, but so that if we could compass the impossibility of detaching one from the other, that one might be apprehended severally and alone, for, since the mere name implies the Father, it is not possible that any one should even name the Son without apprehending the Father.

Since then, as says the Lord in the Gospels, he that hath seen the Son sees the Father also; on this account he says that the Only-begotten is the express image of His Father’s person. That this may be made still plainer I will quote also other passages of the apostle in which he calls the Son “the image of the invisible God,” and again “image of His goodness;” not because the image differs from the Archetype according to the definition of indivisibility and goodness, but that it may be shewn that it is the same as the prototype, even though it be different. For the idea of the image would be lost were it not to preserve throughout the plain and invariable likeness. He therefore that has perception of the beauty of the image is made perceptive of the Archetype. So he, who has, as it were mental apprehension of the form of the Son, prints the express image of the Father’s hypostasis, beholding the latter in the former, not beholding in the reflection the unbegotten being of the Father (for thus there would be complete identity and no distinction), but gazing at the unbegotten beauty in the Begotten. Just as he who in a polished mirror beholds the reflection of the form as plain knowledge of the represented face, so he, who has knowledge of the Son, through his knowledge of the Son receives in his heart the express image of the Father’s Person. For all things that are the Father’s are beheld in the Son, and all things that are the Son’s are the Father’s; because the whole Son is in the Father and has all the Father in Himself. Thus the hypostasis of the Son becomes as it were form and face of the knowledge of the Father, and the hypostasis of the Father is known in the form of the Son, while the proper quality which is contemplated therein remains for the plain distinction of the hypostases.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252038.html'
source_title="Letter 38, Sections 6-8"
