[[commentary]]
quote='''
Wherefore we also, welcoming your zeal as necessary for attaining our end, by God’s gift and your assistance of us in your prayers will strive to stir up the spark of divine love hidden within you according to the power given us by the Spirit. You must know that this virtue, though only one, yet as regards power accomplishes and comprehends every commandment. For “he that loveth me,” saith the Lord, “will keep my commandments.” And again: “On these two commandments hang all the law and the prophets.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 2"
