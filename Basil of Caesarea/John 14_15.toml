[[commentary]]
quote='''
Having done this, it befits us to keep our hearts with all watchfulness, so as never to lose the thought of God, or to defile the memory of His wonders with imaginations of vanity; but to bear about the holy thought of God with continual and pure memory imprinted in our souls, as it were an indelible seal. For thus we gain love towards God; which both stirs us up to work the Lord’s commandments and is in its turn preserved by them in permanence and security. And this the Lord shows, saying in one place: “If ye love me, keep my commandments,” and in another: “If ye keep my commandments, ye shall abide in my love”; adding with still more insistence: “Even as I have kept my Father’s commandments and abide in his love.”

He teaches us hereby to keep ever before us as the aim of the work set us the will of Him Who gave the order, and to direct our efforts towards Him, as also He says elsewhere: “I am come down from heaven, not to do mine own will, but the will of the Father that sent me.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 5"
