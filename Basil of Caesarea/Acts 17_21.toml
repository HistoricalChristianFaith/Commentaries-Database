[[commentary]]
quote='''
Now, leisure itself is good and useful to him who is unoccupied, since it produces quiet for the acquisition of salutary doctrines. But, the leisure of the Athenians was evil, ‘who used to spend all their leisure telling or listening to something new.’ Even at the present time some imitate this, misusing the leisure of life for the discovery of some newer teaching. Such leisure is dear to unclean and wicked spirits. ‘When the unclean spirit,’ it is said, ‘has gone out of a man, he says, “I will return to my house which I left.” And when he has come, he finds the place unoccupied and swept.’ May it not be that we make our leisure a time for the adversary to enter, but let us occupy our house within, causing Christ to dwell in us beforehand through the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"
