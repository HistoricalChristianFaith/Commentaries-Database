[[commentary]]
quote='''
I have read the letter of your holiness, in which you have expressed your distress at the unhappy governor of Libya. I am grieved that my own country should have given birth to and nurtured such vices. I am grieved too that Libya, a neighbouring country, should suffer from our evils, and should have been delivered to the inhumanity of a man whose life is marked at once by cruelty and crime. This however is only in accordance with the wisdom of the Preacher, “Woe to thee O land when thy King is a child;” (a still further touch of trouble) and whose “Princes” do not “eat” after night but revel at mid-day, raging after other men’s wives with less understanding than brute beasts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252061.html'
source_title="Letter 61"
