[[commentary]]
quote='''
‘Therefore we will not fear, when the earth shall be troubled; and the mountains shall be removed into the heart of the sea.’ The prophet shows the great strength of his confidence in Christ, because, even if all things are turned upside down, and the earth, being troubled, is overturned, and if the mountains, leaving their proper sites, are removed to the middle of the sea, ‘We will not fear,’ seeing that we have ‘God as our refuge and strength and helper in troubles which have found us exceedingly.’ Whose heart is so undaunted, whose thoughts are so untroubled, as in such great confusion to direct his mind toward God, and through hope in Him to be astounded at nothing that happens? We, however, do not endure the anger of man; if a dog runs at us, or some other animal, we do not look to God for help in our trouble, but, panic-stricken we turn our attention toward ourselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"
