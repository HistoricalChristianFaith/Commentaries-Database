[[commentary]]
quote='''
The sum of what I say is this. If any one wants to contract a lawful marriage, the whole world is open to him: if he is only impelled by lust, let him be the more restricted, “that he may know how to possess his vessel in sanctification and honour, not in the lust of concupiscence.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520160.html'
source_title="Letter 160, Section 5"
