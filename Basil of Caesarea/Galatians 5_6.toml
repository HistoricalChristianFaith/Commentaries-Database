[[commentary]]
quote='''
For you know that unless illumined by faith in God, strictness of life availeth nothing; nor will a right confession of faith, if void of good works, be able to present you before the Lord.

Faith and works must be joined: so shall the man of God be perfect, and his life not halt through any imperfection.

For the faith which saves us, as saith the Apostle, is that which worketh by love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520295.html'
source_title="Letter 295"
