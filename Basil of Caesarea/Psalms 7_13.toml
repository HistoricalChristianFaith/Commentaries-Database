[[commentary]]
quote='''
‘He hath made ready his arrows for them that burn.’ As fire was produced by the Creator for material that burns—it certainly was not created for steel which is not melted by fire, but for wood which burns up—so also arrows were made by God for souls which are easily enkindled, whose great amount of material, worldly and suitable for destruction, has been collected. Those, then, who have accepted beforehand and hold in themselves the burning arrows of the devil, are the ones who receive the arrows of God. For this reason Scripture says: ‘He hath made ready his arrows for them that burn.’ Carnal loves burn the soul, and so do desires for money, fiery wraths, griefs which inflame and melt the soul, and fears which estrange from God. He who is unharmed by the arrows of the enemy and who has put on the armor of God remains untouched by the death-bringing arrows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
