[[commentary]]
quote='''
Besides, the waters above the heavens, these waters privileged by the virtue which they possess in themselves, are not the only waters to celebrate the praises of God. “Praise the Lord from the earth, ye dragons and all deeps.” Thus the singer of the Psalms does not reject the deeps which our inventors of allegories rank in the divisions of evil; he admits them to the universal choir of creation, and the deeps sing in their language a harmonious hymn to the glory of the Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25203-On%2520the%2520Firmament.html'
source_title="The Hexaemeron, Homily 3: On the Firmament"
