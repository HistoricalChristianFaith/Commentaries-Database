[[commentary]]
quote='''
As regards the vices of the soul, there is one measure of continence, namely complete abstinence from all that tends to harmful pleasure. But as regards food, different men have different needs, which vary according to age and occupation and proportionately to the habit of the body; so also is the measure and fashion of the use of food. And so it is impossible that all who are being trained in godliness should be comprehended under the same rule. But having defined the measure to be observed by those of the ascetics who are in health, we allow those responsible for the discipline to make wise deviations from it to meet individual circumstances. For it is not possible to deal with every single case in my instructions, but only with the broad outlines of generally applicable teaching. For whether it be invalids wanting strengthening food, or a man otherwise exhausted after strenuous toil, or one who needs food to prepare him for labour such as a journey or other hard task, the superiors will always arrange according to the need, following the saying: “They were parted unto all according as each had need.” It is impossible therefore to fix the same hour for taking food, or the same manner or measure; but let the satisfying of the need be the aim in each case.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 19"

[[commentary]]
quote='''
Among those who distribute the necessities of life within the monastery there should by all means be some in each rank who can imitate those men in the Acts who did what is there said, namely: “Distribution was made unto each, according as any one had need”; men who will bestow much thought to be considerate and long-suffering to all, and not to incur suspicion of favouritism or partiality towards any, according to the commandment of the apostle who said: “Doing nothing by partiality”; nor of contentiousness, which the same writer rejects as appropriate in Christians, saying: “But if any man seemeth to be contentious, we have no such custom, neither the Churches of God.” The result of such conduct is that they deprive those with whom they have a contention of the necessities of life, and give an excess to those to whom they are partial. In the one case we get hatred of the brethren, in the other favouritism, which is to be specially condemned because through it the loving unity of the brotherhood is torn asunder, and in its place enter evil suspicions, jealousies, strifes, and shrinkings from work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 34"

[[commentary]]
quote='''
In sum, however, what he said about poverty was this, that the rule ought to be that every one should limit his possessions to one garment. For one proof of this he quoted the words of John the Baptist “he that hath two coats let him impart to him that hath none;” and for another our Lord’s prohibition to His disciples to have two coats. He further added “If thou wilt be perfect go and sell that thou hast and give to the poor.” He said too that the parable of the pearl bore on this point, because the merchant, who had found the pearl of great price, went away and sold all that he had and bought it; and he added too that no one ought even to permit himself the distribution of his own property, but should leave it in the hands of the person entrusted with the duty of managing the affairs of the poor; and he proved the point from the acts of the apostles, because they sold their property and brought and laid it at the feet of the apostles, and by them it was distributed to each as every man had need. For he said that experience was needed in order to distinguish between cases of genuine need and of mere greedy begging. For whoever gives to the afflicted gives to the Lord, and from the Lord shall have his reward; but he who gives to every vagabond casts to a dog, a nuisance indeed from his importunity, but deserving no pity on the ground of want.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520150.html'
source_title="Letter 150, Section 3"
