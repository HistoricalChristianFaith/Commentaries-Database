[[commentary]]
quote='''
‘The Lord maketh the flood to dwell.’ A flood is an overflow of water which causes all lying below it to disappear and cleanses all that was previously filthy. Therefore, he calls the grace of baptism a flood, so that the soul, being washed well of its sins and rid of the old man, is suitable henceforward as a dwelling place of God in the Spirit. Further, what is said in the Thirty-first Psalm agrees with this. For, after he has said: ‘I have acknowledged my sin, and my injustice I have not concealed,’ and also, ‘For this shall every one that is holy pray to thee,’ he brought in, ‘And yet in a flood of many waters, they shall not come nigh unto him.’ Indeed, the sins shall not come nigh to him who received baptism for the remission of his transgressions through water and the Spirit. Something akin to this is found in the prophecy of Michea: ‘Because he delighteth in mercy, he will turn again and have mercy on us, he will put away our iniquities, and will cast them into the bottom of the sea.’

‘And the Lord shall sit king forever.’ God is sitting in the soul which shines from its washing, as if He were making it a throne for Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"
