[[commentary]]
quote='''
He who perceives the Father, and perceives Him by Himself, has at the same time mental perception of the Son; and he who receives the Son does not divide Him from the Spirit, but, in consecution so far as order is concerned, in conjunction so far as nature is concerned, expresses the faith commingled in himself in the three together. He who makes mention of the Spirit alone, embraces also in this confession Him of whom He is the Spirit. And since the Spirit is Christ’s and of God, as says Paul, then just as he who lays hold on one end of the chain pulls the other to him, so he who “draws the Spirit,” as says the prophet, by His means draws to him at the same time both the Son and the Father. And if any one verily receives the Son, he will hold Him on both sides, the Son drawing towards him on the one His own Father, and on the other His own Spirit. For He who eternally exists in the Father can never be cut off from the Father, nor can He who worketh all things by the Spirit ever be disjoined from His own Spirit. Likewise moreover he who receives the Father virtually receives at the same time both the Son and the Spirit; for it is in no wise possible to entertain the idea of severance or division, in such a way as that the Son should be thought of apart from the Father, or the Spirit be disjoined from the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252038.html'
source_title="Letter 38, Section 4"
