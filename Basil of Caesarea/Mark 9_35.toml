[[commentary]]
quote='''
Let not the Superior be elated by his high office, lest he lose the blessedness promised to humility, or even, being puffed up, fall into the condemnation of the devil. But let him be persuaded of this, that the care of many entails the service of many. So just as he that renders service to a number of wounded, wiping away the discharge from each separate wound and applying remedies according to the special needs of the case in front of him, takes his service as an opportunity not of pride but rather of humiliation, anxiety and struggle; such feelings and anxieties to an even greater degree ought he to have who has been entrusted with the task of healing the sicknesses of the brotherhood, since he is the servant of all and will have to give account for all. For in this way the aim will be fulfilled which the Lord had in mind when He said: “If any man among you would be first, let him be last of all and servant of all.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 30"
