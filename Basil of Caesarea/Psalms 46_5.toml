[[commentary]]
quote='''
‘God is in the midst thereof, it shall not be moved: God will help it in the morning early.’ Since God is in the midst of the city, He will give it stability, providing assistance for it at the first break of dawn. Therefore, the word, ‘of the city,’ will fit either Jerusalem above or the Church below, ‘The most High hath sanctified his own tabernacle’ in it. And through this tabernacle, in which God dwelt, He was in the midst of it, giving it stability. Moreover, God is in the midst of the city, sending out equal rays of His providence from all sides to the limits of the world. Thus, the justice of God is preserved, as He apportions the same measure of goodness to all. ‘God will help it in the morning early.’ Now, the perceptible sun produces among us the early morning when it rises above the horizon opposite us, and the Sun of justice produces the early morning in our soul by the rising of the spiritual light, making day in him who admits it. ‘At night’ means we men are in this time of ignorance. Therefore, having opened wide our mind, let us receive ‘the brightness of his glory,’ and let us be brightly illumined by the everlasting Light, ‘God will help it in the morning early.’ When we have become children of light, and ‘the night is far advanced for us, and the day is at hand,’ then we shall become worthy of the help of God. Therefore, God helps the city, producing in it early morning by His own rising and coming. ‘Behold a man,’ it is said, ‘the Orient is his name.’ For those upon whom the spiritual light will rise, when the darkness which comes from ignorance and wickedness is destroyed, early morning will be at hand. Since, then, light has come into the world in order that he who walks about in it may not stumble, His help is able to cause the early morning. Or perhaps, since the Resurrection was in the dim morning twilight, God will help the city in the morning early, who on the third day, early on the morning of the Resurrection gained the victory through death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"
