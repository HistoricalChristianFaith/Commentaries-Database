[[commentary]]
quote='''
And He said the same concerning the Spirit. "The Spirit of truth," He says, "whom the world cannot receive, because it seeth Him not, neither knoweth Him: but ye know Him, for He dwelleth with you." For the carnal man, who has never trained his mind to contemplation, but rather keeps it buried deep in lust of the flesh, as in mud, is powerless to look up to the spiritual light of the truth. And so the world, that is life enslaved by the affections of the flesh, can no more receive the grace of the Spirit than a weak eye the light of a sunbeam. But the Lord, who by His teaching bore witness to purity of life, gives to His disciples the power of now both beholding and contemplating the Spirit. For "now," He says, "Ye are clean through the word which I have spoken unto you," wherefore "the world cannot receive Him, because it seeth Him not, . . . but ye know Him; for he dwelleth with you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 22"
