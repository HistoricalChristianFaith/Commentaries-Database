[[commentary]]
quote='''
Moses was the brother of Israel, and yet he was not able to redeem him. How, then, will any ordinary man be ransomed? Wherefore, the one sentence declares: ‘No brother can redeem,’ and the other with gravity adds interrogatively: ‘Will man redeem?’ Moses did not free his people from sin, but he begged from God the exemption of the punishment due to sin. However, he was not able to give his own ransom when he was in sin, because, after the many and great wonders and signs which he saw, he uttered those words expressive of doubt: ‘Hear me, ye rebellious and incredulous: Can we bring you forth water out of this rock?’ Therefore, the Lord, because of this word, said to Moses and Aaron: ‘Because you have not believed me to sanctify me before the children of Israel, you shall not bring these people into the land which I have given them.’ ‘He shall not, then, give to God his ransom.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
