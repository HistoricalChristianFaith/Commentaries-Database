[[commentary]]
quote='''
‘Instead of thy fathers, sons are born to thee: thou shalt make them princes over all the earth.’ Since she was ordered above to forget her people and her father’s house, in exchange for her obedience she now receives instead of fathers, sons who are conspicuous for such great qualities that they are established as ‘princes over all the earth.’ Who, then, are the sons of the Church? Surely, the sons of the Gospel, who rule all the earth. ‘Their sound hath gone forth,’ he says, ‘into all the earth,’ and ‘They shall sit on twelve thrones, and they shall judge the twelve tribes of Israel.’ And if anyone accepts the patriarchs as the fathers of the bride, even thus the explanation of the apostles does not fail. For, instead of them there were born to her through Christ sons, who do the works of Abraham and, therefore, are deemed equal in honor with them, because they have done the same things for which the fathers were considered worthy of great honors. In truth, the saints are the princes of all the earth because of their attraction for the good, since the nature itself of good bestows upon them the first place, as it bestowed upon Jacob the rights of Esau. For, it is said: ‘Be master of your brother.’ Accordingly, they who have been made equal in honor with their fathers and have received in addition the pre-eminence in all things through the exercise of virtue, are both sons of the bride of Christ and are established by their own mother as princes over all the earth. Consider, I pray you, how great is the power of the queen, that she appoints princes over all the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252044.html'
source_title="Homily on Psalm 44"
