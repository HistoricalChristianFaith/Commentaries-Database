[[commentary]]
quote='''
‘God is a just judge, strong and patient: he is not angry every day.’ The prophet seems to say this, alluding to those who are always disturbed at what happens, as if calming the confusion of men, lest at any time they mistrust His providence concerning the universe, when they see a father unavenged at the rebellion of his son and the wickedness of Absalom prospering in whatever he proposed. Correcting, therefore, the foolishness in their thoughts, he testified to them: ‘God is a just judge, strong and patient: he is not angry every day.’ Not indiscriminately does any of the things that happen take place, but God measures out in turn to each person with the measures with which He first measured out the actions of their life. When I have committed a sin, I receive in return according to my desert. ‘Speak not, then, iniquity against God,’ for God is a just Judge. Do not be so poorly disposed toward God as to think that He is too weak to avenge, for He is also strong. What reason is there, then, that swift vengeance is not inflicted on the sinner? Because He is patient, ‘He is not angry every day.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
