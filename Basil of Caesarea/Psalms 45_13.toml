[[commentary]]
quote='''
‘All the glory of the king’s daughter is within, invested and adorned with golden borders. After her shall virgins be brought to the king.’ After she had been cleansed of the former doctrines of wickedness, and was heeding the instruction and forgetting her people and her father’s house, the Holy Spirit relates what pertains to her. And since He saw the cleanliness deeply hidden, He says: ‘All the glory of the king’s daughter,’ that is to say, of Christ’s bride, who has become henceforth through adoption daughter of the king, ‘is within.’ The assertion urges us to penetrate to the inmost mysteries of ecclesiastical glory, since the beauty of the bride is within. He who makes himself ready for the Father who sees in secret, and who prays and does all things, not to be seen by men, but to be known to God alone, this man has all his glory within, even as the king’s daughter. And the golden borders with which the whole is invested and adorned are within.

Seek nothing with exterior gold and bodily adornment; but consider the garment as one worthy to adorn him who is according to the image of his Creator, as the Apostle says: ‘Stripping off the old man, and putting on the new, one that is being renewed unto perfect knowledge “according to the image of his Creator.”’ And he who has put on ‘the heart of mercy, kindness, humility, patience, and meekness,’ is clothed within and has adorned the inner man. Paul exhorts us to put on the Lord Jesus, not according to the exterior man, but in order that our remembrance of God may cover over our whole mind. But, I believe that the spiritual garment is woven when the attendant action is interwoven with the word of doctrine. In fact, just as a bodily garment is woven when the woof is interwoven with the warp, so when the word is antecedent, if actions in accordance with the word should be produced, there would be made a certain most magnificent garment for the soul which possesses a life of virtue attained by word and action. But, the borders hang down from the garment, these also spiritual; therefore, they too are said to be golden. Since, indeed, the word is greater than the deed, there is, as it were, a certain border which remains over from the woven robe according to the action.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252044.html'
source_title="Homily on Psalm 44"
