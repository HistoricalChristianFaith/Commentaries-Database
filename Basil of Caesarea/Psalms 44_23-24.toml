[[commentary]]
quote='''
We attribute to God, as it were, every state that corresponds to our circumstances. For this reason, when we are half asleep and behaving slothfully, God, since He judges us unworthy of His observant watchfulness over us, is said to be asleep. But, when, after noticing at some time the harm that comes from the sleep, we shall say, ‘Arise, why sleepest thou, O Lord?’ ‘Behold he shall neither slumber nor sleep at that time, that keepeth Israel.’ Some others, as it were, turn their eyes away from God because of their shameful deeds and their acts unworthy of the eyes of God; these, on repenting, say: ‘Why turnest thou thy face away?’ Besides these, there are others who have cast out the memory of God and, as it were, are producing in Him forgetfulness of themselves, and these say: ‘Why forgettest thou our want and our trouble?’ In a word, men do the very things that are humanly spoken about God, making God in their own regard such as each has formerly made himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
