[[commentary]]
quote='''
‘He shall not give to God his ransom, nor the price of the redemption of his soul.’ Do not, then, seek your brother for your ransoming, but Him who surpasses your nature, not a mere man, but the Man God Jesus Christ, who alone is able to give ransom to God for all of us, because ‘God has set him forth as a propitiation by his blood through faith.’ Moses was the brother of Israel, and yet he was not able to redeem him. How, then, will any ordinary man be ransomed? Wherefore, the one sentence declares: ‘No brother can redeem,’ and the other with gravity adds interrogatively: ‘Will man redeem?’ Moses did not free his people from sin, but he begged from God the exemption of the punishment due to sin. However, he was not able to give his own ransom when he was in sin, because, after the many and great wonders and signs which he saw, he uttered those words expressive of doubt: ‘Hear me, ye rebellious and incredulous: Can we bring you forth water out of this rock?’ Therefore, the Lord, because of this word, said to Moses and Aaron: ‘Because you have not believed me to sanctify me before the children of Israel, you shall not bring these people into the land which I have given them.’ ‘He shall not, then, give to God his ransom.’

In fact, what can man find great enough that he may give it for the ransom of his soul? But, one thing was found worth as much as all men together. This was given for the price of ransom for our souls, the holy and highly honored blood of our Lord Jesus Christ, which He poured out for all of us; therefore, we were bought at a great price. If, then, a brother does not redeem, will man redeem? But, if man cannot redeem us, He who redeems us is not a man. Now, do not assume, because He sojourned with us ‘in the likeness of sinful flesh,’ that our Lord is only man, failing to discern the power of the divinity, who had no need to give God a ransom for Himself nor to redeem His own soul because ‘He did no sin, neither was deceit found in his mouth.’ No one is sufficient to redeem himself, unless He comes who turns away the captivity of the people, not with ransoms nor with gifts, as it is written in Isaia, but in His own blood.

Although we are not His brothers, but have become His enemies by our transgressions, He, who is not mere man, but God, after the freedom which He bestowed on us, also calls us His brothers. ‘I will declare thy name,’ He says, ‘to my brethren.’ Now, He who has redeemed us, if you examine His nature, is neither brother nor man; but, if you examine His condescension to us through grace, He calls us brothers and descends to our human nature, who ‘shall not give to God his own ransom,’ but that of the whole world. He does not need a ransom, but He Himself is the propitiation. ‘For it was fitting that we should have such a high priest, holy, innocent, undefiled, set apart from sinners, and become higher than the heavens. He does not need to offer sacrifices daily (as the other priests did), first for his own sins, and then for the sins of the people.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
