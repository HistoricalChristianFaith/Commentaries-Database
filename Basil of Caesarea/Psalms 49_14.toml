[[commentary]]
quote='''
‘They are laid in hell like sheep: death shall feed upon them.’ He, who carries away into captivity those who are beastlike and who are compared to senseless herds, like the sheep, which have neither the intelligence nor the ability to defend themselves, since he is an enemy, has already cast them down into his own prison and has handed them over to death to feed. For, death tended them from the time of Adam until the administration of Moses, until the true Shepherd came, who laid down His own life for His sheep and who thus, making them rise together and leading them out from the prison of hell to the early morning of the Resurrection, handed them over to the righteous, that is to say, to His holy angels, to tend them.

‘And the just shall have dominion over them in the morning.’ With each of the faithful there is an angel associated, who is worthy to look upon the Father in heaven. These righteous, then, shall have dominion over them when they have been freed from their most bitter slavery and ‘shall have dominion over them’ when they have come forth ‘in the early morning,’ that is to say, when they are advancing into the rising of the light. Contemplate the whole series of the written words. ‘Man when he was in honor did not understand; he is compared to senseless beasts.’ He who through his condition has dignity, but who does not know himself because of the sin which dwells in him, was compared to senseless beasts. Then, because he estranged himself from the word of God, having become a brute beast, the enemy carried him away, like an untended sheep, and cast him into hell, handing him over to death to tend. Therefore, having been ransomed from there and freed from the evil shepherd, he says, ‘The Lord ruleth me.’ And no longer death, but life; no longer a fall, but a resurrection; no longer deceit, but truth.

‘And their help shall decay in hell.’ It may be that he is speaking about death, since it had not been able with all its help to retain those who were being herded by it because of the One who destroyed him who holds the power over death; for all of their help is old and weak. At that time the help of those men who were deceived in mind and who were proud because of wealth and glory and power will be proved false. ‘In hell it shall decay’ since their weakness is proved. Or, perhaps, the help of the just who have been redeemed by the Lord will be delayed in hell. For, not yet had they received the promises, since God had something better in view for us, namely, that those who preceded ‘should not be perfected without us.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
