[[commentary]]
quote='''
Peter's words to Sapphira, "How is it that ye have agreed together to tempt the Spirit of the Lord? Ye have not lied unto men, but unto God," show that sins against the Holy Spirit and against God are the same; and thus you might learn that in every operation the Spirit is closely conjoined with, and inseparable from, the Father and the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 16"
