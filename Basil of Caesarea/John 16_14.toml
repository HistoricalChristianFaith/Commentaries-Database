[[commentary]]
quote='''
He is moreover styled 'Spirit of Christ,' as being by nature closely related to Him. Wherefore "If any man have not the Spirit of Christ, he is none of His." Hence He alone worthily glorifies the Lord, for, it is said, "He shall glorify me," not as the creature, but as "Spirit of truth," clearly shewing forth the truth in Himself, and, as Spirit of wisdom, in His own greatness revealing "Christ the Power of God and the wisdom of God." And as Paraclete He expresses in Himself the goodness of the Paraclete who sent Him, and in His own dignity manifests the majesty of Him from whom He proceeded. There is then on the one hand a natural glory, as light is the glory of the sun; and on the other a glory bestowed judicially and of free will 'ab extra' on them that are worthy. The latter is twofold. "A son," it is said, "honoureth his father, and a servant his master." Of these two the one, the servile, is given by the creature; the other, which may be called the intimate, is fulfilled by the Spirit. For, as our Lord said of Himself, "I have glorified Thee on the earth: I have finished the work which thou gavest me to do;" so of the Paraclete He says "He shall glorify me: for He shall receive of mine, and shall show it unto you." And as the Son is glorified of the Father when He says "I have both glorified it and will glorify it again," so is the Spirit glorified through His communion with both Father and Son, and through the testimony of the Only-begotten when He says "All manner of sin and blasphemy shall be forgiven unto men: but the blasphemy against the Holy Ghost shall not be forgiven unto men."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 18"
