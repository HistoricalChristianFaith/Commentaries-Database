[[commentary]]
quote='''
While we men were in our first age, we were neither in sin nor in virtue (for the age was unsusceptible of either condition); but, when reason was perfected in us, then that happened which was written: ‘But when the commandment came, sin revived, and I died.’ Wicked thoughts, which originate in our minds from the passions of the flesh, rise up. In truth, if, when the command came, that is, the power of discernment of the good, the mind did not prevail over the baser thoughts but permitted its reason to be enslaved by the passions, sin revived, but the mind died, suffering death because of its transgressions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25201.html'
source_title="Homily on Psalm 1"
