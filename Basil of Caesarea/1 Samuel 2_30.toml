[[commentary]]
quote='''
You were previously known to me, my dear friends, by your far-famed piety, and by the crown won by your confession in Christ. Peradventure one of you may ask in reply who can have carried these tidings of us so far? The Lord Himself; for He puts His worshippers like a lamp on a lamp-stand, and makes them shine throughout the whole world. Are not winners in the games wont to be made famous by the prize of victory, and craftsmen by the skilful design of their work? Shall the memory of these and others like them abide for ever unforgotten, and shall not Christ’s worshippers concerning whom the Lord says Himself, Them that honour me I will honour, be made famous and glorious by Him before all? Shall He not display the brightness of their radiant splendour as He does the beams of the sun?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520221.html'
source_title="Letter 221"
