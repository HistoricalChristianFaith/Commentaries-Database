[[commentary]]
quote='''
So then, some one will say, is it not useless for the multitudes of Christians who do not keep all the commandments to keep any of them? In this connexion it is well to remember the blessed Peter, who, though he had done so many good deeds, and had received such great blessings, yet for his one fault was told: “If I wash thee not, thou hast no part with me.” And I need not say that the actual occasion showed no negligence or contempt, but was rather a proof of his reverence and devotion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Preface"
