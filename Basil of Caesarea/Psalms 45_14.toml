[[commentary]]
quote='''
Certain souls, since they have not accepted seeds of false doctrines, follow the spouse of the Lord and because they are following His spouse they will be led to the King. Let those also who have vowed virginity to the Lord hear that virgins will be led to the King, but virgins who are close to the Church, who follow after her, and who do not wander away from the ecclesiastical discipline.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252044.html'
source_title="Homily on Psalm 44"
