[[commentary]]
quote='''
If two yardsticks are compared with each other, their straightness is in agreement. But if a distorted piece of wood is compared with a ruler, the crooked one will be at variance with the straight. Since, therefore, the praise of God is righteous, there is need of a righteous heart, in order that the praise may be fitting and adapted to it. "No one can say 'Jesus is Lord,' except in the Holy Spirit." So how can one offer due praise if one does not have the right spirit in one's heart? HOMILY 15.
'''
source_url=''
source_title="ON PSALM 32"

[[commentary]]
quote='''
I testify to every man who is confessing Christ and denying God, that Christ will profit him nothing; to every man that calls upon God but rejects the Son, that his faith is vain; to every man that sets aside the Spirit, that his faith in the Father and the Son will be useless, for he cannot even hold it without the presence of the Spirit. For he who does not believe the Spirit does not believe in the Son, and he who has not believed in the Son does not believe in the Father. For none "can say that Jesus is the Lord but by the Holy Ghost," and "No man hath seen God at any time, but the only begotten God which is in the bosom of the Father, he hath declared him."

Such an one hath neither part nor lot in the true worship; for it is impossible to worship the Son, save by the Holy Ghost; impossible to call upon the Father, save by the Spirit of adoption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 11"

[[commentary]]
quote='''
It results that, if by your argument you do away with the Spirit, the hosts of the angels are disbanded, the dominions of archangels are destroyed, all is thrown into confusion, and their life loses law, order, and distinctness. For how are angels to cry "Glory to God in the highest" without being empowered by the Spirit? For "No man can say that Jesus is the Lord but by the Holy Ghost, and no man speaking by the Spirit of God calleth Jesus accursed;" as might be said by wicked and hostile spirits, whose fall establishes our statement of the freedom of the will of the invisible powers; being, as they are, in a condition of equipoise between virtue and vice, and on this account needing the succour of the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 16"

[[commentary]]
quote='''
And when, by means of the power that enlightens us, we fix our eyes on the beauty of the image of the invisible God, and through the image are led up to the supreme beauty of the spectacle of the archetype, then, I ween, is with us inseparably the Spirit of knowledge, in Himself bestowing on them that love the vision of the truth the power of beholding the Image, not making the exhibition from without, but in Himself leading on to the full knowledge. "No man knoweth the Father save the Son." And so "no man can say that Jesus is the Lord but by the Holy Ghost." For it is not said through the Spirit, but by the Spirit, and "God is a spirit, and they that worship Him must worship Him in spirit and in truth," as it is written "in thy light shall we see light," namely by the illumination of the Spirit, "the true light which lighteth every man that cometh into the world." It results that in Himself He shows the glory of the Only begotten, and on true worshippers He in Himself bestows the knowledge of God. Thus the way of the knowledge of God lies from One Spirit through the One Son to the One Father, and conversely the natural Goodness and the inherent Holiness and the royal Dignity extend from the Father through the Only-begotten to the Spirit. Thus there is both acknowledgment of the hypostases and the true dogma of the Monarchy is not lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 18"
