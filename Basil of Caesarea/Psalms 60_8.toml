[[commentary]]
quote='''
‘Moab is the pot of my hope.’ Or ‘a pot for washing,’ another of the interpreters says; or ‘a pot of security’; that is to say, the excommunicated man, who has been forbidden with threats to enter the Church of the Lord. For, the Moabite and the Ammonite will not enter until the third and until the tenth generation and until everlasting time. Nevertheless, since baptism possesses remission for sins, and produces security for the debtors, he, showing the deliverance through baptism and the affection for God, says: ‘Moab is a pot for washing,’ or ‘a pot of security.’ Therefore, all ‘foreigners are made subject,’ bowing down under the yoke of Christ; for this reason He will set His shoe in Edom. The shoe of the divinity is the God-bearing flesh, through which He approaches men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252059.html'
source_title="Homily on Psalm 59"
