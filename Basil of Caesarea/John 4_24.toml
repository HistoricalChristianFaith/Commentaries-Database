[[commentary]]
quote='''
Its proper and peculiar title is "Holy Spirit;" which is a name specially appropriate to everything that is incorporeal, purely immaterial, and indivisible. So our Lord, when teaching the woman who thought God to be an object of local worship that the incorporeal is incomprehensible, said "God is a spirit." On our hearing, then, of a spirit, it is impossible to form the idea of a nature circumscribed, subject to change and variation, or at all like the creature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 9"

[[commentary]]
quote='''
And when, by means of the power that enlightens us, we fix our eyes on the beauty of the image of the invisible God, and through the image are led up to the supreme beauty of the spectacle of the archetype, then, I ween, is with us inseparably the Spirit of knowledge, in Himself bestowing on them that love the vision of the truth the power of beholding the Image, not making the exhibition from without, but in Himself leading on to the full knowledge. "No man knoweth the Father save the Son." And so "no man can say that Jesus is the Lord but by the Holy Ghost." For it is not said through the Spirit, but by the Spirit, and "God is a spirit, and they that worship Him must worship Him in spirit and in truth," as it is written "in thy light shall we see light," namely by the illumination of the Spirit, "the true light which lighteth every man that cometh into the world." It results that in Himself He shows the glory of the Only begotten, and on true worshippers He in Himself bestows the knowledge of God. Thus the way of the knowledge of God lies from One Spirit through the One Son to the One Father, and conversely the natural Goodness and the inherent Holiness and the royal Dignity extend from the Father through the Only-begotten to the Spirit. Thus there is both acknowledgment of the hypostases and the true dogma of the Monarchy is not lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 18"

[[commentary]]
quote='''
Another sense may however be given to the phrase, that just as the Father is seen in the Son, so is the Son in the Spirit. The "worship in the Spirit" suggests the idea of the operation of our intelligence being carried on in the light, as may be learned from the words spoken to the woman of Samaria. Deceived as she was by the customs of her country into the belief that worship was local, our Lord, with the object of giving her better instruction, said that worship ought to be offered "in Spirit and in Truth," plainly meaning by the Truth, Himself. As then we speak of the worship offered in the Image of God the Father as worship in the Son, so too do we speak of worship in the Spirit as shewing in Himself the Godhead of the Lord. Wherefore even in our worship the Holy Spirit is inseparable from the Father and the Son. If you remain outside the Spirit you will not be able even to worship at all; and on your becoming in Him you will in no wise be able to dissever Him from God;—any more than you will divorce light from visible objects. For it is impossible to behold the Image of the invisible God except by the enlightenment of the Spirit, and impracticable for him to fix his gaze on the Image to dissever the light from the Image, because the cause of vision is of necessity seen at the same time as the visible objects. Thus fitly and consistently do we behold the "Brightness of the glory" of God by means of the illumination of the Spirit, and by means of the "Express Image" we are led up to Him of whom He is the Express Image and Seal, graven to the like.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 26"
