[[commentary]]
quote='''
Indeed so far was I from being vexed at your letter that it really almost made me laugh to think that when there were, as I thought, so many strong causes already existing to cement our friendship, you should have expressed such very great astonishment at the trifles which have been reported to you. So truly have you suffered the fate of all those who omit to enquire into the nature of circumstances, and give heed to the men who are being discussed; of all who do not examine into the truth, but judge by the distinction of persons, in forgetfulness of the exhortation “Ye shall not respect persons in judgment.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520244.html'
source_title="Letter 244, Section 1"
