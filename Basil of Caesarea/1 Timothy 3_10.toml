[[commentary]]
quote='''
Let him not take to himself the post of Superior, but be chosen by the Superiors in the other brotherhoods, having given in his past life sufficient proof of possessing the requisite character. For it says: “Let these also first be proved, then let them serve as deacons, if they be blameless.” So let a man of such qualifications be entrusted with the post of Superior, and let him arrange the discipline of the brotherhood, assigning work according to the fitness of the individual.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 43"
