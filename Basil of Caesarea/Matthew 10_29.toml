[[commentary]]
quote='''
But our lives are not without a Providence. So we have learnt in the Gospel, for not a sparrow falls to the ground without the will of our Father. Whatever has come to pass has come to pass by the will of our Creator. And who can resist God’s will? Let us accept what has befallen us; for if we take it ill we do not mend the past and we work our own ruin. Do not let us arraign the righteous judgment of God. We are all too untaught to assail His ineffable sentences. The Lord is now making trial of your love for Him. Now there is an opportunity for you, through your patience, to take the martyr’s lot.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25206.html'
source_title="Letter 6, Section 2"
