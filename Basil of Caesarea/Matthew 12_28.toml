[[commentary]]
quote='''
Is He named the right hand of the Father? For “the right hand of the Lord bringeth mighty things to pass;” and “thy right hand, O Lord, hath dashed in pieces the enemy.” But the Holy Ghost is the finger of God, as it is said “if I by the finger of God cast out devils,” of which the version in another Gospel is “if I by the Spirit of God cast out devils.” So the Holy Ghost is of the same nature as the Father and the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 11"
