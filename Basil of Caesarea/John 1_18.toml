[[commentary]]
quote='''
And the following counter question may also be put to them. “No man hath seen God at any time, the Only-begotten which is in the bosom hath declared him.” What of the Father did the Only-begotten Son declare? His essence or His power? If His power, we know so much as He declared to us. If His essence, tell me where He said that His essence was the being unbegotten? When did Abraham worship? Was it not when he believed? And when did he believe? Was it not when he was called? Where in this place is there any testimony in Scripture to Abraham’s comprehending? When did the disciples worship Him? Was it not when they saw creation subject to Him? It was from the obedience of sea and winds to Him that they recognised His Godhead. Therefore the knowledge came from the operations, and the worship from the knowledge. “Believest thou that I am able to do this?” “I believe, Lord;” and he worshipped Him. So worship follows faith, and faith is confirmed by power. But if you say that the believer also knows, he knows from what he believes; and vice versa he believes from what he knows. We know God from His power. We, therefore, believe in Him who is known, and we worship Him who is believed in.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520234.html'
source_title="Letter 234, Section 3"

[[commentary]]
quote='''
I testify to every man who is confessing Christ and denying God, that Christ will profit him nothing; to every man that calls upon God but rejects the Son, that his faith is vain; to every man that sets aside the Spirit, that his faith in the Father and the Son will be useless, for he cannot even hold it without the presence of the Spirit. For he who does not believe the Spirit does not believe in the Son, and he who has not believed in the Son does not believe in the Father. For none "can say that Jesus is the Lord but by the Holy Ghost," and "No man hath seen God at any time, but the only begotten God which is in the bosom of the Father, he hath declared him."

Such an one hath neither part nor lot in the true worship; for it is impossible to worship the Son, save by the Holy Ghost; impossible to call upon the Father, save by the Spirit of adoption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 11"
