[[commentary]]
quote='''
‘The Lord hath heard, and hath had mercy on me: the Lord became my helper.’ After relating what it was that he cried out to God, immediately sensible of the assistance of God, he encourages us to ask for the same things, saying: ‘The Lord hath heard, and hath had mercy on me: the Lord became my helper.’ Let us also pray, therefore, and cry out with a spiritual cry, demanding great things, not seeking after the flesh (‘For they who are carnal cannot please God’), in order that the Lord may hear us, having mercy on our weakness, and that we also, rejoicing in the divine assistance, may say, ‘Thou hast turned for me my mourning into joy.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
