[[commentary]]
quote='''
(in reg. fus. ad inter. 12.) To take then the lowest place at a feast, according to our Lord's command, is becoming to every man, but again to rush contentiously after this is to be condemned as a breach of order and cause of tumult; and a strife raised about it, will place you on a level with those who dispute concerning the highest place. Wherefore, as our Lord here says, it becomes him who makes the feast to arrange the order of sitting down. Thus in patience and love should we mutually bear ourselves, following all things decently according to order, not for external appearance or public display; nor should we seem to study or affect humility by violent contradiction, but rather gain it by condescension or by patience. For resistance or opposition is a far stronger token of pride than taking the first seat at meat, when we obtain it by authority.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Since we have a commandment of the Lord, Who in every place accustoms us to humility, that we should choose the lowest seat when we recline at lunch, the man who strives to do everything according to the commandment must of necessity not fail to observe this order. Should there be visitors from the world at table with us, it is fitting that we should become an example to them in this respect, that they should not be puffed up or seek the pre-eminence. But where all come together with the same object, so that at every opportunity they give a proof of their humility, it is incumbent on each according to the Lord’s commandment to choose the lowest seat; yet to push contentiously to secure it is to be reprobated as destructive of good order and the cause of confusion. And to be unwilling to give way to one another and to struggle for this will make us as bad as those who strive for the pre-eminence. Wherefore in this matter, carefully noting and practising what is fitting, we should leave the order of sitting down in the hands of him to whom it has been entrusted, as the Lord warned us when He said that the ordering of these things pertained to the master of the house. For in so doing we shall bear with one another in love, doing all things decently and in order; and we shall not show by our stubborn and vehement contradiction that we are practising humility to impress the multitude and win popular favour, but rather shall achieve genuine humility by our obedience. For contradiction is a greater proof of pride than occupying a chief seat, when we have taken it in obedience to orders.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 21"
