[[commentary]]
quote='''
The Father did not send the only-begotten Son, the living God, to judge the world but to save the world. True to himself and faithful to the will of the good God his Father, he points to a doctrine whereby we may be made worthy of becoming his disciples with his severe decree. He says, "If any man comes to me and does not hate his father and mother, and his wife and children and brothers and sisters, yes, and his own life also, he cannot be my disciple." This hatred teaches the virtue of piety by withdrawing us from distractions and does not lead us to devise hurtful schemes against one another. "Whoever," says the Lord, "does not carry his cross and come after me, cannot be my disciple." Receiving the baptism of water, we make this same agreement when we promise to be crucified and to die and to be buried with him.
'''
source_url=''
source_title="CONCERNING BAPTISM 1.1"

[[commentary]]
quote='''
You will not love your kinsfolk more than the Lord. “He that loveth,” He says, “father, or mother, or brother, more than me, is not worthy of me.” What is the meaning of the Lord’s commandment? “He that taketh not up his cross and followeth after me, cannot be my disciple?” If, together with Christ, you died to your kinsfolk according to the flesh, why do you wish to live with them again? If for your kinsfolk’s sake you are building up again what you destroyed for Christ’s sake, you make yourself a transgressor. Do not then for your kinsfolk’s sake abandon your place: if you abandon your place, perhaps you will abandon your mode of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 3"
