[[commentary]]
quote='''
It is necessary, therefore, to receive instruction before baptism, having first removed any impediment to learning and so making ourselves fit to receive the instruction. Our Lord Jesus Christ himself confirms this assertion by his example and also by the formal injunction: "So every one of you that does not renounce all that he possesses cannot be my disciple;" and … by the definitive declaration: "He that takes not up his cross daily and follows me is not worthy of me." … And then we are ready for the baptism of water, which is a type of the cross and of death, burial and resurrection from the dead.…Whoever, therefore, is worthy to be baptized in the name of the Holy Spirit and who has been born anew undergoes a change of abode, habits and associates, so that, walking by the Spirit we may merit to be baptized in the name of the Son and to put on Christ.
'''
source_url=''
source_title="CONCERNING BAPTISM"

[[commentary]]
quote='''
(in Cons. Mon. cap. 4.) But He has left His own life for an example of blameless conversation to those who are willing to obey Him; as He says, Come after me, meaning thereby not a following of His body, for that would be impossible to all, since our Lord is in heaven, but a due imitation of His life according to their capacities.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
(in reg. fus. int. 6.) A denial of one's self is indeed a total forgetfulness of things past, and a forsaking of his own will and affection.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
(ubi sup.) Now a desire of suffering death for Christ and a mortification of one's members which are upon the earth, and a manful resolution to undergo any danger for Christ, and an indifference towards the present life, this it is to take up one's cross. Hence it is added, And let him take up his cross daily.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
(ubi sup. lnt. 8.) Herein then stands a man's perfection, that he should have his affections hardened, even towards life itself, and have ever about him the answer (ἀποκρίμα.) of death a, that he should by no means trust in himself. (2 Cor. 1:9.) But perfection takes its beginning from the relinquishment of things foreign to it; suppose these to be possessions or vain-glory, or affection for things that profit not.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Accordingly our first step is to seek a retired habitation, lest through eyes or ears we receive incitements to sin and imperceptibly become accustomed to it, and impressions and forms of things seen or heard abide in the soul causing destruction and loss; and in order that we may be able to continue in prayer. For thus we should overcome previously formed habits, in which we lived alienated from the commandments of Christ—this entails no small struggle, to overcome one’s accustomed mode of life, for habit strengthened by lapse of time gains the strength of nature—and we shall be able to rub out the stains of sin by toiling in prayer and assiduous meditation upon the will of God; to which meditation and prayer it is impossible to attain in a crowd, which distracts the soul and introduces worldly cares. Who ever in a crowd could fulfil the precept: “If any man would come after me, let him deny himself”? For we must deny ourselves and take up the Cross of Christ, and thus follow Him.

But to deny oneself means complete forgetfulness of the past and retirement from one’s own will, in which it is very hard, almost impossible, for a man to succeed when he lives in promiscuous intercourse. Indeed mixing in such a life impedes even the taking of one’s cross and following Christ. For preparedness to die on Christ’s behalf, and the mortification of one’s members that are upon the earth, and to stand in battle array to meet every danger that comes upon us for the name of Christ, and to be indifferent towards this present life—this is to take up one’s cross; the obstacles put in the way of which by the intercourse of common life we see to be great.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 6"
