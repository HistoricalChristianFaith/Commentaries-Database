[[commentary]]
quote='''
“Let them be for days” says Scripture, not to produce them but to rule them; because day and night are older than the creation of the luminaries and it is this that the psalm declares to us. “The sun to rule by day…the moon and stars to rule by night.” How does the sun rule by day? Because carrying everywhere light with it, it is no sooner risen above the horizon than it drives away darkness and brings us day. Thus we might, without self deception, define day as air lighted by the sun, or as the space of time that the sun passes in our hemisphere.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25206-The%2520Creation%2520of%2520Luminous%2520Bodies.html'
source_title="The Hexaemeron, Homily 6: The Creation of Luminous Bodies"
