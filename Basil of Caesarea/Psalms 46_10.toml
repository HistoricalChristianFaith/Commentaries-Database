[[commentary]]
quote='''
‘Be still and see that I am God.’ As far as we are engaged in affairs outside of God, we are not able to make progress in the knowledge of God. Who, anxious about the things of the world and sunk deep in the distractions of the flesh, can be intent on the words of God and be sufficiently accurate in such mighty objects of contemplation? Do you not see that the word which fell among the thorns is choked by the thorns? The thorns are the pleasures of the flesh and wealth and glory and the cares of life. He who desires the knowledge of God will have to be outside of all these things, and being freed from his passions, thus to receive the knowledge of God. For, how could the thought of God enter into a soul choked by considerations which preoccupied it? Even Pharao knew that it was proper for one to seek God when he was unoccupied, and for this reason he reproached Israel: ‘You are unoccupied, you are idle, and you say, “We shall offer prayers to the Lord, our God.”’ Now, leisure itself is good and useful to him who is unoccupied, since it produces quiet for the acquisition of salutary doctrines. But, the leisure of the Athenians was evil, ‘who used to spend all their leisure telling or listening to something new.’ Even at the present time some imitate this, misusing the leisure of life for the discovery of some newer teaching. Such leisure is dear to unclean and wicked spirits. ‘When the unclean spirit,’ it is said, ‘has gone out of a man, he says, “I will return to my house which I left.” And when he has come, he finds the place unoccupied and swept.’ May it not be that we make our leisure a time for the adversary to enter, but let us occupy our house within, causing Christ to dwell in us beforehand through the Spirit. At all events, after giving peace to those who were up to this time troubled by the enemies, then he says, ‘Have nothing to do with the enemies disturbing you, in order that in silence you may contemplate the words of truth.’ For this reason also the Lord says: ‘Everyone who does not renounce all that he possesses, cannot be my disciple.’ It is necessary, then, to be free from the works of marriage, in order that we may have leisure for prayer; to be unoccupied with the pursuit of wealth, with the desire for this little glory, with the lust for pleasure, with envy and every form of wickedness against our neighbor, in order that, after our soul has found peace and is disturbed by no passion, the illumination of God, as if in a mirror, may become clear and unobscured.

‘I will be exalted among the nations, and I will be exalted in the earth.’ Clearly the Lord says these words concerning His own Passion, just as it has been written in the Gospel: ‘And I, if I be lifted up, will draw all to myself.’ ‘And as Moses lifted up the serpent in the desert, even so must the Son of Man be lifted up’ upon the earth. Since, then, for the sake of the nations He was to be lifted up on the cross and for the sake of all the earth to accept that elevation, therefore, He says: ‘I will be exalted among the nations, and I will be exalted in the earth.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"
