[[commentary]]
quote='''
‘Hearken, O daughter, and see, and incline thy ear: and forget thy people and thy father’s house. And the king shall greatly desire thy beauty, for he is thy Lord, and him they shall adore.’ He summons the Church to hear and observe the precepts and, addressing her as daughter, associates her with himself through this title, as if he had adopted her through love. ‘Hearken, O daughter, and see.’ He teaches that she has a mind trained to contemplation through the word, ‘see.’ Observe well, he says, the creation, and, aided by the order in it, thus ascend to the contemplation of the Creator. Then bending her lofty and proud neck, he says: ‘Incline thy ear.’ Do not run away to stories from the outside, but accept the humble voice in the evangelical account. ‘Incline thy ear’ to this teaching in order that you may forget those depraved customs and the lessons of your fathers. Therefore, ‘forget thy people and thy father’s house.’ For, everyone ‘who commits sin is of the devil.’ Cast out, I pray you, he says, the teachings of the evil spirits, forget sacrifices, nocturnal dances, tales which inflame to fornication and to every form of licentiousness. For this reason have I called you my own daughter, that you may hate the parent who previously begot you for destruction. If through such forgetfulness you erase the blemishes of your depraved learning, assuming your own proper beauty, you will appear desirable to your Spouse and King. ‘Because he is thy Lord, and him they shall adore.’ He intimates the need of submission by the expression: ‘He is thy Lord. Him they shall adore,’ that is, every creature. Therefore, ‘at the name of Jesus Christ every knee shall bend of those in heaven, on earth and under the earth.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252044.html'
source_title="Homily on Psalm 44"
