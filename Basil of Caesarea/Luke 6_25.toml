[[commentary]]
quote='''
(Reg. fus. tract. 16-19.) Now it is plain that the rule of abstinence is necessary, because the Apostle mentions it among the fruits of the Spirit. (Gal. 5:23.) For the subjection of the body is by nothing so obtained as by abstinence, whereby, as it were a bridle, it becomes us to keep in check the fervour of youth. Abstinence then is the putting to death of sin, the extirpation of passions, the beginning of the spiritual life, blunting in itself the sting of temptations. But lest there should be any agreement with the enemies of God, we must accept every thing as the occasion requires, to show, that to the pure all things are pure (Tit. 1:15.), by coming indeed to the necessaries of life, but abstaining altogether from those which conduce to pleasure. But since it is not possible that all should keep the same hours, or the same manner, or the same proportion, still let there be one purpose, never to wait to be filled, for fulness of stomach makes the body itself also unfit for its proper functions, sleepy, and inclined to what is hurtful.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
(ut sup.) Whereas the Lord reproves those who laugh now, it is plain that there will never be a house of laughter to the faithful, especially since there is so great a multitude of those who die in sin for whom we must mourn. Excessive laughter is a sign of want of moderation, and the motion of an unrestrained spirit; but ever to express the feelings of our heart with a pleasantness of countenance is not unseemly.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
This, neglected by most people, deserves no small watchfulness on the part of ascetics. For to be overcome by incontinent and immoderate laughter is a mark of incontinence and shows that a man has not his emotions under control, and does not suppress the frivolity of his soul by a strict rule. It is not unseemly to reveal merriment to the extent of a cheerful smile, though only so far as Scripture allows when it says: “When the heart is merry the face rejoices”; but to shout with loud laughter, and allow the body to shake involuntarily, does not befit one who has his soul under control, or is of proved virtue, or has command of himself. This sort of laughter also Ecclesiastes reprobates, as specially subversive of the stability of the soul—“I said of laughter, it is error.” And, “as the noise of thorns under the pot, so is the laughter of fools.” And the Lord seems to have experienced the necessary affections of the flesh and whatever emotions testify to virtue, such as weariness on the one hand and compassion for the afflicted on the other; but never to have made use of laughter, so far as we may judge from the narrative of the gospels. Rather He pronounced those who are controlled by it to be unhappy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 17"

[[commentary]]
quote='''
It is impossible therefore to fix the same hour for taking food, or the same manner or measure; but let the satisfying of the need be the aim in each case. For to have the stomach full to excess, and weighed down with food, entails a curse, since the Lord said: “Woe unto you, ye that are full now”; and renders the body itself useless for activities, prone to slumber, and exposed to injuries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 19"
