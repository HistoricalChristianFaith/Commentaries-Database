[[commentary]]
quote='''
And in that, through the straight way of His commandments, He leads men to good actions, and again because He safely shuts in all who through faith in Him betake themselves for shelter to the blessing of the higher wisdom, He is a Door. So He says, "By me if any man enter in, . . . he shall go in and out and shall find pasture." Again, because to the faithful He is a defence strong, unshaken, and harder to break than any bulwark, He is a Rock. Among these titles, it is when He is styled Door, or Way, that the phrase "through Him" is very appropriate and plain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
