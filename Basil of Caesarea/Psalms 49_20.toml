[[commentary]]
quote='''
‘Man when he was in honor did not understand: he hath been compared to senseless beasts, and made like to them.’ An abominable statement! Man? He who is ‘a little lower than the angels,’ concerning whom Solomon says: ‘Man is a great thing, and pitiful man is something honorable’? He, because he did not perceive his own dignity but bowed down to the passions of the flesh, ‘hath been compared to senseless beasts, and made like to them.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
