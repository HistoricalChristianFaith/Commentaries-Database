[[commentary]]
quote='''
He who puts his trust in himself or in the man who has been entrusted with the charge of his needs, and considers his own work or that of his comrade a sufficient basis for his living, inasmuch as he has set his hope on man, is in danger of incurring the curse which says: “Cursed is the man that putteth his hope in man and will stablish the flesh of his arm, and his heart would depart from the Lord.” The Scripture by “who putteth his hope in man” forbids, that is, putting trust in another, and by “will stablish the arm of his flesh” forbids self-confidence. Each of these it calls apostasy from the Lord and it adds the doom of both that “He shall be as the heath in the desert, and shall not see when good cometh.” So Scripture shows that to put trust in one’s self or any one else is to apostatise from the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 42"
