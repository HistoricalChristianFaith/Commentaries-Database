[[commentary]]
quote='''
It is the custom of Scripture to call firmament all that is strong and unyielding. It even uses the word to denote the condensation of the air: He, it says, who strengthens the thunder. Scripture means by the strengthening of the thunder, the strength and resistance of the wind, which, enclosed in the hollows of the clouds, produces the noise of thunder when it breaks through with violence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25203-On%2520the%2520Firmament.html'
source_title="The Hexaemeron, Homily 3: On the Firmament"
