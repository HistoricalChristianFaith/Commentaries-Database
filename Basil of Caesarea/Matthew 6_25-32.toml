[[commentary]]
quote='''
You should know this, that he who works should do so, not to minister to his own needs by his works but to fulfil the commandment of the Lord Who said: “I was an hungred and ye gave me meat, etc.” For to be anxious for one’s self is absolutely forbidden by the Lord, when He says: “Be not anxious for your life, what ye shall eat, nor yet for your body, what ye shall put on,” and added: “For after all these things do the Gentiles seek.” Each therefore should put before himself as the aim in his work the service of those in want, not his own need. For thus he will both escape the charge of self-love and will receive the blessing bestowed on love of the brethren by the Lord—“Inasmuch as ye did it unto one of these my brethren, even these least, ye did it unto me.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 42"
