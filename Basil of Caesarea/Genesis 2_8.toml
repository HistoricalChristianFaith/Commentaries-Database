[[commentary]]
quote='''
One form of this silence is the obscurity employed in Scripture, which makes the meaning of "dogmas" difficult to be understood for the very advantage of the reader: Thus we all look to the East at our prayers, but few of us know that we are seeking our own old country, Paradise, which God planted in Eden in the East.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 27"
