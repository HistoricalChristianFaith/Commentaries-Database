[[commentary]]
quote='''
But whatever is cunningly contrived and can be dispensed with, and causes much trouble, and as it were turns our whole life into one long providing for the flesh, is to be shunned by Christians; and we must take care so to use the art of medicine, if need arise, as not to assign to it the whole cause of health or sickness, but to accept the use of its remedies as designed for the glory of God and a type of the care of souls. But when we are deprived of medical assistance, let us not put all our hope for the alleviation of our ills in this art, but know that either He will not allow us to be tempted above what we are able to bear, or just as the Lord in those days now made clay and anointed and bid wash in Siloam, and now was content with the mere command, saying, I will, be thou clean, whereas He left some to contend against afflictions, making them better tested as a result of their trial, so now it is in our case. At one time He touches unseen and secretly when He knows this to be expedient for our souls, at another time He thinks fit to use material help for our diseases, making the remembrance of His grace more lasting by postponing the cure, or, as I said, giving us a type of the care of the soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 55"
