[[commentary]]
quote='''
Joy and spiritual gladness are taken away. Our feasts are turned into mourning. Our houses of prayer are shut. The altars of the spiritual service are lying idle. Christians no longer assemble together; teachers no longer preside. The doctrines of salvation are no longer taught. We have no more solemn assemblies, no more evening hymns, no more of that blessed joy of souls which arises in the souls of all that believe in the Lord at communions, and the imparting of spiritual boons. We may well say, “Neither is there at this time prince, or prophet, or reader, or offering, or incense, or place to sacrifice before thee, and to find mercy.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520243.html'
source_title="Letter 243, Section 2"
