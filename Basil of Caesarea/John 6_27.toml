[[commentary]]
quote='''
Now, to omit all proof of the ignorance of those who predicate place of incorporeal things, what excuse can be found for their attack upon Scripture, shameless as their antagonism is, in the passages "Sit thou on my right hand" and "Sat down on the right hand of the majesty of God"? The expression "right hand" does not, as they contend, indicate the lower place, but equality of relation; it is not understood physically, in which case there might be something sinister about God, but Scripture puts before us the magnificence of the dignity of the Son by the use of dignified language indicating the seat of honour. It is left then for our opponents to allege that this expression signifies inferiority of rank. Let them learn that "Christ is the power of God and wisdom of God," and that "He is the image of the invisible God" and "brightness of his glory," and that "Him hath God the Father sealed," by engraving Himself on Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 6"
