[[commentary]]
quote='''
“Let the waters bring forth.” What necessary object was there that did not immediately appear? What object of luxury was not given to man? Some to supply his needs, some to make him contemplate the marvels of creation. Some are terrible, so as to take our idleness to school. “God created great whales.” Scripture gives them the name of “great” not because they are greater than a shrimp and a sprat, but because the size of their bodies equals that of great hills. Thus when they swim on the surface of the waters one often sees them appear like islands. But these monstrous creatures do not frequent our coasts and shores; they inhabit the Atlantic ocean. Such are these animals created to strike us with terror and awe. If now you hear say that the greatest vessels, sailing with full sails, are easily stopped by a very small fish, by the remora, and so forcibly that the ship remains motionless for a long time, as if it had taken root in the middle of the sea, do you not see in this little creature a like proof of the power of the Creator? Sword fish, saw fish, dog fish, whales, and sharks, are not therefore the only things to be dreaded; we have to fear no less the spike of the stingray even after its death, and the sea-hare, whose mortal blows are as rapid as they are inevitable. Thus the Creator wishes that all may keep you awake, so that full of hope in Him you may avoid the evils with which all these creatures threaten you.

But let us come out of the depths of the sea and take refuge upon the shore. For the marvels of creation, coming one after the other in constant succession like the waves, have submerged my discourse. However, I should not be surprised if, after finding greater wonders upon the earth, my spirit seeks like Jonah’s to flee to the sea. But it seems to me, that meeting with these innumerable marvels has made me forget all measure, and experience the fate of those who navigate the high seas without a fixed point to mark their progress, and are often ignorant of the space which they have traversed. This is what has happened to me; whilst my words glanced at creation, I have not been sensible of the multitude of beings of which I spoke to you. But although this honourable assembly is pleased by my speech, and the recital of the marvels of the Master is grateful to the ears of His servants, let me here bring the ship of my discourse to anchor, and await the day to deliver you the rest. Let us, therefore, all arise, and, giving thanks for what has been said, let us ask for strength to hear the rest. Whilst taking your food may the conversation at your table turn upon what has occupied us this morning and this evening. Filled with these thoughts may you, even in sleep, enjoy the pleasure of the day, so that you may be permitted to say, “I sleep but my heart waketh,” meditating day and night upon the law of the Lord, to Whom be glory and power world without end. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25207-The%2520Creation%2520of%2520Moving%2520Creatures.html'
source_title="The Hexaemeron, Homily 7: The Creation of Moving Creatures"

[[commentary]]
quote='''
There are also innumerable kinds of birds. If we review them all, as we have partly done the fish, we shall find that under one name, the creatures which fly differ infinitely in size, form and colour; that in their life, their actions and their manners, they present a variety equally beyond the power of description. Thus some have tried to imagine names for them of which the singularity and the strangeness might, like brands, mark the distinctive character of each kind known. Some, as eagles, have been called Schizoptera, others Dermoptera, as the bats, others Ptilota, as wasps, others Coleoptera, as beetles and all those insects which brought forth in cases and coverings, break their prison to fly away in liberty. But we have enough words of common usage to characterise each species and to mark the distinction which Scripture sets up between clean and unclean birds. Thus the species of carnivora is of one sort and of one constitution which suits their manner of living, sharp talons, curved beak, swift wings, allowing them to swoop easily upon their prey and to tear it up after having seized it. The constitution of those who pick up seeds is different, and again that of those who live on all they come across. What a variety in all these creatures! Some are gregarious, except the birds of prey who know no other society than conjugal union; but innumerable kinds, doves, cranes, starlings, jackdaws, like a common life. Among them some live without a chief and in a sort of independence; others, as cranes, do not refuse to submit themselves to a leader. And a fresh difference between them is that some are stationary and non-migratory; others undertake long voyages and the greater part of them, migrate at the approach of winter. Nearly all birds can be tamed and are capable of training, except the weakest, who through fear and timidity cannot bear the constant and annoying contact of the hand. Some like the society of man and inhabit our dwellings; others delight in mountains and in desert places. There is a great difference too in their peculiar notes. Some twitter and chatter, others are silent, some have a melodious and sonorous voice, some are wholly inharmonious and incapable of song; some imitate the voice of man, taught their mimicry either by nature or training; others always give forth the same monotonous cry. The cock is proud; the peacock is vain of his beauty; doves and fowls are amorous, always seeking each other’s society. The partridge is deceitful and jealous, lending perfidious help to the huntsmen to seize their prey.

What a variety, I have said, in the actions and lives of flying creatures! Some of these unreasoning creatures even have a government, if the feature of government is to make the activity of all the individuals centre in one common end. This may be observed in bees. They have a common dwelling place; they fly in the air together, they work at the same work together; and what is still more extraordinary is that they give themselves to these labours under the guidance of a king and superintendent, and that they do not allow themselves to fly to the meadows without seeing if the king is flying at their head. As to this king, it is not election that gives him this authority; ignorance on the part of the people often puts the worst man in power; it is not fate; the blind decisions of fate often give authority to the most unworthy. It is not heredity that places him on the throne; it is only too common to see the children of kings, corrupted by luxury and flattery, living in ignorance of all virtue. It is nature which makes the king of the bees, for nature gives him superior size, beauty, and sweetness of character. He has a sting like the others, but he does not use it to revenge himself. It is a principle of natural and unwritten law, that those who are raised to high office, ought to be lenient in punishing. Even bees who do not follow the example of their king, repent without delay of their imprudence, since they lose their lives with their sting. Listen, Christians, you to whom it is forbidden to “recompense evil for evil” and commanded “to overcome evil with good.” Take the bee for your model, which constructs its cells without injuring any one and without interfering with the goods of others. It gathers openly wax from the flowers with its mouth, drawing in the honey scattered over them like dew, and injects it into the hollow of its cells. Thus at first honey is liquid; time thickens it and gives it its sweetness. The book of Proverbs has given the bee the most honourable and the best praise by calling her wise and industrious. How much activity she exerts in gathering this precious nourishment, by which both kings and men of low degree are brought to health! How great is the art and cunning she displays in the construction of the store houses which are destined to receive the honey! After having spread the wax like a thin membrane, she distributes it in contiguous compartments which, weak though they are, by their number and by their mass, sustain the whole edifice. Each cell in fact holds to the one next to it, and is separated by a thin partition; we thus see two or three galleries of cells built one upon the other. The bee takes care not to make one vast cavity, for fear it might break under the weight of the liquid, and allow it to escape. See how the discoveries of geometry are mere by-works to the wise bee!

The rows of honey-comb are all hexagonal with equal sides. They do not bear on each other in straight lines, lest the supports should press on empty spaces between and give way; but the angles of the lower hexagons serve as foundations and bases to those which rise above, so as to furnish a sure support to the lower mass, and so that each cell may securely keep the liquid honey.

How shall we make an exact review of all the peculiarities of the life of birds? During the night cranes keep watch in turn; some sleep, others make the rounds and procure a quiet slumber for their companions. After having finished his duty, the sentry utters a cry, and goes to sleep, and the one who awakes, in his turn, repays the security which he has enjoyed. You will see the same order reign in their flight. One leads the way, and when it has guided the flight of the flock for a certain time, it passes to the rear, leaving to the one who comes after the care of directing the march.

The conduct of storks comes very near intelligent reason. In these regions the same season sees them all migrate. They all start at one given signal. And it seems to me that our crows, serving them as escort, go to bring them back, and to help them against the attacks of hostile birds. The proof is that in this season not a single crow appears, and that they return with wounds, evident marks of the help and of the assistance that they have lent. Who has explained to them the laws of hospitality? Who has threatened them with the penalties of desertion? For not one is missing from the company. Listen, all inhospitable hearts, ye who shut your doors, whose house is never open either in the winter or in the night to travellers. The solicitude of storks for their old would be sufficient, if our children would reflect upon it, to make them love their parents; because there is no one so failing in good sense, as not to deem it a shame to be surpassed in virtue by birds devoid of reason. The storks surround their father, when old age makes his feathers drop off, warm him with their wings, and provide abundantly for his support, and even in their flight they help him as much as they are able, raising him gently on each side upon their wings, a conduct so notorious that it has given to gratitude the name of “antipelargosis.” Let no one lament poverty; let not the man whose house is bare despair of his life, when he considers the industry of the swallow. To build her nest, she brings bits of straw in her beak; and, as she cannot raise the mud in her claws, she moistens the end of her wings in water and then rolls in very fine dust and thus procures mud. After having united, little by little, the bits of straw with this mud, as with glue, she feeds her young; and if any one of them has its eyes injured, she has a natural remedy to heal the sight of her little ones.

This sight ought to warn you not to take to evil ways on account of poverty; and, even if you are reduced to the last extremity, not to lose all hope; not to abandon yourself to inaction and idleness, but to have recourse to God. If He is so bountiful to the swallow, what will He not do for those who call upon Him with all their heart?

The halcyon is a sea bird, which lays its eggs along the shore, or deposits them in the sand. And it lays in the middle of winter, when the violence of the winds dashes the sea against the land. Yet all winds are hushed, and the wave of the sea grows calm, during the seven days that the halcyon sits.

For it only takes seven days to hatch the young. Then, as they are in need of food so that they may grow, God, in His munificence, grants another seven days to this tiny animal. All sailors know this, and call these days halcyon days. If divine Providence has established these marvellous laws in favour of creatures devoid of reason, it is to induce you to ask for your salvation from God. Is there a wonder which He will not perform for you—you have been made in His image, when for so little a bird, the great, the fearful sea is held in check and is commanded in the midst of winter to be calm.

It is said that the turtle-dove, once separated from her mate, does not contract a new union, but remains in widowhood, in remembrance of her first alliance. Listen, O women! What veneration for widowhood, even in these creatures devoid of reason, how they prefer it to an unbecoming multiplicity of marriages. The eagle shows the greatest injustice in the education which she gives to her young. When she has hatched two little ones, she throws one on the ground, thrusting it out with blows from her wings, and only acknowledges the remaining one. It is the difficulty of finding food which has made her repulse the offspring she has brought forth. But the osprey, it is said, will not allow it to perish, she carries it away and brings it up with her young ones. Such are parents who, under the plea of poverty, expose their children; such are again those who, in the distribution of their inheritance, make unequal divisions. Since they have given existence equally to each of their children, it is just that they should equally and without preference furnish them with the means of livelihood. Beware of imitating the cruelty of birds with hooked talons. When they see their young are from henceforth capable of encountering the air in their flight, they throw them out of the nest, striking them and pushing them with their wings, and do not take the least care of them. The love of the crow for its young is laudable! When they begin to fly, she follows them, gives them food, and for a very long time provides for their nourishment. Many birds have no need of union with males to conceive. But their eggs are unfruitful, except those of vultures, who more often, it is said, bring forth without coupling: and this although they have a very long life, which often reaches its hundredth year. Note and retain, I pray you, this point in the history of birds; and if ever you see any one laugh at our mystery, as if it were impossible and contrary to nature that a virgin should become a mother without losing the purity of her virginity, bethink you that He who would save the faithful by the foolishness of preaching, has given us beforehand in nature a thousand reasons for believing in the marvellous.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25208-The%2520Creation%2520of%2520Fowl%2520and%2520Water%2520Animals.html'
source_title="The Hexaemeron, Homily 8: The Creation of Fowl and Water Animals"

[[commentary]]
quote='''
There are some kinds of birds which live by night in the midst of darkness; others which fly by day in full light. Bats, owls, night-ravens are birds of night: if by chance you cannot sleep, reflect on these nocturnal birds and their peculiarities and glorify their Maker. How is it that the nightingale is always awake when sitting on her eggs, passing the night in a continual melody? How is it that one animal, the bat, is at the same time quadruped and fowl? That it is the only one of the birds to have teeth? That it is viviparous like quadrupeds, and traverses the air, raising itself not upon wings, but upon a kind of membrane? What natural love bats have for each other! How they interlace like a chain and hang the one upon the other! A very rare spectacle among men, who for the greater part prefer individual and private life to the union of common life. Have not those who give themselves up to vain science the eyes of owls? The sight of the owl, piercing during the night time, is dazzled by the splendour of the sun; thus the intelligence of these men, so keen to contemplate vanities, is blind in presence of the true light.

During the day, also, how easy it is for you to admire the Creator everywhere! See how the domestic cock calls you to work with his shrill cry, and how, forerunner of the sun, and early as the traveller, he sends forth labourers to the harvest! What vigilance in geese! With what sagacity they divine secret dangers! Did they not once upon a time save the imperial city? When enemies were advancing by subterranean passages to possess themselves of the capitol of Rome, did not geese announce the danger? Is there any kind of bird whose nature offers nothing for our admiration? Who announces to the vultures that there will be carnage when men march in battle array against one another? You may see flocks of vultures following armies and calculating the result of warlike preparations; a calculation very nearly approaching to human reasoning. How can I describe to you the fearful invasions of locusts, which rise everywhere at a given signal, and pitch their camps all over a country? They do not attack crops until they have received the divine command. Or shall I describe how the remedy for this curse, the thrush, follows them with its insatiable appetite, and the devouring nature that the loving God has given it in His kindness for men? How does the grasshopper modulate its song? Why is it more melodious at midday owing to the air that it breathes in dilating its chest?

But it appears to me that in wishing to describe the marvels of winged creatures, I remain further behind than I should if my feet had tried to match the rapidity of their flight. When you see bees, wasps, in short all those flying creatures called insects, because they have an incision all around, reflect that they have neither respiration nor lungs, and that they are supported by air through all parts of their bodies. Thus they perish, if they are covered with oil, because it stops up their pores. Wash them with vinegar, the pores reopen and the animal returns to life. Our God has created nothing unnecessarily and has omitted nothing that is necessary. If now you cast your eyes upon aquatic creatures, you will find that their organization is quite different. Their feet are not split like those of the crow, nor hooked like those of the carnivora, but large and membraneous; therefore they can easily swim, pushing the water with the membranes of their feet as with oars. Notice how the swan plunges his neck into the depths of the water to draw his food from it, and you will understand the wisdom of the Creator in giving this creature a neck longer than his feet, so that he may throw it like a line, and take the food hidden at the bottom of the water.
'''
