[[commentary]]
quote='''
And, in short, I perceive three different dispositions which by inevitable necessity lead us to obey. Either through fear of punishment we turn away from that which is evil, and so are of a slavish disposition; or, seeking to profit by the reward, we fulfil the commandments for the sake of our own benefit, and are accordingly like hirelings; or else we do good for the sake of the good itself and from love of Him Who gave us the law, rejoicing that we are thus thought worthy to serve the glorious and great God, and so we have the disposition of sons. Nor will he who keeps the commandments from fear, and is always expecting the penalty of sloth, obey some orders and neglect others, but he will dread as equally terrible the judgment which comes upon every disobedience. Accordingly he is pronounced blessed who fears always with reverence. And he stands firm in the truth, for he can say: “I have seen God always before me, for he is on my right hand lest I should be shaken,” as never choosing to neglect anything that is right. Again, “Blessed is the man that feareth the Lord.” Why? Because “he will delight greatly in his commandments.” Wherefore it is not possible for those who fear to neglect any of God’s orders, or to perform them carelessly. Nor indeed will the hireling choose to transgress any of the commandments. For how will he win the reward of his labour in the vineyard, if he does not fulfil all he agreed to do? For if he come short in even one thing that is needful, he makes himself useless to his master. And who will pay a reward, so long as the damage remains, to him that has done the harm?

The third service is that of love. What son, seeking to please his father, and satisfying him in great things, will choose to grieve him in small matters? He will be all the more careful as he remembers the apostle’s words: “Grieve not the Holy Spirit of God, in Whom ye were sealed.”

In what category do those who transgress most of the commandments deserve to be classed? They neither serve God as Father, nor believe in Him as the promiser of great things, nor serve him as Master. “If I, then, be a father,” He says, “where is mine honour? and if I be a master, where is my fear?” For “he that feareth the Lord will delight greatly in his commandments.” But “through thy transgression of the law,” it says, “thou dishonourest God.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Preface"
