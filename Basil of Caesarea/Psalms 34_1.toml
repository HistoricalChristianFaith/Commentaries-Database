[[commentary]]
quote='''
The subject of the psalm draws us to two premises. Both the actions of David in Nobe, the city of the priests, and those in Geth at the home of Achis, the king of the foreign nations, seem to be in agreement with the inscription. For, he changed his countenance when he conversed with Abimelech, the priest, concealing his flight and pretending to be zealous to perform the royal command and, then, took the loaves of proposition and the sword of Goliath. Moreover, he also changed his countenance when, seized in the midst of the enemy, he perceived that they were conversing with each other and preparing for vengeance. Scripture says: ‘The servants of Achis said to each other: Is not this David the king of the land? Did they not sing to him in their dances, saying: David has slain his tens of thousands, and Saul his thousands? And David,’ it says, ‘was exceedingly afraid at the face of Achis, and he changed his countenance before them.’

Now, how is it that the inscription names Abimelech, but history mentions Achis, as king of the Gethites? We have some such reason as this that comes to us from tradition, namely that the kings of the foreign peoples had the common name Abimelech, but besides that, each was called by his own name. It is possible to see this in the case of the Roman empire, the Augustuses were also commonly called Caesars, but they still kept their own personal names. The name Pharaoh is of the same kind among the Egyptians. He appears to have been called Pharaoh who ruled in the time of Joseph; and there was a Pharaoh who was established as king of Egypt in the time of Moses, four generations later; and a Pharaoh, during the time of Solomon: ‘For, he took,’ it says, ‘the daughter of Pharaoh.’ Moreover, he who ruled during the time of the prophecy of Jeremia was called Pharaoh. So, too, there was an Abimelech during the time of Abraham: ‘And Abimelech and Hochozath, the leader of his bride, and Philoch the general of his army, speaking, said to Abraham.’ And again, concerning Isaac: ‘And when very many days were passed, and he abode there, Abimelech king of the Philistines looking out through a window, saw Isaac playing with Rebecca.’ In the same way, therefore, here also in the time of David the common title of the kingly office, Abimelech, is used in the inscription. But, the name was handed down in history as Achis, which was given to him personally from birth.

In the presence of this man, therefore, he changed his countenance, carried along between the hands of the servants, knocking against the gates of the city and driveling his spittle upon his beard, so that Achis said to his servants: ‘Why have you brought him to me? Am I in need of madmen, that you have brought in this fellow to play the madman in my presence?’ Having caused himself to be dismissed from there by these means, he came safely through, Scripture says, to the cave of Odollam.

Then, because he had been delivered from great danger, he sent up this prayer of thanksgiving to God who had rescued him. ‘I will bless the Lord at all times.’ Having escaped death, as if he were setting up norms for his life, he molded his soul to an exact manner of living, so that he ceased at no time from praise, but referred the beginning of affairs, great and small, to God. ‘I will not think,’ he says, ‘that anything was done through my own diligence nor happened through spontaneous chance but, “I will bless the Lord at all times,” not only in prosperity of life, but also in precarious times.’ The Apostle, learning from this, says: ‘Rejoice always. Pray without ceasing. In all things give thanks.’ Do you not see how great was the love of the man? He did not cease through impatience at the continuous succession of evils, when he was not only driven out of his country, away from his relatives, friends, and possessions, but also when he was handed over to the enemy by force and was on the point of being torn to pieces by them. He did not say: ‘How long will these continuous evils last?’ He did not cease through impatience at the long stretch of tribulations, knowing ‘that tribulation works out endurance, and endurance tried virtue, and tried virtue hope.’ In truth, tribulations are, for those well prepared, like certain foods and exercises for athletes which lead the contestant on to the hereditary glory, if, when we are reviled, we bless; maligned, we entreat; ill-treated, we give thanks; afflicted, we glory in our afflictions. It is indeed shameful for us to bless on propitious occasions, but to be silent on dark and difficult ones. On the contrary, we must bless even more at that time, knowing that ‘whom the Lord loves, he chastises; and he scourges every son whom he receives.’

‘His praise shall be always in my mouth.’ The prophet seems to promise something impossible. For, how can the praise of God be always in the mouth of man? When he engages in the ordinary conversations pertaining to daily life, he does not have the praise of God in his mouth. When he sleeps, he will keep absolute silence. And how will the mouth of one who is eating and drinking produce praise? We answer to this that there is a certain spiritual mouth of the interior man by which he is fed when he partakes of the word of life, which is the bread that comes down from heaven. Concerning that mouth the prophet also says: ‘I opened my mouth and panted.’ The Lord even urges us to have it open wide so as to receive plentifully the food of truth. ‘Open thy mouth wide,’ He says, ‘and I will fill it.’ The thought of God, therefore, having been once for all molded and, as it were, sealed in the authoritative part of the soul, can be called praise of God, since it is always present in the soul. Moreover, according to the counsel of the Apostle, the zealous man can do all things for the glory of God, so that every act and every word and every work has in it power of praise. Whether the just man eats or drinks, he does all for the glory of God. The heart of such a one watches when he is sleeping, according to him who said in the Canticle of Canticles: ‘I sleep, and my heart watcheth.’ For, on many occasions the visions seen during sleep are images of our thoughts by day.
'''
