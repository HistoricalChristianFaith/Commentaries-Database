[[commentary]]
quote='''
‘But the countenance of the Lord is against them that do evil things: to cut off the remembrance of them from the earth.’ By the countenance I think is meant the open and manifest coming of the Lord in the judgment. Therefore, the eyes of the Lord, as of one still observing us from afar, are said to look upon the just man; but, the countenance itself, it is said, will appear for the purpose of wiping out entirely from the earth all remembrance of wickedness. Do not think, I beg of you, that the countenance of God is molded in bodily form, since in that case the words of Scripture will seem to be unreasonable, and there will seem to be eyes by themselves which shine upon the just, and again the countenance by itself which threatens the wicked. And yet, the eyes are neither apart from the countenance, nor is the countenance bereft of eyes. Now, ‘No man shall see the face of the Lord and live,’ but, ‘the angels’ of the little ones in the Church ‘always behold the face of our Father in heaven.’ Wherefore, it is impossible for us now to be capable of the sight of the glorious appearance because of the weakness of the flesh which envelops us. The angels, however, since they do not have any such covering as our flesh, are prevented in no way from continually fastening their gaze upon the face of the glory of God. We also, after we have been made ‘sons of the resurrection,’ will be considered worthy of the knowledge face to face. At that time the just will be deemed worthy of the sight of His countenance in glory, but the sinners, of the sight in judgment, since all sin is going to be utterly destroyed by the just judgment of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
