[[commentary]]
quote='''
Since the word has given us licence to put questions, we ask first of all to be taught whether there is any order or sequence in the commandments of God, so that one comes first, another second, and so on; or whether all are inter-dependent, and all may be regarded as equally important so far as making a start goes, so that a man who so desires may be safe in beginning at any point he likes in the circle. Your question is an old one and was propounded long ago in the gospels, when the lawyer came to the Lord and said: “Master, which is the first commandment in the law?” And the Lord answered: “Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind. This is the first and great commandment. And the second is like it. Thou shalt love thy neighbour as thyself.” The Lord Himself then assigned this order to His own commandments. He defined the commandment of love towards God to be the first and greatest; and next to it in order, and like it, or rather completing the first commandment and linked on to it, the commandment of loving one’s neighbour. Accordingly from what has been said, and from similar passages contained in the inspired Scriptures, it is possible to learn the order and sequence of all the Lord’s commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 1"
