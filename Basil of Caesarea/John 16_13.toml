[[commentary]]
quote='''
And Isaiah, "The Lord God and His Spirit hath sent me," and "the Spirit came down from the Lord and guided them." And pray do not again understand by this guidance some humble service, for the Word witnesses that it was the work of God;—"Thou leddest thy people," it is said "like a flock," and "Thou that leadest Joseph like a flock," and "He led them on safely, so that they feared not." Thus when you hear that when the Comforter is come, He will put you in remembrance, and "guide you into all truth." do not misrepresent the meaning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 19"
