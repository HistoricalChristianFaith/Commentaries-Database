[[commentary]]
quote='''
Now, ‘No man shall see the face of the Lord and live,’ but, ‘the angels’ of the little ones in the Church ‘always behold the face of our Father in heaven.’ Wherefore, it is impossible for us now to be capable of the sight of the glorious appearance because of the weakness of the flesh which envelops us. The angels, however, since they do not have any such covering as our flesh, are prevented in no way from continually fastening their gaze upon the face of the glory of God. We also, after we have been made ‘sons of the resurrection,’ will be considered worthy of the knowledge face to face.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
