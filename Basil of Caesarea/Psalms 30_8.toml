[[commentary]]
quote='''
‘To thee, O Lord, will I cry: and I will make supplication to my God.’ Frequently, the statement is made in regard to crying out to the Lord that it is the privilege of him alone who desires great and heavenly things to cry out. But, if anyone asks God for trifling and earthly things, he uses a small and low voice, which does not reach to the height nor come to the ears of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
