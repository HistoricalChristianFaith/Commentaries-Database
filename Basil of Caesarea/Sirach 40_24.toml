[[commentary]]
quote='''
At such a time as this you ought to have borne in mind that you are my brother, and have not yet forgotten the ties of nature, and do not regard me in the light of an enemy, for I have entered on a life which is wearing out my strength, and is so far beyond my powers that it is injuring even my soul. Yet for all this, as you have determined to declare war against me, you ought to have come to me and shared my troubles. For it is said, “Brethren and help are against time of trouble.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252058.html'
source_title="Letter 58"
