[[commentary]]
quote='''
Now “no man” seems to be a general expression, so that not even one person is excepted by it, but this is not its use in Scripture, as I have observed in the passage “there is none good but one, that is, God.” For even in this passage the Son does not so speak to the exclusion of Himself from the good nature. But, since the Father is the first good, we believe the words “no man” to have been uttered with the understood addition of “first.” So with the passage “No man knoweth the Son but the Father;” even here there is no charge of ignorance against the Spirit, but only a testimony that knowledge of His own nature naturally belongs to the Father first. Thus also we understand “No man knoweth,” to refer to the Father the first knowledge of things, both present and to be, and generally to exhibit to men the first cause.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520236.html'
source_title="Letter 236, Section 1"
