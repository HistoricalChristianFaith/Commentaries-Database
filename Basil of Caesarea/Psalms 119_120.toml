[[commentary]]
quote='''
Unless fear disciplines our life, it is impossible successfully to attain holiness in body. ‘Pierce thou my flesh with thy fear.’ As those who are pierced by nails have the members of their bodies immovable for any activity, so those who are possessed by the divine fear in their soul escape all annoyance from sinful passions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
