[[commentary]]
quote='''
For the ferment of youth and its inability to resist impulses is controlled by continence as by a bit in a horse’s mouth. For “delicate living is not seemly for a fool,” as Solomon says. But what is more foolish than a comfortable body and youth at the mercy of impulses?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 16"
