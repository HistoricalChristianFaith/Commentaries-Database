[[commentary]]
quote='''
I have thought it only right to announce to you by letter how I said to myself, when I heard of the trials brought upon you by the enemies of God, that in a time reckoned a time of peace you have won for yourselves the blessings promised to all who suffer persecution for the sake of the name of Christ. In my judgment the war that is waged against us by our fellow countrymen is the hardest to bear, because against open and declared enemies it is easy to defend ourselves, while we are necessarily at the mercy of those who are associated with us, and are thus exposed to continual danger. This has been your case. Our fathers were persecuted, but by idolaters their substance was plundered, their houses were overthrown, they themselves were driven into exile, by our open enemies, for Christ’s name’s sake. The persecutors who have lately appeared, hate us no less than they, but, to the deceiving of many, they put forward the name of Christ, that the persecuted may be robbed of all comfort from its confession, because the majority of simpler folk, while admitting that we are being wronged, are unwilling to reckon our death for the truth’s sake to be martyrdom. I am therefore persuaded that the reward in store for you from the righteous Judge is yet greater than that bestowed on those former martyrs. They indeed both had the public praise of men, and received the reward of God; to you, though your good deeds are not less, no honours are given by the people. It is only fair that the requital in store for you in the world to come should be far greater.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520257.html'
source_title="Letter 257, Section 1"
