[[commentary]]
quote='''
Listen to the continuation. "In our image." What have you to reply? Is there one image of God and the angels? Father and Son have by absolute necessity the same form, but the form is here understood as becomes the divine, not in bodily shape, but in the proper qualities of Godhead. Hear also, you who belong to the new concision and who, under the appearance of Christianity, strengthen the error of the Jews. To Whom does He say, "in our image," to whom if it is not to Him who is "the brightness of His glory and the express image of His person," "the image of the invisible God"? It is then to His living image, to Him Who has said "I and my Father are one," "He that hath seen me hath seen the Father," that God says "Let us make man in our image." Where is the unlikeness in these Beings who have only one image?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25209-The%2520Creation%2520of%2520Terrestrial%2520Animals.html'
source_title="The Hexaemeron, Homily 9"

[[commentary]]
quote='''
Since then, as says the Lord in the Gospels, he that hath seen the Son sees the Father also; on this account he says that the Only-begotten is the express image of His Father’s person. That this may be made still plainer I will quote also other passages of the apostle in which he calls the Son “the image of the invisible God,” and again “image of His goodness;” not because the image differs from the Archetype according to the definition of indivisibility and goodness, but that it may be shewn that it is the same as the prototype, even though it be different. For the idea of the image would be lost were it not to preserve throughout the plain and invariable likeness. He therefore that has perception of the beauty of the image is made perceptive of the Archetype. So he, who has, as it were mental apprehension of the form of the Son, prints the express image of the Father’s hypostasis, beholding the latter in the former, not beholding in the reflection the unbegotten being of the Father (for thus there would be complete identity and no distinction), but gazing at the unbegotten beauty in the Begotten. Just as he who in a polished mirror beholds the reflection of the form as plain knowledge of the represented face, so he, who has knowledge of the Son, through his knowledge of the Son receives in his heart the express image of the Father’s Person. For all things that are the Father’s are beheld in the Son, and all things that are the Son’s are the Father’s; because the whole Son is in the Father and has all the Father in Himself. Thus the hypostasis of the Son becomes as it were form and face of the knowledge of the Father, and the hypostasis of the Father is known in the form of the Son, while the proper quality which is contemplated therein remains for the plain distinction of the hypostases.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252038.html'
source_title="Letter 38, Section 8"

[[commentary]]
quote='''
Thus also we understand “No man knoweth,” to refer to the Father the first knowledge of things, both present and to be, and generally to exhibit to men the first cause. Otherwise how can this passage fall in with the rest of the evidence of Scripture, or agree with the common notions of us who believe that the Only-Begotten is the image of the invisible God, and image not of the bodily figure, but of the very Godhead and of the mighty qualities attributed to the essence of God, image of power, image of wisdom, as Christ is called “the power of God and the wisdom of God”? Now of wisdom knowledge is plainly a part; and if in any part He falls short, He is not an image of the whole; and how can we understand the Father not to have shewn that day and that hour—the smallest portion of the ages—to Him through Whom He made the ages? How can the Creator of the universe fall short of the knowledge of the smallest portion of the things created by Him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520236.html'
source_title="Letter 236, Section 1"
