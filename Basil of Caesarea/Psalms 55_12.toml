[[commentary]]
quote='''
I have in truth found great distress among all who cleave to the peace of the Lord at the divers innovations of Apollinarius of Laodicea. He has all the more distressed me from the fact that he seemed at the beginning on our side. A sufferer can in a certain sense endure what comes to him from an open enemy, even though it be exceedingly painful, as it is written, “For it was not an enemy that reproached me; then I could have borne it.” But it is intolerable, and beyond the power of comfort, to be wronged by a close and sympathetic friend. Now that very man whom I have expected to have at my right hand in defence of the truth, I have found in many ways hindering those who are being saved, by seducing their minds and drawing them away from direct doctrine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520265.html'
source_title="Letter 265, Section 2"
