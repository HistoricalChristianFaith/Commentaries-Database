[[commentary]]
quote='''
Whenever you have the intention of providing for a poor man for the Lord’s sake, the same thing is both a gift and a loan, a gift because of the expectation of no repayment, but a loan because of the great gift of the Master who pays in his place, and who, receiving trifling things through a poor man, will give great things in return for them. ‘He that hath mercy on the poor, lendeth to God.’ Do you not wish to have the Lord of the universe answerable to you for payment? Or, if one of the rich men in the city would promise you the payment for the others, would you accept his pledge? But, you do not accept God as the surety for the poor. Give the money, since it is lying idle, without weighing it down with additional charges, and it will be good for both of you. There will be for you the assurance of its safety because of his custody; for him receiving it, the advantage from its use. And, if you are seeking additional payment, be satisfied with that from the Lord. He Himself will pay the interest for the poor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252014.html'
source_title="Homily on Psalm 14"
