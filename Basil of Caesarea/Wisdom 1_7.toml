[[commentary]]
quote='''
Furthermore if he calls the Holy Ghost a creature he describes His nature as limited. How then can the two following passages stand? “The Spirit of the Lord filleth the world;” and “Whither shall I go from thy Spirit?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 10"
