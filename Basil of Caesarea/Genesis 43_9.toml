[[commentary]]
quote='''
They may, peradventure, be suspected by you, when you remember the past, and therefore, most God-beloved Father, do as follows; send me the letters to the bishops, either by the hand of some one in whom you place trust in Alexandria, or by the hand of our brother Dorotheus the deacon: when I have received these letters I will not deliver them till I have got the bishops’ answers; if not, let me “bear the blame for ever.” Truly this ought not to have struck more awe into him who first uttered it to his father, than into me who now say it to my spiritual father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252082.html'
source_title="Letter 82"
