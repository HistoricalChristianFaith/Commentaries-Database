[[commentary]]
quote='''
What, indeed, could give greater gratification to one who prays ever to be in communication with them who fear the Lord, and to share their blessings, than a letter of this kind, wherein questions are asked about the knowledge of God? For if, to me, “to live is Christ,” truly my words ought to be about Christ, my every thought and deed ought to depend upon His commandments, and my soul to be fashioned after His. I rejoice, therefore, at being asked about such things, and congratulate the askers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520159.html'
source_title="Letter 159, Section 1"
