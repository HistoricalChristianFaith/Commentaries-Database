[[commentary]]
quote='''
Let him who is entrusted with the care of all behave as one who must give account for each individual; knowing that if one of the brethren fall into sin without his having declared to him beforehand the ordinance of God, or if having fallen into sin he abides therein, without having been taught the method of reformation, his blood will be required of the Superior’s hands, as Scripture says. And especially if he has knowingly neglected what pleases God and has weakened the discipline of the community by bearing with the evil ways of individuals in order to win their favour. For “they who felicitate you” it says “deceive you, and destroy the pathway of your feet.” “But he that troubleth you shall bear his burden, whoever he be.” Wherefore, lest this be our experience, let us follow the apostolic rule in intercourse with our brethren. “For neither at any time” he says “were we found using words of flattery, as ye know, nor a cloak of covetousness, God is witness; nor seeking glory of men, neither from you nor from others.”

He then that is free from these faults should be able to make his leadership without mistakes, fraught with reward for himself and salvation to his followers. For he who practises true love, recking nothing of human honours nor of avoiding the giving of offence to sinners by gentle and ingratiating behaviour, he will preach the word boldly, with honesty and sincerity, not choosing to adulterate the word in any way. So that the following words will fit him: “But we became gentle in the midst of you, as when a nurse cherisheth her own children; so being affectionately desirous of you, we were well pleased to impart unto you, not the gospel of God only, but also our own souls.”

But he who does not act thus is a blind guide, who both throws himself headlong and drags his followers after him.

How evil it is to cause one’s brother to err instead of leading him aright, you may see from what has been said. Besides it is a sign that the commandment of love is not fulfilled, for no father calmly looks on at his son about to fall into a pit, nor does he leave him fallen there. I need not say how much more terrible it is for a soul fallen into the depth of evil to be left to perish. So the Superior is responsible to his brethren to watch over their souls and care for the salvation of each, as one that must render account. He must care for them so much as to show zeal on their behalf even unto death, not only after the fashion of the Lord’s general words about love to all men—“that a man lay down his life for his friends”—but after the fashion of that particular love shown by him who said: “Being affectionately desirous of you, we are well pleased to impart unto you, not the gospel of God only, but also our own souls.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 25"
