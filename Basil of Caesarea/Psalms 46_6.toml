[[commentary]]
quote='''
‘Nations were troubled, and kingdoms were bowed down:’ the most High ‘uttered his voice, the earth trembled.’ Consider, I pray you, that a certain city is the object of plots by the enemy who are making war on it, while in the meantime, many nations are settled around it and the kings are dividing by lot the sceptres of each nation; then, that a certain general, unconquerable in might, appears all at once to help this city; he breaks the siege, scatters the gathering of nations, forces the kings into flight simply by calling upon them with power, and he terrifies their hearts by the firmness of his voice. How much disturbance was probably aroused when the nations were being pursued and the kings were being turned into flight! Is it not likely that some indistinct rumbling and incessant noise was sent up from their confused flight, and all the place was full of those driven out because of their cowardice, so that a commotion sprang up everywhere in the cities and villages that received them? Now, he presents such succor for the city of God from the Savior in his words: ‘Nations were troubled, and kingdoms were bowed down: the most High uttered his voice, the earth trembled.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"
