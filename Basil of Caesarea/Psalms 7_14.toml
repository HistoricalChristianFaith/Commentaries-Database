[[commentary]]
quote='''
‘Behold he hath been in labor with injustice; he hath conceived sorrow, and brought forth iniquity.’ The passage seems to be confused in its order, since they who are pregnant first conceive, then are in labor, and finally bring forth. But here, first comes the travail, then the conception, and lastly the delivery. However, this is most vivid for the conception by the heart. Indeed, the irrational impulses of the licentious, the insane and frenzied lusts have been called travails because they are engendered in the soul with suddenness and pain. Through such an impulse he who has not command over his wicked practices, has begotten iniquity. David seems ashamed to say this because he is the father of a lawless son. ‘He is not my son,’ he says, ‘but he has become the son of the father to whom he gave himself in adoption through sin.’ Therefore, according to John, ‘He who commits sin is of the devil.’ Behold then, the devil was in labor with him through injustice, and he conceived him, as if he drew him within his innermost parts beneath the vitals of his own passion and was pregnant of him, then brought him forth, having made manifest his iniquity because his rebellion against his father was proclaimed to all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
