[[commentary]]
quote='''
‘Behold the eyes of the Lord are on them that fear him.’ Elsewhere, it says, ‘The eyes of the Lord are upon the just,’ but here, ‘on those that fear him.’ When we look upon the Lord and our eyes are on Him, so that we say, ‘Behold as the eyes of the servants are on the hands of their masters, so are our eyes unto the Lord our God,’ then, we, as it were, draw the eye of the Lord to watch over us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
