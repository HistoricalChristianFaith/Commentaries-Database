[[commentary]]
quote='''
He who has once forsworn marriage will, needless to say, forswear much more those cares which the apostle says distract the married man, namely, how he may please his wife, and will purge himself by every means from every care to please women, fearing the condemnation of Scripture: “God hath scattered the bones of the men-pleasers.” Accordingly he will not even consent to meet a man in order to please him; but if need demands, he will arrange a meeting for the sake of the service which according to God’s command every man has a right to expect from his neighbour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 33"
