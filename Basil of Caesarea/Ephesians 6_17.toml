[[commentary]]
quote='''
Again, if the sword of the spirit is the word of God, then the Holy Ghost is God, inasmuch as the sword belongs to Him of whom it is also called the word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 11"
