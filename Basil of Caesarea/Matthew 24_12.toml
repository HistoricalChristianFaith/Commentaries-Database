[[commentary]]
quote='''
Far apart as you are in body, you have united yourself to me by writing; you have embraced me with spiritual and holy longing; you have implanted unspeakable affection in my soul. Now I have realized the force of the proverb, “As cold water is to a thirsty soul so is good news from a far country.” Honoured brother, I really hunger for affection. The cause is not far to seek, for iniquity is multiplied and the love of many has grown cold. For this reason your letter is precious to me, and I am replying by our reverend brother Sabinus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252091.html'
source_title="Letter 91"

[[commentary]]
quote='''
You have exhibited to me in your letter, the first fruits of the Spirit, love. Than this what can be more precious to me in the present state of affairs, when, because iniquity abounds, the love of many has waxed cold? Nothing is rarer now than spiritual intercourse with a brother, a word of peace, and such spiritual communion as I have found in you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520172.html'
source_title="Letter 172"

[[commentary]]
quote='''
Thus, by God’s grace, through mutual accommodation we may govern the Churches by the ancient kind of love; receiving as our own members brothers coming from the other side, sending as to our kin, and in turn receiving as from our own kin. Such, indeed, was once the boast of the Church. Brothers from each Church, travelling from one end of the world to the other, were provided with little tokens, and found all men fathers and brothers. This is a privilege whereof, like all the rest, the enemy of Christ’s Churches has robbed us. We are confined each in his own city, and every one looks at his neighbour with distrust. What more is to be said but that our love has grown cold, whereby alone our Lord has told us that His disciples are distinguished?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520191.html'
source_title="Letter 191"

[[commentary]]
quote='''
[Let not this consideration influence you. ‘We dwell on the sea, we are exempt from the sufferings of the generality, we need no succour from others; so what is the good to us of foreign communion?’ For the same Lord Who divided the islands from the continent by the sea, bound the island Christians to those of the continent by love. Nothing, brethren, separates us from each other, but deliberate estrangement. We have one Lord, one faith, the same hope. The hands need each other; the feet steady each other. The eyes possess their clear apprehension from agreement. We, for our part, confess our own weakness, and we seek your fellow feeling. For we are assured, that though ye are not present in body, yet by the aid of prayer, ye will do us much benefit in these most critical times. It is neither decorous before men, nor pleasing to God, that you should make avowals which not even the Gentiles adopt, which know not God. Even they, as we hear, though the country they live in be sufficient for all things, yet, on account of the uncertainty of the future, make much of alliances with each other, and seek mutual intercourse as being advantageous to them. Yet we, the sons of fathers who have laid down the law that by brief notes the proofs of communion should be carried about from one end of the earth to the other, and that all should be citizens and familiars with all, now sever ourselves from the whole world, and are neither ashamed at our solitariness, nor shudder that on us is fallen the fearful prophecy of the Lord, ‘Because of lawlessness abounding, the love of the many shall wax cold.’]
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520203.html'
source_title="Letter 203, Section 3"

[[commentary]]
quote='''
It has long been expected that, in accordance with the prediction of our Lord, because of iniquity abounding, the love of the majority would wax cold. Now experience has confirmed this expectation. But though this condition of things has already obtained among us here, it seems to be contradicted by the letter brought from your holiness. For verily it is no mere ordinary proof of love, first that you should remember an unworthy and insignificant person like myself; and secondly, that you should send to visit me brethren who are fit and proper ministers of a correspondence of peace. For now, when every man is viewing every one else with suspicion, no spectacle is rarer than that which you are presenting. Nowhere is pity to be seen; nowhere sympathy; nowhere a brotherly tear for a brother in distress. Not persecutions for the truth’s sake, not Churches with all their people in tears; not this great tale of troubles closing round us, are enough to stir us to anxiety for the welfare of one another. We jump on them that are fallen; we scratch and tear at wounded places; we who are supposed to agree with one another launch the curses that are uttered by the heretics; men who are in agreement on the most important matters are wholly severed from one another on some one single point. How, then, can I do otherwise than admire him who in such circumstances shews that his love to his neighbour is pure and guileless, and, though separated from me by so great a distance of sea and land, gives my soul all the care he can?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520258.html'
source_title="Letter 258, Section 1"
