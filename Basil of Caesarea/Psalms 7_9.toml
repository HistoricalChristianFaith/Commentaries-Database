[[commentary]]
quote='''
‘Let the wickedness of sinners be brought to nought.’ He who says this prayer is obviously a disciple of the evangelical precepts. He prays for those who treat him maliciously, asking that the wickedness of the sinners be circumscribed by a definite limit and boundary. Just as if some one, when praying for those who are suffering in body, would say, ‘Let the disease of those who are suffering come to an end.’ In order that the sin slowly creeping farther may not spread like cancer, since he loves his enemy and wishes to do good to those who hate him, and for this reason prays for those who treat him maliciously, he begs of God that the further outpouring of sin may cease and have definite bounds.

‘And thou shalt direct the just.’ The just man is called righteous, and the heart which has been set straight is righteous. What, then, does the prophet’s prayer mean here? For, he prays that one who already possesses righteousness be set right. One certainly would not say that there is anything crooked in a just man nor distorted nor twisted. But, perhaps, the prayer is necessary for the just man in order that his rightness in purpose and integrity of will may be directed by the guiding hand of God, so that he shall never through weakness turn aside from the canon, as it were, of truth, nor be misled by the enemy of truth through perverted doctrines.

‘The searcher of hearts and reins is God.’ Since Scripture in many places accepts the heart for the principal part of the body, and the reins for the affective part of the soul, here also this same expression signifies: ‘O God, judge me for the teachings concerning piety which I hold and for the movements of my affections; for, You are the One who searches the hearts and the reins.’ A search is properly an inquiry with all manner of tortures brought upon those who are examined by the judges, in order that persons who conceal on themselves things sought may by the force of their sufferings restore the hidden object to sight. In the undeceivable inquiries of the Judge our thoughts are examined and our deeds are examined. Let no one, therefore, anticipate the true Judge, and let no one judge before time, ‘until the Lord comes, who will both bring to light the things hidden in darkness and make manifest the counsels of hearts.’ In searching the hearts and the reins God shows His justice. Now, the heart of Abraham was searched to see if he loved God with his whole soul and his whole heart, when he was commanded to offer Isaac as a holocaust, in order that he might show that he did not love his son above God. And Jacob, who was the object of the plots of his brother, was searched, in order that his brotherly love might shine forth undimmed amidst such great sins of Esau. Therefore, the hearts of these were searched; but, the reins of Joseph were searched when, although the licentious mistress was madly in love with him, he preferred the honor of chastity to shameful pleasure. Moreover, he was searched for this reason, that the witnesses of the judgment of God might agree that honor was justly bestowed on him, because his chastity shone so very brightly in great trials.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
