[[commentary]]
quote='''
‘The just cried, and the Lord heard them: and delivered them out of all their troubles.’ The cry of the just is a spiritual one, having its loudness in the secret recess of the heart, able to reach even to the ears of God. Indeed, he who makes great petitions and prays for heavenly favors, he cries out and sends up a prayer that is audible to God. Therefore, ‘the just cried.’ They sought after nothing petty, nothing earthly, nothing lowly. For this reason the Lord received their voice, and He delivered them from all their tribulations, not so much freeing them from their troubles as making them victorious over the circumstances.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
