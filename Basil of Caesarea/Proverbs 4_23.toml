[[commentary]]
quote='''
Believe these words of mine that proceed from the fraternal charity of my heart. Have recourse to older men who make themselves difficult of access and in no way harm the young by their charm of countenance but animate them to virtuous deeds by sayings from Proverbs. "With all watchfulness, keep your heart"; for, like golden treasure, it is the object of the constant vigilance of thieves, night and day, and in an unguarded moment it is stolen without your being aware of it. See that the adversary does not seduce you into the sin of our first parent and cast you with all speed out of the paradise of delight.
'''
source_url=''
source_title="ON RENUNCIATION OF THE WORLD"

[[commentary]]
quote='''
He then who would truly follow God must be loosed from the chains of attachment to this life. Now this is secured by complete retirement and forgetfulness of former habits. So that, unless we exile ourselves from fleshly relations and communications of this life, migrating as it were to another world in our habit of mind, as the apostle said—“Our citizenship is in heaven”—it is impossible that we should succeed in the aim of being well-pleasing to God, for the Lord said definitely: “So every one of you that renounceth not all that he hath cannot be my disciple.” Having done this, it befits us to keep our hearts with all watchfulness, so as never to lose the thought of God, or to defile the memory of His wonders with imaginations of vanity; but to bear about the holy thought of God with continual and pure memory imprinted in our souls, as it were an indelible seal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 5"
