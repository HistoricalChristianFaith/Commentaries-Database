[[commentary]]
quote='''
But another passage is also seized by those who are fighting against God to the perversion of their hearers: I mean the words “The Son can do nothing of Himself.” To me this saying too seems distinctly declaratory of the Son’s being of the same nature as the Father. For if every rational creature is able to do anything of himself, and the inclination which each has to the worse and to the better is in his own power, but the Son can do nothing of Himself, then the Son is not a creature. And if He is not a creature, then He is of one essence and substance with the Father. Again; no creature can do what he likes. But the Son does what He wills in heaven and in earth. Therefore the Son is not a creature. Again; all creatures are either constituted of contraries or receptive of contraries. But the Son is very righteousness, and immaterial. Therefore the Son is not a creature, and if He is not a creature, He is of one essence and substance with the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 9"

[[commentary]]
quote='''
On the other hand, and lest we should ever be drawn away by the greatness of the works wrought to imagine that the Lord is without beginning, what saith the Self-Existent? "I live through [by, A.V.] the Father," and the power of God; "The Son hath power [can, A.V.] to do nothing of himself." And the self-complete Wisdom? I received "a commandment what I should say and what I should speak." Through all these words He is guiding us to the knowledge of the Father, and referring our wonder at all that is brought into existence to Him, to the end that "through Him" we may know the Father. For the Father is not regarded from the difference of the operations, by the exhibition of a separate and peculiar energy; for whatsoever things He sees the Father doing, "these also doeth the Son likewise;" but He enjoys our wonder at all that comes to pass out of the glory which comes to Him from the Only Begotten, rejoicing in the Doer Himself as well as in the greatness of the deeds, and exalted by all who acknowledge Him as Father of our Lord Jesus Christ, "through whom [by whom, A.V.] are all things, and for whom are all things." Wherefore, saith the Lord, "All mine are thine," as though the sovereignty over created things were conferred on Him, and "Thine are mine," as though the creating Cause came thence to Him. We are not to suppose that He used assistance in His action, or yet was entrusted with the ministry of each individual work by detailed commission, a condition distinctly menial and quite inadequate to the divine dignity. Rather was the Word full of His Father's excellences; He shines forth from the Father, and does all things according to the likeness of Him that begat Him. For if in essence He is without variation, so also is He without variation in power. And of those whose power is equal, the operation also is in all ways equal. And Christ is the power of God, and the wisdom of God. And so "all things are made through [by, A.V.] him," and "all things were created through [by, A.V.] him and for him," not in the discharge of any slavish service, but in the fulfilment of the Father's will as Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
