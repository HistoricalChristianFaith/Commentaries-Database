[[commentary]]
quote='''
Let them tell me in what sense Paul says, “Now we know in part”; do we know His essence in part, as knowing parts of His essence? No. This is absurd; for God is without parts. But do we know the whole essence? How then “When that which is perfect is come, then that which is in part shall be done away.” Why are idolaters found fault with? Is it not because they knew God and did not honour Him as God? Why are the “foolish Galatians” reproached by Paul in the words, “After that ye have known God, or rather are known of God, how turn ye again to the weak and beggarly elements?” How was God known in Jewry? Was it because in Jewry it was known what His essence is? “The ox,” it is said, “knoweth his owner.” According to your argument the ox knows his lord’s essence. “And the ass his master’s crib.” So the ass knows the essence of the crib, but “Israel doth not know me.” So, according to you, Israel is found fault with for not knowing what the essence of God is. “Pour out thy wrath upon the heathen that have not known thee,” that is, who have not comprehended thy essence. But, I repeat, knowledge is manifold—it involves perception of our Creator, recognition of His wonderful works, observance of His commandments and intimate communion with Him. All this they thrust on one side and force knowledge into one single meaning, the contemplation of God’s essence. Thou shalt put them, it is said, before the testimony and I shall be known of thee thence. Is the term, “I shall be known of thee,” instead of, “I will reveal my essence”? “The Lord knoweth them that are his.” Does He know the essence of them that are His, but is ignorant of the essence of those who disobey Him? “Adam knew his wife.” Did he know her essence? It is said of Rebekah “She was a virgin, neither had any man known her,” and “How shall this be seeing I know not a man?” Did no man know Rebekah’s essence? Does Mary mean “I do not know the essence of any man”? Is it not the custom of Scripture to use the word “know” of nuptial embraces? The statement that God shall be known from the mercy seat means that He will be known to His worshippers. And the Lord knoweth them that are His, means that on account of their good works He receives them into intimate communion with Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520235.html'
source_title="Letter 235, Section 3"
