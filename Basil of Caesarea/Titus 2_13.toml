[[commentary]]
quote='''
What is truly good, therefore, is principally and primarily the most blessed. And that is God. Whence Paul also, when about to make mention of Christ, said: ‘According to the manifestation of our blessed God and Savior Jesus Christ.’ For, truly blessed is Goodness itself toward which all things look, which all things desire, an unchangeable nature, lordly dignity, calm existence; a happy way of life, in which there is no alteration, which no change touches; a flowing fount, abundant grace, inexhaustible treasure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25201.html'
source_title="Homily on Psalm 1"
