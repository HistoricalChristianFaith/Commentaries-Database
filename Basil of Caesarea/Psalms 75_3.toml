[[commentary]]
quote='''
If ever you hear in the Psalms, “I bear up the pillars of it;” see in these pillars the power which sustains it. Because what means this other passage, “He hath founded it upon the sea,” if not that the water is spread all around the earth? How then can water, the fluid element which flows down every declivity, remain suspended without ever flowing? You do not reflect that the idea of the earth suspended by itself throws your reason into a like but even greater difficulty, since from its nature it is heavier. But let us admit that the earth rests upon itself, or let us say that it rides on the waters, we must still remain faithful to thought of true religion and recognise that all is sustained by the Creator’s power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25201-In%2520the%2520Beginning%2520God%2520Made%2520the%2520Heaven%2520and%2520the%2520Earth.html'
source_title="The Hexaemeron, Homily 1: In the Beginning God Made the Heaven and the Earth"
