[[commentary]]
quote='''
‘O Lord, in thy favor, thou gavest strength to my beauty.’ They who are engaged in the examination of the reason for virtues, have said that some of the virtues spring from contemplation and some are noncontemplative; as for instance, prudence springs from contemplation in the sphere of things good and evil, but self-control from the contemplation of things to be chosen or avoided, justice, of things to be assigned or not to be assigned, and valor, of those that are dangerous or not dangerous; but beauty and strength are noncontemplative virtues, since they follow from the contemplative. From the fitness and harmony of the contemplations of the soul, some wise men have perceived beauty; and from the effectiveness of the suggestions from the contemplative virtues, they have become aware of strength. But, for this, namely, that beauty may exist in the soul, and also the power for the fulfillment of what is proper, we need divine grace. As, therefore, he said above: ‘Life is in his good will,’ so, now, he extols God through his thanksgiving, saying: ‘In thy favor, thou gavest strength to my beauty.’ For, I was beautiful according to nature, but weak, because I was dead by sin through the treachery of the serpent. To my beauty, then, which I received from You at the beginning of my creation, You added a strength which is appropriate for what is proper. Every soul is beautiful, which is considered by the standard of its own virtues. But beauty, true and most lovely, which can be contemplated by him alone who has purified his mind, is that of the divine and blessed nature. He who gazes steadfastly at the splendor and graces of it, receives some share from it, as if from an immersion, tingeing his own face with a sort of brilliant radiance. Whence Moses also was made resplendent in face by receiving some share of beauty when he held converse with God. Therefore, he who is conscious of his own beauty utters this act of thanksgiving: ‘O Lord, in thy favor, thou gavest strength to my beauty.’

Just as the noncontemplative virtues, both beauty and strength, follow from the contemplative virtues, so there are certain noncontemplative vices, shameful conduct and weakness. In fact, what is more unbecoming and uglier than a passionate soul? Observe, I beg you, the wrathful man and his fierceness. Look at the man who is distressed, his abasement and dejection of soul. Who could endure to look at him who is sunk in sensuality and gluttony or who is alarmed by fears? For, the feelings of the soul affect even the extremities of the body, just as also the traces of the beauty of the soul shine through in the state of the saint. Accordingly, we must have regard for beauty, in order that the Bridegroom, the Word, receiving us, may say: ‘Thou art all fair, O my love, and there is not a spot in thee.’

‘Thou turnedst away thy face from me, and I became troubled.’ ‘As long as the rays of the sun of Your watchfulness shone upon me,’ he says, ‘I lived in a calm and untroubled state, but, when You turned Your face away, the agitation and confusion of my soul was exposed.’ God is said to turn away His face when in times of troubles He permits us to be delivered up to trials, in order that the strength of him who is struggling may be known. Therefore, ‘if the peace which surpasses all understanding will guard our hearts,’ we shall be able to escape the tumult and confusion of the passions. Since perversion is opposed to the will of God, and disorder to beauty and grace and strength, the disorder would be a deformity and weakness of the soul, present in it because of its estrangement from God. We pray always for the face of God to shine upon us, in order that we may be in a state becoming to a holy person, gentle and untroubled in every way, because of our readiness for the good. ‘I am ready,’ he says, ‘and am not troubled.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252029.html'
source_title="Homily on Psalm 29"
