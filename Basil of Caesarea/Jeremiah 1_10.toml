[[commentary]]
quote='''
They refused to yield to the sentence of fifty bishops passed against them. They declined to resign the government of their Churches although the number of bishops assenting to the decree for their deposition was so many, on the alleged ground that they were not partakers of the Holy Ghost, and were not governing their Churches by the grace of God, but had clutched their dignity by the aid of human power, and through lust of vain glory. Now they are for receiving the men consecrated by these same persons as bishops. I should like you to ask them in my stead, (although they despise all mankind, as bereft of eyes, ears, and common sense), to perceive the inconsistency of their conduct, what sentiments they do really entertain in their own hearts. How can there be two bishops, one deposed by Euippius, and the other consecrated by him? Both are the actions of the same man. Had he not been endowed with the grace bestowed upon Jeremiah to pull down and build again, to root out and to plant, he certainly would not have rooted the one out and planted the other. Grant him the one and you must grant him the other.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520244.html'
source_title="Letter 244, Section 6"
