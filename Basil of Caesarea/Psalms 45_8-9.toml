[[commentary]]
quote='''
‘Myrrh and aloes and cassia perfume thy garments, from the ivory houses: out of which the daughters of Kings have delighted thee in thy glory.’ The statement of the prophet, descending gradually and consistently and mentioning first all those things which pertain to the dispensation of the Incarnation, by a strong breath of the Spirit which reveals to him hidden things, came to the passion. ‘Myrrh,’ he says, ‘and aloes and cassia perfume thy garments.’ Now, the fact that myrrh is a symbol of burial even the evangelist John taught us when he said that He was prepared for burial by Joseph of Arimathea with myrrh and aloes. Aloes itself is also a very refined form of myrrh. When the aromatic herb is squeezed, whatever part of it is liquid is separated as aloes, but the denser part which is left is called myrrh. Surely, then, the sweet odor of Christ gives forth the fragrance of myrrh because of His passion and of aloes because He did not remain motionless and inactive for three days and three nights but descended to the lower world to distribute the graces of the Resurrection, in order that He might fulfill all things which have reference to Him. And it breathes forth the fragrance of cassia because cassia is a certain very delicate and fragrant bark which is tightly stretched around a woody stalk. Perhaps, Scripture profoundly and wisely intimated to us through the name of cassia the suffering of the cross undertaken in kindness to every creature. Therefore, you have myrrh because of burial; aloes, because of the passage down to the lower world (since every drop is borne downward); and cassia, because of the dispensation of the flesh upon the wood. For this reason he says: ‘the daughters of kings have delighted thee in thy glory.’ But, who would be the daughters of kings except the generous and great and kingly souls? Those which, after they had learned to know Christ through His descent to a human state ‘delighted Him in His glory,’ in true faith and perfect charity, giving glory to His divinity. And these aromatic herbs, he says, are not sparingly present in the garments of Christ (that is to say, the parable of the sermons and the preparation of the doctrines), but are brought from all the buildings. He says that the largest of the dwellings are houses, and that these are constructed of ivory, because the prophet is teaching, I think, the wealth of the love of Christ for the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252044.html'
source_title="Homily on Psalm 44"
