[[commentary]]
quote='''
I have quite a little difficulty in meeting the second charge. Whoever condemns those who assert that the Godhead is one, must of necessity agree with all who maintain many godheads, or with those who maintain that there is none. No third position is conceivable. The teaching of inspired Scripture does not allow of our speaking of many godheads, but, wherever it mentions the Godhead, speaks of it in the singular number; as, for instance, “in him dwelleth all the fulness of the Godhead bodily.” And again; “for the invisible things of him from the creation of the world are clearly seen, being understood by the things that are made, even his eternal power and Godhead.” If, then, to multiply godheads is the special mark of the victims of polytheistic error, and to deny the Godhead altogether is to fall into atheism, what sense is there in this charge against me of confessing one Godhead?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520189.html'
source_title="Letter 189, Section 4"

[[commentary]]
quote='''
Which is first in order, knowledge or faith? I reply that generally, in the case of disciples, faith precedes knowledge. But, in our teaching, if any one asserts knowledge to come before faith, I make no objection; understanding knowledge so far as is within the bounds of human comprehension. In our lessons we must first believe that the letter a is said to us; then we learn the characters and their pronunciation, and last of all we get the distinct idea of the force of the letter. But in our belief about God, first comes the idea that God is. This we gather from His works. For, as we perceive His wisdom, His goodness, and all His invisible things from the creation of the world, so we know Him. So, too, we accept Him as our Lord. For since God is the Creator of the whole world, and we are a part of the world, God is our Creator. This knowledge is followed by faith, and this faith by worship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520235.html'
source_title="Letter 235, Section 1"

[[commentary]]
quote='''
You will finally discover that the world was not conceived by chance and without reason, but for an useful end and for the great advantage of all beings, since it is really the school where reasonable souls exercise themselves, the training ground where they learn to know God; since by the sight of visible and sensible things the mind is led, as by a hand, to the contemplation of invisible things. “For,” as the Apostle says, “the invisible things of him from the creation of the world are clearly seen, being understood by the things that are made.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25201-In%2520the%2520Beginning%2520God%2520Made%2520the%2520Heaven%2520and%2520the%2520Earth.html'
source_title="The Hexaemeron, Homily 1: In the Beginning God Made the Heaven and the Earth"

[[commentary]]
quote='''
May God who, after having made such great things, put such weak words in my mouth, grant you the intelligence of His truth, so that you may raise yourselves from visible things to the invisible Being, and that the grandeur and beauty of creatures may give you a just idea of the Creator. For the visible things of Him from the creation of the world are clearly seen, and His power and divinity are eternal. Thus earth, air, sky, water, day, night, all visible things, remind us of who is our Benefactor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25203-On%2520the%2520Firmament.html'
source_title="The Hexaemeron, Homily 3: On the Firmament"
