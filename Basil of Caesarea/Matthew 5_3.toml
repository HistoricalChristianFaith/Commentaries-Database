[[commentary]]
quote='''
Poverty is not always praiseworthy, but only that which is practiced intentionally according to the evangelical aim. Many are poor in their resources, but very grasping in their intention; poverty does not save these; on the contrary, their intention condemns them. Accordingly, not he who is poor is by all means blessed, but he who has considered the command of Christ better than the treasures of the world. These the Lord also pronounces blessed, when He says: ‘Blessed are the poor in spirit,’ not those poor in resources, but those who from their soul have chosen poverty. For, nothing that is not deliberate is to be pronounced blessed. Therefore, every virtue, but this one especially before all others, is characterized by the action of the free will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
