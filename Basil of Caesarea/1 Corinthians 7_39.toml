[[commentary]]
quote='''
The woman in widowhood, who is independent, may dwell with a husband without blame, if there is no one to prevent their cohabitation; for the Apostle says; “but if her husband be dead, she is at liberty to be married to whom she will; only in the Lord.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520199.html'
source_title="Letter 199, Canon 41"
