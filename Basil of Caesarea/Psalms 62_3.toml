[[commentary]]
quote='''
‘How long do you rush in upon a man? you all kill, as if you were thrusting down a leaning wall, and a tottering fence.’ Again the homily fights against the depraved ministers of the devil, charging a lack of moderation in the snares laid by them. Certainly, men are weak animals; but you rush on, not content with the first attack, but you bring on a second and a third, until you subdue to such an extent the soul which has fallen beside you that it is very similar to a leaning wall and a tottering fence. Now, a wall, as long as it maintains an upright position, remains steadfast; but, when it leans, since it has been weakened, it needs must fall. For, heavy bodies, if united into one, stand erect after inclining, but those which are composed of several parts no longer admit of correction when they endure pressure on one part. The homily shows, therefore, that the nature of man, which is composite, was one inaccessible to plots for a second fall. ‘You are God’s tillage, God’s building,’ it is said. The enemy has shaken down this building; the Craftsman has repaired the rents made in it. Thus the fall was necessary because of sin, but the resurrection was great because of immortality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252061.html'
source_title="Homily on Psalm 61"
