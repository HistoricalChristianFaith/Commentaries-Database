[[commentary]]
quote='''
Our discourse has already shown the necessity of humility, and simplicity, and cheapness and economy in every direction, so that the causes of distractions occasioned by bodily needs may be few. Accordingly our discourse on clothing must follow the same objects. For if it behoves us to strive to be last of all, in this matter also, to be sure, the last place is to be chosen. For just as the vainglorious strive to attain reputation by their outward covering of clothes, ambitious to be gazed at and courted for the expensiveness of their garb, so clearly it befits him who has abased his life to the uttermost in humility to choose in this matter also the lowest possible. For just as the Corinthians are blamed, in the public feasts because by their extravagance they put to shame those who have nothing, so clearly in the common and conspicuous use of clothes adornment above the common standard puts the poor man to shame by comparison. Since the apostle says: “Mind not high things, but condescend to things that are lowly,” let each man examine himself, which it is more fitting Christians should resemble, those who live in kings’ houses and are clothed in soft raiment, or the messenger and herald of the Lord’s advent, than whom no greater has arisen among men born of women. I mean John, the son of Zacharias, whose clothing was of camel’s hair. Moreover the Saints of old went about in sheep-skins and goat-skins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 22"
