[[commentary]]
quote='''
And the example of the rich man’s luxury makes continence necessary for us, lest what was said to the rich man be said to us: “Thou in thy lifetime receivedst thy good things.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 16"
