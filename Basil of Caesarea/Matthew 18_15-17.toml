[[commentary]]
quote='''
It cannot be a matter of indifference whether or not those who have once agreed to live together remain where they are or depart. Refusal to carry out one’s purpose has two causes, either harm received from living together, or instability on the part of him who changes his mind. Let him who separates from his brethren on account of the harm he is receiving not keep the cause to himself but rather denounce the harm after the fashion shown us by the Lord when He said: “If thy brother sin, go, show him his fault between thee and him alone, etc.” And if the required amendment is made he has both gained his brethren, and does not put the community to shame; but if he sees them abiding in evil, and not receiving correction, he will show the matter to those who are competent to judge such things; and then at last (if he cannot get redress) let him depart having got a number to witness what he is doing. He will then be departing no longer from brethren but from strangers, for the Lord compares him who abides in evil to a Gentile and a publican. For He says: “Let” such a man “be to thee as a Gentile and a publican.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 36"

[[commentary]]
quote='''
He, who after the first and second admonition abides in his fault, ought to be brought before the person in authority, if haply after being rebuked by more he may be ashamed. If even thus he fail to be set right he is to be cut off from the rest as one that maketh to offend, and regarded as a heathen and a publican, for the security of them that are obedient, according to the saying, When the impious fall the righteous tremble. He should be grieved over as a limb cut from the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252022.html'
source_title="Letter 22, Section 3"

[[commentary]]
quote='''
When public punishment fails to bring a man to his senses, or exclusion from the prayers of the Church to drive him to repentance, it only remains to treat him in accordance with our Lord’s directions—as it is written, “If thy brother shall trespass against thee….tell him his fault between thee and him;…if he will not hear thee, take with thee another;” “and if he shall” then “neglect to hear, tell it unto the Church; but if he neglect to hear even the Church, let him be unto thee henceforth as an heathen man, and as a publican.” Now all this we have done in the case of this fellow. First, he was accused of his fault; then he was convicted in the presence of one or two witnesses; thirdly, in the presence of the Church. Thus we have made our solemn protest, and he has not listened to it. Henceforth let him be excommunicated.

Further, let proclamation be made throughout the district, that he be excluded from participation in any of the ordinary relations of life; so that by our withholding ourselves from all intercourse with him he may become altogether food for the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520288.html'
source_title="Letter 288"
