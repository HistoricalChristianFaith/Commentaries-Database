[[commentary]]
quote='''
The Lord is now making trial of your love for Him. Now there is an opportunity for you, through your patience, to take the martyr’s lot. The mother of the Maccabees saw the death of seven sons without a sigh, without even shedding one unworthy tear. She gave thanks to God for seeing them freed from the fetters of the flesh by fire and steel and cruel blows, and she won praise from God, and fame among men. The loss is great, as I can say myself; but great too are the rewards laid up by the Lord for the patient.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25206.html'
source_title="Letter 6, Section 2"
