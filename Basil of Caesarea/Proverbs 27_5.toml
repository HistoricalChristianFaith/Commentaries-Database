[[commentary]]
quote='''
Every sin must be brought to the notice of the Superior either by the sinner himself or by those who have become aware of the sin, if they cannot cure it themselves, according to the Lord’s command. For wickedness passed over in silence is like a festering sore in the soul. As then we should not call him a benefactor who shuts up deadly things in the body but rather the man who by pain and rending brings it to the light, so as to cast out what is doing the harm by an emetic, or generally so that by the laying bare of the disease the mode of cure becomes well known—so obviously to hide sin is to assist the sick man to his death. “For the sting of death is sin.” “Open rebukes are better than hidden friendships.” So let us neither hide our sins from one another lest we become slayers of our brethren rather than their friends, or from ourselves. “For he that does not cure himself in his works is brother of him that destroyeth himself.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 46"
