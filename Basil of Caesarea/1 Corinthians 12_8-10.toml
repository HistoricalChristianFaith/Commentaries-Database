[[commentary]]
quote='''
In the next place, no single man is sufficient to receive all spiritual gifts, but according to the proportion of the faith that is in each man the supply of the Spirit is given; consequently, in the common life the private gift of each man becomes the common property of his fellows. “For to one is given the word of wisdom, to another the word of knowledge, to another faith, to another gifts of healing, etc.” Each of which gifts the recipient has as much for others’ sake as for his own. So that of necessity in the community life the working of the Holy Spirit in one man passes over to all the rest at once. Now all you who have read the Gospels know the great danger incurred by the man living alone, who has one gift perhaps, and makes it useless by idleness, digging a hole for it in himself. Whereas when a number live together a man enjoys his own gift, multiplying it by imparting it to others, and reaps the fruits of other men’s gifts as if they were his own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 7"
[[commentary]]
quote='''
The critic ought really to set out with much the same training and equipment as the author. A man ignorant of agriculture is quite incapable of criticising husbandry, and the distinctions between harmony and discord can only be adequately judged by a trained musician. But any one who chooses will set up for a literary critic, though he cannot tell us where he went to school, or how much time was spent in his education, and knows nothing about letters at all. I see clearly that, even in the case of the words of the Holy Spirit, the investigation of the terms is to be attempted not by every one, but by him who has the spirit of discernment, as the Apostle has taught us, in the differences of gifts;—“For to one is given by the Spirit the word of wisdom; to another the word of knowledge by the same Spirit; to another faith by the same Spirit; to another the gift of healing by the same Spirit; to another the working of miracles; to another prophecy; to another discerning of spirits.” If, therefore, my gifts are spiritual, he who wishes to judge them must shew proof of his own possession of the gift of “discerning of spirits.” If, on the contrary, as he calumniously contends, my gifts are of the wisdom of this world, let him shew that he is an adept in this world’s wisdom, and I will submit myself to his verdict.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520204.html'
source_title="Letter 204, Section 5"
