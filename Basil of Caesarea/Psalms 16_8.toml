[[commentary]]
quote='''
And, in short, I perceive three different dispositions which by inevitable necessity lead us to obey. Either through fear of punishment we turn away from that which is evil, and so are of a slavish disposition; or, seeking to profit by the reward, we fulfil the commandments for the sake of our own benefit, and are accordingly like hirelings; or else we do good for the sake of the good itself and from love of Him Who gave us the law, rejoicing that we are thus thought worthy to serve the glorious and great God, and so we have the disposition of sons. Nor will he who keeps the commandments from fear, and is always expecting the penalty of sloth, obey some orders and neglect others, but he will dread as equally terrible the judgment which comes upon every disobedience. Accordingly he is pronounced blessed who fears always with reverence. And he stands firm in the truth, for he can say: “I have seen God always before me, for he is on my right hand lest I should be shaken,” as never choosing to neglect anything that is right. Again, “Blessed is the man that feareth the Lord.” Why? Because “he will delight greatly in his commandments.” Wherefore it is not possible for those who fear to neglect any of God’s orders, or to perform them carelessly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Preface"

[[commentary]]
quote='''
He teaches us hereby to keep ever before us as the aim of the work set us the will of Him Who gave the order, and to direct our efforts towards Him, as also He says elsewhere: “I am come down from heaven, not to do mine own will, but the will of the Father that sent me.” For as the arts of daily life, having set before themselves certain proper objects, accommodate their particular activities in accordance with these, so also, as there is one rule and canon prescribed for our works, to fulfil God’s commandments in a manner pleasing to Him, it is impossible for our work to be carefully done unless it is performed in accordance with the will of Him Who has prescribed it. But in the careful endeavour to do our work as God wills we shall be joined to God in memory. For just as a smith in making, say, an axe, mindful of the man who set the task and having him always in his thoughts, plans the right shape and size and directs the work according to the will of him that ordered it—for if he forgets he will produce something other than or different from what he set out to make—so also the Christian, directing all his energies small and great to the fulfilment of God’s will, at one and the same time accomplishes the work carefully and preserves the intention of Him Who gave the order and fulfils what was said: “I have seen the Lord always before me, for he is on my right hand, lest I be shaken.” And he performs what is commanded: “Whether ye eat or drink, or whatever ye do, do all to the glory of God.” But if anyone corrupts the exactness of the commandment in doing it, clearly his memory of God is weakened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 5"
