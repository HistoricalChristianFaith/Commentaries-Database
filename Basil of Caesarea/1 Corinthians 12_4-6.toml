[[commentary]]
quote='''
God works the differences of operations, and the Lord the diversities of administrations, but all the while the Holy Spirit is present too of His own will, dispensing distribution of the gifts according to each recipient's worth. For, it is said, "there are diversities of gifts, but the same Spirit; and differences of administrations, but the same Lord; and there are diversities of operations, but it is the same God which worketh all in all." "But all these," it is said, "worketh that one and the self-same Spirit, dividing to every man severally as He will." It must not however be supposed because in this passage the apostle names in the first place the Spirit, in the second the Son, and in the third God the Father, that therefore their rank is reversed. The apostle has only started in accordance with our habits of thought; for when we receive gifts, the first that occurs to us is the distributer, next we think of the sender, and then we lift our thoughts to the fountain and cause of the boons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 16"
