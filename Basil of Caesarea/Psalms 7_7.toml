[[commentary]]
quote='''
‘And a congregation of people shall surround thee.’ It is evident that, if one unjust man is chastened, many will be converted. Punish, therefore, the wickedness of this man, in order that a great congregation of people may surround You. ‘And for their sakes return thou on high.’ For the sake of the congregation surrounding You, which You acquired by Your condescension through grace and by Your Incarnation, return to the heights of glory, which You had before the world was made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
