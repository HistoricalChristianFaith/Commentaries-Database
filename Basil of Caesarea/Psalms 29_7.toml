[[commentary]]
quote='''
And let no one suppose it to be a thing incredible that the brightness of the light is one thing, and the body which is its material vehicle is another. First, in all composite things, we distinguish substance susceptible of quality, and the quality which it receives. The nature of whiteness is one thing, another is that of the body which is whitened; thus the natures differ which we have just seen reunited by the power of the Creator. And do not tell me that it is impossible to separate them. Even I do not pretend to be able to separate light from the body of the sun; but I maintain that that which we separate in thought, may be separated in reality by the Creator of nature. You cannot, moreover, separate the brightness of fire from the virtue of burning which it possesses; but God, who wished to attract His servant by a wonderful sight, set a fire in the burning bush, which displayed all the brilliancy of flame while its devouring property was dormant. It is that which the Psalmist affirms in saying “The voice of the Lord divideth the flames of fire.” Thus, in the requital which awaits us after this life, a mysterious voice seems to tell us that the double nature of fire will be divided; the just will enjoy its light, and the torment of its heat will be the torture of the wicked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25206-The%2520Creation%2520of%2520Luminous%2520Bodies.html'
source_title="The Hexaemeron, Homily 6: The Creation of Luminous Bodies"

[[commentary]]
quote='''
‘The voice of the Lord divideth the flame of fire.’ According to the story of the three children in Babylon the flame of fire was divided, when the furnace poured forth the fire forty-nine cubits high and burned up all those around; but, the flame, divided by the command of God, admitted the wind within itself, providing for the boys a most pleasant breeze and coolness as in the shade of plants in a tranquil spot. For, it was, it is said, ‘like the blowing of a wind bringing dew.’ And it is far more wonderful for the element of fire to be divided than for the Red Sea to be separated into parts. Nevertheless, the voice of the Lord divides the continuity and unity in the nature of fire. Although fire seems to human intelligence to be incapable of being cut or divided, yet by the command of the Lord it is cut through and divided. I believe that the fire prepared in punishment for the devil and his angels is divided by the voice of the Lord, in order that, since there are two capacities in fire, the burning and the illuminating, the fierce and punitive part of the fire may wait for those who deserve to burn, while its illuminating and radiant part may be allotted for the enjoyment of those who are rejoicing. Therefore, the voice of the Lord divideth the fire and allots it, so that the fire of punishment is darksome, but the light of the state of rest remains incapable of burning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"
