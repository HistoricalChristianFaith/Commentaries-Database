[[commentary]]
quote='''
The motive follows which caused the lights to be created. It was to illuminate the earth. Already light was created; why therefore say that the sun was created to give light? And, first, do not laugh at the strangeness of this expression. We do not follow your nicety about words, and we trouble ourselves but little to give them a harmonious turn. Our writers do not amuse themselves by polishing their periods, and everywhere we prefer clearness of words to sonorous expressions. See then if, by this expression “to light up,” the sacred writer sufficiently made his thought understood. He has put “to give light” instead of “illumination.” Now there is nothing here contradictory to what has been said of light. Then the actual nature of light was produced: now the sun’s body is constructed to be a vehicle for that original light. A lamp is not fire. Fire has the property of illuminating, and we have invented the lamp to light us in darkness. In the same way, the luminous bodies have been fashioned as a vehicle for that pure, clear, and immaterial light. The Apostle speaks to us of certain lights which shine in the world without being confounded with the true light of the world, the possession of which made the saints luminaries of the souls which they instructed and drew from the darkness of ignorance. This is why the Creator of all things, made the sun in addition to that glorious light, and placed it shining in the heavens.

And let no one suppose it to be a thing incredible that the brightness of the light is one thing, and the body which is its material vehicle is another. First, in all composite things, we distinguish substance susceptible of quality, and the quality which it receives. The nature of whiteness is one thing, another is that of the body which is whitened; thus the natures differ which we have just seen reunited by the power of the Creator. And do not tell me that it is impossible to separate them. Even I do not pretend to be able to separate light from the body of the sun; but I maintain that that which we separate in thought, may be separated in reality by the Creator of nature. You cannot, moreover, separate the brightness of fire from the virtue of burning which it possesses; but God, who wished to attract His servant by a wonderful sight, set a fire in the burning bush, which displayed all the brilliancy of flame while its devouring property was dormant. It is that which the Psalmist affirms in saying “The voice of the Lord divideth the flames of fire.” Thus, in the requital which awaits us after this life, a mysterious voice seems to tell us that the double nature of fire will be divided; the just will enjoy its light, and the torment of its heat will be the torture of the wicked.

In the revolutions of the moon we find a new proof of what we have advanced. When it stops and grows less it does not consume itself in all its body, but in the measure that it deposits or absorbs the light which surrounds it, it presents to us the image of its decrease or of its increase. If we wish an evident proof that the moon does not consume its body when at rest, we have only to open our eyes. If you look at it in a cloudless and clear sky, you observe, when it has taken the complete form of a crescent, that the part, which is dark and not lighted up, describes a circle equal to that which the full moon forms. Thus the eye can take in the whole circle, if it adds to the illuminated part this obscure and dark curve. And do not tell me that the light of the moon is borrowed, diminishing or increasing in proportion as it approaches or recedes from the sun. That is not now the object of our research; we only wish to prove that its body differs from the light which makes it shine. I wish you to have the same idea of the sun; except however that the one, after having once received light and having mixed it with its substance, does not lay it down again, whilst the other, turn by turn, putting off and reclothing itself again with light, proves by that which takes place in itself what we have said of the sun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25206-The%2520Creation%2520of%2520Luminous%2520Bodies.html'
source_title="The Hexaemeron, Homily 6: The Creation of Luminous Bodies"
