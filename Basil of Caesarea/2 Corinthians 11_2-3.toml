[[commentary]]
quote='''
What then says the conductor of the bride, the divine and blessed Paul, both that one of old, and the later one of to-day under whose mediation and instruction you left your father’s house and were united to the Lord? Might not either, in sorrow for such a trouble, say, “The thing which I greatly feared is come upon me, and that which I was afraid of is come unto me.” “I have espoused you to one husband that I may present you as a chaste virgin to Christ.” I was indeed ever afraid “lest by any means as the serpent beguiled Eve through his subtilty, so your mind should be corrupted;” wherefore by countless counter-charms I strove to control the agitation of your senses, and by countless safeguards to preserve the bride of the Lord. So I continually set forth the life of the unmarried maid, and described how “the unmarried” alone “careth for the things of the Lord, that she may be holy both in body and spirit.” I used to describe the high dignity of virginity, and, addressing you as a temple of God, used as it were to give wings to your zeal as I strove to lift you to Jesus. Yet through fear of evil I helped you not to fall by the words “if any man defile the temple of God, him shall God destroy.” So by my prayers I tried to make you more secure, if by any means “your body, soul, and spirit might be preserved blameless unto the coming of our Lord Jesus Christ.” Yet all my toil on your behalf has been in vain. Bitter to me has been the end of those sweet labours. Now I needs must groan again at that over which I ought to have rejoiced. You have been deceived by the serpent more bitterly than Eve; and not only your mind but also your body has been defiled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252046.html'
source_title="Letter 46, Section 3"
