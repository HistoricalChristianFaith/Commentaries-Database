[[commentary]]
quote='''
‘Come ye to him and be enlightened: and your faces shall not be confounded.’ He urges those who sit in darkness and in the shadow of death to come to the Lord and to approach the rays of His Godhead, in order that, illuminated with the truth by this nearness, they may through grace take His light unto themselves. As the present sensible light does not appear equally to all, but to those who have eyes and are awake and able to enjoy the presence of the sun without any obstacle, so also the Sun of justice, ‘the true light that enlightens every man who comes into the world,’ does not bestow His brightness on all, but on those who live in a manner worthy of Him. ‘Light,’ it is said, ‘is risen,’ not to the sinner, but ‘to the just.’ For, as the sun is risen, but not for the bats nor for any other creatures that feed by night, so also the light is by its own nature bright and capable of brightening. However, all do not share in its brightness. Thus also, ‘Everyone who does evil hates the light and does not come to the light, that his deeds may not be exposed.’ ‘Come ye, therefore, to him and be enlightened: and your faces shall not be confounded.’ Blessed is he, who on the day of the righteous judgment of God, when the Lord comes to bring to light the things hidden in darkness and to make manifest the counsels of hearts, has dared to be subjected to that light of scrutiny and has returned without cause for shame because of a conscience undefiled by evil deeds. They, indeed, who do evil deeds will rise to reproach and to shame, beholding in themselves the ugliness and the likenesses of their sins. And, perhaps, that shame with which the sinners are going to live forever will be more fearful than the darkness and the eternal fire, since they have always in their eyes the traces of sin in their flesh like certain indelible stains, which remain perpetually in the memory of their soul. Yet, it is the privilege of few to approach to the true Light and to reveal the things hidden and after the revelation to go away with face not confounded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
