[[commentary]]
quote='''
‘The queen stood on thy right hand, arrayed in gilded clothing, embroidered with varied colors.’ Now he is speaking about the Church, about which we have learned in the Canticle that it is the one perfect dove of Christ, which admits those who are known for their good works to the right side of Christ, separating them from the bad, just as the shepherd separates the sheep from the goats. Therefore, the queen, that is, the soul which is joined with the Word, its Bridegroom, not subjected by sin but sharing the kingdom of Christ, stands on the right hand of the Savior in gilded clothing, that is to say, adorning herself charmingly and religiously with spiritual doctrines, interwoven and varied. Since, however, the teachings are not simple, but varied and manifold, and embrace words, moral and natural and the so-called esoteric, therefore, the Scripture says that the clothing of the bride is varied.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252044.html'
source_title="Homily on Psalm 44"
