[[commentary]]
quote='''
Do you call the Spirit a servant? But, it is said, "the servant knoweth not what his Lord doeth," and yet the Spirit knoweth the things of God, as "the spirit of man that is in him."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 19"
