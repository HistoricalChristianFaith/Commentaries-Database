[[commentary]]
quote='''
And so says Isaiah;—"He that spread forth the earth and that which cometh out of it; he that giveth breath unto the people upon it, and Spirit to them that trample on it"; for they that trample down earthly things and rise above them are borne witness to as worthy of the gift of the Holy Ghost. What then ought to be thought of Him whom the world cannot receive, and Whom saints alone can contemplate through pureness of heart? What kind of honours can be deemed adequate to Him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 22"
