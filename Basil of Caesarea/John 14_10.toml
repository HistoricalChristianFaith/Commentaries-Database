[[commentary]]
quote='''
Worshipping as we do God of God, we both confess the distinction of the Persons, and at the same time abide by the Monarchy. We do not fritter away the theology in a divided plurality, because one Form, so to say, united in the invariableness of the Godhead, is beheld in God the Father, and in God the Only begotten. For the Son is in the Father and the Father in the Son; since such as is the latter, such is the former, and such as is the former, such is the latter; and herein is the Unity. So that according to the distinction of Persons, both are one and one, and according to the community of Nature, one. How, then, if one and one, are there not two Gods? Because we speak of a king, and of the king's image, and not of two kings. The majesty is not cloven in two, nor the glory divided. The sovereignty and authority over us is one, and so the doxology ascribed by us is not plural but one; because the honour paid to the image passes on to the prototype. Now what in the one case the image is by reason of imitation, that in the other case the Son is by nature; and as in works of art the likeness is dependent on the form, so in the case of the divine and uncompounded nature the union consists in the communion of the Godhead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 18"
