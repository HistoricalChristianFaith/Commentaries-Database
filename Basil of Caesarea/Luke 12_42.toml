[[commentary]]
quote='''
And if through ignorance a stranger addresses his questions to another, even if he who is directly questioned is able to answer fully, let him nevertheless keep silence for the sake of discipline, and let him point out the monk who is entrusted with this duty, as the apostles did in the presence of the Lord, so that speech may be used in an orderly and becoming manner. For if, where bodily healing is concerned, it is not every man’s duty to apply drugs or the knife to the sick, but the duty of him who has acquired the art by spending a long period of time and by experience and practical work and the teaching of skilled exponents, how can it be right that just any one should hasten to heal by the word? Wherein the slightest error brings the greatest harm. Where even the distribution of bread is not entrusted to chance comers but such ministry is assigned to one man entrusted with it after full consideration, among such men how is it not much more necessary that spiritual food be brought to those who ask it with care and circumspection by one of those best qualified? So that it argues no ordinary arrogance if, when a man is asked about the judgment of God, he dares to answer boldly and casually instead of referring to him who has been entrusted with the ministration of the word, who because he is absolutely faithful and a wise steward has been chosen to give our spiritual food in due season and to administer his words in judgment, as Scripture says.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 45"
