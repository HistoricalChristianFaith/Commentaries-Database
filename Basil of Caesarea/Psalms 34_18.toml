[[commentary]]
quote='''
‘The Lord is nigh unto them that are of a contrite heart: and he will save the humble of spirit.’ By His goodness He is near to all; but, we go far away through sin. ‘For behold,’ he says, ‘they that go far from thee shall perish.’ Therefore, Moses is said to approach to God; and, if anyone else is like him through manly deeds and good actions he comes near to God. These words hold openly the prophecy of the coming of the Lord and are in agreement with the preceding. For, there it was said: ‘The countenance of the Lord is against them that do evil things’; that is, His appearance in the judgment will be for the destruction of all evil. ‘The Lord is nigh unto them that are of a contrite heart.’ He announces beforehand the coming of the Lord in the flesh, which is already near at hand and not far distant. Let this saying from the prophecy of Isaia be trustworthy to you: ‘The spirit of the Lord is upon me, because the Lord hath anointed me: he hath sent me to preach to the meek, to heal the contrite of heart, to preach release to the captives and sight to the blind.’ Since, indeed, as a doctor he was sent to the contrite of heart, he says, ‘The Lord is near,’ I say to you, lowly and contrite in spirit, cheering you and leading you on to patience in the joy of what is expected. Contrition of heart is the destruction of human reckonings.

He who has despised present things and has given himself to the word of God, and is using his mind for thoughts which are above man and are more divine, he would be the one who has a contrite heart and has made it a sacrifice which is not despised by the Lord. For, ‘a contrite and humbled heart, O God, thou wilt not despise.’ Therefore, ‘the Lord is nigh unto them that are of a contrite heart: and he will save the humble of spirit.’ He who has no vanity and is not proud of anything human, he is the one who is contrite in heart and humble of spirit. He is humble also, who is walking in sin, because sin is of all things most humiliating. Wherefore, we say that she is humbled who is corrupted and has lost the holiness of virginity. So, Amnon, it is said, rising up against Thamar ‘humbled’ her. Those, then, who have destroyed the majesty and elevation of their soul, being cast down to the earth by sin and beaten flat, as it were, are bent over, crawling along like the serpent, absolutely unable to be restored; these, in truth, are humbled, but not in spirit; for, their humility is not praiseworthy. But, whoever, having the gift of the Holy Spirit, willingly humble themselves under their inferiors, saying according to the Apostle that they are the servants of those in Christ, and ‘the offscouring of all, even until now,’ and again, ‘We have become as the refuse of this world,’ these use humility in a spiritual way, making themselves the last of all, in order that they may be first in the kingdom of heaven. The Lord also proclaims them blessed, saying: ‘Blessed are the poor in spirit.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
