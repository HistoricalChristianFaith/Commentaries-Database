[[commentary]]
quote='''
We have said above that the law is the cultivator and nurseryman of those powers which have been implanted in us from the beginning like seeds. But since we have been commanded to love our neighbour as ourselves, let us learn whether we have power from God to fulfil this commandment too. Who does not know that man is a tame and sociable animal, and not a solitary and fierce one? For nothing is so characteristic of our nature as to associate with one another, to need one another, and to love our kind. So the Lord Himself first gave us the seeds of these things, and accordingly demands their fruits, saying: “A new commandment I give unto you, that ye love one another.” And wishing to stir up our souls to keep this commandment, He demanded as a proof that we are His disciples, not signs and marvellous works—and yet He bestowed the working of these too in the Holy Spirit—but what says He? “By this shall all men know that ye are my disciples, if ye have love one towards another.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 3"
