[[commentary]]
quote='''
‘My help is from God.’ In wars those who are fighting rightly seek aid against the attacks of their opponents. And so here he who is aware of invisible enemies and who sees the danger near him from enemies encamped around him says: ‘My help is not from wealth nor from corporal resources nor from my own power and strength nor from human ties of kinship, but “My help is from God.”’ What assistance the Lord sends to those who fear Him, we have learned elsewhere in a psalm which says: ‘The angel of the Lord shall encamp round about them that fear him: and shall deliver them.’ And in another place: ‘The angel who has delivered me.’

‘Who saveth the upright of heart.’ He is upright in heart who does not have his mind inclined to excess nor to deficiency, but directs his endeavors toward the mean of virtue. He who has turned aside from valor to something less is perverted through cowardice; but, he who has strained on to greater things inclines toward temerity. Therefore, the Scripture calls those ‘crooked’ who go astray from the mean by excess or by deficiency. For, as a line becomes crooked when its straightforward direction is deflected, now convexly, now concavely, so also a heart becomes crooked when it is at one time exalted through boastfulness, at another dejected through afflictions and humiliations. Wherefore Ecclesiastes says: ‘The perverted will not be kept straight.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
