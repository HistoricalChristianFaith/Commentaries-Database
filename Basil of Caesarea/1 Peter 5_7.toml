[[commentary]]
quote='''
Do not lament over a responsibility transcending your strength. If you had been destined to bear the burden unaided, it would have been not merely heavy; it would have been intolerable. But if the Lord shares the load with you, “cast all your care upon the Lord” and He will Himself act.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520161.html'
source_title="Letter 161, Section 2"
