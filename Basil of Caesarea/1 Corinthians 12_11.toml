[[commentary]]
quote='''
Now the proper way to direct our investigation seems to me to be as follows. We say that every good thing, which by God’s providence befalls us, is an operation, of the Grace which worketh in us all things, as the apostle says, “But all these worketh that one and the self same Spirit dividing to every man severally as he will.” If we ask, if the supply of good things which thus comes to the saints has its origin in the Holy Ghost alone, we are on the other hand guided by Scripture to the belief that of the supply of the good things which are wrought in us through the Holy Ghost, the Originator and Cause is the Only-begotten God; for we are taught by Holy Scripture that “All things were made by Him,” and “by Him consist.” When we are exalted to this conception, again, led by God-inspired guidance, we are taught that by that power all things are brought from non-being into being, but yet not by that power to the exclusion of origination. On the other hand there is a certain power subsisting without generation and without origination, which is the cause of the cause of all things. For the Son, by whom are all things, and with whom the Holy Ghost is inseparably conceived of, is of the Father. For it is not possible for any one to conceive of the Son if he be not previously enlightened by the Spirit. Since, then, the Holy Ghost, from Whom all the supply of good things for creation has its source, is attached to the Son, and with Him is inseparably apprehended, and has Its being attached to the Father, as cause, from Whom also It proceeds; It has this note of Its peculiar hypostatic nature, that It is known after the Son and together with the Son, and that It has Its subsistence of the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252038.html'
source_title="Letter 38, Section 4"
