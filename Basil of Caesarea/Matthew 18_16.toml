[[commentary]]
quote='''
At this point we must allow the profession of virginity, since it is now valid and takes place with the person’s own consent and judgment, reason being fully developed. Henceforward rewards and punishments are awarded by the righteous Judge to the virtuous and sinners according to their desert. We should bring in the Church authorities as witnesses of their consent, so that by their means the consecration of the body may be hallowed as an offering to God, and their witness may confirm the event. “For in the mouth of two or three witnesses shall every word be established.” For thus the zeal of the brethren will avoid calumnies, and those who after making a profession try to annul it will be given no loophole for shameless conduct.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 15"

[[commentary]]
quote='''
But gravity and restraint will be required to be manifest in every respect in those who are chosen to see one another and take counsel about what is pleasing to God both as regards bodily needs and the care of souls. Let there be not less than two on each side; for one person is readily exposed to suspicion, to put it no stronger, and is powerless to confirm a conversation, as indeed the Scripture says that at the mouth of two or three every word is established. There should not be more than three lest the zeal for industry undertaken because of the commandment of our Lord Jesus Christ be impaired.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 33"
