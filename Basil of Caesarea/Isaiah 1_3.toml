[[commentary]]
quote='''
If even among the barbarians harmony is maintained through subjection to a single leader, what should we think of the disharmony among us and our failure to be subject to the Lord's commands? We should realize that our good God gives us examples to teach us and lead us to conversion. On the great and awesome day of judgment he will use them as a demonstration of the shame and condemnation of those who have not heeded his instruction. He has already said, and he continues to say, "The ox knows his owner and the donkey his master's manger; but Israel has not known me, and my people have not understood."
'''
source_url=''
source_title="PREFACE ON THE JUDGMENT OF GOD 7"

[[commentary]]
quote='''
But a benefactor ranks higher than those who are loved by natural impulse. And this trait, attachment to those who have given some good, is characteristic not only of men but also of nearly all animals. “The ox knoweth his master, and the ass his lord’s crib.” God forbid that the next words should be said of us: “but Israel doth not know me, and my people did not understand.” As for the dog and many similar animals, I need not say what great goodwill they show towards those that feed them. But if we naturally choose goodwill and affection towards our benefactors, and endure every labour in order to recompense them for what they have already done; what words can worthily describe the gifts of God, which are so many as to be innumerable, and so excellent that one alone is sufficient to make us render all thanks to the Giver?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 2"

[[commentary]]
quote='''
How was God known in Jewry? Was it because in Jewry it was known what His essence is? “The ox,” it is said, “knoweth his owner.” According to your argument the ox knows his lord’s essence. “And the ass his master’s crib.” So the ass knows the essence of the crib, but “Israel doth not know me.” So, according to you, Israel is found fault with for not knowing what the essence of God is. “Pour out thy wrath upon the heathen that have not known thee,” that is, who have not comprehended thy essence. But, I repeat, knowledge is manifold—it involves perception of our Creator, recognition of His wonderful works, observance of His commandments and intimate communion with Him. All this they thrust on one side and force knowledge into one single meaning, the contemplation of God’s essence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520235.html'
source_title="Letter 235, Section 3"
