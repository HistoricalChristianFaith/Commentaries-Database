[[commentary]]
quote='''
Accordingly perfect renunciation consists in a man’s attaining complete impassivity as regards actual living and having “the sentence of death,” so as to put no confidence in himself. Whereas its beginnings consist of alienation from external things, such as possessions, vainglory, the common customs of life, or attachment to useless things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 8"
