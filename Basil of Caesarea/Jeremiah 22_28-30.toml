[[commentary]]
quote='''
As to Jeconias, whom the prophet Jeremiah declares in these words to have been rejected from the land of Judah, “Jeconias was dishonoured like a vessel for which there is no more use; and because he was cast out he and his seed; and none shall rise from his seed sitting upon the throne of David and ruling in Judah,” the matter is plain and clear. On the destruction of Jerusalem by Nebuchadnezzar, the kingdom had been destroyed, and there was no longer an hereditary succession of reigns as before. Nevertheless, at that time, the deposed descendants of David were living in captivity. On the return of Salathiel and Zerubbabel the supreme government rested to a greater degree with the people, and the sovereignty was afterwards transferred to the priesthood, on account of the intermingling of the priestly and royal tribes; whence the Lord, in things pertaining to God, is both King and High Priest. Moreover, the royal tribe did not fail until the coming of the Christ; nevertheless, the seed of Jeconias sat no longer upon the throne of David. Plainly it is the royal dignity which is described by the term “throne.” You remember the history, how all Judæa, Idumæa, Moab, both the neighbouring regions of Syria and the further countries up to Mesopotamia, and the country on the other side as far as the river of Egypt, were all tributary to David. If then none of his descendants appeared with a sovereignty so wide, how is not the word of the prophet true that no one of the seed of Jeconias should any longer sit upon the throne of David, for none of his descendants appears to have attained this dignity. Nevertheless, the tribe of Judah did not fail, until He for whom it was destined came. But even He did not sit upon the material throne. The kingdom of Judæa was transferred to Herod, the son of Antipater the Ascalonite, and his sons who divided Judæa into four principalities, when Pilate was Procurator and Tiberius was Master of the Roman Empire. It is the indestructible kingdom which he calls the throne of David on which the Lord sat. He is the expectation of the Gentiles and not of the smallest division of the world, for it is written, “In that day there shall be a root of Jesse which shall stand for an ensign of the people; to it shall the Gentiles seek.” “I have called thee…for a covenant of the people for a light of the Gentiles”; and thus then God remained a priest although He did not receive the sceptre of Judah, and King of all the earth; so the blessing of Jacob was fulfilled, and in Him “shall all the nations of the earth be blessed,” and all the nations shall call the Christ blessed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520236.html'
source_title="Letter 236, Section 3"
