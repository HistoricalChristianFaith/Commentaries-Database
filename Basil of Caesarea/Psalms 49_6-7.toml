[[commentary]]
quote='''
‘They that trust in their own strength, and glory in the multitude of their riches.’ This sentence is directed by the prophet to two types of persons: to the earthborn and to the rich. He speaks to the first to overthrow their false notions due to their power; to the second, their pride due to the abundance of their possessions. You, he says, who trust in your own strength. These are the earthborn, who put their trust in strength of body and believe that human nature is sufficient for ably accomplishing what they wish. And you, he says, who trust in the uncertainty of riches, listen. You have need of ransoms that you may be transferred to the freedom of which you were deprived when conquered by the power of the devil, who taking you under his control, does not free you from his tyranny until, persuaded by some worthwhile ransom, he wishes to exchange you. And the ransom must not be of the same kind as the things which are held in his control, but must differ greatly, if he would willingly free the captives from slavery. Therefore, a brother is not able to ransom you. For, no man can persuade the devil to remove from his power him who has once been subject to him, not he, at any rate, who is incapable of giving God a propitiatory offering even for his own sins. How, then, will he have power to do this for the other? And what could he possess so great in this world that he would have a sufficient exchange price for a soul which is precious by nature, since it was made according to the image of its Creator? What labor of the present age is sufficient for the human soul as a means and provisions for the future life?

So far we have considered these things rather simply. Even if he seems to be one of the very powerful men in this life, even if he is surrounded with a great number of possessions, these words teach him to descend from such a notion and to humble himself under the mighty hand of God, not to trust to a reputed power, and not to glory in the multitude of his riches. Nevertheless, it is possible to mount a little higher in thought, and for those who are trusting in their own power and those glorying in the multitude of their riches to take thought concerning the powers of the soul, inasmuch as not even the soul is complete in itself for salvation. For, if there should be anyone perfect among the sons of men, if the wisdom of God is lacking, he will be reputed as nothing. Even if he will have acquired for himself a multitude of theories from the wisdom of the world, and have obtained by lot some wealth of knowledge, let him hear the whole truth of the matter: that every human soul has bowed down under the evil yoke of slavery imposed by the common enemy of all and, being deprived of the very freedom which it received from the Creator, has been led captive through sin. Every captive has need of ransoms for his freedom. Now, neither a brother can ransom his brother, nor can anyone ransom himself, because he who is ransoming must be much better than he who has been overcome and is now a slave. But, actually, no man has the power with respect to God to make atonement for a sinner, since he himself is liable for sin. ‘All have sinned and have need of the glory of God. They are justified freely by his grace through the redemption which is in Christ Jesus’ our Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
