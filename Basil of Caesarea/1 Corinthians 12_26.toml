[[commentary]]
quote='''
For these reasons now we turn our eyes to you, right honourable brethren. In many an hour of our affliction we have expected that you would be at our side; and disappointed in that hope we have said to ourselves, “I looked for some to take pity and there was none; and for comforters but I found none.” Our sufferings are such as to have reached the confines of the empire; and since, when one member suffers, all the members suffer, it is doubtless right that your pity should be shown to us who have been so long in trouble. For that sympathy, which we have hoped you of your charity feel for us, is caused less by nearness of place than by union of spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520242.html'
source_title="Letter 242, Section 1"
