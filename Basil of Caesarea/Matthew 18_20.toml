[[commentary]]
quote='''
Should some find themselves at a distance owing to the nature of the work or the locality, they must of necessity observe the common ordinances there without any hesitation, “for where two or three are gathered together in my name, there am I in the midst of them.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 37"

[[commentary]]
quote='''
I am living, O evil thought, in the desert in which the Lord lived. Here is the oak of Mamre; here is the ladder going up to heaven, and the stronghold of the angels which Jacob saw; here is the wilderness in which the people purified received the law, and so came into the land of promise and saw God. Here is Mount Carmel where Elias sojourned and pleased God. Here is the plain whither Esdras withdrew, and at God’s bidding uttered all the God inspired books. Here is the wilderness in which the blessed John ate locusts and preached repentance to men. Here is the Mount of Olives, whither Christ came and prayed, and taught us to pray. Here is Christ the lover of the wilderness, for He says “Where two or three are gathered together in my name there am I in the midst of them.” “Here is the strait and narrow way which leadeth unto life.” Here are the teachers and prophets “wandering in deserts and in mountains and in dens and caves of the earth.” Here are apostles and evangelists and solitaries’ life remote from cities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 5"

[[commentary]]
quote='''
I know perfectly well that I stand more in need of the succour of each of the brethren than one hand does of the other. Truly, from our own bodily constitution, the Lord has taught us the necessity of fellowship. When I look to these my limbs and see that no one of them is self-sufficient, how can I reckon myself competent to discharge the duties of life? One foot could not walk securely without the support of the other; one eye could not see well, were it not for the alliance of the other and for its being able to look at objects in conjunction with it. Hearing is more exact when sound is received through both channels, and the grasp is made firmer by the fellowship of the fingers. In a word, of all that is done by nature and by the will, I see nothing done without the concord of fellow forces. Even prayer, when it is not united prayer, loses its natural strength and the Lord has told us that He will be in the midst where two or three call on Him in concord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252097.html'
source_title="Letter 97"
