[[commentary]]
quote='''
But again he who loves his neighbour fulfils love towards God, since God accepts the favour as conferred on Himself. Wherefore Moses, the faithful servant of God, showed such love towards his brethren, that he chose to be blotted out of God’s book, in which he had been entered, unless the people were forgiven their sin. And Paul was bold enough to pray that he might be accursed from Christ on behalf of his brethren, kinsmen according to the flesh, wishing that he himself might be accepted as an equivalent for the salvation of all, after the pattern of the Lord. Though he knew all the time that it was impossible for a man to be alienated from God who has sacrificed the grace of God because of his love for God in order to keep the greatest of the commandments, and that for this very reason he would receive manifold more than he gave. What we have already said is abundant proof that the Saints reached this measure of love towards one’s neighbour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 3"
