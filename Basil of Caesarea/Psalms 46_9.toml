[[commentary]]
quote='''
‘He shall destroy the bow, and break the weapons; and the shield he shall burn in the fire.’ Do you see the peaceful spirit of the Lord of armies, that He has with Him invisible forces of angelic hosts? Do you see the courage and at the same time the kindliness of the Commander in chief of the armies? Though He is indeed the Lord of armies and has all the companies of angelic hosts, nowhere does He slay any one of the enemies, He overthrows no one, He touches no one; but, He destroys the bows and the weapons, and the shields He burns in the fire. He destroys the bow so that no longer will the burnt missiles be thrown among them, and He will break the weapons, those with which they fight hand to hand, so that those near at hand cannot be plotted against and wounded. And the shields He will burn in the fire, stripping the adversaries of their defenses and doing all things in kindness to the enemy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252045.html'
source_title="Homily on Psalm 45"
