[[commentary]]
quote='''
We have learnt from the Apostle, "the Lord direct your hearts into the love of God and into the patient waiting for Christ" for our tribulations. Who is the Lord that directs into the love of God and into the patient waiting for Christ for tribulations? Let those men answer us who are for making a slave of the Holy Spirit. For if the argument had been about God the Father, it would certainly have said, 'the Lord direct you into His own love,' or if about the Son, it would have added 'into His own patience.' Let them then seek what other Person there is who is worthy to be honoured with the title of Lord. And parallel with this is that other passage, "and the Lord make you to increase and abound in love one toward another, and toward all men, even as we do towards you; to the end He may establish your hearts unblamable in holiness before God, even our Father, at the coming of our Lord Jesus Christ with all His saints." Now what Lord does he entreat to stablish the hearts of the faithful at Thessalonica, unblamable in holiness before God even our Father, at the coming of our Lord? Let those answer who place the Holy Ghost among the ministering spirits that are sent forth on service. They cannot.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 21"
