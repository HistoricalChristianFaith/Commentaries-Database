[[commentary]]
quote='''
‘The voice of the Lord is upon the waters.’ In many places you might find the word ‘voice’ occurring. Therefore, for the sake of understanding what the voice of the Lord is, we should gather, as far as we are able, from the divine Scripture what has been said about the voice; for instance, in the divine warning to Abraham: ‘And immediately the voice came to him: He shall not be your heir.’ And in Moses: ‘And all the people saw the voice and the flames.’ Again, in Isaia: ‘The voice of one saying: Cry.’ With us, then, voice is either air which has been struck or some form which is in the air against which he who is crying out wishes to strike. Now, what is the voice of the Lord? Would it be considered the impact on the air? Or air, which has been struck reaching the hearing of him to whom the voice comes? Or neither of these, but that this is a voice of another kind, namely, an image formed by the mind of men whom God wishes to hear His own voice, so that they have this representation corresponding to that which frequently occurs in their dreams? Indeed, just as, although the air is not struck, we keep some recollection of certain words and sounds occurring in our dreams, not receiving the voice through our hearing, but through the impression on our heart itself, so also we must believe that some such voice from God appeared in the prophets.

‘The voice of the Lord is upon the waters.’ As, indeed, in regard to the sensible creation, since the clouds, when they are full of water, produce sound and noise, striking against each other, ‘The voice’ it is said, ‘of the Lord is upon the waters.’ Then, too, if there should be the noise of waters breaking against some barrier, and if the sea, thrown into confusion by the winds, should seethe and send forth a mighty sound, these inanimate creatures have voice from the Lord, since Scripture shows that every creature all but cries out, proclaiming the Creator. If the thunder crashes from the clouds, we need believe only that the God of majesty has thundered and that He who by Himself preserves the moisture is the Lord.

‘The Lord is upon many waters.’ We have learned in the creation of the world that there is water above the heavens, again, water of the deep, and yet again, the gathered waters of the seas. Who, then, is He who holds together these waters, not allowing them to be borne downward by their physical weight, except the Lord who established Himself upon all things, who holds sway over the waters? Perhaps, even in a more mystic manner the voice of the Lord was upon the waters, when a voice from above came to Jesus as He was baptized, ‘This is my beloved Son.’ At that time, truly, the Lord was upon many waters, making the waters holy through baptism; but, the God of majesty thundered from above with a mighty voice of testimony. And over those to be baptized a voice left behind by the Lord is pronounced: ‘Go, therefore,’ it says, ‘baptize in the name of the Father, and of the Son, and of the Holy Spirit.’ Therefore, ‘The voice of the Lord is upon the waters.’

Thunder is produced when a dry and violent wind, closed up in the hollows of a cloud and violently hurled around in the cavities of the clouds, seeks a passage to the outside. The clouds, offering resistance under the excessive pressure produce that harsh sound from the friction of the wind. But, when, like bubbles distended by the air, they are unable to resist and endure any longer, but are violently torn apart and give the air a passage to the outer breeze, they produce the noises of the thunder. And this is wont to cause the flash of lightning. Therefore, it is the Lord who is upon the waters and who arouses the mighty noises of the thunder, causing such an exceedingly great noise in the delicate element of air. It is also possible for you, according to ecclesiastical diction to call by the name of thunder the doctrine which after baptism is in the souls of those already perfect by the eloquence of the Gospel. That the Gospel is thunder is made evident by the disciples who were given a new name by the Lord and called Sons of Thunder. Therefore, the voice of such thunder is not in any chance person, but only in one who is worthy to be called a wheel. ‘The voice of thy thunder,’ it says, ‘in a wheel.’ That is, whoever is stretching forward, like a wheel, touching the earth with a small part of itself, and really such as that wheel was, about which Ezechiel said: ‘I saw and behold there was one wheel on the earth attached to the four living creatures, and their appearance and their form was as the appearance of Tharsis.’

‘The God of majesty hath thundered, the Lord is upon many waters.’ The waters are also the saints, because rivers flow from within them, that is, spiritual teaching which refreshes the souls of the hearers. Again, they receive water which springs up to eternal life, wherefore, it becomes in those who receive it rightly ‘a fountain of water, springing up unto life everlasting.’ Upon such waters, then, is the Lord. Remember also the story of Elias, when the heavens were closed three years and six months; when, although there was clear weather on the summit of Carmel, he heard a voice of many waters; then there followed thunder coming from the clouds and water pouring down. The Lord, therefore, is upon many waters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"
