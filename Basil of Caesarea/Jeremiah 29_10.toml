[[commentary]]
quote='''
Only pray, I beseech you, that the Lord may not deliver us for aye to the enemies of the Cross of Christ, but that He will keep His Churches, until the time of that peace which the just Judge Himself knows when He will bestow. For He will bestow it. He will not always abandon us. As He limited seventy years for the period of captivity for the Israelites in punishment for their sins, so peradventure the Mighty One, after giving us up for some appointed time, will recall us once again, and will restore us to the peace of the beginning—unless indeed the apostasy is now nigh at hand, and the events that have lately happened are the beginnings of the approach of Antichrist. If this be so, pray that the good Lord will either take away our afflictions, or preserve us through our afflictions unvanquished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520264.html'
source_title="Letter 264"
