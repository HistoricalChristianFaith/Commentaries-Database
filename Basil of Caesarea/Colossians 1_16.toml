[[commentary]]
quote='''
It appears, indeed, that even before this world an order of things existed of which our mind can form an idea, but of which we can say nothing, because it is too lofty a subject for men who are but beginners and are still babes in knowledge. The birth of the world was preceded by a condition of things suitable for the exercise of supernatural powers, outstripping the limits of time, eternal and infinite. The Creator and Demiurge of the universe perfected His works in it, spiritual light for the happiness of all who love the Lord, intellectual and invisible natures, all the orderly arrangement of pure intelligences who are beyond the reach of our mind and of whom we cannot even discover the names. They fill the essence of this invisible world, as Paul teaches us. “For by him were all things created that are in heaven, and that are in earth, visible and invisible whether they be thrones or dominions or principalities or powers” or virtues or hosts of angels or the dignities of archangels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25201-In%2520the%2520Beginning%2520God%2520Made%2520the%2520Heaven%2520and%2520the%2520Earth.html'
source_title="The Hexaemeron, Homily 1: In the Beginning God Made the Heaven and the Earth"

[[commentary]]
quote='''
We are not to suppose that He used assistance in His action, or yet was entrusted with the ministry of each individual work by detailed commission, a condition distinctly menial and quite inadequate to the divine dignity. Rather was the Word full of His Father's excellences; He shines forth from the Father, and does all things according to the likeness of Him that begat Him. For if in essence He is without variation, so also is He without variation in power. And of those whose power is equal, the operation also is in all ways equal. And Christ is the power of God, and the wisdom of God. And so "all things are made through [by, A.V.] him," and "all things were created through [by, A.V.] him and for him," not in the discharge of any slavish service, but in the fulfilment of the Father's will as Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
