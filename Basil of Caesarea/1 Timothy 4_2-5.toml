[[commentary]]
quote='''
We must of necessity lay down this principle also, that continence is indispensable for those that contend for piety if they are to achieve the requisite “buffeting” of the body. For “every man that striveth in the games is temperate in all things.” But to avoid falling into the same error as the enemies of God, who are branded in their conscience as with a hot iron, and therefore abstain from meats, which God created to be received by the faithful with thanksgiving, we should taste every kind of food when opportunity is given, to show to the onlookers that to the pure all things are pure and that every creature of God is good, and nothing is to be rejected if it be received with thanksgiving; for it is sanctified through the word of God and prayer. But in so doing we must continually keep continence in mind, using the cheaper foods and bare necessaries to the extent of our need, though even in them shunning the harmfulness of satiety, and refraining entirely from what ministers to pleasure. For thus we shall extirpate the vice of voluptuaries and cure, so far as lies in us, those who are branded in their conscience with a hot iron, and free ourselves from the suspicion of falling into either extreme. “For why is my liberty judged by another conscience?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 18"
