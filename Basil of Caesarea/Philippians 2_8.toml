[[commentary]]
quote='''
What then is meant by "became subject"? What by "delivered him up for us all"? It is meant that the Son has it of the Father that He works in goodness on behalf of men. But you must hear too the words, "Christ hath redeemed us from the curse of the law;" and "while we were yet sinners, Christ died for us."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
