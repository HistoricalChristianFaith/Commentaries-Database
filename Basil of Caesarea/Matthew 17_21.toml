[[commentary]]
quote='''
Continence betokens a man who has died with Christ and mortified his members that are upon the earth. We know it to be the mother of temperance, the winner of health, the potent remover of hindrances to the bearing of good fruit in Christ. Since, as the Lord says, the cares of this world, and the pleasures of life, and the lusts of other things choke the word, and it becometh unfruitful. Even the demons flee continence, for the Lord Himself taught us that “this kind goeth not out save by prayer and fasting.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 18"
