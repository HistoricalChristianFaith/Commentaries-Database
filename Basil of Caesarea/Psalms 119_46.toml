[[commentary]]
quote='''
I think it must be added that even the commandments of the Lord cannot be performed with the intent of pleasing men. For no man turns to an inferior if he is convinced a superior is present; but, if it should happen that something is acceptable and pleasing to the more important person, but seems undesirable and reprehensible to the less important, then he values the acceptance of the superior man but disregards the censure of the inferior. But if this be the case with men, will any soul that is truly sober and healthy, convinced of the presence of God, leave off acting to please God and turn to the good opinion of men? Or will any such soul neglect God’s commandments and be enslaved to human customs or conquered by public opinion, or be talked over by dignitaries? Remember the state of mind of him who said: “The lawless spoke idle words, but not according to thy law, O Lord.” And again: “And I spoke in thy testimonies before kings and was not ashamed.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 5"
