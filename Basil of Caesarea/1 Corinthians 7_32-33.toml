[[commentary]]
quote='''
This must indeed be recognised, that we cannot succeed in keeping any commandment at all, nor in the actual love towards God and our neighbour, if our minds are wandering now in one direction, now in another. For it is impossible to gain an accurate knowledge of any art or science, if one is always starting on fresh subjects; nor even to master one, without having recognised what befits the end in view. For it is necessary that actions should correspond with the aim since nothing right is accomplished by inappropriate methods. It is impossible to master the smith’s art through the works of pottery; nor are athletes’ crowns won by practising the flute. But for each end a proper and fitting labour is demanded. So also we practise successfully the art of being well-pleasing to God according to Christ’s gospel, by retirement from the cares of the world and complete estrangement from distractions. Wherefore the apostle, although he had allowed marriage and deemed it worthy of blessing, contrasted its preoccupations with the cares that are concerned with God, as if the two were inconsistent, saying: “He that is unmarried is careful for the things of the Lord, how he may please the Lord: but he that is married is careful for the things of the world, how he may please his wife.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 5"
