[[commentary]]
quote='''
Further, it is useful to have a distinguishing mark in the clothes we wear, since they warn everyone, and declare in advance the profession of a godly life; so that those who meet us demand corresponding conduct. For the unfitting and disgraceful are not equally conspicuous in those one meets casually and those who make great professions. For one would not pay much attention to a plebeian or any other chance-comer whom one found giving or receiving blows in public, or uttering indecent words, or sitting in taverns, or doing any other unseemly things of this kind, since one would take such conduct as being consistent with the whole purpose of his life. But when a man has professed strictness, if he neglects his duty in the smallest particular, all men reproach him, doing as it is written—“they will turn and rend you.” So this profession by means of apparel forms a kind of discipline for the weaker brethren, so that even against their will they are kept from faults. As therefore the soldier has a distinguishing dress, the senator another, some one else another, from which their rank may as a rule be guessed, so also it is becoming and appropriate that a Christian should be distinguished by his clothing which keeps the sobriety handed down by the apostle; who now prescribes that the bishop should be orderly, now bids the women to be arrayed in orderly apparel, orderly being of course understood in relation to the special aim of Christianity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 22"
