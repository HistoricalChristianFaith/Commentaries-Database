[[commentary]]
quote='''
How is it that at first David prays to be saved from his persecutors, and then, to be delivered? An explanation will make the statement clear. ‘Save me from all them that persecute me, and deliver me, lest at any time he seize upon my soul like a lion.’ Now, what is the difference between being saved and being delivered? Properly speaking, those who are weak need safety, but those who are held in captivity need deliverance. Therefore, he who has some weakness in himself, but possesses faith in himself, is disposed by his own faith to be saved. ‘For, thy faith,’ it is said, ‘has saved thee’; and ‘So be it done to thee as thou hast believed.’ But, he who must be delivered, awaits a price which must be paid in his name from the outside. Accordingly, being under sentence of death, knowing that there is one who saves and one who delivers, ‘In thee have I put my trust,’ he says, ‘save me’ from weakness, and ‘deliver me’ from captivity. I think that the noble athletes of God, who have wrestled considerably with the invisible enemies during the whole of their lives, after they have escaped all of their persecutions and reached the end of life, are examined by the prince of the world in order that, if they are found to have wounds from the wrestling or any stains or effects of sin, they may be detained; but, if they are found unwounded and stainless, they may be brought by Christ into their rest as being unconquered and free. Therefore, he prays for his life here and for his future life. For, he says: ‘Save me’ here ‘from them that persecute me; deliver me’ there in the time of the scrutiny ‘lest at any time he seize upon my soul like a lion.’ You may learn this from the Lord Himself who said concerning the time of His passion: ‘Now the prince of this world is coming, and in me he will have nothing.’ He who had committed no sin said that he had nothing; but, for a man it will be sufficient, if he dares to say: ‘The prince of this world is coming, and in me he will have few and trivial penalties.’ And there is a danger of experiencing these penalties, unless we have some one to deliver us or to save us. For, the two tribulations set forth, two petitions are introduced. ‘Save me from the multitude of them that persecute me, and deliver me, lest at any time I be seized as if there were no one to redeem me.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
