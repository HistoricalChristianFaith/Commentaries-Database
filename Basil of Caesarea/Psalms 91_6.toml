[[commentary]]
quote='''
In the sixth hour we conclude prayer is necessary after the pattern of the Saints who said: “Evening and morning and noonday will I speak and declare and he shall hear my voice” and, that we may be delivered from mishap and the noonday demon, at the same time the ninetieth psalm is also said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 37"
