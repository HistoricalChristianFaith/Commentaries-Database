[[commentary]]
quote='''
Now what is more marvellous than the divine beauty? What thought has more charm than the magnificence of God? What yearning of the soul is so keen and intolerable as that which comes from God upon the soul which is cleansed from all evil and cries with true affection: “I am wounded with love”? Ineffable wholly and inexplicable are the flashes of the divine beauty; speech cannot express them, hearing cannot receive them. Though thou talk of the rays of the morning star, of the brightness of the moon or the light of the sun, all are worthless in comparison with its glory and fall short as far, compared with the true light, as the deep shades of a moonless night compared with the glow of the noonday sun. This beauty is unseen by fleshly eyes, and comprehended only by the soul and mind when perchance it has illumined some one of the Saints, and left in them the sting of intolerable yearning—Saints such as those who, weary of the present life, cried: “Woe is me, that my sojourning is prolonged.” “When shall I come and appear before the presence of God?” And again: “To depart and to be with Christ, which is far better.” And again: “My soul is athirst for God, the strong, the living One.” And: “Lord, now lettest thou thy servant depart.” Chafing at this life as it were a prison, those whose souls were touched by the divine yearning could thus scarce restrain their impulses. Yes, they had an insatiable desire to behold the divine beauty and prayed that their contemplation of the sweetness of the Lord might last on into life eternal. So then men are naturally desirous of beauty. But the good is properly fair and lovable. Now God is good, and all things desire good. Therefore all things desire God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 2"
