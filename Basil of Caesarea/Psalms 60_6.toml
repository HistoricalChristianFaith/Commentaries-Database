[[commentary]]
quote='''
‘God hath spoken in his holy place: I will rejoice, and I will divide Sichem.’ Sichem is a special place given by Jacob to Joseph, a type of the covenant which seems to have been presented to Israel alone. Accordingly, I shall bring this special covenant and inheritance of the people for apportionment, and I shall make it common to all the rest. Therefore, after the covenant has been divided for all, and the advantage from it has been made common to all those who are having kindness done them by God, then, too, the deep valley of the tabernacles will be measured; that is to say, the whole world, as if by certain lots, will be divided by dioceses in each place. At that time also He will join together things that are far apart, He ‘who makes peace whether on the earth or in the heavens,’ ‘and he who has broken down the intervening wall of the enclosure will make both one.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252059.html'
source_title="Homily on Psalm 59"
