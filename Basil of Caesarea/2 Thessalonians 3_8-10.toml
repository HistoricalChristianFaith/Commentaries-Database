[[commentary]]
quote='''
How great an evil is that of idleness, what need is there to tell, since the apostle plainly commands that he who does not work neither shall he eat? As then daily food is necessary to each man, equally necessary is work according to his power. For not in vain did Solomon write by way of praise: “She ate not the bread of idleness.” And again the apostle says of himself: “Neither did we eat bread for nought at any man’s hands, but in labour, and travail, working night and day,” although he had power, since he was proclaiming the Gospel, to live of the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 37"
