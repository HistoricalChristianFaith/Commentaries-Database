[[commentary]]
quote='''
In all the story of the waters remember this first order, “let the waters be gathered together.” To take their assigned places they were obliged to flow, and, once arrived there, to remain in their place and not to go farther. Thus in the language of Ecclesiastes, “All the waters run into the sea; yet the sea is not full.” Waters flow in virtue of God’s order, and the sea is enclosed in limits according to this first law, “Let the waters be gathered together unto one place.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25204-Upon%2520the%2520Gathering%2520Together%2520of%2520the%2520Waters.html'
source_title="The Hexaemeron, Homily 4: Upon the Gathering Together of the Waters"
