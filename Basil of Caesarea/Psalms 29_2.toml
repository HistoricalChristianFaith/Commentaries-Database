[[commentary]]
quote='''
‘Adore ye the Lord in his holy court.’ After the offerings requested have been brought, adoration is necessary, and an adoration which is not outside of the church, but is paid in the very court of God. ‘Do not,’ He says, ‘devise for me private courts or synagogues.’ There is only one holy court of God. The synagogue of the Jews was formerly a court, but, after the sin against Christ, their habitation was made desolate. For this reason also the Lord said: ‘And other sheep I have that are not of this fold.’ In saying that some from among the Gentiles were predestined for salvation, He shows His own court in addition to that of the Jews. Accordingly, it is not proper to adore God outside of this holy court, but only within it, lest anyone who is outside of it and is attracted by those outside of it, might lose the right to be in the court of the Lord. Many assume an attitude of prayer, but they are not in the court because of the wandering of their mind and the distraction of their thoughts coming from vain solicitude. It is possible to consider the court in a still loftier sense as the heavenly way of life. Therefore, ‘They that are planted’ here ‘in the house of the Lord,’ which is the Church of the living God, there ‘shall flourish in the courts of our God.’ But, he who makes his belly a god, or glory, or money, or anything else which he honors more than all things, neither adores the Lord, nor is in the holy court, even though he seems to be worthy of the visible assemblies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252028.html'
source_title="Homily on Psalm 28"
