[[commentary]]
quote='''
Wherefore on account of what has been said, and for many other similar reasons, it is essential that those who distribute necessaries to the brotherhood should be free absolutely from favouritism and contention. Indeed they ought to be conscious of such a disposition in themselves and to show such zeal—both they and those that perform the other works for the service of the brethren—as if they were serving not men but the Lord Himself, Who of His great goodness reckons as done unto Himself the honour and zeal shown to those who are dedicated to Him, and promises in return an inheritance in the kingdom of heaven. For He says: “Come, ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world. For inasmuch as ye did it unto one of the least of these my brethren, ye did it unto me.” And on the other hand we must recognise the peril of negligence, remembering the words: “Cursed is he that doeth the work of the Lord negligently.” Because not only are they ejected from the kingdom, but also they receive the horrible and fearful sentence of the Lord pronounced against such men: “Depart from me, ye cursed, into the eternal fire which is prepared for the devil and his angels.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 34"
