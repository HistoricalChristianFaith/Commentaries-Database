[[commentary]]
quote='''
You ought to have been all the more ready to submit yourself without difficulty to my demands, in that you allege that you are free from all bodily appetite. I do not suppose that a man of three score years and ten lives with a woman from any such feelings, and I have not decided, as I have decided, on the ground of any crime having been committed. But we have learnt from the Apostle, not to put a stumbling block or an occasion to fall in a brother’s way;” and I know that what is done very properly by some, naturally becomes to others an occasion for sin. I have therefore given my order, in obedience to the injunction of the holy Fathers, that you are to separate from the woman.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252055.html'
source_title="Letter 55"
