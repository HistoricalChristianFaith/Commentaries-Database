[[commentary]]
quote='''
The Holy Spirit, too, is numbered with the Father and the Son, because He is above creation, and is ranked as we are taught by the words of the Lord in the Gospel, “Go and baptize in the name of the Father and of the Son and of the Holy Ghost.” He who, on the contrary, places the Spirit before the Son, or alleges Him to be older than the Father, resists the ordinance of God, and is a stranger to the sound faith, since he fails to preserve the form of doxology which he has received, but adopts some new fangled device in order to be pleasing to men. It is written “The Spirit is of God,” and if He is of God, how can He be older than that of which He is? And what folly is it not, when there is one Unbegotten, to speak of something else as superior to the Unbegotten? He is not even anterior, for nothing intervenes between Son and Father. If, however, He is not of God but is through Christ, He does not even exist at all. It follows, that this new invention about the order really involves the destruction of the actual existence, and is a denial of the whole faith. It is equally impious to reduce Him to the level of a creature, and to subordinate Him either to Son or to Father, either in time or in rank.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252052.html'
source_title="Letter 52, Section 4"

[[commentary]]
quote='''
And it is not from this source alone that our proofs of the natural communion are derived, but from the fact that He is moreover said to be "of God;" not indeed in the sense in which "all things are of God," but in the sense of proceeding out of God, not by generation, like the Son, but as Breath of His mouth. But in no way is the "mouth" a member, nor the Spirit breath that is dissolved; but the word "mouth" is used so far as it can be appropriate to God, and the Spirit is a Substance having life, gifted with supreme power of sanctification. Thus the close relation is made plain, while the mode of the ineffable existence is safeguarded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 18"

[[commentary]]
quote='''
Now it is urged that the Spirit is in us as a gift from God, and that the gift is not reverenced with the same honour as that which is attributed to the giver. The Spirit is a gift of God, but a gift of life, for the law of "the Spirit of life," it is said, "hath made" us "free;" and a gift of power, for "ye shall receive power after that the Holy Ghost is come upon you." Is He on this account to be lightly esteemed? Did not God also bestow His Son as a free gift to mankind? "He that spared not His own Son," it is said, "but delivered Him up for us all, how shall He not with Him also freely give us all things?" And in another place, "that we might truly know the things that are freely given us of God," in reference to the mystery of the Incarnation. It follows then that the maintainers of such arguments, in making the greatness of God's loving kindness an occasion of blasphemy, have really surpassed the ingratitude of the Jews. They find fault with the Spirit because He gives us freedom to call God our Father. "For God hath sent forth the Spirit of His Son into" our "hearts crying Abba, Father," that the voice of the Spirit may become the very voice of them that have received him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 24"
