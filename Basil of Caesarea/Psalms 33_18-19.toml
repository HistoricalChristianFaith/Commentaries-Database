[[commentary]]
quote='''
‘And on them who hope in his mercy.’ The humility of those who serve the Lord indicates how they hope in His mercy. He who does not trust in his own good deeds nor expects to be justified by his works has, as his only hope of salvation, the mercies of God. For, when he considers that the expression, ‘Behold the Lord and his reward,’ refers to each according to his work, and when he ponders his own evil deeds, he fears the punishment and cowers beneath the threats. There is good hope which gazes steadfastly at the mercies and kindness of God lest it be swallowed up by grief. He hopes that his soul will be delivered from death and will be fed by Him in famine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
