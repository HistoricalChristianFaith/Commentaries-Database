[[commentary]]
quote='''
For, be sure, my very dear and honourable friend, that I have never at any time been so grieved as I am now, on hearing of this confusion of the laws of the Church. Pray only that the Lord grant me to take no step in anger, but to maintain charity, which behaveth itself not unseemly and is not puffed up. Only look how men without charity have been lifted up beyond all human bounds and conduct themselves in an unseemly manner, daring deeds which have no precedent in all the past.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520130.html'
source_title="Letter 130, Section 2"
