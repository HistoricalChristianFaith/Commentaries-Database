[[commentary]]
quote='''
We must be always on our guard lest under pretext of keeping one commandment we be found breaking another. For it is fitting that we should neither fight nor spar with bad men, since “the Lord’s servant must not fight”; but he that is badly treated by his kinsmen according to the flesh must remember the Lord’s words: “There is no man that hath left house, or brethren, or sisters, or father, or mother, or wife, or children, or lands”—not just left them but “for my sake and the gospel’s, who shall not receive a hundred-fold in this time, and in the world to come eternal life.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 9"
