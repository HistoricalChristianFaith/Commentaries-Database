[[commentary]]
quote='''
‘In the Lord shall my soul be praised.’ ‘Let no one,’ David says, ‘praise my intelligence, through which I was preserved from dangers.’ For, not in the power of man, nor in wisdom, but in the grace of God is salvation. ‘Let not,’ it is said, ‘the rich man glory in his riches, nor the wise man in his wisdom, nor the strong man in his strength, but let him that glorieth glory in this, that he understandeth and knoweth’ the Lord his God. Do you see how the Apostle praises the helpers of the Gospel? He who is ‘your fellow servant and minister in the Lord.’ If, however, someone is praised for beauty of body or renowned parentage, his soul is not praised in the Lord, but each person of such a kind is occupied with vanity. The ordinary professions, in fact, those of governor, doctor, orator, or architect who constructs cities, pyramids, labyrinths, or any other expensive or ponderous masses of buildings, do not merit to be truly praised. They who are praised for these things do not keep their soul in the Lord. It suffices us for every dignity to be called servants of such a great Lord. Certainly, one who ministers to the King will not be high-minded because he has been assigned to this particular rank of the ministry, and having been considered worthy to serve God, he will not contrive for himself praises from elsewhere, will he, as if the call of the Lord did not suffice for all pre-eminence of glory and distinction?

Therefore, ‘in the Lord shall my soul be praised: let the meek hear and rejoice.’ Since with the help of God, by deceiving my enemies, he says, I have successfully obtained safety without war, by only the changing of my countenance, ‘Let the meek hear’ that it is possible even for those at peace to erect a trophy, and for those not fighting to be named victors. ‘And let them rejoice,’ being strengthened to embrace meekness by my example. I received this gift from God because I completely realized meekness. ‘O Lord, remember David, and all his meekness.’ Meekness is indeed the greatest of the virtues; therefore, it is counted among the beatitudes. ‘Blessed are the meek,’ it is said, ‘for they shall possess the earth.’ For, that earth, the heavenly Jerusalem, does not become the booty of those who fight, but is appointed as the inheritance of the patient and meek. Moreover, the expression, ‘Let the meek hear,’ means the same as ‘Let the disciples of Christ hear.’ Perhaps, the wonder of the beneficence of God toward him is meant prophetically to pass over to us. In fact, let those hear, who many generations later will become disciples of Christ. For, he called those meek to whom the Lord said: ‘Learn from me, for I am meek and humble of heart.’ Those of calm character and so free from all passion that they have no confusion present in their souls, they are the ones called meek. Wherefore, Moses is acknowledged to be meeker than all men on the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252033.html'
source_title="Homily on Psalm 33"
