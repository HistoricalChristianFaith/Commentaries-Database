[[commentary]]
quote='''
It is the Spirit which says, as the Lord says, "Get thee down, and go with them, doubting nothing: for I have sent them." Are these the words of an inferior, or of one in dread? "Separate me Barnabas and Saul for the work whereunto I have called them." Does a slave speak thus?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 19"
