[[commentary]]
quote='''
Every such man that has been received into the brotherhood and then has annulled his profession must be looked on as sinning against God, before Whom and to Whom he made a profession and undertaking. “But if a man sin against God,” it says, “who shall pray for him?” For a man who dedicates himself to God and then springs away to another form of life has committed sacrilege, for he has stolen away himself and robbed God of His votive-offering. It is only reasonable that the brethren’s door be no longer opened to such men, not even for a mere sojourn for the sake of shelter as they pass by. For the apostolic rule is plain, which bids us withdraw from every unruly man, and refrain from intercourse with him, in order that he may be ashamed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 14"
