[[commentary]]
quote='''
Besides all this we hear the apostle writing to the Philippians: “Fulfil ye my joy, that ye be of the same mind, having the same love, being of one soul, having one mind, doing nothing through factions or vainglory, but in lowliness of mind, each counting others better than himself; not looking to his own things, but each also to the things of others.”

What greater proof of humility than that the Superiors of the brotherhood should be subject to one another! For if they are equal in spiritual gifts it is better that they should contend together—as the Lord Himself showed us when He sent out the disciples by two and two; and one of the two will gladly choose to be subject unto the other, remembering the Lord’s words: “He that humbleth himself shall be exalted.” But if it happens that the one suffers, the other gains, by comparison then it is more beneficial that the weaker should be helped by the stronger. And (if we refuse) is it not a clear disobedience of the apostolic command: “Not looking each to his own things, but each also to the things of others”? For I reckon this cannot be carried out in separation, when each section takes care for its fellow denizens, but thought for the others is outside its ken, which, as I said, is clearly opposed to the apostolic command.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 35"
