[[commentary]]
quote='''
The Father, the Son and the Holy Ghost alike hallow, quicken, enlighten, and comfort. No one will attribute a special and peculiar operation of hallowing to the operation of the Spirit, after hearing the Saviour in the Gospel saying to the Father about His disciples, sanctify them in Thy name. In like manner all other operations are equally performed, in all who are worthy of them, by the Father and by the Son and by the Holy Ghost; every grace and virtue, guidance, life, consolation, change into the immortal, the passage into freedom and all other good things which come down to man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520189.html'
source_title="Letter 189, Section 7"
