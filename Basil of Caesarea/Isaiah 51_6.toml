[[commentary]]
quote='''
Upon the essence of the heavens we are contented with what Isaiah says, for, in simple language, he gives us sufficient idea of their nature, “The heaven was made like smoke,” that is to say, He created a subtle substance, without solidity or density, from which to form the heavens. As to the form of them we also content ourselves with the language of the same prophet, when praising God “that stretcheth out the heavens as a curtain and spreadeth them out as a tent to dwell in.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25201-In%2520the%2520Beginning%2520God%2520Made%2520the%2520Heaven%2520and%2520the%2520Earth.html'
source_title="The Hexaemeron, Homily 1: In the Beginning God Made the Heaven and the Earth"
