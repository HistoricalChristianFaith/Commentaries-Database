[[commentary]]
quote='''
Those who have been once received into the brotherhood must not be allowed by the Superior to be led away by any distraction: they must not leave the brethren and lead a life free from observation, under pretext of visiting relations, nor must they be permitted to have the anxieties of looking after their kinsmen according to the flesh. For the Scripture absolutely forbids the words “mine” and “thine” to be used in the brotherhood. “For” it says “all that believed had one heart and soul; and not one of them said that aught of the things he possessed was his own.” So let a man’s parents or brothers according to the flesh, if they live in godly fashion, be cared for by all the brethren, as fathers or friends of all. “For whosoever shall do the will of my Father which is in heaven,” saith the Lord, “he is my brother and sister and mother.” The care of such we judge should devolve upon the Superior of the brotherhood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 32"

[[commentary]]
quote='''
But if they who give the care and service find so great gain from their zeal and expect so great condemnation from neglect, how must those who receive the service strive to prove themselves worthy of the title of brethren of the Lord? As the Lord teaches, saying: “For whosoever shall do the will of my Father which is in heaven, he is alike my brother and sister and mother.”

For whoever has not made the will of God his aim all through his life, so that in health he displays the labour of love by his diligence in the works of the Lord, and in sickness he shows all patience and long-suffering with joy, he is in danger—first and foremost because he is alienated from the Lord and the lot of his brethren, having cut himself off because he does not do the will of God; and secondly, because he dares to partake unworthily of the things prepared for the Saints. Wherefore it is necessary in this also to remember the apostle’s words: “Working together with him we intreat also that ye receive not the grace of God in vain”; and necessary too that those who have been called to be brethren of the Lord insult not such grace of God nor betray so great a dignity by neglecting the will of God, but rather hearken to the same apostle as he says: “I the prisoner in the Lord beseech you that ye walk worthy of the vocation wherewith ye were called.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 34"
