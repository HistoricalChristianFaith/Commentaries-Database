[[commentary]]
quote='''
Next comes Apollinarius, who is no less a cause of sorrow to the Churches. With his facility of writing, and a tongue ready to argue on any subject, he has filled the world with his works, in disregard of the advice of him who said, “Beware of making many books.” In their multitude there are certainly many errors. How is it possible to avoid sin in a multitude of words?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520263.html'
source_title="Letter 263, Section 4"
