[[commentary]]
quote='''
Thus, by God’s grace, through mutual accommodation we may govern the Churches by the ancient kind of love; receiving as our own members brothers coming from the other side, sending as to our kin, and in turn receiving as from our own kin. Such, indeed, was once the boast of the Church. Brothers from each Church, travelling from one end of the world to the other, were provided with little tokens, and found all men fathers and brothers. This is a privilege whereof, like all the rest, the enemy of Christ’s Churches has robbed us. We are confined each in his own city, and every one looks at his neighbour with distrust. What more is to be said but that our love has grown cold, whereby alone our Lord has told us that His disciples are distinguished?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520191.html'
source_title="Letter 191"

[[commentary]]
quote='''
[Up to this day I live in much affliction and grief, having the feeling present before me, that you are wanting to me. For when God tells me, who took on Him His sojourn in the flesh for the very purpose that, by patterns of duty, He might regulate our life, and might by His own voice announce to us the Gospel of the kingdom,—when He says, ‘By this shall all men know that ye are my disciples, if ye love one another,’ and whereas the Lord left His own peace to His disciples as a farewell gift, when about to complete the dispensation in the flesh, saying, ‘Peace I leave with you, My peace I give you,’ I cannot persuade myself that without love to others, and without, as far as rests with me, peaceableness towards all, I can be called a worthy servant of Jesus Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520203.html'
source_title="Letter 203, Section 1"
