[[commentary]]
quote='''
There is a time to keep silence and a time to speak, is the saying of the Preacher. Time enough has been given to silence, and now the time has come to open my mouth for the publication of the truth concerning matters that are, up to now, unknown. The illustrious Job bore his calamities for a long time in silence, and ever showed his courage by holding out under the most intolerable sufferings, but when he had struggled long enough in silence, and had persisted in covering his anguish in the bottom of his heart, at last he opened his mouth and uttered his well-known words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520223.html'
source_title="Letter 223, Section 1"
