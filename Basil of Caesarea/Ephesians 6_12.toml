[[commentary]]
quote='''
He is wishful to receive here the crown of God’s love, but I have put him off, because I wish, in conjunction with your reverence, to anoint him for such struggles, and to appoint over him one of your number whom he may select to be his trainer, training him nobly, and making him by his constant and blessed care a tried wrestler, wounding and overthrowing the prince of the darkness of this world, and the spiritual powers of iniquity, with whom, as the blessed Apostle says, is “our wrestling.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252023.html'
source_title="Letter 23"
