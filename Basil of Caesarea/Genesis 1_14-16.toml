[[commentary]]
quote='''
When once you have learnt Who spoke, think immediately of the hearer. God said, “Let there be lights…and God made two great lights.” Who spoke? and Who made? Do you not see a double person? Everywhere, in mystic language, history is sown with the dogmas of theology.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25206-The%2520Creation%2520of%2520Luminous%2520Bodies.html'
source_title="The Hexaemeron, Homily 6: The Creation of Luminous Bodies"
