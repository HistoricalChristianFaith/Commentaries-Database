[[commentary]]
quote='''
Certainly we should warn the bad men of the sin of sacrilege, according to the commandment of the Lord: “If thy brother sin, go, show him his fault etc.”; but to engage in litigation with them before secular tribunals is forbidden by the word of piety, when it says: “If any man would go to law with thee, and take away thy coat, let him have thy cloke also.” And, “Dare any of you, having a matter against his neighbour, go to law before the unrighteous, and not before the Saints?” And let us summon them to appear before the latter, paying more heed to our brother’s salvation than to the abundance of possessions. For the Lord having said: “If he hear thee,” added, “thou hast gained” not thy money, but “thy brother.” But it often happens that to make the truth plain we condescend to plead, when the originator of the ill deed challenges us to arbitration; we do not take the initiative, but obey the summons, not to satisfy our private feelings of anger or strife, but to reveal the truth. For thus we shall liberate even the aggressor, unwilling though he be, from evil, and shall not ourselves transgress the commandments, as ministers of God free from strife and covetousness, firmly insisting on the manifestation of the truth, and in no way transgressing the prescribed limits of zeal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 9"
