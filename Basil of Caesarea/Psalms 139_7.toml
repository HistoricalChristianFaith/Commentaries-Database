[[commentary]]
quote='''
Furthermore if he calls the Holy Ghost a creature he describes His nature as limited. How then can the two following passages stand? “The Spirit of the Lord filleth the world;” and “Whither shall I go from thy Spirit?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 10"

[[commentary]]
quote='''
Blessed be God Who from age to age chooses them that please Him, distinguishes vessels of election, and uses them for the ministry of the Saints. Though you were trying to flee, as you confess, not from me, but from the calling you expected through me, He has netted you in the sure meshes of grace, and has brought you into the midst of Pisidia to catch men for the Lord, and draw the devil’s prey from the deep into the light. You, too, may say as the blessed David said, “Whither shall I go from thy Spirit? or whither shall I flee from thy presence.” Such is the wonderful work of our loving Master.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520161.html'
source_title="Letter 161, Section 1"
