[[commentary]]
quote='''
It is on this account that we have not found Scripture describing the Lord to us by one name, nor even by such terms alone as are indicative of His godhead and majesty. At one time it uses terms descriptive of His nature, for it recognises the "name which is above every name," the name of Son, and speaks of true Son, and only begotten God, and Power of God, and Wisdom, and Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 8"
