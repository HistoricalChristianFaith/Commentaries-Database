[[commentary]]
quote='''
But each should attend to his own work and look after it with alacrity, and as if God were beholding, meaning to fulfil it blamelessly with untiring zeal and attentive care, that he may always be emboldened to say: “Behold, as the eyes of servants look unto the hands of their masters, so our eyes are upon the Lord our God” and not to shilly-shally from one thing to another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 41"
