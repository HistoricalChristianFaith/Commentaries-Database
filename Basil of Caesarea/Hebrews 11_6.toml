[[commentary]]
quote='''
Recognise that the voice is the voice of mockers, when they say, if you are ignorant of the essence of God, you worship what you do not know. I do know that He exists; what His essence is, I look at as beyond intelligence. How then am I saved? Through faith. It is faith sufficient to know that God exists, without knowing what He is; and “He is a rewarder of them that seek Him.” So knowledge of the divine essence involves perception of His incomprehensibility, and the object of our worship is not that of which we comprehend the essence, but of which we comprehend that the essence exists.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520234.html'
source_title="Letter 234, Section 2"
