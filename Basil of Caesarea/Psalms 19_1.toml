[[commentary]]
quote='''
Although, however, waters above the heaven are invited to give glory to the Lord of the Universe, do not let us think of them as intelligent beings; the heavens are not alive because they “declare the glory of God,” nor the firmament a sensible being because it “sheweth His handiwork.” And if they tell you that the heavens mean contemplative powers, and the firmament active powers which produce good, we admire the theory as ingenious without being able to acknowledge the truth of it. For thus dew, the frost, cold and heat, which in Daniel are ordered to praise the Creator of all things, will be intelligent and invisible natures. But this is only a figure, accepted as such by enlightened minds, to complete the glory of the Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Hexaemeron%2FHomily%25203-On%2520the%2520Firmament.html'
source_title="The Hexaemeron, Homily 3: On the Firmament"
