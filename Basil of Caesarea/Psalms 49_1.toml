[[commentary]]
quote='''
Even among the Gentiles certain men have formed ideas concerning the end of man and have arrived at various opinions about the end. Some declared that the end was knowledge; others, practical activity; others, a different use of life and body; but the sensual men declared that the end was pleasure. For us, however, the end for which we do all things and toward which we hasten is the blessed life in the world to come. And this will be attained when we are ruled by God. Up to this time nothing better than the latter idea has been found in rational nature, and to it the Apostle stirs us when he says: ‘Then comes the end, when he delivers the kingdom to God the Father.’ This same thing Sophonia likewise set forth in prophecy, saying in the person of God: ‘For my judgment is to assemble the Gentiles, to receive the kings, to pour out upon them my indignation. For in the fire of my jealousy shall all the earth be devoured; because then I will restore for many peoples a tongue for its generation, that all may call upon the name of the Lord and may serve him under one yoke.’ To this end, therefore, I think the advantages from the psalms refer, since they have this heading. Those persons also are in accord with this idea, who have written, ‘For a Victory,’ or ‘A Song of Victory,’ or ‘To the Victor,’ for, since ‘Death is swallowed up in victory,’ and it has been utterly destroyed by Him who says, ‘I have overcome the world,’ and since all things have been conquered by Christ, and ‘At his name every knee shall bend of those in heaven, on earth and under the earth,’ perhaps, the Holy Spirit is proclaiming beforehand in triumphal odes what things are reserved for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252048.html'
source_title="Homily on Psalm 48"
