[[commentary]]
quote='''
For, there are two ways opposed to each other, the one wide and broad, the other narrow and close. And there are two guides, each attempting to turn the traveler to himself. Now, the smooth and downward sloping way has a deceptive guide, a wicked demon, who drags his followers through pleasure to destruction, but the rough and steep way has a good angel, who leads his followers through the toils of virtue to a blessed end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25201.html'
source_title="Homily on Psalm 1"
