[[commentary]]
quote='''
Rejoice in the Lord, O ye just; praise becometh the upright.

The voice of exultation is familiar in the Scripture, betokening a very bright and happy state of soul in those deserving of happiness. ‘Rejoice,’ therefore, ‘in the Lord, O ye just,’ not when the interests of your home are flourishing, not when you are in good health of body, not when your fields are filled with all sorts of fruits, but, when you have the Lord—such immeasurable Beauty, Goodness, Wisdom. Let the joy that is in Him suffice for you. He who exults with joy and happiness in anything that is much desired, seems thus to rejoice in Him. Therefore, Scripture urges the just to be aware of their dignity, because they have been considered worthy to be the servants of so great a Master, and to glory in His service with inexpressible joy and exultation, since the heart is, as it were, bounding with ecstasy of love of the good. If at any time a light, for example, falling upon your heart, produced a continuous thought of God and illumined your soul, so that you loved God and despised the world and all things corporeal, understand from that faint and brief resemblance the whole state of the just, who are enjoying God steadily and uninterruptedly. At some rare times by the dispensation of God that transport of joy seizes you in order that through a little taste He may remind you of what you have been deprived. But, for the just man the divine and heavenly joy is lasting, since the Holy Spirit dwells in him once for all. ‘But the firstfruit of the Spirit is: charity, joy, peace.’ Therefore, ‘rejoice in the Lord, O ye just.’ The Lord is like a place capable of containing the just, and there is every reason for one who is in Him to be delighted and to make merry. Moreover, the just man becomes a place for the Lord, when he receives Him in himself. He who sins gives place to the devil, taking no heed of him who said: ‘Do not give place to the devil,’ nor to Ecclesiastes, ‘If the spirit of him that hath power, ascend upon thee, leave not thy place.’ Let us, then, who are in the Lord and who, as much as we are able, observe closely His wonders, so draw joy to our hearts from the contemplation of them.

‘Praise becometh the upright.’ As a crooked foot does not fit into a straight sandal, so neither is the praise of God suited to perverted hearts. For this reason, I think, since speech concerning the Savior is not becoming in the mouth of the demons, He takes away their power, in order that they may not make Him known. And Paul rebuked the divining spirit in order that the Holy One might not be praised by an unclean person. Such also is this saying: ‘But to the sinner God hath said: Why dost thou declare my justices?’ Let us earnestly endeavor, therefore, to flee every crooked and tortuous act, and let us keep our mind and the judgment of our soul as straight as a rule, in order that the praise of the Lord may be permitted to us since we are upright. In the same way the serpent, which is the author of sin, is called crooked, and the sword of God is drawn against the dragon, the crooked serpent, which makes many twists and turns in its progress. As the coiling movement of the serpent trails along, it is traced unevenly on the ground, since, if it were otherwise, the first parts would hasten along, the next follow transversely and the tail bend aside in the opposite direction. Therefore, he who follows the serpent shows that his life is crooked, uneven, and filled with contrarieties; but, he who follows after the Lord makes his paths straight and his footprints right. For, ‘the Lord our God is righteous, and his countenance hath beheld righteousness.’ If two rulers are compared with each other, their straightness is in agreement with each other, but, if a distorted piece of wood is compared with a ruler, the crooked one will be found at variance with the straight. Since, therefore, the praise of God is righteous, there is need of a righteous heart, in order that the praise may be fitting and adapted to it. But, if ‘no one can say “Jesus is Lord,” except in the Holy Spirit,’ how would you give praise, since you do not have the right spirit in your heart?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%252032.html'
source_title="Homily on Psalm 32"
