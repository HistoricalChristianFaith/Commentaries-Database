[[commentary]]
quote='''
Again, it says that the Lord will enter into judgment with all flesh, that is, in the examination of the actions in the lives of each He subjected Himself to judgment and compared His own precepts with the actions of sinners, defending Himself with proofs that He has done all things depending upon Him for the salvation of those judged, in order that the sinners, being persuaded that they are liable to punishment for sins and acknowledging the divine justice, may willingly accept the penalty falling to their lot.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FHomilies%2520on%2520the%2520Psalms%2FHomily%2520on%2520Psalm%25207.html'
source_title="Homily on Psalm 7"
