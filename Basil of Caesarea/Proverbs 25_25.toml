[[commentary]]
quote='''
Far apart as you are in body, you have united yourself to me by writing; you have embraced me with spiritual and holy longing; you have implanted unspeakable affection in my soul. Now I have realized the force of the proverb, “As cold water is to a thirsty soul so is good news from a far country.” Honoured brother, I really hunger for affection. The cause is not far to seek, for iniquity is multiplied and the love of many has grown cold. For this reason your letter is precious to me, and I am replying by our reverend brother Sabinus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252091.html'
source_title="Letter 91"
