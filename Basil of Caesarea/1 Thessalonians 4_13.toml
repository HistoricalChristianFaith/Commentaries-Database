[[commentary]]
quote='''
I feel with you at once in your grief at the event which has befallen you, and in your anxiety at the matter which you have in hand. Concerning all these troubles I can only say, that an occasion is given us to look to the injunctions of the Apostle, and not to sorrow “even as others which have no hope.” I do not mean that we should be insensible to the loss we have suffered, but that we should not succumb to our sorrow, while we count the Pastor happy in his end. He has died in a ripe old age, and has found his rest in the great honour given him by his Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252062.html'
source_title="Letter 62"

[[commentary]]
quote='''
If the hope of Christians is limited to this life, it might rightly have been reckoned a bitter lot to be prematurely parted from the body; but if, to them that love God, the sundering of the soul from these bodily fetters is the beginning of our real life, why do we grieve like them which have no hope? Be comforted then, and do not fall under your troubles, but show that you are superior to them and can rise above them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520101.html'
source_title="Letter 101"
