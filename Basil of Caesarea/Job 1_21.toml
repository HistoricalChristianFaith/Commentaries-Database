[[commentary]]
quote='''
Be perfectly assured of this, that though the reasons for what is ordained by God are beyond us, yet always what is arranged for us by Him Who is wise and Who loves us is to be accepted, be it ever so grievous to endure. He Himself knows how He is appointing what is best for each and why the terms of life that He fixes for us are unequal. There exists some reason incomprehensible to man why some are sooner carried far away from us, and some are left a longer while behind to bear the burdens of this painful life. So we ought always to adore His loving kindness, and not to repine, remembering those great and famous words of the great athlete Job, when he had seen ten children at one table, in one short moment, crushed to death, “The Lord gave and the Lord hath taken away.” As the Lord thought good so it came to pass. Let us adopt those marvellous words. At the hands of the righteous Judge, they who show like good deeds shall receive a like reward. We have not lost the lad; we have restored him to the Lender. His life is not destroyed; it is changed for the better. He whom we love is not hidden in the ground; he is received into heaven. Let us wait a little while, and we shall be once more with him. The time of our separation is not long, for in this life we are all like travellers on a journey, hastening on to the same shelter. While one has reached his rest another arrives, another hurries on, but one and the same end awaits them all. He has outstripped us on the way, but we shall all travel the same road, and the same hostelry awaits us all. God only grant that we through goodness may be likened to his purity, to the end that for the sake of our guilelessness of life we may attain the rest which is granted to them that are children in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25205.html'
source_title="Letter 5, Section 2"
