[[commentary]]
quote='''
Then there is Jacob’s prayer to God: “If thou wilt give me bread to eat and raiment to put on,” not “If thou wilt give luxuries and costly things.” What says Solomon, wisest of men? “Give me neither poverty nor riches, but provide what is necessary and sufficient, lest I be filled and become false and say, Who seeth me? or lest I become poor and steal and use profanely the name of my God.” He thus defines riches as satiety and poverty as complete absence of the necessaries of life; and means by sufficiency having neither a deficiency or superfluity of necessaries. But sufficiency has a different meaning in different cases according to the state of the body and its needs in view of the work to be done. For one man needs food more in quantity and more nourishing on account of his toil, another lighter food suitable in every way to his condition because of his weakness; but all alike need the cheaper and easily procurable kinds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FThe%2520Longer%2520Rules.html'
source_title="The Longer Rules, Question 20"
