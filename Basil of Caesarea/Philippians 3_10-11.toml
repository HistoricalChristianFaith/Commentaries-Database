[[commentary]]
quote='''
The dispensation of our God and Saviour concerning man is a recall from the fall and a return from the alienation caused by disobedience to close communion with God. This is the reason for the sojourn of Christ in the flesh, the pattern life described in the Gospels, the sufferings, the cross, the tomb, the resurrection; so that the man who is being saved through imitation of Christ receives that old adoption. For perfection of life the imitation of Christ is necessary, not only in the example of gentleness, lowliness, and long suffering set us in His life, but also of His actual death. So Paul, the imitator of Christ, says, "being made conformable unto his death; if by any means I might attain unto the resurrection of the dead." How then are we made in the likeness of His death? In that we were buried with Him by baptism. What then is the manner of the burial? And what is the advantage resulting from the imitation? First of all, it is necessary that the continuity of the old life be cut. And this is impossible unless a man be born again, according to the Lord's word; for the regeneration, as indeed the name shews, is a beginning of a second life. So before beginning the second, it is necessary to put an end to the first. For just as in the case of runners who turn and take the second course, a kind of halt and pause intervenes between the movements in the opposite direction, so also in making a change in lives it seemed necessary for death to come as mediator between the two, ending all that goes before, and beginning all that comes after. How then do we achieve the descent into hell? By imitating, through baptism, the burial of Christ. For the bodies of the baptized are, as it were, buried in the water. Baptism then symbolically signifies the putting off of the works of the flesh; as the apostle says, ye were "circumcised with the circumcision made without hands, in putting off the body of the sins of the flesh by the circumcision of Christ; buried with him in baptism." And there is, as it were, a cleansing of the soul from the filth that has grown on it from the carnal mind, as it is written, "Thou shalt wash me, and I shall be whiter than snow." On this account we do not, as is the fashion of the Jews, wash ourselves at each defilement, but own the baptism of salvation to be one. For there the death on behalf of the world is one, and one the resurrection of the dead, whereof baptism is a type. For this cause the Lord, who is the Dispenser of our life, gave us the covenant of baptism, containing a type of life and death, for the water fulfils the image of death, and the Spirit gives us the earnest of life. Hence it follows that the answer to our question why the water was associated with the Spirit is clear: the reason is because in baptism two ends were proposed; on the one hand, the destroying of the body of sin, that it may never bear fruit unto death; on the other hand, our living unto the Spirit, and having our fruit in holiness; the water receiving the body as in a tomb figures death, while the Spirit pours in the quickening power, renewing our souls from the deadness of sin unto their original life. This then is what it is to be born again of water and of the Spirit, the being made dead being effected in the water, while our life is wrought in us through the Spirit. In three immersions, then, and with three invocations, the great mystery of baptism is performed, to the end that the type of death may be fully figured, and that by the tradition of the divine knowledge the baptized may have their souls enlightened. It follows that if there is any grace in the water, it is not of the nature of the water, but of the presence of the Spirit. For baptism is "not the putting away of the filth of the flesh, but the answer of a good conscience towards God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 15"
