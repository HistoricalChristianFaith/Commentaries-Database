[[commentary]]
quote='''
And many did I find in Alexandria, and many in the rest of Egypt, and others in Palestine, and in Cœle Syria, and in Mesopotamia. I admired their continence in living, and their endurance in toil; I was amazed at their persistency in prayer, and at their triumphing over sleep; subdued by no natural necessity, ever keeping their souls’ purpose high and free, in hunger, in thirst, in cold, in nakedness, they never yielded to the body; they were never willing to waste attention on it; always, as though living in a flesh that was not theirs, they shewed in very deed what it is to sojourn for a while in this life, and what to have one’s citizenship and home in heaven. All this moved my admiration. I called these men’s lives blessed, in that they did in deed shew that they “bear about in their body the dying of Jesus.” And I prayed that I, too, as far as in me lay, might imitate them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520223.html'
source_title="Letter 223, Section 2"
