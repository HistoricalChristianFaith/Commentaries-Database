[[commentary]]
quote='''
You will not love your kinsfolk more than the Lord. “He that loveth,” He says, “father, or mother, or brother, more than me, is not worthy of me.” What is the meaning of the Lord’s commandment? “He that taketh not up his cross and followeth after me, cannot be my disciple?” If, together with Christ, you died to your kinsfolk according to the flesh, why do you wish to live with them again? If for your kinsfolk’s sake you are building up again what you destroyed for Christ’s sake, you make yourself a transgressor. Do not then for your kinsfolk’s sake abandon your place: if you abandon your place, perhaps you will abandon your mode of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252042.html'
source_title="Letter 42, Section 3"
