[[commentary]]
quote='''
For we do not count by way of addition, gradually making increase from unity to multitude, and saying one, two, and three,—nor yet first, second, and third. For "I," God, "am the first, and I am the last." And hitherto we have never, even at the present time, heard of a second God. Worshipping as we do God of God, we both confess the distinction of the Persons, and at the same time abide by the Monarchy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FON%2520THE%2520SPIRIT.html'
source_title="On the Spirit, Chapter 18"
