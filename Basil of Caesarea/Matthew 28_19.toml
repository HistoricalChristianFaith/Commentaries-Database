[[commentary]]
quote='''
If we ought to advance our argument yet further, and turn our inspection to higher themes, let us contemplate the divine nature of the Holy Spirit specially from the following point of view. In Scripture we find mention of three creations. The first is the evolution from non-being into being. The second is change from the worse to the better. The third is the resurrection of the dead. In these you will find the Holy Ghost cooperating with the Father and the Son. There is a bringing into existence of the heavens; and what says David? “By the word of the Lord were the heavens made and all the host of them by the breath of His mouth.” Again, man is created through baptism, for “if any man be in Christ he is a new creature.” And why does the Saviour say to the disciples, “Go ye therefore and teach all nations, baptizing them in the name of the Father and of the Son and of the Holy Ghost”? Here too you see the Holy Ghost present with the Father and the Son. And what would you say also as to the resurrection of the dead when we shall have failed and returned to our dust? Dust we are and unto dust we shall return. And He will send the Holy Ghost and create us and renew the face of the earth. For what the holy Paul calls resurrection David describes as renewal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%25208.html'
source_title="Letter 8, Section 11"

[[commentary]]
quote='''
The Holy Spirit, too, is numbered with the Father and the Son, because He is above creation, and is ranked as we are taught by the words of the Lord in the Gospel, “Go and baptize in the name of the Father and of the Son and of the Holy Ghost.” He who, on the contrary, places the Spirit before the Son, or alleges Him to be older than the Father, resists the ordinance of God, and is a stranger to the sound faith, since he fails to preserve the form of doxology which he has received, but adopts some new fangled device in order to be pleasing to men. It is written “The Spirit is of God,” and if He is of God, how can He be older than that of which He is? And what folly is it not, when there is one Unbegotten, to speak of something else as superior to the Unbegotten? He is not even anterior, for nothing intervenes between Son and Father. If, however, He is not of God but is through Christ, He does not even exist at all. It follows, that this new invention about the order really involves the destruction of the actual existence, and is a denial of the whole faith. It is equally impious to reduce Him to the level of a creature, and to subordinate Him either to Son or to Father, either in time or in rank.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%252052.html'
source_title="Letter 52, Section 4"

[[commentary]]
quote='''
But because of men who make universal confusion, and do not keep the doctrine of the Gospels, it is necessary to add yet this further, that they are to be shunned, as plainly hostile to true religion, who invert the order left us by the Lord, and put the Son before the Father, and the Holy Spirit before the Son. For we must keep unaltered and inviolable that order which we have received from the very words of the Lord, “Go ye therefore and teach all nations, baptizing them in the name of the Father and of the Son, and of the Holy Ghost.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520125.html'
source_title="Letter 125, Section 3"

[[commentary]]
quote='''
But since the question now raised by those who are always endeavouring to introduce novelties, but passed over in silence by the men of old, because the doctrine was never gainsaid, has remained without full explanation (I mean that which concerns the Holy Ghost) I will add a statement on this subject in conformity with the sense of Scripture. As we were baptized, so we profess our belief. As we profess our belief, so also we offer praise. As then baptism has been given us by the Saviour, in the name of the Father and of the Son and of the Holy Ghost, so, in accordance with our baptism, we make the confession of the creed, and our doxology in accordance with our creed. We glorify the Holy Ghost together with the Father and the Son, from the conviction that He is not separated from the Divine Nature; for that which is foreign by nature does not share in the same honors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520159.html'
source_title="Letter 159, Section 2"

[[commentary]]
quote='''
Now the Pepuzeni are plainly heretical, for, by unlawfully and shamefully applying to Montanus and Priscilla the title of the Paraclete, they have blasphemed against the Holy Ghost. They are, therefore, to be condemned for ascribing divinity to men; and for outraging the Holy Ghost by comparing Him to men. They are thus also liable to eternal damnation, inasmuch as blasphemy against the Holy Ghost admits of no forgiveness. What ground is there, then, for the acceptance of the baptism of men who baptize into the Father and the Son and Montanus or Priscilla? For those who have not been baptized into the names delivered to us have not been baptized at all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520188.html'
source_title="Letter 188, Canon 1"

[[commentary]]
quote='''
What, then, is my argument? In delivering the Faith of Salvation to those who are being made disciples in His doctrine, the Lord conjoins with Father and with Son the Holy Spirit also. That which is conjoined once I maintain to be conjoined everywhere and always. There is no question here of a ranking together in one respect and isolation in others. In the quickening power whereby our nature is transformed from the life of corruption to immortality, the power of the Spirit is comprehended with Father and with Son, and in many other instances, as in the conception of the good, the holy, the eternal, the wise, the right, the supreme, the efficient, and generally in all terms which have the higher meaning, He is inseparably united. Wherefrom I judge it right to hold that the Spirit, thus conjoined with Father and Son in so many sublime and divine senses, is never separated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520189.html'
source_title="Letter 189, Section 5"

[[commentary]]
quote='''
And I hear that even rasher innovations than those of the foolish Sabellius are now ventured on among you. It is said, and that on the evidence of ear witnesses, that your clever men go to such an extreme as to say that there is no tradition of the name of the Only-begotten, while of the name of the adversary there is; and at this they are highly delighted and elated, as though it were a discovery of their own. For it is said, “I came in my Father’s name and ye received me not; if another shall come in his own name, him ye will receive.” And because it is said, “Go ye and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost,” it is obvious, they urge, that the name is one, for it is not “in the names,” but “in the name.”

I blush so to write to you, for the men thus guilty are of my own blood; and I groan for my own soul, in that, like boxers fighting two men at once, I can only give the truth its proper force by hitting with my proofs, and knocking down, the errors of doctrine on the right and on the left. On one side I am attacked by the Anomœan: on the other by the Sabellian. Do not, I implore you, pay any attention to these abominable and impotent sophisms. Know that the name of Christ which is above every name is His being called Son of God, as Peter says, “There is none other name under heaven given among men, whereby we must be saved.” And as to the words “I came in my Father’s name,” it is to be understood that He so says describing His Father as origin and cause of Himself. And if it is said “Go and baptize in the name of the Father and of the Son and of the Holy Ghost,” we must not suppose that here one name is delivered to us. For just as he who said Paul and Silvanus and Timothy mentioned three names, and coupled them one to the other by the word “and,” so He who spoke of the name of Father, Son, and Holy Ghost, mentioned three, and united them by the conjunction, teaching that with each name must be understood its own proper meaning; for the names mean things. And no one gifted with even the smallest particle of intelligence doubts that the existence belonging to the things is peculiar and complete in itself. For of Father, Son, and Holy Ghost there is the same nature and one Godhead; but these are different names, setting forth to a us the circumscription and exactitude of the meanings. For unless the meaning of the distinctive qualities of each be unconfounded, it is impossible for the doxology to be adequately offered to Father, Son, and Holy Ghost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520210.html'
source_title="Letter 210, Sections 3-4"

[[commentary]]
quote='''
They falsely accuse me of introducing novelties about the Holy Spirit. Ask what the novelty is. I confess what I have received, that the Paraclete is ranked with Father and Son, and not numbered with created beings. We have made profession of our faith in Father, Son, and Holy Ghost, and we are baptized in the name of Father, Son, and Holy Ghost. Wherefore we never separate the Spirit from conjunction with the Father and the Son. For our mind, enlightened by the Spirit, looks at the Son, and in Him, as in an image, beholds the Father. And I do not invent names of myself, but call the Holy Ghost Paraclete; nor do I consent to destroy His due glory. These are truly my doctrines.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520226.html'
source_title="Letter 226, Section 3"

[[commentary]]
quote='''
As we received from the Lord, so are we baptized; as we are baptized, so we make profession of our faith; as we make profession of our faith, so do we offer our doxology, not separating the Holy Ghost from Father and Son, nor preferring Him in honour to the Father, or asserting Him to be prior to the Son, as blasphemers’ tongues invent. Who could be so rash as to reject the Lord’s commandment, and boldly devise an order of his own for the Names? But I do not call the Spirit, Who is ranked with Father and Son, a creature. I do not dare to call slavish that which is royal. And I beseech you to remember the threat uttered by the Lord in the words, “All manner of sin and blasphemy shall be forgiven unto men; but the blasphemy against the Holy Ghost shall not be forgiven unto men, neither in this world, neither in the world to come.” Keep yourselves from dangerous teaching against the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Basil%2520of%2520Caesarea%2FLetters%2FLetter%2520251.html'
source_title="Letter 251, Section 4"
