[[commentary]]
quote='''
What do I mean by these things [which include] that many of them have given their bodies even to the beasts and the sword and the fire on behalf of their neighbours? It is not possible that a man should reach this degree of love, with the exception of that one who secretly perceives his faith. And it is not possible that those who love this world, should acquire the love of mankind. When a man has acquired love, he is clad with God at the same time. He that has put on God, never can be persuaded to acquire any other thing except Him, but he puts off his body even. And if he is clad with the world or with love of his life, these will not allow him to put on God. For he is witness: he that does not forsake and hate all, even himself, cannot be my disciple. Not only that he should leave them, but that he should ever hate them. And if he cannot be a disciple, how can He dwell in him?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 74"
