[[commentary]]
quote='''
The concise sense of the foregoing section is to communicate to us that at every moment of the four and twenty hours of the day, we are in want of repentance. The explanation of the denotation of repentance, in its real practical sense, is continual mournful supplication in contrite prayer, offered to God for the forgiveness of previous sins; and petition to be guarded against future ones. Therefore our Lord also has sustained our weakness by prayer: Watch and pray, that ye enter not into temptation. And: Pray, and do not faint. And: Watch ye therefore, and pray always

Ask, and it shall be given unto you; seek, and ye shall find; knock, and it shall be opened unto you; for every one that asketh receiveth; and he that seeketh findeth; and to him that knocketh it shall be opened. And he corroborates His word strongly and exhortates us strongly by the parable of the friend who went to his friend in the middle of the night and asked him for bread. ‚Verily, I say unto you, though ho will not rise and give him, because he is friend, yet because of his importunity he will rise and give him as many as he needeth. And ye also: Pray and do not faint. Blessed is the unspeakable encouragement of the Giver, who exhorts us saying: Ask from me and I will give you gifts. And He will also provide you with all that is profitable, according to His knowledge. “These words are full of, encouragement and great confidence.

And as our Lord knows that He does not take away liability of deviation before the cup of death [is drunk], and, this being so, that man is near to a change from excellency to deterioration, and nature susceptible of accidents — therefore He urges us to continual beseechings. For if there were in this world a place of security whereto a man could go and thenceforth his nature would be exempt from need and his service from fear — then He would not have exhorted us towards prayer nor would He have urged us diligently. In the world to be men will not offer prayers unto God, with beseechings concerning various things. For in that place of freedom our nature will no longer be susceptible of variation, nor bound by the fear of opposition, but perfect in every way.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 73"
