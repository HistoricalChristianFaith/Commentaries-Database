[[commentary]]
quote='''
As long as a man is negligent, he fears the hour of death, when, however, he comes near to God, the coming of Judgment. But when he proceeds firmly, both kinds of fear are taken away. How does this happen? While his knowledge and his behaviour are of a bodily nature, he is frightened by death. But when his knowledge is of a psychic nature, and his behaviour is steadfast, his mind is moved by the thought of Judgment every moment. In the first state he belongs wholly to nature; in the psychic state he is moved and guided by his knowledge and by his discipline. And he is happy in the neighbourhood of God. But when he reaches true knowledge by the motion of the apperception of God’s mysteries and becomes confirmed in future hope, he is consumed by love.

He that is bodily, fears as an animal fears being slaughtered; he who is rational fears the Judgment of God. He that has become a son, is pleasing to love, not to the staff of him who terrifies. ‚I and my house, we will serve the Lord’. For love annihilates fear. It not only felars not but it even longs after departure. Love is the dissolver of temporary life. He that has reached the love of God, does not desire to stay here any more.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 62"
