[[commentary]]
quote='''
Or why then were drowned in the Deluge the generations of the days of Noah? Was it not on account of the vileness of lasciviousness, because they had violated the beauty of the daughters of Kain? In that time there was no love of money nor adoration of idols, nor sorcery, nor wars waged [by men] against one another.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 10"
