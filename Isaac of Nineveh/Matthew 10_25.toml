[[commentary]]
quote='''
But if a man asks: What shall I do? How can I acquire it? By what means shall I become worthy of receiving it? For, if I compel myself and think that I have acquired it, I see that unperceived contrary impulses err through my mind, and, consequently, I fall into despair.

He that asks this, is to be answered thus: It is expedient for the disciple to be as his master, and for the slave as his lord. Look at Him who has commanded this and who grants the gift, how He acquired it; and strive thou to become like Him; then thou canst do it. For He has said: The prince of this world cometh, and hath nothing in me. Doest thou see how humility is to be acquired by the accomplishment of all excellence? So that we have to imitate Him that has commanded it., The foxes have holes and the birds of the air have nests, but the son of man hath not where to lay his head.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 82"
