[[commentary]]
quote='''
Thus it is the will of God that all those who are near to Him should live in miserable circumstances, being humbled and wretched in their whole soul and body; some through voluntary troubles; some through the vexations caused by their sufferings; some through the bitter pains which they bear in their bodies; some through the misery and the persecutions of men; danger of sufferings, danger of the demons, danger of illnesses, danger of poverty. Others have been persecuted; others have been put to death; others have been sawn asunder; others have been stoned; others have been drowned in the sea; others have had their limbs cut. off alive; others have been delivered to scorn and contempt; others have been punished by the flames, others by prison, others by terrible flogging; others have been delivered to the sword; others have gone round, clad in hides of lambs and goats, and have become as lost in the desert. Troubles the saints have undergone on mountains and in caverns and in the holes of the earth, Of such people according to the witness of the apostle, the world was not worthy. But what is more marvellous than all these things, they did not expect to be saved or to find rest on account of all these according to the word of the blessed apostle. Glory to Him that crowned them, He that by the suffering of the cross has also completed this path with all its previous sufferings, that also His saints may follow His steps.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 60"
