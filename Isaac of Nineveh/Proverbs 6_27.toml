[[commentary]]
quote='''
Do not tempt thy mind, for the sake of examination, by consideration of impure seductive thoughts, thinking that thou shalt not be vanquished. Even wise men have been perturbed in this place and deviated. Do not take fire in thy bosom, as hath been said.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 2"
