[[commentary]]
quote='''
As a man who sows on thorns and is not able to reap, so is he whose mind is injured by care and wrath and desire of gathering treasures, and who sighs on his bed on account of the frequency of his vigils and abstinence. Witness is the scripture that says: As a nation that did righteousness and forsook not the ordinance of their God: they ask of me the ordinances of justice; they take delight in coming near unto God. Wherefore have we fasted and thou seest not? Have we afflicted our soul and thou takest no knowledge? Behold, in the day of your fast ye find pleasure and sacrifice unto all your idols.

This means: the evil designs and the evil thoughts hold you in yourself in stead of God and sacrifice to them your liberty, a thing esteemed at all times; “the sacrifice which is honoured above all things and which you ought not to omit, consists of your good works and pious inner being. A good land which makes its lord rejoice by yielding an hundredfold, is the soul that is made excellent by meditation on God, in vigil day and night. The Lord will build upon its foundations and around it, a cloud for shade during the day and a shining flame of fire during the night. From within its darkness, light will dawn.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 6"
