[[commentary]]
quote='''
These things so far I have endeavoured to write to thee in plain words, which the spirit could attain without scrutiny on account of their manifest sense; things by the reading of which alone the mind forgets the ways and the dealings of this world and its fleshly life, migrating then with the spirit unto its true and profitable world. [I have written this], asking thy love that, when thou comest in contact with these mysteries, thon shalt not leave them without profit, so that they should be found with thee to be dead sentences; lest it should happen to thee as it happened to those who were invited to the spiritual meal but excused themselves. Behold, the table is prepared, spiritual ideas are ranged upon it, and all delightful things are ready; and the bridegroom expects that we shall enter and rejoice with him. Let us, therefore, not excuse ourselves, lest there be said to us also the word that was said concerning them. What then? Verily, I say unto you, that none of those invited, shall eat from my meal.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 74"
