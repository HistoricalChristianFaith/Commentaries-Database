[[commentary]]
quote='''
Be ready and prepared before he comes that will destroy thy forms. For Sheol shall make wither their form, and they shall be bereft of the beautiful glory of nature and their bodies will be left in the wilderness. Remember always that destruction of deplorable appearance, that formless scattering of thy senses, that ruin of the building of thy body, that pure mixture that will become mud in Sheol. Bleased is he that with joy meets the recollection of that destruction! Blessed is he that with good hope awaits that event full of mystery, in which the wonder of the Creator’s great power is hidden!
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 65"
