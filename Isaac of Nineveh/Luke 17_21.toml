[[commentary]]
quote='''
What the things of the world-to-be are, the scriptures do not explain. How we may acquire the faculty to perceive their delight even now, without change of nature or local transition, they teach us plainly.

Though they call these things by beloved names of glorious things which are delightful and esteemed by us, in order to spur us on, still by saying that the eye has not seen, nor the ear heard and so on, they show us that the things-to-be are not equal to any of the present things, by their being incomprehensible. They have to be reckoned by us as giving us even now spiritual delight, not the enjoyment of those things in themselves, such as are found outside the being of the receivers and promised us for the future state. Otherwise ‘The Kingdom of God is within you’ and “Thy Kingdom come’ would teach us that we possess within us a pledge of the delight which is in those things. For it is necessary that there be a resemblance between these and the pledge, partial for the present though it be, yet to be complete in the future. Again the word “as through a glass’ shows us the comparability anyhow, even if they are not one in essence, If now, according to the trustworthy testimonies of the commentators of the scriptures, this is due to an intelligible influence of the Holy Ghost, and is a part of that total one, then — apart from the spiritual influence that by intelligible apprehension forms a communication between the Holy Ghost and those who are influenced — the delight of the saints in the world is not occasioned by any sensible mediator, be it senses or sense-organs, save only the wombs which contain all in defined order, which we may call the profusion of light, though not the intelligible profusion.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 2"
