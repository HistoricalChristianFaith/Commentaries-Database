[[commentary]]
quote='''
Listening to God’s providential leading of the Ancients be estimated by thee as precious drugs for weak eyes. And let the recollection of it be kept with thee at all times of the day. Meditate and think of it and learn wisdom from it, that thou be able to receive in thy soul with honour the recollection of God’s greatness and find for thyself everlasting life in Jesus Christ, the mediator of God and mankind, who was one in his two natures. Though the legions of the angels are not able to look upon the glory surrounding His majestic throne, yet for thy sake He has appeared before the world the most contemptible and humble of man; without form or comeliness; and while His invisible nature was not within the reach of the apprehension of created beings, He accomplished His providential dealings by [covering Himself] with a veil [made of the stuff] of our limbs, in order to save the life of all.

This is he through whom He has purified many peoples and on whom the Lord has laid the sin of us all as Jesaja says. It pleased the Lord to humble him and to put him to grief.

Sin has been placed in him who knew no sin. To whom, for his providential dealings in all generations for our sake, be glory and praise and thanksgiving and adoration from all, now and at all time and for ever and ever, Amen.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 3"
