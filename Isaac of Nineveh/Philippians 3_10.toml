[[commentary]]
quote='''
The cross is the gate of mysteries; here takes place the entrance of the mind unto the knowledge of the heavenly mysteries. The knowledge of the cross is hidden within the sufferings of the cross. And in accordance with communion with them is the apperception of the cross, according to the word of the Apostle. The greater place the suffering of Christ takes in us, the greater becomes our consolation in Christ. Consolation means contemplation, which is psychic sight. Sight gives birth to consolation. It is not possible that our soul produce spiritual fruits, except when our heart is dead to the world. For the Father quickens the soul that has died the death of Christ, in contemplation of all the worlds.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 79"
