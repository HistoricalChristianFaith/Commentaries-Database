[[commentary]]
quote='''
The interrogator. How is it that the service of hope is so delightful, and its labours so few and its work so easy to the soul?

The Father. This is because it excites the natural longing in the soul and gives them this cup to drink and makes them drunk. And from this moment they nevermore perceive fatigue but become apathetic against troubles. And during the whole of their course it is to them as if they were moving in the air without bodily motion, without seeing anything of the difficulty of the road or the streams and hills that are before them; but the crooked becomes to them straight and rough places plain, because they always see the bosom of their Father; and all those things which are far and invisible it makes to them clear in themselves, so that they gaze at them mysteriously with the hidden eye of faith. For all the parts of the soul become hot as by fire, on account of the expectation of those things which, though far, become as near; for towards them is tended the whole direction of their deliberations; and they hasten to know when they will reach [their aim] and when they will approach unto every single virtue by practice. They do not practice them partly, but all of them together, at the same time. For they do not take their course along the king’s way, as the generality of men, but choose short paths along which a few heroes move, who easily reach the Apartment. For hope warms them as with fire, and they cannot pause in their incessant course, on account of their joy. And to them happens as in the word of Jeremia: I said: I will not make mention of him, nor speak any more in his name. But his word was in mine heart as a burning fire shut up in my bones. Such is the recollection of God in the heart of those who move in the expectation of the promise. Short paths I call the concise virtues, because in them there is no winding nor the long space of many ways of discipline leading from here to there, nor place nor time nor distraction. But they stand on the way and accomplish it at once.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 74"
