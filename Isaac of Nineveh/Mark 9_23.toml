[[commentary]]
quote='''
Knowledge according to its laws orders all those who walk in its way, to investigate all things from their beginning till their end and then to begin; lest the end of the thing be contrary to the limits of human power, and people might undertake fruitless labour when their work would prove to be impossible and difficult to be realized. But what says faith? All things are possible to him that believeth. O unspeakable richness, o ocean rich in its billows and in its amazing treasures, o effusions of the power of faith! How full of encouragement, how delightful and full of trust is its path! And how easy are its loads; how delightful is its service. He that has been deemed worthy of the taste of faith and then turns towards psychic knowledge is equal to him that has found a pearl of great price and changed it for a copper coin for he has left authoritative freedom and has turned towards the means of poverty which are full of the fear of bondship.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 51"
