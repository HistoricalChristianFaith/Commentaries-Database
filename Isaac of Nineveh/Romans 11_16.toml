[[commentary]]
quote='''
What is the difference between purity of mind and purity of heart.

Purity of mind is something other than purity of heart, just as there is a difference between one of the members of the whole body and the whole body. The mind is one of the senses of the soul. The heart is the central organ of the inward senses; this means the sense of senses, because it is the root And if the root is holy, so also are all the branches. But this is not so if it is holy in one of the branches only. Now with but little acquaintance with the scriptures and a little exercise in fasting and solitude, the mind forgets its former occupation and is cleansed, while it refrains from foreign habits. But is also easily defiled.

The heart is purified through great trouble and by being deprived of all association with the world, together with a complete mortification in every point. And when it has been purified, its purity is not defiled by the touch of insignificant [worldly] things; this means: it has no fear even before severe struggles. For it possesses a sound stomach that easily digests all sorts of food which are difficult for others who are sick in their interior. For the physicians say: All meat which is difficult of digestion, increases the forces of the sound body, because it is taken up by a strong stomach. In the same way every purification that is brought about easily, in a short time and by small labours, is easily defiled again. But the purity that is acquired through great troubles and after a long time by the highest part of the soul, is not endangered by insignificant touches of the [worldly] things.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 3"
