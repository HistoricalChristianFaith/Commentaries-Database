[[commentary]]
quote='''
While men walk in all the ways which there are in this world, they do not find peace, until they approach unto hope in God. The heart does not acquire peace from vexations and offences, until it approaches unto this place. But hope will give them peace and pour gladness into their heart. This is what that adorable mouth, full of holiness, has said: come unto me, all ye that labour and are heavy laden and I will give you rest. Draw near to the hope which is in me, and desist from the many ways, and ye will have rest from labours and from fear. Hope in God elevates the heart. Fear of Hell breaks it.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 50"
