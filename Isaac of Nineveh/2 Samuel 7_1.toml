[[commentary]]
quote='''
Doest thou now see perfectly — as thou observest that living flesh, which is peace of the soul, is going to cover thy open wound — which of the affections continually trouble thee, and which from time to time; and which are bodily, which are psychic, and which of a mixed nature; and whether they stir darkly, as being ill by recollections, or they assail the soul vehemently; whether they consequently behave stealthily or imperiously; and how king mind, the governor of the senses, looks at them when they knock at the door; whether it combates and vanquishes them by its force, or even does not look at them or think of them; and which of them are the remnants of old ones, and which have been newly formed; and whether the affections stir through representations, or by apperception without any representation; whether there is recollection without affections, and emotion without allurements.

By these [symptoms] it is possible to recognize the degree which the soul occupies. If the first mentioned alternative is to be affirmed (though it does not prevail), this shows that there is still strife in the soul though it is strong against [the contrary powers]. If the second mentioned alternative is to be affirmed, it almost proves that, as scripture says, David sat in his house and the Lord had given him rest round about from all his [enemies].
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 70"
