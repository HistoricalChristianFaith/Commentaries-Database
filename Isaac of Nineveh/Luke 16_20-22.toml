[[commentary]]
quote='''
In accordance with a man’s despising this world and his being occupied by the fear of God, divine care will approach him and he will perceive its help in secret and there will be given to him clear emotions so as to understand it. Even though a man be not destitute of the goods of this world by his own will, still even as he is devoid of them, so mercy will follow him and divine compassion will support him. Glory to Him who shows us His grace in things of the right and of the left hand and who in all of them lays a cause for the renewal of our life; and who makes the souls of those who, wilfully, are too weak to acquire life, ascend towards excellence, by involuntary distress.

The poor Lazarus was not destitute of the goods of this world by his own will, even his body was stricken by ulcers; bitter plagues he had to endure, one still harder than the other: illness and poverty. Yet in the end he received honour in the bosom of the patriarch.

God is near to the suffering heart which out of trouble cries to Him. And though the body sometimes refuses to bear these pains for the sake of the help, yet, as a physician who causes healing by the acute pains of his operations, the Lord greatly favours his soul in accordance with the heavy pains of his distress.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 57"
