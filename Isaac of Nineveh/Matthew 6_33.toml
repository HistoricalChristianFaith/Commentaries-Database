[[commentary]]
quote='''
When thou turnest towards perpetual handiwork in thy solitude, do not make the commandment of the fathers a pretext for love of money. In order to avoid despondency thou must have some trifling occupation which does not trouble the mind. If however thou desirest to bestow more care upon it, for the sake of alms, know then that the order of prayer is more excellent than alms; if thou desirest to do so because of thy need, without being covetous, that which is sufficient to fulfill thy want is what our Lord provides thee with. He never has left His servants in want of transitory things. Seek ye first the kingdom of God and His righteousness, and all these things shall be added unto you, before ye ask, says our Lord.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 53"
