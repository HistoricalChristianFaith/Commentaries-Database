[[commentary]]
quote='''
So we understand two kinds of action in the maggenanutha granted by God unto mankind one is symbolical and intelligible; the other practical. The former is connected with the holiness which is received through divine grace; this means: by the influence of the Holy Ghost a man is made holy in body and soul, as is the case of Elisha and John and Mary the blessed among women. But because this is incomparable and above that which happens to the rank-and-file of creatures we have to come to that partial [holiness] which is granted unto the other saints, in the relation between the limbs and the body.

The mysterious kind of maggenanutha — as the [gifts] imparted unto each of the saints — is a kind of influence which possesses the mind. And when man is deemed worthy of this maggenanutha, the mind is snatched away in ecstasy and expanded by some divine revelation. And as long as the influence possesses the mind, man is exalted above the emotions of psychic deliberations, on account of his communion with the Holy Ghost.

And this is what was said by the Apostle in the form of a prayer unto the Ephesians, when he desired to explain to them this mystery: May the God of our Lord Jesus Christ, the Father of glory, give unto you the spirit of wisdom and revelation in the knowledge of Him: the eyes of your hearts being enlightened. What is the result of this? That ye may know what is the hope of His calling and what the riches of the glory of His inheritance in the saints, and what is the exceeding greatness of His power to us-ward who believe.

This is one symbolical kind of maggenanutha, that when this power overshadows a man, he is deemed worthy of the glory of the new world, by revelation. And this is the part that has fallen to the lot of the saints by light; concerning which the blessed Paul says, that those are deemed worthy of it who have received sanctification of the mind from the Spirit, on account of their holy and excellent behaviour.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 54"
