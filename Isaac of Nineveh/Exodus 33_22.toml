[[commentary]]
quote='''
You know, my brethren, that our work is not only that which is accomplished before the eyes of men; but we have also a service which is hidden from the eyes of men and which is not known to novices and lay people. For you are acquainted with the fact, that the solitary is under a rule and not his own master. Therefore if any of his brethren comes to visit him and he answers him not, he shall return immediately without blaming his brother. For he does not know that with which his brother is occupied at that time. The cell of a solitary is the cave of the rock in which God spoke with Moses, as the Fathers say. Those solitaries who have not been put to the test by the service which consists in the true taste of solitude, do not know these things.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 24"
