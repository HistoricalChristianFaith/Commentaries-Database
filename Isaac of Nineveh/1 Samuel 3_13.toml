[[commentary]]
quote='''
I return to what I was saying before: Why then did distress and destruction hit the house of Eli the priest, the righteous old man, a priest and a judge of Israel during forty years? Was it not because of Pinehas and Hophni his sons who treated the women scornfully that came to pray in the tabernacle, though he himself did not sin, at any rate not wilfully, but only in so far as he was silent and reprehended with words only, without showing fervour against the fornication of his sons, so that the judgment of the Lord took revenge on them? And lest any one should think that the Lord shows His zeal only against those who are sinners in their lifetime, He also displays it against this audacious sin hated of Him, in the case of those who are near to Him, His priests and judges and the heads of the people and against those men who were holy unto Him and by whose hands He had done wonderful things, yet whom, when they violated the laws He had laid down, He did not spare.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 10"
