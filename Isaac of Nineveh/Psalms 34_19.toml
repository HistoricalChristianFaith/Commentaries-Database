[[commentary]]
quote='''
Another kind of maggenanutha is that whose action manifests itself practically. It is the intelligible power which constantly covers a man and broods over him, removing from him any injury or accident that threatens to approach his body or soul, something not to be perceived visibly by the mind, but clear and evident to the eye of faith, such as was frequently experienced by the saints; as is written: The angels of the Lord encamp round about them that fear Him and deliver them. And: Many are the afflictions of the righteous; but the Lord delivers them out of them all.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 54"
