[[commentary]]
quote='''
A zealous man will never reach peace of mind. And he that is destitute of peace is also destitute of gladness. Peace of mind is called complete health, zeal is the contrary of peace. He, therefore, that is moved by zeal suffers from a severe illness. Before thou art deemed, o man, to move thy zeal against the illness of others, thou has driven away health from thyself. Thou hast rather to bestow care upon the healing of thyself. If thou desirest however to heal the sick, know that those who are sick, are in want of nursing more than in want of vituperation. So, whilst thou doest not help others, thou vexest thyself by a severe illness. Zeal is not counted among man as a form of wisdom, but as one of the illnesses of the soul, namely a narrowmindedness and a great ignorance. The principle of divine wisdom is quietness acquired by magnanimity, and the endurance of human weaknesses. Ye, therefore, that are strong, bear the loads of the sick, and direct the transgressor in a meek spirit. The Apostle counts among the fruits of the Holy Spirit peace and patience.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 50"
