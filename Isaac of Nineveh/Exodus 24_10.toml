[[commentary]]
quote='''
‘The impulses are drowned in a heavy drunkenness and man is no longer in this world, Then there is no longer discrimination of body or of soul, nor recollection of anything, as Euagrius says.

Prayer namely is steadfastness of mind, which is terminated only by the light of the holy Trinity through ecstasy. Thou seest, how prayer is terminated when those insights which are born in the spirit from prayer, pass into ecstasy, as I have said in the beginning of this treatise and in several places further on.

Further he says: Steadfastness of mind is highness of intelligible apperceptions, which resembles the colour of the sky over which rises, at the time of prayer, the light of the holy Trinity. When is a man deemed worthy of the whole of this grace such that during prayer he is exalted unto this height? He says: When the mind puts off the old man and puts on the new one by grace, then it also sees its steadfastness at the time of prayer, resembling sapphire or the colour of heaven, as the place of God was called by the elders of Israel, to whom it appeared on the mountain.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 22"
