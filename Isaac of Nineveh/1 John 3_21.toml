[[commentary]]
quote='''
Some one was asked when one could believe that he had been deemed worthy of forgiveness of sins. He answered: when he perceives that he inwardly hates them with a complete hate, and that his mode of life is the contrary of what it previously was. He who is in such a state, will trust that his sins have been forgiven by God, on account of the witness borne by the conscience of his soul, according to the word of the Apostle. The heart which does not blame is a witness concerning itself.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 27"

[[commentary]]
quote='''
It is impossible for a man to acquire confidence in God, if he has not before fulfilled His will in part. Confidence in God and manliness of heart rise from the testimony of conscience. For on account of the true testimony of our mind we acquire confidence in God. The testimony of the mind has its origin therein that a man is not despised by his soul for neglect of his duty, as far as this is possible.

If our heart does not despise us, then we are frank with God. Frankness has its origin in a firm behaviour and in an unstained mind.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 38"
