[[commentary]]
quote='''
Therefore, every one who puts on the garment in which our Creator appeared, by means of a body full of holiness, puts on Christ. For with the likeness in which He appeared to His creation and in which He dealt with us, He desired to clad His inner man and in it He desired to appear to His fellow men, and with it [He desired] to be adorned in stead of with the garment of honour and outward glory. And therefore the creatures prostrate themselves as to a lord before every one whom they see being clad with this likeness, silent or speaking, on account of the honour of their Lord with which they saw Him clad and in which He wandered about.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 82"
