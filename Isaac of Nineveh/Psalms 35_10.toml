[[commentary]]
quote='''
And thou must gaze at all times at this sight of God’s continual care for the work of His hands: the mind absorbed in ecstasy, the senses at rest, weak man prostrated on his face in prayer, [in astate] in which no tongue can speak and in which no heart can pray, but by astonishment at these things even prayer is cut off.

This is the idleness which is more profitable than work, when a man is purely at rest, with his senses and his impulses, being continually prostrated before his Lord. And even his bones in silence send up a glorification to God, in this so-called idleness; as the prophet says: All my bones shall say: Lord, who is like unto Thee At this time, above all affections, thou findest the demon of haughtiness bound and thrown at the feet of the soul. By this gift, as it is said, man becomes worthy of the love of God and of complete humility.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 71"
