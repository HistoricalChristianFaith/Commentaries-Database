[[commentary]]
quote='''
The seducer is allowed to make war upon the saints in all these ways of temptation, in order that the love of God which is in them may be proved under these circumstances; namely, whether they are friends of God and whether they adhere to His love because [worldly] things are at a distance, far off and absent; or whether they love God really, so as to make war on and to despise these things even when present, without being vanquished and without giving up their love of God through the allurements of those temptations. This does not happen that they may be known to God through these [temptations], but to the Devil, who is very desirous of recognizing them, if possible. As he also said concerning Job, asking God about him: Doth Job fear God for nought? If then a little negligence creeps in, the temptator approaches with authority in accordance with the power he has over them. Then the unjust appears in the desire which these things excite in him. And through these things those are proved who are strong in their love of Him, those who despise all these things, which in their eyes are counted as nothing in comparison with the love of God. In this they are humble, ascribing merits only to Him who strengthens all and who is the cause of their victory and into His hands they entrust the battle. For Thou art the powerful, and the battle is Thine. Fight, o Lord, and be victorious on our behalf.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 36"
