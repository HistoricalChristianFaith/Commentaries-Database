[[commentary]]
quote='''
What are the affections? The allurements that lie in the things and the stories of this world, evoking a bodily want, which never cease as long as the world exists. If a man however has been deemed worthy [to know] the divine intellect and to taste and perceive what is more profitable than those things, their allurements will not enter his heart, because their place has been taken by a desire which is better than those. Then the allurements of [worldly] things and those which are born from them, will no longer approach his heart. But they will stand outside idle. Not that the allurements of the affections do not exist any longer, but the heart which could receive them is dead to them and living to some other thing. Not that it desists from watchfulness and the labour of discrimination, but there is no longer any struggle in the mind, in as much as the inner being is satisfied by the delight of some other thing. So, when a man is satisfied with delicious and fat food, and his inner being with abundance and delight, and then he sees food which is unclean and steeped in its own filth, his inner being does not need care to check it from desire or to withhold it from gazing at it with lust; nay, the whole inner being is even shaken and troubled by the sight of it. This does not happen on account of the uncleanness of the food, for possibly he had been accustomed to it before; but on account of the comparison with the excellence of that other food which had filled his inner being with every delight. So it is with the health of the soul. If the heart has really received the apperception of spiritual things and the contemplation of the world to be, its inner being will regard the affections in the way mentioned.

And just as a man when he loses his riches and becomes poor and destitute of the glorious and excellent food in which he delighted in the royal palace, forgets its delicious taste, and those glorious dishes are no longer with him and his stomach is deprived of the delight of their abundance, and he has necessarily to turn towards food which is by far inferior — so it is with him that was deemed worthy of health of soul. If he is deprived of that divine delight because he neglects his duty and falls asleep and becomes neglectful he again turns towards that sordid food, that has been steeped in all filth and which is unclean; and his inner being does not examine, because the stomach of his soul is empty. For to the hungry soul even bitter things are sweet.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 62"
