[[commentary]]
quote='''
If it is certain to thee and thou believest that God cares for thee, thou needest not be anxious for thy body nor have care concerning the guiding of thyself by means. But if thou doubtest this and desirest to care for thyself, without God, thou art more wretched than any man, and what does life mean to thee? Throw thy care on God, that thou be strengthened against all fear. He who once has entrusted his life to God, will dwell in mental peace.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 5"

[[commentary]]
quote='''
Because it is so difficult to free oneself from them when one has once become entangled in any of them, it is a matter of wisdom to struggle in order not to come near to them, so that one may be free even of the thought of them, and thus the mind be able to look towards something different. I do not mean that we should not provide for our wants; for these are a necessity and may bereave nature of life. But we should not put them in the position of the principal service by giving them the preference over the service of God. But attending to these needs in part, we must leave the care of them to ‘God. We should confide in Him rather than in ourselves.

And when a man ventures to despise these [earthly] things wholly for the sake of spiritual things, I do not esteem this improper, because we have all the encouragements of scripture that teaches us to be strong in hope; as is written: The Lord is at hand; be careful for nothing. And David says: Cast thy care upon the Lord and He shall sustain thee. The rich do lack and suffer hunger: but they that seek the Lord shall not want any good thing. And our Lord has commanded us, saying: Be careful for nothing, but frequently think of the future things. And these earthly things which are necessary because of the needs of nature, will not fail thee.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 56"
