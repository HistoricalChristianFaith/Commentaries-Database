[[commentary]]
quote='''
The service of the cross is a double one. And this is in accordance with its twofold nature which is divided into two parts: patience in face of bodily troubles, which is accomplished through the instrumentality of the anger of the soul this is called practice. And: the subtle intellectual service, in intercourse with God, constant prayer and so on, which is performed with the desiring part and called theory. The one purifies the affectable part by the strength of zeal; the other clears the intellectual part by the influence of the love of the soul, which is the natural appetite.

Every one, who, before being trained in the former part, passes to the latter, on account of the pleasures it affords, desiringly — or rather negligently — causes [God’s] anger to blow against him because, before having mortified his members on the earth, i. e. before healing the illness of his deliberations by endurance under the labours and the shame of the cross, he has dared to occupy his mind with the glory of the cross. This is what has been said by the ancient saints: If the mind desires to ascend the cross before the senses have become silent on account of weakness, the anger of God will strike it,

By the fact of the ascension of the cross causing anger he does not point to the first part, namely, the bearing of troubles patiently (which is the crucifying of the body) but to the theoretical ascension which is the second part, and which is [truly] subsequent to the healing of the soul. For he who hastens to meditate with his heart vain imaginations concerning future things, while his mind is still stained by reprehensible passions, will be reduced to silence on his way by punishment, because, before having purified his mind by means of the trials met in subduing the carnal desires, on account of what he has heard and read merely, he has hastened headlong to tread a path full of darkness, being blind --- a way which exposes to danger day and night even those whose sight is sound and full of light, and who possess Grace as their guide, while their eyes are full of tears, and with prayer and weeping they convert night into day, on account of the danger of the course and the hard rocks they meet, and the phantoms of sham truth that are frequently found on the way among those who pretend to be true. For divine things present themselves spontaneously, without thy perceiving them, if the place of the heart be pure and undefiled.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 2"
