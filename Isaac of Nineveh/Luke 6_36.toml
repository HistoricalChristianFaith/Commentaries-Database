[[commentary]]
quote='''
If thou wishest to have mental communion with God, by acquiring the impression of that delight that is not subject to the senses, then cling to mercy. For the holy beauty is formed by that element within thee, which resembles mercy. And all the practices of mercy bring the soul, immediately, into communion with the unique splendour of the divine glory.

Spiritual unification is a perpetual recollection, that is vivid in the heart without variation, with burning love. By constancy in clinging to the commandments, it acquires the force to remain in union; and there is found, in a way neither secondary nor natural, matter for spiritual vision, in which the soul may confide absolutely. So a man is drawn towards ecstasy by the closing of the two classes of senses: those of the flesh and those of the soul. There is no other way towards spiritual love which is modeller of invisible images, than to begin in the first place with mercy in accordance with the word of our Lord who commands it to those who obey him, in connection with the perfection of the Father, the foundation.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 1"

[[commentary]]
quote='''
It is well that thou hast brought forward from the Gospel a comparison and a tested example for the great duty of solitude, as if we were opponents to it or tried to reject it as something superfluous. For our Lord has defined mercy as the similitude to the Father by which those who perform it, can approach Him. This is true. And we, the solitaries, do not honour solitude without mercy, though we try to remain far from care and trouble, as much as possible. Not that we deny necessary things, when they present themselves, but we care for solitude, because in it we are constantly with God in lonely intercourse, by which it is more possible to be purified from perturbance and to approach unto quiet of mind, though such cases are rare. But when it is necessary, we will not neglect mercifulness, compelling ourselves perpetually to be inwardly full of mercy toward all kinds of rational beings, at all times.

For so the doctrine of our Lord orders, and this is the distinction of our solitude, and it is not due to fortune. So none of us neglects to show this inward virtue, — when the time corresponds with the work and the necessity — making known his love openly, by deeds; especially those who have not laid themselves wholly under the rule of solitude do so. But solitude to such ones means that they never meet anyone, except once a week. They have not cut themselves off, by the definition of their rule, from showing their fellow man deeds of mercy; only that one does so who is very devoted and solitary so that he avoids the sight of men. For we know, that without love of the fellow-man, the mind is not able to become illuminated by intercourse with and love unto God. Therefore, which of the says solitaries, who possessed food and clothing, could see his neighbour hungry and naked and persevere in withholding his hand?

Or which of them, when his brother according to the flesh was sick and tormented and destitute of visitors, has honoured the rule of his reclusion more than the life of his fellow, on account of love of solitude?

Where, however, such circumstances, are not at hand, we keep in mind love and mercy unto the fellow man. Where practice is near, God demands from us plainly that we perform it actually.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 81"
