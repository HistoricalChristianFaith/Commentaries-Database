[[commentary]]
quote='''
Nature liable to deviation is not able to receive here the perfection of divine truth, or to know the whole will of God regarding the class of rational beings; even Paul and his equals are not sufficient for this; till the liability to err has been taken away, so that nature no longer errs through being aware of this.

What is parity and disparity? Disparity of contemplation — differences and variations in one soul — is the eternal thought of God being unattainable. Parity is truth being revealed.

If a nature able to err should receive in this world the exact truth, it would die by the power of its liability to err. This is ‘O, depth of the riches and ‘How unsearchable are His judgments’ and ‘Who has known the mind of God’ and the like, which in an astonishing way and among sighs rise in the mind from time to time, which by some is called the Cloud. From this, disparity of contemplation and divergence of insight are born concerning the unattainable inquiry into God’s judgments.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 26"
