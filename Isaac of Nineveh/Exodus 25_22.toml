[[commentary]]
quote='''
And over the ark was placed a plate, from which the priest was taught by divine revelation what was required, at the time when the high priest, once in a year, entered the inner sanctuary at the dreadful time of prayer while all the tribes of the children of Israel were gathered and stood in trembling and fear in the outer tabernacle in prayer. And while the high priest was prostrated the voice of God was heard from the plate over the ark, in a dreadful, unspeakable revelation. How dreadful was the mystery that was ministered in this ceremony! So all the revelations and visions that happened unto the saints, happened at the time of prayer.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 22"
