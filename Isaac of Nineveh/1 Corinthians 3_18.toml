[[commentary]]
quote='''
When thou liest before God in prayer, then be in thy consideration as a an ant and as the reptiles of the earth and as the beetle. And stammer as a villager and speak not before Him with knowledge. With a childlike mind approach unto God and walk before Him, that thou mayest be worthy of the paternal care which fathers entertain in behalf of their young children.

It has been said: The Lord guards the children. A child may approach a serpent and take it at its neck; and the animal will not bite. A child may go naked during the whole winter. And while others are clad and covered — yet the cold penetrates all their members — he sits down naked in the day of frost and ice, without suffering, because the body of their childhood is covered by a different, invisible garment, by that hidden care which guards the frail members of childhood, lest injury from any side approach them. Doest thou now believe that there is a secret care in behalf of the tender body which is expecially liable to all kinds of injuries on account of its tenderness and the weakness of its joints, so that it is guarded from obnoxious influences so that they do not cause suffering? For the Lord guards the child. Thou must not only apply this and believe it in the case of children, but also in the case of those who, being wise in the world, leave their knowledge, and relying upon that wisdom which is all-sufficient become children by their own will. Then they learn wisdom, which is not to be learnt by labours of exercise.

Also the blessed Apostle, who was wise in divine things, has beautifully said in an admonition: If any man seemeth to be wise in this world, let him become a fool, that he may be wise.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 77"
