[[commentary]]
quote='''
The disciple. And what shall we do with the body? As soon as it is surrounded by distress, the desire of the will towards the good is relaxed as well as its former zeal.

The teacher. This will usually happen to those the half of whose being has sought God, whereas the other half has remained in the world. This means that their heart is not yet free from earthly things, but they are in doubt, sometimes looking behind, sometimes forward; and I think that the sage admonishes those who approach the way of God in this state of indecision, saying: Do not approach it doublehearted, but approach it as one who sows or as one who reaps. And our Lord, seeing that among those who wish to renunciate completely, there are some in such a state of mind, that their will is ready but their thoughts are drawn backwards by fear of troubles, on account of their love of the body which they have not yet thrown away — He will take from them this lassitude of mind saying to them briefly: If any man will come after me, let him first deny himself, What is the denial that is spoken of here? It is the denial of the flesh. And one who is destined to suffer crucifixion, he accepts the thought of death, and goes forth, as one who does not think that he has any further share in this life. This is [what is meant by] taking up the cross and following me. The cross denotes the will prepared for any trouble. And declaring why this is so, He says: Whoever will save his soul in this world, will lose it in the true life, And whoever will lose his individuality here for my sake, will find it there. This means: he that sets his steps on the way of crucifixion and yet still cares to think of this bodily life, bereaves his soul of the faith for which to suffer he is gone out. Because this thought does not allow him to approach trouble; but, being always with him, allures him gradually and makes him leave the centre of the struggle for blessed life. Such thoughts grow in him till they have overpowered him. But he whose mind has complied with the loss of his self for the sake of finding the love of Me, he will be preserved, without harm, for life everlasting. This is, he who gives up his life for my sake will find it’.

This means: make free thy soul as it were from thyself and prepare it for a complete loss of life. If the departure from this life finds thee in this state of mind, I will give thee life everlasting, according to my promise. And if thou perseverest in this life, I will show my promise in thee later as a confirmation of the future goods. Therefore, thou wilt find that immortal life when thou despisest temporal life. If thou enterest the strife with such a preparation, all that was most sorrowful and difficult, will be contemptible in thy eyes. The preparation of such a will even is not a struggle for his life in his mind, even when peril of death threatens him. In short: If a man does not hate his temporal life, because of love of the future life, he cannot bear troubles.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 35"

[[commentary]]
quote='''
All excellence whatever, is called the cross, because it accomplishes the order of the spirit. For all those who desire in the fear of God to live in Jesus Christ, are assailed by troubles. If any man will come after me, let him deny himself, and take up his cross and follow me. Whoever would save his life in comfort, loses it; and who gives up his life for my sake, finds it. Therefore our Lord has placed before thee the cross, that thou mightest pronounce death on thy soul and thereupon cause it to follow Him,

There is nothing so strong as despair. It does not know how it can be defeated by anything belonging to those of the right or to those of the left hand. When a man in his mind has given up his life, none is more courageous than he is, and there is no enemy who is able to meet him, and there is no trouble the fame of which can weaken his mind. For any trouble whatever is inferior to death, and he has resolved to take death upon himself.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 77"
