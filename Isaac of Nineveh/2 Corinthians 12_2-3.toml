[[commentary]]
quote='''
Man, therefore, may freely go so far as to say: all excellence whatever and all orders of prayer whatever, in body or in spirit, are in the realm of free will, as well as the mind that dominates the senses. But when the influence of the spirit reigns over the mind that regulates the senses and the deliberations, freedom is taken away from nature which no longer governs but is governed. And how could there be prayer at that time, when nature does not possess power over its self, but is conducted by an outward force without knowing whither. Nature then does not direct the emotions of the spirit according to its will, but captivity reigns over nature in that hour and conducts it there where sensual apperception ceases; because nature even has no will at that time, even to this extent that it does not know whether it is in or without the body, as scripture testifies. Has therefore such a one prayer who is a captive to this degree and who even does not know himself? So no one should say with blasphemy that there is anyone who could venture to say that it is possible to pray spiritual prayer. This audaciousness the Meṣalleyānē vindicate for themselves, those haughty ignorants who proclaim concerning themselves that they are able to pray spiritual prayer when they like. But those who are humble and have insight and are inclined to learn from the Fathers and know the limits of nature, do not abandon their deliberations to this audaciousness.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 22"
