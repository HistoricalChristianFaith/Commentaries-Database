[[commentary]]
quote='''
Those who have destroyed this knowledge which distinguishes between good and evil, are scorned by the prophet: man has no insight in his own honour The honour of rational nature is the faculty to distinguish between good and evil. Rightly the prophet compares those who have destroyed this faculty with the brutes who possess no distinguishing and rational soul.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 44"
