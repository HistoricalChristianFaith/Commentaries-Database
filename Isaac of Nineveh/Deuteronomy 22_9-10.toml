[[commentary]]
quote='''
And what is prayer? He replied: The mind’s being free from all that is earthly and the heart’s turning its gaze completely towards the desire of future hope. Who deviates from this, is as one who sews in his furrow mixed seed and as one who ploughs with ox and ass together.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 74"
