[[commentary]]
quote='''
Woe to the solitary who is unfaithful to his covenant and, treading down his conscience, gives Satan entrance into him, in small and great matters of sin, so that he does not find strength to defend against the enemies the breach [Satan] has made in his soul. And with what countenance will he behold the chaste, his companions, when they are brought together from whom he has separated his way to go the way of destruction, and the freedom of speech with God which the pious possess, and the prayer which arises from the chaste heart towards God and uplifts itself and even passes the hosts of the angels and stops not until it reaches God’s majesty, holding the keys in its hands ceasing not until it has acquired its demand, returing unto the mouth that has sent it, with gladness. [And with what countenance will he look upon] what is harder than all these things, viz. that, as he has separated his way from them here, so Christ will separate him from them on that day. When the brilliant clouds will bear on their backs the bodies that have become splendid by purification and that enter the great gate of heaven. Therefore the ungodly shall not stand in the judgment, because their work is already judgment, nor sinners in the congregation of the righteous, in the resurrection before the judgment, nor the impure in the ranks of the saints.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 9"
