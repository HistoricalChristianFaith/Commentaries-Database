[[commentary]]
quote='''
A merciful man is the physician of his own soul; for he drives away from his inner being the dark mist, as by a strong wind. Mercy is a good investment with God, according to the Gospel of life: Blessed is the merciful: for he shall obtain mercy. Not only in the world to be, symbolically also here. What mercy is greater than this, that when a man is moved by mercy unto his follow man and becomes his partner in suffering, our Lord delivers his soul from gloomy darkness which is intelligible Hell, and brings it in contact with the light of life, for its comfort? The blessed Euagrius has well said: A clear way is founded upon mercy.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 65"
