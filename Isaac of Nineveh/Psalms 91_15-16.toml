[[commentary]]
quote='''
Such things and the like are [signs of] universal care. The righteous possesses this grace perpetually; as an individual, not as a member of the community. The rest, however, are ordered by God to govern themselves with insight and to mingle in their affairs intelligence with the care of God. But the righteous does not need this insight in order to govern with it his affairs. In stead of this insight he possesses faith by which he storms strong fortresses. And such things as we have enumerated he does not fear. As scripture says: the righteous is bald as a lion and he ventures all through his faith. Not as one who tempts God but as one who possesses confidence in Him and as one who is armed and strongly clad with the force of the spirit. And concerning His great perpetual care for him God has said thus: I will be with him in trouble; I will deliver him and honour him. With long life I will satisfy him, and shew him my salvation. He who is weak in his works and lax or negligent, or whose deeds are evil, it is impossible that this hope be his. But it will be for him that is constantly with God in all things and who is His relative by his beautiful works, who directs constantly the gaze of his heart towards God’s grace, as David says: My eyes fail while I wait for the Lord.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 7"
