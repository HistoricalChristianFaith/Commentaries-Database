[[commentary]]
quote='''
Therefore His care not only drives us unto prayer and watchfulness, but even scourges us with the whip of temptations, in view of the subtlety and incomprehensibility of those things which continually happen to us and superate the power of our knowledge, things among which we are found continually and involuntarily. And even although our mind be firm and willed to the good, yet often His care scourges us with temptations, as the blessed Paul says: Lest I should be exalted through the abondance of the revelations, there was given me a thorn in the flesh, the messenger of Satan to buffet me. For this thing I besought the Lord thrice that He might take from me temptation (namely that I might in freedom perform the work which He had ordered me). And He said unto me: My grace is sufficient for thee: for my strength is made perfect in weakness

Therefore, my Lord, if this is thy will, and our childish nature so much needs a master who rules and exhorts that even a man who is so fond of thy love as I am and so zealous a follower of good that he does not see the world at all because of his drunkenness in thee, so that thou hast brought me so far as to see revelations and visions which a fleshly tongue is not allowed to interpret, and to hear the sound of the service of the spiritual orders, so that I am deemed worthy of sight full of spiritual sanctities, that such a man as I with all this is not able to guard his own person, I who am a man perfect in Christ, — because there is still something which because of its subtleness resists the power of my knowledge — I that possess the mind of Christ — [if all this be so] then, my Lord, I rejoice at my illnesses, at troubles, reclusions, bonds, compulsions, on the part of nature or on the part of natural beings, or on the part of the fiend of nature.

Joyfully, therefore, I will bear my illnesses, namely my temptations, which the power of Christ brings upon me. If, with all these, I still require the rod of temptations in order to augment thy influence upon me and that I may be guarded by thy presence, I known that there is none whom thou lovest better than me.

And because thou hast made me greater than many others and hast not given to any of my fellow Apostles what thou hast given to me — namely to know the glorifications of thy powers; and because thou hast called me an elect vessel and hast entrusted me with the guardianship of thy love; because of all these and that I know that the preaching of thy gospel has made excellent progress, while I am free from the bonds of temptations on account of all these things I know that thou wouldst have given men freedom, if this were profitable to me. But thou hast not wished that I should be without trouble and without care in this world; and thou werst not anxious to promote the preaching of thy gospel to the same degree as thou werst anxious that I should profit by my temptations, and my soul be kept healthy with thee.

Therefore, o thou who art discriminating, if the gift of the temptations be so great that a man, even if he be as exalted and advanced in spiritual state as Paul’s degree was, still requires fear and watchfulness and gathers profit by meeting temptations, who then can reach a place of security in the world of mortality full of robbers, and receive stability (which was not given to the holy angels, lest they should become perfect before us), thus receiving before all people, -—— spiritual and bodily ones — such a gift that, according to his wish, he should be without varying states at all, without a temptation even approaching to his deliberations?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 73"
