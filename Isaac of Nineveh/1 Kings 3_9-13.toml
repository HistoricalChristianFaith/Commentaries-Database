[[commentary]]
quote='''
Seek well-esteemed things from Him, who does not withhold; then thou wilt receive honour from Him, because of the choice of thy wise will. Solomon sought wisdom and he received, apart from it, the earthly kingdom, because he knew how to ask wisely viz. great things from the King.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 3"
