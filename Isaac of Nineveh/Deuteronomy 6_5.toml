[[commentary]]
quote='''
The commandment: Love the Lord thy God with thy whole soul and with thy whole heart and more than the whole world and nature and what belongs to nature — is accomplished when thou abidest in solitude. And also the commandment ordering the love of our fellow men, is included in it. Wilt thou acquire the love of thy fellow-man, according to the commandment of the Gospel, within thyself, then withdraw from him. Then the flame of his love will burn in thee and thou wilt run to see him as if thou wouldst see the angel of light. Doest thou further desire that thy beloved ones long after thee? See their faces at fixed days only.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 41"
