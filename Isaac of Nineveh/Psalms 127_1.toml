[[commentary]]
quote='''
Knowledge perpetually seeks means to preserve those who possess it. What does faith do? ‘Exept the Lord build the house and keep the city, they labour in vain that build it and wake to watch, Never will he that seeks refuge with faith use means.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 51"
