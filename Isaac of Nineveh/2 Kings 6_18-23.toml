[[commentary]]
quote='''
The purity of compassion is known from patience in bearing wrong, and the perfection of humility from idle oppression borne gladly. If thou art really compassionate, thou wilt not be angry within thyself, when thou art bereft of thy possessions iniquitously and with injustice; and thou wilt not show thy suffering openly unto others, but let the sin of thy injustice be effaced by passionate compassion, as the headiness of wine is abated by [mixing it with] much water. But show thou the mark of purity that arises from great mercy, by adding there-unto other things and do well to those who do thee wrong, with gladness, as also the blessed Elisha did unto his enemies, which were come to take him prisoner who, by praying and by blinding their eyes by visions, made manifest the power at his disposal. And if he had wished this, they would have been annihilated before him; but by providing them with food and drink and letting them go away, he made manifest the mercy he possessed within himself.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 6"
