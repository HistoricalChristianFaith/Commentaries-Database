[[commentary]]
quote='''
If the apple of thy soul’s eye has not been purified, do not venture to look at the sun, lest thou be bereaved of thy usual visual power and thou be thrown into one of those intelligible places which are Tartarus and a type of Hell, namely darkness without God, whither those who with the impulses of their mind leave nature, wander by the cognitive nature which they possess. Therefore he that ventured to go to the banquet in sordid garments, was ordered to be thrown out into that outer darkness. By the banquet is designated the sight of spiritual knowledge. The institutions in it are the manifold divine mysteries, full of joy and exultation and delight of the soul. The garment of the banquet he calls the mantle of purity; the sordid garments the emotions of the affections in the soul which are defiled, the outer darkness, the state without any delight of true knowledge and communion with God. He that is clad with such garments and ventures to think phantastically with his intellect on the heights of God and to introduce and to settle his soul within the spiritual contemplations of that holy banquet which is made to dawn in the pure only, and who, partaking only of the delight of the affections, wishes to mingle in the delight of that banquet — is suddenly overwhelmed, as it were by some hallucination, and expelled thence unto the place without rays, which is called Hell and destruction, which is ignorance and oblivion of God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 76"
