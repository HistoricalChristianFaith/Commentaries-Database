[[commentary]]
quote='''
The disciple. And what shall we do with the body? As soon as it is surrounded by distress, the desire of the will towards the good is relaxed as well as its former zeal.

The teacher. This will usually happen to those the half of whose being has sought God, whereas the other half has remained in the world. This means that their heart is not yet free from earthly things, but they are in doubt, sometimes looking behind, sometimes forward; and I think that the sage admonishes those who approach the way of God in this state of indecision, saying: Do not approach it doublehearted, but approach it as one who sows or as one who reaps.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 35"
