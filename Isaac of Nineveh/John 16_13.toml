[[commentary]]
quote='''
I do not call this faith, that a man believes in the discrimination of the adorable hypostases of the Essence, or in the properties of His nature, or in the amazing government regarding humanity consisting in His accepting our nature. But I call this faith: the intelligible light which by grace dawns in the soul and, without leaving room for doubt, supports the heart by the testimony of the mind, namely by the persuasion of hope which is far from all presumptions and not by tradition from hearsay. This light will show the spiritual eyes of the soul the hidden mysteries which are in the soul, and the secret riches of divinity which are concealed from the eyes of fleshly men and are revealed spiritually to those who at the table of Christ are brought up in meditation upon His laws; as He says: If ye keep my commandments, I shall send you the Spirit, the Comforter, whom the world cannot receive, and He will guide you into all truth. Thus He will also show man the holy power, which surrounds him at all times. That power is the Comforter.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 51"
