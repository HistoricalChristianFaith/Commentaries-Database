[[commentary]]
quote='''
As to those whom he sees to be of a weak will and of feeble thought he combates them vehemently from the beginning by submitting them to heavy and terrible temptations, in order to make them taste the nature of his evil from the very beginning of the way. In this way he intends to instill into them a horror of the first battle so that this way shall appear to them difficult to walk. And if the beginning is very difficult, who could endure to the end, facing all the battles which are ranged in the middle? Thus they will not again venture to withstand him or to look for other help, on account of their being totally occupied with the thought of his attacks. And when he has pressed them a little vehemently they take to flight. Or better: God lets him oppress them, without helping them in any way because they have engaged in the battle of the Lord, with a cold heart and hesitatingly. Cursed is every one who performs the work of the Lord without diligence, retaining his hand from bloodshed. But also: His help is near those who fear Him; and He commands that we should not meet the foe with a cold and fearful heart. Begin to destroy him and to wage war with him and I will begin to put the dread of thee and the fear of thee upon the nations that are under the whole heaven.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 36"
