[[commentary]]
quote='''
Often hard circumstances and multifarious affairs oppose themselves, full of danger and of such a nature that knowledge and the means of wisdom are absolutely unable to give any profit; things which are so hard that they withstand the whole power of the domain of human knowledge.

But faith is never’ vanquished by anything. What help can human knowledge afford in manifest struggles against invisible natures and incorporeal powers and many things of that kind:

Thou seest how weak the power of knowledge and how strong the power of faith is. Knowledge restrains its pupils from approaching unto anything which can do harm to nature. But look at the power of faith; what does it command its sons? In my name shall they cast out devils and shall take up serpents; and if they drink any deadly thing, it shall not hurt them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 51"
