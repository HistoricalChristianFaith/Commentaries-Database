[[commentary]]
quote='''
Do not seek from God that which He is anxious to give us even if we do not beg for it, which He withholds not from his housemates and not even from those who are wholly foreign to the knowledge of Him, nay who do not even know that He is.

Use not vain repetitions, as the heathen do. What is this “as the heathen’? The corporeal things are sought by the peoples of the earth; but give ye no thought saying what shall we eat, or what shall we drink or wherewithal! shall we be clothed? For your Father knoweth that ye also have need of all these things.

A son does not ask bread from his father, but makes supplication concerning the great portions in store for him in the house of his father. That which our Lord has commanded concerning daily bread, namely that we pray for it, is a petition which he handed down to the common people, because of the weakness of their minds. Regard that which he commands to those who are perfect in knowledge and sound of soul, viz.: ye shall not take thought of food or raiment. If your Father bestows care upon the fowls that have no soul, how much more upon you. But ask from God the Kingdom and righteousness, then he will add these things too.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 3"

[[commentary]]
quote='''
There is a trust in God, with a faith of the heart, which is beautiful and which rises from the discernment of knowledge. And there is another trust which is insipid and rises from folly; and this is false trust.

That a man who has absolutely no care for any of these passing things and whose soul is night and day given to the works of God, without thought of any work of this world because of his great zeal for exellence and because of his absorbing anxiety for the divine things, and who, therefore, neglects to prepare dress and food and to fix and to prepare a place for his shelter and the like, — that such a man trusts in God that He will prepare in its due season all he needs and that He will care for him — this is really true trust and a trust of wisdom. And in truth, for such a man it is also beautiful to confide in God, because he is His servant, and he is ladened with thoughts concerning Him and he bears the weight of His works without neglect. And so it is becoming to Him to show care for him, which is distinguished from His care for the rest of mankind, because he has eminently main. tained in his person the word of our Lord saying: seek the kingdom of God and His righteousness and: Take no thought for your body. And if ye care for this, the world will prepare all for you, like as a servant. And as unto a master it will be obedient unto your words without hesitation, without thwarting your will in anything.

Therefore, because such a man does not desist on account of [worldly] causes from standing perpetually before Him, he will not surrender himself to those things which the body needs. For he does not care for other things either, but he abstains from them all equally, be they small or great, be they things of comfort or pleasure — an abstention based on fear of God. So he will find sustenance in a wondrous way, even though he does not touch any of these things, nor fatigues himself with them,
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 7"
