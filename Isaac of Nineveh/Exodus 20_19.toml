[[commentary]]
quote='''
I dessire to open my month, my brethren, to speak on the elevated place of humility; but I am filled with fear, as a man who is conscious of the fact, that he will speak concerning God in a tale of his own speech. For humility is the garment of divinity; for the word which became man, put it on and spoke in it with us, through our body. And every one who puts it on in truth, by humility takes the likeness of Him that has descended from His height and concealed the splendour of His majesty and hidden His glory, lest the creation should perish by the sight of Him. For the creation was not able to see Him without His being united to a part of it which He should assume and speak with them through it, then the creation was able to hear the word of His mouth, face to face.

The children of Israel were not able to listen to His voice, while He spoke with them from within the cloud; then should the creation be able to bear the sight of Him openly? For the children of Israel were so troubled that they said to Moses: Let us speak with thee, and listen thou to His words for us; but let Him not speak with us, lest we die. And so terrible was the sight, that even the intermediary said: I fear and tremble. for on mount Sinai the splendour of His glory revealed itself, and the whole mountain smoked and was shaken from fear of His revelation that took place on it, so that even the beasts which approached the foot of the mountain, died. And all the children of Israel, on the order of Moses, prepared themselves, every one purifying himself for three days in order to be worthy of listening to the sound of God’s speech and of seeing His revelation. And when the moment came, they were not able to bear the sight of His light, and the vehemence of the sound of His thunder.

But now that He has poured out His grace on the world by His coming, not in earthquake nor in fire, nor with a terrible and vehement sound — but descending as the rain upon the lamb’s fleece, and as the soft dew drops which softly descend upon the earth — it has pleased Him to speak with us in a different way, concealing His majesty in the cover of flesh, speaking to us while being in us, in the garment which Providence had woven from the womb of the virgin, so that we, seeing Him speak with us as one of our race, should not be terrified by the sight of Him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 82"
