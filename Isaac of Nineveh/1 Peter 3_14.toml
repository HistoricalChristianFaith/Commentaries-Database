[[commentary]]
quote='''
Then thank without a break Him that has delivered you from the dominion of the darkness of the world and has brought you near the kingdom of His son, and has made you fellows of all the children of light who have suffered for the sake of God, in order that you may gain the part that has fallen to the lot of the saints in the light. And this is what Peter writes in his epistle: But if ye suffer for righteousness’ sake, happy are ye. For you will have a share in Christ’s suffering. Therefore, when thou art free from affliction, do not leap up with joy, nor when circumstances assail thee cover thy face with sadness, reckoning this as something foreign to the way of God.

Behold, for years and generations, the way of God has been leveled by the cross and by death. How is this with thee, that thou seest the afflictions of the way as if they were out of the way? Doest not thou wish to follow the steps of the saints? Or doest thou wish to go a way which is especially for thee, without suffering? The way unto God is a daily cross. No one can ascend unto heaven with comfort, we know where the way of comfort leads.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 59"
