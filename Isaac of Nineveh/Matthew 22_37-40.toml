[[commentary]]
quote='''
Those who fear God, my beloved, are provided for so that they keep the commandments of our Lord without difficulty, even although that seems possible to them only through labours, and danger is thought to be incurred for its sake. Christ has defined and limited their totality to two commandments, which make up the sum of them all. I mean the love of God, and what He taught to be the like of this: love unto His image. The possession of the former is the aim of spiritual contemplation; that of the second, of contemplation and practice. Now, because God’s nature is simple and not composite and invisible and not subject to want, the heart in its occupation equally does not require practice, nor bodily performance, nor material motion. Its performance is simple, and, on account of partial union in the [human] intellect, is in accordance with the simple nature of its adorable cause, which is exalted above the apperception of the senses and the flesh.

The second commandment, love of mankind, is to be accomplished in a double way, in accordance with its double nature. I mean, that we accomplish it with the heart, invisibly, and at the same time with the body, manifestly; but those things which are accomplished by practice, happen also in secret and in cooperation with the heart.

For, as man’s nature is composed of two parts, — namely body and soul — so all things regarding him are provided in a double way, in accordance with the double character of his constitution. As everywhere practice is anterior to contemplation, so it is impossible for man to elevate himself unto that elevated part, unless he has accomplished before, by practice, that which is lower.

Therefore, let no one venture to speak concerning the acquisition of love of his fellowmen, as if he possessed it already in his soul, if the part is still wanting which has to be accomplished by the body, according to the opportunity for practice granted by strength, time and place. Then by faith has to be acquired that part of love which is received and recognized by the heart. When, on account of these things, we have been made ourselves known as faithful and true, as far as possible, then power is given to the soul to stretch itself towards the grand part of exalted and divine contemplation, by means of simple emotions and without comparison.

Where man has no opportunity to fulfill love of his fellow man practically by visible and by bodily things, it is sufficient in the eyes of God, that we keep love of our fellowman with our mind only, especially if we are able constantly to administer the service of that universal part, that is more excellent. If however we are destitute of the totality of that universal part, we should fill up this gap by the lower commandment, namely by apperceptible practice, consisting therein that, according to the time happening, we should provide for the comfort of our brethren, by wearying our body; lest our liberty become an opportunity for the flesh, in that we should occupy ourselves with idle things under the pretext of lonely intercourse. For it is known, that it is not allowed to demand from him who is wholly deprived of human intercourse and who is wholly occupied with God, being dead to all beings because of his being deprived of them — that he should serve men..
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 81"
