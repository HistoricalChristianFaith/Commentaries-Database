[[commentary]]
quote='''
But as often as an apperception falls in the minds of the saints, this revelation of whatsoever mystery it be, comes from these [heavenly beings]. When it is allowed by God, revelation is handed down by each higher class to that which is lower, unto the lowest; in the same way, when it is allowed by the godhead, the mystery is handed down by those who are worthy of it unto human beings.

By their intermediary, at any rate, the saints become receivers of the light of contemplation, by which they behold the praised Essence, which is a mystery which they do not learn from each other. Those [higher beings] are administering spirits, which are sent to those who are to inherit life through the apperception of such insights of the truths as are peculiar to them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 27"
