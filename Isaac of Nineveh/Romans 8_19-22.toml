[[commentary]]
quote='''
And when he is satisfied with these things his contemplation turns from them towards the things of this world in which he is still abiding, saying with amazement: O the depth of the riches both of the wisdom and knowledge and unsearchable mind of God! How unsearchable are His judgments and His ways past finding out. Since He has prepared a different world which is so amazing, into which He shall introduce all rational beings and keep them without variance in life without end. What then is the reason why He has made this world first, which He has made large and has provided with a great many species, and has made a place of a multitude of affections? And He has set us first in this world and implanted in our nature a strong love of its own life; then He expels us from it, gradually, by death and prescribes to us a long interval in a state without sensual apperception, like stones and wood, a state during which He destroys our image and pours out our mettle and mixes it up with the earth. And He permits our building to be demolished and ruined, till it has lost all likeness with [its previous] composition. Then, at the time appointed by His wisdom, working according to His free will, He resurrects us in a different likeness which He knows and introduces -us into that new order; and not only us, but also the holy angels, who do not need the use of this world on account of their amazing nature. For all of them are nearly perfect, awaiting the resurrection and the elevation of our fallen state, when the human race shall rise from the dust, and its fallen state be quickened unto new life. For on account of us they are hindered from entering, till once the gate of that new world will be opened, which they expect. For even the class of the angels sighs with us in that it sees us loaded with the weight of the body while it hopes and expects the revelation of the children of God, so that it itself may be freed from slavery that perishes, in the freedom of the glory of the children of God,
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 35"
