[[commentary]]
quote='''
And further consider this: if the soul possesses the strength to reject recollections of apperceptible things by the strength of the hope which reigns over the heart and makes strong the inner senses by an unfathomable conviction; and if the heart has acquired, without forethought, the habit of being captured so that it does no longer [perceive] earthly things, through continual intercourse with our Saviour, and thou possessest knowledge so as to distinguish the different designations of this intercourse, when thou hearest them — solitude cultivated without interruption will make it easy to the soul to acquire the taste of these.

They disappear however, after having been present, through the neglect of those who have received them, and for a long time they do not reappear.

On account of these, man ventures to adduce with confidence the testimony of his own mind; so the blessed Paul says: Tor I am persuaded that neither death, nor life, nor things present, nor things to come, nor any other thing shall be able to separate me from the love of Christ. Then should bodily and psychic trouble, or persecution or hunger, or nakedness or loneliness, or captivity or danger or the sword? No, not even the angels of Satan, nor his powers with their evil cunning; nor glory which makes efforts by its alluring flatteries; nor oppressions and scorn by their vain blows.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 70"
