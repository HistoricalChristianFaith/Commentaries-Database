[[commentary]]
quote='''
David, the heart of God, for whose excellence the promise made unto the righteous Fathers was carried out in his offspring from whom sprouted Christ the Saviour of the whole world — was it not by adultery with one woman and for the feebleness of one moment that from a glance of his eye he got an arrow in his soul and wrought evil against himself from within his own house; for the son which was to come forth from his loins was to pursue him?

And this happened although he showed repentance and the Lord said to him: Also have I put away thy sin; thou shalt not die, and he wept a flood of tears so that he moistened his bed during the nights.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 10"
