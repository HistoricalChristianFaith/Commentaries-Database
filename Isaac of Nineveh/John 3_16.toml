[[commentary]]
quote='''
As to those who have reached perfection, their token is, that if ten times every day they are delivered to burning for the sake of the love of mankind, they are not saturated with it. As also Moses said to God: If thou wilt not pardon the children of Israel, blot me out of thy book which thou hast written. And as also the blessed Paul said: I could desire to be removed afar from Christ, if thereby the children of Israel would come near to the faith of life. And if it be thus that it is possible that they, for this reason, will believe in Christ and will come to life everlasting and will not be alienated from the living God. Then, as is written: I rejoice in my sufferings for you, o peoples.. Even so the other Apostles have undergone all kinds of death, for the sake of the love of the life of mankind. The sum of all is God, the Lord of all, who from love of His creatures, has delivered His son to death on the cross. For God so loved the world, that He gave his only begotten son for it. Not that He was not able to save us in another way, but in this way it was possible to show us His abundant love abundantly, namely by bringing us near to Him by the death of His son. If He had anything more dear to Him, He would have given it us, in order that by it our race might be His. And out of His great love He did not even choose to urge our freedom by compulsion, though He was able to do so. But His aim was, that we should come near to Him by the love of our mind.

And our Lord obeyed His father out of love unto us, taking upon Him scorn and suffering joyfully, as Scripture says: Who for the joy that was set before him endured the cross, despising the shame. Therefore our Lord said in the night in which He was betrayed: This is my body which is given for the salvation of the world unto life. And this is my blood which is shed for all for the remission of sins, In behalf of them I offer myself.

And so all the saints have reached this accomplishment when they became perfect, so that they resembled God in effusion of love and compassion for mankind. And they asked for themselves as a token of their resembling God, that they should be perfect in the love of their fellows. So did also the solitary Fathers, that they might bear in themselves constantly this likeness full of the life of Christ, the Lord of the Universe.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 74"
