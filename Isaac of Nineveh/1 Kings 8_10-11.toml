[[commentary]]
quote='''
Keep pure, o brother, the beauties of thy chastity, by tears and fasting and sitting alone by thyself. When the right course of the natural sphere has been finished and [the soul] has reached that great luminary, which supports the spheres of the stars multitudinous in their personal distinctions, as Paul says in order to prove the future resurrection, and when it has mingled with its rays — I do not mean in the natural sense — then the vehicle of the will shall be bound with the bonds of unconsciousness and the two exuberant fountains will dry up in their basins. And then the priests will leave the sanctuary on account of the cloud of God’s majesty. At that time the king of Israel will be Solomon, viz. that peace which is born from humility; he will build a house for the Lord and completely provide it with all the sacred vessels.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 34"
