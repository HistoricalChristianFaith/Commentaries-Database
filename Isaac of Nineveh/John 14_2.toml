[[commentary]]
quote='''
The many mansions in the house of the Father denote the spiritual degrees of the inhabitants of that place. This means: the different gifts and the spiritual ranks in which they rejoice spiritually, and the variety of the classes of gifts. It is not to be understood in such a manner, that every person has really his defined portion in the various local habitations, so that [these differences] manifest themselves openly in the variety ot particular mansions apponited for every one; but they are to be compared with the personal advantage every one of us obtains by the personal yet common use of this apperceptible sun in accordance with the purity of his visual power. Thus as the eyelid regulates the effusion of the quality of light, and as a lamp, in one and the same house, distributes the use of its light in a varied fashion, although the lamp itself is not bereft of the simplicity of its light, so as to become many with its varied aspects, so, those who have been deemed worthy of that place, although dwelling in one mansion, indivisible as it Is into parts, attract, at a fixed time, from one and the same intelligible sun, every one according to the rank of his behaviour, the own delight, in one air and one place and one abode and with one sight and one mode. The high degree of his neighbour’s rank is not seen by him who is inferior, namely not as if it arose from the many gifts of his neighbour and from the scarcity of his own gifts, so that it should be to him a cause of grief and spiritual torment, absit! To think such things in the place of delights were impossible. Every one rejoices within himself at the gift he has been deemed worthy of, and at the height of his rank. But the outward aspect of them all, is one; and the place is one. And what is still truer, they dwell as in encampments of angels, in one aereal abode, in equality of actual vision, with secret consciousness of their [different] ranks, in contemplative revelations that vary according to their degree.

If real personal beings possess, apart from working apperceptive power, also spiritual impulses, no one will venture, even in the world to be, to proclaim in words an order of things deviating from this one: that [that the only differentiation is with regard to] the intellect and further [spiritual] powers, even though [this differentiation] be very manifest on account of the perfection of nature. True, therefore, is the word spoken by the Fathers on the one hand there is ignorance for an undetermined time; on the other hand there is a limited time for the manifestation of its abrogation, together with [the revelation of] other peculiar mysteries that are defined in silence by the [supreme] being. For there is no mean between complete elevation and absolute abasement, in the future separation. Either one belongs wholly to the high ones or wholly to the low ones. But within this and the other [state] there are varying modes of retribution.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 6"
