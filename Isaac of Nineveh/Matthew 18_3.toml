[[commentary]]
quote='''
But as to faith, what is it? If yes and no approach unto it equally, faith does not consent to remain in that position, That knowledge cannot be used without methods and means, that it even does not exist without them, is known. And this is the token of its sceptical attitude regarding truth. Faith on the other hand requires a serene and simple mind, far from any cunning or need of means. Behold, how knowledge and faith are each other’s opposites.

The mansion of faith is a childlike mind and a pure heart. For in the purity of their heart people have praised God. For ‘except ye be converted and become as little children’ and so on. Knowledge, however is the persecutor and opposite of these two.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 51"

[[commentary]]
quote='''
Spiritual knowledge is simple, not illuminated by psychic deliberations. Before the mind has been freed from manifold deliberations and has reached the unified simplicity of purity, it is not able to perceive spiritual things.

This order of knowledge, consisting therein that man here already perceives the delight of the life of the world to be, rejects much deliberation. And psychic knowledge is not able, apart from the gatherings of many deliberations, to know anything which is received by serenity of spirit. And the word of our Lord is not denied: Except ye be converted and become as little children, ye shall not enter into the kingdom of heaven. Indeed, many are those who do not reach this innocence; but on account of their beautiful works a portion is kept for them with our Lord in the kingdom of heaven, as can be recognized from the understanding of the blessings which He especially pronounced in His gospel. In these blessings He has touched a variety of ways of behaviour [from which it appears] that for every man who walks to Him, in whatever measure on whatever way, the gate of the kingdom of heaven is open. But the word ‘Except ye be converted and become as little children’ means that here man perceives the delight of the kingdom. The kingdom of heaven is said to be spiritual contemplation. And this is not found by the labours of the deliberations, but it is tasted by grace. And before a man has become pure, he is not able even to hear. Because it is not acquired by learning. If thou reachest purity, my son, which is acquired through the faith of the heart and by reclusion from men, and thou forgettest the knowledge of this world and doest not perceive it, then [spiritual contemplation] suddenly is found within thee, without inquiring after it. Erect a pillar and pour oil upon it, and thou wilt find thy treasure within thee.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 77"
