[[commentary]]
quote='''
When, however, we have found love, we eat the heavenly bread and we are sustained without labour and without weariness. Heavenly bread is that which has descended from heaven and which gives the world life; this is the food of angels. He that has found love eats Christ at all times and becomes immortal from thence onwards. For whoever eats of this bread shall not taste death in eternity. Blessed is he that has eaten from the bread of love which is Jesus. Whoever is fed with love is fed with Christ, who is the allgoverning God. Witness is John who says: God is Love. Thus he smells life from God, that lives with love in this creation. He breathes here of the air of resurrection. In this air the righteous will delight at resurrection.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 43"
