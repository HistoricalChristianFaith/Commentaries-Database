[[commentary]]
quote='''
Without matter: as for instance the men that appeared unto Abraham, the ladder of Jacob, the revelation about the tabernacle (try only to look at and to act with the likeness that appeared unto thee on the mountain, and so on), the divine light of exalted rays that shone for Paul on the way and blinded his eyes. It is well known that, though a revelation, it was visible and perceptible by the senses, so that also those who were with him saw and heard it; yet it was not a material revelation, nor a natural and elementary light, as the blessed commentator denotes in his commentary on the story in the Acts: And those who went on the way with Paul, stood in amazement while they heard the voice, yet did not see anyone. He comments on the words, in amazement’ thus: In silence without [uttering] a word, also seized with doubt, because they had caught the voice that had spoken to him and, as far as it was possible for them, had seen the light that appeared unto him. Lest it should be surmised later that Saul had invented what had happened and that which had been wrought unto him, while none of those who were with him had heard or seen it. But they did not see anyone. For they did not see Jesus, because, as I have said, that which appeared was even no sensible light, but an incomprehensible apperception which in an immaterial way was given him by divine action in the likeness of a vision of light, so that he thought that the heavens were opened and so on. — These are the revelations which have taken place through the medium of the bodily senses. They are exalted above any commixture with the elements or any of the sensible and human events.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 19"
