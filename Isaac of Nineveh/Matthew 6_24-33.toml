[[commentary]]
quote='''
True is the word of our Lord who has said that no one can possess love of God side by side with love of the world; nor mingle with the world and with God, nor care for the world and care for God. Apart from all that is connected with vain glory, many of us generally deviate because of bodily want, we who have promised to serve the kingdom of heaven but who do not remember the promise of our Lord who has said: If ye bestow all your care upon the kingdom of -heaven, I shall not leave you in want of the needs of sensible nature; but these things will come to you spontaneously before ye think of their use at the time of want, although I do not even let you want because of care for them.

Upon the soulless fowls which have been created in your behalf, God bestows care; and should He neglect you that care for righteousness? To him that cares for spiritual things, even partially, bodily things are prepared even when he does not provide for them, in accordance with their necessity and in their time.

He that shows care for the last named things more than is becoming, will fall from God, even involuntarily. While we bestow care upon things connected with the name of our Lord, He will provide us with both kinds, in accordance with the measure of our care and the importance of the want of each of them. We should however not ask God’s care in these bodily things for ourselves as a remuneration for our labours, but we should direct our whole service towards the future hope. For he that once has given himself to excellence with the love of his soul and longs after its service with his whole being, does not think of looking after bodily things, whether they are or are not.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 59"
