[[commentary]]
quote='''
For until the outward man becomes dead to the ways of the world, not only to sin, but also to the whole bodily service, and the inward man to the seducing recollections of evil things, until the natural impulse is brought low and the body has almost died through labours, so that the sweetness of sin has no more mastery over the heart, the spirit of God does not spread its sweetness and man’s limbs are not unveiled to life and divine impulses do not show themselves in the soul. And as long as a man’s heart is not freed from earthly care, except those necessary things which nature imposes upon him at the time of his necessity — and which he leaves also to God to arrange — spiritual drunkenness cannot rise in him and that madness, for which the Apostle was disdained, he will not perceive; for the multitude of books had made him mad.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 4"
