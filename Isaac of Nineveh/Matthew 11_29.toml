[[commentary]]
quote='''
In the humble there is never violence nor terror nor confusion, nor hot nor quick emotions. But at all times he abides in rest. If heaven should fall on the earth, the humble would not be moved.

Not every one who is quiet, is humble. But every one who is humble is also quiet. There does not exist one who is humble without being submissive. Those who are submissive without being humble are found in large numbers. This is the meek and humble concerning whom our Lord has said: Learn of me, that I am meak and lowly in heart; and ye shall find rest unto your souls. The humble is content at all times, because there is nothing which moves his spirit. As it is not possible for a man to move a mountain, so the spirit of the humble is unmoved, if it is possible to say so. And perhaps it is not even foolish to say that even the humble does not belong to this world, because he is not destroyed nor moved by distresses: even [emotions] of joy cause ecstasy and effusion to him. But all his joy and true excultation is in the things of his Lord.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 74"
