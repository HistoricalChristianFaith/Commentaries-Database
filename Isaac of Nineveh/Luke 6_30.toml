[[commentary]]
quote='''
But I say: if the merciful be not even above justice, he is not merciful. This means, that he will not only show mercy unto men on his own part, but that he will voluntarily suffer iniquity with delight, so that he does not maintain and postulate full justice in his dealings with his fellow men, but is merciful towards him and surpassing justice by mercy, wreathing for himself the crown not of the just under the law, but of the perfect under the new covenant.

To give the poor from one’s own possessions, and to cover the naked on seeing them, to love the neighbour as one self, not to do iniquity or falsehood, are things commanded also by the old law. But perfection in behaviour, according to the new covenant, commands thus: If a man takes from thee, do not demand back; give every one who asks from thee. And not only hast thou to suffer gladly iniquitous dealing in possessions and other outward things, but thou hast even to give thyself in behalf of thy neighbour.

Merciful is he, who shows his compassion cowards his neighbour not only in gifts, but who after hearing or seeing anything that causes suffering to any one, cannot withhold his heart from burning; who, even if he receives a blow on his cheek from his brother, does not venture to repay him even with a word and so cause him to suffer intellectually.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 4"
