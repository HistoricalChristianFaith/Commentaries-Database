[[commentary]]
quote='''
Very different is the word of practice from words of beauty. Even without experience wisdom knows how to adorn its words and to speak the truth even without having any acquaintance with it, and to express itself concerning excellence without any experience of [practical] performance. A word proceeding from practice, is a treasure to confide in. But idle wisdom is a pawn causing shame; it is as when an artist paints water on walls, without being able to quench his thirst by it; or as a man who dreams beautiful dreams.

He who from practical experience speaks about excellence, brings the word to his hearers as it were from the capital won by his own commerce; and, as from the stock of his soul, sows his teachings in the ears of his audience. He opens his mouth freely before his spiritual sons, in the manner of old Jacob before chaste Joseph, [saying]: I have given thee one portion above thy brethren, which I took out of the hand of the Amorite with my sword and with my bow.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 1"
