[[commentary]]
quote='''
That a man himself is not able to become worthy of such a greatness that he should be led into temptations in behalf of these divine things with joy, but only by a gift from Christ, is witnessed by the blessed apostle. For so great is this thing, that he openly calls it a gift that a man for the sake of the hope in God should be prepared to suffer by faith, saying: For unto you it is given from God, not only to believe in Christ, but also to suffer for his sake.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 59"
