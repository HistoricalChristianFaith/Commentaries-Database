[[commentary]]
quote='''
When on the other hand the mind profits by the subtle meditation upon the world to be, constantly thoughts unrivalled will move in it; and expecting the things which he does not see, he goes to meet them, forgetting the things of this world, sometimes forgetting himself, because of his utter absorption in ideas, neglecting visible things on account of these deliberations. So deliberations as well as practice are despised by him as long as he cares for these ideas. He is devoid of enslaving love related to single persons, but universal love which does not need sight is fixed in his soul. The apperception of recollection concerning human things gradually disappears from his mind, while the thought of hidden things increases in it, gains force and vanquishes bodily deliberations, till it is free from corruptible things, as far as nature allows this. And if it were not that the common [human] recollection was aroused in him, when the need of something which cannot absolutely be dispensed with presents itself, his mind would be directed towards future things the most of the time, by such thoughts as would give him profit of these things. And because of these he becomes a stranger to all the wisdom of this world. So he becomes void of recollection and a fool as it were on account of his having examined human wisdom.

Blessed is the man who has been deemed worthy of these things. Tears will not cease to drop from his eyes when he turns unto himself with the recollection of those things by which men are led into error, and why forgiveness is granted them, and whereby the universal end is brought about, and what labour and error is caused by these. It is said concerning Paul that on account of these emotions which prevailed over his soul, for three years he was not quit of tears, unable to subdue them.

Such a deliberation accompanied with the emotion of tears rules man when he perceives the future hope and then turns his mind towards the things of this world, [thinking] how small psychic life is in comparison with the hope preserved for eternities, in the new life. By such affectability man grows dead unto all transitory things and thought of them; and all affections of body and soul die in him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 56"
