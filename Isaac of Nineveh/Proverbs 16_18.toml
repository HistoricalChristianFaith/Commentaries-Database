[[commentary]]
quote='''
First man is removed from the thought of his duty in his mind, then the spirit of haughtiness approaches him. At first the angel of care suffers this, but afterwards it withdraws itself from him. As long as the angel is near him, he provides him solely with thoughts of righteousness. But when he has wronged the angel and it has withdrawn itself from him, then a foreign power approaches him, and no single just thought will furthermore be in him. Haughtiness comes before ruin, says the sage; so humbleness before a gift. By the quantity of haughtiness which is found in the soul, is judged the scale of ruin which is on the point of being sent to it by God. For none of the sins does God withdraw from man, leaving him wholly because He dislikes him, until He finds the mind.seized with haughtiness or blasphemy. And the former [of these two] becomes the cause of the latter.

Those who in their mind leave the way of humbleness and so become devoid of divine help, either fall into the impurity of lasciviousness, or into blasphemy, or into mental ruin.

Those who extol themselves on account of excellent behaviour, usually fall into into evil lasciviousness; those who extol themselves on account of knowledge and mental discipline, into blasphemy or trouble of mind.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 58"
