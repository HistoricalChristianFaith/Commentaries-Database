[[commentary]]
quote='''
The blessed Paul teaches us saying: Put off the old man and put on the new man, which after God is created in righteousness and holiness.

He does not say: Put on the new man over the old man. For he knows that this is not possible. Look, how wisely he gives his order. He does not say: Put on the new man who is renewed by the knowledge of God, but he says, first put off this, and then put on the new. Also he says definitely in another place: Flesh and blood cannot inherit the kingdom of God, neither does corruption inherit incorruption. By incorruption he means the knowledge of the other world. By corruption and flesh and blood he designates the corruptible affections of soul and body, which have the place of their motion in the fleshly mind. Purity he calls the new man, and by the kingdom of God he means the exalted and intelligible contemplation of the blessed motions of the essential rays into which the saintly soul only is allowed to enter when its incorruptible emotions are lifted up above corruption and flesh and blood.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 76"
