[[commentary]]
quote='''
Be not dejected because of trespasses. I do not say that thou shouldst not suffer; but thou must not account them as being incurable. Better broken than dead. For one who is broken, there is the physician, who on the cross has implored mercy for those who crucified Him, who asked forgiveness for His murderers while He hung on the cross. ‚All manner of sin and blasphemy shall be forgiven unto men, namely on account of repentance. When Simon who had denied Him, had wept a short time, He forgave him. And after His resurrection, He appointed him as the head of His flock. Three times He asked him: Lovest thou me, even as three times he had denied Him, in order to confirm His pardon.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 65"
