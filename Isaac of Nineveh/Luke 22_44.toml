[[commentary]]
quote='''
In six days God established the existence of this world and created the elements and connected their existence with the administration of never resting motion and [ordered] that they should not rest from their course before their dissolution. And from the force of these, viz. the primeval elements, He has composed our body. He did not give those rest from their motions; neither did He grant our body, their offspring, rest from service. As the term of our nature He fixed rest, when we shall follow our first relatives, rest consisting in the dissolution of life. Thus He said to Adam: In the sweat of thy face thou shalt eat bread. Till when? Till thou returnest unto the dust, for out of it wast thou taken. Thou shalt work in the ground and it shall bring forth to thee thorns and thistles. This denotes symbolically that this world is a world of service as long as it exists.

Our Lord, since the night when He sweated, has changed this sweat caused by working in the earth which brings forth thorns and thistles, into the sweat which also rises during prayer and which man should produce in the service of righteousness. For five thousand years He left man to work in his sweat, for the way of the saints had not yet been revealed, as the Apostle says. He appeared, however, with His grace in the latter days and ordered our free will to replace sweat by sweat. At any rate this change does not show that He ordered rest. But He was merciful upon us for the sake of our long and weary work in the earth. If, however, we desist from sweating for this [spiritual service], we must necessarily reap thorns; for desisting from this, means the service of the material earth which brings forth thorns and thistles according to her nature. In reality the thorns are the affections which grow in us from bodily seed. As we bear the image of Adam so we necessarily bear his affections too. The earth is not free to desist from bearing; for it brings forth on account of its nature. The earth is our relative according to God’s witness unto us ‘the dust out of which thou wast taken’. The one [brings forth] thorns; the other, the rational [earth], affections.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 28"
