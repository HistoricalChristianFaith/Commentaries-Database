[[commentary]]
quote='''
When the spiritual man is near to being quickened in thee, death to all things will come to thee, and thy soul will become hot with gladness which has no equal amongst created beings, and thy deliberations will be concentrated within thee, on account of the sweetness in thy heart. But when the world is quickened in thee, distraction of mind will increase in thee, and lack of courage without constancy.

World I call the affections conceived by distraction. When they are born and have become fullgrown they become sin and kill man. As men are not born without a mother, so affections are not born without distraction of mind, nor does sin become fullgrown without intercourse with the affections.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 46"
