[[commentary]]
quote='''
Knowledge adheres to the domain of nature, in all its ways. Faith makes its course above nature. Knowledge does not admit unto itself anything which is in disharmony with nature, not even for the sake of trial, but it lets these things dwell at a distance. Faith on the other hand orders with authority and says: Thou shalt tread upon the serpent and the lion: the young lion and the dragon shalt thou trample under feet.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 51"
