[[commentary]]
quote='''
At the end of the period of tears thou wilt reach peace of deliberations; and by this peace of deliberations thou wilt reach the divine rest of which Paul speaks, rest in part, according to [our] nature.

From the beginning of [this period of] rest onward, the mind will see hidden things. Then the Holy Ghost will begin to reveal unto it heavenly things, while God dwells in thee and promotes spiritual fruits in thee. Then thou wilt perceive the state which the whole nature will receive in the renewal of all things, dimly and mysteriously.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 14"
