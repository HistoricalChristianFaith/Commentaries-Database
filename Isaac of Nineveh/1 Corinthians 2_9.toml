[[commentary]]
quote='''
What the things of the world-to-be are, the scriptures do not explain. How we may acquire the faculty to perceive their delight even now, without change of nature or local transition, they teach us plainly.

Though they call these things by beloved names of glorious things which are delightful and esteemed by us, in order to spur us on, still by saying that the eye has not seen, nor the ear heard and so on, they show us that the things-to-be are not equal to any of the present things, by their being incomprehensible. They have to be reckoned by us as giving us even now spiritual delight, not the enjoyment of those things in themselves, such as are found outside the being of the receivers and promised us for the future state. Otherwise ‘The Kingdom of God is within you’ and “Thy Kingdom come’ would teach us that we possess within us a pledge of the delight which is in those things. For it is necessary that there be a resemblance between these and the pledge, partial for the present though it be, yet to be complete in the future. Again the word “as through a glass’ shows us the comparability anyhow, even if they are not one in essence, If now, according to the trustworthy testimonies of the commentators of the scriptures, this is due to an intelligible influence of the Holy Ghost, and is a part of that total one, then — apart from the spiritual influence that by intelligible apprehension forms a communication between the Holy Ghost and those who are influenced — the delight of the saints in the world is not occasioned by any sensible mediator, be it senses or sense-organs, save only the wombs which contain all in defined order, which we may call the profusion of light, though not the intelligible profusion.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 2"

[[commentary]]
quote='''
This takes place when the mind is elevated above [earthly] beings and the body is without tears, apprehension and emotionality, except only its natural animal existence. For this knowledge does not stoop to take with it as secondary companions of spiritual sight the ideas of the things of the sensual world. “Whether in the body or out of it, I do not know’. It is God who knows this as well as the fact that he has heard unutterable words.

All that is heard by the ears can be spoken. But he did not hear sensible sounds, nor did he [see] in a vision of corporeal sensible images, but with the impulses of the mind, in a state of rapture apart from the body, the will having no part in it. The eye never saw the like, the ear never heard its equal and his varied knowledge never dreamt of recollecting the likeness of what his heart saw, namely that which God has in store to show the pure in heart when they have become dead to the world: not corporeal sight received through the eyes of the flesh in gross distinctions, nor fantasies which they themselves form in their mind, in a secondary way, but simplicity of contemplation concerning things of intellect and faith — the contrary of partition and division — that show the images of the elements.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 4"

[[commentary]]
quote='''
Fear is the paternal rod which guides us up to the spiritual Eden. When we have arrived there, it leaves us and returns. Eden is the divine love wherein is the paradise of all goods, where the blessed Paul was sustained by supernatural food. When he had eaten from the tree of life which is there, he exclaimed: eye has not seen, nor ear heard neither have entered into the heart of man the things which God hath prepared for them that love him. Adam was bereft of this tree by the promise of the Devil. The tree of life is the divine love which Adam lost by his fall, after which he worked and wearied himself. Those who are bereft of divine love are still eating the bread that is won by the sweat of their labour, even though they work righteousness, as was commanded to the head of our race when he lost it by his fall. Until we find love, we work in the earth with her thorns. Among thorns we sow and reap, even if we sow the seed of righteousness. Perpetually we are pricked by them, even if we are justified, and live with sweat on our faces.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 43"

[[commentary]]
quote='''
As to the mysteries which belong to the spirit, namely the emotions during spiritual prayer, and the entering of the mind behind the curtain of the holy of holies, and the apperception of the indestructible inheritance — if a man does not pay their duty, God is not willing to grant them, even if the whole creation should beseech in behalf of him. Their duty is purity of the soul. When a man has reached purity from the affections, what no eye has seen and no ear has heard and what has not entered into the heart of man to ask in prayer, is revealed to him by purity, which during no moment ceases from mysteries and spiritual visions. And what the force of spring is wont to work unto the nature of the earth, this grace works unto the soul by purity. The power of spring makes even the smallest roots in the valleys bud, warming the earth as fire does the cauldron, so that it sends forth the treasures of the plants which God has laid in the earth’s nature, to the gladness of the creation and to His glory.

So grace makes manifest all the glory which God has hidden in the nature of the soul showing the soul this glory and making it glad because of its own beauty. So that when it sees the great and unspeakable treasures which God has laid in it and which were hidden from it by the defiled mantle of affections and ignorance, but which now that it has torn asunder the garment of the affections, He has shown to it — it is captured on account of its gladness by His love and turns its back on earthly things.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 75"
