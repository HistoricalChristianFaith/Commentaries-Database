[[commentary]]
quote='''
Be a herald of God’s goodness, because He provides for thee who art not worthy of it. And though thou art guilty of many things, it is not known that he is desirous of revenge. And for the few things in which thou showest [good] will, he remunerates thee with many. Do not call God just anymore, for His justice is not known in His dealings with thee. Though David called Him just and righteous, still His son has made it clear to us that He is good and kind. For He is kind towards the evil and the miscreant. How callest thou God just when thou comest across the section on the hire of the workmen? Friend, I do thee no wrong. I will give unto this last, even as unto thee. Or is thy eye evil because I am good? How can any one call God just if he come across the story of the prodigal son? When he had spent all in’ fornication, it was only on account of the contrition he showed that [the father] ran to throw himself at his neck and made him lord of all his possessions. No one else can say concerning Him that he doubts His goodness. His son testifies this concerning Him. How could there be justice in God, when Christ died for us who were sinners? If He is compassionate here, we believe that there will be no change in Him. Far be it from us that we should wickedly think that God could not possibly be compassionate. God’s properties are not liable to variations as those of mortals. It is not possible that He sometimes should not possess a thing, and afterwards should possess it, or that what He possesses should diminish or increase as that which creatures possess. But that which God possesses is with Him from eternity, and it is with Him for ever, as also the blessed commentator says in his exposition on the creation.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 50"
