[[commentary]]
quote='''
Fix thy gaze on the sphere of the sun according to thy visual strength and only with the object of enjoying its rays, noth with the aim of scrutinizing the course of its wheel, lest even thy limited sight be taken from thee. If thou find honey, eat in measure lest thou, having become satisfied, hast to reject it. The nature of the soul is of small dimensions; and sometimes it proceeds onwards, desiring to learn what is beyond its nature. And many times, during the course of recitation and the contemplation of things, it grasps one or more things; yet the sum of its knowledge is insignificant as compared with what it found. But how far does its knowledge penetrate? Until its deliberations are clad with emotion and trembling. Then it hastens to turn backwards from fear, venturing [from time to time] to penetrate into the luminous things.

But fear witholds it on account of the frightfulness of these things. And discernment warns in silence the mind of the soul not to be audacious lest it should die. What is too hard for thee, seek not; what is too strong for thee, search not. Scrutinize with thy intellect that which has been allowed to thee, and do not venture to approach unto hidden things. Adore therefore and praise in silence and confess thy unability to understand. For too much for thee has been shown to thee, but do not trouble thyself with the rest of His works. As it is not good to eat much honey, so it is not good to examine laudable words. Lest, desiring to gaze from a great distance before we have approached near, we be exhausted by the interminable way, without having the power to gaze, and be injured.

For sometimes in stead of truth fantasies arise; when namely the intellect becomes too weary to understand, and forgets its true essence. And the wise Solomon has well said that he that hath no rule over his own spirit, is like a city that is in ruins and without walls.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 4"
