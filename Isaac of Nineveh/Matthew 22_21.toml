[[commentary]]
quote='''
Whereby have the ancient saints pleased God, those who have trodden the way of our behaviour and have excelled: the holy John of Thebais, that treasury of excellence and fountain of prophecy? Did he comfort his companions with bodily things, in his reclusion, or did he please God by prayer? I confess that there have been [solitaries] who also in these things pleased [God] and gained profit. But they are less in number than those who pleased God by prayer and by renouncing all things. What their help to their followbrethren who live in solitude is, is well known. It consists in helping them as often as they are in want of a profitable word or [in helping them] by offering prayer in behalf of them. Apart from these things, it is not wise for him who dwells in solitude to give place in his heart to recollections or thoughts concerning any one as far as bodily things are concerned. ‘Render unto Caesar the things which are Caesar’s; and unto God the things that are God’s and what belongs to a neighbour is his, and what belongs to God is His’ does not apply to those who dwell in solitude, but to those who walk without. It is not the duty of him who performs the service of the angels with the thoughts of the soul, to please in earthly things; namely to have thought for manual work or to taking from others and giving to others. His service is in heaven.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 18"
