[[commentary]]
quote='''
But if thou remainest in the desert, thou wilt not be tested. For thou seest no woman in the desert nor anything that does harm to thy behaviour, nor [doest thou hear] evil sounds. What hast thou to do with the ways of Egypt and with drinking water from the Nile? Understand what I say.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 37"
