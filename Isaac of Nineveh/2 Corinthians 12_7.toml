[[commentary]]
quote='''
They learn the weakness of nature and the help afforded by divine power when He first withdraws power from them while they are in temptations. Then they perceive the weakness of nature and the strength of temptations and the wickedness of the Fiend, [perceiving] of which nature their Fiend is, with which nature they are clad, and how they are guarded by divine power; and how, though they run and are uplifted, when the divine power withdraws itself from them, they become weak before all passions.

Through all this they acquire humbleness, and press close to God, expecting His help and persevering in prayer. How could they have acquired all this, if they had not experienced myriads of evils, without God’s caring for their being surrounded by them? ‘And lest I should be exalted through the abundance of revelations, there was given me a thorn in the flesh, the messenger of Satan.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 61"
