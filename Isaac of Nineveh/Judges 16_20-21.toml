[[commentary]]
quote='''
Why then was Simson rejected by God, Simson, the man of strength, the Naziraean from the womb, the sanctified to God, whose birth was annunciated by an angel like that of John the son of Zecharia, through whose hand [God] wrought marvels and signs, and who by the supernatural strength which God infused into his body smote a thousand men with the jawbone of an ass and became a saviour and a judge unto Israel? Was it not because he made impure and defiled his hallowed limbs by intercourse with a harlot, that the Lord left him and gave him into the hands of his enemies?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 10"
