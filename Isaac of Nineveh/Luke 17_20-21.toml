[[commentary]]
quote='''
When knowledge pursues visible things, concerning which instruction is acquired through the senses, it is called natural. When it pursues the intelligible forces behind the visible things in non-bodily species, it is called spiritual. For perception is received by the spirit, not by the senses. And regarding both of these kinds the soul receives the recognizable materials from without. When however knowledge pursues the Essence it is called supernatural, or rather agnostic, because it is elevated above knowledge. As to this [latter kind], the soul does not acquire contemplation concerning it in materials lying without it, as is the case with the former kinds. But without materials, by a sudden working of grace within, unexpectedly, it is revealed in the soul. For the kingdom of God is within us. And it will not come from the place from where it is expected, nor through observation, according to the word of our Lord. But within the hidden form of the intellect it is revealed without cause and without meditation upon it. For the intellect has no materials to meditate upon it.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 52"
