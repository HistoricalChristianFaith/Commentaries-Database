[[commentary]]
quote='''
The eyes of the Lord are upon the humble and His ears are willing to hear them. The prayer of the humble [goes] as it were from his mouth unto [God’s] ear: O Lord, my God, let my darkness be enlightened. When thou art [occupied] in solitude with the beautiful work of humility, when thy soul is near unto coming forth from under the darkness, this will be thy sign: thy heart will burn and glow as with fire, night and day, so that thou wilt esteem all earthly things as ash and dung. This means that it will not even please thee to touch food, on account of the pleasure of the new, fervent deliberations, which move continually within thee. Then, of a sudden, the fountain of tears will be given thee, so that they flow from thy eyes, as the waters of brooks, without compulsion, mingling themselves with all thy work, viz. with thy recitation and with thy prayer, with thy service and with thy meditation, with thy food and with thy drink, with all that thou doest tears will stream. If thou observest this in thyself, take heart, thou hast passed through the sea. Continue thy labours, keep thy cautiousness sound that thy grace may augment from day to day. As long as thou hast not yet met with these things, thy way has not yet finally reached the mountain of God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 6"

[[commentary]]
quote='''
When this fear is anxious on behalf of the body, it is satanic; because faith in God’s care is shaken and man forgets how God thinks of those who care for excellence by caring for them at all times. As the Holy Ghost has said through the mouth of the prophet: The eyes of the Lord are upon the righteous and His ears are [inclined] to hear them. For the thoughts of the Lord are unto those who fear Him. And in another place [the prophet] says, as it were speaking in the name of God, unto those who perform righteousness: There shall no evil befall thee, neither shall any plague come nigh thy dwelling. For He shall give His angels charge over thee to keep thee; they shall bear thee up in their hands, and compare the other words of Scripture.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 55"
