[[commentary]]
quote='''
And by Ezekiel He says: When the wicked turns from his way unto the Lord and do that which is lawful and right, the sins he has committed will not be remembered but he shall live, sayeth the Lord. Thus it is also with the righteous; when he turneth from his righteousness and comitteth sin and iniquity, the righteousness he has done will not be remembered but I will lay a stumbling block before him and by the iniquity he has done he shall die if he remains steadfast in it. Why is this? Because the iniquitous will not stumble on account of his iniquity after he turns unto the Lord. But the righteousness of the righteous will not save him when he sins, if he builds his building on that foundation.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Isaac%2520of%2520Nineveh%2FMystic%2520Treatises.html"
source_title="Mystic Treatises, Chapter 5"
