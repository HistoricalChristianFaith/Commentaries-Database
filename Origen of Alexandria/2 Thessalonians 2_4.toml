[[commentary]]
quote='''
That the Scripture is a temple was expounded by someone before us. And since the Antichrist — "he who opposes and exalts himself above everything that is called God", who sits in the temple of God — is the false word that is held in the Scriptures — which counterfeits the truth by bringing forward, out of the Scriptures, testimonies of impious teachings, when men are unwilling to be won over from any other source; and this very thing is "that which opposes", and it sits both upon the seat of the Scriptures and upon their building, "displaying itself as though it were God". And one may always see the words of the heresies, as Antichrists, sitting in the temple of the Scriptures and wishing, out of those very Scriptures, to win over those who hear them, as though each one of these were itself God the Word in the Scriptures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252024.html'
source_title="COMMENTARY ON MATTHEW 31"

[[commentary]]
quote='''
And where are they "who say they are Jews and are not"? who say: The Jerusalem which is below shall be built, before the consummation of the age comes to pass? "The consummation", he says, "shall be given upon its desolation". But if the temple shall also be built, it shall be built for him "who opposes and exalts himself above all that is called God or that is worshiped, so that he sits in a temple" of this kind, "showing himself as though he were God": "whom the Lord Jesus shall slay with the spirit of his mouth and shall destroy with the illumination of his coming". Whether therefore it pleases some that this Jerusalem be built upon the earth, nevertheless it will not be false which is said, that the consummation is to be given "upon its own desolation".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252024.html'
source_title="COMMENTARY ON MATTHEW 40"
