[[commentary]]
quote='''
Therefore it is necessary to be subject, not only because of wrath, but also because of conscience. For on this account you also pay tributes. For they are God's ministers, attending upon this very thing. By these words Paul indeed orders the Church of God, that, doing nothing adverse to the princes and powers of this world, it may through quiet and tranquillity of life carry out the work of righteousness and piety. For if we were to suppose, for example, that those believing in Christ were not subject to the powers of this world, did not render tributes, nor pay customs, showed fear to none, honor to none, would they not by these things deservedly turn the arms of rulers and princes against themselves, and make their persecutors excusable, but themselves blameworthy? For they would then seem to be assailed not for the cause of faith, but of insolence; and there would be for them indeed a worthy cause of death, but an unworthy merit of death. Foreseeing these things, then, through his immense wisdom, Paul says: Render to all what is due: to whom tribute, tribute; to whom custom, custom; to whom fear, fear; to whom honor, honor. Owe no one anything, save that you love one another. I think, however, that these things too Paul does not utter apart from the customary mysteries of his discourses. For indeed we have already taught in the foregoing that every creature, and all spirits, whether good and upright, or even of a depraved and evil purpose, minister to God, and that each one furnishes that ministry for which he has shown himself fit. For the Apostle pronounced concerning all of them together when he said: Are they not all ministering spirits, sent forth for ministry on account of those who receive the inheritance of salvation? All spirits, therefore, minister to the life of men; each one, however, as we have said, according to his own dignity and desert: for those also are called ministers by whose ministry the things that pertain to the world are accomplished. Whence the Apostle also, who had said of himself, the world is crucified to me, and I to the world, says this as well: But we have not received the spirit of this world, but the Spirit which is from God. But he who is still of the world, and savors the things that are of the world, and seeks the things that are of the flesh, is necessarily subject to the ministers of the world; subject, moreover, because of wrath, which he has treasured up for himself from his sins. And on this account it seems to me that he says: Therefore it is necessary to be subject, not only because of wrath, but also because of conscience; since he who is made subject has in himself that for which he is accused by conscience. To these, therefore, we also pay certain tributes, while we still live according to the flesh and think the things that are of the flesh. For if we cultivate the Lord's vineyard, and exercise within ourselves the true vine, which is Christ, from that vineyard we shall not pay tributes to the ministers of the world, but shall render the fruits in their season to the Lord Himself: according to what the Savior Himself says in the Gospels, that He will take away the vineyard from the evil husbandmen, and will give it to other husbandmen who will render Him the fruits in their season. But this very thing also which he says: Render to all what is due: to whom tribute, tribute; to whom custom, custom — seems to me to be distinguished from what is added in what follows, to whom fear, fear; to whom honor, honor: and that tributes and customs indeed pertain to those ministers of whom we spoke above. For they exact from us the tributes of our land, and the customs of our trading. And why do I speak of ourselves? Even our Lord Jesus Christ, when He was placed in the flesh, had tribute exacted of Him: which He says that He pays for this reason, not because He is a debtor, but lest He should give them offense. But if He who had nothing of Caesar's in Himself, and in whom the prince of this world, when he came, found nothing of his own, although He was free, nevertheless paid tribute (for He came even into death, that He might be free also among the dead) — how much more is it necessary for us to pay out these tributes of the flesh, and, if indeed we trade in the pearls of the kingdom of heaven, to pay the customs of our trading to the spirits who exact them from us through diverse temptations? But fear and honor we ought rather to refer to Him who says through the prophet: Do you not call me both Lord and Father? And if I am Lord, where is my fear? and if I am Father, where is my honor? As for the latter things which he added, that is, Owe no one anything, it is certain that these are to be referred to the ministers, to whom a man becomes a debtor when he has sinned. For we have shown in many places and frequently that sin is a debt. Paul wishes, therefore, that every debt of sin be paid, and that the debt of sin remain with us not at all, but that the debt of charity abide and never cease from us: for it is expedient for us both to pay this daily, and always to owe it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
