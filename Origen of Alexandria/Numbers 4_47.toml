[[commentary]]
quote='''
After this it is said concerning the Levites that they should work from the twenty-fifth year and upward, up to the fiftieth year. "Everyone," it says, "who goes forth to the work of works and to the works that are carried, of the tabernacle of testimony." Observe in these things the distinction of the words of divine Scripture. Where it speaks of the works of the sons of Israel, it does not say "works of works," but "works" alone; but where it speaks of the duties of the Levites, it did not say "works" alone, but "works of works." For just as there are certain holy things, but there are also other holy of holies, so there are certain works and other works of works. Whence it seems to me that Moses, when he perceived that there were certain works indeed visible, but in which there was present another inner, mystical, and hidden understanding, called these not only "works" but "works of works"; but those which he understood to be common and works of the present time alone, these he named "works" alone. There are, then, certain works of works, which I think to be all these things concerning which, whether in the present reading or in Exodus and other places, precept is given under hidden mysteries, and in part to be fulfilled in the present, but in part to be fulfilled in the future. Which works of works, however, as we have said, are commanded to be handed over not to just anyone, but to the Levites alone. And among the Levites themselves no one is called to these works before, but only from the twenty-fifth year of his life at last, up to the fiftieth. But not even the number itself of twenty-five and fifty years is without a mystery. For in the number twenty-five the perfection of the five senses is declared, in such a way that five times five are counted. Which indeed indicates that he is called to accomplish the works of works in mystery who is found to be perfect on every side, with his senses multiplied and purified. But that the fiftieth number holds the mystery of remission and indulgence we have often and abundantly shown in many places of the scriptures. For the fiftieth year is that which is called the jubilee among the Hebrews, in which remission is made both of possessions and of servitude and of debt; and the fiftieth day after the Passover is handed down as a festival in the law. But the Lord too in the Gospel, when he was teaching the parable of remission and indulgence, says that the debtors whom he brings in were liable, one for fifty and the other for five hundred denarii. Now fifty and five hundred are a kindred number; for fifty decades make five hundred. But from another side too this number is made sacred; for if to seven weeks the perfection of one number is added, they make fifty days. Similarly too, if to seventy weeks the completion of one decade is added, they make five hundred. And if it pleases to gather still more abundantly the mysteries of the number fifty and of five hundred, we have it also in this very book of Numbers which is in hand, where, concerning the spoils of the enemies, some indeed offer as gifts to God a fiftieth portion—those who did not go forth to war—but others a five-hundredth; and surely not in vain is the fiftieth and five-hundredth number held here too. But in Genesis also, where God was treating of the indulgence of the Sodomites, whether perhaps they might be able to attain to pardon, the patriarch Abraham, conscious of mysteries of this kind, begins from the number fifty to supplicate the Lord for the indulgence of the Sodomites, and says: "If fifty be found in the city, will you not save the city on account of the fifty?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily05.html'
source_title="HOMILIES ON NUMBERS 5.2"

[[commentary]]
quote='''
But let us return to the matter proposed. The Levites, then, must work in the holy things up to fifty years—the lower ones indeed the works, but the better ones the works of works; and the higher of these must serve in spiritual duties and enter into the holy of holies, and there cover the things that must be covered, and hand them over to the sons of Kohath to be carried on their shoulders and conveyed by their hands. But the rest too, each one, are ordered according to those things which have already often been discussed above. But lest this excessive caution of coverings and veils beget a certain despair and sadness in the hearers, we shall attempt to open up some few things, which it may be both safe for us to disclose and lawful for you to look upon—since indeed, as we said before, we are called a royal race and priesthood, a holy nation and a people for possession. Let us understand, then, by the tabernacle of testimony all the saints who are reckoned under the covenant of God, and that in this tabernacle there are certain ones loftier in merits and higher in grace, and that some of these are indeed called the candlestick—perhaps the Apostles themselves, who enlighten those approaching God. But if there are also any others who in this tabernacle of God show the light of knowledge and doctrine to all who enter, let all these be named the mystical candlestick. Let others be the sacred table—whoever have the loaves of God and refresh and feed the souls that hunger for righteousness. Let others be the altar of incense—whoever are free for prayers and fastings day and night in the temple of God, praying not only for themselves, but also for the whole people. But those to whom God has entrusted the secret mysteries and to whom he has committed the secrets of the hidden judgments of his providence, let them be called the ark of the covenant of God. Furthermore, those who with all confidence, through the sacrifices of prayers and the victims of supplications, reconcile God to men and intervene for the sins of the people, let them be named the mercy-seat. But those who have merited a multitude of knowledge and abundant riches in the recognition of God can be understood as the cherubim; for "cherubim" in our language is interpreted as "multitude of knowledge." But all these, who are designated by these several things which have been enumerated above, must be carried, and carried upon shoulders. Whence perhaps, as I think, the angels who are appointed on account of those who receive the inheritance of salvation are themselves those who carry each of those whom we have mentioned above. For when this tabernacle has been taken down and we have begun to enter to those holy places and to proceed to the place of promise, those who are truly holy and are held among the holy of holies advance, without doubt, with the angels bearing them up, and, until the tabernacle of God comes to rest, they are carried upon shoulders and lifted up in hands. Foreseeing which in the spirit, the prophet said: "For he has commanded his angels concerning you, that they lift you up in their hands, lest perhaps you dash your foot against a stone." Which saying the devil indeed thought must be taken concerning the Savior, but, blinded by malice, he did not understand the mystical words; for my Savior did not need angels, that he might not dash his foot against a stone. The devil slanders the divine Scripture in having brought forth these words as said concerning the Savior; not concerning him, but concerning all the saints is this said, that God commanded his angels for his people, that they might not dash their foot against a stone. But all the things too that are written in this psalm suit any of the righteous rather than the Savior. For the Lord delivers from ruin and from the noonday demon—not the Savior (far be it from us so to understand it), but every righteous person. For it is the righteous who need the help of the angels of God, so that they may not be overthrown by the demons and so that their hearts may not be pierced by the arrow that flies in the darkness. By these same angels, under the same mystery, Paul affirms that certain ones are to be carried in the clouds, when he says: "But we too who are living, who remain, shall be caught up together with them in the clouds to meet Christ in the air." They, then, are caught up by the angels who have been thoroughly purged and made light from sins; but those are carried who are still weighed down by some remnants. So the pillars of the tabernacle too are carried by certain ones, and the courts and the rest of the things which are related by Scripture; but they are carried not by the Israelites, but by the Levites according to this sense which we seem to have briefly touched upon in passing, leaving it to the understanding of the hearers, so that, if anyone burns with greater desire concerning these things, he may kindle for himself the light of knowledge and may descry greater things than these with a more penetrating eye. But may the Lord grant to us that, carried and lifted up by such laborers, we may be freed and defended from the arrow that flies in the darkness and from ruin and from the noonday demon, lest perhaps we dash our foot against a stone, until we come to the place of the promise of the saints, through Christ our Lord, to whom is honor and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily05.html'
source_title="HOMILIES ON NUMBERS 5.3"
