[[commentary]]
quote='''
The Gospel says that there came a woman having an alabaster jar of costly ointment of spikenard — not that sinful woman, but a holy one, of whom now I speak. For I know that Luke spoke of the sinful woman; but Matthew and John and Mark spoke not of a sinful woman. There came, then, not that sinful woman, but a holy one, whose name too John inserted; for it was Mary who had the alabaster jar of costly ointment of spikenard, and she poured it over the head of Jesus. Then, when some were indignant at this — not all the disciples, but Judas alone, saying, This could have been sold for three hundred denarii, and given to the poor — the Master and Savior answered: The poor you have always with you; but me you have not always. For in doing this beforehand she has done it for the day of my burial. Therefore, wherever this Gospel shall be preached, what she has done shall also be told, in memory of her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 2"
