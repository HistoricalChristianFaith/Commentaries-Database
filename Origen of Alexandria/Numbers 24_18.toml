[[commentary]]
quote='''
"And Edom shall be an inheritance, and Esau his enemy shall be an inheritance." Edom is the same as Esau. He according to history indeed is the enemy of Israel, but at the coming, he says, of Christ, he too shall be his inheritance, that is, he shall be received unto the faith and shall not be excluded from the inheritance of Christ. But if we consider it spiritually, Edom is understood as the flesh, which is opposed to the spirit and is its enemy. At the coming, then, of Christ, when the flesh shall have been subjected to the spirit, through the hope of resurrection it too shall come to the inheritance. For not the soul alone, but also the flesh, which once had been an enemy, through the obedience of the spirit shall become a sharer of the inheritance to come. "And Israel did it in power." This is what he says: that then Edom or Esau, that is, the nature of the flesh, shall be called into the fellowship of the inheritance, when Israel, namely the soul, shall have been made to be in power and shall have been fittingly filled with virtues. For if the soul does not come to the virtues, but perseveres in sloth, neither shall the flesh come to the inheritance, but to the judgment of him who can destroy both soul and body in gehenna.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily18.html'
source_title="HOMILIES ON NUMBERS 18.4"
