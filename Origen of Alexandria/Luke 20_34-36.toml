[[commentary]]
quote='''
Answering them, the Savior said: "You are in error, not knowing the Scriptures nor the power of God. For in the resurrection of the dead they will neither marry nor be given in marriage, but they will be like the angels in heaven". Those who will be like the angels will certainly be angels. And at the same time it must be learned that the angels have no marriages. Here indeed, where there is death, both marriages and children are necessary; but where there is immortality, there is need neither of wedlock nor of sons. Let me set before myself a very troublesome question, one that is not easily solved, in the person of those who are most zealous for the Scriptures and who "meditate day and night in the law of the Lord". Where, they say, is it written that "they will neither marry nor be given in marriage"? Passing through both the Old and the New Testament in memory and mind, I do not recall that anything of the kind is anywhere reported. But if perchance it escapes me, let him who knows more teach me; I gladly learn what I do not know; yet as far as I judge, he will find nothing of the sort in either the Old or the New instrument. All their error, therefore, has crept in from the reading of the prophets, which they do not understand — among which is that passage in Isaiah: "my chosen ones will not have children for a curse", and in Deuteronomy among the blessings: "blessed are the children of your womb" — and they suppose that these things are to be in the resurrection, not understanding that spiritual blessings were foretold. For Paul, "the vessel of election", interpreting spiritually all these blessings that are set down in the law, and knowing that they are not carnal, speaks to the Ephesians: "blessed be the God and Father of our Lord Jesus Christ, who has blessed us with every spiritual blessing". And so all these blessings will be spiritual, when, rising from the dead, we attain eternal blessedness. But in the Psalms too, finding something similar, they slip into the same error: "your wife", it says, "like a fruitful vine on the sides of your house, your children like young olive shoots around your table", up to that place where it says: "may the Lord bless you out of Zion, and may you see the good things that are of Jerusalem". Therefore, when Jerusalem has been furnished and restored to its ancient state, then the holy one will see the good things which the Scripture mentions. Those who understand Jerusalem spiritually, and know that it is said of her: "which is heavenly, which is above, which is our mother", will see her good things, of which we have often spoken, and that which we have now cited from the psalm: "your wife like a fruitful vine on the sides of your house, your children like young olive shoots around your table". To the Sadducees, who were a portion of the Jews, understanding all these things bodily, the Savior says: "you know neither the Scriptures nor the power of God". Let these things be said briefly concerning the question which the Sadducees put to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily39.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 39"
