[[commentary]]
quote='''
why is it that Solomon, who in these three little books seems to comply with the will of the Holy Spirit, is in Proverbs indeed called "Solomon the son of David, who reigned in Israel"; whereas in the second book he is not written down as Solomon, but it says, "the words of the Preacher (Ecclesiastes), the son of David, king of Israel in Jerusalem" … That in very many places Solomon bears the type of Christ … And again he is himself the true Ecclesiastes, who, when he was in the form of God, emptied himself, taking the form of a servant, that he might gather together the Church … Therefore in the first book, that of Proverbs, when he instructs us in moral disciplines, he is said to be king in Israel, but not yet in Jerusalem … then already Christ himself becomes for us also Ecclesiastes, and is said to reign not only in Israel, but also in Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"
