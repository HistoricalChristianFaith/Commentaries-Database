[[commentary]]
quote='''
In the second place, the oblation "of the first fruits", that is, of the beginnings of the produce, is commanded. And this, if you remember well, the law commands to be done on the day of Pentecost. In which a "shadow" plainly was given to them, but for us the truth was reserved. For on the day of Pentecost, when the sacrifice of prayers had been offered, the Church received the first fruits of the coming "Holy Spirit" of the Apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily02.html'
source_title="HOMILIES ON LEVITICUS 2"
