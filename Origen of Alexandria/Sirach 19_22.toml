[[commentary]]
quote='''
In the book which among us is usually held among the volumes of Solomon and is called Ecclesiasticus, but among the Greeks is named the Wisdom of Jesus son of Sirach, it is written: "All wisdom is from God." Which perhaps we might so understand, as though from God were also that wisdom of this world, which is said to be destroyed, and of the princes of this world, and if there is any other by which false knowledge is commended; were it not that in the same little book it says in what follows: "For the discipline of wickedness is not wisdom." By which surely he teaches that every discipline which asserts anything false, even if it seem forceful and plausible and such as can hardly be overthrown, yet by no means ought knowledge of this kind to be applied to the title of wisdom. What then is it that he says: "All wisdom is from God"? He seems to me to have meant this: that every skill which is held necessary for human use in regard to any art, or the knowledge of any matter whatever, is said to be wisdom given by the Lord. In short, in Job it is written: "Who gave to women the wisdom of weaving and the discipline of embroidery?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily18.html'
source_title="HOMILIES ON NUMBERS 18.3"
