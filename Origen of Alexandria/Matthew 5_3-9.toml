[[commentary]]
quote='''
Of the future promise there is not one mode nor a single kind; but, as the Lord Himself taught in the Gospel, when He calls "blessed" the "poor in spirit" and says that "theirs is the kingdom of heaven," and again calls "blessed" the "meek," yet promises them not the kingdoms of heaven but "the inheritance of the earth." He calls "the peacemakers" also "blessed," but not even to them did He give the kingdom of heaven, yet He declares them to be "sons of God." And when He promises different things to different persons, He calls all "blessed" who attain to the promises, yet He has not granted to all the kingdoms of heaven. It can happen, then, that someone may perhaps in his other works and acts be corrected and perfect, yet be tripped up in the vice of the mouth and the slip of speech; to him, even if according to the sentence of the Apostle the kingdoms of heaven are denied, yet the place of another blessedness is not cut off.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily14.html'
source_title="HOMILIES ON LEVITICUS 14"
