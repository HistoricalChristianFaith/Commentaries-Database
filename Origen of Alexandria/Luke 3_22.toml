[[commentary]]
quote='''
And that the Holy Spirit descended so that, after the Lord "had ascended on high leading captivity captive", he might bestow on us the Spirit who had come to him; which Spirit indeed he also gave at the time of his resurrection, saying: "Receive the Holy Spirit! If you forgive anyone's sins, they will be forgiven him; if you retain anyone's, they will be retained". Now "the Holy Spirit descended upon" the Savior "in the form of a dove", a bird that is gentle, innocent, and simple. Whence it is also commanded to us that we should imitate the innocence of doves. Such is the Holy Spirit—clean and winged and rising to the heights. Wherefore in prayer we say: "Who will give me wings like a dove's, and I shall fly and be at rest?"—that is: who will give me the wings of the Holy Spirit? And in another place the prophetic word promises: "If you sleep in the midst of the lots, the wings of a dove covered with silver, and the hinder parts of its back in the greenness of gold". For if we take our rest "in the midst of the lots" of the Old and New Testament, there will be given to us "the wings of a dove covered with silver", that is, the words of God, and "its hinder parts" radiant with the gleam and "greenness" of gold, so that our understanding may be filled with the perceptions of the Holy Spirit—that is, so that our speech and mind may be filled with his coming, and that we may neither say anything nor understand anything except what he has suggested, and that all sanctification, both in heart and in words and in deed, may come from the Holy Spirit in Christ Jesus: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily27.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 27"
