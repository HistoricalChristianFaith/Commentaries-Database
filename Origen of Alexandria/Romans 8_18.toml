[[commentary]]
quote='''
"For I reckon that the sufferings of this time are not worthy to be compared with the glory to come which shall be revealed in us." If anyone should consider that, in exchange for a person's being made a son of the most high God, and an heir of his goodness and glory, and a coheir of Christ the only-begotten Son of God, even if he should remain without complaint in the observance of all the commandments and the justifications of the Lord, and should persevere in these with ever-watchful mind; if also he should endure all kinds of punishments which can be inflicted on human nature from within or from without; or even if someone should so endure the things which are recorded as having been written concerning Job, where Satan destroyed not only those things which seemed to be outside himself, in his goods and his children, but even touched his very bones and flesh, and struck him with a most grievous wound from his feet to his head, so that, taking a potsherd, he scraped off the pus flowing from his sores — if, I say, there can be still heavier things than these which he endures who in this most brief life suffers tribulation in all things, who is tormented in soul and body, and if he compares these things with the future glory which "shall be revealed" in the saints, and with those things which "eye has not seen, nor ear heard, nor has it ascended into the heart of man" — he can understand how Paul, considering these matters more deeply, says: "For I reckon that the sufferings of this time are not worthy to be compared with the future glory which shall be revealed in us." For nothing worthy can be found or compared to the future glory. For in what respect would you compare mortal things with immortal? or visible with invisible? or temporal with eternal? or perishable with everlasting? If, however, there are certain things in the present life which can be gathered as, so to speak, seeds of the future glory, these seeds, I say, are gathered from tribulations and sufferings, as the same Apostle also says in another place: "For that which in the present is momentary and light in our tribulation works for us beyond measure an immense weight of eternal glory, while we look not at the things which are seen, but at the things which are not seen." For by these words he shows that he who looks at those things which are not seen, and which are eternal, counts every tribulation, of whatever kind it may befall him — however savage, however long it may seem — as momentary and light: even if he be subjected to torments, and goads, and iron claws, at that very time when his body is fixed under punishments, if he looks to the future glory which is to be revealed, and considers how after such great torments this body of his lowliness will be transformed, so that it may become conformed to the body of the glory of the Son of God, he counts the present tribulation momentary and light; but the weight of the future glory he reckons heavy, that is, great, and eternal: and the more he sees the penalties of tribulations multiplied for himself, the more fully he understands that a weight and magnitude of glory is being heaped up for him. And that from the quantity of tribulations a certain measure and magnitude of glory is gathered, I think the prophet David also indicates when he says: "According to the multitude of my sorrows in my heart, your consolations have gladdened my soul." Whence I think that in the present life the consolation which is given to the just is given according to the measure of their torments and wounds; but the future glory, of which the Apostle says that it "shall be revealed in us," is not according to the measure of the sufferings: "for the sufferings of this time are not worthy to be compared with the future glory which shall be revealed" in the saints; but, as we quoted from what was said to the Corinthians, from the momentary and light labor of our tribulations certain seeds gathered will prepare for us beyond measure an immense weight of eternal glory. That divine consolation is truly bestowed upon the just even in the present life according to the measure of their sufferings, the same Apostle confirms when he writes in the second letter to the Corinthians: "For as the sufferings of Christ abound in us, so also does our consolation abound." And he did not say: It abounds beyond measure, or immeasurably; but rather, as great as the sufferings are, so great also are the consolations. But as to what he says, "in comparison with the glory to come, which shall be revealed in us," I think that above we have already shown sufficiently concerning the difference of glories — what that glory is which has already been revealed, and what that is which is yet to be revealed; and how the things which we now see, "we see through a glass and in a riddle, but then," when the Son of Man shall have come in the glory of the Father and of the holy angels, "we shall see face to face," just as John also said: "For we shall see him as he is." But that too may be regarded as the glory which is to be revealed, when the account of each and every one of the principles of the world, or of those things which are above the world, shall begin to be known as doctrine, and the treasures of his wisdom and knowledge shall be revealed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
