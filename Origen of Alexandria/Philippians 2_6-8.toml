[[commentary]]
quote='''
No one who has love seeks his own things; for example a mother in loving her son, or a father, does not seek her own as she does the son's; for to have love is not self-loving. If the Savior, "being in the form of God" and being "equal to God", had sought his own, he would have remained in that form; but as it is, wishing to save a perishing world, he "emptied himself, taking the form of a servant; and being found in fashion as a man he humbled himself, becoming obedient unto death, even the death of the cross".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LI"
