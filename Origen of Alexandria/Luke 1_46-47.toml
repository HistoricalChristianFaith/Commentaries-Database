[[commentary]]
quote='''
Before John, Elizabeth prophesies; before the birth of the Lord and Savior, Mary prophesies. And just as sin began from a woman and thereafter proceeded onward to the man, so too the beginning of salvation took its origin from women, that other women also, laying aside the frailty of their sex, might imitate the life and manner of conduct of these holy women, and above all of those who are now described in the Gospel. Let us therefore examine the virgin's prophecy. "My soul", she says, "magnifies the Lord, and my spirit has exulted in God my Savior". Two things, "the soul" and "the spirit", discharge a twofold praise. The soul proclaims the Lord, the spirit God: not that the praise of the Lord is one thing and the praise of God another, but because he who is God is the same as the Lord, and he who is the Lord is the same as God. It is asked how "the soul magnifies the Lord". For if the Lord can receive neither increase nor diminishment and is what he is, on what account does Mary now say: "My soul magnifies the Lord"? If I consider the Lord and Savior to be "the image of the invisible God", and see that my soul was made "according to the image of its Creator", so as to be an image of the Image — for my soul is not specifically an image of God, but was made after the likeness of the prior Image — then I will see that, after the example of those who are accustomed to paint images, and, having received (for instance) the single face of a king, to apply the diligence of their art to expressing the principal likeness, each one of us, forming his soul according to the image of Christ, sets in it either a greater or a lesser image, whether faded or dirty, or bright and shining and answering to the likeness of the principal Image. When therefore I have made the image of the Image, that is, my soul, great, and have magnified it by deed, by thought, by word, then the image of God is made great, and the Lord himself, whose image it is, is magnified in our soul. And just as the Lord grows in our image, so, if we are sinners, he is diminished and decreases. Or rather, the Lord is neither diminished nor decreases, but we, in place of the image of the Savior, put on other images for ourselves; in place of the image of the Word, of wisdom, of justice, and of the other virtues, we assume the form of the devil, so that it is said of us: "serpents, brood of vipers". But we are also clothed with the persona of a lion and of a dragon and of foxes, when we are venomous, cruel, cunning, and also of a he-goat, when we are more prone to lust. I remember once, when discoursing on Deuteronomy at that place where it is written: "do not make any likeness of male or of female, the likeness of any animal", that I said that it is "the spiritual law" that some make themselves the image of a male, others of a female, that this one has the likeness of birds, that one of reptiles and serpents, and that another makes himself the likeness of God. How these things are to be understood, he will know who has also read those passages. "The soul" of Mary, then, first "magnifies the Lord", and afterward "the spirit exults in God"; for unless we have first believed, we cannot exult.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily08.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 8"
