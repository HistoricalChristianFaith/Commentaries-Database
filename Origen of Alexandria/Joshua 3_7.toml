[[commentary]]
quote='''
How great were the things done before! The Red Sea was crossed on foot, manna was given from heaven, fountains were broken open in the wilderness, the law was given through Moses, many signs and wonders were done in the wilderness, and nowhere is Jesus said to be "exalted." But where the Jordan is crossed, there it is said to Jesus: "on this day I begin to exalt you in the sight of the people." For Jesus is not "exalted" before the mystery of baptism, but his exaltation and "exaltation in the sight of the people" takes its beginning from there. For if "all who are baptized in Christ Jesus are baptized into his death," and the death of Jesus is fulfilled in the exaltation of the cross, then rightly for each of the faithful Jesus is first "exalted" then, when one arrives at the mystery of baptism, because thus also it is written that "God exalted him and gave him a name which is above every name, that at the name of Jesus every knee should bow, of things heavenly and earthly and infernal."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily04.html'
source_title="HOMILIES ON JOSHUA 4.2"
