[[commentary]]
quote='''
But that also, which Gideon says: "I will place the fleece" — not just anywhere, not in a field nor in a woodland, but "on the threshing-floor" — how does it seem to you? "On the threshing-floor," where the "harvest" is: "for the harvest is plentiful, but the workers are few." "I will place," he says, "the fleece" there, where the "harvest" is. What had moved the holy man Gideon, or what had seemed good to him, that he should do this? For he foresaw through the Spirit that Christ "gathers" his people "into the threshing-floor" and there cleanses him, "holding the winnowing-fan in his hand," and there separates the "chaff" from the wheat. Not without cause, therefore, did so great and such a man — of whom the holy Apostle too, writing to the Hebrews, makes mention in the catalogue of the prophets — choose the threshing-floor for placing the fleece; nor without cause did he "wring out the fleece into a basin and fill it with water." Let us seek concerning this also in the holy Scriptures, whether any occasion of this understanding too is afforded us. Let us come to the Gospel. We find there our Lord and Savior "putting off his garments, and, girded with a linen cloth, pouring water into a basin, and washing the feet of his disciples." You see, then, that the prophets foreshadowed these things, which were to be fulfilled in the last times through the Lord. That "water," therefore, which "Jesus poured into the basin," was the dew of heavenly grace, with which "he washed the feet of his disciples." Whence also he rightly said to them: "but you are clean because of the word which I have spoken to you." But we too, if only we offer our feet, the Lord Jesus is ready to "wash the feet" of our soul and to cleanse them with the heavenly dew, with the grace of the Holy Spirit, with the word of doctrine. For he willed that not the Apostles alone should be "clean," but also all who believe through his word. And to all believers he says that which he said to Peter: "unless I wash you, you shall have no part with me." For it is certain that no one "has part with Christ" unless he has been washed and made "clean." Come, I beseech you, Lord Jesus, Son of God, "put off the garments" which you put on for my sake, and gird yourself for my sake, and "pour water into a basin and wash the feet" of your servants, wash away the filth of your sons and daughters. "Wash the feet" of our soul, that we, imitating you and following you, may "put off" our old "garments" and say: "by night I have put off my garment, how shall I put it on?", and may say again: "I have washed my feet, how shall I soil them?". For as soon as you "wash" my "feet," may you also make me recline with you, that I may hear from you: "you call me Lord and master; and you say rightly, for I am. If therefore I, the Lord and master, have washed your feet, you too wash one another's feet." I too, therefore, now wish to "wash the feet" of my brethren, to "wash the feet" of my fellow-disciples. And for that reason I take the water which I draw from the fountains of Israel, or rather which I "wring out" from the Israelite "fleece." For I now "wring out" water from the "fleece" of the book of Judges, and at another time water from the "fleece" of the Kingdoms, and water from the "fleece" of Isaiah or Jeremiah; and I "pour" it "into the basin" of my soul, conceiving the sense in my heart, and I take the feet of those who offer and prepare themselves for washing, and, so far as I am able, I desire to "wash the feet" of my brethren and to fulfill the commandment of the Lord, that by the word of doctrine the hearers may be cleansed from the filth of their sins, that they may cast away from themselves all the uncleanness of their vices and have clean "feet," with which they may rightly walk "to the preparation of the Gospel of peace," so that all of us together, purified in Christ through the word, may not be cast out from the bridal chamber of the bridegroom on account of filthy garments, but, white in raiment, washed in feet, "clean of heart," may recline at the banquet of the bridegroom, our Lord Jesus Christ himself, "to whom is glory and dominion unto the ages of ages. Amen!".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily08.html'
source_title="HOMILIES ON JUDGES 8"
