[[commentary]]
quote='''
"And the Lord spoke," it says, "to Moses in the desert of Sinai" — all those things, namely, which above we summed up in a compact narration, where it is commanded that everyone be numbered "from twenty years old and upward who goes forth in the might of Israel." If, therefore, anyone goes forth in might, he himself is numbered, and not in any might whatever, that is, not in the might of the Egyptians nor of the Assyrians nor of the Greeks, but in the might of Israel, he himself is numbered before God. For there is a might of the mind which the philosophers of the Greeks teach; but this does not pertain to the number of God, for it is exercised not for God but for human glory. There is also a might of the Assyrians or the Chaldeans, which is proclaimed in the studies of astrology; but this is not the Israelite might, and therefore it does not pertain to God. There is also a might of the Egyptians in that which they call secret wisdom, but this is not joined to the reckoning of God. Before God the Israelite might alone is numbered, that is, that might which is taught by God, which is learned through the divine Scriptures, which is handed down through the Gospel and Apostolic faith. And therefore he says that they alone are to be numbered who advance in the might of Israel. But let us also consider this, why the people is not numbered immediately, as soon as it has gone out of Egypt; for Pharaoh was still pursuing. But neither when, crossing the Red Sea, it came into the desert, is it said to be numbered; for they had not yet been tempted, not yet been attacked by the enemy. They contend against Amalek and conquer, but not even then are they numbered; for one victory does not suffice for one striving toward perfection. They receive manna as food and draw the drink of water from the following rock, but neither then are they numbered; for in them those things which are reckoned fit for the numbers had not yet grown up. The tabernacle of testimony is constructed, but not even in this does the time for numbering the people arrive. The law is given through Moses, the custom of sacrifices is handed down, the rite of purifications is taught, the laws and sacraments of sanctifications are established, and then, by the command of God, the people is brought to the number. Inscribe these things, O hearer, in your heart twofold and threefold. See how many things you must pass through, how many endure, by how many advances, how many temptations, how many battles you must fight and conquer, that you may be able to belong to the divine number, that you may be held in some reckoning before God, that you may be deemed worthy to be counted among the holy tribes, that you may be able to be visited and, through God's priests, Aaron and Moses, to be enrolled in the censuses of the numbers. First you must take up the law of God, the law of the Holy Spirit; sacrifices must be offered, purifications completed, all things performed which the law of the spirit teaches, that you may at last be able to belong to the Israelite number.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily01.html'
source_title="HOMILIES ON NUMBERS 1.2"
