[[commentary]]
quote='''
But that he "sprinkles toward the east", do not take it idly. From the east atonement comes to you; for thence is the man whose "name is East", who was made "the mediator of God and men". You are invited therefore by this always to look "toward the east", whence rises for you the "sun of righteousness", whence light is born for you; so that you may never "walk in darkness" nor that last day catch you in darkness; lest the night and gloom of ignorance steal upon you, but that you may always dwell in the light of knowledge, always have the day of faith, always obtain the light of charity and peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily09.html'
source_title="HOMILIES ON LEVITICUS 9"
