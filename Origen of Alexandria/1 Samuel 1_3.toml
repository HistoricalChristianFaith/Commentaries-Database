[[commentary]]
quote='''
But let us see also to what place Elkanah came together with his wives, "to sacrifice, it says, to the Lord in Shiloh. But there were, it says, Eli, and his two sons Hophni and Phinehas, priests of the Lord." Shiloh is the name of the place in which sacrifices were offered to the Lord, before the temple was built in Jerusalem. In this place, then, which is called Shiloh, victims for sins were offered, and there was made the purgation of sins. Now Shiloh is interpreted 'avulsion' or 'unshoeing,' that is, the loosing of the sandal, and either sense is fittingly applied. For the place in which sins are purged is rightly named avulsion, where the heart of stone is torn away, and a heart of flesh is inserted: or unshoeing, because all of us, until we come to the holy place, are unshod; but when we have arrived at it, we are commanded to be unshod. So it is said to Moses: "Loose the strap of thy sandal. For the place in which thou standest is holy ground." And do we suppose that in these things there was not something of mystery hidden, but that God abhorred the bodily sandals of Moses, and therefore these things were commanded? Or is this rather to be supposed, that when he came out of the land of Egypt, he had sandals of dead skins, and was, as it were, bound about with a certain mortality: but when he began to advance toward virtue and to ascend the mountain of God, and there to minister immortal mysteries, then he says to him that he should cast off the tokens of mortality, which are designated in the sandals of skin? I think that for this reason too the Savior commanded his apostles not to have sandals on their feet, so that their feet, which ran to announce eternal life, should lack every token of mortality: inasmuch as they trod that way which says: "I am the way, the truth, and the life." For no one treads the way of life with a token of mortality. Such, then, is that place likewise where Eli is, a man less praiseworthy. For on account of sin, falling backward, he expired. And let us not suppose that he alone, falling backward, expired, but even now, if anyone falls backward, if anyone turns back from faith and truth, it is necessary that he fall, and that he straightway die. But in Deuteronomy too a threat is aimed at sinners, when it is said: "And an incurable opisthotonos." Now opisthotonos signifies a sickness of the back and of the hinder parts, and assuredly not without cause, when there are so many kinds of human ailment, is this kind of ailment above all ascribed to the sinner. For in Genesis too the wife of Lot, who was turned back, is said to have transgressed the divine precept, by which it had been commanded her that she should not look backward, nor stand in all the region round about; and therefore she was made a little pillar of salt. Our Lord and Savior too in the Gospel: "No one, he says, putting his hand to the plough, and looking back, is fit for the kingdom of God." And moreover, when he had taught concerning many things, he adds this also, saying: "Remember Lot's wife." It is best, therefore, to forget the things that are before, to forget the things that are past, so that the opisthotonos, the incurable ailment, may not seize us, and that we may not fall backward like Eli, and die.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.6"


[[commentary]]
quote='''
Now there were there the two sons of Eli. Eli is interpreted 'Arab,' or 'outsider.' For he is an outsider from God who does not maintain discipline, who does not chastise the offending son, does not reprove him that he may amend, who is indulgent to vices, who does not punish faults, as the Apostle also says: "But if ye are without discipline, of which all are made partakers, then are ye bastards, and not sons." This, then, is Eli, who on account of these things is punished by God. But let us see who his sons also are. Hophni, it says, and Phinehas. Now Hophni is interpreted 'excess of conversion.' Of Peninnah we said a little before that she was conversion: but this one, who exceeds, and is made far from amendment, and will not be converted to the Lord, therefore remains impious. But also, whoever he be, whom we see after sin not converted to the Lord, and not doing penance, nor receiving the desert of the future judgment, and of the divine word that commands: "Doth not he who falls add to rise again? Or he who is turned away, shall he not return?"—of him too we rightly say that he is Hophni, and exceeding beyond conversion. But the other son of his is called Phinehas. We know two in the Scriptures called by this name, that Phinehas the righteous, the son of Aaron, and this unrighteous one, the son of Eli. Whence fittingly too we find two interpretations of this name. For Phinehas signifies in our tongue 'obturation of the mouth,' or 'sparing the mouth.' The sinner, therefore, and he who has not firmness, has his mouth obstructed for speaking: but the righteous man spares his mouth. Today too among the priests of the Lord there is found either Phinehas; there is found also Eleazar, who in the Scriptures is the first named bishop, as it is written in Numbers. There are, then, today too among the priests those who spare their mouth, and no evil word by any means proceeds from their mouth. There are priests from whose mouth no scandal, no lie, no guile, nor any falsehood is uttered, and these are deservedly compared to that Phinehas the son of Aaron. But there are also some priests according to that Phinehas the son of Eli, who have their mouth obstructed, whether by the vice of ignorance, or by the conscience of sins. But this is what I entreat, that if there is anyone who sees himself admitted into the priestly order, let him take pains to give heed to instruction and amendment, and let him hasten to be made of that number of the blessed, lest perhaps he be found among those priests who are both reprobate and punished by God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.7"
