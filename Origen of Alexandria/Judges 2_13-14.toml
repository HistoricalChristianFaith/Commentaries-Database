[[commentary]]
quote='''
Therefore "they provoked the Lord to anger, and forsook the Lord, they worshipped Baal and Astarte. And the Lord was angry with fury against Israel, and delivered them into the hands of plunderers". As long as one serves God, he is not "delivered into the hands of plunderers". But when he has "forsaken the Lord" and has begun to serve his own passions, then it is said of him that: "God delivered them into passions of ignominy", and again: "he delivered them into a reprobate mind, that they should do those things which are not fitting". Why? Because "they are filled", he says, "with all iniquity, wickedness, fornication, avarice", and all the rest that are named — just as here too now, since "they served", it says, "and adored the Baalim and Astarte, God delivered them into the hands of plunderers; and it came to pass in the hands of their enemies". For these things, as I have already often said, the Jews read as histories of deeds done and past. But "we", "for whose sake these things" are said to be "written", ought to know that, if we have sinned against the Lord and worship the pleasures of our soul and the desires of the flesh as it were as God, we too are delivered up, and by apostolic authority are handed over into the hands of the devil. Hear, then, himself saying of him who had sinned: "I have delivered", he says, "such a man to Satan for the destruction of the flesh, that the spirit may be saved". You see, then, that even now not only through his Apostles does God "deliver" transgressors "into the hands of enemies", but also through those who preside over the church and have the power not only of loosing, but also of binding, sinners "are delivered into the destruction of the flesh", when for their offenses they are separated from the body of Christ. And, as it seems to me, even now men are delivered from the church into the power of the devil in two ways: in this manner which we spoke of above, when his offense becomes manifest to the church and he is driven from the church by the priests, so that, marked out by men, he may blush, and being converted there may befall him that which follows: "that the spirit may be saved in the day of our Lord Jesus Christ"; but in another way one is "delivered to the devil" when his sin does not become manifest to men, yet God, "who sees in secret", perceiving his mind and his soul serving vices and passions, and that in his heart it is not he who is worshipped, but either avarice or lust or vainglory or other such things — such a one the Lord himself "delivers to Satan". How does he "deliver him to Satan"? He departs from his mind and turns himself away and flees from his evil thoughts and unworthy desires and leaves the "house" of his heart "empty". And then there shall be fulfilled in that man what is written: "but when the unclean spirit has gone out from a man, he goes about through dry places: and if he does not find rest, he returns to his own house; and finding it vacant and swept, he takes with him seven other spirits more wicked than himself, and entering he dwells in that house; and then the last state of that man becomes worse than the first". In this manner, then, it must be understood that God "delivers up" those whom he delivers, not that he himself delivers anyone, but from the fact that he forsakes the unworthy — those, namely, who do not so cultivate themselves and purge themselves from vices that God should gladly dwell in them. When he himself flees and turns away from a soul which is set in uncleanness and vices, it is said to be delivered up from the fact that it is found empty of God and is invaded by the wicked spirit. And therefore let us with the utmost zeal be watchful and hasten to purge ourselves from vices and evil desires, that we may be able to hold God within us and that he may deign to dwell in us, while he is delighted both with our acts and our words and our thoughts, if we conduct according to his will all things that we do, so that, "whether we eat, or whether we drink, or whether we do anything else, we may do all in the name of" our "Lord" Jesus Christ, "to whom is glory and dominion unto the ages of ages. Amen!".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily02.html'
source_title="HOMILIES ON JUDGES 2"
