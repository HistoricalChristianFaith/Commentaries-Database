[[commentary]]
quote='''
One judges between one day and another; another judges every day. Let each one abound in his own sense. We said above, following the sequence of the apostolic letter, that these matters seem to be treated concerning abstinence from foods, or liberty in them: since indeed the calling which is in Christ places nothing common or unclean in foods, but the principle of continence persuades us to abstain even from things permitted. For, as he himself says elsewhere, because all things are lawful, it does not therefore follow that all things are expedient, or that all things edify. Yet the very principle of abstinence differs according to the vow and purpose of the one vowing. For one judges thus, and so determines in his own mind, that he should spend every day, that is, the continuous time of his life, in abstinence. But another appoints some particular time, as by a votive profession. In this matter, whether one undertakes a perpetual or a temporary continence, he grants free power to the judgment of each. Nevertheless he promises that both are made acceptable before the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
