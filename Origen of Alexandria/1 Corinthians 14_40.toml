[[commentary]]
quote='''
He seeks also "onyx", with which as with a kind of shield his animal is covered and remains unharmed. So he wishes you too to be protected with "the shield of faith, with which you may extinguish all the fiery darts of the evil one". Yet all these things he wishes to be composed by you, nothing disordered, nothing restless, nothing unseemly, but he wishes this, "that all our things be done in a composed and honorable manner". Therefore even now our true "high priest" Christ stands and wishes "his hands" to be filled "with the fine composed incense", and from each church which is under heaven he considers what is offered, how wholly and diligently it composes its "incense", how "fine" it makes it, that is, how each one of us orders his works and how he examines the sense and words of the Scriptures with spiritual explanation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily09.html'
source_title="HOMILIES ON LEVITICUS 9"
