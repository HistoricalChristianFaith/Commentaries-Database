[[commentary]]
quote='''
It is available to us to stretch out our hands to good deeds, to take possession of life and to keep it in our soul. This life is Christ, who said: "I am the life." This life is now present for the righteous only as a shadow, but then — face to face.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
