[[commentary]]
quote='''
Or they knew not whether when He said about my Father's business, He referred to the temple, or something higher and more edifying; for every one of us who doeth good, is the seat of God the Father; but whoso is the seat of God the Father, has Christ in the midst of him.

Jesus frequently went down with His disciples, for He is not always dwelling on the mount, for they who were troubled with various diseases were not able to ascend the mount. For this reason now also He went down to them who were below. It follows: And he was subject to them, &c.

Let us then also ourselves be subject to our parents. But if our fathers are not, let us be subject to those who are our fathers. Jesus the Son of God is subject to Joseph and Mary. But I must be subject to the Bishop who has been constituted my father. It seems that Joseph knew that Jesus was greater than he, and therefore in awe moderated his authority. But let every one see, that oftentimes he who is subject is the greater. Which if they who are higher in dignity understand, they will not be clated with pride, knowing that their superior is subject to them.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And at the same time attend to this: that, as long as he was in the possession of his Father, he was above. And because Joseph and Mary did not yet have full faith, for that reason they could not remain above with him, but he is said to have come down with them. Frequently Jesus comes down with his disciples, nor is he always dwelling on the mountain, nor without end does he hold to sublime things. On the mountain he is with Peter, with James, with John, and again in another place with the rest of the disciples. Further, because those who labored under various sicknesses were not able to ascend the mountain, therefore he "came down and came" to those who were below. Now also it is written: "he came down with them and came to Nazareth and was subject to them". Let us learn, children, to be subject to our parents: the greater is subject to the lesser. He, because he saw that Joseph was greater in age, therefore honored him with the honor due to a parent, giving to all sons an example, that they should be subject to their fathers and, if they have no fathers, that they should be subject to those who are of a father's age. Why do I speak of parents and children? If Jesus the Son of God is subject to Joseph and Mary, shall I not be subject to the bishop, who has been appointed by God as a father to me? Shall I not be subject to the presbyter, who by the Lord's condescension has been set over me? I think that Joseph understood that Jesus, who was subject to him, was greater than he; and knowing that the greater one was subject, he tempered his authority with awe. Let each one, then, see that often an inferior is set over better people, and it sometimes happens that the one who is subject is better than the one who seems to be set over him. When one who is higher in dignity understands this, he will not be lifted up with pride because he is greater, but he will know that a better one is subject to him, just as Jesus too was subject to Joseph. Then it follows: "But Mary kept all these words in her heart". She surmised something more than about a man; hence also she "kept all his words in her heart", not as the words of a boy who was twelve years old, but of him who had been conceived of the Holy Spirit, whom she saw "advancing in wisdom and grace with God and men".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily20.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 20"
