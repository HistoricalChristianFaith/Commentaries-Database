[[commentary]]
quote='''
Now let us also consider Jesus' statement, "I have proceeded and come from God." It seems useful to me to juxtapose to these words the following words from Micah: "Hear my words, you people, and let the earth and all who are in it pay attention; and the Lord shall be among you for a witness, the Lord from his holy house. Therefore behold, the Lord proceeds from his place and will come down and tread upon the high places of the earth, and the mountains will be shaken under him, and the valleys will be dissolved like wax, before fire and like water tumbling down in a waterfall." Now consider whether the statement, "I have proceeded from God," is equivalent to the statement, "The Lord proceeds from his place," since, when the Son is in the Father, being in the form of God before he empties himself, God is his place, as it were.… Unless you understand that the Son is in the Father in a different way than he was before he proceeded from God, it will seem contradictory that he has both proceeded from God, and, after he has proceeded from God, is still in God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252020.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 20:152-56"


[[commentary]]
quote='''
"I have come down," he says, "that I may see." When responses are conveyed to Abraham, God is not said to come down, but to stand over him, as we expounded above: "three men stood," it says, "over him." But now, because the cause of sinners is being dealt with, God is said to come down. See that you do not perceive an ascent and descent of place. For frequently this is found in the divine letters, as in the prophet Micah: "behold," he says, "the Lord has gone out from his holy place and has come down and will tread upon the high places of the earth." God therefore is said to come down, when he deigns to have care of human frailty. Which is to be understood more especially of our Lord and Savior, who "did not deem it robbery to be equal to God, but emptied himself, taking the form of a servant." He came down therefore. "For no one else has ascended into heaven, except him who came down from heaven, the Son of man, who is in heaven." For the Lord came down not only to care for, but also to bear, the things which are ours. "For he took the form of a servant," and although he himself is of invisible nature, as being equal to the Father, yet he took a visible appearance, "and was found in appearance as a man."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.5"
