[[commentary]]
quote='''
There are many things that remained over for us when we were expounding the reading about Balaam and his donkey; and since it is a discourse bound by time, held in the church for the sake of edification, it did not have space enough for us to set forth each single word of Scripture in such a way that nothing at all should be left undiscussed, and to apply an explanation to each point, since indeed a style of this kind belongs rather to commentaries. Therefore those matters that seem worthy of inquiry we take up again, and, discussing them, we shall attempt to treat them with what explanation we can and to bring them into the open. But there is a further difficulty in the explanation of the history itself, namely how, when it is said that God came by night to Balaam first and asked who the men were that had come to him, and Balaam had answered that they had been sent by Balak, the son of Zippor, saying, "Come, and curse for me the people," God answered him, "You shall not go with them, nor shall you curse the people; for it is blessed"; yet again a second time it is said that God came to him by night and told him to go with them, but to observe this, that the word which God should give in his mouth, this he should speak; and again a third time, as he was going, an angel of God met him, to whom his journey seemed so far from proper or fitting that he even wished to kill him, had not the donkey, seeing the angel whom Balaam could not see, turned aside. And nevertheless, after he is blamed by the angel for having wished to go, he is again permitted by that very angel to go; only that he should keep the word which God should give in his mouth, so as to bring forth this alone and nothing further. All these things, then, have a difficult explanation; yet, as we have already said above, we shall give you in a few words occasions of understanding, so that you too may do what is written: that when these things are heard the wise may become wiser, and, "Give occasion to the wise, and he will be wiser." But before we come to the matter, we shall not even omit this, which, attending rather curiously, we observed in this place. In the letters of the Hebrews the name of God, that is God or Lord, is said to be written differently; for one thing is written for any god whatever, and another for God himself, of whom it is said: "Hear, O Israel, the Lord your God, God is one." This God of Israel, then, the one God and creator of all, is written with a certain fixed sign of letters, which among them is called the Tetragrammaton. Whenever, therefore, God is written in the Scriptures under this sign, there is no doubt that it is said of the true God and creator of the world. But whenever it is written with other, that is, common, letters, it is held uncertain whether it is said of the true God or of one of those of whom the Apostle says: "although there are those who are called gods, whether in heaven or on earth, as there are many gods and many lords; yet for us there is one God the Father, from whom are all things, and we through him." Those, then, who read the Hebrew letters say that in this place God is not set down under the sign of the Tetragrammaton; concerning which let him inquire who can. But also, as to what God said to Balaam, as if asking who those men were, it is inquired why he seems to be ignorant; and again, as to what he says: "you shall not curse the people; for it is blessed," whether it can be so understood as if he had said: "you shall not curse my people."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily14.html'
source_title="HOMILIES ON NUMBERS 14.1"
