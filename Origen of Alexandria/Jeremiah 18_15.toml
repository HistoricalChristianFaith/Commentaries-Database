[[commentary]]
quote='''
"For my people have forgotten me, they have burned incense in vain." Everyone who sins has forgotten God, but the righteous one says, "All these things have come upon us, and we have not forgotten you, nor have we done wrong" — and he burned incense in vain. But what "they have burned incense in vain" means must be considered. If we take up again the things said earlier upon the hundred and fortieth Psalm, we shall understand what "they have burned incense in vain" is. Now there was in the Psalm something of this sort said: "Let my prayer be set forth as incense before you." Therefore my prayer, being composed of a fine heart — when our heart is not made gross — being sent up, becomes as incense before God. If, then, the prayer of the righteous is incense before God, the prayer of the unrighteous is indeed incense, but such incense that it may be said concerning it and concerning the unrighteous who prays, "they have burned incense in vain"; as is written concerning Judas, "Let his prayer become sin." That man, in his praying, burned incense in vain. And who it is that burns incense in vain, let us consider still further in this way. "Three times in the year," it says, "shall every male of yours appear before the Lord your God," to which is immediately added, "You shall not appear before me empty."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily18.html'
source_title="HOMILIES ON JEREMIAH 18"
