[[commentary]]
quote='''
A certain one of the elders, wishing to interpret the parable, used to say that the man who went down is Adam, Jerusalem paradise, Jericho the world, the robbers the hostile powers, the priest the law, the Levite the prophets, the Samaritan Christ, the wounds disobedience, the beast the body of the Lord, the pandochium — that is, the inn, which receives all who wish to enter — he interpreted to be the Church. Further, the two denarii are to be understood as the Father and the Son, and the innkeeper as the president of the Church, to whom its stewardship has been entrusted. And as for the fact that the Samaritan promises he will return, he figured this according to the Savior's second coming.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily34.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 34"
