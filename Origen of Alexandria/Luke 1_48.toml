[[commentary]]
quote='''
But why was she lowly and cast down, who carried in her womb the Son of God? Consider that lowliness, which in the Scriptures is particularly praised as one of the virtues, is called by the philosophers "modestia." And we also may paraphrase it, that state of mind in which a man instead of being puffed up, casts himself down.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
"Because he has looked", she says, "upon the lowliness of his handmaid". Upon what lowliness of Mary did the Lord look? What did the mother of the Savior have that was lowly and cast down, she who bore the Son of God in her womb? So then, when she says: "he has looked upon the lowliness of his handmaid", it is as though she had said: "he has looked" upon the justice of his handmaid, "he has looked" upon her temperance, "he has looked" upon her fortitude and wisdom. For it is fitting that God should look upon the virtues. Let someone answer and say: I understand how God looks upon the justice and wisdom of his handmaid; but how he regards her lowliness is not sufficiently clear. Let him who inquires into such things consider that in the Scriptures, properly speaking, one of the virtues is proclaimed as "lowliness" (humility). For the Savior says: "learn from me, for I am gentle and lowly in heart, and you will find rest for your souls". But if you wish to hear the name of this virtue, how it is called even by the philosophers, listen — that it is the same "lowliness" upon which God looks, which is called by them ἀτυφία (freedom from vanity) or μετριότης (moderation). But we too can name it by a certain circumlocution, when someone is not puffed up, but casts himself down. For he who is puffed up falls, according to the Apostle, "into the judgment of the devil" — since he too began from inflation and pride —; "lest", he says, "being puffed up he fall into the judgment of the devil". "He has looked upon the lowliness of his handmaid". God, she says, has looked upon me as lowly and pursuing the virtue of gentleness and of self-abasement. "For behold, from now on all generations will call me blessed". If I understand "all generations" simply, I interpret it of those who believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily08.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 8"
