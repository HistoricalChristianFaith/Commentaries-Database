[[commentary]]
quote='''
Everyone who has received words from God and has the grace of the heavenly words has received them for the purpose of "rooting out and pulling down nations and kingdoms." But if it is said that everyone who has received words from God "roots out" "nations and kingdoms," do not understand the nations and the kingdoms in a bodily sense for me, but, having observed that human souls are ruled over by sin according to what is said by the apostle—"Let not sin therefore reign in our mortal body"—and seeing also the many kinds of sins, interpret figuratively the nations and the kingdoms as well, that is, the evil things that are in the souls of human beings, which are rooted out and pulled down by the words of God given whether to Jeremiah or to anyone whatever. And one can fit both the first things, those that press hard as regards the Savior, to Jeremiah, and the second things to Jeremiah, who knew how to interpret figuratively.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily01.html'
source_title="HOMILIES ON JEREMIAH 1"


[[commentary]]
quote='''
Who is so blessed as to root up, by the words given by God, the kingdoms which are many, which "the devil displays," being kingdoms of adverse powers, kingdoms corresponding to the sins? For it is written: "Behold, I have put my words in your mouth. Behold, I have set you this day over nations and kingdoms, to root up." And just as there are kingdoms, so also there are nations; nor can anything be called a kingdom unless it be one having nations under it. For example, there is a kingdom of fornication, and the nations of fornication are each individual fornication. One kingdom is the generic sin itself of covetousness and defrauding, and there are many kingdoms among those who have many species of sins. Then, in the case of each of the sinners, understand for me the nations under the kingdom, so as to say that so-and-so has many nations of the kingdom according to fornication, so-and-so has many nations of the kingdom according to defrauding, according to slander, according to anger. It is the work of the words of God, sent out over "nations and kingdoms," "to root up and to pull down." To root up what? The Savior taught, saying: "Every plant which my heavenly Father did not plant shall be rooted up." There are certain things within, in the souls, which "the heavenly Father did not plant"; for all the "evil thoughts, murders, adulteries, fornications, thefts, false witnessings, blasphemies" are plantings planted not by the heavenly Father. And if you wish to see whose plantings such thoughts are, hear that "an enemy, a man, has done this," the one who sowed over them "the tares in the midst of the wheat." God, then, stands ready having his seeds, and so does the devil. If we give "place to the devil," "the enemy" sows over us a planting "which the heavenly Father did not plant," which will assuredly be rooted up; but if we do not give "place to the devil," but give place to God, God rejoicing sows his seeds upon our ruling faculty. Do not, therefore, suppose that Jeremiah received some gloomy gift from God, because he is set "over nations and over kingdoms, to root up." God is good in rooting up, through the words, the evil things, the kingdoms hostile to the kingdom of the heavens, the warring nations hostile to the nation of God.

"To root up and to pull down."

There is a certain building of the devil, and there is a certain building of God. The building "upon the sand" is the devil's, for it has been established upon nothing firm and stable and unified; but the building "upon the rock" is God's. See what is said to those who belong to God: "You are God's tilled field, God's building." The words of God, then, are over "nations and kingdoms," "to root up and to pull down and to destroy." If a thing be rooted up, but what is rooted up be not destroyed, the rooted-up thing still exists. If a thing be pulled down, but the stones of the demolition be not destroyed, the demolished thing still exists. It is therefore a work of the goodness of God, after the rooting up, to destroy what has been rooted up, and after the tearing down, to destroy what has been torn down. Read carefully, in the case of the things destroyed and rooted up, how such things are destroyed: "But the chaff burn with unquenchable fire," and "bind the tares in bundles and deliver them to the fire"; thus, after being rooted up, it is destroyed. If you wish to see also, after the demolition, the things of the building of evil matter being destroyed—that house which has been torn down on account of the leprosy becomes dust, and, having become dust, is cast out "outside the city," so that not even a stone may remain, in like manner to "I will grind them fine as the mud of the streets"; for the worse things must in no way hold together. If something is pulled down, let not the stones be useful for the other building which the evil one is able to build; if it is rooted up, let him not again find seeds from the rooted-up things, so as to sow over them again the tares—for surely, having the seeds of the tares, he sowed them over. For this reason, "bind the tares and burn them with fire," so that after being rooted up it may be destroyed, and after being pulled down the building of the devil may be destroyed.

But the words of God do not stand still in these things, in the "rooting up and pulling down and destroying." For let the evil things be rooted up from me, the worse things pulled down—what benefit is it to me, if in place of the things rooted up the better things be not planted? What benefit is it to me, if in place of these the more excellent things be not built up again? For this reason the words of God do first, of necessity, the "rooting up and pulling down and destroying," after which the "building and planting." And always in Scripture we have observed the gloomy-appearing things, so to name them, being named first, then the things that seem to be cheerful being spoken of second. "I will kill and I will make alive." He did not say, "I will make alive," and after this, "I will kill"; for it is impossible that what God has made alive should be killed by him or by any other. But "I will kill and I will make alive." Whom shall I kill? Paul the traitor, Paul the persecutor; "and I will make alive," so that there may come to be "Paul an apostle of Jesus Christ." If the wretches who come from the heresies had understood these things, they would not continually have brought them forward to us, saying: Do you see how the God of the Law is savage and inhuman and says: "I will kill, and I will make alive"? Do you not behold in the Scriptures the promise of the resurrection of the dead? Or do you not see the resurrection of the dead already being prefigured in each one? "We were buried together" with Christ "through baptism" and we rose together with him.

Accordingly, he begins from the more gloomy utterances, but the necessary ones, such as "I will kill," then, having killed, "and I will make alive; I will strike, and I myself will heal"; for "whom the Lord loves he disciplines, and he scourges every son whom he receives." First he strikes, and after this he heals; "for he himself makes to feel pain and again restores." And so also here: "I have set you this day over nations and kingdoms, to root up and to pull down and to destroy and to build up again and to plant." Yet the first thing is that those evil things be taken away from us. God cannot build in the place of the evil building. "For what partnership has righteousness with lawlessness? What fellowship has light with darkness?" The evil must be rooted up from the foundations, the building of evil must be consumed away from our soul, so that after these things the words of God may build and plant; for I cannot understand otherwise the things that are written: "Behold, I have put my words in your mouth." What do the words do? "Root up and pull down and destroy." Words root up "nations," words pull down kingdoms—but not those bodily and worldly kingdoms. Worthily of words that pull down, worthily of words that root up, understand the things rooted up by words, the things pulled down by words. Is there not, then, right now in the things being spoken a power, if God grants it (according to the saying "the Lord will give the word to those who proclaim the good news with great power"), a power that roots up, if there be any unbelief, if any hypocrisy, if any wickedness, if any licentiousness? Is there not one that pulls down, if anywhere an idol-temple has been built up in the heart—so that, when that has been pulled down, a temple of God may be built, and the glory of God may be found in the temple built up again, and there may come to be not a grove, but a planting, a paradise of God, where the temple of God is in Christ Jesus; to whom is the glory and the might unto the ages of the ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily01.html'
source_title="HOMILIES ON JEREMIAH 1"
