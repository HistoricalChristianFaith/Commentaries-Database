[[commentary]]
quote='''
After this: "There shall be no labor," he says, "in Jacob, nor shall sorrow be seen in Israel." Openly in these words he announces the state of the life to come; for who is there who passes through this life without labor and sorrow? Not even if one be a Peter or a Paul. How is he not in labor and sorrow, when he is thrice beaten with rods, once stoned, thrice shipwrecked, is in the deep of the sea a day and a night, and endures countless other things which he writes about his labors and sorrows? But this will be fulfilled there, where it is said: "Sorrow and sadness and groaning have fled away." Yet this refers not to all, but only to those who by their merits shall have been Jacob and Israel; as was also that poor Lazarus, who indeed passed the present life in labor and sorrow, but there it is said to the rich man: "Remember, son, that you received your good things in your life, and Lazarus likewise evil things. But now he is at rest here, while you are tormented." He, then, is Israel and Jacob, into whom labor and sorrow do not come. But that rich man was indeed himself also Israel according to the flesh; for it is said to him that his brothers have the law and the prophets, let them hear them; but because he was not Israel according to the spirit, therefore labor and sorrow came upon him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily16.html'
source_title="HOMILIES ON NUMBERS 16.5"

[[commentary]]
quote='''
"The Lord his God is with him, the glories of princes are with him." For God never deserts his Israel. But let us see of what princes the glories are with this Israel. The glory of princes is power, principality, and kingdom. But since there are also certain princes who are to be driven from their principality, or perhaps have already been driven out, and into their place and principality are to be introduced those who are truly Israelites — all those glories which those princes had in the heavens, princes who did not keep their principality but forsook their eternal dwellings, this Israel and Jacob, who wrestled and prevailed, shall receive; and thus the glories of princes shall be with him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily16.html'
source_title="HOMILIES ON NUMBERS 16.6"
