[[commentary]]
quote='''
God demands us back. What does he demand back? Read Moses: "and now what does the Lord your God demand back from you?" and the rest that follows. God therefore requires of us and beseeches us, not because he has need of anything that we might bestow upon him, but so that, after we have given it to him, he may bestow that very thing upon us for salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily39.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 39"
