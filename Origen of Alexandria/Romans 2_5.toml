[[commentary]]
quote='''
"But according to your hardness and impenitent heart, you treasure up for yourself wrath in the day of wrath, and of the revelation of the just judgment of God, who will render to each one according to his works." A heart is said in the Scriptures to be hard when the human mind, bound fast as wax by the cold of iniquity, does not receive the impress of the divine image. This same thing is elsewhere called a thick heart, as when it is said: "The heart of this people has grown thick." But the opposite of hard is soft, which in the Scriptures is named a heart of flesh; and the opposite of thick is fine, or thin, which the Apostle calls the spiritual man — he who examines all things. Therefore, when someone knows what things are good, and does not do the good, he must be believed to hold contempt for all good things through hardness of heart. But thickness of heart is where the perception of subtle and spiritual understanding is not received; and thus a heart made impenitent treasures up for itself wrath in the day of wrath and of the revelation of the just judgment of God, since the good work is not done because of hardness, while good understanding is shut out through the thickness of the heart. Concerning the wrath of God, both above — so far as the subject allowed — and in other places, it has often been discussed. But what he says, "You treasure up for yourself wrath in the day of wrath," must be considered. That is called a treasury in which wealth and riches of various kinds are gathered together. Of this we read a threefold signification in the Scriptures. For in the Gospel there is said to be a certain treasure on earth, in which the Lord forbids treasure to be laid up; and another treasure in heaven, in which he bids all the faithful to store away their wealth; and here now the Apostle speaks of treasures of wrath. All men, therefore, through the things they do in this world, gather treasures in some one of these three. For either a man is unbelieving and unjust, and through hardness of heart and an impenitent heart stores up his deeds in the treasury of wrath. Or he is earthly, and is wise concerning the earth, and speaks of the earth, and when his field has brought him abundant fruits, he pulls down his barns and builds greater ones, and treasures up on earth. And the former indeed is called hard, but this one foolish. For it is said to him: "Fool, this night they will demand your soul from you, and the things you have prepared, whose shall they be?" Or he is wise, and rich toward God, and while walking on earth has his conversation in heaven, and all that he does is worthy of the kingdom of heaven: and such a one lays up the treasures of his riches in heaven. Thus, then, the possessor and founder of each treasury may be called, the one a carnal man, another a natural (animal) man, and another a spiritual man. Now let us see what is the day of wrath which the Apostle here names — which, however, will more easily be recognized if we inquire what the rest of the Scriptures also indicate about it. Therefore we shall fit to the matter such examples as can come to hand at present, and from these it will be shown what the day of wrath is. It is written in the prophet Amos: "Woe to those who desire the day of the Lord. To what end is the day of the Lord for you? And it is darkness, and not light. As if a man should flee from the face of a lion, and a bear should meet him, and he should enter into his house, and stretch out his hands to the wall, and a serpent should bite him. Is not the day of the Lord darkness, and not light, and gloom that has no brightness?" But Joel also says to the priests and to those who serve at the altar: "Cry to the Lord without ceasing: Alas for me, alas for me for that day, for the day of the Lord is near, and it will come like misery out of misery!" And a little after: "Sound the trumpet in Zion, proclaim on my holy mountain, and let all who dwell upon the earth be confounded, for the day of the Lord is at hand, for the day of darkness and gloom is near, a day of cloud and mist. Like the morning there shall be poured out over the mountains a people many and strong. There has been none like it from the beginning of the age, and after it there shall be none unto the years of ages of ages. Before it a consuming fire, and after it a kindled flame. Like a paradise of delights shall the land be before its face, and behind its back a field of desolation, and there is none that escapes it. As the appearance of horses is their appearance; and as horsemen, so shall they follow. Like the sound of chariots they shall leap upon the tops of the mountains." And he writes all that follows about the same day, up to that place where he says: "And the Lord will utter his voice before the face of his host, for the multitude of his camps is exceedingly great, and mighty are the works of his words. Wherefore great is the day of the Lord, great and exceedingly notable: and who shall be fit for it?" But Zephaniah speaks thus: "Stand in awe before the face of the Lord God, for the day of the Lord is near, and the Lord has prepared his victim, he has sanctified those whom he has called." And a little after: "Near is the great day of the Lord, it is near and exceedingly swift. The voice of the day of the Lord is bitter, and it is set as harsh and mighty. A day of wrath is that day, a day of distress and constraint, a day of bitterness and destruction, a day of darkness and gloom, a day of cloud and mist, a day of the trumpet and of the war-cry over the fortified cities and over the lofty walls. And I will afflict men, and they will walk like blind men, because they have sinned against the Lord: and I will pour out their blood like dust, and their flesh like dung. Their gold and their silver shall not be able to deliver them in the day of the wrath of the Lord. In the fire of his jealousy the whole earth shall be consumed, for he will make an end, and that speedily, of all who dwell upon the earth." Isaiah likewise records: "For behold, the day of the Lord will come, of incurable fury and wrath, to make the world a desert, and to destroy sinners out of it." And a little after: "For heaven shall be kindled with fury, and the earth shall be shaken from its foundations, because of the fury of the wrath of the Lord of Sabaoth, in the day in which his fury shall come upon it." Having gathered together so many and such testimonies concerning the day of wrath, I think that this passage needs no further exposition. For plainly in all of these the day of wrath is designated as the day of vengeance and of judgment. And so finally to "the day of wrath" the Apostle adds, "and of the revelation." For thus he says: "In the day of wrath and of the revelation of the just judgment of God." For that all things must be revealed is indicated also in the Gospel, when it is said: "Nothing is hidden that shall not be made manifest; nor covered, that shall not be revealed." But the Apostle too, in what follows in this Epistle, says: "Their thoughts accusing, or even defending them, in the day when God shall judge the hidden things of men." In which he certainly shows that the hidden things of men are not to be revealed except in the day when God is to judge, just as he says still more plainly to the Corinthians: "Do not," he says, "judge before the time, until the Lord comes, who will both illuminate the hidden things of darkness, and make manifest the counsels of hearts." All of which things are certainly understood to be said of this same day, in which darkness and mourning and sadness are said to be in store, on account of those who, pierced through with many wounds of sins, will stand in need of the remedies of fire. At which time it will be said to the saints: "Go, my people, enter into your storechambers, shut your door, hide yourself for a little while, until the fury of my wrath passes by." How great the riches of God's goodness are hidden away in these words, on account of those who despise his patience and goodness, there is no need to make manifest. It is indeed asked by some why this day, concerning which we above set in motion the prophetic libraries, has been appointed at the end of the world, so that all who have died from the beginning of the age up to its end are reserved to be judged on this last day. It is certain that the inner causes of this matter are covered over by more secret mysteries. But "it is good to hide the mystery of a king." Nevertheless, for the sake of explanation we shall speak, insofar as it is possible to commit the words to pages. There are many who, departing from this life, have left behind them certain seeds either of goods or of evils, from which the people who survive receive occasions either of salvation or of destruction: for example, I might say, such as are all those who founded among the philosophers depraved sects estranged from God; or those who devised magical sacrileges, or the errors of the stars and their decrees; or certainly those who among us have arisen as authors of heretics and of depraved doctrines by publishing books; or also those who have worked schisms in the Churches, and scandals and dissensions. But on the contrary there is the work of the apostolic writings, and the progress of the universal Church through them, and the conversion to God, and the correction of the whole world. The causes of all these things will not be closed off except with the end of the world itself: and therefore the judgment of God would not be just, so long as either the advances or the hindrances from each of these were still hanging in the balance. This too the Apostle seems to signify, when he says: "The sins of some men are manifest, going before them to judgment; but those of some follow after them." Now indeed, if even those placed outside the body — whether the saints, who are with Christ, do anything and labor on our behalf, after the likeness of the angels who administer the services of our salvation; or again if sinners also, themselves placed outside the body, do anything according to the purpose of their mind, after the likeness nonetheless of the angels on the left hand, with whom they are said by Christ to be sent also into the eternal fire — let this too be held among the hidden things of God, and mysteries not to be committed to paper. Let these things suffice concerning the day of wrath and revelation.
'''
