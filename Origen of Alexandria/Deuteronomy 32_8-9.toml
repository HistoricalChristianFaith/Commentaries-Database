[[commentary]]
quote='''
"When you go to the ruler". Who then is this ruler? "When the Most High divided the nations, when he scattered the sons of Adam, he set the boundaries of the nations according to the number of the angels of God, and the Lord's portion became his people Jacob, the cord of his inheritance Israel". Therefore from the beginning the earth was divided among the rulers, that is, the angels. For Daniel more plainly testifies that those whom Moses had named "angels" are "rulers", saying: "the ruler of the kingdom of the Persians" and "the ruler of the kingdom of the Greeks" and "Michael your ruler"; and so there are rulers of the nations. And each one of us has an adversary clinging to him, whose work it is to lead us to the ruler and to say: O ruler — for example, of the kingdom of the Persians — this man, who was under you, I have kept for you as he was; none of the remaining rulers was able to lead him over to himself, not even that one who boasted that he had come for this purpose, to snatch men from all the inheritances of the Persians or the Greeks and of all the nations and make them subject to the inheritance of God. Christ our Lord conquered all the rulers and, passing beyond their boundaries, carried over the captive peoples to himself for salvation. And you were of the portion of some ruler: Jesus came and snatched you from the perverse power and offered you to God the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily35.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 35"
