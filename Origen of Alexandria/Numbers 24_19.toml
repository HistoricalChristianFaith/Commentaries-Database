[[commentary]]
quote='''
"And there shall rise up one out of Jacob, and he shall destroy him that is delivered from the city." That one, he says, who shall rise up as a star out of Jacob, shall destroy him that is delivered from the city. Not in this alone, but in almost every prophetic style, the things that are said are said in speech quite involved and obscure. For it did not please the Holy Spirit, who willed these things to be written, that these should be set plainly and, so to say, to be trodden under the feet of the unskilled, but he so provided that, while they seem to be held publicly, yet, hidden by the obscurity of the words, they should be kept covered in mysteries and in secrets. And now, then, this that he says: "he shall destroy him that is delivered from the city," unless you look to the prophetic custom, of which it is said: "all prophecy cannot stand by its own solution," the understanding will seem far more difficult. Let us see, however, whether perhaps in this way it can be explained. Let us understand "the city" here as the world, just as also in the Gospels it is said of the prodigal son, who squandered the substance of his father, that "he went," it says, "to a certain chief man of the city in that region," by whom, being received, he is sent into the field to feed swine. And here too, then, the city, of which that man was chief, is understood as this world. Therefore him that is delivered from this city, that is, whom Christ delivers from this world, he destroys him. For he says to him that: "he who shall destroy his soul for my sake, shall make it safe." By a saving destruction, therefore, Jesus shall destroy him whom he shall have delivered from the city of this world. And so we too, if we wish to come to salvation and to be delivered from this world, ought to destroy our souls with a useful and necessary destruction. For he destroys his soul according to Christ who curbs its desires, who cuts back its cravings, who chastises its luxury and dissoluteness, and in nothing at all does his own will, but the will of God; and through these things the soul is said to perish. For its former life perishes and it begins to lead a new life, which is in Christ. Similar to this saying is also that: "if we die together, we shall also live together," and that: "but if you are dead to the elements of the world, how, as though living in this world, do you make decrees?" Necessarily, therefore, in these too it is declared that he destroys his soul in this world who dies with Christ, and he who has thus destroyed it shall find it there, without doubt, where the Apostle says that "your life is hidden with Christ in God," to whom be glory unto the eternal ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily18.html'
source_title="HOMILIES ON NUMBERS 18.4"
