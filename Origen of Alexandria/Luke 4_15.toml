[[commentary]]
quote='''
But you must not think that they only were happy, and that you are deprived of Christ's teaching. For now also throughout the world He teaches through His instruments, and is now more glorified by all men, than at that time when those only in one province were gathered together.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he himself taught in their synagogues and was glorified by all. When you read: "he taught in their synagogues and was glorified by all", beware lest you judge those men alone blessed and think yourself deprived of the teaching. If the things that are written are true, not only then in the assemblies of the Jews, but also today in this assembly the Lord speaks: and not only in this one, but also in another gathering and in the whole world Jesus teaches, seeking instruments through which he may teach. Pray that he may find me too composed and fit for singing! For just as almighty God seeks prophets at that time when mortals have need of prophecy, and finds, for example, Isaiah, Jeremiah, Ezekiel, Daniel, so Jesus seeks instruments through which he may teach his word, or instruct the peoples in the synagogues, and "be glorified by all". Now Jesus is "glorified by all" more than at that time, when he was known only in a single province.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily32.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 32"
