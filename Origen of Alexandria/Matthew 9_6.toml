[[commentary]]
quote='''
We see that the paralytic who was lying on a bed and was bidden by the Saviour’s voice to take up his couch and go into his house, before he could be healed, was lying on the feeble body of his own limbs; which body was subsequently made whole by the power of God. That is how I understand Take up thy couch and go into thy house. For the Son of God had not come down from heaven to earth to give orders about beds, or to forbid a person getting up from sickness to depart without his bed, saying as He did: Take up thy couch and go into thine house.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
