[[commentary]]
quote='''
The divine dispensation raised him up and made not only two or three to be witnesses of his resurrection, but far more. For "he was seen by Cephas, then by the eleven, then he appeared to more than five hundred brethren at once", "and last of all" by Paul. And it was no small sign of his resurrection, that he was seen by so many — by those who took up the danger of proclaiming him alive among the peoples who had demanded him for the cross.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252027.html'
source_title="COMMENTARY ON MATTHEW 129"
