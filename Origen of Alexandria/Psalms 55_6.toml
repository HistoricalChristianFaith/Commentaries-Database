[[commentary]]
quote='''
Now "the Holy Spirit descended upon" the Savior "in the form of a dove", a bird that is gentle, innocent, and simple. Whence it is also commanded to us that we should imitate the innocence of doves. Such is the Holy Spirit—clean and winged and rising to the heights. Wherefore in prayer we say: "Who will give me wings like a dove's, and I shall fly and be at rest?"—that is: who will give me the wings of the Holy Spirit?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily27.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 27"
