[[commentary]]
quote='''
After these things they set out from Iroth and pass through the midst of the Red Sea, and they came to the bitter waters. We have said that the time of the journeyings is a time of dangers. How troublesome a trial it is to pass through the midst of the sea, to see the waves rising up in a heap, to hear the roar and crash of the raging billows; but nevertheless, if you follow Moses, that is, the law of God, the waters will become for you a wall on the right hand and on the left, and you will find a path through dry ground in the midst of the sea. But that heavenly journey too, which we have said the soul makes, may perhaps have some waters as well; it may be that there too waves are found; for there is a certain portion of waters above the heaven and a certain portion beneath the heaven, and we for the present endure the waves and billows of these waters that are beneath the heaven. God knows whether those others are always quiet and calm and are never stirred up by any winds that blow. But we for the present, when we have come to the crossing of the sea, even if we see Pharaoh and the Egyptians pursuing, let us not be alarmed at all; let there be no fear, no dread of these things. Let us only believe in the one true God and in his Son Jesus Christ whom he sent. And if it is said that the people believed God and his servant Moses, we too, in accordance with this, believe also Moses, that is, the law of God and the prophets. Be steadfast, therefore, and a little later you will see the Egyptians lying on the shore of the sea. And when you have seen them lying there, rise up and sing to the Lord in songs and praise him who has drowned the horse and the rider in the Red Sea. So then they came to the bitter waters. When you hear of bitter waters, do not be frightened nor terrified. For all instruction, for the present, does not seem to be sweet, but bitter; yet afterward it yields to those trained by it the sweetest and most peaceable fruit of righteousness itself, as the Apostle teaches. Finally, the unleavened bread too is commanded to be eaten with bitter herbs; nor is it possible to reach the land of promise unless we pass through bitter things. For just as physicians insert certain bitter ingredients into their medicines with a view to the safety and health of the sick, so too, with a view to our safety, the physician of our souls has willed us to suffer the bitter things of this life in various trials, knowing that the end of this bitterness gains for our soul the sweetness of salvation; just as, on the contrary, the end of the sweetness which is in bodily pleasure, as the example of that rich man has taught, yields a bitter end in the hell of punishments. You therefore, who walk the way of virtue, do not shrink from coming to the bitter waters. For you will set out from there too, as also did the children of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.10"
