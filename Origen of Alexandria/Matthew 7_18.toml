[[commentary]]
quote='''
If you do not rashly disparage, you will now hear that: "a good tree cannot bear bad fruit, nor can a bad tree bear good fruit". We have therefore trees within us, whether good or bad; and those which are good "cannot bear bad fruits", just as those which are "bad bear not good fruits". Do you wish that I set forth for you also the terms and appellations of the very trees which are within us? It is not a fig or an apple or a vine, but one tree is called justice, another prudence, another fortitude, another is named temperance. And if you will, learn yet a greater multitude of trees, with which perhaps the paradise of God will be thought more worthily planted. For there is there a tree of piety, and there is another tree of wisdom, and there is another of discipline, and there is another "of the knowledge of good and evil". But above all is "the tree of life". Does it not seem to you rather that the heavenly "Father", "the husbandman", cultivates trees of this kind in your soul and establishes plantings of this kind in your mind? Thus therefore says the Savior: "a bad tree cannot bear good fruits, nor a good one bad fruits". This is what He teaches: the tree of chastity is "good", it cannot bear the fruits of unchastity; the tree of justice is "good" and cannot bear the fruits of injustice. So also, on the contrary, if you should have the root of "a bad tree" planted in your mind, it cannot render "good fruits". For if there be in you a root of malice, it will not give "good fruits"; if there be within your heart a plant of folly, it will never bring forth the flower of wisdom; if it be a tree of injustice, if of iniquity, never can such trees rejoice in "good fruits".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily16.html'
source_title="HOMILIES ON LEVITICUS 16"
