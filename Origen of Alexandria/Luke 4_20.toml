[[commentary]]
quote='''
And now also if we will, our eyes can look upon the Saviour. For when you direct your whole heart to wisdom, truth, and the contemplation of the only-begotten Son of God, your eyes behold Jesus.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
But when Jesus had read these things, rolling up "the book he gave it to the minister and sat down, and the eyes of all in the synagogue were attending upon him". And now, if you will, in this synagogue and gathering your eyes can attend upon the Savior. For when you have directed the principal gaze of your heart to wisdom and truth and to contemplating the Only-begotten of God, your eyes behold Jesus. Blessed congregation, of which Scripture testifies that "the eyes of all were attending upon him"! How I would wish that this gathering should have a like testimony, that the eyes of all — both of catechumens and of the faithful, both of women and of men and of infants — not the eyes of the body, but of the soul, should look upon Jesus! For when you shall have looked back to him, from his light and his gaze your faces will be brighter, and you will be able to say: "the light of your countenance is signed upon us, O Lord": to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily32.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 32"
