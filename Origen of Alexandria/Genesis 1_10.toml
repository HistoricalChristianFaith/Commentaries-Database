[[commentary]]
quote='''
"And the water which is below heaven was gathered into its gatherings, and the dry land appeared. And God called the dry land earth, and the gatherings of the waters he called seas." Just as, then, this dry land, when the water was separated from it, as we said above, no longer remained "dry," but is now named "earth," in this way also our bodies, if this separation from those waters be made, will no longer remain "dry," but will be called "earth" from the fact that they will now be able to bear fruit to God. For "in the beginning God made heaven and earth," but afterward he made "the firmament" and "the dry land"; and "the firmament" indeed he "called heaven," granting to it the name of that heaven which he had created before, but "the dry land" he called "earth" for the reason that he bestowed on it the capacity of bearing fruits. If, then, anyone by his own fault still remains dry and bears no fruit, but "thorns and thistles," carrying as it were fuel for fire, according to the things which he has brought forth from himself, he too is made "fuel for fire." But if by his own zeal and diligence, the waters of the abyss having been separated from himself, which are the senses of demons, he has shown himself to be fruitful earth, he ought to hope for like things, that he too may be led by God into "the land flowing with milk and honey."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.2"
