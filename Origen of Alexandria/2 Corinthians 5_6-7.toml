[[commentary]]
quote='''
We can also say the following about this passage: it is in no way contrary that this same Jesus, according to one understanding, should be everywhere, but according to another should journey abroad. For if we, "while we are in the body, journey abroad away from the Lord (for we walk by faith, not by sight)", then in all who are in the body and journey abroad away from the Lord, the Lord also journeys abroad from them as they walk "by faith", "not by sight". But if we journey abroad "from the body" toward the Lord, then he too will be with us, and in return for the fact that we have walked "by faith", it will come about that afterward we may also walk "by sight". And by "sight" we mean the sight of the Word and of wisdom and of truth and of righteousness and of peace and of everything whatsoever that is the only-begotten of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252025.html'
source_title="COMMENTARY ON MATTHEW 65"
