[[commentary]]
quote='''
For the body of one who has already been raised with Christ and has "become conformed to his resurrection and to the newness of life" ought to belong to none other than the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XXIX"
