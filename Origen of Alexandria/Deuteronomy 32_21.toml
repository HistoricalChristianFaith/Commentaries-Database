[[commentary]]
quote='''
Yet what is it that she, among whom the law was both born and nursed, receives the wages of her nursing from the daughter of Pharaoh? What is it that the synagogue receives from the church? I think it can be understood as that which the same Moses writes, saying: "I will lead you into jealousy over that which is no nation, over a foolish nation I will provoke you to wrath." The synagogue, then, receives this as its wages from the church, that it no longer worship idols. For seeing those who are of the nations so converted to God that they no longer know idols, and venerate no one except the one God, she herself is ashamed any longer to worship idols. This benefit, therefore, the synagogue receives from the church, in that she was seen to have nursed the law as a little one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily02.html'
source_title="HOMILIES ON EXODUS 2"
