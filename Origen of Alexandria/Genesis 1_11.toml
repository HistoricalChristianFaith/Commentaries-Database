[[commentary]]
quote='''
But let us see from what follows what are the fruits which God commands that earth to produce to which he himself granted this name. "And God saw," it says, "that it is good, and God said: Let the earth bring forth the grass of hay sowing seed according to its kind and according to its likeness, and the fruit-bearing tree making fruit, whose seed is in itself according to its likeness upon the earth. And it was made so." According to the letter, the fruits are evident which the "earth" that is not "dry" produces. But again let us refer this also to ourselves. If we have now become "earth," if we are no longer "dry," let us bear abundant and varied fruits to God, so that we too may be blessed by the Father who says: "Behold, the smell of my son is like the smell of a full field which the Lord has blessed," and so that what the Apostle says may be fulfilled in us: "For the earth which receives the rain that frequently comes upon it, and brings forth grass suitable for those by whom it is cultivated, will receive blessings from God. But that which brings forth thorns and thistles is rejected and near to a curse, whose end is in burning."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.3"
