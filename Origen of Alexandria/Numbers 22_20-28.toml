[[commentary]]
quote='''
This Balaam, as we said above, was a diviner, foreknowing things to come sometimes by the ministry of demons and by magic art. He is asked by King Balak to curse the people of Israel; envoys come, they carry instruments of divination in their hands, the nations stand astonished and anxious, awaiting what Balaam may answer, of whom they were persuaded that he was held worthy of divine conversations. See now how wisdom makes this vessel, prepared unto dishonor, to profit unto the usefulness not only of one nation, but of almost the whole world, and to this man, to whom demons were accustomed to appear, God appears, forbidding the journey of the evil work. Balaam is amazed and marvels at the authority of the one forbidding; for it was not usual for evil to be displeasing to demons. But meanwhile he sends back the envoys, saying that he cannot do anything except the word which God should give in his mouth. The envoys return again, again he inquires, again he is troublesome, again he desires to hear; for one who is greedy does not easily lack an eye to reward. What, then, does he hear a second time from God? "If these men came to call you," he says, "arise and go with them." In which indeed God yields to the will of his greed, that what is written may be fulfilled: "he let them go according to the desire of their heart, they shall go in their own wills," yet nevertheless the counsel of the divine dispensation is fulfilled; for it is said to him: "the word, whatever I shall give in your mouth, this you shall speak." If Balaam had been worthy, God would have placed his word not in his mouth, but in his heart. But now, since in his heart there was the desire of reward and the greed of money, the word of God is placed not in his heart, but in his mouth. For a wondrous and great dispensation was being carried out, that, since the words of the prophets, which were contained within the court of Israel, could not reach the nations, through Balaam, in whom faith was held by all the nations, the secret mysteries concerning Christ might become known also to the nations, and he might carry a great treasure to the nations, borne not so much by heart and understanding as by mouth and speech. But that we may not delay over each point—for there is no time for all things to be resolved—Balaam, having mounted his donkey, went along the way; an angel met him, that one without doubt who was present with the sons of Israel. He opens the mouth of the donkey, that Balaam may be reproved through her, and that he who seemed a diviner and wise might be confuted by the voice of a dumb beast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily14.html'
source_title="HOMILIES ON NUMBERS 14.3"
