[[commentary]]
quote='''
Pruning is the remission of sins. For every branch that abides in me and brings forth fruit, He says, my Father purifies that it may bring forth more fruit. Have fruit, and the former things in you that were unfruitful shall be taken away.

‘The time of pruning is come,’ indeed, THE VOICE OF THE TURTLE-DOVE IS HEARD IN OUR LAND. Not without reason are a pair of turtle-doves and two young doves accepted in the sacrifices. For they are worth the same, and you never find separate mention of just a pair of doves, but a pair of turtle-doves and two young doves. The dove denotes the Holy Spirit. But when the great and more hidden mysteries are in question, and the things that many people cannot grasp, then the Holy Spirit is represented under the appellation of a turtle-dove—of the bird, that is to say, that always dwells on mountain ridges and in the tops of trees. But in the valleys, in the things that all men understand, He figures as a dove.

Finally, because the Saviour deigned to assume human nature and came to earth, and because there were many sinners then in the Jordan area, the Holy Spirit does not take the form of a turtle-dove, but becomes a dove, and dwells as the tamer bird among us for the sake of the multitude of men. But He appears as the turtle-dove, for instance, to Moses, and to one of the prophets (it does not matter which), when they retire to the mountains and deserts and there receive the oracles of God. ‘The voice of the turtle-dove,’ then, ‘is heard in our land.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
