[[commentary]]
quote='''
The voice of the turtledove has been heard in our land. Not without cause is a pair of turtledoves, or two young pigeons, taken in the sacrifices: for they are of equal worth, and it is never said separately, a pair only of pigeons, but a pair of turtledoves, and two young pigeons. The dove is the Holy Spirit. But the Holy Spirit, when he speaks of great and more hidden mysteries, which many cannot receive, is signified by the name of the turtledove — that is, of that bird which dwells always on the ridges of the mountains and on the tops of the trees; but in the valleys, and in the things which reach even to men, the dove is taken. In short, the Savior, because he deigned to take on manhood, and came to earth, and there were then many sinners about the Jordan: therefore the Holy Spirit is not turned into a turtledove, but becomes a dove. Among us, because of the multitude of men, the tamer bird dwells. But the turtledove seems, for instance, to signify Moses and any one you please of the prophets who withdraw into the mountains and deserts, and there receive the words of God. The voice of the turtledove, then, has been heard in our land. The fig tree has put forth its green figs. From the fig tree learn the parable. When its branch has become tender, and has put forth leaves, know that summer is near. The word of God wishes to announce to us that, after the winter, after the storms, the harvest of souls has drawn near, and it says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 2"
