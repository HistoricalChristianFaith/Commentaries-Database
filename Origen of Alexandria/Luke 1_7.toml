[[commentary]]
quote='''
First of all, consider what this means, that very many of the holy women in the scriptures are said to have been barren, as Sarah herself, and behold now Rebekah as well. But Rachel too, beloved of Israel, was barren. Hannah also, the mother of Samuel, is written to have been barren. But in the Gospels too Elizabeth is recorded to have been barren. And in all these women this one heading is signified: that after barrenness they all brought forth a holy childbirth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily12.html'
source_title="HOMILIES ON GENESIS 12.1"
