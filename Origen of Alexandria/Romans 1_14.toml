[[commentary]]
quote='''
Now we must inquire how the Apostle is a debtor to Greeks and barbarians, to the wise and the unwise. For what had he received from them, whereby he should become their debtor? I think that he was made a debtor to the various nations for this reason, that he received through the grace of the Holy Spirit to speak in the tongues of all nations, as he himself also says: "I speak with tongues more than you all." Since therefore one receives the knowledge of tongues not for himself, but for those to whom he must preach, he is made a debtor to all those whose language he has received the knowledge of from God. And to the wise he is made a debtor through this, that he received the wisdom hidden in a mystery, which he might speak to the perfect and the wise. But how also to the unwise? In that he received the grace of patience and of long-suffering. For it belongs to the highest patience to bear the impulses of the unwise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook01.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"


[[commentary]]
quote='''
We can see how in a short time this religion has grown up, making progress through the persecution and death of its adherents and through their endurance of the confiscation of their property and every kind of torture. And this is particularly miraculous, since its teachers are themselves neither very skillful nor very numerous. But in spite of everything, the Word is now preached in all the world, so that "Greeks and barbarians, wise and foolish" now adopt the Christian faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25204.html'
source_title="ON FIRST PRINCIPLES 4.1.2"
