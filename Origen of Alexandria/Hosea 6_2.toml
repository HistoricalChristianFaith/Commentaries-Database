[[commentary]]
quote='''
For hear what the prophet says: "God will raise us up after two days, and on the third day we shall rise again and shall live in his sight." The first day for us is the passion of the Savior, and the second, on which he descended into hell, but the third is the day of the resurrection. And therefore on the third day "God went before them, by day in a pillar of cloud, by night in a pillar of fire." But if, according to those things which we said above, the Apostle rightly teaches us that the mysteries of baptism are contained in these words, it is necessary that "those who are baptized in Christ should be baptized in his death, and be buried together with him," and rise again with him on the third day from the dead, whom also, according to that which the Apostle says: "he raised up together with himself, and made to sit together in the heavenly places." When, therefore, the mystery of the third day has been received by you, God will begin to lead you forth and Himself to show you the way of salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily05.html'
source_title="HOMILIES ON EXODUS 5"
