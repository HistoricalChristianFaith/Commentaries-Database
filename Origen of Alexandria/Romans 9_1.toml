[[commentary]]
quote='''
Paul, seeing that if, according to those things which he set forth above, he could be separated from the love of Christ by no power, whether heavenly or earthly, present or future, opposing him, it would seem contrary and incredible—what he was now proposing to say: that he wished to become anathema from that Christ whom he loved so inseparably, that is, to be made a stranger to him—lest he should seem to incur the mark of a lie, he sends ahead a satisfaction, so that his word may in no way be doubted, and he says: "I speak the truth in Christ, I do not lie, my conscience bearing me witness in the Holy Spirit." But let us see why he said, "I speak the truth in Christ," as though showing that there is some truth which is not in Christ. And see whether we can in some such way distinguish the truth which is in Christ from that which is not in Christ: for elsewhere too the same Apostle says, "The truth of Christ is in me, that I do not lie." The truth of Christ, therefore, must be believed to be there where the remaining virtues also are, which are described as being Christ: that is, where righteousness is, where peace is, where the Word of God is, there also is the truth of Christ. But there is truth even in injustice: as if, for example, we should say that that demon of Python, which in the Acts of the Apostles is reported to have dwelt in a certain servant girl and to have cried out after the apostles, that "these are servants of the Most High God, who announce to men the way of God"—there was truth in these words, for what was said was true; but that truth was not in Christ; and therefore Paul, turning to her, said: "Be silent, and come out of her." But that also was truth which Caiaphas said: "It is expedient for you that one man die for the people, and that the whole nation not perish"; but nevertheless that truth was not in Christ. And therefore the Apostle, to distinguish it from that truth which is outside Christ, says that he speaks the truth in Christ. But this also, which he says, "my conscience bearing me witness in the Holy Spirit," seems to me to bear a similar understanding. For conscience renders testimony even to the Gentiles, according to what the same Apostle says in the earlier passages: "their conscience rendering them testimony, and their thoughts among themselves accusing or even defending one another." In those, therefore, in whom their own thoughts have something to accuse, and conscience comes forward for testimony, it cannot be said that for evil deeds conscience renders testimony in the Holy Spirit. But in the Apostle, where thought no longer has anything to accuse, rightly does conscience render testimony in the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
