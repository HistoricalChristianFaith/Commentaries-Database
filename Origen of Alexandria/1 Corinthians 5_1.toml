[[commentary]]
quote='''
Then he adds the reason for such an inquiry, saying, It is actually reported that there is fornication among you, such as is not even among the Gentiles. We learn that we need to have a charm chanted over us concerning fornication so that we may not fall; and we must learn another thing as well, that even those who are not conscious in themselves of fornication, but who are aware that those gathering with them commit fornication, should not be puffed up, knowing that they too are sinners in that he who gathers with them is a sinner. For he brings a charge against the whole Church on account of one man who has committed fornication, and he charges their being puffed up as something occurring not according to reason, especially because there was still a fornicator among them. And thirdly we learn that there are also differences of fornications, so that there is a certain most grievous fornication, and another lesser, and another still lesser. Therefore in the judgment of God the fornicators are not judged without distinction, nor will they receive the same condemnation for having committed fornication, but both the quantity and the quality increase the punishment, and so too the deliberate choice and the time. In Corinth, then, a certain man contracted an unlawful marriage; for he took his stepmother to wife; but such a marriage the Apostle calls fornication, and such as is not even to be heard of among the Gentiles, in order to teach us that, if ever we marry unlawfully, what is supposed to be a marriage is not reckoned to us as a marriage but as fornication.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XXIII"
