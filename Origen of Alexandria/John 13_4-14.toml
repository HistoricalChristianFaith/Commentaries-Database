[[commentary]]
quote='''
Let us come to the Gospel. We find there our Lord and Savior "putting off his garments, and, girded with a linen cloth, pouring water into a basin, and washing the feet of his disciples." You see, then, that the prophets foreshadowed these things, which were to be fulfilled in the last times through the Lord. That "water," therefore, which "Jesus poured into the basin," was the dew of heavenly grace, with which "he washed the feet of his disciples." Whence also he rightly said to them: "but you are clean because of the word which I have spoken to you." But we too, if only we offer our feet, the Lord Jesus is ready to "wash the feet" of our soul and to cleanse them with the heavenly dew, with the grace of the Holy Spirit, with the word of doctrine. For he willed that not the Apostles alone should be "clean," but also all who believe through his word. And to all believers he says that which he said to Peter: "unless I wash you, you shall have no part with me." For it is certain that no one "has part with Christ" unless he has been washed and made "clean." Come, I beseech you, Lord Jesus, Son of God, "put off the garments" which you put on for my sake, and gird yourself for my sake, and "pour water into a basin and wash the feet" of your servants, wash away the filth of your sons and daughters. "Wash the feet" of our soul, that we, imitating you and following you, may "put off" our old "garments." For as soon as you "wash" my "feet," may you also make me recline with you, that I may hear from you: "you call me Lord and master; and you say rightly, for I am. If therefore I, the Lord and master, have washed your feet, you too wash one another's feet." I too, therefore, now wish to "wash the feet" of my brethren, to "wash the feet" of my fellow-disciples. And so far as I am able, I desire to "wash the feet" of my brethren and to fulfill the commandment of the Lord, that by the word of doctrine the hearers may be cleansed from the filth of their sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily08.html'
source_title="HOMILIES ON JUDGES 8"
