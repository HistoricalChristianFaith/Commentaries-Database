[[commentary]]
quote='''
But let us see what this "ambidextrous" judge does. "The children of Israel sent," it says, "gifts to Eglon king of the Moabites by the hand of Ehud"; "and Ehud made himself a sword sharpened on both sides, of the length of an extended palm, and girded it to himself upon his right thigh." You see that everything is right-handed which this "ambidextrous" "Ehud" carries out: he is right-handed both in hands and right-handed in feet. For he carries the sword on his right thigh, that he may come to the "king of Moab" and slay him. We had said above that these whom God is said to raise up for the salvation of the people and for the delivering of the children of Israel — the saviors or judges — bear the image of certain princes from the "heavenly host" and of the supernal powers, which God sends forth for the aid of those who cry out to him with their whole heart and by the conversion of repentance have bent the divine clemency toward themselves. But lest this seem to have been presumed by us in the eyes of our hearers, we ought to establish it from the authority of the Scriptures. It is written in Exodus that our fathers the children of Israel, when for a long time they had served the Egyptians and Pharaoh, that most harsh king, in the making of "mud and brick," "cried out," it says, "to the Lord," so that the Lord himself said: "the cry of the children of Israel has ascended to me," and, having sent Moses, he led them out visibly. But Scripture recounts that an exterminating angel was sent, who indeed laid waste all the firstborn of Egypt, but touched none of the Israelites. And thus it is declared that it was a heavenly power which, after the Egyptians had been laid waste and cast down, led the children of Israel out from the yoke of servitude. Something similar is also recounted in the histories, that under Sennacherib king of the Assyrians "an angel of the Lord" is sent, who, having slain and cast down in a single night "one hundred and eighty-five thousand" of the enemy, delivered both the city from the siege and the people from imminent destruction. So therefore even now we ought to observe the same consequence, that, if ever for our sins we are handed over into captivity, we should "cry out to the Lord." But let us cry out not with the mouth, but with the mind, so that the grief of the heart may "bring forth a fountain of tears from the eyes," like him who said: "every night will I wash my bed, I will water my couch with my tears." If we are so converted from evils that we no longer touch evils, if we so cease from pride that we no longer relish anything proud, anything arrogant, the Lord will send us too his heavenly power, through which we may be delivered from the yoke of diabolical servitude; a power which may do all things for us right-handed and prosperous, which may make us forsake the "left-hand way, which leads to perdition," and call us back to the true "way," him who says: "I am the way and the truth and the life," Christ Jesus our Lord, "to whom is glory and dominion unto the ages of ages. Amen!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily03.html'
source_title="HOMILIES ON JUDGES 3"
