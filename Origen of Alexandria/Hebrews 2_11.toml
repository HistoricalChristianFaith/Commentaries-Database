[[commentary]]
quote='''
It does not suffice for them to cry 'Holy!' once, nor twice, but they take up the perfect number of the Trinity, that they may manifest the multitude of the holiness of God, which is the repeated commonalty of a threefold holiness; to the holiness of the Father is joined the holiness of the Son and of the Holy Spirit. "For both He who sanctifies and those who are sanctified are all of one". He who "sanctifies" is the Savior, according to this—that as a man He receives holiness from God the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily04.html'
source_title="HOMILIES ON ISAIAH 4"
