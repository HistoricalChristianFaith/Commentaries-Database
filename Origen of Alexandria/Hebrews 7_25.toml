[[commentary]]
quote='''
For all these things, therefore, he "now stands before the face of God", "interceding for us", he stands at the altar, that he may offer propitiation for us to God; and therefore, as one about to approach that altar, he said: "that I will no longer drink of the generation of this vine, until I drink it new with you". He waits, therefore, that we may be converted, that we may imitate his example, that we may follow his footsteps, and that he may rejoice with us and "drink wine with us in the kingdom of his Father". For now, because "the Lord is merciful and compassionate", he himself with greater affection than his Apostle "weeps with them that weep and desires to rejoice with them that rejoice". And much more "does he himself mourn those who sinned before and did not do penance". For it must not be thought that Paul indeed mourns for sinners and weeps for the offending, but that my Lord Jesus refrains from weeping when he approaches the Father, when he stands at the altar and offers propitiation for us; and this is, being "one who approaches the altar", not to drink the wine of gladness, because he still suffers the bitternesses of our sins. He does not will, then, to drink wine alone "in the kingdom" of God; he waits for us; for thus he said: "until I drink it with you". It is we, therefore, who, by neglecting our life, delay his gladness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
