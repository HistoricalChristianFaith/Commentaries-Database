[[commentary]]
quote='''
But what is said after this? "And Othniel," it says, "the son of Kenaz, died." I see a perilous matter. "Othniel died." Why? Because the people was now unworthy to have such a judge. Then in what follows, after he had died, it says: "and the children of Israel added," it says, "to do evil in the sight of the Lord; and the Lord strengthened Eglon king of Moab against Israel." Consider that, because they were now unworthy to have such a leader, for that reason the good judge is taken away from them. And because they "did evil in the sight of the Lord," there is stirred up against them a most wicked enemy, "Eglon king of Moab." You see that our sins supply strength to our enemies, and that, when we "do evil in the sight of the Lord" and transgress, then our adversaries "are strengthened by the Lord," then strength is given to the contrary powers. Whether you seek this according to the letter, you will find it so, that the enemies would not grow strong unless our offenses conferred strength upon them; or whether you consider it in spiritual things, likewise the contrary powers would not grow strong against us, nor would the devil himself prevail at all in us, unless we supplied him strength out of our vices; he would be very weak against us, unless we made him strong in sinning, and unless through our sins he found a place of entering and of dominating within us. For this reason, finally, the Apostle too gives warning beforehand, saying: "do not give place to the devil," just as here too we have just now read that, after "the children of Israel did evil in the sight of the Lord," they "gave place to the devil." For "the Lord strengthened Eglon king of Moab, and joined to him all the sons of Ammon and Amalek." Not only, it says, was he himself "strengthened" out of the sins of the children of Israel, but there are joined to him wicked allies "from the sons of Ammon and Amalek," who together with him assail Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily03.html'
source_title="HOMILIES ON JUDGES 3"
