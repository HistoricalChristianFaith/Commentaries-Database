[[commentary]]
quote='''
And indeed in the Law we find the practice of adjuring used on several occasions. For in Numbers the Law says that "the priest shall adjure her" (that is, that woman in whose husband there has arisen "a spirit of jealousy"), "and shall say to the woman" (this is, the priest): "if no one has lain with you, and unless you have transgressed so as to be defiled by a man not your own, you shall be innocent of this cursed water of accusation". And after a few words: "and the priest", he says, "shall adjure the woman with the adjurations of this curse". Likewise in the third book of Kingdoms king Ahab says to Micaiah: "Yet twice more do I adjure you, that you speak to me the truth in the name of the Lord". Now the king adjured the prophet, and he adjured not as the priest in Numbers; for the latter did so from the precept of the Law, but the former of his own choice. And now in the present passage the priest adjures Jesus by the living God. But I judge that it is not fitting for a man who wishes to live according to the Gospel to adjure another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252026.html'
source_title="COMMENTARY ON MATTHEW 110"
