[[commentary]]
quote='''
But let us also, according to our strength, turn to the things we have in hand. "Does the thing formed say," he says, "to him who formed it: Why have you made me thus? Or does not the potter have power over the clay, out of the same lump to make one vessel unto honor, and another indeed unto dishonor?" And in the prophet Jeremiah we read something of this sort, where he is commanded by God to go into the potter's house and to see him forming: namely, gathering up again the vessel that had fallen from his hands, he formed it once more according to his own will. "And the word of the Lord came to him," he says, "saying: Can I not do with the house of Israel as this potter does?" And Wisdom says: "The furnace tests the potter's vessels, and temptation tests just men." Our God, therefore, has power over us just as the potter has over the clay, to make out of the same lump vessels unto honor and vessels unto dishonor. For you, then, who insolently answer back to God, let it suffice to have heard these things. But whoever desires to behold the works of God's wisdom in his dispensations, let him hear Paul, who was privy to the divine secrets, discoursing in another place about these very matters. "But in a great house," he says, "there are not only vessels of gold and silver, but also of wood and of clay, and some indeed unto honor, but others unto dishonor. If therefore anyone shall cleanse himself from these, he will be a vessel unto honor, sanctified and useful to the Lord, prepared for every good work." Do you hear how, among those in whom Paul had no insolent contradictor, he disclosed the differences of the vessels? For there, where the hearer was not worthy but was a contradictor, he mentions only vessels of clay; but here he says there are also vessels of gold, and of silver, and of wood, and of clay: and some, he says, are unto honor, while others are made unto dishonor. Likewise also, where he recalled the reason why some are made unto honor and others unto dishonor: there he kept silent, here he disclosed it. "For if anyone shall cleanse himself," he says, "from these" — without doubt from the filth of sin — "he will be a vessel unto honor, sanctified and useful to the Lord, prepared for every good work." It remains, therefore, that he who has not cleansed himself, and has not washed away the stains of sin through repentance, is a vessel unto dishonor. And if he should also increase his malice, and through hardness of mind and an impenitent heart utterly scorn to be converted, he will now be not only a vessel of dishonor, but also a vessel of wrath. Thus, then, the reason which he closes off there to those who demand it unworthily, he opens up here to those who desire it worthily: and through it that also which he set forth a little before concerning Jacob and Esau is more openly explained. For that Jacob might be a vessel unto honor, sanctified and useful to the Lord, prepared for every good work, his soul had cleansed itself: and God, seeing his purity, and having power out of the same lump to make one vessel unto honor and another unto dishonor, made Jacob indeed — who, as we have said, had cleansed himself — a vessel unto honor; but Esau, whose soul he saw was not so pure nor so simple, he made out of the same lump a vessel unto dishonor. And that you may know that it was on account of the purity and simplicity of his soul that Jacob was made a vessel unto honor, hear what testimony of simplicity the divine Scripture bears to him. "And Jacob," it says, "was a simple man, dwelling at home." For this reason, therefore, the Apostle says concerning them that, before they were born, it is said of them: "Jacob I loved, but Esau I hated."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"


[[commentary]]
quote='''
If both the saved and the lost come from one lump of clay, then the nature of their souls will be not different but the same.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25203.html'
source_title="ON FIRST PRINCIPLES 3.1.21"
