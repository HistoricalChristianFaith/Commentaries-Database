[[commentary]]
quote='''
Perhaps my Savior becomes a roe according to contemplation (θεωρία), a hart according to works. And what are these works? He himself slays serpents, when he cuts the throats of the opposing powers. Therefore I will say to him: You have crushed the heads of the dragons upon the water.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 2"
