[[commentary]]
quote='''
And so both in these passages, and in many other places, you will find that divine Scripture has shunned the word "love" (amor) and has put "charity" and "affection" (dilectio) instead. Sometimes, though rarely, it does name love by its proper word, and it invites and incites souls toward it, as when it says in Proverbs concerning wisdom: "Love her, and she will keep you; surround her, and she will exalt you; honor her, and she will embrace you." But also in that little book which is called the Wisdom of Solomon, it is written thus concerning wisdom itself: "I became a lover of her beauty." And I think that only where no occasion of stumbling seemed to appear did it insert the very name of love … For if it had said that Isaac fell in love with Rebecca, or Jacob with Rachel, some unseemly passion might well have been understood through these words with regard to the holy men of God, especially among those who do not know how to ascend from the letter to the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"


[[commentary]]
quote='''
Just as taste and sight are different perceptions so far as the body is concerned, so, in accordance with the divine perceptions mentioned by Solomon, the visual and contemplative power of the soul is one thing, but that which is capable of tasting and apprehending the quality of spiritual foods is another.And … the Lord is capable of being tasted, being food for the soul, insofar as he is the bread of life which came down from heaven, and is capable of being seen, insofar as he is wisdom, of whose beauty he confesses to be a lover who says, "I became a lover of her beauty," and he commands us, "Love her, and she will preserve you.," For this reason it is said in the Psalms, "Taste and see that the Lord is good."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252020.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 20:405-6"
