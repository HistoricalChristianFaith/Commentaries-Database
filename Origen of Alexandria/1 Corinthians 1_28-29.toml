[[commentary]]
quote='''
Only in the case of the Ephesians did we find set down the phrase to the saints who are; and we inquire whether the addition of who are to the saints is not superfluous, and what it can signify. Consider, then, whether — just as in Exodus he who gives the oracle to Moses says that his own name is "the one who is" — so those who partake of the One who Is come to be beings, being called, as it were, from not being into being. For God chose the "things that are not", says this same Paul, "that he might bring to nothing the things that are". And someone will inquire how he brings to nothing the things that are; but let us hear him adding "so that no flesh may boast before God". For if anyone who has partaken of being, forgetting his participation, grants to himself the cause of his being, and does not refer all thanksgiving to the one who out of not being graciously granted him being "in his likeness" and "according to his image", then that which is is brought to nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Ephesians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON EPHESIANS FRAGMENT II"

[[commentary]]
quote='''
And the ignoble things of the world and the things despised God chose; again here with the addition of of the world. For what is more noble than a soul that abandons the idols and says "How false the idols our fathers acquired, and there is none among them that sends rain". The ignoble things of the world, then—but noble things of God—God chose; only let us live rightly, so that as a result we shall not be set at nought before God—concerning whom it is written "the evildoer is set at nought before him".

And the things that are not, that he might bring to nothing the things that are; by 'the things that are not' he named the foolish things of the world, the weak, the ignoble, the despised; by 'the things that are,' the well-born of the world; for in the world these are somebodies, whereas we are not, being worn down by all and despised. the things that are not God chose now, that he might bring to nothing the things that are, so that no flesh might boast and say, 'For this reason I was chosen, because I am well-born.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT VIII"
