[[commentary]]
quote='''
"And have dominion over the fish of the sea and the birds of heaven and the beasts of burden and all the things that are upon the earth, and the creeping things which creep upon the earth." These things have already been interpreted according to the letter, when we spoke of what God said: "Let us make man," and the rest, where he says: "And let them have dominion over the fish of the sea and the birds of heaven," and so on. Yet according to allegory, in the fish and the flying things or the animals and the creeping things of the earth there seem to me to be indicated those things concerning which we spoke nonetheless above, that is, either those which proceed from the sense of the soul and the thought of the heart, or those which are brought forth from bodily desires and the movements of the flesh; of which all the saints, keeping also the blessing of God in themselves, exercise dominion, driving the whole man according to the will of the spirit; but over sinners those things rather have dominion which are brought forth from the vices of the flesh and the pleasures of the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.16"


[[commentary]]
quote='''
That which God commands: "increase and multiply" — those who take it simply and according to the letter, I do not know how they can explain it. For granted that "multiply" refers to number, so that, while they become more than they were before, the multiplication has its place: yet what follows, "increase", is not in our power. For what person would not wish "to add to his stature", so as to become taller? If therefore something is commanded for this purpose, that it may come to pass — since it is foolish to command what he to whom you give the command cannot do — and it is commanded us that we should increase, then surely that is commanded which we are able to do. Do you wish to know how "increase" is to be understood? Hear what Isaac did, of whom it is said: "Isaac went forward and became greater, until he became great, or exceedingly great indeed". For his will, ever stretching itself toward better things, had its advances, his mind contemplated something more divine, and he exercised himself in memory, so as to store up more things in his treasury and retain them more firmly. And in this manner it comes about that whoever has cultivated all his virtues in the field of his soul fulfills the commandment enjoining: "increase".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily11.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 11"
