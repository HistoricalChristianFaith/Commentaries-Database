[[commentary]]
quote='''
"And have dominion over the fish of the sea and the birds of heaven and the beasts of burden and all the things that are upon the earth, and the creeping things which creep upon the earth." These things have already been interpreted according to the letter, when we spoke of what God said: "Let us make man," and the rest, where he says: "And let them have dominion over the fish of the sea and the birds of heaven," and so on. Yet according to allegory, in the fish and the flying things or the animals and the creeping things of the earth there seem to me to be indicated those things concerning which we spoke nonetheless above, that is, either those which proceed from the sense of the soul and the thought of the heart, or those which are brought forth from bodily desires and the movements of the flesh; of which all the saints, keeping also the blessing of God in themselves, exercise dominion, driving the whole man according to the will of the spirit; but over sinners those things rather have dominion which are brought forth from the vices of the flesh and the pleasures of the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.16"
