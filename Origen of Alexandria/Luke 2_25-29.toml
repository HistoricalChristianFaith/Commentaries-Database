[[commentary]]
quote='''
A reason worthy of God's gift must be sought, as to how "Simeon, a holy man and pleasing to God", as it is written in the Gospel, "awaiting the consolation of Israel, received an answer from the Holy Spirit that he would not meet death before he saw the Christ of the Lord". What good did it do him to see Christ? Did he have only this in the promise, that he should see him, and gain no benefit from seeing him, or does some gift worthy of God lie hidden here, which the blessed Simeon both deserved and received? "A woman touched the fringe of Jesus' garment and was healed". If she gained so much benefit from the outermost part of the garment, what must we suppose about Simeon, who "received into his own arms" the infant, and holding him in his embrace rejoiced and was glad, seeing carried by himself the little child who had come to release those in bonds and to free his very self from the knots of the body — knowing that no one could send anyone out from the prison of the body with the hope of the life to come except him whom he held in his arms? Hence too he speaks to him: "now, Lord, you dismiss your servant in peace"; for as long as I was not holding Christ, as long as I was not clasping him with my arms, I was shut in and could not go out from my chains. And this must be understood not only of Simeon, but of the whole human race. If anyone departs from the world, if anyone is released from prison and the house of the bound to go to reign, let him take Jesus in his hands and encircle him with his arms, let him hold him wholly in his bosom, and then, exulting, he will be able to go where he desires. Consider how great a dispensation preceded, that Simeon should deserve to hold the Son of God. First he had received an answer from the Holy Spirit "that he would not see death, unless he had first seen the Christ of the Lord". Then, not by chance and simply did he enter the temple, but "he came to the temple in the Spirit of God"; "for as many as are led by the Spirit of God, these are the sons of God". Therefore the Holy Spirit led him into the temple. You too, if you wish to hold Jesus and to embrace him with your hands and to become worthy to go out of prison, strive with all your effort to have the Spirit as your guide and to come to the temple of God. Behold, now you stand in the temple of the Lord Jesus, that is, in his Church: this is the temple built "of living stones". And you stand in the temple of the Lord when your life and conduct are most worthy of the name of the Church. If you come "in the Spirit to the temple", you will find the little child Jesus, you will lift him up in your arms and will say: "Now, Lord, you dismiss your servant in peace according to your word." And at the same time note that "peace" has been added to the release and dismissal. For he does not say: I wish to be dismissed, but with an addition: to be dismissed "in peace". For this same thing was promised also to the blessed Abraham: "but you shall go to your fathers in peace, nourished in a good old age". Who is it that dies "in peace", except the one who has "the peace of God, which surpasses all understanding and guards the heart" of its possessor? Who is it that departs from this world "in peace", except the one who understands that "God was in Christ reconciling the world to himself", and has nothing hostile and opposed to God, but has taken up all peace and concord in himself by good works, and so "in peace" is dismissed to go to the holy fathers, to whom Abraham also went forth? Why do I speak of the fathers? One must go also to the very prince and lord of the patriarchs, Jesus, of whom it is said: "it is better to be dissolved and to be with Christ". He has Jesus who dares to say: "I live, now not I, but Christ lives in me". Therefore, that we too, standing in the temple and holding the Son of God and embracing him, may be worthy of release and of departure to better things, let us pray to almighty God, let us pray also to the little child Jesus himself, whom we long to address and to hold in our arms: to whom is glory and dominion for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily15.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 15"
