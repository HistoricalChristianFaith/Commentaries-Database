[[commentary]]
quote='''
"Just as," he says, "I said to Moses, this wilderness and Antilibanus, as far as the great river, the river Euphrates." God placed the "wilderness" under Jesus, that is, the desert places. What desert places? Of which the prophet says: "rejoice, O thirsting wilderness," and: "many are the children of the desolate one, more than of her who has a husband." And again he did not say Lebanon, but "Antilibanus," which Jesus received from God. Now "Antilibanus" is so called as it were in place of Lebanon. If therefore you see that former people according to the flesh, Israel, who was "the true olive," understand that this itself was the true Lebanon; but when you see that on account of its unbelief "the kingdom is taken away from it and given to a nation producing its fruit," perceive that this people, which is brought into the kingdom in place of that expelled one, is the "Antilibanus," which is "the church of the living God" gathered from the nations through Jesus Christ our Lord, "to whom is glory and dominion unto ages of ages. Amen!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily02.html'
source_title="HOMILIES ON JOSHUA 2.4"
