[[commentary]]
quote='''
On this account our heart must be kept with all carefulness both by day and night, and no place be given to the devil. But every effort must be used that the ministers of God—those spirits who were sent to minister to those who are called to be heirs of salvation—may find a place within us, and be delighted to enter into the guest-chamber of our soul. And, dwelling within us [they] may guide us by their counsel; if, so, they shall find the habitation of our heart adorned by the practice of virtue and holiness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25203.html'
source_title="ON FIRST PRINCIPLES 3.3.6"


[[commentary]]
quote='''
That both good angels are present to men and adverse ones; that it was surely not by chance and without judgment that that angel was allotted to be the guardian of that soul, for example of Peter, and another of Paul, or another of one infant of the Church, concerning whose angels the Lord says that they "always behold the face of their Father who is in heaven." Concerning whom there is surely no room to doubt that, by the judgment of God—who clearly perceives both their worthiness and the quality of our soul—they are allotted the guardianship of each one of us by a certain mystical lot directed by the dispensation of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily23.html'
source_title="HOMILIES ON JOSHUA 23.3"
