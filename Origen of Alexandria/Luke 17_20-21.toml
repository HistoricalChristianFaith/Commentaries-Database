[[commentary]]
quote='''
But indeed, when the Savior was asked by the Pharisees about the kingdom of God, "when it would come", he replied: "The kingdom of God does not come with observation, nor do they say: behold, here, or behold, there. For the kingdom of God is within you". The Savior does not say to all: "the kingdom of God is within you", since in sinners there is the kingdom of sin, and without any ambiguity either the kingdom of God rules in our heart or the kingdom of sin. Whence, whether it be the things we do, or the things we speak, or the things we think, let us contemplate them more attentively, and then we shall see whether the dominion of God reigns in us or the dominion of sins. The Apostle, knowing that this diversity exists, admonishes certain people, saying: "let not sin reign in your mortal body". If any one of us desires the kingdom of God, he is ruled by it; if anyone is tormented by the ardor of avarice, he is ruled by avarice. Further, he who is just has justice as his queen; he who is exalted by the ambition of vainglory, the breath of popular favor reigns over him. He who mourns, he who dreads something, he who loves, he who desires — each of these things commands him, according as he is possessed by various disturbances. Recognizing all these things, and how many kinds of kingdoms there are, let us rise up and pray God to take away from us the kingdom of the enemy, that we may be able to be under the kingdom of God almighty, that is, under the kingdom of wisdom, of peace, of justice, of truth — all of which are understood in the only-begotten Son of God: to whom is glory and dominion for ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily36.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 36"
