[[commentary]]
quote='''
Nor was this written about her in vain. Yet it moves me, what is meant by what is said: "She was a virgin, a virgin, no man had known her," as though a virgin were anything other than one whom no man has touched. And what does the addition in the case of a virgin seem to mean, that it should be said that "no man had known her"? For is there some virgin whom a man has touched? I have already often said that in these things histories are not narrated, but mysteries are woven together. I think, therefore, that something of this sort is indicated here. Just as Christ is called the husband of the soul, to whom the soul is wedded when it comes to faith, so too there is that husband contrary to him, to whom the soul is wedded when it turns aside to faithlessness — that very one who is also called "the hostile man," when he "sows tares over the wheat." It is not enough, therefore, for the soul to be chaste in body; it is necessary that this most wicked husband also "has not known her." For it can happen that someone has virginity in the body and yet, knowing that most wicked husband the devil and receiving from him the darts of concupiscence in the heart, has lost the chastity of the soul. Because, therefore, Rebekah was a holy virgin in body and spirit, on that account it doubles her praise and says: "She was a virgin, no man had known her."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily10.html'
source_title="HOMILIES ON GENESIS 10.4"
