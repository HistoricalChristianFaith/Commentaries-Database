[[commentary]]
quote='''
"And taking up," it says, "his parable, he said." By a parable, then, Balaam says: "Rise up, Balak, and hear; give ear as a witness, son of Zippor. Not as a man is God deceived, nor as a son of man is he frightened; when he has said, shall he not do it? shall he speak, and not abide by it? Behold, I have been taken up to bless; I will bless, and I will not turn it away. There shall be no labor in Jacob, nor shall sorrow be seen in Israel. The Lord his God is with him, the glories of princes are with him. God, who led him out of Egypt, his glory is as that of a unicorn. For there shall be no augury in Jacob, nor divination in Israel. In due time it shall be told to Jacob and Israel what God will accomplish. Behold, a people shall rise up like a lion's cub, and shall exult like a lion; it shall not sleep until it devours the prey, and it shall drink the blood of the slain." This is the content of the second prophecy in the words of Balaam. Let us therefore see first this very thing which he says: "Rise up, Balak, and hear." For if he had not said above that he was standing beside his burnt offering, it would not seem greatly worth inquiring why he said: "Rise up, Balak." But now, since he urges to rise up the one whom he had just said was standing, the prophetic utterance is not to be passed over idly. Therefore, in that he said above that he was standing at his burnt offering, he indicates that he was not standing rightly. For he was standing, set in idolatry, and was standing as an enemy of God — which was rather not to stand, but to fall. So then, as one who ought to fall from that standing — nay rather, as one who had already fallen — thus now, by prophetic understanding, he commands him to rise up; inasmuch as, by the very fact that he had seemed to stand in idolatry, he had fallen. Let him therefore rise up, such a one as he is, let him rise up in mind, let him rise up in faith, and let him become a witness — if indeed he is converted, a witness of faith; but if he remains unbelieving, that he may be a witness of his own condemnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily16.html'
source_title="HOMILIES ON NUMBERS 16.2"
