[[commentary]]
quote='''
For this reason he shows, judiciously and through silence, the matter of subjection: that the spirits are subject to the prophets, yet it is the souls of the prophets that prophesy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LXX*"
