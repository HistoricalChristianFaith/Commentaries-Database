[[commentary]]
quote='''
And do not wonder if by these faults she who is gathered from the dispersion of the nations, and is now prepared as a bride for Christ, may sometime seem to have been liable. Recall how the first woman was seduced and made a transgressor: who is said to be saved in no other way than through the bearing of children — of those, at least, who remain in faith and charity with holiness. This, then, which is written of Adam and Eve, the Apostle thus affirms: "It is a great mystery in Christ and in the Church"; who so loved her that he gave himself up for her, while she herself was still ungodly, as he himself said: "For while we were still according to the time ungodly, Christ died for us." And again: "For while we were still unbelieving, Christ died for us."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FBook%25202.html'
source_title="COMMENTARY ON THE SONG OF SONGS, BOOK 2"
