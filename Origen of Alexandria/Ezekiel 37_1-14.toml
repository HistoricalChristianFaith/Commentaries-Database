[[commentary]]
quote='''
The mystery of the resurrection is great and difficult for many of us to understand. It is mentioned also in many other passages of the Scriptures and is proclaimed no less through these words in Ezekiel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252010.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 10:233"

[[commentary]]
quote='''
For even if there is some surpassing glory of the eye, it is chiefly in this, that either it itself be the guide of the body, or it not be forsaken by the offices of the other members. And this too I think we are taught through that vision of the prophet Ezekiel, when he says that "bone must be gathered to bone, and joint to joint and sinews and veins and skin", and each thing be restored to its own place. In short, see what the prophet adds: "these bones", he says (he did not say: they are all men, but he said: "these bones") "are the house of Israel". You will have gladness, then, on departing from this life, if you have been holy. But then there will be full gladness, when no member of the body is lacking to you.… Of these bones, while they were still scattered, before he came who was to "collect and gather them into one", that prophetic word too was spoken: "our bones are scattered beside hell". Because, then, they were scattered, therefore he says through another prophet: "let bone be gathered to bone and joint to joint and sinews and veins and skins".… But when he came who "collected the scattered" and who "joined together the dispersed", associating "bone to bone and joint to joint", he began to build up the holy body of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
