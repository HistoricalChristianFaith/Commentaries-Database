[[commentary]]
quote='''
Nevertheless, with Jesus reciting the law to you and revealing to your hearts the spiritual understanding: neither do you, proselytes, that is, catechumens, remain catechumens any longer, but hasten to receive the grace of God, that you too may be numbered in the assembly of the children of Israel; and you, "children," "do not become boys in your understanding, but in malice be little ones, yet in your understanding be perfect," as the Apostle too says to the Hebrews: "leaving the word of the beginning of Christ, let us be borne on to perfection"; but you also, who under the name of "women" are weak and slack and languid, be admonished, so that you may "raise up the slackened hands and the loosened knees," that is, so that you may rouse your negligent and slothful minds and take up a manly constancy in fulfilling the precepts of the law and the Gospel, and may quickly press on to the perfection of strong men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily09.html'
source_title="HOMILIES ON JOSHUA 9.9"
