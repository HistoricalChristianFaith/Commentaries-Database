[[commentary]]
quote='''
There is still also another festival, when they afflict their souls and humble themselves, celebrating festivals to God. O wondrous festival: the affliction of the soul is called a feast day! "For this," He says, "is the day of propitiation, on the tenth day of the seventh month." See, therefore, if you wish to keep a feast day, if you wish that God rejoice over you, afflict your soul and humble it. Do not permit it to fulfill its desires, nor grant it to wander off into wantonness, but as far as can be done, afflict and humble it. Finally, both the festival of the Passover and that of the unleavened bread is said to have the bread of affliction, nor can anyone keep a feast day unless he has eaten the bread of affliction, and has eaten the pasch with bitterness. "For you shall eat," He says, "the unleavened bread with bitterness," or with bitter herbs. You see, therefore, of what sort the festivals of God are; they admit no bodily sweetness, they wish nothing relaxed, nothing voluptuous or luxurious, but they demand affliction of the soul and bitterness and humility, because "he who humbles himself shall himself be exalted" before God. This, then, the day of propitiation too demands; for when the soul has been afflicted and humbled in the sight of the Lord, then God is made propitious to it again, and then there comes to it He whom God set forth as a propitiator through faith in His blood, Christ Jesus, its Lord and redeemer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily23.html'
source_title="HOMILIES ON NUMBERS 23.10"
