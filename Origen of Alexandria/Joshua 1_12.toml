[[commentary]]
quote='''
Moses distributed the inheritance of the land across the Jordan to two and a half tribes, that is, to "the tribe of Reuben" and "the tribe of Gad" and "the half-tribe of Manasseh." But to the remaining tribes it was not Moses but Jesus who divided the land. Nevertheless a covenant was struck with those "two and a half tribes" who had received land across the Jordan, that, leaving their "women" and their "little ones" in that land across the Jordan, they themselves should fight alongside their brothers until they too should obtain their inheritance. It was necessary, therefore, after the death of Moses, who had entered into this covenant, that Jesus should demand what was promised and remind them to bring aid to their brothers who were about to fight. This indeed the text of the narrative sets forth; but since we "have now turned to the Lord," who "takes away the veil from the reading of the Old Testament" and grants to his servants who believe in him that "with unveiled face they may behold the glory of the Lord," let us perceive that all these things, which "happened to them in a figure, were written for our sake," "upon whom the ends of the ages have come." And therefore, as we have already said before, let us attempt to ascend from the letter to the spirit, from the figures to the truth, and let us consider what pattern these "two and a half tribes" hold, which receive the land of inheritance through Moses, and what pattern the remaining "nine and a half tribes" hold, which receive the promise of the holy land through Jesus. And first of all I think that it could not have happened by chance that those who receive their portion through Moses were all firstborn. For Reuben is the firstborn from Leah, Gad the firstborn from Zilpah, and Manasseh the firstborn from Asenath the Egyptian, "the daughter of Potiphar the priest of Heliopolis," whom Joseph took to wife. I can never persuade myself that it happened by chance that all those were firstborn to whom the inheritance was decreed through Moses, but rather I judge that in these there was even then foreshadowed the pattern of two peoples: of the one, indeed, which would appear to be firstborn according to the order of nature, and of the other, which through faith and grace would receive the blessing of the inheritance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily03.html'
source_title="HOMILIES ON JOSHUA 3.1"
