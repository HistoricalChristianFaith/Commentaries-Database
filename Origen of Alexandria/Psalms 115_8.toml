[[commentary]]
quote='''
From what stones? He was certainly not pointing to irrational and bodily stones, but to insensible men, once hard, who, because they worshiped stones or wood, had that fulfilled in them which was sung in the psalm concerning such men: "let those who make them become like them, and all who trust in them". Truly those who make idols and trust in them are like their gods: they have been turned, without sense and without any reason, into stones and wood. For although they see so great an order of created things, their beauty, their function, so great a beauty of the world, they are unwilling to understand the creator from the created things, nor do they consider that there is some providence over so great a dispensation, some governor; but they are blind, seeing the world only with those eyes with which irrational beasts of burden and wild animals see. For they do not perceive that there is present, in these things which they see governed by reason, some reason.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily22.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 22"
