[[commentary]]
quote='''
They [the Jews] reflected on the death of Abraham and the prophets, understanding that Samuel, too, when he was under the earth because of death, was brought up by a medium who thought the gods were somewhere below the earth and who said, "I saw gods ascending from the earth." They had not, however, comprehended the life of Abraham and the prophets, nor that the God of Abraham, Isaac and Jacob was not the God of them as men who were dead, but as men who were alive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252020.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 20.393"


[[commentary]]
quote='''
Then I wish to say also something else from the Scripture itself. Samuel comes up — and what does the woman tell Saul she has seen? She does not say she saw a human being; she cowered before this one whom she saw. Whom does she see? "I," she says, "saw gods, gods coming up from the earth." And perhaps Samuel did not come up alone even then to prophesy to Saul; but it is likely — just as here "with the holy you will be holy, and with the innocent man you will be innocent, and with the chosen you will be chosen," and here there are associations of holy ones with holy ones, and not of holy ones with sinners (and if ever there is an association of the holy with sinners, it is for the sake of saving the sinners also) — so perhaps also, as Samuel was coming up, there came up together with him either holy souls of other prophets, or angels were there who had come up together with the spirits. Perhaps you will inquire whether angels were set over their spirits? The prophet says: "The angel who speaks in me." And every place is filled with those who need salvation, and "all are ministering spirits sent forth for service on account of those who are about to inherit salvation." Why do you fear to say that every place needs Jesus Christ? He who needs Christ needs the prophets; for he does not need Christ only and yet not need those who prepare the coming and sojourn of Christ. And John — than whom no one among those born of women was greater, according to the testimony of our Savior, who says, "Among those born of women there is none greater than John the Baptist" — do not fear to say that he too descended into Hades, proclaiming beforehand my Lord, that he might announce him as about to descend. For this reason, when he was in prison and knew the departure that lay upon him, he sent two of his disciples and inquired — not, "Are you the coming one?" (for he knew), but, "Are you the coming one, or do we look for another?" He had seen his glory, he had spoken much about his marvelousness, he had borne witness to him first: "The one coming after me has come to be before me"; he had seen his glory, "glory as of an only-begotten from the Father, full of grace and truth." Having seen such great things concerning Christ, does he hesitate to believe? Does he doubt and not say: Tell him, Are you the Christ? For now some, not understanding the things said, say: John, so great a man, did not know Christ, but the Holy Spirit had departed from him. And yet he did know this one, to whom he bore witness before his birth and over whom he leaped for joy, when Mary too came to him, as his mother testified to him, saying: "For behold, as the voice of your greeting came into my ears, the babe leaped for joy in my womb." This John, then, who leaped for joy before his birth, who said, "This is he concerning whom I said, The one coming after me has come to be before me," and, "He who sent me said to me, Upon whomever you see the Spirit descending and remaining, this is the Son of God" — this one, they say, no longer knew Jesus Christ? For in the womb he knew him. But through excess of glory he did something similar to what Peter did. What similar thing? This one knew something great concerning Christ. Who am I? "Whom do men say that I am?" And he answered: this and that. But you, what do you say? "You are the Christ, the Son of the living God"; for which he is also blessed, because "flesh and blood did not reveal it" to him, "but the Father who is in the heavens." Since, then, he had heard great things concerning Christ and supposed great things and did not accept the divine cry made to him — "Behold, we go up to Jerusalem, and it shall be accomplished," and, "The Son of Man must suffer many things and be rejected by the chief priests and elders, and be killed, and on the third day rise" — he says, "God be merciful to you, Lord." He knew great things concerning Christ; he was unwilling to accept the lowlier things concerning him. Understand John, too, as someone such as this for me. He was in prison, knowing great things concerning Christ; he had seen the heavens opened, he had seen the Holy Spirit descending from heaven upon the Savior and remaining upon him; and having seen such great glory, he doubted, and perhaps disbelieved, whether the one so glorious would descend even to Hades and even to the abyss. For this reason he said: "Are you the coming one, or do we look for another?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25202%2520-%2520On%2520the%2520Witch%2520of%2520Endor.html'
source_title="HOMILIES ON 1 SAMUEL 2.7"
