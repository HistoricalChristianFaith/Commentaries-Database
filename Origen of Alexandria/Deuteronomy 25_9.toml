[[commentary]]
quote='''
But that the injury of spittings is taken as the extreme injury, is manifest also in the law, in which it is written that the wife of a deceased man, if the brother of her husband will not take her, going to him who refused to take her to himself as wife, in the presence of the elders shall unshoe "one of his sandals from his feet and shall spit in his face and shall say: so shall it be done to the man who has not built up the house of his brother". Therefore Christ did not turn away his face "from the confusion of spittings", that his countenance might be more glorified than the countenance of Moses was glorified, with so great and such glory that (by comparison with this glorification) the glorification of that countenance is done away, just as in the sight of the sun the light of a lamp is done away, and just as the knowledge which is in part is done away "when that which is perfect has come".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252026.html'
source_title="COMMENTARY ON MATTHEW 113"
