[[commentary]]
quote='''
After these things he says: "Wherefore receive one another, as Christ also received you unto the honor of God." What he says, "receive one another," is to be referred back to what he had set forth at the first, where, on the occasion of clean or unclean foods, those who thought differently were at variance with one another; and he says: "Receive one another, as Christ also received you," who shrank from no one's uncleannesses, nor reckoned to anyone his offenses. Judge nothing, therefore, concerning the uncleanness of animals, just as he did not reckon the uncleannesses of believers. And he who had said above, "But let him who eats not judge him who does not eat, for God has taken him up," here said, "As Christ received you" — so as to show that to be received by God and by Christ is one and the same thing. And he adds this also, that it is the honor of God to be received by Christ. For those whom Christ receives, he teaches that they ought so to act that men, seeing their good works, may glorify their Father who is in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
