[[commentary]]
quote='''
Then, praising the Bride, He says: ‘AS THE LILY AMONG THORNS, SO IS MY NEIGHBOUR AMID THE DAUGHTERS.’ The lily cannot be compared with the thorns among which it often grows; and in like manner ‘my neighbour’ is before all the daughters a lily amid thorns.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
