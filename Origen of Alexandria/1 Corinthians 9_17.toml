[[commentary]]
quote='''
What then shall I do, to whom the dispensation of the word has been entrusted? Though I am an "unprofitable servant," I have nevertheless received from the Lord "the measure of wheat to be distributed to the Lord's household."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily10.html'
source_title="HOMILIES ON GENESIS 10.1"
