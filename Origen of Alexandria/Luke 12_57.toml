[[commentary]]
quote='''
But had it not been implanted in our nature to judge what is right, our Lord would never have said this.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Unless the power of judging what is just were implanted in us by nature, the Savior would never say: "But why do you not also judge of yourselves what is just?" But lest we wander too far afield in proving this statement — especially since much more difficult matters are appended to this chapter — let it suffice to have merely touched upon this.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily35.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 35"
