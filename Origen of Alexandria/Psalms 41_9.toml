[[commentary]]
quote='''
Seeing them fearful about themselves, He pointed out the betrayer by the evidence of the prophetic voice that says: "he that eateth my bread with me hath magnified his supplanting against me"; for that saying does not differ from this which He says: he that dippeth his hand with me in the dish, the same shall betray me. But I suppose that He said this because He wished to make manifest the greatness of his malice, since the one whom He had received at the common table and who had eaten together with Him (perhaps because in the beginning he was acting well), this very man betrayed Jesus, who was embracing him with such great honors, and became mindful neither of the same salt nor of the table nor of the bread shared in common, but transgressing all those things for the promise of thirty coins he betrayed the bestower of such great goods. And this is truly the peculiar habit of exceedingly evil men, that after salt and bread they lie in wait for people — most of all when they have been harmed in nothing by those with whom they shared bread and salt.

But if you can understand the spiritual table and the spiritual food and the Lord's supper, with all of which he had been made worthy by Christ, you will see more abundantly the multitude of his malice, in that he betrayed the Savior, his master and fellow-partaker of the divine table and cup (and this on the day of the Passover), remembering neither in bodily goods his master's love, nor in spiritual goods his teaching always shared without grudging. Such are all those in the Church who lie in wait for their brethren, with whom they have frequently been together at the same table of the body of Christ and at the same cup of His blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252026.html'
source_title="COMMENTARY ON MATTHEW 82"
