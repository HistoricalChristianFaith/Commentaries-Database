[[commentary]]
quote='''
"But we know that the judgment of God is according to truth against those who do such things." That the judgment of God is according to truth, not only against those who do the things enumerated above, but also against all who in any manner whatever have done anything good or evil, is to be expected and believed. But this is what seems to be shown in this passage: that judgment according to truth belongs to God alone. For there are certain things that are committed with an evil deed, but not with an evil intention: as if someone, for example, should commit a homicide unwillingly. And other things are done with a good deed, but not with a good intention: as if someone should perform an act of mercy, not on account of God's commandment, but that he may be praised by men. But there are other things in which, whether in good or in evil, the intention agrees with the deed. And because to know the hearts of men belongs to God alone, and to discern the secrets of the mind, therefore he alone is the one who can hold judgment according to truth. But it is asked whether, toward those whose iniquities have been forgiven through the grace of baptism, or whose sins have been covered through repentance, or to whom sin is not to be imputed through the glory of martyrdom, God may be seen to preserve judgment according to truth. For the truth of judgment demands this, that the evil man receive evil things, and the good man good things: and although the gifts and bounty of God by no means admit the curiosity of one who scrutinizes them, nevertheless let us show even in this how great is the truth of his judgment. It is a common profession that the good ought not to be punished, nor the evil to obtain good things. If therefore there be someone, for example, who has at some time done evil things, it is certain that he was evil then, when he was doing evil things. But if he, repenting of things past, should correct his mind toward good things, and act well, speak well, think well, will well — he who does these things, does he not seem to you good, and deservedly to receive good things? Likewise also if someone should be turned from good to evil, he will no longer be judged good, which he was and is not, but evil, which he is. For acts, whether good or evil, pass away, but according to their own quality they stamp and shape the mind of the one acting, and leave it either good or evil, to be destined either for punishment or for rewards. It will therefore be unjust either that a good mind be punished for evil deeds, or that an evil one be rewarded for good acts. But that what we are saying may become still plainer, we shall add these things also: let us suppose there is a soul in which impiety, injustice, folly, and wantonness dwell, and the whole multitude of evils, to which, that is, it has subjected itself as their servant and handmaid. But if, returning into itself, this soul should open the door of its mind again to piety and to the virtues, will not piety, having entered, immediately drive out impiety? Likewise also justice will thrust out injustice, and wisdom folly, and sobriety will put wantonness to flight; and thus, the barbarian inhabitants having been driven out from itself, it will offer to the virtues a civil and lawful lodging. How then will it be just to accuse a soul now full of virtues concerning those things which it did when it was not yet a friend of the virtues, and to condemn one that is pious for impiety, one that is just for injustice, one that is sober for wantonness? In this manner, therefore, even in those whose iniquities have been forgiven, and whose sins have been covered, God is to be believed to preserve judgment according to truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook02.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
