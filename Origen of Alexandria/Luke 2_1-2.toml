[[commentary]]
quote='''
After which the Scripture adds: "It came to pass in those days, there went out an edict from Caesar Augustus, that all the world should be enrolled. This was the first census, under Quirinius, governor of Syria". Someone may say: evangelist, how does this narrative help me — that the "first census" of the whole world took place under Caesar Augustus, and that among all the rest "Joseph too, with Mary who was betrothed to him and with child", entered his name in the register, and that, before the census was completed, Jesus was born? To one who looks more carefully a certain mystery seems to be signified: that in the enrollment of the whole world Christ too had to be registered, so that, written down with all, he might sanctify all, and, entered in the census with the world, he might offer the world communion with himself, so that after this census he might also enroll from the world, together with himself, "in the book of the living", so that whoever had believed in him might afterward be "written in heaven" with his saints: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily11.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 11"
