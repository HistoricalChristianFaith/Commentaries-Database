[[commentary]]
quote='''
Therefore, let us acquire eternal life. Let us acquire what is available to us. God does not give it to us; He offers it to us: "Behold, I have offered you life." It is available to us to stretch out our hands to good deeds, to take possession of life and to keep it in our soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
