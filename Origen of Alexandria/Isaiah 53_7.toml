[[commentary]]
quote='''
Now those who are saved are called sheep because of their meekness, which they learned from him who says: "learn from me, for I am gentle and humble of heart," and because "even unto slaughter" they were ready to come, imitating Christ, who "was led as a sheep to the slaughter, and as a lamb before the one shearing it, without voice" — and not simply "without voice," but "before the one shearing it, without voice," that is, before the one taking away what is his own and plundering it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252025.html'
source_title="COMMENTARY ON MATTHEW 70"
