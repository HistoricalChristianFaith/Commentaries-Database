[[commentary]]
quote='''
And Moses said to Aaron: "Take the censer, and put fire upon it from the altar, and cast incense upon it, and carry it swiftly into the camp, and make entreaty for them; for wrath has gone forth from the presence of the Lord, and it has already begun to lay waste the people." But since we have come to these passages, I wish to admonish the disciples of Christ concerning the goodness of God, lest perhaps any of you be troubled by the heretics, if ever a controversy should arise, when they say that the God of the law is not good, but just, and that the law of Moses does not contain goodness, but justice. Let those, therefore, who alike accuse both God and the law, see how Moses himself and Aaron did earlier that which the gospel afterward taught. Behold, Moses loves his enemies and prays for his persecutors, which indeed Christ teaches to be done in the gospels. For hear how, falling on their faces upon the ground, they pray for those who had risen up to slay them. So, then, the power of the gospel is found also in the law, and the gospels are understood to rest upon the foundation of the law; nor do I call the old testament the law, if I understand it spiritually. Only to those does the law become an old testament who wish to understand it carnally; and of necessity it has become old for them and has grown aged, because it cannot retain its own strength. But for us, who understand and expound it spiritually and in the gospel sense, it is always new; and both are for us a new testament, not by the age of time, but by the newness of understanding. Or does not the Apostle John also feel the same in his epistle, when he says: "Little children, a new commandment I give to you, that you love one another," though he surely knew that the commandment of love had been given long ago in the law? But since charity never falls, nor does the commandment of charity ever grow old, that which never grows old he declares to be always new; for it always renders those who observe and keep the commandment of charity new in the spirit; but for the sinner, and for him who does not keep the covenants of charity, even the gospels grow old. Nor can the testament be new for him who does not put off the old man and put on the new, who is created according to God. Moses therefore exhorts the great high priest to offer incense in the camp and to make entreaty for the people; for the people, he says, have already begun to be laid waste. In the spirit Moses saw the things that were being done. He saw the power go forth to the camp and lay waste and destroy the sinners; and because of this he exhorts the high priest to take the censer, to put fire from the altar upon it, and, with the incense cast on top, to go out and to stand between the midst of the dead and the living, that the devastation may not proceed further — or rather, as the word of Scripture more truly has it, the breaking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily09.html'
source_title="HOMILIES ON NUMBERS 9.4"
