[[commentary]]
quote='''
Greet Asyncritus, Phlegon, Hermes, Patrobas, Hermas, and if there are any brethren with them. Concerning these the greeting is simple, nor is anything distinctive of praise added to them. I think, however, that this Hermas is the writer of that little book which is called The Shepherd, which writing seems to me very useful, and, as I think, divinely inspired. But that he ascribed no praise to him, this, I suppose, is the reason: because he seems, as that writing declares, to have been converted to repentance after many sins; and therefore he wrote no reproach against him either — for he had learned from Scripture not to upbraid a man converting himself from sin — nor did he bestow anything of praise, because he was still placed under the angel of repentance, by whom at the opportune time he ought again to be offered to Christ. Moreover it is understood that those whose greeting is joined together dwelt together.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
