[[commentary]]
quote='''
Look also in another Scripture, and you will find that it was Christ's will that the devil should not know the coming of the Son of God. For the Apostle, affirming that the opposing powers did not know his passion, says: "we speak wisdom among the perfect, yet a wisdom not of this world, nor of the princes of this world, who are brought to nothing; but we speak the wisdom of God hidden in a mystery, which none of the princes of this world knew. For if they had known it, they would never have crucified the Lord of glory". The mystery of the Savior, therefore, was hidden from the princes of this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily06.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 6"
