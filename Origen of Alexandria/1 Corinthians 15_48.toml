[[commentary]]
quote='''
You see what he shows, that, if you remain in that which is first, which is of the earth, you will be reprobated, unless you change yourself, unless you are converted, unless, having been made "heavenly," you receive "the image of the heavenly."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily09.html'
source_title="HOMILIES ON GENESIS 9.2"
