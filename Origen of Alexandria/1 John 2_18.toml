[[commentary]]
quote='''
John in his epistle says: "and as you have heard that Antichrist is coming, now many Antichrists have arisen; whence we know that it is the last hour". By these words he teaches that every word which is foreign to the truth and asserts itself to be the word of God is Antichrist; for it is thus possible to understand what he says: "and now many Antichrists have arisen", since there is one thing that is true. But as the record of the readings makes plain, there were not many men in the time of the apostles who said that they were Christs, unless perhaps Dositheus the Samaritan — whence they are also called Dositheans — and Simon, of whom the Acts report, who proclaimed himself to be the great power of God. Besides these, there were none either before or afterward, so far as my knowledge goes.

But every discourse which professes an exposition of the Scriptures and faith in them, yet does not have the truth, is rightly to be understood to be Antichrist, coming in the name of Christ and saying that I am the Christ, lying and by no means able to display in itself the form of truth. And since to those who examine the words of Scripture, in order to find its meaning, there frequently occur certain interpretations as if true when they are not true, and sometimes they are drawn also by other plausible, specious discourses, so that it is not easy to find which is the true meaning before against the lying estimations the truer and firmer meaning has been found — for this reason I think that Christ, to the question of his disciples, answered thus: See that no one seduces you. For many will come in my name saying: I am the Christ, and they will seduce many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252024.html'
source_title="COMMENTARY ON MATTHEW 33"
