[[commentary]]
quote='''
First of all we ought to learn that it is an apostolic work to long for the brethren, yet for no other cause than either that we may confer upon them something of a spiritual gift if we are able, or, if we are not able, that we ourselves may receive from them. For without this, the desire of going about among the brethren is not commendable. But in that he says, "that I may impart to you some spiritual gift", he seems to indicate that there is something which is indeed a gift, yet not spiritual. For the gift of faith is without doubt spiritual, and the gift of wisdom, and of knowledge, and of virginity likewise. But where he says, speaking of marriage and virginity: "But each one has his own gift from God, one after this manner, another after that"; he calls marriage indeed a gift, since, as it is written, "a wife is fitted to her husband by God"; yet this gift is not spiritual. Many other things too may be called gifts of God, such as riches and bodily strength, such as comeliness of form, such as an earthly kingdom. For these also are given by God, as Daniel too says: "For it is he who makes kings and changes them"; but these are not spiritual gifts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook01.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
