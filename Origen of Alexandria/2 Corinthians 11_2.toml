[[commentary]]
quote='''
Paul the Apostle says: "but I wish to present you all as a chaste virgin to one husband, to Christ. But I fear lest, as the serpent seduced Eve by his craftiness, your senses be corrupted from the simplicity which is in Christ". Paul therefore wishes to "present all the Corinthians as a chaste virgin to Christ"; which assuredly he would never wish, unless he saw it to be possible. Whence perhaps it may seem wonderful how these, who came to the faith of Christ corrupted by diverse sins, are all together called a "chaste virgin"; a virgin so holy, so chaste, that she deserves even to be joined to the nuptials of Christ. But since we cannot refer these things to the integrity of the flesh, it is certain that they pertain to the integrity of the soul, whose — according to the very judgment of Paul — "the simplicity of the faith which is in Christ" has been called her virginity; and through this, because, when the sophistries of the philosophers or the Jewish superstitions ceased, Christ took the church to himself in simple faith, "he took to wife a virgin of his own kindred". For her faith is not corrupted by the philosophic sense nor by the ambition of circumcision, but she remained in the simplicity of confession as in virginal integrity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily12.html'
source_title="HOMILIES ON LEVITICUS 12"
