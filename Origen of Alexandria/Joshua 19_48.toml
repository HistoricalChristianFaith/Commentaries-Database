[[commentary]]
quote='''
Concerning the "Jebusites," who "dwelt in Jerusalem," it was said some time ago how "the sons of Judah could not exterminate them," and likewise concerning the "Canaanites," whom "the sons of Ephraim could not exterminate" as they dwelt in their midst. The present reading reports things similar to these concerning the "Amorites," saying that: "the Amorite continued to dwell in Elom and in Salamin; and the hand of Ephraim was made heavy upon them." "Amorite" is interpreted as "bitter" or "bitterness." Those therefore who "dwell in Elom," which is interpreted as "those butting like rams," or "in Salamin," which is interpreted as "peaceable," continue and dwell as bitternesses among those who butt like rams and among the peaceable. Those who butt like rams are those who, being set in contests, strive to storm the diabolical houses and structures; but the peaceable are those who, having overcome the desires of the flesh, bear peace of soul. Yet in both the contrary power, bitterness, perseveres and struggles to persist. In this we can understand something of this sort, since it says: "the Amorite continued to dwell among them": for example, if a hostile power of a demon, coming from the troop of bitterness, besieges someone's body, throws the mind into confusion and lulls it to sleep, while many prayers, many fastings, many invocations of exorcists are applied, and deaf to all these the demon remains and persists in the besieged body, more tolerably enduring the punishments of the exorcists and the torments brought upon it by the invocation of God's name than to depart from the person whom it shamelessly and wickedly besieges: so also here it must be understood in the case of those who are called "Amorites," who "continue and persist in dwelling in Elom and in Salamin." And that Scripture might truly show that they persist while enduring punishments and scourges, it says: "and the hand of Ephraim was made heavy upon them." But how is "the hand of Ephraim made heavy upon the Amorites"? Either, as we said, "the hand of Ephraim" is said to be "made heavy" upon the unclean spirits by the more forcefully applied laying-on of the exorcists' hand, or because good acts and good works weigh down and afflict the race of demons and the contrary powers. For the better the things we do and the more we conduct ourselves in the best pursuits, the more these things become troublesome and heavy to them. But it is pleasing and acceptable to them, and in a way affords them delights, when a person lives in baseness and disgraceful deeds. But whoever "makes his hand heavy upon them" by good acts, even if he cannot utterly drive them out, will at least make them tributaries and subject to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily24.html'
source_title="HOMILIES ON JOSHUA 24.1"
