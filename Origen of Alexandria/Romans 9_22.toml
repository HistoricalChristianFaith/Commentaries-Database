[[commentary]]
quote='''
We have often given warning about the Apostle's unpolished modes of expression and their deficiencies, and this is found no less in the present passage. For what he says at the beginning of the chapter, "But if God, willing," is not brought round to any conclusion. For instance, as he himself said elsewhere: "But if the first-fruits are holy, so also is the lump": here he renders no such thing, but has left that conjunction hanging as it were; and even if it is not taken up, a clearer sense will be given without it — for instance, if we read it thus: "God, willing to show his wrath and to make his power known, endured with much patience vessels of wrath fitted for destruction, that he might make known the riches of his glory upon vessels of mercy." In this the following seems to be understood: that while God bears with and patiently endures the unbelieving and the faithless, he makes known to men both his patience and his power — his patience, while he endures them long, in case they should perhaps come to their senses and be converted; his power, while at some point he punishes, and does not leave outrages altogether unavenged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"


[[commentary]]
quote='''
Now, going back over it briefly, let us also seek out something concerning the inner meaning. How, then, does God make his wrath known? Through vessels, he says, of wrath fitted for destruction. I am myself astonished within myself when I contemplate the design of the Holy Spirit in the divine volumes. For he says that the wrath of God, which is foreign to his nature, is made known to men, as the present passage of the Apostle indicates; but his goodness and sweetness, which is proper to his nature, he records as being hidden and concealed, as David says: "How great is the abundance of your sweetness, O Lord, which you have hidden for those who fear you." What cause, then, shall we assign for God's making his wrath manifest to men, and concealing his sweetness? Doubtless he knows that the race of men is frail and prone to falling through negligence, and that it is more expedient for them to be under the fear of wrath than to be let loose by the hope of God's kindness and sweetness — as the Wisdom of God also says: "He who spares the rod hates his son. For if you strike him with the rod, he will not die: but you will save his soul from death." God therefore makes his power known while he chastises and rebukes the impious, so that, according to the saying of Scripture, "when the pestilent man is scourged, the innocent becomes more shrewd."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
