[[commentary]]
quote='''
And because the evangelist Matthew seems to have said something similar in that he says: "Be well-disposed toward your adversary while you are on the way with him", I ask whether the meaning is the same or whether there is some kinship, since with Matthew one person is omitted and another is changed. Omitted is the "ruler", and in place of "officer" a "servant" is inserted, while "adversary" and "judge" are alike set down by both. So then we go "with our adversary to the ruler", and it is necessary for us, while we are still "on the way", to labor mightily so that we may be freed from him. From whom? For the word is ambiguous and can be referred both to the ruler and to the adversary: "lest perhaps he hand you over" — whether the adversary or the ruler — "to the judge, and the judge hand you over to the officer"; and: "you will not come out from there until you pay back the very last mite", for which Matthew says: "until you pay back the last farthing". The word "last" both retained, but they seemed to differ in that the one set down "farthing", the other "mite".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily35.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 35"
