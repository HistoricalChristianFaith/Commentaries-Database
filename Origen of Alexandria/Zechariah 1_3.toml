[[commentary]]
quote='''
But not all who see are equally enlightened by Christ, but each is enlightened according to that measure by which he is able to receive the force of the light. And just as the eyes of our body are not equally enlightened by the sun, but the higher one ascends into lofty places and beholds its rising by the gazing of a more elevated watchtower, so much the more will he receive both of its splendor and its heat; so also our mind, the more loftily and highly it approaches Christ and presents itself nearer to the splendor of his light, so much the more magnificently and clearly will it be irradiated by his light, as he himself also says through the prophet: "Draw near to me, and I will draw near to you, says the Lord." And again he says: "I am a God drawing near, and not a God from afar."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.7"
