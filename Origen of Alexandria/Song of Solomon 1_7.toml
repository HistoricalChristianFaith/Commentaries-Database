source_title="COMMENTARY ON THE SONG OF SONGS, BOOK 2"

[[commentary]]
quote='''
Tell me, you whom my soul has loved, where you feed, where you lie down at noon. I do not ask for other times — when you feed in the evening, when at dawn, when at the sun's setting: I seek that time when, in the full-flowering day, in full light, you dwell in the splendor of your majesty. Tell me, you whom my soul has loved, where you feed, where you lie down at noon. Observe diligently wherever you read of "noon." At Joseph's, his brothers hold their meal at noon. At noon the angels are received into Abraham's hospitality, and other things of this kind. Seek, and you will find that the divine Scripture takes up no word in vain or by chance. Who, do you think, is worthy among us to reach even to noon, and to see where the bridegroom feeds, where he lies down? Tell me, you whom my soul has loved, where you feed, where you lie down at noon. For unless you tell me, I begin to be tossed about in wandering; and while I seek you, I run into the flocks of others; and because I am ashamed before others, I begin to cover my face and my mouth. For I am a beautiful bride, and I do not show my bare face to others, but to you alone, whom I have long since kissed. Tell me, you whom my soul has loved, where you feed, where you lie down at noon; lest I become as one veiled over the flocks of your companions. That I may not suffer this, that I may not become veiled, that I may not cover my mouth, and, coming at last to others, begin perhaps to love even those whom I do not know: therefore tell me where I may seek you, and find you at noon, lest perchance I become as one veiled over the flocks of your companions. After these words the bridegroom warns her, and says: Either you know yourself, that you are the bride of the king, and beautiful, and made beautiful by me — since I presented to myself a glorious Church, having neither spot nor wrinkle — or know that, if you do not know yourself and are not aware of your dignity, you will suffer the things that follow. And what are these? If you do not know yourself, O beautiful among women, go forth in the tracks of the flocks, and feed — not flocks of sheep, not of lambs, but your goats. For he will set the sheep on the right hand, and the goats on the left.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25201.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 1"
