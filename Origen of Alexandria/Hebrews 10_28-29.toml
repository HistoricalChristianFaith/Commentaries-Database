[[commentary]]
quote='''
In which place I recall that word which the blessed Apostle Paul, writing to the Hebrews, says: "anyone making void the law of Moses dies without any mercy under two or three witnesses; of how much greater punishments will he be thought worthy, who shall have trodden underfoot the Son of God and reckoned the blood of the testament polluted, in which he was sanctified, and done contumely to the Spirit of grace?". But for what cause I have made mention of this scripture, listen. According to the law the adulterer or "adulteress by death used to die", nor could they say: we seek repentance and we implore pardon. There was no place for tears, nor was any faculty of amendment conceded, but it was necessary in every way that he be punished who had incurred the law. And this was observed also in each and every crime to which the penalty of death was appended. Among Christians, however, if adultery has been committed, it is not commanded that the "adulterer or adulteress" be punished with bodily destruction, nor is power given to the bishop of the Church to condemn the adulterer to present death, as then according to the law was done by the elders of the people. What then? Shall we say that the law of Moses is cruel which commands the "adulterer or adulteress" to be punished, and that the gospel of Christ, through indulgence, dissolves its hearers into what is worse? It is not so. For this reason we set forth above the word of Paul saying: "by how much more is he worthy of worse punishments who shall have trodden underfoot the Son of God" and so forth. Hear therefore how neither then was the law cruel, nor now does the gospel seem dissolute on account of the largess of pardon, but in both the kindness of God is maintained by a different dispensation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily11.html'
source_title="HOMILIES ON LEVITICUS 11"
