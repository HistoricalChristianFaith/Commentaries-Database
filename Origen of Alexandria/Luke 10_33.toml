[[commentary]]
quote='''
For providence was keeping the half-dead man for him who was stronger than the law and the prophets, namely the Samaritan, which is interpreted "guardian". This is he who "neither slumbers nor sleeps, keeping Israel". On behalf of the half-dead man this Samaritan set out, not going down "from Jerusalem to Jericho" as the priest and the Levite went down; or if he did go down, he went down for this reason, that he might save and guard the one about to die — the Samaritan to whom the Jews said: "You are a Samaritan and have a demon", and who, when he had denied that he had a demon, would not deny that he was a "Samaritan"; for he knew that he was a "guardian". And so when he had come to the half-dead man and had seen him wallowing in his own blood, he took pity and approached him, that he might become his neighbor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily34.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 34"
