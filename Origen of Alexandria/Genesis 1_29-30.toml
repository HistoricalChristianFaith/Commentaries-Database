[[commentary]]
quote='''
"And God said: Behold, I have given you all the seed-bearing hay which sows seed, which is over all the earth, and every tree which has in itself the fruit of seed-bearing seed, it shall be to you for food, and to all the beasts of the earth and to all the birds of heaven, and to all the creeping things which creep upon the earth, which have in themselves the soul of life." The history of this passage plainly indicates that the use of foods was first permitted by God from herbs, that is, vegetables and the fruits of trees. But afterward, when the testament was made to Noah after the flood, the faculty of eating flesh is given to men. For which reasons indeed it will be more rightly explained in their proper places. Yet according to allegory the herb of the earth and its fruit, which is granted to men for food, can be understood of the bodily affections; for example, anger and concupiscence are a shoot of the body. The fruit of this shoot, that is, the work, is common to us rational beings and to the beasts of the earth. For when we are angry toward justice, that is, toward the correction of the offender and the amendment of his salvation, we feed on this fruit of the earth, and our food becomes bodily anger, through which we repress sin, we restore justice. And lest we seem to you to bring these things forth rather from our own understanding than from the authority of divine Scripture, return to the book of Numbers and recall what Phinehas the priest did, who, when he had seen a harlot of the Midianite nation clinging in impure embraces with an Israelite man before the eyes of all, filled with the anger of divine zeal, seized a sword and drove it through the breast of both. Which work was reckoned to him by God unto justice, the Lord saying: "Phinehas has assuaged my fury, and it shall be reckoned to him unto justice." This earthly food of anger, then, becomes our food, when we use it rationally unto justice. But if anger is exercised irrationally, so as to punish the innocent, so as to boil over against those who commit no offense, this will be the food of the beasts of the field and of the serpents of the earth and of the birds of heaven. For with these foods the demons too are nourished, who are both fed by our evil acts and favor them. For the token of this work is Cain, who deceived his innocent brother through the anger of envy. Similarly also concerning concupiscence and concerning each of the affections of this kind one must judge. For when "our soul concupisces and faints for the living God," concupiscence is our food. But when we either look upon another's wife to lust after her or covet some of the things of our "neighbor," concupiscence is made a bestial food; as concupiscence can be exemplified by Ahab and the deed of Jezebel concerning the vineyard of Naboth the Jezreelite. Surely the caution of Holy Scripture must be observed also in the reasoning of its words, which, when it had said concerning men that God said: "Behold, I have given you all the seed-bearing seed which is upon the earth, and every tree which is upon the earth, it shall be to you for food," concerning the beasts did not say: that I have given them all these things for food, but: "it shall be to them for food," so that, according to the spiritual reasoning which we have explained, these affections may be understood to have been given by God to man indeed, yet foretold by God that they will also be for food to the beasts of the earth. Therefore, then, divine Scripture used most cautious language, which to men indeed says that God says: "I have given you these things for food," but where it comes to the beasts, it speaks not with the signification of one commanding, but as of one foretelling, that these things will also be for food to the beasts and the birds and the serpents. But let us, according to the sentence of the Apostle Paul, attend to the reading, so that we may be able, as he himself says, to receive "the mind of Christ" and to know "the things that have been given us by God," and that the things which have been given us for food we may not make the foods of swine or dogs, but may prepare them in ourselves as such things by which it may be worthy for the Word and Son of God to be received in the lodging of our heart, coming with his Father and willing to make a dwelling with us in the Holy Spirit, whose temple through holiness we ought first to be. To him be glory unto the eternal ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.17"
