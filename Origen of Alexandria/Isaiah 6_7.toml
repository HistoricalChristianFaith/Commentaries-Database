[[commentary]]
quote='''
We read also in Isaiah that the prophet is purified with fire by "one of the seraphim which was sent to him, when he took with a pair of tongs one coal from those which were upon the altar; and he touched the lips of the prophet and said, Behold, I have taken away your iniquities." These appear to me to be mystical and to indicate that the coals are put on the members of each in proportion to his sins, if he is worthy to be purified. For since the prophet says here, "I have unclean lips; also I dwell in the midst of a people who have unclean lips." For this reason, "a coal taken up with a pair of tongs" by the seraphim cleanses his lips.… The cleansing of his lips indicates that Isaiah's sin continually would be found only in words, but he would not have sinned in any act or deed. Otherwise, he would have said since I have an unclean body or I have unclean eyes, if he had sinned in desiring what belongs to something other than his lips. He would have said I have unclean hands, if he had polluted these with unjust deeds. But now since possibly he was aware of his transgression in word alone, about which the Lord says, "Likewise, you will give an account for every useless word on the day of judgment"; because it is difficult even for the perfect to escape the fault of the word, the prophet was likewise in need only of a purification of his lips.
'''
source_url='https://www.google.com/books/edition/Homilies_on_Leviticus_1_16/Eo9Da7xaBuUC?hl=en&gbpv=1&dq=homilies+on+leviticus+origen&printsec=frontcover'
source_title="HOMILIES ON LEVITICUS 9:7.2"


[[commentary]]
quote='''
Let the reproving word, therefore, touch the "lips" of our mind and soul, that we too may say: "and it touched my mouth". If I shall have cleansed "my mouth", so that I speak nothing idle, nothing foolish, nothing base, nothing scurrilous—to name them all at once—nothing of those things that are forbidden, then I can say: "it touched my mouth". But so long as I "have unclean lips" and carry on unclean affairs, because of the words of sin "the fire from the altar does not touch me", nor "is one of the Seraphim sent to me".

"And He said: behold, this has touched your lips, and it has taken away your iniquities, and has purged your sins round about". Let the divine word bite us, let it burn up our souls, and let us say as we hear: "was not our heart burning within us?", that "our iniquities and sins may be taken away", and that, made clean, with clean mouth and clean heart and a whole clean conscience, we may give thanks to almighty God in Christ Jesus, "to whom is glory and dominion for ages of ages. Amen!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily04.html'
source_title="HOMILIES ON ISAIAH 4"
