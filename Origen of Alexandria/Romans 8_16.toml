[[commentary]]
quote='''
"For the Spirit himself renders testimony to our spirit, that we are sons of God. But if sons, heirs also; heirs indeed of God, but coheirs of Christ: if however we suffer together with him, that we may also be glorified together with him." Therefore the spirit of adoption itself, through which a person is adopted into sonship, renders testimony and confirms to our spirit that we are sons of God, after we have passed from the spirit of servitude into the spirit of adoption, when now there is nothing of fear within, that is, when we do nothing on account of dread of punishment, but accomplish all things on account of love of the Father. And it is well said that the Spirit of God renders testimony not to the soul, but to the spirit, which is the better part in man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
