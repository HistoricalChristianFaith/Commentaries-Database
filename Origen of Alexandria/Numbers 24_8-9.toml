[[commentary]]
quote='''
After these things it is further written concerning Christ that: "God led him out of Egypt," which seems to be fulfilled in that place where, after the death of Herod, he is called back from Egypt, and the Gospel indicates it, saying: "Out of Egypt I called my son." This saying seems to some to have been taken from this passage and inserted into the Gospels, but to others to be from the prophet Hosea. Yet it can also be understood according to allegory, that, after he came to the Egypt of this world, the Father led him out and took him up to himself, so that he might make a way for those who were to ascend out of the Egypt of this world to God. "And the glory of a unicorn is his." For Christ, casting down all the kingdoms of the demons, founded his one kingdom in glory, as of a true unicorn. For that horn is often named for a kingdom we have taught. "He shall eat," he says, speaking still of the same one, "the nations of his enemies, and shall gnaw out their marrow." The nations, he says, which his enemies possessed, he himself shall eat, the power of the enemy having been destroyed, and shall gnaw out their marrow, when he thins out from them all gross and carnal understanding and converts it to spiritual intelligence. And that grossness is held blameworthy in the Scriptures, that which is written will be the sign: "The heart of this people has been made gross," and elsewhere: "He was filled, and grew gross, and the beloved kicked back." He shall eat the nations, therefore, and he has for food those who believe in him, just as he himself also says in the Gospel: "My food is to do the will of him who sent me." Whose will indeed was this, that the nations should be converted to the faith. But if, as we taught above, grossness is held blameworthy, on the contrary fineness is to be held praiseworthy, since the "spirit of wisdom" too, which is called intelligible and holy and only-begotten and manifold, is likewise reported to be subtle. "And with his darts he shall shoot the enemy." His darts are his words, by which he either conquered the devil or overcomes and transfixes even now all his enemies and those who contradict him; for everyone who sins is his enemy, while he sins. But if he hears the words of God and, recognizing his sins, is transfixed by them and pierced with compunction and turns to repentance, having been bored through by the word of truth, he too will be said to have been transfixed by his darts. But after these things he also mentions the very dispensation of the passion and says: "Lying down he rested like a lion and like the whelp of a lion; who shall rouse him up?" He rested like a lion when, placed upon the cross, he stripped off the principalities and powers and triumphed over them on the wood of the cross; but like the whelp of a lion, when he rises from the sleep of death. And that he is compared at once to a lion and to the whelp of a lion can still be understood also on this account, that in those who are perfect he is named a lion, but in those who are beginners and untrained, the whelp of a lion. But as to his saying: "Who shall raise him up?"—this is because at one time he is said to be raised up by the Father, and at another he himself says that he will raise up the temple of his body after three days; and rightly in this the disposition, as it were, of one asking is indicated. "Those who bless you are blessed, and those who curse you are cursed." It is certain that those who bless Christ are blessed and taken up into the communion of the Father's blessing; but those who curse him are cursed. For if you look to that people which curses Christ, it is found, even lamentably, to be cursed. For what else could befall those who curse wisdom, who curse truth, who curse life, except that they should lie banished and exiled from all these good things? For all these things are Christ; and he who curses Christ, as one cursing all these, is condemned to perpetual malediction. Yet I think that not only he curses Christ who utters against him a cursing word, but also he who under the name of Christian acts wickedly and lives basely and, by his dishonest words or deeds, makes his name to be blasphemed among the nations; just as, on the contrary, not he who blesses the Lord with words alone is to be thought to bless, but he who by his deeds and life and manners makes the name of the Lord to be blessed by all. And in these it will be more fully accomplished, that which the third prophecy of Balaam designates, that those who bless Christ shall be blessed and those who curse him shall be cursed. Wherefore let us in every way take heed lest through our works and acts the name of Christ be blasphemed, but rather let us so act that we may deserve to be partakers of his blessings. To him be blessing and glory unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily17.html'
source_title="HOMILIES ON NUMBERS 17.6"
