[[commentary]]
quote='''
But who departs from this world in peace, but he who is persuaded that God was Christ reconciling the world to Himself, (2 Cor. 5.) who has nothing hostile to God, having derived to himself all peace by good works in himself?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
In my view, and according to the word of God, the soul, released from labors, released from sweats, has been deprived of the flesh and can say: "Now Thou lettest Thy servant depart, O Master, according to Thy word, in peace." It goes forth in peace and reposes with Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
