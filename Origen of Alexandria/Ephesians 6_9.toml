[[commentary]]
quote='''
What are the same things among the things said before? I think, then, that they are: in singleness of heart, and the doing the will of God, and that which is from the soul and with goodwill toward the household servants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Ephesians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON EPHESIANS FRAGMENT XXXII"
