[[commentary]]
quote='''
After these things another law is promulgated. "Whatever soul", it says, "touches any unclean thing, or the carcass of unclean beasts, and it is hidden from him, and he is defiled; or if he touches of the uncleanness of a man, of any uncleanness by which he may be defiled", and so forth. These things indeed are observed among the Jews quite unbecomingly and uselessly. For to what end is he held unclean who has touched, for example, a dead animal or the body of a deceased man? What if it be the body of a prophet? What if the body of a patriarch, or even of Abraham himself? What if he has touched even the bones, will he be unclean? What if he touches the bones of Elisha, which raise up the dead? Will he who touches be unclean, and do the bones of the prophet make unclean even that very one whom they raise from the dead? See how unfitting the Jewish understanding is. But let us first see what it is to touch, and what is the touch that makes unclean, and what indeed is the touch that makes clean. The Apostle says: "it is good for a man not to touch a woman". This touch is unclean; for this is that which the Lord said in the Gospel: "if anyone looks upon a woman to lust after her, he has already committed adultery with her in his heart". For the vice of concupiscence touched his heart, and his soul was made unclean. If, therefore, anyone touches something in this way, that is, either through lust for a woman, or through desire for money, or by any other craving of sin whatever, he has touched something unclean and is defiled. It behooves you, therefore, if you have touched anything of this kind, to know how you may offer a sacrifice, according to the things we recalled in what went before, so that you may be made clean. Do you wish me to show you "what" is "the soul which touched the unclean thing" and was made unclean, and again touched the clean thing and was made clean? She "who suffered an issue of blood and spent all her substance on physicians and could gain nothing" was brought down to this through the uncleanness of sin. For she had touched sin, and for that reason had received the "scourge" of the flesh. But after, full of faith, "she touched the fringe of Jesus, the flow of her blood stood still", and suddenly she was made clean who before had lived unclean for so long a time. And just as, when she had touched the Lord and Savior, he himself said: "who touched me? For I felt power go out from me" — that power, without doubt, which had healed the woman and made her clean — so it is to be understood that, if anyone touches sin, there goes out from that very sin a certain malignant power, which makes him who has touched it unclean; and this is truly to have touched the unclean thing. By a like reasoning it is to be said also concerning the "carcass" of a man, or the "carcass" of a clean or unclean beast. For he touches the "carcass" of a man who either follows or imitates someone dead in his sins. But if the differences of each are to be examined, let us review them one by one. The carcass of a man, as we said above, we can say to be that which the Apostle says to the Corinthians: "I wrote", he says, "to you in the epistle that you should not mingle with fornicators; not indeed with the fornicators of this world, or the covetous, or the rapacious, or those serving idols; otherwise you would have had to go out of this world. But now I have written to you that you should not mingle, if anyone named a brother is a fornicator, or covetous, or serving idols, or a reviler, or a drunkard, or rapacious — with such a one not even to take food". This, therefore, is to touch the "carcass" of a man: for one to offer himself as a companion, even in food, to one who, having been made a man in Christ, has again died in his sins. For that widow too, of whom the Apostle says, "who, living in delights, is dead while she lives", can be called the "carcass" of a man. But it must also be examined what the carcasses of animals are in the church. If any of the simpler sort, in that they have done nothing of prudence, also wallow in the filth of sins, if anyone follows or touches these with that touch which we expounded above, he has touched the "carcass" of animals. But that the church has animals also, hear how it says in the Psalms: "men and beasts you will save, O Lord". These, therefore, who bear zeal for the word of God and for a rational discipline, are called men; but those who live without such zeal and do not seek out the exercises of knowledge, yet are faithful, are called animals indeed, but clean. For just as there are certain men of God, so there are also certain sheep of God. For it is written that Moses was not a sheep of God, but "a man of God". And Elijah was not a sheep of God, but "a man of God"; for so he himself says: "if I am a man of God, let fire come down from heaven and consume you and your fifty". But do you wish to hear of the sheep of God? It is said through the prophet: "my sheep, my sheep are holy, says the Lord". And again the Savior says in the Gospel: "my sheep hear my voice". And I do not think he would have said of men that "men hear my voice". But let him who has "ears to hear" hear these things, how the sheep hear the voice, but the men hear his word. These, therefore, are animals clean indeed on account of Christ, but "carcasses" on account of sin. If anyone "touches" these, that is, if anyone follows another in sin, he will be unclean. And if anyone "touches the carcass" of a man of this kind, that is, of one who, living at first according to reason and exercising himself in the word of God, afterward fell into sin — if anyone follows or imitates him, he touches the "carcass" of a man and will be unclean. But if you touch also "what is caught by a wild beast", you will be unclean. What is the wild beast? Is it a lion or a wolf, which snatches away men or beasts? That, I believe, is the wild beast of which the Apostle Peter says: "your adversary the devil, like a roaring lion, goes about seeking whom he may devour. Resist him, strong in faith". And again, of whom does the Apostle Paul say: "for after my departure there will enter in ravening wolves, not sparing the flock". If, therefore, you see one "caught" by these "wild beasts", do not follow him, do not touch him, lest you too be made unclean. There are, besides, also other unclean animals, whose carcass it forbids to be touched. The unclean animals are men who are outside Christ, in whom there is neither reason nor any religion. If, therefore, you see the "carcasses" of all these, that is, their sins, the lawgiver tells you not to touch them, not to defile yourself with them, not to handle them. And these are the uncleannesses which are rightly to be fled. But to shun the touch of a man, or of a dead body, to which rather a religious burial is to be given, these are Jewish and useless fables, "having indeed a form of piety, but denying the power thereof". The first law, therefore, was given concerning uncleannesses, if anyone "was a witness" of some "oath" or fault "and did not disclose it", and through this was himself in a manner made unclean by the fellowship of sin. The second law is that by which it is forbidden to touch "anything unclean and a carcass".
'''
