[[commentary]]
quote='''
It is superfluous, then, what you say to the Apostle, O you who oppose: "Why then does he still find fault? For who resists his will?" It is certain indeed that no one withstands the will of God; but it is fitting that we know his will to be just and right. For that we should be good or evil is a matter of our own will; but to what sort of stripes the evil man is destined, and to what sort of glory the good man, is a matter of God's will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
