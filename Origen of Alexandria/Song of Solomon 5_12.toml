[[commentary]]
quote='''
"Your eyes", it says, "are like doves upon the fullness of the waters" (to the "fullness of the waters", therefore, we must hasten, for in these the beauty of the bride is described), "and your neck", it says, "like a turtledove's". In the doves the eyes are praised. For as to what it said: "doves upon the fullness of the waters" — they report that this kind of bird, when it comes to the waters, because there it is wont to suffer the ambushes of the hawk, catches sight of the enemy coming from above, the shadow of the flying one seen in the waters, and by the sharpness of its eyes evades the treachery of the imminent danger. If you too can thus foresee the ambushes of the devil and beware of them, you have offered "doves" as a sacrifice to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily03.html'
source_title="HOMILIES ON LEVITICUS 3"
