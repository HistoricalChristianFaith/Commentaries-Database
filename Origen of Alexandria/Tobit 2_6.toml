[[commentary]]
quote='''
The people once "was falling in the desert" and dying. Aaron the high priest came and "stood in the midst of those who were dying and those who were living," lest the devastation of death should advance further even upon the rest. Now too my true high priest, the Lord, has come and has interceded in the midst between the dying and the living — that is, between those who from among the Jews received his presence, and those who not only did not receive it, but slew themselves rather than him, saying: "his blood be upon us and upon our children!" Hence also "all the righteous blood which has been shed upon the earth, from the blood of righteous Abel to the blood of Zechariah whom they killed between the temple and the altar, shall be required of that generation" which said: "his blood be upon us and upon our children." These, then, are the portion of the people that is dead, because they keep neither the unleavened bread nor the feast days fittingly, but "their feast days are turned into mourning and their songs into lamentation"; who, even if they wished, could not celebrate the feast day in "that place which the Lord God has chosen." And we indeed did not say to them that "there shall be for you no portion" in this altar or in the inheritance of the Lord, but they of their own accord refused the true altar and the heavenly high priest, and were brought to such a pitch of unhappiness that they lost even the image and did not receive the truth, and therefore it is said to them: "behold, your house shall be left to you deserted." For the grace of the Holy Spirit has been transferred to the nations, the solemnities have been transferred to us, because there has passed over to us also a high priest not imaginary but true, "chosen according to the order of Melchizedek": and it is necessary that he offer true victims, that is, spiritual ones, among us, where the temple of God is built out of "living stones," "which is the church of the living God," and where the true Israel is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily26.html'
source_title="HOMILIES ON JOSHUA 26.3"
