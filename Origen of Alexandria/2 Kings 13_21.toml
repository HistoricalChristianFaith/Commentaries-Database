[[commentary]]
quote='''
After these things another law is promulgated. "Whatever soul", it says, "touches any unclean thing, or the carcass of unclean beasts, and it is hidden from him, and he is defiled; or if he touches of the uncleanness of a man, of any uncleanness by which he may be defiled", and so forth. These things indeed are observed among the Jews quite unbecomingly and uselessly. For to what end is he held unclean who has touched, for example, a dead animal or the body of a deceased man? What if it be the body of a prophet? What if the body of a patriarch, or even of Abraham himself? What if he has touched even the bones, will he be unclean? What if he touches the bones of Elisha, which raise up the dead? Will he who touches be unclean, and do the bones of the prophet make unclean even that very one whom they raise from the dead? See how unfitting the Jewish understanding is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily03.html'
source_title="HOMILIES ON LEVITICUS 3"
