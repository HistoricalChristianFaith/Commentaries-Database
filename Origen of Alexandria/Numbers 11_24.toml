[[commentary]]
quote='''
"And Moses went out," it says, "to the people, and spoke the words of the Lord." So long as Moses hears the words of God and is taught by Him, he is within, and abides in the inner places, and is kept among secrets; but when he speaks to the crowds and ministers to the people, who cannot stand within, he is said to go out abroad. What then does a saying of such a form contain? That every teacher and master of the Church, if he stirs up something concerning the deeper mysteries, if he brings forth something hidden and secret concerning the wisdom of God among the perfect—so long as he is occupied in profound meanings, he is to be said to be within and to abide in the inner places; but when he speaks to the crowds and brings forth those things which suffice for those who are outside, and which the common people can hear, he is said to have gone out abroad and to speak to the people the words of the Lord. This I see that Paul also did, and that he was indeed within when he said: "But we speak wisdom among the perfect, yet a wisdom not of this world nor of the princes of this world, who are being brought to nothing. But we speak the wisdom of God hidden in a mystery, which none of the princes of this world knew." You see how Paul is within and penetrates the inner and secret things of divine wisdom, when he speaks these things. But when he proceeds to the people, hear what he says: "Let no evil speech proceed out of your mouth," and: "Let him who stole steal no more," and: "Let each man have his own wife," and: "Let each woman have her own husband." These things, and any of this kind, Paul, going out abroad to the people after the manner of Moses, speaks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily06.html'
source_title="HOMILIES ON NUMBERS 6.1"
