[[commentary]]
quote='''
First one may contemplate him existing in his primary form, that of God, before he emptied himself. One will then see the Son of God not yet having come forth from him, the [incarnate] Lord not yet having proceeded from his place. But then compare the preexistent state of the Son with that which resulted from his assuming "the form of a slave" when he "emptied himself." You will then understand how the Son of God came forth and came to us and as it were became distinguishable from the One who sent him. Yet in another way the Father did not simply let him go but is with him and is in the Son as the Son is in the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252010.html'
source_title="COMMENTARY ON JOHN 10.18"


[[commentary]]
quote='''
Christ Jesus, being "in the form of God," being distinct from the God in whose form He existed — was He God before He became incarnate, yes or no? … So then, He was God, the Son of God, the only-begotten, "the firstborn before all creation," and we ought not to fear the assertion that in one sense there are two Gods, while in another there is one God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
