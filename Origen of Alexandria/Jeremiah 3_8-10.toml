[[commentary]]
quote='''
"And the faithless Judah did not fear, and she went and played the harlot herself also." Israel having played the harlot first, Judah too played the harlot afterward. "And her fornication became as nothing, and she committed adultery with wood and stone." Whenever we sin, we do nothing else than, becoming stony-hearted, commit adultery with "the stone." Whenever we sin and play the harlot "beneath every leafy tree," we too commit adultery with "the wood." "And the faithless Judah did not turn to me with her whole heart, but in falsehood." If we turned to God, but deficiently, we are charged as not having turned "with the whole heart." Therefore "the faithless Judah did not turn to me with her whole heart." He did not say: and the faithless Judah turned, and stood firm, but: "and the faithless Judah did not turn to me with her whole heart, but in falsehood" she turned. The true conversion, then, is to read the things of old, to know those who were justified, to imitate them, to read those things, to see those who were blamed, to guard against falling into those blames, to read the books of the New Testament, the words of the apostles, and after reading to write all these things upon the heart, to live according to them, so that a bill of divorce may not be given to us also, but that we may be able to come to the holy inheritance, and, when the fullness of the Gentiles has been saved, then Israel may be able to enter in; for if the fullness of the Gentiles enters in, then all Israel shall be saved, "and they shall become one flock, one shepherd," teaching us to glorify God the Almighty in Christ Jesus himself, to whom be the glory and the might unto the ages of the ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily04.html'
source_title="HOMILIES ON JEREMIAH 4"
