[[commentary]]
quote='''
Each one of the blessed will first be obliged to travel the narrow and hard way in winter to show what knowledge he has acquired for guiding his life, so that afterwards there may take place what is said in the Song of Songs to the bride when she has safely passed through the winter. For she says, "My beloved answers and says to me, 'Arise and come away, my love, my fair one, my dove; for lo, the winter is past, the rain is over and gone.' " And you must keep in mind that you cannot hear "the winter is past" any other way than by entering the contest of this present winter with all your strength and might and main. And after the winter is past and the rain is over and gone, the flowers will appear that are planted in the house of the Lord and flourish in the courts of our God.
'''
source_url='https://books.google.com/books/about/Prayer.html?id=GEN3tk5GlfEC'
source_title="EXHORTATION TO MARTYRDOM 31"

[[commentary]]
quote='''
Rise up, come, my love, my beautiful one, my dove. Why does he say, "Rise up"? Why "make haste"? I for your sake bore the raging of the tempests; I received the billows which were owed to you. My soul was made sorrowful for you, even unto death. I rose from the dead, the stings of death being broken and the bonds of hell dissolved; therefore I say to you: Rise up, come, my love, my beautiful one, my dove: for behold, the winter is past, the rain is gone away, the flowers have appeared in the earth. I, rising from the dead, the tempest being stilled, have restored calm. And because, according to the dispensation of the flesh from the Virgin, and by the will of the Father, I grew, and advanced in wisdom and in age, the flowers have appeared in the earth; the time of pruning is at hand. The pruning is the remission of sins. For every branch, he says, abiding in me and bearing fruit, my Father cleanses, that it may bear greater fruit. Have fruits, and the former things which are unfruitful in you shall be taken away. For the time of pruning is at hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 2"
