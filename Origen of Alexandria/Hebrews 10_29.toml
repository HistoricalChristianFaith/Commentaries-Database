[[commentary]]
quote='''
But if you sin again, again the old reproaches are rolled back upon you, all the more so as it is a much greater crime "to trample the Son of God underfoot and to count the blood of the covenant a polluted thing" than to neglect the law of Moses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily05.html'
source_title="HOMILIES ON JOSHUA 5.6"
