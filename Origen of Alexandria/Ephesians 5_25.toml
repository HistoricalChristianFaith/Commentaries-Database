[[commentary]]
quote='''
Husbands, love your wives, says the Apostle. But he does not stop with saying, Husbands, love your wives. Rather, because he knew that even the love of husbands for their wives can be dishonourable, and yet was aware that their love is God’s good pleasure, he taught us in what manner husbands should love their wives by adding to Husbands, love your wives the further clause as Christ also loved the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
