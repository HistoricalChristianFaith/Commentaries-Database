[[commentary]]
quote='''
Is then the seed of man, alone of all those bodies, useless to the Creator — so that one may hope there is a resurrection of the dead, if one may so speak, in the manner of the olive and of the vine and of the wheat? And from the tiny seed-kernel of the fig there rises so great a fig tree, and you do not laugh at this which you behold in actual experience? And if someone tells you that from this little thing there rises up a fig tree bearing fruit, having learned it by experience you do not laugh it to scorn. But since the season has not yet come for that which is to rise from the human body — in the resurrection from the dead — to spring up, are you unwilling to wait, that you may see this too? Or do you not know that in the case of all the other seeds as well, not every season is suitable for the seeds to spring up? Rather, a grain of wheat rises up at this season of the year; the grape-stone rises up at this hour of the year; the stone of the olive in this month, not at every time. But do you wish, in the case of the body of man — so that you may believe — that the dead should rise year by year, like the grape-stone, like the olive, and will you not behold one extraordinary season, that you may know the resurrection of the dead? What is the one season? At the consummation of the age. So that after the resurrection from the dead you may no longer be in the present evil age. For Jesus Christ suffered "that he might deliver us out of the present evil age"; and "redeeming the time, because the days are evil". Well, then, did God dispense this too, together with the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LXXXVII"
