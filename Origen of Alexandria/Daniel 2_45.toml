[[commentary]]
quote='''
And just as the coming of Our Saviour in flesh is denoted under another figure by the stone that was cut out without hands from the mountain—for He who came down to earth was not the whole mountain, nor could human weakness be portrayed in terms of such; but He was a stone from the mountain, a stone of stumbling and a rock of offence that came down into the world—so, under another figure, He is here called a drop.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
