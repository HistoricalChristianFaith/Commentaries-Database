[[commentary]]
quote='''
Let us come, if you will, also to the circumcision of the lips. I think that he is "uncircumcised in lips" who has not yet ceased from foolish speech, from scurrility, who disparages good men, who accuses his neighbors, who instigates quarrels, who stirs up slanders, who sets brothers against one another by speaking falsehoods, who utters vain, foolish, worldly, unchaste, base, injurious, insolent, blasphemous things and the rest which are unworthy of a Christian. But if anyone restrains his mouth from all these, and "orders his words in judgment," represses verbosity, tempers his tongue, moderates his words, he is deservedly said to be circumcised in lips. But also "those who speak iniquity on high and stretch their tongue up to heaven," as the heretics do, are to be called uncircumcised and unclean in lips, whereas he is circumcised and clean who always speaks the word of God and sets forth sound doctrine fortified by the Evangelical and Apostolic rules. In this way, then, the circumcision of the lips too is given in the Church of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily03.html'
source_title="HOMILIES ON GENESIS 3.5"
