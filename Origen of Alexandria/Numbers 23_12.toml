[[commentary]]
quote='''
But what did he answer him — he in whose mouth God had placed the word? "Shall I not," he says, "take care to speak whatever God puts into my mouth?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily16.html'
source_title="HOMILIES ON NUMBERS 16.1"
