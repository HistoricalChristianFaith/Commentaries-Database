[[commentary]]
quote='''
You see the riches of the priests of Christ, you see, having nothing, how great and what kind of things they bestow. Such wealth an earthly possession cannot bestow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily16.html'
source_title="HOMILIES ON GENESIS 16.5"
