[[commentary]]
quote='''
Greet Tryphaena and Tryphosa, who labor in the Lord. He gives a good testimony concerning these women, whose labor he testifies to be not of this world, nor of common life, but in the Lord. For many labor, but it is not established that the labor of all is in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"

[[commentary]]
quote='''
Greet Persis most dear, who has labored much in the Lord. This woman seems to be praised more than Tryphaena and Tryphosa, since indeed he says that those labored in the Lord, but that this one labored much in the Lord, to whom he added also "most dear."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
