[[commentary]]
quote='''
But this also, which he says, "about thirty years old", must be considered. "Joseph was thirty years old" when he was released from his chains and, having interpreted the dream of Pharaoh, was made ruler of Egypt, and in the time of plenty gathered wheat, so that in the time of famine he might have what he could distribute. I think that the thirty years of Joseph went before, as a type of the thirty years of the Savior. For this Joseph gathered not such wheat as that Joseph in Egypt, but true and heavenly wheat, so that, the wheat having been gathered in the time of plenty, he might have what he could distribute when famine had been sent into Egypt, "not a famine of bread nor a thirst for water, but a famine of hearing the word of God". And so he gathers from the prophets, from the law, from the apostles the words of abundance, so that when now no more books are written, nor is any new instrument composed, nor are apostles sent, then he may distribute those things which had been brought together by Jesus into the storehouses of the apostles — that is, into their souls and the souls of all the saints — and may nourish Egypt, imperiled by famine, and especially his brothers, of whom it is written: "I will declare your name to my brothers, in the midst of the church I will sing to you". Other men too have words of patience and words of justice and the words of the remaining virtues; this is the wheat which Joseph distributed to the Egyptians. But the grain which he gives to his brothers, that is, to his disciples, is another kind, from the land of Goshen, from that land which looks toward the east: the wheat of the Gospel, the wheat of the apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily28.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 28"


[[commentary]]
quote='''
It is prophesied, "Their young men will die by the sword, and their sons and daughters will perish in famine." Those who hindered Jesus from teaching have not simply perished by the sword. But now, after the advent of the Lord, a more profound famine has come upon them. It is "not a famine of bread or thirst of water, but a famine of hearing the Word of the Lord." For the "Lord almighty" no longer "speaks" with them. This famine portends that prophecy would cease. And why do I say prophecy? The Lord ceased teaching them. Even if they bear the title sage a thousand times with them, the Word of the Lord is still not among them, since the verse has been fulfilled: "The Lord took away from Judea and Jerusalem the strong man and strong woman, the giant and the strong man, and the soldier and judge and prophet and diviner and elder and captain of fifty and the admirable adviser and master builder and intelligent pupil." For he is no longer able to say, "Like a master builder I laid a foundation." The builders have passed over, have come to the church, have laid the foundation, Jesus Christ. Those who came after them have also built on him.
'''
source_url='https://www.google.com/books/edition/Homilies_on_Jeremiah_and_1_Kings_28/UFInXpKNapEC?hl=en&gbpv=0'
source_title="HOMILIES ON JEREMIAH 10:3"
