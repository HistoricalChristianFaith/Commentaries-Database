[[commentary]]
quote='''
My Lord Jesus was born, and his parents went up to Jerusalem to fulfill the things that had been commanded in the law, and to offer for him "a pair of turtledoves or two young pigeons". Simeon held him in his arms, as was read a little while ago, and prophesied concerning him the things that the account relates. And after everything was completed according to custom, the parents returned. In what year was Jesus at that time? He was assuredly still a little child, and yet he "grew and became strong and was filled with wisdom" and grace; he had not yet completed the forty days of purification, he had not yet come to Nazareth, and already he was receiving all wisdom. Scripture could have said: "he grew and became strong, and received the Spirit"; but because "he had emptied himself, taking the form of a servant", as soon as the sacrifice was offered for his purification, that which he had emptied out he filled up again — not that his body was thereupon made greater, but that something more sacred might be shown, as Scripture reports: "but the child grew and became strong and was filled with wisdom". Let us inquire whether anywhere else it is written of a little child: "he grew and became strong", so that by comparing many passages we may be able to understand what more is said in the case of our Lord. We read concerning John: "but the child grew and became strong", and yet there is not added: "and was filled with wisdom", but rather: "he became strong in spirit". But here, concerning the Lord, it says: "he grew and became strong and was filled with wisdom, and the grace of God was upon him". All these things were said of a child who had not yet completed twelve years.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily18.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 18"

[[commentary]]
quote='''
Since some who seem to believe the holy Scriptures deny the divinity of the Savior, as though for the glory of the almighty God, it seems just to me that they should be taught from the authority of those very Scriptures that something divine came into a human body, and not only into a human body, but also into a human soul. Yet, if we attend carefully to the meaning of the Scriptures, that soul had something more than the rest of human souls. For every human soul, before it comes to virtue, is defiled by vices. But the soul of Jesus was never stained with the filth of sin. Indeed, before he reached the twelfth year of his age, the Holy Spirit writes concerning him in the Gospel of Luke: "But the boy grew and was strengthened and was filled with wisdom". This human nature does not admit, that one should be filled with wisdom before twelve years. It is one thing to have a part of wisdom, another to be filled with wisdom. Let us not doubt, therefore, that something divine appeared in the flesh of Jesus, and something beyond not only man, but beyond every rational creature as well. And "he grew", it says. For "he had humbled himself, taking the form of a servant", and by the same power by which "he had humbled himself", he grows. He had appeared weak, because he had taken up a weak body, and for that reason he is again strengthened. The Son of God "had emptied himself", and therefore he is again filled with wisdom. "And the grace of God was upon him". Not when he came to adolescence, not when he was teaching openly, but while he was still a little child, he had the grace of God; and just as all things in him had been marvelous, so also his childhood was marvelous, that the wisdom of God might be fulfilled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily19.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 19"
