[[commentary]]
quote='''
But just as among "children" some are more eager than others and more quickly attain the things handed down to them, so, I say, Moses and the prophets, and also the Apostles of the Lord Jesus Christ, were made like gifted "children." Therefore, being aware of themselves — that, even if they made progress, they made the progress of "children" — they said: "We know in part and we prophesy in part." For they did not yet behold the realities of truth, but the shadows of the realities, nor the full light, but a dim image; and so they repeated, saying: "For now we see through a glass and in a riddle, but then face to face." Who then, reading and understanding these things, will be puffed up and exalt himself over his knowledge, or over any of the gifts? For since the things which have come to "children" are far inferior to those which are reserved for grown men, those who seem among the "children" to be of keener and quicker wit ought not to be lifted up and grow proud.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily07.html'
source_title="HOMILIES ON ISAIAH 7"
