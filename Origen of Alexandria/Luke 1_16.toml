[[commentary]]
quote='''
John indeed turned many, but it is the Lord's work to turn all to God their Father.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then Scripture says that "he shall convert very many of the sons of Israel to the Lord their God". John converts "very many", but the Lord not many, rather all. This is his work, that he should convert all to God the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily04.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 4"
