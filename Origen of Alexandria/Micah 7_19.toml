[[commentary]]
quote='''
We ought therefore to strip ourselves and give to him who is naked. One has God, another has him not at all—that contrary power, namely. And just as it is written that "we should cast our sins into the depth of the sea", so we ought to throw off from ourselves our vices and sins and cast them upon him who was for us the cause of them. "And he who has food", he says, "let him do likewise". He who has food, let him give to him who has none, so that he may bestow upon him not only clothing, but also that which he may eat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily23.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 23"
