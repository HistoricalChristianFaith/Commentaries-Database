[[commentary]]
quote='''
Just as, then, the seed of God is said to remain in us, when, keeping the word of God, we do not sin in ourselves, as John says: "but he who is of God does not sin, because the seed of God remains in him", so also, when we are persuaded by the devil to sin, we receive his seed. But when we even fulfill in deed what he has counseled, then indeed he has also begotten us; for we are born his sons through sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
