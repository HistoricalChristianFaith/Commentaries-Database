[[commentary]]
quote='''
After this the Bridegroom says: ‘I AM THE FLOWER OF THE FIELD AND THE LILY OF THE VALLEYS.’ For my sake, who was in the valley, He came down to the valley; and, coming to the valley, He became the lily of the valleys in place of the tree of life that was planted in the paradise of God, and was made the flower of the whole field—that is, of the whole world and the entire earth. For what else can so truly be the flower of the world as is the name of Christ? ‘His name is as oil poured forth’ and ‘I am the flower of the field and the lily of the valleys’ are the same thing put in different ways, and both are spoken with reference to Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
