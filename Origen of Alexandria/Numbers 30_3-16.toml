[[commentary]]
quote='''
But meanwhile the present reading contains certain distinctions among vows. For if it be a man who vows, he is said to be free in his vows and subject to no one. But if a woman vows, then, if indeed she be in her father's house, her vow hangs upon her father's judgment; and if he refuses it, she is released; but if he does not refuse it, both he and the daughter are held liable. But if, after the father has not refused, she does not fulfill the vow, the daughter's sin remains upon him. And in like manner it is decreed also concerning the husband, that, if a wife has vowed something in her husband's house and the husband on hearing it does not refuse, he is guilty of the vow equally with his wife; but if he refuses, then the wife is as free as the husband; but if he keeps silent, both, as we have said, are held guilty. These indeed are the things that are written; but we must pray to God that he may deign to give an understanding worthy of himself, whereby we may be able to perceive these things as it is fitting they be understood concerning the words of God. All of us who live under the law of God and are counted in his Church, some pass our life under fathers, some under husbands. And if the soul is a little one and has its beginnings in the divine instructions, this soul is to be believed to conduct itself under a father. But if it has already become more grown up, so that it is capable of a husband for conceiving the seed of the word of God and of receiving the secrets of spiritual teaching, this soul is said to be placed under a husband. For thus also Paul said concerning the Corinthians: "I wish to present you all as a chaste virgin to one husband, to Christ." But those who are more perfect and more eminent than these, of them it is not said that they are under a husband, but hear how Paul pronounces concerning himself and those like him: "until we all," he says, "come together into the perfect man, into the measure of the age of the fullness of Christ." Over this soul, then, which comes together into the perfect man, no one is master in vows, but it has power over its own things and freedom of its vows. But if the soul be still of the feminine kind, over which either a husband or a father is master in vows, the fault is not always in the soul itself, but sometimes it returns upon the husbands or the parents. Concerning these, although it be difficult to apply, nevertheless the things that, by the Lord's bounty, have been able to occur to us we will set forth. We have often said that the care and management of the souls which are in the Church of God is exercised through angels, and we have shown that these too come to judgment along with men, so that in that divine scrutiny it may be established whether men have sinned through their own sloth or through the negligence of their admonishers and guardians. It seems to me, therefore, that in this passage also the same thing is designated and shown under a mystery, namely that some souls dwell under these as daughters, others as wives, according to the things which we distinguished above. If, therefore, any of these desires to offer something and to vow it to God, then, if what she vows is over-hasty and less fitting, it belongs to him—namely to the angel, as her guardian and admonisher—to check and beat back the boldness of her who vows. But if, on hearing it, he does not check it, does not admonish, the soul indeed is freed from fault, but he himself will remain liable to the vow. This indeed is to be taken as happening with regard to any of the lower sort; but with the more perfect God himself is present, as it is written concerning the people of Israel: "But the Lord himself led them." But after they had transgressed and had made themselves lower than themselves, they are handed over to an angel. Whence Moses too said: "Unless you yourself come with us, do not lead me up hence." But also concerning another he says: "I am with him in tribulation," and elsewhere he says: "Do not fear to go down into Egypt, for I will be with you." To the just, therefore, and the elect God himself is present, but to the lower angels are present, governing and caring for them according to the things we said above, sometimes transferring their vows to themselves, but sometimes leaving them upon those very persons. But we ought to strive that we may come together into the perfect man, into the measure of the age of the fullness of Christ, that we may use the freedom of vows and so hasten to cleave to the Lord that with him, rather than with an angel, we may be one spirit, so that he himself may abide in us and we in him, and that nothing feminine, nothing of little age, may be found in us, nor be it necessary for us to be left under guardians and stewards by the father, but let us hasten to hear from our Lord and Savior that voice in which he says: "the Father himself loves you." To him be glory unto the ages of ages. Amen!
'''
