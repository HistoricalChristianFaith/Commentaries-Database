[[commentary]]
quote='''
The carcass of a man, as we said above, we can say to be that which the Apostle says to the Corinthians: "I wrote", he says, "to you in the epistle that you should not mingle with fornicators; not indeed with the fornicators of this world, or the covetous, or the rapacious, or those serving idols; otherwise you would have had to go out of this world. But now I have written to you that you should not mingle, if anyone named a brother is a fornicator, or covetous, or serving idols, or a reviler, or a drunkard, or rapacious — with such a one not even to take food". This, therefore, is to touch the "carcass" of a man: for one to offer himself as a companion, even in food, to one who, having been made a man in Christ, has again died in his sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily03.html'
source_title="HOMILIES ON LEVITICUS 3"
