[[commentary]]
quote='''
For similarly there are commanded to be placed upon the altar "these fats of the ram which are around the kidneys, and those which cover the inward parts"; so that you too, who hear these things, may know that everything within you that is grosser and covers your "inward parts" you ought to offer to the fire of the altar, so that all your "inward parts" may be purged, and you too may say, as David also said: "bless the Lord, O my soul, and all my inward parts his holy name". For unless that grossness which covers your "inward parts" is removed, they cannot grasp a subtle and spiritual sense, nor can they grasp the understanding of wisdom, and therefore they cannot praise the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily05.html'
source_title="HOMILIES ON LEVITICUS 5"
