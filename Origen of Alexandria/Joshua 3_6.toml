[[commentary]]
quote='''
After these things it says: "and all Israel," it says, "and the presbyters and the judges and the scribes went before, on this side and on that, the ark of the covenant of the Lord." "The ark of the covenant of the Lord" is that in which the tablets of the law, written by the hand of God, are kept. And around this "ark of the covenant" everyone who is "truly Israel" walks and is not far from it; but the Levites and priests even carry it upon their shoulders. For whoever live in priestly religion and holiness — not only those who seem to sit in the priestly assembly, but rather those who act in a priestly manner, whose "portion is the Lord" and who hold no share on earth — these are truly the priests and Levites of the Lord, who carry the law of God upon their shoulders, that is, by doing and fulfilling through their work the things that are written in the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily09.html'
source_title="HOMILIES ON JOSHUA 9.5"


[[commentary]]
quote='''
Meanwhile there is a priestly and Levitical order which is to show the way to the people of God who have gone out from Egypt. For it is they who teach the people to go out from Egypt, that is, from the errors of the world, and to pass through the vast wilderness, that is, to traverse the various kinds of temptations and not to be harmed by the serpents, which are the bites of demons, and to avoid the poisons of evil suggestions. And "if" perhaps "someone has been struck" in the wilderness "by a serpent," that they may show him the "bronze serpent" hung upon the cross, "which whoever shall look upon," that is, whoever believes in him whose figure that serpent displayed, shall through this flee from the diabolical poisons. There is a priestly and Levitical order which stands by the ark of the Covenant of the Lord, in which the law of God is carried, doubtless so that they themselves may enlighten the people concerning the commandments of God, as the prophet says: "your word, O Lord, is a lamp to my feet, and a light to my paths." This light is kindled through the priests and the Levites. But if perhaps someone of this order has "put a kindled lamp under a bushel" and not "upon a lampstand, that it may give light to all who are in the house," let him consider what he must do, when he shall begin to render account to the Lord of light for those who, receiving no illumination from the priests, walk in darkness and are blinded by the obscurity of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily04.html'
source_title="HOMILIES ON JOSHUA 4.2"
