[[commentary]]
quote='''
"And the Lord spoke to Moses, saying: send men, and let them view the land of the Canaanites, which I give to the children of Israel for a possession," and the rest, in which things are narrated about the explorers of the land, who, being sent, report that the land is indeed good and admirable, but that the sons of giants dwell in it, in whose sight the people of God seem as locusts. And several indeed despair of being able to be saved from the sons of giants; yet Joshua does not despair, but confirms the faith of the people together with Caleb, who is of the tribe of Judah, and they say: if God loves us, let him bring us into this land. What then is this land according to the spiritual understanding, which land is indeed holy and a good land, but is inhabited by the impious? Who then are these enemies who dwell in the land of the saints? And how are they to be cast out, so that, they being cast out, the saints may succeed into their place? Let us return to the Gospels, let us return to the Apostle. The Gospels promise the kingdoms of heaven to the saints. The Apostle says: "but our citizenship is in the heavens"; in the heavens, therefore, is the place of the inheritance which is promised to the saints. And do we think that in these places which are promised to you there is now no inhabitant whom you ought to drive out from there by fighting? And how then does the Lord say that "from the days of John the Baptist the kingdom of heaven suffers violence, and the violent seize it"? For unless there were those to whom violence should be done, unless there were those who ought to be driven out and thrust from there, it would never be said that the kingdom of heaven is to be seized by violence. And unless there were those with whom there was for us a contest and a battle, the Apostle would never say: "our wrestling is not against flesh and blood, but against principalities and powers, against the rulers of this world of these darknesses, against the spiritual forces of wickedness in the heavenly places." Concerning whom that saying of God through the prophet also seems to be understood, where he says: "and my sword is made drunk in heaven." It is necessary, therefore, that the spiritual forces of wickedness, which are said to be in the heavenly places, who are the true Canaanites, be conquered by you and expelled from the heavenly places, so that you may dwell there in their stead. Yet know that they are giants. Everyone who resists against God is called a giant. Whoever therefore opposes God and is contrary to the truth, which they principally do, is deservedly called a giant. To you therefore it is granted that you may cast out the giants and enter into their kingdom. Or is it not written concerning a certain one of them: "who shall take spoils from a giant?" Concerning whom the Lord also said in the Gospel: "no one can enter into the house of the strong man and plunder his vessels, unless he first bind the strong man." Now therefore, as regards the comparison of human and demonic nature, we are locusts and they giants — and especially, if our faith be doubtful and if unbelief terrify us, they will truly be giants and we locusts. But if we follow Joshua and believe his words and are filled with his faith, they will be as nothing in our sight. For hear how he exhorts us and says: if God loves us, let him bring us into this land, since it is good and its fruit wonderful. Therefore the type and figure which went before in the fathers is fulfilled in us. They cast out the nations and obtained their inheritance; for they obtained all the land of Judaea and the city of Jerusalem and Mount Zion. These things were fulfilled in them, but to you what is said? "You have not," he says, "come to the things which are visible, but to the invisible. For you have come," he says, "to the mount of the living God and to the heavenly city Jerusalem and to the multitude of angels." But elsewhere too the same Apostle says: "but the Jerusalem which is above is free, which is the mother of us all." If anyone does not lend faith to the words of the Apostle saying that Jerusalem is heavenly, he can refuse these our words as well. But if faith is to be given to the words of Paul, as certainly it is to be given, we both believe that there is a heavenly Jerusalem as a type of this earthly one, and, the things which seem to be written concerning this earthly one, we shall more rightly by spiritual understanding transfer to that heavenly one. We have come therefore, as Paul says, to the heavenly Jerusalem, and without doubt also to the heavenly Judaea; and just as they, from the earthly Judaea, cast out the Canaanites and the Perizzites and the Hivites and the remaining nations, so also we who have come to the mount of God and to the heavenly kingdoms, it is necessary that we expel from them the contrary powers and the spiritual forces of wickedness from the heavenly places; and just as they cast out the Jebusite from Jerusalem, and that which before had been called Jebus was afterward called Jerusalem, so we too must first expel the Jebusite from Jerusalem and thus obtain its inheritance. But they indeed did these things with visible arms, we however with invisible ones. They conquered by bodily battles, but we overcome by spiritual contest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily07.html'
source_title="HOMILIES ON NUMBERS 7.5"
