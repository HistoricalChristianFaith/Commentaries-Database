[[commentary]]
quote='''
But let us also see how great his self-inflation is, that we may guard against it and not permit him to speak true things over us. What, then, does he say? "By my strength I will act, and by the wisdom of my understanding I will take away the borders of the nations". He reckons that by his own might he is able to accomplish in us whatever he wishes. And truly, if we are conquered and after these words we sin — if after the Church we go again into the circus and to the horse-races and to the assemblies of the Gentiles — what else happens than that he possesses us as those he has overcome? And what the devil said, "By my strength I will act," comes to pass in us who sin, as he threatened. And also, if we commit fornication after chastity of long duration, after much holiness, what else happens than that he is proved to have spoken true things over us, he who said: "By my strength I will act"? But let us look at what else this boaster promises. "And by the wisdom of my understanding I will take away the borders of the nations". He promises some kind of "wisdom" or other — the wisdom of which the prophet also speaks: "there is a certain alien wisdom in them". There is a certain "wisdom estranged" from the truth, which God destroys. Having this, he reckons himself to be "wise" and says: "By the wisdom of my understanding I will take away the borders of the nations, and I will feed upon their strength". For his working has reached to all the "nations", but the Savior, sending his words into all the "nations", rescues those who by the devil were held captive among all the "nations". "And I will feed upon their strength". He threatens that he will go to plunder our "strength" and to hand it over to those who war against us. And truly one may see him doing this to certain people. For when someone is conquered by the devil and handed over to demons, to most wicked spirits, to the opposing powers, what else has happened than that he who had said, "and I will feed upon their strength", has taken our "strength" and "fed upon" us? "And I will shake the cities that are inhabited". This too the devil threatens: he perceives that the "cities" — the churches of God built in Christ the Lord — are "inhabited", and he gives out that he will "shake" these. And frequently indeed he has shaken the "inhabited cities" with persecutions, frequently he has shaken them with scandals. But let us strive, having our "foundation upon the rock", to become such that this one who says, "I will shake the cities that are inhabited", may not be able to "move" us by his storms nor by his adverse spirits, but that we may persevere steadfast against all things that may befall, inasmuch as we have our edifice "upon the rock," Jesus "Christ", "to whom be glory and dominion unto the ages of ages. Amen!"
'''
source_url="https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily08.html"
source_title="HOMILIES ON ISAIAH 8"
