[[commentary]]
quote='''
Now he calls Othniel the Savior, who is interpreted as "the time of God for me". Through this Othniel, therefore, that former people was snatched from the servitude of humiliation, and peace was restored to the people — the peace which pride and the various crimes of the people had for a while put to flight. But since we have said that a certain Cushan-rishathaim can be understood spiritually, both as a king and as one of the adversaries and a prince among the "airy powers," so it seems to me consequent that this Othniel too, who was raised up to deliver the people, is some one of the "heavenly host" and of the archangelic troops which "are sent as a help to those who obtain the inheritance of salvation"; and there are saving angels who are designated under the figure either of Othniel or of Ehud, because, as we have often shown, we are not only assailed by the contrary powers, but the divine and good powers too are sent by the Lord for our help. Let us see, nevertheless, who this Othniel was, of what family, of what nobility. "The son," it says, of Kenaz, "the brother of Caleb" — that praiseworthy and admirable man Caleb, who was the companion and comrade of Joshua son of Nun, concerning whom, as far as we were able, we have discoursed in their proper places, as seemed good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily03.html'
source_title="HOMILIES ON JUDGES 3"
