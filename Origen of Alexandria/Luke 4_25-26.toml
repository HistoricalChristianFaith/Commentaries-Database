[[commentary]]
quote='''
For when a famine came upon the people of Israel, i. e. of hearing the word of God, a prophet came to a widow, of whom it is said, For the desolate hath many more children than she which hath an husband; (Isa. 54:1, Gal. 4:27.) and when he had come, he multiplies her bread and her nourishment.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Hence to what he had said — "no prophet is accepted in his own homeland" — he adds another thing also: "for in truth I say to you, that there were many widows in the days of Elijah in Israel, when heaven was shut up for three years and six months". What he says is this: Elijah was a prophet and was among the people of the Jews; but when he was about to do something wonderful, although there were many widows in Israel, he left them and came "to the widow in Sarepta of Sidon", to a Gentile woman, unfolding a figure of a thing to come — that, when the people of Israel was seized "not with hunger for bread nor with thirst for water, but with hunger for hearing the word of God", he came to the widow, of whom the prophet also bears witness, saying: "many are the children of the deserted woman, more than of her who has a husband", and, when he had come, he multiplies her bread and her food. You were the widow in Sarepta of Sidon, from whose borders "the Canaanite woman comes forth" and desires that her daughter be healed and, on account of her faith, deserved to receive what she asked. "There were therefore many widows among the people of Israel, but to none of them was Elijah sent, except to the widow woman in Sarepta".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily33.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 33"
