[[commentary]]
quote='''
But after these things it now seems fitting to touch also on something of allegory. This Balaam, who is interpreted "a vain people," seems to me to bear the person of the scribes and Pharisees of the Jewish people. But Balak, who is interpreted "exclusion" or "devouring," is himself also to be understood as bearing the person of some one of the spiritual contrary powers of this world, which desires to exclude and devour Israel—not that Israel which is according to the flesh, but that which is according to the spirit. This contrary power, then, wishing the spiritual Israel to be destroyed and utterly extinguished, uses no other ministers than the chief priests and scribes and Pharisees; it invites these, to these it promises rewards and prizes. But they, just as this Balaam does, feign that they refer all things to God and act with zeal for God; for they say: "search the Scriptures and see that a prophet does not arise out of Galilee"; and again they say: "we have a law, and according to the law he ought to die, because he made himself the Son of God." Through each of these things the scribes and Pharisees indeed seem to have zeal for God, but a feigned one. But the donkey on which Balaam sat, since Scripture says: "men and beasts you will save, O Lord," can be understood as that part of the believers which, whether for foolishness or for innocence, is compared to animals. For thus also the Apostle says: "consider your calling, brothers, that not many among you are wise, not many powerful, not many noble; but the foolish things of the world God has chosen, that he may confound the wise." These, then, such as they are—as the deeds that were done in the parables in the Gospel signify—were held in a manner subjected and bound by those most evil masters, the scribes and Pharisees, but they are loosed by the Lord, not indeed through the Lord himself, but through his disciples; for he himself says to the disciples: "go into the village that is opposite you; and you will find a donkey tied and her colt; loose them and bring them." As, therefore, in the Gospel not the Lord himself, but the disciples loose the donkey, so also here the mouth of the donkey is opened not by God himself, but by an angel; and as in the Gospels those who do not see reprove those who see, so also here those who were dumb reprove those who speak. And this is what the Lord said: "Father, I give you thanks, because you have hidden these things from the wise and prudent, and have revealed them to little ones." The scribes, therefore, and Pharisees were they who sat upon this donkey and held her bound. Against these, then, the angel is angry, and, but for a certain foresight of things to come, he would indeed have destroyed them, but would have saved the donkey, who saw and reverenced him who came to the vineyard and stood among the vineyards. Yet he crushed the feet of the one sitting upon her against the wall, and therefore perhaps that ancient rider of hers cannot walk, nor come to him who says: "come to me all you who labor and are burdened." Yet the donkey comes, led by the disciples, and on her, on whom then sat Balaam greedy for reward, now Jesus sits. And do not marvel if you see him, whom we said bears the form of the scribes and teachers of the people, prophesying about Christ; for we read that Caiaphas also did this, who said: "it is expedient for you that one man perish for the whole people"; but this, it says, because he was high priest of that year, he prophesied. Balaam therefore also prophesies about Christ, and therefore let no one be exalted, even if he prophesy, even if he deserve foreknowledge, but let him return to the saying of the Apostle, who, looking to these things, says: "whether prophecies, they will be abolished; whether tongues, they will cease; whether knowledge, it will be destroyed." And what, then, is it that remains? "Faith," he says, "and hope and charity; but the greater of these is charity." And "charity alone," he says, "is that which never falls." Therefore above prophecy, above knowledge, above faith, above even martyrdom itself, as Paul teaches, charity is to be held and charity is to be cultivated, because both God is charity and Christ his Son is charity, who may deign to grant us the perfection of charity. To him be glory unto ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily14.html'
source_title="HOMILIES ON NUMBERS 14.4"
