[[commentary]]
quote='''
I think the daughter of Pharaoh can be seen as the church, which is gathered from the nations, which, although she has an impious and iniquitous father, yet to her it is said through the prophet: "hear, O daughter, and see, and incline your ear, and forget your people and the house of your father, because the king has desired your beauty." This, then, is she who goes out from her father's house and comes to the waters, that she may be washed from the sins she had contracted in her father's house. Finally, straightway she takes up "the bowels of mercy" and has compassion on the infant. This church, therefore, coming from the nations, finds Moses lying in the marsh, cast off by his own and exposed, gives him to be nursed, he is nursed among his own, there he passes his infancy. But when "he has grown stronger," then he is brought to her and adopted as a son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily02.html'
source_title="HOMILIES ON EXODUS 2"
