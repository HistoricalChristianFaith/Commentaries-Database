[[commentary]]
quote='''
He is not found as soon as sought for, for Jesus was not among His kinsfolk and relations, among those who are joined to Him in the flesh, nor in the company of the multitude can He be found. Learn where those who seek Him find Him, not every where, but in the temple. And do thou then seek Jesus in the temple of God. Seek Him in the Church, and seek Him among the masters who are in the temple. For if thou wilt so seek Him, thou shalt find Him. They found Him not among His kinsfolk, for human relations could not comprehend the Son of God; not among His acquaintance, for He passes far beyond all human knowledge and understanding. Where then do they find Him? In the temple! If at any time thou seek the Son of God, seek Him first in the temple, thither go up, and verily shalt thou find Christ, the Word, and the Wisdom, (i. e. the Son of God.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
They seek "among their kinsfolk", they seek "in the company", they seek "among their acquaintances", and in all these they do not find him. Jesus, then, is sought by his parents, by the father who had been his nurse and companion when he went down to Egypt, and yet he is not found immediately when he is sought. For Jesus is not found among relatives and kinsmen of the flesh, not among those who are joined to him bodily. In the company of many my Jesus cannot be found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily18.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 18"
