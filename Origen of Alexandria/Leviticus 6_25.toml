[[commentary]]
quote='''
But let us now see what those things are which are set forth in the law. "And the Lord spoke," it says, "to Moses, saying: Speak to Aaron and his sons, saying: This is the law of the sin offering" and the rest which have been read in the present passage. And I remember that we have already said before that the law is not always given to the same persons, but one thing indeed is said to the sons of Israel, another to the sons of Aaron, and yet another, as we observed some time ago, to Moses and Aaron. There is also another law which is given to Moses alone, so that not even Aaron is made a partaker of that law. Who has been so illumined by God with the gift of knowledge as to be able to discourse fully and clearly on the distinctions and diversities of each of these? For we find in what follows a command of the Lord given to Moses alone, and it is ordered that "the little breast of the ram of consecration" be given to Moses, "as the Lord commanded Moses," it says. In which portion neither Aaron nor his sons are made partakers. And the law which pertains to "the ram of consecration" is found to be unable to reach even to Aaron nor to his sons — much less to the rest of the sons of Israel — but only to Moses, who was "the friend of God". But what need is there to anticipate the things that are to be read hereafter? For the present the law has now been read which is promulgated to Aaron and his sons, "the law of the sin offering", that is, of the victim which is offered "for sin": "in the place," it says, "in which the whole burnt offerings are slaughtered, there they shall also slay that which is for sin, in the sight of the Lord; they are the holy of holies". Many things indeed have already, with God's help, been said in the foregoing about the rite of the sacrifices according to the spiritual understanding; but even now, if the grace of the Lord deign to visit us and you strive with your prayers, we shall add whatever the Lord may grant. Certain of the victims belong to God alone, so that no man partakes of them. Certain belong to Aaron the priest and to his sons; certain to him and to his sons and daughters, so that even the wife of the priest is permitted to eat of them. Certain belong to the priests and their sons and daughters, but of which the sons of Israel too are permitted to eat. And in those victims of which the sons of Israel are permitted to eat, the priests and the sons of the priests without doubt also have a share; yet not of every victim which the priest shall eat will it be permitted that the sons of Israel too eat of it. Therefore, since these are the distinctions of the victims, that one which we said belongs to God alone, of which it is not lawful for either Moses or Aaron or his sons to partake, we find named sometimes indeed "whole burnt offerings" (holocaustomata), but sometimes not whole burnt offerings but "holocarpoma", as though we should say that it is wholly fruit — namely that which is offered to God. There is, then, a first legislation concerning the sacrifices, if indeed you have either observed or diligently retained what has been read and expounded, and if the things either that are said by us or that are read from the divine volumes do not run through your ears in vain. The first victim, then, is the "whole burnt offerings" (holocaustomata); for it was not fitting that any other victim be named first except that which was offered to almighty God. The second victim is that which is assigned to the priests for eating. The third is that which even the sons of Israel — namely those who offer — are permitted to touch or to eat. But not all the sons of Israel, only those who are "clean"; for only those who are "clean" are commanded to eat of the sacrifices. But all these victims, you who are "a Jew inwardly", I do not wish you to seek in visible animals, nor to suppose that what ought to be offered to God is to be found in dumb beasts. Seek these victims within your own self, and you will find them within your soul. Understand that you have within your very self herds of oxen, those which are blessed in Abraham. Understand that you have both flocks of sheep and flocks of goats, in which the patriarchs were blessed and multiplied. Understand that within you there are also birds of heaven. And do not marvel that we say these things are within you; understand that you are another world in miniature, and that within you are the sun, the moon, and also the stars. For if this were not so, the Lord would never have said to Abraham: "Look at the heaven and see the stars, if they can be numbered for their multitude; so shall your seed be". And do not marvel, I say, if it is said to Abraham that "so shall your seed be, as the stars of heaven are"; namely concerning those who, born of his faith, live rationally and keep the divine laws and precepts. Hear something further, the Savior saying to his disciples: "you are the light of the world". Do you doubt that there is within you a sun and a moon, you to whom it is said that you are "the light of the world"? Do you wish to hear still something further about yourself, lest perhaps, thinking small and lowly things of yourself, you neglect your life as something cheap? This world has its own governor, it has one who rules it and dwells in it, almighty God, as he himself says through the prophet: "do I not fill heaven and earth, says the Lord?". Hear, then, what almighty God himself says even about you, that is, about men. "I will dwell," he says, "in them and walk among them." He adds still something more with regard to your person. "And I will be," he says, "to them a father, and they shall be to me sons and daughters, says the Lord." This world has the Son of God, it has the Holy Spirit, according to what the prophet says: "by the word of the Lord the heavens were established, and by the spirit of his mouth all their power"; and again elsewhere: "for the spirit of the Lord has filled the circle of the lands". Hear also what Christ says to you: "and behold, I am with you all the days unto the consummation of the age". And of the Holy Spirit it is said: "and I will pour out of my spirit upon all flesh, and they shall prophesy". Since therefore you see that you have all the things which the world has, you ought not to doubt that you have also within you the animals which are offered in the victims, and that from these very things you ought spiritually to offer victims.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily05.html'
source_title="HOMILIES ON LEVITICUS 5"
