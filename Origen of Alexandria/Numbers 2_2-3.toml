[[commentary]]
quote='''
I discern still something further of mystery in this book of Numbers. For the reckoning of the tribes and the distinction of ranks, the fellowship of families and the whole ordering of the camps, discloses to me the tokens of vast sacraments, since the Apostle Paul sprinkles upon us the seeds of spiritual understanding. And come now, let us see what all this reckoning of numbers, what this diversity of ranks, contains of mystical understanding. Our expectation of the resurrection of the dead is certain, when those who live, who are left, "shall not go before, at the coming of Christ, those who have fallen asleep, but joined and associated together with them shall be caught up in the clouds to meet Christ in the air" — deserting, that is, the corruption of this earthly place and the dwellings of death, whether all are to remain in the air, as Paul declares, or some also are to be transferred to paradise or to whatever other places out of the many mansions which are with the Father. But the diversity of the translation and of the glory will without doubt be granted according to the merits and deeds of each one, and each will be in that rank which the merits of his deeds have conferred upon him, just as the same Paul also attests, saying of those who rise, "but each in his own order." Hence, therefore, it will come about in the resurrection that each is enrolled, by spiritual tokens, either in the tribe of Reuben — for this very reason, no doubt, that in his morals or deeds or life he had something similar and akin to Reuben himself. But another in the tribe of Simeon, perhaps for his obedience. Another in the tribe of Levi — one, I believe, who presided well over the priesthood, or who, ministering well, acquired for himself a good standing. Another in the tribe of Judah — I do not doubt that this is he who bore a kingly spirit and ruled well the people that is within him, namely the senses of the mind and the thoughts of the heart. But also to each single tribe each one will be associated according to those things which, in his deeds or in his morals, he had akin to any one of them. There will therefore be certain ranks of this kind in the resurrection of the dead, as the Apostle designates; the type and figure of which ranks seems to me to be preformed in this book. But also the fact that the position and the order of the encampment is described by a certain association of the tribes and connection of the camps pertains without doubt to some state in the resurrection of the dead. That three tribes are said to be placed to the east and three to the west, three also toward the sea and the three last toward the north — which is called the harsh wind — but also that the tribe of Judah, which is royal, is stationed to the east, from which our Lord arose, I do not think is idle, and that Issachar is joined to it and Zebulun, and that into four parts this triple number is arranged, which, although they have differing qualities of their positions, are nevertheless all contained within the number of the Trinity, and that through all these four parts the same Trinity is always gathered into one number — for this reason, no doubt, that under the one name of the Father and the Son and the Holy Spirit are reckoned all who, coming from the four parts of the world, call upon the name of the Lord, reclining with Abraham and Isaac and Jacob in the kingdom of God. Let these things be indicated by us in a general way for those who wish briefly to grasp the mystical contents of this whole sacred volume, so that from these, having taken the occasion of spiritual understanding, each one may pursue in the rest a similar inquiry, or even, if to anyone God reveals more, a higher and loftier one. For I truly judge myself unequal to expounding the mysteries which this book of Numbers contains; but far more inferior to those which the volume of Deuteronomy includes. And therefore we must hasten to arrive at Jesus — not that son of Nun, but Jesus Christ. Yet first, using Moses as a tutor and laying down with him the rudiments of infancy, let us so tend toward the perfection of Christ. For Moses did not put down many wars; but Jesus checked indeed all wars, and gave peace to all, so that it is written that "the land rested from wars." The land of promise, the land of inheritance, the land which flows with milk and honey, is distributed by Jesus. For "blessed are the meek, for they" through Jesus "shall inherit the land." But you will find that types and images of this very distribution went before; for it is not idle that to some the land is divided beyond the Jordan, to others within the Jordan, and to some first, to others second, and to some even third, and thus in order the inheritance of the land is divided, where each one may rest under his own fig tree and under his own vine, and there be no more anyone to terrify him. All which things, foresignified by magnificent mysteries, the Lord Jesus himself, on the day of his coming, no longer through a glass and in a riddle, but face to face in truth, will fulfill for each one, according as he himself knows the merits of the individuals — he who is the knower of the heart, to whom be glory and dominion for ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily01.html'
source_title="HOMILIES ON NUMBERS 1.3"
