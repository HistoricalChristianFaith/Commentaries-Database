[[commentary]]
quote='''
"And at evening", it says, "you shall know that I am the Lord, but in the morning you shall see the majesty of the Lord". And concerning this I would wish the Jews to answer me, how "at evening" the Lord is recognized, but "in the morning" his majesty is seen. Where was the Lord recognized "at evening" and his majesty seen "in the morning"? Answer us, you who are instructed from infancy to old age, "always learning and never coming to the knowledge of the truth": why do you not understand that these things are said prophetically? But if you wish to understand these things, you cannot except through the Gospel. For there you will find it written that: "on the evening of the sabbath, which dawns toward the first day of the week, came Mary Magdalene and Mary of James to the tomb, and they found the stone rolled away from the sepulcher", an earthquake having occurred, the sepulchers broken open, the centurion and the soldiers, who had been set for the guard, "saying: truly this was the Son of God". Through these things, therefore, the Lord was recognized in the evening, because he himself was the Lord; he was recognized in the power of the resurrection. But how was his glory seen "in the morning"? When the other women had come "early in the morning on the first day of the week", they found angels with immense brightness sitting at the sepulcher and saying: "he is not here, he has risen from the dead. Come and see the place in which he was laid, and go, tell his disciples that he has risen and goes before you into Galilee". Therefore "the majesty of the Lord was seen in the morning", when through the angels the resurrection was announced.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily07.html'
source_title="HOMILIES ON EXODUS 7"
