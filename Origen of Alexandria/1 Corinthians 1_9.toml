[[commentary]]
quote='''
Believe in him always; for you were called that we might simply be under Jesus. Great is what God bestows upon the saints: we were called into the fellowship of his Son; wherefore we are "heirs indeed of God, but joint-heirs with Christ".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT III"
