[[commentary]]
quote='''
We meanwhile say that by a certain dispensation and wisdom of God all things in this world are so arranged that absolutely nothing is idle with God, whether it be evil, whether it be good. But let us explain more plainly what is said. God did not make wickedness; yet, though he could prohibit it when it has been invented by others, he does not prohibit it, but uses it, together with those very ones by whom it is held, for necessary purposes. For through those very persons in whom wickedness is, he makes those illustrious and approved who strive toward the glory of the virtues. For if wickedness were destroyed, there would surely be no one to oppose the virtues. But virtue, having nothing contrary to it, would not shine forth, nor become more splendid and more tested. And a virtue not proved nor tested is not even a virtue. But if these things be said without the testimonies of the divine words, they will seem contrived rather and composed by human art than true and beyond doubt. Let us therefore inquire whether the divine volumes also contain a meaning of this kind. Let us come to Joseph. Take away the wickedness of his brothers, take away envy, take away all that parricidal scheme by which they raged against their brother, to the point of selling him: if you take these away, see how great a dispensation of God you will at the same time have destroyed; for you will at the same time cut off all those things that were done in Egypt through Joseph for the salvation of all. There would have been no interpretation of Pharaoh's dream, if through the envy of his brothers Joseph had not been sold away and come into Egypt; no one would have understood what God had revealed to the king, no one would have gathered grain in Egypt, no one would have provided for the necessity of the famine by wise foresight; Egypt would have perished, the neighboring regions too would have perished by famine, Israel itself and its seed would have perished, and seeking bread it would not have entered Egypt, nor would the sons of Israel have gone out from it with the wonders of the Lord; nowhere would there have been the plagues upon the Egyptians nor those mighty works which God did through Moses and Aaron; no one would have walked through the Red Sea with dry footsteps; mortal life would not have known the food of manna; no streams of waters would have burst forth from the following rock; the law would not have been given by God to men; the things that are recounted in Exodus, in Leviticus, in Numbers too and Deuteronomy would not have come to the knowledge of the human race; certainly no one would have entered the paternal inheritance and the land of promise. And, to come to these things which are in hand, take away the wickedness of Balak, this most evil king, by which he desires to curse Israel, remove his cunning, by which he invites Balaam to curse the people: you will likewise have taken away God's dispensation toward the sons of Israel and the favor of his providence, and nowhere will those prophecies exist which through the mouth of Balaam are prophesied both to the sons of Israel and to the nations. But if you desire this to be confirmed also by testimonies of the New Testament, if you take away the wickedness of Judas and destroy his betrayal, you will likewise have taken away the cross of Christ and his passion; and if there be no cross, the principalities and powers are not stripped, nor are they triumphed over on the wood of the cross. If there had been no death of Christ, surely there would have been no resurrection either, nor would anyone have existed as the firstborn from the dead. But if there had been no firstborn from the dead, neither would there have been for us any hope of resurrection. In a like manner, then, let us suppose concerning the devil himself, for instance, that he had been constrained by some necessity, so as not to sin, or that after his sin the will to wickedness had been taken away from him: there would at the same time surely have been taken away from us the contest against the wiles of the devil, nor would a crown of victory be looked for by him who had lawfully striven. If we did not have those who resist us, there would be no contests, nor would prizes be set up for the victors, nor would the kingdom of heaven be prepared for those who conquer, nor would this momentary and light burden of our tribulation work for us beyond measure a weight of glory in the future, nor would any of us hope, for the endurance of tribulations, for the immense glory of things to come. From all which it is gathered that God uses not only good things for a good work, but also evil things; and this is truly marvelous, that God uses evil vessels for a good work. For in this great house of the world there are not only vessels of gold and silver, but also of wood and of clay; and some indeed unto honor, but others unto dishonor, yet both necessary. But since these vessels of which we speak are to be understood as rational and of free choice, not by chance nor by accident is each one made either a vessel of honor or a vessel of dishonor, but he who has shown himself such as to deserve to be chosen is made a chosen vessel and a vessel of honor. But he who lives by unworthy and most base thoughts, this one is formed a vessel of dishonor, not by his maker, but by himself, the causes of his own dishonor having been given. The maker, then, did not make them to be such, but he dispenses minds of this kind according to their purpose by the justice of his providence and by a certain ineffable reason. Just as, for instance, in great cities, if there are men more unworthy and of hidden and most base life, they are condemned to work at all the meanest and most laborious tasks, and yet such tasks are necessary to the city (for example, they serve the furnaces of the bath for kindling the fires, that you may enjoy either the convenience or the delights, or they clean out the drains or perform other things of this kind, that for you the dwelling in the city may be made agreeable; and they indeed either act from their own purpose or suffer according to their deserving, yet their work is of use to those for whom the things that are good and useful are provided), so also with these things which we have set forth: God indeed did not make wickedness, yet, once it was invented by the intent of the purpose of those who turned aside from the right way, he was unwilling to take it away entirely, foreseeing this, that, even if it were useless to those who used it, he would nevertheless make it useful to those against whom it was exercised. And therefore we ought by all means to flee, lest wickedness ever be found in us; but in others we must be zealous to conquer it, not to destroy it, because even those in whom wickedness is confer some necessary work upon the universe. For nothing is idle, nothing empty with God, since either he uses the good purpose of a man for good things or he uses the evil purpose for necessary things. But you will be blessed, if rather from the virtues that are in you the universe of this life may be found to obtain some good thing from you, like those of whom the Apostle Peter says: that you may be as lights in this world, holding the word of life. Unto glory, therefore, are lights necessary to this world. And what is so delightful, what so magnificent as the work of the sun and moon, by which the world is illumined? Yet the world itself has need also of angels who are set over the beasts, and of angels who preside over earthly exercises. There is need also of angels who preside over the birth of animals, over the plantation of shrubs and plants and the rest of the increases of the fields. And again there is need of angels who preside over holy works, who teach the understanding of the eternal light and the acknowledgment of the hidden things of God and the knowledge of divine things. See, therefore, that you do not make yourself to be found among those angels who are set over the beasts, if you lead a beastly life, or among those who are set over earthly works, if you have loved bodily and earthly things. But be diligent, that you may rather be taken up into the fellowship of the angel Michael, who ever offers the prayers of the saints to God. And you will be taken up into this number or into that office, if you persist always in prayer and watch in it and fulfill what the Apostle says: "praying without ceasing." Or certainly that you may be taken up into the fellowship and office of Raphael, who presides over healing; if, when you see someone wounded by sins and pierced by the arrows of the devil, you apply the cure of words and confer the medicine of the word of God, that you may heal the wounds of sin through repentance and show the medicine of confession. He, therefore, who does works of this kind in this world, offers himself to be formed by the maker in the age to come as a vessel of election and useful to the Lord, prepared for every good work; but if he does the contrary, he will offer himself as a vessel unto dishonor to the divine dispensation. And for this reason I think it is that in the divine volumes both the deeds of the good and of the evil are written, and that the divine Scriptures are woven together out of acts both on the left hand and on the right, that we may understand that with God neither the works of the evil nor of the good are idle. But now, after a very long digression, yet one necessary to the matter, let us return to our subject.
'''
