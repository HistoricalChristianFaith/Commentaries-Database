[[commentary]]
quote='''
But what is it that Jesus added: "if you clean out," he says, "the wood, it shall also be yours, when you have exterminated the Canaanite"? We have already said above how the Canaanite, when placed with us, first only "pays tribute," second is made "obedient" and "subject," but third, in the mortification of our members, is said even to be "exterminated." If we understand these things rightly — and the Lord has granted us through his grace to understand them thus — let it be something worth the effort to have brought forth these things from the secret and hidden into the open, and to have come to our recognition of things that were kept covered; and let us endeavor, according to these things which we have said, to subject to ourselves more quickly the Canaanite who is with us and to "make him obedient," and after this even to "exterminate" him; for if we let him go and neglect him, "Pharaoh will come out of Egypt" and will begin to "give our place as a dowry to his daughter" and to "hand us over captive to the law of sin." But far be it from Israelite nobility that an Israelite should serve "Pharaoh's daughter" — one whom "God has already led out of the land of Egypt" — that he should again serve that Pharaoh who was "drowned in the Red Sea." Let us therefore take heed, just as Jesus here also says, that we may prevail against the Canaanites, lest, if perchance they grow strong over us and overpower us, they make Canaanites of us out of Israelites, just as that man too became one whom the enticement of the flesh had overcome, to whom it is said by the prophet: "seed of Canaan and not of Judah, beauty has seduced you." Let it not befall us, then, to hear "seed of Canaan," for: "cursed be the boy Canaan; he shall be a servant to his brothers." But may the Lord grant us that we be sons of Abraham and Isaac and Jacob, "heirs according to the promise," and for this "raised up out of the stones," that we may be sons of Abraham, by Christ Jesus our Lord, "to whom is glory and dominion unto the ages of ages. Amen!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily22.html'
source_title="HOMILIES ON JOSHUA 22.6"
