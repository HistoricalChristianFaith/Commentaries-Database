[[commentary]]
quote='''
But on the "tenth day of the seventh month" is this solemnity of atonement. "On this" day alone the high priest is clothed with all the priestly garments, then he is clothed with "manifestation and truth", then he enters into those inaccessible places, whither it is permitted to approach only "once in the year", that is, into the "holy of holies". For "once in the year" the high priest, leaving the people, enters into that place where is the "propitiatory" and above the "propitiatory" the "cherubim", where is also the "ark of testimony" and the "altar of incense", whither it is lawful for no one to enter except the high priest alone. If therefore I consider my true "high priest" the Lord "Jesus" Christ, how, placed in the flesh, he was with the people throughout the whole year, that year of which he himself says: "he sent me to evangelize the poor and to proclaim the acceptable year of the Lord and the day of remission", I observe how "once in" that "year", on the day of atonement, he enters into the "holy of holies", that is, when, the dispensation being fulfilled, he "penetrates the heavens" and enters to the Father, that he may make him propitious to the human race and entreat for all who believe in him. This atonement of his, by which he makes the Father propitious to men, the Apostle John, knowing it, says: "these things I say, little children, that we may not sin. But even if we have sinned, we have an advocate with the Father, Jesus Christ the righteous; and he himself is the atonement for our sins". But Paul likewise makes mention of this atonement, when he says of Christ: "whom God set forth as a propitiatory in his own blood through faith". Therefore the Day of Atonement remains for us until the sun sets, that is, until the world receives its end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily09.html'
source_title="HOMILIES ON LEVITICUS 9"
