[[commentary]]
quote='''
For this present, momentary, and light tribulation is not spoken of for all, but for Paul and for those who are like him: because they have the perfect charity of God in Christ Jesus poured out in their heart through the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"
