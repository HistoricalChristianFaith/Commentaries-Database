[[commentary]]
quote='''
I hold that in the Proverbs of Solomon these two kinds of judgment (I speak of the one that concerns our faith and knowledge, and of the one that concerns our conduct) are presented by Solomon in the following words: "Who will boast that he has a pure heart? Or who will dare to say of himself that he is clean from sins?" The distinction between these questions we interpret as follows: heart refers to thought, and sins — to deeds. Who will boast that he has a pure heart, which is not defiled by the so-called gnosis, not defiled by falsehood? Or who will dare to say of himself that he is clean from sins, that he has never sinned in deed?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
