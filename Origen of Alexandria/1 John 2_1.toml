[[commentary]]
quote='''
How could Jesus have become an advocate and propitiation without the power of God which completely destroys our weakness, a power furnished by Jesus which flows in the souls of believers?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%25201.html'
source_title="COMMENTARY ON JOHN 1.241"


[[commentary]]
quote='''
Let us consider whether the title advocate ("paraclete") means one thing when applied to the Savior and another when applied to the Holy Spirit. In regard to the Savior "paraclete" seems to mean intercessor, for in Greek it bears both meanings, comforter and intercessor, but according to the phrase which follows, in which it is said that he is the propitiation for our sins, it seems that it must mean intercessor, because he intercedes with the Father for our sins. When used of the Holy Spirit, however, the word paraclete ought to be understood as comforter, because he provides comfort for the souls to whom he opens and reveals a consciousness of spiritual knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25202.html'
source_title="ON FIRST PRINCIPLES 2.7.4"


[[commentary]]
quote='''
My Savior even now mourns my sins. My Savior cannot be glad, so long as I remain in iniquity. Why can he not? Because he himself is "the advocate for our sins with the Father", as John, his fellow-initiate, declares, saying that "even if anyone has sinned, we have an advocate with the Father, Jesus Christ the just; and he is himself the propitiation for our sins". How, then, can he who is "the advocate for" my "sins" drink the wine of gladness, whom I sadden by sinning? How can he who "approaches the altar" that he may make propitiation for me, a sinner, be in gladness, to whom the grief of my sins ever ascends?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
