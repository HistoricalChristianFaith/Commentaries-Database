[[commentary]]
quote='''
When our Lord Jesus Christ came, whose coming that former son of Nave prefigured, he sends his priests, the Apostles, bearing "trumpets of beaten metal," the magnificent and heavenly teaching of preaching. With the priestly trumpet Matthew first sounded loudly in his Gospel; Mark also, Luke, and John each sang with their priestly trumpets; Peter too resounds with the two trumpets of his epistles; James also and Jude. Nonetheless John also adds still further to sound the trumpet through his epistles, and Luke by describing the deeds of the Apostles. But last of all comes that one who said: "for I think that God has set forth us Apostles as the last," and, thundering in the trumpets of his fourteen epistles, he cast down to the very foundations the walls of Jericho and all the engines of idolatry and the doctrines of the philosophers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily07.html'
source_title="HOMILIES ON JOSHUA 7.1"
