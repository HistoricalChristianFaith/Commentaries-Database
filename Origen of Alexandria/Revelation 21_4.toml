[[commentary]]
quote='''
So, then, concerning the devil also it must be understood that he was indeed conquered and crucified, but for those who have been crucified with Christ; but for all believers and for all the peoples alike he will then be crucified, when that shall be fulfilled which the Apostle says, that "as in Adam all die, so also in Christ shall all be made alive." There is therefore in this also the mystery of the future resurrection. For then too the people will be divided into two parts, there will then also be some first and others last, who, when they have conspired together into one under Jesus, then already the devil shall no longer be at all, because "there shall no more be death." … And speaking about the devil he says: "the last enemy that is destroyed is death," because then death is truly "conquered," when "this mortal is swallowed up by life."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily08.html'
source_title="HOMILIES ON JOSHUA 8.4"
