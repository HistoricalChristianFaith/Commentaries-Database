[[commentary]]
quote='''
"For I shall say to him that, as it is written: For your sake we are put to death all the day long; we are accounted as sheep for the slaughter." For it does not suffice me to die for Christ for one hour, or to be tortured, but "all the day long," that is, for the whole time of my life. For if I pass my whole life in persecutions and perils, I shall say that "the sufferings of this time are not worthy of the glory to come, which shall be revealed in us." For brief is the time of this life, and slight is what we spend in persecutions; but eternal and perpetual is what we await in glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
