[[commentary]]
quote='''
He, therefore, who is said to baptize "in the Holy Spirit and in fire", has "a winnowing fork in his hand and he will cleanse his threshing floor; and he will gather his wheat into the granary, but the chaff he will burn with unquenchable fire". I wish to find the reason why our Lord has a "winnowing fork", and by what wind blowing the light chaff is snatched hither and thither, while the heavy wheat is carried down into one place; for neither can the wheat and the chaff be separated without wind. I consider that temptations are to be understood in place of the wind, which out of the mingled heap of believers show some to be chaff, others to be wheat. For when your soul has been overcome by some temptation, the temptation does not turn you into chaff, but, since you were chaff — namely light and unbelieving — the temptation reveals you to be what you were hiding. On the contrary, however, when you bravely endure trials, the temptation does not make you faithful and patient, but it brings out into the open the virtue of patience and fortitude which was in you, but was hidden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily26.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 26"
