[[commentary]]
quote='''
Consider, however, the greatness of the apostolic breast. He cannot be separated from the love of God; what he speaks, he speaks in Christ; what he holds in his conscience is contained by the Holy Spirit. What heavens, I ask, what thrones, what most ample minds of the heavenly powers will be able to contain the whole Trinity in seats so ample? "For," he says, "I have great sadness and continual sorrow in my heart." Very well, you have sadness; very well, you take sorrow at the perdition of your brothers "who are kinsmen according to the flesh"; but is it to such a point that you wish to become anathema from Christ? And what does their salvation profit you, if you are separated from salvation? And how will you save others, if you yourself perish? It is not so, he says: rather, I have learned from my Master and Lord that "he who wishes to save his soul will lose it; and he who loses it will find it." What wonder, then, if the Apostle wishes to become anathema for his brothers, who knows that he who was in the form of God emptied himself of it, and took the form of a servant, and was made a curse for us? What wonder, then, if, when the Lord was made a curse for his servants, a servant should become anathema for his brothers? And this, I think, is what Moses also said to the Lord when the people had sinned: "And now, if indeed you forgive them their sin, forgive; but if not, blot me out of the book of life which you have written." What then? Do you wish Paul to seem inferior to Moses? He asks to be blotted out of the book of life for his brothers; ought Paul not to wish to be anathema for his brothers? But perhaps someone may say that Moses, in offering this, deserved to obtain salvation for the people, whereas Paul indeed wishes it, but was not heard. What if I show you that Paul was heard even more than Moses? For all those who had gone out of Egypt through Moses fell in the desert. But the descendants of those who received the land of promise even now wander from it, exiles and outcasts. But hear what Paul says about Israel: "I do not want you to be ignorant, brothers, of this mystery, that blindness in part has befallen Israel, until the fullness of the Gentiles should enter in, and so all Israel should be saved." You see, therefore, that Paul was heard, and that because he offered himself as anathema, he deserved salvation for his brothers. And therefore it seems to me that he set down all those things beforehand—that he could by no power be torn away from the love of God—so that when he offers himself as anathema for his brothers, you should not judge his fall to be possible: but just as he who is inseparable from the Father by nature, and immortal, came into death and descended into the lower regions, so this man too, imitating his Master, though he cannot be separated from the love of Christ, becomes anathema from Christ for his brothers—by devotion, certainly, not by transgression. But that the Israelites are Paul's "kinsmen according to the flesh" needs no exposition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
