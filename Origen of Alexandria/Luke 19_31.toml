[[commentary]]
quote='''
There were then many masters of this colt, before that the Saviour had need of him. But as soon as He began to be the master, there ceased to be any other. For no one can serve God and mammon. (Matt. 6:24.) When we are the servants of wickedness we are subject to many vices and passions, but the Lord has need of the colt, because He would have us loosed from the chain of our sins.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And so the "colt of the donkey", once untied, is led to Jesus, and in sending his disciples to untie it he had said: "If anyone asks you: why do you untie the colt? say to him: because the Lord has need of it". There were many masters of this colt before the Savior had need of it; but after he began to be its "master", they ceased to be many masters; for no one "can serve God and mammon". When we serve wickedness, we are subject to many passions and vices. The colt, therefore, is untied, "because the Lord has need of it". And now the Lord "has need" of the colt. You are the colt of the donkey. What does the Son of God "have need" of that is yours? What does he seek from you? He "has need" of your salvation, he desires that you be loosed from the chains of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily37.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 37"
