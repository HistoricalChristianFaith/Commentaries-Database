[[commentary]]
quote='''
The prophet declares that "righteousness" is a living thing and alive, and we used to think that it had been said by the Apostle alone that Christ is "righteousness and sanctification and redemption and wisdom". But perhaps the Apostle too, instructed by the prophets, knew "righteousness" to be a living being and alive. What is this "righteousness"? "The only-begotten God". But that it did not originate with the Apostle that Christ is "righteousness", and a living and subsisting "righteousness", but rather that, finding it in the prophetic words, he set forth this mystery for us, is certain from the chapter at which our reading has now come to rest. For it says: "Who made righteousness rise up from the east, and called it to his feet?". He "called" "righteousness"; it is plain that it is a living being, if it walks when "called". And the Father "called" Christ, because for our salvation he had made his way to us and had "come down from heaven" to us: "for no one has ascended into heaven except him who came down from heaven, the Son of man". He "called" him "from the east", not from this sensible east, but "from the east" of the true light. Wherefore it is written: "Who made righteousness rise up from the east, and called it to his feet?". The Father "called" the Son — or rather, to speak truly, God called man — he "called righteousness to his feet", that is, the incarnation of his Son. Therefore also "we adore the footstool of his feet", according to what is written: "Adore the footstool of his feet, for it is holy", since indeed the flesh of the Lord takes on the honor of the Godhead. But because the beginning of the reading requires a loftier exposition, let us pray to the highest King, that the word, which had gone away "called", may return to us again, and let us set forth a few things according to our ability.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily05.html'
source_title="HOMILIES ON ISAIAH 5"
