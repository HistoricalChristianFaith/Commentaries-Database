[[commentary]]
quote='''
But he who is not yet perfect doubts concerning himself, as though he too could fall; according to which human weakness Paul, writing to the Corinthians, said: "but I chastise my body and bring it into servitude, lest perhaps, having preached to others, I myself be made reprobate". And see: what he says, "lest perhaps, having preached to others, I myself be made reprobate", he so pronounces as one fearing, lest perhaps he too could both fall and become reprobate; but what he said, "I am confident that neither death nor life" and the rest, is of a confident and firm man on account of his perfection, since a thousand contrary things have not the strength to separate him "from the love of Christ". And to such as these it is not unfitting to say always: "do not glory in the Lord, for you do not know what the coming day may bring forth". But recalling all these things, that we do not know "what the coming day may bring forth" for us, we shall not be puffed up, nor be proud, nor ever glory, although we know that we have many good things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252026.html'
source_title="COMMENTARY ON MATTHEW 81"
