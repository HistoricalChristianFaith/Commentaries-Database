[[commentary]]
quote='''
A good word is one that is for building up need, giving grace to those who hear — the word that is instructive and exhortative toward virtue, but strips away vice; whereas a rotten word is one that helps vice grow and provokes toward what is worse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Ephesians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON EPHESIANS FRAGMENT XXI"
