[[commentary]]
quote='''
Being of the same mind toward one another. This saying has been made obscure not by its own nature, but by the translation. For what he says is this: that we should feel toward a brother as toward our very selves, and should will for our neighbor what we will for ourselves; as the Lord also says in the Gospel: Whatever you wish that people should do to you, do the same also to them. Not being high-minded, but consenting to the humble. He teaches that pride is in every way to be fled; for this is what "to be high-minded" means. And rightly is pride to be fled, since Scripture says that the beginning of departing from God is pride. And well has he set forth the training in humility in a single word; for to consent to the humble, and to love the humble, and to bend oneself down to them — this is to accustom oneself to imitate him who, though he was in the form of God, took the form of a servant, and humbled himself even unto death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"

[[commentary]]
quote='''
Be not wise in your own eyes. He who seems wise to himself is, along with his arrogance, a fool; nor can he know the true wisdom of God, who cultivates his own folly as if it were wisdom. And indeed, in what has gone before, Paul himself taught that this was the cause of unbelief for the Jews, saying of them that, being ignorant of the righteousness of God, and seeking to establish their own righteousness, they were not made subject to the righteousness of God. So then, he too who is wise in his own eyes cannot be wise in God's eyes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
