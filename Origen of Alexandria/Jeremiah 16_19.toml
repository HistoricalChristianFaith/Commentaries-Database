[[commentary]]
quote='''
"Lord, my strength and my help and my refuge in the day of evils; to you the nations shall come from the end of the earth and shall say: As false things did our fathers acquire idols, and there is no profit in them." From the end of the earth the nations came to God, and the nations have said: "As false things did our fathers acquire idols, and there is no profit in them"? How "from the end of the earth"? There are some who are first of the earth and there are some who are last of the earth. Who are the first? "The wise of the world" are first of the earth, not simply first; "the wise of the world, the well-born," the rich, the men of rank. Who are the last? "The foolish things of the world God has chosen, the base things, the things despised, the things that are not." "The nations shall come," then, "from the end of the earth," as if he said: from the last of the human beings on earth, from the foolish, from the base, from the despised, "and they shall say: As false things did our fathers acquire idols, and there is no profit in them." Not that there are some true idols, in contradistinction to which the false ones are spoken of, but idols which are by nature false; "and there is no profit in them."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily16.html'
source_title="HOMILIES ON JEREMIAH 16"
