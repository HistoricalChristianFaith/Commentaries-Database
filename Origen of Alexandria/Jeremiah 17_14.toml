[[commentary]]
quote='''
Then again there is a prayer that runs thus: "Heal me, O Lord, and I shall be healed; save me, and I shall be saved, for you are my boast. Behold, they say to me, 'Where is the word of the Lord? Let it come.' But I have not grown weary in following after you, and I have not desired the day of man, you know it." To him alone who came for the sake of those who are sick, the physician who says, "Those who are strong have no need of a physician, but those who are sick," everyone who wishes to be cured of the sickness of his soul may confidently say, "Heal me, O Lord, and I shall be healed." But if anyone else besides him professes the healing of souls, you would not be speaking truly if you said to that one, "Heal me, O Lord, and I shall be healed." For that woman too who "had a flow of blood" spent "all that she had" on the physicians, and "was not able to be healed by any of them"; for to none of those was it reasonable to say, "Heal me, O Lord, and I shall be healed," but only to the one whom it suffices to touch "the fringe of his garment." I say therefore to this one: "Heal me, O Lord, and I shall be healed"; for if you heal, the end will follow upon the healing that comes from you, the cure, so that I may be saved. But however many others may save, I shall not be saved; but the only and true salvation is if Christ saves, since then I shall be saved. "A horse is false for salvation," and false too are all the other things apart from God for salvation. Therefore I would say to him: "Save me, O Lord, and I shall be saved." And I say this, if I am also able to say what follows by having renounced every boast, so that I may say, "For you are my boast," or when I fulfill the commandment that says, "Let not the wise man boast in his wisdom, nor the strong man in his strength, nor the rich man in his riches, but rather let him who boasts boast in this, to understand and to know that I am the Lord." Blessed therefore is he who has renounced all boasting here below, such as in what is called nobility of birth and in beauty and in bodily things, in wealth, in glory, and who is content with one boast, so that he may say, "For you are my boast."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily17.html'
source_title="HOMILIES ON JEREMIAH 17"
