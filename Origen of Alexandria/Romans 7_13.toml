[[commentary]]
quote='''
"That, then, which is good," he says, "is it death to me? God forbid!" He refutes an objection that necessarily arises, and says: It is not that the good of the law and of the commandment brought death upon me; "but sin," he says, "that it might appear" how wicked it is, "through what is good wrought death in me." For the commandment is good when it is kept: but if it is not kept, it will necessarily be an evil to him who has lost the good. Therefore "sin itself becomes a sinner beyond measure" by occasion of the commandment. We said above too that he fashioned, as it were, a personification of sin, and says of it that sin itself — of whose person he speaks — was made a sinner beyond measure by occasion of the commandment. For it is less of a sin if you commit what is not forbidden. But if you commit things vetoed and prohibited, you are, so to speak, a sinner beyond measure: because you have not only done what you ought not, but you have also transgressed a precept. But as for our saying "sin is a sinner," we preferred to admit a fault of language rather than not express the Apostle's meaning in its entirety: because in the Latin tongue the noun for sin (peccatum) has confined us, since it is declined in the neuter gender, whereas in Greek it is feminine; and therefore we have called it a sinner in the masculine (peccator): for there it can be called a sinner in the feminine (peccatrix).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
