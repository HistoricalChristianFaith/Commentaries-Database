[[commentary]]
quote='''
But all these things were mentioned first, in order that after the recovery of sight from blindness, after deliverance from captivity, after being healed of divers wounds, we might come to the acceptable year of the Lord. As it follows, To preach the acceptable year of the Lord. Some say that, according to the simple meaning of the word, the Saviour preached the Gospel throughout Judæa in one year, and that this is what is meant by preaching the acceptable year of the Lord. Or, the acceptable year of the Lord is the whole time of the Church, during which while present in the body, it is absent from the Lord.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"To preach the acceptable year of the Lord". According to the simple understanding they say that the Savior preached the Gospel in Judea for one year, and that this is what is said: "to preach the acceptable year of the Lord and the day of retribution", unless perhaps the divine word signifies something of a mystery in the preaching of the year of the Lord. For there are to be other days, not such as we now discern in the world, and other months, and a different order of the Kalends. Just therefore as those are other, so also the year of the Lord to come is pleasing. But all these things have been foretold, that after sight from blindness, after liberty from chains, after health from diverse wounds, we may come to the "acceptable year of the Lord".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily32.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 32"
