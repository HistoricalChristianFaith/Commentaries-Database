[[commentary]]
quote='''
For this reason it seems to me that the Savior answered the Nazarenes who questioned him consequently and in due order: "no prophet is accepted in his own homeland". And I think that what is said is more true according to the sacred meaning than according to the letter. Granted that Jeremiah too was not accepted in Anathoth his homeland, and Isaiah, whatever his homeland was, and the rest of the prophets; but it seems to me better to understand it thus, that we should say the homeland of all the prophets was the people of the circumcision, and that this people did not receive the prophets and their prophecies, whereas the nations, which had been far from the prophets and had no knowledge of them, received the prophecy of Jesus Christ. "No prophet" therefore "is accepted in his own homeland", that is, among the people of the Jews. But we, who were strangers to the covenant and foreigners to the promises, have received the prophets with our whole heart, and we "have Moses and the prophets" preaching about Christ more than they do, who, from the fact that they did not receive Jesus, did not receive either those who announced concerning him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily33.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 33"
