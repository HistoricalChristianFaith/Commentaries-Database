[[commentary]]
quote='''
But how does he add again, as though speaking to men: "Let water be taken," he says, "and let your feet be washed"? Through these things indeed Abraham, the father and teacher of the nations, teaches you how you ought to receive guests and that you should wash the feet of guests; yet this too is said in a mystery. For he knew that the dominical sacraments are not to be consummated except in the washing of feet. But neither did the weight of that precept escape him, in which it is said by the Savior: "If any will not receive you, shake off even the dust which has clung to your feet, as a testimony against them. Amen I say to you that it will be more tolerable for the land of Sodom in the day of judgment than for that city." He wished therefore to anticipate and to wash their feet, lest perhaps any dust should remain which, shaken off as a testimony of unbelief, could be reserved "for the day of judgment." Therefore the wise Abraham says: "Let water be taken and let your feet be washed."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.2"
