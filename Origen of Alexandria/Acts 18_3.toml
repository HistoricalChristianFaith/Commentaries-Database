[[commentary]]
quote='''
But the tents can be referred to perfect souls, to which the name Israel too fits, from seeing God. But these tents are, he says, "like shady groves, and like gardens beside rivers, and like the tents which the Lord has pitched." Therefore he shows that there are other tents which the Lord has pitched, to which the tents of Israel are like. It befits me to go forth outside this world, in order that I may see what are the tents which the Lord has pitched—those, no doubt, which he showed to Moses, when he was building the tabernacle in the desert, saying to him: "See," he says, "that you make all things according to the type which was shown you on the mountain." Therefore, in imitation of these tents which the Lord pitched, Israel ought to make tents, and each one of us to prepare and construct his own tent. Hence it seems to me not to have happened by chance that Peter indeed and Andrew and the sons of Zebedee were found fishermen by trade, but Paul a tentmaker by trade. And since those, called from the trade of catching fish, are changed and become fishers of men, the Lord saying: "Come after me, and I will make you fishers of men," there is no doubt that Paul too, since he also was called an Apostle through my Lord Jesus Christ, was changed by a similar transformation of his trade, so that, just as they from fishers of fish were made fishers of men, so this man too was transferred from making earthly tents to constructing heavenly tents. For he constructs heavenly tents, teaching each one the way of salvation and showing the road of the blessed mansions in the heavens. Paul makes tents when, from Jerusalem round about as far as Illyricum, he fills up the Gospel of God by constructing churches; and in this manner he too makes tents after the likeness of the heavenly tents which God showed to Moses on the mountain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily17.html'
source_title="HOMILIES ON NUMBERS 17.4"
