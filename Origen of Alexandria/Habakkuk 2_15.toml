[[commentary]]
quote='''
What, then, must we do, who have received from Paul, the teacher of the Church, institutions of understanding of this kind? Does it not seem just that we should keep the rule of this kind handed down to us by a like example in the rest? Or shall we, as certain people wish, forsaking these things which so great and such an Apostle handed down, turn back again to "Jewish fables"? For my part, if I should expound these things otherwise than as they seem to Paul, I think this is to give a hand to the enemies of Christ, and this is what the prophet says: "Woe to him who gives his neighbor to drink with turbulent overthrow!" Having therefore received from the blessed Apostle Paul the seeds of spiritual understanding, let us cultivate them, insofar as the Lord shall deign to enlighten us through your prayers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily05.html'
source_title="HOMILIES ON EXODUS 5"
