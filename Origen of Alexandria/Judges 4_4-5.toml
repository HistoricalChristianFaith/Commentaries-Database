[[commentary]]
quote='''
We pass from questions to questions and from mysteries to mysteries, and while we can scarcely and with difficulty explain each of the first things, more difficult matters follow upon the difficult ones — matters which do not so much require the eloquence of human talent as they demand the inspiration of divine grace. For without doubt the hearer will ask — since indeed there is that saying of the Apostle Paul which declares: "all Scripture divinely inspired is useful for teaching, for reproof, for instruction which is in righteousness" — what this Scripture has in itself (which we likewise without doubt confess to be divinely inspired) that may yield to us "for instruction," that may yield "for reproof," that may yield "for discipline," that may yield "for righteousness." For what is conferred upon us from this, if we read what has just been recited — that is, that "Deborah," it says, "a woman, a prophetess, the wife of Lapidoth, she herself judged Israel at that time; and she," it says, "Deborah, sat under a palm tree between the middle of Ramah and the middle of Bethel, on Mount Ephraim, and the sons of Israel went up to her, that they might be judged"? And then, what erudition or teaching or righteousness do those things confer upon us which follow, whether concerning Barak or concerning Jael or even concerning Sisera, "the commander of the army of Jabin"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily05.html'
source_title="HOMILIES ON JUDGES 5"
