[[commentary]]
quote='''
"And he took him," it says, "to the lookout of the field, to the top of the hewn mountain, and there he built seven altars, and placed a calf and a ram upon the altar. And Balaam said to Balak: Stand by your sacrifice, but I will go to inquire of God. And God met Balaam, and put a word into his mouth and said: Without doubt, return to Balak, and you shall speak these things. But he — that is, Balak — was standing beside his burnt offerings, and all the princes of Moab with him. And Balak said to him: What has the Lord spoken?" The matter indeed is carried on with profane sacrifices, and divination is sought by magical art; yet God, willing that grace should abound there where sin had superabounded, deigns to be present and does not flee from these things which were being done not according to Israelite discipline but according to the error of the gentiles. But he is present not to the sacrifices, but to the one coming to meet him, and there he gives his word and there foretells the mysteries to come, where above all the faith and wonder of the gentiles hangs, so that those who are unwilling to believe our prophets may believe their own soothsayers and seers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily16.html'
source_title="HOMILIES ON NUMBERS 16.1"
