[[commentary]]
quote='''
His divinity seems, properly according to scripture, to be named his 'glory'. And God is rich in a divinity that is great and hard to grasp for created nature; imparting, then, from this riches of his divinity and glory to those to whom he judges it must be imparted—power and might—he strengthens with power through his Spirit; and he strengthens by settling Christ into the inner man that has room for him. And the most paradoxical thing: Christ, though he is whole and lives in himself, also dwells in those who partake of him; and he dwells through faith in the inner man, that is, in the governing faculty; for he adds, in your hearts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Ephesians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON EPHESIANS FRAGMENT XV"
