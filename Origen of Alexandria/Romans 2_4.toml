[[commentary]]
quote='''
"Or do you despise the riches of his goodness, and forbearance, and patience? Do you not know that the kindness of God leads you to repentance?" That man can recognize the riches of God's goodness who considers how many evils men commit daily upon the earth, and how nearly all have turned aside and together become unprofitable, and walk the broad and spacious road of perdition, neglecting the narrow way of life — and yet, for all these, God daily brings forth his sun and supplies the rains; and he who considers how many blaspheme God daily, and stretch out their tongues against heaven. And what shall I say now of frauds, of violence, of crime, of sacrileges and of deeds requiring expiation? Yet among all these, in this passage, those seem to be given precedence in wickedness who, while judging others, themselves commit the very things they punish in the rest. If, therefore, anyone despises this goodness of God, and his forbearance, and his patience, he does not know that through these he is being summoned to repentance. But forbearance seems to differ from patience in this, that those who sin more from weakness than from deliberate purpose are said to be borne with; whereas those who with obstinate mind, as it were, exult in their offenses must be said to be endured patiently. But just as God made all things in measure and weight and number, so also there is a fixed measure of his patience — a measure which we must believe was filled up either by those who perished in the flood, or by those who were destroyed in Sodom by fire from heaven. Whence it is also said concerning the Amorites: "For the sins of the Amorites are not yet filled up until now." God therefore bears patiently, and awaits the repentance of each one. But let this not make us lax and slow to conversion, since there is again a fixed measure of his patience and forbearance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook02.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
