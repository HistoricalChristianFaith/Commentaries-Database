[[commentary]]
quote='''
For if Mary had known that similar words had been addressed to others, such a salutation would never have appeared to her so strange and alarming.
When the angel saw that she was troubled at this unusual salutation, calling her by her name as if she was well known to him, he tells her she must not fear, as it follows; And the angel said, Fear not, Mary.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For if Mary had known that such a word had been spoken to any other as well — for she had knowledge of the Law and was holy and had come to know the oracles of the prophets by daily meditation — the greeting would never have terrified her as something strange.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily06.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 6"
