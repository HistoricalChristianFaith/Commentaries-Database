[[commentary]]
quote='''
He followed evidently as a wrestler, gladly setting out to meet the temptation, and saying, as it were, Lead me where you will, and you will find me the stronger in every thing.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Search the Scriptures, so that even in those things which are thought to be simple you may discover mysteries that are by no means small. Let us search the beginning of the Gospel reading which we have heard today, and let what was hidden come forth into the open. "He brought," it says, that is, the devil brought Jesus "into Jerusalem." This is incredible, that the devil should lead the Son of God and that he should follow. Yet he clearly followed, like an athlete going of his own accord to the contest. He did not dread the tempter, nor was he afraid of the snares of the craftiest of enemies, and in a certain manner he was saying: lead where you wish, tempt as you please, of my own accord I give myself over to be tempted, I endure whatever you may suggest, I offer myself in whatever you may try: you will find me stronger in all things. "He brought him therefore into Jerusalem, and set him upon the pinnacle of the temple, and said to him: if you are the Son of God, cast yourself down from here." He brought him up to the top, to the summit of the temple, and urges him to throw himself down from there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily31.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 31"
