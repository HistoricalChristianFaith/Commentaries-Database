[[commentary]]
quote='''
That there are also some souls that conceive offspring, the prophet made clear when he said: "from fear of you, Lord, we conceived in the womb and travailed and gave birth to a spirit of salvation which you made upon the earth". For just as in those who are pregnant the seed is formed and shaped, so also in the soul that receives the word, the conception of the word is gradually formed and shaped within it. And this I think is what Paul says to the Galatians: "my children, whom I again bring forth in travail until Christ be formed in you", which is as though he were to say: until the word be formed and made manifest in you. In the epistle to Timothy he says likewise that a woman shall be saved "through the bearing of children, if she abide in faith and love and holiness with chastity". But who is this woman, if not the soul that conceives the word of God and of truth, and gives birth to good works like to Christ? But it is irrational to suppose that what he says was said of a bodily bearing: "the woman, being seduced, fell into transgression; but she shall be saved through the bearing of children, if she abide in faith and love and holiness with chastity". Therefore the souls that have newly received the word and, being still established as pregnant, have not yet borne fruit in it, having it intelligibly in the womb, cannot endure the discourse that stands "in the holy place" opposing the truth, nor stand firm so as not to be seduced by its persuasions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252024.html'
source_title="COMMENTARY ON MATTHEW 43"

[[commentary]]
quote='''
And by "sight" we mean the sight of the Word and of wisdom and of truth and of righteousness and of peace and of everything whatsoever that is the only-begotten of God. And you will understand the sight of the Word and the sight of wisdom when you have understood what the Apostle says: "my children, of whom I am again in travail until Christ be formed in you". For understanding Christ formed in someone, you will consequently, according to a formation of this kind, see also the sight of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252025.html'
source_title="COMMENTARY ON MATTHEW 65"

[[commentary]]
quote='''
The pregnant woman is said to be the soul which has recently conceived the word of God. Now concerning such a conception we read it written also in another place: "from fear of you, O Lord, we have conceived in the womb, and we have given birth." Those, therefore, who conceive and immediately give birth—these are to be reckoned not as women, but as men, and perfect men. Hear, finally, also the prophet saying: "if the earth has given birth in one day, and a nation has been born at once." This is the generation of the perfect, which is born immediately, on the same day, as soon as it has been conceived. But lest it seem new to you that we have said men give birth, we have already long since set forth how you ought to take the names of the members, that you may withdraw from bodily senses and grasp the understanding of the inner man. But if you wish that I satisfy you still further in this also from the Scriptures, hear the Apostle saying: "my little children, whom I again bring forth in travail, until Christ be formed in you." Perfect, therefore, and strong men are those who immediately, as soon as they conceive, give birth—that is, those who bring the conceived word of faith forth into works. But the soul which conceives and retains in the womb and does not give birth, this one is called a woman, just as the prophet also says: "the pains of childbirth have come upon her, and the power of giving birth is not in her." This soul, then, which now on account of its weakness is called a woman, when two men are quarreling with one another and in the contest bringing forth stumbling-blocks—which the contention of words is always wont to have—is struck and scandalized, so that it casts out and loses the word of faith which it had faintly conceived; and this is the quarrel and contention "unto the subversion of the hearers." If, therefore, the soul which has been scandalized casts out the word not yet formed, he who scandalized it is said to suffer loss. Do you wish to know that in some the word is formed, in some not yet formed? The word of the Apostle plainly teaches us, which we recalled above, when he says: "until Christ be formed in you"; but Christ is the Word of God. By this he shows that at the time when he was writing, the Word of God was not yet formed in them; if, therefore, it comes forth not yet formed, he shall suffer loss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily10.html'
source_title="HOMILIES ON EXODUS 10"


[[commentary]]
quote='''
Let teachers therefore hear, lest perhaps they entrust the words of God to a "defiled" soul, to a "harlot" soul, to an unfaithful soul, lest perhaps they cast "what is holy to the dogs and pearls before swine", but let them choose clean souls, "virgins" "in the simplicity of the faith which is in Christ", let them commit to them the secret mysteries, let them speak forth to them the word of God and the hidden things of faith, that in them "Christ may be formed" through faith. Or do you not know that from this seed of the word of God which is sown, Christ is born in the heart of the hearers? For the Apostle too says this: "until Christ be formed in us". The soul therefore conceives from this seed of the word and forms the conceived word within itself, until it brings forth the spirit of the fear of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily12.html'
source_title="HOMILIES ON LEVITICUS 12"
