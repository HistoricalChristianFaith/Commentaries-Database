[[commentary]]
quote='''
But if we wish to pursue each point, we shall be shut out from the discussion of those things which were read to us concerning Balaam; the reading of which is of such difficulty that we can scarcely arrive at explaining the account and sequence of the history itself. How great, then, will now be our difficulty in explaining the spiritual senses, if the very surface of the letter is wrapped in such great difficulties? But although desire snatches us toward discussing the things which are more obscure, nevertheless these things also, which are reported in between, are not to be entirely passed over. For after the sons of Israel had obtained the cities of the Amorites, they went up also by the way which leads into Bashan, where Og, king of Bashan, was; but to this one they neither deign to send envoys nor to ask of him that they may pass through his land, but immediately they clash with him and overcome both him and his people. Let us see, then, what Bashan is. Bashan is interpreted "baseness"; rightly, then, are neither envoys sent to that nation nor is passage through its land requested. For there ought to be for us no passage, no approach to baseness, but from the very beginning at once it must be assaulted and in every way guarded against. Now Og, who is said to be king of Bashan, is interpreted "enclosure." This can hold the figure of all carnal and material things, by love and desire of which the soul, being held fast, is shut out and separated from God. Against these, therefore, war is commanded to be waged in such a way that "you shall not leave," he says, "of him one living"; for none must be left by the sons of Israel living in the kingdom of baseness and disgrace. But it befits Israelite virtue to cut down and cut away base things and to rebuild in the soul whatever is pious and to plant honorable and religious things. Concerning the kingdom of Sihon it is not written that no living one be left, nor concerning the kingdom of Moab; for perhaps we have need of some of them, and we require certain of them for the contests and exercises of this life; otherwise we should have had to go out of this world. Of Bashan, however—that is, of baseness—we have need of none whatsoever; let us leave nothing of it; all things must be cut down, all the works of baseness must be overturned; for in nothing can that which is base be honorable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily13.html'
source_title="HOMILIES ON NUMBERS 13.3"
