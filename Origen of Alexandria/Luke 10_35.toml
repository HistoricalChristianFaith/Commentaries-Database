[[commentary]]
quote='''
Or the two pence seem to me to be the knowledge of the sacrament, in what manner the Father is in the Son, and the Son in the Father, which is given as a reward by the Angel to the Church that she may take more diligent care of the man entrusted to her whom in the shortness of the time He Himself had also cured. And it is promised that whatever she should spend on the cure of the half dead man, should be restored to her again, And whatsoever thou spendest more, when I come again I will repay thee.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when he wished to set out in the morning, from his tested silver, from his tested money, he "takes out two denarii" and pays the innkeeper — without doubt the angel of the Church — whom he charges to tend him carefully and to bring him through to health, the one whom, because of the shortness of time, he himself also had tended. The "two denarii" seem to me to be the knowledge of the Father and the Son and the understanding of the mystery — how the Father is in the Son and the Son in the Father — which is given as a kind of wage to the angel, that he may more diligently tend the man commended to him; and it is promised to him that whatever of his own he shall have spent for the healing of the half-dead man is to be repaid forthwith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily34.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 34"
