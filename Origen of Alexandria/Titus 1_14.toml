[[commentary]]
quote='''
But let us see what rule of understanding concerning these things Paul the Apostle has handed down to us. Writing to the Corinthians, he says in a certain place thus: "For we know that our fathers were all under the cloud, and all were baptized into Moses in the cloud and in the sea, and all ate the same spiritual food, and all drank the same spiritual drink. For they drank of the spiritual rock that followed them; and the rock was Christ." You see how much Paul's tradition differs from the historical reading: what the Jews think a crossing of the sea, Paul calls baptism; what they reckon a cloud, Paul sets down as the Holy Spirit; and he wishes that to be understood as like this which the Lord commanded in the Gospels, saying: "unless a man be born again of water and the Holy Spirit, he cannot enter into the kingdoms of heaven." And again the manna, which the Jews reckon food for the belly and satiety for the gullet, Paul names "spiritual food." And not only Paul, but the Lord Himself in the Gospel says concerning the same thing: "your fathers ate manna in the desert, and they died. But whoever shall eat of the bread which I give him shall not die for ever." And after this He says: "I am the bread which came down from heaven." Then, further, concerning "the rock that followed" Paul openly declares and says: "and the rock was Christ." What, then, must we do, who have received from Paul, the teacher of the Church, institutions of understanding of this kind? Does it not seem just that we should keep the rule of this kind handed down to us by a like example in the rest? Or shall we, as certain people wish, forsaking these things which so great and such an Apostle handed down, turn back again to "Jewish fables"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily05.html'
source_title="HOMILIES ON EXODUS 5"


[[commentary]]
quote='''
But the apostles, who were about to say, "If you are circumcised, Christ will profit you nothing," and who were also about to say, "Let no one judge you in food, or in drink, or in participation of a feast day, or in new moons, or sabbaths, which are shadows of what will be," they are prohibited from having two tunics so that they might inwardly and completely repudiate observances of this kind according to the letter of the law and not concern the disciples "with Jewish myths" and "place a yoke on them which neither they nor their fathers would have been able to bear." But one is sufficient for them, and this one "inward." For they do not want this tunic of the law that is external but that which comes from above. For Jesus permits them to have one, and that one is "interior."
'''
source_url='https://www.google.com/books/edition/Homilies_on_Leviticus_1_16/Eo9Da7xaBuUC?hl=en&gbpv=1&dq=homilies+on+leviticus+origen&printsec=frontcover'
source_title="HOMILIES ON LEVITICUS 6.3"
