[[commentary]]
quote='''
And it came to pass that on the same road there went down first a "priest", then a "Levite", who had perhaps done certain good things to other men, yet not to this one who had gone down "from Jerusalem to Jericho". For the "priest" saw him — the law, I think — the "Levite" saw him — the prophetic word, as I suppose — and when they had seen him, they passed by and left him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily34.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 34"
