[[commentary]]
quote='''
Many things drawn from bodily foods are named in the scriptures for spiritual nourishment. Again, in Proverbs it is written concerning "honey": "finding honey, eat what is enough, lest perchance being full you vomit it up." And did the Holy Spirit take care about that "honey" which is commonly known, "lest perchance" we "eat" too much? But the Holy Spirit, surely knowing spiritual "honey," says: "finding honey, eat what is enough." But with what understanding did the Holy Spirit enjoin upon us that, "if we have found honey" — since "honey" is indeed findable — "we should eat what is enough"? "Go," he says, "to the bee and learn how she is a worker." And the prophets are found to be "bees," for they fashion wax and make "honey," and, if it is fitting for me to venture to say it, their "honeycombs" are the scriptures which they have left behind. And if you are willing, come to the scriptures and you will find "honey." And perhaps the finer letters will be "honeycombs"; but the "honey" is the understanding that is in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily02.html'
source_title="HOMILIES ON ISAIAH 2"
