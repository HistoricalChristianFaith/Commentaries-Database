[[commentary]]
quote='''
Therefore the passage of Scripture of which we now speak runs thus: "And it shall be," it says, "that the man, whomsoever I shall choose, his rod shall bud." This alone is what God promised: that the rod of the one whom he should choose would bud. But when it comes to the point, so that what was promised may be shown to be fulfilled, it is not said that only that one thing which had been promised was accomplished, but see how much is added. For it says: "And behold, the rod of Aaron budded in the house of Levi." This is without doubt that one thing which had been promised, but other things too are added, and it is said: "and it produced leaves and put forth flowers and budded nuts." Therefore, although the promise had been of budding alone, see how much God bestows: that he produced not only a bud, but also leaves, and not only leaves, but also flowers, and not only flowers, but also fruits. What then is it that we ought to gather and contemplate from these things? First of all, the mystery of the resurrection from the dead; for the dry rod buds, when the extinguished body has begun to come to life again. But what are those four things which will be granted to the rising body? That what is sown in corruption may rise in incorruption, and what is sown in weakness may rise in power, and what is sown in dishonor may rise in glory, and the body sown a natural body may rise a spiritual body. These are the four things which the rod of our dry body will put forth in the resurrection. But this too we shall say in the second place: that, just as in these matters God gave his promise fourfold and bestowed far more and more precious things than he had promised, so much more, in all the places of Scripture where any promise of God is contained—if indeed anyone should deserve to attain to it—in the future manifold provision will be made; and thus that will be truly fulfilled which the Apostle says: "Eye has not seen, nor ear heard, nor has it entered into the heart of man, the things which God has prepared for those who love him." See therefore how many and of what kind are the things which not only was no one permitted to see and to hear, but which could not even enter into the heart, that is, into human thought. Whether therefore you name the earth or the heaven, or this sun and the brightness of visible light, all these the eye has seen and the ear has heard, and they cannot be among those things which the eye has not seen nor the ear heard nor which have entered into the heart of man. Pass beyond therefore all these things and transcend everything—whatever you see, whatever you hear, whatever also you can think—and know that that is laid up for those who love God which could not enter even into the thought of your heart. Whence I judge that in promises of this kind nothing is to be thought concerning bodily things. For the account of bodily matter would not altogether escape the perception of human thought, but those are the things which can enter into no one's perception, no one's heart, which are contained in the wisdom of God alone. But indeed it will seem that, by this reasoning by which the good things of the promises are given in greater measure than they were promised, likewise also the punishments which are threatened to sinners must be inflicted with multiplied torments, just as we also expounded in the earlier passages, where a year is set for a day in respect of vengeance—unless someone should think that some third thing can come to pass, gathering some consolation from those things which are contained in that threat which was made to David, where the coming devastation of death was pronounced for three days, and within six hours the time of the punishment appears to have been shortened. But these things can avail there, where time for repentance and place for satisfaction is granted. Yet God is written of as repaying the evil indeed unto the third and fourth generation, but showing mercy to the good not only unto the third and fourth generation, but, as the Scripture says, unto a thousand generations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily09.html'
source_title="HOMILIES ON NUMBERS 9.8"

[[commentary]]
quote='''
But let us return to the things which we had begun to say about the rods. We can still further understand thus the differences of those things which had budded on the rod. Everyone who believes in Christ first dies and after this is born again; and this too is a figure, that the dry rod afterward buds. The first bud, therefore, is a man's first confession in Christ. Secondly it puts forth leaves, when, born again, he has received the gift of grace from the sanctification of the Spirit of God. Then it brings forth flowers, when he has begun to make progress and to be adorned with sweetness of character and to pour out the fragrance of mercy and kindness. At the last also it even brings forth the fruits of righteousness, by which he not only himself may live, but may also afford life to others. For when he has come to perfection and has put forth from himself the word of faith, the word of the knowledge of God, and has won others, this is to have brought forth fruits by which others are nourished. So therefore each one of the believers buds from the rod of Aaron, who is Christ; and these four differences of theirs are in other places of Scripture designated as it were four ages, which John the Apostle in his epistle comprehends with a mystical distinction: for he says: "I have written to you, children," and: "I have written to you, adolescents," and: "I have written to you, young men," and: "I have written to you, fathers." In which he assuredly sets forth not bodily ages, but the differences of the soul's advances, as we have observed to be designated also in this budding of the priestly rod. All these things therefore are contained not so much in the rod of Aaron as in that rod which came forth from the root of Jesse, and the flower ascended from its root, upon which the Spirit of God rests. In which this very thing too does not seem idle, that the rod is said to come forth and the flower to ascend. For although Christ is one in substance, yet to individuals he is made diverse, according as the one in whom he works has need. He therefore who is more sluggish and more negligent, for his discipline Christ becomes for him a rod, and in the rod he is said not to ascend, but to come forth. For he who is idle and sluggish must go forth from that state in which he does not rightly stand, and must pass over to another state, being driven as it were by a rod, that is, being admonished by the severity of a more rigorous teaching; but he who is righteous—because the righteous flourishes like a palm—in him Christ is said to ascend. So therefore for him who has need of stripes, the rod goes forth to him; but for him who advances toward righteousness, it ascends for him into a flower. And it ascends, until it brings forth the fruits of the spirit, which are love, joy, peace, patience, and the remaining virtues, in Christ Jesus our Lord, to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily09.html'
source_title="HOMILIES ON NUMBERS 9.9"
