[[commentary]]
quote='''
Thence again one comes to Dibon-gad, which is said to signify "a beehive of temptations." O the wondrous caution of the divine providence! Behold, now the traveler here of the heavenly journey, next to the highest perfection through the succession of virtues, and yet trials are not lacking to him. But I hear of a new kind of trials: "a beehive," he says, "of temptations." The bee is a praiseworthy animal set down in the Scriptures, from whose labors both kings and common people make use of them for health; which is rightly taken of the words of the prophets and of the Apostles and of all who wrote the sacred volumes; and I think this "beehive," that is, the whole number of the divine Scriptures, is most worthily understood. There is, therefore, for those who tend toward perfection, even in this beehive, that is, in the prophetic and apostolic words, no small temptation. Do you wish to see that there is in these no slight temptation? In this beehive I find it written: "See," he says, "lest, looking upon the sun and the moon, you adore them, which the Lord your God has apportioned to the nations." You see what temptation proceeds from this beehive? And again when it says: "You shall not curse the gods." And again in the beehive of the new testament, where we read: "Why do you wish to kill me, a man who has spoken the truth to you?" And again in other places the Lord himself says: "Therefore I speak to them in parables, that seeing they may not see, and hearing they may not understand, lest perhaps they be converted, and I heal them." But also when the Apostle says: "In whom the god of this world has blinded the minds of the unbelievers" — and many trials of this sort you will find in this divine beehive, to which it is necessary that each of the saints should come, so that even through these it may be recognized how perfectly and piously he thinks concerning God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.12"
