[[commentary]]
quote='''
Nor is rest given to those who receive the inheritance through Moses, that is, who pleased God through the law, before they help their brothers in battle. Only the "women" and the "little ones" receive rest through Moses; but the rest do not rest, but go out to the aid of their brothers. See how today, as I labor in the contest of this life and have a struggle against enemies, that is, against the hostile powers, they come to my aid who before the coming of my Lord Jesus Christ were justified under the law. See how Isaiah furnishes me aid, when he illuminates me with the words of his reading. See Jeremiah coming girded and ready to our aid and, with the javelins of his volume, putting to flight our most fierce enemies, the darkness of my heart. Daniel too is girded for our aid, when he instructs and forewarns us concerning the presence and kingdom of Christ and concerning the future deceit of the Antichrist. Ezekiel too is present, marking for us the heavenly mysteries in the fourfold circuits of the wheels and "enclosing a wheel within a wheel." Hosea too leads the twice-six squadrons of the prophetic host, and they all march out "with their loins girded in the truth" which they preach to the aid of their brothers, so that, instructed by their volumes, we may not be ignorant of the devil's cunning. These, therefore, who are strong men, armed and "girded about the loins with truth," go out to our aid and fight alongside us. But the "little ones" and the "women" do not go out to our battle. And no wonder; for he is called an infant who does not speak. What help, then, could that one have given me who has spoken nothing? in whom I find nothing that I may read? whose word does not instruct me? But the Apostle says that "the woman" is "the weaker vessel." Hence, consequently, "the weaker vessel" does not come to the conflict, lest it be shattered and perish; for so it is said of the Lord Jesus in the Gospels that "he did not break the bruised reed." Since therefore "women" are commanded to be taught at home by their husbands and are placed rather in the person of disciples than of teachers, he does not come to my aid who cannot teach me and in whom I find nothing that I ought to imitate or hold fast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily03.html'
source_title="HOMILIES ON JOSHUA 3.1"
