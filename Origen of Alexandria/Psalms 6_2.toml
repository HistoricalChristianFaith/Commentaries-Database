[[commentary]]
quote='''
Even if one turns to the lesser fragments of the body, one can discover their incorporeal correspondences in the soul. "… Have mercy on me, O Lord, for I am weak; heal me, O Lord, for my bones are shaken." What bones of the prophet were shaken? The harmonious state of his soul and the strength of his mind were shattered, and therefore he asks God for the restoration of his bones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
