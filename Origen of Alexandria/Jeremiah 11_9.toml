[[commentary]]
quote='''
"And they did not do them. And the Lord said to me: A conspiracy has been found among the men of Judah and among the inhabitants of Jerusalem." Are we going to repent over the sins spoken of concerning the men of Judah, knowing that we are men of Judah because of Christ who was prophesied and spoken of? For perhaps, since there are among us certain sinners who act contrary to right reason, for this reason the prophet says: "A conspiracy has been found among the men of Judah and among the inhabitants of Jerusalem." For when there is found, in certain persons who bear the name of the church, a bond of injustice and a bond of sins, so that to them may be applied what is said of the sinner, "and each one is bound tight by the cords of his own sins," God would say: "A conspiracy has been found among the men of Judah." But let no conspiracy be found among us. And how is a conspiracy not found among us, even if until now there is a conspiracy in certain persons? "Loose every bond of injustice, undo the knots of forced dealings, tear apart every unjust contract. Break your bread for the hungry."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily09.html'
source_title="HOMILIES ON JEREMIAH 9"
