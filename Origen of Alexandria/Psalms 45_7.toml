[[commentary]]
quote='''
Do not seek on earth that "oil" which is poured "upon the head" of the "great priest" that he may become Christ; but if it seems good, learn from the prophet David what this "oil" is: "you have loved" he says "righteousness and hated iniquity; therefore God, your God, has anointed you with the oil of gladness above your fellows". This, then, is the "oil of gladness" which, "poured upon his head", made him Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily12.html'
source_title="HOMILIES ON LEVITICUS 12"
