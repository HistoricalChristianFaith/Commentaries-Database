[[commentary]]
quote='''
It is written in Deuteronomy: "if", it says, "you go out to war against your enemies, and see there a woman of comely appearance, and desire her, you shall take her, and you shall shave off all the hair of her head and her nails, and you shall clothe her in mourning garments; and she shall sit in the house mourning her father and her mother and her paternal house; and after thirty days she shall be your wife".… Yet nevertheless I too have frequently "gone out to war against my enemies and seen there" as booty "a woman of comely appearance". For whatever things we find well and reasonably said among our enemies, if we read anything wisely and knowingly said among them, it behooves us to cleanse it and to remove and cut away from the knowledge which is among them all that is dead and empty—for this is what all the hairs of the head and the nails of the woman taken from the spoils of the enemies are—and so at last to make her our wife, when she has now nothing of those things which through unfaithfulness are said to be dead, has nothing dead in her head, nothing in her hands, so that she bears nothing unclean or dead either in her senses or in her acts. For the women of our enemies have nothing clean, because there is no wisdom among them to which some uncleanness is not mixed. Yet I would that the Jews would tell me how these things are observed among them. What is the cause, what the reason, for a woman to "be shorn" and "her nails to be removed"? For example's sake, if we suppose that he who is said to have found her found her so that she has neither hairs nor nails: what did she have which he might seem, according to the law, to remove? But we, for whom the warfare is spiritual and "the weapons not carnal, but powerful for God to the destroying of counsels", if a "comely" woman be found among the enemies and some reasonable discipline, we will purify her in this manner in which we said above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
