[[commentary]]
quote='''
Therefore speak in the ears of the people, saying: Whoever is timid and fearful of heart, let him return. And there returned from Mount Gilead, out of the people, twenty-two thousand men, and there remained ten thousand. Let us see, then, first, what it means that He says: "timid and fearful of heart"; for two things are named by which human frailty is convicted, that is, the "timid" and the "fearful" of heart. He may seem "timid" who at the first sight trembles at the encounter, yet is not terrified with his whole heart, but can be restored and heartened again. But the fearful man is he who, the vice as it were now taking root, is terrified by thought alone even before he sees the evils, rolling an icy dread through his limbs, so that he is unmanned not so much by the sight of evils as by the very hearing and expectation of them; and therefore He added: "fearful of heart"; for this vice, now in the "heart", remains fixed even in the inner parts of the soul. What then? Do we say that only at that time did Gideon say to the people: "If anyone is timid and fearful of heart", let him depart from the battles, forsake the wars, abandon the contests of brave men? Or does even today the "commander of our army", our Lord and Savior Jesus Christ, cry out to His soldiers and say: "If anyone is timid and fearful of heart", let him not come to My wars? For this is what, in other words indeed but in the same sense, He says in the Gospels: "He who does not take up his cross and follow Me is not worthy of Me", and: "He who does not hate his father and his mother, and his brothers and sisters, and moreover even his own soul, is not worthy of Me", and again: "He who does not renounce all that he possesses cannot be My disciple". Does not Christ in these words plainly separate and set apart the "timid and fearful" from His camp? All of you, then, who wish to follow the warfare of Christ, who desire to be in His camp, banish far from you the fear of the mind, banish far the dread of the heart, so that with confidence the soldier of Christ may say: "If camps stand together against me, my heart shall not fear; if battle rise up against me, in this will I hope", and may confidently say: "The Lord is my light and my salvation, whom shall I fear? The Lord is the protector of my life, of whom shall I tremble?". But do not let such warfare deter you: it contains nothing difficult in itself, nothing arduous or impossible. Do you wish to know how easy it is to fulfill these things for those who wage war out of faith? In these camps even women too are often accustomed to conquer, because the fighting is done not by the strength of the body but by the power of faith. In what went before, in this very little book of Judges, we read of the triumphs of the woman Deborah, and no unbelieving dread disturbed her womanly mind. And why should I recall that magnificent Judith, most noble of all women? who, when affairs were already almost lost, did not tremble to come to the rescue alone, and alone to expose herself and her own head to the slaying of the utterly monstrous Holofernes, and went forth to war relying not on arms nor on war-horses nor on military supports, but on strength of soul and the confidence of faith; by counsel together with daring she destroyed the enemy; and the liberty of the fatherland, which the men had lost, a woman restored. And why do we unroll for you examples of the ancients from so far off? Before our own eyes we have often seen it done, that women and girls still of tender age have borne for the sake of martyrdom the tyrant's torments, to whom, added to the weakness of their sex, was the frailty of their still youthful life. So then, in those who wage war for the truth, and also those who wage war for God, not bodily but spiritual fortitude is required, because the victory is sought not by iron javelins but by the darts of prayers, and it is faith that furnishes endurance in the contest. Whence also the holy Apostle equips the soldiers of God for wars of this kind with fitting arms, saying: "Stand therefore, clothed with the breastplate of righteousness, and having girt your loins in truth; but take also the helmet of salvation, and the sword of the spirit; and above all take up the shield of faith, in which you may be able to quench the fiery darts of the wicked one"; but he also bids that the "feet be shod in the preparation of the Gospel of peace", and that, armed in this manner, they "take up" the standards "of the cross of Christ and follow Him". Yet this too is permitted in the warfare of Christ, that if perchance at some time you feel yourself inferior in strength amid persecutions, and the contest against the cruelty of the tyrant seems to you unequal through the frailty of the body, you may give place to wrath and "flee" from place to place, nor is this reckoned to you as a soldier's offense. For this too is appointed in the laws of Christ, who says: "If they persecute you in this city, flee into another; and if in the other, flee into yet another". For the sum of the matter is not to deny Jesus, whom you have once confessed. For it is certain that he confesses Him who flees for this reason, that he may not deny Him. If anyone, then, is "timid" and "fearful of heart", let him depart from the camp, let him return to his own house, lest he furnish to the rest an example of fear and dread. But do you wish to see of how great a crime the "timid and fearful" man is guilty? In the Apocalypse, where those are enumerated who are to be cast "into the lake of fire", there before all He places the "timid and fearful", and reckons together with them also the "unbelieving and fornicators and poisoners". Thus among enormous and abominable crimes is placed the crime of fear and dread. And these things we have said on account of those who first, as "timid and fearful of heart", are dismissed from the camp.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily09.html'
source_title="HOMILIES ON JUDGES 9"
