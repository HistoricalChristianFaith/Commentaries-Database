[[commentary]]
quote='''
But if we have confidence and with free brow say: I have kept the precept that commands: "render to all their debts, to whom tribute, tribute, to whom fear, fear, to whom custom, custom, to whom honor, honor" — if I have rendered all things to all, I come to the officer and with untroubled mind answer: I owe you nothing. The officer comes to demand back — I resist him; for I know that, if I owe nothing, he has no power over me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily35.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 35"
