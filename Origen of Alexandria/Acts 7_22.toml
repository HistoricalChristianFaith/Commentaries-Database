[[commentary]]
quote='''
So long as Moses was in Egypt and "was being instructed in all the wisdom of the Egyptians", he was not "of a thin voice" nor "slow of tongue", nor did he profess himself to be lacking in eloquence. For, as far as the Egyptians were concerned, he was both of a sonorous voice and of incomparable eloquence. But when he began to hear the voice of God and to receive the divine utterances, then he perceived his own voice to be feeble and thin, and he understood his tongue to be slow and hampered; then he pronounces himself mute, when he began to recognize that true Word which "was in the beginning with God". But that what we are saying may more readily be grasped, let us make use of a comparison of this kind. If a rational man, however unskilled and untaught, be compared with dumb animals, he will seem eloquent in comparison with those which are devoid both of reason and of voice; but if he be set beside learned and eloquent men, men most approved in all wisdom, he will seem inarticulate and mute. And if someone should contemplate the divine Word itself and look upon the divine wisdom itself, then, however great his learning and however great his wisdom, he will profess himself before God a mute animal, far more than the beasts are before us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily03.html'
source_title="HOMILIES ON EXODUS 3"
