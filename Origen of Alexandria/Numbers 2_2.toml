[[commentary]]
quote='''
But let us see what it is that it says: "and according to his own signs." I think the signs are those things by which the individual property of each one is designated; for example, all of us men are alike, yet there is a certain distinction proper to each one, either in the very face, or in stature, or in bearing, or in dress, through which, for example, Paul is designated to be Paul, and Peter to be Peter and not to be Paul. And sometimes even to those who do not see, the diversity of each one's sign is given, so that from voice and speech one recognizes that it is this man or that who is speaking; and according to the sign of his own property each one is known even without bodily sight. In this manner I judge that there are also diverse signs in souls. And the movement of one soul is gentler, mild, placid, tranquil, even; that of another is turbid, elated, harsher, more excitable, more insolent. One is circumspect, cautious, provident, careful, diligent; another is slothful, remiss, negligent, incautious; and among these one more, another less. And I dare to declare that perhaps as great a diversity as there is in the appearance of the face among men, so great also is found to be the difference in souls; just as I remember that the most wise Solomon says in a certain place: "As faces are diverse from faces, so also are the hearts of men diverse." But let each one, as Moses says, march according to his own signs—that is, let not him whose signs are lowly and despised march more elated and loftier than the signs of their own souls demand. And that the account of the diversity of the signs may become still more clear, we will add these things also. It is certain that all who know letters have learned the elements of letters—twenty-four if Greek, twenty-three if Latin—and out of these they write whatever must be written. Yet the sign, for example, of the alpha which Paul writes is one thing, and that which Peter writes is another; and so, through the individual men who know letters, you will find diverse signs of writing in each single letter. Hence too the handwritings written by the hands of individuals are recognized by certain proper signs and marks; and though the elements be the same, yet in the very likeness of the letters there is much unlikeness of signs. Therefore, if the example of the matter set before you has become fully clear, come now to the movements of the mind and of the souls, by which they are stirred to do something. Look upon the handwritings and see how, for example, the soul of Paul has set before itself chastity, and no less the soul of Peter, but there is a certain chastity proper to Peter and another chastity of Paul, even if it seem one and the same. In short, the chastity of one of them is such as requires that his body be mortified and subjected to servitude, and which still says "lest perchance"; but the chastity of the other does not fear that "lest perchance." Likewise justice too has something of property in Paul, and has it also in Peter. In the same manner also wisdom and the other virtues. But if even in these names, which we have set down for the sake of example, it can come to pass that, although they are one through the Spirit of God, yet there is some diversity in the very property of the virtues, how much more do all the rest of men bear certain signs proper to themselves in the movements of their souls and the virtues of the soul! Perceiving these things by a mystical reasoning, Moses writes in the Law that each one should march in the camp according to his own signs. And it can come to pass that, by an emulation of good works, we advance from lower signs to better and more magnificent ones. For if it has been rightly understood by us that all these things which are written in the Law are forms of the goods to come, and of that age which we hope for from the resurrection, it is certainly true that, if in the present life we have zeal for better things and, after the example of the Apostle, forgetting the things that are behind, we stretch out to the things that are before, then in the resurrection of the dead—where, as star differs from star in glory, so also the merits of each one will shine forth—we shall assuredly be able to be transferred from lower signs to better and more brilliant ones, and to be made equal to more resplendent stars. And human nature can advance so far in this life that in the resurrection of the dead it may be able to be made equal not only to the glory of the stars, but even to the splendor of the sun, according to what is written: "The just shall shine in the kingdom of God like the sun." Hence it is, therefore, that even among the lower things it says: "according to his own signs, by the houses of their families." As for what it says, "by the houses of their families," in the Greek the same word is set down which the Apostle also uses in that place where he says: "For this cause I bow my knees to the Father of our Lord Jesus Christ, of whom all fatherhood in heaven and in earth is named." What Paul here calls "fatherhoods," the Latin translator there rendered "families," but one and the same word is had in the Greek. These, then, are the fatherhoods or families which Paul indeed already shows to be in the heavens, but which Moses still describes on earth under legal figures; and he admonishes us to march according to them, that we may be able to be joined to the heavenly fatherhoods. For there are, as Paul above declared—whether they are to be called families or fatherhoods—in heaven, of which perhaps is also that one which the same Paul names in another place, "the church of the firstborn enrolled in the heavens," to which it will fall to us to be joined, if we march according to order and do all things according to order. If nothing disordered, nothing restless, nothing dishonorable be found in us, then we too shall shine like the firmament and shall gleam like the stars, or the sun itself, in the kingdom of God, through Christ our Lord, to whom be glory and dominion unto the ages of ages. Amen.
'''
