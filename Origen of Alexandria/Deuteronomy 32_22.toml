[[commentary]]
quote='''
Something like this is also written concerning God: "a fire is kindled in my fury", not as far as heaven, but "as far as hell beneath", and "it shall devour" not heaven, but "the earth and its produce". To what end have I recalled these things? Because the baptism too, with which Jesus baptizes, is "in the Holy Spirit" and "in fire". If you are holy, you will be baptized in the Holy Spirit; if a sinner, you will be plunged into fire; and one and the same baptism will be turned, for the unworthy and for sinners, into condemnation and fire, but to those who are holy and turn to the Lord with their whole faith, the grace and salvation of the Holy Spirit is to be granted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily26.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 26"
