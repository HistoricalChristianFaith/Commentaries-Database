[[commentary]]
quote='''
To the sinner, indeed, every creature is an enemy, just as it is written concerning the Egyptians: the earth assailed them, the river assailed them, the very air assailed them, the heavens assailed them. But for the righteous, even things that seem impassable are made level and easy. The righteous man crosses the Red Sea as though "over dry land," but the Egyptian, if he wishes to cross, will be drowned, nor will the "water become a wall to him on the right hand and on the left." Even if the righteous man enters a horrible and vast wilderness, food is supplied to him from the heavens. So, then, in the Jordan too the ark of the Covenant was the leader for the people of God. The priestly and Levitical order takes its stand, and the waters, as if rendering a kind of reverence to the ministers of God, rein in their course and are heaped up into a mound, granting a passage harmless for the people of God. And do not be astonished when these things are reported to you as having been done for the former people; to you, Christian, who have passed through the streams of the Jordan by the sacrament of baptism, the divine word promises things far greater and loftier, and it pledges you a way and a passage through the very "air"; for hear Paul saying concerning the righteous: "we shall be caught up," he says, "in the clouds to meet Christ in the air, and so we shall ever be with the Lord." There is nothing at all that the righteous man should fear; every creature serves him. Hear, finally, how God also promises to him through the prophet, saying: "if you pass through the fire, the flame shall not burn you, for I am the Lord your God." Every place, therefore, receives the righteous man, and every creature renders him the service that is due. And do not suppose that these things were done among the men of old, but that in you, who are now a hearer of these things, nothing of the kind is done: all things are fulfilled in you according to the mystical account. For you, who now desire, having lately abandoned the darkness of idolatry, to come to the hearing of the divine law, now for the first time abandon Egypt. When you were gathered into the number of the catechumens and began to obey the precepts of the Church, you passed out from the Red Sea, and, stationed at the halting-places of the desert, you devote yourself daily to hearing the law of God and to gazing upon the countenance of Moses revealed through the glory of the Lord. But if you also come to the mystical font of baptism and, with the priestly and Levitical order standing by, are initiated into those venerable and magnificent sacraments, which they know who are permitted to know them, then also, when the Jordan has been passed by the ministries of the priests, you will enter the land of promise, in which, after Moses, Jesus receives you and himself becomes for you the leader of a new journey. But you, mindful of the great and such-like powers of God — that the sea was divided for you and that the "water" of the river "stood still" — turning to these things will say: "what ails you, O sea, that you fled? and you, O Jordan, that you were turned back? O mountains, that you leaped like rams, and hills like the lambs of the flock?" But the divine word will answer you and say: "at the presence of the Lord the earth was moved, at the presence of the God of Jacob, who turned the rock into a pool of water and the flint into fountains of waters."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily04.html'
source_title="HOMILIES ON JOSHUA 4.1"


[[commentary]]
quote='''
Jesus therefore, my Lord and Savior, took up the command; and, if it seems good, let us compare the deeds of Moses with the command of Jesus. When Moses led the people out of the land of Egypt, there was no order among the people, no observance among the priests. They cross the water of the sea, salt water containing nothing of sweetness in itself, and "the water was a wall to them on the right and on the left." These things we know to have been done with Moses as leader. But when my Lord leads the army, let us see what things were even then being foreshadowed. "The priests go before," "the ark of the Testament is carried on the shoulders of the priests," nowhere now does the sea, nowhere does the salt wave meet us, but with my Lord Jesus as leader I come to the Jordan, and I come not in the confusion of flight nor stricken with dread, but I come with the priests carrying on their necks and shoulders the ark of the Testament of the Lord, in which the law of God and the divine writings are kept. I enter the Jordan not with furtive silence, but amid the songs of trumpets sounding something mystical and divine, that I may advance to the proclamation of the heavenly trumpet. There it was said that "the water was divided" into two parts and "one wall of water was made on the right, another on the left." But here, he "who came to break down the middle wall of the hedge made both one"; for on one part "the water was raised up," but the other part "flowed down into the sea."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily01.html'
source_title="HOMILIES ON JOSHUA 1.4"
