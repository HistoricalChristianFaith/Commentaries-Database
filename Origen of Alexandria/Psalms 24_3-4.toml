[[commentary]]
quote='''
I think that the discourse, wishing to show a general cleanness which is not only in acts but also in knowledge, says in the twenty-third Psalm: who shall ascend into the mountain of the Lord, or who shall stand in his holy place? he that is innocent in hands and pure in heart, and in the Proverbs: who shall boast that he has a chaste heart? or who shall be confident that he is clean from sins? I therefore think that the one clean in heart and chaste in heart is no other than he who possesses a heart clean and chaste from every false dogma; so also I reckon him to be innocent in hands and clean from sins who is irreproachable in the acts of his life. And it must be known that (as regards the truth) it is impossible for anyone to be innocent in hands and clean from sins without being pure in heart and chaste from false dogmas; just as, on the contrary, it is impossible to be clean indeed and chaste in heart from false dogmas without being innocent in "hands" and clean from sins. For these follow one another mutually and are not separated from each other: a discourse clean in the soul and a life irreproachable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252024.html'
source_title="COMMENTARY ON MATTHEW 33"
