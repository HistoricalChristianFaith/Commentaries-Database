[[commentary]]
quote='''
If the observance of the sacrifices and the legal ordinances, which were given to the people of Israel as a figure, could have stood firm right up to the present time, they would without doubt have shut out the faith of the Gospel, through which, from the coming of our Lord Jesus Christ, the nations are converted to God. For there was in those things which were then observed a certain magnificent religion, full of every reverence, which even at the very first glance would astonish the beholder. For who, seeing that which was called the sanctuary or holy place, and gazing upon the altar, and upon the priests standing by to complete the sacrifices, and beholding the whole order by which all these things were carried out, would not have supposed this to be a most complete rite by which God the Creator of all ought to be worshipped by the human race? But thanks be to the coming of Christ, who, tearing our souls away from this spectacle, has brought them over to the consideration of the heavenly and to the contemplation of spiritual things, and has indeed destroyed those things that seemed great upon the earth, and has transferred the worship of God from the visible to the invisible and from the temporal to the eternal. But in truth the Lord Jesus Christ himself requires both ears that may hear these things and eyes that may see them. Hence we too, now having in our hands the law given through Moses, and wishing to show that it is a spiritual law, require from you such ears and such eyes as look not to those things that have been destroyed, but that seek these things there where Christ is, seated at the right hand of God, and that savor the things which are above, not the things which are upon the earth. Let it suffice, then, that these things have been set forth by us in the place of a preface for the things that are to be said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily23.html'
source_title="HOMILIES ON NUMBERS 23.1"

[[commentary]]
quote='''
But now let us come at last to the things that are written. "And the Lord spoke to Moses," it says, "saying: Command the children of Israel, and thou shalt say to them: My offerings, my gifts, my victims, for an odor of sweetness, observe to offer them to me on my feast days. And thou shalt say to them: These are my victims, which you shall offer to the Lord." No one offers anything of his own to God, but what he offers is the Lord's, and a man does not so much offer his own things as render back to Him the things that are His own. Therefore, wishing to write laws concerning the sacrifices and gifts to be offered to Him by men, the Lord first of all discloses the true nature of those very things that were to be offered, and says: "My offerings, my gifts, my sacrifices, for an odor of sweetness, observe to offer to me on my feast days." "These offerings," He says, "concerning which I am about to command you that you offer them to me on my feast days, are my gifts," that is, they are given to you by me; for from me the human race receives all that it has. Therefore, lest anyone in offering gifts should believe that he confers some benefit upon God, and through this become impious in the very act in which he seemed to worship God — for what is so impious as for a man to think that he bestows something upon God as upon one in need? — of necessity, as we have said, He first teaches man, so that he may know that whatever he offers to God he rather renders back to Him than offers. But let us also see how He says: "which you shall offer to me on my feast days." Does God, then, have His feast days? He does. For to Him human salvation is a great festivity. I think that through each and every one of the believers, through each one who is converted to God and advances in faith, a festivity arises for God. How greatly, do you think, does it gladden Him when he who had been unchaste becomes chaste, and he who had been unjust cultivates justice, and he who had been impious is made pious? All these conversions of each individual generate festivities for God. Nor is there any doubt that our Lord Jesus Christ also, who for our salvation poured out even his own blood, keeps the greatest festivity when He sees that it was worth the labor that He humbled Himself and, taking the form of a servant, became obedient even unto death. The Holy Spirit likewise keeps festival, when He sees more temples prepared for Himself in those who are converted to God. For what shall I say of the angels, to whose festivity of rejoicing all are said to draw near who are converted to the Lord? Or is it not for them a great festivity, when they rejoice in heaven over one sinner doing penance more than over ninety-nine just who have no need of penance? The angels therefore also keep a feast day, rejoicing over those who, fleeing the fellowship of demons, hasten through the exercises of the virtues to associate themselves with the angelic fellowships. Perhaps it may seem wonderful, what I wish to say: we, it appears, give to God and to the angels causes for festivity and gladness; we, placed on earth, furnish to heaven an occasion of joy and exultation, when, walking upon the earth, we have our conversation in the heavens, and through this without doubt generate a feast day for the heavenly powers. But just as our good acts and the progress of the virtues beget joy and festivity for God and the angels, so I fear lest our evil conversation bring in lamentations and mournings not only to the earth but also to heaven, and perhaps human sins strike even God Himself with grief. Or is not that the voice of one mourning, when He says: "It repenteth me that I made man upon the earth"? And likewise that word of our Lord and Savior in the Gospel, where He says: "Jerusalem, Jerusalem, that stonest the prophets and killest those sent to thee, how often would I have gathered thy children together, as a hen gathers her chicks under her wings, and thou wouldst not!" And do not think that it was said only of the men of old that they stoned the prophets: I too today, if I do not hear the words of the prophet, if I spurn his admonitions, stone the prophet and, as far as in me lies, kill him, whose words, namely, I do not hear, as though he were dead. But that too is the voice of God lamenting the human race, in which it is said through the prophet: "Woe is me, for I am become as one who gathers stubble in the harvest and as gleanings in the vintage, for there is no ear of corn nor cluster of grapes to eat of the firstfruits! Woe is me, O my soul, for the reverent man has perished from the earth, and there is none among men to set them right!" These are the voices of the Lord mourning the human race. For He came to gather the harvest and found stubble instead of a harvest, and He came to gather the vintage, but found few clusters instead of a vintage — the Apostles, namely, whom unless the Lord of Sabaoth had left us as a seed, and unless the grain of wheat had fallen into the earth to bring forth much fruit, we should have become as Sodom and been made like to Gomorrah. To the angels of God also, as we said above, there comes joy in heaven over one sinner doing penance. It is certain that where joys are held for good things, there mourning is held for the contrary; if therefore they rejoice over the one converted, they must needs mourn over the one sinning. Therefore, because Jerusalem sinned a great sin, according to what is written in the Lamentation, she is become an object of commotion, and all her festivities and her solemn days have perished, because in the holy place and on the day of festivity they killed my Lord Jesus Christ. And therefore He says to them: "Your new moons and your sabbaths and your feast days my soul hateth." Here indeed, where the command is about the offerings, where as yet there are no sins, He says "my feast days"; but where there is sin, the Lord says not "my," but "your" feast days. All these things, however, in which God is said to mourn or rejoice or hate or be glad, are to be understood as spoken by Scripture figuratively and after the manner of men. For the divine nature is far removed from every affection of passion and change, ever abiding, immovable and unshaken, upon that summit of blessedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily23.html'
source_title="HOMILIES ON NUMBERS 23.2"
