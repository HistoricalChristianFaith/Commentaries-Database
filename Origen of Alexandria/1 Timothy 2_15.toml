[[commentary]]
quote='''
This love, therefore, the present Scripture speaks of, by which the blessed soul makes use of and is inflamed toward the Word of God; and it sings this wedding song through the spirit, by which the Church is joined and united to her heavenly bridegroom Christ, desiring to be mingled with him through the Word, that she may conceive from him, and may be able to be saved through this chaste generation of children, when they shall have remained in faith and holiness with sobriety: inasmuch as they are conceived from the seed indeed of the Word of God, but brought forth and begotten either by the immaculate Church, or by the soul that requires nothing corporeal, nothing material, but burns with the love of the Word of God alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"
