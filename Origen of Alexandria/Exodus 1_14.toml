[[commentary]]
quote='''
According to these things, therefore, God is perhaps said also to have hardened the heart of Pharaoh, namely because the material of his heart was such that it received the presence of the Sun of justice not on that side by which it illumines, but on that by which it burns and hardens: on this account, without doubt, that he too was afflicting the life of the Hebrews in hard works, and was making them work with clay and brick. … And as this visible sun binds fast and hardens the material of clay, so the Sun of justice, by these same rays with which he was illumining the people of Israel, was hardening the heart of Pharaoh, in which were clayey thoughts, according to the very qualities of its own motions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FBook%25202.html'
source_title="COMMENTARY ON THE SONG OF SONGS, BOOK 2"


[[commentary]]
quote='''
When the children of Israel were in Egypt, they were afflicted with mortar and brick for the works of Pharaoh the king until they cried out in their groaning to the Lord. And he heard their cry and sent his word to them by Moses and led them out of Egypt. When we were also in Egypt, I mean in the errors of this world and in the darkness of ignorance, we then did the works of the devil in lusts and desires of the flesh. But the Lord had pity on our affliction and sent the Word, his only begotten Son, to deliver us from ignorance of our error and to lead us to the light of divine law.
'''
source_url='https://www.google.com/books/edition/Homilies_on_Numbers/P4pPyRXeWkUC?hl=en&gbpv=0'
source_title="HOMILIES ON NUMBERS 27.2"
