[[commentary]]
quote='''
Every soul that has been clothed with a human body has its own "filth". And that you may know that Jesus too was made filthy by his own will, because for our salvation he had assumed a human body, listen to the prophet Zechariah saying: "Jesus was clothed with filthy garments". And this indeed makes against those who deny that our Lord had a human body, but say it was woven of heavenly and spiritual things. For if his body was of heavenly things and, as they falsely assert, of the stars and some other more sublime and spiritual nature, let them answer why a spiritual body could be filthy, or how they interpret what we have set down: "Jesus was clothed with filthy garments". But if they are compelled by necessity to accept that a filthy garment is understood as a spiritual body, they must consequently say that what is set down in the promises has been fulfilled, that is: "an animal body is sown, a spiritual body rises," and that we rise polluted and filthy — which even to think is a sacrilege, especially when one knows it is written: "it is sown in corruption, it will rise in incorruption; it is sown in dishonor, it will rise in glory; it is sown in weakness, it will rise in strength; an animal body is sown, a spiritual body will rise". It was necessary, therefore, that for our Lord and Savior, who had been "clothed with filthy garments" and had assumed an earthly body, there should be offered those things which by the law were accustomed to purge filth. What is frequently asked among the brethren I take up again, prompted by the occasion of this passage. Little children are baptized "for the remission of sins". Of what "sins"? Or at what time did they sin? Or how can that reasoning of the washing hold in the case of little children, except according to that sense of which we spoke a little before: "no one is clean from filth, not even if his life should be of a single day upon the earth"? And because through the sacrament of baptism the "filth" of birth is laid aside, therefore little children too are baptized: for "unless one be born again of water and the Spirit, he cannot enter into the kingdom of heaven".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily14.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 14"
