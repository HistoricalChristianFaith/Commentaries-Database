[[commentary]]
quote='''
That one, when he wills, repents and has forgiveness of sins, but he who has fornicated after the faith, even if he afterward repents again, does not have forgiveness of sins, yet is able to cover over the sin. For "Blessed", he says, "are those whose sins were forgiven"—those who came from the nations; "and those whose sins were covered over"—those who sin after the faith but cover them over with good works, as for instance intemperance by much self-control.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XXVI"
