[[commentary]]
quote='''
Yet it must be observed that the priest uses one set of garments while he is in the ministry of the sacrifices, and another when he goes forth to the people. This Paul too did, most learned of high priests and most skilled of priests. He who, when he was in the assembly of the perfect, as though placed within the "holy of holies" and clothed in the robe of perfection, said: "we speak wisdom among the perfect, yet a wisdom not of this world nor of the princes of this world, who are being destroyed; but we speak the wisdom of God hidden in a mystery, which none of the princes of this age knew. For if they had known, they would never have crucified the Lord of majesty." But after these things, as though "going out to the people," he changes his robe and is clothed with another far inferior to that one. And what does he say? "I judged," he says, "that I knew nothing else among you except Jesus Christ, and him crucified." You see, therefore, this most learned priest, how, when he is within among the perfect, as it were in the "holy of holies," he uses one robe of doctrine; but when he "goes out" to those who are incapable, he changes the robe of the word and teaches lower things, and gives some "milk" to drink as "little ones," nourishes others with "vegetables" as "weak," but for others prepares "strong food" — namely for those who "according to their capacity of receiving have their senses exercised for the discernment of good or evil." Thus Paul knew how to change robes and to use some for the people, others in the ministry of holy things. But he himself, the high priest of high priests and priest of priests, our Lord and Savior, of whom the Apostle says that "he is the high priest of the good things to come" — hear how he first did these things and thus left them to his disciples to be imitated. The Gospel relates concerning him and says that: "he spoke to the crowds in parables, and without a parable he did not speak to them, but privately he resolved these things for his disciples." You see how he himself taught that the high priest ought to use certain garments when he goes forth "to the crowds," and others when he ministers to the learned and "perfect" in holy things. Whence it is to be desired by us and to be striven for, that Jesus not find us such — so unprepared and so bound up with the cares of the world — that he speak to us as with the crowds "in parables," so that "seeing we do not see and hearing we do not hear"; but rather that we may merit to be found among those to whom he says: "to you it is given to know the mysteries of the kingdom of God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily04.html'
source_title="HOMILIES ON LEVITICUS 4"
