[[commentary]]
quote='''
And it is fitting that, until we come to perfection, the virtue of the soul should be within us and be our own; but when we have come to perfection, so that we are fit to teach others also, then we no longer shut virtue up within our bosom as a wife, but join her also, as a sister, to others who wish for her. To these, finally, who are perfect, the divine word will say: "say that wisdom is your sister."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily06.html'
source_title="HOMILIES ON GENESIS 6.1"
