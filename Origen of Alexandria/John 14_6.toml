[[commentary]]
quote='''
Something lies hidden in this place, and it is secret: "on the way make an effort". The Savior says: "I am the way and the truth and the life". If you "make an effort" to be freed from the adversary, be on the way; and when you have stood in him who says: "I am the way", it is not enough to have stood, but "make an effort to be freed" from the adversary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily35.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 35"
