[[commentary]]
quote='''
And this, knowing the time, that it is now the hour to rise from sleep. For now our salvation is nearer than when we believed. The night has gone before, but the day has drawn near. Let us therefore cast off the works of darkness, and let us put on the armor of light; let us walk honorably, as in the day. When, after those discussions which the Apostle pursued concerning either the Gentiles or the Jews, he had also introduced the moral topic, by which he might more and more urge his hearers toward conversion, he now introduces as well the pressing consideration of time, which in all matters is supreme. For no one is so drowsy and sluggish that the brightness of the oncoming day does not rouse him, and whose sight the sun, poured into his eyes, does not open. There is, then, a certain sleep of the soul as well. For if it has, as we have often already said, its own proper eyes, and its own ears, and hands and feet — each of which is to be reckoned not so much as bodily members belonging to it, as powers by which it is moved and stirred toward each several thing — then without doubt sleep also befalls it in respect of its eyes. For if it does not do at the opportune time the things that are God's, but grows torpid with idleness, it will deservedly be said to sleep. For this reason, therefore, Paul, the herald of Christ, going about a world set in the sleep of idleness, announces that the light is now at hand, and that it is time to rise from sleep; and that the night — that is, that time in which ignorance held dominion over men — has gone before, and that, with the coming of the Sun of righteousness drawing near and the darkness thinning out, the day of knowledge is now imminent; and therefore he cries out that one must awake, lest through sloth anyone suffer night in the daylight; and that the works of darkness must be cast off, and the armor of light put on. The works of darkness are those acts which are alien from God; the armor of light, however, is the taking up of the virtues. And just as we have said that it is disgraceful to sleep when day is already pressing upon us, much more disgraceful is it to carry out the works of darkness in the time of day and light. But it must be known that the coming of this light and day is to be understood in a twofold manner: both as general for all, and as particular for each individual. The light and day will be present generally for all when the time of the age to come has arrived: in comparison with which the span of this present world is called darkness. That time draws near as the days daily slip away, and the spans which are increased for the past are without doubt diminished for the future; and therefore, he says, our salvation is now nearer than when we believed, and daily it becomes nearer — just as the Lord also, when he was distinguishing the signs of the consummation of the age, said: But when you see all these things, lift up your heads, for your redemption draws near. But there also comes about a coming of this day for individuals. For if Christ is in our heart, he makes day for us also: if the reasoning of knowledge puts our ignorances to flight, and, turning aside from unworthy acts, we pursue whatever is devout and honorable, we are set in the light, and, as it were, we walk honorably in the day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"

[[commentary]]
quote='''
And each one according to his own progress kindles his lamp either less or more from the light of knowledge, and pours oil into it through meditation, and watching in it against sinful works, hoping through abstinence of this kind and meditation to receive even the lord into himself. Yet to him who progresses more abundantly and forgets the things that are behind, that is, malice, but still having a little of it in himself already draws near to virtue, it is fittingly said: "the night has advanced, but the day has drawn near". And it is to be noted that he did not say: "but the day" is at hand. For it is at hand for the perfect who have in themselves no trace of night; but it draws near for the one progressing toward the better and meditating on the things that are of the day and receiving honorableness as in the day, and it is already near to that man who is such that he may say: "we are not of the night nor of the darkness".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252024.html'
source_title="COMMENTARY ON MATTHEW 59"
