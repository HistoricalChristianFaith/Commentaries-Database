[[commentary]]
quote='''
For in Ecclesiastes too it is written of the righteous man who successfully struggled and conquered, having freed himself from the bonds of the flesh: "From the prison he will go forth to a kingdom."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
