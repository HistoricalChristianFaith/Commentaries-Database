[[commentary]]
quote='''
But as for what he says: "And Moses brought near the sons of Aaron, and clothed them with tunics and girded them with girdles and put upon them cidaras, as the Lord commanded Moses", it must be attended to what is the difference of the lesser priests to the greater priesthoods. To these neither are double vestments handed over, nor the "ephod", nor the "rational", nor the "ornament of the head", but only the "cidaris" and the "girdles", which bind the tunic. These too, then, receive the grace of the priesthood, and these too discharge the office, but not as that one who is adorned both with the "ephod" and the "rational", who is resplendent "with manifestation and truth", who is decorated with the ornament of the "golden plate". Whence I judge it to be one thing among priests to discharge the office, and another to be instructed in all things and adorned. For anyone can discharge the solemn ministry to the people; but few are those who, adorned in morals, instructed in doctrine, learned in wisdom, most fit for manifesting the truth of things, may set forth the knowledge of faith not without the ornament of the senses and the splendor of assertions—which the ornament of the "golden plate" set upon the head designates. There is, therefore, one name of the priesthood, but not one dignity, whether according to the merit of life or according to the virtues of the soul. And therefore in these things which the divine law describes, as in a mirror, each of the priests ought to inspect himself and thence to gather the grade of his merit, if he sees himself placed, in all those things which we have expounded above, in the priestly ornaments; if he is conscious to himself that, whether in knowledge or in acts or in doctrine, he is so great and such a one, let him know that he obtains the highest priesthood not only in name, but also in merits. Otherwise let him know that a lower grade is placed for him, even if he has received the name of the first. It ought not indeed to escape us also this, which can be brought forward by the studious reader, on which I too have often myself hesitated within myself. For reading in Exodus, where it is commanded concerning the priestly vestments, I find that there are eight kinds which are prepared for the high priest; but here only seven are numbered. I ask, then, what it is that has been omitted. There an eighth kind is placed, the campestre, or, as we read elsewhere, the linen breeches, concerning which here, among the other vestments, he was silent. What, then, shall we say? Shall we impute forgetfulness to the words of the Holy Spirit, so that, when he has narrated all the rest a second time, one kind aforesaid should have escaped him? I do not dare to think these things about the sacred discourses. But let us see whether perhaps, since we said above that this kind of garment seems to be a token of chastity, whereby the thighs are seen to be covered or the loins and reins bound fast, whether perhaps, I say, he does not always say that these parts were bound fast in those who were then priests; for sometimes indulgence is granted also concerning the posterity of the race and the succession of offspring. But I would not introduce an understanding of this kind among the priests of the church; for I see another thing meeting the mystery. For in the church too priests and teachers can beget sons, just as also that one who said: "My little sons, whom I again bring forth in travail, until Christ be formed in you." And again elsewhere he says: "Although you have many thousands of tutors in Christ, yet not many fathers. For in Christ Jesus through the gospel I have begotten you." These teachers of the church, then, in procreating generations of this kind, sometimes use girded breeches and abstain from begetting, when they have found such hearers in whom they know that they cannot have fruit. Finally in the Acts of the Apostles too it is related concerning certain ones that "we could not," he says, "speak the word of God in Asia", that is, to have had the breeches put on and to have restrained themselves, lest they should beget sons, because namely such were the hearers in whom both the seed would perish and no succession could be had. So then let the priests of the church, when they have seen incapable ears or when they have looked upon feigned and hypocritical hearers, put on the "campestre", let them use the "breeches", lest the seed of the word of God perish, because the Lord too commands the same and says: "Do not give the holy thing to dogs, nor your pearls before swine, lest perhaps they trample them with their feet and, turning, tear you." Therefore, then, if anyone wishes to be a high priest not so much in name as in merit, let him imitate Moses, let him imitate Aaron. For what is said of them? That "they do not depart from the tabernacle of the Lord". Moses, then, was unceasingly in the "tabernacle of the Lord". But what was his work? That he either learned something from God or himself taught the people. These are the two works of the high priest, that he either learn from God by reading the divine scriptures and by meditating more often, or teach the people. But let him teach those things which he himself has learned from God, not "from his own heart", or from human sense, but those things which the Spirit teaches. There is also another work which Moses does. He does not go to wars, he does not fight against enemies. But what does he do? He prays, and, as long as he prays, his people conquer. If he "relaxes and lets down his hands", his people are conquered and put to flight. Let the priest of the church too, then, pray unceasingly, so that the people who are under him may conquer the invisible Amalekites, the enemies who are the demons, assailing those "who wish to live piously in Christ". And therefore, meditating on these things and recalling these things "day and night" to memory and being instant in prayer and watchful in it, let us beseech the Lord that he himself may deign to reveal to us the knowledge of these things which we read, and to show how we may observe the spiritual law not only in understanding, but also in acts, so that we may merit also to attain spiritual grace, being enlightened through the law of the Holy Spirit, in Christ Jesus our Lord, "to whom be glory and dominion unto the ages of ages. Amen".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily06.html'
