[[commentary]]
quote='''
What then do the divine Scriptures intend to say, for example, here: "Before Me there was no God, and after Me there shall be none," and "I am, and there is no God besides Me"? Do not suppose that in these utterances the unity is applied to the God of the universe … apart from Christ, and, of course, not to Christ alone apart from God. But let us speak of this as Jesus Himself taught: "I and the Father are one."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"

[[commentary]]
quote='''
There is also something deeper to be understood against those especially who bark against the Creator, and, gathering together from here and there out of the Old Testament testimonies which they do not understand, "deceive the hearts of the simple". For they say: behold, the God of the Law and the Prophets, see what sort he is. "I", he says, "will kill, and I will make alive; I will strike, and I will heal, and there is none who can deliver out of my hands". They hear: "I will kill", and they do not hear: "I will make alive"; they hear: "I will strike", and they disdain to hear: "and I will heal". On occasions of this kind they slander the Creator. Therefore, before I interpret what sense there is in: "I will kill and make alive, I will strike and heal", I will set against them a testimony of the Gospel and will say against the heretics — for there are countless heresies which receive the Gospel according to Luke —: If the Creator is bloodthirsty and only a judge and cruel because he says: "I will kill and make alive, I will strike and heal", it is most manifest that Jesus too is his son; for the same things are written of him: "behold, this one is set for the fall and rising of many in Israel", not "for the rising" only, but also "for the fall". … But I, who desire to be of the Church and to be named and to bear a name not from any heresiarch, but from the appellation of Christ, and to have a name that is blessed upon the earth, and long to be and to be called a Christian both in work and in thought, seek an equal principle both in the old and in the new law. God speaks: "I will kill"; I am glad that God kills. For when the old man is in me and I still live as a man, I long that God may kill in me the old man and make me alive from the dead. For, he says, "the first man was of the earth, earthly; the second man from heaven, heavenly. As we have borne the image of the earthly, let us bear also the image of the heavenly".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily16.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 16"
