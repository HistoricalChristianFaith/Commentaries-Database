[[commentary]]
quote='''
Now therefore let us return to that tabernacle of the church of the living God, and let us see how these several things ought to be observed in the Church of God by the priests of Christ. If anyone is truly a priest, to whom the sacred vessels, that is, the secrets of the mysteries of wisdom, are committed, let him learn from these and observe how these things ought to be kept within the veil of conscience, and not easily brought forth to the public. Or if the matter demands to bring them forth also to the inferiors, that is, to the more unskilled, and to hand them over, let him not bring them forth naked, let him not show them open and utterly exposed; otherwise he commits homicide and exterminates the people. For everyone is exterminated who touches the secret and ineffable sacraments, not yet transferred by merits and knowledge into the order and grade of the priesthood. For to the sons of Aaron alone, namely to the priests, it is granted to see the very ark of the testament and the table and the candlestick, and whatever of those things which we have comprehended above, naked and unveiled. But let others see these things covered, or rather let them carry them veiled upon their shoulders. And the sons of Kohath indeed, since they themselves, although they are not priests, are nevertheless nearest to the priests, can carry these things upon their shoulders; but others place their burdens and their ministries not on their shoulders, but on wagons. For, to say something even about these by anticipating the reading, since the passage has prompted it: when wagons were offered by each of the several tribes, four of them the sons of Merari received, but two the sons of Gershon; while those who are better than these do not receive wagons. Consider, therefore, now, what kind of division is made in the offices of the divine ministry, and how the things that are holy are not thus imposed to be carried by dumb animals, but they ought to be men endowed with reason, and to carry upon their shoulders the vessels by which the holy of holies are ministered; but those things which are harder and heavier are imposed to be carried not so much by rational as by dumb animals. But even in these there is some difference. For those who attend to the harder and heavier ministries have more animals; for four wagons are given to the sons of Merari, but for the sons of Gershon, because they were near the sons of Kohath, two wagons only suffice; from which it is shown that for the harder works and, so to say, the coarser, there are more who serve as animals; but to those things which are procured by rational beings, few of those who seem less instructed or educated approach. For to those things which are mystical and stored away in secret and lie open only to the priests, not only does no animal man approach, but not even those very ones who seem to have some measure of practice and erudition, but have not yet ascended by merits and life to the priestly grace. Not only do they see these things through a mirror and in an enigma, but they also receive them covered and veiled and carry them upon their shoulders, that is, that they may know them more by the act of works than by the revelation of knowledge. Since therefore such is the dispensation of the mysteries of God and of the ministry which is held among the holy things, we ought to show ourselves such that we may be made worthy of the order of the priesthood, lest heavy burdens be imposed upon us as upon the irrational, but that we may be assigned to the priestly offices as rational and holy. For we are a royal race, a priesthood, and a people for acquisition, provided only that, equaling the grace we have received by the merits of life, we may be held worthy of the holy ministry, so that, when we have departed from this life, we may deserve to be taken up, as we said above, among the priests of God and those who minister to the ark of the testament, that is, in the secret and hidden mysteries, and with unveiled face may behold the glory of the Lord and enter the holy land, whose inheritance our Lord Jesus Christ will grant to us, to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily04.html'
source_title="HOMILIES ON NUMBERS 4.3"
