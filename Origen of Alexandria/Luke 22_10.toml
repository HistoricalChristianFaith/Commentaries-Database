[[commentary]]
quote='''
(in Matt. 26:18.) But I think that the man who meets the disciples as they enter into the city, carrying a pitcher of water, was some servant of a master of a house, carrying water in an earthen vessel either for washing or for drinking. And this I think is Moses conveying the spiritual doctrine in fleshly histories. But they who follow him not, do not celebrate the Passover with Jesus.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But I think that the man who, as the disciples entered the city, met them "carrying a jar of water", whom Jesus willed that his disciples should follow as he went into the house, who was bringing that subtle water to the house, so that it might not only be cleansed, but also more fully washed with waters, was a certain one ministering to the householder (that is, to the understanding), carrying cleansing water in an earthen vessel, "that the sublimity of power may be of God", or certainly he was supplying drinkable water in that earthen vessel, so that the Son of God indeed might furnish the produce of the vine, but that understanding, the minister, might furnish out of the law and the prophets the water that is mingled with the wine of the Gospel word. We therefore who desire to be of the Church, wishing to celebrate the Passover with Jesus, let us follow that man who carries a vessel of water of this kind, whom I think to be Moses the giver of the law, carrying spiritual doctrine in corporal histories. But those who approach the law and the prophets as to the utterances of God himself, yet do not follow spiritually him who carries the vessel of living water, do not celebrate the Passover with Jesus nor drink the cup of the new testament.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252026.html'
source_title="COMMENTARY ON MATTHEW 79"
