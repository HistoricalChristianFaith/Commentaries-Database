[[commentary]]
quote='''
For this reason it seems wonderful that the sacrifice of Mary was not the first offering, that is, "a lamb a year old," but the second, since "she could not afford" the first. For as it was written about her, Jesus' parents came "to offer a sacrifice" for him, "according to what is said in the law of the Lord, 'a pair of turtledoves, or two young pigeons.' " But this also shows the truth of what was written, that Jesus Christ "although he was rich, became a poor man." Therefore, for this reason, he chose both a poor mother, from whom he was born, and a poor homeland, about which it is said, "But you, O Bethlehem Ephratha, who are little to be among the clans of Judah," and the rest.
'''
source_url=''
source_title="HOMILIES ON LEVITICUS 8.4.3"

[[commentary]]
quote='''
For this reason, because "every male that opens the womb shall be called holy to the Lord", he was brought "to Jerusalem", that he might appear before the sight of God, and on account of that which follows: "that a gift might be given for him, according to what is written in the law of the Lord: a pair of turtledoves or two young pigeons". We see a pair of turtledoves and two young pigeons offered for the Savior. I even think those birds blessed, which were offered for the birth of the Lord; and just as I marvel at Balaam's ass and heap up her happiness, because she was worthy not only to see the angel of God, but also, with her mouth unlocked, to break forth into human speech, so much more do I proclaim and exalt these birds, that they were offered for our Lord and Savior before the altar. "That they might offer for him a pair of turtledoves or two young pigeons". Perhaps I may seem to bring in something novel, but something too little worthy of the majesty of the matter. Just as the generation of the Savior was new, not of man and woman, but of a virgin alone only, so also this "pair of turtledoves and two young pigeons" were not such as we behold with the eyes of the flesh, but such as the Holy Spirit is, who "descended in the form of a dove and came" upon the Savior, when he was baptized in the Jordan. Such too was the "pair of turtledoves": those birds were not, like these, such as flit through the air, but something divine and, for human contemplation, more august, appeared under the form of a dove and a turtledove, so that he who was being born for the whole world and was to suffer might be cleansed before the Lord not with such victims as all men use, but, as his whole dispensation was new, so he might have new victims also, according to the will of Almighty God in Christ Jesus: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily14.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 14"
