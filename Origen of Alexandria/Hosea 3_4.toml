[[commentary]]
quote='''
I ask therefore on what day the manna began to be given from heaven, and I wish to compare our Lord's day with the sabbath of the Jews. For from the divine scriptures it appears that the manna was first given upon the earth on the Lord's day. For if, as Scripture says, it was gathered for six continuous days, but on the seventh day, which is the sabbath, there was a cessation, without doubt its beginning was from the first day, which is the Lord's day. But if from the divine scriptures this is established, that on the Lord's day God rained the manna and on the sabbath he did not rain it, let the Jews understand that even then our Lord's day was preferred to the Jewish sabbath, that even then it was indicated that on their sabbath no grace of God came down to them from heaven, that no heavenly bread, which is the word of God, came to them. For the prophet says also elsewhere: "for many days the children of Israel shall sit without king, without prince, without prophet, without victim, without sacrifice, without priest". But on our Lord's day the Lord always rains manna from heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily07.html'
source_title="HOMILIES ON EXODUS 7"


[[commentary]]
quote='''
For the prophecy was fulfilled that had declared, "For the children of Israel shall abide many days without king and prince. There shall be no victim, nor altar, nor priesthood, nor answers." These testimonies, accordingly, we employ against those who presume to assert that what is spoken in Genesis by Jacob refers to Judah. They say that there still remains a prince of the race of Judah—he, namely, who is the prince of their nation, whom they style patriarch—and that there cannot fail [a ruler] of his seed, who will remain until the advent of that Christ whom they picture themselves. But if the prophet's words are true when he says, "The children of Israel shall abide many days without a king, without prince; and there shall be no victim, nor altar, nor priesthood," and if, certainly, since the overthrow of the temple, victims are neither offered, nor any altar found, nor any priesthood exists. So it is most certain that, as it is written, princes have departed from Judah and a leader from between his thighs, until the coming of him for whom it has been reserved. It is established, then, that he has indeed come from whom it has been reserved and in whom is the expectation of the Gentiles. And this manifestly seems to be fulfilled in the multitude of those who have believed in God through Christ out of the different nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25204.html'
source_title="ON FIRST PRINCIPLES 4:1.3"
