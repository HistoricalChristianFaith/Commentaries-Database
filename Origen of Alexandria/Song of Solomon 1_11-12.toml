source_title="COMMENTARY ON THE SONG OF SONGS, BOOK 2"

[[commentary]]
quote='''
After these things the bridegroom is at his rest; he has lain down as a lion, he has slept as a lion's whelp, so that thereafter it may be asked: Who shall rouse him? While he sleeps in the meantime, the companions of the bridegroom, the Angels, appear to the bride, and console her with these words: We cannot make ornaments of gold for you; for we are not so rich as your bridegroom, who bestows on you a golden necklace. We will make a likeness of gold; for we do not have gold. And in this too there is cause for gladness, if we make likenesses of gold, if we make studs of silver. We will make you likenesses of gold, with studs of silver. But not for all time; only until your bridegroom rises from his couch. For when he has risen, he himself will make you gold, he himself will make silver, he himself will adorn your mind and understanding, and you will be truly rich in the bridegroom's house, a beautiful bride — to whom be glory unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25201.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 1"
