[[commentary]]
quote='''
But what is added after this? "And the children of Israel", it says, "added to do evil in the sight of the Lord; and Ehud was dead". Undoubtedly in these matters too there is preserved that observation which we pointed out in the preceding passages: that for the sins of the people the good leader of the people dies. For when they have been made unworthy and have "done evil in the sight of God", the man of God will be taken away from them. But perhaps our people will say: when is the Church of God without a judge? Even if the former departs, another is supplied. Perhaps we shall say something bold, yet we say what is written. Not always is the prince of the people and judge of the Church given by the judgment of God, but according as our merits demand. If our deeds are evil and we "work evil in the sight of God", princes are given to us according to our heart; and this I will prove to you from the Scriptures. For hear what the Lord says: "They made themselves a king and not by me, and a prince and not by my counsel". And this seems to be said of that Saul, whom indeed the Lord himself had chosen and had commanded to be made king; but because he had been chosen not according to the will of God, but according to the merit of a sinful people, he denies that he was appointed with his will or counsel. Let us understand, then, that some such thing happens in the churches also, that according to the merits of the people either a ruler of the Church powerful in word and deed is granted by God or, if "the people do evil in the sight of the Lord", such a judge of the Church is given under whom the people may suffer "hunger and thirst", "not a hunger of bread nor a thirst of water, but a hunger of hearing the word of God". So, then, let us act, and so let us pray, that the divine displeasure may never condemn us in a "hunger of the word" and a "thirst", that there may never be taken away from us one who may instruct us in word and deed, who may furnish to the peoples out of himself a perfect example in conduct and integrity, in patience and meekness. For if we "do evil in the sight of the Lord" — that is, if we act wickedly, if we do our own will and not God's — then "Ehud dies" for us also, Shamgar is taken away, and our praise will be darkened, and we will be "delivered into the hands of Jabin king of Canaan". Now "Jabin" is interpreted "sense" or "prudence." If, therefore, we "do not approve to have God in our knowledge, God delivers us up unto a reprobate sense, filled", it says, "with iniquity, wickedness, fornication, covetousness, full of envy, murders, contention, deceit, whisperers, backbiters, hateful to God, injurious, proud, haughty, disobedient to parents, disorderly, without affection, without mercy". You see who and of what sort are they who "are delivered up unto a reprobate sense", who "are delivered up to Jabin the prince of the Canaanites".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily04.html'
source_title="HOMILIES ON JUDGES 4"
