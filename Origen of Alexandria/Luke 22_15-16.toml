[[commentary]]
quote='''
Concerning the bread a thing similar to what Matthew records of the cup is said in Luke: "With desire I have desired to eat this Passover with you. I say to you that from now on I will not eat it, until it be fulfilled in the kingdom of God." Therefore the Savior will eat and drink that bread and paschal drink renewed "in the kingdom of God," and he will eat and drink with his disciples. For just as "he did not deem it robbery to be equal to God, but humbled himself even unto death," so he will eat the bread and drink of the generation of the vine, and he will drink it new, and by reason of his great goodness and his love of men he will eat and drink with his disciples, "when he shall have delivered up the kingdom to God and the Father." For attend to what he says: when I shall drink it new with you, at no other time, except in the kingdom of my Father. And elsewhere, moreover, "the kingdom of God is not food and drink." For in a bodily sense, and according to the likeness of present food and drink, "the kingdom of God is not food and drink" … to those who have shown themselves worthy of the heavenly bread and the bread of angels and of that food of which the Savior says: "My food is to do the will of him who sent me and to accomplish his work." But that "in the kingdom of God" we shall eat and drink, it is possible to demonstrate from many places of the Scriptures, especially from that which is written: "Blessed is he who shall eat bread in the kingdom of God." Therefore this Passover will be fulfilled "in the kingdom of God," and Jesus will eat it with his disciples and will drink; and what the Apostle says, "Let no one judge you in food and in drink and the other things which are a shadow of things to come," has a revelation directed to the future mysteries concerning spiritual foods and drinks, of which the things that had been written in the Law concerning foods and drinks were a shadow. And it is manifest that we shall eat true food and drink true drink "in the kingdom of God," building up and strengthening through them that most true life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252026.html'
source_title="COMMENTARY ON MATTHEW 86"
