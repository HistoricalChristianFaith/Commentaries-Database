[[commentary]]
quote='''
Then "he came into Nazareth, where he had been brought up, and having entered according to his custom into the synagogue on the sabbath day, he stood up to read; and the book of the prophet Isaiah was given to him; and unrolling the book he found the place where it was written: The Spirit of the Lord is upon me; wherefore he has anointed me". Not by chance did he unroll the book and find the chapter prophesying about himself as the reading, but this too was of the providence of God. For just as it is written: "A sparrow does not fall into the snare without the will of the Father", and because "the hairs of the head" of the apostles "are all numbered", so perhaps this also — that the book of Isaiah especially was found, and the reading not another, but this one, which spoke the mystery of Christ: "The Spirit of the Lord is upon me; wherefore he has anointed me" — for it is Christ who recounts these things — is not to be thought to have happened as it pleased and by chance, but by the providence and disposition of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily32.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 32"
