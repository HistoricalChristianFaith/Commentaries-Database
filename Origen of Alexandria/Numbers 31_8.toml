[[commentary]]
quote='''
But the divine Scripture was also careful to record their names. "Evi," it says, "and Rekem and Zur and Hur and Reba." These are they who reign among the Midianites, whom everyone who serves God as a soldier ought to overcome and utterly to destroy. For Evi is interpreted "beastly" or "wild." And how will you be able to please Him who has approved you, if you do not cut off from yourself and utterly destroy beastly and wild ways? How will you be able to attain to the beatitude of the meek, unless first you slay Evi and hand over to death the wildness of all anger? I think that the divine Scripture did not narrate these names for the sake of history, but fitted them for the sake of causes and realities. For do you suppose there would have been anyone so foolish as to impose on his son the name "Beastly"? But I judge rather that the divine word looked to the instruction of souls, wishing to show us that we ought to make war against vices of this kind and to drive them from the dwellings of our flesh, to put these kings to flight from the kingdom of our body; which the Apostle more evidently indicates, saying: "Let not sin therefore reign in your mortal body." But do you wish to see that not only among the saints are names fitted to realities, but also among the Gentiles and Barbarians? Concerning the saints indeed it is known why Abram was called Abraham, and Sarah Sarra, and Jacob Israel. But let us show that this custom is held also among the Barbarians. Had not one of the sons of Israel received from his parents the name Joseph? But when he passed into Egypt and stood before Pharaoh, he changed his name and from Joseph surnamed him Zaphenath-paneah, which Pharaoh in his own tongue composed from the revelation of secrets or of dreams. And not only is a name fitted to Joseph from the reality before Pharaoh, but Daniel too in Babylon is named Belteshazzar, and Hananiah and Azariah and Mishael are called Shadrach, Meshach, Abednego. You see, then, that both the names of Israelite men and even of barbarian men are fitted in the law not by chance, but for the sake of realities and causes. Therefore Moses called the king of the Midianites as he himself judged he should be called. "It is a beastly wildness," he says, "that reigns among the Midianites, and not that alone, but there is also among them another king by the name of Rekem, which in our tongue is 'emptiness.'" Emptiness, then, also reigns among the nation of the Midianites; for there is in truth much emptiness and vanity in this world — nay, "vanity of vanities, and all is vanity" — which the soldier of God ought to overcome and conquer. But he conquers emptiness who does nothing emptily, nothing superfluous and that pertains not to the matter; who remembers that command of the Lord, in which He says that: "even for an idle word men shall render account in the day of judgment." But in this life almost everything men speak, everything they do, is idle and empty; for every act and every word is called empty in which there is not within something for God or for the commandment of God. There is also another king of Midian, Hur, and this is interpreted "provocation." You see what sort they are who reign among the Midianites, all of whom must be opposed, nay, whom it is fitting to be destroyed by those who follow God, and to be slain. For it is not so much the names of kings as of vices, which reign in men, that are reported in the law, and not so much the wars of nations as of carnal concupiscences, which do battle against the soul, that are described. Finally, those who reign in the vices are said to be five kings, that we may be most evidently taught that every vice which reigns in the body depends on the five senses. These five senses, then, are to be destroyed out of the kingdom of the Midianites, that no longer may vices reign over them, but righteousness, and that they may not look for a scandal at the things they see, but for edification. For among the Midianites these senses reigned unto scandalizing, that they might scandalize and deceive. And therefore the Lord commanded that, if your eye scandalize you, you pluck it out; if your hand or foot, you cut it off. You see, then, that He Himself commands the kings of those who scandalize to be cut off and destroyed. "It is better," He says, "for you one-eyed to enter into the kingdom of God, and maimed or lame, than with these to be cast into Gehenna." In which He by no means commands the eye of our body to be dug out, nor the hand or foot to be cut off, but He commands the sense that perceives carnal things and wantons in carnal concupiscences to be cut off, that our eyes may see right things and our ears hear right things and our taste taste the word of God and our hands handle and touch of the Word of life. And this is that in which, the kings of the Midianites being destroyed and the affections of scandal amputated, there reigns in us as righteousness our very Lord Jesus Christ, who was made for us righteousness from God, and peace, and redemption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily25.html'
source_title="HOMILIES ON NUMBERS 25.3"
