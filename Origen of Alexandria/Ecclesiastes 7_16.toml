[[commentary]]
quote='''
But neither these, who love more, nor those, who hate, hold to the rule of truth, and the ones lie through love, the others through hatred. Whence it is fitting to put reins upon love also, and to permit it only so much liberty of roaming as will not let it plunge over precipices. It is written in Ecclesiastes: "Be not overly just, nor think things greater than yourself, lest perhaps you be struck senseless". Following this example, I can say something similar: do not love a man "with your whole heart and with your whole soul and with your whole strength"; do not love an angel "with your whole heart, with your whole soul, with your whole strength", but keep this precept, according to the word of the Savior, for God alone. For "you shall love", he says, "the Lord your God with your whole heart and with your whole soul and with your whole strength".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily25.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 25"
