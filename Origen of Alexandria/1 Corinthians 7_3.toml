[[commentary]]
quote='''
Let the husband render to the wife the debt owed, and likewise also the wife to the husband. He took forethought both to heal human weakness and to arrange most decorously the matter concerning the local circumstances; wherefore he said that a debt is owed by the husband, and to the husband by the wife.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XXXIII"
