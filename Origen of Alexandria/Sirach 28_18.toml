[[commentary]]
quote='''
If a wound is inflicted on the body, or a bone is broken, or the joining of the sinews is dissolved, such wounds are wont to befall bodies within the space of a single hour, and afterward, with very many torments and pains endured, are scarcely healed over a long time; for how great swellings arise in the place, how great torments are generated? But now, if it should happen that in the same wound or in the same fracture one is wounded again and more often and is broken more frequently, with how great penalties can this be cured and with how great torments be medicined? And over how long a time, if indeed it can be, is it brought to health? And scarcely at some point will it be so cured that it escapes either weakness of the body or ugliness of the scar. Pass now from the example of the body to the wounds of the soul. As often as the soul sins, so often is it wounded. And lest you doubt that it is wounded by sins as by darts and swords, hear the Apostle admonishing us to take up the shield of faith, in which, he says, "you may be able to extinguish all the fiery darts of the evil one." You see, then, that sins are the darts of the evil one, which are aimed at the soul. But the soul suffers not only the wounds of darts, but also the fractures of the feet, when snares are prepared for its feet and its steps are tripped up. These, therefore, and such-like wounds, over how long a time do you think they can be healed? O if we could see, through each single sin, how our inner man is wounded, how an evil word inflicts a wound! Have you not read, they say, that swords wound, but not as the tongue does? The soul, therefore, is wounded also through the tongue; it is wounded also through evil thoughts and lusts; and it is broken and crushed through the works of sin. And if we could see all these things and feel the scars of the wounded soul, it is certain that we would resist against sin unto death. But now, just as those who are either filled with a demon or deranged in mind do not feel if they are wounded, because they lack their natural senses, so too we, made senseless either by the desires of the world or intoxicated by our vices, cannot feel how great wounds, how great contusions of the soul we acquire by sinning. And therefore it is a most consistent reckoning that the time of punishment — that is, of cure and of healing — is extended, and that for each single wound, according to the quality of the blow, the spaces of healing also are prolonged. Thus, therefore, both the equity and the kindness of God will become evident even in the very punishments of the soul; and he who has sinned, hearing these things, may come to his senses and sin no more. For conversion in the present life, and repentance fruitfully carried out, will confer a swift medicine on wounds of this kind, because repentance not only heals the past wound, but also does not allow the soul to be wounded by sin any further.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily08.html'
source_title="HOMILIES ON NUMBERS 8.1"
