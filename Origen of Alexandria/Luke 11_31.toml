[[commentary]]
quote='''
And when the Saviour’s voice is heard thundering out the words: The queen of the South shall come to judgement and shall condemn the men of this generation, because she came from the ends of the earth to hear the wisdom of Solomon, and behold, a greater than Solomon is here, you must understand what is said in a mystical sense: the queen of the South, who comes from the ends of the earth, is the Church; and the men of this generation whom she condemns, are the Jews, who are given over to flesh and blood. She comes from the ends of the earth to hear the wisdom, not of that Solomon about whom we read in the Old Testament, but of Him who is said in the Gospel to be greater than Solomon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25201.html'
source_title="Homilies on the Song of Songs, Homily 1"
