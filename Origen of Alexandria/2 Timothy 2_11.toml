[[commentary]]
quote='''
This very thing the Savior first grants to you as well, that you may fall. You were a heathen — let the heathen fall in you; you loved harlots — let the fornicator first perish in you; you were a sinner — let the sinner fall in you, that you may thereafter rise again and say: "if we have died with him, we shall also live with him", and: "if we have been made conformable to his death, we shall be conformable also to his resurrection".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily17.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 17"
