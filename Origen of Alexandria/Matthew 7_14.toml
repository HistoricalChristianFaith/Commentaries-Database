[[commentary]]
quote='''
You perhaps believed that the way which God shows was level and soft and had absolutely no difficulty or labor: it is an ascent, and a winding ascent. For the way by which one strives toward the virtues is not downhill, but one ascends, and ascends narrowly and with difficulty. Hear also the Lord in the Gospel saying how "strait and narrow is the way that leads to life." See, then, how greatly the Gospel agrees with the Law. In the Law the way of virtue is shown to be a winding ascent; in the Gospels it is called "the strait and narrow way that leads to life." Cannot even the blind openly see this, that one and the same Spirit wrote the Law and the Gospels?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily05.html'
source_title="HOMILIES ON EXODUS 5"
