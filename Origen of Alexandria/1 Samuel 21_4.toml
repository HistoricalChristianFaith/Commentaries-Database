[[commentary]]
quote='''
By "profane" he now means not the unclean, but those who are not holy, in contradistinction to the holy loaves set out upon the table. For the table continually held six loaves, being exchanged, on behalf of the twelve tribes of Israel, which they called the loaves "before the Lord," so that each of the loaves was offered on behalf of two tribes, and all of them on behalf of the twelve tribes. What good, then, came from this? That the tribes of Israel were joined together in concord. And what greater thing was signified beforehand? That the blessed apostles were sent out two by two by the Savior to preach first among the tribes of Israel, so that of the twelve disciples the number came to six pairs at once.

"Lay" bread: not because those who are not holy are profane, but because they are being compared with what is holy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FFragments%2520on%2520Kingdoms.html'
source_title="FRAGMENTS ON KINGDOMS 9"

[[commentary]]
quote='''
For you both ought to know that the prayer which comes from the purity of a husband and wife is not the same as the prayer which comes from intercourse. For if even in the case of their idols the Greeks sometimes keep themselves chaste, how much more should you, who pray to the God of all things? It is good, then, to make allowance on account of weakness, but to abstain on account of prayers. And Moses too purifies the people and says, "For three days do not approach a woman," so that from having purified themselves beforehand they might be able to become hearers of God. And in the Books of Kingdoms, Abiathar — or Abimelech — the priest wishes to set "holy loaves" before David as he was fleeing the plot of Saul, and, wishing to set out the "holy loaves," what does he say except, "Are the young men pure from a woman?" — not, that is, from a strange woman, but from a wife. So then, in order that one may receive "loaves of the presentation", one ought to be pure from "a woman"; but in order that one may receive the loaves greater than those of the presentation, over which the name of God and of Christ and of the Holy Spirit has been invoked, ought one not to be far more pure, so that he may truly receive the loaves unto salvation and not "unto judgment"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XXXIV"
