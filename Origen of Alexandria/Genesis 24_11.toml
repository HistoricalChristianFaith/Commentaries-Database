[[commentary]]
quote='''
"In the evening," then, she came to the waters. Concerning the evening we have already spoken above. But observe the prudence of the servant: he does not wish to take a bride for his lord Isaac unless he finds one comely and beautiful of face, a virgin — and not only a virgin, but one whom no man has touched — and unless he finds one drawing water; he does not wish to betroth any other to his lord. He does not give her ornaments unless she is such a one; he does not give "earrings," he does not give "bracelets"; she remains unadorned, untaught, uncombed. Do we suppose that Rebekah's father, a rich man, did not have bracelets and earrings to place upon his daughter? Was there such negligence or avarice in him that he would not give ornaments to his daughter? But Rebekah does not wish to be adorned with the gold of Bethuel. The ornaments of a barbarous and unskilled man are not worthy of her; she seeks necklaces from the house of Abraham, because patience is adorned from the house of the wise. Therefore Rebekah's ears could not receive their proper adornment unless Abraham's servant came and himself adorned them; nor do her hands receive ornaments except those which Isaac has sent. For she wishes to receive golden words in her ears and to have golden deeds in her hands. But these she could not first receive nor deserve, unless she had come to the wells to draw waters. You who do not wish to come to the waters, who do not wish to receive in your ears the golden words of the prophets, how will you be able to be adorned in doctrine, adorned in deeds, adorned in character?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily10.html'
source_title="HOMILIES ON GENESIS 10.4"
