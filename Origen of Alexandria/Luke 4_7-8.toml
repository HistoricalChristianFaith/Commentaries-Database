[[commentary]]
quote='''
The devil therefore says to the Lord: You have come for this, to fight against me and to take from my dominion those whom I now hold subject. I do not wish you to contend, I do not wish you to strive, lest you have any trouble in the struggle. There is one thing that I beg: "falling down, adore me", and receive all the kingdom that I hold. But our Lord and Savior does indeed wish to reign and to have all the nations subject to himself, that they may serve justice, truth, and the other virtues; yet he wishes to reign as justice itself, so that he may reign without sin, so that he may do nothing unseemly, and he does not wish to be crowned without labor by being subject to the devil, nor so to reign over the rest that he himself should be ruled by the devil. Whence he speaks to him: "it is written: You shall adore the Lord your God, and him alone shall you serve". All these, he says, I wish for this reason to be subject to me, that they may "adore the Lord God and serve him alone"; this is the desire of my kingdom. But you wish sin to begin from me—sin which I have come here to dissolve, and which I desire to take away from the rest as well. Know and understand that I abide in what I have said, that the Lord God alone should be adored, and that I will bring all these under my power and subject them to my kingdom. To whom we too rejoice to be subject, and let us beseech God that he may put to death "the sin reigning in" our "body" and that Christ Jesus alone may reign in us: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily30.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 30"
