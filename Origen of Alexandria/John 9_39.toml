[[commentary]]
quote='''
To this I have found something similar written in the Gospel according to John: "for judgment I have come into this world, that those who do not see may see, and those who see may be made blind". Therefore, just as he came for judgment, that "those who do not see" of the nations "might see", and those who saw before, of Israel, "might be made blind", so he came "for the fall and rising of many". For at the coming of the Lord the Savior, those who had stood before fell down, and those who had fallen rose up. … We all have in ourselves both sight and blindness. Adam both saw and did not see. … There is an eye of the body, with which we behold these earthly things, an eye according to the sense of the flesh, of which the Scripture says: "walking vainly, puffed up by the sense of the flesh". To this we have another, contrary and better, that savors of divine things; and because it was blind in us, Jesus came to make it see, that those who did not see might see, and those who saw might be made blind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily16.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 16"
