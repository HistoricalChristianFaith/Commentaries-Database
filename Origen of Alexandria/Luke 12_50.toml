[[commentary]]
quote='''
For our "proof" extends not only as far as blows, but reaches even to the shedding of blood, because Christ also, whom we follow, poured out His blood for our redemption, that from it we might come forth washed in our own blood. For the baptism of blood alone is what renders us purer than the baptism of water rendered us. And this I do not presume of myself, but Scripture reports it, the Lord saying to His disciples: "I have a baptism to be baptized with, which you know not. And how am I pressed until it be accomplished?" You see, then, that He named the shedding of His blood a "baptism." And if in saying these things I give no offense, I fear that this baptism may be more eminent than that baptism which is handed on through water. For of that one, once received, very few are so blessed as to have been able to keep it unstained even to the end of life; but whoever has been baptized with this baptism can sin no more thereafter. And if it is not rash to venture anything in such matters, we may say that through that baptism past sins are purged, but through this one even future sins are done away. There sins are forgiven, here they are shut out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily07.html'
source_title="HOMILIES ON JUDGES 7"
