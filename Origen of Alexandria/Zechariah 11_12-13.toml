[[commentary]]
quote='''
But since what the evangelist says after these things (then was fulfilled that which had been spoken by Jeremiah the prophet, saying the things which are written) — this is not found to have been prophesied by Jeremiah anywhere in his books, whether those which are read in the churches or those which are recited among the Jews — but if anyone can know, let him show where it is written. I suspect, however, that either it is an error of the Scripture and Jeremiah is put for Zechariah, or that there is some secret writing of Jeremiah in which it is written. Now such is the text in Zechariah the prophet: "and I will say to them: if it is good in your sight, give me my wages, or refuse them; and they appointed my wages, thirty pieces of silver. And the Lord said to me: put them down into the furnace, and see if it is genuine, even as I was proved for their sake. And I took the thirty pieces of silver, and put them into the house of the Lord, into the furnace". But if anyone saying this supposes that he stumbles, let him see whether this may be prophesied somewhere in the secret writings of Jeremiah, knowing that the Apostle too brings forward certain writings of the secret books, as he says somewhere: "what eye has not seen nor ear heard"; for in no canonical book is this found set down, except in the secret writings of Elijah the prophet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252027.html'
source_title="COMMENTARY ON MATTHEW 117"
