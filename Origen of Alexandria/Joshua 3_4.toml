[[commentary]]
quote='''
See, finally, what is said: "the people," it says, "so as to be far from the ark of the Covenant, two thousand cubits." But the priests and Levites are near, and quite near, so that upon their own shoulders the ark of the Lord and the divine legislation are carried. Blessed are they who deserve to be near to God. But remember what is written: "those who draw near to me draw near to fire." If you are gold or silver and "draw near to the fire," you will shine forth through the fire far more splendid and gleaming; but if, upon the foundation of faith "laid" in you, you are conscious to yourself that you have "built up wood, hay, stubble," then with such a building, if you "draw near to the fire," you will be consumed. Blessed, therefore, are they who are near, and who are so near that the fire illumines them and does not burn them. Israel too, however, will be saved, but placed far off it will be saved, and it makes its journey not by its own strength, but by the supports and providence of the priests.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily04.html'
source_title="HOMILIES ON JOSHUA 4.3"
