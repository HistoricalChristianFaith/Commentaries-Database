[[commentary]]
quote='''
For indeed, when I was often examining the seventy-first psalm within myself, this moved me: that, when it describes the coming of Christ in it, in that very psalm it also asserts that this shall come to pass: "and he shall descend," it says, "like rain upon a fleece, and like raindrops dripping upon the earth." A "fleece" is named here in Judges, a "fleece" is written also in the psalms. For "he shall descend like rain," it says, "upon a fleece." He "descended," therefore, "upon" that "fleece" of the people of the circumcision, and "like raindrops dripping upon the earth," that is, upon the rest of the earth, "descended" our Lord Jesus Christ, "dripping" also "upon" us and bringing drops of heavenly dew to us also, the nations, that we too might drink, we who were dried up "over" all the "earth" by continual aridity. For he knew that the divine "dew," which is the coming of the Son of God, was to come not only to the Jews, but afterward also to the nations, since indeed from the "unbelief" of Israel "salvation comes to the nations."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily08.html'
source_title="HOMILIES ON JUDGES 8"
