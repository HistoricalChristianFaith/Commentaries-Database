[[commentary]]
quote='''
Now let us come to the beginning of the very reading that was recited, so that with the Lord's help we may be able, even if not with perfect clarity, yet at least in summary, to gather and explain their meaning. He says, then: "And these are the stages of the children of Israel, from the time they went out of the land of Egypt with their power by the hand of Moses and Aaron. And Moses wrote down their settings-out and their stages by the word of the Lord," and so forth. You have heard that Moses wrote these things by the word of the Lord. And why did the Lord will these things to be written? That this writing of the stages which the children of Israel made might be of some profit to us, or that it might be of no profit? And who would dare to say that the things which are written by the word of the Lord have no usefulness and confer nothing of salvation, but merely narrate an event that happened — one that indeed passed by at that time, and from the report of which nothing now reaches us? This opinion is impious and foreign to the catholic faith, and belongs only to those who deny that the one sole wise God, of the law and of the gospels, is the Father of our Lord Jesus Christ. What, therefore, the faithful understanding ought to perceive from these stages, let us attempt to treat in summary, as far as the time allows. In the earlier discussion, when the departure of the children of Israel from Egypt had furnished us with occasion to speak of it, we said that each person can be seen to go out spiritually from Egypt in two ways: either when, forsaking the life of the Gentiles, we come to the knowledge of the divine law, or when the soul departs from the dwelling of this body. To both, then, do these stages look which Moses now describes by the word of the Lord. For concerning those stages which the soul, stripped of the body — nay rather, clothed again with its own body — is to inhabit, the Lord declared in the gospel, saying: "There are many mansions with the Father; otherwise I would have told you: I go and prepare a mansion for you." There are, then, those many mansions which lead to the Father, in each of which what cause, what usefulness the soul's lingering receives, or what instruction or illumination, He alone knows, the Father of the age to come, who says of Himself: "I am the door; no one comes to the Father except through me." He, perhaps, in each of these mansions will become a door for each soul, so that through Him it may enter and through Him go out and find pastures, and again enter into another, and thence into yet another mansion, until it comes to the Father Himself. But we, almost forgetful of our preface, have suddenly lifted your hearing to lofty and exalted things. Rather, let us return to those things that are done among us and within us. In Egypt were the children of Israel; they were afflicted in the works of Pharaoh the king with clay and brick, until, groaning, they cried out to the Lord, and He, hearing their groaning, sent to them His word through Moses and led them out of Egypt. And we too, therefore, when we were in Egypt — I mean in the errors of this world and in the darkness of ignorance, working the works of the devil in the desires and pleasures of the flesh — the Lord had mercy on our affliction and sent His Word, His only-begotten Son, to rescue us from the ignorance of error and lead us to the light of the divine law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.2"


[[commentary]]
quote='''
And Moses wrote down, it says, their completions and their stations by the word of the Lord. He wrote these things, therefore, by the word of the Lord, so that we, reading and seeing how many departures and how many stations lie ahead of us for the journey that leads to the kingdom, might prepare ourselves for this way; and, considering the road that lies before us, might not allow the time of our life to be consumed sluggishly or slackly, lest perchance, while we linger among the vanities of this world and take delight in each and every thing that comes to sight or hearing, or even to touch and smell and taste, the days slip away, the time passes by, and we fail to accomplish the traversing of the whole span of the journey before us, and we give out midway, and there befall us that which is reported of certain ones who could not arrive, but whose limbs fell in the desert. We are on a journey, therefore, and we have come into this world for this purpose: that we might pass from virtue to virtue, not that we might remain on the earth for the sake of earthly things, like that man too who said, "I will pull down my barns and build others larger, and I will say to my soul: Soul, you have many good things laid up for many years; eat, drink, be merry" — lest perchance the Lord say to us also, as to him: "You fool, this night your soul shall be taken from you." He did not say "in this day," but "in this night." For here too a man is destroyed in the night, like the firstborn of the Egyptians, as one who has loved the world and its darkness and has been a partaker of the rulers of this world of this darkness. And this world is called darkness and night on account of those who live in ignorance and do not receive the light of truth. But such as these do not set out from Rameses nor cross over to Succoth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.7"
