[[commentary]]
quote='''
I say that it is no great matter if God, as God, catches the wise in their craftiness, but rather in Paul who says "for though living in the flesh we do not wage war according to the flesh; for the weapons of our warfare are not fleshly but powerful for God to the pulling down of strongholds; casting down reasonings and every high thing that exalts itself against the knowledge of God". And that you may understand this more clearly, look for me at Paul, when he had come to Athens and was disputing with those he met, so that even some of the Epicurean and Stoic philosophers engaged with him; for then by the grace of Christ he grasped them all around and exposed their sophisms; and here I think the wise are named the sophists, all who speak entangled sophisms but do not teach the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XVI"
