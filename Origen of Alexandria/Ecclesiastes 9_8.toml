[[commentary]]
quote='''
No one, then, can hear the word of God unless he has first been sanctified, that is, unless he is "holy in body and spirit", unless he has washed his garments. For he is about, a little later, to enter to the wedding supper, he is about to eat of the flesh of the lamb, he is about to drink the cup of salvation. Let no one enter to this supper with soiled garments. For this too wisdom commanded elsewhere, saying: "at every time let your garments be clean". For your garments have been washed once: when you came to the grace of baptism, you were purified in body, you were cleansed from all defilement of flesh and spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily11.html'
source_title="HOMILIES ON EXODUS 11"
