[[commentary]]
quote='''
So, then, understand that your soul too has had many lovers, who delighted in her beauty, with whom she played the harlot. Concerning whom she also said: "I will go after my lovers, who give me my wine and my oil", and the rest. But now she has come to that time when she says: "I will return to my former husband, because it was better for me then than now". You have returned, then, to your former husband; without doubt you have given offense to your lovers, with whom you were committing adulteries. Unless, therefore, you now abide with your husband in whole faith, and are glued to him with your whole love, out of the many crimes which you have committed every movement of yours and glance of yours is suspect to him, and your very gait, if it be too careless. He can see nothing further in you that is wanton, nothing dissolute and prodigal. But when you turn your eyes even a little away from your husband, at once there must needs come a remembrance of former things. Therefore, that you may both blot out former things and that trust may be able to be had in you for the rest, you must not only do nothing unchaste, but not even think it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
