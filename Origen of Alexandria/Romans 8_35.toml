[[commentary]]
quote='''
"Who then shall separate us from the love of God? Tribulation? or distress? or persecution? or famine? or nakedness? or peril? or the sword?" In return for all these things, he says, which we enumerated above — that is, that we are no longer in the flesh but in the spirit; and that the Spirit of God dwells in us; and that Christ is in us, through whom the body indeed is dead because of sin, but the spirit is life because of justification; and that we are no longer debtors to the flesh, to live according to the flesh, because by the spirit we have mortified the deeds of the flesh; and that through the spirit of adoption we have been made sons of God, and if sons, also heirs of God, and joint-heirs with Christ; and that the whole creation groans together with us and suffers together with us, awaiting the revelation of the sons of God; and that for us who love God all things work together for good; and that he foreknew and predestined us, who are called according to his purpose, to be conformed to the image of his Son — since for all these benefits, he says, which we have obtained, we are fixed and rooted in the love of God, who will be able to separate us from it? If tribulation comes, we shall say to God, "In tribulation you have enlarged me." If there is distress of the world, coming from the necessity of the body, we shall seek the breadth of the wisdom and knowledge of God, in which the world cannot straiten us. For I shall return to the most ample fields of the divine Scriptures; I shall seek the spiritual understanding of the word of God, and no distress will confine me in it. For I shall ride through the most spacious expanses of mystical and spiritual understanding. If I suffer persecution, and confess my Christ before men, I am certain that he too will confess me before his Father who is in heaven. If famine is present, it cannot disturb me: for I have the bread of life which came down from heaven and refreshes hungering souls; nor can that bread ever fail: for it is perfect and eternal. Nakedness does not confound me: for I have put on the Lord Jesus Christ, and I hope to put on over it our habitation which is from heaven: "For this mortal must put on immortality, and this corruptible put on incorruption." I shall not fear peril: "For the Lord is my light and my salvation, whom shall I fear?" and "The Lord is the defender of my life, of whom shall I be afraid?" An earthly sword cannot terrify me: for I have with me a stronger one, "the sword of the Spirit, which is the word of God," and with me is "the living and effectual word of God," which is "more piercing than any two-edged sword." If therefore the sword of the world comes upon my neck, it wins for me a greater love toward God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
