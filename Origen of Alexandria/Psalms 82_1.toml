[[commentary]]
quote='''
It will be necessary to gather from the Scriptures what to distinguish signifies. "God stood", he says, "in the assembly of gods, and in the midst he will distinguish gods"; in this it appears that to distinguish is a work of God; for, judging being another matter, which happens concerning those worthy of judgment, it is a good thing to be found a god in the "assembly" of gods, so that one may no longer be judged but be distinguished and, as it were, entrusted with some one rank of those with which the gods in the "assembly" are entrusted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XIX"
