[[commentary]]
quote='''
By He appeared to the twelve he means the Lord after the resurrection; for it was likely that Matthias too was present, who had been appointed an apostle in place of Judas.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LXXVII*"
