[[commentary]]
quote='''
The witch of Endor did not bring up Samuel, for that is impossible; nor did the one who came up speak the truth. But who this was, and by what power he came up, inquire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FFragments%2520on%2520Kingdoms.html'
source_title="FRAGMENTS ON KINGDOMS 14"
