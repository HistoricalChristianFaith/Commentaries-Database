[[commentary]]
quote='''
Where are they who deny that Christ proclaimed in the Gospel the law to be of God, or can it be supposed that the righteous God made His own Son under a hostile law which He Himself had not given? It is written in the law of Moses as follows, Every male which openeth the womb shall be called holy unto the Lord. (Ex. 13:2, 12.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"They brought him" therefore "that they might present him before the sight of the Lord". Fulfilling the precepts of what Scripture? Surely of this one: "as it is written," he says, "in the law of Moses, that every male that opens the womb shall be called holy to the Lord", and: "three times a year every male shall appear in the sight of the Lord God". The males which were holy from the fact that they had opened their mother's womb were offered before the altar of the Lord: "every male," it says, "that opens the womb", sounds something sacred. For whatever male you may say has been poured forth from the womb, he does not open his mother's womb as the Lord Jesus does, because in all women it is not the birth of the infant, but the intercourse of the man, that unlocks the womb. But the womb of the Lord's mother was unlocked at that time at which the birth also was brought forth, because before the birth of Christ no male at all touched that holy womb, to be venerated with all reverence. I dare to say something further: that even in what is written, "The Spirit of God shall come upon you, and the power of the Most High shall overshadow you", was the beginning of the seed and of the conception, and that without the unlocking of the womb the new offspring grew in the womb. Whence the Savior himself speaks: "but I am a worm and not a man, the reproach of men and the outcast of the people". He saw in his mother's womb the uncleanness of bodies; walled about on this side and that by her inward parts, he endured the confinements of earthly dregs; whence he likens himself to a worm and says: "I am a worm and not a man". For man is wont to be born of male and female, but I was born not of male and female, according to the rite and nature of men, but after the pattern of the "worm", whose seed is not from elsewhere, but whose origin is in the very bodies, and from the very bodies, in which it grows together.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily14.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 14"
