[[commentary]]
quote='''
Do you wish us to bring forth for you examples of a similar mystery from the gospels too? Let us recall the words of the Lord, where he says that "at midnight" a certain man came to his friend, knocking at his door, and said: "friend, lend me three loaves, since a friend of mine has come to me from a journey, and I have nothing to set before him". In which, to touch briefly upon it, the night is this time of life, and the three loaves are: one which is cooked "in the oven", another "in the frying-pan", the third "on the gridiron".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily05.html'
source_title="HOMILIES ON LEVITICUS 5"
