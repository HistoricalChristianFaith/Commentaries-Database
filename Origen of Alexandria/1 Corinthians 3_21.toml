[[commentary]]
quote='''
He who is able to renounce all men and to become wholly worthy of the boasting that is in Christ, this man does not boast in man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XVII"
