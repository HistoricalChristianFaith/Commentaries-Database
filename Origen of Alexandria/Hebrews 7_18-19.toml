[[commentary]]
quote='''
Consider also of what sort this is: that in the law the face of Moses is indeed reported as glorified, though it be covered with a veil; but his hand, put "within his bosom," is recorded as "made leprous like snow." In which there seems to me to be most fully depicted the form of the whole law; for in his face is designated the word of the law, in his hand its works. Since, therefore, "by the works of the law no one was to be justified," nor could the law bring anyone "to perfection," for that reason the hand of Moses is made "leprous" and is hidden away "in his bosom," as though destined to have no perfect work; but his face is glorified, yet is covered with a veil, because his word has the glory of knowledge, but hidden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily12.html'
source_title="HOMILIES ON EXODUS 12"
