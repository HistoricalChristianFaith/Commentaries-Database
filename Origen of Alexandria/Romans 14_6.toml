[[commentary]]
quote='''
He who is wise concerning the day, is wise for the Lord; and he who eats, eats for the Lord: for he gives thanks to God; and he who does not eat, for the Lord does not eat, and gives thanks to God. Thanks therefore are rendered to God by both: by the one indeed for the fruit of continence; by the other for the liberty of eating. But since, as we have shown in what preceded, a deeper sense of the Apostle is found than the account of carnal foods contains, in the spiritual exposition, according to those things which we discussed above concerning those of whom one judges every day, but another judges between one day and another, we can understand this: that in the divine Scriptures each single chapter in which a doctrine of piety and faith is contained is called a day. For truly that is a day which illuminates the mind, which puts to flight the darkness of ignorance, which has in itself Christ, who is the sun of righteousness. If therefore there be anyone who so expends labor and zeal upon the divine letters that he examines and judges every day and every sense of divine Scripture, so that not one iota or one tittle of the law escapes him, this man will be seen to judge every day. But he who is not of such great capacity will grasp alternate ones, that is, a few senses out of many, which, if they do not suffice for the fullness of knowledge, are yet certainly enough for the sum of faith. Let each therefore, according to the apostolic counsel, give thanks to God: he who is wise concerning every day, and who eats all things, that is, who recognizes and understands all things; and he also who, although he does not eat all things, and does not grasp the understanding of all matters, is nevertheless saved by a brief confession of faith. And therefore even the one who does not eat all things, nor take in the knowledge of all things, is nevertheless himself also said to give thanks to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
