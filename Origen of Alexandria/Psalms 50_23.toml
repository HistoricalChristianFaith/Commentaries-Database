[[commentary]]
quote='''
let us seek within ourselves who is so great and such a one as to offer to God "a sacrifice of the peace offering" and "a sacrifice of praise". I judge him to be the one who in all his deeds causes God to be praised, and through whom is fulfilled that which our Lord and Savior says: "that men may see your good works and glorify your Father who is in heaven". He, then, has offered "a sacrifice of praise", for whose deeds, for whose teaching, for whose word and character and discipline God is praised and blessed; just as, on the contrary, there are those of whom it is said: "through you my name is blasphemed among the nations".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily05.html'
source_title="HOMILIES ON LEVITICUS 5"
