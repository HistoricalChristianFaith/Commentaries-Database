[[commentary]]
quote='''
But let us hear what he announces to him. "Not as a man," he says, "is God deceived, nor as a son of man is he himself frightened." Do not hold, he says, this opinion about God, so as to think that he is like a man who can be thwarted in the things he speaks. For men are hindered by many occasions and vices, so that what they say is not true. For either they speak in anger, and when the anger ceases they have spoken in vain, or for the sake of fear or desire or boastfulness and other things like these; and indeed vain and empty will be everything whatsoever they have spoken while vice held sway. But God, in whom there is no passion, no frailty, says everything he says according to the merits of the causes; and therefore he can never be thwarted, because whatever is brought forth by reason cannot be devoid of reason. God, therefore, is not like a man who speaks in vain, nor is he frightened as a son of man — or, as we read in other copies: nor does he frighten as a son of man. In men, terror too sometimes changes a resolve; but God, who is above all things, by whom could he be frightened so as to change his resolve? But if we take it according to what we said is read in other copies, that is: "nor does he frighten as a son of man," this will seem to be said: that men indeed sometimes make terrors and threats out of boastfulness, even at times against those whom they cannot harm; but God does not frighten men as one who cannot punish, but even if he frightens, he frightens with reason; for he frightens in order to rebuke a man in the tribulation of the hearing, so that, deterred by the word of the threat, he who acts wickedly may amend himself, and the very punishment of his wicked deeds may not come upon him. God, therefore, does not frighten as a man does; for man, as we said, terrifies out of boastfulness, but God terrifies for the sake of amendment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily16.html'
source_title="HOMILIES ON NUMBERS 16.3"

[[commentary]]
quote='''
After this he says: "When he has said, shall he not do it? shall he speak, and not abide by it?" The passage is to be read thus, as if he spoke in the manner of one asking: he — that is, God — what he says, will he not also do? and the things he has spoken, will he not abide in them? Since indeed men do not do what they say, and through the vice of human frailty do not abide in the things they speak; for man is changeable, but God is unchangeable. But someone may object and say: how then did God not abide in the things he spoke concerning Nineveh, that after three days it should be overthrown? nor in the things he spoke concerning David, where death had been promised for three days, to lay waste the people, yet within one day, up to the hour of the midday meal, it ceased? And perhaps it will seem that these things which are said by way of question are not to be taken altogether as fixed, but that there is a certain figure of speech which seems to show something intermediate, yet does not declare the force of a fixed and irrevocable statement — so that something is seen to be said more moderately in what is written, "When he has said, shall he not do it?" than if it had been written, "When he has said, he will by all means do it." But let us also review the very passages of Scripture which are set down either in Jonah or in the books of Kingdoms, lest perhaps there too, as is customary, the divine Scripture may hold something of a secret. It is written, then, in Jonah: "And the word of the Lord came to Jonah the son of Amathi, saying: Rise and go to Nineveh, the great city, and preach in it, for the cry of its wickedness has ascended to me." And after the whale was commanded, and it cast Jonah out onto the land, again it is written: "And the word of the Lord came to Jonah a second time, saying: Rise and go to Nineveh, the great city, and preach in it according to the preaching which I spoke to you." And Jonah indeed preached and said: "Yet three days" — or, as the Hebrews say they have it written, "yet forty days" — "and Nineveh shall be destroyed." But the men of Nineveh believed God, and proclaimed a fast, and clothed themselves in sackcloth, from the least to the greatest of them. And a little later: "And God saw their works," it says, "that they were turned from their evil ways; and he repented" — or, as we read in other copies, "God was entreated concerning the evil which he had spoken to do to them, and did not do it." Observe, then, in these things which we have taken from the prophet, that it is not found said in the words of God, by which he spoke to the prophet: "Yet three days and Nineveh shall be destroyed"; but Jonah, "when he was entering," it says, "into the city about a three days' journey," himself said: "Yet three days, and Nineveh shall be destroyed," so that this word, which was spoken and was not fulfilled, appears to have been uttered by Jonah rather than by God. But let us also bring forward from the second book of Kingdoms what is written, where, when David had numbered the people, "the word of the Lord came," it says, "to Gad the seer prophet, saying: Go and speak to David: Thus says the Lord: Three things I will raise up against you; choose for yourself one of these, which I shall do to you. And Gad went in to David, and announced to him, saying: Either there shall come to you for three years famine upon your land, or for three months that you flee before your enemies who pursue you, or for three days let there be death in your land; now therefore know and see what I shall answer him who sent me. And David said to Gad: I am in very great straits on every side. But let me rather fall into the hands of the Lord, for his mercies are many, and let me not fall into the hands of men. And the Lord gave death in Israel from morning until the hour of the midday meal, and there died of the people, from Dan to Beersheba, seventy thousand men. And the angel of God stretched out his hand over Jerusalem to destroy it, and the Lord was entreated concerning the evil and said to the angel who was destroying the people: It is enough, withdraw your hand." Observe, then, how not even in these three threats is God found to have said anything about a death of three days. For it is set down in the words of Gad, not in the commands of the Lord; and the things that are said through a prophet are not always received as if spoken by God. Finally, through Moses too God indeed spoke many things, yet some things Moses also commanded on his own authority; which the Lord distinguishes in the Gospels with an evident distinction, when, being asked about the divorce of a wife, he says: "For the hardness of your heart Moses wrote these things for you; but from the beginning it was not so. For he who made man made them male and female and blessed them and said: For this reason a man shall leave his father and his mother, and shall cleave to his wife; and the two shall be in one flesh"; and he adds: "What therefore God has joined together, let not man separate." You see, then, that here too God indeed did not command nor will that divorce be done; but that Moses, on account of the hardness of the Jews' heart, wrote that a certificate of divorce should be given. Paul too shows this in his letters, when he says of certain things: "The Lord says, and not I," and of others: "But these things I say, not the Lord," and again in others: "I have no command of the Lord, but I give counsel," and again: "What I say, I say not according to the Lord." Hence likewise in the rest of the prophets also, some things the Lord spoke and not the prophets, but other things the prophets and not the Lord; and thus the objection raised will seem to be dissolved, since the Lord recalls and changes for the better not so much his own words as the prophet's. But I rather think that the former solution agrees with the meaning of the whole of Scripture, and especially with those sayings in which God is called patient and of much mercy and repenting over evils — or most of all with those things which are generally pronounced by Jeremiah, in which it is evidently shown that, on account of his many mercies and his incomprehensible goodness, God says and does not do, speaks and does not abide by it. God therefore says through Jeremiah: "I will speak unto the end" — that is, I will speak from a fixed decree — "over a nation and over a kingdom, to take them away and destroy them; and if that nation turns from its wickednesses, I will repent of all the evils which I purposed to do to them. And I will speak unto the end over a nation and a kingdom, to rebuild them and replant them; and if they do evils in my sight, so as not to hear my voice, I will repent of all the good things which I had spoken to do to them." How then can we prefer to these things, which are said absolutely through Jeremiah, those which are said in a suspended manner through Balaam, unless because the former are to be affirmed for the negligent and the scornful, while the latter are to be attended to more secretly by the more perfect?
'''
