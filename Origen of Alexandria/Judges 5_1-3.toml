[[commentary]]
quote='''
The fourth song is in the book of Judges, concerning which it is written: "And Deborah and Barak the son of Abinoam sang on that day, saying: When the leaders in Israel began, in the purpose of the people, bless ye the Lord. Hear, O kings, and give ear," and the rest. But she who sings these things ought to be a bee, whose work is such that both kings and ordinary folk use it for health. For Deborah, who sings this song, is interpreted "a bee," and Barak too along with her: and Barak is interpreted "lightning-flash." And this song is sung after victory, because no one can sing what is perfect until he has conquered his adversaries. So, finally, in the song itself it is said: "Arise, arise, Deborah, rouse up the thousands of the people. Arise, arise, sing a song, arise, Barak." But concerning these things too you will find matters more fully discussed in those little discourses which we have published on the book of Judges.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"
