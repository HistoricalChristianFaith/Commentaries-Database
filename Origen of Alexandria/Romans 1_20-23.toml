[[commentary]]
quote='''
For his invisible things, from the creation of the world, are clearly seen, being understood by the things that are made, and also his eternal power and divinity; so that they are inexcusable, because when they had known God, they did not magnify him as God, nor give thanks; but they became vain in their thoughts, and their foolish heart was darkened. For saying that they were wise, they became fools, and they changed the glory of the incorruptible God into the likeness of the image of corruptible man, and of birds, and of four-footed beasts, and of serpents. Almost every one of these points has already been discussed above. For we said that these things, although they pertain to all human beings in whom there is natural reason, nevertheless look chiefly to the wise men of this world and to those who are named philosophers, whose particular discipline it is to examine the creatures of the world and all the things that have been made in it, and through the things that are seen to gather by reasoning the things that are not seen. Yet it must be known that the invisible things which he here names, he speaks of concerning created things; about which the same Apostle also writes in another place: that all things were made through him, that is, through Jesus Christ, whether the things that are in heaven or the things that are on earth, visible and invisible. And therefore, besides those things which he called invisible, he adds: And his eternal power and divinity. Therefore the power of God, which is eternal, and the divinity, which is no less eternal, is recognized from inferences drawn from the creature. Power is that by which he governs all things; divinity that by which he fills the universe. From this, then, they are made inexcusable: because, although they came to know God when God made himself manifest, they did not worship him as is worthy, nor give thanks; but through the vanity of their own thoughts, while they sought forms and images in God, they lost the image of God within themselves, and those who seemed to boast of themselves in the light of wisdom were rolled down into the deep darkness of folly. For what is so foul, so obscure, and so shrouded in darkness, as to turn the glory of God into a bodily and corruptible likeness of the human form — as is the custom of those who venerate idols — and to make the eminence of the divine majesty equal with birds and four-footed beasts and serpents?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook01.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
