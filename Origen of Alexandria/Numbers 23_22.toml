[[commentary]]
quote='''
"God, who led him out of Egypt, his glory is as that of a unicorn." That Israel indeed was led out of this earthly Egypt, but this spiritual Israel out of the Egypt of the world and out of the power of darkness, and his glory is as that of a unicorn. The unicorn is said to be an animal formed in that shape which the very indication of its name signifies. We read this animal frequently set down in the divine Scriptures, but especially in Job its might and power are set forth by the words of God himself, in which — as in very many places — Christ is understood to be signified. And in the divine Scriptures we have often found a horn set down for a kingdom, just as the prophet also says: "The four horns are four kingdoms." Under the name of the unicorn, therefore, this seems to be shown in Christ: that everything which is, is his one horn, that is, his one kingdom. For the Father has subjected all things under his feet, until even the last enemy, death, is destroyed, and Christ, as a unicorn, holds the one kingdom of all, because, as it is written: "Of his kingdom there shall be no end." There shall be, then, he says, to him — that is, to that spiritual Israel — glory, as is the glory of the unicorn. For so the Lord himself also says in the Gospel: "Father, grant to them that, just as I and you are one, so these also may be one in us." And therefore a glory like the glory of the unicorn will be given to Israel, especially when he will transform the body of our lowliness to be conformed to the body of his glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily16.html'
source_title="HOMILIES ON NUMBERS 16.6"
