[[commentary]]
quote='''
Of old "the word of God came to Jeremiah, the son of Hilkiah, who was of the priests" in the time of this or that king of Judah; now "the word of God comes to John, the son of Zechariah", which never came to the prophets "in the desert". But because "the children" of the desolate one "were to be more" than of "her who has a husband", therefore "the word of God came to John, the son of Zechariah, in the desert". And at the same time consider that it has more reason in it, if the desert is understood mystically and not according to the simple letter. For he who preaches "in the desert" acts to no purpose in crying out there where no one hears him speaking. The forerunner of Christ, therefore, and "the voice of one crying in the desert", preaches "in the desert" of the soul that does not have peace. And not only then, but also in the present, first "the burning and shining lamp" comes and "preaches the baptism of repentance for the remission of sins"; then "the true light" follows after, when "the lamp" itself says: "he must increase, but I must decrease". The word of God comes "in the desert".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily21.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 21"
