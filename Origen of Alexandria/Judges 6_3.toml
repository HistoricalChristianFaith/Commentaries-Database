[[commentary]]
quote='''
Granted, the Midianites have gathered against Israel, they who are interpreted as "outside judgment." Granted, these have gathered against Israel, who are outside the judgment of God and "who have sinned outside the law and will perish outside the law." Granted, Amalek too has gathered, who himself is likewise interpreted as "a people that licks up." Granted, this nation too, earthly and given over to the belly and the gullet, has come to make war — a carnal Israel against the spiritual Israel. But what is this, that even the "sons of the East" are mingled with them and are said to come with them to make war on Israel? For my hearer says to me: if it had been written that the "sons" of the West "gathered with them," I would ask nothing; for you would tell me by the laws of allegory that the sons of the West are the sons of darkness, and that they join themselves to those nations, whether such as are outside the judgment of God or such as, given over to the belly, make war on those who strive to see God with the mind. But now, when it is said that the "sons of the East came with Midian and Amalek," how can these things be fittingly expounded? Let us see, then, whether in passages of Scripture so difficult we can find some sense worthy of the divine pages. Everyone who in any manner takes upon himself the name of Christ becomes a "son" "of the East." For thus it is written of Christ: "behold a man, the East is his name." Everyone, therefore, who takes the name of Christ is said to be a "son" "of the East"; but not always do those who receive the name of Christ also remain in the Church of Christ. If therefore you should see heretics who are indeed reckoned by the name of Christ, yet assail the Church of Christ and bring their arms against the faith of Christ, make war on the people of the Lord, and stir up wars against the catholic faith — do not hesitate to say of these that they are indeed "sons of the East," but that they come with the Midianites and with Amalek to assail the people of God, because together with pagans and with Jews the heretics too persecute the Church of God. And I think that it is these who are designated in the "sons of the East."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily08.html'
source_title="HOMILIES ON JUDGES 8"
