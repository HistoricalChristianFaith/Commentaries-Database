[[commentary]]
quote='''
Paul therefore, writing to the Hebrews, namely to those who indeed read the law and had these things meditated upon and well known, but had need of understanding as to how one ought to think concerning the sacrifices, says in this manner: "for Jesus entered not into the holy place made with hands, the copies of the true things, but into heaven itself, that he might now appear before the face of God for us." And again he says of the victims: "for this he did once, by offering himself as a victim." But why do we seek testimonies concerning these things one by one? If anyone should review the whole epistle itself written to the Hebrews, and especially that passage where he compares the high priest of the law with the high priest of the promise, of whom it is written: "you are a priest forever according to the order of Melchizedek", he will find how this whole passage of the Apostle shows those things which are written in the law to be "copies" and "forms" of living and true things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily09.html'
source_title="HOMILIES ON LEVITICUS 9"


[[commentary]]
quote='''
If the ancient custom of the sacrifices has been made clear to you, let us see what these things also contain according to the mystical reason. You have heard of two houses, one as it were visible and open to the priests, the other as it were invisible and inaccessible: except the one high priest alone, the rest are outside. This first house I think can be understood to be this in which we now are, placed in the flesh, the church, in which the priests minister "at the altar of the whole burnt offerings", that fire being kindled of which Jesus said: "I came to send fire upon the earth, and how I wish that it be kindled". And I do not wish you to marvel that this house lies open to the priests alone. For all, whoever have been anointed with the ointment of the sacred chrism, have been made priests, as Peter too says to the whole church: "but you are a chosen race, royal, priestly, a holy nation". You are therefore a "priestly race" and therefore you approach the holy things.… In this way therefore the priesthood is carried out in the first house and the victims are offered, and from this house the high priest, clothed with sanctified garments, sets forth and enters into the interior of the veil, as we have already above set down the words of Paul saying: "not into the holy place made with hands, but into heaven itself Jesus penetrated" it says, "and appears before the face of God for us". Therefore the place of heaven and the very seat of God is designated through the figure and image of the interior house.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily09.html'
source_title="HOMILIES ON LEVITICUS 9"
