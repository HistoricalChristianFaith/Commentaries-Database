[[commentary]]
quote='''
Indeed, in the Scriptures two are often spoken of as one. What passages of Scripture are these? Adam is one man, his wife is another. Adam is distinct from the woman, and the wife is distinct from the man. Yet in the account of the creation of the world it is straightway said that the two were one: "and the two shall be one flesh." Consequently it is possible sometimes for two fleshes to be one. … And again, the Apostle says that the righteous man is one with Christ, but he is distinct from Christ: "And he who cleaves to the Lord is one spirit with Him." … In turn, our Savior and Lord, in relation to the Father and God of all, is neither one flesh nor one spirit, but something higher than one flesh, than one spirit — one God. When people are united with one another, the fitting word is flesh. When the righteous man cleaves to Christ, the fitting word is spirit. But when Christ is one with the Father, the fitting word is neither flesh nor spirit, but the more worthy one — God. From this we also understand the saying: "I and the Father are one." Let us in our prayers hold to the duality, while keeping in mind the unity. On the one hand, in this way we shall avoid the opinion of those separated from the Church and fallen into the fantasies of monarchy, who abolish the Son by removing Him from the Father and thereby abolish the Father also. On the other hand, we shall avoid another impious teaching, which abolishes the divine nature of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
