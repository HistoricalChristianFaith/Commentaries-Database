[[commentary]]
quote='''
But after he had destroyed his enemies through his passion, the Lord, who is mighty in battle and strong, required a purification that could be given to him by his Father alone. And this is why he forbids Mary to touch him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%25206.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 6.287"


[[commentary]]
quote='''
It belongs to the resurrection that one should be on the first day in the paradise of God, and it belongs to the resurrection when Jesus appears and says, "Do not touch me. For I am not yet ascended to my Father," but the perfection of the resurrection was when he came to the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252010.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 10.245"


[[commentary]]
quote='''
My witness is the text of the Gospel. The Lord Jesus Christ rose from the dead. Mary met Him, and He says to her: "Touch Me not." For He desired that everyone touching Him should touch Him in His fullness, so that from the touch he might receive complete benefit for the body — from His body, for the soul — from His soul, and for the spirit — from His spirit. "For I have not yet ascended to the Father." He rises up to the Father, and is about to find the disciples. So then, He rises up to the Father. To what end? To take back the deposit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"


[[commentary]]
quote='''
"This is my God, and I will honor him; the God of my father, and I will exalt him." This one, then, is both "my" "God" and the God "of my father." Our Father, who made us and begot us, is Christ, and he himself says: "I go to my Father and your Father, my God and your God." If, therefore, I recognize that God is "my" "God," I will glorify him; but if I also recognize this, in what way he is the "God" of Christ "my father," I will exalt him: for it is a loftier understanding, in what way Christ, in order to bind fast and safeguard the truth of the one God, calls him his God whom by nature he calls Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily06.html'
source_title="HOMILIES ON EXODUS 6"
