[[commentary]]
quote='''
I pray that our souls may never be disquieted, and even more that in the presence of the tribunals and of the naked swords drawn against our necks they may be guarded by the peace of God, which passes all understanding, and may be quieted when they consider that those who are foreigners from the body are at home with the Lord of all.
'''
source_url=''
source_title="AN EXHORTATION TO MARTYRDOM 4"


[[commentary]]
quote='''
"As long as we dwell in the body, we are away from the Lord." Let us prefer to leave the body and take up our dwelling with the Lord, so that, living with Him, we may be united with the God of the universe and see His only-begotten Son, obtaining full salvation and blessedness, in Jesus Christ, to whom be glory and power unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
