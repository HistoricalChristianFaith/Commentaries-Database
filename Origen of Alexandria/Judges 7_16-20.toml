[[commentary]]
quote='''
Yet how do these fight? "Pitchers", it says, they carry, "and lamps and horn trumpets in their hands", and thus, it says, they come against those countless multitudes of the enemy, among whom were "camels like the sand of the sea". And when they had come to the battle, "with the horn trumpets", it says, "they sounded". And they let go the "pitchers" from their hands, and "they were shattered". But then, snatching up the lamps, they rush upon the adversaries, and at the same time crash out with the trumpets. See how the chosen soldiers of God fight with lamps. For thus had Christ armed them, saying: "Let your loins be girded and your lamps burning", and again: "So let your light shine before men, that they may see your good works and glorify your Father who is in heaven". With such lamps kindled, then, it befits the soldiers of Christ to fight, shining with the light of their works and with the splendor of their deeds. But what are the "horn trumpets" on which "they blow the trumpet"? He who speaks of heavenly things, who discourses of spiritual things, who reveals the "mysteries of the kingdom of heaven", he sounds the "trumpet"; he speaks of the "trumpet" who speaks of great and greatest things, who lays open the knowledge of Christ to human ears. But why is the "trumpet" also called "of horn"? Because it is also said of the holy one: "his horn shall be exalted in glory". Whence also each man's "trumpet" is called "of horn" in this, that he discourses the manifold knowledge of Christ and the mysteries of His cross, which is signified in the horn. Warring, then, with this "trumpet", and fighting with this, we overcome the strangers and turn the enemies to flight, even if "their multitude be like locusts". For to "locusts" is compared the multitude of demons, who have a seat neither in heaven nor on the earth. Let there go before us also in this battle the light of works, the power of knowledge, the preaching of the divine word. Let us too fight, singing together in "hymns and psalms and spiritual songs" and "crying out to God", that we may deserve to obtain from Him the victory in Christ Jesus our Lord, "to whom is glory and dominion unto the ages of ages. Amen!".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily09.html'
source_title="HOMILIES ON JUDGES 9"
