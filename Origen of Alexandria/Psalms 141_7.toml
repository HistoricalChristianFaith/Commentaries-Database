[[commentary]]
quote='''
"Our bones are scattered into the netherworld." What bones, according to the word of the one speaking, are scattered into the netherworld? Imagine, I beg you, a sinner; imagine his condition in the dwelling of sin, in the dwelling of the dead, in the dwelling of evil — and you will say of such a man that his bones have been scattered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
