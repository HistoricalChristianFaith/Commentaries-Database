[[commentary]]
quote='''
Paul, in the first Epistle to the Thessalonians, calls all those like himself "the living"; for the "God of the living" is the God both of Paul and of those like him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LXXXVIII*"
