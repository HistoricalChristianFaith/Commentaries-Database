[[commentary]]
quote='''
"Whoever seeks", he says, "to save his soul will lose it, and whoever loses it will save it". The martyrs seek "to save their soul"; and for this reason they lose it, in order to save it. But those who wish "to save their soul" and do not "lose" it, these "lose both body and soul" alike "in hell". Wherefore, he says, "do not fear those who can kill the body, but rather fear him who can destroy both soul and body in hell". This much we have said briefly on the point at hand, according to the strength of our talent; but "the natural man does not receive the things that are of the Spirit", and therefore he cannot be saved. "A natural body is sown, a spiritual body rises". Further, "he who cleaves to the Lord becomes one spirit" with him. If, then, "he who is joined to the Lord", though he was natural, is by that very thing turned into a spiritual man and "is one spirit", let us too lose our soul, so that, cleaving to the Lord, we may be transformed into one spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily36.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 36"
