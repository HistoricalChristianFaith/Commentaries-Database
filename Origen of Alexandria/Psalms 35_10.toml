[[commentary]]
quote='''
"All my bones will say: 'Lord, who is like Thee?'" Behold, bones that chatter, reason, hold forth, feel God — and this despite the insensitivity to which the physicians testify who saw through the bones of a patient, without his feeling anything under the action of the saw. "All my bones will say: 'Lord, who is like Thee?'" It is precisely the inner man who possesses all these bones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"


[[commentary]]
quote='''
But when "bones shall have been joined to bones and joints to joints", according to what we said above, then he himself too will say of us that prophetic word: "all my bones shall say: Lord, who is like you?". For "all" these "bones" speak and utter a hymn and give thanks to God. For they remember his benefit, and therefore "all my bones shall say: Lord, who is like you? delivering the poor man from the hand of one stronger than he". Of these bones, while they were still scattered, before he came who was to "collect and gather them into one", that prophetic word too was spoken: "our bones are scattered beside hell". Because, then, they were scattered, therefore he says through another prophet: "let bone be gathered to bone and joint to joint and sinews and veins and skins". For when this shall have been done, then "all these shall say: Lord, who is like you? delivering the needy from the hand of one stronger than he". For each one bone of "these bones" was needy and was worn down by the hand of "the stronger". For it did not have the "joint" of charity, nor the "sinews" of patience, nor the veins of a vital spirit and the vigor of faith. But when he came who "collected the scattered" and who "joined together the dispersed", associating "bone to bone and joint to joint", he began to build up the holy body of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
