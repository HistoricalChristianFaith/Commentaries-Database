[[commentary]]
quote='''
Let the diligent reader of Scripture inquire how the Savior can say: "I came not to send peace upon the earth, but a sword", while now the angels at his nativity sing: "on earth peace". For in another place too it is said in his own person: "My peace I give to you, peace I leave to you: not as this world gives peace, do I give peace". Let him then see whether what we bring forward can resolve the question. If it had been written: "on earth peace", and the sentence had ended at that point, the question would rightly arise. But now that which is added — that is, what is said after "peace": "among men of good will" — resolves the question. The peace too which the Lord does not give "upon the earth" is not the "peace of good will". For he does not say simply: "I came not to send peace", but with an addition: "upon the earth"; nor did he, on the contrary, say: "I came not to send peace upon the earth of good will".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily13.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 13"
