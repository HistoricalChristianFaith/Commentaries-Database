[[commentary]]
quote='''
"Therefore I myself with the mind serve the law of God, but with the flesh the law of sin." Perhaps someone will say that the Apostle, who up to this point has been speaking not as it were in his own person but having assumed the person of another, now, as though marking a change of person, says, "I myself," so as to show that these things which are to be said pertain to that same Apostle himself. And he says that with the mind he serves the law of God, but with the flesh the law of sin — as if so great were the force of sinning, so great the tyranny of the flesh, that not even the Apostle could escape it; and for this reason he said in another place that "I chastise my body and bring it into subjection, lest perhaps, when I have preached to others, I myself should become a reprobate." But whoever takes these things as spoken in the person of the Apostle seems to me to strike despair into every soul, on the ground that there is absolutely no one who does not sin in the flesh. For this is what it is to serve the law of sin with the flesh. To me, therefore, it rather seems that he is still maintaining the person of the man whom above he described in himself: one who by will and purpose has already been turned toward better things, and who serves the law of God with mind and spirit, yet has not yet obtained this, that he should bring even the obedience of the flesh into agreement with the mind. For indeed in the preceding passages he had discoursed on the mortification of the body, and had taught that we must die together with Christ; in these present words he seems to show how this work is not idle, and to teach that it is not the case that, as soon as someone wills, and as soon as he has purposed the good, it is straightway also fulfilled in deed; but that either so great is the force of habit, or so great the sweetness of the vices, that although the spirit already strains toward virtue and determines to serve the law of God, nevertheless the desires of the flesh persuade it to serve sin and to obey sin's laws.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
