[[commentary]]
quote='''
The reading recited today contains, first, a piece of history about the fornication of an Israelite man and a Midianite woman, and second, about the visitation of the people, in which it is commanded that they again be numbered by the precept of the Lord, the former number having, of course, been made void on account of the sins which those had committed who had earlier been enrolled under the reckoning of the number. Therefore the number that had been written down is cancelled and rendered void because of sins, and offenses have such power that not even this profits a man — that he had been counted in the number in God's sight — once he has turned aside. But, as Scripture reports, even the limbs of those who withdrew from God fell in the desert. There are, then, two histories that have been recited; but we, for the present, will speak of the first, which describes the fornication of the people, if the Lord shall deign to grant any grace as you pray; and if He Himself shall grant it, we shall venture also to touch upon something of the second. "And Israel sojourned at Shittim," it says, "and the people was defiled, and committed fornication with the daughters of Moab. And they invited them to the sacrifices of their idols, and the people ate of their sacrifices and worshipped their idols, and was consecrated to Baal-peor; and the Lord was angry with fury against Israel." In these words is shown that which we have often recalled, namely that Balaam, after he had been so constrained by the power of God that he was not permitted to curse Israel, yet wishing to please King Balak, said to him, as it is written: "Come, I will give you counsel." And what counsel he gave did not appear there, but it is reported as written in the later parts of the book of Numbers itself. Yet more fully in the revelation of John, where it is contained thus: "You have there," it says, "the teaching of Balaam, who taught Balak to put a stumbling-block in the sight of the sons of Israel, that they should eat things sacrificed to idols and commit fornication." From this, therefore, it appears that Balaam used wickedness and gave counsel to the king, saying to him something of this sort: "This people conquers not by its own strength, but by worshipping God and by preserving chastity. If you wish to conquer it, first cast down their chastity, and they will be conquered of their own accord. But against these we must fight not with the strength of soldiers, but with the beauty of women, not with the rigor of armed men, but with the softness of females. Away, far away from here remove the band of armed men, and gather a choice display of maidens; let them go dancing with their feet and clapping with their hands; beauty conquers armed men, loveliness takes the sword captive, they will be conquered by beauty who are not conquered in battle. But when the Moabite women perceive that they have surrendered to lust and bowed their necks to sin, let them not offer themselves to their desirers before the men have agreed to taste of the sacrifices of the idols, so that, driven by lust, they may obey the counsels of the women and be first consecrated to Baal-peor, which is the idol of shamefulness." These were the counsels of Balaam; having received them, King Balak at once prepares an army composed not with the strength of arms, but with feminine elegance, kindled not with warlike fury, but with the flame of lust. Shame restrains none, modesty forbids none. Love of country and the vice of the nation conspire alike into wantonness, and to deceive, upright behavior turns to depravity. O the wickedness! scarcely is lust checked by the threats of laws, scarcely repressed by the terror of the sword! What crime would it not commit, when a woman believes that by her outrage she will please the king and secure the safety of her country? So the Israelites are taken captive not by iron, but by luxury, not by valor, but by lust, and they commit fornication with the Midianite women, and the wrath of God rises up over them. There are indeed in these things certain mystical matters and secrets of a deeper understanding; but let first the very text of the history edify us, and let us learn from it that fornication wars against us, that the darts of luxury are hurled against us. But if we do not lack the arms with which the Apostle bids us be armed, darts of this kind will not be able to pierce us, if we have the breastplate of righteousness, if we have the helmet of salvation and the sword of the spirit and above all the shield of faith and our feet are shod in the preparation of the gospel of peace. These are the arms which defend us in wars of this kind. But if we cast away such arms, at once we give place to the diabolical wound, and the whole chorus of demons leads us captive; and on account of this the wrath of God will rise up over us, and we shall be punished not only in the present age but also in that to come. Therefore that which makes us conquer in these battles which the devil stirs up against us is chastity and righteousness and prudence and piety and the other virtues. But those things which make us be conquered are luxury and lust, avarice and impiety and every malice. These, then, are the things which the text of the history has taught us. But since John in his revelation brings the things which are written according to the history in the law up to divine mysteries and teaches that certain sacraments are contained in them, it seems necessary that we too, according to what he perceived, should follow the rule of exposition given by him, and first recall those things which, writing to the angel of a certain church, he says: "You have there certain persons who hold the teaching of Balaam, who taught Balak to put a stumbling-block in the sight of the sons of Israel, that they should eat things sacrificed to idols and commit fornication." Therefore in the times of the Apostle John there were some in that church to which he was writing who taught the teaching of Balaam. Do you suppose it is to be taken thus, that there were in those days people who said that they taught the things which Balaam taught, and who professed themselves to be teachers of his doctrines and traditions? Or ought we rather to note this, that, if anyone does the work which Balaam did, he is seen to teach the teaching of Balaam? Just as also concerning the teaching of Jezebel it is mentioned in the same revelation, not that anyone teaches from the disciplines of Jezebel the things which she handed down, but that if anyone, for example, either persecutes the prophets of God, as she did, or deceives some toward idols, or destroys the innocent by false frauds, this one is said to hold the teaching of Jezebel. So therefore, if anyone by evil counsels generates stumbling-blocks for the people of God and provokes divine offense and heavenly wrath against the people, either by communicating in the sacrifices of idols or by serving debaucheries and lust, this one is to be said to hold the teaching of Balaam. Even the fornication of the body, then, is execrable. For what is so execrable as to violate the temple of God and to take away the members of Christ and make them members of a harlot?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily20.html'
source_title="HOMILIES ON NUMBERS 20.1"

[[commentary]]
quote='''
"But Israel sojourned at Shittim." In the interpretation of Hebrew names we find that Shittim, in our language, is said to mean "answer" or "refutation." Israel, then, sojourned at "answer" or "refutation." It did not sojourn well. See, finally, what it ran into, placed in this station. It committed fornication with the Midianite women and was refuted by God, because not only did it commit fornication, but it was also consecrated to the idols of the nations and ate of those things which had been sacrificed to idols — things which are altogether execrable in God's sight. For what agreement has the temple of God with idols? Indeed I have also greatly wondered at those things which the Apostle Paul writes to the Corinthians, saying: "But if anyone sees you, who have knowledge, reclining in an idol's temple, will not his conscience, since it is weak, be built up to eat things sacrificed to idols?" For he seems to pronounce not so much the matter itself grievous as the offense of that one who, seeing these things, is provoked by a like example, since he is not fortified by like knowledge — so that he shows that the one who, having knowledge, reclines in an idol's temple is made guilty not so much of his own harm as of another's. But see whether perhaps this alone was not being done among the Corinthians, that they reclined in an idol's temple and ate things sacrificed to idols. But perhaps, since they were men zealous for Greek letters and lovers of philosophy, they were still held by desire for their old studies and ate the doctrines of the philosophers as though sacrificed to idols; which, however, perhaps could not harm those who had received the full knowledge of the truth. But these, who had less learning in Christ, if they imitated them, reading such things and still giving attention to those studies, could be wounded and entangled in the various errors of diverse doctrines. So then it came about that another was harmed, whereby he who had the full knowledge of the truth could not be harmed. But since charity does not seek what is useful to itself, but what is useful to many, one must take care to receive such food of the word as not only builds us up and delights us, but also does not offend or harm those who see. There is, therefore, a thing sacrificed to idols not only in foods, but also in words. And I think that, just as every discourse which teaches piety and righteousness and truth is consecrated to God and sacrificed to God, so also every discourse which looks toward unchastity or injustice or impiety is sacrificed to idols, and he who receives it eats, as it were, things sacrificed to idols. "The people, therefore, ate of their sacrifices, and worshipped their idols." Not only did they eat, but they also worshipped. See the order of evil: first concupiscence deceived the servants of the Lord, then the gluttony of the belly, and last impiety took them captive. And the wage of impiety that is paid out is fornication. If you read again the things that are written concerning Solomon, you will find that he, and indeed although he was most wise, inclined his loins to many women, though the law of God says: "You shall not multiply women for yourself, lest perhaps they make you commit fornication away from your God." He, then, although he was most wise and of enormous merits before God, yet because he gave himself over to many women, was deceived. I think that "many women" is the name for many doctrines and the diverse philosophies of many nations. And when, as a most learned and most wise man, he wished to recognize and thoroughly examine each of these, he could not hold himself within the rule of the divine law, but Moabite philosophy deceived him and persuaded him to sacrifice to the Moabite idol, and likewise of the Ammonites, and also of the remaining nations, whose women he is said to have received and to have built temples or sacrificed to their idols. It is, then, a great thing and truly a work of God to be mingled with many doctrines as with women, and yet not to turn aside from the rule of truth, but constantly to say: "There are sixty queens and eighty concubines, and young maidens of whom there is no number; yet my dove is one, my perfect one is one; she is the only one of her mother, the only one of her that bore her." But these worshipped idols and were consecrated to Baal-peor. Baal-peor is the name of an idol which among the Midianites was worshipped especially by the women. In the mysteries of this idol, then, Israel was consecrated. Yet when we inquired rather carefully into the interpretation of the name itself among the Hebrew names, we found only this written: that Baal-peor is a species of shamefulness. He was unwilling, however, to declare which or what sort of species, or of whose shamefulness — consulting, I believe, for decency, the one who interpreted, so as not to pollute the hearing of the listeners. Therefore, since there are many species of shamefulness, one particular species out of many of shamefulness is called Baal-peor. Whence it is to be known that everyone who commits anything shameful and turns aside into any species of shamefulness is consecrated to Baal-peor, the demon of the Midianites. But also through the individual sins which we commit — especially if we now sin not by some stealthy surprise, but with zeal and affection — we are without doubt consecrated to that demon whose care it is to work out that sin which we have committed. And perhaps it will befall us to be consecrated to as many demons as we commit sins, and in each and every offense we receive, as it were, the mysteries which they call of this or that idol. And perhaps on account of this the Apostle said: "For already the mystery of iniquity is at work." The evil spirits, therefore, go about and seek how they may deceive each one and, through the enticement of sin, consecrate him to their mysteries, and, without his perceiving or understanding, they bring him — for example, through the sin of fornication — to the demon of the Midianites and consecrate him to Baal-peor, consecrate him to shamefulness. Likewise also, through the other sins, as we have said, men are consecrated to other demons. But do you observe carefully what is written, and "stand in the ways and ask which are the eternal ways of the Lord and which is the good way, and walk in it," and do not approach the doors of the house of malice. But if you perceive an evil spirit speaking in your heart, so as to lead you to some work of sin, understand that it wishes to lead you in order to consecrate you to some demon, it wishes to lead you in order that you may receive the diabolical mysteries, the mysteries of iniquity. And this is, I think, what the Apostle writes: "But when you were gentiles, going after the form of idols, according as you were led." By whom, or by what, were you led? By the evil spirits, surely, you were led to the works of sins. Hearing these things, every watchful hearer will perhaps say: "What, then, shall we do? If the evil spirits go about each one of us and lead and drag us to sin, but there is no other who draws to righteousness, who invites and leads to chastity, to piety: how will it not seem that the way lies wide open indeed toward perishing, but that nowhere is any access given toward salvation?" Nay rather, consider more carefully, if you can with the eye of the heart opened consider with me the inner mysteries, and you will see how much greater care is exercised in the secrets of our salvation than opportunity is afforded for deceiving. There is present to each one of us, even to the least who are in the Church of God, a good angel, an angel of the Lord, who guides, who admonishes, who governs, who for the correcting of our acts and the seeking of mercies daily sees the face of the Father who is in heaven, as the Lord indicates in the gospels. And again, according to those things which John writes in the Apocalypse, over each church generally an angel presides, who is either praised for the good deeds of the people or also blamed for its offenses. In which too I am moved with wonder at the astounding mystery, that God's care for us is so great that He allows even His angels to be blamed and confuted on our behalf. For just as, when a boy is handed over with a tutor, if perhaps he appears imbued with less worthy disciplines and not according to his father's nimbleness, at once the blame is referred to the tutor, and the boy is not reproved by the father as the tutor is — unless the boy be too obstinate and have spurned the tutor's admonitions and, prone to wantonness and insolence, have despised his salutary words, obeying rather those who counsel luxury and provoke to wantonness. And learn from the voices of the prophet what befalls that soul: "The daughter of Zion," he says, "shall be left like a booth in a vineyard, and like a watchman's hut in a cucumber field, like a city that has been stormed"; and again: "Its wall shall be taken away and it shall be for a trampling, and all who pass along the way shall plunder it, and the solitary wild beast shall feed upon it." These things it will suffer, if it does not acquiesce in the admonitions of the angel who is placed for its salvation. For the soul is of its own free will, and it is free for it to incline to whichever part it wills; and therefore the judgment of God is just, because of its own accord it obeys either good or the worst counselors. Do you wish that I show you still further and more from the divine scriptures how much greater is God's care for the salvation of men than the devil's care for their destruction? Was not the diligence of the angels enough against the snares of the demons and against those who draw men to sinning? The Only-begotten Himself, the Son of God Himself, I say, is present, He Himself defends, He Himself guards, He Himself draws us to Himself. Hear how He Himself says: "And behold, I am with you all the days, even to the consummation of the age." Nor does it suffice Him to be with us, but in a manner He does violence to us, that He may draw us to salvation; for He says in another place: "But when I shall be lifted up, I will draw all things to myself." You see how He not only invites the willing, but also draws the hesitating. Do you wish to hear how He draws even the hesitating? He did not grant it to the one who wished to go and bury his father, nor did He give him a space of time, but said to him: "Let the dead bury their dead, but you follow me." And elsewhere He says: "No one putting his hand to the plow and looking back is fit for the kingdom of God." But if you wish to know still more about this sacrament, I will show you from the scriptures that even God the Father Himself does not neglect the dispensation of our salvation, but He too not only calls us to salvation but also draws us. For thus the Lord says in the gospel: "No one comes to me unless my heavenly Father draws him." But also the householder, who sends his servants to invite friends to the wedding of his son, after those who were first invited had excused themselves, says to the servants: "Go out to the roads and lanes, and whomever you find, compel them to come in." So then we are not only invited by God, but also drawn and compelled to salvation. But neither indeed is the Holy Spirit lacking in dispensations of this kind; for He too says: "Separate for me Paul and Barnabas for the ministry to which I have taken them"; and again He forbids Paul to go into Asia, and again compels him to go to Jerusalem, foretelling him that bonds and prisons await him there. But if the angels of the Lord encamp round about those who fear Him, to rescue them, if God the Father, if the Son, if the Holy Spirit not only exhort and provoke, but also draw us — how is not far greater care taken for us toward salvation than is procured by our adversaries toward death? And let these things be said on account of the fact that the people was consecrated to Baal-peor.
'''
