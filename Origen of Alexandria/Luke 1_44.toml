[[commentary]]
quote='''
"For behold, as soon as thy greeting came into my ears, the infant leaped for exultation in my womb". Holy was the soul of blessed John, and while still enclosed in his mother's womb and yet to come into the world he knew Him whom Israel did not know; whence he "leaped", and not simply "leaped", but "for joy". For he had perceived that his Lord had come to sanctify His servant, before he came forth from his mother's belly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily07.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 7"
