[[commentary]]
quote='''
Everywhere the cause of the unbelief of the Jews was this: that they did not understand Jesus as the "Christ of God", because they always gave their mind to the corporeal histories, unwilling to believe anything spiritual in them. For example, we introduce for the sake of illustration what is prophesied and said in Zechariah, that as it were "upon an ass and a colt He would enter into Jerusalem and would destroy the chariots out of Ephraim and the horse out of Jerusalem". If anyone wishes to understand this of Christ according to the history of the letter, it does not fit; for Christ is nowhere expounded to have destroyed out of Ephraim corporeal and perceptible chariots, nor a corporeal horse from a corporeal Jerusalem. But if you see among the heretics the assemblies of falsehood itself coupled together as by a certain yoke and in evil concord among themselves, which the word of truth is wont to destroy, you will see how Christ, the Word of God, destroys the spiritual chariots out of the spiritual Ephraim; for Ephraim is always set as a figure of the heresies, which have separated themselves from the Church of Christ, just as Ephraim from the tribe of Judah. For just as the divine word spiritually "cast into the sea" the horse and rider of the Egyptians, that is, the impious man together with the devil as his rider and yoke-fellow, so also it destroyed the horse from Jerusalem — whoever is subject to the devil as his rider and not to Christ, as are those horses acceptable to Christ, of whom Habakkuk says: "because you will mount upon your horses, and your cavalry is salvation", that is, upon the apostles and the other saints in whom Christ dwells. Therefore we say: "these in chariots" (pointing to Ephraim) "and these on horses" (pointing to the adversaries of Jerusalem), "but we shall be magnified in the name of our God. They are bound and have fallen, but we have risen and are set upright".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252023.html'
source_title="COMMENTARY ON MATTHEW 27"
