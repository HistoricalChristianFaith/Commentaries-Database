[[commentary]]
quote='''
Hear, then, in what follows, what the Holy Spirit relates and with what praises he extols Moses. "And the Lord came down," he says, "in a pillar of cloud, and stood at the door of the tabernacle of testimony; and Aaron and Miriam were called, and both stood forth. And he said to them: hear my words; if there be a prophet of yours to the Lord, I will be known to him in visions and I will speak to him in dreams. Not so with my servant Moses, who is faithful in all my house; mouth to mouth will I speak to him, in his form and not in a riddle, and he saw the glory of the Lord; and why were you not afraid to detract from my servant Moses?" And the wrath of the Lord's fury was made upon them, and they departed. And the cloud withdrew from the tabernacle, and behold, Miriam was made leprous as snow. You see what penalty the disparagers brought upon themselves, but what praise they sought out for him whom they had disparaged. For themselves they sought foulness, for him splendor; for themselves leprosy, for him glory; for themselves reproach, for him magnificence. Yet Moses, before he received the Ethiopian woman, it is not written that God spoke to him in his form and not in a riddle; but when he received the Ethiopian woman, then God says concerning him: "mouth to mouth will I speak to him, in his form and not in a riddle." For now, when Moses has come to us and has been joined to this our Ethiopian woman, the law of God is now recognized no longer in figures and in images as before, but in the very form of truth; and the things which before were signified in a riddle are now fulfilled in form and truth. And therefore he who expounded the forms of the figures and riddles says: "but we know that our fathers were all under the cloud, and were all baptized into Moses in the cloud and in the sea, and all ate the same spiritual food, and all drank the same spiritual drink. For they drank of the spiritual rock following them; and the rock was Christ." You see how Paul resolves the riddles of the law and teaches the forms of the riddles, and says that the rock was in a riddle with Moses, before it was joined to this our Ethiopian woman. Now in form the rock is Christ; for now God speaks mouth to mouth through the law. Before, the baptism in the cloud and in the sea was in a riddle, but now in form there is regeneration in water and the Holy Spirit. Then in a riddle the manna was food, but now in form the flesh of the Word of God is the true food, as he himself says: "my flesh is truly food, and my blood is truly drink." Thus, therefore, now already Moses, placed among us and joined to this Ethiopian woman, whether he himself to us or God to him, speaks not in a riddle, but in form. And to this is added: "and he saw," he says, "the glory of the Lord." When did Moses see the glory of the Lord? I say, then, when the Lord was transformed on the mountain and Moses was present with him together with Elijah and they conversed with him. And therefore in what follows he rightly adds: "and why were you not afraid to detract from my servant Moses?" Which is evidently directed, at any rate, against those who seem indeed to receive the Gospels, but detract from Moses, and are deservedly reproved, because, when they learn through the Gospel that Moses together with Elijah saw the glory of the Lord, they have dared to detract from the law and the prophets. And therefore let us not detract from Moses nor disparage the law, but let us be not only hearers of the law, but also doers, that with Moses himself we may be counted worthy to be glorified together. But I think that they too furnish material for detracting from Moses who, for example, when the book of Leviticus or the reading of Numbers is read, do not show how these things, which are written in a riddle, ought to be understood through the form — that is, those who do not spiritually expound the things which are read in the law. For necessarily those who hear the rite of sacrifices or the observance of sabbaths or of the other like things recited in the church are offended, and say: what need is there that this be read in the church? What profit to us are the Jewish precepts and the observances of a rejected people? These things are of the Jews, and let the Jews see to them. Therefore, lest offenses of this kind befall the hearers, effort must be given to the knowledge of the law, and, according to this, that the law is spiritual, the things which are read must be understood and explained, lest by the fault of the teachers — nay rather, by their sloth and negligence — Moses be detracted from by the unskilled and unlearned; but let us turn to the Lord, that he may take away from us the veil of the letter, so that not a disfigured countenance of Moses, but a glorious and comely one may appear to us, so that we not only do not disparage him, but even, for the greatness of his meanings, confer praise and glory upon him. "And the wrath of the Lord's fury was made upon them, and they departed. And the cloud withdrew from the tabernacle, and behold, Miriam was made leprous as snow." The wrath of the Lord's fury is brought about upon those who speak evil and detract. But what he says: "the cloud withdrew from the tabernacle, and behold, Miriam was made leprous as snow," must be considered more diligently, that first the cloud withdraws and thus the leprosy fills her: so that it may be shown that, even if there is in someone the grace of the Holy Spirit and he disparages and detracts, it withdraws from him after the disparagement, and thus his soul is filled with leprosy. For that former people too had in itself the grace of God, but after they stretched forth the tongues of their blasphemy against the true Moses, our Lord Jesus Christ, the cloud departed from them, and passed over to us onto the high mountain, when our Savior was transformed and the shining cloud overshadowed his disciples and a voice came from the cloud saying: "this is my beloved Son, in whom I am well pleased." After this, therefore, Miriam was made leprous as snow. While the cloud was present, Miriam was not leprous, but when it departed. For while the visitation of God was in that people, it was not leprous; but when it departed, the ignominy of its own countenance covered it. But let us also fear, lest perhaps we put this cloud to flight from us by speaking evil, by acting evilly, by thinking evilly; and then the leprosy of sin will appear in us, when the grace of God has deserted us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily07.html'
