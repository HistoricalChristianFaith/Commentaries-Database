[[commentary]]
quote='''
And plainly, if we hear negligently, if we bring no zeal to erudition and understanding, not only the Scripture of the law and the prophets, but even that of the Apostles and the Gospels is covered from us with a great veil. But I fear lest, through excessive negligence and dullness of heart, the divine volumes be for us not only veiled but even sealed, so that, "if a book to be read is given into the hands of a man who does not know letters, he says: I do not know letters; if it is given into the hands of a man who knows letters, he says: it is sealed." Whence it is shown that we must not only apply zeal to learning the sacred letters, but must also entreat the Lord and "day and night" beseech him, that the Lamb "from the tribe of Judah" may come and himself, taking the "sealed book," may deign to open it. For he it is who, "opening the Scriptures," kindled the hearts of the disciples, so that they said: "was not our heart burning within us, when he opened to us the Scriptures?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily12.html'
source_title="HOMILIES ON EXODUS 12"
