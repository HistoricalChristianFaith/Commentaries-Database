[[commentary]]
quote='''
In that he says that without ceasing he prays for those to whom he writes, mindful of his own command he fulfills in deed what he enjoins in word. But since he says that he beseeches that if by any means at length at some time he may have a prosperous journey, so that by the will of God he may come to the Romans, it must be considered that the apostle of God, setting out for a holy work, that is, the work of the Gospel, waits until by his entreaties he may obtain not only that his journey be made prosperous, but that it be made prosperous by the will of God. Whence much more must prosperity of journey be sought from God by us, who have not so great a consciousness either of the work or of merit, when we plan to do anything. Yet I think that the Apostle wished this too to be understood: that prosperity of a journey is not always accomplished by the will of God. Finally, Balaam too had a prosperous journey in going to Balak, that he might curse the people of Israel; but that prosperity was not from the divine will. And many in the affairs of the age enjoy prosperous successes, and exult in their prosperities; but such prosperity is not from the will of God, unless the work of our journey be such as the Apostle here designates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook01.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
