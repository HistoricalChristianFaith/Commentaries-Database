[[commentary]]
quote='''
"And the Lord said", it says, "to Gideon: everyone who shall lap the water with his tongue, as a dog laps, you shall set him apart; and everyone who shall bend his knees to drink, you shall set him aside. And the number", it says, "of those who lapped the water in their hand or with the tongue was three hundred men, but all the rest bent their knees to drink the water. And the Lord said to Gideon: by these three hundred men who lapped I will save you and deliver Midian into your hand". In almost all the deeds of the ancients vast mysteries are signified, as we see happening also in this passage, because those who go down "to the water", that is, who come to the grace of baptism, ought not to fall down to the earth nor "bend their knees" and yield to the temptations that are to come, but to stand bravely and steadfastly, as the prophet also said: "Lift up the hands that hang down and the loosened knees", and: "Make straight the going of your paths". You have come to the water of baptism; this is the beginning of the contest and of the spiritual battle, from here arises for you the commencement of the fight against the devil. If you are the more slack, if you can easily be made to bend, how will you fight, how will you stand against the wiles of the devil? Therefore the Apostle also cries out: "Stand therefore, and do not again cling to the yoke of bondage", and again he says: "Stand in the Lord", and a third time he says: "For we now live, if you stand in the Lord". That one, then, is approved, that one is chosen, who, after coming to the waters of baptism, knows not how to be bent toward earthly and bodily necessities, who does not indulge the vices nor is laid prostrate through thirst for sin. But as for its saying that they "lapped the water with the hand or the tongue", this seems to me written not without a certain significance of a mystery, namely that the soldiers of Christ ought to work with hand and tongue, that is, by deed and by word, because "he who teaches and does, he shall be called great in the kingdom of heaven". And that Scripture also set down the likeness of a dog lapping — this animal seems to me to be named in this place for the reason that above all other animals it is said to keep love for its own master, and neither by time nor by injuries is its affection reported to be blotted out in it. Three hundred only, then, who prefigured the image of this mystery, these are the chosen, these the approved, these consecrated to victory, who by the very mystery of the number could prevail over the adversaries. For they are three hundred, who multiply a hundred by three and bear the number of the perfect Trinity, under which number the whole army of Christ is reckoned. Among whom let us wish that we too may deserve to be enrolled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily09.html'
source_title="HOMILIES ON JUDGES 9"
