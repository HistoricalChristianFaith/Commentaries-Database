[[commentary]]
quote='''
"They that were filled with loaves were led into servitude." She shows that it is blameworthy to be filled with loaves, because Jacob ate and drank, and was filled, and grew fat, and the beloved kicked. "They that were hungry were forsaken." She means those who had been filled with loaves, because they forsook the hungry. There came a famine, not a famine of bread, nor a thirst of water, but of hearing the word of the Lord. Therefore "they that were hungry were forsaken, until the barren bore seven, and she that was fruitful in sons was made weak. For many are the sons of the deserted, more than of her that hath a husband." Barren is our mother the Church; she bore seven, that is, the number seven, to which rest is ascribed. "And she that was fruitful in sons was made weak." I should like to see how the Jews, the patrons of the letter, assert that she who is fruitful in sons is made weak, and how the barren bore seven: but, their fables despised, let us consider, whether perhaps each one of us may have within himself the barren woman who bore seven, and may have also the woman fruitful in sons who is made weak. Fruitful in offspring was my flesh, having very many fruits of the flesh: fornication, uncleanness, wantonness, idolatry, sorceries, enmities, contentions, jealousies, provocations, dissensions; these were the numerous progeny of our flesh. But when we came to the faith of the cross of Christ, and to the mortification of Jesus, we began to carry about in our body, and to mortify our members which are upon the earth, and to present them to serve righteousness and sobriety: then the fecundity of this shameful generation was shut out, and in this way she that was fruitful in sons was made weak. But how the barren woman bears seven, let us see. Barren in me was my soul, it brought no fruits of righteousness: but now, when through the faith of Christ it merited the grace of the Holy Spirit, and the spirit of wisdom and understanding filled it, the spirit of counsel and might, the spirit of righteousness and mercy, and the spirit of the fear of the Lord filled it: it is certain that the barren woman bore seven, and she that was fruitful in sons was made weak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.18"
