[[commentary]]
quote='''
Then there is another prophecy, which — I do not know how — we did not find among the Seventy, but we found in the remaining editions, clearly lying in the Hebrew, and it is filled with matters most necessary, able, if we attend, to turn our soul back. And the words are thus: "The sin of Judah is written with a pen of iron, with an adamantine point engraved upon the breast of their heart." It is possible to give oneself over to the easier course and to say: these things are written concerning the Jews, that their sin "is written." But if you see, as we have often shown, Judah spoken of figuratively as Christ, perhaps "the sin of Judah" is ours who believe on Christ who is from the tribe of Judah. But if you are able to hear otherwise, in a more mystical way, perhaps he prophesies concerning Judas the betrayer, so that the prophecy is concerning him, saying: "The sin of Judas is written with a pen of iron, with an adamantine point engraved upon the breast of the heart"; but again the word "their" does not follow with respect to that man. Perhaps, then, he was speaking with reference to us, that, if we become sinners, these prophesied things overtake us. We have sinned, and our sin is not written outside us, but in our heart, and it is written "with a pen of iron, with an adamantine point." And that the sins which we sin are inscribed into us through the sinning, the matter itself will present. I was not conscious to myself of this or that matter or of this or that sin. Having done it, I have an imprint of it, and, as it were, there is written the imprint of my sin that has been sinned in my soul. And if my sin were written with ink, I would have wiped it out; but as it is, it is written "with a pen of iron," it is written "with an adamantine point," it is written "upon the breast of the heart" of ours, so that I may come to the tribunal and the prophecy be fulfilled that says: "There is nothing hidden that shall not be made manifest, and nothing covered that shall not be revealed." My breast was laid bare, and my heart having the letters of sin inscribed "with the pen," upon my breast and in my heart the imprints of my sins. "For there is nothing hidden that shall not be made manifest," but "amid one another the reasonings accusing or even defending," and "judge nothing before the time, until the Lord comes, who will both illuminate the hidden things of darkness and make manifest the counsels of the hearts." To whom will he make them manifest? Not to himself; for he himself knows "all things before their coming to be." But to whom, then, will he make them manifest? To all those who are going to see, on account of their own purity, the sin of the one who has sinned, so that the sinners "may rise up to reproach and to everlasting shame"; from which may the God of all deliver us, so that we may rise up to the glory that is in Christ, to whom is the glory and the might unto the ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily16.html'
source_title="HOMILIES ON JEREMIAH 16"
