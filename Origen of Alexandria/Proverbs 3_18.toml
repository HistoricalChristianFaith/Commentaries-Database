[[commentary]]
quote='''
But do you wish that I show you from the Scriptures that these several virtues, which we mentioned above, are called trees or shrubs? I bring forward as witness the most wise Solomon, saying concerning wisdom: "it is a tree of life", he says, "to all who embrace it". If therefore "wisdom is a tree of life", without doubt there is also another tree of prudence, and another of knowledge, and another of justice. For it is not consequently said that of all the virtues wisdom alone deserved to be called "a tree of life", but that the other virtues by no means received the appellations of a like lot. "The trees", therefore, "of the field shall give their fruit".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily16.html'
source_title="HOMILIES ON LEVITICUS 16"


[[commentary]]
quote='''
These things must be understood to be said figuratively; for Christ himself is called "the tree of life." But just as in other passages he is shown to be both priest and victim and altar, and the one meaning is not hindered by the other, but each single thing is understood figuratively concerning him in its own places, so also now in the figures of the sacraments the diversity of persons taken up concerning one and the same thing will not hinder.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily08.html'
source_title="HOMILIES ON JOSHUA 8.6"


[[commentary]]
quote='''
It is just this needful bread that seems to me to be otherwise termed in Scripture a "tree of life." If a person stretches his hand to it and takes of it, he will live forever. And under a third name this tree is termed "wisdom of God." In Solomon's words: "She is a tree of life to all that take hold of her, and to those that lean on her as on the Lord she is safe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FOn%2520Prayer%2FOn%2520Prayer.html'
source_title="ON PRAYER 2:27.10"
