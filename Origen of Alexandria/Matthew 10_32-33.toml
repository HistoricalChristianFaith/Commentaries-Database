[[commentary]]
quote='''
And the Lord himself too gave a most beautiful distinction concerning this in the Gospels, when he says: "whoever confesses in me before men, I also will confess in him before my Father, who is in heaven. But whoever denies me before men, I also will deny him before my Father". You have seen that of those who "confess in himself" he said "he confesses", as one who himself lives in them and works the works of life. But in those "who deny" he did not keep the same likeness of the word, so as to say that whoever denies in me, I too will deny in him, but "whoever denies me before men, I too will deny him before my Father", to show that he who indeed "denies" is outside of himself, whereas he who "confesses" is in himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily02.html'
source_title="HOMILIES ON JUDGES 2"
