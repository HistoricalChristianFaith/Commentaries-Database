[[commentary]]
quote='''
After these things "Jesus summons the sons of Reuben and the sons of Gad and the half-tribe of Manasseh," who had done military service with him in overcoming the enemies of Israel, and he dismisses them to go to their inheritance, having also given them certain gifts, as it is written. In which he seems to indicate this mystery: that, "when the fullness of the nations has come in," and they have received what was promised to them by the Lord Jesus, those who had been taught and instructed through Moses, and who brought us aid by their prayers and supplications while we were set in the struggle — because they have not yet obtained the promises, waiting "that our calling too might be completed," as the Apostle says — now at last obtain the perfection which had been deferred for them, together with the gifts which they receive from Jesus, so that each one may dwell in peace, all war and all assault having ceased.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily26.html'
source_title="HOMILIES ON JOSHUA 26.2"
