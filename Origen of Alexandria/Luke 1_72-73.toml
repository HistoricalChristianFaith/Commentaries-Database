[[commentary]]
quote='''
"To show mercy toward our fathers" — I think that at the coming of the Lord the Savior both Abraham and Isaac and Jacob enjoyed the mercy of God. For it is not credible that those who earlier saw his day and rejoiced should afterward, at his coming and his birth from the Virgin, have received no benefit. And why do I speak of the patriarchs? Following the authority of the Scriptures, I will boldly ascend to higher things, since the presence of the Lord Jesus and his dispensation profited not only things earthly but also things heavenly. Whence the Apostle also says: "making peace through the blood of his cross, whether upon the earth or in the heavens". But if in heaven and on earth the presence of the Lord was of profit, why should you be afraid to say that his coming profited even the greater ones, so that this might be fulfilled which is said: "to show mercy toward our fathers, and to remember his holy covenant, the oath which he swore to Abraham our father", that he might grant us to be freed "without fear from the hand of the enemies"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily10.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 10"
