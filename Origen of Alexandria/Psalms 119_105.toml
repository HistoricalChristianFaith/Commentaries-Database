[[commentary]]
quote='''
Yet I remember that some time ago, when we were expounding that verse of the hundred and eighteenth psalm in which it is written: "your law is a lamp to my feet, O Lord, and a light to my paths", we showed, according to our ability, the difference between the "lamp" and the "light". For we said that he assigned the "lamp" indeed to the "feet", that is, to the lower parts of the body, but gave the "light" to the "paths", which "paths" in another place are called "eternal paths". Since, then, according to a certain mystical meaning, this world is understood as the lower parts of creation, therefore the "lamp" of the law is recorded as kindled for those who are in this world as it were the feet of the whole creation. But the "light" will be eternal for those "paths" along which in the age to come each one will walk according to his merits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily13.html'
source_title="HOMILIES ON LEVITICUS 13"
