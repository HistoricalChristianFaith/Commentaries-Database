[[commentary]]
quote='''
And again "The Lord knows the reasonings of the wise, that they are vain". It is not marvelous if the Lord knows in himself the reasonings of the wise, that they are vain; but I wish the Lord, having come to be in me, to know the reasonings of the wise, that they are vain. For if Christ comes to be in me, he can demonstrate to me how the reasonings of the wise of the world are vain, and how the wisdom of God alone shines, conquering and trampling down every seeming wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XVI"
