[[commentary]]
quote='''
But we marvel at John, because among them that are born of women there was not a greater than he, for by his good deeds he had been exalted to so high a fame for virtue, that by many he was supposed to be Christ. But what is much more marvellous he feared not Herod, nor dreaded death, as it follows, But Herod the tetrarch being reproved by him.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Let us marvel at John, and indeed from the very things that follow, most of all because "among those born of women there was none greater than John the Baptist", and because he rightly rose to so great a reputation by his virtue that he was thought by very many to be "the Christ". But this is far more marvelous: Herod the tetrarch held royal power and could have killed him whenever he wished; and although he had done an unjust deed and one contrary to the law of Moses, in taking his brother's wife, who had a daughter by her former husband, John did not fear him, did not show partiality, did not consider, as I have said, the royal power, did not dread destruction—for he knew, even if he were not a prophet, that when provoked Herod could kill him—so then, though he knew all these things, with prophetic liberty he rebuked Herod and denounced the incestuous marriage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily27.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 27"
