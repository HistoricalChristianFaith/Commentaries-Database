[[commentary]]
quote='''
"Initiate the well for it," it says. This is the sense: set, it says, the well as the beginning of all things, just as the Apostle also says that "he is the beginning, and the firstborn of every creature, and in him all things were created." Initiate the well for it, therefore — that is, confess the well to be the beginning of all things. But it can also be understood in this way, that the words seem to be directed from the person of Moses, exhorting the people and saying: Give a beginning to your heart, that it may begin to understand what the well is, from which the spiritual waters are to be drawn and by which the people of believers is to be refreshed. Initiate this well, therefore, for it, that is, for Israel, so that whoever sees God with the heart may be able to draw the mystical sense from the depths. That Moses, that is the Law, should gather us to this well does not seem to be said in vain. For it can happen that someone may seem to come to this well, but unless he is gathered through Moses, he is not accepted by God. Marcion seems to himself to have come to this well, and Basilides and Valentinus, but because they did not come through Moses nor receive the Law and the prophets, they cannot praise the Lord God from the fountains of Israel. Therefore those who are of this kind do not come to the well which the princes dug and the kings hewed out. But do you wish me to show you from the Scriptures to what wells these men come? There is a certain salt valley, in which valley are wells of bitumen; every heresy therefore and every sin is in a valley, and in a salt valley. For sin and iniquity does not ascend upward, but always descends to the lowest and infernal places. Every heretical understanding, therefore, and every act of sin is both set in a valley and salt and bitter. For what sweet, what pleasant thing can sin have? But it has something even more. For if you come to a heretical opinion, if you come to the bitterness of sin, you have come to the wells of bitumen. Bitumen is food and nourishment for fire. If therefore you too taste water from these wells, if you take up a heretical understanding, if you receive the bitterness of sin, you will prepare within yourself the kindling of fire and the burnings of Gehenna. And therefore to those who are unwilling to drink water from that well which the princes dig and the kings, but from these which are in the valley of sin and feed the fuel of fire, it is said: "Walk in the light of your fire and of the flame which you have kindled for yourselves." What, then, is sung at this well? "Initiate the well for it," it says; "the princes dug it, the kings hewed it out." The princes and the kings can indeed seem to be the same; but if it is necessary to distinguish them, let us understand the princes as the prophets. For they placed the meaning and prophecy concerning Christ dug down and submerged in the depth of the letter, and therefore one of them said: "Unless you hear in secret, your soul will weep." And likewise another prophet says to the Lord: "How great is the multitude of your sweetness, O Lord, which you have hidden for those who fear you!" These, then, are the princes who dug this well, but the kings are those who hewed it out. That it said "hewed out" (excuderunt) is said from "hammering out" (excudere), not from "cutting away" (excidere); for that is said to be "hammered out" which is either cut or shaped in stone. The princes therefore, as being somewhat inferior, are said to dig the well, that is, as it were to sink a certain depth in the softness of the earth. But these, whom it calls kings, as being stronger and more eminent, penetrate not only the depth of the earth but also the hardness of the rock, that they may be able to reach the deeper waters and, if it may be said, search out in it the very veins of the abyss, knowing that the judgments of God are a great abyss. These kings, then, who can search out things so deep and so hidden of the well, we may rightly call the Apostles, one of whom said: "But to us God has revealed it through the Holy Spirit. For the Spirit searches all things, even the deep things of God." Because, therefore, through the Spirit they too can search out the deep things of God and penetrate the high and deep mysteries of the well, they are for that reason said to be kings, who hewed out this well even in the rock and penetrated the hard and difficult secrets of knowledge. That the Apostles too can be called kings, I think can easily be proved from this, which is said of all believers: "But you are a royal race, a great priesthood, a holy nation." If, then, they call kings those who believed through their word, how much more are they themselves to be held as kings, who make kings? But from this too it is easily gathered: for if kings are named from ruling, then certainly all who rule the churches of God will rightly be called kings, but much more rightly those who by their words and writings rule even those very men by whom the churches are ruled. And on account of this the Lord is rightly called King of kings; for unless these and the rest who imitate them are kings, he will not appear as King of kings. But the Apostle Paul himself too, writing to the Corinthians and rebuking them as it were with a certain irony, says: "Without us you reign; and would that you did reign, that we too might reign with you." In which he certainly declares that the Corinthians ought to be kings and that he himself wishes to reign with them, but he reproaches their elation over an honor not yet assumed according to merit. All these princes, then, dig this well, and the kings of the nations hew it out; for the Apostles are especially the kings of the nations, who gathered the nations to the obedience of faith and laid open the knowledge of Christ to all — in whom are the treasures of the wisdom and knowledge of God hidden — going around the circle of the earth according to the command of the Lord and fulfilling what was commanded, that they should teach all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit; and by these things they hewed out, that is, laid open the knowledge of the well and brought it into the knowledge of all the nations. But these things too which we now have in hand, which have been recited to us, are a well, and all the scripture of the Law and the prophets together; the Evangelical and Apostolic scripture also, all together, is one well, which they cannot dig or hew out unless they are found to be kings and princes. For truly they are to be held kings, truly princes, who can remove the earth from this well and take away the surface of the letter and from the inner rock, where Christ is, bring forth the spiritual senses like living water. This, therefore, it is fitting that those alone do who are either kings or princes; called kings from this, that they have driven out the reign of sin from their body and have prepared the reign of righteousness in their members. For it is fitting that he teach others who has first done the very things which he teaches. For thus it is written: "Whoever shall do and shall so teach men, he shall be called great in the kingdom of heaven." But to be great in the kingdom, this is to be a king. "The kings of the nations hewed it out," it says — in their kingdom, while they ruled over them. For in very truth they cannot dig this well nor open the hidden veins of living water, unless they have first held dominion over the barbarous nations. For everything whatsoever that was wild in them in their acts, whatever was barbarous in their conduct — if they have tamed it and subjected it to the royal understanding and held dominion over it, so that henceforth they act not like the heathen but lawfully — these are truly kings, probing the depths of the well and searching out the hidden and mystical things of the Word of God.
'''
