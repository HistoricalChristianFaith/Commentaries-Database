[[commentary]]
quote='''
After this there follows yet another narrative. For it says: "And Moses sent" — or, as it stands in some copies, "And Israel sent messengers to Sihon king of the Amorites with words of peace, saying: We will pass through your land; by the road we will pass; we will not turn aside either into a field or into a vineyard. We will not drink water from your well; we will go by the royal road, until we pass your borders. And Sihon did not grant that Israel should pass through his borders; and Sihon gathered all his people, and went out to make war against Israel in the desert; and he came to Jahaz, and joined battle with Israel. And Israel struck him down with the slaughter of the sword, and they took possession of his land." The narrative indeed is plain, but let us beseech the Lord that we may be able to discern something worthy in its inner meanings. Sihon has a double interpretation, either "unfruitful tree" or "lifted up." Israel therefore sends messengers to Sihon: it sends to the unfruitful tree, it sends to the one lifted up and proud. Now this Sihon is king of the Amorites, who themselves are interpreted as "those bringing into bitterness" or "speaking." Moses therefore sends to Sihon king of the Amorites with words of peace, saying: "We will pass through your land." If, according to the spiritual understanding, we say that Sihon the king holds the figure of the devil, because he himself is lifted up and unfruitful, I think you ought not to wonder that I have called him a king, since you hear even our very Lord and Savior in the Gospels saying concerning him: "Behold, now comes the prince of this world, and in me he will find nothing," and again: "Behold, now the prince of this world shall be cast out." If therefore he is called in the Gospels the prince of the whole world, it ought not to seem absurd if he is compared to Sihon king of the Amorites, or even to any other kings of the nations whatsoever. But he is called prince of the world not because he created the world, but because there are many sinners in this world. And because he himself is the prince of sin, therefore he has also been called the prince of the world — namely, among those who, not yet abandoning the world, are converted to the Father. For it is according to this that that also is said: "the whole world is set in wickedness." For what does it profit us to say that our prince is Christ, if by our deeds and works we are convicted that the devil holds the princedom in us? Or is it not plain under which prince the unchaste, the incestuous, the unjust man acts? Can a man of this sort say that, set under Christ, he does these things, even if he seems to be reckoned under the name of Christ? In whom Christ bears the princedom, there no uncleanness, no iniquity is admitted, nor can unjust desire have any place. According to this manner, then, rightly will Christ be called the prince of the virtues, and the devil of malice and of all iniquity. Israel therefore sends messengers to the king of the Amorites, the king of those who provoke into bitterness, the unfruitful king, the proud king. In what way will the devil be shown to be proud, in what way lifted up? He it is who said: "By my strength I will act, and by the wisdom of my understanding I will remove the borders of the nations, and I will plunder their might; and I will shake the cities which are inhabited, and the whole circle of the earth I will take in my hand like a nest." And again this lifted-up and proud one says: "I will ascend into heaven, above the stars of heaven I will set my throne, I will sit upon a lofty mountain above the high mountains which are toward the north, I will ascend above the clouds, and I will be like the Most High." Do you still ask whether he himself is lifted up and proud? Nay rather, both he himself is proud and lifted up, and that one who is, as it were, his only-begotten, of whom it is written that "he shall be exalted above everything that is called God or that is worshipped, so that he sits in the temple of God, showing himself off as though he were God." Everyone therefore who is lifted up and proud is either a son of this lifted-up one, or a disciple and imitator. And for this reason the Apostle says concerning a certain one: "lest perhaps, being lifted up, he fall into the judgment of the devil," showing by this that everyone who is lifted up will be condemned by a like judgment, as the devil is. We therefore are those who wish to pass through this world, that we may be able to arrive at the holy land, which has been promised to the saints; and we send with words of peace to Sihon, promising that we will not dwell in his land nor tarry with him, but only pass through and walk by the royal road, nor turn aside anywhere, neither into a field nor into a vineyard, but that we will not even drink water from his well. Let us see, then, when we promised these things, when we announced these words to the devil. Let each of the faithful call to mind, when he first came to the waters of baptism, when he received the first seals of the faith and approached the fountain of salvation, what words he then used there and what he announced to the devil: that he would not make use of his pomps, nor of his works, nor at all yield to any of his services and pleasures. And this is what is foreshadowed in these words of the law, that Israel would not turn aside either into his field or into his vineyard, but that it promises it will not drink water even from his well. For no longer will the faithful one take the cup of diabolical instruction, not of astrology, not of magic, not at all of any teaching which teaches anything against the piety of God. For he has his own fountains, and Israel drinks from the fountains, drinks from the fountains of salvation; he does not drink water from the well of Sihon, nor, forsaking the fountain of living water, does he gather for himself broken cisterns. But he also professes that he will walk by the royal road. What is the royal road? That one, without doubt, which says: "I am the way and the truth and the life." And rightly royal; for it is he of whom the prophet says: "God, give your judgment to the king." By the royal road, therefore, one must walk, nor turn aside anywhere, neither into his field nor into his vineyard — that is, the mind of the faithful ought no longer to turn aside either to diabolical works or to diabolical senses. In what way, then, do we wish to pass through the borders of the Amorites with peace? The Amorites can be taken as the portion of the unbelievers who are in this world; but these are interpreted, as we said above, either as "those bringing into bitterness" or "speaking." And in what way indeed the unbelievers and the incredulous bring God into bitterness needs no exposition; but what he says, "speaking," can be drawn to that part, that all who are unbelieving and act under the devil as prince know only how to speak, but they speak empty things. For example, as their poets, as the astrologers, as some even of the philosophers, who speak things empty and vain. But the kingdom of the faithful, which is from God, is not in speech, but in power. We therefore wish to pass through the world peacefully, but this very thing rather incites the prince of the world, that we say we are unwilling to remain with him nor to tarry nor to wish to touch anything of his; from that he is the more exasperated, from that he is provoked and grows angry and stirs up persecutions against us, rouses dangers, threatens torments. And therefore it says: "Sihon," it says, "gathered all his people, and went out to fight against Israel." Who is all the people of Sihon, whom he stirs up against Israel? The princes and judges of the world and all the ministers of wickedness, who always assail and persecute the people of God. But what does Israel do? "It came," it says, "to Jahaz." Jahaz is interpreted "the fulfilling of the commandment." If therefore we too come to this place, that is, to the fulfilling of the commandments, even if that lifted-up and proud Sihon, the devil, come against us with his whole army and fight against us, if he stir up all his demons against us, we overcome him, if we fulfill the commandments of God. For to fulfill the commandments is to overcome the devil and his whole army. And then there will be fulfilled in us the prayer of the Apostle, in which he says: "But God will crush Satan under your feet speedily," and that which the Lord says: "Behold, I give you power to tread upon serpents and scorpions, and over all the power of the enemy, and nothing shall harm you." For all these things will be able to do us no harm, if we come to Jahaz, that is, if we keep the commandments and precepts of our Lord Jesus Christ, to whom is glory and dominion unto the ages of ages. Amen.
'''
