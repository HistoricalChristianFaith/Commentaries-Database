[[commentary]]
quote='''
And therefore he says: Therefore he who resists the power resists the ordinance of God; and those who resist acquire damnation for themselves. He is not here speaking of those powers which bring persecutions upon the faith; for in that case it must be said: We ought to obey God rather than men. Rather he is speaking of those ordinary powers which are not a terror to the good work, but to the evil: and whoever resists these certainly procures damnation for himself according to the quality of his deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
