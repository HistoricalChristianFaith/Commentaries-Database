[[commentary]]
quote='''
It is likely, moreover, that what has been recorded in the Gospels according to Matthew and Mark in the name of the false witness who accuses our Lord Jesus Christ at the end of the Gospel contains a reference to the saying, "Destroy this temple and I will raise it up in three days." For he … was speaking about the temple of his body, but they, supposing that the things said here were said about the temple built from stones, accused him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252010.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 10.251-52"


[[commentary]]
quote='''
Both, however (I mean the temple and Jesus' body), according to one interpretation, appear to me to be a type of the church, in that the church, being called a "temple," is built of living stones, becoming a spiritual house "for a holy priesthood," built "on the foundation of the apostles and prophets, Christ Jesus being the chief cornerstone." And through the saying, "Now you are the body of Christ and members in part," [we know] that even if the harmony of the stones of the temple appear to be destroyed, [or,] as it is written in Psalm 21, all the bones of Christ appear to be scattered in persecutions and afflictions by the plots of those who wage war against the unity of the temple by persecutions—we know that the temple will be raised up and the body will arise on the third day after the day of evil that threatens it and the day of consummation that follows. For the third day will dawn in the new heaven and the new earth, when these bones, the whole house of Israel, shall be raised up on the great day of the Lord, once death has been conquered. Consequently, the resurrection of Christ too, which followed from his passion on the cross, contains the mystery of the resurrection of the whole body of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252010.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 10.228-29"

[[commentary]]
quote='''
Do not suppose that Matthew called these two witnesses false without cause, since their testimonies seemed to be true from the fact that John sets forth that Christ said: "Destroy this temple, and I in three days will raise it up", when there is also added: "But this he said concerning the temple of his body".

But observe the cunning of the two false witnesses, by what persuasion they, taking their start from a certain true saying which Jesus had spoken, fabricated a false testimony. For Jesus did not say: I destroy this temple, and in three days I raise it up, but: "Destroy … this temple, and in three days I will raise it up".

But the false witnesses reported that he had said what had not been said by him, nor did he say: I am able to destroy the temple of God and in three days to rebuild it. Therefore he did not himself promise to do the impiety of destroying the temple, but he committed it to those who were fit for such a work, saying: "Destroy this temple". But what did he reserve for himself, namely: "And I in three days will raise it up".

And the fact that "he said this concerning the temple of his body" the Jews, hindered by their malice, misheard and understood concerning that temple of stone, which is manifest from the fact that, answering, they said: "In forty and six years was this temple built, and dost thou raise it up in three days?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252026.html'
source_title="COMMENTARY ON MATTHEW 108"

[[commentary]]
quote='''
Now there are various sayings of the blasphemers, one blasphemy of which is that which is uttered by those who neither understand nor hear the things that are said nor concerning what they make their assertions: for Jesus said: "destroy this temple, and I in three days will raise it up", but those passing by, as "false witnesses" against Jesus, said what had not been said concerning him, assailing him: aha, you who destroy the temple of God, and in three days rebuild it. For he does not himself destroy the temple, but what others destroy he himself builds; whether "the temple of his own body", which had been handed over to death by the Jews, or the temple of his witnesses and of all who had the word of God in them and died from the ambushes of the impious on account of their piety (for "the hour comes when all who are in the tombs will hear the voice of the Son of God and will rise again"). And not only in that which they said: he who destroys the temple, did they lie, but also in that which they said: "and I in three days will rebuild it". For neither did he say that he would rebuild the temple, but that he would raise it up; for the word of building does not indicate a sudden work, but the word of raising up does indicate it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252027.html'
source_title="COMMENTARY ON MATTHEW 132"

[[commentary]]
quote='''
It is reasonable to question the chief priests, who came to Pilate to say the things they said: tell me, priests, when Jesus had said, "destroy this temple, and I will raise it up in three days," with what intent do you suppose he said this? Concerning the dissolution and resurrection "of his own body," or concerning the destruction and restoration of the temple itself? For if you understood it thus, that he was saying these things about his own resurrection, how is it that, giving testimony against him, you said that "this man said: I can destroy this temple and rebuild it in three days"? But if you truly understood it about that temple, according to which you also gave your testimony, how then do you now know that he said he would rise "after three days" from the dead? See therefore how impiety wars against itself by its own words. For through these words they themselves condemn that testimony of theirs, since, truly understanding him to be saying those things about the resurrection "of his own body" and knowing it, they turned his words toward the destruction and restoration of that insensible temple.

But if it is incredible that he said this, see whether it is not consistent that, just as he worked wonders, just as he foretold that his Gospel would be preached "in the whole world," and just as: "you will stand before governors and kings," and just as: "Jerusalem will be destroyed by an army," so also he foretold concerning his own resurrection what he said: "destroy this temple, and I will raise it up in three days."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252027.html'
source_title="COMMENTARY ON MATTHEW 145"
