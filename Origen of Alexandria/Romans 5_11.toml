[[commentary]]
quote='''
But as to the fact that he set down, in like manner as in the earlier passages, "And not only so, but we also now glory in God," and added nothing to the "and not only so," it is to be understood, just as above, as said of those things which have been set forth above: that is, that not only "when we were enemies, were we reconciled to God through the death of his Son," and not only "shall we be saved in his life, but we also now glory in God through our Lord Jesus Christ, through whom we have received the reconciliation." And not without reason did he add "now," when he might have said: "But we also glory in God through our Lord Jesus Christ, through whom we have received the reconciliation"; but he did so in order to show that glorying has been given to us not only in the future, but also in the present, from the knowledge of God, the amendment of life, and the correction of errors — as the same Apostle also says in another place: "Having hope both of the present life and of that which is to come": of the present, because it is more honorable and more amended; of the future, because it is eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook04.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
