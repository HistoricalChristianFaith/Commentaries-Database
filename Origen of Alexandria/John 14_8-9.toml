[[commentary]]
quote='''
Something of this kind I think must also be understood concerning Christ, when He was seen in the body: that not all who saw Him were able to see Him. For they saw only His body, but according to that which Christ was, they could not see Him. The disciples, however, saw Him and contemplated the greatness of His divinity. On which account I think that to Philip too, who entreated and said: "show us the Father, and it is enough for us", the Savior replied: "am I so long a time with you, and you have not known me? Philip, he who sees me sees also the Father". For neither did Pilate, who was seeing Jesus, behold the Father, nor did the traitor Judas—since neither Pilate himself nor Judas saw Christ according to that which Christ was, nor did the multitude that pressed upon Him. Those alone saw Jesus whom He judged worthy of His sight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily03.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 3"
