[[commentary]]
quote='''
Whence also I greatly marvel how this was written of Balaam, to whom it was not even granted to say what is customary among the prophets: "Thus says the Lord," but he says: "Balaam said, the man who truly sees said." Then further, how will it be worthy that so much be understood of Balaam, that he knows the knowledge of the Most High—he who even taught King Balak how to send a stumbling-block before the children of Israel, that they might eat things sacrificed to idols and commit fornication? For scarcely will anyone find it said of the holy prophets or Apostles that they know the knowledge of the Most High. Although Paul said that he heard unspeakable words, which it is not lawful for men to utter, yet he did not profess to have the knowledge of the Most High. On which account let us attend more diligently, in case perhaps God may deign to reveal something worthy to us upon this expression. In the book which among us is usually held among the volumes of Solomon and is called Ecclesiasticus, but among the Greeks is named the Wisdom of Jesus son of Sirach, it is written: "All wisdom is from God." Which perhaps we might so understand, as though from God were also that wisdom of this world, which is said to be destroyed, and of the princes of this world, and if there is any other by which false knowledge is commended; were it not that in the same little book it says in what follows: "For the discipline of wickedness is not wisdom." By which surely he teaches that every discipline which asserts anything false, even if it seem forceful and plausible and such as can hardly be overthrown, yet by no means ought knowledge of this kind to be applied to the title of wisdom. What then is it that he says: "All wisdom is from God"? He seems to me to have meant this: that every skill which is held necessary for human use in regard to any art, or the knowledge of any matter whatever, is said to be wisdom given by the Lord. In short, in Job it is written: "Who gave to women the wisdom of weaving and the discipline of embroidery?" But also in Exodus: "The Lord spoke to Moses, saying: Behold, I have called by name Bezalel the son of Uri, the son of Hur, of the tribe of Judah, and I have filled him with the divine spirit of wisdom and understanding and discipline, that he may have understanding in every work, and be an architect to work silver and gold and bronze and stones for setting and all works of craftsmanship, and in wood, that he may work according to all the works to which I have appointed him. And also Oholiab the son of Ahisamach, of the tribe of Dan; and I have put understanding into the heart of everyone who is prudent, that they may make all the things which I have appointed you." Consider therefore from all these things how the craftsman's wisdom is from the Lord, whether in gold or in silver or in any other material whatever, or even the wisdom of weaving; and see that of all these it can rightly be said that the knowledge of them is from the Most High. But if the craftsman's knowledge is declared to be from the Most High, how is not also geometry, from which surely this knowledge, which Scripture names architectonic, is derived? Indeed, in Zechariah too a geometric line is mentioned, with which an angel measures Jerusalem, and therefore I do not think it seems absurd if this knowledge too is said to be of the Most High. But what shall we say of music, all the skill of which the most wise David had so grasped, and had gathered the disciplines of all melody and rhythm, that from all these he might discover sounds by which he could, by playing, even soothe the king when troubled and vexed by an evil spirit? Whence I do not think anyone of right sense would deny, in the knowledge of all these things, that all wisdom is from God. But now concerning the knowledge of medicine I do not think there can even be a doubt; for if there is any knowledge from God, what will more be from him than the knowledge of health, in which even the powers of herbs and the qualities and differences of juices are discerned? Therefore from all these things it is gathered that even this knowledge of Balaam, for the sake of which he was summoned from the mountains of Mesopotamia in the east to curse Jacob, has indeed its beginnings and origin from the Most High, and thence too is the discernment by which he had learned either the natures of animals or the movements of birds or the differences of voices, but that the things which he had received unto the knowledge of good things, he had turned to the use of evil ones. This seems to me similar to as if one who had learned medicine and come to know the powers of herbs and their tempering—given by God to men doubtless for the sake of healing—should wish to reverse his purpose and use all this knowledge, which was granted for the health of bodies, unto evil, and become a poisoner instead of a physician, bringing diseases instead of remedies, deaths instead of healings. But that we may understand still more fully that the wisdom of all knowledge draws its origin from God, but that by men of evil purpose, or even by demons mingling in certain corruptions of the wisdom of God, it is turned aside to evil, let us reread the things which are written in Daniel concerning Daniel himself and his three friends, whom King Nebuchadnezzar handed over to be instructed for three years, wishing them to become most learned in their own—that is, the ancestral—wisdom of the Babylonians. There, then, it is written that: "The Lord gave them knowledge and understanding and prudence in every grammatical art; and to Daniel he gave understanding in every word and vision and dreams; and they were before the king, and in every word and prudence and discipline concerning which the king inquired of them, he found them tenfold more than were the sophists and philosophers who were in all his kingdom." And these things indeed are found in the copies of the Seventy translators; but in the codices of the Hebrews I found something even more forceful, which, although we do not use them, yet for the sake of acknowledgment we shall state, what we read there also: "God gave them," it says, "understanding and prudence in all grammatical wisdom; and Daniel had understanding in every vision and dreams," and after a few words: "and they stood," it says, "in the sight of the king, and in every word of wisdom and discipline concerning which the king inquired of them, he found them tenfold above all the enchanters and magicians who were in all his kingdom." From all these things, then, it can be understood how Balaam too said of himself: "who knows the knowledge of the Most High," namely, that it may be understood that the origin of all knowledge took its beginning from him, but that by the fault of human malice, with demons also breathing upon and stealing in, those things were turned to destruction which were granted for usefulness. Let these things concerning that which he said, "knowing the knowledge of the Most High," have been discussed by us according to our powers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily18.html'
source_title="HOMILIES ON NUMBERS 18.3"
