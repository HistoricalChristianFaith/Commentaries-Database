[[commentary]]
quote='''
The accusations they brought against our Lord Jesus Christ appear to have reference to this utterance of his, "Destroy this temple, and I will build it up in three days." Though he was speaking of the temple of his body, they supposed his words to refer to the temple of stone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252010.html'
source_title="COMMENTARY ON JOHN 10.21"

[[commentary]]
quote='''
And consider that not one false witness came forward for this testimony (for one was not sufficient for those wishing to kill Jesus, since the law commanded: "One witness shall not stand to give testimony against a man"), but neither were there three; for though many false witnesses came forward, scarcely two were found who seemed to say anything. But neither were their testimonies in agreement, as Mark sets forth; for he says in this manner, that "the chief priests and the whole council sought testimony against Jesus, that they might deliver him to death, and found none; for many spoke false testimony against him, and their testimonies were not in agreement. And others rising up spoke false testimony against him: that we heard him saying: that I destroy this temple made with hands, and in three days I will make another not made with hands. But neither so were their testimonies in agreement". For a testimony is in agreement when they say the same things, but they are not in agreement when they are dissonant with one another, such as were the testimonies of these who were bringing forward testimonies against Jesus. And if Matthew and Mark speak the truth (which we ought to believe), let us attempt to show how not even the testimonies of these two themselves were in agreement, since they did not bring forward the same things. For according to Matthew they said: This man said: I am able to destroy the temple of God and in three days to rebuild it, but according to Mark: "That we heard him saying: that I destroy this temple made with hands, and in three days I will rebuild another not made with hands". Whether therefore, saying these things twice, since they did not say the same things, their testimonies were not found in agreement with one another; or whether the one said what Matthew sets forth, and the other what Mark wrote, and thereby "their testimonies were not in agreement" with one another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252026.html'
source_title="COMMENTARY ON MATTHEW 108"
