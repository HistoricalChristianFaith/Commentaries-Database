[[commentary]]
quote='''
But if to anyone it seems difficult, what we say, that through each of those sinning many demons are at large, or if he thinks this fabulous, let him return to the authority of the Gospel and he will find that one who, "dwelling in the tombs, suffering a demon," when he "was questioned" by the Savior, "what is your name?", "answered," "legion, for we are many demons," it says. What wonder, therefore, does it seem, if through the individual kinds of sins individual demons are assigned, when it is written that in one man there was a whole "legion of demons"? But I remember that I said similar things also in those places in which we were expounding the little verse of the psalm, in which it is written, "in the mornings I slew all the sinners of the earth, that I might destroy from the city of the Lord all who work iniquity." So likewise also "in the hand of the just there are said to be two-edged swords," doubtless which slay the contrary powers. But I think that a more forceful assertion of the Apostle Paul can be brought forward for proving these things which we have said, when he says, "but the God of peace crush Satan under your feet speedily." For if there is one Satan, how can he both "be crushed under the feet" of the servants of God and again be at work? For if he "has been crushed" and "has been crushed by God," he surely can no longer be at work. Lest perhaps, therefore, there are to be thought to be as many Satans as are those who work the works of Satan. For this seems to me to be indicated also in Wisdom, where it is said, "the impious man, cursing Satan, curses his own soul." But also in a certain little book, which is called the Testament of the Twelve Patriarchs, although it is not held in the canon, we nevertheless find some such sense, that through each of those sinning individual Satans are to be understood. And more evidently the very interpretation of his name, as the studious ones of the Hebrews hand down, seems to signify this same thing; for Satan is called adversary. All, therefore, who are adverse to the will of God, can be called Satans.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily15.html'
source_title="HOMILIES ON JOSHUA 15.6"
