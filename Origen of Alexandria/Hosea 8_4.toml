[[commentary]]
quote='''
Not always is the prince of the people and judge of the Church given by the judgment of God, but according as our merits demand. If our deeds are evil and we "work evil in the sight of God", princes are given to us according to our heart; and this I will prove to you from the Scriptures. For hear what the Lord says: "They made themselves a king and not by me, and a prince and not by my counsel". And this seems to be said of that Saul, whom indeed the Lord himself had chosen and had commanded to be made king; but because he had been chosen not according to the will of God, but according to the merit of a sinful people, he denies that he was appointed with his will or counsel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily04.html'
source_title="HOMILIES ON JUDGES 4"
