[[commentary]]
quote='''
Aaron and Mary murmur against Moses, because Moses has an Ethiopian wife. Moses weds an Ethiopian wife, because his Law has passed over to the Ethiopian woman of our Song. Let the Aaron of the Jewish priesthood murmur, and let the Mary of their synagogue murmur too. Moses cares nothing for their murmuring; He loves His Ethiopian woman, concerning whom it is said elsewhere through the prophet: From the ends of the rivers of Ethiopia shall they bring offerings, and again: Ethiopia shall get her hands in first with God. It is well said that she shall get in first; for, as in the Gospel the woman with the issue of blood received attention before the daughter of the ruler of the synagogue, so also has Ethiopia been healed while Israel is still sick. By their offence salvation has been effected for the Gentiles, so as to make them jealous.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25201.html'
source_title="Homilies on the Song of Songs, Homily 1"
