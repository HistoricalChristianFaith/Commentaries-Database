[[commentary]]
quote='''
The kingdom of God, according to the word of our Lord and Savior, "comes not with observation"; and "neither shall they say, Behold here, or behold there"—but "the kingdom of God is within us" (for "the word is very near to us," in our mouths and in our hearts). So one who prays for the coming of the kingdom of God rightly prays that the kingdom of God might be established in himself, that it might bear fruit and be perfected in himself. Every saint, being ruled by God as king and obedient to the spiritual laws of God, as it were, dwells within this kingdom as in a well-ordered city. The Father is present to such a one, and Christ reigns with the Father in the soul that is maturing. This is in accord with the promise that "we will come to him and make our abode with him."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FOn%2520Prayer%2FOn%2520Prayer.html'
source_title="ON PRAYER 25.1"


[[commentary]]
quote='''
It is to come to pass that it be filled, when that prayer shall have been fulfilled by which the Lord himself commanded us to "pray" to the "Father", saying: "when you pray, say: Our Father, who art in heaven, hallowed be thy name! Thy kingdom come! Thy will be done, as in heaven so on earth!". As yet the "will" of the "Father" is "in heaven"; "on earth" his "will" is not yet fulfilled; and Jesus himself, according to the dispensation of the flesh which he had put on, says: "he gave me all power, as in heaven so on earth"—not that he did not have "power on earth", he who had it "in heaven", but that God might so be believed "on earth" as he was believed "in heaven". Therefore the man Christ received "power" which before he did not have, and up to the present he does not yet have "power" over all "on earth". For over those who sin he does not yet reign; but when the "power" over these too has been given to him, when "all things have been made subject" to him, then the "power" will be complete.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily01.html'
source_title="HOMILIES ON ISAIAH 1"
