[[commentary]]
quote='''
For there is "one body" which is awaited to be justified; there is "one body" which is said to rise again in the judgment. "For although there are many members, yet one body; the eye cannot say to the hand: I have no need of you". Even if the eye be sound and not troubled, as far as pertains to seeing, if the remaining members are lacking to it, what gladness will there be for the eye? Or what perfection will it be seen to have, if it has not a hand, if the feet are lacking or the remaining members are not present? For even if there is some surpassing glory of the eye, it is chiefly in this, that either it itself be the guide of the body, or it not be forsaken by the offices of the other members.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
