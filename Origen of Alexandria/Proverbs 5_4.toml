[[commentary]]
quote='''
Nothing can be more bitter than sin, even though certain sins seem sweet at first, just as Solomon writes: "but in the end," he says, "you will find it more bitter than gall" — that which at the beginning seemed sweet — "and sharper than the edge of a sword." But the nature of righteousness is contrary; at the beginnings it seems more bitter, but in the end it is found sweeter than honey, when it has brought forth the fruit of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily14.html'
source_title="HOMILIES ON JOSHUA 14.2"
