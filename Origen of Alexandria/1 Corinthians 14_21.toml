[[commentary]]
quote='''
He gave the name law to the prophetic word as well; and these words we found in Aquila and the remaining editions, though not indeed in the Seventy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LXV*"
