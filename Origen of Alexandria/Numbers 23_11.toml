[[commentary]]
quote='''
In the previous treatise we attempted, so far as was possible, to explain the first parts of Balaam's prophecy. Now we take up the beginning of the second prophecy, so that, if the Lord deigns to inspire us, we may bring forward for the assembly, to the best of our strength, whatever occurs to us concerning this one as well. For it seemed to me unfitting, although these matters appear difficult, to interrupt the treatment of them, so as not to expound the individual points that we are able to grasp. Therefore King Balak, as if astonished and stricken by those things which he saw being said by Balaam contrary to his hope — for he was hearing blessings instead of curses — no longer bearing it, interrupts his words and says: "What have you done to me? I called you to curse my enemies, and behold, you have blessed them with a blessing." The bitter king did not endure the sweetness of blessings, but seeks curses, demands curses; for he is of the kindred of that one to whom the Lord said: "Cursed are you above all the beasts of the earth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily16.html'
source_title="HOMILIES ON NUMBERS 16.1"
