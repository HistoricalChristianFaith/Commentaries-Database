[[commentary]]
quote='''
After these things he says: "For the expectation of the creature awaits the revelation of the sons of God." Wishing to show how great and of what sort is the glory which is to be revealed in himself, or in those who shall have sweated out to the full the contests of Christ, the Apostle says that the creature also, inasmuch as it is rational, has a certain expectation, and bears a hope of that time in which the glory of the sons of God is to be revealed — that is, when those things shall be revealed which have been prepared for those who shall have deserved to be sons of God, or certainly when, the veil being taken away by which they are covered, they themselves shall have been made manifest as being sons of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
