[[commentary]]
quote='''
Scripture says that in man there are two: "For though our outer man is being destroyed, yet our inner man is renewed day by day"; and also: "I delight in the law of God according to the inner man." The Apostle everywhere presents these two men as distinct. It seems to me that he does not presume to invent this teaching for himself, but rather, releasing what is expressed obscurely in the Scriptures, he sets it forth openly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
