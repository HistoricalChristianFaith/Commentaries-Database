[[commentary]]
quote='''
For, as the Apostle says, we are the "good odor" of Christ; but, he says, "to some an odor from life unto life, but to others an odor from death unto death". So the prophetic word too is a "sweet odor" to those who believe, but to the doubtful and unbelieving, and to those who confess themselves to be the people of Pharaoh, it becomes an abominable odor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily03.html'
source_title="HOMILIES ON EXODUS 3"


[[commentary]]
quote='''
The outer man has nostrils, to smell, and by means of them to distinguish fragrance and foul odors; so too the inner man, in order to distinguish the fragrance of righteousness from the stench of sinfulness, has other nostrils. Concerning the fragrance the Apostle teaches us in the words: "We are the fragrance of Christ to God … among those who are being saved and among those who are perishing: to some an odor from death and unto death, to others an odor from life and unto life."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
