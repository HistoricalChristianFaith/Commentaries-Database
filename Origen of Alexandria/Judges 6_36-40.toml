[[commentary]]
quote='''
"And then," it says, "Gideon said to God: if you save Israel by my hand, as you have spoken, behold, here I am, and I will place a fleece of wool on the threshing-floor; and if indeed dew falls upon the fleece and there is dryness upon all the earth, I shall know that you will save Israel by my hand, as you have spoken. And it was done so." Since there are so many and innumerable signs or prodigies which Gideon could have asked from God to confirm God's promise, why did it seem good to him, after the angelic voice and the heavenly promise, to ask of God this so novel a sign? For he says: "I will place a fleece of wool on the threshing-floor, and if there is dew upon the fleece only and dryness upon all the earth, I shall be confident that you will save Israel by my hand." And when Gideon had asked this sign of God, he obtained its fulfillment. But granted, O Gideon, that you have obtained the efficacy of the sign; why do you also take the "fleece of wool" and "wring it out into a basin"? What moved you to do this? But granted that you obtained the first sign, why did you ask that a second sign also be given, in a reversed and altered order? For perhaps someone of those who listen more attentively to what is read says that these things do not seem to agree with what is written: "you shall not tempt the Lord your God," which the law commanded. But the outcome of the matter teaches that nothing was done against the commandment; for neither would God hear a petition demanding something against the law. But now, when we see that in the first sign "dew fell upon the fleece of wool, but on all the earth there was dryness," and in the second "dew fell upon all the earth, but there was dryness in the fleece" — in which Gideon also received confidence that the Lord would by his hand save Israel — the meaning of this mystery must be considered. Concerning it I recall that one also of our predecessors, in his little books, called the "fleece of wool" the people of Israel, and set down the rest of the earth as the rest of the nations, and said that the "dew" which fell "upon the fleece" is the word of God, which had been granted from heaven to that people alone. For upon Israel alone had come the "dew" of the divine legislation; but "dryness" held all the nations, because no moisture of the divine utterance was poured into them. But the meaning of the second sign, altered to the contrary, in which he says: "that upon all the earth the dew should descend, but upon the fleece dryness should remain" — such a meaning is discovered. Behold this whole people which throughout all the earth has been gathered from the nations, now having in itself the divine dew; behold it watered with the dew of Moses, bedewed with the writings of the prophets; behold it growing green also with the moisture of the Gospel and of the apostles; but that fleece, that is, the Jewish people, suffering the dryness and aridity of the word of God, according to what is written: "the children of Israel shall be a long time without a king, without a prince, without a prophet; there shall be no altar nor victim nor sacrifice." You behold how great a "dryness" abides among them, how great an "aridity" of the divine discourse befalls them. These things, indeed, as it is fitting to confess, have been furnished to us from the labor of our elders; but since we too, having heard a word from the wise, as it is written, ought to commend it and add to it, let us see what we too may build up upon such things. For indeed, when I was often examining the seventy-first psalm within myself, this moved me: that, when it describes the coming of Christ in it, in that very psalm it also asserts that this shall come to pass: "and he shall descend," it says, "like rain upon a fleece, and like raindrops dripping upon the earth." A "fleece" is named here, a "fleece" is written also in the psalms. For "he shall descend like rain," it says, "upon a fleece." He "descended," therefore, "upon" that "fleece" of the people of the circumcision, and "like raindrops dripping upon the earth," that is, upon the rest of the earth, "descended" our Lord Jesus Christ, "dripping" also "upon" us and bringing drops of heavenly dew to us also, the nations, that we too might drink, we who were dried up "over" all the "earth" by continual aridity. This order of the mystery, therefore, the holy Gideon, beholding it with prophetic spirit, not only asked the first sign of God, but also repeated a second in reversed order. For he knew that the divine "dew," which is the coming of the Son of God, was to come not only to the Jews, but afterward also to the nations, since indeed from the "unbelief" of Israel "salvation comes to the nations." And this is why, in place of the aridity of the fleece, the whole earth is watered with the grace of the divine dew. But this too, in this deed of the most faithful man Gideon, I think ought by no means to be passed over, since it can serve us as a pattern of spiritual caution. "He saw an angel," but as a learned man, and having now the example of Joshua his predecessor, he acts more cautiously. For he knew that even the angels of darkness could "transfigure themselves into angels of light," and therefore, with most cautious examination, "I wish," he says, "to test the spirit, whether it be from God," because "the spiritual man examines all things." For thus also his predecessor Joshua son of Nun had done; when he had seen "the prince of the heavenly host," he inquires and considers whether he is "ours or of the adversaries." In this manner also the most holy Gideon considers the angelic vision by the diversity and change of the signs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily08.html'
source_title="HOMILIES ON JUDGES 8"
