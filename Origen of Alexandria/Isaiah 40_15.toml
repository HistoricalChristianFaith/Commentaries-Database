[[commentary]]
quote='''
Indeed it was fitting, since all the nations are reckoned as a drop of a bucket, that He who was made all things for the salvation of all, also should become a drop, that He might set them free. For what was He not made for our salvation? We were destitute, and He emptied Himself, taking the form of a servant. We were a foolish and a senseless people, and He was made the foolishness of preaching, so that God's foolishness might be made wiser than men. We were weak, and the weakness of God was made stronger than men. So, because all the nations are as a drop of a bucket and are counted as the smallest grain of a balance, He too became a drop, so that through Him the odour of stacte might distil from our garments, according to that which is said to the Bride in the forty-fourth Psalm: Myrrh and stacte and cassia perfume thy garments, from the ivory houses: out of which the daughters of kings have gladdened thee in thy glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
