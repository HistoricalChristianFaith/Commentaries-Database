[[commentary]]
quote='''
All their error, therefore, has crept in from the reading of the prophets, which they do not understand — among which is that passage in Isaiah: "my chosen ones will not have children for a curse", and in Deuteronomy among the blessings: "blessed are the children of your womb" — and they suppose that these things are to be in the resurrection, not understanding that spiritual blessings were foretold. For Paul, "the vessel of election", interpreting spiritually all these blessings that are set down in the law, and knowing that they are not carnal, speaks to the Ephesians: "blessed be the God and Father of our Lord Jesus Christ, who has blessed us with every spiritual blessing". And so all these blessings will be spiritual, when, rising from the dead, we attain eternal blessedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily39.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 39"


[[commentary]]
quote='''
But that what we say may be beyond doubt, let us use the voice of the Apostle Paul himself, who, writing to the Ephesians concerning spiritual blessings, pronounces in this manner: "Blessed", he says, "be God, and the Father of our Lord Jesus Christ, who has blessed us with every spiritual blessing in the heavenly places in Christ". Since indeed he knew that some readers, reading about blessings, could slip into this, that they should think them bodily and earthly, he wished to open more evidently to them what is the nature of the divine blessings, or where it is to be sought, and therefore he says: "who has blessed us", he says, "with every spiritual blessing in the heavenly places in Christ". But also this, which he added, "with every blessing", is not idle, but full of apostolic vehemence. For because he knew that there are many things to be fulfilled which are commanded in the law, and that in each single commandment its own contests exist, in which through each one whoever should conquer would deserve a blessing, therefore he said: "who has blessed us with every spiritual blessing", that he might show them both to be many and to be spiritual. But in this saying, in which he says, "with every spiritual blessing", this too can be understood: that, for instance, every just and perfect person may receive the blessings of Leviticus, of which the discourse is now, and may receive also those which are written in the book of Numbers, and also those which are contained in the book of Genesis—the blessings of Noah to Shem and Japheth, and the blessings of Isaac to Jacob, and likewise the blessings of Jacob to Joseph and to Ephraim and Manasseh, and after these to the twelve patriarchs. Since therefore many are the blessings set down in the divine Scriptures, which seem indeed to be directed to each one of the saints—for instance, to Shem or Japheth or Joseph—yet not, as it seems to some, are they so directed to those alone that another cannot share in them, therefore the Apostle named them "spiritual", so that whoever can be made in virtue and spirit, for instance, a Shem or Japheth or Joseph or Isaac or Jacob, just as John also was "in the spirit and power of Elijah", may himself also become a partaker of that blessing whose virtue and spirit he has borne.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily16.html'
source_title="HOMILIES ON LEVITICUS 16"
