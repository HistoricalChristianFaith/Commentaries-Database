[[commentary]]
quote='''
Yet nevertheless I too have frequently "gone out to war against my enemies and seen there" as booty "a woman of comely appearance". For whatever things we find well and reasonably said among our enemies, if we read anything wisely and knowingly said among them, it behooves us to cleanse it and to remove and cut away from the knowledge which is among them all that is dead and empty—for this is what all the hairs of the head and the nails of the woman taken from the spoils of the enemies are—and so at last to make her our wife, when she has now nothing of those things which through unfaithfulness are said to be dead, has nothing dead in her head, nothing in her hands, so that she bears nothing unclean or dead either in her senses or in her acts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
