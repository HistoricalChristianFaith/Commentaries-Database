[[commentary]]
quote='''
Whence it seems to me to be no small grace to discern the mouth which the devil opens. It is not without the grace of the Holy Spirit to distinguish a mouth of this kind and its words; and therefore in the distribution of spiritual graces this too is added, that to some is given "the discernment of spirits". It is therefore a spiritual grace by which the spirit is discerned, as also elsewhere the Apostle says: "test the spirits, whether they be of God".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily03.html'
source_title="HOMILIES ON EXODUS 3"
