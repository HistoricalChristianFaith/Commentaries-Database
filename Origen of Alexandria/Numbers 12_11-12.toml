[[commentary]]
quote='''
"And Aaron looked upon Miriam, and behold, she was leprous. And Aaron said to Moses: I pray, Lord, do not lay upon us the sin, since we did not know that we sinned. Let her not be made like death, and like a miscarriage cast out from the mother's womb, and it has consumed half of her flesh." He wishes in this to show that that people was indeed formed in the womb of its mother the synagogue, yet could not arrive at a perfect and whole birth. For just as a miscarriage is an imperfect and unformed birth, so also that people was for a certain time indeed placed within its mother's womb, that is, within the instruction of the synagogue; but, with sins intervening, it could not be formed to completeness and quickened, and therefore they were cast off like an imperfect and untimely miscarriage, sin, as he says, consuming half of its flesh. Yet there is sometimes even a good miscarriage. And it is called a good miscarriage when it is compared with others, just as Ecclesiastes too says: "and I said: a miscarriage is better than that one." Than which one? "He who," he says, "goes forward in vanity and walks in darkness." He does not then call a miscarriage good absolutely, but better than a life which is led in vanity and in the darkness of ignorance. And with him there is a certain comparison of individuals; for the same Ecclesiastes says also elsewhere that the dead are better than the living. And if again you compare a miscarriage with these, you would say it is better than both. If therefore you consider who are the living and who are the dead, than whom a miscarriage is better in that it has not even tasted the beginnings of the life of this world, you will find what the differences are in this comparison. Consider, then, that he there names as living none other than those of whom it is said in the Psalms: "yet truly every living man is vanity." Every man, therefore, who lives in vanity. For not every life is in vanity, but that life which is according to the flesh and according to the errors and pleasures of the world — this is the life of vanity, and above this is everyone who is dead to this life and who says: "but to me the world is crucified, and I to the world," and of whom it is said: "you are therefore dead with Christ." These, therefore, are better than those living. But above these a miscarriage is said to be, because, although it may seem to have come in the flesh, yet it has taken up no beginnings of the vanity of this life. Yet Ecclesiastes introduces also a certain other, as it seems, even better than this one, of whom he says: "and best above these is he who has not yet been born," that is, he who has not even come to the confinement of the fleshly womb and to the injury of a bodily nativity. But this very thing, too, which Ecclesiastes says: "I praised all the dead more than the living, those who live up to now," how does it not evidently show that he calls those better who are dead to the world, and pronounces those inferior who live to the world? For if you wish to understand it according to the letter, how are the dead to be praised more than the living? For one is usually praised in that which he does by good will and purpose. But this common death comes to no one by will nor by purpose. How, then, will anyone seem worthy of praise in that which he suffers against his purpose? Otherwise Pharaoh king of Egypt, who was submerged in the sea, will be praised above Moses, who escaped alive from the sea. And the Egyptians, who died in the waters, will be praised more than the people of God, who passed over on dry ground in the midst of the sea. Do not, then, understand it thus, but know that you are to be praised as dead when you can say: "I am crucified together with Christ. But now it is no longer I that live, but Christ lives in me." If you have renounced the world, if you have cast off vices, if you are now no longer moved to sin, but are dead to sin, you are better than he who lives to sin, and that death will be praiseworthy in you. For on account of this common death, which comes to each one by the law of nature, no one is praised. These things, although by way of digression, yet it was fitting to call to mind in that place where the word of God says that Miriam, on account of the fault of disparagement and on account of the blow of rebuke, was made a miscarriage, so that we might show that there is both a blameworthy and a praiseworthy miscarriage. Indeed, the Apostle too, knowing that in those ranks of which we spoke above there is a certain praiseworthy rank of miscarriage, says even concerning himself: "and last of all, as by one born out of due time, he was seen also by me," reckoning himself indeed above the living and above the dead, yet after those who have not yet been born. Miriam therefore becomes as a miscarriage; for that people could not be formed to completeness in the law, just as Paul too pronounces, saying: "for the law brought no one to completeness." Indeed the same Apostle, concerning certain ones whom, fallen from the faith and, as it were, turned into a miscarriage, he was restoring again to the institutions of a perfect nativity, says: "my little children, of whom I am again in travail, until Christ be formed in you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily07.html'
source_title="HOMILIES ON NUMBERS 7.3"
