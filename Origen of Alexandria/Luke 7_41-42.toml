[[commentary]]
quote='''
The officer does not have the power to be able to remit to me even a "farthing" and the smallest portion; there is one who can remit to debtors who have nothing wherewith to pay. "There approached him", he says, "one who owed five hundred denarii, and another fifty; and since they had nothing wherewith to pay, he forgave them both". He who forgave was the master; but this one, who is the officer, is not the master, but is appointed by the master to exact the debts. You were not worthy that five hundred or fifty denarii should be forgiven you, nor did you deserve to hear: "your offenses are forgiven you".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily35.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 35"
