[[commentary]]
quote='''
"God did not make death, nor does he delight in the destruction of the living; for he created all things that they might exist, and the generative forces of the world are salutary, and in them there is no poison of destruction, nor is the kingdom of Hades upon the earth." Then, passing over a little of the text, I will say whence death entered: "but by the envy of the devil death entered into the world." If, then, God has made everything that is best concerning us, while we ourselves have created for ourselves wickedness and sins — for this reason here too the beginning of the reading in the prophet says, as it were in a manner of raising a difficulty, to those who have acquired in their soul a bitterness contrary to the sweetness which God fashioned for it: "How were you turned to bitterness, O alien vine?" As if it said: God did not make lameness, but made all men sound of foot; what, then, has become the cause of those who are lamed? And God made all the members sound at the outset, but what has become the cause of some suffering harm? In the same way the soul came to be "according to the image" not of the first man only, but of every man. For the words "let us make man according to our image and likeness" reach unto all men. And just as in Adam there is that which is prior — which most people understand as the "according to the image" of what was taken up together with him, when because of sin he bore "the image of the man of dust" — so in all men the "according to the image of God" is prior to the worse image. We, being sinners, "have borne the image of the man of dust"; let us, repenting, "bear the image of the heavenly man." Yet the creation came to be in the image of the heavenly man. Here, then, the word is at a loss, speaking reprovingly to those who sin: "How were you turned to bitterness, O alien vine? For I planted you a fruit-bearing vine, wholly true." It has been said in what precedes, and taking up a few points again I will persuade you that God planted a good vine, the soul of man, but each one, having turned aside, has become contrary to the will of the one who created him. "But I planted you a fruit-bearing vine, wholly" — not "true" in part, nor partly true and partly false, but — "I planted you a fruit-bearing vine, wholly true; how were you turned?" — When I made you wholly a true vine, how were you turned to bitterness and become an alien vine?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily02.html'
source_title="HOMILIES ON JEREMIAH 2"


[[commentary]]
quote='''
Thus does Paul also boast that the observance of the law and the whole glory of the Jewish system was to him like garbage, so that he might be found in Christ, having not his own justification that was of the law, but the justification from God. In this sense, therefore, Paul did not keep his own vineyard—that is to say, he did not keep the Jews' tradition after he had received the faith of Christ. Perhaps the reason why he did not keep it was that, though it had been planted by God as a true vine, it had turned into the bitterness of a strange vine. "For their vine comes from the vine of Sodom, and from the fields of Gomorrah … their clusters are bitter; their wine is the poison of serpents, and the cruel venom of asps."
'''
source_url='https://books.google.com/books/about/The_Song_of_Songs.html?id=Mjxy0Fl7VMsC'
source_title="COMMENTARY ON THE SONG OF SONGS 2:3"
