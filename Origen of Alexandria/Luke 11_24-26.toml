[[commentary]]
quote='''
For see what is written: "When" it says "an unclean spirit has gone out from a man, it goes through dry places, seeking rest, and finds none. And then it says: I will return into my house, whence I came out. And if, coming, it finds it empty, swept, and adorned, it goes and brings with it seven other spirits worse than itself, and entering into that house it dwells therein. And the last state of that man shall be worse than the first". If we heed these things, how can we give even in a small matter a place to negligence? For an unclean spirit dwelt in us before we believed, before we came to Christ, when still, as I said above, our soul was fornicating away from God and was with its lovers, the demons. But after she said: "I will return to my former husband" and came to Christ, who from the beginning "created her according to his own image", the adulterous spirit necessarily gave place when it saw the lawful husband. We have been received, then, by Christ, and our house has been "cleansed" from former sins and "adorned" with the ornaments of the sacraments of the faithful, which those who have been initiated know. But this house does not at once merit to have Christ as its inhabitant, unless its life and conduct be so holy, so pure and undefiled, that it may merit to be a "temple of God". For it must be no longer a house, but a temple, in which God may dwell. If, then, it neglect the grace received and entangle itself in worldly affairs, straightway that unclean spirit returns and claims for itself the empty house. And, that it may not be able to be expelled again, it brings "with it seven other spirits worse", and "the last state of a man of this kind becomes worse than the first", because it had been more tolerable for a soul that once played the harlot not to have returned to its former husband than, having returned after the confession of the husband, to become an adulteress again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
