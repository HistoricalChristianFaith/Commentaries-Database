[[commentary]]
quote='''
Attempt therefore, you also, O hearer, to have your own well and your own fountain; that you too, when you have taken hold of the book of the scriptures, may begin even from your own understanding to bring forth some meaning, and according to those things which you have learned in the church, attempt you also to drink from the fountain of your own natural ability. There is within you the nature of "living water," there are perennial veins and irrigating streams of rational understanding, if only they be not filled up with earth and rubble. But be diligent to dig your earth and to purge the filth, that is, to remove the sloth of your natural ability and to shake off the torpor of your heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily12.html'
source_title="HOMILIES ON GENESIS 12.5"
