[[commentary]]
quote='''
Thus, therefore, I think it more worthy to interpret the marriages of old men, thus beautifully do I regard the marriages of the patriarchs entered into in their last and now-failing age, thus I reckon their necessary begetting of sons is to be counted. For to such marriages and to offspring of this kind, not the young so much as the old are suited. For the more a man is wearied in the flesh, the more he will be robust in the virtue of the soul and more fit for the embraces of wisdom. So too that just man in the Scriptures, Elkanah, is reported to have had two wives at once, of whom one was called Peninnah, the other Hannah, that is, 'conversion' and 'grace.' And first indeed he is said to have received sons from Peninnah, that is, from conversion, and afterward from Hannah, who is grace. For Scripture figuratively designates the progress of the saints through marriages. Hence you too can, if you wish, become the husband of marriages of this kind, and, for example, if you gladly practice hospitality, you will seem to have taken this as your wife. If to her you add care for the poor, you will seem to have obtained a second wife. And if you join to yourself patience and gentleness and the other virtues, you will seem to have taken as many wives as the virtues in which you rejoice. Hence, then, it is that Scripture records that some of the Patriarchs had several wives at once, others took other wives when the former had died; so that this may be figuratively indicated, that certain men can exercise several virtues at once, while others do not begin those that follow before they have brought the former to perfection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily11.html'
source_title="HOMILIES ON GENESIS 11.2"


[[commentary]]
quote='''
This praiseworthy man of two wives, then—first of all let us see whence he is: "Of Mount Ephraim," it says. Therefore the righteous man is not of the valleys, nor of the plains, nor of any lower places, nor even of the hills. Of the mountain, it says, he is. Of what mountain? Of Mount Ephraim, which is interpreted 'fruitfulness.' Therefore he is of a fruitful mountain, and his place is fruitful. See also the Scripture, what praise it speaks to the mountains: "God," it says, "is the God of the mountains, and not of the valleys." But the name too of this righteous man is Elkanah, which is interpreted 'possession of God.' It is certain that he of whom it was said that he was one man is a possession of God and not a possession of demons. For him whom demons possess is not one, but many: as the demons themselves also answered concerning him whom they possessed, that Legion is his name. But Elkanah is one, who is a possession of God, who also has for his fatherland Mount Ephraim, the fruitful mountain. This man, then, so praiseworthy, had two wives. The name of the one Hannah, and the name of the second Peninnah. But he had sons of the second, Peninnah: the former wife was barren, she who was also the nobler. Similar things you will find also in Genesis. For divine Scripture is akin to itself. You will find there that the first wife of Abraham, Sarah, was the nobler, but the second, the Egyptian Hagar, was ignoble; and that Abraham became a father of the ignoble one before he did of the noble one. But afterward he becomes a father also of the noble spouse. So then now too Elkanah here, who is a possession of God, first becomes a father of the second wife, since indeed God had shut up the womb of Sarah. But after the many childbearings of Peninnah, the womb of Hannah too is opened by prayers and entreaties, and she too becomes the mother of a son, whom she offered to God. What then these things contain in themselves of the sacrament, let us see. Peninnah is interpreted 'conversion,' but Hannah is interpreted 'grace.' Each one of us, therefore, who wishes to be made a possession of God, let him join to himself these two wives, and celebrate his nuptials with them. Let him join to himself first her who is the nobler and more well-born, grace. This is joined to us first through faith, as the Apostle also says: "By grace ye are saved, through faith." But let him be joined secondly to Peninnah, that is, to conversion: because after the grace of belief there comes the amendment of morals and the conversion of life. But although this is the order of the nuptials, another order of procreation comes about. For Peninnah first bears us sons, because we bring forth the first fruits from conversion, and we procreate the first germinations of righteousness from our acts and works. For the first work of righteousness is to be converted from sins: because unless we first are converted and turn aside from evil, we shall be able neither to be made fathers of Hannah, nor to beget sons from grace. Let us see, then, now the differences of each. Peninnah has sons, but such as do not attend upon God. For the sons of conversion cannot be such as to attend and cleave to God. Nor yet are they empty and wholly alien from the things of God. For they receive portions of the divine sacrifices, and eat of the victims of God. Each one of us, therefore, first is converted from sin, and out of conversion begets works of righteousness. But afterward, Hannah being roused up in us through zeal and emulation of the good, pours forth a prayer to God, that she too may beget sons. What sons, then, does Hannah, who is grace, beget? Such as sit beside God. "For grace and truth came by Jesus Christ." This, then, is the son of grace, who is free for God and for the word of God. But do you wish me to show you a more evident form of this kind of understanding even in the Gospels—a form which in the Law indeed is adumbrated through wives, but in the Gospels is already described as present through sisters? See Martha and Mary: of whom Martha indeed is troubled, and is busy about much ministry, and fulfills the works of conversion, and through these begets, as it were, sons of conversion. But Mary, intent at the feet of the Word of God, is said to have chosen the best part, and through these is understood to procreate, as it were, the germinations of grace. So then now too Hannah begets a son. What son? Samuel, it says, who attends upon God, of whom it is said in the Psalms: "Moses and Aaron among his priests, and Samuel among them that call upon his name." But Jeremiah too says: "If Moses and Samuel should stand before me, I will not let them go." If, then, so great and such a one is the son of grace, let us too hasten indeed to the nuptials of Hannah, but let us act patiently, so that first sons may be born to us from conversion, so that first we may please in good works, and then afterward may procreate a son also from grace and the gift of the Spirit. And what kind of son? Such as is this son, Samuel, it says, who is interpreted 'There God himself.' You see what kind of sons grace begets? For thus it is written of those who have obtained the grace of the Spirit, the Apostle saying: "But if a prophet enter, or an unlearned, or an ignorant man, into your assembly, he is discerned by all, and the hidden things also of his heart are made manifest: and then, falling on his face, he will worship God, saying that God is indeed in you." This, then, is what Samuel is interpreted, 'There God himself.' For where the grace of the Spirit is, there God himself is said to be. But this kind of son cannot be born to us unless first the sons of Peninnah go before; for unless the works of conversion go before, we do not merit the grace of the Spirit, nor can we from it beget the gift of the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.5"
