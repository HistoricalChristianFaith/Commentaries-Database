[[commentary]]
quote='''
But come, let us look also according to the literal sense. What is now to be said touches each single one of us. Each of us, having received the word of the gospel, received Jesus Christ as a foundation, so that in all he does and says and thinks he might build upon this foundation. If, then, we think and consider good things, we build gold; if, speaking purely, we speak every word that is spoken in a holy manner, we build as silver; if every deed we do is good, we build as precious stone — but the value of the stones and their quality God judges. If, however, I sin after the foundation, the great of my sins will be wood for me, the lesser hay, and those still lesser straw. And I inquire whether perhaps the roots and the conceptions, whenever they are erroneous, are wood; for the conceptions are the fount of evils; and the words are hay, and the deed straw; for the worth of the deed is lesser than that of the reasoning; but he who plants and he who waters are one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XV"

[[commentary]]
quote='''
We can still add also this, that the nature of sin is like the material which is consumed by fire, which the Apostle Paul says is built up by sinners, who "upon the foundation" of Christ "build wood, hay, stubble." In which it is manifestly shown that there are certain sins so slight that they are compared to "stubble," over which, when fire is brought, it cannot tarry long; but others are like "hay," which the fire likewise consumes not with difficulty, yet tarries somewhat longer than upon "stubble"; but others there are which are compared to "wood," in which, according to the quality of the crimes, the fire finds lasting and great fuel. Thus, then, each sin, according to its quality or quantity, pays its just penalties. Nevertheless, what need is there for the faithful and for those who have known God to think about the qualities of penalties? What need to place "wood," what "hay," what even "stubble" itself "upon the foundation" of Christ? Why do we not rather place "gold" or "silver" or "precious stones" upon the precious "foundation," where, when the fire comes, it may find nothing that it may consume? For if it comes to "stubble," from "stubble" it will render embers and ashes; but if it comes to "gold," it will render "gold" purer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily14.html'
source_title="HOMILIES ON LEVITICUS 14"

[[commentary]]
quote='''
But that this house can sometimes be sold, that is, that a building of this kind may fall into sin, hear how the Apostle Paul speaks concerning such: "as a wise architect I laid the foundation", he says, "another builds upon it, but let each one see how he builds upon it. For no one can lay another foundation besides that which is laid, which is Christ Jesus. But if anyone builds upon this foundation gold, silver, precious stones, wood, hay, stubble". You see, then, that there can be "built upon the foundation of Christ wood, hay, stubble", that is, works of sin; and whoever "builds" these has without doubt "sold his house" to the worst buyer, the devil, from whom each of those who sin obtains the price of sin, the satisfaction of his desire. If perchance anyone should incur this—which God forbid—let him quickly redeem it, quickly repair it, while there is time for repairing, while there is place for repentance, praying in common that we be not defrauded of the habitation of the eternal house, but be held worthy "to be received into the eternal tabernacles", through Christ our Lord, "to whom be glory and dominion unto the ages of ages. Amen!".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily15.html'
source_title="HOMILIES ON LEVITICUS 15"
