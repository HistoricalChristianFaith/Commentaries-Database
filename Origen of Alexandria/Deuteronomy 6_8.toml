[[commentary]]
quote='''
It must be understood in these matters that it is written in the law concerning the divine words, saying: "bind them upon your hand, and they shall be moving before your eyes". Those, therefore, who do all things in order to be seen by men, the scribes and Pharisees, writing certain sayings of the law on two cut pieces of parchment, bind them, and one indeed they carry on their houses, as it were placing upon their heads as a crown that which is written according to the forehead. But the other upon the arm of their hand; and they call them "phylacteries". Similarly, finding something also about the fringe in Deuteronomy, they suppose that they keep the law by making some fringe on some part of the garments which they wear.

But the disciples of Jesus do all their works in order to be seen by God alone; for they bind the law of God upon their hand, spiritually upon their good work, and by meditation on the divine teachings, ever moving them, they make the divine precepts moving before the eyes of their souls, and the fringe full of the virtue of Jesus — in this, that they imitate the Master.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252023.html'
source_title="COMMENTARY ON MATTHEW 11"
