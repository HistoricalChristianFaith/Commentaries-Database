[[commentary]]
quote='''
But do you wish to hear the terrible voice of an indignant God? Hear what he says through the prophet: when he had enumerated the many wicked things which the people had committed, he adds also these: "and for this reason" he says "I will not visit upon your daughters when they fornicate, nor upon your daughters-in-law when they commit adultery". This is the terrible thing, this the extremity: when we are no longer rebuked for our sins, when we are no longer corrected when we transgress. For then, when we have exceeded the measure of sinning, the "jealous God" turns his jealousy away from us, as he said above: "for my jealousy shall be taken away from you, and I will be angry over you no more". So much concerning that which was said: "a jealous God".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
