[[commentary]]
quote='''
"Because I rejoiced in thy salvation." If I have rejoiced in the salvation of God, then my mouth was enlarged over my enemies. "There is none holy as the Lord." If it were written, There is none holy but the Lord, it would follow that we all renounce ourselves from this hope of being made holy: but now she uses a necessary distinction and says: "There is none holy as the Lord"; that is, although there be many holy, yet none is so holy as the Lord. Many, therefore, can become holy, as the commandment of God also says: "Be ye holy, because I too am holy." But however much anyone advances in holiness, however much of purity and sincerity he acquires, a man cannot be so holy as the Lord; because he is the giver of holiness, this one the receiver; he is the fountain of holiness, but this one the drinker of the holy fountain; he is the light of holiness, this one the beholder of the holy light; and therefore "there is none holy as the Lord, and there is none beside thee." What it is that she says, "there is none beside thee," I do not plainly grasp. If she had said, There is no God beside thee, or, There is no creator beside thee, or had added some such thing, nothing would have seemed to need inquiry; but now, because she says, "there is none beside thee," it seems to me that in this place there is designated this: that none of the things that are has this very thing, that they are, naturally. Thou alone art he to whom what thou art was given by no one. For we all, that is, the whole creation, were not before we were created, and therefore what we are is the will of the Creator. And because at one time we were not, it is not accurate if it be said of us that we are, so far as regards that time when we were not. But God alone is he who has always had what he is, and did not receive that he should be a beginning. In short, when Moses wished to learn from God what his name was, God, teaching him, said: "I am he who is, and this is my name." If, then, anything else among the creatures could be called by this name or with this signification, never would the Lord say that this was his name. For he knew that he alone was, but that the creatures had received from him that they should be. For a shadow, in comparison with the body, is not; and smoke, in comparison with fire, is not. So then also the things that are in the heavens and the things that are on earth, visible and invisible, so far as regards the nature of God, are not; so far as regards the will of the Creator, they are that which he who made them willed them to be. Therefore it is said, that "beside thee, there is none."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.11"


[[commentary]]
quote='''
"There is none mighty as God, our God." This is similar to that which was said above, that there is none holy as the Lord. For just as there she did not say that there is not anyone holy, but that there is none holy as the Lord, so that she might show that although there are holy ones, yet none is so holy as the Lord is: so also in this place, although there be someone mighty, "there is none, she says, mighty as our God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.12"
