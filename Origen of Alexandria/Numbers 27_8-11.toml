[[commentary]]
quote='''
After this the law of God concerning succession is set down, that first the son, second in place the daughter, third the brother, fourth the father's brother should succeed; but the fifth degree does not designate any definite person, but whoever is nearer out of the whole family, that he should succeed. In these things the sense of the history is so whole and perfect that it seems to require nothing from outside. Yet if anyone is well instructed in the spiritual laws and irradiated with the fuller light of knowledge, he can understand these various degrees of successions, and how the first degree of attaining the heavenly inheritance is by the merit of teaching and knowledge, which is the male son; the second by the prerogative of works, which is the daughter; the third of some compassion and imitation, on account of which he is named a brother. For there are some who indeed do nothing of their own accord and by their own understanding, yet placed among the brothers by imitation of the rest they seem to do the same things which those also do who are moved by their own understanding. To these also, therefore, is given a third degree of inheritance under the title of the fraternal name. But the fourth, whom he names the father's brother, can perhaps be understood as that order of men who, having heard things from the fathers and having received the narration of the ancients, endeavor to fulfill them, and, moved not so much by their own perceptions nor stirred by the admonitions of present teaching as instructed by the tradition or the custom alone of the ancients, nevertheless do something good. The last degree, then, is written as that man who by any means whatever has been nearest to these; as if he should say, whether by occasion or by the truth of teaching, if anyone has done something good, the reward of the good work will not perish, but by the Lord's bounty he will receive a place of inheritance. These things, indeed, may perhaps seem to have been boldly presumed by us and brought forward into the open; yet it will not be absurd if, setting forth spiritual things to the spiritual, we make them zealous and desirous of a more secret understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily22.html'
source_title="HOMILIES ON NUMBERS 22.2"
