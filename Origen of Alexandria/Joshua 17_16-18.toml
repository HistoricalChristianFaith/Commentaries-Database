[[commentary]]
quote='''
After these things the sons of Ephraim add further and say: "the mountain does not suffice us; and the choice horse and iron belong to the Canaanite who dwells in me." You will never find an Israelite who has a horse, but "the Canaanite has" that "horse, which is deceptive for salvation." The "Canaanite has" also warlike "iron." But what did Jesus answer them? "If you are a numerous people and have strength, you shall not have one portion, because there is a forest for you, and you shall clean it out." You see what is said to us through the spiritual understanding, that we should "clean out the wood" which is in us, and, cutting down the useless and unfruitful trees out of our very selves, make there new-broken fields, which we may always renew and from which we may "take fruit thirtyfold and sixtyfold and a hundredfold." Or does not the word of the Gospel also announce the same thing to us, saying: "behold, now the axe is laid to the root of the trees; every tree, therefore, which does not bear fruit shall be cut down and cast into the fire"? These things concerning the cutting down of unfruitful trees Jesus the son of Nave commanded our predecessors; these commandments the Lord Jesus sets down for us in the Gospels; and how is it not true that the shadow went before and the truth followed after?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily22.html'
source_title="HOMILIES ON JOSHUA 22.5"
