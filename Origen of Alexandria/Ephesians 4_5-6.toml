[[commentary]]
quote='''
On account of those who confound the Father and the Son, the word "Lord" is assigned to the Son, and "one God" to the Father; and against those from Valentinus who grant two baptisms, one must make use of the saying "one baptism".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Ephesians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON EPHESIANS FRAGMENT XVII"
