[[commentary]]
quote='''
There is that first one, by which we are baptized "unto the remission of sins". The second remission is in the suffering of martyrdom. The third is that which is given through almsgiving; for the Savior says: "but nevertheless give the things that you have, and behold, all things are clean to you". The fourth remission of sins comes to us through this, that we too remit sins to our brothers; for thus the Lord and Savior himself says that: "if you remit to your brothers from the heart their sins, your Father too will remit to you your sins. But if you do not remit to your brothers from the heart, neither will your Father remit to you", and just as he taught us to say in the prayer: "remit to us our debts, as we too remit to our debtors". The fifth remission of sins is when "someone turns a sinner from the error of his way". For thus the divine Scripture says that "he who causes a sinner to be turned from the error of his way saves a soul from death, and covers a multitude of sins". A sixth remission too comes about through the abundance of love, as the Lord himself also says: "Amen, I say to you, her many sins are remitted to her, because she loved much", and the Apostle says: "because love covers a multitude of sins". There is still a seventh also, though hard and laborious — the remission of sins through penance, when the sinner washes "his bed with tears" and his "tears" become to him "bread day and night", when he is not ashamed to make known his sin to the priest of the Lord and to seek the remedy, according to him who says: "I said: I will declare against myself my injustice to the Lord, and you remitted the impiety of my heart".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily02.html'
source_title="HOMILIES ON LEVITICUS 2"
