[[commentary]]
quote='''
This reasoning, then, he says, must be received not only concerning Isaac, but concerning Jacob as well. For Rebecca too, he says, did not bring forth her offspring according to the order of fleshly nativity. For when she had conceived twins from a single act of intercourse with Isaac, before the birth had yet taken place, and before any deeds of the boys, good or evil, had been done among men, the divine election is held toward Jacob, and it is said, "that the elder shall serve the younger," and, "Jacob I loved, but Esau I hated."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
