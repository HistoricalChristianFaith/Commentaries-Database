[[commentary]]
quote='''
Next, after the discourse concerning the two nations — the former, to which the threat is given, and the second, to which the promise is given — he says (he said, that is, to the former ones): "And now I have spoken to the men of Judah and to those who dwell in Jerusalem; thus says the Lord: Behold, I am molding evils against you." Because these things which I am molding against you are in my hand, they can fall apart. Make these things fall apart from my hand, so that the evils which I am molding against you I may change and make into good things. You would not find, "Behold, I am molding good things against you," and the things said correspondingly after them, so that after this he might make manifest that the good things which he molds he releases from his hands, that he may make them evil. But he molds evils according to the example that has been mentioned, and, molding evils, he orders them wisely (apart from the interpretation that has been given for the "it fell from my hands"), so that, if it should fall, even the end of the evils being molded may come to be of a kind I do not know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily18.html'
source_title="HOMILIES ON JEREMIAH 18"
