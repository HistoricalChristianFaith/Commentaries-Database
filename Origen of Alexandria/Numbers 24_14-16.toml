[[commentary]]
quote='''
But the prophecy also, nonetheless, which he joins to it in what follows concerning Christ, saying: "A star shall arise out of Jacob, and a man shall rise up out of Israel, and he shall lay waste the princes of Moab," would seem fittingly placed if it had been written: "Come, and I prophesy to you." But now what shall we say to this, that it is written: "Come, I give you counsel, what this people shall do to your people"? Let us therefore inquire how it ought to be understood, this that is written: "I give you counsel," concerning which, often inquiring within myself, I could find no outcome for the meaning, if we suppose that this which he says, "I give you counsel," is said in the common and ordinary way. But I saw that this rather is fitting, that what he says, "I give you counsel," is to be understood as though he had said: The divine counsel, which is to be fulfilled in the last days, now revealed to me I open and make manifest to you, that you may know what this people shall do to your people. And in this way it seemed to me able to stand, this that he says: "I give you counsel, what this people is about to do to your people," that is: I announce and make manifest to you the counsel of God. Indeed, as I inquired whether perhaps somewhere in the divine Scriptures some similar saying under this expression might occur, it seemed that this also was similarly to be noted, which the Apostle says: "For who has known the mind of the Lord, or who has been his counselor?" For here "who" is taken not for "no one," but for "rare" or "exceptional." For how did his Only-begotten not know the mind of God, who says: "No one knows the Father except the Son, and he to whom the Son shall will to reveal him"? What else, then, is it to know the Father, except to know both his counsel and his mind? But also the Holy Spirit, who searches even the deep things of God, what does he do but recognize his mind? Therefore both the Son and the Holy Spirit recognize the mind of the Lord, and those to whom the Son shall will to reveal it. But if the Son recognizes the mind of God, then he is also his counselor. But "counselor" is not to be taken as though the Son or the Holy Spirit gives counsel to him as to one ignorant of what he is doing; but in that the Son and the Holy Spirit are partakers of, and knowing in, his counsel and will. In a similar way, then, Balaam too, because he was making Balak a partaker of, and acquainted with, the counsel which God had revealed to him, says: "Come, I give you counsel," as one who truly sees and has truly heard the words of God, as he says in what follows: "Balaam, the son of Beor, said, the man who truly sees, hearing the words of God, knowing the knowledge of the Most High, and seeing the vision of God in sleep, his eyes uncovered." Of all these things we have already spoken above, since in the introduction of the third prophecy the same things were written. This alone in the present passage seems added, that he says: "knowing the knowledge of the Most High." For this was not said of Balaam in the earlier passages; which indeed I have found not easily written of any one of all the holy prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily18.html'
source_title="HOMILIES ON NUMBERS 18.2"
