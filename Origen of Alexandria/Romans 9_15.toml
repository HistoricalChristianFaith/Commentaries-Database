[[commentary]]
quote='''
This objector, then, uses also the words of Moses, in which the Lord says to him: "I will have mercy on whom I have mercy, and I will show compassion to whom I will show compassion." But if this is so, he says, then salvation is not of him that wills nor of him that runs, but of him on whom God has mercy. For to Pharaoh also, he says, it is said, "For this very purpose have I raised thee up, that I might show in thee my power, and that my name might be proclaimed in all the earth"; so that from this it may seem to be shown that, if Pharaoh was chosen for this, that through him the power of God might be declared to men, it was not in his own power that he perished. And after everything he adds: "Therefore he has mercy on whom he wills, and whom he wills he hardens." This, he says, is what you who contradict assert: that God complains and accuses men without cause. For if he himself chooses whom he wills, and casts off whom he wills, who resists the will of him through whom are all things? Without doubt this contradiction is aiming at this: that there is no freedom of choice in man, and that no one has … In that little book where we discussed the freedom of the will, each several point has been examined according to our ability, things which suffice more than enough for instruction. Nevertheless, we will even now briefly remind the reader of some of the things said there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
