[[commentary]]
quote='''
But I say: did the Lord use iniquity in order to snatch the nations from the power of the adversaries and to recall them to his own faith and dominion? By no means. For Israel was once "the portion of the Lord," but they made Israel to sin against his God, and on account of their sins God said to them: "behold, you have been sold off by your sins, and on account of your sins you have been scattered under the whole heaven." But again he says to them: "if your dispersion be from the end of heaven unto the end thereof, from there I will gather you, says the Lord." Because, therefore, the first "princes of this world" had invaded "the portion of the Lord," the "good shepherd" had need, leaving the ninety and nine on high, to descend to the earth and to seek the one sheep which had perished, and, having found it and carried it back on his shoulders, to recall it to the heavenly sheepfold of perfection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily09.html'
source_title="HOMILIES ON GENESIS 9.3"
