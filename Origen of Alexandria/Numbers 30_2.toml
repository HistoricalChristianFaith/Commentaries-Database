[[commentary]]
quote='''
After these things the law of vows is set down, and Moses uses a new beginning in this legislation; for he says: "A man, a man, whoever shall vow a vow to the Lord." What is the reason for this repeating of the name? As though it did not suffice to have said: "A man who shall vow a vow to the Lord." What is it therefore that he says, "a man, a man," and what this doubled naming of "man" means, does not seem to me to be passed over in silence. The Apostle teaches that there is one inner man and another outer, and that the former is he who is renewed from day to day according to the image of him who created him, but that the latter is the visible one, who is corrupted. When therefore one comes to that advancement, that the law of God may be received and vows offered to the Lord — and no one can offer vows to the Lord except him who has something within himself and in his own substance which he may offer to God — this outer man does not suffice to receive the law of God nor to offer vows alone, for he cannot have anything worthy of God, but it is that inner man who rather has in himself what he may offer to God; for in him is the dwelling of the virtues, in him all understanding of knowledge, in him is the renewal of the divine image. And when he has recovered his form, by which he was made from the beginning by God, and by the restoration of the virtues has received back the beauty of his former shape, then he can now offer vows to God, and then he will now be called not "man" only, but "man, man." For he who does not cultivate the inner man, who takes no care of him, who does not equip him with virtues, does not adorn him with morals, does not exercise him in divine instructions, does not seek the wisdom of God, does not expend labor on the knowledge of the scriptures — this one cannot be called "man, man," but only "man," and an animal man, because that inner one, to whom the name "man" more truly and more nobly belongs, is lulled to sleep in him by carnal vices and overwhelmed by the cares and anxieties of this world, so that not even the naming of his name can be had. Wherefore each of us must strive earnestly that, if perhaps he sees the inner man in himself lying oppressed with the filth of sins and the rubble of vices, he may more quickly remove from him all uncleannesses, more quickly rescue him from every defilement of flesh and blood, be converted at last to repentance, recall to himself the memory of God, recall the hope of salvation. For these things are not to be sought from somewhere outside, but within us is the occasion of salvation, as the Lord also said: "For behold, the kingdom of God is within you." For within us is the faculty of conversion; for when, being converted, you shall have groaned, you shall be saved, and then you will be able worthily to render your vows to the Most High and to be called "man, man." Now a vow is when we offer something of our own to God. God therefore wishes first to receive something from us, and so himself to bestow upon us, that he may be seen to bestow his gifts and rewards upon the deserving and not upon the undeserving. But what is it that God wishes to receive from us? Hear the sentence of Scripture: "And now, Israel, what does the Lord your God ask of you, but that you fear the Lord your God, and walk in all his ways, and love him with your whole heart and with your whole soul and with all your strength?" These therefore are the things which God asks of us. And if we do not first offer them, we shall receive nothing from him. We read also in another place: "Give glory to God," and: "Give magnificence to God." If you give glory, you will receive glory; for thus God himself says: "Those who glorify me I will glorify." But I say that, if we also offer him our righteousness, we shall receive from him the righteousness of God; and if we offer him our chastity, that is, of the body, we shall receive from him the chastity of the spirit; and if we offer him our understanding, we shall receive from him his own understanding, as the Apostle also said: "But we have the mind of Christ." And when we have offered to God the things which are in us, and he has bestowed upon us the things which are his, then truly we shall now be called not "man" only, but "man, man"; for each man is fittingly adorned with the perfection of his name. These therefore are the vows which he ought to pay who is called "man, man." I know that diverse vows are related in the scriptures. Hannah indeed vowed to God the fruit of her womb and consecrated Samuel in the temple. Another vowed to God whatever should meet him returning after victory, and, his daughter meeting him, paid his vows with tears. Others offer to God calves or rams or houses or other vows of this kind lacking reason. But he who is called a Nazirite devoted himself to God; for this is the vow of the Nazirite, which is above every vow. For to offer a son or a daughter or cattle or an estate — all this is outside of us; but to offer oneself to God, and to please him not by another's labor but by one's own, this is more perfect and more excellent than all vows; and he who does this is an imitator of Christ. For he gave to man the earth, the sea, and all that is in them; he gave them for his service, and he granted heaven, the sun also and the moon and the stars, to the ministry of men; rains, winds, and all whatsoever is in the world, he bestowed upon men. But after all these things he gave himself; for thus God loved the world, that he gave his only-begotten Son for the life of this world. What great thing therefore will man do if he offers himself to God, to whom God himself first offered himself? If therefore you take up your cross and follow Christ, if you say: "But I live, now not I, but Christ lives in me"; if our soul desires and thirsts to return and to be with Christ, as the Apostle also said, and is not delighted with the allurements of the present age; and if he spiritually fulfills all the law which was given concerning the Nazirites — then he has offered himself, that is, his soul, to God. He who lives in chastity has vowed his body to God, according to him who said: "But the virgin considers how she may be holy in body and spirit." For this very thing which he said, "holy," looks to this; for those are called holy who have vowed themselves to God. Whence also a ram, for example, if it is vowed to God, is called holy, and it is not lawful to shear it for common uses. But a calf also, if it has been devoted to God, is nonetheless called holy, and it is not lawful to yoke it for common work. From these things therefore let us gather what it is for a man to vow himself to God. If you vow yourself to God, the calf is to be imitated by you, which is not permitted to serve human works — to do nothing which pertains to men and to the present life. But whatever pertains to the soul and to the observance of divine worship, this is both to be done and to be pondered by you.
'''
