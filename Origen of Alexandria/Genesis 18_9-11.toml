[[commentary]]
quote='''
What then does the Lord say to Abraham? "Where is," he says, "Sarah your wife? And he: behold, he says, in the tent. And the Lord said: coming I will come to you in season according to this time, and Sarah your wife shall have a son. But Sarah was listening, standing behind the door of the tent, behind Abraham." Let women learn by the examples of the patriarchs, let women, I say, learn to follow their husbands. For it is not without cause written that "Sarah was standing behind Abraham," but so that it might be shown that if the husband goes before to the Lord, the wife ought to follow. What I say, that the wife ought to follow, is in this: if she sees her husband standing before God. Otherwise let us ascend to a higher grade of understanding and let us say that the husband in us is the rational sense, and the wife, who is joined to it as to a husband, is our flesh. Let the flesh therefore always follow the rational sense, nor let it ever come to such sloth that the rational sense, brought into subjection, obeys the flesh flowing loose in luxury and pleasures. "Sarah" therefore "was standing behind Abraham." But we can also perceive something mystical in this passage, if we see how in Exodus "God went before in a pillar of fire by night and in a pillar of cloud by day," and the synagogue of the Lord followed after him. Thus therefore I understand that Sarah too followed, or stood, "behind Abraham." What is said after these things? "And they were both," it says, "elders"—that is, old—"and advanced in their days." As far as pertains to the age of the body, many before them had led a life of more numerous years, yet none was called an elder. Whence it seems that this name is ascribed to the saints not by reason of longevity, but of maturity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.4"
