[[commentary]]
quote='''
Because, therefore, God is merciful and "wishes all men to be saved", for this reason he says: "I will visit their misdeeds with a rod of iron and their sins with scourges. But my mercy I will not take away from them". The Lord, then, visits and requires the souls which this most evil father has begotten by persuasion to sin, and says to each one of them: "hear, daughter, and see, and incline your ear, and forget your people and the house of your father".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
