[[commentary]]
quote='''
But let us also consider this — where the prophecy is said to "reside" and where its place is described. "Under a palm tree," it says, "between the middle of Ramah and the middle of Bethel." Prophecy has its seat "under a palm tree," because "the righteous man," says David, "will flourish like a palm tree" — through this, that prophecy leads the one instructed by its teachings to the "palm of the heavenly calling of God, in Christ Jesus our Lord." And it is said to sit "between the middle of Ramah and the middle of Bethel." "Ramah" is interpreted as "heights". "Bethel," however, as "the house of God". See in what places "prophecy" is said to "reside" — between the heights and the house of God. For nothing lowly, nothing cast down, nothing base can be found near the seat of prophecy; just as Solomon likewise, describing the seat of wisdom, says of it that she either "stands at the gates of the cities" or dwells "on the ramparts of the walls" or "acts freely" in the high towers. In this way, then, prophecy, which is now described in Deborah, is said to dwell between the house of God and the heights. For it does not teach us "to seek the things that are upon the earth, but the things that are in the heavens and in the heights, where Christ is, seated at the right hand of God": thither prophecy exhorts us to ascend, thither it strives to set its disciples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily05.html'
source_title="HOMILIES ON JUDGES 5"
