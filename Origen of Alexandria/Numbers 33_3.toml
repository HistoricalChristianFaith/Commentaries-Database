[[commentary]]
quote='''
Yet let us first see when the children of Israel set out from Rameses. "In the first month," it says, "on the fifteenth day of the month." By the Lord's command they had kept the Passover on the fourteenth day of the month in Egypt, slaughtering the lamb on the day before they set out, and in a certain sense they kept the beginning of the festival while still situated in Egypt. On the following day, then, which is the first day of unleavened bread, on the fifteenth day of the first month, they set out from Rameses and come to Succoth, that they might there keep the day of the festival of unleavened bread. "Who is wise, and shall understand these things? Prudent, and shall know them?" — nay rather, who is there who knows even these things in part, as the Apostle says: "We know in part, and we prophesy in part"? Who understands how we too keep festal days in part, so that "no one may judge us in respect of a portion of a feast day, or of a new moon, or of a sabbath"? For every feast day that is kept on earth by men is kept in part, not in whole nor with the full and perfect title of festivity; but when you have gone out of that Egypt, then there will be for you a perfect festivity, then you will attend to the unleavened bread of sincerity and truth unto perfection, then you will keep the day of Pentecost in the wilderness, and then perhaps for the first time you will receive the heavenly food of manna, and you will keep each of the several festivities of which we have already spoken above, as far as we were able. Yet know that after that Passover which was made in Egypt, we find the Passover observed once in the desert, when the law was given, and another, as we have noted, in Numbers, and after these it is nowhere kept, save in the land of promise. Therefore, on the fifteenth day of the first month, on the day following the Passover, which is the first day of unleavened bread, the children of Israel set out from Rameses "with a lofty hand," it says, "in the sight of all the Egyptians." What is the lofty hand? For elsewhere too it says: "Let your hand be exalted." Where there is no human work nor earthly, but it is divine, there it is called a lofty hand. For it has already often been said that by "hand" a work is understood. "With a lofty hand," therefore, "in the sight of all the Egyptians" they set out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.8"
