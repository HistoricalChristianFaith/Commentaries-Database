[[commentary]]
quote='''
Jesus himself, according to the dispensation of the flesh which he had put on, says: "he gave me all power, as in heaven so on earth"—not that he did not have "power on earth", he who had it "in heaven", and that he received something of the world, he who "had come into his own", but that God might so be believed "on earth" as he was believed "in heaven"; therefore the man Christ received "power" which before he did not have, and up to the present he does not yet have "power" over all "on earth". For over those who sin he does not yet reign; but when the "power" over these too has been given to him, when "all things have been made subject" to him, then the "power" will be complete and he will go about "subjecting all things to himself". But some do not yet wish to be "made subject" to him, but as yet are "subjected" to his enemies. Let us, moreover, say: "shall not my soul be made subject to God? for from him is my salvation".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily01.html'
source_title="HOMILIES ON ISAIAH 1"
