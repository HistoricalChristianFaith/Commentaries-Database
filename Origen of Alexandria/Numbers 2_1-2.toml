[[commentary]]
quote='''
The first reading of Numbers taught that the army of God, which had gone out from the land of Egypt and made its journey through the desert, was visited—that is, numbered—by Moses and Aaron, and, having been set apart tribe by tribe, was reckoned under a fixed number. Expounding this as it were together with the whole content of the little book, we said that a pattern was there prescribed, showing how the people of God, going out from the Egypt of this world and hastening to the land of promise—that is, either to the place of the virtues or to the glory and inheritance of the kingdom of heaven—are led forward by certain orders and degrees of merit. And through these things we showed that the magnificence of the goods to come is foreshadowed in the images of the Law. But now the beginning of this reading, which has been recited today, instructs us how the order of the camp is to be composed by those who are made over to God and do not entangle themselves in the affairs of the world. And it says: "And the Lord spoke to Moses and Aaron, saying: Let the children of Israel pitch their camp each man according to his own order and according to his own signs, according to the houses of their families; over against, round about the tabernacle of testimony let the children of Israel encamp." Moses says: "Let each man march in the camp according to his own order and according to his own signs and according to the houses of their families," and Paul says: "Let all things be done honorably and according to order." And does it not seem to you that there is one Spirit of God, who speaks both in Moses and in Paul? Moses commands that in the camp one march according to order; Paul enjoins that in the Church all things be done according to order. And Moses indeed, who ministered to the Law, orders that order be kept in the camp; but Paul, as a minister of the Gospel, wishes the Christian to be orderly not only in his actions but in his very dress, and therefore he says: "the women likewise in orderly dress." Hence I judge that they wish order to be kept not only in duties and dress, but they give us to understand that there is a certain order even in the soul, concerning which it may be said that each one ought to march according to his own order. And this order is indeed indicated chiefly from the fruits of works, yet nonetheless also from the magnificence of the perceptions. For it often happens that one who bears a lowly and abject mind and who relishes earthly things occupies the lofty grade of the priesthood or the chair of a teacher, while he who is spiritual and so free from earthly conduct that he can examine all things and himself be judged by no one, holds the rank of a lower ministry or is even left among the common multitude. But this is to despise the ordinances both of the Law and of the Gospel, and to do nothing according to order. And moreover, if each one of us is anxious about food and drink and bestows all his care upon worldly matters, but out of a whole day assigns even one or two hours to God, and comes to church for prayer, or hears the word of God in passing, yet spends his chief care upon anxiety for the world and the belly—such a one does not fulfill the commandment which says that a man should march according to his own order, or which says that all things should be done according to order. For it is an order established by Christ to seek first the kingdom of God and his righteousness, believing that these other things will be added to us by God in the second place. Let a man, therefore, march according to his own order. Do you suppose that those who exercise the priesthood and glory in the priestly order march according to their order and do all things that are worthy of that order? And likewise, too, do you suppose the deacons march according to the order of their ministry? And whence is it that we often hear men blaspheme and say: "See what sort of bishop, or what sort of presbyter, or what sort of deacon!"? Are not these things said where either a priest or a minister of God has been seen in something to go against his own order and to do something contrary to the priestly or Levitical order? But what shall I say also of virgins, or of the continent, or of all who are seen in the profession of religion? Will not Moses, if they have done anything immodest or wanton, anything insolent, at once rebuke them and say: "Let a man march according to his own order"? Let each one, therefore, acknowledge his own order and understand what is worthy of that order which he has undertaken, and so weigh his actions, and so also moderate his speech, his very gait, and his dress, that they may accord with the profession of his order, lest he hear it said to him by God: "Because of you my name is blasphemed among the nations."
'''
