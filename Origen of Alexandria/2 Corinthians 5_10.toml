[[commentary]]
quote='''
Why do we not believe that we shall all stand "before the tribunal of Christ, that each one may carry back the proper things of the body, according as he has done, whether good or evil"? If we believed these things wholly, there would be for us, according to that which is written, "the redemption of a man's soul his riches". But whence can we either feel or believe or understand these things, when we do not even assemble to hear these very things? For which of you, when the Scriptures are read out, lends an ear? God threatens through the prophet, and indeed in great wrath: "I will send a famine upon the earth, not a famine of bread nor a thirst of water, but a famine of hearing the word of God". But now God has not sent "famine" upon his church nor "thirst for hearing the word of God". For we have "the living bread which came down from heaven", we have "the living water leaping up into eternal life". Why do we in the time of fruitfulness kill ourselves with hunger and thirst? It belongs to a slothful and idle soul to suffer want in the abundance of all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily09.html'
source_title="HOMILIES ON LEVITICUS 9"
