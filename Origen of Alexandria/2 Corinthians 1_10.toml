[[commentary]]
quote='''
There are therefore those "sins" which are said to be "unto death"; whence it is also consequent that, as often as anyone commits such a sin, so often does he die. For that there are many deaths of sin the Apostle Paul also signifies, when he says: "who has snatched us from so many deaths and will snatch us; in whom we hope that he will still snatch us". What deaths then does he here commemorate as many, except those of sins? For if he were not saying this concerning the deaths of sins, Paul would seem, according to his own opinion, to be going to remain immortal from this common death, who says: "he has snatched us from so many deaths and will snatch us; in whom we hope that he will still snatch us". For if he both "has snatched" and "will snatch", there will never be a time when he dies, whom the Lord will always "snatch".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily11.html'
source_title="HOMILIES ON LEVITICUS 11"
