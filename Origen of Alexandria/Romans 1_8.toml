[[commentary]]
quote='''
Since, when writing to certain people, the Apostle says that he gives thanks for them all, as also now to the Romans; but when writing to others he does indeed give thanks, yet does not add, for all — if you observe carefully you will find that where he says that he gives thanks for all, he does not press upon them any grave faults or reproaches; but where he censures or convicts certain persons, he does not add to the thanksgiving that he gives thanks for all, as in the letters to the Corinthians or to the Colossians. To the Galatians, however, he does not set down any thanksgiving at all, since he marvels that they are so quickly transferred from him who called them to another Gospel. The first utterance, therefore, begins from thanksgiving. And to give thanks to God is to offer the sacrifice of praise; and for this reason he adds, "Through Jesus Christ", as through the great High Priest. For he who wishes to offer a sacrifice to God must know that he ought to offer it through the hands of the high priest. But this too, that he said, "To my God", is not to be taken idly. For this utterance can belong to none but the saints, whose God he is called, as the God of Abraham, or of Isaac, or of Jacob. He cannot call the Lord his God whose God is the belly, or whose God is avarice, or whose God is the glory of the age and the pomp of the world, or the power of perishable things. For whatever anyone worships above all else, that is his God. But let us see for what the Apostle gives thanks to his God. Because, he says, your faith is announced in the whole world. If we take "in the whole world" simply, this seems to designate that in many places of the world — that is, of this earth — the faith and religion of those who are at Rome is proclaimed. But if, as in some passages, in this place too "world" designates that which consists of heaven and earth and all things that are in them, then this also can be understood: that the powers, of whom it is said that they have joy over one sinner doing penance, much more rejoice also over the conversion and faith of the Romans, since those angels announce it to them who ascend and descend to the Son of man. For they too marvel at the conversion of the Gentiles, and that the sound of the apostles of Christ Jesus has gone out into all the earth. Finally, beholding also their contests in this world, they rejoice, as the Apostle says: "For we are made a spectacle to this world, and to angels, and to men." Yet it can also be understood thus: that this faith which the Romans have is the very same, and not another, than that which is announced and believed in the whole world, by which it is preached not only on earth but also in the heavens: because Jesus made peace through his blood not only for the things which are on earth, but also for those which are in heaven; and at his name bend the knee not only things earthly, but also heavenly and infernal. And this is for faith to be preached in the whole world, through which the whole world may be made subject to God. It must certainly be observed that to this which he said, "first indeed", he did not render, for instance, so as to say: "But secondly"; but it is as we said before concerning less finished forms of expression — unless perhaps it seems to be rendered where he says: "But I would not have you ignorant, brethren."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook01.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
