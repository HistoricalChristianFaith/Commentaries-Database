[[commentary]]
quote='''
"And the prince", it says, "of the army of Jabin was Sisera, and he himself dwelt in Harosheth of the Gentiles, and he had nine hundred iron chariots. And the children of Israel cried out to the Lord". In this too there is likewise kept that observation which we designated above: that the children of Israel do not know how "to cry out to the Lord", except when "they have been delivered into the hands of Jabin", or when they are afflicted through his "prince of the army, Sisera", who "had", it says, "nine hundred iron chariots", by which of course the people of stiff neck was afflicted. Now "Sisera" is interpreted "vision of a horse." For he is the "animal" and not the "spiritual" man, who sees nothing except those things which are "animal"; that is his vision, that is ever his gaze. And therefore the "animal man" and "he who is according to the flesh" always "persecutes him who is according to the spirit", until the "spiritual" man understands and "examines all things" and understands whence help is to be sought for himself, and "cries out to the Lord", until, for that soul which "has cried out to the Lord", there is raised up prophecy, which is in the figure of Deborah, and according to the grace and understanding of prophecy either the people of the Church may be governed or even the sense of each mind and soul may be ruled, through Christ Jesus our Lord, "to whom is glory and dominion unto the ages of ages. Amen!".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily04.html'
source_title="HOMILIES ON JUDGES 4"
