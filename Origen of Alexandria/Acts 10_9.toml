[[commentary]]
quote='''
But "Peter" the Apostle, "when" he was in Joppa, and "wished to pray, ascended to the upper parts". I straightway take even this very thing, that he did not wish to pray in the lower parts, but "ascended to the upper parts", as not said in vain. For neither did the counsel of so great an Apostle superfluously choose "the upper parts" for praying, but, as much as I judge, that it might be shown that Peter, because "he had died with Christ", "sought the things which are above, where Christ is, sitting at the right hand of God", and "not the things which are upon earth". Thither "he ascended", to those "roofs", to those heights, of which the Lord too says: "let him who is on the roof not come down to take anything from the house". In short, that you may know that we do not say these things about Peter conjecturally, that "he ascended to the upper parts", you will prove it from what follows. "He ascended", it says, "to the upper parts, that he might pray, and he saw heaven opened". Does it not now seem to you that Peter ascended "to the upper parts" not only in body, but also in mind and spirit?… And it is well that Peter stays "with a tanner", that one perhaps of whom Job says that "you have clothed me with skin and flesh".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
