[[commentary]]
quote='''
"The horse and the rider he has cast into the sea; he has become for me a helper and protector unto salvation." The men who pursue us are horses, and, so to speak, all who are born in the flesh are figuratively horses. But these have their riders. There are horses which the Lord mounts, and they go about the whole earth, concerning which it is said: "And your cavalry is salvation." But there are horses which have as their riders the devil and his angels. Judas was a horse, but so long as he had the Lord as his rider, he belonged to the cavalry of salvation. For along with the other Apostles he was sent and bestowed salvation on the sick and health on the ailing; but when he laid himself down beneath the devil — for "after the morsel Satan entered into him" — Satan became his rider, and, led by his reins, he began to ride against our Lord and Savior. All, therefore, who persecute the saints are neighing horses, but they have riders by whom they are driven, the evil angels, and for that reason they are fierce. If, therefore, you should ever see your persecutor raging too savagely, know that he is being goaded by his rider the demon, and for that reason he is savage, for that reason he is truculent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily06.html'
source_title="HOMILIES ON EXODUS 6"
