[[commentary]]
quote='''
Therefore, by the command of the Lord, the wars against the Midianites were carried through by the sons of Israel; abundant spoils are brought back from them, an immense weight of gold and silver and of the other movable goods, a very great number of beasts and of captives. But since among the Israelites all these things are reckoned unclean, a purification suited to each several thing is applied; and those things indeed which consist of metals, fire purifies, but those which are more fragile and do not bear the fire are commanded to be purified by water. Therefore from all the spoils two equal parts are made, that one may be of those who had gone forth to war and the other of those who had remained in the camps. They are also commanded to offer from these into the gifts of God: those indeed who had gone forth to war, one head out of five hundred; but those who had remained in the camps, one out of fifty; and the number of all, collected together into one, is reported. This is the tenor of the history.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily25.html'
source_title="HOMILIES ON NUMBERS 25.3"

[[commentary]]
quote='''
But let us see what the spiritual sense indicates in these things. In the people of God there are certain ones, as the Apostle says, who serve God as soldiers — those without doubt who do not entangle themselves in secular affairs; and these are they who go forth to war and fight against the enemy nations and against the spiritual wickednesses on behalf of the rest of the people and on behalf of those who are weaker, whether by age or by sex or by resolve. And these fight with prayers and fastings, with righteousness and piety, with meekness and chastity and all the virtues of continence, fortified as with weapons of war; and when they have returned to the camps as victors, even the unwarlike enjoy their labors, and those who either are not called to the fight or cannot go out. Yet it must be known that all things that are taken from these nations are unclean; and perhaps everything whatsoever is taken up in this world or captured in battle is unclean and needs purification; and certain of these things will pass through fire, but for others the purification of water will suffice. And there are taken up from the battle even men and beasts, when every understanding is taken captive to obey Christ. For unless we fight in the word of God, we shall not be able to take captive the understanding of those who think differently from Christ, and to lead them to the obedience of Christ. Yet few are they who can fight and carry through these battles; out of six hundred thousand and more armed men who seem to serve God as soldiers, only twelve thousand are chosen; the rest are left in the camps. Behold for me now the people of God that is in the Church, how many there are of those who can fight for the truth, who can resist those who contradict, who know how to handle the wars of the word. Blessed are these, who can fight for the whole people and defend the people of God and bring back abundant spoils from the enemy. Yet the remaining part of the people also, which seems unwarlike, if it reside quietly in the camps, if it act in silence and depart not from Moses but remain in the law of God, will itself also receive a part of the spoils. For an equal portion shall be made — not indeed by number, but as much as is given to all the rest of the people, so much also to those twelve thousand, by whose conquering the spoils were taken. Who, hearing these things, is not invited to the warfare of God? Who is not animated to fight for the Church and to resist against the enemies of truth — those, namely, who teach men either to oppose the doctrines of the Church, or to give their effort to pleasure and luxury? He, then, who overcomes these, and who destroys the vices either in himself or in his neighbors, this man will receive many spoils, multiplied fiftyfold beyond the others; for the quantity seems to be increased into so great a number, when twelve thousand are compared with six hundred thousand. Yet each part is commanded to offer to God. And those indeed who conquered, one out of five hundred; but those who remained at home, one out of fifty. And that the number of five hundred and of fifty is holy, Scripture testifies; whence also the Savior said in the Gospels: "A certain moneylender had two debtors; one of them owed five hundred denarii and the other fifty. When they had not the means to pay, he forgave both." But also seven weeks, a monad — that is, one — being added, make the fiftieth day, which is called the festival of Pentecost. Likewise also seventy weeks, the perfection of one decade being added, render the number of five hundred. But by as much as seventy weeks are more than seven, by so much is the number of five hundred more excellent and more perfect than fifty. Hence, finally, also in the parable of the Gospel, which we set forth above, our Savior declares that he loves more to whom the five hundred denarii which he owed were forgiven, than he to whom fifty were.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily25.html'
source_title="HOMILIES ON NUMBERS 25.4"
