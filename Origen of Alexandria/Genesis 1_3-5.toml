[[commentary]]
quote='''
Therefore God dissolved the darkness, as Scripture says: "And God said: Let there be light, and light was made. And God saw the light, that it is good; and God divided between the midst of the light and the midst of the darkness. And God called the light day, and the darkness he called night. And there was evening and there was morning, one day." According to the letter, God calls both the light day and the darkness night. But according to the spiritual understanding let us see what it is that, although God in that beginning of which we spoke above "made heaven and earth," also said that "light should be made," and "divided between the midst of the light and the darkness, and called the light day, and the darkness night," and said that "there was evening, and there was morning," he did not say: the first day, but he said: "one day." Because time did not yet exist, before the world existed. But time begins to exist from the days that follow. For the second day and the third and the fourth and all the rest begin to designate time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.1"
