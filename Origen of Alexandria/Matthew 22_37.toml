[[commentary]]
quote='''
However, now as he responds, he says, "Love the Lord your God with your whole heart, your whole soul and your whole mind." This is the greatest and the first commandment. His statement contains something necessary for us to know, since it is the greatest. The others—even to the least of them—are inferior to it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FIntroduction.html'
source_title="COMMENTARY ON MATTHEW 2"


[[commentary]]
quote='''
Worthy is he, confirmed in all his gifts, who exults in the wisdom of God, having a heart full of the love of God, and a soul completely enlightened by the lamp of knowledge and a mind filled with the word of God. It follows then that all such gifts truly come from God. He would understand that all the law and the prophets are in some way a part of the wisdom and knowledge of God. He would understand that all the law and the prophets depend upon and adhere to the principle of the love of the Lord God and of neighbor and that the perfection of piety consists in love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FIntroduction.html'
source_title="COMMENTARY ON MATTHEW 4"

[[commentary]]
quote='''
Or otherwise; With all thy heart, that is, in all recollection, act, thought; with all thy soul, to be ready, that is, to lay it down for God's religion; with all thy mind, bringing forth nothing but what is of God. And consider whether you cannot thus take the heart of the understanding, by which we contemplate things intellectual, and the mind of that by which we utter thoughts, walking as it were with the mind through each expression, and uttering it.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
You shall love the Lord your God with all your heart, and with all your mind, and with all your soul, and with all your strength. You shall love your neighbor as yourself — not the neighbor with all the heart, with all the soul, and with all the strength, and with all the mind. Again, he says: Love your enemies — and he did not add, "with all the heart." The divine word is not disordered, nor does it command impossible things, nor say, "Love your enemies as yourselves," but only, "Love your enemies"; it is enough for them that we love them and do not hold them in hatred. But the neighbor, as yourself. And God, with all the heart, and with all the soul, and with all the mind, and with all the strength.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 2"
