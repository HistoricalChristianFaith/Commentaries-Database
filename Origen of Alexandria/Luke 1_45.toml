[[commentary]]
quote='''
Would that it might befall me to be called a fool by the unbelieving, I who have believed such things. The work itself and the truth show that I have believed not in folly but in wisdom, since this which is reckoned foolishness among them becomes for me the occasion of salvation. For unless the nativity of the Savior had been heavenly and blessed, unless it had had something divine and surpassing the humanity of men, His teaching would never have penetrated throughout the whole world. If there had been only a man in Mary's womb and not the Son of God, how could it have come to pass that both at that time and now the manifold diseases not only of bodies but also of souls should be cured? Which of us was not foolish, we who now through the mercy of God have understanding and know God? Who was not without faith in righteousness, we who now for Christ's sake have righteousness and follow after righteousness? Which of us was not wandering and astray, we who now, on account of the coming of the Savior, are not tossed about and troubled, but are on the way—namely, in Him who says: "I am the way"? We can also, gathering together the rest, see that all the things which have been written concerning Him are reported as worthy of divine wonder, since both His nativity and His nurture and His power and His passion and His resurrection work in us not only at that time but even now. Who gathered you, O catechumens, into the church? What goad drove you to leave your homes and come together into this assembly? For we do not go around your houses one by one, but the almighty Father by an invisible power lays upon your hearts—upon those whom He knows to be worthy—this ardor, so that as though unwilling and drawing back you come to the faith, especially at the beginning of religion, when, as though trembling and fearful, you take up the faith of salvation with fear. I beseech you, O catechumens: do not draw back, let none of you dread and be afraid, but follow Jesus who goes before you. He draws you to salvation, He gathers you into the church—now indeed upon the earth, but, if you bring forth worthy fruits, into the "church of the firstborn, who are written in the heavens". "Blessed is she who believed", and blessed is he who believed, because there will be a fulfillment for these things "which have been spoken" to her "by the Lord". Over these things Mary also "magnifies" the Lord Jesus. And "the soul magnifies the Lord, the spirit magnifies God". What interpretation these words have, if the Lord grants that we be gathered together again into the church—so that you may come joyfully to the house of God and lend your ears to the divine reading—we shall inquire, we shall sift, we shall discourse, in Christ Jesus: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily07.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 7"
