[[commentary]]
quote='''
It should indeed be known that some portion of these matters, of which we must treat, is set down in the Gospel according to Matthew, the Lord speaking in this manner: "you have heard that it was said: eye for eye, tooth for tooth. But I say to you, do not resist evil. But if anyone strike you on the right cheek, turn to him the other also." But perhaps one who reads the Scriptures more attentively may say that the words we have recalled as written in the Gospel are not taken from this passage of Exodus, but rather from Deuteronomy, where nonetheless certain things are recorded as written in this manner: "but if," it says, "an unjust witness should stand, bearing testimony against a man concerning impiety, both men who are in controversy shall be set before the Lord and before the priests and before the judges, whoever they may be in those days, and the judges shall examine diligently and investigate. And behold, they shall find that the unjust witness has testified unjustly, that he has risen up against his brother; and you shall do to him as he himself attempted to do to his brother, and you shall remove the malignant one from your midst, that the rest, hearing, may have fear, and may not go on further to do according to this evil word among you. Your eye shall not spare over him: life for life, tooth for tooth, hand for hand, foot for foot." Similar things indeed seem to be said in both places; yet it is not plainly shown from which passage in particular the words set down in the Gospel seem to be taken, where he said: "you have heard that it was said: eye for eye, tooth for tooth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily10.html'
source_title="HOMILIES ON EXODUS 10"
