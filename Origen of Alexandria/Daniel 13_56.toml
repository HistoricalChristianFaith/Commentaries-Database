[[commentary]]
quote='''
Let us therefore take heed, just as Jesus here also says, that we may prevail against the Canaanites, lest, if perchance they grow strong over us and overpower us, they make Canaanites of us out of Israelites, just as that man too became one whom the enticement of the flesh had overcome, to whom it is said by the prophet: "seed of Canaan and not of Judah, beauty has seduced you." Let it not befall us, then, to hear "seed of Canaan," for: "cursed be the boy Canaan; he shall be a servant to his brothers." But may the Lord grant us that we be sons of Abraham and Isaac and Jacob, "heirs according to the promise," and for this "raised up out of the stones," that we may be sons of Abraham, by Christ Jesus our Lord, "to whom is glory and dominion unto the ages of ages. Amen!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily22.html'
source_title="HOMILIES ON JOSHUA 22.6"
