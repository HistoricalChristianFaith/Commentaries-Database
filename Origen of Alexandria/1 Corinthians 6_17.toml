[[commentary]]
quote='''
The soul of Jesus clung to God from the beginning of the creation in a union inseparable and indissoluble, as the soul of the wisdom and word of God, and of the truth and the true light. Receiving him wholly and itself entering into his light and splendor, it was made one spirit with him in a preeminent degree. This is what the apostle promises to those who imitate Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25202.html'
source_title="ON FIRST PRINCIPLES 2.9.3"


[[commentary]]
quote='''
The Apostle says that the righteous man is one with Christ, but he is distinct from Christ: "And he who cleaves to the Lord is one spirit with Him." Is it not true that one of them has a lower nature, transient and fleeting, while the nature of Christ is more divine and glorious and blessed? And notwithstanding this, are they no longer two? Yes, for man and woman are no longer two, but one flesh, and the righteous man and Christ are one spirit. … When the righteous man cleaves to Christ, the fitting word is spirit. But when Christ is one with the Father, the fitting word is neither flesh nor spirit, but the more worthy one — God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
