[[commentary]]
quote='''
"For it is better for me to die" than that they should snatch and plunder any of my brothers and, by the clever theft of words, lead away captive "the little ones" and those still nursing in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.6"
