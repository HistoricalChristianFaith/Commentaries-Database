[[commentary]]
quote='''
But let us not omit even that, that it is said not only of Aaron, that "he drink not wine", but also of his sons, when they enter to the holy places. For they have not yet received their gladness—not even the Apostles—but they too wait, that I also may become a partaker of their gladness. For the saints, on departing hence, do not straightway obtain the entire rewards of their merits; but they wait even for us, though we tarry, though we are slothful. For their gladness is not perfect, so long as they grieve over our errors and mourn our sins. Perhaps you may not believe me when I say this; for who am I, that I should dare to affirm the sentence of so great a doctrine? But I bring forward a witness of these things, of whom you cannot doubt: for the "teacher of the Gentiles in faith and truth" is Paul the Apostle. He, then, writing to the Hebrews, when he had enumerated all the holy fathers who were justified through faith, adds after all these also this: "but all these", he says, "having a testimony through faith, did not yet attain the promise, God providing something better for us, that they should not without us attain perfection". You see, therefore, that Abraham still waits, that he may attain the things which are perfect. Isaac too waits, and Jacob, and all the prophets wait for us, that with us they may receive perfect blessedness. On account of this, therefore, that mystery too is kept for the last day of the deferred judgment. For there is "one body" which is awaited to be justified; there is "one body" which is said to rise again in the judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
