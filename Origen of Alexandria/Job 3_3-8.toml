[[commentary]]
quote='''
But Job too, speaking not without the Holy Spirit, "cursed the day of his nativity, saying": "Cursed be the day in which I was born, and the night in which they said: Behold, a male. Let that night be darkness, and let not the Lord seek it again, neither let it come into the days of the year, nor be numbered among the days of the months." But if it does not seem to you that Job speaks these things by the divine and prophetic Spirit, consider from these things which follow; for he adds: "but let him curse it who cursed that day, in which he shall slay the great whale." You see, then, how in the Holy Spirit he foretold concerning "the great whale" which the Lord "was to slay," of which that "whale" of Jonah was a type. Whence the Lord too, who "was to slay" that whale, the devil, says: "For as Jonah was three days and three nights in the belly of the whale, so must the Son of man also be three days and three nights in the heart of the earth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily08.html'
source_title="HOMILIES ON LEVITICUS 8"
