[[commentary]]
quote='''
But let us return to the subject. Balaam is troublesome to God and almost extorts that it be permitted him to go to curse the sons of Israel and to invoke the demons, to whom God had already come. He mounts the donkey; there meets him the angel who kept watch on behalf of Israel, concerning whom it is written, the Lord saying to Moses: "my angel will go with you." To him, then, pressing on to go, it is granted; on the way he is crushed by the donkey; but the magician sees the demons, he does not see the angel; the donkey, however, sees it. Not because she was worthy to see the angel, just as neither was she worthy to speak, but so that Balaam might be confuted and, as Scripture says in a certain place, a mute animal, answering with human voice, might rebuke the madness of the prophet. But since many things have now been said concerning the history, let us touch also on some things concerning the allegory at the end. If you see the contrary power assailing the people of God, you understand who it is that sits upon the donkey; and if you consider men, how they are cast headlong by demons, you understand what the donkey is. For thus in the Gospel too you will understand Jesus sending his disciples to the donkey, which was tied, and to its colt, that the disciples may loose her and lead her, that he himself may sit upon her. And perhaps this donkey—that is, the Church—formerly bore Balaam, but now Christ, from the time when she was loosed by the disciples and, released from the bonds by which she had been bound, that the Son of God might sit upon her and with her might enter into the holy city, the heavenly Jerusalem, and the Scripture might be fulfilled which says: "rejoice, daughter of Zion; proclaim, daughter of Jerusalem: behold, your king comes to you, meek and sitting upon a beast of burden." By the beast of burden—that is, the donkey—he means, without doubt, those who believe from among the Jews, and by the young colt those, surely, who from among the nations believe in Christ Jesus our Lord, to whom be glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily13.html'
source_title="HOMILIES ON NUMBERS 13.8"
