[[commentary]]
quote='''
What, then, is it that is set apart from all things and is not common with the rest, except the sole substance of the Trinity?… But if I shall be able to perceive concerning God the things that are great, that are holy, that are true and secret, then I "will eat the little breast of setting-apart", when I shall have recognized that which is eminent above and set apart from every creature. First, then, my true high priest "eats" this "little breast". How does he "eat" it? "No one", he says, "knows the Father, except the Son". In the second place "his sons also eat". "For no one", he says, "knows the Father, except the Son, and to whom the Son shall will to reveal him". But to what others does he reveal, except to his Apostles?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
