[[commentary]]
quote='''
It is plain that of one kind of knowledge, the end is in the knowledge itself, as in geometry; but of another kind, the end is counted to be in the work, as in medicine; and so it is in the word of God, and therefore having signified the knowledge by the words were themselves eyewitnesses, he points out the work by what follows, and were ministers of the word.

It is written in Exodus, The people saw the voice of the Lord. (Exod. 20:18.) Now a voice is rather heard than seen. But it was so written, to show us that men see the voice of the Lord with other eyes, which they only have who are worthy of them. Again in the Gospel, it is not the voice that is perceived, but the Word, which is more excellent than the voice.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"As they have handed down to us, who from the beginning themselves saw and were ministers of the word". In Exodus it is written: "the people saw the voice of God". And surely a voice is heard rather than seen; but it was written thus for this reason, that it might be shown to us that with other eyes one may "see the voice of God" — those eyes with which they behold who are worthy. Moreover in the Gospel not a voice is perceived, but a word, which is more excellent than a voice. Whence it is now said: "as they have handed down to us, who from the beginning themselves saw and were ministers of the word". Therefore the apostles themselves saw the word, not because they had looked upon the body of the Lord and Savior, but because they had seen the Word. For if to have seen Jesus according to the body is this, namely to have seen the word of God, then Pilate too, who condemned Jesus, saw the word of God, and Judas the traitor, and all who cried out: "crucify, crucify him, take such a one from the earth", saw the word of God. But far be it that any unbeliever should see the word of God. To see the word of God is such a thing as the Savior speaks of: "He who has seen me has seen also the Father, who sent me". "As they have handed down to us, who from the beginning themselves saw and were ministers of the word". Secretly, by Luke's words, we are taught that the end of one kind of teaching is the teaching itself, but that the end of another kind of teaching is reckoned to lie in the work. For example: the science of geometry has as its end only the science and the teaching itself. But there is another science whose end demands a work, such as medicine. I must know the theory and the doctrines of medicine, not only that I may know what I ought to do, but that I may do it, that is, that I may cut wounds, prescribe a moderate and disciplined diet, feel the heat of fevers by the beating of the veins, so that by cyclical treatments I may dry up, temper, and restrain the abundance of humors. And if anyone should only know these things and not follow them up with work, his knowledge will be empty. Something like this, holding between the knowledge of medicine and its practice, exists also in the knowledge and the ministry of the word. Whence it is written: "as they have handed down to us, who from the beginning themselves saw and were ministers of the word", so that we may recognize that by what he said, "themselves saw", teaching and knowledge are signified, but by what he says, "were ministers of the word", works are demonstrated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily01.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 1"
