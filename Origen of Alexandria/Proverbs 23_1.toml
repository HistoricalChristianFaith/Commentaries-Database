[[commentary]]
quote='''
And they are commanded to be "set forth upon the clean table". Who among us is there who has so "clean a table" that upon it "loaves" may be offered to the Lord? "If you sit down to dine at the table of a powerful man", says Solomon, "understand intelligently what is set before you". What, then, is the "table of the powerful man", if not the mind of him who said: "I can do all things in him who strengthens me, Christ", and: "when I am weak, then am I strong"? Upon the "clean table of this powerful man", that is, in his heart, in his mind, the "loaf" is offered to the Lord. If you sit down to dine at the "table" of this "powerful" Apostle, "understand intelligently what is set before you", that is, attend spiritually to the things that are said by him, so that you too may be able to do what is added; for he says: "knowing that you must prepare such things".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily13.html'
source_title="HOMILIES ON LEVITICUS 13"
