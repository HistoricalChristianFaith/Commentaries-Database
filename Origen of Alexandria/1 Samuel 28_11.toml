[[commentary]]
quote='''
Some narratives do not touch us, but some are necessary for our hope. I have spoken of "narratives" in this way, since we have not yet arrived at the matters of the spiritual interpretation — matters useful to everyone who knows how to interpret spiritually or to hear things being so interpreted. Of the things of the narrative, then, some are useful to all, but some not to all. For instance, by way of example: the narrative concerning Lot and his daughters — whether it has anything useful according to the spiritual interpretation, God knows, and he to whom God grants to examine those words; but if you take it according to the narrative, you might well inquire: for what benefit is there to me from the narrative concerning Lot and his daughters? Likewise, what benefit to me is the narrative of Judah and Tamar and the things concerning her, if it is told simply as history? Since, however, the narrative concerning Saul and the witch of Endor touches everyone, it is a necessary truth according to reason. For who, when released from this life, wishes to be under the authority of a demon, so that a witch of Endor might bring up — not just any random one of the believers, but Samuel the prophet? Concerning Samuel God says through Jeremiah: "Not even if Moses and Samuel stood before my face, not even to these would I hearken"; concerning him the prophet says in the hymns: "Moses and Aaron among his priests, and Samuel among those who call upon his name; they called upon the Lord, and he hearkened to them; in a pillar of cloud he spoke to them"; and elsewhere: "If Moses and Samuel stand and pray," and so forth. If, then, so great a man was under the earth and the witch of Endor brought him up, does a demon have authority over a prophetic soul? What shall we say? These things are written: are they true, or are they not true? To say that they are not true urges toward unbelief (it will come down upon the heads of those who say it); but to say they are true furnishes us with inquiry and perplexity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25202%2520-%2520On%2520the%2520Witch%2520of%2520Endor.html'
source_title="HOMILIES ON 1 SAMUEL 2.2"


[[commentary]]
quote='''
And indeed we know some of our own brethren who have looked askance at the Scripture and say: I do not believe the witch of Endor. The witch of Endor says she saw Samuel — she lies. Samuel was not brought up; Samuel does not speak. But just as there are certain false prophets who say, "Thus says the Lord," when "the Lord has not spoken," so also this demon lies, promising to bring up the one whom Saul commanded. For "whom shall I bring up?" it says; "Bring me up Samuel." And these things are said by those who assert that this narrative is not true: Samuel in Hades? Samuel brought up by a witch of Endor — the choice one of the prophets, the one dedicated to God from his birth, the one said before his birth that he would be in the temple, the one who, as soon as he was weaned, put on an ephod and was clothed with a double cloak and became a priest of the Lord, the one to whom, while he was still a child, the Lord gave oracles, speaking to him? Samuel in Hades? Samuel among those below — he who succeeded Eli when Eli was condemned by Providence on account of his children's sins and transgressions? Samuel in Hades — he whom God heard in the time of the wheat harvest, and gave rain to come from heaven? Samuel in Hades — he who spoke so boldly, asking whether he had taken the desired possession of anyone? He took not the calf, he took not the ox; he judged and condemned the people while remaining poor; never did he desire to take anything from so great and so numerous a people. Why should Samuel be in Hades? Do you see what follows for Samuel being in Hades? Samuel in Hades? Why not also Abraham and Isaac and Jacob in Hades? Samuel in Hades? Why not also Moses, who is yoked with Samuel according to what is said: "Not even if Moses and Samuel stand, not even to those would I hearken"? Samuel in Hades? Why not also Jeremiah in Hades, to whom it is said: "Before I formed you in the womb I knew you, and before you came out of the womb I sanctified you"? In Hades also Isaiah, in Hades also Jeremiah, in Hades all the prophets, in Hades.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25202%2520-%2520On%2520the%2520Witch%2520of%2520Endor.html'
source_title="HOMILIES ON 1 SAMUEL 2.3"
