[[commentary]]
quote='''
Then, since many words have been gone through, there was indeed something to say about each of the things spoken, but time does not allow, as it presses upon us. Let us therefore speak on the passage read next: "Cursed is the man who has his hope on man." From this †, against those who suppose that the Son of God, the Savior, was but a man of God (for they dared, along with many of the evils of men, to say this also, that "the only-begotten," "the firstborn of all creation," is not God); for "cursed is he who has his hope on man." It is clear that they are cursed who have their hope on man. I would say that I do not have my hope on man, since, hoping on Christ Jesus, I do not know a man. Not only do I not know a man, but I know Wisdom, righteousness-itself, a man through whom "all things were created in the heavens and upon the earth, whether visible or invisible, whether principalities or authorities." "Cursed is the man who has his hope on man." Even if the Savior bears witness that the one he wore was a man—yet even if he was a man, still now he is by no means a man. For "even if we have known Christ according to the flesh, yet now we know him so no longer," says the apostle. I, through him, am no longer a man, if I follow his words; but he says, "I said, You are gods, and all of you sons of the Most High." Therefore, just as he is "the firstborn from the dead," so he has become the firstborn of all men, having been transformed into God. "Cursed," then, "is the man who has his hope on man, and will make the flesh of his arm his support"—whoever ratifies the things of the flesh, whoever acquires bodily strength and wages war according to the flesh. But the holy man is not so; for "he does not make the flesh of his arm his support," since he "always" bears "the dying of Jesus in his body," and he mortifies "the members that are upon the earth, fornication, uncleanness." Having mortified these, he "does not make the flesh of his arm his support." "Cursed is he who has his hope on man." And at the same time this is against those who hope in dignities of rank. So-and-so is my friend, a centurion; he is a procurator; so-and-so is my friend and is rich and provides for me. Then to such a one also this is said: "Cursed is the man who has his hope on man." On no man do we hope, even if they seem to be our friends; for we hope not on them but on our Lord, who is Christ Jesus, to whom belong the glory and the might unto the ages of the ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily15.html'
source_title="HOMILIES ON JEREMIAH 15"
