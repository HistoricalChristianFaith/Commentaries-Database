[[commentary]]
quote='''
But in another place of the Gospel there is now spoken not of a fountain nor a well, but of something more. "He who believes in me," it says, "as the Scripture says, rivers of living water shall proceed from his belly." You see, then, that he who believes in him has within himself not only a well, but wells, and not only fountains, but rivers; and fountains and rivers not such as would console this mortal life, but such as would confer the eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily12.html'
source_title="HOMILIES ON NUMBERS 12.1"

[[commentary]]
quote='''
What then is the objection? "If anyone," he says, "believes in me, rivers shall flow from his belly, a fountain of water leaping up unto life eternal." Let someone therefore of those who raise the objection say: if the Savior promises "from the belly a fountain of water leaping up unto life eternal," it issues from the just man, and the just man "cries out from the belly," if indeed the "fountain of water" which the Savior promises is in "his belly." But it must be said that perhaps we have two "bellies," and one is bodily, the other spiritual — just as the other parts which seem to be named in the body, such as the eyes, are indeed some of the body, some of the soul. For if it is said of the "eyes": "The commandment of the Lord is bright, enlightening the eyes," I do not think this is to be referred to the bodily "eyes." And if it is said: "He who has ears to hear, let him hear," this is not to be thought to be said of the "ears" of the body, but of the soul, which those who are pure possess, in the hearing of the soul. But also, if it is said in a promise: "Your foot shall not stumble," this is not to be judged to be said of the "foot" of the body; for there is a certain "foot" of the heart entering into him who said: "I am the way." So therefore, like the bodily "belly," there is a "belly" of the soul, of which the just man speaks: "From fear of you, O Lord, we conceived in the belly and were in labor and brought forth the spirit of your salvation, which you have made upon the earth." But whosoever have a "belly" full of empty discourses "which are of the earth," they have a "belly" subsisting "of the earth," of which it is written: "But God will destroy both this and these." The saints therefore have a "belly" in which "from the fear of the Lord they have also conceived," and their "belly" is "full of fountains of water leaping up unto life eternal." Of this "belly" that one says: "And my belly is like new wine without vent, bound up." For he said these things not of the bodily "belly"; for his bodily "belly" was not "full" of divine things and of things near to them, "of wine bound up in a wineskin." Let these things stand for the resolution of the objection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily07.html'
source_title="HOMILIES ON ISAIAH 7"
