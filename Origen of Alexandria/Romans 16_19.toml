[[commentary]]
quote='''
"I want you," he says, "to be wise in what is good, and simple in what is evil." This is similar to that saying which he writes to the Corinthians: "Be children in malice, that you may be perfect in understanding." But that too which the Lord says, "For the sons of this world are more prudent than the sons of light in their generation," accords with this saying. For the sons of this world are more prudent in malice, in that they always find something deeper and subtler in it whereby they may do more harm and injure more violently. But in what is good they are foolish: for they scarcely find what good they might do. Paul, on the contrary, wishes us to be wise in what is good, that is, always to find something more, to search out more, and to think more deeply about what good we may do: so that even if we are hindered by someone's malice from a good work, we, if we are wise, may devise how, if we cannot do a good work, we may at least utter a good word; and if not even this is permitted, that we may at least display a good wish and disposition. So then we ought to be wise in what is good, but simple in what is evil, so that if we are struck by malice, if we are struck by injury, we may not be crafty and cunning, seeking arts and devices by which we may repay evil for evil and wickedness for wickedness. But in such a case we ought to remember that saying which declares: "If anyone wishes to be wise with God, let him become a fool in this world." Let us therefore be fools in receiving injury and not repaying it, that we may be wise with God, who said: "Vengeance is mine, I will repay, says the Lord." For concerning the impious Jeremiah too says: "They are wise to do evil; but to do good they know not." To this looks also that which the Lord said, that we ought to be simple as doves and prudent as serpents. But if someone from among the unbelievers should shrewdly confront us and say: How can the same person be both wise and foolish? we shall say to him: Look at those arts which are in common use among men, how he who, for example, is a most wise grammarian is found most unskilled in the smith's craft; or again, how a most wise helmsman is found unskilled in the art of medicine. So then it is possible to be wise in those things which pertain to God, and unwise in those things which pertain to the world. It should certainly be known that when he says there, "For such men do not serve Christ our Lord," it is not that they themselves profess that they do not serve Christ the Lord, but that, departing from the rule of his service, they show by the facts themselves that they do not serve Christ the Lord. For it does not seem that anyone can at the same time serve both Christ and the belly; and be equally a lover of pleasure and of God; just as no one can serve God and mammon at the same time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
