[[commentary]]
quote='''
And in the Revelation John likewise says: "behold he will come with the clouds, and every eye will see him and whoever pierced him". But let him understand who can, whether it is the very same thing—for him to come upon the clouds of heaven and to come "with the clouds"—or whether the clouds upon which he will come are one thing, and those "with which" he will come another. Consider also, in the vision of Egypt, Isaiah saying: "behold the Lord sits upon a light cloud, and he will come into Egypt", whether he means this Egypt which is commonly understood, or the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252024.html'
source_title="COMMENTARY ON MATTHEW 50"
