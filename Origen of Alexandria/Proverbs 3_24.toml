[[commentary]]
quote='''
There is a sleep which the disciples are commanded to sleep with rest, according to Christ's command, differing greatly from a sleeping against his will; so that the order might be preserved: that first indeed we should watch, praying that we may not enter into temptation, and afterward that we should sleep and rest according to Christ's command.

Which sleep Solomon too sets down in a promise to those who live well, saying in his Proverbs: "for if you sit down, you will be without fear; but if you sleep, you will sleep sweetly, and you will not fear a terror that comes upon you nor the assaults of the impious rushing in". And David, knowing the diverse watchings and sleepings, "swore to the Lord and vowed a vow to the God of Jacob": not to go up onto the couch of his bed nor to give sleep to his eyes nor slumber to his eyelids, and to do this for so long, until he should find "a place for the Lord, a tabernacle for the God of Jacob", so that when he has found a place for the Lord, he may go up onto the couch of his bed and give sleep to his eyes as they renew themselves and, after rest, prepare themselves for a new and more divine rising up, according to what is wont to happen to bodily men after natural and healthy sleep. But perhaps also the soul, not being able always to bear labors inasmuch as it is created and incarnate and not sufficient to preserve the good without interruption, will obtain relaxations without any blame, which morally are called sleeps and slumbers, so that, having relaxation up to some little space of time, it may rise renewed and be raised again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252026.html'
source_title="COMMENTARY ON MATTHEW 96"
