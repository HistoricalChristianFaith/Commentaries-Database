[[commentary]]
quote='''
That is, not content merely to rule over their subjects, they are severe and oppressive. But among you who are Mine these things shall not be so; for as all carnal things are done by compulsion, but spiritual things by free-will, so those rulers who are spiritual ought to rest their power in the love of their subjects, not in their fears.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
For he who wishes to be saved comes to the rule of the Church not to lordship — even though he presides — but to servitude, if one must speak also from the Gospel: "the princes of the nations indeed lord it over them, and those who have power over them are called magistrates; but it shall not be so among you". For neither do "the princes lord it over you", but "whoever of you wishes to be greater shall be least of all"; "whoever wishes to be first shall be last of all". He, therefore, who is called to the episcopate is called not to lordship, but to the servitude of the whole Church. If you wish to believe from the scriptures that in the Church he who presides is the servant of all, let the Savior and Lord himself persuade you: such and so great a one became "in the midst of the disciples not as one reclining, but as one serving". For "taking a towel", after "he had laid aside his garments, he girded himself and, pouring water into a basin, began to wash the feet of the disciples and to wipe them with the towel with which he was girded". And teaching that rulers ought to be such as servants, he says: "you call me master and lord, and you say well; for so I am. If then I, the Lord and master, have washed your feet, you also ought to wash one another's feet". The ruler of the Church, therefore, is called to servitude, so that from this servitude he may be able to go to the heavenly throne, as it is written: "you shall sit upon twelve thrones, judging the twelve tribes of Israel". But hear also Paul, so illustrious a man, saying that he was the servant of all believers. "For I am the least of the Apostles, who am not worthy to be called an Apostle, because I persecuted the Church of God". Further, if this seems to prove not his servitude but only his humility, hear him saying: "we became little ones in your midst, as if a nurse should cherish her own children, though we could be burdensome as Apostles of Christ".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily06.html'
source_title="HOMILIES ON ISAIAH 6"
