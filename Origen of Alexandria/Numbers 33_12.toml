[[commentary]]
quote='''
Setting out from the desert of Zin they came to Rithmah. Rithmah is interpreted as "health." You see the order of the journeyings, how, when the soul has now become spiritual and has begun to have discernment of heavenly visions, it arrives at health, so that it may deservedly say: "Bless the Lord, O my soul, and all that is within me his holy name." What Lord? "Who heals," he says, "all your infirmities, who redeems your life from destruction." For there are many infirmities of the soul: avarice is an infirmity of it, and indeed the worst; pride, anger, boasting, cowardice, inconstancy, faint-heartedness, and things like these. When will you, Lord Jesus, cure me of all these infirmities? When will you heal me, so that I too may say: "Bless the Lord, O my soul, who heals all your infirmities," so that I too may be able to make my station in Rithmah, which is "health"? It would be a long task, if we wished to go through the individual stations and to open up from each one whatever things are suggested by the contemplation of the names; nevertheless we will run through them tightly and briefly, so that we may furnish you not so much a full exposition — since the time by no means allows it — as occasions for understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.12"
