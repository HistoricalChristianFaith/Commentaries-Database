[[commentary]]
quote='''
Hence the Lord too said to the angels who did not keep their princedom: "I said: you are gods, and all sons of the Most High. But you shall die as men, and shall fall like one of the princes"—imitating, that is, the devil, who was made prince of all unto ruin. Hence it is established that transgression, not nature, made those accursed. To you, therefore, O people of Israel, who are "the portion of God", who have been made "the cord of his inheritance", he says: "there shall be for you no other gods besides me", because truly the "one God" is God and truly the "one Lord" is Lord. But upon the rest, who were created by him, he conferred that name not by nature, but by grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
