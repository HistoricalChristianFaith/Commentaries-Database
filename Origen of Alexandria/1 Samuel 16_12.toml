[[commentary]]
quote='''
Esau was "ruddy, hairy as a hide," having the deadness that comes from sin and thirsting for murder against Jacob. But David was ruddy together with beauty of eyes, so as to indicate David's power of discernment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FFragments%2520on%2520Kingdoms.html'
source_title="FRAGMENTS ON KINGDOMS 6"
