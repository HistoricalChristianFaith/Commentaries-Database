[[commentary]]
quote='''
"But do you suppose this, O man, every one of you who judges those who do such things, and does them yourself, that you will escape the judgment of God?" If all the things which the Law speaks, it speaks to those who are under the Law, then the things which the Gospel, or the Apostle, now speaks, it speaks not to the princes of this age, nor to the kings of the world, but to the rulers and leaders of the Churches, namely to those who judge those who are within, that is, to bishops, or presbyters and deacons. To these, therefore, he says that they should not suppose they will escape the judgment of God, if they themselves commit those things concerning which they judge and condemn others. And therefore each one ought first to judge concerning his own conscience, and then to examine the deeds of him whom he judges. And if this were done, all ambition for approaching ecclesiastical honor would be utterly cut off, if those who wish to preside over peoples were to consider that they are rather to be judged than to judge. Let no one therefore suppose that he can escape the judgment of God, as the Prophet also says: "Whither shall I go from your spirit, and whither shall I flee from your face?" And because these things are said especially to those who preside over the judgments of peoples, therefore he says elsewhere also that "judgment begins at the house of God." And again elsewhere the Lord says: "In those who draw near to me I will be sanctified;" as was done in the case of Nadab and Abihu, when they offered strange fire, that is, not sacred fire, upon the divine altars. Judgment therefore begins first from the sons. For "God scourges every one whom he receives into the number of sons." But, as I reckon, not even if one could, ought he to wish to escape the judgment of God. For not to come to the judgment of God is to come neither to correction, nor to health, nor to remedy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook02.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
