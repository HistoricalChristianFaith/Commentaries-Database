[[commentary]]
quote='''
"O mighty ones of the people, bless the Lord, you who have mounted upon beasts of burden". What is it "to have mounted upon a beast of burden"? This body of mine is a "beast of burden"; for it was given for the aid of the soul and for its ministry; but it is I, that is, the inner man, "who have mounted upon" this "beast of burden", to whom it is said that I should "bless the Lord". If therefore you have truly mounted upon the body and have been made superior to bodily desires, and the motions of your body are governed by the bridle of the mind and by the direction of the inner man, it is said of you that you "have mounted upon a beast of burden", that you may "bless the Lord". But what is it that follows? "You who sit upon vehicles", it says, "and shine upon she-asses". What do "shining she-asses" seem to be? For the Scripture says that "those who sit upon vehicles and upon shining she-asses" ought "to bless the Lord". To me, as in places so difficult, something of this sort seems the case: when this beast of burden, that is, my body, has come under the yoke of the word of God, then the "vehicle" of my body will begin "to shine", and this "she-ass", that is, my flesh, will then be said "to shine" when it has been adorned with the splendor of chastity and modesty. And thus it is rightly said that the soul "sitting upon a shining she-ass blesses the Lord" and praises him in the midst of those who rejoice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily06.html'
source_title="HOMILIES ON JUDGES 6"
