[[commentary]]
quote='''
And it is certain, they say, that each one buys that which is not his own; for the Apostle says: "you were bought with a price." But hear what the prophet says: "By your sins you were sold, and for your iniquities I dismissed your mother." You see, then, that we are indeed all the creature of God, but each one is sold by his own sins and for his own iniquities departs from his own creator. We are, therefore, God's, according as we were created by him; but we became slaves of the devil, according as we were sold by our sins. But Christ, coming, "redeemed us," while we were serving that lord to whom we had sold our very selves by sinning. And so he seems to have received back as his own those whom he had created, but to have acquired as aliens those who by sinning had sought for themselves an alien lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily06.html'
source_title="HOMILIES ON EXODUS 6"

[[commentary]]
quote='''
You were bought with a price; do not become slaves of men. As far as your power allows, understand the Word of God who "bought us out"; let us propitiate "the blood that was poured out" for us. We were saying, in the discourse concerning the unmarried and the married, that he tightens and slackens his argument. So here too he has done, saying Do not become slaves of men; for, as it were, he tightens and makes his argument more vehement, urging on those who are able, so far as possible, to keep themselves pure, and urging each one to keep himself pure in the calling in which he was called.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XXXVIII"
