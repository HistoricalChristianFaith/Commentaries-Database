[[commentary]]
quote='''
This little book is an epithalamium, that is, a wedding-song, and it seems to me to have been written by Solomon in the manner of a drama, which he sang after the likeness of a bride about to be wed and burning with heavenly love toward her bridegroom, who is the Word of God. … Therefore it seems necessary to me, before we come to examine the things written in this little book, first to discourse briefly about love itself, which is the chief cause of its writing; and after these things, about the order of Solomon's books, among which this book seems to be placed in the third position; then also about the title of the little book itself, why it is inscribed the Song of Songs; and further, how it seems to be composed in the manner of a drama and as a play upon the stage, of the kind that is wont to be enacted by the changing of characters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"

[[commentary]]
quote='''
And let us first attempt to inquire concerning this: what is the reason that, whereas the Church of God has received three books written by Solomon, the first of them set down is the book of Proverbs, the second the one called Ecclesiastes, and in the third place is held the volume of the Song of Songs. … The general branches of learning by which one arrives at the knowledge of things are three, which the Greeks called ethics, physics, and theoretics; these we may call moral, natural, and inspective (contemplative). … But that is called moral through which an upright manner of living is fitted, and habits tending toward virtue are prepared. That is called natural in which the nature of each single thing is examined, so that nothing may be done in life contrary to nature, but each single thing may be assigned to those uses for which it was brought forth by the Creator. That is called inspective, by which, going beyond visible things, we contemplate something of divine and heavenly things, and behold these with the mind alone, since they surpass bodily sight. … Solomon, therefore, wishing to distinguish and separate from one another these three which we have said above to be general disciplines — that is, the moral, the natural, and the inspective — set them forth in three little books, each of them also fitted in its own order consequently. First, then, in Proverbs he taught the moral part, composing the rules of life, as was fitting, in concise and brief maxims. But the second, which is called natural, he comprised in Ecclesiastes: in which, discoursing much concerning natural things, and separating the empty and vain from the useful and necessary, he admonishes that vanity is to be abandoned, and that the useful and right things are to be pursued. The inspective part also he handed down in this little book which is in our hands, that is, in the Song of Songs, in which he instills into the soul the love of heavenly and divine things under the figure of the bride and bridegroom, teaching that one must come to fellowship with God by the ways of charity and love. … For this book holds the last place for this reason, that one may then come to it when one has both been cleansed in morals, and has learned the knowledge and distinction of corruptible and incorruptible things, through which he may in no way be able to take offense at these figures by which the love of the bride toward the heavenly bridegroom — that is, of the perfect soul toward the Word of God — is described and formed. For when those things have been premised by which the soul is purified through acts and morals, and is led into the discernment of natural things, then one comes fittingly to matters of doctrine and to the mystical things, and ascends to the contemplation of the divinity by a sincere and spiritual love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"

[[commentary]]
quote='''
Fittingly, therefore, in this little book, which was to be written concerning the love of the bride and the bridegroom, for this reason also he is written down neither as son of David, nor as king, nor as anything else of these that could pertain to a bodily understanding, so that with good reason the bride, now already perfect, may say of him, "even if we once knew Christ according to the flesh, yet now we no longer know him thus"—lest anyone suppose that she loves something bodily, or set in the flesh, and lest some blemish be believed to be brought into her love. On this account the Song of Songs is Solomon's only, neither the son of David's, nor the king of Israel's, nor is there mingled in these at all any understanding of a carnal name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"

[[commentary]]
quote='''
But let this too not be hidden, that some write the title of this little book as "Songs of Songs," which is not rightly written. For it is called here not in the plural, but in the singular, "the Song of Songs." … For they take it as though this were "the Song of Songs of Solomon," so that out of his many songs he has marked this to be one. But how shall we accept an understanding of this kind, when neither has the Church of God taken up any songs of Solomon from outside to be read, nor is there held among the Hebrews—from whom the oracles of God seem to have been handed down to us—anything more in the canon beyond these three little books of Solomon which are also among us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"

[[commentary]]
quote='''
Just as we have learned through Moses that certain things are not only holy, but holy of holies; and others not only sabbaths, but sabbaths of sabbaths; so now we are taught, when Solomon writes, that there are certain things not only Songs, but the Song of Songs. Blessed indeed is he who enters the holy place, but more blessed he who enters the holy of holies. Blessed is he who keeps sabbaths, but more blessed he who keeps the sabbath of sabbaths. Blessed likewise is he too who understands the songs and sings them. For no one sings except at festivals; but far more blessed is he who sings the Song of Songs. And as he who enters the holy place still has need of many things, that he may be able to go in to the holy of holies; and he who celebrates the sabbath which was appointed by the Lord for the people still has much that is necessary, that he may keep the sabbath of sabbaths: in the same way, one is found only with difficulty who, passing through all the songs that are contained in the Scriptures, is able to ascend to the Song of Songs. You must go out from Egypt, and, having gone out from the land of Egypt, pass through the Red Sea, that you may be able to sing the first song, saying: Let us sing to the Lord, for gloriously has he been glorified. But although you have spoken the first song, you are still far from the Song of Songs. Traverse the land of the desert spiritually, until you come to the well which the kings dug, that there you may sing the second song. After this, come to the neighborhood of the holy Land, that, stationed upon the bank of the Jordan, you may sing the song of Moses, saying: Give ear, O heaven, and I will speak, and let the earth hear the words of my mouth. Again you have need to serve as a soldier under Jesus, and to possess the holy Land by inheritance, and that the bee may prophesy to you, and the bee judge you — Deborah is interpreted "bee" — that you may be able to learn also that song which is contained in the book of Judges. Then, ascending to the book of Kingdoms, come to the song sung when David was delivered from the hand of all his enemies, and from the hand of Saul, and said: The Lord is my firmament, and my strength, and my refuge, and my deliverer. You must come as far as Isaiah, that with him you may say: I will sing a song to my beloved concerning my vineyard. And when you have passed through them all, mount up to higher things, that, a beautiful soul together with the Bridegroom, you may sing this Song of Songs as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25201.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 1"

[[commentary]]
quote='''
Of how many persons it consists, I am uncertain. But, by your prayers and the Lord's revealing, I seem to have found four persons in it: a man and a bride; with the bride, maidens; with the bridegroom, bands of companions. Some things are said by the bride, others by the bridegroom, some by the young girls, some by the companions of the bridegroom. For it is fitting that at a wedding there should be a throng of maidens with the bride, and a crowd of young men with the bridegroom. Do not seek all this outside: do not look beyond those who have been saved by the preaching of the Gospel. Understand Christ to be the Bridegroom, and the Church to be the Bride without spot or wrinkle, of whom it is written: That he might present to himself a glorious Church, having neither spot nor wrinkle, nor any such thing, but that it should be holy and unblemished. But those who, though they are faithful, are nevertheless not such as the word just described, but seem to have obtained salvation only after a certain measure — understand that the souls of believers are the maidens with the bride; while the Angels and those who have come to the perfect man, understand to be the men with the bridegroom. Hence, then, there appear to me four ranks: one man and one woman, and two choirs singing in harmony with one another — the bride singing with the young girls, the bridegroom singing with his fellows. And when you have understood this, hear the Song of Songs, and make haste to understand it, and to say with the bride the things which the bride says, that you may hear what the bride also heard. But if you cannot say with the bride the things she said, that you may hear the things spoken to the bride, make haste at least to become one with the companions of the bridegroom. And further, if you are lower even than they, be with the maidens who abide amid the bride's delights. For these are, in this book, at once the characters of a drama and of a wedding-song — from which the Gentiles too laid claim to the wedding-song and took up a poem of this kind. For the Song of Songs is indeed a wedding-song. First the bride prays; and at once, in the midst of her prayers, she is heard: she sees the bridegroom present, she sees the maidens joined to her company. Then the bridegroom answers her; and after the bridegroom's words, while he suffers for her salvation, the companions answer, saying that, until the bridegroom is at his rest and rises up from his passion, they will make certain ornaments for the bride. But now the very words must be set down, in which first the voice of the bride making entreaty is heard.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25201.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 1"
