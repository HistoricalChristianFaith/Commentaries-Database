[[commentary]]
quote='''
This little book is an epithalamium, that is, a wedding-song, and it seems to me to have been written by Solomon in the manner of a drama, which he sang after the likeness of a bride about to be wed and burning with heavenly love toward her bridegroom, who is the Word of God. … Therefore it seems necessary to me, before we come to examine the things written in this little book, first to discourse briefly about love itself, which is the chief cause of its writing; and after these things, about the order of Solomon's books, among which this book seems to be placed in the third position; then also about the title of the little book itself, why it is inscribed the Song of Songs; and further, how it seems to be composed in the manner of a drama and as a play upon the stage, of the kind that is wont to be enacted by the changing of characters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"

[[commentary]]
quote='''
And let us first attempt to inquire concerning this: what is the reason that, whereas the Church of God has received three books written by Solomon, the first of them set down is the book of Proverbs, the second the one called Ecclesiastes, and in the third place is held the volume of the Song of Songs. … The general branches of learning by which one arrives at the knowledge of things are three, which the Greeks called ethics, physics, and theoretics; these we may call moral, natural, and inspective (contemplative). … But that is called moral through which an upright manner of living is fitted, and habits tending toward virtue are prepared. That is called natural in which the nature of each single thing is examined, so that nothing may be done in life contrary to nature, but each single thing may be assigned to those uses for which it was brought forth by the Creator. That is called inspective, by which, going beyond visible things, we contemplate something of divine and heavenly things, and behold these with the mind alone, since they surpass bodily sight. … Solomon, therefore, wishing to distinguish and separate from one another these three which we have said above to be general disciplines — that is, the moral, the natural, and the inspective — set them forth in three little books, each of them also fitted in its own order consequently. First, then, in Proverbs he taught the moral part, composing the rules of life, as was fitting, in concise and brief maxims. But the second, which is called natural, he comprised in Ecclesiastes: in which, discoursing much concerning natural things, and separating the empty and vain from the useful and necessary, he admonishes that vanity is to be abandoned, and that the useful and right things are to be pursued. The inspective part also he handed down in this little book which is in our hands, that is, in the Song of Songs, in which he instills into the soul the love of heavenly and divine things under the figure of the bride and bridegroom, teaching that one must come to fellowship with God by the ways of charity and love. … For this book holds the last place for this reason, that one may then come to it when one has both been cleansed in morals, and has learned the knowledge and distinction of corruptible and incorruptible things, through which he may in no way be able to take offense at these figures by which the love of the bride toward the heavenly bridegroom — that is, of the perfect soul toward the Word of God — is described and formed. For when those things have been premised by which the soul is purified through acts and morals, and is led into the discernment of natural things, then one comes fittingly to matters of doctrine and to the mystical things, and ascends to the contemplation of the divinity by a sincere and spiritual love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"

[[commentary]]
quote='''
Fittingly, therefore, in this little book, which was to be written concerning the love of the bride and the bridegroom, for this reason also he is written down neither as son of David, nor as king, nor as anything else of these that could pertain to a bodily understanding, so that with good reason the bride, now already perfect, may say of him, "even if we once knew Christ according to the flesh, yet now we no longer know him thus"—lest anyone suppose that she loves something bodily, or set in the flesh, and lest some blemish be believed to be brought into her love. On this account the Song of Songs is Solomon's only, neither the son of David's, nor the king of Israel's, nor is there mingled in these at all any understanding of a carnal name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"

[[commentary]]
quote='''
But let this too not be hidden, that some write the title of this little book as "Songs of Songs," which is not rightly written. For it is called here not in the plural, but in the singular, "the Song of Songs." … For they take it as though this were "the Song of Songs of Solomon," so that out of his many songs he has marked this to be one. But how shall we accept an understanding of this kind, when neither has the Church of God taken up any songs of Solomon from outside to be read, nor is there held among the Hebrews—from whom the oracles of God seem to have been handed down to us—anything more in the canon beyond these three little books of Solomon which are also among us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"
