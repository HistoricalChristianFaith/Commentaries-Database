[[commentary]]
quote='''
We must consider the food promised in the law as the food of the soul, which is to satisfy not both parts of a person's nature but the soul only. And the words of the gospel, although probably containing a deeper meaning, may yet be taken in their more simple and obvious sense, as teaching us not to be disturbed with anxieties about our food and clothing, but, while living in plainness, and desiring only what is needful, to put our trust in the providence of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FAgainst%2520Celsus%2FBook%25207.html'
source_title="AGAINST CELSUS 7:24"


[[commentary]]
quote='''
Things similar to these Solomon also pronounces in the Proverbs, saying concerning the just man: "the just man eating shall fill his soul; but the souls of the impious shall be in want". If you take this according to the letter, that "the just man eating shall fill his soul, but the souls of the impious shall be in want", it will seem false. For rather the souls of the impious take food with avidity and are eager for "fullness"; but the just at times even hunger. In fine, Paul was just and said: "even unto this hour we both hunger and thirst and are naked and are buffeted". And again he says: "in hunger and thirst, in many fastings". And how does Solomon say that "the just man eating shall satisfy his soul"? But if you consider how "the just man" always and "without intermission" eats of "the living bread" and fills his soul and satisfies it with the heavenly food, which is the word of God and His wisdom, you will find how out of the blessing of God the just man "eats his bread in fullness".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily16.html'
source_title="HOMILIES ON LEVITICUS 16"
