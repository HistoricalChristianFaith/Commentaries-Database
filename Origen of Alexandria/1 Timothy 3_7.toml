[[commentary]]
quote='''
Let us see, then, in what order the high priest is appointed. "Moses," he says, "gathered together the congregation, and says to them: This is the word which the Lord commanded." Although, therefore, the Lord had commanded concerning the appointing of the high priest and the Lord had chosen him, nevertheless the congregation too is gathered together. For in the ordination of a priest there is required also the presence of the people, so that all may know and be assured that the one who is more excellent out of all the people, who is more learned, who is more holy, who is more eminent in every virtue, that one is chosen for the priesthood, and this with the people standing by, lest afterward any reconsideration should arise for anyone, lest any scruple should remain. This is, moreover, what the Apostle too commanded in the ordination of a priest, saying: "It is fitting also that he have a good testimony from those who are without."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily06.html'
source_title="HOMILIES ON LEVITICUS 6"
