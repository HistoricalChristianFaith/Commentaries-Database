[[commentary]]
quote='''
John having announced the coming of Christ, was preaching the baptism of the Holy Spirit, and the other things which the Gospel history has handed down to us. But besides these he is declared to have announced others in the following words, And many other things in his exhortation preached he unto the people.

And as in the Gospel according to St. John it is related of Christ that He spoke many other things, so also in this place we must understand Luke to say the same of John the Baptist, since certain things are announced by John too great to be entrusted to writing.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He who teaches the word of the Gospel proclaims not one thing but very many. For this is what Scripture signifies when it says: "now with many other exhortations also he was proclaiming good news". And so John was preaching to the people "other" things as well, which are not written down; but the things that are written—consider how many they were. He proclaimed Christ, he pointed him out, he preached the baptism of the Holy Spirit; he taught the tax collectors salvation, the soldiers discipline, that the threshing floor is to be cleansed, that the trees are to be cut down, and the rest that the narrative of the Gospel relates. Therefore, apart from these things that are written, he is shown to have proclaimed still other things that are not written, in that it is said: "now with many other exhortations also he was proclaiming good news to the people". And just as in the Gospel according to John it is reported concerning Christ that he spoke many other things also, "which are not written in this book", "which, if they were written, I do not think that the world itself could contain the books that would have to be written": so also in the present passage understand that Luke perhaps, since certain things greater than ought to be committed to letters were being proclaimed by John, was unwilling to state them by name, but only indicated that they had been spoken, and therefore said: "now with many other exhortations also he was proclaiming good news to the people".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily27.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 27"
