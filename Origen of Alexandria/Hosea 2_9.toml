[[commentary]]
quote='''
For an unclean spirit dwelt in us before we believed, before we came to Christ, when still, as I said above, our soul was fornicating away from God and was with its lovers, the demons. But after she said: "I will return to my former husband" and came to Christ, who from the beginning "created her according to his own image", the adulterous spirit necessarily gave place when it saw the lawful husband. We have been received, then, by Christ, and our house has been "cleansed" from former sins and "adorned" with the ornaments of the sacraments of the faithful, which those who have been initiated know. But this house does not at once merit to have Christ as its inhabitant, unless its life and conduct be so holy, so pure and undefiled, that it may merit to be a "temple of God". For it must be no longer a house, but a temple, in which God may dwell. If, then, it neglect the grace received and entangle itself in worldly affairs, straightway that unclean spirit returns and claims for itself the empty house.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
