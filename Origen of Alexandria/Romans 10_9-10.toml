[[commentary]]
quote='''
"For if you confess with your mouth the Lord Jesus, and believe in your heart that God raised him from the dead, you shall be saved. For with the heart one believes unto righteousness, but with the mouth confession is made unto salvation." We ought also to know this, that it is one thing for a potentiality to be in someone, another for there to be effectiveness or actualization — what the Greeks call dynamis (power, capacity) and energeia (activity, actualization). For example: a child newly born is a rational man in potentiality; for he can be rational if he grows up. And in potentiality he is also called a craftsman, and a helmsman, and a grammarian; for it is possible that he be some one of these. But in efficacy or actuality — that is, in the thing itself and in operation — he is none of these while he is a little child; but if he begins to be capable of reason, or to accomplish something of the craftsman's art or of any other, then at last he is called rational in efficacy, or a craftsman, or whatever it is that he performs by the effect of his work. In this way, therefore, Christ also, who is the Word of God, must be believed to be in potentiality according to us — that is, according to every human being — as reason is in little children; but he is said to be in me in efficacy when I have confessed with my mouth the Lord Jesus and have believed in my heart that God raised him from the dead. But do you wish to know that he is present everywhere, and is in the midst even of those who do not know him and do not confess him? Hear how John the Baptist bears this very witness concerning him: "There stands," he says, "in the midst of you one whom you do not know, who comes after me." He is therefore in the midst even of those who do not know him, but he is in their midst in potentiality, not in efficacy. For they are able to receive him, but they do not yet receive him. But in efficacy or actuality he is in the midst of those to whom he said: "Wherever two or three have been gathered together in my name, there am I in the midst of them." For these confessed with their mouth the Lord Jesus, and believed in their heart that God raised him from the dead. Otherwise it seems absurd, if he is said to be in the midst both of those who are gathered in his name and of those who do not know him — unless a distinction of this kind be maintained, that among the ignorant and those who do not yet believe he is said to be in the midst in potentiality, but among believers in efficacy, that is, by the effect of the thing itself and of the work. But observe also this, that he says: "Because if you confess with your mouth the Lord Jesus, and believe in your heart that God raised him from the dead, you shall be saved." For it will seem to some, from this, that even if someone lacks the privileges of good work, even if he has given no labor to the virtues, yet by this very fact that he has believed, he does not perish but is saved, and has salvation, even though he cannot have the glory of blessedness. But see whether this ought rather to be understood: that he who truly and not falsely confesses with his mouth the Lord Jesus, and believes with his heart, confesses at the same time that he is made subject to the dominion of wisdom and of justice and of truth and of all the things that Christ is; and that mammon is no longer lord over him — that is, that neither avarice any longer, nor injustice, nor unchastity, nor falsehood holds dominion over him. For once he has confessed Jesus Christ as Lord, he professes that he is a slave to none of these. And further, believing in his heart that God raised him from the dead, it is certain that he believes him raised for his own justification. Otherwise, what will it profit me to know and to believe that God raised Jesus from the dead, if I do not have him raised within myself? Therefore, if I do not walk in newness of life, and do not flee the old habit of sinning, Christ has not yet risen from the dead for me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook08.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
