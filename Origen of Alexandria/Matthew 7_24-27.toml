[[commentary]]
quote='''
The storm does not make a building stand firm upon the sand, but, if you wish to build, upon "the rock"; and when the storm has arisen, that which is founded "upon the rock" it will not overthrow, but that which sways "upon the sand" it proves at once to have been not well founded. Wherefore, before the storm arises, before the blasts of the winds rise up, before the rivers swell, while all things are still silent, let us turn all our zeal to the foundations of our buildings, let us build our house with the varied and firm stones of the precepts of God, so that, when persecution rages and a dreadful whirlwind rises up against Christians, we may show that we have a building "upon the rock", Christ Jesus. But if anyone — far be it from us — should deny him, let that one know that he did not deny Christ at that time when he seemed to have denied, but that he had the seeds and the roots of denying already long before, and that then was recognized what he had, and it was brought out into the open. Let us therefore pray to the Lord that we may be a firm building, which no storm may overturn, "founded upon the rock", our Lord Jesus Christ: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily26.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 26"
