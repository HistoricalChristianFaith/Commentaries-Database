[[commentary]]
quote='''
The prophet, then, goes down to the house of the potter and recounts what he beheld, saying: "And behold, he was doing a work upon his hands, and the vessel which he was making of the clay fell apart in his hands; and again he made it into another vessel, as it pleased him to make it." But I do not know what the prophet saw when he came to the potter. For he saw the potter working; the vessel that had been made was of clay; the vessel fell apart. Why did he not say precisely: he let the vessel go out of his hand — nor did he lay the cause upon the potter? But since the word is about ensouled vessels, which fall apart of themselves, for this reason it is said: "the vessel fell apart from his hands." Take heed, then, to yourself as well, lest, while being in the potter's hand and still being molded, you fall apart from his hands by your own doing. For "no one snatches out of his hands," according to what is said in the Gospel according to John. Yet it is not written that, as no one snatches, so no one falls apart out of his hands; for free will is free. And I say: no one shall snatch out of the shepherd's hand, no one is able to take us out of God's hand; but we ourselves, by being negligent, are able to fall apart from his hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily18.html'
source_title="HOMILIES ON JEREMIAH 18"
