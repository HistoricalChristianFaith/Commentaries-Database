[[commentary]]
quote='''
But now let us see what he also prophesies concerning Christ. For it is he of whom he says: "There shall come forth a man from his seed, and he shall have dominion over many nations; and his kingdom shall be exalted above Gog, and his kingdom shall grow. God led him out of Egypt, as the glory of a unicorn is his." It is Christ, therefore, who came forth from the seed of Israel according to the flesh, who, how he has dominion over the nations, needs no exposition, especially for one who reads what was said to him by the Father: "Ask of me, and I will give you the nations for your inheritance, and for your possession the ends of the earth." But what is it that he says: "his kingdom shall be exalted above Gog"? Gog is interpreted "above the roofs," and in this passage it is not set down for the name of some nation, as is thought, but, as in some other places, the Hebrew word itself has been left uninterpreted, and on this account it seems to be said as though of some nation. The consequence of the discourse, therefore, is this: "and his kingdom shall be exalted above the roofs, and his kingdom shall grow." To be exalted above the roofs is said of the perfection of believers, but to grow refers to the multitudes. In those, therefore, who are perfect, the kingdom of Christ is exalted above the roofs—that is, above even those who are in the higher places and dwell in the upper regions. For perhaps there are some even among the heavenly beings, beyond whom these who are in the kingdom of Christ advance more and are exalted more highly. And therefore, I believe, the Savior himself too was saying: "Let him who is on the roof not come down to take anything out of the house," admonishing that those who have come to the lofty perfection should not again come down to the low and abject things of this world, which is now called a house. But that too which he says: "What you have heard in the ear, preach upon the roofs," looks nonetheless to this. So, then, above Gog his kingdom is exalted, and his kingdom grows. For it grows while the churches are multiplied and the number of the faithful is increased; and the kingdom of Christ grows to such a degree, until the Father "put all his enemies under his feet," and moreover destroy "the last enemy, death."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily17.html'
source_title="HOMILIES ON NUMBERS 17.5"
