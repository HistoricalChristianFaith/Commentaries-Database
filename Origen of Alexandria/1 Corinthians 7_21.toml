[[commentary]]
quote='''
I am a slave of that affair and care to which I am bound. For I know that it is written that whatever one is conquered by, to that he is delivered as a slave.… Who will free me from this most unseemly slavery except him who said, "If the Son shall make you free, you shall be free indeed".?
'''
source_url=''
source_title="HOMILIES 13"

[[commentary]]
quote='''
He necessarily called the married man a slave; for the husband is a slave of the wife, not having authority "over his own body", and the wife of the husband; for "she does not have authority over her own body, but the husband does". Were you then called as a slave? Let it not concern you; but even if you can become free, rather make use of it; that is, if you do not transgress the law according to reason, you can be free; how? "by agreement", so that "you may devote yourselves to prayer" with all concord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XXXVIII"
