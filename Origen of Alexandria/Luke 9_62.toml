[[commentary]]
quote='''
For these things and things like these ought especially to be held in mind by those who put "their hand", that is, their action, "to the plow" of teaching the doctrine of Christ, so that, knowing to whom woe is laid up (not on account of anything else except that they do not teach), they may not turn "back" after they have once put "their hand to the plow" that plows the souls of men, so that after this they may also receive the seeds of the word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252025.html'
source_title="COMMENTARY ON MATTHEW 66"

[[commentary]]
quote='''
But you also yourself, O hearer, be the farmer of your own soul; use this plow which Shamgar uses. But when "you have put your hand to the plow", do not "look back" — that is, after "you have taken up your cross and followed Christ", after you have renounced the world and the things which are in the world, do not "look back", do not seek again those things which "for the sake of Christ you had counted as dung", because, if you always keep your "hand upon this plow", so that you may confidently say: "But God forbid that I should glory, save in the cross of our Lord Jesus Christ, through whom the world is crucified to me, and I to the world", then, as you say these things, "there shall fall at your right hand ten thousand, and at your left hand a thousand, but unto you they shall not come near".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily04.html'
source_title="HOMILIES ON JUDGES 4"
