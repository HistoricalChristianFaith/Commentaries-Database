[[commentary]]
quote='''
For these things and things like these ought especially to be held in mind by those who put "their hand", that is, their action, "to the plow" of teaching the doctrine of Christ, so that, knowing to whom woe is laid up (not on account of anything else except that they do not teach), they may not turn "back" after they have once put "their hand to the plow" that plows the souls of men, so that after this they may also receive the seeds of the word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252025.html'
source_title="COMMENTARY ON MATTHEW 66"
