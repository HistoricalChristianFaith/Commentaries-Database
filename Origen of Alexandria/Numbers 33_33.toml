[[commentary]]
quote='''
When you have passed through these, you will halt in Jotbathah. Jotbathah is interpreted "good things." To good things, therefore, one comes only after the trials of temptations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.12"
