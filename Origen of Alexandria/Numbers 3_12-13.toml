[[commentary]]
quote='''
But also what it says — "in place of every firstborn that opens the womb" — does not seem to me able to be easily discussed or explained. For not everyone who opens the womb is straightway to be held worthy of the sanctification of the firstborn, since we also read in the Psalms that: "The sinners are estranged from the womb, they have gone astray from the belly, they have spoken false things." Which certainly can in no way stand according to the letter. For how could anyone go astray from the way of God the moment he came forth from his mother's belly? Or how could a child just brought forth speak false things or utter any sort of speech at all? Since therefore it is impossible either for anyone to go astray from the belly or to speak false things, it will be necessary that such a belly and womb be sought to which this saying can fit, that: "The sinners are estranged from the womb and have gone astray from the belly, they have spoken false things"; and that will be the womb which every firstborn opens who is sanctified to God. God once opened the womb of Leah, which was closed, and she bore the patriarchs; likewise also of Rachel, that she too might bear, whose sight was keen and whose appearance was comely. But also in many other places of Scripture you will find wombs being opened. If you consider these one by one according to their places, you will find how both sinners go astray from the womb and others, opening the womb, are sanctified into the order of the firstborn. "And they shall be mine," it says, "the Levites. For every firstborn is mine; from the day when I struck every firstborn in the land of Egypt, I sanctified to myself every firstborn." It is known what the history contains about these things, how the firstborn of the Egyptians were struck when the people of Israel were led out of Egypt. This, then, is what is indicated in this place: that the firstborn of Israel were not sanctified before the firstborn of the Egyptians were struck; and it sets, as it were, the destruction and slaughter of the latter as the cause of the sanctification of the former. Hence here too it must be understood that there are certain firstborn even among the Egyptians, that is, among the opposing powers — as it were the choice ones in malice and the first among the demons — who, unless they are struck and extinguished, the firstborn of the Israelites can in no way receive sanctification. Who then is it who struck the firstborn of the Egyptians, that is, the principalities and powers of the demons? Is it not my Lord Jesus Christ, who is the firstborn of every creature, who led away the adverse principalities and powers, triumphing over them on the cross? Whom certainly, unless he had struck and triumphed over them, the sanctification of the firstborn could by no means have come to us. But that he might grant us the blessings of the firstborn, he first himself became the firstborn from the dead, that in all things he himself might hold the primacy and might take us who believe in his resurrection in place of the firstborn and place us in the order of the firstborn — if only we hold the grace of the blessings firm to the end, aided by the mercy of our Lord Jesus Christ himself, to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily03.html'
source_title="HOMILIES ON NUMBERS 3.4"
