[[commentary]]
quote='''
But lest we tarry too long over the several kinds of the virtues, we can briefly say that by these things are signified those with which the Church is adorned. Her faith can be compared to gold; the word of preaching to silver, the brass to patience; to the incorruptible woods, the knowledge which comes through the wood, or the incorruption of chastity, which never grows old; to the fine linen, virginity; to the scarlet, the glory of confession; to the purple, the splendor of charity; to the hyacinth, the hope of the kingdom of heaven. Let these for the present be the materials out of which the whole tabernacle is constructed, the priests are clothed, and the high priest also is adorned. And what their garments are, or of what sort, the prophet declares in another place and says: "Let thy priests be clothed with righteousness"; all these, then, are garments of righteousness. And again the Apostle Paul says: "Put on the bowels of mercy"; there are, then, also garments of mercy. But the same Apostle nonetheless designates other, nobler garments, when he says: "Put ye on the Lord Jesus Christ, and make not provision for the flesh to fulfill its lusts". These, then, are the garments with which the Church is adorned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily09.html'
source_title="HOMILIES ON EXODUS 9"
