[[commentary]]
quote='''
Everyone who speaks to someone things which the other does not understand — the hearer seems to him to be a barbarian, and he in turn to the hearer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LIX*"
