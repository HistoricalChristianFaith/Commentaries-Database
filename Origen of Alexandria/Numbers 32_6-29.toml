[[commentary]]
quote='''
Yet Moses rebukes them and says to the sons of Reuben and to the sons of Gad: "Your brothers shall go to battle, and will you sit here? And why do you pervert the hearts of the sons of Israel, that they should not cross into the land which the Lord gives them?" And when he had rebuked them with words of this kind, "there came," he says, "to him the sons of Reuben and the sons of Gad and said: We shall build sheepfolds here for our sheep and for our cattle, and cities for our encumbrances, and we, armed, will advance in the first company before the sons of Israel, until we lead them into their own place." And promising these things they mollified Moses, so that he himself commended them to Joshua and to Eleazar. For thus it is written: "And Moses brought them to Eleazar the priest and to Joshua the son of Nun and to the leaders of the families of the tribes of Israel. And Moses said to them: If the sons of Reuben and the sons of Gad cross the Jordan with you, every one armed for battle before the Lord, and you obtain the land in your sight, you shall give them the land of Gilead for a possession." The name of "land," placed in the divine Scriptures, we find with diverse significations; and first indeed this land which we inhabit was not from the beginning called land, but "dry"; and after this, that which had first been called "dry" received the name of land; just as this visible heaven too was not from the beginning called heaven, but first "firmament," and afterward it was named also by the term "heaven." Yet in the beginning of creation God is said to have made heaven and earth, and afterward the dry, and afterward the firmament. But do you wish to know that "dry" is one thing in the Scriptures, and "land" another? Hear the prophet Haggai saying: "Yet once more I will shake heaven and earth and the sea and the dry land." You see how the prophet places "land" as one thing, "dry" as another. But also in many places of Scripture we find "land" named praiseworthily, but "dry" we do not easily read placed praiseworthily. For Adam too is thrust down into this place, as one culpable after his sin, which was named "dry." For before that he was not in the dry, but in the land; for paradise is not in the dry but in the land. But also what the Lord promises to the meek in the Gospel is not the dry, but the land. "Blessed," he says, "are the meek, for they shall inherit the land." And likewise in the Gospel the seed which gives fruit a hundredfold, sixtyfold, and thirtyfold is said to be land, not dry. And I think that there is a certain progress from the dry to coming to the land, just as there was also a certain progress that this land was called dry. For all of us, so long as we are unfruitful and bring forth no fruit of righteousness, none of chastity, none of piety, are dry. But if we begin to cultivate ourselves and to rouse our sluggish minds to the fruit of the virtues, we are made land out of dry, which, having received the seeds of the word of God, multiplies them with a glad harvest. There is, then, in the kingdom of God also a certain land which is promised to the meek, and a land which is named "of the living," and a land placed on high, concerning which the prophet says to the righteous man: "And he shall exalt you, that you may inherit the land." The inheritance, then, of this land, after it has gone forth from the Egypt of this world, the soul believing in God obtains; and in one place indeed those who lived under the law, but in another those who were dispensed through the faith and grace of Jesus Christ. Yet these who seem to be dispensed first and through Moses will not obtain the inheritance decreed to them until they too cross over with those whom Joshua dispenses, and fight with these against the enemies, and settle them in their seats, and thus they themselves shall obtain the inheritance which they merited with Moses as leader.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily26.html'
source_title="HOMILIES ON NUMBERS 26.5"

[[commentary]]
quote='''
But unless these things be proved from the divine Scriptures, they will seem fables. Let Paul, then, be brought forward as a suitable witness of these things, who in the epistle to the Hebrews, where he describes all those fathers and patriarchs and prophets who by faith pleased God, after the enumeration of them all, in his final conclusion says thus concerning them: "And all these, having received the testimony of faith, did not obtain the promises, God providing something better for us, that they should not be perfected without us." As if those nine and a half tribes were to say concerning those two and a half tribes that for this reason they did not receive the promise of that land which was decreed to them beyond the Jordan through Moses, God providing something better for us, that they should not be perfected without us. Therefore for this reason they cross over with us armed for battle and help us in warring, in vanquishing the enemies. But those cross over who are armed, who are strong men and mighty; but all the rest, the cowardly and unwarlike band, remain beyond the Jordan. But if any among them are strong men, having left their animals and cattle and all their encumbrances, they fight against the enemy together with us, until our enemies be conquered, until we take the inheritance of the good land, the land of honey and milk. For who doubts that all the saints among the fathers both help us by their prayers and confirm us by the deeds they have done and exhort us by their examples, but also by their volumes, through those things which they have left written for our remembrance, teaching us and instructing us how we must contend against the hostile powers and how the struggles of the contests must be endured? They fight, then, for us, and they themselves advance first before us, armed. For having them as an example and seeing their brave deeds through the Spirit, we are armed for the spiritual battle and contend against the spiritual forces of wickedness in the heavenly places. Thus, finally, those who serve as soldiers under Joshua as leader slay thirty and more kings and receive their lands by the lot of inheritance. For when the spiritual forces of wickedness have been driven out from the heavenly places, they receive the inheritance of the heavenly kingdom, our Lord Jesus dividing it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily26.html'
source_title="HOMILIES ON NUMBERS 26.6"

[[commentary]]
quote='''
There can be seen also yet a third mode of exposition, so that among the sons of Israel, that is, among the people of the Church, there are understood to be certain spiritual ones, who within the Jordan receive the inheritance of the land flowing with milk and honey, namely receiving the sweetness of wisdom and knowledge, whose land is surrounded and watered by the river of God, which is filled with the waters of divine understanding. But others are carnal, who abound in beasts and cattle, that is, in gross and dull senses; such as were those of whom the Apostle said: "Are you so senseless that, having begun in the Spirit, you now are perfected in the flesh?" and: "O senseless Galatians, who has bewitched you not to obey the truth?" But each one of us also, unless he arms himself and, having cast off the brutish and beastlike senses, hastens to spiritual understanding, will remain beyond the Jordan and will not be able to advance through the river of wisdom, which gladdens the city of God, that is, the soul capable of God; he will not attain the interior things of the Lord's utterances, which are "sweeter than honey and the honeycomb," but he will attain only that land in which the two kings were slain, where it is said to him: "I judged myself to know nothing among you except Christ Jesus, and him crucified." But he who has been able to cross the Jordan and penetrate to the interior things, there following Jesus our Lord will slay thirty and more kings—those, perhaps, of whom it is said: "The kings of the earth stood by and the princes gathered together into one against the Lord and against his Christ"—and when these kings have been driven out and cast down, he will recognize the more secret mysteries, until he come even to that place where the seat of God is and Jerusalem the city of the living God, not this one which serves with its sons on earth, but that heavenly one which is free and is the mother of us all; to whose inheritance may he deign to lead us, our leader and Lord Jesus Christ, to whom be glory unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily26.html'
source_title="HOMILIES ON NUMBERS 26.7"
