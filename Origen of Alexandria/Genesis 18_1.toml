[[commentary]]
quote='''
But let us now see what is also said in what follows. "But Abraham himself," it says, "was standing by them under the tree." For narratives of this kind we require circumcised ears. For it is not to be believed that it was of the greatest concern to the Holy Spirit to write in the books of the law where Abraham stood. For what does it profit me, who have come to hear what the Holy Spirit teaches the human race, if I should hear that "Abraham was standing under a tree"? But let us see what this tree is, under which Abraham was standing and displaying a banquet to the Lord and to the angels. "Under the tree," it says, "of Mamre." "Mamre" in our language is interpreted as vision or clear-sightedness. Do you see who and what kind is the place in which the Lord can hold a banquet? The vision and clear-sightedness of Abraham delighted him. For he was pure in heart, so that he could see God. In such a place, therefore, and in such a heart, the Lord can hold a banquet with his angels. Finally, in earlier times the prophets were called seers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.3"
