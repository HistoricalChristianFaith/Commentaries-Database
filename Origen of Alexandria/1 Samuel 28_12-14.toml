[[commentary]]
quote='''
These things, then, he will say who does not wish to accept the contest — namely, the one who denies that it is truly Samuel who was brought up. But since one must be fair-minded in listening to the Scriptures, now that the objector's argument has plausibly thundered against us and is truly able to trouble and shake us, let us see whether the Scripture has ever been rightly understood by the one who does not accept this, or whether he sets out from plausible premises but says things contrary to what is written. For what are the things written? "And the woman said: Whom shall I bring up to you?" Whose is the voice that says, "the woman said"? Is it the person of the Holy Spirit, from whom the Scripture is believed to have been written, or the person of some other? For the narrative voice everywhere (as those who have busied themselves with all sorts of discourses know) is the person of the writer; and the writer of these words is believed to be not a human being — the writer is the Holy Spirit who moved the human beings. Therefore it is the Holy Spirit who says: "And the woman said: Whom shall I bring up to you? And he said: Bring me up Samuel." Who is it that says, "And the woman saw Samuel, and the woman cried out with a loud voice, saying"? We will say to that one who has thundered so much against us and said countless things — that Samuel was not in Hades: "the woman saw Samuel" — the narrative voice said this — "and the woman cried out with a loud voice and said to Saul: Why have you deceived me? For you are Saul. And the king said to her: What is it? Do not fear. What have you seen? And the woman said to Saul: I saw gods coming up out of the earth. And he said to her: What is their form? And she said to him: An aged man coming up, and he is clothed with a double cloak, an ephod." It says that she saw also the priestly garment. But I know that the one on the opposing side of the argument says: "No wonder; for Satan himself is transformed into an angel of light. It is no great thing, then, if his servants too are transformed as servants of righteousness." But what is it that "the woman saw"? "Samuel." And why is it not said: the woman saw a demon that pretended to be Samuel? But it is written that "Saul knew that it was Samuel." If it had not been Samuel, it ought to have been written: and Saul thought that it was Samuel; but as it is, it is written: "Saul knew" — and no one knows that which does not exist; therefore "Saul knew that it was Samuel." "And he fell upon his face to the ground and did obeisance." Then again the voice of the Scripture: "And Samuel said to Saul: Why have you provoked me by bringing me up?" "Said" (says the Scripture, which one must believe) — "Samuel said: Why have you provoked me by bringing me up?" Then to this Saul answers: "The foreigners war mightily against me, and God has departed from me and has answered me no more, neither by the hand of the prophets nor in dreams; I called for you to show me what I should do." Again the Scripture did not speak otherwise, but says that Samuel himself said: "And why have you questioned me? For the Lord has departed from you." Does he speak truly or falsely when he says: "The Lord has departed from you and has become an adversary against you and has made for himself another, in the manner that he spoke by my hand, and he will rend the kingdom from your hand" — and is it really a demon that prophesies concerning the kingdom of Israel? What does the opposing argument say? See how great a contest there is in the word of God, needing also hearers able to hear holy words, great and ineffable, concerning the departure from this life — while the former matters are still perplexing and the latter are not yet clear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25202%2520-%2520On%2520the%2520Witch%2520of%2520Endor.html'
source_title="HOMILIES ON 1 SAMUEL 2.4"
