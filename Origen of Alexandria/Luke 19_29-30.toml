[[commentary]]
quote='''
It was read in the Gospel according to Luke how, when the Savior had come "to Bethphage and Bethany near the Mount of Olives, he sent two of his disciples" to untie "the colt of a donkey", which was tied up, "on which no man had ever sat". This indeed seems to me to pertain to a higher understanding rather than to the simple narrative. The donkey was tied up. Where, then? "Opposite Bethphage and Bethany", of which Bethany is interpreted "house of obedience", while Bethphage means "house of jawbones", a certain priestly place; for the jawbones were given to the priests, as is prescribed in the law. To that place, therefore, where there is "obedience", where there is "a place made over to the priests", the Savior sends his disciples, that they may untie "the colt of a donkey, on which no man had ever sat". Furthermore, what else can sit upon a donkey apart from a man? I wish to take an example for a little while, so that what I am about to say may be understood. It is written in Isaiah: "the vision of the quadrupeds in tribulation and distress", and the rest, up to the place where he says: "the riches of the asps will not profit them". Let each one of us consider how great wealth of asps he has borne before this, how great riches of beasts, and how a rational man never sat upon our donkey — not the word of Moses, not of Isaiah, not of Jeremiah, nor of all the rest of the prophets — and he will see that the word of God and reason then sat upon us, when the Lord Jesus came and commanded his disciples that, going, they should untie "the colt of a donkey", which before had been tied up, so that it might walk free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily37.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 37"
