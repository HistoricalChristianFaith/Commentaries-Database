[[commentary]]
quote='''
I indeed would first wish to have discourse with the Jews concerning this scripture, to whom "the oracles of God" are said to have been "entrusted", what seems to them concerning that which it says: "for six days continuously you shall gather, but on the sixth day you shall gather double". It appears therefore that the sixth day is named as that which is set before the sabbath, which among us is called the preparation. But the sabbath is the seventh day. I ask therefore on what day the manna began to be given from heaven, and I wish to compare our Lord's day with the sabbath of the Jews. For from the divine scriptures it appears that the manna was first given upon the earth on the Lord's day. For if, as Scripture says, it was gathered for six continuous days, but on the seventh day, which is the sabbath, there was a cessation, without doubt its beginning was from the first day, which is the Lord's day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily07.html'
source_title="HOMILIES ON EXODUS 7"
