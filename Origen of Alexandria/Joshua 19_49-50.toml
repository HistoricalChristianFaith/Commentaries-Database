[[commentary]]
quote='''
"And the sons of Ephraim went forth to traverse the land according to their borders." And when he had recounted that history, in what follows he makes clear how great was the meekness and humility of the blessed Jesus, who was truly worthy to bear the name of Jesus our Lord and Savior! For he says: "And the sons of Israel gave a lot to Jesus [son] of Nave among themselves by the command of the Lord; and they gave him the city which he asked for, Thamnasac, which is on Mount Ephraim; and he built a city there, and dwelt in it." He it is who gave the inheritance to all "the sons of Judah," who gave to "Ephraim" and to "the half tribe of Manasseh"; he gave to that magnificent "Caleb [son] of Jephone" an inheritance also; he sent "three men through each of the tribes" to "traverse" the whole "land and describe it in a book" and return and show it to him; he "sent lots" to all and reserved himself for the very last. Why do you think he wished to be "last" of all? Without doubt, that he might be "first" of all. And he did not even presume the lot of an inheritance for himself, but received it from the people, and the people "give an inheritance" to him from whom he himself had received it. For thus it is written: "and the sons of Israel gave a lot to Jesus [son] of Nave." But "these things happened to them figuratively," which were set before us as a model, that we too might keep that precept which this man fulfilled in deed, where it is said: "the greater you are, the more humble yourself, and you will find grace before the Lord," and again what is written: "if they appoint you leader, do not be lifted up, but be among them as one of themselves." See therefore how he himself was "leader" of the people, who had led them "into the holy land," into "the land of promise"; he himself was the successor of Moses, and he does not permit himself to take a lot of the land, but waits to receive a little portion from the people, he the leader of the people, and having received his little portion, Jesus, worthy of this name, builds up that very place which he received, and constructs it, that he may make it truly worthy of the gift of God and of the divine inheritance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily24.html'
source_title="HOMILIES ON JOSHUA 24.2"

[[commentary]]
quote='''
But since we are accustomed to refer the things that are written about Jesus to our Lord and Savior, perhaps this whole people of ours too gives some portion to my Lord Jesus and grants him, as it were, a certain place for his dwelling. But lest what is said seem to be injurious, let us inquire how we, his servants, give him a place of habitation. If I could become good, I would give a place to the Son of God within me, and the Lord Jesus would build up and adorn the place received from me in my soul, and would make in it unassailable walls and lofty towers, so that he might build in me, if I were worthy, a dwelling worthy of himself and of the Father, and would so adorn my soul as to make it capable of his wisdom and knowledge and all holiness to such a degree that he would even make God the Father enter in with him "and make his dwelling in it," and even dine in such a soul upon the foods which he himself had given. And that we may be worthy to attain this, let us prepare in ourselves a clean heart, into which the Lord Jesus may deign willingly and gratefully to enter as the guest-lodging of our clean heart, "to whom is glory and dominion unto the ages of ages. Amen!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily24.html'
source_title="HOMILIES ON JOSHUA 24.3"
