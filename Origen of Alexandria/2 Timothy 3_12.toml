[[commentary]]
quote='''
Fleeing therefore from Egypt, you come to these places, you come to these ascents of works and of faith, you come to the building of the tower, you come also to the sea, and the waves meet you. For the journey of life is not made without the waves of temptations; as the Apostle also says: "all who wish to live piously in Christ shall suffer persecution." But Job likewise declares that: "our life upon the earth is a temptation." This, then, is to have come to the sea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily05.html'
source_title="HOMILIES ON EXODUS 5"
