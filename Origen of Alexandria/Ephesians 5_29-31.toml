[[commentary]]
quote='''
For no man ever hated his own flesh; but he loves her as his flesh; they two, it is said, shall be two—not in one spirit, but—shall be two in one flesh. Love God too, but love Him not as flesh and blood but as Spirit; for he who is joined to the Lord is one spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
