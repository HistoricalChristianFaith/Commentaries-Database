[[commentary]]
quote='''
Knowing this, the Apostle Paul also said: "For the earth, drinking in the rain that comes often upon it and bearing herb fit for those by whom it is tilled, receives blessings from God; but that which brings forth thorns and thistles is reprobate and near to a curse, whose end is unto burning". Did the Apostle say these things about this earth? But neither does the earth receive blessings from God "when it has drunk in the showers" and produced fruit; nor, if after the rain "it has brought forth thorns and thistles", does it obtain curses from God. But our earth, that is, our heart, if it should receive "the rain that comes frequently upon it" of the doctrine of the law and should bring forth the fruit of works, receives blessings. But if it should have, not spiritual work, but "thorns and thistles", that is, the cares of the world, or the desires of pleasures and riches, it is "reprobate and near to a curse, whose end will be unto burning". Therefore each one of the hearers, when he comes together to hear, receives "the shower" of the word of God; and if indeed he has brought forth the fruit of a good work, he will obtain "blessing"; but if he has despised the word of God he has received, and has neglected what he has often heard, and has subjected himself to the care of worldly affairs and to lust, as one who has choked the word with "thorns", he will procure "a curse" instead of a blessing, and instead of the end of beatitude he will find "the end of burning".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily16.html'
source_title="HOMILIES ON LEVITICUS 16"


[[commentary]]
quote='''
Let us see then whether by an illustration used by the apostle in the epistle to the Hebrews, we are able to prove that by one operation God has mercy upon one while he hardens another. It is not God's intent to harden, but while having a good purpose, hardening follows as a result of the inherent principle of wickedness in such persons, so that he is said to harden him who is hardened. … As regards the rain there is one operation, but the ground which is cultivated produces fruit, while that which is neglected and is barren produces thorns.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25203.html'
source_title="ON FIRST PRINCIPLES 3.1.10"
