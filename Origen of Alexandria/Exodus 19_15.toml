[[commentary]]
quote='''
Hear, then, now also the kind of sanctification: "do not approach" it says "a woman today and tomorrow, that on the third day you may hear the word of God". This is what the Apostle also says: "it is good for a man not to touch a woman", with the remedy preserved, however, for those who because of their weakness need the remedy of marriage. But let us nevertheless hear the counsel of the Apostle who says: "because the time is short, it remains that both those who have wives be as though not having them, and those who buy as though not possessing, and those who use this world as though they use it not. For the fashion of this world passes away", the temporal kingdom passes away, that the perpetual and eternal may come, as we are also bidden to say in prayer: "your kingdom come", in Christ Jesus our Lord, "to whom is glory and dominion unto the ages of ages. Amen".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily11.html'
source_title="HOMILIES ON EXODUS 11"
