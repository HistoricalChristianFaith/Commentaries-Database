[[commentary]]
quote='''
"And the sons of Israel, having set out from there, pitched their camp to the west of Moab beside the Jordan opposite Jericho. And when Balak, son of Zippor, saw," and the rest. Now all the things which are written concerning Balaam and his donkey are a history full of business; but the inner meaning is much more laborious, and I do not know whether it is even easy to explain merely the historical statements themselves. Yet, with God granting, we shall touch briefly on what we can. War is threatening you, O king Balak, son of Zippor; six hundred thousand armed men are rushing upon your borders. It behooved you also to prepare arms, to muster an army, to think about the drawing up of battle, so that you might meet the enemy, while still placed at a distance, equipped with arms. But you send to Balaam the diviner and send many gifts and promise greater ones and say: "come, curse for me the people that has gone out from Egypt." But Balaam, as Scripture teaches, referred these things to God, by whom also he is forbidden to come. But again the king sends envoys and, arms neglected, places all his hope in Balaam, that he may come and deliver words and hurl curses against the people in place of weapons, if perhaps the people, whom the king's army could not overcome, might be conquered by the words of Balaam. What consistency does this history have, what counsel does it show? Where or when was it heard that any of kings, with battle threatening him, having set aside his arms and neglected his army, took refuge in the words of some diviner or soothsayer? Whence again and again the grace of God must be implored by us, that we may be able to explain these things not by fabulous and Jewish narrations, but by rational senses worthy of the divine law. First of all, then, it must be confessed that in certain matters words can do more and avail more than bodies, since what the army of many nations could not accomplish, what could not be obtained by iron and arms, this is accomplished by words; and I do not say by holy words or words of God, but by certain words which are held among men, which how I should name I do not know; yet they are composed by a useless art, of which art let that be the name which each pleases to call it. There is, then, as I said, among men some work that is accomplished by words; which work, however, is such that it cannot be fulfilled by however great the strength of body. For example, there were in Egypt enchanters and magicians. Who among men can by strength of body change a rod into a serpent, which is reported to have been done by them, or who can by the powers of body turn water into blood? Yet the enchanters and magicians of the Egyptians did this. For Moses had first done these things; but because the king of Egypt knew that these things could be done by a certain art of words which is held among men, he thought that Moses too had done these things not by the power of God, but by magical art, and that what he had done by human art, this he was pretending to be done by the power of God. He immediately summons the enchanters and magicians of the Egyptians. Between him who was working by the power of God and those who were invoking demons he makes there be a contest. Yet the contrary power likewise makes the rod a serpent, as the power of God had done; but the serpent which had been made by the power of God swallowed up and devoured all those serpents which by magical art had been turned from rods into serpents: for the demonic power could not restore to good the evil which it had made out of good. It could make a serpent out of a rod, but it could not give back a rod out of the serpent; and therefore all are consumed by that rod which by the power of God had been turned into a serpent. But afterward, by the divine power, it is restored to its own nature, so that it might confess the Lord of nature. The enchanters of the Egyptians made water too be turned into blood, but they could not again turn blood into water; but the power of God turned not water, but the whole river into blood, and again, at the prayer of Moses, gave it back with clear and natural streams. And again the magicians of the Egyptians produced gnats, but they could not drive them away; but Moses both produced gnats and took them away; for our God both causes grief and again restores; but the contrary power can indeed do something evil, but it cannot restore to wholeness. Now we have sent all these things ahead, so that we may be able to observe the works of Balaam or his words; for there are also certain differences among magicians; for some avail more, others less. This Balaam was most famous in the magical art and most powerful in noxious incantations. For he did not have the power or art of words for blessing, but he had it for cursing; for demons are invited to cursing, not to blessing. And therefore, as one experienced in such things, he was held in repute by all who were in the East. For unless very many experiments of his had gone before—that he had frequently by curses routed an armed enemy—the king would surely not have presumed that this could be done by words which could scarcely be fulfilled by iron and the battle-line. Balak, then, being certain of this and having frequently made trial of it, setting aside all the instruments and aids of war, sends envoys to him, saying: "behold, a people has gone out from Egypt, and has covered the face of the earth; and this one has settled beside me." But I think also something more that moved the king; for he seems to have heard that the sons of Israel are accustomed to conquer their enemies by prayer, not by arms, and not so much by iron as by prayers. For Israel moved no arms against Pharaoh, but it was said to him: "the Lord will fight for you, and you shall be silent." But neither against the Amalekites did the force of arms avail so much as the prayer of Moses. For when Moses lifted up his hands to God, Amalek was conquered; but when they were let down and lowered, they made Israel to be conquered. These things surely Balak, king of Moab, had heard. For it is written: "the nations heard and were angry; pangs seized those who dwell in Philistia. Then the leaders of Edom hastened and the princes of the Moabites; trembling laid hold of them." You see that there had come to them what Moses foretold in the Canticle, when they crossed the Red Sea. The king of Moab, then, had heard that this people conquers by prayers and fights against its enemies with the mouth, not with the sword; and on account of this, without doubt, he thought within himself, saying: since indeed no arms can be matched against the prayers and supplications of this people, therefore for me too such prayers and such arms of words and such prayers must be sought as can overcome the prayers of these people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily13.html'
source_title="HOMILIES ON NUMBERS 13.4"
