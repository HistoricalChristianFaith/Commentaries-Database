[[commentary]]
quote='''
But I beg you, brethren, that you observe those who make dissensions and offenses contrary to the doctrine which you have learned, and turn aside from them. For such do not serve Christ our Lord, but their own belly; and through sweet words and blessings they seduce the hearts of the innocent. For your obedience is everywhere published abroad. In you therefore I rejoice. Here Paul must be believed to write, through the Holy Spirit, both to those who preside over the Churches and to all believers, that they may more diligently consider and perceive who they are that beget dissensions and offenses in the Churches, and are strangers to that beatitude which the Lord promised, saying: Blessed are the peacemakers, for they shall be called sons of God. For this, he says, that you be peacemakers, you have learned from the Lord through the Gospel; but to stir up dissensions or scandals is contrary to the doctrine which you have learned; and therefore let him be a stranger to you, and let him by no means be received among you, who stirs up contentions, who sows quarrels, who excites lawsuits, and practices the pursuits of strife. For those who are such do not serve Christ our Lord, who is our peace, but their own belly. But he also discloses, by the prompting of the divine Spirit, what the cause is by which quarrels and lawsuits are aroused in the Churches. For the sake of the belly, he says; that is, of gain and covetousness. Thence it is that some go about houses speaking for favor with all flattery and deception, not that they may in the word of God build up souls unto virtue, but that by flattering and sweet words they may exhort them to remain, or even to advance, in vices, praising and speaking well of those things which are worthy of rebuke; putting light for darkness, and darkness for light; sweet for bitter, and bitter for sweet; and in these things they seduce the hearts of the innocent. And therefore one must diligently attend to with what aim he teaches who teaches: whether seeking favor and honor from his hearers, or hoping for a reward from the Lord for the instruction and progress of the learners. Subtly indeed Paul marks the undiscerning and easy obedience of the Romans, and asserts that it is everywhere not praised, but published abroad. But lest again, if he should chastise them more openly for this, he should make them disobedient, he adds: In you therefore I rejoice. But you will say: How does he mark in them a common obedience, when he says that he rejoices in them? First indeed it is one thing to mark a fault, another to mark men. For it can be that he rejoices in those in whom he had detected many other good things; but that he marks the fault which had displeased him, lest he be thought to have been pleased with it also along with the rest. But the Apostle can also have said that he rejoices in them for this reason, that he who is disobedient can be drawn neither to evil nor to good; but he who is obedient, if indeed he be drawn to useless things, the fault is one of inexperience. For he does not know that those things are useless by which he proves his obedience; but when he has learned what things are useful, having the good of obedience ready at hand, he immediately ascends the road of virtue through it. Paul therefore rejoices over the obedient, being certain that when he has taught them that they ought not to use that common obedience which they incautiously offer to all, but that alone by which one ought to obey God rather than men, they will, leaving the rest aside, use that alone. For in truth it requires no small discernment, but an approved and most practiced judgment, to know to what word or to what work one must be obedient, and to what one must offer resistance. Finally the Lord himself says in the Gospel: Beware of those who come to you in the clothing of sheep, but within are ravening wolves. And therefore a watchful sense and an intent mind is required, which knows how to test either the sheep's simplicity in the open, or the wolf's hidden rapacity. Whence see how near to danger those become who neglect to be exercised in the divine letters, from which alone the discernment of such examination is to be learned. Immediately therefore he shows briefly the appearance of the distinction proposed, and says: Since indeed your obedience is easy and undiscerning, receive what you ought to keep, what you ought to beware of.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
