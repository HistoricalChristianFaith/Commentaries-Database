[[commentary]]
quote='''
Just as we have shown that in this Epistle diverse laws are mentioned by Paul under the single word "law," and that diverse deaths are named under the one designation "death," so now we also see diverse spirits indicated under the one name of "Spirit." He says, then, in the present chapter: "For whoever are led by the Spirit of God, these are the sons of God"; and in this he certainly means the very Spirit of God. And again in what follows: "For you have not received," he says, "the spirit of bondage again in fear." In this he shows that the spirit of bondage is other than that which he called above the Spirit of God. And therefore he adds: "But you have received the spirit of adoption of sons, in which we cry: Abba, Father." In this he shows that the spirit of adoption is the same as that which he called above the Spirit of God, concerning which he also repeats: "For the Spirit himself bears witness to our spirit" — that is, the very Spirit of God, in which we cry out to God as Father, bears witness to our spirit. And this spirit of ours is without doubt other than either that spirit of bondage which is given in fear, or this one which bears witness to it concerning the invocation of the Father. All human beings, therefore, as it appears, are led by some spirit, just as Paul himself wrote: "But you also know that, when you were Gentiles, how you were led to mute idols." In this he shows that even the Gentiles are led to idols by some spirit. There is, then, the Spirit of God, who is the same as the Spirit of Christ, and this same one is also the Holy Spirit. But the spirit of adoption too seems to be called the same, as the present apostolic discourse declares. David also, who says, "Take not your Holy Spirit from me," and, "Strengthen me with your principal Spirit," seems to be speaking of the same one; and I think that Spirit was called "principal" for this reason, that it might be shown that there are indeed many spirits, but that among them this Holy Spirit — who is also called "principal" — holds the primacy and dominion. For just as there are many sons of God, as the Scripture says, "I have said: You are gods, and all of you sons of the Most High," yet there is one who is by nature Son and Only-begotten of the Father, through whom all the others are called sons, so also there are indeed many spirits, but there is one who truly proceeds from God himself, and who bestows on all the rest the grace of his own name and sanctification. And that there are many spirits, the same Apostle declares, writing to the Hebrews and saying: "Are they not all ministering spirits, sent for service on account of those who receive the inheritance of salvation?" But David too says: "Who makes his angels spirits." And Daniel likewise bears witness and says: "Bless the Lord, you spirits and souls of the just." And in the present passage Paul says, "The Spirit himself bears witness to our spirit"; and in another place: "That your spirit whole and entire, and soul, and body may be preserved in the day of our Lord Jesus Christ." There is no doubt that all these things are said of rational spirits. Besides these, evil spirits and evil angels are named, as David also says: "He sent forth upon them the wrath of his indignation, a sending forth by evil angels"; and as it is written of Saul in the books of Kingdoms: "And the Spirit of the Lord departed from Saul, and an evil spirit from the Lord choked him"; and as it is reported in the book of Judges: "And God sent an evil spirit between Abimelech and the men of Shechem." This evil spirit, then, who is said either to have gone forth to choke Saul, or to set Abimelech and the Shechemites at odds, and is recorded to have gone forth and been sent from the Lord, is to be understood as a kind of executioner sent to exact punishments from sinners. And although they are called evil on account of their own purpose and will, nevertheless in the case of those who are worthy of punishment they render service to the divine will — like that lying spirit of whom the prophet Micaiah reports, who, when it had been said by God, "Who will seduce Ahab for me?" answered: "I will seduce him. And the Lord said: By what means? And he said: I will be a lying spirit in the mouth of all the prophets," and I will say that he should go up to Gilead, and there he will fall. "And the Lord said: Go; you shall seduce him, and indeed you shall prevail." Thus, then, even those who are called evil spirits perform a service for God in the matter of punishments. There are besides other spirits also, of whom David says: "With a violent wind you shall shatter the ships of Tarshish"; and there are said to be "spirits of the tempest" and "a spirit of burning heat." These, however, I should call material rather than rational spirits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
