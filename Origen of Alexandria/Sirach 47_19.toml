[[commentary]]
quote='''
If you read again the things that are written concerning Solomon, you will find that he, and indeed although he was most wise, inclined his loins to many women, though the law of God says: "You shall not multiply women for yourself, lest perhaps they make you commit fornication away from your God." He, then, although he was most wise and of enormous merits before God, yet because he gave himself over to many women, was deceived. I think that "many women" is the name for many doctrines and the diverse philosophies of many nations. And when, as a most learned and most wise man, he wished to recognize and thoroughly examine each of these, he could not hold himself within the rule of the divine law, but Moabite philosophy deceived him and persuaded him to sacrifice to the Moabite idol, and likewise of the Ammonites, and also of the remaining nations, whose women he is said to have received and to have built temples or sacrificed to their idols. It is, then, a great thing and truly a work of God to be mingled with many doctrines as with women, and yet not to turn aside from the rule of truth, but constantly to say: "There are sixty queens and eighty concubines, and young maidens of whom there is no number; yet my dove is one, my perfect one is one; she is the only one of her mother, the only one of her that bore her."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily20.html'
source_title="HOMILIES ON NUMBERS 20.3"
