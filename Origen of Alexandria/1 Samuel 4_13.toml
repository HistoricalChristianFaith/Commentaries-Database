[[commentary]]
quote='''
Eli was pious in himself; for he was not anxious primarily about the salvation of his children, but about the ark, lest it should come to be under the foreigners — which indeed also happened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FFragments%2520on%2520Kingdoms.html'
source_title="FRAGMENTS ON KINGDOMS 2"
