[[commentary]]
quote='''
But also, when she has become worthy that it may be said of her as it was said of Moses, that "Moses spoke, and the Lord answered him," then is fulfilled in her that which He says: "Make me hear your voice." … But a great praise of her is shown in what is said: Your voice is sweet. For thus the most wise prophet David spoke: "May my discourse be sweet to him." And the voice of the soul is sweet when it speaks the word of God, when it expounds concerning faith and the doctrines of truth, when it explains the dispensations of God and his judgments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FBook%25204.html'
source_title="COMMENTARY ON THE SONG OF SONGS, BOOK 4"

[[commentary]]
quote='''
But that an answer signifies not the alternation of conversing but teaching in the holy scriptures, let the divine law teach you. "Moses spoke, and God answered him by a voice". That answer was concerning the matters about which the Lord was instructing the ignorant Moses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily18.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 18"
