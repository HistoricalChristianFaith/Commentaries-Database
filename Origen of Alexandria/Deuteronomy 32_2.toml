[[commentary]]
quote='''
Let us therefore seek in the Scriptures what is the "rain" which is given to the saints alone and concerning which "it is commanded to the clouds that they rain not this rain" upon the unjust. What then this "rain" is, Moses himself, the lawgiver of these things, teaches us. For he himself says in Deuteronomy: "Attend, O heaven, and I will speak, and let the earth hear the words from my mouth; let my utterance be awaited as rain". Are these my words? Do we by rhetorical arguments violently bend the sense of the divine law? Is it not Moses who says that what he speaks is "rain"? "Let my utterance", he says, "be awaited as rain, and let my words come down as dew, as a shower upon the grass, and as snow upon the hay". Attend diligently, O hearer, lest you think we do violence to the divine Scripture, when, teaching the church, we say that either waters or showers or other things which seem to be said bodily are to be understood spiritually. Hear Moses, how he now names the word of the law "rain", now calls it "dew", now "shower", now even says "snow".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily16.html'
source_title="HOMILIES ON LEVITICUS 16"
