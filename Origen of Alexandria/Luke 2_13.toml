[[commentary]]
quote='''
But if we would rise to a more hidden meaning, I should say, that there were certain shepherd angels, who direct the affairs of men, and while each one of them was keeping his watch, an angel came at the birth of the Lord, and announced to the shepherds that the true Shepherd had arisen. For Angels before the coming of the Saviour could bring little help to those entrusted to them, for scarcely did one single Gentile believe in God. But now whole nations come to the faith of Jesus.

But in a mystery, the Angels saw that they could not accomplish the work committed to them without Him Who was truly able to save, and that their healing fell short of what the care of men required. And so it was as if there should come one who had great knowledge in medicine, and those who before were unable to heal, acknowledging now the hand of a master, grudge not to see the corruptions of wounds ceasing, but break forth into the praises of the Physician, and of that God who sent to them and to the sick a man of such knowledge; the multitudes of the Angels praised God for the coming of Christ.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
From this it is shown that, according to the likeness of the legions of worldly warfare, there are also legions of angels of the heavenly warfare, warring against the legions of the demons dwelling in the tombs. For in Luke too "a multitude of the heavenly host" was heard "praising God" on account of Christ's nativity. But if "there was a multitude of the heavenly host praising God", and all warfare is understood to be established on account of adversaries, consequently that host too wars for God on account of adversaries. But Jacob also called a certain place the "camp" of the Lord, since he beheld there the warfare of angels; and wherever there are those who fear God, around them are the camps of angels; for "the angel of the Lord shall send [a host] round about those who fear him and shall deliver them", as the book of Kingdoms relates was the case also around Elisha.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252026.html'
source_title="COMMENTARY ON MATTHEW 102"
