[[commentary]]
quote='''
But where shall I find on a sudden the divine Scripture which may teach me what the "oven" is? I must call upon my Lord Jesus, that he may make me who seek to find, and open to me who knock, so that I may find in the Scriptures the "oven" where I may cook my sacrifice, so that God may receive it. And indeed I think I have found it in the prophet Hosea, where he says: "all committing adultery, like an oven heated for burning", and again: "their hearts," he says, "grew hot like an oven". The heart of man, then, is the "oven". But this heart, if vices set it ablaze or the devil inflames it, will not cook, but will burn up. But if he set it ablaze who said: "I came to cast fire upon the earth", then the loaves of the divine Scriptures and of the words of God, which I receive in my heart, I do not burn up to destruction, but cook for a sacrifice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily05.html'
source_title="HOMILIES ON LEVITICUS 5"
