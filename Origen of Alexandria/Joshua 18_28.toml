[[commentary]]
quote='''
I pass from the letter—since even it has taken a way which the Word has given—to each soul already made worthy to see peace. For after divine studies, you have become Jerusalem, the prior place being Jebus. History says that the name of that place had been Jebus, but afterwards the name changed and became Jerusalem. The children of the Hebrews say that Jebus is interpreted as "what has been trampled." Jebus then is the soul which is trampled by hostile powers, has been changed and has become Jerusalem, vision of peace. If then you have sinned, when you have changed from Jebus to become Jerusalem, and you have trampled upon the Son of God and held as profane the blood of the new covenant as she had, and you have ended up in grievous sins, it will also be said concerning you, who will spare you, Jerusalem? And who will feel sorry for you if you become someone who betrays Jesus? When each of us sins, and especially if he sins grievously, he sins against Jesus. But if he is also an apostate, he does spiritually even more to Jesus the things that Jerusalem did to him bodily.
'''
source_url='https://www.google.com/books/edition/Homilies_on_Jeremiah_and_1_Kings_28/UFInXpKNapEC?hl=en&gbpv=0'
source_title="HOMILIES ON JEREMIAH 13.2"


[[commentary]]
quote='''
In imitation, therefore, of these things, it must be believed that here too Scripture reports that lots are drawn through Jesus and that the inheritance is decreed for each single tribe by the divine dispensation, and that through the ineffable providence and foreknowledge of God there is foreshadowed in these lots the pattern of the future inheritance in the heavens. Since indeed "the law" is said "to have a shadow of the good things to come," and, as the Apostle says concerning those who have come to the Lord Jesus Christ, that: "you have come to Mount Zion and to the city of the living God, the heavenly Jerusalem," there is in the heavens some "city" which is called "Jerusalem" and "Mount Zion," it is surely not without cause that Benjamin received in his lot "Jerusalem" and "Mount Zion"; unless it be that the plan of that "heavenly Jerusalem" without doubt required this, that the earthly "Jerusalem"—which preserves the figure and form of that heavenly one—ought to be given to none other than Benjamin. And likewise concerning "Bethlehem" it must be said that it is not without a certain sure reason decreed in the lot of Judah, or that "Hebron" or the other single cities are assigned in writing to each single tribe, except that, as we have said, those heavenly places—in which both "Jerusalem" and "Zion" are named to be—without doubt, and the rest of the places also which are near or joined to these, contained in themselves this cause and reason in the heavens which was governed by lot to be distributed on earth. Hence, then, it is that the divine wisdom dispensed that certain names of places be written in the Scriptures which contain a certain mystical interpretation, through which it is indicated to us that these things are dispensed to be done by certain fixed reasons and not by accident or by chance. For just as it must not be thought that it happened by chance, for example, that that angel was called Michael, but another Gabriel, and another Raphael, and—to come down to human matters—just as it was not by chance that that patriarch was called Abraham and that one Isaac, and another Israel, but not even among the women did it happen by accident, but by a fixed and divine reason, that she was called "Sarah" from "Sara," or that man "Israel" from "Jacob," or that man "Abraham" from "Abram," and as it is certain that each one, whether of the angels or of men, is allotted his very names from the offices and acts which are enjoined upon him: so it follows that there are also certain heavenly places and cities—just as the "heavenly Jerusalem" is called, and "Zion"—that there are also others, of which these that are on the earth contain the type and image, which now in this Scripture are mystically designated to us through Jesus son of Nave. And concerning these very cities I think it was said: "the cities of Judah shall be built, and they shall dwell there and shall inherit it." Concerning these also the Lord and Savior says that: "there are many mansions with the Father." And concerning these very cities it must be believed that the Lord says to that servant who had traded well: "have power over ten cities" and to another: "over five cities." — These things concerning the division of the lots of the land of Judah we have dared to bring forth to you, so far as was permitted, at the prompting of Scripture, which calls "Jerusalem heavenly and Mount Zion" and the rest which are likewise written to be "in the heavens"; which gave us occasion to perceive concerning all these things that heavenly mysteries are described in them. And therefore we say to you, do not read these things with disdain and do not think that some Scripture is worthless because it is thickly sown with many namings of names; but rather know that ineffable mysteries are contained through these, greater than either human speech can bring forth or mortal hearing can hear; which, as I judge, cannot be worthily and completely explained not only by me, "the least," but not even by those who are far better than I. And I do not know whether they are fully and completely brought forth even by the holy Apostles themselves; I did not say that they are not fully known, but that they are not fully brought forth. For it is certain that these things were known and completely grasped by him "who was caught up even to the third heaven," who indeed, being placed in heaven, saw the heavenly things, saw "Jerusalem," the true "city of God," saw there also "Mount Zion," in whatever place it is, saw also "Bethlehem," saw also "Hebron," saw also all those things which are here written to be divided by lot; and he not only saw, but also comprehended their reasons in the spirit, since he himself confesses "that he heard words and reasons." But what words? "Ineffable ones," he says, "and which it is not permitted to men to speak." You see, then, that Paul knows all things and comprehends them in the spirit, but it "was not permitted" to him to bring these forth "to men." To what "men"? Without doubt to those concerning whom he said reproachfully: "are you not men, and do you not walk according to man?" But he was perhaps speaking these things to those who now did not "walk according to man"; he was speaking these things to Timothy, he was speaking to Luke and to the rest of the disciples, whom he knew to be capable of the "ineffable" sacraments. Finally, in a mystery too he admonished Timothy of something of this kind, saying: "be mindful of the words which you have heard from me, which commend to faithful men and to those who are fit also to teach others." So, then, believing these things to be divine and mystical, let us prepare ourselves by life, faith, deeds, and merits to be worthy and fit for the capacity of them, so that, when they have been worthily understood by us, we may also deserve to attain them by inheritance in the heavens, in Christ Jesus our Lord, "to whom is glory and dominion unto the ages of ages. Amen!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily23.html'
source_title="HOMILIES ON JOSHUA 23.4"
