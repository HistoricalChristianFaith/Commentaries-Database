[[commentary]]
quote='''
But let us see with what kind of prayer Hannah, that is, grace, consecrates him to God. For we shall observe something new in the very beginnings. For she says: "And Hannah prayed, and said." And nowhere do I find her, as it were, praying to God, or speaking, except through two words only, where she says: "I rejoiced in thy salvation," and the other: "Because there is none beside thee." But the beginning has it thus: "My heart exulted in the Lord." She did not say, My heart exulted in thee. For if it were a prayer, it were consistent to speak thus: My heart exulted in thee. And again in the following verse of hers she says: "My horn was exalted in God." She did not say: My horn was exalted in thee, but in God. "My mouth was enlarged over my enemies, because I rejoiced in thy salvation." One utterance, as I said, contains a prayer: "I rejoiced in thy salvation," and in what follows she does not say that there is none holy but thou, but, "There is none holy as the Lord," and, "There is none beside thee." This utterance does not seem to have kept the order of prayer. But at the very last, in the manner of a long supplication, she introduces even certain agitations, saying: "Do not multiply to speak evil things, neither let evil-speaking come out of your mouth, because the Lord is strong in knowledge." In which she does not even seem to be any longer speaking to the Lord. What, then, shall we say of these things? When I once read in the Apostle that he said: "Pray without ceasing," I asked whether this precept could possibly be fulfilled. For who can never cease from prayer, so that he has no time either for taking food or drink? Since indeed, if these things be done, prayer seems to have to be interrupted. But neither does prayer, commonly understood, grant, according to this precept, leave for sleeping or for doing anything else of human use. Let us see, then, whether perhaps all the acts of him who is engaged in the divine office, and all the deeds or words which he does and speaks according to God, are reckoned toward prayer. For if prayer be understood as only that which we commonly know, then neither will Hannah seem to have prayed in these words, and never can any of the righteous, according to the Apostle's precept, pray without ceasing. But if every act of the righteous man, which he does according to God and according to the divine commandment, is reckoned prayer, then, because the righteous man without ceasing does the things that are righteous, through this the righteous man will pray without ceasing, nor will he ever cease from prayer unless he cease to be righteous. For when we do something unrighteous or offend, it is certain that at that time we also cease from prayer. I think that we are taught this too in the Psalms, when it is said: "The lifting up of my hands is an evening sacrifice." For I do not think that, if anyone should lift up or stretch out his hands to heaven (as is wont to be the posture of those who pray), he has straightway offered a sacrifice to God. But let us see whether perhaps this is what the word of God there indicates, that by the hands works are understood. He lifts up his hands who lifts up his acts from the earth, and whose conversation, while yet he walks on earth, is in the heavens. Lofty acts, therefore, and sublime, which men seeing magnify the heavenly Father, are called the lifting up of the hands, and an evening sacrifice. Was not this too taught through a mystery in the Law, when, as Moses lifted up his hands, Israel was conquering; but when he let them down and cast them downward, Amalek was conquering? And if "all these things happened to them figuratively, but were written for our sakes, upon whom the ends of the ages have come," then we ought to understand that, so long as the servant of God lifts up his acts to God, the people of God conquers: but when he has cast down and let down his hands, that is, his acts, Amalek, the enemy of God, conquers. Or what does it seem? (for I wish to linger a little with those who are unwilling to understand these things spiritually, but according to the letter) is it to be supposed that the omnipotent God was looking to the hands of Moses, and if indeed he saw them lifted up on high, would give the victory to Israel; but if cast down below, to the Amalekites? Is it thus worthy to think concerning the words of the Holy Spirit? Or is this rather to be supposed, that he was prefiguring future mysteries in these things? Which indeed, that they are to be understood of the sacrament of the cross and of the affixing of the Savior's hands, is now commonplace, and has often been discoursed of by many. But since he who lives according to the Gospel is always bidden to be renewed, and the New Testament ought always to be illustrated by new meanings, and we are bidden to sing to the Lord a new song, and our inner man (Paul did not say that it is renewed and stands still, but "is renewed from day to day")—it was fitting that we too should explain, both concerning the manner of prayer, how one is to pray without ceasing, and concerning the lifting up of the hands, which is called an evening sacrifice, not only by the usual and worn-out expositions, but also by somewhat renewed ones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.9"


[[commentary]]
quote='''
Let us see, then, what this reasoning of Hannah's prayer means, which if we shall have learned, perhaps we too shall be able to pray likewise. "My heart, it says, exulted in the Lord." Necessarily she added: "In the Lord." For there is an exultation which is not in the Lord, as that too is said: "Rejoice in the Lord." For a man can rejoice in carnal things, and not in the Lord. For if I rejoice because I have found a visible treasure, that is a joy of the flesh, and not in the Lord. If I rejoice because men praise me, and perhaps not according to desert, this is not to rejoice in the Lord. If I rejoice in things frail and perishing, all these have no praiseworthy joy. But if I rejoice because I have been held worthy to suffer injury for the name of the Lord, that joy is in the Lord, because he himself said concerning these things: "Rejoice and exult, because your reward is great in the heavens." If I rejoice when unjust hatreds are exercised against me, if I rejoice when I am assailed on account of the word of God, if I rejoice when I am chastised in ailments, in persecutions, in straits—if I receive all these things gladly, that joy is in the Lord. And therefore the Scripture teaches us that, casting away earthly joys, frail and perishing, we should exult in the Lord over eternal joys, so that we may deservedly say what Hannah said: "My heart exulted in the Lord." And since, while these things are being said, a certain one of the bystanders has been filled with an unclean spirit, and has cried out so that there was a running-together of the people, let us too say with Hannah, who says: "My heart exulted in the Lord." The contrary spirit could not bear our exultation in the Lord, but wishes to change it, so that, this being taken away, it may introduce sadness, and prevent us from saying, "My heart exulted in the Lord." But let us not be hindered, but rather more and more say: "My heart exulted in the Lord:" and for this very thing, that we see the unclean spirits scourged, let us rejoice, because through these things too many are converted to the Lord, many are amended, many come to the faith; and there is nothing that the Lord does without cause, nor does he permit anything to be done in vain. For since there are many who do not believe the word, nor receive the reason of the teaching, when the demon has leaped upon them, then they are converted, so that where the offense abounded, grace may superabound: and where the malign power has worked, there afterward the grace of the Lord may work the more: because when the grace of the Lord has expelled the malign spirit, it introduces the Holy Spirit: and the soul which had been filled with an unclean spirit is afterward filled with the Holy Spirit. Therefore for all these things let us say: "My heart exulted in the Lord. And my horn was exalted in my God." There are certain horns of the righteous which they use either in doing something or in speaking, as when they say: "In thee we will toss our enemies with the horn." In the Greek it is said keratioumen, which is, We will strike with the horn, or, We will toss. But elsewhere too it is said: "And the horns of the righteous shall be exalted." We ought, therefore, to have those horns, which are conferred on the righteous, for just causes, by the points of the cross of Christ, so that with them we may destroy and cast down the adversary powers from our soul, which being laid low and expelled, a vineyard may be able to be planted in us, because "a vineyard was made to the beloved on a horn, in a fruitful place." Exalted, therefore, is the horn both of this righteous grace, and of every righteous man, in the Lord. "My mouth was enlarged over my enemies." It is written: "Enlarge thy mouth, and I will fill it," and now this righteous woman says: "My mouth was enlarged." If I have been made fit and strong in the word, and mighty in wisdom, so that not with narrow assertions, but with enlarged and abounding ones, I may be able to confute every knowledge that exalts itself against the faith and truth of Christ: or when, reproving the unbelief or perfidy of the Jews, out of the Law and the prophets I shall have shown Christ Jesus, and in all things I shall be able to refute the enemies of the truth: then worthily I too can say: "My mouth was enlarged over my enemies." If Basilides should stir up a contest with me, and I should vehemently crush him: if a disciple of Valentinus should meet me and toss me with questions, and I should come forth victor from this contest: if, these being laid low, Marcion should meet me, and he too should depart overcome: "My mouth was enlarged over my enemies." If, these being confuted, the philosophers should meet me, insulting the simplicity of our faith, and clamoring that we are ignorant and unlearned, and I should turn also to them, and with the powers of true wisdom should scatter the mist of false and painted wisdom, and should destroy not only the wisdom of this world, but even of the princes of this world, then more fully is my mouth enlarged over my enemies. This voice, therefore, is of the holy and perfect man, who by the very facts and by the truth can utter a discourse of this kind resting on solid ground, and say: "My mouth was enlarged over my enemies." We ought, therefore, first to enlarge our mouth, so that God may fill it. But how do we first enlarge the mouth? By the meditation of the divine word, so that we may be able to advance so far as to come from the enlargement of the mouth even to the enlargement of the heart, and to say with the Apostle: "My heart is enlarged toward you, O Corinthians." For out of the breadth of the heart abundance is ministered to the wise mouth.
'''
