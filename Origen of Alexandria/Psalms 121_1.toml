[[commentary]]
quote='''
But he who flees ought to know also the place to which he ought to flee, and to pray also on account of the time, that he flee not at that time which is adverse to flight. The places, then, for those who flee will be the mountains, which Christ points out, saying: "then let those who are in Judea flee to the mountains". And let him who flees to those mountains say the Psalm of degrees which runs thus: "I have lifted up my eyes unto the mountains, whence help shall come to me". And for this reason he lifts up his eyes to the mountains: because he knows the abundance that is in those mountains; therefore he says: "its foundations are in the holy mountains". And if he flees to the mountains which the Lord commanded, he will come to the holy place, in which, being made and seeing that great vision, he will say what was said: "Passing over, I will see this great vision". And whoever is of this kind will hear: "Loose the sandal of your feet, for the place on which you stand is holy ground". Therefore let those "flee to the mountains" who flee according to God's command.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252024.html'
source_title="COMMENTARY ON MATTHEW 44"
