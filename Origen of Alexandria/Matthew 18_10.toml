[[commentary]]
quote='''
The bodies of people differ from each other in size, so that some are short, some are tall, and some are in between. Again the short are different in their shortness since they are more short or less short, and the same likewise of the tall, and again of those in between. So it is also in human souls, it seems to me: There is something which distinguishes their shortness, and again, so to speak, their tallness, and, again analogous to the bodily differences, their moderateness. But the bodily difference does not depend on the individuals themselves but on the nature of the seed. So this person becomes tall, that one short and another in between. But with our souls, our own agency that is our actions and our character causes one to be large or small or belonging to those in the middle. And it is in our power whether we grow in stature and receive an increase in size or do not grow and remain small. For we must believe that to attain to manhood and mature manhood at that depends on the person within: passing out of the times of childhood and advancing to manhood and putting aside the stuff of childhood and perfecting the stage of manhood. Just so we must suppose that there is still some measure of spiritual growth to which the most perfect soul can advance in glorifying the Lord and so become great.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FIntroduction.html'
source_title="COMMENTARY ON MATTHEW 13.26"

[[commentary]]
quote='''
The little ones are those that are but lately born in Christ, or those who abide without advance, as though lately born. But Christ judged it needless to give command concerning not despising the more perfect believers, but concerning the little ones, as He had said above, If any man shall offend one of these little ones. A man may perhaps say that a little one here means a perfect Christian, according to that He says elsewhere, Whoso is least among you, he shall be great. (Luke 9:48.)

But this exposition does not seem to agree with that which was said, If any one scandalizes one of these little ones; for the perfect man is not scandalized, nor does he perish. But he who thinks this the true exposition, says, that the mind of a righteous man is variable, and is sometimes offended, but not easily.

Some will have it that an Angel is given as an attendant minister from the time when in the laver of regeneration the infant is born in Christ; for, say they, it is incredible that a holy Angel watches over those who are unbelieving and in error, but in his time of unbelief and sin man is under the Angels of Satan. Others will have it, that those who are foreknown of God, have straightway from their very birth a guardian Angel.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Thus I understand also that which is said in the Gospel: "do not despise one of these least ones", who are in the Church. "Least" there is understood in distinction from the greater. I am not commanded not to despise the one who is great, because he who is great cannot be despised, but it is said to me: "do not despise one of the least". And that you may know that "least" and "little" is not said by chance, but with the reasoning we have set forth, it is written: "whoever shall scandalize one of these least ones". The "least" one is scandalized; the great one cannot sustain a scandal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily04.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 4"

[[commentary]]
quote='''
Of the good ones also the Savior makes mention, saying: "Their angels always see the face of my Father who is in heaven". At the same time inquire whether the angels of the little ones in the Church "always see the face of the Father", and whether the angels of others do not have the liberty to gaze upon the face of the Father. For it is not to be hoped that the angels of all men always see "the face of the Father who is in heaven". If I belong to the Church, however least I may be, my angel has the liberty and the confidence always to see "the face of the Father who is in heaven". But if I am on the outside and not of that Church "which has no spot or wrinkle or any such thing", and by the very fact am proved to be a stranger to such a congregation, my angel does not have the confidence to look upon "the face of the Father who is in heaven". For which reason the angels are anxious on behalf of the good, knowing that, if they govern us well and lead us through to salvation, they themselves also have the confidence to see "the face of the Father". For just as, if by their care and diligence salvation is procured for men, they gaze always upon "the face of the Father", so, if through their negligence a man has fallen, they are not unaware that it is a matter of their own peril as well. And just as a good bishop and an excellent steward of the Church knows that it is to his own merit and virtue if the sheep of the flock entrusted to him have been kept safe, so understand it also of the angels. It is a disgrace to an angel if the man entrusted to him has sinned, just as, on the contrary, it is a glory to an angel if the one entrusted to him — even the least in the Church — has made progress. For they will see, not sometimes, but "always the face of the Father who is in heaven", while others do not always see it. For according to the merit of those whose angels they are, the angels will contemplate the face of God either always or never, or little or more.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily35.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 35"
