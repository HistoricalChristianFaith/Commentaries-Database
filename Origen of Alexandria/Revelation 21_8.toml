[[commentary]]
quote='''
But do you wish to see of how great a crime the "timid and fearful" man is guilty? In the Apocalypse, where those are enumerated who are to be cast "into the lake of fire", there before all He places the "timid and fearful", and reckons together with them also the "unbelieving and fornicators and poisoners". Thus among enormous and abominable crimes is placed the crime of fear and dread.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily09.html'
source_title="HOMILIES ON JUDGES 9"
