[[commentary]]
quote='''
For these "eighteen years" of servitude also passed, and it is not recounted that "they cried out to the Lord" or were converted from their wickedness, but after eighteen years it is again said that: "the children of Israel cried out to the Lord, and the Lord raised up for them a Savior, Ehud the son of Gera, the son of Gemini, a man ambidextrous." Behold what manner of man this is who is raised up to save Israel! He has nothing left-handed in himself, but has both hands as a right hand; for this is what is meant by "ambidextrous." Truly a worthy leader of the people and judge of the Church, who does nothing left-handed, whose "right hand knows not what his left hand does," who is right-handed on either side — right-handed in faith, right-handed in deeds — who has nothing of those who are placed "on the left," to whom it is said: "depart from me, you workers of iniquity, I know you not; go into the eternal fire which God has prepared for the devil and his angels." And if in such matters it is permitted to presume from what is similar, I think that according to the spiritual understanding all the saints too are called "ambidextrous," and on the contrary the devil and his princes, if it may be said, are called ambi-sinistrous. For all that they do is left-handed, all perverse, all consigned to the eternal fire together with those who are "on the left."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily03.html'
source_title="HOMILIES ON JUDGES 3"
