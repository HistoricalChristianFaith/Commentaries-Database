[[commentary]]
quote='''
After these things, when he had enumerated very many nations, he said concerning the Sidonians alone: "and all the Sidonians, I myself will exterminate them from the face of the children of Israel." The "Canaanites" too were named, and those also were named who are "over against the face of Egypt," and those who are "from the borders of Ekron" and from the left parts of the rivers, and very many other nations; and concerning the Sidonians alone the Lord says that he "will overthrow" them. Now the "Sidonians," as we have already said before, are interpreted as hunters. Who then are understood to be these evil hunters, whom the Lord "exterminates," if not those adverse powers, concerning whom the prophet says that "they have prepared snares for my feet"? — with which, namely, they hunt and entrap souls unto sin. These, then, the Lord "exterminates"; for if such hunters as these shall have perished, when there is no longer anyone to "stretch out snares" and nets to entrap souls in sin, then "each one shall rest under his own vine and under his own fig tree."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily16.html'
source_title="HOMILIES ON JOSHUA 16.4"
