[[commentary]]
quote='''
Since therefore each of the prophets, or even of the Apostles, has given counsel to those who transgress, by which they may be able to correct or amend their sin, they will rightly be seen to have sold rams to these for sacrifice. But what price do they take from those who purchase? That, I suppose, the zeal of reading, the vigils of hearing the words of God, and above all I think the most worthy price is obedience, concerning which the Lord says: "I prefer obedience to sacrifice, and a hearing of the word rather than whole burnt offerings."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily04.html'
source_title="HOMILIES ON LEVITICUS 4"
