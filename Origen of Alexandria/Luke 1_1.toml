[[commentary]]
quote='''
(Hom. i. in Luc.) The effect upon his own mind, St. Luke explains by the expression, of the things which have been fully accomplished among us, i. e. have had their full manifestation among us, (as the Greek word peplerophoremenon signifies, which the Latin cannot express in one word,) for he had been convinced of them by sure faith and reason, and wavered not in any thing.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Just as of old among the people of the Jews many laid claim to prophecy, and some were false prophets — of whom one was Hananiah, the son of Azor —, while others were true prophets, and there was in the people the grace of discerning spirits, by which some were received among the prophets, while a few were rejected as though by "the most experienced money-changers", so also now, in the new covenant, "many have attempted" to write gospels, but not all have been received. And that you may know that not only four gospels, but very many, have been composed, out of which these that we have were chosen and handed down to the churches, let us learn from the very preface of Luke, which runs thus: "Forasmuch as many have attempted to set in order a narrative". In this that he says, "they have attempted", there lies a hidden accusation of those who, without the grace of the Holy Spirit, leapt forward to write gospels. For Matthew and Mark and John and Luke did not "attempt" to write, but, filled with the Holy Spirit, they wrote the gospels. "Many" therefore "have attempted to set in order a narrative concerning those things which have been most clearly known among us". The Church has four gospels, heresy has very many, of which one is written according to the Egyptians, another according to the Twelve Apostles. Basilides too dared to write a gospel and to entitle it with his own name. "Many have attempted" to write, but only four gospels are approved, from which the doctrines concerning the person of our Lord and Savior are to be brought forth. I know a certain gospel which is called "according to Thomas", and one "according to Matthias"; and we have read many others too, lest we should seem to be ignorant of anything on account of those who think they know something if they have come to know these things. But in all these we approve nothing else except what the Church does, namely that only four gospels are to be received. This is so, because at the beginning it was read: "many have attempted to set in order a narrative concerning those things which have been confirmed among us". Those men tried and "attempted" to write concerning those things which have been most clearly ascertained by us. Luke indicates his own disposition by the words in which he says: "have been most clearly shown among us", that is "πεπληροφορημένων" (fully assured), which the Latin tongue does not render in a single word. For with sure faith and reason he had come to know them, and he wavered in nothing as to whether it was so or otherwise. But this befalls those who have believed most faithfully and have obtained that which the prophet implores, and who say: "confirm me in your words". Whence the Apostle also says of those who were firm and strong: "that you may be rooted and grounded in faith". For if anyone is rooted and grounded in faith, though a storm arise, though the winds blow, though the rain pour down, he shall not be torn away, he shall not fall, because the building has been founded with solid mass "upon the rock". And let us not think that the firmness of faith, which mind and reason bestow, is given by these carnal eyes. Let all the unbelieving believe in signs and portents which the human eye beholds. But let the faithful and prudent and strong man follow reason and the word, and thus judge what is true and what is false.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily01.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 1"
