[[commentary]]
quote='''
By this death no human soul dies. For if it did die, it would not be punished after death. "They will seek," it is said, "death and will not find it." The souls being punished will seek death. They will rather desire not to be than to endure punishment. Therefore they will seek death and will not find it. In this sense all human souls are immortal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
