[[commentary]]
quote='''
The reason I suppose that Zacharias hastened to speak to his son, was because he knew that John was shortly about to be a sojourner in the wilderness, and that he himself should see him no more.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And you, child, shall be called the prophet of the Most High". Seeking within myself the reason why he prophesies not as though about John, but by speaking to John himself: "and you, child, shall be called the prophet of the Most High", and the rest — for it was superfluous to speak to one who does not hear and to make an apostrophe to a little one and a suckling — I think I can find this: that just as John was born wondrously and came into the world with an angel proclaiming it, and was poured forth upon the earth while Mary lodged three months beside Elizabeth, so also all the things that are written about him are reported to have been done wondrously. But if you doubt that one just poured forth from his mother's womb could hear his father's words and know what this is which is said to him: "and you, child, shall be called the prophet of the Most High", consider that what went before was far more wondrous: "behold, as the sound of your salutation came into my ears, the infant leaped for joy in my womb". For if, while still enclosed in his mother's belly, he heard Jesus and, hearing, leaped up and rejoiced, why should you not believe that once already born he was able both to hear and to understand his father's prophecy, saying to him: "and you, child, shall be called the prophet of the Most High; for you shall go before the Lord, to prepare his ways"? Therefore I think Zechariah hastened to speak to the little one, because he knew that he would after a little while dwell in the wilderness, and that he could not have his presence. "For the child was in the deserts until the day of his showing to Israel". Moses too dwelt in the desert, but only after, when the forty years of his age were completed, he fled from Egypt and for another forty years guarded the flocks of Jethro; John, however, as soon as he was born, passed over to the deserts, and he who "was greater among those born of women" showed himself worthy of a greater nurture. Of him the prophet speaks: "behold, I send my angel before your face". Rightly is he called an angel, who had been sent before the Lord and, as soon as he was born, was able to hear and understand his prophesying father. Wherefore let us, who believe such great wonders, likewise believe in the resurrection, let us believe also in the promises that are to come, of the kingdom of heaven, which the Holy Spirit daily pledges to us. All of which things, as they have been wondrously written, beyond what we are able to perceive, we shall receive in Christ Jesus: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily10.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 10"