[[commentary]]
quote='''
In Proverbs it is said: "for a honeycomb is good, that your throat may be sweetened." Do you suppose the Holy Spirit says this — "eat honey" — of that which is in common use, "for it is good"? I do not dare to say that the Holy Spirit enjoins upon me concerning bodily "honey": "eat honey." Behold, I do not have it, or else I am of such a nature that I cannot "eat honey"; by what reasoning does he say to me: "eat honey," and do not "eat" flesh, but "eat, my son, honey, for it is good"? If you see that the prophets are "bees" and their work "honey" or "honeycombs," then you will see how, in a manner worthy of the Holy Spirit, you may understand "eat, my son, honey, for it is good." If anyone meditates on the divine oracles and is nourished by the words of the scriptures, he fulfills the command that bids: "eat, my son, honey," and, doing what is commanded, he takes possession of the word that follows: "for it is good," because "good" is this "honey" which is found in the scriptures. There is, so to speak, a certain "bee" above the bees; and just as among bees there is a certain king who is named to be king, so the prince of the bees is my Lord Jesus Christ, to whom the Holy Spirit sends me, that "I may eat honey, for it is good, and his honeycombs, that my throat may be sweetened." And perhaps the finer letters will be "honeycombs"; but the "honey" is the understanding that is in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily02.html'
source_title="HOMILIES ON ISAIAH 2"
