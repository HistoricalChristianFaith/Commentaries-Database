[[commentary]]
quote='''
"And it served", it says, "the Baalim, and they forsook the Lord God of their fathers". These things indeed the ancients did, but since the things that are written are said to have been written not for their sake, but "for our sake, upon whom the ends of the ages have come", let us see whether these things may seem to be said in greater part of us than of them. And do you wish to see that not by me, but by the Apostle these things are expounded as being about us? Hear himself what he says: "but in Elijah what does the Scripture say, how he pleads with God against Israel? Lord, they have killed your prophets, they have torn down your altars, and I am left alone, and they seek my life. But what does the divine answer say to him? I have left for myself seven thousand men, who have not bent the knee to Baal" — and he adds: "so therefore", he says, "also at this present time a remnant according to the election of grace has been made safe". You see, then, that those who "bent the knee to the Baalim" and "those who did not bend it" he interprets of the remnant of believers and of the multitude of unbelievers. And this he shows: that those who in the time of the Savior proved unbelieving and impious "bent the knee to the Baalim" and adored idols, but those who believe and fulfill the works of faith "did not bend the knee to the Baalim". For nowhere is it reported in the histories or in the Gospels or in any other writings whatever that anyone in the time of the Savior bent the knee to idols, but assuredly this is said of those who, bound and as it were fettered by their sins, were held fast. Whence it is evident that we too, as often as we sin and "are led captive in the law of sin", "bend our knees to the Baalim". But we were not called to this, nor did we believe for this, that we should again serve sin and again "bend the knee" to the devil, but that we should "bend the knee in the name of Jesus", because "in the name of Jesus every knee is bent, of things in heaven and things on earth and things beneath the earth", and that we should bend "our knees to the Father of our Lord Jesus Christ, from whom all fatherhood in heaven and on earth is named". But what does it profit me if I "bend the knees" of my body to God, coming to prayer, and "bend the knees" of my heart to the devil? For if I do not "stand firm against the wiles of the devil", I have "bent my knees" to the devil. And if I do not "stand" steadfastly "against" anger, I have "bent my knees" to anger. Likewise, if I do not steadfastly resist lust, I have "bent" the "knees" of my heart to lust. And in each single thing that is contrary to God I shall be seen to do this, unless I "stand" steadfastly and bravely, just as those also did who "worshipped the Baalim and forsook the God of their fathers", who "brought them out of the land of Egypt". Let us not therefore suppose that, because we seem not to worship idols, these things for that reason do not pertain also to some of us. Whatever each one worships above the rest, whatever he admires and loves above all things, this is his God. Indeed, this is what before all things and above all things God demands of man by his commandment: "you shall love", he says, "the Lord your God with all your heart and with all your soul and with all your strength" — desiring in a manner to lay first claim to himself upon all the affections of the human mind, and knowing that whatever one "loves with all the heart and with all the soul and with all the strength", this is his God. Let each one now examine himself and silently reckon up from his own heart what flame of love above all else and beyond all things burns hottest in him, what affection is cherished in him more ardent than the rest. Do you yourselves hold judgment concerning these things, weigh them on the balance of your own examination, and if there be anything that outweighs in the scale of love, this is your God. But I fear that in very many the love of gold outweighs, and that the weight of avarice, pressing the scale down enough, sinks it. And to such a one it will surely be said: "you cannot serve God and mammon" — that is, avarice. I fear too in others that the love of lust and pleasure outweighs so far as to sink it to the ground; in others that the love of worldly glory and the desire for human dignity weighs down above all; and I think there are very few who, measuring within themselves their own affections and weighing them in the equal balance of the scale, find that the weight of the love of God outweighs above all other things that are human. I know one who had weighed these things within himself with the utmost scrutiny, and, when he had found that all the affections which were within him inclined to that side where the love of God was, said with all confidence that: "neither death nor life nor angels nor powers, neither things present nor things to come nor height nor depth nor any other creature will be able to separate us from the love of God, which is in Christ Jesus our Lord". But this is Paul, who could so speak these things, because "neither things present nor things to come nor any other creature can separate him from the love of God". But as for us — would that we might say even this, that neither gold nor silver nor the pleasure of the flesh nor the glory of the world and fleeting, temporal dignity, nor bodily delights, nor the favor of children or of a spouse "will be able to separate us from the love of God". Surely let it at least be permitted to us to say with confidence that neither the love of secular literature nor the sophistries of the philosophers nor the deceptions of the astrologers and the feigned courses of the stars, nor the divinations contrived by the stealthy deceit of demons, nor any love of foreknowledge whatsoever, sought through those things which are not lawful, "will be able to separate us from the love of God, which is in Christ Jesus". Or did not the whole error of the heathen take its beginning from this, when they will that those things which men greatly love should be gods, and ascribe the divine name to any human vices and desires? For those greedy for money and burning with the love of avarice call Mammon, as among the Syrians, the god of that greed; the lovers of lust and pleasure ascribe to themselves Venus as the goddess of this vice by which they are driven. Likewise in the other vices too they have made this very affection, by which they are urged on, their God. Whence the Apostle also says the same thing; for he says: "and avarice, which is the worship of idols". You see, then, that not only to adore an idol, but even to be devoted to "avarice" is reckoned "the worship of idols" and slavery. So therefore we too, when we are so given over to certain vices that we "love them with all our heart and with all our soul and with all our strength", are said to adore idols and "to have gone after strange gods".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily02.html'
source_title="HOMILIES ON JUDGES 2"
