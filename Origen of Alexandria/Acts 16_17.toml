[[commentary]]
quote='''
For this reason our Lord Jesus too does not deign to receive testimony from demons, but says: "Be silent and come out of him." His own apostle Paul too, imitating him, "grieving," it says, "turned and said to the spirit of Python: I command you in the name of Jesus Christ; depart from her." In which you may perhaps ask why Paul, grieving, rebukes the spirit of Python. Had it said anything blasphemous? For "a woman," it says, "having a spirit of Python followed Paul and those who were with him, and cried out, saying: These men are servants of the Most High God, who announce to you the way of salvation. And she did this for many days." Whence it is shown that Paul grieved not because of blasphemy, but because he judged it unworthy that testimony be given to his preaching by a spirit of Python.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily16.html'
source_title="HOMILIES ON NUMBERS 16.7"
