[[commentary]]
quote='''
Therefore twelve thousand engage against the Midianites, and "they slay," it says, "all their males; and their kings and Balaam, the son of Beor, they slew with the sword together with the rest of their wounded." That which in the passages above we were inquiring — how it could be proved from the Scriptures that the women of the Midianites, who deceived the sons of Israel into fornicating, had been suborned by the counsel of Balaam — this present passage of Scripture evidently shows, saying that he was slain by the sword as the author of the scandal that was brought upon the sons of Israel. And it is said of him in what follows still more evidently in this way: "and Moses said to them: why have you preserved every woman alive? For it is they who, according to the word of Balaam, made the sons of Israel apostates." And the kings of the Midianites are also slain, and those who were formerly conquered by the women now, expiation being had and repentance performed, conquer even the kings. From this let us understand how much conversion to God avails, how much the amendment of sins profits. Every male, all the kings of the Midianites, are conquered and destroyed by those who through the correction of the Lord and through the repentance for their deeds were corrected and amended. Five kings of the Midianites, therefore, are reported to have been overcome by the Israelite soldiers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily25.html'
source_title="HOMILIES ON NUMBERS 25.2"
