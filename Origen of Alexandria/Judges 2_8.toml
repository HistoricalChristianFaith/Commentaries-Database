[[commentary]]
quote='''
The death of Jesus too has been read to us. That he, indeed, "the son of Nun", "died" is no wonder; for he paid what was owed to nature. But since we had undertaken to refer these things, which were read concerning the son of Nun, to our Lord Jesus Christ, we must see how it may fittingly be said even of him that: "Jesus died". I think — speaking this too, however, according to the authority of Scripture — that in some Jesus lives, but in some he has "died". In Paul Jesus lives, and in Peter, and in all those who can deservedly say: "and now it is no longer I who live, but Christ lives in me". And again he says: "for me to live is Christ, and to die is gain". In such men as these, therefore, Jesus is deservedly said to "live". But in whom has "Jesus died"? In those, without doubt, who by repenting often and again transgressing are said as it were to insult the death of Jesus; concerning whom the Apostle, writing to the Hebrews, says: "crucifying again to themselves the Son of God and holding him up to mockery". You see, then, that in those who sin "Jesus" is said not only to "die", but is even asserted to be "crucified" by them and "mocked". But do you yourself also consider within yourself, whether, when you think of avarice and desire to plunder what belongs to others, you can then say that "Christ lives in me". Or if you think of debauchery, if you are driven by rage, if you are inflamed with spite, if you are goaded by envy, if you rave in drunkenness, if you are lifted up with pride, if you rush on in cruelty — can you in all these say that: "Christ lives in me"? Thus, therefore, "Christ dies" in those who sin, in that righteousness works nothing in them, patience nothing, truth nothing, nor all those things which Christ is. But whatever the saints do, it is Christ who is said to work these things, just as the Apostle also says: "I can do all things in him who strengthens me, Christ". And the Lord himself too gave a most beautiful distinction concerning this in the Gospels, when he says: "whoever confesses in me before men, I also will confess in him before my Father, who is in heaven. But whoever denies me before men, I also will deny him before my Father". You have seen that of those who "confess in himself" he said "he confesses", as one who himself lives in them and works the works of life. But in those "who deny" he did not keep the same likeness of the word, so as to say that whoever denies in me, I too will deny in him, but "whoever denies me before men, I too will deny him before my Father", to show that he who indeed "denies" is outside of himself, whereas he who "confesses" is in himself. Therefore for this reason here too Scripture says that, when "Jesus had died", "there arose another generation after those, who did not know Jesus and the works which he did in Israel".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily02.html'
source_title="HOMILIES ON JUDGES 2"
