[[commentary]]
quote='''
If the law is found to be good, undoubtedly we shall believe that he who gave it is a good God. If, however, it is just rather than good, we shall think of God as a just lawgiver. But Paul the apostle says in no roundabout terms: "The commandment is holy and just and good." It is plain from this that Paul has not learned the doctrines of those [Gnostics] who separate the just from the good. Rather, he had been instructed by that God and illuminated by the Spirit of that God, who is holy and good and just at the same time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25202.html'
source_title="ON FIRST PRINCIPLES 2.5.4"

[[commentary]]
quote='''
But lest anyone should ascribe to the commandment of the law the fact that by occasion of the precept the soul was deceived by sin and slain, the Apostle adds and says: "And so the law indeed is holy, and the commandment holy and just and good." For the commandment is good, and the law is holy. For it enjoins good things, and commands the observance of good things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
