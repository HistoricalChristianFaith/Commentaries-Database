[[commentary]]
quote='''
So the children of Israel go out from Egypt and, setting out from Rameses, they come to Succoth. This order of setting out and the distinction of the stopping-places is exceedingly necessary, and to be observed by those who follow God and who take thought for their advances in the virtues. Concerning this order I remember that we have already treated it elsewhere as well, when for the sake of edification we spoke of certain matters which the Lord deigned to grant; but now too we will briefly recall it again. The first setting out, then, is made from Rameses; and whether the soul, setting out from this world, presses on toward the age to come, or whether it is turned from the errors of life to the way of virtue and to the knowledge of God, it sets out from Rameses. For Rameses, in our tongue, is called "turbulent commotion" or "the commotion of the moth." And in this it is surely shown that all things in this world are set in commotions and disturbances and in corruption; for this the moth signifies. In these the soul ought not to remain, but to set out and come to Succoth. Now Succoth is interpreted "tents." Therefore the soul's first setting out is that it be taken away from earthly commotion and know that it must dwell, as a pilgrim and one making a journey, in tents, so that, thus placed as though ready for battle, it may be able to meet unencumbered and free those who lie in wait against it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.9"
