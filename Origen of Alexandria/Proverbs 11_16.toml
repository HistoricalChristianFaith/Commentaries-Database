[[commentary]]
quote='''
Thanksgiving (εὐχαριστία) is that in respect of which we call certain people gracious (εὐχαρίτους) and charming. One ought, then, not to be a foolish-talker or a jester, but rather gracious (εὐχάριτον) and charming; and since it is unusual to say 'but rather graciousness' (εὐχαριτία), perhaps in place of this the Apostle used the word that is applied to something else and said, but rather thanksgiving (εὐχαριστία). And perhaps it is customary for those of Hebrew descent to use the word 'thanksgiving' (εὐχαριστία) and 'thankful' (εὐχάριστος) in place of 'graciousness' (εὐχαριτία) and 'gracious' (εὐχάριτος); and we supposed that such was also the case with what is said thus in Proverbs, "a thankful (εὐχάριστος) woman raises up glory for her husband", in place of 'a gracious (εὐχάριτος) woman.' But we should have seemed to be forcing the text in taking "a thankful (εὐχάριστος) woman" in place of 'gracious' (εὐχάριτος), had not the remaining editions accorded with this interpretation. For Aquila rendered it thus, "a woman of grace lays hold of glory", while Theodotion and Symmachus, "a woman of grace shall lay hold of glory".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Ephesians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON EPHESIANS FRAGMENT XXIV"
