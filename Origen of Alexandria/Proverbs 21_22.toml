[[commentary]]
quote='''
"The wise man occupied fortified cities and destroyed the stronghold in which the impious trusted." Do you suppose that, when Solomon said these things, he wished to teach us this — that "the wise man captured cities and destroyed strongholds" built of stones? Or does it rather indicate that the city and the walls are the dogmas of the impious and the syllogisms of the philosophers, by which they construct all manner of impious things contrary to the divine law, which are observed among the pagans or the barbarians? But those things too must be reckoned among these, and to be "fortified cities" and set upon mountains, which the heretics place in their assertions from the Scriptures as though upon high mountains. These "cities," then, every "wise man" who preaches the word of truth "has destroyed," and he has overthrown the cities of falsehood with the battering-ram of truth, just as the Apostle Paul also said: "destroying reasonings and every height that exalts itself against the knowledge of God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily18.html'
source_title="HOMILIES ON JOSHUA 18.3"
