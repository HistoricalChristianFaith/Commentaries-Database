[[commentary]]
quote='''
Jordan is the same as descending, for there descends from God a river of healing water. But what parts would John be traversing but the country lying about Jordan, that the penitent sinner might soon arrive at the flowing stream, humbling himself to receive the baptism of repentance. For it is added, preaching the baptism of repentance for the remission of sins.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And "he came into all the country round about the Jordan". For what other places ought the Baptist to have gone around, except those neighboring the Jordan, so that whoever wished to do penance might be at hand for the washing of water? Moreover, "Jordan" is interpreted "descending". And the river "descending" and running with a great rush is God our Savior, the Lord, into whom we are baptized with true water, with saving water. Baptism is preached also "for the remission of sins": Come, catechumens, do penance, that you may obtain baptism "for the remission" of sins. He receives baptism "for the remission of sins" who ceases to sin. For if anyone comes to the washing while sinning, no remission of sins is made for him. Therefore I beseech you, do not come to baptism without caution and careful circumspection, but first show "fruits worthy of repentance"! Spend some time in good conduct, keep yourselves clean from all filth and vices, and then remission of sins will be made for you, when you yourselves also have begun to despise your own sins. Forgive your offenses, and they will be forgiven you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily21.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 21"
