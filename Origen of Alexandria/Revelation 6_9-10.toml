[[commentary]]
quote='''
For who could follow the soul of a martyr, which, having passed over all the "powers of the air," stretches toward the heavenly altar? For there the "souls of the martyrs" are said to be placed "beneath the altar" of God, "crying out" day and night, saying: "How long, O Lord, who art just and true, dost Thou not avenge our blood upon those who dwell on the earth?" For there, being placed, they stand in attendance upon the divine sacrifices. But blessed are they who merit these things. Blessed are they whose heart, when they depart from the world, does not tremble on account of sin, whom no dread of transgressions terrifies as they go on to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily07.html'
source_title="HOMILIES ON JUDGES 7"
