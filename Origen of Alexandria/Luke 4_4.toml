[[commentary]]
quote='''
And at the same time it is shown that this bread, which comes from a stone, is not the word of God which feeds man, of which it is written: "man shall not live by bread alone, but by every word which shall proceed through the mouth of God shall man live". I answer you, O crafty and wicked one, who do not fear to tempt me: there is another bread, that of the word of God, which gives life to man. And at the same time let us see that these things are spoken not by the Son of God, but by the man whom the Son of God deigned to assume; for he answers as though concerning a man and says: "It is written: man shall not live by bread alone", from which it is manifest that it was not God, but man, who was tempted. Sifting the sense of the Scripture diligently, I think I find the reason why John did not describe the temptation of the Lord, but only Matthew, Luke, and Mark. For John, because he had made his beginning from God, saying: "In the beginning was the Word, and the Word was with God, and God was the Word", and could not weave the order of the divine generation, but had only expressed that he was from God and with God, added: "And the Word was made flesh". Furthermore, since God cannot be tempted — and it was of God that his discourse concerned — therefore he does not bring in that one being tempted by the devil. But because "the book of the generation of Jesus Christ" is narrated in Matthew's Gospel concerning that man who had been born of Mary, and in Luke his generation is described, and in Mark it is a man who is tempted, therefore his corresponding answer is reported: "man shall not live by bread alone". If, then, the Son of God, being God, was made man for you and is tempted, you, who are man by nature, ought not to be indignant if perhaps you are tempted. But if, when tempted, you have imitated that man who was tempted for you, and have conquered every temptation, you will have hope together with him who then was a man, but now has ceased to be a man. For he who was once a man, after he was tempted and "the devil departed from him until a time" of death, "rising from the dead dies no more". Every man is subject to death; therefore this one, who in no way dies, is now no longer a man, but is God. But if he is God who was once a man, and you must become like him — when "we shall be like him and shall see him as he is" — it will be necessary that you too become God in Christ Jesus: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily29.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 29"
