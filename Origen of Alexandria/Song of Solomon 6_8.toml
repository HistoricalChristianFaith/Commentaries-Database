[[commentary]]
quote='''
Hence, then, it is that Scripture records that some of the Patriarchs had several wives at once, others took other wives when the former had died; so that this may be figuratively indicated, that certain men can exercise several virtues at once, while others do not begin those that follow before they have brought the former to perfection. Hence, finally, Solomon is reported to have had several wives at once.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily11.html'
source_title="HOMILIES ON GENESIS 11.2"
