[[commentary]]
quote='''
But after these things the firmament now deserves to be adorned also with luminaries. For God says: "Let there be luminaries in the firmament of heaven, that they may give light upon the earth, and divide between day and night." Just as in that firmament, which had now been called heaven, God commands luminaries to be made, that "they may divide between the midst of day and night," so also it can be done in us, if only we too strive both to be called and to be made heaven; we shall have luminaries in us which enlighten us, Christ and his Church. For he himself is "the light of the world," who also enlightens the Church with his light. For just as the moon is said to receive light from the sun, so that through it even the night can be enlightened, so also the Church, having received the light of Christ, enlightens all who dwell in the night of ignorance. But if anyone advances in this so that he now becomes "a son of God," "so as to walk honorably as in the day," as "a son of the day and a son of light": this one is enlightened by Christ himself, as the day by the sun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.5"


[[commentary]]
quote='''
"And let them be for signs and for seasons, and for days and for years; and let them be for giving light in the firmament of heaven, that they may give light upon the earth. And it was made so." Just as these luminaries of heaven which we see are set "for signs and for seasons and days and years," that they may give light from the firmament of heaven to those who are upon the earth, in this way also Christ, enlightening his Church, gives signs through his precepts, so that one may know how, having received the sign, he may flee "from the wrath to come," so that "that day may not seize him like a thief," but that he may rather be able to attain to "the acceptable year of the Lord." Christ, then, is "the true light, which enlightens every man coming into this world," from whose light the Church, being enlightened, is itself also made "the light of the world," enlightening those "who are in darkness," as Christ himself also testifies to his disciples, saying: "You are the light of the world." From which it is shown that Christ indeed is the light of the Apostles, but the Apostles are "the light of the world." For they themselves are "having no stain or wrinkle or anything of the kind," the true Church, as the Apostle also says: "That he might present to himself a glorious Church having no stain or wrinkle or anything of the kind."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.6"
