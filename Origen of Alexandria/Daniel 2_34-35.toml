[[commentary]]
quote='''
But I think this is more rightly to be understood of the incarnation of the Lord. "For it was not made by the hand of men," that is, not by human work is the temple of the flesh built in the Virgin; but, as Daniel had foretold, "a stone cut out without hands grew, and became a great mountain." This is the "sanctuary" of the flesh assumed and "without hands," that is, apart from the work of men, "cut out" from the mountain of human nature and the substance of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily06.html'
source_title="HOMILIES ON EXODUS 6"
