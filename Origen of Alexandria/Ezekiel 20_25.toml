[[commentary]]
quote='''
For as regards the former people, what good or perfect thing could be commanded to those who murmured and contradicted? Indeed, a little later they even turn to idols, and forgetful of the benefits and wonders of God they set up the head of a calf. For this reason, therefore, precepts are given to them, in which they may be tested. Hence it is that also through the prophet Ezekiel the Lord says to them: "I gave you precepts and ordinances that were not good, in which you shall not live by them"; for being tested in the precepts of the Lord they are not found faithful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily07.html'
source_title="HOMILIES ON EXODUS 7"


[[commentary]]
quote='''
We hold, then, that the law has a twofold sense—the one literal, the other spiritual—as has been shown by some before us. Of the first or literal sense it is said, not by us but by God, speaking in one of the prophets, that "the statutes are not good, and the judgments not good"; whereas, taken in a spiritual sense, the same prophet makes God say that "his statutes are good, and his judgments are good."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FAgainst%2520Celsus%2FBook%25207.html'
source_title="AGAINST CELSUS 7:20"
