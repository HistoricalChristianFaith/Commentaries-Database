[[commentary]]
quote='''
This prophecy, therefore, first of all, it says, "sent and called Barak to herself." Now "Barak" is interpreted as "flashing". But a flashing is that which has light indeed, but not lasting; for it shines forth for a little while and ceases. This Barak, therefore, seems to me to bear the figure of the former people, who first of all was called through prophecy and invited to hear the utterances of God and to receive the gifts of the divine law — who indeed shone and flashed in the splendor of the law for a brief time, but did not long endure nor was able to obtain the continuous brightness of the light. When, therefore, Deborah had said to Barak — that is, prophecy to the former people — that: "the Lord God of Israel has commanded you, and do you go up onto Mount Tabor, and take ten thousand men" and the rest that is written, let us see what Barak, in the person of the people, answered to prophecy: "I will not go up," he says, "unless you also go up with me, because I do not know the day on which the Lord will send his angel with me." You see, then, how prophecy delivered to those former ones the utterances of God and says that the commands were given to them, that they should "go up onto the mountain"; but they excuse themselves and say: "I will not go up unless you too go up with me." And as regards the excuse it is indeed true, but as regards the promise it is false. For that they "did not go up" onto the mountain of God is certain; but that they promise they will go up together with prophecy is false. For they did not follow prophecy, so as to believe in him concerning whom all prophecy was written beforehand, Christ. Therefore, then, Deborah says to him: "I will go with you. Nevertheless know that the primacy will not be yours on this way which you tread, but into the hand of a woman the Lord will deliver Sisera." She clearly shows that "the primacy will not be" with that people, nor will the palm of victory abide with it, "but into the hand of a woman," whose name was Jael, "Sisera will be delivered."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily05.html'
source_title="HOMILIES ON JUDGES 5"
