[[commentary]]
quote='''
Here a deeper question arises, and I do not know whether it is fitting to lay bare a matter of such profound mystery and to bring it forth to the crowds—and those crowds who come to the hearing of the word of God only for a few days and immediately depart, nor tarry longer in the meditation of the word of God; yet for the sake of those who are studious and thirst to hear and are able to grasp the spiritual sense, we shall say a few things out of many. Something of this sort, then, can be objected. Suppose Balaam invokes the demons, suppose he curses the people, suppose the invoked demons do what they can: can God not defend the people from the demons and destroy their power in doing harm? What need was there, then, that he himself should come to Balaam and forbid the accustomed demons to approach, lest they even attempt or endeavor to wish to injure his people? To these things, then, although not all that can occur are to be brought forth, nevertheless we shall say in part that God does not wish to condemn the race of demons before the time. For the demons themselves also know that the present age contains their time. For this reason, in fact, they even begged the Lord that he would not torment them before the time, nor send them into the abyss. And on account of this he has not removed the devil from the principality of this age, because there is still need of his work for the perfection of those who are to be crowned; there is still need of his work for the exercises of the contests and the victories of the blessed. So, then, neither does he wish to draw away the rest of the demons violently, before the time, from the intention of their purpose; and therefore from the beginning he did not permit them to be invoked through Balaam, lest perhaps, being invoked, they should be destroyed before the time and be done away with, while God defended his people. For it is one thing if a demon requests from God someone to tempt, as in the case of Job, and receives power over him with a certain distinction—for example, that it be said to him: I give you all his goods into your power, but do not touch him himself; or again: I give you power over him, but guard his soul. And it is another thing if, at a magician's demand and with certain adjurations extorting it, the demons rage without any restriction; in which case, if freedom of will be preserved for them, they will give the people of God over to destruction; but if freedom of will be taken away, this would be to have condemned the rational creature and to have brought judgment before the time and to have hindered all those who, contending against them in the contest, could be crowned. For if freedom of will be taken from the demons, no one further will assail the athletes of Christ; but with no one assailing, there will be no contest, and with the contest removed there will be no reward, no victory. For this reason, therefore, God uses such a way, so that both the people, still untrained and who had newly begun to be drawn away from the worship of demons, may not be handed over to the demons, and responses may be delivered to the invoking magician, and the race of demons may not be stripped of the power of free will. And therefore God comes beforehand and forbids Balaam to go and to invoke the demons for cursing—if only he had ceased from his cupidity. But because he persists in the desire for money, God, indulging the freedom of will, permits him to go again, yet puts his word into his mouth, forbidding the curse to be made through the demons, so that he might give place to blessings, and in place of curses he makes Balaam bring forth blessings and prophecies, which could edify not only Israel, but also the rest of the nations. For if his prophecies have been inserted by Moses into the sacred volumes, how much more were they written down by those who dwelt then in Mesopotamia, among whom Balaam was held magnificent, and of whose art it is established that they were disciples? From him, in fact, the race and institution of the magicians is said to flourish in the regions of the East, who, having written down among themselves all the things that Balaam had prophesied, had this also in writing: that "a star shall arise out of Jacob, and a man shall spring up out of Israel." These things the magicians had in writing among themselves, and therefore, when Jesus was born, they recognized the star and understood the prophecy to be fulfilled—they, rather than the people of Israel, who despised to hear the words of the holy prophets. Those, then, from these things alone which Balaam had left in writing, recognizing that the time was at hand, came and, seeking him out, straightway adored him and, that they might declare their faith to be great, venerated a small child as if a king.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily13.html'
source_title="HOMILIES ON NUMBERS 13.7"
