[[commentary]]
quote='''
"And the children of Israel did what was wicked before God". Almighty God, our ruler, grant that it may never happen to us that Jesus Christ, after he has risen from the dead, should again die in us. For what does it profit me if in others he lives by virtue and in me he dies by the weakness of sin? What does it profit me if in me and in my heart he does not live, and if in me he does not accomplish the works of life? What does it profit me if in another he is nourished and refreshed by good pursuits, by good faith, by good works, but in me and in my heart he is in a manner suffocated and slain by evil thoughts and unspeakable desires, by the worst pursuits? For see what Scripture adds, that: "there arose", it says, "another generation, which did not know Jesus and the great works which he did". That "generation, which did not know" the Lord "Jesus", is the one of "evil thoughts" and the worst desires, which "proceeds from the heart". This is the "generation which does not know" the Lord "Jesus", nor "the great work which he did in Israel". You see that sinners come to such a point that they even forget that "great" and glorious "work which the Lord did", that he was crucified "for our sins, and rose again for our justification". Whence I believe that, fearing this forgetfulness, the Apostle said to his disciple Timothy, whom he held as especially dear: "be mindful that Christ Jesus has risen from the dead". For he knew that of this so great a work, that "he rose from the dead", forgetfulness could come to be, if a sinful generation should arise in the heart. "There did" therefore "what was wicked before the Lord" "another generation, which knew not Jesus" nor the elders.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily02.html'
source_title="HOMILIES ON JUDGES 2"
