[[commentary]]
quote='''
The sixth is the song in the first book of Chronicles, where David appointed Asaph and his brothers at the beginning to praise the Lord, and the beginning of this song is such: "Praise the Lord and give thanks and call upon him in his name, make known his wishes among the peoples, sing to him, and speak a hymn, recount all his devisings which the Lord has made," etc. It must be known, however, that the song which is in the second book of Kingdoms is very like the sixteenth psalm. But that which is in the first book of Chronicles, in its beginnings indeed, up to that place where it says: "And among the prophets do not deal maliciously," is like the one hundred and fourth psalm. But the latter portions, from this place on, bear a likeness to the first parts of the ninety-fifth psalm, where it is said: "Sing to the Lord, all the earth," up to that place where it says: "For he comes to judge the earth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"


[[commentary]]
quote='''
In the first book of Chronicles the psalm praising the Lord attributed to Asaph and his brothers, which begins "O give thanks to the Lord, call on his name," is, for the most part, the same as Psalm 104, down to the words "Do my prophets no harm!" After that it is almost identical to Psalm 95 from the beginning, "Sing to the Lord, all the earth!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FA%2520Letter%2520from%2520Origen%2520to%2520Africanus.html'
source_title="LETTER TO JULIUS AFRICANUS 21"
