[[commentary]]
quote='''
But let us now see what things Balaam declares in the third prophecy. "Balaam the son of Beor has spoken," he says, "the man who truly sees has spoken, he has spoken who hears the words of the Mighty One, who saw the vision of God in sleep, his eyes uncovered." It is truly astonishing how Balaam is held worthy of such great praise, who, having taken up his parable, pronounces these things about himself. For how Balaam should be a man who truly sees—he who devoted himself to divination and auguries, who also pursued magic, as we showed above—is very astonishing, unless perhaps, on account of what was said above, namely that the Spirit of God came to be in him and that the word of God was placed in his mouth, these such great proclamations are thought to have been written concerning him. For neither Moses nor any other of the prophets will easily be found exalted with such great praises. Hence these things seem to me rather to fit that people at the time when, now converted to the Lord, it laid aside the veil which was over its heart—"and the Lord is a Spirit." Therefore, finally, he says: "his eyes uncovered," as of eyes that until now had been closed and now, through the Spirit of God which has come upon him, with the veil removed, are uncovered. Now, then, is when he truly sees and truly hears the words of the Mighty One and sees the vision of God in sleep—that is, those things which were designated at their appointed times in sleep to the prophet Daniel, he will see fulfilled; and those visions which were brought to him in sleep he sees, that is, he understands and recognizes, with his eyes uncovered. For he will be made like those who were saying: "But we all, with unveiled face, beholding the glory of the Lord, are transformed into the same image from glory to glory, as by the Spirit of the Lord." Yet I would wish to inquire what those eyes of his are which are said to be uncovered: lest perhaps they be the very ones which in other passages of Scripture, as we read in certain copies, are called "the eyes of the earth," and that which Paul calls the sense of the flesh, when he says of a certain man: "vainly puffed up by the sense of his flesh." Concerning these eyes I believe the serpent also spoke to Eve: "For God knew that on whatever day you eat of it, your eyes will be opened"; and a little after: "and they ate," he says, "and the eyes of both were opened." For unless there were differences of eyes, and some were those which are opened through transgression, and others those with which Adam and Eve were seeing before these were opened, Scripture would surely never—while those eyes of theirs which were laid open from transgression were not yet opened—say: "And the woman saw that the tree was good for eating and pleasing to the eyes for seeing and beautiful to contemplate, and taking of the tree she ate; and she gave to her husband with her, and they ate. And the eyes of both were opened." For how, if the eyes of both were not yet opened, did the woman see that the tree was good for eating, and that it was pleasing to the eyes for seeing? with which eyes also it is said to have been beautiful to contemplate? But I, hearing the voice of my Lord Jesus Christ and understanding the power of his goodness, thus take note of that which he says: "I came into this world for judgment, that those who do not see may see and those who see may become blind"—that in sinners those eyes which are better do not see, but these which are called the sense of the flesh and which were opened by the counsel of the serpent. It is therefore a magnificent work of our Savior the Lord, that those who do not see with the better eyes the things that are good, but with those which were laid open by the counsel of the serpent behold the things that are evil, should become blind, and that those who have been blinded in those eyes which the serpent's persuasion opened should see the good things of the Lord with these eyes which Jesus our Savior came to open. For unless the sight of evils be first closed, the beholding of good things will not be laid open. So therefore I also take that saying of the good God which he spoke: "Who made the seeing and the blind?"—seeing indeed according to Christ, but blind according to the counsel of the serpent. Now we have called these things to mind so that it might shine forth more evidently which are the eyes that are closed and which are the eyes that are uncovered; at the same time so that from these there might also be understood that which is written in the prophet: "Seeing you shall see and shall not see," that we may know with which eyes they see and with which, seeing, they do not see. It is apparent, therefore, that this Balaam too, because his eyes had been uncovered, says of himself: "the man who truly sees," and says: "he has spoken who hears the words of the Mighty One." For in the same order in which some eyes are closed and others opened, so also some ears are understood to be closed and others to be opened. But if anyone should wish to take these things as said also according to the history, he can say that in this, that "Balaam saw that it was good in the sight of the Lord to bless Israel," his uncovered eyes are shown and that he was made a man who truly sees; for he saw true things which were to come concerning Israel or Jacob. He will say too that he heard the words of the Mighty One in this, when God came to him and said to him in sleep: "The word which I shall give in your mouth, this observe that you may speak"; and this will be the vision of God, which I saw in sleep. And through these things he will assert that his eyes were uncovered, and that he was able to see what he saw. These things indeed concerning those which in his preface Balaam seemed to prophesy about himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily17.html'
source_title="HOMILIES ON NUMBERS 17.3"
