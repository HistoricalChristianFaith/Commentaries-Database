[[commentary]]
quote='''
But do you wish, he says, not to fear the power? Do what is good, and you will have praise from it; for it is God's minister to you for good. But if you do what is evil, be afraid: for not without cause does it bear the sword; for it is God's minister, an avenger in wrath upon him who does what is evil. Paul moves me in these words, in that he calls the worldly power and the judge of this world God's minister; and this he repeats not once, but a second and a third time. I should therefore like to inquire how the judge of the world is God's minister. We find it written in the Acts of the Apostles that the apostles, coming together into one place, established decrees which we who from the Gentiles have believed in Christ ought to observe, in which these things are contained: The apostles and elders to the brethren who are at Antioch, and Syria, and Cilicia, to all who have believed from among the Gentiles, greeting. Forasmuch as we have heard that certain went out from us and troubled you, to whom we gave no such commandment. And after a little it is added: It seemed good, therefore, to the Holy Spirit and to us to lay upon you no further burden of weight, beyond those things which are necessary, that you abstain from things sacrificed to idols, and from blood, and from things strangled, and from fornication; from which if you keep yourselves you will do well. Farewell. In these precepts, then, in which he says that no further burden is to be imposed upon those who believe from among the Gentiles, save that they abstain from things sacrificed to idols, and from blood, and from things strangled, and from fornication, neither is murder forbidden, nor adultery, nor theft, nor the lying of males with males, nor the other crimes which are punished by divine and human laws. But if he says that only those things which he mentioned above are to be observed by Christians, he will seem to have granted them license as regards the rest. But consider the ordering of the Holy Spirit: since indeed the other crimes are avenged by the laws of the world, and it seemed superfluous that those things should now be forbidden by divine law which are sufficiently chastised by human law, he decrees only those things concerning which human law had said nothing and which seemed to pertain to religion. From which it appears that the judge of the world fulfills the greatest part of God's law. For all the crimes which God wills to be avenged, He willed to be avenged not through the prelates and rulers of the Churches, but through the judge of the world; and Paul, knowing this, rightly names him God's minister and an avenger upon him who does what is evil. But what he says concerning the power, Do what is good, and you will have praise from it, seems to me to require a deeper inquiry. For it is not the custom of the powers of this world to praise those who have not been criminals. For they indeed punish those who sin, but they have no custom of praising those who do not sin. But let us see whether perhaps Paul, even when he seems to be teaching moral matters, does not fail always to insert something also about the mysteries. For indeed, knowing that all who have sinned in the law shall be judged by the law — and that in the judgment that law will without doubt convict each one according to how he lived (and we have shown that the Holy Spirit in many things has given place to human law) — it is therefore certain that in the day of judgment he too will have praise with God even from these laws, who has committed nothing against the established laws, when it will be said to him by the Lord: Well done, good and faithful servant, you have been faithful over a few things, I will set you over many things. Yet it must be known that the law is not laid down for the just, but for the unjust and the insubordinate, for the wicked, for murderers, for the defiled, for perjurers, and for the rest who are of this sort. For these are they who fear the law. But he who does good, that is, who does what is good not from fear of the law but from love of the good, that man now lives not under the law of the letter, but under the law of the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
