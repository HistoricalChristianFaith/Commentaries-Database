[[commentary]]
quote='''
He "bound up the wounds, poured in oil mixed with wine", and did not say what is read in the prophet: "there is no salve to lay on, nor oil, nor bandages". This is the "Samaritan" of whose care and aid all who are ill have need — of whose aid especially that man had need who, going down "from Jerusalem", "had fallen among robbers" and, wounded by them, had been left half-alive. And that you may know that it was according to the providence of God that this Samaritan went down, so that he might heal him who "had fallen among robbers", you will be plainly taught from this: that he had bandages with him, oil with him, wine with him — which indeed I think the Samaritan carried with him not on account of this one half-dead man alone, but also on account of others who for various causes had been wounded and were in need of bandages and oil and wine. He had "oil", of which it is written: "that he may make the face cheerful with oil" — without doubt the face of him who had been healed. He heals with "oil", that the swellings of the wounds might be soothed, but also cleanses the wounds with "wine", mixing in something of sharpness, and him who had been wounded he "set upon his own beast", that is, upon his own body, in accordance with the fact that he deigned to take up manhood. This Samaritan "bears our sins" and grieves for us, bears the half-dead man, brings him into the "pandochium", that is, into the Church, which receives all and denies its aid to none, to which Jesus calls all, saying: "Come to me, all you who labor and are burdened, and I will refresh you". And after he had brought him in, he does not at once withdraw, but for one day he perseveres in the inn with the half-dead man and tends his wounds not only in the day but also in the night, bestowing upon him the remainder of his care and diligence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily34.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 34"
