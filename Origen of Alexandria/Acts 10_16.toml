[[commentary]]
quote='''
I take not even this very thing, that these things are said "thrice", as spoken idly. "Thrice" it is both said, and through him to all of us: "what God has cleansed, do not you call common". For the things which are cleansed are not cleansed under one naming, nor under a second, but unless a third naming too be named, no one is cleansed. For unless you have been cleansed in the Father and the Son and the Holy Spirit, you will not be able to be clean. Therefore, then, the things which were shown for cleansing are shown not once nor twice, but "thrice", and "thrice" are they commanded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
