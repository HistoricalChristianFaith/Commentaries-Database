[[commentary]]
quote='''
We received power from believing in Jesus Christ crucified; and however much we fall short in this faith, by so much do we fall short in the power of having in ourselves the things that come from God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT VIII"
