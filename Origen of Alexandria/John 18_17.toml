[[commentary]]
quote='''
Peter had once almost perished and, by the devil breathing through the mouth of "the maidservant of the high priest", had been snatched from the consecration of the apostolic number; but when "Jesus only looked upon him", when He turned toward him the countenance of a placid face, at once, returning into himself and recalling his foot slipped from the precipice, "he wept", it says, "most bitterly", and thus, looked upon by God, by weeping he recovered his place, which by denying he had lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily16.html'
source_title="HOMILIES ON LEVITICUS 16"
