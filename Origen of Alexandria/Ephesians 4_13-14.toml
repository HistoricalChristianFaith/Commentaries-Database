[[commentary]]
quote='''
Two ages are spoken of in the Scriptures: one of the body, which is not in our power but in the law of nature; the other of the soul, which properly lies within us, and according to which, if we will, we daily grow and come to its summit, "so that we may be no longer little children, tossed about and carried around by every wind of doctrine", but, ceasing to be "little children", may begin to be "men" and may say: "when I became a man, I destroyed the things that belonged to a little child". Of this age, as I said, the advancement, which is the increase of the soul, is in our power. But if this testimony is not enough, let us take yet another example from Paul: "until we all attain", he says, "to a perfect man, to the measure of the age of the fullness of the body of Christ". It is in us, therefore, that we should "attain to the measure of the age of the body of Christ"; and, if it is in us, let us strive with all effort to lay aside the little child and to destroy him and to come to the remaining ages.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily20.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 20"
