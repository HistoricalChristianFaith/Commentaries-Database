[[commentary]]
quote='''
Meanwhile spies are sent by Jesus into Jericho and are received by "the harlot" Rahab. These spies, who are sent "before the face" of Jesus, can also be thought to be the angels of God, as it is written: "behold, I send my angel before your face, who shall prepare your ways." Which through others indeed was fulfilled invisibly, but through John visibly; concerning whom this very thing was written. Finally, concerning the baptism of John it is said by the Lord that the scribes and Pharisees did not believe him, but the "harlots" and the "publicans" believed and were baptized. So therefore in this too it is fulfilled, that the "harlot" received the spies of Jesus, through whom she is reported to have been snatched from the destruction of the whole hostile nation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily03.html'
source_title="HOMILIES ON JOSHUA 3.3"


[[commentary]]
quote='''
But let us see at last who this "harlot" is. She is called "Rahab," and "Rahab" is interpreted "breadth." What, then, is breadth, if not this Church of Christ, which has been gathered out of sinners as out of harlotry? And she says: "the place is too narrow for me, make me a place where I may dwell. But who has nourished these for me?", and again, she to whom it is said: "widen your stakes, and stretch out your tents." This, therefore, is the breadth which received the spies of Jesus. I know that once, disputing in a certain church concerning the two harlots, of whom it is written in the third book of Kingdoms, who had come to the judgment of Solomon, of whom one had a "living" infant and the other a "dead" one, I discussed the matter rather carefully and said that that "harlot" was this one, to whom Solomon — not that one, but this one who came "to make peace between the things that are in heaven and the things that are on earth" — ordered the "living" infant to be restored, but that other one, who had the "dead" infant, was either the synagogue of that former people or of those who have declined into heresy. There is also another "harlot" whom in Hosea the prophet is commanded to "take," without doubt as a figure of this one, which has been gathered "out of the nations." Such, therefore, is this "harlot" also said to be, who received the spies of Jesus; but she places them, once received, in the upper regions and establishes them in the lofty and exalted mysteries of the faith. For no one who is sent by Jesus is found lying down below and on the ground, but he remains in the upper regions; and not only does he himself remain in the upper and exalted regions, but that "harlot" too, who received them, is made from a harlot now a prophetess; for she says: "I know that the Lord your God has delivered this land to you." You see how she who was once a "harlot" and impious and unclean is now already filled with the Holy Spirit, and concerning things past indeed confesses, concerning things present believes, and prophesies and foretells concerning things to come. So therefore "Rahab," which is interpreted "breadth," is widened and advances, until "into all the earth her sound goes out." But Japheth likewise is interpreted "enlargement," who indeed himself also bore the pattern of this people "which is saved out of the nations," and Canaan the boy is subjected to him as a servant by his father, and to his brother Shem, who bears the pattern of those who are saved out of the circumcision. In which the kindness and providence of God is to be admired, who, wishing to furnish a remedy to the sinner Canaan and to confer salvation upon him, made him a servant to his brothers, just as Esau too was made to serve his brother Jacob — not indeed that he should perish, but that he should acquire salvation by obeying his betters. For it is granted, as the greatest of gifts, to the evil and to sinners, who know not how to govern themselves, that they should not be entrusted to themselves, but should become servants of the saints and be subject to their betters, so that they may be governed not by their own evil sense, but by the good sense of those others. You see how great is the kindness of the Lord, which he hides and conceals from the ears of the common crowd, and which he covers with rather harsh words, lest perhaps the evil and ungrateful servant become a despiser, when he has understood the exceeding goodness of his Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily03.html'
source_title="HOMILIES ON JOSHUA 3.4"


[[commentary]]
quote='''
Yet our "Jesus sends" spies to the "king of Jericho," and they are received into lodging by a "harlot." But that harlot, who received the spies sent by Jesus, received them for this reason, that she might no longer be a "harlot." But also the soul of each one of us was a harlot, so long as it lived in the desires and lusts of the flesh. But it received the spies of Jesus, "the angels whom he sent before his face, that they might prepare his way." Yet if each soul received them out of faith, it places them not in lowly places nor in lower ones, but in the higher and lofty ones, because we have received Jesus the Lord not as lowly and earthly, but as one proceeding from the Father and coming from the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily01.html'
source_title="HOMILIES ON JOSHUA 1.4"
