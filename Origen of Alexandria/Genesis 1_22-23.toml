[[commentary]]
quote='''
"And God saw that they are good, and blessed them, saying: Increase and multiply, and fill the waters which are in the sea, and let the flying things be multiplied over the earth. And there was evening, and there was morning, the fifth day." In the sea indeed he commands "the great whales" and "every soul of the creeping animals which the waters brought forth" to dwell, where "that dragon too, whom God formed to mock them," inhabits. But the birds he commands to be multiplied over the earth, which once was "dry," but now is already called "earth," as we explained above. But someone asks how the great whales and the creeping things are taken in an evil sense and the flying things in a good sense, when it was said of all together: "And God saw that they are good"? To the saints themselves those things are good which are opposed to them, because they can conquer them, and, when they have conquered them, they are made of greater glory before God. Indeed, when the devil had asked that power be given him against Job, the adversary, assailing him, became for him the cause of a double glory after victory. This is shown from the fact that the things which he had lost in the present he received in double, being about to receive them in like manner also, without doubt, in the heavenly things. And the Apostle says that "no one is crowned unless he has striven lawfully." And indeed how will there be a contest, if there is no one who resists? How great is the beauty and splendor of light would not be discerned, unless the obscurity of night came between. Whence are some praised for chastity, unless because others are condemned for unchastity? Whence are brave men magnified, unless there existed the unwarlike and the timid? If you apply something bitter, then the sweet becomes more praiseworthy. If you consider the black, the things that are bright will seem more pleasing to you. And to say it briefly, from the consideration of evils the beauty of good things is shown more brightly. Therefore, then, concerning all these things Scripture says: "And God saw that they are good." Yet why is it not written: And God said that they are good, but: "God saw that they are good"? That is, he saw their usefulness and that reason by which, although they were in themselves such, they could nevertheless make good men best. Therefore, then, he said: "Increase and multiply, and fill the waters which are in the sea, and let the flying things be multiplied over the earth," that is, so that the great whales indeed and the creeping things should be in the sea, as we explained above, and the flying things over the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.10"
