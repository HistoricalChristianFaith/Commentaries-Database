[[commentary]]
quote='''
For this reason, therefore, Moses entreats the more on behalf of that people. But the Lord dispenses the measure of correction with balanced moderation and says that the men, indeed, who went out of Egypt and tempted me and remained unbelieving, shall fall in this desert and shall not see, he says, the land which I swore to their fathers; "but their sons, who are here with me, whosoever know not good or evil." Perhaps there may be something even of a more hidden mystery in the words of the Lord when he says: "their sons, who are here with me." Where "here," or how "with me"? Let him who has ears to hear, hear. We, meanwhile, say that our fathers were that former people, but we are their sons. They, therefore, because they sinned, were rejected and fell; but we, their sons, have risen up and been raised erect in their place, we who knew not good or evil. For we are of the nations, we who knew neither the good things that come from God nor the evils that are begotten from sin — provided, however, that, succeeding into the place of those who were rejected, we fear the example of so great a fall, hearing the admonition of Paul who says: "Behold then the severity and the goodness of God: toward those who fell, severity; but toward you, goodness, if you remain in that goodness — otherwise you too shall be cut off. And they, if they do not remain in unbelief, shall be grafted in."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily08.html'
source_title="HOMILIES ON NUMBERS 8.1"
