[[commentary]]
quote='''
The Divine Word wants you to love father, son, daughter. The Divine Word wants you to love Christ, and it does not tell you not to love your children, nor does it tell you that you should not be united in love with those who gave you birth. But what does it tell you? It tells you: ‘You must not have a love that is disordered. You must not love your father and your mother first and me afterwards; you must not be possessed by love of son and daughter more than by love of me. He that loveth father and mother more than me is not worthy of me. He that loveth son and daughter more than me is not worthy of me.’

Examine your consciences concerning your affection for your father, mother, brother; consider what manner of love you bear the Word of God and Jesus, and you will realize forthwith that you love son and daughter more than the Word, and have more affection for your parents than for Christ. Which among us, do you think, has progressed so far as to have chief and first of all his loves that of the Word of God, and to put his children in the second place?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
