[[commentary]]
quote='''
And they set out from the Red Sea and came to the desert of Zin. Zin is interpreted "bramble bush" or "temptation." So there begins now to smile upon you the hope of good things. But what is the hope of good things? From the bramble bush the Lord appeared and gave his answers to Moses, and from there the beginning of the visitation was made by the Lord to the children of Israel. But it is not idly that Zin is interpreted also "temptation"; for there is wont to be temptation even in visions. For sometimes the angel of iniquity transforms himself into an angel of light. And therefore one must beware and act carefully, so that you may knowingly discern the kind of visions, just as Joshua the son of Nun also, when he saw a vision, knowing that there was temptation in this, at once inquires of him who appeared and says: "Are you ours or of our adversaries?" So then the advancing soul also, when it has come to this point, that it now begins to have discernment of visions, will thereby be proved to be spiritual, if it knows how to discern all things. Finally, therefore, among the spiritual gifts as well, one of the gifts of the Holy Spirit is said to be the discernment of spirits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.11"
