[[commentary]]
quote='''
Concerning this tabernacle the divine Scriptures make mention indeed in many places and seem to indicate certain things which human hearing could scarcely be capable of; yet above all the Apostle Paul, concerning the understanding of the tabernacle, discloses to us certain tokens of a more exalted knowledge, but, in some way — perhaps regarding the frailty of his hearers — he in a manner closes up the very things that he opens. For he says, writing to the Hebrews: "For the first tabernacle was made, in which were the candlestick and the setting-forth of the loaves, which was called the holy of holies. But after the second veil the tabernacle, which is called holy, having the golden altar of incense and the ark of the testament, and within it the two tables, and the manna and the rod of Aaron, which had put forth leaves". But to these things he added: "of which it is not now to be spoken one by one". Now that he says, "of which it is not now to be spoken", some refer to that time at which he was writing the epistle to the Hebrews; but to others it seems that, on account of the greatness of the mysteries, he denies that all the time of the present life is fit for explaining these things. Yet the Apostle does not leave us wholly sorrowful, but, as is his custom, he opens a few things out of many, so that it may indeed be closed to the negligent, but found by those who seek, and opened to those who knock. He resumes therefore again concerning the tabernacle and says: "For Jesus entered not into the holy places made by hand, the copies of the true, but into heaven itself, that he may now appear before the face of God through the veil, that is, through his own flesh". He therefore who interpreted the veil of the inner tabernacle as the flesh of Christ, and the holy places themselves as heaven or the heavens, and the Lord Christ indeed as the high priest, and says that he entered "once into the holy places, having found eternal redemption" — if from these few words anyone knows how to understand the sense of Paul, he can perceive how great a sea of understanding he has opened up to us. But those who love the letter of the law of Moses well enough, yet flee its spirit, hold the Apostle Paul under suspicion for bringing forth interpretations of this kind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily09.html'
source_title="HOMILIES ON EXODUS 9"
