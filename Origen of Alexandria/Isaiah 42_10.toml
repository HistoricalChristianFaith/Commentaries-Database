[[commentary]]
quote='''
These indeed try to pursue, but you go down into the water and come out unharmed, and, the filth of your sins being washed away, you ascend "a new man" ready "to sing a new song." But the Egyptians, pursuing after you, are drowned in the abyss, even though they seem to beg Jesus not to send them meanwhile into the abyss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily05.html'
source_title="HOMILIES ON EXODUS 5"
