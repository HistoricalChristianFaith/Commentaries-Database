[[commentary]]
quote='''
"They went down into the deep like a stone." Why did "they go down into the deep like a stone"? Because they were not such "stones as those from which sons of Abraham could be raised up," but such as loved the deep and cherished the liquid element — that is, who seized the bitter and fleeting pleasure of present things. Whence it is said of them: "They were sunk like lead in the mightiest water." Sinners are heavy. Finally, iniquity too is shown "to sit upon a talent of lead," as the prophet Zechariah says: "I saw," he says, "a woman sitting upon a talent of lead, and I said: what is this? And he answered: iniquity." Thence it is, therefore, that the wicked "were sunk into the deep, like lead in the mightiest water."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily06.html'
source_title="HOMILIES ON EXODUS 6"
