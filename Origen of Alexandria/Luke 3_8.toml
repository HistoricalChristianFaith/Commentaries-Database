[[commentary]]
quote='''
Then there follows: "Who has shown you to flee from the wrath to come? Bring forth therefore fruits worthy of repentance". And to you, who come to baptism, it is said: "bring forth fruits worthy of repentance". Do you wish to know what are the fruits worthy of repentance? "Love is the fruit of the spirit, joy is the fruit of the spirit, peace, patience, kindness, goodness, faith, meekness, self-control" and the rest of this kind. If we have all these things, we have brought forth "fruits worthy of repentance". Again it is said to those who came to John's baptism: "and do not begin to say within yourselves: we have Abraham as father; for I say to you, that God is able from these stones to raise up sons of Abraham". John, the last of the prophets, prophesies the casting out of the former people and the calling of the Gentiles. For to those who gloried in Abraham he says: "and do not begin to say within yourselves: we have Abraham as father". And again he speaks concerning the Gentiles: "for I say to you, that God is able from these stones to raise up sons of Abraham". From what stones? He was certainly not pointing to irrational and bodily stones, but to insensible men, once hard, who, because they worshiped stones or wood, had that fulfilled in them which was sung in the psalm concerning such men: "let those who make them become like them, and all who trust in them". Truly those who make idols and trust in them are like their gods: they have been turned, without sense and without any reason, into stones and wood. For although they see so great an order of created things, their beauty, their function, so great a beauty of the world, they are unwilling to understand the creator from the created things, nor do they consider that there is some providence over so great a dispensation, some governor; but they are blind, seeing the world only with those eyes with which irrational beasts of burden and wild animals see. For they do not perceive that there is present, in these things which they see governed by reason, some reason. These things are said because John had said: "God is able from these stones to raise up sons of Abraham". Let us therefore also beseech God that, even if we were at some time stones, we may be turned into "sons of Abraham" in place of those sons who have been cast out and who have lost the promise and the adoption by their own fault. I will yet set down one testimony concerning stones, since indeed in the canticle of Exodus it is written: "let them be turned into stones, until your people pass over, O Lord, until this your people pass over, whom you have possessed". And so God is asked that for a little while the Gentiles be turned into stones—for the Greek word sounds this more pointedly, "ἀπολιθούντωσαν" (let them be petrified)—"until the people" of the Jews "pass over". There is no doubt that, after those have passed over, the Gentiles will cease to be stony and, in place of a hard heart, will receive in Christ a human and rational nature: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily22.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 22"


[[commentary]]
quote='''
If it were impossible to be rid of these serpents, the serpents residing in the soul on account of its wickedness, then the Savior (or John) would not have said: "Bring forth then fruits worthy of repentance!" Having turned, you will no longer be serpents, broods of vipers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
