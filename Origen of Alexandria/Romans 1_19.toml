[[commentary]]
quote='''
Because what is known of God is manifest in them; for God has manifested it to them. We have already said above that what is known of God is that which they can attain from the order and reasons of this world, as the Apostle himself indicates from what follows, saying that his invisible things are contemplated through the things that have been made. But what is unknown of God is to be understood as the account of his substance or nature; and what its proper character is, I think lies hidden not only from us men, but from every creature: or if at some time there shall be so great an advance of rational nature that it can arrive at this knowledge also, it belongs to God to know. For something of this sort seems to me to be hoped for from those things which are said by the Savior, that no one knows the Son except the Father; nor does anyone know the Father except the Son, and he to whom the Son wills to reveal him. For he would not have added, And to whom the Son wills to reveal him, unless he knew that there are some to whom he wills to reveal him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook01.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
