[[commentary]]
quote='''
"The teacher of the Gentiles in faith and truth," the Apostle Paul, handed down to the Church which he gathered from among the Gentiles how it ought to attend to the books of the Law, which it had received from others and which had formerly been unknown to it and altogether foreign, lest, in taking up institutions foreign to it and being ignorant of the rule of those institutions, it should tremble amid an alien instrument. Therefore he himself, in a number of passages, hands down examples of the understanding, so that we too may observe things similar in the rest, lest perchance, on account of the likeness of the reading and of the instrument of the Jews, we should believe that we have been made their disciples. This, then, is what he wishes to distinguish between the disciples of Christ and the disciples of the synagogue: that the Law which they, by understanding it badly, did not receive Christ, we, by understanding it spiritually, may show to have been rightly given for the instruction of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily05.html'
source_title="HOMILIES ON EXODUS 5"
