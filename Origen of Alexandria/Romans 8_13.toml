[[commentary]]
quote='''
"But if by the Spirit you mortify the deeds of the flesh, you shall live." And of this it has already been said above, how the body indeed ought to be dead because of sins, but the spirit is life because of justification. He, therefore, who acting according to the spirit mortifies the deeds of the flesh, shall live because of the spirit of life dwelling within him. Now one mortifies the deeds of the flesh in this manner. Charity is a fruit of the Spirit; hatred is a deed of the flesh: hatred, therefore, is mortified and extinguished through charity. Joy likewise is a fruit of the spirit, but the sorrow of this world, which works death, is a deed of the flesh: this, then, is extinguished if the joy of the spirit be in us. Peace is a fruit of the spirit; dissension and discord is a deed of the flesh; but it is certain that discord can be mortified through peace. So too the patience of the spirit extinguishes the impatience of the flesh, and goodness destroys malice, and meekness ferocity, and continence intemperance, and chastity slays unchastity; and in such an order he who through the spirit has mortified the deeds of the flesh shall live. It must indeed be observed that, just as he speaks not of that common death but of the death of sin — "For if you live according to the flesh, you shall die" — so also he speaks not of this common life but of that eternal life, to which everyone will come who, according to the things we have set forth above, has perfectly mortified by the spirit the deeds of the flesh. But this too we ought to know, that this mortification of the deeds of the flesh comes about through patience, and not suddenly, but little by little. First it is necessary that they grow faint in those who are beginning; then afterwards, when they have begun to advance more ardently and to be filled with a more abundant spirit, the deeds of the flesh will begin not only to grow faint but even to waste away; but when they have now come to perfection, so that no promptings of sin at all arise in them, whether in deed, or in word, or in thought, then they are plainly to be believed to have mortified the deeds of the flesh and to have handed them over wholly to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
