[[commentary]]
quote='''
Let us look well whether this precept extends to all sin; for what if any one sin any of those sins which are unto death, such as unnatural crimes, adultery, homicide, or effeminacy, it cannot be meant that such as these are to be admonished privately, and if he hear you, forthwith to say that you have gained him. And not rather first put him out of the Church, or only when remaining obstinate after monition before witnesses, and by the Church? One man, looking at the infinite mercy of Christ, will say, that since the words of Christ make no distinction of sins, it is to go against Christ's mercy to limit His words only to little sins. Another, on the other hand, considering the words carefully, will aver, that they are not spoken of every sin; for that he that is guilty of those great sins is not a brother, but is called a brother, with whom, according to the Apostle, we ought not so much as to eat. But as they who expound this as referring to every sin give encouragement to the careless to sin; so, on the other hand, he, who teaches that one having sinned in little sins and such as are not deadly, is, when he has spurned the admonition of the witnesses and the Church, to be held as a heathen and a publican, seems to introduce too great severity. For whether he finally perishes, we are not able to decide. First, because he who has been thrice told of his fault and not hearkened, may hearken the fourth time; secondly, because sometimes a man does not receive according to his deeds, but beyond his trespass, which is good for him in this world; lastly, because He said not alone, Let him be as a heathen, but Let him be to thee. Whosoever then when reproved three times in a light trespass, does not amend, him we ought to hold for a heathen and a publican, avoiding him, that he may be brought to confusion. But whether he is esteemed of God also as a heathen and a publican, is not ours to decide, but is in the judgment of God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Do you wish to know that these things agree also with the Gospel precepts? The Lord himself says: "if you see your brother sin, reprove him between yourself and him alone. If he hears you, you have gained your brother. But if he does not hear you, take with you two others or three. But if he does not hear even them, tell the church. But if he does not hear even the church, let him be to you as a heathen and a publican". But the Gospel precept was given more perfectly in this, that it established the manner and discipline of disclosing the sin. For it does not wish you, if perchance you have seen your brother's sin, at once to fly out into public and everywhere to proclaim and divulge another's sins — which would surely be the mark not of one correcting, but rather of one defaming. "Alone", it says, "between yourself and him, rebuke him". For when he who sins sees the mystery kept for him, he too will keep the modesty of amendment; but if he sees himself defamed, he will at once turn to the shamelessness of denial; and you will not only not have amended the sin, but will even have doubled it. Learn, therefore, the order from the Gospels. First, it says, "alone, between yourself and him". Second, "take with you two others or three". Why "two or three"? "For in the mouth", it says, "of two or three witnesses shall every word stand". Since indeed in the third place it commanded the correction to be brought to the church, in the second it wishes "two or three" witnesses to be brought in. In their presence, if the one rebuked will not amend himself, then, when his sin has been brought to the church, he may be confuted by the witnesses previously brought in; for it frequently happens that one wishing to fulfill the Gospel command may seem a slanderer, if he brings a charge to the church and lacks witnesses. Lest, therefore, this happen, for that reason he commanded "two or three" witnesses to be brought in at the second meeting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily03.html'
source_title="HOMILIES ON LEVITICUS 3"
