[[commentary]]
quote='''
Therefore let us draw together from the divine Scriptures instances in which we find "holy" used, and discover not only persons but also mute animals that are called "holy," and also find both "the vessels" of the ministry that are called "holy," and the garments which are said to be "holy," and even the places which were located in cities and suburbs and counted as priestly. Indeed, among the brute animals it is commanded through the law that "the firstborn" of calves or cattle be sacrificed to the Lord, and it says, You will not do any work with them because they have been consecrated to the Lord.
'''
source_url='https://www.google.com/books/edition/Homilies_on_Leviticus_1_16/Eo9Da7xaBuUC?hl=en&gbpv=1&dq=homilies+on+leviticus+origen&printsec=frontcover'
source_title="HOMILIES ON LEVITICUS 11.1.2"


[[commentary]]
quote='''
The males which were holy from the fact that they had opened their mother's womb were offered before the altar of the Lord: "every male," it says, "that opens the womb", sounds something sacred. For whatever male you may say has been poured forth from the womb, he does not open his mother's womb as the Lord Jesus does, because in all women it is not the birth of the infant, but the intercourse of the man, that unlocks the womb. But the womb of the Lord's mother was unlocked at that time at which the birth also was brought forth, because before the birth of Christ no male at all touched that holy womb, to be venerated with all reverence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily14.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 14"
