[[commentary]]
quote='''
But as for what he says, "Therefore he has mercy on whom he wills, and whom he wills he hardens," he seems to take it from what is written in Exodus. For there he says: "I will harden Pharaoh's heart, that he may not let the people go." Now Pharaoh's heart was hardened in this way. God was unwilling to bring upon him a sudden and full vengeance. For although he was of consummate malice, nevertheless through his patience God had not shut off even from him the possibility of conversion: and therefore he uses upon him first lighter stripes, and then such as grow gradually heavier. But what God was doing through patience, by this the man was hardened unto contempt, storing up for himself a greater wrath, so that there may fitly be said to him that which the Apostle writes: "Or do you despise the riches of his goodness, and patience, and long-suffering, not knowing that the patience of God leads you to repentance? But according to your hardness and impenitent heart you treasure up for yourself wrath in the day of wrath." Therefore God does not harden whom he wills, but he who has been unwilling to yield to his patience is hardened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
