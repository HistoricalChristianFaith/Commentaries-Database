[[commentary]]
quote='''
In the Gospel, moreover, a woman took an alabaster vessel containing precious ointment of pure spikenard and poured it on Jesus’ head, and (another) on His feet. Note carefully which of the two women poured the perfume on the Saviour’s head: the sinner poured it on His feet, and she who is not called a sinner poured it on His head. Notice, I say, and you will find that in this Gospel lesson the evangelists have written mysteries, and not just tales and stories. And so the house was filled with the odour of the ointment. We must take what the sinner brought with reference to the feet, and what the woman who was not a sinner brought with reference to the head. Small wonder that the house was filled with fragrance, since with this fragrance all the world is filled!

The same passage speaks of Simon the leper and his house. I think the leper is the prince of this world, and that the leper is called Simon: his house it is that at Christ’s coming is filled with sweet odours, when a sinful woman repents and a holy one anoints the head of Jesus with sweet perfumes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25201.html'
source_title="Homilies on the Song of Songs, Homily 1"
