[[commentary]]
quote='''
If therefore the soul be "little" and small, it can even "be scandalized"; for so it is written in the gospel: that "it is better to be cast headlong into the deep of the sea than to scandalize one of these little ones". He who is great is not "scandalized", but he who is "little". He who is great, whatever he sees, whatever he suffers, does not turn aside from the faith. But he who is "little" in mind and small, seeks occasions how he may "be scandalized", how he may seem to be tripped up in the faith. Therefore, in fine, we must take counsel most of all for those who are small in faith, nor ought we to expend as much care about the great and strong as about the "little ones" and beginners. For the strong man "bears all things, endures all things, and never falls". But with the "little ones" and the "weak in faith" it must be watched that they be not tripped up by occasion of us and fall back from the faith and fall away from salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily12.html'
source_title="HOMILIES ON LEVITICUS 12"
