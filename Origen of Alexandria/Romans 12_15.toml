[[commentary]]
quote='''
To rejoice with those who rejoice, to weep with those who weep. Here too a suitable and fitting distinction must be maintained. For the joys of Christians are not to be joined to just any joys, nor are our tears to be joined to just any weeping. For if I should see someone rejoicing over a gain of money, or over the extent of his possessions, or over the eminence of worldly honor, I ought not to congratulate such people, since I know that mourning and tears follow joys of this kind. Indeed, so far is one from rejoicing over such things, that the Lord did not permit his disciples to rejoice even over the fact that they saw the demons subject to them, but said to them: Do not rejoice that the demons are subject to you; but rejoice, he says, that your names are written in the book of life. We too, then, if we see such a work done by anyone as is worthy to be written in heaven — whether a work of justice, or of charity, or of peace, or of mercy — and so done that it deserves to be recorded in the book of life, we ought to rejoice with such people. And also, if we see anyone converted from error, and having left the darkness of ignorance come to the light of truth, and having obtained the remission of sins and the grace of the Holy Spirit, we ought to rejoice with such people. Similarly, we are commanded to weep with those who weep — not with those who weep for their dead, or who weep over worldly losses, since we know that the sorrow of this world works death. Our tears, therefore, are not to be joined with such people; but we must weep with those of whom the Lord says: Blessed are those who weep, for they shall be comforted. If anyone weeps for his sins, if anyone after an offense turns to repentance and washes away his error with tears, if anyone groans even while placed in this dwelling and desires to return to Christ, and consoles his holy longing by the pouring out of tears — let us join our tears with such people, and let us share their groanings; for the sorrow that is according to God works a lasting salvation through repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
