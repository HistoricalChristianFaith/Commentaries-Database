[[commentary]]
quote='''
Let us see, then, whether perhaps through these things we may be taught something worthy, as also from the other Scriptures, concerning the more hidden mysteries. First, this very fact that, although many men are reported to have been judges in Israel, of none of them is it said that he was a "prophet" except of "Deborah the woman." Even the very first surface of the letter itself furnishes no small consolation to the female sex in this, and it summons them, that they should by no means despair, on account of the weakness of their sex, of being able to become capable even of the grace of prophecy, but that they should understand and believe that purity of mind, not diversity of sex, merits this grace. But let us see what secret of the inner understanding also breathes forth here. "Deborah" is interpreted as "bee or speech". But we have already said in the earlier passages too that Deborah is to be taken as a figure of prophecy, which is the bee. For it is certain that all prophecy composes the sweet honeycombs of heavenly doctrine and the sweet honey of the divine utterance. Whence David also sang, saying: "how sweet are your utterances to my throat, above honey and the honeycomb to my mouth!" And again elsewhere he says "that the judgments of God are precious above gold and the precious stone exceedingly, and sweeter above honey and the honeycomb."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily05.html'
source_title="HOMILIES ON JUDGES 5"
