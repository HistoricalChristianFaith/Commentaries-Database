[[commentary]]
quote='''
And they set out from Etham and arrived at the mouth of Hiroth. Hiroth is interpreted "a village." For one does not yet come to a city, nor are the things that are perfect yet held fast, but meanwhile at first each small thing is taken. For this is the advance: that one may come from small things to great. One comes, then, to the mouth, that is, to the first entrance of the village, which is a sign of moderate conduct and abstinence; for excessively great and immoderate abstinence is too perilous. Now this Hiroth is set over against Baal-zephon and over against Migdol. Baal-zephon is interpreted "the ascent of a watchtower" or "of a tower." From small things, then, one ascends to great, and one is set not yet on the watchtower itself, but over against the watchtower, that is, in sight of the watchtower. For it begins to keep watch and to look out upon future hope and to contemplate the height of its advances, and little by little it grows, so long as it is nourished more by hope than it is wearied by toils. And this station or stopping-place is over against Migdol, not yet in Migdol itself; for Migdol is called "magnificence." Having, then, in its sight both the ascent of the watchtower and the magnificence of things to come, it is pastured and nourished, as we have said, by enormous hopes; for it is in the midst of its advances, not yet set in perfection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.9"
