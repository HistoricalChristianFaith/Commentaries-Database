[[commentary]]
quote='''
Do not be overcome by evil, but overcome evil with good. He is overcome by evil who, provoked by evils, returns evil; but he overcomes evil with good who, having received evils, repays them with good things. For it is certain that this is the nature of evil, that it is increased and grows from things like itself — just as if you add fire to fire, or as if the clouding of the air is joined to the darkness of night. But if you apply good, evil is destroyed. For contraries are done away with by contraries, just as fire is extinguished by water, and darkness is put to flight by light. But perhaps someone may say that Paul, through unskillfulness of speech, has fallen away from his subject; for he had set out to speak about the gifts of graces which are given through the Holy Spirit. And indeed, as to what he says: Whether prophecy, or ministry, or teaching, or exhortation, these can pertain to spiritual gifts. Perhaps also what follows: He who gives, in simplicity; he who presides, in solicitude; he who shows mercy, in cheerfulness, can be joined to the foregoing; but as for those things which he enumerates after these — that charity be without dissimulation, hating evil, cleaving to good, loving one another with the charity of brotherhood, anticipating one another in honor, and the rest of this kind — one might say that these are precepts rather than gifts. But let us consider more carefully whether perhaps, since indeed in all these matters he has undertaken to treat the moral topic, and to make the Christian not only stable and immovable in the faith of the truth but also adorned in his morals, he therefore joins moral precepts as well to the gifts of the graces, in order to show that these too are given to Christians through the grace of God. For there are also some among the Gentiles of well-ordered and honorably formed morals, who nevertheless do not refer this very thing which they have to God, nor confess that the grace was given to them by Him; but either they ascribe it to their own diligence, or they boast about their masters and instructors. To us, however, the Apostle shows that everything which is good is from God and is given through the Holy Spirit, just as the apostle James also says: Every good gift and every perfect gift is from above, descending from the Father of lights; so that he who glories may glory in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
