[[commentary]]
quote='''
In the fourth place among the festivals of God is set the solemnity of the Passover, in which festival the lamb is slain. But do you look to the true lamb, the Lamb of God, the Lamb who takes away the sin of the world, and say: "Our pasch, Christ, is sacrificed." Let the Jews in a carnal sense eat the flesh of the lamb, but let us eat the flesh of the Word of God; for He Himself said: "Unless you eat my flesh, you will not have life in yourselves." This which we are now speaking is the flesh of the Word of God, provided at least that we do not offer, as to the weak, herbs, or, as to children, the nourishment of milk. If we speak perfect things, if strong, if mighty, we set before you the flesh of the Word of God to eat. For where mystical discourse, where doctrinal discourse, filled with the faith of the Trinity, is brought forth solid, where, the veil being removed, the spiritual mysteries of the letter of the law of the age to come are laid open, where the hope of the soul, torn away from the earth, is cast into the heavens and set among those things which eye has not seen nor ear heard nor have they ascended into the heart of man — all these are the flesh of the Word of God; and he who can feed on them with perfect understanding and a purified heart truly immolates the sacrifice of the festival of the Passover and keeps a feast day with God and His angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily23.html'
source_title="HOMILIES ON NUMBERS 23.6"
