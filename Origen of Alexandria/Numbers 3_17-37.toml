[[commentary]]
quote='''
After these things, when the sons of Levi had been divided into three orders, and each of the orders was reckoned according to the three names of the princes, certain diversities are recorded in them too, not without mysteries. For the order of the sons of Kohath is described first, and rightly; for from him descend Moses and Aaron, to whom the summit of the priesthood is committed. For from him is born Amram; and from Amram, Moses and Aaron. The second order is Gershon, who indeed is first in birth, but is held second in order; for thus the Scripture says: "And the sons of Levi: Gershon, Kohath, and Merari." But from the sons of Kohath again two orders are directed, and those indeed who descend from Aaron are consigned to the priesthood, while the remaining part is ordained to minister to the priests; and therefore the offices of the Levites are divided into four parts, so that Aaron and his sons discharge the priesthood, but the holy of holies is carried upon their shoulders by those who remain of the people of Kohath. But the things that pertain to the tabernacle of testimony, or to its courts and skins, or even the veils, and whatever is less hard and light for a burden, the sons of Gershon are to take care of. But the columns of the tabernacle and its bases and its bars the sons of Merari are to carry. Therefore also in the enumerating of these the Scripture significantly makes mention that the strength of Merari be reckoned; for strength is needed for carrying burdens of this kind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily04.html'
source_title="HOMILIES ON NUMBERS 4.1"
