[[commentary]]
quote='''
But having briefly gone back over these matters from the earlier reading — that is, over the end of Ehud — let us now see what sort the beginning of Shamgar is also, who is there interpreted "stranger." For it is true that all who are men of God are strangers in this world and sojourners upon the earth, just as was also he who said that: "I am a sojourner with thee upon the earth and a pilgrim, as all my fathers were". And so the Holy Spirit there calls this Shamgar too a sojourner — that is, here. For what is "there" to the Holy Spirit, who is in the heavens, is "here" to us. What, then, is said of Shamgar? "He smote", it says, "the Philistines, six hundred men, with the handle — or "foot" — of a plow". I see another kind of praise in Shamgar: this one fights with a "plow". Ehud was fighting with a sword, this one with a plow. Yet this one too conquers, overcomes, and lays low the Philistines. It can happen, therefore, that a judge of the Church does not always bring forth the sword — that is, does not always use the austerity of the word and the sharpness of correction — but sometimes also imitates the farmer, and, as it were plowing the soil of the soul and often cutting it open with a gentle admonition, prepares it, fit for receiving the seeds. Thus the Philistines will be slain in this way too, when we use not arguments and sharpness against our adversaries, but drive out vices and sins from the souls of our hearers by a rustic and simple admonition. But you also yourself, O hearer, be the farmer of your own soul; use this plow which Shamgar uses. But when "you have put your hand to the plow", do not "look back" — that is, after "you have taken up your cross and followed Christ", after you have renounced the world and the things which are in the world, do not "look back", do not seek again those things which "for the sake of Christ you had counted as dung", because, if you always keep your "hand upon this plow", so that you may confidently say: "But God forbid that I should glory, save in the cross of our Lord Jesus Christ, through whom the world is crucified to me, and I to the world", then, as you say these things, "there shall fall at your right hand ten thousand, and at your left hand a thousand, but unto you they shall not come near". But this very thing also that it said, that "Shamgar smote the Philistines, six hundred of them", does not seem to me to have been said idly. For what need was there to designate even the number? Unless perhaps in the number itself it indicated more plainly those things of which we spoke above. For the number six, which multiplied comes to six hundred, holds the figure of this world, which is said to have been completed in six days. "Six hundred", therefore, he is said "to have smitten with the plow", he to whom "through the cross of Christ the world is crucified".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily04.html'
source_title="HOMILIES ON JUDGES 4"
