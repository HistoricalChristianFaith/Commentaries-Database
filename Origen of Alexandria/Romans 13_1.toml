[[commentary]]
quote='''
Let us see, then, what the Apostle now adds in what follows: Let every soul be subject to the higher powers. It seems to me that in this he has very commendably named the soul, which he commands to be subject to the powers. For he would never have said, let every spirit be subject to the power, but, let every soul. Concerning this distinction we have already often said that sometimes a person is named from the soul, sometimes from the flesh, sometimes from the spirit. But when he is to be named from the better part, as one who ought to be understood as spiritual, he is called spirit; when from the lower, soul; but when he is named from the worse, he is called flesh — and we have often brought forward testimonies about these things from the Scriptures. Now, therefore, since the Apostle is laying down precepts for believers, he wishes us to preserve, so far as it lies in us, the quiet and peace of the present life. And if indeed we are such as are joined to the Lord and are one spirit with Him, we are said to be subject to the Lord. But if we are not yet such, but there is still in us the common soul which has something of this world, which is bound to it by some business, for this one the Apostle lays down precepts, and says that it should be subject to the powers of the world: because the Lord also said that those who have in themselves the superscription of Caesar should render to Caesar the things that are Caesar's. Peter and John had nothing which they might render to Caesar; for Peter says: Gold and silver I do not have. He who does not have this has neither anything to render to Caesar, nor anything on account of which he should be subject to the higher powers. But he who has either money, or possessions, or any business in the world, let him hear: Let every soul be subject to the higher powers.

For there is no power, he says, except from God. Perhaps someone will say: What then? Is even that power which persecutes the servants of God, attacks the faith, and overturns religion, from God? To this we shall reply briefly. There is no one who does not know that sight has been given to us by God, and hearing, and understanding. Since, therefore, we have these from God, yet it is in our own power whether we use sight for good things or for evil; and similarly hearing, and the movement of our hands, and the thought of our mind: and in this consists the just judgment of God, that we misuse for impious and iniquitous services those things which He gave for good uses. So, then, every power also has been given by God for the punishment of the evil, but for the praise of the good, as the same Apostle says in what follows. And the judgment of God will be just toward those who regulate the power they have received according to their own impieties, and not according to the divine laws.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
