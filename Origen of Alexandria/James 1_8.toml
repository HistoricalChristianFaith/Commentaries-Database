[[commentary]]
quote='''
And therefore the prophet mourns over us, whom he sees wavering with inconstancy of this kind, and says: "woe to the double-minded", and again: "how long do you go lame on both your knees?" But the Apostle James also says: "a double-minded man is inconstant in all his ways". We are, then, we who follow our Lord with a faith neither whole nor perfect, and have withdrawn from alien gods, set as it were in a certain middle border, and by those we are struck at as fugitives, and by our own Lord, as unstable and doubtful, we are not defended.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
