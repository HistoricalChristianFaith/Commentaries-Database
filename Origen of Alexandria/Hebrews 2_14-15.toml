[[commentary]]
quote='''
The Apostle, recalling this saying, "Behold, I and the children whom God has given me," then goes on and expounds: "Since therefore the children shared in blood and flesh, he too became near to them, being made a partaker of theirs, that through death he might destroy him who had the dominion of death, that is, the devil, and deliver those who through fear of death were, throughout their whole life, subject to the guilt of bondage." Therefore, "since the children were made partakers of blood and flesh," our Savior too "shared in blood and flesh." For it was foreign to his nature and his divinity to take up "blood and flesh"; but for our sake he took up those things which were foreign to him, that he might make us his own household, who had been made foreign through sin. And the Apostle indeed expounded it thus, saying: "Since therefore the children shared in blood and flesh, he too became near to them, being made a partaker of theirs"; but I would say that, just as "since the children shared in blood and flesh, he too became near to them, being made a partaker of theirs," so, since the "children" cannot hear the stronger discourses — for they must, as "children," hear the words of God — for this reason, having been "made present" in the "blood of the children" for the sake of those who "shared in flesh and blood," speaking "as to little ones," he speaks not divine and unutterable things, but only such things as "little ones" can grasp.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily07.html'
source_title="HOMILIES ON ISAIAH 7"
