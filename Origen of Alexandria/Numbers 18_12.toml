[[commentary]]
quote='''
The law commands that the firstfruits of all crops and of all cattle be offered to the priests, in such a way that everyone who possesses a field or a vineyard or an olive grove or even a garden, and whatever is cultivated in the ground, and likewise anyone who raises herds of any kind of livestock, should offer to God from these everything that is first — that is, should bring it to the priests. For he says that what is given to the priests is offered to God. And this is what we are taught by the law: that no one lawfully or legitimately makes use of the fruits which the earth has produced, nor of the animals which the offspring of the herds has brought forth, unless from each and every one the firstfruits are offered to God, that is, to the priests. This law, therefore, I think it necessary to observe even according to the letter, as also some others; for there are certain commandments of the law which even the disciples of the New Testament keep with necessary observance. And if it seems good, let discourse first be raised about these very things which are indeed written in the law but are to be observed as in the Gospels, and when these have been made clear, then we shall at last inquire what in these also ought to be understood spiritually. For there are those who say that, if anything at all is to be observed according to the letter, why should not all things be kept? But if the things which the law contains are to be referred to a spiritual understanding, then nothing at all ought to be observed according to the letter, but all things should be discerned spiritually. But we, tempering the presumption of both assertions, shall attempt to bring forward from the authority of the divine Scriptures what rule ought to be observed in discourses of this kind about the law. It is written in the eighteenth psalm: "The law of the Lord is blameless, converting souls; the testimony of the Lord is faithful, giving wisdom to little ones; the precept of the Lord is clear, enlightening the eyes. The fear of the Lord is chaste, enduring for ever and ever; the judgments of righteousness of the Lord are upright, gladdening hearts; the judgments of the Lord are true, justified in themselves, desirable above gold and precious stone exceedingly, and sweeter than honey and the honeycomb." Unless, therefore, each of these were different from one another, the divine Scripture would surely never have assigned proper distinctions to each, so as to say one thing about the law of the Lord, another about the commandment, another about the justifications, another about the judgments. There is, then, as we have shown from these, one thing that is law, another that is precept, another that is testimony, another that is justification, another that is judgment. But even in the law itself a more evident distinction of these is marked out, where it is said: "These are the law and the commandments and the justifications and the precepts and the testimonies and the judgments, which the Lord commanded Moses." Since, therefore, these things are so, and it is proved by the testimonies of the law itself that they differ from one another by these distinctions, we ought to attend more diligently to the things which are recited from the law, because, wherever it is written, for example, that this is a commandment, the law is not straightway to be taken as a commandment; or wherever it is written, "These are the justifications," they are not straightway to be thought justifications or law or commandment; and likewise wherever testimony or judgments are written, one is not to be confusedly understood from the others, but each is to be understood as distinct from the rest. If, therefore, we read it written that "the law has a shadow of the good things to come," the commandment or the justices or the judgments, about which this is not written, are not straightway to be believed to be shadows of the good things to come. Finally, that we may set down one example out of many, it is not written, "This is the commandment of the Passover," but, "This is the law of the Passover." And because "the law is a shadow of the good things to come," without doubt the law of the Passover is a shadow of the good things to come. When, therefore, I come to that passage which is written concerning the Passover, in that bodily sheep I ought to understand that there is a shadow of the good to come, and to perceive this: that "Christ our Passover has been sacrificed." In like manner you will find it written also concerning the unleavened bread and the other observances of festal days. Since, therefore, all these are written in the law under the title of "law," necessarily, because the law by the present shadow designates the good things to come, I ought to inquire what is the unleavened bread of the good things to come, and I find the Apostle saying to me: "that we may keep the feast, not in the old leaven, nor in the leaven of malice and wickedness, but in the unleavened bread of sincerity and truth." But concerning circumcision also it is written: "This is the law of circumcision." Since, therefore, circumcision too is reckoned under the title of "law," and the law is a shadow, I ask what shadow of the good things to come circumcision contains, lest perhaps Paul, being placed in the shadow of circumcision, should say to me: that "if you are circumcised, Christ will profit you nothing," and, "for it is not that circumcision which is manifest in the flesh that is circumcision; neither is he a Jew who is one manifestly in the flesh, but he who is a Jew in secret, and circumcision of the heart in the spirit, not in the letter, whose praise is not from men but from God." These several things, therefore, which the Apostle says are by no means to be observed strictly according to the letter, you will find almost all of them designated in Moses under the title of "law." But now, where he says, "You shall not kill, you shall not commit adultery, you shall not steal," and the rest of this kind, we do not find that he has prefixed the title of "law" to these, but rather these seem to be commandments; and therefore this Scripture is not emptied out among the disciples of the Gospel, but is fulfilled, because, as I have said, it is not the commandment but the law that is said to have "a shadow of the good things to come"; and therefore these things are to be kept by us according to the letter. Likewise elsewhere: "justly," he says, "pursue what is just." What need is there to seek allegory in these things, when even the letter edifies? We have shown, therefore, that there are certain things which are by no means to be observed according to the letter of the law, and that there are certain things which allegory ought not to alter at all, but which are to be observed altogether just as the Scriptures contain concerning them; now I inquire whether there are certain things which can indeed stand according to the letter, yet in which allegory must nonetheless of necessity be sought. And see whether we can fortify these things by apostolic and evangelical authority. It is written in the law: "For this reason a man shall leave his father and mother, and shall cleave to his wife, and the two shall be in one flesh." That these things contain allegorical mysteries, Paul, when he had set down this very example in his epistle, declares, saying: "This is a great mystery, but I speak in Christ and in the Church." But that this ought also to be kept according to the letter, the Lord and Savior himself teaches, saying: "It is written: For this reason a man shall leave his father and mother, and shall cleave to his wife, and the two shall be in one flesh. What therefore God has joined, let not man separate." And he certainly shows that these things are to be observed also according to the letter, when he adds: "What therefore God has joined, let not man separate." But also in other places, where the Apostle says that "Abraham had two sons, one of the handmaid and one of the free woman," who doubts that these things ought to stand according to the letter? For it is certain that both Isaac was Abraham's son by Sarah and Ishmael by Hagar. Yet the Apostle adds to these and says: "But these things are allegorical," and he turns them into the two testaments, and calls the offspring of Sarah, as it were, the children of the new testament that begets unto liberty, but Hagar, as begetting unto servitude, he named the children of the earthly Jerusalem. We have shown, as I think, by the authority of divine Scripture, that of the things written in the law some are utterly to be shunned and guarded against, lest they be observed according to the letter by the disciples of the Gospel; some indeed are to be held in every way, just as they are written; and others do have their truth even according to the letter, yet also usefully and necessarily admit an allegorical sense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily11.html'
source_title="HOMILIES ON NUMBERS 11.1"

[[commentary]]
quote='''
It will therefore now belong to the wise scribe, instructed concerning the kingdom of God, who knows how "to bring forth from these treasures new things and old," to know how in each and every passage of Scripture he should either utterly reject the letter that kills and seek the spirit that gives life, or altogether confirm and prove the teaching of the letter to be useful and necessary, or, while the history remains, opportunely and fittingly introduce also the mystical sense. Just as in this discourse too, which we have in hand, I think it fitting; for it is fitting and useful that firstfruits be offered also to the priests of the Gospel. For thus the Lord also ordained, that "they who announce the Gospel should live of the Gospel," and "they who serve the altar should partake of the altar." And just as this is worthy and fitting, so on the contrary it is both unfitting and unworthy, nay rather impious, that he who worships God and enters the church of God, who knows that priests and ministers stand by the altar and serve either the word of God or the ministry of the church, should not offer firstfruits to the priests from the fruits of the earth which God gave by bringing forth his sun and ministering his rains. Such a soul does not seem to me to have any memory of God, nor to consider or believe that God gave the fruits which he received; which he stores away as though they were alien from God. For if he believed them given to him by God, he would surely know how, by rewarding the priests, to honor God from his gifts and endowments. And that these things ought to be observed even according to the letter may be taught still more fully by the very words of the Lord, we will add these also. The Lord says in the Gospels: "Woe to you, scribes and Pharisees, hypocrites, who tithe" — that is, give tithes — "of mint and cummin and dill, and pass over the weightier matters of the law; hypocrites, these things ought to be done, and those not to be omitted." See then more diligently how the word of the Lord wills that the weightier matters of the law be by all means done, yet that these too, which are designated according to the letter, not be omitted. But if you say that he was saying these things to the Pharisees, not to the disciples, hear him again saying to the disciples: "Unless your righteousness abound more than that of the scribes and Pharisees, you shall not enter into the kingdom of heaven." What therefore he wills to be done by the Pharisees, much more and with greater abundance he wills to be fulfilled by the disciples; but what he does not will to be done by the disciples, neither does he command the Pharisees to do. And how he wills more to be done by the disciples than the Pharisees do, he declares also in this, where he says: "It was said to the ancients: You shall not kill." This the Pharisees also observe; but to the disciples he says: "But I say to you that if anyone is angry with his brother, he shall be liable to judgment." Likewise also concerning that which is written, "You shall not commit adultery," he wills the righteousness of his disciples to abound more in this, that they should not even look at a woman to lust after her. Therefore from these few things which we have brought forward, those who are diligent in the divine Scriptures will be able very easily to gather the distinctions of the rest as well. "For if a wise man hear," it says, "a word, he will not only praise it, but will add to it." What will he add? That he may examine and discern in each and every chapter of the law where the letter of the law is to be fled, where to be embraced, where also the narrative of the history agrees with the mystical exposition. For "Christ redeemed us from the curse of the law"; he did not redeem us from the curse of the commandment, nor from the curse of the testimony, nor from the curse of the judgments, but from the curse of the law — that is, that we should not be subject to circumcision of the flesh, nor to the observance of sabbaths and other things like these, which are to be said to be contained not in the commandments but in the law. How, then, does our righteousness abound more than that of the scribes and Pharisees, if they do not dare to taste of the fruits of their earth before they offer firstfruits to the priests and separate tithes for the Levites, and I, doing none of these things, so misuse the fruits of the earth that the priest does not know it, the Levite is unaware, the divine altar does not perceive it? This assuredly must be pointed out of necessity: that "law" is spoken of in two ways; for generally all these things — that is, commandment, justifications, precepts, testimonies, judgments — are called "law," but specially some particular part of the things written in the law is called "law," such as those about which we discoursed above. But the general law is signified, for example, when it is said of the Savior that "he came not to loose the law, but to fulfill it"; and again elsewhere: "The fullness of the law, therefore, is love." In which he certainly named all together the things written in the law "law." These things we have said in asserting that the commandment concerning the firstfruits of crops or cattle ought to stand also according to the letter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily11.html'
source_title="HOMILIES ON NUMBERS 11.2"

[[commentary]]
quote='''
But now let us see how it also receives an allegorical, that is, a spiritual understanding. Let us inquire, therefore, whether anywhere in the Scriptures, besides these things of which we have spoken above, we find firstfruits named; for here he said: "all the firstfruits of oil and wine and grain, the firstfruits of all these which have been offered to God, I have given them to you." I inquire therefore now, where besides these firstfruits may be named. For if all firstfruits pertain to the high priest, then of necessity a high priest also must be sought by us, to whom ought to pertain also those firstfruits which we find set forth in other passages of Scripture. And first of all, indeed, we read it written of the Lord Christ himself that he is "the firstfruits of the dead"; he too, therefore, is in some part firstfruits. And again we find it said by the Apostle of certain persons that they are "the firstfruits of Asia," and others "the firstfruits of Achaia." Whence it follows that throughout the several churches some of the believers — those, however, whom the apostolic spirit has approved — are named firstfruits. Among whom I think is also that Cornelius, who, together with those with whom he merited to receive the Holy Spirit, is deservedly called the firstfruits of the church of Caesarea. And not only of this church, but perhaps Cornelius is to be called the firstfruits of all the nations; for he first believed from among the nations, and was first filled with the Holy Spirit, and therefore he will rightly be called the firstfruits of the nations. But you may perhaps ask who offers these firstfruits to God, or who is the high priest to whose account these fall. I think that, according to the Lord's word, "the field" is here called "this world"; but by "field" is understood not only the earth, but the hearts of men, which field the angels of God have undertaken to cultivate. The fruits of their cultivation they indeed possess and have — namely those who live under stewards and overseers and have not yet come to the height of perfection. But whose hearts have been diligently cultivated and brought to perfection, these, as chosen and outstanding beyond the rest, they offer as firstfruits to the great high priest. Finally, we find that Cornelius himself, before he received from Peter the teaching of the word of God or the grace of baptism, heard from an angel that "his prayers and alms had ascended up to God," whence through the angel himself Cornelius seems to have been offered to God as firstfruits. We can say also of Peter and Paul that they too offer through themselves the firstfruits of the believers, as the Apostle says that "from Jerusalem round about unto Illyricum he had filled with the Gospel of Christ," and had so preached the Gospel "not where Christ had been named, lest he should build upon another man's foundation." Behold, then, Paul offering as his own fruits all those whom he taught, to whom he preached, who through him advanced in the faith, and seeking daily new fields to cultivate, and new lands to sow, and for this reason saying to certain persons: "For I desire to come to you, that I may have some fruit among you also, as also among the rest of the nations." Behold him, I say, marking out from all these fruits certain choice ones and saying of some, as we said above, that they are "the firstfruits of Asia" and others "the firstfruits of Achaia," and choosing the firstfruits of each and every one of the churches and offering them to God. But perhaps he has also some who are firstborn. And I believe that he has also some inferior to these, whom he can offer neither for firstfruits nor for firstborn, but for tithes. But also every teacher, I think, in respect of that which he teaches and preaches and instructs his hearers, may be seen to cultivate the field of that church which he teaches — that is, the hearts of the believers. He too, therefore, has the fruit of his cultivation, and among those fruits he doubtless finds some chosen and outstanding one, whom he may offer as firstfruits, and finds also those whom he offers for firstborn and others for tithes. But if it does not seem rash to venture in such matters, perhaps those men may be called firstborn of whom it is written that "they did not defile themselves with women, for they remained virgins"; or it may seem to be said also of the martyrs. And no less can the virgins of the church be understood as firstfruits, and as tithes those who after marriage have lived continently and chastely.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily11.html'
source_title="HOMILIES ON NUMBERS 11.3"

[[commentary]]
quote='''
But since the discourse took its beginning from the firstfruits of the angels, which we had said were offered by them from the cultivation of the human race, and we have been led on in the following place to the Apostles and thence to each and every teacher, let us return to the origin of the things which we had begun to examine. Therefore each and every one of the angels will be present at the judgment in the consummation of the age, leading with him those over whom he presided, whom he aided, whom he instructed, for whom he ever "saw the face of the Father who is in heaven." And I think that there too there will be an inquiry, whether the angel was wanting to the cultivation of men, or whether human sluggishness by no means responded worthily to the angelic cultivation. There will therefore be in this also a judgment of God, whether by some negligence of the ministering spirits, "who are sent for ministry and help for the sake of those who obtain the inheritance of salvation," or by the sloth of those who are helped by them, so many lapses of human life arise. But if this is so, there will therefore be a judgment of God even between angels and men, and perhaps some will be judged with Paul, and will be compared with his labors and fruits, which come from the multitude of believers; and perhaps he will be found in labors superior even to some angels, and therefore doubtless he said: "Or do you not know that we shall judge angels?" — not that Paul himself judges angels, but that Paul's work, which he did in the Gospel and toward the souls of believers, will judge some — not all, but some of the angels. And perhaps therefore Peter too, looking to these things, said: "upon whom the angels also desire to look." Although the Apostles themselves also use angels as helpers to fulfill the office of their preaching and to accomplish the work of the Gospel; for so it was said in the Acts of the Apostles that "it was Peter's angel who knocked at the door." Likewise, therefore, it is understood that there is also another angel of Paul, as there is of Peter, and another of each other Apostle, and of each in order or according to their merits, who surely must have the chief parts in the labors and teaching, whether of the Apostles or of the other teachers after them, and, together with those through whom they have worked, must carry to the threshing-floor of the Lord the fruit of the souls that through them advanced. There will therefore be, in the gathering of the fruits — that is, in the choosing of the believers — that one, for example, who was the outstanding and eminent one of that church, as firstfruits; and that one also, superior to him, of that church, as firstborn, offered by that angel, for example. And thus all this, which is foreshadowed in the law — since "the law has a shadow of the good things to come" — will in some such manner, through the ministries of the angels, be fulfilled in the truth of the good things to come, so that the things which were prefigured in that Israel which is called Israel according to the flesh may be fulfilled in the true and heavenly Israelites. For the name of Israel reaches even to the angelic orders, since indeed those will be called Israel much more truly, inasmuch as they more truly are "a mind seeing God"; for this is what "Israel" is interpreted to mean. For I think that, just as we see certain names of nations or of princes set down in the Scriptures which without any doubt are to be referred to evil angels and to contrary powers — as, for example, Pharaoh king of Egypt, and Nebuchadnezzar the Babylonian or Assyrian — so also the things which are written of holy men and of a religious nation we ought to refer to holy angels and to benevolent powers. But that the king of an impious nation is referred by Scripture to some malignant power, hear how Isaiah says of Nebuchadnezzar: "And I will bring," he says, "a sword upon the great nation, upon the prince of the Assyrians." For he says: "By my power I will do it, and by the wisdom of my understanding I will destroy the borders of the nations, and I will plunder their strength." And again elsewhere, speaking as it were of the prince of a certain nation, he says: "How did Lucifer fall from heaven, who rose in the morning?" If, therefore, the reason of truth compels all these things to be referred to certain angels of malignant power, will not by the same consequence the things also which are written of good princes or nations be referred to the angels and ministers of good powers, as we said above? But that also which we read written in Genesis, that God, without doubt speaking to the angels, says: "Come, let us confound their tongues" — what else is to be thought, except that different angels have wrought different tongues and speech among men? So that, for example, there was some one who then impressed the Babylonian tongue upon one man, and another who impressed the Egyptian upon another, and another the Greek; and thus perhaps those very ones were the princes of the different nations who also seemed to be the authors of the tongues and speech; but the tongue first given through Adam — the Hebrew, as we suppose — remained in that portion of men which was not made the part of any angel or prince, but which remained the portion of God. Meanwhile, as we had begun to say, the angels too offer firstfruits, each, I believe, of his own nation, and again each of his own church. To which angels John too in the Apocalypse seems to write — for example, to the angel of the church of the Ephesians, or of the Smyrnaeans, or of the Laodiceans, and of the others which are written. Each of the angels, therefore, offers the firstfruits either of his church or of his nation, which has been committed to him to administer; or perhaps there are also other angels from outside, who gather the faithful from all nations. And let us consider whether perhaps, just as in some city, for example, where there are not yet Christians, if someone comes and begins to teach, labors, instructs, brings men to the faith, and he himself afterwards becomes the prince and bishop of those whom he taught, so also the holy angels of those whom they have gathered from the various nations and caused to advance by their labor and ministry, may themselves also in the future become the princes of them — so that Christ is called not so much king as "King of kings," and not so much Lord as "Lord of those that rule." For if these become the kings of those whom they rule and cause to advance, they themselves therefore offer some indeed to the high priest, but some to the sons of the high priest — that is, to the higher powers and archangels — and some also to the Levites, that is, to those a little lower, if indeed it seems consequent that by some such kind the angelic orders too, as are the Israelite ones, are distinguished, since indeed the Israelites are said "to serve a shadow and copy of the heavenly things." We can therefore say that perhaps in the future, when all the fruits shall be gathered to the threshing-floor, there will be some who are the portion of the high priest — but of that true high priest, Christ. There will be others, the portion of the Levites, as we have already said above, set apart either to the angels or to other heavenly powers. But I think that there will be some who are the portion even of men — of those, at least, who in this life were prudent and faithful dispensers of the word of God. For this I think is designated by the Lord in the Gospels, where he says to him to whom he had entrusted five minas, and who had made of them ten: "Be thou having power over ten cities"; but to him to whom he had entrusted one, and who had made of it five: "Be thou having power over five cities." For what power over cities is here to be understood except the governance of souls? Whence also it seems to me that not without cause even among the angels themselves some bear power and principality over others, while others are subject and obey the power. Just as not even that one to whom power over ten cities, or that one to whom power over five cities is given, comes to such power without merit, in that he multiplied the money entrusted to him. For all things with God are done by reason and judgment, and not according to favor, but according to merit is one set to be prince of many, another to be subject to the principality. Perhaps we may seem to have wandered off in too lengthy a digression, but for those expounding the firstfruits it was necessary to examine these things also, since indeed this name is held in such great honor in the divine Scriptures that Christ himself is named firstfruits, and "the firstfruits of them that sleep." And just as Christ is "King of kings" and "Lord of lords" and shepherd of shepherds and high priest of high priests, so consequently he will also be called firstfruits of firstfruits. Which firstfruits are now offered not to a high priest, but to God, according to this: that he offered himself as a victim to God and, rising from the dead, sits at the right hand of God. But he is himself called both firstfruits and "firstborn of all creation" — which, whether it ought to be understood in such a manner throughout each and every creature, as among men he is called and understood "the firstfruits of them that sleep," or by some loftier and more divine understanding, it is not of the present time to pursue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily11.html'
source_title="HOMILIES ON NUMBERS 11.4"

[[commentary]]
quote='''
Let us return, then, to the account of the firstfruits, which we said are offered through the angels, which are gathered from the fields of this world. But the fields of the angels are our hearts. Each of them, therefore, from the field which he cultivates, offers firstfruits to God. And if I were worthy today to bring forth some great sense, worthy of the high priest, so that from all these things which we speak and teach there should be something excellent which ought to please the high priest, it might perhaps come to pass that the angel who presides over the church would choose something from all our words and, in place of firstfruits, would offer it to the Lord from the little field of my heart. But I know that I am not worthy, nor am I conscious to myself that any such sense is found in me which the angel who cultivates us would judge worthy to offer for firstfruits or for firstborn to the Lord. And would that what we speak and teach be such that we should not deserve to be condemned for our words; this grace would suffice for us. The angels, therefore, offer firstfruits from us, and each cultivates those whom by his zeal and diligence he has converted from the errors of the nations to God; and each is in the portion or care of this or that angel. And just as from the beginning of this age, when God scattered the sons of Adam, "he set the bounds of the nations according to the number of the angels of God," and each nation was made under this or that angel, but one nation, Israel, was chosen, which was "the portion of the Lord" and "the cord of his inheritance," so I believe that also at the end of this world and the beginning of another age it will come to pass that the Most High will again divide the sons of Adam; and those who could not be so clean of heart as to see God himself and be "the portion of the Lord," may see at least the holy angels and be "according to the number of the angels of God." But blessed is he who shall be worthy in that life to be "the portion of the Lord" and "his people Jacob and the cord of his inheritance, Israel." It is therefore to be desired, as we have said, that each one so advance that he may deserve to be chosen among the firstfruits or firstborn and to be offered to God and to be a part of the Lord. But if less than this, at least that he may deserve to be a part of the holy angels — only that he be not found among those of whom it is written: "They shall enter into the lower parts of the earth, they shall be delivered into the hands of the sword, they shall be portions of foxes." You see, then, that at the time of the resurrection, when the Most High shall begin to divide the nations and to scatter the sons of Adam according to their merits, there will be some who enter into the lower parts of the earth and become the portions of foxes — that is, the portions of demons. For these are the foxes that lay waste the vineyards, of which sort was also Herod, of whom it is said: "Go, tell that fox." Let us flee, therefore, from earthly deeds and earthly understanding, lest, weighed down by earthly senses, we be said to enter into the lower parts of the earth and to become the portions of foxes. For those too enter into the lower parts of the earth who receive the law of God and the good things of the promises with an understanding of earthly thought, and do not rouse the souls of their hearers to the expectation of heavenly things and the contemplation of things above, whereas the Apostle plainly says: "If you have risen with Christ, seek the things that are above, where Christ is at the right hand of God, not the things that are upon the earth" — which he was certainly saying to those who with earthly observance said, "Touch not, taste not, handle not," to which he adds: "which things are all unto corruption by the very use, according to the commandments and doctrines of men."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily11.html'
source_title="HOMILIES ON NUMBERS 11.5"
