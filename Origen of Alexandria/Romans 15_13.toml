[[commentary]]
quote='''
Now may the God of hope fill you with all joy and peace in believing, that you may abound in hope and in the power of the Holy Spirit. He who had said above what is written in Isaiah, "And in him shall the Gentiles hope," gratefully added, "Now may the God of hope"; so that, if it had been written, "in him shall the Gentiles believe," he would without doubt have added, "Now may the God of faith" — so that now, from the act of hoping, he invokes the God of hope for the Gentiles, upon those who hope in him, from whom he prays that the gift of blessing may be increased for them. And the blessing is of this kind: that they may be filled with all joy and all peace. And similarly the Prophet too says in a certain place: "And in his days shall be justice and abundance of peace, until the moon be taken away." But since these things are said of Christ, in him we can rightly perceive the abundance of peace, in that he made peace through the blood of his cross, not only for the things that are on earth, but also for the things that are in the heavens. But how what the Apostle prays for can be fulfilled in all — that they be filled with all joy and all peace — seems to me difficult to explain, especially since the Apostle himself, among the things he has obtained through the grace of the Spirit, says that he knows in part and prophesies in part. But I think that believers can have the fullness of peace in this: when they are reconciled to God the Father through faith, according to the word of Paul who says, "We beseech you on behalf of Christ, be reconciled to God"; and when they return into peace with the Son of God through the blood of his cross; and when they are joined to the Holy Spirit, once they have cleansed themselves from every defilement and have been made holy vessels — so that at last a person may be seen to be filled with all peace, if he has believed in the fullness of the Trinity. Finally, on this account the Apostle adds and says: "May he fill you with all joy and peace in believing, that you may abound in hope and in the power of the Holy Spirit." For if he who believes is fortified by the power of the Holy Spirit, it is certain that he always has fullness of joy and fullness of peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
