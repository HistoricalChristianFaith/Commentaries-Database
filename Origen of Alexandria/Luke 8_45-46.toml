[[commentary]]
quote='''
The outer man has a sense of touch; and the inner man has it too. With such a touch the woman with the flow of blood touched the edge of Jesus' garment. She truly touched Him, as follows from His question: "Who touched me?" Yet a moment before, Peter says: "The crowd presses upon You, and You say, who touched Me?" He imagines that the one who touched did so fleshly, not spiritually. Those who surrounded Jesus did not touch Him, since they did not touch Him with faith. Only the woman, who had a kind of touch-by-grace, touched Jesus, and through it was healed. And after she touched Him, power went out from Jesus at her touch-by-grace. Therefore He says: "Who touched me? For I felt power going out from me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"

[[commentary]]
quote='''
Do you wish me to show you "what" is "the soul which touched the unclean thing" and was made unclean, and again touched the clean thing and was made clean? She "who suffered an issue of blood and spent all her substance on physicians and could gain nothing" was brought down to this through the uncleanness of sin. For she had touched sin, and for that reason had received the "scourge" of the flesh. But after, full of faith, "she touched the fringe of Jesus, the flow of her blood stood still", and suddenly she was made clean who before had lived unclean for so long a time. And just as, when she had touched the Lord and Savior, he himself said: "who touched me? For I felt power go out from me" — that power, without doubt, which had healed the woman and made her clean — so it is to be understood that, if anyone touches sin, there goes out from that very sin a certain malignant power, which makes him who has touched it unclean; and this is truly to have touched the unclean thing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily03.html'
source_title="HOMILIES ON LEVITICUS 3"
