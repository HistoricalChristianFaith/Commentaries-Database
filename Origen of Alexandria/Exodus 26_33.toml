[[commentary]]
quote='''
Twofold is the house of the tabernacle of testimony or of the temple of the Lord. The first is that in which is the "altar of the whole burnt offerings", which is stirred up with perpetual fires, in which house it is lawful for the priests alone to stand and to celebrate the rites and ministries of the sacrifices, and to neither the Levites nor anyone else besides is access granted. But the second house is the interior one, separated from this only by a "veil". Within which veil are the "ark of the testament" and the "propitiatory", upon which the "two cherubim" are set, and the "altar of incense" is placed. Into this house "once in the year" whoever was first, the high priest, having first offered the victims of atonement of which we have expounded above, would enter, having both hands filled, one with the "censer of coals" and the other with the "incense of composition".… You have heard of two houses, one as it were visible and open to the priests, the other as it were invisible and inaccessible: except the one high priest alone, the rest are outside.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily09.html'
source_title="HOMILIES ON LEVITICUS 9"
