[[commentary]]
quote='''
That the going forth from Egypt is taken in two ways has already been said often, both by our predecessors and by us. For both when someone is led from the darkness of errors to the light of recognition and is converted from an earthly manner of life to spiritual institutions, he seems to have gone out of Egypt and to have come to the wilderness, namely to that state of life in which, through silence and quiet, he may be exercised by the divine laws and be imbued with heavenly utterances; instructed and directed by these, when he has crossed the Jordan, he may hasten all the way to the land of promise, that is, through the grace of baptism he may come all the way to the evangelical institutions. But we have said that there is also that figure of going forth from Egypt when the soul leaves the darkness of this world and the blindness of bodily nature and is transferred to another age, which is indicated either as the bosom of Abraham, as in Lazarus, or as paradise, as in the thief who believed from the cross; or even if God knows there to be any other places or other dwellings, through which the soul, passing and believing God and arriving all the way to that river which gladdens the city of God, may within it receive the lot of the inheritance promised to the fathers. Therefore, since in a twofold manner, as we have recalled, the going forth from Egypt is designated, and the passage to the desert, and thence the entry to the inheritance of the holy land, let us now see what Reuben and Gad and the half-tribe of Manasseh mean. The inheritance which is handed over through Moses and decreed beyond the Jordan, in the twelve tribes of the sons of Israel, by certain hidden and mystical reasons embraces the figure of the whole human race, or certainly of all men who have come to the recognition of God. Of these, then, some part obtains an inheritance beyond the Jordan through Moses, but a part receives its inheritance across the Jordan and in the land of promise through Joshua. And those indeed to whom the inheritance is decreed beyond the Jordan are the firstborn; although less noble, although not without blame, they are firstborn nonetheless. For Reuben is the firstborn of Jacob; although he defiled his father's bed, he is the firstborn nonetheless. And Gad also, although of a handmaid, yet he too is a firstborn. Manasseh also, whose half-tribe obtains beyond the Jordan, he too, although born of an Egyptian woman, is nevertheless the firstborn. All these, then, are firstborn, and therefore they designate the former people, who receive the lot of inheritance not through Joshua our Lord, but through Moses beyond the Jordan. But consider more diligently also the cause by which the former ones obtain the inheritance both beyond the Jordan and set apart from the rest. "We have," he says, "beasts and much cattle." This, then, is the cause by which the former people could not attain to the inheritance of that land which flows with milk, which abounds with honey, which is a honeycomb beyond every land, nor could it recognize the Word made flesh, because it had many beasts and much cattle. For the animal man could not perceive the things that are of the Spirit of God, nor discern them spiritually, because "man, when he was in honor, did not understand; but was compared to the senseless beasts and was made like to them," for which it received its inheritance beyond the streams of the Jordan and made itself a stranger to the holy land. That people, then, received an inheritance through Moses; it received the land of two kings only. For Moses could slay no more than two kings, whose land he divided among peoples having many animals and much cattle. But to those who cross the Jordan, Joshua divides the land; although they too have animals, have cattle, yet not so much as to exclude them, so that they should not cross the Jordan, but together with their women and with their little ones they strive to cross the Jordan and to attain the promises of the fathers. But those, on account of their cattle and beasts and their women and little ones, could not cross the Jordan nor enter the faith of Christ, which is the land of promise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily26.html'
source_title="HOMILIES ON NUMBERS 26.4"
