[[commentary]]
quote='''
"And Moses cried out to the Lord, saying: God, I pray you, heal her." And whom did it behoove to pray to the Lord for the healing of that people except Moses? Moses prays for them; and perhaps this was what he was conversing about with the Lord Jesus Christ, when he was transformed on the mountain, asking of him that, when the fullness of the Gentiles had entered in, then all Israel might be saved. "And the Lord said to Moses: if her father had spat in her face, would she not be ashamed for seven days? Let her be separated for seven days outside the camp, and after this she shall enter in." What is it, "if her father had spat in her face, she would be ashamed for seven days"? We placed Miriam in the place of the synagogue; upon her, her father spat in the face. It is a sign of repudiation to be spat upon in the face. Indeed, it is written in the law, where it is commanded that a neighbor should marry the widow left by his neighbor, that if the neighbor should wish to repudiate the marriage, he should, unshod, be spat upon in the face, and this was given as a sign of repudiation. Hence therefore Miriam, that is, that people, when she is repudiated by God, is said to be spat upon in the face. We have also in another place the signification of spittle, when Isaiah says: "all the nations are as a drop of a bucket, and are reckoned as spittle." It is shown therefore in this that that people too, like the other nations which are reckoned as spittle, has been cast off. And truly, if you consider that former honor, when the pontifical order flourished among them, when there were the insignia of priests, when the Levitical ministries, when the majesty of the temple, when the prophetic splendor, and when they enjoyed fellowships with the heavenly ones upon the earth — what an honor that was, what glory! And again, if you now look at how they bristle with such great disgrace, without temple, without altar, without sacrifice, without prophet, without priesthood, without any heavenly visitation, scattered through all the earth and living as fugitives: who would not evidently recognize that their father spat in their face and drenched their countenance with ignominy? Seven days, therefore, she is separated outside the camp. We have already said in the earlier passages too that these seven days designate the week of this world; for in the week of days the substances of all the visible creation seem to have been brought forth; for then the things which were not came to be. But in the week of the whole world, by a certain dispensation secret and known to God alone, the things which were then brought forth are unfolded. Meanwhile in this week, in which Miriam is sequestered, the camp of the children of Israel is not moved, but they stand shut up in one place and there is no advance whatever for them, until Miriam is cleansed from her leprosy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily07.html'
source_title="HOMILIES ON NUMBERS 7.4"
