[[commentary]]
quote='''
If one ought to ascend to a more hidden understanding, I would say that there were certain shepherds — angels who governed human affairs — and that, while each one of these was preserving his own charge and, keeping watch by day and by night, could now no longer bear the labor, and was industriously doing this, that he might govern the nations that had been entrusted to him, an angel came, when the Lord was born, and announced to the shepherds that the true Shepherd had arisen. For example, to come to an illustration, there was a certain shepherd of Macedonia; this one had need of the Lord's help; and therefore there appeared to Paul in his sleep a man of Macedonia, "saying: Cross over into Macedonia and help us". But why do I speak of Paul, when it was not to Paul, but to him who was in Paul, that Jesus spoke this? And so the shepherds have need of the presence of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily12.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 12"
