[[commentary]]
quote='''
Let us hasten to this life, groaning and lamenting that we are in this tent, that we abide in the body. "As long as we dwell in the body, we are away from the Lord." Let us prefer to leave the body and take up our dwelling with the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
