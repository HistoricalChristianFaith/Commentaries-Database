[[commentary]]
quote='''
See, then, the greatness of the Savior, how it has been poured out over the whole world — and certainly I have not yet set forth his true greatness. Ascend into the heavens and see him, how he has filled the heavenly places: for indeed "he appeared to the angels". Descend in thought into the depths, and you will see that he descended there also. For "he who descended is the same also who ascended, that he might fill all things", "that at the name of Jesus every knee should bow, of things in heaven and things on earth and things under the earth". Consider the power of the Lord, how he has filled the world — that is, the heavenly and the earthly and the infernal things — how he has penetrated heaven itself and ascended to the things above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily06.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 6"
