[[commentary]]
quote='''
But because the angel greeted Mary with a new form of speech, which I could not find in all of Scripture, a few things must be said about this also. For what he says, "Hail, full of grace", which in Greek is "κεχαριτωμένη" (one filled with grace), where I have read it elsewhere in the Scriptures I do not recall; nor is such a form of speech addressed to a man — "hail, full of grace". This greeting was reserved for Mary alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily06.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 6"
