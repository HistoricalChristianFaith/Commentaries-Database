[[commentary]]
quote='''
But first, if it seems good, let us sketch a picture of the historical event itself, so that, once the appearance of the thing done has become clear, then at last we may also inquire whether there is anything mystical in the passage. Understand, then, that people Israel arranged in the camp by the ranks of their tribes and families, and understand that a certain power sent from God began to lay waste the people with death, not scattered here and there, but beginning from some first portion, and consider the slaughter of death advancing in order; and after this the high priest, clothed in his priestly garment, coming forward and carrying a censer and reaching out with fire and incense toward that place to which death, brought by the destroying angel, had arrived, and standing in that place in which death had made an end of the first and was near to the last. Behold the high priest standing and, by the interposition of himself, as it were, separating the living from the dead; behold that the destroying angel was put to shame by the power of his propitiation and by the mystery of the incense, and that in this death was indeed brought to an end and life restored. If you have understood the order of the history and have been able, so to speak, to behold with your eyes the high priest standing in the midst between the living and the dead: ascend now to the loftier summits of this word, and see how the true high priest, Jesus Christ, having taken up the censer of human flesh and set upon it the fire of the altar—that is, without doubt, that magnificent soul with which he was born in the flesh—and having added also the incense, which is the immaculate spirit, stood in the midst between the living and the dead and did not allow death to rage any longer, but, as the Apostle says, "destroyed him who had the power of death, that is, the devil," so that whoever believes in him should no longer die, but should live forever. This, then, was the mystery which, though yet to come, that one who was laying waste the people already dreaded even then. For he recognized the figure of the censer and the fire and the incense; and he foresaw what sort of victim was to be offered to God by him who had stood in the midst between the dead and the living. And them indeed the prefigured image saved at that time, but to us the very truth of salvation has come. For that destroying angel would not have been put to shame by garments of the high priest woven of purple and wool and fine linen, but he understood those garments of the great high priest which were to come, and he yielded to those things to which assuredly the whole creation was inferior. But I think that this form was fulfilled not only at the first coming of our Lord and Savior, but perhaps the same will also be preserved at the second. For the Son of Man will come again, and, when he comes, he will without doubt find some indeed dead, but some living. This we can understand in this way, that some are still found in this state of life in which we now are, while many have already gone before in death. But it can also be taken otherwise, so that we understand the dead to be bodies, and the living souls. Yet some of those who before us have interpreted this passage—I remember that they called dead those who by the excess of their crimes are understood to be dead in their sins, but living those who have persevered in the works of life. But in whichever way, this great high priest and our Savior will stand also in the future in the midst between the living and the dead. But then too he is perhaps to be said to stand in the midst between the living and the dead, when he will set the sheep indeed at his right hand, but the goats at his left, and will say to those who are at his right: "Come, blessed of my Father, receive the kingdom which was prepared for you from the foundation of the world," and the rest; but to those who are at his left he will say: "Depart into the eternal fire, you workers of iniquity, which my Father prepared for the devil and his angels; for I never knew you." And those indeed who are sent into the eternal fire are the dead; but those who are sent to the kingdom are the living.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily09.html'
source_title="HOMILIES ON NUMBERS 9.5"

[[commentary]]
quote='''
"And the plague ceased," it says, or, as we said is read in other copies, "the breaking," which also better fits the true interpretation; for a "breaking" is what happens, as it were, in vessels of clay. Sinners, then, become vessels of clay, as the prophet Jeremiah indicates in the Lamentations, saying: "The sons of Zion, who were honorable and lifted up in gold, how are they counted as vessels of clay, the works of the potter's hands?" And: "In a great house," says the Apostle, "there are not only vessels of gold and silver, but also of wood and clay, and some indeed unto honor, but others unto dishonor." There are, then, vessels of clay unto dishonor, which also can be broken. But let us consider more carefully what the Apostle says in what follows concerning these very vessels of clay: "If anyone," he says, "shall have cleansed himself from these, he will be a vessel unto honor, sanctified and useful to the Lord, prepared for every good work." In which he seems to show that both the vessel itself, which is made, and the one by whom it is made, is one and the same man. Understand, therefore, that the purpose of the man is what he works, but the remaining part of the man is the vessel itself, which is made either unto honor or unto dishonor. When, therefore, our sense chooses the things that are good and draws us to a good manner of life, it makes us a useful vessel. But when our purpose has grown neglectful and has fallen away from good things, we are made a vessel unto dishonor. If, therefore, our understanding is of clay and always thinks of clay and of earthly things, we are made a vessel of clay and the work of the potter's hands. And perhaps for this reason such a man is rebuked by the Apostle, as one who, having a sense of clay and earthly, inquires about great things and about those which he cannot grasp, and says: "Why then does he still complain? For who resists his will?" To whom the Apostle, as to one of clay, replies: "Who art thou, O man, that repliest against God? Does the thing formed say to him who formed it: Why hast thou made me thus?" Moreover, either our body is called a vessel of clay, or also the letter of the law, in that place where the Apostle says: "But having this treasure in vessels of clay"; for both may be taken in this saying: both that the Lord bestows on us, placed in a body, the treasure of grace through the Holy Spirit, and that in the words of the law, which are held cheap and in contempt because they seem polished by no grammatical art, there is stored up the treasure of the wisdom and knowledge of God, so that it may deservedly be said that in them are hidden the treasures of the wisdom and knowledge of God. Let these things have been said by us concerning the breaking, which is recorded to have ceased; but now let us also discuss a few things concerning the following narrative, in which the mention of the rods is introduced.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily09.html'
source_title="HOMILIES ON NUMBERS 9.6"
