[[commentary]]
quote='''
For if she had had no husband, soon would the thought have stolen into the Devil's mind, how she who had known no man could be pregnant. It was right that the conception should be Divine, something more exalted than human nature.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then Scripture recalls that "in the sixth month" of Elizabeth's conception "the angel Gabriel was sent from God into a city of Galilee, whose name was Nazareth, to a virgin betrothed to a man whose name was Joseph, of the house of David; and the virgin's name was Mary". Again, turning it over in my mind, I ask why God, when once he had determined that the Savior should be born of a "virgin", did not choose a girl without a betrothed, but rather her especially who had already been "betrothed". And unless I am mistaken, this is the reason: He ought to be born of that virgin who not only had a betrothed, but, as Matthew writes, had already been handed over to a man, although the man did not yet know her, lest her very condition should display the shame of a virgin, if she were seen to be a virgin with a swelling womb. Hence I found it elegantly written in the letter of a certain martyr — I mean Ignatius, the second bishop of Antioch after Peter, who in the persecution at Rome fought against the beasts: "the virginity of Mary was hidden from the prince of this world"; it was hidden because of Joseph, hidden because of the marriage, hidden because she was thought to have a husband. For if she had not had a betrothed and, as was supposed, a husband, she could in no way have been hidden from "the prince of this world". For at once a silent thought would have crept upon the devil: how is this woman, who has not lain with a man, pregnant? This conception must be divine, it must be something loftier than human nature. On the contrary, the Savior had arranged his dispensation and the assumption of a body so that the devil should not know it: hence in his birth he concealed him, and afterward he charged his disciples "not to make him manifest". And when he was tempted by the devil himself, he nowhere confessed himself to be the Son of God, but answered only: it is not fitting that I should worship you, nor that I should make these stones into bread, nor that I should cast myself down from on high. And while he said these things, he was always silent that he was the Son of God. Look also in another Scripture, and you will find that it was Christ's will that the devil should not know the coming of the Son of God. For the Apostle, affirming that the opposing powers did not know his passion, says: "we speak wisdom among the perfect, yet a wisdom not of this world, nor of the princes of this world, who are brought to nothing; but we speak the wisdom of God hidden in a mystery, which none of the princes of this world knew. For if they had known it, they would never have crucified the Lord of glory". The mystery of the Savior, therefore, was hidden from the princes of this world. But as for what can be objected on the contrary, it seems to me it must be resolved before it is put forward by another — namely, by what reasoning that which was hidden from the princes of this world was not hidden from the demon who spoke in the Gospel: "have you come here before the time to torment us? we know who you are, the Son of God". But consider that the lesser in malice knew the Savior; whereas he who is greater in wickedness and crafty and vile, by that very fact that he is greater in evil, is hindered from knowing the Son of God. We ourselves too, if we have less of evil, can more easily advance to virtue; but if there be more of evil in us, we must sweat with immense labor to be freed from the greater malice. So much concerning the fact that Mary had a betrothed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily06.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 6"
