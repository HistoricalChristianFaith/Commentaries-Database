[[commentary]]
quote='''
…The enchanters of the Egyptians also had rods, rods that wished to slander the rod of Moses and that of Aaron as though they were not from God. But those from God overturn those of the sophists and enchanters: "the rod of Aaron swallowed them up"; for this rod sufficed for this even without the rod of Moses. So Paschor "struck Jeremiah the prophet," and with emphasis: "and he struck Jeremiah the prophet." "The prophet" is added. Here, then, the one who struck struck Jeremiah the prophet. But it is recorded in the Acts that someone struck Paul, being ordered to do so by Ananias the high priest. Wherefore Paul said: "God is going to strike you, you whitewashed wall." And even now the Ebionites, ordered by a transgressing high priest of the word, strike the apostle of Jesus Christ with blasphemous words. And Paul says to such a high priest of the word: "God is going to strike you." And such a high priest is on the surface fair and a whitewashed wall, but "within full of dead men's bones and all uncleanness." But why do I speak concerning Paul and Jeremiah? My Lord Jesus Christ himself says: "I gave my back to scourges, and my cheeks to blows, and I did not turn my face away from the shame of spitting." The simple know these things as belonging only to that time then, when Pilate scourged him, when the Jews took counsel against him. But I see Jesus daily "giving his back to scourges." Enter into the synagogues of the Jews, and see Jesus scourged by them with the tongue of blasphemy. See those gathered from the nations, taking counsel against Christians—in what manner they seize Jesus—and he "gives his own back to scourges." Consider the Word of God insulted, spoken against, hated by the unbelievers. See that "he gave his cheeks to blows," and having taught that if anyone strike "you on the cheek, turn to him the other also," he himself does this. So many strike him and scourge him, and he is silent and does not speak. For it is recorded that he did not speak while being scourged. And "his face until now Jesus has not turned away from the shame of spitting." Which of those who make light of the teaching does not, as it were, spit even until now upon the Jesus who endures it?

It followed, after the prophet had been struck, to recount those who were struck—as, for instance, to speak of the apostle and if any other has been struck, and to set forth also the things concerning Jesus himself. So "Paschor struck Jeremiah the prophet, and cast him into the dungeon which was in the gate of Benjamin of the upper chamber." The dungeon of the upper chamber was Benjamin's. Jerusalem is the allotted inheritance of Benjamin, in which is the temple of God, as one able to hear the divine readings will find from the inheritance recorded in the book of Nun (Joshua). Since, then, the temple was in the inheritance of Benjamin, which is interpreted "Son of the right hand" (for there is nothing on the left concerning the temple of God), for this reason this man casts him "into the dungeon which was in the gate of Benjamin of the upper chamber of the house of the Lord." Though an "upper chamber in the house of the Lord" was present, "he cast" the prophet "into the dungeon." And let us too exhort, that having now taken Jeremiah we may bring him up to the upper chamber "in the house of the Lord." And I will show from the Scripture that the upper chamber is the lofty and exalted mind, when it bears witness to the saints that they received the prophets into the upper chambers. In the third book of Kingdoms there is recorded a widow who received Elijah the prophet in Sarepta of Sidonia, who lodged the prophet "in her upper chamber." And in the fourth book, the woman who received Elisha prepared for him a house in the upper chamber. But the sinner Ochozias fell from the upper chamber. And Jesus enjoins you also not to come down from the housetop. For "when," he says, such and such things happen, "then" "let him who is on the housetop not come down to take the things out of his house." He who flees in the persecutions is not told, "let him not go up onto the housetop," but, "let him not come down from the housetop to take the things out of his house." It is good, then, to be in upper chambers, good to be on housetops and to be somewhere up above. And the wondrous apostles too, as it is recorded of them in the Acts, when, being together in one place, they gave their leisure to the prayers and to the word of God, were in an upper chamber. And since they were in an upper chamber, they were not below. For this reason "there appeared to them divided tongues as of fire." But Peter too, when he sent up his prayer to God, "went up onto the housetop"; and if he had not gone up onto the housetop, he would not have seen "a vessel descending from heaven like a sheet let down from heaven by four corners." But she too who did the almsdeeds, "Tabitha, which by interpretation is called Dorcas," was not below, but "in the upper chamber," where Peter went up and raised her from the dead. But Jesus too, when he was about to celebrate this feast whose symbol we perform, the Passover, with his disciples, when they inquired of him, "Where do you wish that we should prepare for you the Passover?" said: "As you go, a man will meet you carrying a pitcher of water; follow him. That man will show you a large upper room, furnished, swept, ready; there prepare the Passover." No one, then, who keeps the Passover as Jesus keeps Jesus' Passover, is above in a large upper room, in a swept upper room, in an upper room adorned and ready. And if you go up with him to celebrate the Passover, he gives you the cup of the new covenant, he gives you also the bread of blessing, he bestows his own body and his own blood. For this reason we exhort you: "Go up to the height, lift up your eyes to the height." And to me too, if I teach the divine word, the word says: "Go up onto a high mountain, you who bring good tidings to Zion; lift up your voice with strength, you who bring good tidings to Jerusalem; lift it up, do not be afraid." These things are said because of Paschor, that though an "upper chamber in the house of the Lord at the gate of Benjamin" was at hand, he did not bring the prophet up into the upper chamber, but "cast him into the dungeon" below.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily19.html'
source_title="HOMILIES ON JEREMIAH 19"
