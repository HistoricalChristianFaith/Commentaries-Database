[[commentary]]
quote='''
But not only are vestments needful for the priestly insignia, but also girdles. But before we begin to speak of the very kind of the vestments, I should like to compare those unhappy garments with which the first man, when he had sinned, was clothed, with these holy and faithful garments. And indeed those are said to have been made by God: "for God made," he says, "tunics of skins, and clothed Adam and his wife." Those tunics, then, were of skins taken from animals. For with such a sinner had to be clothed, "with tunics," he says, "of skins", which were to be a token of the mortality which he had received on account of sin, and of his fragility, which came from the corruption of the flesh. But if you have now been washed from these things and purified through the law of God, Moses will clothe you with the garment of incorruption, so that nowhere may "your shame appear" and "that this mortal may be swallowed up by life".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily06.html'
source_title="HOMILIES ON LEVITICUS 6"
