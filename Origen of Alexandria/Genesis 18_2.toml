[[commentary]]
quote='''
Let us first compare, if it seems good, this vision with the one that took place with Lot. "Three men" come to Abraham and stand "over him"; to Lot "two" come and sit "in the street." See whether the matters are not carried out by the dispensation of the Holy Spirit according to merits. For Lot was far inferior to Abraham. For unless he had been inferior, he would not have been separated from Abraham, nor would he have said to him: "If you go to the right, I will go to the left; if you go to the left, I will go to the right." And unless he had been inferior, the land and dwelling of Sodom would not have pleased him. Therefore three men come to Abraham at midday, and to Lot two come, and in the evening. For Lot could not contain the greatness of the midday light; but Abraham was capable of receiving the full radiance of the light. Let us now see how Abraham received those who came and how Lot did, and let us compare what the hospitality of each was. But first observe that with Abraham, together with the two angels, the Lord also was present, whereas to Lot only two angels proceed. And what do they say? "The Lord has sent us to crush the city and to destroy it." That one, therefore, received those who would give it over to destruction; he did not receive the one who would save; but Abraham received both the one who saves and those who destroy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.1"


[[commentary]]
quote='''
But let us now for the present pursue what Abraham does with the three men who "stood over him." See this very thing, what kind of thing it is, that they come "over him," not against him. For he had subjected himself to the will of God, and therefore God is said to stand "over him."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.2"


[[commentary]]
quote='''
Now let us see how each one receives. "Abraham saw," it says, "and ran to meet them." Consider at once how tireless and eager Abraham is in his duties. He himself runs to meet them, and when he had met them: "he hastens back," it says, "to the tent and says to his wife: hasten to the tent." See in each detail how great is the eagerness of the one receiving. There is haste in everything, everything is urged on, nothing is done in leisure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.1"
