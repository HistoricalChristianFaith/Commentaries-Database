[[commentary]]
quote='''
"But he himself ran," it says, "to the cattle and took a calf." What kind of calf? Perhaps the one that could happen to run up first? It is not so, but a "good and tender" calf. And although he hastens in all things, yet he knows what things, being chief and great, are to be offered to the Lord or to the angels. He took therefore, or rather chose, from the herd a "good and tender" calf and handed it to the servant boy. "The boy," it says, "hastened to prepare it." He himself runs, the wife hastens, the boy makes speed; no one is sluggish in the house of the wise man. He sets forth therefore the calf and together with it the loaves and the fine flour, but also milk and butter. These are the duties of hospitality of Abraham and Sarah. Now let us see also what Lot does. This one has neither fine flour nor clean bread, but meal. He knows neither three measures of fine flour, nor is he able to set before those who come ἐγχρυφίας, that is, hidden and mystical loaves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.1"


[[commentary]]
quote='''
A calf is set forth—behold, another sacrament. The calf itself is not tough, but "good and tender." And what is so tender, what so good as he who "humbled himself" for us "even unto death" and "laid down his soul" "for his friends"? That "fatted calf" which the father slaughters for the son received back in repentance. "For God so loved this world, that he gave his only Son" for the life of this world. Yet it does not escape the wise man whom he had received. He meets three and adores one and speaks to one, saying: "Turn aside to your servant and refresh yourself under the tree."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.2"
