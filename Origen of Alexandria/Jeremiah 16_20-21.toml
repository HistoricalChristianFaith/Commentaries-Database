[[commentary]]
quote='''
"Shall a man make gods for himself?" Not only from images do human beings make gods for themselves, but you will find human beings making gods for themselves also from fabrications; for as many as are able to fabricate another god and another cosmogony besides the one recorded by the Spirit, a dispensation of the world besides the true world, all these have made gods for themselves and have worshiped the works of their hands. For instance, conceive for me, whether among the Greeks those who begot doctrines, say, of this philosophy or of that, or among the heresies those who first begot doctrines, these have made for themselves idols and fabrications of the soul, and turning aside have worshiped the works of their own hands, having accepted their own fabrications as truth. Convicting, then, all those who make gods for themselves both perceptibly and intelligibly, the word says: "Shall a man make gods for himself, and are these not gods? Therefore, behold, I will show them my hand at this time, and I will make known to them my power." At what time but this? And indicating the time of the coming of the Lord: "And they shall know," he says, "that my name is Lord."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily16.html'
source_title="HOMILIES ON JEREMIAH 16"
