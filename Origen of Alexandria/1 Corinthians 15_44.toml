[[commentary]]
quote='''
In regard to our bodily nature we must understand that there is not one body which we now use in lowliness and corruption and weakness and a different one which we are to use hereafter in incorruption and power and glory. Rather this same body, having cast off the weaknesses of its present existence, will be transformed into a thing of glory and made spiritual, with the result that what was a vessel of dishonor shall itself be purified and become a vessel of honor and a habitation of blessedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25203.html'
source_title="ON FIRST PRINCIPLES 3.6.6"


[[commentary]]
quote='''
The quality of a spiritual body is something such as will make a fitting habitation not only for all saints and perfected souls but also for that "whole creation" which is to be "delivered from the bondage of corruption."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25203.html'
source_title="ON FIRST PRINCIPLES 3.6.4"


[[commentary]]
quote='''
It is from the natural body that the power and grace of the resurrection calls forth the spiritual body, when it changes it from dishonor to glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25202.html'
source_title="ON FIRST PRINCIPLES 2.10.1"


[[commentary]]
quote='''
Since our Savior and Lord took on a body, let us investigate what this body was. … Since the firstfruits was raised from the dead, the dead too must be raised. The firstfruits is Christ; therefore His body became a corpse. For if His body had not become a corpse, it would not have become capable of being wrapped in a shroud, of being anointed with myrrh and all that is used in the burial of the dead, of being buried in a tomb — all those things which a spiritual body could not have undergone. For it is absolutely impossible for the spiritual to become dead, just as it is impossible for the spiritual to be deprived of sensation. For if it were indeed possible for the spiritual to become dead, it would be necessary to fear that after the resurrection, when our body has been raised, as the Apostle says, "the natural is sown, the spiritual rises," — we should all die.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
