[[commentary]]
quote='''
In short, right at the beginnings, what does Adam himself say? "This now is bone of my bones and flesh of my flesh", and yet he does not add: and soul of my soul. But I would have you tell me, O Adam: if you recognized "bone of" your "bones" and perceived "flesh of" your "flesh", why did you not understand that a soul too had proceeded from your soul? For if you handed over all the things that were in you, why do you not make mention of the soul as well along with the rest, which is the better part of the whole man? But it seems that by these words he gives to those who understand an indication that, when he says "bone of my bones, and flesh of my flesh", he professes those things which are of the earth to be his own, but does not dare to call his own the things which he knows are not of the earth. But Laban likewise, when he says to Jacob that "you are my bone and my flesh", he too does not seem to dare to call anything more his own than what he recognizes as of earthly kinship. For there is another kinship of souls, which is either associated with Jacob as he goes down into Egypt, or is ascribed to the rest of the patriarchs and saints under the enumeration of a mystical posterity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily01.html'
source_title="HOMILIES ON EXODUS 1"
