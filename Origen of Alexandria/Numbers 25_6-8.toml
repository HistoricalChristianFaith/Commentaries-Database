[[commentary]]
quote='''
After these things it is reported that, when Phinehas the son of Eleazar the son of Aaron the priest had seen a certain Israelite man go in to a Midianite woman, he snatched up a lance in his hand, entered the brothel, and pierced them both through their very shameful parts. And for this, it says, the Lord said to Moses: "Phinehas the son of Eleazar the son of Aaron has quieted my anger." Let these things have edified the former people; but you, who have been redeemed by Christ, and from whose hands the bodily sword has been taken away and the sword of the spirit given, snatch up this sword; and if you see an Israelite thought whoring with Midianite harlots — that is, wallowing with diabolical thoughts — do not spare, do not dissemble, but at once strike, at once destroy. The very womb also — that is, discerning and penetrating the secrets of nature — cut away that very kindling of sin, lest it conceive further, lest it generate further and the accursed offspring of sins contaminate the camp of Israel. For if you do this, you will straightway quiet the wrath of the Lord; for you have anticipated the day of judgment, which is called the day of wrath and fury, and, with the kindling of sin — which now is called the womb of the Midianite woman — exterminated from you, you will come secure to the day of judgment. And therefore, rising up, let us pray that we may find this sword of the spirit always ready, through which both the seeds themselves and the receptacles of sins may be exterminated, and that God may become favorable to us through the true Phinehas, our very Lord Jesus Christ, to whom be glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily20.html'
source_title="HOMILIES ON NUMBERS 20.5"
