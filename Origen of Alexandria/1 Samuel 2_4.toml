[[commentary]]
quote='''
"The bow of the mighty was made weak." The darts of the malign one, which are called fiery, are sent forth through the bow of the mighty. Now by the mighty are meant the adverse powers, of which it is said, "for behold, the sinners have bent the bow, and in it have prepared vessels of death." And again: "He made his arrows for them that burn." But now too it is said, that "the bow of the mighty was made weak." For if thou be clothed with the arms of God, if thou be fortified with the shield of faith and covered with the helmet of salvation, and with the breastplate of charity, and girded with the sword of the spirit, the bow of the mighty against thee, because of such defenses, will be made weak. For if he have hurled against thee some one fiery dart, it, received on the shield of faith, is straightway extinguished. He has cast another dart also, and it too is repelled by the breastplate of righteousness. He has cast a third also, and it too is cut off by the sword of the spirit. He sends perhaps a fourth also, which likewise is thrown off by the helmet of salvation. And when, through all these, the man of God who is assailed has remained invulnerable, then by the bow of the mighty he will by no means, though so many darts be aimed, be made weak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.16"


[[commentary]]
quote='''
"And the weak were girded with strength." If we see how "God chose the foolish things of the world, that he might confound the wise, and the weak things of the world, that he might confound the strong," thou understandest how the weak were girded with strength. Weak was the gentile people, inasmuch as it was a stranger to the covenant of God: this obtained strength. What strength? "My strength and my praise is the Lord, and he is become to me for salvation." My strength, therefore, is Christ the Lord himself, with whom we were girded, we who were once strangers to the covenant of God, and without God in this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.17"
