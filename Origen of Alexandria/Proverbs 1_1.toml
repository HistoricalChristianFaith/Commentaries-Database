[[commentary]]
quote='''
he evidently shows at the very beginning of his Proverbs. First of all, by this very fact, that he entitled his little book "Proverbs" — which name, of course, signifies that one thing is said openly, but another is indicated inwardly. For this both the common usage of proverbs teaches, and John in the Gospel writes that the Savior spoke thus, saying: "These things I have spoken to you in proverbs; the hour will come when I shall no longer speak to you in proverbs, but shall announce to you plainly concerning the Father." So much, then, in the very inscription of the title.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"


[[commentary]]
quote='''
why is it that Solomon, who in these three little books seems to comply with the will of the Holy Spirit, is in Proverbs indeed called "Solomon the son of David, who reigned in Israel" … Therefore in the first book, that of Proverbs, when he instructs us in moral disciplines, he is said to be king in Israel, but not yet in Jerusalem: because although we are called Israel on account of faith, nevertheless it has not yet been attained that we should seem to have arrived at the heavenly Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"
