[[commentary]]
quote='''
What, then, does Scripture say concerning this Othniel? After it had said that "the children of Israel cried out to the Lord," "the Spirit of the Lord came," it says, "upon Othniel, and he judged Israel." Do you suppose there is among us anyone who so "sends forth to the Lord a cry" so strong and so just that he is worthy to be heard, and the people deserve to receive a judge — and such a judge, one whom the "Spirit of God" may fill, that he may be able to hold to right judgment? Whence also the book itself is called the book of Judges, and in it are described the judges who judged the people. For just as other books are called the books of Kings, or of Kingdoms, in which is described each of the kings, how he reigned and what he did, so also in this little book the deeds of the Judges are recounted, and there is described not only whatever was done rightly and usefully by them, but also whatever was blamably committed. Yet if you ask why both are described, it is this: that now the leaders or judges of the Church, perceiving those things which were done praiseworthily by them, may follow the examples of the former ones; but if any things in them are blamed, that these may beware and turn aside. Great praise, therefore, of this first judge Othniel is recounted, in that "the Spirit of God came upon him" and through the Spirit of God he "judged Israel," which I do not well remember to have been said of any other. There are therefore even today very many judges of all the churches which are under heaven, to whom has been given the judgment not only of deeds done, but also of souls. But I do not know whether there is any such judge of the Church whom "God makes worthy to fill with his Spirit," so that, just as this Othniel was adorned with the testimony of Scripture, so also they themselves, for whom we wish this, may deserve the testimony of God. He says therefore: "and the Spirit of the Lord came upon him, and he judged Israel. And he went out to war, and the Lord handed over into his hands Cushan-rishathaim the king." Why this? Because the "Spirit of the Lord" was in him, and "his hand was strengthened over Cushan-rishathaim."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily03.html'
source_title="HOMILIES ON JUDGES 3"
