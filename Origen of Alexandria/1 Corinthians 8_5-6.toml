[[commentary]]
quote='''
From this, I think, the Apostle Paul also took what he writes to the Corinthians, saying: "for even if there are those that are called gods, whether in heaven or on earth". And he adds: "as indeed there are many gods and many lords, but for us there is one God the Father, from whom are all things and we unto him, and one Lord Jesus Christ, through whom are all things and we through him".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
