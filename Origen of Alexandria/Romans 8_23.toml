[[commentary]]
quote='''
"And not only so, but we ourselves also, having the firstfruits of the Spirit, even we ourselves groan within ourselves, awaiting the adoption of sons, the redemption of our body. For by hope we have been saved. But hope that is seen is not hope. For what a man sees, why does he hope for it? But if we hope for what we do not see, we await it through patience." We have often taught that it is a habit of apostolic speech that, when he says "And not only so," and adds nothing to which it ought to be fitted, it must be referred to the things said above — as is given us to understand in the present passage also. For what he seems to be saying is of this sort: Not only does every creature groan together and suffer together; but we ourselves also, having the firstfruits of the Spirit, groan within ourselves. For we too await the adoption of the sons of God, and the redemption of our body. Although by this very fact that we believe in Christ we already know that salvation has been granted us, nevertheless that salvation is still in hope, not in the sight of things visible. For if it were already seen, it certainly would not be hoped for. For a man hopes in order that he may see. But if he sees the things he was hoping for, it is superfluous to hope any longer for what he sees. We, however, do not have our hope in the things that are seen, lest our hope be empty, but in the things that are not seen. And therefore, because we hope for the things that are not seen, and they are so great and so glorious that they are obtained only through many labors and many tribulations and dangers, for that reason we await them through patience, as things that will scarcely come at some time. These things we have said by way of giving a certain direct and clearer order to the apostolic words themselves. Now, if it seems good, let us see what he indicates by this new expression, in which he said: "But we ourselves also, having the firstfruits of the Spirit." For we know that it is written in the Law: "You shall not defraud the firstfruits of the threshing floor and the firstfruits of the winepress"; and again: "You shall bring the firstfruits of all your crops into the house of the Lord your God." What then? Just as the firstfruits of the threshing floor and the firstfruits of the winepress are of the same crop as the rest of the threshing floor is, or of the same liquid as the winepress is, will it likewise seem that what he calls the firstfruits of the Spirit is some one preeminent spirit out of the many remaining holy and blessed spirits? Or shall we rather understand this: that, according to what we have discussed above, there are many ministering spirits serving in ministry on account of those who receive the inheritance of salvation, under whom each of the believers is placed and trained as under guardians and stewards until the time prefixed by the Father — that is, until the soul arrives at the lawful age of perfection, where a man, having now passed beyond the spirit of bondage which he had received in fear, by which he was kept as by a tutor, is made worthy to receive the spirit of adoption, the firstfruits of the Spirit, through which, adopted into a son, he may also be joined to the company of the firstborn of the Church which is in the heavens? And just as it differs greatly to be a son rather than a slave, so the Holy Spirit differs greatly from the ministering spirits — the Spirit whose firstfruits Paul says that he and those like him possess. Let this be one way by which we have been able to track out the understanding of this saying. Let us now see another as well. We read in the apostle Paul himself that the gifts or graces of the Holy Spirit are called many spirits, as when he says: "But now, since you are zealous for spirits, seek that you may abound unto the edification of the Church"; and likewise elsewhere: "The spirits of the prophets are subject to the prophets" — calling the spirits of the prophets subject, not as though they were inferior to a better one, but for this reason, that one who has the spirit of prophecy is not compelled to speak unwillingly, as those are who have unclean spirits, but he speaks when he wills and when reason demands; whereas when it does not seem opportune to speak, he keeps silence, knowing well that there is a time for keeping silence and a time for speaking. And therefore it is not said to their reproach that the spirits are subject to the prophets, but with a view to the dispensation — just as we also take that saying about the Savior, that "then the Son himself also will be subject to him who subjected all things to himself." For here too "subject" is not said as though he were inferior. For how can he be called inferior who is the Son and is all the things that the Father is? "For all things," he says, "Father, that are yours are mine." But in those whom he subjects to the Father, namely those who believe in him — since he says that he is in each one of them, and says that he hungers and thirsts and is naked in them, and professes that he is fed and clothed in them — for that reason he too is said to be subject in them. But let these things be said by way of a certain digression. Now, however, let us return to the matter proposed. The diverse gifts of the Spirit, then, are called by Paul many spirits. And of these many gifts, whatever is highest and greatest the apostles without doubt obtained, so that they might be fit — as Paul himself says — ministers of the New Testament, and so that they might be able to fulfill the Gospel from Jerusalem round about as far as Illyricum. This gift of the Holy Spirit, therefore, which was conferred upon them more sublimely and more splendidly than upon the rest, he rightly called the firstfruits of the Holy Spirit. And therefore he says, "but we ourselves also." In which he seems especially to designate the apostolic dignity. "We" therefore, he says, "ourselves" — that is, the apostles — "having the firstfruits of the Spirit," we who have been chosen for this, that we should receive the firstfruits of the Spirit, "even we ourselves groan within ourselves." To such a degree, he says, is there no creature that is free from griefs and groans, that even we ourselves, who have received the highest and choicest gifts from the Holy Spirit, nevertheless, awaiting the adoption of sons — that is, the perfection of those whom we have been sent to teach and instruct — until we see them advance so far that they deserve to be adopted as sons, necessarily grieve and groan. So long, then, I say, as we who are being instructed by them are negligent, and delay, and put off the time of our amendment further, so long as we do not seek the invisible things but take delight in the visible, we stir up griefs for the apostles, and rouse, so to speak, the mourning and groans of the whole creation. For the whole creation groans together and suffers together, sighing over the losses caused by our hardness and dissembling. This is another order of explanation for us concerning the firstfruits of the Spirit; you will see whether it presents itself as one to be approved. But we shall still add a third as well. The same Apostle says again concerning the Lord Jesus Christ that he is "the firstborn of every creature." Perhaps, then, just as he is called "the firstborn of every creature," by some such reasoning the Holy Spirit too is called the firstfruits of the many spirits. Let this also be a third mode of exposition. But let the reader judge which of these better agrees with the apostolic sense. If, however, you take what he said, "And we ourselves having the firstfruits of the Spirit," as said of all who are seen to have obtained the grace of baptism, then that must be hoped for which the same Apostle said: "But if the firstfruits are holy, so also is the lump; and if the root is holy, so also are the branches." And even if this be so, nevertheless of that very lump, in which the multitude of the faithful seems to be indicated, the firstfruits will necessarily be seen to be placed in the apostles. For thus it is written, that "in the Church God has placed first apostles, second prophets, third teachers." Those therefore who have been appointed in the first rank are fittingly believed to have the firstfruits of the Holy Spirit's spiritual grace. Now let us see how he can say that he awaits the adoption of sons, when he said in the passages above that "the Spirit himself bears witness to our spirit that we are sons of God"; and again, how he can hope for the redemption of the body, when he says elsewhere: "Christ has redeemed us." But, as it seems to me, he himself resolves this by the words that follow. For he says: "By hope we have been made safe." That we are sons, therefore, and that we have been redeemed, and that we have been saved, stands in hope. "For now we see through a mirror, and in an enigma; but then face to face": through a mirror, then, and in an enigma we receive both adoption and redemption. For "the fullness of times has come," and "God sent his Son, made of a woman, made under the law, that he might redeem those who were under the law, so that we might receive the adoption of sons." We receive adoption, therefore, but that adoption which is through a mirror and in an enigma. But when the things that are perfect have come, then we shall obtain adoption "face to face." As for his saying "the redemption of our body," I think that he indicates the body of the whole Church, just as he says elsewhere: "But you are the body of Christ, and members in part." The Apostle therefore hopes that the whole body of the Church is to be redeemed, and he does not think that the things which are perfect can be given to the several individual members, unless the entire body has been gathered together into one. But it can also be understood in this way, that he calls "the redemption of our body" that redemption which is to come at the resurrection, when not only souls but bodies also will come "before the tribunal of Christ, that each one may carry back the proper things of the body according as he has done," and according to that which was said: "Fear rather him who is able to destroy both body and soul in Gehenna." And therefore each one must grieve in this world and groan, lest perchance through evil deeds and the negligence of the present life he fail to deserve to obtain the redemption of his body, but instead that sentence find him which condemns body and soul to the fires of Gehenna.
'''
