[[commentary]]
quote='''
But since we do not undertake to expound the continuation of the song point by point, let us at least, skipping over the sequence of the reading, see what it means where it says: "my heart is toward the things that have been appointed for this Israel". This seems to me to be what it means: my heart and my soul and my sense and my whole mind is bent toward that and looks forward to that "which has been appointed" and which has been prepared "for Israel"; I look forward with my whole mind to that which is to come. For if I bend my mind toward that, all the things that are in this world "I will count as dung, that I may gain Christ", who "has prepared" all those things "which eye has not seen and ear has not heard nor has ascended into the heart of man, for those who love him". "My heart", therefore, it says, "is stretched out toward those things". For I no longer bear a human heart, nor do I think the things I think according to man; but because, according to the Scripture, those "to whom the word of God comes are gods", I too look upon these things not with a human but with a divine mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily06.html'
source_title="HOMILIES ON JUDGES 6"
