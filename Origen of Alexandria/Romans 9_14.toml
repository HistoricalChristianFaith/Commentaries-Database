[[commentary]]
quote='''
It is fitting that the reader of these things should recall rather attentively that comparison which we set down in the earlier books concerning the manner in which the apostolic discourse is dispensed: that, as in a certain royal house which is laid out with manifold entrances and exits, one passes from one chamber into another in such a way that scarcely any signs appear of the one entering or of the one going out — so also Paul seems to open up the secrets of divine things a little, yet not to spread them out plainly and openly. And so, in view of what he had said above concerning Isaac and Jacob — that by election and from the purpose of God, before they had done any work good or evil, God had said, either of the former, "At this time I will come, and Sarah shall have a son," or of the latter, "Jacob I loved, but Esau I hated" — when in the present chapter he had introduced a certain person as though contradicting him and raising a question, and said, "Is there unrighteousness with God?" and had answered, "God forbid," but "it is not of him that willeth, nor of him that runneth, but of God that showeth mercy": and if he chose Pharaoh for this reason, that he might show in him the might of his power; and if he himself has mercy on whom he wills, and whom he wills he hardens — why then, he says, does he find fault with men? and why is the one who sins blamed, when such is his will concerning each one? To the one, then, who raises these objections and others like them, and who thrusts himself rather impudently and importunately into the bedchamber of this mystery, he meets him with the rebuke of a most worthy exclamation, and says: "O man, who art thou that repliest against God?" As if he were saying: Who are you who plunge into the palace of the king, and have dared to penetrate the secrets of the inner chamber? Therefore let us too in such matters, standing as it were in a royal court, walk with suspended foot, and pass over few things in speech and more in silence, having the Apostle Paul himself made our teacher and guide of this journey. So then, in the person of one contradicting him, the Apostle says: "Is there unrighteousness with God?" and at once at the outset he answers, "God forbid"; so that to all the other things which are to be objected in the person of the contradictor, the Apostle may always be seen to answer, "God forbid."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
