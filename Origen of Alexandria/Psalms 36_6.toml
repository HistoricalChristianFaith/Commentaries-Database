[[commentary]]
quote='''
And men ignorant of the judgments of God, which are "a great abyss," are wont to complain against God and to say, why do wicked and unjust men, plunderers, impious, criminal, in this life suffer nothing adverse, but all things yield to them with prosperous successes—honors, riches, power, health too itself and the constitution of the body serve them; on the contrary, upon the innocent and pious and those who worship God innumerable troubles come, and they live abject, humble, despised, and under the buffets of the powerful, and sometimes even the diseases of the body themselves rule more savagely over them. But these things, as I said, are complained of by those ignorant of what the order is in the divine judgments. For the more grievously they wish those to be punished at whose power and iniquities they groan, the more necessary it is that the penalties be deferred, which, if they were not deferred, would surely be temporal and lighter, because they would receive their end with death; but now, because they are deferred, it is certain that they will be eternal and will be extended with the ages. On the contrary, therefore, if they should wish good things to be rendered to the just and innocent in the present age, those good things too would be temporal and to be concluded with a swift end; but the more they are deferred into the future, the more they will be perpetual and will know no end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily14.html'
source_title="HOMILIES ON LEVITICUS 14"
