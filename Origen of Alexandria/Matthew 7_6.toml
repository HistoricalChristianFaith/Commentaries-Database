[[commentary]]
quote='''
These questions are exceedingly delicate, and therefore I need hearers capable of subtle thinking. Therefore I call upon the hearers to attend to themselves, lest I become a cause of accusations against myself of scattering what is holy to the dogs, to shameless souls. For the loud-mouthed, the shameless, the abettors of debauchery and slander, are able only to yelp like dogs, and it does not befit me to scatter holy things before such brood. I earnestly ask the hearers about this, so that they may not in the future reproach me; for the beautiful pearls that I have gathered as a successful merchant, I shall put on display before people immersed in the impurities of their flesh, and therefore called swine. I would say that a man who is constantly immersed in the filth of life and wallows in it and does not try to live a pure life, a holy life, is simply a swine. And then, if I seek good pearls … and, having bought them at the cost of labor and vigils, cast them before pleasure-loving souls, and before those who are immersed in fleshly filth and impurity, then I too become a sinner, because I cast pearls before swine. But if the swine receive the pearls, then, not seeing their beauty and not understanding the advantages of possessing them, they trample them underfoot, speaking evil of what is good, and not only trample them, but, turning upon the servants of the pearls, tear them apart. Therefore I beseech you: be transformed! Resolve to acknowledge that it is in your power to change and to cast off the image of the swine, which is in the impure soul, and the image of the dog, which represents the man who is loud, a barker, and a foul-mouthed person.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
