[[commentary]]
quote='''
Now it is described that, when according to the admonition of Deborah — that is, of prophecy — Barak pursued Sisera the leader of the Philistines, he himself indeed could not seize him, but there met him "as he fled" a foreign woman, Jael, which woman had previously held a covenant of friendship with him; "to whom," when he had "turned aside" for the sake of hiding, he asked for water to drink, but by her "he was given milk to drink"; and when she had placed him "in hiding" and had covered him with skins, after this she drove a stake, driven in "with a mallet," through his cheeks — or "jaws" — and fixed it fast: and then, "meeting" Barak as he pursued, she "showed Sisera" "now dead" and laid low.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily05.html'
source_title="HOMILIES ON JUDGES 5"

[[commentary]]
quote='''
What, then, does all this text of the history show us of the mystery? "Jael," that foreign "woman" concerning whom prophecy said that the victory would come to pass "into the hand of a woman," holds the figure of the Church, which has been gathered from the foreign nations. Now "Jael" is interpreted as "ascent", because in truth there is no other ascent by which one may ascend to heaven except "through the Church of the manifold wisdom of God." She, therefore, is the one who, while she ascends from bodily things to spiritual and from earthly to heavenly, slays Sisera — of whom we have already said above that he holds the figure of the carnal vices and of the "animal" or "earthy" man, because Sisera is interpreted as "the sight of a horse", concerning which Scripture says: "do not become like the horse and the mule, which have no understanding." With a stake, therefore, she slays him — that is, she lays him low with the sharp point and power of the wood of the cross. And not without cause is she described as having pierced through his "jaws" with the stake. For that mouth which spoke of carnal things, and that doctrine which set forth the glory of the flesh, which persuaded the wise of the world that life should be spent in delights and pleasure and had deceived the human race by the flattery of luxury — that mouth, I say, is pierced and bored through by the wood of the cross, because that "way" of pleasure which philosophy had proclaimed "broad and spacious," this Christ showed us to be the "narrow and strait way of salvation." Thus, then, Jael the Church delivered over to eternal sleep Sisera the prince of vices, covered with skins — that is, lulled to sleep by the mortification of the members. Yet Jael the Church, after this, also "met" the former people as it pursued Sisera. For Israel "pursued the law of righteousness, but did not attain to the law." The Church, therefore, also "met" that very people and "showed" it its work, showed it the victory accomplished, and invites it into fellowship with the overthrown enemy. For that is true which the Apostle says will come to pass "in the last time": that, "when the fullness of the nations has entered in, then all Israel shall be saved." The "primacy," then, comes to pass indeed "into the hand of" a foreign "woman," yet Barak too is not excluded from the fellowship of glory — Barak who indeed had begun first, but came last to the end. Nay rather, while he arrives, the foreign woman Jael in a manner snatches the passing victory. The same figure went before also in the brothers Esau and Jacob. For while Esau pursues the wild things, while he lingers in the forest glades, Jacob, coming before him and offering to his father the foods of blessing prepared, likewise by the counsels of his mother, received the birthright's blessing. So too in the Gospel, as the Lord was going to raise up "the daughter of the ruler of the synagogue," the "woman who suffered from an issue of blood," coming before, first obtains healing by her faithful touch.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily05.html'
source_title="HOMILIES ON JUDGES 5"
