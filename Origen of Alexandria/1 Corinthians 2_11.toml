[[commentary]]
quote='''
The salvation of the human spirit is annulled — the spirit concerning which the Apostle speaks: "no one among men knows what is in man; only the spirit of man, which is in him." Since the Savior desired to save the spirit of man, concerning which the Apostle spoke in this manner, He took up also the spirit of man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
