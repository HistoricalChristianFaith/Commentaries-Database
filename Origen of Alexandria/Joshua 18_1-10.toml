[[commentary]]
quote='''
In human custom, when something is divided by lot, that lot seems to fall by chance to this man and another to that man; in holy Scripture, however, it is not so. And at times I used to ask myself whether the holy fathers would have committed the decision about so great and so weighty a matter to lots; and if this had been done thus among the saints, then it would seem no wonder concerning other men, or the Gentiles, if there were nothing extraordinary in those things which are said by the saints to have been divided by lot. But let us see whether perhaps we may find something set down in the Scriptures which may make plain to us what power is contained in the lots. Let us begin, then, from Leviticus, where it is written: "and they shall take," it says, "two lots; one lot for the Lord and one lot for the apompaeus," that is, for the one who sends it away. "And upon whichever the lot of the apompaeus shall come, he shall take that goat, and shall lead it living into the wilderness, and shall let it go there in its release. But the other goat they shall offer to the Lord," and the rest that is there: things which of course they know who read them. And again, where Moses divided by lot "to the tribe of Reuben" and "to the tribe of Gad" and "to the half-tribe of Manasseh," which had asked to receive across the Jordan that land which the children of Israel had seized. But "Jesus" also "gave," according to the commandment of the Lord, "to Caleb the son of Jephunneh" and "to the tribe of Judah a lot." And he gave also to the tribe of "Ephraim" and to that which remained, the half-tribe of "Manasseh." And after these things, "he gathered," it says, "the assembly of the children of Israel" and said: "I will cast the lot and bring forth the lot in the sight of the Lord, if you first, describing the land, bring me a description of it." And thus, after these things, when the lots had been cast, the inheritance is distributed to the people of God, and this lot is set in motion not by chance, but according to that which was predestined by God. Finally, the tribe of "Benjamin" there received the first lot, where "Jerusalem" was; after this the tribe of "Simeon" the second; after this "Issachar"; then "Zebulun"; then "Asher"; after that also "Naphtali"; then "Dan." Among whom last of all come those three tribes which had descended from the concubines of Jacob.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily23.html'
source_title="HOMILIES ON JOSHUA 23.1"


[[commentary]]
quote='''
What, then, the reasoning of the lots might be, I kept inquiring within myself, that from the many testimonies of Scripture I might come to know what lay hidden. Indeed I found in the Scriptures that even Gentile men had made use of lots, at that time when Jonah was sailing and a storm pressed upon them. For those who were sailing say: "let us cast a lot and let us know for whose cause this so great evil has come," as though the lot had such power that it could betray the one for whose cause the danger threatened those who sailed. And although they were Gentiles and strangers to the knowledge of God, yet they are not deceived in this opinion, but the lot betrayed to them what was true. Finally, "the lot came," it says, "upon Jonah." Seeking, then, concerning these things, I find also Solomon in the Proverbs saying: "the lot restrains contradictions and decides between the powerful," showing, as it were, that "contradictions" cease where the lot is cast. But since I found not a few such things about lots reported in the Old Testament, I turned myself also to the New Testament, to see whether perhaps even there lots are despised, or whether not even there is the use of them cast aside; and I find that at one time, when one Apostle was lacking from the number of the Apostles and it was necessary that another be substituted in the place of Judas, the Apostles, coming together—who indeed were far wiser than those who now ordain bishops or presbyters or deacons—chose "two" and "set them" in the midst; nor yet did they permit to themselves the judgment concerning these, so as to make him whom they themselves might have wished, but "praying," it says, "they cast a lot between those two" whom they "had set" in the sight of God, that is, "Joseph, who was called Barnabas, who was surnamed Justus, and Matthias." "And the lot fell," it says, "upon Matthias, and he was numbered with the eleven Apostles." For, prayer having gone before, the lot conveyed the divine judgment not by chance, but by providence. But still I kept seeking in the New Testament, wherever a lot is named in Christ or in the Church, or in mystical matters and such as seem to pertain to the soul. I find Paul writing to the Ephesians saying concerning Christ: "in whom," he says, "we were called by lot, predestined according to the purpose of him who works all things according to the counsel of his will, that we may be unto the praise of his glory, we who before hoped in Christ"; but also writing these things to the Thessalonians: "giving thanks to God the Father, who has made us fit for the portion of the lot of the saints in light." Since, therefore, so many testimonies from the holy Scriptures concerning the mention of lots have been gathered together, so that from the consideration of many passages we might more diligently grasp the power of the matter, for my part out of all these either the meaning could not yet lie clearly and evidently open, or else a fear of announcing and bringing forth a secret about so great a matter took hold of me. Yet let it suffice that this much, so far as the matter allows, has come to pass, which the lot drawn by the Apostles designates to us: that, where the lot is drawn from whole faith and with prayer sent before, that which the will of God holds in secret the lot declares openly to men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily23.html'
source_title="HOMILIES ON JOSHUA 23.2"


[[commentary]]
quote='''
But according to the inner understanding, as Paul seems to indicate when he says: "in the portion of the lot of the saints" and: "called by lot in Christ," it must be considered whether perhaps the lot is exercised not only among men, but also among the powers above, and whether some power presides over this office, which, for example, to Jesus the son of Nave now distributing the inheritance by lot, may furnish the drawing of the lot—not toward some favoritism, but according to that which it knows to please God—and may indeed cause those things to come out first for the one whom it knows to hold the first place with God, so that this which is held in secret with God might, by the governance of the lot, be shown also to men; but may make another of the second place and another of the third. And I judge that this was done thus not only on earth, but also in the heavens, and that a lot of this kind—which with God is distinguished by the contemplation of merits—was held even at that time, "when the Most High divided the nations and scattered the sons of Adam and set the bounds of the nations according to the number of the angels of God; and the portion of the Lord became Jacob, the cord of his inheritance Israel"; for you see that here too he says that God took by lot the "portion" and the "cord of Israel." It must not, then, be thought that by chance it came about by lot for that angel to take up that nation, for example of the Egyptians, and for another that of the Idumeans, and another that of the Moabites, and another India, or any single one of those nations which are upon the earth; but there too, even if the "nations" are said to have been divided by lot "according to the number of the angels of God," yet that lot—just as we said among men that the lot spreads abroad in public the judgment of God which is in secret—such also is it to be believed to have been there, by which each angel took up in the division this or that nation according to his own merit and virtue. And why do I speak of great and general matters? when it must be said that not even through each single one of us does anything come about apart from a lot of this kind, which is dispensed by the judgment of God—for example, that one of us should obtain such or such a life straightway from his birth; or certainly that which we have often taught from the holy Scriptures to be carried on with regard to men, namely, that both good angels are present to men and adverse ones; that it was surely not by chance and without judgment that that angel was allotted to be the guardian of that soul, for example of Peter, and another of Paul, or another of one infant of the Church, concerning whose angels the Lord says that they "always behold the face of their Father who is in heaven." Concerning whom there is surely no room to doubt that, by the judgment of God—who clearly perceives both their worthiness and the quality of our soul—they are allotted the guardianship of each one of us by a certain mystical lot directed by the dispensation of Christ. But I, so far as it pertains to my own opinion, think it must be boldly said even concerning those powers which have undertaken the ministries of this world, that it is not by chance or by accident that that power presides over the germinations of the earth or of the trees, that one supplies sufficiently for the springs and rivers, another for the rains, another for the winds, another for the sea-creatures, but another presides over the land-animals or over each single one of the things born from the earth; and that in these single things there are ineffable sacraments of the divine dispensation, so that all things in their order and by a fitting office are apportioned through each single power. For thus also the Apostle Paul says: "are they not all ministering spirits, sent into ministry for the sake of those who receive the inheritance of salvation?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily23.html'
source_title="HOMILIES ON JOSHUA 23.3"
