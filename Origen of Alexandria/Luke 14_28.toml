[[commentary]]
quote='''
This journey, then, must be made by those who follow God; but there is also a tower on this journey. What is that tower? That one, surely, of which the Lord says in the Gospel: "which of you, wishing to build a tower, will not first sit down and count the cost, whether he has the means to complete it?" This, then, is the tower, the steep and lofty seat of the virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily05.html'
source_title="HOMILIES ON EXODUS 5"
