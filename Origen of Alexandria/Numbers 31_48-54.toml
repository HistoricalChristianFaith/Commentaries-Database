[[commentary]]
quote='''
Consider now the state of the present age, and see all things filled with wars and all human life hard pressed by invisible battles and by the assaults of demons, but that among the people of God there are certain ones so strong in faith and armed with virtues that against enemies of this kind they daily wage wars and, always standing ready in battle array, guard from the ambushes of the enemy not only themselves but also the rest who cannot fight, whether by reason of sex or of age or of the condition of servitude, fortifying them by the word of teaching and by the example of their life and by the diligence of their admonitions; provided, however, that faith be not lacking to them. For whether warriors or unfit for war, it is impossible to be saved without faith. Among the warriors themselves, however—those at least who serve as soldiers to God—consider that some are so ready and unencumbered that they entangle themselves in no worldly affairs at all, that they may be able to please him who has approved them, and also meditate on the law of God day and night. These, then, who are of this kind, are called the sum total of the warriors. Indeed it is not said of the common number of the warriors that no one among them was missing, but this is said of those who are named the sum total of the warriors. For among those who are such, there is no dissension, no discord. For these are they of whom it was said: "And the heart and soul of the believers was one, nor did any of them call anything his own, but all things were common to them." These, then, are the sum total of the warriors, among whom no one was missing. These are they who by fighting took a great abundance of gold, and offer to God all the gold and every ornament, whether of the head or of the arms or even of the fingers—that is, whatever they have in their understandings, whatever in their works—they offer to God. For they know that his gifts are his own, and therefore not even one among them dissents. For those set in dissension could not offer gifts to God. These, I think, are, according to the Gospel, those who diligently observe that precept which the Lord and Savior commands: "But if you offer your gift at the altar and there remember that your brother has anything against you, leave there your gift at the altar, and go, first be reconciled to your brother, and then coming you shall offer your gift"—namely, so that they may lift up their hands to God without wrath and dissension. These, then, are they who say: "We have gathered the sum total of our men of war, and not one of us was missing; and we have offered a gift to the Lord." Greatly, therefore, must we learn the discipline of concord; because, as in music, if the harmony of the strings has been fitted together in concord, it renders the sweet sound of a melodious song, but if there is any dissonance in the strings, a most disagreeable sound is rendered and the sweetness of the song is spoiled, so also those who serve as soldiers to God, if they have dissensions and discords among themselves, all things will be disagreeable and nothing will seem acceptable to God, even if they wage many wars, even if they carry off many spoils and offer many gifts to God. For it will be said to them: "Lay down your gift at the altar, and go, first be reconciled to your brother," that you too may be numbered among those who are the sum total of the men of war and may say that "not one of us was missing." I say even something further. Unless you are such that you dissent in nothing from the commandments of God nor differ in anything from the evangelical precepts, you will not be able to conquer the enemy, you will not be able to overcome the adversary. For in that very thing in which you dissent, you are already conquered; and by this very thing you are overcome by the devil, in which you are in discord with God. But if you wish to conquer the enemy and to be of the sum total of the warriors, cleave to God and be in concord with him, like the one who said: "Who shall separate us from the love of God? Tribulation, or distress, or famine, or nakedness, or peril, or the sword?", and again: "Neither life nor death nor things present nor things to come nor height nor depth nor any other creature will be able to separate us from the love of God, which is in Christ Jesus." Such a one dissents in nothing at all; such a one is able to conquer the Midianites and to slay all the sinners of the earth and to destroy their image from the city of the Lord. And I too, then, ought to destroy the sinners from myself and from the land of my flesh, and to slay fornication, uncleanness, passion, evil concupiscence, and avarice. For these are the sinners of my land, whom I shall at last be able to exterminate and to slay if I do not dissent from the commandments of God; and then I shall truly be worthy to offer gifts to God. "Every vessel of gold," he says, "a collar or a bracelet or a ring or an armlet or a little chain." The collar is the ornament of wisdom. For in Proverbs it is said of wisdom that whoever acquires it may place a golden collar about his neck. The bracelet and the ring are ornaments of the hands, on which the tokens of works are marked; and likewise the armlet. But the little chains declare the connections of word and doctrine. "To make propitiation," he says, "of God for us." If we should say that God is made propitious to men on account of gold, see how absurd, indeed how impious, this is judged to be. For this is reckoned reprehensible even in a good man, if he is appeased by gold received from his inferiors. How much more, then, is it unfitting to think this of God? Whence I think that the rationale of this ecclesiastical exposition stands more firmly, which teaches that by the kinds of gold are signified the virtues of the soul and the deeds of good works, which alone are worthy to be offered to God by men, and for which alone it is fitting that God be made propitious to men. "And Moses and Eleazar the priest," he says, "took the gold from all the commanders of thousands and commanders of hundreds, and brought it into the tabernacle of testimony, a memorial for the sons of Israel before the Lord." You see that the things which are said are referred not to visible sight but to the memory of the mind. For blessed is he who remembers that he has done some good work before the Lord and has offered gifts well-pleasing to God, the virtues of the soul and the ornaments of piety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily26.html'
source_title="HOMILIES ON NUMBERS 26.2"
