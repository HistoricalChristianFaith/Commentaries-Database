[[commentary]]
quote='''
But what is it that saves? The keeping of God's commandments. For everyone "who shall loose one of these least commandments and shall teach men so"—he did not say "He shall not enter into the kingdom of heaven", but "he shall be called least in the kingdom of heaven." And if the one who has loosed "one of the least commandments shall be called least in the kingdom of heaven", where shall the one who has loosed two commandments be found?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XXXVII"
