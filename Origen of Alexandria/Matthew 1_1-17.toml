[[commentary]]
quote='''
For Matthew, beginning to weave the sequence of that birth from Abraham, arrives at the point of saying: "Now the birth of Jesus Christ was in this way", and he describes not the one who was baptized, but the one who came into the world; whereas Luke, in setting forth his birth, does not lead down from higher to lower, but, when he had first spoken of him as baptized, ascends all the way to God himself. Nor are the persons the same in his genealogy when he is said to descend and when he is said to ascend. For the one who makes him descend from the heavens introduces women too, and not just any women, but sinful ones, and women whom Scripture had censured; but the one who narrates him as baptized makes mention of no woman. In Matthew, therefore, as we have said, there is named Tamar, who by deceit lay with her father-in-law, and Ruth the Moabite, not of the stock of Israel, and Rahab, whose origin I cannot know, and the wife of Uriah, who violated her husband's bed. For because our Lord and Savior had come for this purpose, that he might take up the sins of men, and God "made him who had done no sin to be sin for us", therefore, descending into the world, he assumed the person of sinful and vicious men, and willed to be born of the line of Solomon, whose sins are recorded, and of Rehoboam, whose transgressions are related, and of the rest, many of whom did "evil in the sight of the Lord". But when he ascends from the washing and is described as born a second time, he is born not through Solomon, but through Nathan, who rebuked his father over the death of Uriah and the birth of Solomon. But in Matthew the term "begetting" is always added; here, however, it is entirely passed over in silence. For there it is written: "Abraham begot Isaac, Isaac begot Jacob, Jacob begot Judah and his brothers, Judah begot Perez and Zerah of Tamar", and right up to the end "begot" is always attached. But in Luke, where Jesus ascends from the washing, he is called "son", "as was supposed, of Joseph"; and in so long a series of names, except for the fact that he "was supposed to be the son of Joseph", the term "begetting" is nowhere written down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily28.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 28"
