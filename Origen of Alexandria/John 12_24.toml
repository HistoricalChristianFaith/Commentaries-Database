[[commentary]]
quote='''
Come now to the very beginning of man; go back over his origin. There is shown to you the seed of a man. If someone said, 'This seed will become a man, it will be formed, there will be bones, from it flesh, sinews, veins; it will walk about; from this small, paltry seed a man raised upright upon the earth will make use of his organs'—would we not have called the one proclaiming these things to us a fool, had we not had experience of it? So then, let me be bold and set before you the resurrection, that you may the more accept it, having put your trust in the perfection of God. As that seed stood in relation to this present body—the body that now stands present, the generative one, the one that sows, that has become the instrument of words and deeds done according to righteousness—so this body comes to stand in relation to that one: "The grain of wheat, unless it falls into the ground and dies, remains alone by itself"; but if it falls into the ground and dies and rots away, out of the rotting of the grain of wheat an ear grows a hundredfold. For that your body is the seed of that which is to rise, hear Paul saying: "It is sown in corruption, it is raised in incorruption; it is sown in dishonor, it is raised in glory; it is sown in weakness, it is raised in power; it is sown a natural body, it is raised a spiritual body". You see how there, in the case of the seed, something paltry and of no account was sown, and there has risen a comely and beautiful man; in the same way this dead thing is a grain of wheat to God, as that which is to rise up beforehand. So then, just as God found the means to make an ear from the grain of wheat—not from resources apart from those in the small seed; for from that seed he raised the ear, and from each seed he raises what is present potentially in the seed—so from the seed of a man, at the beginning, this man came to be. But if his body dies, it becomes the seed of that which is to rise from the dead "in glory" in Christ Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LXXXIV"
