[[commentary]]
quote='''
Nevertheless, in that part by which he does not will the evil, he consents to the law of God that it is good, since it forbids evil; and the natural law is brought into a certain harmony with the law of God, so that they will the same things and do not will the same things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
