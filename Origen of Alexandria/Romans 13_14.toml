[[commentary]]
quote='''
But as for what he said, Let us put on the armor of light, he now explains how this ought to come about. But put on, he says, the Lord Jesus Christ, and make no provision for the flesh in its concupiscences. We have frequently said that Christ is wisdom, and righteousness, and sanctification, and truth, and all the virtues together: and whoever has taken these up is said to have put on Christ. For if Christ is all these things, then necessarily he who has these has Christ also. For he who has these makes no provision for the flesh in its concupiscences. The Apostle employs his customary moderation, in that he does not deny that provision for the flesh is to be made in every respect. For it is certain that in things necessary it must be made; but in delicacies and luxury and every concupiscence it must be utterly excluded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"


[[commentary]]
quote='''
The Lord Jesus Christ himself … is said to be the clothing of the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25202.html'
source_title="ON FIRST PRINCIPLES 2.3.2"
