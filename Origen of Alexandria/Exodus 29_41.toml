[[commentary]]
quote='''
For do not suppose that almighty God commanded this and sanctioned it by law, that frankincense be brought to him from Arabia. But this is the frankincense which God seeks to be offered to him by men, from which he takes "an odor of sweetness": prayers from a pure heart and a good conscience, in which God truly receives the fragrance of sweetness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily13.html'
source_title="HOMILIES ON LEVITICUS 13"
