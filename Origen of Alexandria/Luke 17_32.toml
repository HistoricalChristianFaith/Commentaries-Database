[[commentary]]
quote='''
But because "the law is spiritual" and the things that befell the ancients "befell them as a figure," let us see whether perhaps Lot, who did not look back, is the rational sense and the manly spirit, while the wife here holds the image of the flesh. For it is the flesh that always looks back to vices, which, when the spirit strives toward salvation, looks back and seeks after pleasures. Hence indeed the Lord also said: "No one putting his hand to the plow and looking back is fit for the kingdom of God," and he adds: "Remember Lot's wife." And that "she is made a pillar of salt" seems set forth as an indication of her folly. For salt is put in place of prudence, which she lacked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily05.html'
source_title="HOMILIES ON GENESIS 5.2"
