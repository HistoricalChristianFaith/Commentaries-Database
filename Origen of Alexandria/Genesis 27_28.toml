[[commentary]]
quote='''
We find that Isaac also, blessing Jacob, says: "May the Lord give you of the dew of heaven and of the fatness of the earth, an abundance of grain and wine". Do you suppose that Isaac was giving in blessing to his son Jacob such grain as sinful men also have, and with which even the impious Pharaoh abounded? Was this the blessing of so great a patriarch? Do you wish that I still show you how others also, the unjust, have a multitude of grain? Behold that man in the Gospel, whose "field brought forth many fruits, who says": "I will pull down my barns and build greater ones, and I will say to my soul: Soul, you have many goods laid up for many years; eat, drink, and be merry". Do we therefore believe such to be the goods which by divine blessings were handed over to the saints and to the faithful? Other fruits of the earth do I behold, and otherwise do I regard the multitude of "birth". For if my "earth" bring forth fruit, if it produce "its births" out of the Lord's blessing, my understanding will perceive and be able to explain what and of what kind is this "earth" which, having received the heavenly rain, brings forth the "births" of rational crops.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily16.html'
source_title="HOMILIES ON LEVITICUS 16"
