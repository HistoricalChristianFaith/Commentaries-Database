[[commentary]]
quote='''
"They both went on therefore and came to the place that God had told him." Moses, when he had come to the place that God showed him, is not permitted to ascend, but before that it is said to him: "loose the strap of the sandal from your feet." To Abraham none of these things is said, nor to Isaac, but they ascend and do not put off their sandals. In which perhaps this is the reason: that Moses, although he was "great," yet was coming from Egypt, and there were certain bonds of mortality knotted to his feet. But Abraham and Isaac have none of these things, but come to the place; Abraham builds the altar, lays the wood upon the altar, binds the boy, prepares himself to slay him. Many of you are fathers in the Church of God, who hear these things. Do you suppose that some one of you acquires from the very narration of the history so much constancy, so much strength of soul, that, when perchance a son is lost by the common death owed to all, even if he be an only son, even if he be beloved, he may bring Abraham to himself as an example and set his greatness of soul before his eyes? And indeed that greatness of soul is not demanded of you, that you yourself should bind your son, yourself constrain him, yourself prepare the sword, yourself slay your only son. All these ministries are not required of you. Be at least constant in your resolve and mind, and fixed in faith offer your son to God with joy. Be the priest of your son's soul; but it does not befit a priest immolating to God to weep. Do you wish to see that this is demanded of you? In the Gospel the Lord says: "if you were sons of Abraham, you would surely do the works of Abraham." Behold, this is the work of Abraham. Do the works that Abraham did, but not with sadness; "for God loves a cheerful giver." But if you too shall be so ready toward God, it will be said to you also: "ascend into the high land and to the mountain that I will show you; and there offer me your son." Not in the depths of the earth nor "in the valley of weeping," but on the high and lofty mountains "offer your son." Show that faith in God is stronger than the affection of the flesh. For Abraham loved, it says, Isaac his son, but he preferred to the love of the flesh the love of God, and he was found not in the bowels of the flesh, but "in the bowels of Christ," that is, in the bowels of the Word of God and of truth and of wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily08.html'
source_title="HOMILIES ON GENESIS 8.7"
