[[commentary]]
quote='''
Solomon also in the Proverbs says: "it is a snare for a strong man hastily to sanctify something of his own; for after he has vowed it, it comes about that he repents". And this indeed is what he says, lest perhaps anyone, "when he gathers fruit from the threshing floor or wine from the presses", and has said: I wish to offer only so much to the Church, or to supply only so much for the use of the poor or of pilgrims; if afterward he presumes to take something for his own uses out of that measure which he vowed, he has now not presumed upon his own fruits, but has violated the holy things of God. And therefore "it is a snare for the strong man to sanctify something", that is, to vow it to God and afterward, led by repentance, to recall to his own uses those things which he had consecrated. But even if we consecrate and offer ourselves to God, or also if we vow others, let us observe this "snare", lest perhaps, after we have vowed ourselves to God, we again be subjected to human uses or deeds. Now each one vows himself, for example, as the Nazirites used to do, consecrating themselves to the temple of God for three or four or however many years it pleased, so that they might always be free there, observing those things which are written concerning the Nazirites; that they should nourish the hair of the head, and "no iron should go up upon their head" throughout the whole time of their vow, that they should not touch wine nor anything "from the vine", and whatever else the profession of the vow had embraced. But someone also vows another to God, as Hannah did with Samuel; for before he was born, she offered him to God, saying: "and I will give him to the Lord, given all the days of his life".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily11.html'
source_title="HOMILIES ON LEVITICUS 11"
