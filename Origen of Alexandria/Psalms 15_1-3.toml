[[commentary]]
quote='''
And again in the fourteenth Psalm he says: "Lord, who shall dwell in thy tabernacle? or who shall rest in thy holy mountain? He that entereth without spot and worketh righteousness" and the rest. Or indeed how will it be true that it is said of this tabernacle that none dwells in it except the "innocent in hands and clean in heart, who hath not taken his soul in vain", when the history of the Kingdoms discloses that most wicked priests, "sons of pestilence", dwelt in the tabernacle of God, and that the very ark of the testament, captured by the Allophyli (Philistines), was held among the impious and profane? From all which it stands firm that the prophet thinks with a far other sense concerning this tabernacle, in which he says that none dwells except the "innocent in hands and clean in heart, and who hath not taken his soul in vain, nor done evil to his neighbor, and hath not received reproach against his neighbor". Such, then, must be the dweller of this tabernacle, which the Lord fixed and not man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily09.html'
source_title="HOMILIES ON EXODUS 9"
