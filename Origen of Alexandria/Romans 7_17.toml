[[commentary]]
quote='''
But if according to our will we consent to the law of God, then the evil which we do, it is no longer we who work it, but the sin which is in us — that is, the law and the will of the flesh, which leads us captive in the law of sin which is in our members. And here indeed the carnal Paul says, "It is no longer I who work it, but the sin that dwells in me." But the spiritual Paul says elsewhere, "I labored more abundantly than all of them; yet not I, but the grace of God with me." Therefore, just as this one ascribes his labors not to himself, but to the grace of God which was working in him, so also that carnal one reckons his works, which are not good, not to himself, but to the sin which dwells and works in him. For this reason therefore he says: "It is no longer I who work it, but the sin that dwells in me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
