[[commentary]]
quote='''
"But if our iniquity commends the justice of God, what shall we say? Is God unjust, who inflicts wrath? I speak according to man. God forbid. Otherwise, how shall God judge this world? For if the truth of God has abounded through my lie unto his glory, why am I also still judged as a sinner? and not (as we are blasphemed, and as some affirm that we say) let us do evil that good may come? whose condemnation is just." Perhaps the order of speaking arranged by the apostle Paul through nearly the whole text of this Epistle will seem highly inconsequent, since his discourse is now directed against the Gentiles, now moderated on behalf of the Gentiles, and again is set against the Jews, and again concerning the Jews, or even on behalf of the Jews; and of these same people he calls some worthy of praise and censures others. And this variety of meanings will again be thought to have led him outside the lines of the subject he had proposed — as when he employs that exclamation in which he says: "But let God be true, and every man a liar"; or even that which he consequently adds when he says: "But if our iniquity commends the justice of God," and the rest, so that by this he may seem to have slipped from one digression into another. But we who believe him when he says that "he has made us fit ministers of the New Testament, not of the letter, but of the spirit," find his meaning far loftier than the method of human art is believed to possess. For through the whole text of this Epistle he wishes to trace what salvation there was even before the coming of Christ for those living according to the law; or how, through the coming of the Savior, salvation is in turn conferred upon the Gentiles out of the unbelief of Israel; and again, that neither do the Gentiles come to salvation in their entirety, but only those who have believed; nor is Israel cast off in its entirety, but "the remnant" of believers "shall be saved." And for this reason the order of speaking seems, as I said, confused, while he pursues the diversities of believers and unbelievers on both sides. In these matters he necessarily turns his discourse also to God, so that amid all these differences of acceptances and rejections he may teach that the judgments of God are indeed true and just, but that much falsehood abounds among men; and therefore he says: "But let God be true, and every man a liar; as it is written: That thou mayest be justified in thy words, and mayest overcome when thou art judged" — concerning which we have spoken above as far as we were able. Seeing then that a plausible objection could be raised against him from the contrary side — namely, that if it is necessary for every man to be a liar in order that God may be true, and if the justice of God is commended through the injustice of men, then God will seem unjust who inflicts wrath upon men, since he sees his own justice approved through the injustice of men: for if our injustice, that is, the injustice of men, commends the justice of God, then surely those men will not seem worthy of punishment through whom the justice of God is held to be more provable and more manifest — But God forbid, he says, that we should accept it thus, that God should seem unjust who brings wrath against men. For how shall he be thought unjust who judges the world, since by the very name of judge it is shown that he does nothing without judgment? And where there is judgment, it is agreed that there is justice; for justice is named both judge and judgment. If then, as unjust men, he says, happen to assert of us, "the truth of God has abounded through my lie," then it is superfluous that "I am judged as a sinner." But rather that will be seen wherein they blaspheme us, he says, as though we were seen to say this: if the truth of God is more displayed in the lie of men, and his justice is proved through the injustice of men, then let us "do evil, that" out of evils "good may come"; and let us lie, so that from our lie the truth of God may shine forth. But these things indeed they invent about us who blaspheme us, as though these things seemed to be said, or to follow, from the logic of our own assertion. But the reasoning of our teaching in no way admits this, since we understand God to be a just and true judge. It should surely be known that in certain Greek copies it is found thus: "Is God unjust, who inflicts wrath against men?" And according to this sense the things we have said will seem to fit better. But according to what we find in the Latin copies, and in some of the Greek: "Is God unjust, who inflicts wrath? I speak according to man. God forbid" — it seems it must be understood in this way. This statement that "God is unjust who inflicts wrath," on the ground that "our injustice commends the justice of God," is not said according to God, nor according to the wisdom of God, but "according to man," and according to that which is said, "every man is a liar." Now these things we have said while still treating the very order of the discourses and the sequence of the statements, so that the division itself of the words might make the way of understanding more open to us. But now let us inquire what sense is to be held in these discourses according to apostolic worth. Every discipline consists of favorable things and of adverse or contrary ones. For example: medicine professes the knowledge not only of health but also of sickness; and although it pursues the study of health, it nevertheless cannot be ignorant of what belongs to sickness. Similarly prudence too consists in the knowledge of good and evil; and temperance knows what things are to be chosen and what are to be avoided; and fortitude is not ignorant of what pertains to fear. So also justice. If we wish to know what justice is, it is necessary for us to know what injustice is; and when we have grasped the full knowledge of injustice, from that very thing we shall come to know what justice also is; for when it has become clear what is unjust, consequently what is just also will appear. And since justice is in God, whose nature is inaccessible to human perception, but injustice is found in us men, or even in every rational creature, it is from this injustice of ours, which is known to us, that that justice of God which is, as it were, inaccessible and incomprehensible to us is known and commended, and as it were the contrary is disclosed from its contrary. The apostle Paul therefore marks the ignorance of those who raise an inconsequent question, thinking that God is unjust who brings wrath upon men, on the ground that his justice is commended from our injustice; not knowing, however, that it comes about not by the benefit of our sins but by the very nature of reason, that contraries are proved from contraries. Therefore the Apostle speaks thus: "But if our injustice commends the justice of God, what shall we say? Is God unjust, who inflicts wrath? I speak according to man. God forbid. Otherwise, how shall God judge the world?" God is therefore not proved unjust in this, if the method of instruction proves contraries from contraries, and commends justice from injustice; but rather, with full consistency, justice is worthily and deservedly hostile to injustice and opposed to it, just as life is hostile and opposed to death, and light to darkness. And therefore God, in whom righteousness resides, is said to bring wrath upon those men in whom unrighteousness dwells. For these two are by nature opposed to one another. And how, even on this very account, will God appear unrighteous, who opposes unrighteousness? And for this reason perhaps the Apostle did not say that we unrighteous men commend the righteousness of God; but he says: "If our unrighteousness commends the righteousness of God" — so as to show that it is not God who is contrary to men, but righteousness that is contrary to unrighteousness; and that wrath is brought upon men because they have given a place to unrighteousness within themselves. God therefore, who is righteousness, will not appear unrighteous when He is angry against unrighteousness, toward which it is not fitting that He should be favorable; but this wrath reaches even to those men who have offered themselves as ministers of the unrighteousness at which God is angry. For in no one can unrighteousness and righteousness both subsist; but just as righteousness is the effect of a righteous and upright work, which is found first in God, and then also in those who imitate Him, so too unrighteousness is the effect of an unrighteous and crooked work, which is detected first in the devil, and then also in those who are willing to imitate him. And therefore wrath is deservedly said to be brought upon them, even though out of their unrighteousness, as by way of contrast, the righteousness of God seems to have shone forth. For they might, just as they received into themselves the disposition of an unrighteous and crooked work, much more have received that of a righteous and upright one. Justly, therefore, is wrath said to be brought by God upon all men. For those in whom wrath has no place are already to be called not men, but above men. And for this reason perhaps the same apostle Paul makes his pronouncement concerning all men, saying that "we were by nature children of wrath, even as the rest." For he did not say, "We were children of wrath," but he added: "We were by nature children of wrath, even as the rest." For all men have been made by nature children of wrath, from the fact that they were gods and sons of the Most High, and through this were called men. For attend more diligently to how he says: "I said: You are gods, and sons of the Most High"; and he added, "all of you." This addition signifies the whole human race bound together at once under this title. Finally, in what follows he says: "But you shall die like men." Hence also that which is written: "And God reflected that He had made man upon the earth; and it repented Him in His heart, and God said: I will blot out man whom I have made from the face of the earth" — this I think was said not only with reference to the destruction of the flood, but that something was also foretold by it, under a mystery, concerning things to come: so that what is said, "I will blot out man," may be understood in the same way as when God says through the prophet: "For behold, I blot out your iniquities like a cloud"; that He may be seen to blot him out according to that which is man, so as afterwards to make him god, at that time when "God will be all in all." And to this sense may also be applied what is said in Genesis: "The time of every man has come before my sight" — so that it may be thought to have been said not only about that time of the flood then, but also about the mystery of baptism; just as the apostle Peter says that, as Noah was then saved from the flood, so now also in like manner believers are saved through baptism. And thus what he says, that "the time of every man" has come, can be understood with reference to salvation, so that believers are understood, through the grace of baptism, to be destined to be changed from men into a higher order, when the day of resurrection shall have come, where all the saints "shall be as the angels of God." Let this be what has been said, so far as it could occur to us, concerning that which was stated: "Is God unrighteous who brings wrath," or "against men," as we said is read in certain copies, or, as we have it, "I speak after the manner of man. God forbid."
'''
