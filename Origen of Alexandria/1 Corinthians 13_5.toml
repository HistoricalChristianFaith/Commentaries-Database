[[commentary]]
quote='''
Does not behave unseemly: no one who has love does anything unseemly; if therefore at some time our brethren, a man and a woman, claiming to love one another according to God, should through weakness fall under the pretext of love, let us tell them that they do not have love; for love does not behave unseemly. Does not seek its own: no one who has love seeks his own things; for example a mother in loving her son, or a father, does not seek her own as she does the son's; for to have love is not self-loving. If the Savior, "being in the form of God" and being "equal to God", had sought his own, he would have remained in that form; but as it is, wishing to save a perishing world, he "emptied himself, taking the form of a servant; and being found in fashion as a man he humbled himself, becoming obedient unto death, even the death of the cross". Come also to the saints; see the love of Moses: "If you will forgive them the sin, forgive it; but if not, blot me also out of your book which you have written". And the Apostle also says, "Even as I too please all in all things, not seeking my own profit but that of the many, that they may be saved", and "I could wish that I myself were accursed from Christ for the sake of my brethren, my kinsmen according to the flesh". He prays to be accursed from Christ for the salvation of others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LI"
