[[commentary]]
quote='''
"Therefore, brethren, we are debtors, not to the flesh, that we should live according to the flesh." He taught above that the Spirit of Christ dwells in us, and that the gifts of the Spirit have been conferred upon us. Consequently, then, he now adds that "we are debtors" — debtors, without doubt, for those things which we have obtained from the Spirit of Christ. But "we are not debtors," he says, "to the flesh." For God did not make us to his own image for this purpose, that we should be liable to the servitude of the flesh, but rather that the soul, serving its own Creator, should itself make use of the service and ministry of the flesh. But perhaps someone may say: How are we not debtors to the flesh, since we are compelled by the necessity of nature to provide it with both food and clothing? But in order to show that it is not the bestowing of something upon the flesh that is held blameworthy, but the surrendering of life itself into the flesh's bondage, he therefore adds: "For if you live according to the flesh, you shall die." And what it is to live according to the flesh has already been said often. This is to indulge the desires of the flesh. In this respect, then, he denies that we are debtors to the flesh, just as elsewhere too he says: "And make not provision for the flesh in its concupiscences" — by no means denying that care must be had for the flesh in things necessary, but in its concupiscences. So therefore here also, "For if," he says, "you live according to the flesh, you shall die."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
