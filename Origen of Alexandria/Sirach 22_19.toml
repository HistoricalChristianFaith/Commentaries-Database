[[commentary]]
quote='''
Let us attempt to do also that which wisdom admonishes, saying: "drink waters from your own springs, and from your own wells, and let your own fountain be your own." Attempt therefore, you also, O hearer, to have your own well and your own fountain; that you too, when you have taken hold of the book of the scriptures, may begin even from your own understanding to bring forth some meaning, and according to those things which you have learned in the church, attempt you also to drink from the fountain of your own natural ability. There is within you the nature of "living water," there are perennial veins and irrigating streams of rational understanding, if only they be not filled up with earth and rubble. But be diligent to dig your earth and to purge the filth, that is, to remove the sloth of your natural ability and to shake off the torpor of your heart. For hear what the Scripture says: "prick the eye, and it will bring forth a tear; prick the heart, and it brings forth understanding." Purge therefore your natural ability also, that one day you too may drink from your own springs and draw "living water" from your own wells. For if you have received into you the Word of God, if you have received from Jesus "living water" and have received it faithfully, there will be made in you "a fountain of water springing up into eternal life."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily12.html'
source_title="HOMILIES ON GENESIS 12.5"


[[commentary]]
quote='''
Since the blessed apostle orders us to be imitators of this grace, that is, the gift of prophecy, although it is imperfect and in our power, saying, "Be zealous for the greater gifts, above all the gift of prophecy," let us also try to have a zeal for those good gifts and, so far as we are able, to ask for them and then await the fullness of the gift from the Lord. For this, in fact, is what the Lord says by means of the prophet: "Open your mouth, and I will fill it up." This is also why another Scripture says, "Sting the eye, and it will bring forth a tear; sting the heart, and it will bring forth understanding."
'''
source_url='https://www.google.com/books/edition/Homilies_on_Genesis_and_Exodus/X_mSBavPcq4C?hl=en&gbpv=1'
source_title="HOMILIES ON EXODUS 4:5"
