[[commentary]]
quote='''
"And the Lord," it says, "was angry with fury against Israel. And the Lord said to Moses: Take the chiefs of the people and display them to the Lord before the sun, and the anger of the Lord's fury shall be turned away from Israel." I do not know whether, in discussing these things, we may not offend some; but even if we do offend, it is more fitting to obey and serve the word of the Lord than the favor of men. Israel sinned, and the Lord said to Moses that he should take all the chiefs and display them to the Lord before the sun. The people sins, and the chiefs are displayed before the sun — that is, they are brought forth to be examined, that they may be reproved by the light. You see what the condition of the chiefs of the people is: they are reproved not only for their own offenses, but they are also compelled to render account for the sins of the people, lest it be their fault that the people transgressed — lest perhaps they did not teach, lest perhaps they did not admonish, nor were solicitous to reprove those who gave the beginning of the fault, so that the contagion might not be scattered among the many. For it is incumbent upon the chiefs and the teachers to do all these things. For if, when they do not do these things nor bear solicitude concerning the people, the people has sinned, they themselves are displayed and they themselves are brought forth to judgment. For Moses — that is, the law of God — reproves them as negligent and slothful, and the wrath of God will be turned upon them and will cease from the people. If men considered these things, they would never desire nor strive after the chieftainship of the people. For it is enough for me if I am reproved for my own offenses; it is enough for me to render account for my own self and my own sins. What need is there for me also to be displayed for the sins of the people, and to be displayed before the sun, before which nothing can be hidden, nothing obscured? But perhaps even in this there is some hidden and secret sense which teaches something more than this common exposition seems to have. For perhaps this too can be referred to those chiefs of the people of whom we spoke a little above. For the angels too will come to judgment with us and will stand for us before the sun of righteousness, lest perhaps something of the cause of our transgression should have been from them too — lest perhaps they expended less of work and labor toward us, whereby they might have recalled us from the stain of sins. For unless there were something also in them which should seem blameworthy in the cause of ours, the discourse of Scripture would never say to the angel of this or that church that "you have, for example, certain persons holding the teaching of Balaam," or that "you have forsaken your former charity" or "your patience," or other things of this kind which we have already mentioned above, for which in the Apocalypse the angels of each church are blamed. For if the angel — for example, who received me sealed to him from God — hopes for a reward for those things which I did well, it is certain that he will also expect to be blamed for those things which were not done well by me. And therefore they are said to be displayed before the sun, without doubt so that it may appear whether the sins were committed through my disobedience or through his negligence, by which I was consecrated either to Baal-peor or to any other idol, according to the quality, that is, of the sinning. But if my chief — I mean the angel who is sealed to me — was not lacking, but admonished me of good things and spoke in my heart, at least insofar as my conscience recalled me from sin, but I, despising his admonitions and spurning the restraint of conscience, burst headlong into sins, my punishment will be doubled, both for the contempt of my admonisher and for the outrage of the deed committed. And do not indeed be surprised if we say that the angels come to judgment with men, since Scripture says that: "The Lord Himself will come to judgment with the elders of the people and with its chiefs." The chiefs, then, are displayed, and if the fault is in them, the wrath of God ceases from the people. There ought, therefore, to be a keener solicitude for us concerning our acts, knowing that not only shall we stand before the tribunal of God for our acts, but the angels too shall be brought to judgment for us, as our chiefs and leaders. For on this account Scripture also says: "Obey your overseers and submit to them in all things; for they keep watch, as those who will render account for your souls."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily20.html'
source_title="HOMILIES ON NUMBERS 20.4"
