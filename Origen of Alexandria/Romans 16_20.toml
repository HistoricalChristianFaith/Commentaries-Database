[[commentary]]
quote='''
"And the God of peace shall crush Satan under your feet speedily." The question is asked in this passage what Satan he meant, who was to be crushed swiftly by God beneath the feet of those to whom he writes. For if it be referred to one person, namely to him of whom it is said in the Gospel, "Behold, I see Satan falling from heaven like lightning," and who is indicated as the adversary of the human race, it will surely seem, if Paul truly says what he says, that once he is swiftly crushed beneath the feet of those to whom he was then writing, there is no longer any Satan to stir up contests and struggles and persecutions for believers: which the reality of things certainly does not allow. But it seems to me that in this passage he called "Satan" every spirit which opposes believers. For "Satan" in our tongue is rendered "adversary." Whatever, therefore, resists and opposes the soul that is striving toward God, and whatever is contrary to its peace, this is named "satan" for it. Accordingly he therefore prefaced it by saying, "the God of peace," that is, the God to whom peace is pleasing, "shall crush" him who is contrary to peace and works dissensions. So too, finally, we read in the books of Kingdoms that God raised up against Solomon a Satan, Hadad the Idumaean: that is, against Solomon, who was peaceable, he raised up a Satan who is contrary to peace. But just as to those whom the Apostle teaches, if they act thus and show themselves such as his discourse has described, he promises, for the amendment of their life, that Satan shall swiftly be crushed beneath their feet by the God of peace: so no less does the God of peace raise up against him who has not kept his peace in a pure heart and a clean conscience a Satan, that is, an adversary; so that he who has neglected the good of peace may endure the bitterness of assaults, and thus at last, set in the midst of the struggle, may remember the sweetness of the peace he violated. From both passages of divine Scripture, then, let us be edified — that in which God is said to raise up a Satan for the negligent, or to crush and subject him for the zealous — so that he may rouse the former to contests, and to the latter grant the palm of victory over the prostrate adversary, and bestow the rewards of virtue. And we can also say, in each single contest, if we strive lawfully, that God will crush Satan beneath our feet speedily. For example, if someone has undertaken the contest of chastity, if he has persevered to the end with an unstained conscience, it can be said of him that God has crushed Satan beneath his feet, that is, the spirit which was contrary to chastity. Likewise he too who undertakes the contest of faith, if standing before kings and governors he confesses the Lord Jesus Christ with confidence, and remains in that confession to the end, God has crushed Satan beneath his feet, since by steadfast faith he has conquered the spirit of unbelief. So also he who perseveringly cultivates concord crushes the demon of dissension beneath his feet; he who preserves gentleness tramples the Satan of wrath under the footsteps of patience. This surely is what the Lord says in the Gospel: "Behold, I have given you power to tread upon serpents and scorpions, and upon all the power of the enemy."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"


[[commentary]]
quote='''
The grace of our Lord Jesus Christ be with you. The grace of God and the grace of our Lord Jesus Christ are to be taken as one and the same grace. For just as the Father gives life to whom he wills, so also the Son gives life to whom he wills; and just as the Father has life in himself, and has granted to the Son to have life in himself, so also the grace which the Father gives, this the Son likewise gives. Yet it must be understood that everything which human beings have from God is grace, for they have nothing by right of debt. For who has first given to him, and it shall be repaid to him? Grace, then, is whatever he possesses who once was not and now is, receiving it from him who always was, and is, and shall be forever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
