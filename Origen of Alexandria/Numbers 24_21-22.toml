[[commentary]]
quote='''
But the prophecy makes mention of the Kenite after Amalek, saying: "And seeing the Kenite, taking up his parable, he said: Strong is your dwelling, and if you set your nest in the rock, and if Beor be to you a nest of cunning, the Assyrians shall lead you captive." It seems to me that he names the Kenite not very blameworthily; for he is the one to whom in the earlier passages Saul also said: "Depart out of the midst of Amalek, and I will not smite you, because you did mercy in Israel, when it was coming up out of Egypt." Of this one, therefore, it is now said also that his dwelling is strong, if he sets his nest in the rock. The rock is Christ. If therefore he sets his nest in the rock, his dwelling is strong, provided that Beor does not become for him a nest of cunning. Beor is the father of Balaam, who can be taken in the person of the heretics; so that this seems to be said, that the Kenite can be saved if he sets his nest in the rock, that is, if he places his hope in Christ and does not surround and circumscribe him with the cunning of the heretics. For if this should happen, it will profit him nothing that he seems to be set in the rock, which is Christ; for he will be led captive by the Assyrians, that is, by the malignant powers, which lead captive and take into their power those whom heretical error has enveloped. It seems indeed, according to this exposition which we have set forth concerning the Kenite, that the conjunction "and" also disturbs the sense. But it must be known that it is a native property of the Hebrew tongue to use the conjunction "and" frequently in such a way that at times it is superfluous and, as appears in our language, seems inserted among unnecessary things. This certainly must be received with indulgence; for each language has something of its own property which among other languages may seem faulty. And here therefore the conjunction "and" is to be held as, so to speak, superfluous and redundant. Let the Kenite, therefore, who is interpreted "possessing," beware — let him beware, I say — even if he possesses and earns this grace, that he be in the Church of Christ, lest perhaps the cunning of Beor circumvent him and turn him aside to depraved and perverse doctrines and for this cause he be handed over to the Assyrians. For those who blaspheme, being set within the Church, are handed over to Satan, as Phygelus and Hermogenes, of whom Paul says: "Whom I handed over," he says, "to Satan, that they may learn not to blaspheme." Therefore for this reason he who has turned aside into heretical blasphemy is handed over to the Assyrians, because the Assyrians are interpreted "directing"; and for this cause those who are handed over are handed over to these, not that they may perish, nor that they may utterly be destroyed, but that they may be directed and corrected and, as Paul himself says: "that they may learn not to blaspheme."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily19.html'
source_title="HOMILIES ON NUMBERS 19.3"
