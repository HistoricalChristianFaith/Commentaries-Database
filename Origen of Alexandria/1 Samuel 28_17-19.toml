[[commentary]]
quote='''
But the argument is still under examination. And I say that both the narrative and the examination concerning it are necessary, so that we may see what awaits us after our departure. "He has spoken by my hand, and the Lord will rend the kingdom from your hand and give it to your neighbor, to David." But a demon cannot know the kingdom of David that was appointed by the Lord. "Because you did not hearken to the voice of the Lord, you did not execute the anger of his wrath upon Amalek." Are these not the words of God? Are they not true? For truly Saul did not do the will of the Lord, but "preserved the king of Amalek alive," for which also, before his death and at his departure, Samuel reproached Saul: "And on account of this word the Lord has done this to you on this day; and the Lord will give Israel also into the hand of the foreigners." Can a demon prophesy about the whole people of God — that the Lord is about to hand over Israel? "The Lord will also hand over the camp of Israel into the hand of the foreigners. But hasten, Saul: tomorrow both you and your sons shall be with me." And can a demon know this — concerning a king anointed together with a prophet — that tomorrow Saul was about to depart from life, and his sons with him? "Tomorrow you and your sons shall be with me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25202%2520-%2520On%2520the%2520Witch%2520of%2520Endor.html'
source_title="HOMILIES ON 1 SAMUEL 2.5"
