[[commentary]]
quote='''
After these things he says: "seeing the vision of God in sleep, his eyes uncovered." Of these things it has been sufficiently discoursed in the third vision, and it is idle to repeat the same things. Let us therefore see what it is that he says in what follows: "I will show him, and not now; I bless him, and he does not draw near." In other copies indeed it reads: "I will see him, but not now"; which, if it be accepted, will be thought to be understood more easily, so that he says that Christ, of whom he speaks in what follows: "A star shall arise out of Jacob, and a man shall rise up out of Israel," is to be seen, but not now, that is, not at that time at which he was saying these things; for in the last days, when the fullness of times came, God sent his Son. But if it is to be read according to what we have in our copies, that is: "I will show him, and not now; I bless him, and he does not draw near," it refers not to this Balaam, through whom these things are said, but to those whose person we have said is represented in this. For those teachers of the law and scribes will show Christ prophesied in the law and the prophets, but not now, that is, not at the time at which he came, but when the fullness of the nations shall have entered in, and all Israel shall begin to be saved—then they will show him and then they will bless him whom they now blaspheme. But this time, in which these things are to be, does not draw near; for it is far off and to be hoped for at the very end of the age. And therefore he says: "I will show him, and not now"—"to him," that is, to the people who will then be saved. After these things: "A star," he says, "shall arise out of Jacob, and a man shall rise up out of Israel." Of these things we spoke also in the earlier passages, that it is evidently prophesied of the star which appeared to the Magi in the east; with which as their guide they came to Judea seeking him who was born, the King of Israel, and having found him, offered gifts and adored him. But it moves me that concerning that very star, after it was said in the Gospel that it went before the Magi as far as Bethlehem, and coming, stood above where the child was, nothing further was said, that either it departed thence or vanished or was taken up, or that the Gospel narrative indicated anything at all about this, but it said only this: that it came and stood above where the child was. Lest therefore perhaps, just as at the time of the baptism, when Jesus, having been baptized, ascended from the Jordan, the heavens were opened to him and John saw the Spirit of God descending as a dove and remaining upon him, and heard a voice from heaven saying: "This is my beloved Son, in whom I am well pleased," so also this star, which came above where the child was and stood there, likewise remained upon Christ, just as the Holy Spirit too is said to have come in the appearance of a dove and to have remained upon him. And just as we understand that the Spirit of God came upon him and remained upon him in such a way that the Spirit of God never departed from him, so also the star, which came and stood over him, I think is to be understood to have so stood over him that it was never moved thence. And therefore I am of the opinion that that star was an indication of his deity. Whence also the order of the prophecy shows these same things consequently, when concerning his deity indeed it says: "A star shall arise out of Jacob," but concerning his human nature: "and a man shall rise up out of Israel," so that in both, according to deity and according to humanity, Christ may evidently appear to have been prophesied. "And he shall lay waste the princes of Moab." Moab indeed is a nation, whose princes we understand to be none other than the spiritual wickednesses and those principalities against whom is our wrestling. These, then, that man out of Israel shall lay waste, when he shall strip off the principalities and powers, and shall fasten them to his cross. For he could not save the Moabites and lead them to the knowledge of God, unless he had laid waste those princes who had held the dominion of impiety over them. "And he shall despoil all the sons of Seth." Seth is the son of Adam, of whom Eve said, when he was born: "For God has raised up for me another seed instead of Abel, whom Cain slew." This, then, is Seth, from whom the whole human race in this world is said to descend; for of those who had been born of Cain, they perished in the flood. The sons of Seth, therefore, are all men who are in this world. And when it is said: "he shall despoil all the sons of Seth," take "spoil" as we interpreted it in the earlier passages, where it is written: "he shall eat the nations of his enemies," and where he is compared to a lion's cub and to a lion. Here too, then, he takes as spoil all the sons of Seth. When the adversary demons are conquered, Christ leads the men who were held under their dominion as, so to speak, the spoil of his victory, and carries off the plunder of salvation, just as it is written of him also elsewhere that: "ascending on high he led captivity captive"; that captivity, namely, of the human race, which the devil had taken to perdition, this one in turn led captive and recalled from death to life. Would then that Jesus might always hold me too captive and lead me as his spoil, and that I might be held bound by his chains, so that I too might deserve to be called a prisoner of Christ Jesus, just as Paul too glories of himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily18.html'
source_title="HOMILIES ON NUMBERS 18.4"
