[[commentary]]
quote='''
It is good and best, if any woman is able to possess the grace of virginity; but if she has not been able to do this, and it has befallen her to lose her husband, let her remain a widow. And this she ought to have in mind not only after the death of her husband, but even while he lives, so that, even if her own will and resolve do not come to pass, she may be crowned by the Lord and may say: this I vow and promise, that if anything human, which I do not wish for, should befall me, I will do nothing else than remain undefiled and a widow. But now second and third and fourth marriages — to say nothing of more — are found in the Church, and we are not unaware that such a union will cast us out of the kingdom of God. For just as not only fornication but also second marriages exclude a man from ecclesiastical dignities — for neither a bishop nor a presbyter nor a deacon nor a widow can be twice-married — so perhaps the twice-married man will also be cast out from the assembly of the "firstborn and undefiled", the "Church, which has no spot or wrinkle"; not that he is sent into the eternal fire, but that he has no part in the kingdom of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily17.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 17"
