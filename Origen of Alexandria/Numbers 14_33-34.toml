[[commentary]]
quote='''
After these things the Lord adds and says: "But your sons shall be dwellers in the desert for forty years." And he declares what mystery this number holds, saying: "According to the number of the days," he says, "in which you examined the land, forty days, a day for a year, you shall receive your sins for forty years." I am afraid to examine the secrets of this mystery; for I see that in this the reckoning of sins and of punishments is comprehended. For if to each sinner a year is assigned for punishment for a single day's sin, and according to the number of the days in which one sins the same number of years must be spent in torments, I fear that perhaps for us, who sin daily and perhaps pass no day of our life without sin, not even the ages themselves, or even the ages of ages, may suffice for paying the penalties. For in the fact that that people is tormented for forty years in the desert for the transgression of forty days, and is not permitted to enter the holy land, a certain likeness of the future judgment seems to be shown, where the reckoning of sins is to be examined — unless perhaps there will be also some compensation from good works, or even from the evils which each one receives in his own life, as Abraham taught concerning Lazarus. But these things it belongs to none to know fully save to him to whom the Father has handed over all judgment. But that a day of sin is reckoned as a year of punishment is shown not only in this book, in which there is nothing at all that can be doubted, but also in the little book of the Shepherd, if indeed that writing seems to anyone worthy to be received, similar things are indicated. But perhaps someone may deny that it befits the goodness of God to repay a year of punishments for a single day's sin; nay rather he will say that, even if he repays a day for a day, though just, yet he does not seem to be clement or kindly. Hear, then, in answer to these things, if perchance we may be able to explain the difficulty of the matter by clearer examples. If a wound is inflicted on the body, or a bone is broken, or the joining of the sinews is dissolved, such wounds are wont to befall bodies within the space of a single hour, and afterward, with very many torments and pains endured, are scarcely healed over a long time; for how great swellings arise in the place, how great torments are generated? But now, if it should happen that in the same wound or in the same fracture one is wounded again and more often and is broken more frequently, with how great penalties can this be cured and with how great torments be medicined? And over how long a time, if indeed it can be, is it brought to health? And scarcely at some point will it be so cured that it escapes either weakness of the body or ugliness of the scar. Pass now from the example of the body to the wounds of the soul. As often as the soul sins, so often is it wounded. And lest you doubt that it is wounded by sins as by darts and swords, hear the Apostle admonishing us to take up the shield of faith, in which, he says, "you may be able to extinguish all the fiery darts of the evil one." You see, then, that sins are the darts of the evil one, which are aimed at the soul. But the soul suffers not only the wounds of darts, but also the fractures of the feet, when snares are prepared for its feet and its steps are tripped up. These, therefore, and such-like wounds, over how long a time do you think they can be healed? O if we could see, through each single sin, how our inner man is wounded, how an evil word inflicts a wound! Have you not read, they say, that swords wound, but not as the tongue does? The soul, therefore, is wounded also through the tongue; it is wounded also through evil thoughts and lusts; and it is broken and crushed through the works of sin. And if we could see all these things and feel the scars of the wounded soul, it is certain that we would resist against sin unto death. But now, just as those who are either filled with a demon or deranged in mind do not feel if they are wounded, because they lack their natural senses, so too we, made senseless either by the desires of the world or intoxicated by our vices, cannot feel how great wounds, how great contusions of the soul we acquire by sinning. And therefore it is a most consistent reckoning that the time of punishment — that is, of cure and of healing — is extended, and that for each single wound, according to the quality of the blow, the spaces of healing also are prolonged. Thus, therefore, both the equity and the kindness of God will become evident even in the very punishments of the soul; and he who has sinned, hearing these things, may come to his senses and sin no more. For conversion in the present life, and repentance fruitfully carried out, will confer a swift medicine on wounds of this kind, because repentance not only heals the past wound, but also does not allow the soul to be wounded by sin any further. Indeed, I will add this also: for the sake of argument, if I am a sinner, will the same punishment be mine if I have sinned once as if I sin a second and a third time and more frequently? It will not be so, but according to the manner and number and measure of the sin the quantity also of the punishment must be measured. For God will give us the bread of tears and will give us to drink in tears, but in measure. And this will be the measure which each one has procured for himself in this life by sinning either less or more. But also the cup in the hand of the Lord is said to be full of pure wine mixed. It is mixed, therefore, without doubt for each one, and his judgment will be made not only from the evils which he has done, but also from the good things. And yet, though both are mixed together, its dregs — which I think are said to be the portion of the evils — will not be emptied out to the full. But these things, as we have said, are in the hand of God; but it is ours to hasten more quickly to amendment, to turn to repentance without dissimulation, to mourn the past, to beware of the future, to invoke the help of God; for as soon as you, converted, have groaned, you will be saved. For you will find an advocate who intercedes for you with the Father, the Lord Jesus, far more excellent than Moses was, who nevertheless prayed for that people and was heard. And perhaps it is for this reason that Moses is written to have interceded for the sins of the former people and to have obtained pardon, that we might all the more trust that our advocate Jesus will grant us undoubted pardon from the Father — provided, however, that we turn to him and our heart does not go back behind, as John also says in his epistle: "But these things I say, little children, that you sin not. And if any of you has sinned, we have an advocate with the Father, Jesus the just, who intercedes for our sins." To him be glory unto the eternal ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily08.html'
source_title="HOMILIES ON NUMBERS 8.1"
