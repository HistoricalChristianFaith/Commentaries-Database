[[commentary]]
quote='''
Thus, then, in "If any man has not the Spirit of Christ, he is none of his; but if Christ is in you, the body indeed is dead because of sin, but the Spirit is life because of justice," he seems to me in this place to call the Spirit of Christ and Christ one and the same thing. In him, therefore, in whom Christ is, he himself says that "we always carry about the death of Christ in our body." But death is imposed upon the body for the sake of sin — that is, that it may not sin. And if the body is dead to sin, necessarily the spirit lives for the doing of justice. For he who is dead in the body and does not serve sin must needs live in the spirit and serve justice. So too the same Apostle says in a certain place that he had delivered a certain man over to the destruction of the flesh, that the spirit might be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
