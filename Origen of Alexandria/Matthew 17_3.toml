[[commentary]]
quote='''
However, if any man discerns a spiritual sense in the Law agreeing with the teaching of Jesus, and in the Prophets finds the hidden wisdom of Christ, (1 Cor. 2:7.) he beholds Moses and Elias in the same glory with Jesus.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Moses, therefore, has nothing else glorious in the law except his face alone; but in the Gospels he is wholly glorified, entirely. For hear what it says in the Gospels: "when Jesus had ascended into a high mountain, taking with him Peter and James and John, and was transfigured there before them; and behold," it says, "there appeared Moses and Elijah in glory, speaking with him." Here it is not reported that his face was glorified, but that he wholly "appeared in glory," speaking with Jesus; and there is fulfilled for him that promise which he received on Mount Sinai, when it was said to him: "you shall see my hinder parts." He saw, therefore, his hinder parts. For he saw the things that were done in the latter and last days, and he rejoiced. For just as Abraham longed to see the day of the Lord "and saw it and rejoiced," so also Moses longed to see the day of the Lord "and saw it and rejoiced"; and necessarily "he rejoiced," because now he descended from the mountain glorified not in face alone, but ascended from the mountain wholly glorified. "Moses rejoiced," without doubt, because he now beheld present, and confirming his own words, the one of whom he had said: "the Lord your God will raise up for you a prophet from among your brethren, like myself; him you shall hear in all things." And that he might not hesitate in anything, he hears the Father's voice saying: "this is my beloved Son, in whom I am well pleased; hear him." Moses long ago said: "him you shall hear": now the Father says: "this is my Son, hear him," and points out present the one of whom he speaks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily12.html'
source_title="HOMILIES ON EXODUS 12"
