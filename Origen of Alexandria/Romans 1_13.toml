[[commentary]]
quote='''
There is indeed a hyperbaton in this passage; there is also a defect of expression. But the hyperbaton we may render in this way: "But I would not have you ignorant, brethren, that I have often purposed to come to you, that I might have some fruit among you also, even as among the other nations, Greeks and barbarians, wise and unwise, and have been hindered until now." The defect of expression, however, will be supplied in this manner. In the place where he says: "And among the other nations, Greeks and barbarians, wise and unwise", there seems to be lacking "to whom", so that what follows may be read thus, "to whom I am a debtor"; and the sequence would be of this kind: "Just as I have fruit among the other nations, Greeks and barbarians, wise and unwise, to whom I am a debtor, so, as much as in me lies, I am ready to preach the Gospel to you also who are at Rome. For never among any nation have I been ashamed to preach the Gospel, because the power of God is in it unto salvation to everyone that believes, to the Jew first, and to the Greek; because in the Gospel the righteousness of God is revealed, which before lay hidden and veiled in the Law." And it is revealed in those who come from the faith of the Old Testament to the new faith of the Gospel, as it is also said in the prophet, that the righteous man, even if he is still under the Law, believing God and his servant Moses, lives by faith; and when he comes to the Gospel, he is directed from the faith of the Law into the faith of Christ, and thus he advances from faith to faith. Let these things be said so far as pertains to the sequence of the Apostle's own words. But now let us inquire into what belongs to the understanding. In saying, "that I have often purposed to come to you", he shows the charity which he had toward the Romans. But in that he added, "and have been hindered until now", if indeed he be thought to have been hindered by God, it is shown by this that even this is a care to God, whither each of the apostles ought or ought not to go, and that by a certain dispensation he permits the word of God to be preached to some and forbids it to others, as he also says elsewhere: "And when we attempted to go into Bithynia, the Spirit of Jesus forbade us"; and in the Gospels it is said by the Savior: "To you it is given to know the mystery of the kingdom of God, but to others in parables, that seeing they may not see, and hearing they may not hear." But if the words, "I have been hindered until now", be referred to him of whom he himself says elsewhere, that "Satan hindered us", he fittingly shows that he strives without ceasing in his prayers, that, the hindrances of Satan being overcome, his journey may be made prosperous in the will of God to see those who are at Rome. For he longs, and does not cease to beseech in his prayers, that he may gain some fruit from them, as from the other nations. Whence Paul, as one desirous of great riches, longs to gather in revenues from many rational possessions. He gathers fruits from the Greeks, he gathers from the barbarians, he gathers from the wise, he collects something even from the unwise, while to some, as to the perfect, he speaks wisdom, and to others, as to the unwise, he says that he knows nothing else save Christ Jesus, and him crucified; while some he teaches from the Law and the Prophets, and others he persuades by signs and mighty works. But Paul brings forth all these fruits because, as a good branch, he abides in the true vine, which is Christ, whom the Father the husbandman more frequently prunes, and therefore he brings forth much fruit. And he prunes him in labors, in tribulations, in persecutions. For there are other branches which indeed abide in the vine, but bear no fruit, and are dry. Of these are they who in name indeed abide in Christ, but in works and deeds are found unfruitful and dry; who are said to be cut off by the Father, and cast into the fire. For as the first man Adam was a kind of vine, and the root of the human race, which brought forth some fruitful branches indeed, such as Seth, Enos, Enoch, and the rest down to Noah; but others unfruitful and useless, such as Cain, and all the stock which was begotten from him: so also in Christ, who is the last Adam, there are certain fruitful branches, bearing fruit as in the true vine; but certain dry ones, to be cut off by the Father the husbandman. But this also is to be observed, that the Apostle names the fruit of good things in the singular number, as also elsewhere: "But the fruit of the Spirit is charity, joy, peace"; whereas the works of the flesh which he reproaches he sets forth in the plural. But if anyone should object what is written in the Psalm, "You shall eat the labors of your fruits", spoken both in a good sense and in the plural; it must be known that, just as he who was trading in many pearls, finding one precious one, sold all and bought that one; so a man, beginning from many fruits, ought to press on toward the one fruit of perfection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook01.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
