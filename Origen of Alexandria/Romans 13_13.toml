[[commentary]]
quote='''
What the works of darkness are which must be cast off, he next enumerates, saying: Not in revelings and drunkenness; not in chamberings and impurities; not in strife and envy. These are the works of darkness, which are also called the works of the flesh, in those who have made over their flesh to wantonness and impurity, not to holiness nor to the Lord. For revelings — that is, disgraceful and luxurious banquets, whose necessary companion is the most shameful drunkenness — what else will follow upon them, save chamberings and impurities? From foul couchings they are named "chamberings," things which seem to befit not so much rational human beings as wild beasts and brutes. Not in strife and envy. Those things which he named above are vices of the flesh; these now are also of the soul — although all alike are called works of the flesh and works of darkness, because in truth strife and envy are in the souls of those who live according to the flesh and who walk in darkness. But he who is in the light, and walks honorably as in the day, does nothing through strife, nothing through vainglory. In this way, then, does one cast off (as he said above) the works of darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
