[[commentary]]
quote='''
But now, repeating what has been said, let us examine them one by one. "Or are you ignorant," he says, "brothers (for I speak to those who know the law), that the law has dominion over a man as long as he lives?" He has a hyperbaton at once at the beginning, which is thus resolved: "Or are you ignorant, brothers, that the law has dominion over a man as long as he lives?" and after this is restored that which was inserted in the middle: "For I speak to those who know the law." Now what he said, "I speak to those who know the law," is like that which he says a little later: "But we know that the law is spiritual." That the law is spiritual, however, not Paul alone knew, but also those who were instructed by him — those, that is, who were spiritual, of whom he says: "But the spiritual man examines all things." For concerning the Galatians I cannot declare that they know the law to be spiritual, of whom he says: "O foolish Galatians." Unless perhaps they knew it then when they had begun with the spirit; but they did not remain in this knowledge, because they were made complete in the flesh. But the teaching of the apostles, and of those who were trained by them for teaching, was such as would teach men to serve the law "not in the oldness of the letter," but "in the newness of the spirit." Which I think not only the apostles, but also the prophets, and any who were then wise among the people of God, perceived — that the law is spiritual — although for the sake of the multitude they seemed to keep the carnal observance as well. Nor is this to be wondered at, since Paul himself says: That "I became to the Jews as a Jew, that I might gain the Jews." Thus therefore many in the former people were advancing in spiritual knowledge, and saw the glory of the Word of God, just as Isaiah is written to have seen the glory of the Son of God, as John testifies when he says: "But these things Isaiah said, when he saw his glory." Therefore Paul speaks to those who know the law — that is, to those who know what in the law is the oldness of the letter, and what the newness of the spirit; and he who knows this well knows doubtless that the law has dominion over a man as long as he lives, just as a husband over a woman; and just as by the death of her husband the woman is freed from the law of wedlock, and receives liberty to be joined to another husband, so also the soul whose husband is the law, when it has detected the oldness of the letter in the law — since what grows old is near to destruction — the law according to the letter being as it were dead to it, receives the power of marrying another husband, who is the spirit of the law: "Now the Lord is the Spirit." But what he said, "The law has dominion over a man as long as he lives," refers not to the man, but to the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
