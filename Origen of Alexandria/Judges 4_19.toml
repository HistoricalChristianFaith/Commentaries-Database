[[commentary]]
quote='''
But if from this too something seems worthy of being asked by diligent hearers — namely that he is said to have "given him milk to drink" when he had asked for "water" — let us see whether perhaps, according to the mystical or allegorical laws, something of this kind can also be shown concerning this. The food of "milk" is said in the holy Scriptures to be this first moral instruction, which is delivered to beginners as though to "little ones." For at the beginnings the deep and more hidden mysteries are not at once to be delivered to disciples, but the correction of morals, the amendment of discipline, the first elements of religious conduct and of simple faith are delivered to them. This is the "milk" of the Church, these are the first elements of the "little ones" who are beginning. But this food indeed bestows life and salvation upon those who bear the purpose of advancing toward the good; whereas upon those to whom contrary things are pleasing, to whom luxury, lust, avarice, and all impiety are dear, doctrine of this kind furnishes death and destruction. Thus, then, it comes about that from these same foods by which the good are nourished, the evil are choked, and where for the pious there is life, there for the impious there is death. Finally, that the matter of which we speak may become plainer by an example: wine helps the healthy and those living suitably and, as Scripture says, "gladdens the heart of man" — of the healthy man at least — but to the feverish, if they take it, it straightway brings ruin and destruction. So it comes about that the same thing, taken in the same way, confers on one indeed life, but on another death. Thus, then, it is also to be understood that this Sisera, the "animal man" and prince of vices, was extinguished through the doctrine of the Church, which he did not receive in faith. But let each and every soul also strive to lull to sleep and extinguish Sisera within itself by this evangelical and apostolic milk. For if anyone, taught through these things, has "mortified his members which are upon the earth, avarice, fornication" and the rest which the holy Apostle enumerates, he will be seen to have slain Sisera within himself — so that these things may be shown to be accomplished not only in the person of the Church, but also that each one may show them to be fulfilled in his own soul. Since, therefore, as we have said, Sisera indeed began to be pursued by the former people, but was slain by a woman — this Church of the nations — and into her hand was given the palm of victory, at the consummation of all things, that is, at the end of the age, a song too will be sung to the Lord through Deborah, in which the "primacy" will indeed be given to Jael, the Church of the nations, nor yet will Barak's praise be passed over in silence, but one and the same reward of victory will be given to both the first and the last, through Jesus Christ our Lord, "to whom is glory and dominion unto the ages of ages. Amen!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily05.html'
source_title="HOMILIES ON JUDGES 5"
