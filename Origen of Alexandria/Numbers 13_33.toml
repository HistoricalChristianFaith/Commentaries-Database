[[commentary]]
quote='''
But if you wish to hear how Paul, who is not only the teacher of the Gentiles but also the master of this warfare, fought first, hear what he himself writes concerning himself, as we have also mentioned above. "Our wrestling," he says, "is not against flesh and blood, but against principalities and powers, against the rulers of this world of darkness, against the spiritual forces of wickedness in the heavenly places." For this reason he also fits out with spiritual arms and invisible weapons those who are about to fight this spiritual and invisible battle, and says: "put on the breastplate of charity and the helmet of salvation, and take up the shield of faith, in which you may be able to extinguish all the fiery darts of the evil one." "But take up also," he says, "the sword of the Spirit, which is the word of God." When therefore you have armed yourself with such weapons, following Joshua as your leader, do not fear those giants; for you will see how Joshua will subject them to you; and just as the fathers trod upon the necks of the nations, so you too will tread upon the necks of the demons. For he himself says to those who follow him faithfully: "behold, I have given you power to tread upon serpents and scorpions and over all the power of the enemy." For Jesus always wishes to do wonderful things, wishes to conquer giants by locusts, and from those things which are on the earth, to overcome the heavenly wickednesses. And perhaps this was what he said in the Gospels, that he who believes in him will not only do those things which he himself did, but "will do even greater things," he says, "than these." For truly it seems to me greater if a man, placed in the flesh, frail and perishable, armed only with the faith of Christ and his word, should overcome giants, the legions of demons. Although it is he himself who conquers in us, yet he says that it is more that he conquers through us than that he conquers through himself. Only let us be always armed with these weapons and let our citizenship be always in the heavens. Let every motion of ours, every act, every thought, every word be heavenly. For the more ardently we ascend thither, the more headlong they will descend from thence; and the more we are increased, the lower they will become. Our life, if it be holy, if it be according to God, will bring death to them; if it be sluggish and dissolute, it will make them powerful against us and giants. The more therefore we grow in virtues, the more inferior and frail they become, just as, on the contrary, if we are weakened and seek earthly things, they become stronger. And the more we are spread abroad on the earth, the more ample spaces we concede to them in the heavenly places. Wherefore let us rather do this, that as we increase they may be diminished, as we enter in they may be driven out, as we ascend they may fall; just as he fell of whom the Lord says in the Gospel: "behold, I saw Satan falling like lightning from heaven," so that, they being cast out from thence, the Lord Jesus may bring us in thither and grant us to receive his heavenly kingdom. To him be glory unto the eternal ages of ages! Amen!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily07.html'
source_title="HOMILIES ON NUMBERS 7.6"
