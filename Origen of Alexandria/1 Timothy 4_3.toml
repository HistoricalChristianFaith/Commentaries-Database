[[commentary]]
quote='''
The Savior then commanded, "What God has joined together, let not man put asunder." But man wishes to put asunder what God has joined together. He does this when, "falling away from the sound faith, he gives heed to seducing spirits and doctrines of demons, through the hypocrisy of men who speak lies, branded in their own conscience as with a hot iron, and by forbidding" them not only to commit fornication but even "to marry." In this way he dissolves even those who before had been joined together by the providence of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FIntroduction.html'
source_title="COMMENTARY ON MATTHEW 14.16"


[[commentary]]
quote='''
Do you wish me to show you still further what kind of fast you ought to fast? Fast from every sin, take no food of malice, partake of no feasts of pleasure, grow warm with no wine of luxury. Fast from evil deeds, abstain from evil words, hold yourself back from the worst thoughts. Do not touch the stolen loaves of perverse doctrine. Do not covet the deceitful foods of philosophy, which would seduce you from the truth. Such a fast is pleasing to God. But "to abstain from foods which God has created to be received with thanksgiving by the faithful," and to do this together with those who crucified Christ, cannot be acceptable to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily10.html'
source_title="HOMILIES ON LEVITICUS 10"
