[[commentary]]
quote='''
"God is a spirit, and those who worship him must worship in spirit and in truth". Our God too "is a consuming fire". God, therefore, is called by two names: both "spirit" and "fire": spirit for the righteous, fire for sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily26.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 26"


[[commentary]]
quote='''
Hear what is written: "Our God is a consuming fire." What does the God of fire consume? Will we be so senseless as to think that God consumes the firewood or straw or hay? But the God of fire consumes human sins. He consumes them, devours them, purges them, as he says in another place, "I will purge you with fire for purity."
'''
source_url='https://www.google.com/books/edition/Homilies_on_Leviticus_1_16/Eo9Da7xaBuUC?hl=en&gbpv=1&dq=homilies+on+leviticus+origen&printsec=frontcover'
source_title="HOMILIES ON LEVITICUS 5.3"
