[[commentary]]
quote='''
"God is a spirit, and those who worship him must worship in spirit and in truth". Our God too "is a consuming fire". God, therefore, is called by two names: both "spirit" and "fire": spirit for the righteous, fire for sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily26.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 26"


[[commentary]]
quote='''
Hear what is written: "our God," it says, "is a consuming fire". What does the "God who is fire" consume? Shall we be so foolish as to suppose that the "God who is fire" consumes "wood" or "stubble" or "hay"? But the "God who is fire" consumes human sins, he takes them away, he devours them, he purges them, according to what he also says elsewhere: "and I will purge you with fire to purity".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily05.html'
source_title="HOMILIES ON LEVITICUS 5"
