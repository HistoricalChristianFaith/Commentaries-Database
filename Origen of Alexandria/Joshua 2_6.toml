[[commentary]]
quote='''
But not even the "stalk of flax," in which the spies lay hidden, do I receive without sacred meaning. For flax is the priestly garment, by which is signified either that to those who were to be invited the priestly dignity was conferred, as the Apostle Peter too says: "But you are a holy nation, a royal priesthood," or certainly that in the sacred mystery of the law, where it is noted concerning the priests, the hidden calling of this people, which is "from the nations," lay concealed. Straightway, therefore, the "harlot" undergoes enmities against the "king of Jericho." Why not, since "the flesh lusts against the spirit and the spirit against the flesh"? And again he says: "This world hates you, because it hated me before you." There is, therefore, a certain king who is the enemy of this harlot, who is "the prince of this world," who pursues and desires to seize the spies of Jesus, but cannot prevail, because they make their journey over the mountains; they do not walk through the lowly places nor delight in the valleys, but pursue the hilly summits and the high places of the mountains; for this our harlot says: "I lifted up my eyes to the mountains; from whence shall my help come?" The "prince of this world" cannot ascend thither, nor can he by the lofty way come to Jesus; nay rather, even if tempting him he set him on high places, he says to him: "Cast yourself down," because he always loves the lowly and the fleeting things, in these he reigns, in these he sets his seat, in which also he may descend even to hell.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily01.html'
source_title="HOMILIES ON JOSHUA 1.5"
