[[commentary]]
quote='''
Whence it also seems marvelous that Mary's offering did not have the first victim, that is, "a yearling lamb," but the second, as one whose "hand did not suffice" for the first. For thus it is written concerning her: there came, it says, her parents, "that they might offer" for him "a victim, according to that which is written in the law of the Lord, a pair of turtledoves or two young pigeons." But in this too is shown to be true that which is written, that Christ Jesus, "whereas he was rich, became poor." Therefore for this reason he both chose a poor mother, of whom he would be born, and a poor fatherland, of which it is said: "And thou, Bethlehem, art the least among the thousands of Judah," and the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily08.html'
source_title="HOMILIES ON LEVITICUS 8"
