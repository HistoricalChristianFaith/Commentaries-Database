[[commentary]]
quote='''
With good reason, therefore, when Luke spoke of the woman who was a sinner, he introduced her as weeping copiously. She thus washed the feet of Jesus with her tears … only "anointing," and not his head but his feet. This woman, however, who was not described as a sinner, did not anoint but "poured" ointment, and not on his feet but "on his head." As to what is written about Mary, the sister of Lazarus, she too "anointed" the Lord's "feet." Note what the Gospel says: The whole "house was filled with the odor of the ointmen."Perhaps the differences in these women therefore may signify the differences in the faithful. Some of them pour out precious ointment "over the head" of Jesus, others do not anoint the head but only the feet, and others do not pour out abundantly but anoint only so much. Some of them anoint with ointment, leaving the whole house filled with the odor of his divinity. Then there are others, also acceptable to Christ, for they anoint his feet with ointment, which the Pharisees did not even anoint with "oil."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FIntroduction.html'
source_title="COMMENTARY ON MATTHEW 77"

[[commentary]]
quote='''
In the Gospel too a woman, taking an alabaster jar of ointment of costly spikenard, poured it over the head and feet of Jesus. Observe diligently what the two women poured over the head of the Savior. For the sinful woman is shown to have poured over his feet, and she who is not called a sinner over his head. Observe, I say, and you will find, in the Gospel reading, that not fables and tales were written by the Evangelists, but mysteries. And so the house was filled with the fragrance of the ointment — if what the sinful woman had is to be referred to the feet, and what the woman who was no sinner had, to the head. Nor is it any wonder that the house was filled with the fragrance, since this world has been filled with it. In the same place it is written of Simon the leper and his house. I think that the leper, the prince of this world, is also called "Simon the leper," whose house at the coming of Christ was filled with sweet fragrance, when the sinful woman did penance, and the holy woman drenched the head of Jesus with the fragrances of the ointment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25201.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 1"
