[[commentary]]
quote='''
On account of which neither is the blood of the hen offered at the altar, but it says that "the hen shall be slain in an earthen vessel, in which vessel living water has been put," so that both water may be taken up for purification and the fullness of the mystery be completed in "water and blood," which is said "to have gone out from the side" of the Savior, and no less in what John sets down in his epistle and says, that purification is made "in water and blood and spirit." Whence here too I see all these things fulfilled. For there is the "spirit" of that hen which is slain, and the "living water" which is in the vessel, and the "blood" which is poured out over it; not that we should think the grace of baptism is to be repeated through these things, but that every purification of sins, even this which is sought through repentance, has need of the aid of him from whose side "water" proceeded "and blood."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily08.html'
source_title="HOMILIES ON LEVITICUS 8"
