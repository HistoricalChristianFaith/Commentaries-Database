[[commentary]]
quote='''
Not avenging yourselves, dearly beloved, but give place to wrath. For it is written: Vengeance is mine, I will repay, says the Lord. In what way those who do not avenge themselves give place to wrath seems to me to be understood in two ways. For by this very fact, that (for example) they do not return blow for blow, or do not render insult for insult, they have given place to the wrath of him who did the injury to pass over and vanish away. For no one will be found so rabid that, having inflicted an injury, he rages again if he receives no requital; but, as though his fury were poured out and digested, he necessarily grows mild. There is therefore also great gain, where both the sinner's multitude of sins is checked, and the patience of him who suffered the injury becomes approved before God. But it is also possible to give place to wrath in this way: when, for the injuries they inflict, those who sin — according to Paul's own saying — treasure up for themselves wrath in the day of wrath, when God will render to each one according to his works. If, therefore, we avenge ourselves, it is no great thing that we render for the injury received — for instance, a slap for a slap, or a stone for a stone, or for the insult of a word an insult of a word none the less. But if we reserve these things for the vengeance of God, we give place, in him who has injured us, to that wrath which he beyond doubt treasures up for himself by his own evil deeds, which will exact from him in the judgment of God punishments far graver than we are able to inflict.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
