[[commentary]]
quote='''
For he who "went out to sow" "sows the word" over every place, but hear the Lord himself saying what the seed of God is wont to suffer: "some," he says, "fell by the wayside, and the birds of heaven come and snatch it away." Which, interpreting in what follows, he himself says: "but those who were sown by the wayside are they who hear the word of God and receive it with joy; but the devil comes and takes away from their heart what was sown." So therefore these too now come to the seed of God and wish to "take it away from the heart of those in whom it was sown," because they find them placed in the valleys and pursuing all that is lowest. For they belong to those who receive the word of God humbly and unworthily and, so to speak, with a Jewish understanding, and therefore the demons are able to "snatch it away from their heart." But he who ascends from the humility of the letter to the heights of the spirit, and, fleeing carnal understanding, pursues among the loftier things those which are of the Spirit of God — from him neither the Midianites nor the Amalekites can snatch anything.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily08.html'
source_title="HOMILIES ON JUDGES 8"
