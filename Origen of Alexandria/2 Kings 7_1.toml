[[commentary]]
quote='''
Similar things too you will find even in the times of Elisha, when the son of Hadad, king of Syria, went up against Samaria and besieged it: "and there was," it says, "a great famine in Samaria, until an ass's head was worth fifty shekels of silver, and a fourth part of a cab of dove's dung five pieces of silver." But suddenly through the word of the prophet a marvelous change comes about, as he says: "hear the word of the Lord. Thus says the Lord: as at this hour tomorrow, a measure of fine flour shall be for one shekel and two measures of barley for one shekel in the gates of Samaria." You see, then, from all these things what is gathered: that, when the famine prevails over the earth, not only does it not prevail over the just, but rather through them a remedy is brought to the disaster that threatened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily16.html'
source_title="HOMILIES ON GENESIS 16.3"
