[[commentary]]
quote='''
But for the distinction between those who are led by the spirit of servitude in fear and those who are led by the spirit of sons, this too may be taken up: that Abraham gave his inheritance indeed to Isaac, but to the sons of the handmaids or concubines he is said to have given not an inheritance but gifts or presents. In which without doubt this is foreshadowed: that not even those are utterly despised who still serve God in fear, but for them there are gifts and there are presents; the inheritance, however, through which they are glorified together with Christ, belongs to those who deserve to receive the spirit of adoption. After this the Apostle now weaves a syllogism from what follows, and says: If we have received the spirit of adoption, then we are sons. But if we are sons, without doubt we are also heirs. For a servant awaits wages, a son hopes for an inheritance. And again he adds another enlargement of the conclusion: "Heirs indeed of God, but coheirs of Christ." One becomes an heir of God when he deserves to receive the things that are God's, that is, the glory of incorruption and immortality, the hidden treasures of wisdom and knowledge; but a coheir of Christ when "he will transform the body of our lowliness to be conformed to the body of his brightness," and also when he has deserved to obtain that which the Savior himself says: "Father, I will that where I am, these also may be with me." There is besides that dignity too of the coheirs of Christ, that the Father indeed "has given all judgment to the Son." But the Son also says to his coheirs: "You also shall sit upon twelve thrones, judging the twelve tribes of Israel." And in this way Christ brings his coheirs not only into a share of the inheritance, but even into a partnership of power. "If however," he says, "we suffer together with him, that we may also be glorified together with him." He suffers together with Christ who says: "I have been crucified together with Christ"; and: "But I live, now not I, but Christ lives in me"; and again he who says: "If we have died together with him, we shall also live together with him; if we endure together, we shall also reign together"; or also he who is able to say that "what was lacking of the sufferings of Christ, I fill up in my body." And just as God supremely exalted Christ, because he had humbled "himself, made obedient unto death, even the death of the cross, and gave him a name which is above every name," so also those who suffer together with Christ, and imitate the example of his sufferings, God exalts with him in glory. For this is the way which Christ opened to his coheirs, that they should be exalted neither from strength nor from wisdom, but from humility, and should attain the eternal glory of the inheritance from patience under tribulations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
