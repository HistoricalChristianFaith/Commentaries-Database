[[commentary]]
quote='''
Therefore the prophets were not out of their senses; for it lay within their power to fall silent and to hold in check the spirit that was upon them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LXIX*"
