[[commentary]]
quote='''
The parable in the Gospel of Luke is about a man who went down from Jerusalem to Jericho and fell among thieves. The priest and the Levite passed by him, but the Samaritan came on him on his journey, saw him, had compassion, approached him and bound up his wounds, pouring oil and wine on them. Now, if someone is able to prove that what is said about the Samaritan who healed this man who was half-dead and who had fallen among thieves refers to one other than the Savior, he will also show why the Savior did not deny that he was a Samaritan.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252020.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 20.317-18"

[[commentary]]
quote='''
For providence was keeping the half-dead man for him who was stronger than the law and the prophets, namely the Samaritan, which is interpreted "guardian". This is he who "neither slumbers nor sleeps, keeping Israel". On behalf of the half-dead man this Samaritan set out ... that he might save and guard the one about to die — the Samaritan to whom the Jews said: "You are a Samaritan and have a demon", and who, when he had denied that he had a demon, would not deny that he was a "Samaritan"; for he knew that he was a "guardian".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily34.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 34"
