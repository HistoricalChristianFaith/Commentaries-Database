[[commentary]]
quote='''
The soul is in a certain sense mortal — and blessed, if it dies for sin. It was precisely of this death that Balaam spoke, when he prophesied, praying in the Divine Spirit: "May my soul die among the souls of the righteous." It was precisely of this death that Balaam prophesied wondrously, and in a word that came from God, wished for himself the most beautiful thing, for he wished to die for sin, in order to live for God. And therefore he said: "May my soul die the death of the righteous, and may my seed be as their seed!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"

[[commentary]]
quote='''
"Who shall search out the seed of Jacob, and who shall number the peoples of Israel?" This is like that which is written: "God led Abraham outside and said to him: Look up to heaven and number the stars, if you can number them. And he said: So shall your seed be." "And Abraham believed God, and it was reckoned to him for righteousness." But Abraham indeed, and any other of men, or even of angels, and perhaps also of the higher powers, could not number the stars, nor the seed of Abraham, concerning which it is written: "So shall your seed be"; but God, concerning whom it is written: "who numbers the multitude of the stars, and calls them all by names," and who said: "I have given command to all the stars," is able to search out the seed of Jacob and to number the peoples of Israel. For he alone knows who is truly Jacob and who is truly Israel. For he does not look to him who is a Jew openly, nor to that circumcision which is openly in the flesh, but he sees him who is a Jew in secret, and who is circumcised in heart, not in flesh. He alone, then, is the one who can number and search out, and he, according to his ineffable and incomprehensible wisdom, in accordance with that heavenly pattern which he alone can know, has appointed also these numbers which we have in hand; in which he commanded that, according to their kindreds, according to the houses of their families, by name every male be numbered head by head from twenty years and upward, everyone who goes forth in the host of Israel, and there is gathered a certain sacred number of them, concerning which we have already spoken above, as the Lord granted. But this number is sacred and pleasing to God only then, when it is numbered at his own command. But if anyone should wish to number contrary to the commandment of the Lord, though he be David, though a great prophet, he acts against the law and is reproved through the prophet and suffers those things which we read written in the second book of Kingdoms. He alone, then, who numbers the multitude of the stars and who has brought forth all things by measure and number and weight, searches out the seed of Jacob and numbers the peoples of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily15.html'
source_title="HOMILIES ON NUMBERS 15.3"

[[commentary]]
quote='''
After these things he seems to prophesy certain things as though concerning himself, when he says: "Let my soul die among the souls of the righteous, and let my seed be as the seed of the righteous." But this, as far as regards the person of that Balaam and that Israel, neither happened nor could happen; for he died not among them, but by them. Rather, then, as we have said, it will suit the person of those who, although in the present age they are held to be a vain people, because they are without the grace of the Holy Spirit, yet at the end of the age, when the fullness of the Gentiles shall have come in, and all that prophecy which is spoken concerning Israel shall have been fulfilled in the spiritual Israel, then their soul shall die with the souls of the righteous. For it will take up in itself the faith of Christ, so that they too may say: "We who were baptized in Christ were baptized in his death. For we were buried together with him through baptism into death," and again: "For if we die together, we shall also reign together." And thus it will truly be fulfilled for the intelligible Balaam, that his soul may die among the souls of the righteous. But that which he says: "and let my seed be as the seed of the righteous," could indeed be understood also of that Balaam according to this, that those magi who, coming from the East, first adored Jesus, seem to be of his seed, whether through succession of lineage or through the handing down of a teaching. For it is evidently established that they recognized the star which Balaam had foretold would arise in Israel, and that thus they came and adored the king who was born in Israel. Yet it will suit also that people according to what we said above; for not so much they themselves as their seed will become as the seed of the righteous, namely of those who, believing from among the nations, have been justified in Christ. Hence it is manifest that, as the Apostle says: "neither circumcision is anything nor uncircumcision, but faith, which works through love." And therefore let no one either boast in the antiquity of circumcision or glory in the newness of uncircumcision, but, as the Apostle says: "let each one prove his own work, and then he will have glory in himself alone." So finally the prophet too says: "Behold, the man and his work"; and the reward is said to be "in the sight of the Lord," that "he may render to each according to his works," in Christ Jesus our Lord, to whom be glory and dominion for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily15.html'
source_title="HOMILIES ON NUMBERS 15.4"
