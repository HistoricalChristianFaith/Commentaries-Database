[[commentary]]
quote='''
From a single beginning come many differences and varieties in creation. All these are now being recalled once again, synoptically in this text. They are now being viewed in relation to God's goodness made known through the obedience of Christ. They are being drawn into a unity by the Holy Spirit. Everything is moving toward a common end, which corresponds to the goodness of the beginning. This means all those "in heaven and earth and the lower regions," who, "bowing the knee at the name of Jesus," have declared through this very act the tokens of their subjection. In these three appellations the whole universe is indicated. All things issue from one origin. They have been driven by their own motions in diverse ways. They are to be allotted different levels of blessedness in accord with their own willing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25201.html'
source_title="ON FIRST PRINCIPLES 1.6.2"


[[commentary]]
quote='''
We should not understand this carnally, so as to suppose that even the heavenly bodies, which he says bend their knees, do this with fleshly limbs.… What spirit has knees? But the bending of the knees indicates that all is in subjection and observes the worship of God.
'''
source_url='https://www.google.com/books/edition/Commentary_on_the_Epistle_to_the_Romans/3E9VjfiXWz0C?hl=en&gbpv=0'
source_title="COMMENTARY ON ROMANS 9.41"


[[commentary]]
quote='''
The bowing of the knees is a symbol of another kneeling, which comes about in submitting oneself to God and in having fallen down before him. For it is by this reasoning that the Apostle too says "that in the name of Jesus every knee should bow, of things in heaven and things on earth and things under the earth", and we say that the heavenly beings do not altogether have bodies furnished with knees, and likewise too the beings under the earth, and in addition to these, neither do the souls that have been released from this body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Ephesians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON EPHESIANS FRAGMENT XV"
