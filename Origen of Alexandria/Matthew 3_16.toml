[[commentary]]
quote='''
Christ was baptized for our sake, in order to sanctify the waters. The Spirit descended in the form of a dove, since wherever there is reconciliation with God there is a dove, as in the case of Noah's ark … announcing God's mercy to the world and at the same time making clear that what is spiritual should be meek and without wickedness, simple and without guile.
'''
source_url=''
source_title="FRAGMENT 56.30"

[[commentary]]
quote='''
The dove denotes the Holy Spirit. But when the great and more hidden mysteries are in question, and the things that many people cannot grasp, then the Holy Spirit is represented under the appellation of a turtle-dove—of the bird, that is to say, that always dwells on mountain ridges and in the tops of trees. But in the valleys, in the things that all men understand, He figures as a dove.

Finally, because the Saviour deigned to assume human nature and came to earth, and because there were many sinners then in the Jordan area, the Holy Spirit does not take the form of a turtle-dove, but becomes a dove, and dwells as the tamer bird among us for the sake of the multitude of men. But He appears as the turtle-dove, for instance, to Moses, and to one of the prophets (it does not matter which), when they retire to the mountains and deserts and there receive the oracles of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
