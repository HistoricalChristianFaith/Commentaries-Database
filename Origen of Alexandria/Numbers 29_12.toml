[[commentary]]
quote='''
But now let us see what is the last feast day of God, on which God rejoices in man. "Tabernacles," He says. He rejoices, then, over you when He sees you dwelling in this world in tents, when He sees you not having your mind and purpose fixed and founded upon the earth, nor desiring the things that are earthly, nor reckoning the shadow of this life as your own perpetual possession, but as though set in transit and hastening to that true fatherland of paradise, whence you came forth, and saying: "I am a sojourner and a pilgrim, as all my fathers." For the fathers too dwelt in tents, and Abraham dwelt in little huts, that is, in tents, with Isaac and Jacob, coheirs of the same promise. When, therefore, you have been a sojourner and a pilgrim on the earth, and your mind is not fixed and rooted in the desires of earthly things, but you are ready to pass over quickly and ready to stretch yourself always to the things that are before, until you arrive at the land flowing with milk and honey and receive the inheritance of things to come — if, I say, God sees you set in these things, He rejoices in you and will keep a feast day over you. These things indeed in the present; but as for the future, if you wish to consider how the feast days are kept there, lift up your senses a little, if you can, from the earth, and forget for a while these things that are held before your face. Describe to yourself how heaven and earth pass away, and how all this fashion of the world passes away, and a new heaven and a new earth is founded. Remove from your sight even the light of this sun, and give to that world which is to come a sevenfold light of this sun; nay rather, according to the authority of Scripture, give to it the Lord Himself as its light. Set the angels of glory standing by, set the virtues, powers, thrones, dominions, and every name of the most illustrious and heavenly powers, not only that which is named in the present age but also that which is named in the age to come. Among all these, consider and conjecture how the feast days of the Lord may be kept, what festivity there is there, what joys, what magnitude of gladness. For concerning those spiritual festivals of which we spoke above, even though they are great and true, especially when they are kept spiritually in the soul, yet they are in part, not in whole; for just as the Apostle said: "We know in part and we prophesy in part," so it follows that we keep a feast day in part. But that you may know that this is so, let us return to that very discourse of Paul which he set forth about feast days and new moons, and see how observantly he said: "Let no one therefore," he says, "judge you in food or in drink or in respect of a part of a feast day." Attend, therefore, more diligently how he did not say "on a feast day" but "in respect of a part of a feast day." For in part and not in whole do we, set in this world, celebrate the feast day; for we are interrupted, even against our will, by the burden of the flesh, we are beaten by its concupiscences, and are bored through by cares and anxieties. For "the corruptible body," as the most wise man says, "weighs down the soul and depresses the mind that ponders many things." In part, therefore, in this world do the saints keep the feast day, because in part they know and in part they prophesy. But when the things that are perfect shall have come, those things which are in part shall be destroyed. For just as this which is in part gives way to perfect knowledge, and this which is in part gives way to perfect prophecy, so also this festival which is in part gives way to the perfect festival. For neither can this world receive that which is perfect, where, as we have said, the necessity of the body now suggests food, now drink, now sleep, now also stirs up as much anxiety of the present life as is necessary; all of which without doubt interrupt the continuation of the festival of God. But when that shall have come which was said concerning those who shall be restored into the holy places — if indeed we too may be counted worthy to be among those who are to be restored, who shall neither hunger nor thirst nor slumber nor labor, but shall be ever-wakeful, as the life of the angels is said to be ever-wakeful — when they shall be counted worthy to be restored into that order, then there will be a true and incorrupt festival, of which festival the prince and bridegroom and lord will be Jesus Christ Himself, our Savior, to whom is glory and dominion unto ages of ages. Amen!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily23.html'
source_title="HOMILIES ON NUMBERS 23.11"
