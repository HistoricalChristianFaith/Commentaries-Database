[[commentary]]
quote='''
Now the beginning of the second chapter, which was read, is this: "A throne of glory exalted from the beginning is our place, our sanctification, our support, the support of Israel. O Lord, let all who have forsaken you be put to shame; departing, let them be written upon the earth, because they have forsaken the Lord, the fountain of life." The blessed prophet Isaiah said, seeing the Lord and his kingdom: "I saw the Lord of Sabaoth sitting upon a throne lofty and lifted up." Jeremiah too saw how God reigns, on account of which, glorifying him, he says: "A throne of glory exalted from the beginning is our place, our sanctification." Whether you should wish to understand these words of Christ, you will not err, or of the Father, you will not think impiously: for the Savior is a lofty throne of glory and is from the beginning. "A throne of glory," because of which his kingdom is exalted; "our sanctification." [Our sanctification] is Christ; for "both he who sanctifies and those who are sanctified are all from one."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily17.html'
source_title="HOMILIES ON JEREMIAH 17"
