[[commentary]]
quote='''
The scripture marvels that the queen of Sheba came "from the ends of the earth, to hear the wisdom of Solomon"; and she, when she had seen the banquet and the furnishing and the ministries of his house, was astonished and was wholly in wonder. If we do not gladly embrace such great riches of our Lord, such furnishing of the word and abundance of teachings, if we do not eat the "bread of life", if we do not feed on the flesh of Jesus and drink his blood, if we despise the feasts of our Savior, we ought to know that God has both "kindness and severity"; and of these we ought rather to pray for his kindness, in Christ Jesus our Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily38.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 38"
