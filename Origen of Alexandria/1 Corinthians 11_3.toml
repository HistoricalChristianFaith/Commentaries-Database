[[commentary]]
quote='''
But the eyes of the wise man, of which it is said that they are enlightened by the commandments of God, are in his head, in Christ, because "the head of the man is Christ," says the Apostle. The capacity to think proceeds from Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"


[[commentary]]
quote='''
"He shall not" it says "take the mitre from his head". We have already said before that the "mitre" is a kind of covering which, set upon the head, affords adornment to the high priest. This "great high priest" of mine therefore never lays aside the adornment of his sacred head. But what the "head of Christ" is, learn from the Apostle, who says: "but the head of Christ is God". Rightly therefore he never lays aside this adornment of his head, which is "God", because "the Father is" always "in the Son, as the Son" is always "in the Father".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily12.html'
source_title="HOMILIES ON LEVITICUS 12"
