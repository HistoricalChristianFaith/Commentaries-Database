[[commentary]]
quote='''
But the eyes of the wise man, of which it is said that they are enlightened by the commandments of God, are in his head, in Christ, because "the head of the man is Christ," says the Apostle. The capacity to think proceeds from Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
