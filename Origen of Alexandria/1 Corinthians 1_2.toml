[[commentary]]
quote='''
Why did Paul write "to those called to be saints" as well as to those who are already "sanctified" and in the church? Surely this means that the letter is addressed not only to those who are already cleansed from their sins but also to those who still await cleansing, though they are among those whom God has called.
'''
source_url=''
source_title="COMMENTARY ON 1 CORINTHIANS 1.1.7"

[[commentary]]
quote='''
For just as not only fornication but also second marriages exclude a man from ecclesiastical dignities — for neither a bishop nor a presbyter nor a deacon nor a widow can be twice-married — so perhaps the twice-married man will also be cast out from the assembly of the "firstborn and undefiled", the "Church, which has no spot or wrinkle"; not that he is sent into the eternal fire, but that he has no part in the kingdom of God. I recall that, when I was interpreting that which is written to the Corinthians: "to the church of God which is at Corinth, with all who call upon him", I said that there is a distinction between the "church" and those "who call upon" the name of the Lord. For I think that the man of one marriage and the virgin and he who perseveres in chastity belong to the church of God, but that he who is twice-married, although he may have had a good manner of life and abound in the other virtues, nevertheless does not belong to the "church" and to that number which "has no wrinkle or spot, or any such thing", but belongs to a second rank and to those "who call upon" the name of the Lord, and who are indeed saved in the name of Jesus Christ, yet are by no means crowned by him: to whom be glory and dominion for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily17.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 17"
