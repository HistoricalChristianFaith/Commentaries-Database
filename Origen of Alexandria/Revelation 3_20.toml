[[commentary]]
quote='''
Our sweet works, our words most pleasant and useful, are "honey" which "Emmanuel eats," which this one "eats" who was born of the "virgin." But if our words are full of bitterness — anger, animosity, sadness, filthy speech, vices, contention — they have put gall in my mouth, and the Savior does not "eat" of these words. But the Savior "will eat" of the words that are among men, if their words are "honey." Let us confirm this from the scriptures. "Behold, I have stood before the door and I knock; if anyone opens the door to me, I will come in to him and sup with him, and he with me." Therefore he himself promises that he "will sup with us" from our own things. And it is certain that we too "sup with" him, if we "sup upon him." For "eating" of our good words, works, and understanding, he feeds us again with his own spiritual and divine and better foods. Therefore, since it is a blessed thing to receive the Savior, let us, with the doors of the ruling part of our heart opened, prepare for him "honey" and all his supper, that he himself may lead us to the great supper of the Father in the kingdom of heaven, which is in Christ Jesus, "to whom is glory and dominion unto the ages of ages. Amen!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily02.html'
source_title="HOMILIES ON ISAIAH 2"
