[[commentary]]
quote='''
All the blessings which Jesus pronounced in His Gospel He confirms by His own example, as having declared, Blessed are the meek; He afterwards sanctions it by saying, Learn of me, for I am meek; and because He had said, Blessed are they that weep, He Himself also wept over the city.

I do not deny then that the former Jerusalem was destroyed because of the wickedness of its inhabitants, but I ask whether the weeping might not perhaps concern this your spiritual Jerusalem. For if a man has sinned after receiving the mysteries of truth, he will be wept over. Moreover, no Gentile is wept over, but he only who was of Jerusalem, and has ceased to be.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
When our Lord and Savior had drawn near to Jerusalem, seeing it he wept and said: "if you too had known, even in this your day, the things that are for your peace; but now they are hidden from your eyes: for the days shall come upon you, and your enemies shall surround you with a rampart". What is said here are mysteries, and we hope, if God opens them, that what lies hidden can be laid open. First, then, we must consider his weeping. All the beatitudes that Jesus spoke in the Gospel he confirms by his own example, and what he taught he proves by his own testimony. "Blessed", he says, "are the meek". Like to this is what he says of himself: "Learn from me", he says, "for I am meek". "Blessed are the peacemakers". And who else is so much a peacemaker as my Lord Jesus, who "is our peace", who "loosed the enmity" and "destroyed it in his own flesh"? "Blessed are they who suffer persecution for righteousness' sake". No one so suffered persecution for righteousness' sake as the Lord Jesus, who was crucified for our sins. All the beatitudes, therefore, the Lord shows forth in himself; and to this likeness belongs also that which he had said: "blessed are they that weep" — he himself wept, that he might lay the foundations of this beatitude too.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily38.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 38"
