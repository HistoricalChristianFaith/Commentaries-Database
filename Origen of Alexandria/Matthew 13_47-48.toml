[[commentary]]
quote='''
I will give you our very Lord and Savior Jesus Christ as witness and author of these things, how fishes are said to be men. "The kingdom of heaven is like", he says, "to a net cast into the sea, which gathers of every kind of fish; and when it has been filled, sitting upon the shore they store up those which are good in vessels; but those which are bad they cast forth". He plainly taught that those "fishes" which are said to be "gathered by the nets" are either "good" men or "bad". These, then, are they who according to Moses are named fishes either clean or unclean.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
