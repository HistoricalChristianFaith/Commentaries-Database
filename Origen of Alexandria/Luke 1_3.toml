[[commentary]]
quote='''
St. Luke hereby explains to us the source of his writing; seeing that what things he wrote, he gained not from report, but had himself traced them up from the beginning. Hence it follows, It seemed good to me also, having carefully investigated every thing from the very first, to write to thee in order, most excellent Theophilus.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"It seemed good to me also, having followed from the beginning". He impresses and repeats that the things he is about to write he had not come to know by rumor, but that he himself had followed them from the beginning. Whence he is also deservedly commended by the apostle Paul, who says: "whose praise is in the gospel throughout all the churches". For this is said of no one else, but is handed down as said of Luke. "It seemed good to me also, having followed from the beginning, to write all things diligently in order to you, most excellent Theophilus". Someone may suppose that he wrote the gospel to a certain Theophilus. All of you who hear us speaking, if you are such that you are loved by God, you too are "theophili" (lovers/beloved of God), and to you the gospel is written. If anyone is "theophilus", he is both most excellent and most strong, for this is what is more significantly expressed in the Greek word: "κράτιστος" (most excellent). No "theophilus" is weak. And just as it is written of the people of Israel, when it was going out of Egypt, that "there was not among their tribes one that was weak": so I will boldly say that everyone who is "theophilus" is robust, having strength and vigor both from God and from his word, so that he may be able to know the truth of those words in which he has been instructed, understanding the word of the gospel in Christ: to whom be glory and dominion for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily01.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 1"
