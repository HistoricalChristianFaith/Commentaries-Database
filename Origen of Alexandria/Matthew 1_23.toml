[[commentary]]
quote='''
"Therefore the Lord himself will give you a sign: behold, a virgin shall conceive in her womb and bear a son, and you shall call his name Emmanuel." The true text of the copies of this prophet says: "you shall call." Moreover in Matthew we know it is read: "and they shall call his name Emmanuel." We cannot say that we ought to make anything less of the prophet. But how does the Gospel have this reading? Whether it was by someone who did not understand and ran to the easier course, as has happened also in many other places, or whether perhaps someone might say that the Gospel was published so from the beginning? Let him who wishes deliberate. The prophet indeed manifestly has: "and you shall call his name Emmanuel." I have known a certain man who, reading at the opening of the scriptures of the Gospel, "and you shall call his name Emmanuel," said within himself: 'What is "you shall call"? Who "shall call"? "Ahaz"; and how can "Ahaz" hear concerning the Savior, who came after many generations: "you shall call his name Emmanuel"?' and so, in place of what is, "you shall call," he wrote: "they shall call." But see that it is not to "Ahaz" that it is said: "and you shall call his name Emmanuel," but to the "house of David"; see that it is manifestly said: "Hear now, O house of David: is it a small thing for you to offer a contest to men, and how do you offer a contest to the Lord? Therefore the Lord himself will give you a sign: behold, a virgin shall conceive in her womb and bear a son, and you shall call his name Emmanuel." If, therefore, at any time we do not understand what has been said, let us make nothing less of it nor run to the easier course, but let us wait for the grace of God to supply to us, through the illumination of knowledge, the explanation of the question. What, then, is the "house of David"? If "David" is Christ, as I have often proved, the "house of David" is we, the Church of God; and it is prophesied that, if anyone is of the "house of David," he "shall call his name Emmanuel"; for at the coming of Christ our Church alone says of Christ: "God with us."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily02.html'
source_title="HOMILIES ON ISAIAH 2"
