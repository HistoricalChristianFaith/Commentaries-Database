[[commentary]]
quote='''
Hear also elsewhere how God plants. The prophet says: "You transferred a vine out of Egypt, you cast out the nations and planted it. You made a way passable before it, you planted its roots, and it filled the earth. Its shadow covered the mountains, and its branches the cedars of God." Do you now notice how God plants and where he plants? He does not plant in the valleys, but on the mountains, in high and lofty places. For those whom he leads out of Egypt, whom he brings from the world to faith, he does not will to place again in lowly places, but he wills their manner of life to be lofty. He wills us to dwell on the mountains; but even on these very mountains nonetheless he does not will us to creep along the ground, nor does he will his vine to have its fruits cast down further upon the ground, but he wills its shoots to be led upward, to be set on high, to become layered branches — and layered branches not upon any lowly trees whatever, but upon the high and loftiest cedars of God. "The cedars of God" I take to be the prophets and the Apostles, to whom if we, the vine which God "transferred out of Egypt," be joined, and through their branches our shoots be spread abroad, and, resting upon them, we become as it were certain layered branches bound together by mutual bonds of charity, we shall without doubt bring forth very much fruit. For "every tree that does not bear fruit shall be cut down and cast into the fire."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily06.html'
source_title="HOMILIES ON EXODUS 6"
