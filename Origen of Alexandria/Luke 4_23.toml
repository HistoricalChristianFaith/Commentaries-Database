[[commentary]]
quote='''
As far as Luke's account is concerned, Jesus had not yet stayed in Capernaum, nor is he described as having done any sign there — indeed, in a place where he had not been. But before he came to Capernaum, it is signified that he had been in his own homeland, that is, in Nazareth, and he speaks to his fellow citizens: "You will surely say to me this parable: Physician, heal yourself. Whatever we have heard done in Capernaum, do here also in your own homeland". From this I think that something of a mystery lies hidden in the present passage, and that Nazareth went before as a type of the Jews, Capernaum as a type of the Gentiles. And so Jesus, knowing that he would have no honor in his own homeland — neither he himself, nor the prophets, nor the apostles — was unwilling to preach there, but preached among the Gentiles, lest it be said to him by the men of his own homeland: "You will surely say to me this parable: Physician, heal yourself". For there will be a time when the people of the Jews will say: "Whatever we have heard done in Capernaum" — the signs and portents among the Gentiles — "do also among us in your own homeland"; what you have shown to the whole world, show to us also; preach your word to your people Israel, that at least, "when the fullness of the Gentiles has come in, then all Israel may be saved".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily33.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 33"
