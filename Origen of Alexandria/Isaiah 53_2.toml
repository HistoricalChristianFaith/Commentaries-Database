[[commentary]]
quote='''
There are, indeed, admitted to be recorded some statements respecting the body of Jesus having been "ill-favored"; not, however, "ignoble," as has been stated, nor is there any certain evidence that he was "little."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FAgainst%2520Celsus%2FBook%25206.html'
source_title="AGAINST CELSUS 6:75"

[[commentary]]
quote='''
It is possible also in another way to see a twofold coming of Christ, that is, the coming of the Word into the soul. First indeed the untrained and those then beginning to know Christ, because they cannot see the brightness of his beauty, say: "we saw him, and he had no form nor comeliness, but his appearance was without honor". Now the unhonored appearance of the Word is the foolish preaching about Christ, when we preach Christ born and crucified. But the second coming is the coming of Christ among perfect men, concerning whom the steward of his word says: "but we speak wisdom among the perfect". And these perfect ones have become lovers of his beauty and beseech the Word, that he gird upon himself his rational sword and set it about the mystery of the fleshly nativity, which is called mystically the thigh. For disciples of this kind praise the beauty and comeliness of the Word, and to this second coming is joined the consummation of the age in the man coming to perfection and saying: "but far be it from me to glory, save in the cross of our Lord Jesus Christ, through whom the world is crucified to me and I to the world".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252024.html'
source_title="COMMENTARY ON MATTHEW 32"
