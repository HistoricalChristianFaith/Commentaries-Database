[[commentary]]
quote='''
If any then sells, let him be cast out, and especially if he sells doves. For of those things which have been revealed and committed to me by the Holy Spirit, I either sell for money to the people, or do not teach without hire, what else do I but sell a dove, that is, the Holy Spirit?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
After this it is said: "he entered into the temple", and, when he had entered, "he cast out those who were selling doves". He did not cast out those who buy; for he who buys, possesses what he has bought. Those Jesus cast out of his Father's temple who sell and throw away what they had, after the likeness of that prodigal son who received his substance from his father and lost it all in excessive drinking. If, therefore, anyone sells, he is cast out, especially if he was selling "doves". Why did he name no other birds but doves? This animal is simple and comely. I fear lest this same fault be found in us also. For if the things that have been revealed and entrusted to me by the Holy Spirit, that I might bring them forth to the multitude, I should sell for a price and not teach without wage, what else do I do but sell doves, that is, the Holy Spirit? And when I have sold him, I am cast out of the temple of God. Wherefore let us ask the Lord that we may all rather buy than sell. For if we do not sell, we shall know and understand our salvation; otherwise the enemies will surround our city. And if once the hostile army has encircled us, we shall not deserve the tears of the Lord. Let us therefore rise up at dawn and beseech God that we may at least be able to eat the crumbs that fall from his table. The scripture marvels that the queen of Sheba came "from the ends of the earth, to hear the wisdom of Solomon"; and she, when she had seen the banquet and the furnishing and the ministries of his house, was astonished and was wholly in wonder. If we do not gladly embrace such great riches of our Lord, such furnishing of the word and abundance of teachings, if we do not eat the "bread of life", if we do not feed on the flesh of Jesus and drink his blood, if we despise the feasts of our Savior, we ought to know that God has both "kindness and severity"; and of these we ought rather to pray for his kindness, in Christ Jesus our Lord: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily38.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 38"
