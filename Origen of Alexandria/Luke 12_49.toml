[[commentary]]
quote='''
According to which sense our Lord and Savior too, since he is "spirit", "came to send fire upon the earth"; "spirit" according to that which is written: "but when you have turned to the Lord, the veil shall be taken away", and: "the Lord is a spirit". But "he came to send fire" not upon heaven, but "upon the earth", as he himself shows when he says: "I came to send fire upon the earth, and what do I wish but that it already blaze?" For if "you have turned to the Lord", who is "spirit", Christ will be "spirit" to you and "he did not come to send fire upon the earth". But if you are not turned to him, but have earth and its fruits, "he came to send fire upon" your "earth".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily26.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 26"
