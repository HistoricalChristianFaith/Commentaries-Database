[[commentary]]
quote='''
since indeed through it the Church seems to be joined to Christ and to have been able to receive a share of the Word of God, according to which he is called the mediator of God and men, and according to which the Apostle says: "For in him we have access through faith into the hope of the glory of God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FBook%25203.html'
source_title="COMMENTARY ON THE SONG OF SONGS, BOOK 3"
