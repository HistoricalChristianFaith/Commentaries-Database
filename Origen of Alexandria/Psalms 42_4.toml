[[commentary]]
quote='''
Let us therefore see whether some also of the ancient saints did not hold an opinion of the tabernacle far other than these men now reckon. For hear how magnificently David, that surpassing one among the prophets, thinks concerning the tabernacle: "While it is said" he says "to me every day: Where is thy God? these things have I remembered, and I have poured out my soul within me, for I shall enter into the place of the wonderful tabernacle, even unto the house of God". What then is this "place of the wonderful tabernacle", from which one comes "even unto the house of God", whereof, because he was made mindful, his soul was poured out within him and he was as it were dissolved by some intolerable longing? Is it then finally to be believed that this tabernacle, which was made up of skins and curtains and coverings of goats' hair and other materials of our use, the prophet, longing for it, was poured out in soul and collapsed with his whole mind?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily09.html'
source_title="HOMILIES ON EXODUS 9"
