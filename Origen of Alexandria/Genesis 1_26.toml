[[commentary]]
quote='''
In recording the first creation of man, Moses before all others says, "And God said, Let us make man in our own image and likeness." Then he adds afterwards, "And God made man; in the image of God made he him; male and female made he them, and he blessed them." Now the fact that he said "he made him in the image of God" and was silent about the likeness points to nothing else but this, that man received the honor of God's image in his first creation, whereas the perfection of God's likeness was reserved for him at the consummation. The purpose of this was that man should acquire it for himself by his own earnest efforts to imitate God, so that while the possibility of attaining perfection was given to him in the beginning through the honor of the "image," he should in the end through the accomplishment of these works obtain for himself the perfect "likeness."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25203.html'
source_title="ON FIRST PRINCIPLES 3.6.1"


[[commentary]]
quote='''
"And God said: Let us make man according to our image and likeness, and let him hold rule over the fish of the sea and the birds of heaven and the animals and all the earth and all the things that creep upon the earth." Consequently, according to the things which we explained above, he wills such a man as we have described to hold rule over the aforesaid beasts and birds and creeping things and four-footed things and all the rest. How these ought to be understood through allegory we have explained, when we said that the water, that is, his mind, is commanded to bring forth the spiritual sense and the earth to bring forth the sense of the flesh, so that the mind may rule over them and they may not rule over it. For God wills that this great "handiwork" of God, man, for whose sake also the whole world was created, be not only unstained by those things which we spoke of above, and immune from them, but also that he rule over them. But now let us consider from the very words of Scripture what kind of animal man is. All the other creatures come to be by the command of God, as Scripture says: "And God said: Let there be a firmament," "And God said: Let the water which is below heaven be gathered into one gathering, and let the dry land appear," "And God said: Let the earth bring forth the grass of hay." So also in the rest he speaks. But let us see which are the things that God himself made, and through these let us observe how great the greatness of man is. "In the beginning God made heaven and earth." Similarly he says: "And he made two great luminaries," and now again: "Let us make man." In these alone the handiwork of God himself is ascribed, but in no others; but only heaven and earth, sun and moon and stars, and now man were made by God, but all the rest are said to have been made by his command. From this, then, consider how great is the greatness of man, who is made equal to such great and such preeminent elements, who has the honor of heaven, on account of which "the kingdom of heaven" too is promised to him. He has also the honor of earth, since indeed he hopes to enter into the good land and "the land of the living flowing with milk and honey." He has the honor of the sun and moon, having the promise that he will shine "like the sun in the kingdom of God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.12"


[[commentary]]
quote='''
When man was created, this was originally man created after the image. In him there was nothing material. He who is after the image is not from matter. And God said: "Let us make man after Our image and after Our likeness, and let them have dominion..." and so forth. … That which is created after the image of God is understood as immaterial and surpassing every corporeal substance not only by Moses, but also by the Apostle, as is clear from the following words: "...having put on the new man, who is renewed unto knowledge after the image of Him who created him."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
