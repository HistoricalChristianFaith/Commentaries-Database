[[commentary]]
quote='''
After these things Moses spoke to the people, saying: "Arm men of yourselves and make war against Midian, to render vengeance from the Lord upon Midian; a thousand from a tribe and a thousand from a tribe; from all the tribes of Israel send men to make war." Attend to the reading; for the mind must be directed not only to the hearing of words, but to the consideration of the realities. Recall the things past, hear the things present, mark the things that follow. Compare the earlier things with the later, and contemplate the magnificence of the divine powers. The sons of Israel some time ago had been six hundred thousand armed men who had gone forth against Midian, and all these were conquered, because sin was in them. But now the Midianites, the victors, who had put to flight six hundred thousand, are conquered by twelve thousand, that you may know that Israel conquers not in a multitude nor in the number of soldiers, but there is righteousness and piety in those who conquer. Therefore, finally, it is also said in their blessings that, if they keep the law of the Lord, one of them shall pursue a thousand and two shall put ten thousand to flight. You see, then, that one holy man praying avails much more than innumerable sinners doing battle. The prayer of a holy man penetrates heaven: how should it not also conquer the enemy on earth? And therefore we must strive in every way to seek first and to keep the righteousness of God. And if you obtain and keep it, it will subject all your enemies to you; if you are clothed, as the Apostle says, in the breastplate of righteousness and girded with truth, if you have taken the helmet of salvation and the sword of the spirit and above all the shield of faith, in which you can quench all the fiery darts of the evil one. For, equipped with such arms, you will put to flight all the camps of the devil and all his army, and with confidence you will sing: "If camps stand against me, my heart shall not fear; if battle rise up against me, in this will I hope."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily25.html'
source_title="HOMILIES ON NUMBERS 25.2"
