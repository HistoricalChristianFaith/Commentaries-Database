[[commentary]]
quote='''
But that "contrition" and "a sore of pain through chastisement" are imposed on the soul for the sake of cure, Jeremiah teaches, saying: "Thus said the Lord: I have raised up contrition, thy sore is with pain, there is none that judges thy judgment, thou art cured with pain, there is no profit in thee. All thy friends have forgotten thee, nor will they now inquire concerning thee; because I have smitten thee with the wound of an enemy, with strong chastisement, for all thy iniquity, since thy sins are multiplied. Why criest thou out over thy contrition? Thy pain is violent, because of the multitude of thy iniquities thy sins have prevailed and have done these things to thee. Therefore all who devour thee shall be devoured, and all thine enemies shall devour their own flesh; and those who afflicted thee shall be in affliction, and all who devastated thee I will give over to plunder; for I will recall thy health, and from the pain of thy wound I will recall thee, said the Lord."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily08.html'
source_title="HOMILIES ON LEVITICUS 8"
