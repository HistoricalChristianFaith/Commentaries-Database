[[commentary]]
quote='''
"For there dwells not in me, that is, in my flesh, what is good." For Christ does not yet dwell in him, nor is his body the temple of God. Yet nevertheless he whose person is set forth here is not altogether a stranger to good things, but in purpose indeed and in will he has begun to seek the good, though he is not yet able to attain the good in deeds and works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
