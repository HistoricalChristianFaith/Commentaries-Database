[[commentary]]
quote='''
But meanwhile let us see the greatness of Moses. About to depart from the world, he prays to God that he provide a leader for the people. What are you doing, O Moses? Have you not sons, Gershom and Eleazar? Or if you doubt anything about them, are there not the sons of your brother, a great and excellent man? Why do you not pray to God for them, that he may set them as leaders over the people? But let the princes of the churches learn to mark out for themselves as successors not those who are joined by blood-kinship, nor those who are allied by nearness of flesh, by testament, nor to hand down the headship of the church as an inheritance, but to refer it to the judgment of God, and not to choose him whom human affection commends, but to leave the whole matter of the successor's election to the judgment of God. Could not Moses have chosen a prince for the people, and chosen him by true judgment and by right and just verdict — Moses, to whom God had said: choose elders for the people, whom you yourself know to be elders, and he chose such men in whom the Spirit of God straightway rested, and they all prophesied? Who then could so choose a prince of the people as Moses could? But he does not do this, he does not choose, he does not dare. Why does he not dare? Lest he leave to posterity an example of presumption. But listen to what he says: let the Lord God of spirits and of all flesh provide, he says, a man over this congregation, who may go out before their face and who may go in, and who may lead them out and who may bring them back. If then so great and such a man as Moses does not entrust to his own judgment the choosing of a prince of the people, the appointing of a successor, who will there be who would dare — whether from the common people, who, often stirred by clamors to favor or perhaps to a price, are wont to be moved, or even from the priests themselves, who will there be who would judge himself fit for this — unless it be revealed by the Lord to one who prays and asks? As also God says to Moses: take to yourself Joshua the son of Nun, a man who has the Spirit of God in himself, and you shall lay your hands upon him; and you shall set him before Eleazar the priest, and give him commands in the sight of the whole congregation, and give charge concerning him before them; and you shall put your glory upon him, that the children of Israel may hear him. You hear the ordination of a prince of the people so plainly described that it scarcely needs exposition. Here there is no acclamation of the people, no reckoning of blood-kinship, no consideration of nearness of relation. To the near kinsmen let the inheritance of fields and estates be left; let the governance of the people be handed over to him whom God has chosen — namely, to such a man who has, as you have heard written, the Spirit of God in himself and the precepts of God are before his eyes, and who is well known and familiar to Moses — that is, in whom there is the brightness of the law and knowledge — that the children of Israel may be able to hear him. But since all things are filled with mysteries, we cannot omit the things that are more precious, even if these things which are commanded according to the letter seem necessary and useful. Let us consider, then, what is the death of Moses: the end, without doubt, of the law, but of that law which is spoken according to the letter. But what is its end? The interruption, namely, of the sacrifices and of the other things which are commanded with like observance in the law. When these things, then, receive their end, Jesus takes up the headship: for the end of the law is Christ unto righteousness to everyone who believes. And as it was said of those of old that: all were baptized into Moses in the cloud and in the sea, so let it also be said of Jesus that: all were baptized into Jesus in the Holy Spirit and water. For it is Jesus who crosses the waters of the Jordan, and in them, in a certain manner, even then baptizes the people; and it is he who divides the land of inheritance, the holy land, among all — not to the former people, but to the second; for the former people, on account of its transgression, fell in the desert. Of the times of Joshua it is said that: the land rested from wars, which could not be said of the time of Moses. But this is said of my Lord Jesus, not of that son of Nun. And would that my land might cease from wars! And it could cease, if I served faithfully as a soldier under Jesus my prince. For if I obey my Lord Jesus, my flesh will never rise up against my spirit, nor will my land be assailed by hostile nations — that is, by the various lusts — provoked against it. Let us pray, therefore, that Jesus may reign over us and that our land may cease from wars, may cease from the assaults of carnal desires; and when these things have ceased, then each one will rest under his own vine and under his own fig tree and under his own olive tree. For under the covering of the Father and of the Son and of the Holy Spirit will the soul rest which has recovered within itself the peace of flesh and spirit. To him, the eternal God, be glory unto the ages of ages. Amen
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily22.html'
source_title="HOMILIES ON NUMBERS 22.4"
