[[commentary]]
quote='''
And why these things were so spoken, he teaches: "That according to election," he says, "the purpose of God might stand, it was said not of works, but of him that calleth"; that is, that not those who are children of the flesh, but those who are children of God, these should be reckoned for the seed. For just as there, out of many children of the flesh, Isaac is chosen by God to be adopted into a son of God, so also here, out of two, the younger, Jacob, is chosen, to be adopted into a son of God; and thus it becomes true that the promises of God stand firm not in the children of the flesh, but in the children of God. But all these things look to this, that the Apostle may prove this: that if either Isaac or Jacob had been chosen by God for those merits which they had acquired while placed in the flesh, and had deserved to be justified through the works of the flesh, then surely the grace of their merit could pertain also to a posterity of flesh and blood. But as it is, since their election was made not from works, but from the purpose of God, and from the free decision of him who calls, the grace of the promises is fulfilled not in the children of the flesh, but in the children of God — that is, in those who, like them, are chosen from the purpose of God, and adopted into sons. For in these also is fulfilled that which we have already expounded above, that "whom he foreknew, them he also predestined; and whom he predestined, them he also called; and whom he called, them he also justified; and whom he justified, them he also glorified." And whatever we have expounded above concerning these words, the same suffices fully and abundantly for the explanation of the present passage also, lest by repeating the same things we should beget weariness in our readers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
