[[commentary]]
quote='''
How beautiful, how fitting it is to receive a wound from Love! One person receives the dart of fleshly love, another is wounded by earthly desire; but do you lay bare your members and offer yourself to the chosen dart, the lovely dart; for God is the archer indeed. Hear what the Scripture says of this same dart; or rather, that you may marvel even more, hear what the dart Himself says: He hath made me as a chosen arrow, and in His quiver He hath kept me. And He said to me: ‘It is a great thing for Thee to be called my servant.’ Understand what the arrow says and in what manner He is chosen by the Lord. How blessed is it to be wounded by this dart!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
