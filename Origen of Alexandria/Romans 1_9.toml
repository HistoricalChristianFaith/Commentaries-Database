[[commentary]]
quote='''
God is a witness to his saints, because they too are witnesses of God, according to what the prophet says: "You shall be my witnesses, and I am a witness, says the Lord." But the Savior also says to the disciples: "You shall be my witnesses in Jerusalem, and in Samaria, and in all the ends of the earth", according to that which is written: "He who shall confess in me, I also will confess in him before my Father." But let us see what it is that he says, "whom I serve in my spirit." To serve in the spirit seems to me to be like — indeed, something even greater than — to worship in the spirit, as the Lord himself said to the Samaritan woman: "The hour comes, and now is, when the true worshippers shall worship the Father in spirit and in truth." But Paul not only worships in the spirit, but also devotedly serves in the spirit. For one can worship even without affection; but devoted service belongs to him whom affection binds fast. The Apostle therefore devotedly serves God, not in the body, nor in the soul, but in the better part of himself, that is, in the spirit. For he indicates that these three are in man when writing to the Thessalonians, when he says: "That your whole body, and soul, and spirit may be preserved in the day of our Lord Jesus Christ." And Daniel says: "Praise the Lord, you spirits and souls of the just." The Apostle therefore everywhere prefers the spirit, and rejects the flesh or the things which are of the flesh. Finally he praises the spirit of the law itself; but the letter he spurns as though it were flesh, when he says: "The letter kills, but the spirit gives life." And also when he says: "For in that wherein the law was weak through the flesh, God sending his own Son in the likeness of sinful flesh" — by the flesh of the law he means, without doubt, the letter of the law. For through the letter the law was made weak, so that it could not be fulfilled. For who could fulfill even what is written concerning the Sabbath: "You shall not move from your place on the day of the Sabbath" (for how could it come about that anyone should not move at all from his place on the day of the Sabbath?), or the laws concerning leprosy arising in the warp, or in a wall, or in a skin, and a thousand other things in which, according to the letter as according to the flesh, the law was made weak? For this reason therefore the Apostle says that the law is spiritual. He, then, who understands the law to be spiritual, this man serves God in the spirit. Whence he says elsewhere: "For if you live according to the flesh, you shall die" — that is, according to the letter which kills; "but if by the spirit you mortify the deeds of the flesh, you shall live." It must indeed be asked whether the ancient fathers also, the patriarchs or the prophets, who were themselves also perfect, are to be believed to have served God in the spirit; for Abraham too desired to see the day of the Lord, and saw it, and rejoiced; and Moses and Elijah appeared in glory speaking with Jesus on the mountain. In which it is shown that the Law and the Prophets are in harmony with the Gospels, and shine forth in the same glory of spiritual sight and understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook01.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
