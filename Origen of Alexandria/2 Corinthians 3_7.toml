[[commentary]]
quote='''
Now the Apostle, expounding these things with that magnificent understanding which he employs in the rest, of which he said: "but we have the mind of Christ," says: "for if the ministry of death, formed in letters upon stones, was in glory, so that the sons of Israel could not gaze upon the face of Moses because of the glory of his countenance, which is done away: how shall not the ministry of the spirit be rather in glory?" And again a little later he says: "and not as Moses put a veil over his face, that the sons of Israel might not gaze upon the face of his countenance. For their perceptions were dulled; for until this present day, when Moses is read, the veil is placed over their heart." Who would not marvel at the greatness of the mysteries? Who would not be filled with dread at the mark of the dulled heart? The face of Moses was glorified, but the sons of Israel could not "gaze upon the face of his countenance," the people of the synagogue could not "gaze" upon it. But if anyone can have a manner of life and a way of living more eminent than the rest of the common crowd, he is able to behold the glory of his countenance. For even now, as the Apostle says, "a veil is placed over the reading of the Old Testament," and even now Moses speaks with glorified countenance, but we cannot behold the glory that is in his countenance. And the reason we cannot is that we are still the common people and have no more of zeal, no more of merit, than the rest of the multitude. But since the holy Apostle says: "yet the same veil remains over the reading of the Old Testament," the pronouncement of so great and such an Apostle would cut off from us every hope of understanding, had he not added: "but when anyone shall have turned to the Lord, the veil shall be taken away." Therefore he says that the cause of the veil's removal is our turning to the Lord. From which we ought to gather these indications: that so long as, when we read the divine Scriptures, the understanding lies hidden from us, so long as the things that are written are obscure and closed to us, we have not yet turned to the Lord. For if we had turned to the Lord, without doubt the veil would be taken away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily12.html'
source_title="HOMILIES ON EXODUS 12"


[[commentary]]
quote='''
The Apostle briefly shows the reason why these things that are read to us can be understood or not understood, saying that from his eyes "the veil of the old testament can be taken away, whoever shall have turned to the Lord"; from which he wished it to be known that, the less these things are plain to us, the less is our conversion to God. And therefore we must strive with all our strength that, being free from the occupations of the world and from worldly affairs, and leaving behind even those superfluous tales of our companions, if it can be done, we may give our effort to the word of God and "meditate on his law day and night", so that, being converted with our whole heart, we may be able to behold the unveiled and open face of Moses, and especially in these things which have now been read, whether concerning the priestly vestments or concerning the consecration of the high priest, in which certain such things are said as to exclude entirely even that carnal Israel itself from the historical understanding; and therefore, in expounding these things, we must not rely on the powers of human genius, but on prayers and supplications poured out to God. In this we need also the help of you, that God, the Father of the Word, may grant us the word "for the opening of our mouth", so that we may be able to consider the wonders of his law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily06.html'
source_title="HOMILIES ON LEVITICUS 6"
