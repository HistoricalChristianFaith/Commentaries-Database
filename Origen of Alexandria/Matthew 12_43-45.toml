[[commentary]]
quote='''
How does he "deliver him to Satan"? He departs from his mind and turns himself away and flees from his evil thoughts and unworthy desires and leaves the "house" of his heart "empty". And then there shall be fulfilled in that man what is written: "but when the unclean spirit has gone out from a man, he goes about through dry places: and if he does not find rest, he returns to his own house; and finding it vacant and swept, he takes with him seven other spirits more wicked than himself, and entering he dwells in that house; and then the last state of that man becomes worse than the first". In this manner, then, it must be understood that God "delivers up" those whom he delivers, not that he himself delivers anyone, but from the fact that he forsakes the unworthy — those, namely, who do not so cultivate themselves and purge themselves from vices that God should gladly dwell in them. When he himself flees and turns away from a soul which is set in uncleanness and vices, it is said to be delivered up from the fact that it is found empty of God and is invaded by the wicked spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily02.html'
source_title="HOMILIES ON JUDGES 2"
