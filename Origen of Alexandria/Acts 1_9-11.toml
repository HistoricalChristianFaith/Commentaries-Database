[[commentary]]
quote='''
But you will understand still more of what the text speaks. Taking from the Acts, which reads thus: "and when he had said these things, while they beheld, he was lifted up, and a cloud received him from their eyes. And while they were gazing into heaven as he went, behold two men stood by in white garments, who also said: Men of Galilee, why do you stand looking into heaven? This Jesus, who has been received up from you into heaven, will so come in the manner in which you saw him going into heaven".

For if we believe these men, by whom a cloud is said to have received him and borne him up into heaven, how will he not, according to the text, come from heaven, just as his disciples saw him "going into heaven"? And in the Revelation John likewise says: "behold he will come with the clouds, and every eye will see him and whoever pierced him". But let him understand who can, whether it is the very same thing—for him to come upon the clouds of heaven and to come "with the clouds"—or whether the clouds upon which he will come are one thing, and those "with which" he will come another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252024.html'
source_title="COMMENTARY ON MATTHEW 50"
