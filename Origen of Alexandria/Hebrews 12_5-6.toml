[[commentary]]
quote='''
This "jealous God", then—if he requires and desires your soul to cleave to him, if he keeps you from sin, if he rebukes, if he chastises, if he is indignant, if he is angry and, as it were, uses a certain jealousy toward you—recognize that there is for you hope of salvation. But if, chastised, you do not come to your senses, if, rebuked, you are not amended, if, scourged, you despise it, know that, if you have so far advanced in sinning, his jealousy will depart from you, and that will be said to you which through the prophet Ezekiel is said to Jerusalem: "therefore my jealousy shall depart from you, and I will be angry over you no more". See the mercy and the loving-kindness of the good God. When he wishes to have mercy, he says that he is indignant and angry, as through Jeremiah he says: "with grief and with scourge you shall be chastised, Jerusalem, lest my soul depart from you". If you understand these things, it is the voice of a God who has mercy, where he is angry, where he is jealous, where he applies griefs and scourges. "For he scourges every son whom he receives".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
