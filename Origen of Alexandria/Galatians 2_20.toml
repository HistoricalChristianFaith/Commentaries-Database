[[commentary]]
quote='''
Since Christ was in Paul, who will doubt that he was also likewise in Peter and John and in every individual among the saints, and not only in those who are on earth but also in those in heaven? For it is absurd to say that Christ was in Peter and Paul but not in the archangel Michael or Gabriel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25204.html'
source_title="ON FIRST PRINCIPLES 4.4.29"


[[commentary]]
quote='''
For what does it profit you, if Christ once came in the flesh, unless he has also come to your soul? Let us pray that his coming may be made to us daily, and that we may be able to say: "But I live, now not I, but Christ lives in me". For if Christ lives in Paul and does not live in me, what will it profit me? But when he has come also to me and I have had enjoyment of him, just as Paul had enjoyment of him, then I too shall speak like Paul: "I live, now not I, but Christ lives in me".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily22.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 22"
