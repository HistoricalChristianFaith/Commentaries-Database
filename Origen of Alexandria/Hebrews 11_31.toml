[[commentary]]
quote='''
This command too is given to her who was once a "harlot": "All," she says, "who shall be found in your house shall be saved. But those who go out of the house — we are free from this oath of yours." If anyone, therefore, wishes to be saved, let him come into this house of her who was once a "harlot." Even if someone from that people wishes to be saved, let him come to this house, that he may be able to obtain salvation. Let him come to this house, in which the blood of Christ is the sign of redemption. For among those who said, "his blood be upon us and upon our children," the blood of Christ is unto condemnation. For Jesus "was set for the fall and for the rising again of many," and therefore, to those who contradict his "sign," "his blood" is made unto punishment, but to those who believe, unto salvation. Let no one, therefore, persuade himself, let no one deceive himself: outside this house, that is, outside the Church, no one is saved; if anyone goes outside, he becomes guilty of his own death. This is the sign of the blood, because here too is the purification which is established through the blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily03.html'
source_title="HOMILIES ON JOSHUA 3.5"


[[commentary]]
quote='''
Our "Jesus sends" spies to the "king of Jericho," and they are received into lodging by a "harlot." But that harlot, who received the spies sent by Jesus, received them for this reason, that she might no longer be a "harlot." But also the soul of each one of us was a harlot, so long as it lived in the desires and lusts of the flesh. But it received the spies of Jesus, "the angels whom he sent before his face, that they might prepare his way." Yet if each soul received them out of faith, it places them not in lowly places nor in lower ones, but in the higher and lofty ones, because we have received Jesus the Lord not as lowly and earthly, but as one proceeding from the Father and coming from the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily01.html'
source_title="HOMILIES ON JOSHUA 1.4"
