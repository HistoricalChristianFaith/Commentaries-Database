[[commentary]]
quote='''
For I am not ashamed of the Gospel. For it is the power of God unto salvation to everyone who believes. Many reproaches indeed arose against the Gospel at the beginning of its preaching; but Paul had learned patience from the prophets, who say: Do not be overcome by their reproaches, and do not give way before their revilings; and he knew that he preached the Gospel not in the persuasive words of human wisdom, but in the power of the Spirit. Therefore, defining what the Gospel is, he declares: For it is, he says, the power of God unto salvation to everyone who believes, to the Jew first and to the Greek. In saying, it is the power of God unto salvation, he seems to show that there is, as it were, some power of God which is not unto salvation but unto destruction. For he knows that it is written also in the prophet: And the caterpillar, my great power; and again in the Psalms he says: In your power destroy them; and therefore here he says: the power of God unto salvation. We must therefore consider whether perhaps on account of these differences in the powers of God a right hand and a left hand are spoken of in God, so that the power unto salvation is called his right hand, and the power by which he destroys is called his left. But this too must be noted, whether perhaps, since Christ is called the power of God, and the Gospel is the power of God, Christ ought to be understood also as the Gospel, just as he is understood as many other things as well; and perhaps what is called the eternal Gospel should be taken as spoken of him. To everyone, he says, who believes, to the Jew first and to the Greek. The Greeks originally reckoned the whole race of men under two designations, that is, calling each man either a Greek or a barbarian; and their distinction was such that everyone who was not a Greek was held to be a barbarian. But Paul employs a far truer distinction, naming the Jews first, and afterwards the Greeks, and last of all the barbarians. For since the Greeks, because they themselves made use of laws, called all the rest barbarians as living without laws, the Jews are deservedly preferred by the Apostle even to the Greeks themselves, because they both began to live by laws before them, and their laws were promulgated by God and not by men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook01.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
