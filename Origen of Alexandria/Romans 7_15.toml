[[commentary]]
quote='''
"For what I work, I do not know. For I do not do what I will; but what I hate, this I do." Now as to what he says, that "I do not know what I work," it is not the thing itself which one works that he is ignorant of, though he be carnal, but he is said to be ignorant of the cause of the thing which he does. But as to what he says, "For I do not do what I will; but what I hate, that I do," he shows that although he who speaks these things is carnal and sold under sin, nevertheless he also strives to resist his vices a little — by the prompting, that is, of the natural law — but is conquered by his vices and overpowered against his will: as often happens (for example) when someone resolves to bear patiently the one who provokes him, and in the end is conquered by anger, and suffers this against his will: he grows angry therefore even when he does not wish to grow angry. This same thing is also wont to happen through the vice of fear, so that against his will a man is terrified by dread and alarm; this also often occurs in the elation of a sudden or unexpected honor, so that he becomes more arrogant and more puffed up than he wishes. He therefore who is not yet spiritual is conquered in each of these things, even against his will: because that will of his is not yet so strong and so robust as to determine within itself that it must contend for the truth even unto death; nor is it such as to say, "It is, it is; no, no"; and therefore he cannot work the things he wills, but the things he does not will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
