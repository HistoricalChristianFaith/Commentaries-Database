[[commentary]]
quote='''
‘Whether ye have raised and roused up Love AS FAR AS HE WILL. THE VOICE OF MY NEPHEW: BEHOLD, HERE HE COMETH LEAPING UPON THE MOUNTAINS!’ It is the Church who speaks thus far, exhorting the maidens to be ready for the Bridegroom’s coming; if so be He means to come and grant them speech with Him. So, while she is still speaking, the Bridegroom comes, and she points her finger at Him, saying: ‘Behold, here He cometh leaping upon the mountains!’ The soul of the Bride, you see, is so blessed and perfect, that she is quicker to see, quicker to contemplate the coming of the Word; perceiving also that it is to her own self that Wisdom and Love have come, she says to those who do not see: ‘Behold, here He cometh!’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
