[[commentary]]
quote='''
Then, moreover, the Savior too, with the authority of the Lord and King, establishing laws and ordinances at once for priests and for the peoples, says: "Take heed, lest perhaps your hearts be weighed down with drunkenness and surfeiting and with the cares of this world, and that sudden destruction come upon you". You have heard the edict of the eternal King, and you have learned the lamentable end of "drunkenness" or "surfeiting". If some skilled and wise physician were to prescribe to you in these very words and say: Take heed to yourselves, lest anyone, for example's sake, take too greedily of the juice of this or that herb; for if he does so, sudden destruction will come upon him—I do not doubt that everyone, with regard to his own health, would keep the precepts of the physician who forewarned him. But now the physician of souls and bodies, and at the same time the Lord, bids the herb of "drunkenness" and of "surfeiting" be shunned, and likewise the deadly juices, as it were, of worldly cares be guarded against. And I know not whether any of us is not consumed in these things—not to say wounded. Drunkenness by wine, then, is pernicious in all respects; for it alone is the thing that renders both the body and the soul feeble at once. In other matters indeed it can come to pass that, according to the Apostle, when the body "is weakened", then the spirit "is the more powerful", and where "he who is without, the man, is corrupted, he who is within is renewed". But in the sickness of drunkenness the body and the soul are corrupted together, the spirit is vitiated along with the flesh. All the members are feeble, the feet, the hands, the tongue slackened; darkness veils the eyes, forgetfulness veils the mind, so that a man does not know nor perceive himself to be a man. This, then, drunkenness has first, of bodily disgrace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
