[[commentary]]
quote='''
"I will go to the great ones and speak to them." Those who are great in soul are spoken of in praise. For among the Greeks too "greatness" (to hadron) is continually used to name the grandeur of the rational soul. For whenever someone undertakes great matters and has purposes worthy of account and always considers what is fitting — how he may live according to right reason, wishing and looking upon nothing lowly and small — such a one has the greatness and grandeur in his soul. These men, then, since they were poor — the former ones whom the word blamed — did not listen, says the prophet. For this reason they did not listen, because they are poor. "I will go to the great ones and speak to them." And if it is a blessed thing to speak "into the ears of those who hear," it is a blessed thing if one meets with a great and mighty hearer. Therefore, since these things are so spoken, knowing that it is no loss to those who speak, so much as to those who hear, not to accept the things announced, and that it accuses the poverty of their mind and of their understanding, let us beseech to receive from God, as the word increases greatness and grandeur in us in Christ Jesus, that we may be able to hear the sacred and holy words — to whom be the glory and the might unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily06.html'
source_title="HOMILIES ON JEREMIAH 6"
