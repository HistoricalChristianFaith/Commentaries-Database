[[commentary]]
quote='''
"Now the tax collectors also came to be baptized by him". This, even according to the simple understanding, may teach the tax collectors to seek "nothing more" than what is commanded in the law; for those who exact more transgress not the commandment of John, but of the Holy Spirit, who spoke in John. But I do not know whether, according to the ἀναγωγήν (the anagogical or higher sense), the discourse signifies something else more excellent, and whether we ought to bring forth things so mystical in such an audience, especially among those who do not look into the marrow of the Scriptures, but delight only in the surface. It is indeed dangerous, yet it must be touched upon summarily and briefly. When we have departed from the world and this our life has been changed, there will be certain ones sitting at the boundaries of the world, most diligently searching, as if by the office of tax collectors, lest they find anything of their own in us. It seems to me that "the prince of this world" is like a tax collector, whence it is written of him: "The prince of this world comes, and in me he has nothing". That also which we read in the Apostle: "Render to all their debts; to whom tribute, tribute; to whom custom, custom; to whom honor, honor; owe nothing to anyone, except that you love one another"—is to be understood in a sacred sense. Wherefore let us consider to how great dangers we are subject, lest perchance, when we do not have that which we may render for the custom, we ourselves be dragged off for the debt, as is wont to happen also among the tribute-payers of the world, when someone for a debt is himself shut up to serve the state. Very many of us are to be held by tax collectors of this sort—whom that holy man Jacob did not greatly dread, nor fear that anything from the tax collectors' tributes should be found in him. Whence Laban spoke boldly to that tax collector: "Recognize, if anything of your goods is with me". Concerning which Scripture gives testimony, saying: "And Laban did not recognize anything with Jacob". Therefore our Savior, and the Holy Spirit who spoke in the prophets, teaches not only men, but also angels and invisible powers. Why do I speak of the Savior? The prophets themselves too and the apostles preach all that they proclaim not only to men, but also to angels. That you may know this to be true, he says: "Give heed, O heaven, and I will speak", and: "In the sight of the angels I will sing praise to you", and: "Praise the Lord, you heavens of heavens, and let the waters that are above the heavens praise the name of the Lord", and: "Let the angels praise him", and: "In every place of his dominion, bless the Lord, O my soul". You will find in many places, and especially in the Psalms, that discourse is directed also to the angels, since power is given to man—to him, that is, who has the Holy Spirit—to address even the angels. Of these I will set down one example, that we may know that the angels too are instructed by human voices. It is written in the Apocalypse of John: "To the angel of the church of the Ephesians write: I have something against you". And again: "To the angel of the church of Pergamum write: I have something against you". Certainly it is a man who writes to the angels and commands them something. I do not doubt that angels are present also in our assembly, not only generally to the whole church, but even individually, concerning whom the Savior says: "Their angels always behold the face of my Father, who is in heaven". A twofold church is present here, one of men, the other of angels. If we say anything according to reason and according to the will of the Scriptures, the angels rejoice and pray with us. And because the angels are present in the church—in that church, at least, which merits it and is Christ's—therefore it is commanded to women when praying that they have "a veil upon the head because of the angels". What angels? Surely those who assist the saints and rejoice in the church, whom indeed we do not see, because our eyes are darkened by the filth of sins, but the apostles of Jesus see them, to whom he says: "Amen, amen I say to you, you shall see heaven opened and the angels of God ascending and descending upon the Son of man". But if I had this grace, that I might see as the apostles saw and behold as Paul beheld, I would now discern the multitude of angels which Elisha saw, and which Gehazi, who had stood with him, did not see. Gehazi was in fear lest he be captured by the enemies, seeing Elisha alone. But Elisha, as a prophet of the Lord, prays and says: "O Lord, open the eyes of this boy, that he may see, for there are many more with us than with them". And immediately, at the prayers of the holy man, he beheld the angels which Gehazi previously did not see. We have said these things for this reason, to show that the tax collectors are taught by John—not only those who serve the tributes of the state, but also those who were coming to repentance and were tax collectors other than the bodily ones, just as there were also other soldiers who were going out to the baptism of repentance. For not only John and the prophets came, but the Savior himself also came to preach saving repentance to men and to angels and to the other powers, so that "in the name of Jesus every knee should bow, of things heavenly, earthly, and infernal, and every tongue confess that the Lord Jesus Christ is in the glory of God the Father": to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily23.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 23"
