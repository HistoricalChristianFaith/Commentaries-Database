[[commentary]]
quote='''
For they themselves hold as it were the charge of our souls, to whom, "while we are yet little ones," we are committed as to "guardians and stewards until the time appointed by the father." They themselves therefore now say of the progress of each one of us: "for now I have known that you fear God." For the sake of example, I have the resolve of martyrdom—from this the angel will not be able to say to me: "for now I have known that you fear God"; for to God alone is the resolve of the mind known. But if I shall have come to the contests, brought forth "the good confession," and steadfastly undergone all the things that are inflicted, then the angel can say, as though confirming and strengthening me: "now I have known that you fear God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily08.html'
source_title="HOMILIES ON GENESIS 8.8"
