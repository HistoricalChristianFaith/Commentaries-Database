[[commentary]]
quote='''
Finally, in the present reading, Eleazar the priest is not written as speaking to all the people, but only to those who return from the battle. For it says: "and Eleazar the priest said to the men of valor, who were returning from the battle." You see, then, how the word of God speaks to the men of valor. For men of valor are they who go forth to war. But if anyone is unwilling to fight and to be a soldier, if anyone is unwilling to have the contest of divine studies and of abstinence, this man is unwilling to fulfill that which the Apostle said: "but he who contends in the contest is continent from all things." He, then, who does not contend in the contest and is not continent from all things, nor wishes to be exercised in the word of God and to meditate on the law of the Lord day and night, this man, even if he be called a man, cannot nevertheless be called a man of valor. But this one, of whom now the divine Scripture speaks, who brings back spoils from the enemy, is called a man of valor; for this is the mark of his praise, that Scripture says: "Eleazar the priest spoke to the men of valor, who were returning from the battle." Which of us is so prepared that he may go forth to war and fight against the adversaries, so that he too may be able to be called a man of valor? But as a continent life and the labor of abstinence and the struggles of contests make each one to be called a man of valor, so on the contrary a life relaxed and negligent and slothful makes a man to be called a man of sloth. If, then, you wish to be called a man of valor, clothe yourself with Christ the Lord, who is the power (virtus) of God and the wisdom of God, and in all things join yourself to the Lord so that you become one spirit with Him, and then you will be made a man of valor. For the time of war is for us in this world; the fight is against the Midianites, whether against the vices of our flesh, or against the contrary powers. The choir of angels and of the heavenly powers watches us; a devout expectation, therefore, hangs upon us as to when or how we may return from this battle, what each one of us may bring back of the spoils, and they look on more curiously and search more anxiously as to which of us bears from here more of gold, which also displays there a weight of silver, which too carries down precious stones. They inquire also, whether anyone bears down bronze or iron or lead, but also a wooden vessel, if perhaps anyone, or an earthen one, or another of this kind necessary for the uses of a great house. For in a great house there are not only vessels of gold and silver, but also of wood and of clay. It is diligently inquired, therefore, when we shall have gone thither, what each one of us brings down, and according to the things he has brought down, according as his labor is proved by the contemplation of the spoils, the merit also of his abode will be reckoned to him. Yet all these things are tested — those through fire, by fire, and those through water, by water; for what sort each one's work is, the fire will prove.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily25.html'
source_title="HOMILIES ON NUMBERS 25.5"

[[commentary]]
quote='''
Therefore it says: "This is the justification of the law which the Lord established for Moses: besides gold and silver and bronze and iron and lead and tin, every thing that passes through fire, pass it through fire and it shall be cleansed, but it shall also be purified in the water of purification; all things whatsoever that do not pass through fire shall pass through water. And you shall wash your garments on the seventh day, and you shall be clean; and after these things you shall enter into the camps." You see how everyone who has gone out of the battle of this life needs purification. And if this is so, that I may dare to say something according to the authority of Scripture, everyone who goes out of this life cannot be clean. For consider diligently what the text of the history indicates. These men went out to fight for the sons of Israel, they slew the Midianites; and in slaying them, as far as concerns the order of the history and the letter of the law, they pleased God — for they fulfilled the will of God. Yet by this very fact, that they slew the adversaries, they are said to have been made unclean, and therefore it is said to them: "and you shall wash your garments on the seventh day, and you shall be clean; and after these things you shall enter into the camps." Therefore those who fight, for this very reason that they touched the unclean enemies and that they engaged against them and had a contest with them, are polluted. And I too, therefore, even if I shall have been able to conquer the devil, even if the unclean and evil thoughts which he suggests to my heart I either repel as they come or slay them within me once they have entered, lest they come to effect — nay, even if I shall have been able to trample on the head of the dragon, yet by this very fact it is necessary that I be polluted and defiled, in that I strove to trample on him who is polluted and defiled. And I shall indeed be blessed that I was able to overcome him, yet I am unclean and polluted, who touched the polluted one, and on this account I need purification. Therefore, no doubt, Scripture also says that: "no one is clean from filth." All of us, then, need purification — nay, purifications; for many and diverse purifications await us. But these things are mystical and ineffable. For who will be able to narrate to us what are the purifications that are prepared for Paul or Peter or others like these, who fought so much, destroyed so many barbarous nations, laid low so many enemies, took so many spoils, so many triumphs, who return with bloodstained hands from the slaughter of the enemy, whose foot is dipped in blood, and who washed their hands in the blood of sinners? For they slew in the mornings all the sinners of the earth and exterminated their image from the city of the Lord. For they conquered and destroyed diverse nations of demons. For unless they had conquered these, they could not have taken captives from them — all this number of believers — and led them to the obedience of Christ and subjected them to His sweet yoke and laid upon them His light burden. Who, then, is so blessed as to succeed them in these battles and to slay all the Midianites and to be justified from their blood? For he is said to pour out the blood of demons who snatches away those over whom they hold dominion. And he shall be washed from this blood and purified in the kingdom of God, that, purified and made clean, he may be able to enter the holy city of God, Christ Jesus our Lord opening to him the door — nay, He who is the very door of that city of God, to whom is glory unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily25.html'
source_title="HOMILIES ON NUMBERS 25.6"
