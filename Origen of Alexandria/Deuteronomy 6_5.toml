[[commentary]]
quote='''
The great and first commandment in the law, therefore, is this: You shall love the Lord your God with your whole heart and with your whole soul and with your whole mind. But whoever subtracts anything from that whole commandment — that is, either from what it says with your whole heart or with your whole soul or with your whole mind — subtracts from its magnitude and from its primacy. And perhaps all who love their Lord God, unless they also fulfill the parts that follow and love him with their whole heart and with their whole soul and with their whole mind, keep the commandment only in part; but those alone take up its magnitude and primacy within themselves who not only love their Lord God but have also taken up those three — that is, so that with their whole heart they store up within themselves that whole one and his works and his thoughts, and with their whole soul, that is, so that they are ready to lay it down for the piety of God who created all things, when the usefulness of the word demands it, out of the fact that with the whole soul one loves God, in such a way that no part of the soul is torn away toward any thing that is foreign to the faith, and in our whole mind thinking or bringing forth nothing else but "the things that are of God". And see whether you can take heart to mean the intellect, which gazes upon intelligible things and shows the source and beginning of them, which is God, and mind to mean the bringing forth of things (for it is with the mind that we bring forth individual things, and through each thing that is signified we walk about, as it were, with our mind and bring it forth). And if anyone should understand ingeniously the commandment which was laid down concerning love in all those three things that have been named, and should consider in each of the several faithful the love of God, he will perhaps find the whole commandment either in one, or perhaps the second or the third (and this if it should be granted), but in all of them the love of God having less — whether a little or more — either from what it says with your whole heart or from what it says with your whole soul or with your whole mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252022.html'
source_title="COMMENTARY ON MATTHEW 2"

[[commentary]]
quote='''
Something of this kind is shown also concerning the commandment of love toward God and toward the neighbor, when it says thus: "You shall love the Lord your God with your whole heart and with your whole soul and with your whole strength". For without doubt, when anyone shall have loved God "with his whole heart" "and with his whole soul" "and with his whole strength", he has such a reward of love as the one who had a greater heart, or who has a more eminent soul, or who received greater strength. For this alone is sought, that whatever a man may have from God, he should use the whole of it for the glory of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252025.html'
source_title="COMMENTARY ON MATTHEW 67"

[[commentary]]
quote='''
Whatever each one worships above the rest, whatever he admires and loves above all things, this is his God. Indeed, this is what before all things and above all things God demands of man by his commandment: "you shall love", he says, "the Lord your God with all your heart and with all your soul and with all your strength" — desiring in a manner to lay first claim to himself upon all the affections of the human mind, and knowing that whatever one "loves with all the heart and with all the soul and with all the strength", this is his God. Let each one now examine himself and silently reckon up from his own heart what flame of love above all else and beyond all things burns hottest in him, what affection is cherished in him more ardent than the rest. Do you yourselves hold judgment concerning these things, weigh them on the balance of your own examination, and if there be anything that outweighs in the scale of love, this is your God. But I fear that in very many the love of gold outweighs, and that the weight of avarice, pressing the scale down enough, sinks it. And to such a one it will surely be said: "you cannot serve God and mammon" — that is, avarice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily02.html'
source_title="HOMILIES ON JUDGES 2"
