[[commentary]]
quote='''
To be without sin is understood in the Scriptures in two ways: the one, never to have sinned at all; the other, to have ceased from sinning. For it can come about that one who has sinned before, when he ceases from sinning, is said to be without sin. Thus also our Lord Jesus Christ "presented to himself a glorious Church, not having spot", not because the churchly man has never had a spot, but because he is by no means spotted any longer: "not having wrinkle", not that the wrinkle "of the old man" was never at some time in him, but that he has ceased to have it. In this manner also that which follows is to be understood: "that it may be holy and unspotted", not that from the beginning it was unspotted — for this indeed cannot be supposed of a man, that his soul was not spotted — but that it is reckoned pure and sincere, having ceased to be spotted any longer. We say these things for this reason, that we might teach that a man can, on the ground that he has ceased to sin, be called without sin and "unspotted".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily02.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 2"
