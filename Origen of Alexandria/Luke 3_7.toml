[[commentary]]
quote='''
No one that remains in his old state, and forsakes not his old habits and practices, can rightly come to be baptized; whoever then wishes to be baptized, let him go forth. Hence are those words significantly spoken, And he said unto the multitude that went forth to be baptized of him. To the multitudes then who are going forth to the laver of baptism, He speaks the following words, for if they had already gone forth, He would not have said, O generation of vipers.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
But this too must be attended to, that John speaks "to the peoples going out" to baptism. If anyone wishes to be baptized, let him go out; for one remaining in his former state and not leaving his ways and his custom by no means comes rightly to baptism. And that you may understand what it is to go out to baptism, receive the testimony and hearken to the words in which God speaks to Abraham: "go out from your land" and the rest. And so, as the crowds were going out to the washing—not having gone out, but only striving to go out—John speaks the things that follow. For if they had already gone out, he would never have said to them: "brood of vipers". Whatever things, therefore, he speaks to them, he speaks also to you, O catechumens, male and female, who are preparing to come to baptism. Consider whether perhaps it may be said also to you: "brood of vipers"; for if you too have some likeness to the vipers of sense and to the invisible serpents, to you too it will be said: "brood of vipers". But also that which follows, unless you have driven out the wickedness and the venom of serpents from your heart, will be said to you: "who has shown you to flee from the wrath to come?" Great wrath hangs over this age; the whole world is to suffer the wrath of God. So great a vastness of heaven and breadth of earth and choirs of stars, the splendor of the sun and the nocturnal comforts of the moon, the "wrath" of God will overthrow; for all these things shall pass away because of the sins of men. And formerly, indeed, the "wrath" of God came upon one earth only, "because all flesh had abandoned its way upon the earth"; but now the "wrath" of God is to come both upon heaven and upon earth: "the heavens shall pass away, but you shall remain"—it is said to God—"and all shall grow old like a garment". See of what kind and how great the "wrath" is, which is about to consume the whole world and will punish those who are worthy of punishment, and will find material in which to exercise itself. Each one of us, from that which he has done, has prepared material for wrath: "for according to your hardness and impenitent heart you treasure up for yourself wrath in the day of wrath and of the revelation of the just judgment of God", it is said to the Romans.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily22.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 22"
