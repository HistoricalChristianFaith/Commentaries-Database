[[commentary]]
quote='''
And what that hope is, he recalls, saying: "Because the creature itself also," he says, "shall be freed from the servitude of corruption, into the liberty of the glory of the sons of God." Let us examine more attentively what that vanity is to which the creature is said to be made subject, and what that corruption is from whose servitude it hopes to be freed. It seems to me that these things are said concerning this material and corruptible substance of the body. For corruption holds dominion over nothing else save the body. For that interior man who was created according to God, and made after the image of God, is incorruptible and invisible, and according to his own proper principle may even be called incorporeal. But the exterior man is called both corporeal and corruptible; on which account Paul said of him: "For even if our outward man is corrupted, yet he who is within is renewed." But the renewal of the interior man, inasmuch as he is rational and is mind, consists in the knowledge of God and in the capacity for the Holy Spirit. But that we may commit to paper, briefly and summarily, at least something concerning matters so profound, let us gather from the very substance of the interior man — that is, of the soul and of the mind — an image of how "the creature was made subject to vanity, not willingly, but on account of him who subjected it in hope"; and let us set Paul himself, if it seems good, in the midst, whose soul indeed, or mind, which is his interior man, surmounts and ascends above everything that is corporeal, everything visible, everything that lies beneath sense and sight, and is made capable of the divine nature itself. Yet this substance of his soul, so great and of such a kind, which holds the principles and understandings of heavenly and divine perceptions, has been made subject (for what causes, God will have seen) to the servitude of the corruptible body, and is bound fast to its vanity. For consider the necessities of the body: the appetite for food, the shame of digestion, the embarrassment of repairing posterity — how offspring is sown, how it is brought forth, how it is nourished; and see how much vanity is held in these things, how much corruption, to which the creature, a noble and rational soul, though unwilling, is made subject — yet made subject in hope, hoping, that is, for the time in which it may be set free, when the time of the liberty of the sons of God shall have come. This, then, is what the Apostle also said in other places more openly concerning himself, that "while we are in this dwelling, we groan." This too Wisdom said through Solomon, that "the corruptible body weighs down the soul, and the earthly habitation presses down the mind that ponders many things"; and the same Paul: "For while we are in the body, we are pilgrims from the Lord," and he desires rather to be a pilgrim from the body and to be present with the Lord. He indicates this, and it is set forth much more openly also in that place where he says: "But I am pressed between two, having a desire to return and to be with Christ, for that is far better; yet to remain in the flesh is more necessary for your sake." In which he plainly shows that it was not willingly — so far as concerns those things of which his soul was conscious — that he served this corruption and vanity, but on account of him who so willed these things, and on account of us, that we might be able to be saved. Therefore he remains in the flesh for our sake; but when the sons of God shall have been revealed, and gathered into one through the Church which he established "to present a chaste virgin to one husband, to Christ," then he too shall be freed from the servitude of corruption, just as he himself says: "But I am already being offered up, and the time of my dissolution is at hand. I have finished my course, I have kept the faith: for the rest there is laid up for me a crown of justice." This is to be freed from the servitude of corruption into the liberty of the glory of the sons of God. But from these examples, if it seems good, ascend also to things higher, and see how the ministries of the sun itself, and of the moon, and of the stars of heaven, and of the whole world are made subject to vanity and are enslaved to corruption. For they nourish the crops for the uses of men, they bring forth the fruits of trees and the grass of the fields; and they roll around the same circuits of the year, returning upon themselves. For they restore the things that pass away, and again they permit to pass away the things that have been restored.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
