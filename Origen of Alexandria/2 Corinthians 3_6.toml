[[commentary]]
quote='''
The letter means what is material and the spirit what is intellectual, which we also call spiritual.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25201.html'
source_title="ON FIRST PRINCIPLES 1.1.2"


[[commentary]]
quote='''
For there is even in the Gospels a "letter" which "kills". Not only in the Old Testament is the "killing letter" found; there is also in the New Testament a "letter" which "kills" him who does not spiritually attend to the things that are said. For if you follow according to the letter this very thing that was said: "unless you eat my flesh and drink my blood", this "letter kills". Do you wish that I bring forth to you another "letter" from the Gospel which "kills"? "He who has no sword", he says, "let him sell his tunic and buy a sword". Behold, this too is a letter of the Gospel, but it "kills". But if you take it spiritually, it does not kill, but there is in it "a life-giving spirit". And therefore, whether in the law or in the Gospels the things that are said, take them spiritually, because "the spiritual man judges all things, but he himself is judged by no one".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily07.html'
source_title="HOMILIES ON LEVITICUS 7"
