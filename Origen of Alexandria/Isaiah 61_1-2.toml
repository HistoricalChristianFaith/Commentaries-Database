[[commentary]]
quote='''
Let us therefore contemplate what those things are which he spoke in the prophet and afterward sounds forth about himself in the synagogue. "He sent me", it says, "to evangelize the poor". The "poor" signifies the nations; for these were "poor", possessing nothing at all, not God, not the law, not the prophets, not justice and the remaining virtues. For which cause God sent him to announce to the poor: "to preach release to the captives". Captives we were, whom for so many years Satan had bound, holding us captive and subject to himself. Jesus came "to preach release to the captives and to the blind, that they might see"; for indeed by the word and preaching of his teaching the blind see. Let the preaching therefore be understood ἀπὸ κοινοῦ (in common), not only over the captives, but also over the blind. "To send forth the broken into liberty". What was ever so broken and crushed as man, who was released and healed by Jesus? "To preach the acceptable year of the Lord". According to the simple understanding they say that the Savior preached the Gospel in Judea for one year, and that this is what is said: "to preach the acceptable year of the Lord and the day of retribution", unless perhaps the divine word signifies something of a mystery in the preaching of the year of the Lord. For there are to be other days, not such as we now discern in the world, and other months, and a different order of the Kalends. Just therefore as those are other, so also the year of the Lord to come is pleasing. But all these things have been foretold, that after sight from blindness, after liberty from chains, after health from diverse wounds, we may come to the "acceptable year of the Lord".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily32.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 32"
