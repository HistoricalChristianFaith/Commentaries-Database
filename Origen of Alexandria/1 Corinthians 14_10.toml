[[commentary]]
quote='''
"Even things without soul," then, "give forth a voice" — some of them with this distinction of notes, and others again with a different one; for every body has its own peculiar sound, when it is struck against another body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LVIII*"
