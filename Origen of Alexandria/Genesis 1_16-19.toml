[[commentary]]
quote='''
"And God made two great luminaries, the greater luminary for the rule of the day, and the lesser luminary for the rule of the night, and the stars. And God set them in the firmament of heaven, that they may give light upon the earth, and have power over the day and the night, and divide between the midst of the light and the midst of the darkness. And God saw that it is good. And there was evening, and there was morning, the fourth day." Just as the sun and moon are said to be the great luminaries in the firmament of heaven, so also in us are Christ and the Church. But since God also set stars in the firmament, let us see which are the stars also in us, that is, in the heaven of our heart. Moses is a star in us, which shines and enlightens us by his acts. And Abraham and Isaac and Jacob and Isaiah and Jeremiah and Ezekiel and David and Daniel and all to whom Holy Scripture has given testimony that they pleased God. For just as "star differs from star in glory," so also each one of the saints, according to his greatness, pours his light into us. And just as the sun and moon enlighten our bodies, so also our minds are enlightened by Christ and the Church. Yet we are enlightened thus, if we are not blind in our minds. For just as the sun and moon, although they shine upon those who are blind in bodily eyes, yet those cannot receive the light, so also Christ furnishes his light to our minds; but he will then enlighten us only if in no way blindness of mind hinders. And even if this should happen, first it behooves those who are blind to follow Christ, saying and crying out: "Have mercy on us, son of David," so that, receiving also their sight from him, they may thereafter be able to be irradiated by the splendor of his light too. But not all who see are equally enlightened by Christ, but each is enlightened according to that measure by which he is able to receive the force of the light. And just as the eyes of our body are not equally enlightened by the sun, but the higher one ascends into lofty places and beholds its rising by the gazing of a more elevated watchtower, so much the more will he receive both of its splendor and its heat; so also our mind, the more loftily and highly it approaches Christ and presents itself nearer to the splendor of his light, so much the more magnificently and clearly will it be irradiated by his light, as he himself also says through the prophet: "Draw near to me, and I will draw near to you, says the Lord." And again he says: "I am a God drawing near, and not a God from afar." Yet we do not all come to him in the same way, but each one "according to his own power." For either we come to him with the crowds, and he refreshes us through parables only to this end, that we may not faint from much fasting "on the way"; or else we sit always and unceasingly at his feet, being free for this alone, that we may hear "his word," in no way troubled "about much serving," but choosing "the best part, which shall not be taken away" from us. And surely those who thus approach him obtain much more from his light. But if, like the Apostles, we are never at all moved away from him, but always remain with him in all his tribulations, then he expounds to us in secret the things which he had spoken to the crowds and "dissolves" them, and enlightens us much more clearly. But if anyone is even such that he can also ascend into the mountain with him, like Peter and James and John, this one will be enlightened not only by the light of Christ, but also by the voice of the Father himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.7"
