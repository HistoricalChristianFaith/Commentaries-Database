[[commentary]]
quote='''
And, to come to the things that are written, the "Lord of majesty", Jesus Christ our Savior, was crucified. The author of this crime and the father of the wickedness is without doubt the devil. For thus it is written: "but when the devil had entered into the heart of Judas Iscariot, that he should betray him". The father of the sin, then, is the devil. He, in this wickedness, first begets a son, Judas; but Judas alone could not accomplish this. What, then, is written? "Judas went" it says "to the scribes and Pharisees and to the chief priests, saying to them: What will you give me, and I will betray him to you?" There is born, then, from Judas a third and fourth generation of sin. And you will be able to detect this order in each single sin as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
