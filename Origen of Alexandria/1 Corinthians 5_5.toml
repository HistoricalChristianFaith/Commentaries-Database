[[commentary]]
quote='''
Hear, then, himself saying of him who had sinned: "I have delivered", he says, "such a man to Satan for the destruction of the flesh, that the spirit may be saved". You see, then, that even now not only through his Apostles does God "deliver" transgressors "into the hands of enemies", but also through those who preside over the church and have the power not only of loosing, but also of binding, sinners "are delivered into the destruction of the flesh", when for their offenses they are separated from the body of Christ. And, as it seems to me, even now men are delivered from the church into the power of the devil in two ways: in this manner which we spoke of above, when his offense becomes manifest to the church and he is driven from the church by the priests, so that, marked out by men, he may blush, and being converted there may befall him that which follows: "that the spirit may be saved in the day of our Lord Jesus Christ"; but in another way one is "delivered to the devil" when his sin does not become manifest to men, yet God, "who sees in secret", perceiving his mind and his soul serving vices and passions, and that in his heart it is not he who is worshipped, but either avarice or lust or vainglory or other such things — such a one the Lord himself "delivers to Satan".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily02.html'
source_title="HOMILIES ON JUDGES 2"

[[commentary]]
quote='''
And therefore, knowing these things to be expedient for the faithful, the Apostle Paul says of him who had sinned: "whom I have handed over," he says, "to Satan for the destruction of the flesh," that is, to have punished him with death. But what the fruit of this death is, he shows in what follows, saying: "that the spirit may be saved in the day of our Lord Jesus Christ." You see, then, how openly the Apostle has set forth the usefulness of this death. For what he says, "I have handed over for the destruction of the flesh," that is, for the affliction of the body, which is wont to be paid out by penitents, and he named it a destruction of the flesh which nevertheless confers life on the spirit. Whence now too, if perhaps any of us recalls in himself the consciousness of some sin, if anyone knows himself to be liable to an offense, let him take refuge in penitence and take upon himself a voluntary destruction of the flesh, that, purged in the present life, our spirit may proceed clean and pure to Christ our Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily14.html'
source_title="HOMILIES ON LEVITICUS 14"

[[commentary]]
quote='''
Concerning the man who had sinned at Corinth, the Apostle declared, saying: "To deliver such a man to Satan for the destruction of the flesh." Is it to be supposed that he wished the man whom he said ought to be delivered to Satan for the destruction of the flesh to become wicked? Rather, on the contrary, it is apparent that for the man's salvation he delivered his flesh to destruction. Indeed, he adds, saying: "I have delivered such a man to Satan for the destruction of the flesh, that the spirit may be saved in the day of the Lord," showing that the spirit cannot be saved unless the flesh be delivered to destruction. What, then, the destruction of the flesh is, hear. For what has been destroyed is without doubt dead. But the flesh lives in the sinner; the flesh is dead in the righteous man. On account of which the righteous also say: "Always carrying about the mortification of Jesus Christ in our body, that the life of Jesus Christ also may be made manifest in our mortal flesh." And again we have received a command, saying: "Mortify your members which are upon the earth." And blessed is he who has died to sin, according to what has been said: "The body indeed is dead because of sin, but the spirit lives as life because of justification." To be delivered, then, to the destruction of the flesh is such that the carnal sense may die in us, and the desire of the flesh may not live in it. For from the fact that the sense of the flesh dies, so that we may not be wise according to the flesh, the spirit is made safe. Otherwise, while the sense of the flesh lives in us, and the flesh lives, we cannot be wise about spiritual things. In this way, then, the Apostle delivered to the destruction of the flesh the man who had lived according to the flesh, so that, the sense of the flesh being dead, the spirit might be saved in the day of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Psalms%252036-38%2FHomily06.html'
source_title="HOMILIES ON PSALMS 38, HOMILY I"

[[commentary]]
quote='''
Not for the destruction of the soul, not for the destruction of the spirit, but for the destruction of the flesh; for he is delivered over that the spirit may be saved in the day of the Lord. For Paul cast out such a man, not knowing that "he will repent and turn back," but wishing to discipline him. For it is one thing to cut someone off as incapable of repentance and conversion, and another to set him aside for the present and to expel him from the flock, as a shepherd expels a sheep that has the scab, so that the spread of that wound may not be grazed abroad over the whole flock.

Let those, then, who are living badly, having been put outside the flock, be healed, confessing and mourning their own sins, offering the things of repentance in fastings and mournings and weepings and the like. For they are delivered over that they may be disciplined, so that their flesh may be destroyed — that is, the "mind of the flesh"; not that he may touch their soul, not that he may drive them out of their senses, not that he may do anything else, but that he may receive authority over their flesh alone — I not giving the authority, but the power of Jesus which is in me.

From its better part he named the whole salvation, so that he does not say Both the spirit and the soul and the body may be saved in the day of the Lord, but that the spirit may be saved, naming the salvation of the whole man from the better part. For he commands, as of one who is to be saved, that he be received back into the Church in the second epistle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XXIV"
