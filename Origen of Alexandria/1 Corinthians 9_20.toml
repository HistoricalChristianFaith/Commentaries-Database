[[commentary]]
quote='''
And according to the passage before us it has this sense: I became to the Jews as a Jew, that I might gain Jews. For being free from Judaism, I enslaved myself to Jews, that I might gain Jews; being free from being under the law I made myself as under the law, that I might gain those under the law. For Paul condescended to go into the synagogues of the Jews, he entered in among them, he acted according to their customs without harm, not playing the hypocrite along with them but hunting for some of them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XLIII"

[[commentary]]
quote='''
Some have inquired what the difference is between those under the law and the Jews; we say, then, that those under the law are others than the Jews, like the Samaritans.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XLIII"
