[[commentary]]
quote='''
In this passage the Apostle, wishing to display the goodness of God, by which he brings about the salvation of some through the unbelief of others, says: "God has shut up all in unbelief, that he may have mercy upon all"; not that he himself thrust upon them the purpose of unbelief, but that out of their own purpose of unbelief he opened up an approach to faith for others who had themselves previously been unbelievers. Now Paul, having taken his stand at these points and looking more deeply into causes of this kind — how it is that God does not at once cut away and excise an evil purpose, but suffers it and holds it in reserve, foreseeing that some good will come to others through another's evil purpose — turned, I think, the eyes of his heart from those of whom he was speaking to the very origin of wickedness: namely, that God from the beginning did not judge it useful to cut it away when it sprouted in those in whom it first arose, whoever they may be, and grew by the liberty of choice; but permitted them to use their own purpose, knowing and foreseeing that the progress and benefit of many would arise from the occasion of their wickedness. And so great is the room for virtue with the good God, that even the work of wickedness, though it be ruinous to him from whom it proceeds, is nevertheless so ordered as to confer a benefit upon him for whom it stirs up contests, when it has been overcome.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook08.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
