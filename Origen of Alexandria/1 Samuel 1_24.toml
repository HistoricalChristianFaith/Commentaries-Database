[[commentary]]
quote='''
But it is now time to recall also a few things concerning the prayer of Hannah, which she poured forth when offering to God Samuel, whom she had weaned from the milk. In which, first indeed, we say this, that the boy who is offered to God could not be offered before he was weaned from the milk. In which it is shown that no one can be consecrated to God who is still nourished with milk, and is a boy in his senses, and is without part in the word of righteousness, nor can he administer the priestly sacraments unless he desists from childish things, and ascends to greater things from those to whom the Apostle says: "Milk I gave you to drink, not meat. For ye were not yet able." Otherwise, according to the letter, what does it seem worth the trouble that a little boy lately weaned from the milk should be offered to God, where the mother will not be present, nor nurses cherish him, nor any supports for the rearing of the boy be at hand? But see that the discourse of Scripture is so apt that it teaches figuratively that everyone who is first converted to the faith is nourished with milk and not with strong food, of whom in another place it is said: "And ye have become such as have need of milk, and not of strong food. For everyone who is nourished with milk is a stranger to the word of righteousness. For he is a little child. But solid food is for the perfect, who, according to their capacity for taking it, have their senses exercised to the discerning of good and evil." Therefore whoever is not yet weaned from the milk, but is a little child, cannot ascend to the temple of the Lord, cannot ascend to the ministries of the priests, nor be present at the sacrifices; but neither does his mother ascend, though she is able to ascend. For Hannah, his mother, is grace, who keeps and guards him and nourishes him, so that at the fitting time she may ascend together with him. And when she has seen that the time is at hand for him, so that now, departing from the milk, he uses solid and strong foods, so that he may be able both to be present with the priests and to eat of the sacrifices of the altar, then she consecrates him to God. See whether in another place in the holy Scriptures you find someone signified as weaned from the milk. I, however, so far as memory suggests for the present, remember Isaac: of whom it is written that Abraham made a great banquet on that day on which Isaac his son was weaned from the milk. Among the men of this age indeed, parents are wont to celebrate the birthday of their sons: but Abraham does not celebrate the birthday of Isaac his son, but he keeps that day as a feast, and reckons it for gladness, and celebrates banquets, when he weans him from the milk, and applies him to strong and solid foods, as though through these Isaac were saying: "When I became a man, I put away the things that were of a child." It is fitting, therefore, that such should be he who is offered to God, that he may dwell among the holy things, who can feed on holy flesh, of which it is written: "Be sanctified, that ye may eat flesh."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.8"
