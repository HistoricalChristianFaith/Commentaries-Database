[[commentary]]
quote='''
Not all are worthy of the divine numbers, but those who ought to be included within the number of God are marked out by certain definite prerogatives. And this book, which is entitled Numbers, contains a clear indication of this matter. In it we are told that, by the command of God, neither are women brought into the number — being obstructed, no doubt, by the impediment of feminine weakness — nor any of the slaves, inasmuch as they are degenerate in life and character. But not even any of the Egyptians who had mingled with them is numbered, precisely because they were foreigners and barbarians; but the Israelites alone are numbered, and not even all of these, but those from twenty years old and upward. Nor is only the observance of age maintained, but it is asked whether one also displays a strength fit for war; for it is prescribed by the word of God that everyone be numbered "who goes forth in the might of Israel." Therefore not age alone, but might too, is required in an Israelite. Boyish age is not numbered, nor is it reckoned fit for the divine reckonings, unless perhaps they be firstborn or descend from a priestly or Levitical stock; these alone among the boys are brought to the number. But of the women none whatever is brought forward. And what is the meaning of this? Can these things be empty of mysteries, and is the Holy Spirit, who dictated that these things be written, to be believed to have taken care of this alone, that we might know who were then numbered in that people and who remained without number? And what profit will be given from this to those who are eager to be instructed in the sacred volumes? For what does it benefit to have learned these things? Or what is contributed to the soul for its salvation, if it should know that some part of the people was numbered in the desert, while another part was left unnumbered? But if, following Paul's judgment, we believe the law to be spiritual and hear the things it contains spiritually, an immense profit to the soul will appear in the things that are written. For the present reading teaches me that, if I transcend the folly of boyish age, if I cease to be a child in understanding and, having become a man, lay aside the things that are a child's — if, I say, I become a young man, and such a young man as may conquer the evil one — I shall appear fit for those of whom it is written, "all who go forth in the might of Israel," and I shall be reckoned worthy of the divine numbers. But so long as there is in any of us either a boyish and slippery understanding, or a feminine and slack sluggishness, or so long as we bear Egyptian and barbarous morals, we do not deserve to be held before God in the holy and consecrated number. For in Solomon those who perish are said to be without number; but all who are saved are numbered. And do you wish me to show you that the number of the saints is kept before God? Hear how David says of the heavenly stars indeed: "who numbers the multitude of the stars, and calls them all by their names." But the Savior not only set his chosen disciples under a number, but says that even the hairs of their head are numbered; for he says, "but the very hairs of your head are numbered." In which surely he was not saying that those hairs are numbered which are wont either to be shorn off with iron and cast away, or to fall off and perish with the passage of time; but those hairs of the head are numbered before God which were in the Nazirites, in whom dwelt the power of the Holy Spirit for laying low the foreigners. Therefore the virtues of the mind and the multitude of the senses, which were brought forth from the ruling part of the mind as from the head of the Apostles, he called the hairs of the head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily01.html'
source_title="HOMILIES ON NUMBERS 1.1"
