[[commentary]]
quote='''
Do you wish that I show you how from the words of the Holy Spirit fire goes forth and kindles the hearts of believers? Hear David saying in the psalm: "the word of the Lord set him on fire". And again it is written in the Gospel, after the Lord had spoken to Cleopas: "was not our heart" it says "burning within us, when he opened to us the Scriptures?". Whence therefore will you burn? Whence will "coals of fire" be found in you, who are never set on fire by the word of the Lord, never inflamed by the words of the Holy Spirit?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily09.html'
source_title="HOMILIES ON LEVITICUS 9"
