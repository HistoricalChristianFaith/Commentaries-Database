[[commentary]]
quote='''
If it be possible, as much as lies in you, having peace with all men. The Apostle knew that peace, among those between whom peace is held, consists not of one party but of both; therefore, lest another's disposition — should it happen to prove unpeaceable — should seem to hinder us from the good of peace, he gave a most measured precept: that meanwhile our own mind should always be prepared for peace, and that the fault of discord should rest not with us but with the other. But perhaps someone may say: How can it come about that we have peace with all men? And what shall we do with the Scripture which says: You saw a thief, and you ran with him, and with adulterers you set your portion? Well, therefore, did the Apostle add: As much as lies in you, that is, what accords with your purpose and your faith. For to have peace and fellowship with the wicked does not accord with our faith and our purpose — although in another place a further distinction may be drawn. For it is one thing to love men, another to love crimes. He who loves men loves the creature of God; he who loves crimes follows after the devil's inventions. Those, therefore, who are perfect love the very men in whom they hate the crimes; and while holding in hatred that in them which sins, they do not cease to love that which God created.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
