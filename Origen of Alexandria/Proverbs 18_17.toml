[[commentary]]
quote='''
But David too speaks in the same spirit in the Psalms and says: "I made known my iniquity, and I did not cover my sin. I said: I will pronounce against myself my injustice, and you forgave the impiety of my heart". You see, therefore, that "to pronounce the sin" merits the remission of sin. For the devil, forestalled in the accusation, will not be able to accuse us further, and, if we are our own accusers, it profits us unto salvation; but if we wait to be accused by the devil, that accusation turns to our punishment; for he will have companions in gehenna, whom he has convicted as companions of his crimes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily03.html'
source_title="HOMILIES ON LEVITICUS 3"
