[[commentary]]
quote='''
If there are oracles of God in the Law and the Prophets, in the Gospels and the Apostles, then whoever is being made a disciple by the oracles of God will need to inscribe God as his teacher; for "he who teaches man knowledge" is God, as it is also written in the Psalms. And the Savior too testifies that no one should be inscribed as a teacher upon the earth, saying, "And do not call anyone teacher upon the earth; for one is your teacher, the Father who is in the heavens." But "the Father who is in the heavens" teaches either by himself, or through Christ, or in the Holy Spirit, or through Paul, let us say, or through Peter, or through some other of the saints — only let the Spirit of God and the Word of God be present and teach. And for what purpose have I said these things? Because the prophet says, "Make it known to me, Lord, and I will know"; for I will not know unless you make it known to me; but if, when you make it known to me, I know, "then I will see their practices" and I will understand what each one does and of what disposition he is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily10.html'
source_title="HOMILIES ON JEREMIAH 10"
