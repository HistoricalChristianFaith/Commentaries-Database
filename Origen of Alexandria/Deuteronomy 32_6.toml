[[commentary]]
quote='''
But if the Lord himself is the creator of all things, it must be seen how here he is said to have "acquired" those which there is no doubt are his own — for it is said also in the other song, that of Deuteronomy: "Is not this same one your God, who made you and created you and acquired you?" —; for each one seems to acquire that which was not his own. Hence finally the heretics too say of the Savior that those whom he "acquired" were not his own; for, a price being given, he purchased men whom the creator had made. And it is certain, they say, that each one buys that which is not his own; for the Apostle says: "you were bought with a price."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily06.html'
source_title="HOMILIES ON EXODUS 6"
