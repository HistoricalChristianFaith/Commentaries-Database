[[commentary]]
quote='''
"Now our life is hidden with Christ; but when Christ, your life, shall be manifested, then you too shall be manifested with Him in glory." Let us hasten to this life, groaning and lamenting that we are in this tent, that we abide in the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
