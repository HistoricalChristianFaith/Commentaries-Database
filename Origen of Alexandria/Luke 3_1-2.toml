[[commentary]]
quote='''
When the prophetic word was sent to the Jews alone, Jewish kings were set at the heading. For example: "The vision which Isaiah the son of Amoz saw against Judea and against Jerusalem, in the reign of Uzziah and Jotham and Ahaz and Hezekiah"; nor do I see anyone else, apart from the kings of Judea, designated in Isaiah's time. In certain of the prophets we read also the kings of Israel, as in that place: "and in the days of Jeroboam the son of Joash, king of Israel". But when the mystery of the Gospel was to be proclaimed and the Gospel was to be spread throughout the whole world, whose herald John was in the wilderness, and the empire of Tiberius ruled the world, then "in the fifteenth year" of him "the word of the Lord" is described as having "come to John". And if salvation had had to be announced only to those who were about to believe from among the nations, and Israel had had to be wholly excluded, it would have sufficed to say: "In the fifteenth year of Tiberius Caesar, when Pontius Pilate was governor of Judea". But because from Judea also and from Galilee many were about to believe, therefore these kingdoms too are set at the heading, and it is said: "Herod being tetrarch of Galilee, and Philip his brother tetrarch of Ituraea and of the region of Trachonitis, and Lysanias tetrarch of Abilene, under the high priests Annas and Caiaphas, the word of the Lord came to John, the son of Zechariah, in the desert".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily21.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 21"
