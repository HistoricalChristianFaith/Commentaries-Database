[[commentary]]
quote='''
But after these things Balaam concludes the discourse of his prophecy in these words, saying: "And having taken up his parable, he said: Oh, oh, who shall live, when God shall do these things? And he shall come forth out of the hands of the Kittim, and they shall afflict Asshur, and they shall afflict the Hebrews, and they themselves shall likewise perish." That Balaam is said to speak through each detail by way of a parable strikes shame into the reader, lest in these things that are said he should think anything said not as in a parable, but according to the letter. He says, then: "Oh, oh, who shall live, when God shall do these things?" Here he names not this common life, but that life which is according to God, and this is what he says: that, when all these things shall come to pass, when a star shall arise out of Jacob, and a man shall rise up out of Israel and shall destroy Amalek and shall bring his seed to perdition, that is, when Christ shall come and shall destroy the worship of idols and shall subject the power of all the demons, who shall be so blessed, so happy, as to see these things? that is, who shall perceive and understand and believe that God has done these things thus? "And they shall come forth out of the hands of the Kittim, and they shall afflict the Assyrians." The Kittim are interpreted "the stroke of the end." These, therefore, who, being converted to the Lord and instructed by Christ, escape the stroke which shall come upon the impious at the end of the age, they themselves shall afflict the Assyrians, that is, these, for whom, being set in the contest of piety, God shall crush Satan under their feet, they themselves shall afflict the Assyrians, namely the nation of demons. For they shall tread upon serpents and scorpions, and upon all the power of the enemy, and shall afflict them. "And they shall afflict the Hebrews, and they themselves shall likewise perish." The Hebrews are interpreted "those passing over." This same people, therefore, is also called Hebrew, because it passes over from Egypt to the land of promise, from darkness to light, from death to life. But since these things, as we have said, cannot be obtained without a contest nor without a great struggle, as one set in the contest he now afflicts, now is afflicted, and now smites the adversary, now is himself beaten by the adversary. Therefore the Assyrians themselves also shall afflict the Hebrews, that is, the people of God, just as they are afflicted by them; but they themselves, that is the Assyrians, when they shall have done these things and when they shall have poured out all their strength upon afflicting the Hebrews, immediately they themselves also shall perish. As for what he says, then: "And they shall afflict the Hebrews, and they themselves shall likewise perish," it is not to be taken as though the Assyrians shall perish together with the Hebrews; but "likewise," that is, immediately as they shall have done these things, as they shall have afflicted the Hebrews, they themselves also shall perish; for the Greek word puts "likewise" for "immediately." This, therefore, shall be the end of all things, that even Asshur, to whom were handed over those who were transgressing from the people of God, either unto the destruction of the flesh, that the spirit might be saved, or that they might learn not to blaspheme, shall himself also perish at the hands of Him who has the power to destroy in Gehenna. For it shall be said to them by the just judge: "Go into the eternal fire, which God prepared for the devil and his angels." There, therefore, Asshur shall perish. And indeed one sheep too out of the hundred sheep once perished, but this sheep the good shepherd, leaving the ninety and nine in the mountains and descending to this valley of ours, the valley of tears, and seeking it, found it and, having laid it upon his shoulders, carried it back and joined it to that number which in the passages above remained saved. But this Asshur, who is said to be about to perish at the end of all things, I know not whether he can ever either be sought or be found; for he perishes not by error, but by judgment, nor moved by a lapse, but hardened by perseverance. For as to what is written: "I will kill and I will make to live, I will lead down into hell and I will bring back," I know not whether it looks generally to all or only to those whom the deception of the devil caused to be led down into death. Let these things too concerning the last prophecy of Balaam be said by us according to our strength, which, because of the difficulty of the passages, it has seemed good to unfold rather with the pen of one explaining than of one delivering a formal discourse. For what does it matter, provided that all things be said unto edification and all things be done unto the glory of God? Who is blessed unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily19.html'
source_title="HOMILIES ON NUMBERS 19.4"
