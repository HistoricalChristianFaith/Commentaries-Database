[[commentary]]
quote='''
But you too, who hear these things, if you attend to the holy Scriptures in your leisure, will find very many deeds of great matters contained under the number thirty or fifty. At thirty years of age Joseph is brought out of prison and receives the sovereignty of all Egypt, that by divine foresight he might drive off the ruin of the impending famine. Jesus is related to be of thirty years when He came to the baptism and "saw the heavens divided and the Spirit of God coming upon Himself in the likeness of a dove"; where also the mystery of the Trinity first began to be disclosed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily02.html'
source_title="HOMILIES ON GENESIS 2.5"
