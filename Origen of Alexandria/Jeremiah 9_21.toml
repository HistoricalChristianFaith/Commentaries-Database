[[commentary]]
quote='''
One window is one of our senses. The Bridegroom looks out through it. Another window is another sense. Through it he gazes with active concern for our well-being. For what senses are there through which the Word of God does not look out? The following example teaches us what "looking out through the windows" means and in what way the Bridegroom sees through them. Where he does not look out, there is death found coming up, as we read in Jeremiah: "See, death is come up through your windows." When you look on a woman to lust after her, death comes up through your windows.
'''
source_url='https://books.google.com/books/about/The_Song_of_Songs.html?id=Mjxy0Fl7VMsC'
source_title="HOMILIES ON THE SONG OF SONGS 2:12"


[[commentary]]
quote='''
But we may understand the windows to be the bodily senses, through which either death or life enters into the soul; for so does it signify when the prophet Jeremiah speaks concerning sinners, saying: "Death has climbed up through your windows." How does death climb up through the windows? If the eyes of a sinner should look upon a woman, and he should commit adultery with her in his heart, thus death has entered into the soul through the windows of the eyes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FBook%25203.html'
source_title="COMMENTARY ON THE SONG OF SONGS, BOOK 3"
