[[commentary]]
quote='''
One window is one sense: through this the bridegroom looks. Another window is another sense: and through this too the bridegroom carefully gazes. For through what senses does the word of God not look? But what it is to look through the windows, and how the bridegroom gazes through them, the following example will teach. Where the bridegroom does not look, there death is found climbing up, as we read in Jeremiah: Behold, death has climbed up through your windows. When you have looked upon a woman to lust after her, already death has climbed up through your windows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 2"


[[commentary]]
quote='''
But we may understand the windows to be the bodily senses, through which either death or life enters into the soul; for so does it signify when the prophet Jeremiah speaks concerning sinners, saying: "Death has climbed up through your windows." How does death climb up through the windows? If the eyes of a sinner should look upon a woman, and he should commit adultery with her in his heart, thus death has entered into the soul through the windows of the eyes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FBook%25203.html'
source_title="COMMENTARY ON THE SONG OF SONGS, BOOK 3"
