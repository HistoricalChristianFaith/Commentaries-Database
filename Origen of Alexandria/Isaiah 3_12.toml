[[commentary]]
quote='''
As individuals we have our own officers, but the whole multitude is handed over to several, according to that which is written in Isaiah: "my people, your officers plunder you, and those who are powerful lord it over you" — the officers lord it over us, if we owe anything.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily35.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 35"
