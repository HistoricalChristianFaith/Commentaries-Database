[[commentary]]
quote='''
From this we may gain an idea of how great the splendor, the beauty and the brightness of a spiritual body is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25203.html'
source_title="ON FIRST PRINCIPLES 3.6.4"

[[commentary]]
quote='''
Scripture knows a difference between those who love God and those who fear God, and it knows that those who love far surpass those who fear. Something, then, has indeed been prepared even for those who fear; yet he has prepared something greater for those who love than the things prepared for those who fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT X"
