[[commentary]]
quote='''
So too, the Gospel of the kingdom has not yet been preached in the whole world. For the Gospel is not reported to have been preached among all the Ethiopians, especially among those who are beyond the river, nor among the Seres nor among the Ariacin nor … have heard the word of Christianity. And what shall we say of the Britons or the Germans, who are around the Ocean, or among the barbarian Dacians and Sarmatians and Scythians, of whom very many have not yet heard the word of the Gospel, but are to hear it at the very consummation of the age? For consider what he says: and this Gospel of the kingdom will be preached in the whole world as a testimony to all the nations, and then will be the end. But if anyone wishes rashly to say that the Gospel of the kingdom has already been preached in the whole world as a testimony to all the nations, one will consequently be able to say to him that, as regards what he says, then will be the end, the end has already come — which to say is a mark of great rashness and of a man not understanding what Paul says to the Thessalonians in his second epistle, saying: "Let no one deceive you in any way (as though the day of the Lord were at hand); for unless the falling-away come first and the man of sin be revealed, the son of perdition (and the rest), the day of the Lord will not be".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252024.html'
source_title="COMMENTARY ON MATTHEW 39"
