[[commentary]]
quote='''
To the rule of Ehud the ambidextrous is joined the rule of Shamgar. But let us see how Ehud, who is interpreted "praise," brought his rule to a close. The narrative has taught us those things which are written concerning Eglon the king, how this most wise Ehud, using a certain artifice and, so to speak, a cunning but praiseworthy deception, slew Eglon the tyrant, who is interpreted "whirling" or "of the wheel-track." Such, then, ought the judges of our people also to be, as was that Ehud who is interpreted "praise," so that they may cut down all the whirling motions and wheel-tracks of the evil path and destroy the king of the Midianites. Now the Midianites are interpreted "flowing" or "outpouring." Who, then, can be seen or understood to be the prince or leader of this fluid and dissolute nation, other than the discourse of that philosophy which judges pleasure to be the highest good — whom the Gospel discourse, which is compared to a sword, may slay and destroy? And let the prophetic word itself be shut up in their belly and in the innermost vitals by the disputations of the "ambidextrous" teacher, so that, confining them by the assertion of truth, he may extinguish every "thought" of a depraved doctrine and gross understanding "that exalts and raises itself up against the spiritual knowledge of Christ"; so that, doing thus and contending in the word of God, each judge of the Church may himself also become that praiseworthy Ehud, of whom the Lord may say: "Well done, good and faithful servant, thou hast been faithful over a few things, I will set thee over many things".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily04.html'
source_title="HOMILIES ON JUDGES 4"
