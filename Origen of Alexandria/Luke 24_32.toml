[[commentary]]
quote='''
By which is implied, that the words uttered by the Saviour inflamed the hearts of the hearers to the love of God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Do you want me to show you how the fire goes out from the words of the Holy Spirit and ignites the fire the hearts of believers?… And again in the Gospel it was written, after the Lord spoke to Cleopas, "Did not our hearts burn within us while he talked to us on the road, while he opened to us the Scriptures?" Where will your burning come from? What "coals of fire" will be found in you who are never set on fire by the declaration of the Lord, never inflamed by the words of the Holy Spirit? Hear also in another place David himself saying, "My heart became hot within me. As I mused, the fire burned."
'''
source_url='https://www.google.com/books/edition/Homilies_on_Leviticus_1_16/Eo9Da7xaBuUC?hl=en&gbpv=1&dq=homilies+on+leviticus+origen&printsec=frontcover'
source_title="HOMILIES ON LEVITICUS 9.9.7"


[[commentary]]
quote='''
Whence it is shown that we must not only apply zeal to learning the sacred letters, but must also entreat the Lord and "day and night" beseech him, that the Lamb "from the tribe of Judah" may come and himself, taking the "sealed book," may deign to open it. For he it is who, "opening the Scriptures," kindled the hearts of the disciples, so that they said: "was not our heart burning within us, when he opened to us the Scriptures?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily12.html'
source_title="HOMILIES ON EXODUS 12"
