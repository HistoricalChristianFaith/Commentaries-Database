[[commentary]]
quote='''
If, then, he says that first I sent away Israel because of its sins and sent it into deportation, but Judah, hearing what had happened to Israel, did not turn back, he speaks concerning our own sins. Since the things that befell Israel are read, and the transgressions concerning that people, we ought to fear, and: "if he did not spare the natural branches, how much more will he not spare us either; if that One who is both kind and at the same time loving to mankind, God, did not spare but cut off those who boasted to be a 'cultivated olive tree,' those rooted in 'the root' of the patriarchs Abraham and Isaac and Jacob, how much more will he not spare us." For he is not kind and yet not severe, nor severe and yet not kind. For if he were only kind but not severe, we would to a greater degree despise "his kindness." If he were severe but not kind, perhaps we would even despair over our sins. But as it is, as God — for we human beings need his kindness when we repent, but his severity when we persist in our sins — God is both kind and severe, and he speaks to us through the prophets and says: "Have you seen what the house of Israel has done to me?" Understand that Israel to be that people of mine: "She went up upon every high mountain and beneath every shady tree." If you see the Pharisee going up into the temple boastfully and not beating his own breast nor being anxious about his own evils, but saying: "I thank you that I am not as the rest of mankind, robbers, unjust, adulterers, or even as this tax-collector; I fast twice on the sabbath, I tithe my possessions" — you will see that he has gone up "upon every high mountain" in a blameworthy manner, having loved high-mindedness, and, according to his boasting and according to his arrogance, upon every high hill, and he has come to be "beneath every tree" that is not fruitful, but "leafy"; for the leafy tree is one thing, and another is the tree that men plant into groves. When they plant trees into groves, they plant not the fruit-bearing ones, not a fig tree nor a vine, but only barren trees for the sake of delight. Such you will find the words of the heterodox and the beauties of their persuasive arguments, which do not turn back those who hear. Whenever, then, someone gives himself over to such words, he has gone "beneath every leafy tree." He did not say "every tree" and fall silent, nor again did he add: every fruitful tree, but he said "beneath every leafy tree." Because of this you will understand what indeed the lawgiver means when he says: "You shall not plant any tree beside the altar of the Lord your God, and you shall not make a grove"; for you have also the very name of the grove forbidden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily04.html'
source_title="HOMILIES ON JEREMIAH 4"
