[[commentary]]
quote='''
I would like to know how the saints cry out to God without a voice. The Apostle teaches that: "God gave the Spirit of his Son into our hearts, crying: Abba, Father!" And he adds: "the Spirit himself intercedes for us with unutterable groanings." And again: "but he who searches the hearts knows what the Spirit desires, because he asks for the saints according to God." Thus, then, when the Holy Spirit intercedes with God, through the silence of the saints a cry is heard.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily05.html'
source_title="HOMILIES ON EXODUS 5"
