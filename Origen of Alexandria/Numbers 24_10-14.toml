[[commentary]]
quote='''
We now take up in hand the fourth of these prophecies which Balaam spoke in the word of God, wishing to open up, concerning this one too, whatever God may grant. To this prophecy, however, there were prefixed in the introduction things similar to those above. For it says: "And Balak was angry with Balaam, and clapped his hands together; and Balak said to Balaam: I called you to curse my enemy, and behold, blessing you have blessed him three times. Now therefore flee to your own place; I said: I will honor you, and now the Lord has defrauded you of honor." In these words he shows that Balak too understood that Balaam was no longer being deceived by the ministry of demons, but was being carried over to better things by the power of God, and therefore he says: "The Lord has defrauded you of honor." But passing quickly over these things, which are plain, let us come to what follows. "And Balaam said to Balak: Did I not also speak to your messengers whom you sent to me, saying: If Balak should give me his house full of silver and gold, I shall not be able to transgress the word of the Lord, to do it, whether good or evil, of my own accord? Whatever God shall say to me, this I shall speak. And now behold I return to my place." Balaam, knowing that responses were not brought to him through the accustomed ministers, but from Him who has power over all, rightly is seen to have protested that he could not transgress the word of the Lord and do it, whether small or great, of his own accord. For the one who spoke to him was not one who could be changed by sacrifices and gifts, but was one with whom there is no change nor shadow of change. And therefore the prophet cannot be altered by a fee, where God is not moved by gifts. Yet as he is about to depart, Balaam begins again to prophesy, and says: "Come, I give you counsel, what this people shall do to your people in the last days." And taking up his parable he said. But before we come to the explanation of the things which have been prophesied, I would like to inquire what this sense is, or what the order of the words is, in that he says: "Come, and I give you counsel." And indeed he seems to give no counsel, but says what this people is about to do to your people in the last days, whereas it would surely have seemed more fitting if it had said: "Come, I prophesy to you what this people is about to do to your people in the last days"; and it would surely follow as a consequence that Balaam would seem to prophesy about those things which the people of Israel were about to do to the people of Balak or to the rest of the nations, and that he would do it in power, so as to leave none of the cities of Moab that would be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily18.html'
source_title="HOMILIES ON NUMBERS 18.1"
