[[commentary]]
quote='''
And so you must beware and exercise great care in order to discern with knowledge the kinds of visions, just as Joshua the son of Nun, when he saw a vision and knew there was temptation in it, immediately asked the one who appeared to him and said, "Are you for us, or for our adversaries?" So, then, the soul progresses when it comes to the place where it begins to distinguish between visions; and it is proved to be spiritual if it knows how to discern them all. That is why, as well, one of the spiritual gifts, given by the Holy Spirit, is mentioned as "the ability to distinguish between spirits."
'''
source_url='https://www.google.com/books/edition/Homilies_on_Numbers/P4pPyRXeWkUC?hl=en&gbpv=0'
source_title="HOMILIES ON NUMBERS 27.11"


[[commentary]]
quote='''
"And it came to pass," it says, "when Jesus was at Jericho, that looking up with his eyes he saw a man standing over against him, and a drawn sword was in his hand. And Jesus, drawing near, said to him: are you ours, or of our adversaries? And he said: I am the prince of the host of the Lord's power; now I have come." "Looking up," then, "with his eyes he sees the prince of the Lord's host," as one who had not "looked up" before, but only then, when he was about to see the "prince of the Lord's host." Yet when Jesus had seen him, he did not see him as a common man, but understood that he was a certain power. Nevertheless he is not yet certain whether the one who appears is one from the divine powers or from the contrary ones, and therefore he asks and inquires, saying: "are you ours, or of our adversaries?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily06.html'
source_title="HOMILIES ON JOSHUA 6.2"
