[[commentary]]
quote='''
Sisera, together with his army and his "iron chariots", with which he was assailing the people of God, was overcome, as prophecy had foretold would come to pass through Deborah. And after the victory was accomplished "by the hand of a woman", Deborah is recorded to have sung this song as, so to speak, the very praise of that victory. But if we remember the things that were said in the earlier passages — namely, according to the mystical pattern, what figure Deborah is, and Barak likewise, what image the woman Jael holds, who alone cast down the adversary of God's people, what image Sisera himself is, who was laid low by a foreign woman through the power of wood — we understand that all these are sacraments which are brought to completion in the last times and at the end of the age through the Church, and that in this song is described, as it were, its triumph-song, that is, the praise of the victory, of that time namely when "the last enemy, death, shall be destroyed". For then Deborah shall exult, that is, the glory of prophecy shall be made illustrious, because the things which she foretold have been fulfilled. Then Jael the Church shall overcome the common enemy of all, and, "after the fullness of the nations has entered in", then Barak too, that is, "the remnant of Israel shall be saved" and shall be received into fellowship of the victory. Then therefore, if we have been worthy, we too shall sing this song filled with mystical and prophetic sacraments; and since to examine everything of it point by point is not for the time available — for the hearers of the Church love brevity — yet, discoursing on a few things either of its beginnings or picking out here and there little flowers from it, we shall try to bring some consolation to the hearers, or at least to train and exercise ourselves, that we may be made fit to sing out Deborah's song.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily06.html'
source_title="HOMILIES ON JUDGES 6"

[[commentary]]
quote='''
"In the beginning, when the princes were in Israel, in the free wills of the people, bless the Lord". The blessing, he says, with which "we bless the Lord", let it be "in the outset of the princes in Israel", and then afterwards also "in the free wills of the people". For example, when we first begin to come to the worship of God, when we receive the beginning of the word of God and of heavenly teaching, these beginnings must be taken up by us from the "princes of Israel". And by "princes of Israel", that is, of the Christian people, I think we must understand the "angels", whom the Lord says are present to each "least one" in the Church, who are also said "always to see the face of the Father who is in heaven". They therefore are the "princes", and from them our beginnings must be taken. For example, if a boy goes to school, he is indeed received by the master and becomes the pupil of that teacher, but he does not immediately take the outset of his learning from the teacher himself; rather, when he has received from him only the first elements, he is handed over to others to be instructed — to the, so to speak, princes of the school itself; so that, when he has been taught by them, as far as lies in them, and has laid down among them his first rudiments, then at last he may receive also the more perfect precepts of the teacher himself. So therefore even now, recalling the beginnings of our instruction, prophecy says that, when we have begun from the "princes" or the "princes" have begun to work in us, then we should follow on with our own will and purpose, and, increased by our advances, come thus at last to blessing the Lord himself. But see what it says: "in the beginning", it says, "the princes in Israel". It is the "beginnings" that are said to be helped by the "princes"; but after these one must strive by one's own will and purpose, that we may deserve to bless the Lord. For the people of Israel too, when they were beginning to go out from Egypt and to cross the Red Sea, did nothing by their own labor, but everything was done through the princes, that is, through the angels. Indeed, Moses too says thus to the people: "you", he says, "shall keep silence, and the Lord shall fight for you". Or is not the "destroying" angel plainly described as having fought for them — the angel who slew the firstborn of the Egyptians, but of the Israelites did not make even a beast to mutter? But we must not always wait for the angels to "fight for us", but only "in the beginning", that is, in our beginnings, are we helped by the "princes", the angels. For the rest, with the progress of time it behooves us also to go out ourselves, armed for the battles. For before we learn wars, before we practice to fight the battles of the Lord, we are lifted up by the "princes", the angels; before we obtain the provision of "heavenly bread" and are filled with the flesh of the "spotless lamb", before we are made drunk with the blood of the "true vine" which came up from the root of David, so long as we are "little ones" and are nourished with "milk" and hold to the word of the beginnings of Christ, we act, like "little ones", "under guardians and stewards", the angels. But when we have now tasted the sacraments of "the heavenly warfare" and have been refreshed with the "bread of life", hear how we are roused to battle through the apostolic trumpet. For with a mighty voice Paul cries out to us, saying: "put on the armor of God, that you may be able to stand against the wiles of the devil". He no longer allows us to lie hidden under the wings of "those who give suck"; he invites us to the fields of combat: "put on", he says, "the breastplate of charity", and "take" likewise "the helmet of salvation", and also "the sword", he says, "of the spirit", and above all "the shield of faith, with which", he says, "you may be able to extinguish all the fiery darts of the evil one". You see, then, how all things are done in order, and nothing confused is carried on among the people of God, nothing disordered or done in reverse. "In the beginning the princes" help; when you have been helped and instructed by the princes, now do for yourself, of your own accord and by your own will, the things you have learned from the princes. For rightly, when the beginnings have been digested and the rudiments laid down, we are committed to our own will, so that either the praise may deservedly be ours, which was gained by our own virtue, or the fault may justly be ours, which came through our own sloth. So much for that which is written: "in the beginning, when the princes were in Israel, in the free wills of the people, bless the Lord".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily06.html'
source_title="HOMILIES ON JUDGES 6"
