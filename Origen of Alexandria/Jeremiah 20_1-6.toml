[[commentary]]
quote='''
…of the mind of the Scripture, which comes to be present to an eye that has room for the clarity of the sacred writings. These things I have said by way of preface, rousing and awakening both myself and my hearers to attend to what has been read, so that we may ask Jesus to come and to appear to us and to teach us now the things written here.

"Jeremiah prophesied; and Paschor son of Emmer the priest heard the words of the prophecy." And although in all likelihood many, so far as the mere sequence of the prophecy goes, had heard Jeremiah, no other hearer is quickly recorded except Paschor. But the Scripture took care to say also whose son he was, that he was son of Emmer, and that he held the office of priest, and what rank he had among the people—that he had been appointed governor of the house of the Lord at the time when Jeremiah was prophesying these words. And it is recorded that, having heard the words of this prophecy, Paschor struck Jeremiah; and he was not content with having struck him, but he also cast him into a certain dungeon (katarraktēs). The Scripture took care to say also where this dungeon was—at the gate of Benjamin—and that the dungeon was in a place where there was an upper chamber, and an upper chamber of nothing else than of the house of the Lord. These things the Holy Spirit recorded to have come upon Jeremiah in connection with the prophecy, and to have come from Paschor. Then it says: on the next day Paschor brought Jeremiah out of the dungeon. And Jeremiah, having been brought out, said to Paschor that the Lord had not called your name this name, Paschor; another name has been laid upon you—as to Jacob Israel, as to Abram Abraham, as to Sarai Sarah, so upon you he has laid the name Exile (Metoikos). And for this reason he has called you Exile, since the Lord says: behold, I give you into exile with all—with whom? not with your wife and your sons and your daughters, but with your friends. And when you are given into exile, your friends shall fall by the sword. Then, as though there were a difference for those who fall by the sword—whether they fall by the sword of enemies or by the sword of others—he says that the friends of the one who cast Jeremiah into the dungeon shall fall by the sword of their enemies. And your eyes, he says, shall see these things that are prophesied. And I will give you and all Judah into the hands of the king of Babylon, after your friends have suffered these things, and they shall deport them to Babylon and cut them down; for the king of Judah and those of Judah they shall cut down with the sword, and no longer is "of their enemies" added, as in the case of the former, who are said to be friends of Paschor. Then it says: and I will give all the strength of this city and all the treasures of the king of Judah and all the labors of this city into the hands of their enemies, so that the enemies may plunder the treasures and take the aforesaid things and lead Judah and its king away to Babylon. But you, O Paschor, and all who dwell in your house, shall go into captivity to Babylon, and there you shall die, and there you shall be buried, you and all your friends to whom you prophesied lies. It was necessary both to cut short the whole passage and to make it clear—not yet its deep meaning (if indeed we have room for it), but rather the wording and the plain sense itself, which even any ordinary person who attends carefully to the writings and not in a perfunctory way can, even so, understand. What then do these things intend? Here the struggle is to set forth the intention of these writings. And indeed I confess for my own part that I am unable to expound them, but that I need, as I said before, the appearing of the power of Jesus—inasmuch as he is Wisdom, inasmuch as he is Word, inasmuch as he is Truth—so that his appearing may make light upon the face of my soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Jeremiah%2FHomily19.html'
source_title="HOMILIES ON JEREMIAH 19"
