[[commentary]]
quote='''
It seems to me that each utterance of divine Scripture is like some kind of seed, whose nature is this: that when it has been cast into the earth, it is regenerated into an ear of grain or into whatever other form of its own kind, and is spread abroad manifold — and the more abundantly, the more either a skilled farmer expends greater labor upon the seeds, or grants the benefit of more fertile soil. So then it comes about that by diligent cultivation a tiny "seed", for example "of mustard, which is the least of all, becomes greater than all herbs and turns into a tree, so that the birds of heaven come and dwell in its branches". So too this utterance, which has now been read to us from the divine volumes, if it finds a skilled and diligent husbandman — though at first touch it may seem meager and brief — once it begins to be cultivated and to be handled with spiritual art, grows into a tree, spreads out into branches and into shoots: so that there can come "the disputers and rhetoricians of this world", who like "the birds of heaven" with light wings, that is, with mere pomp of words, pursue lofty and steep things, and, captivated by the reasonings, wish to dwell in these branches, in which there is no elegance of speaking but a rule of living.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily01.html'
source_title="HOMILIES ON EXODUS 1"
