[[commentary]]
quote='''
After this a history is related, both marvelous in its narration and magnificent in its meaning. For it is set down how God said to Moses that he should go up onto the mountain, and there, when he had looked out from it and gazed upon the whole land of promise, there he should die. But he, who bore the care of the people more than of himself, prays to the Lord that he provide a man to rule the people: let not this congregation, he says, become like sheep which have no shepherd. See therefore, first of all, how he who is perfect and blessed dies not in a valley nor on any level of ground nor on some hill, but on a mountain — that is, in a high and steep place. For the consummation and perfection of his life was held in the height. And he is commanded also to behold with his eyes the whole land of promise, and diligently to survey all things from an eminent station. For it was fitting that to one about to attain the summit of perfection nothing should remain unknown, but that he should have knowledge of all things that are seen and heard; for this reason, I believe, that of all things which, placed in the flesh, he had grasped by bodily sight, being made in the spirit and with a bare mind, hastening to the audience-halls and discipleship of wisdom, he might swiftly attain their reasons and causes. For what usefulness would seem to appear in this, that to one departing from the world and about to receive forthwith the end of this life there should be shown lands and places of which he would neither undergo the labor nor receive the benefit? The saying which follows truly terrifies me and renders me timid and trembling to speak, in that concerning that great Moses, servant and friend of God, to whom God spoke face to face, through whom signs and wondrous powers were wrought, things so grave, so perilous are related. For what does God say to him? And you shall be gathered, he says, to your people, even you, as Aaron your brother was gathered on Mount Hor. And as though setting forth the cause of his death, he says: because you transgressed my word in the desert of Zin, when the congregation resisted, so that it did not sanctify me. You did not sanctify me at the water before them. Is then Moses too at fault? He too incurs the charge of transgression; he too was made under sin. For this reason, I believe, the Apostle said with confidence: death reigned from Adam until Moses; for it came even unto Moses and did not spare even him. And therefore, I think, he said: sin entered into this world, and through sin death, in that all sinned; and again: God has shut up all under sin, that he may have mercy on all. But thanks be to our Lord Jesus Christ, who freed us from the body of this death, so that, where sin abounded, grace might more abound. For how could Moses have freed anyone from sins, when it is said even to himself: you transgressed my word in the desert of Zin, and you did not sanctify me at the water before the children of Israel? — so that it may be manifest to all that he alone must be sought who alone did no sin, nor was guile found in his mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily22.html'
source_title="HOMILIES ON NUMBERS 22.3"
