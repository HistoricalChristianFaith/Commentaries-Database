[[commentary]]
quote='''
Now let us already see what things he says in what follows: "How good," he says, "are your houses, O Jacob, your tents, O Israel! Like shady groves, like gardens beside rivers, and like the tents which the Lord has pitched, like cedars beside the waters." When he calls the houses of Jacob good, I do not think that he is praising their earthly dwellings; for nothing of such a kind among them, beyond the other nations, is recorded. But let us see whether perhaps, since the people was divided by tribes, and each single tribe was apportioned by clans, and again the clans by kindreds, and the kindreds by the houses of families, and again the houses of families were numbered by the number of names and by heads—that is, everyone who was from twenty years and above, a male able to go forth to war—it is these houses that Balaam, beholding them in the spirit, magnifies and extols. But the meaning is not to be contemplated in these things by the letter alone, since indeed what Balaam speaks he speaks having taken up his parable. In parables, therefore, let us too hear what is said. For if you consider those divisions and orders of the peoples which will exist in the resurrection among the people of the true Israel, when each one shall rise in his own order, if you are able to behold those tribes and clans and kindreds in which there is not so much the kinship of flesh and blood as of mind and soul, then you will understand how good are the houses of Jacob and how good the tents of Israel. But if you should also inquire into the difference between houses and tents, and the diversity between Jacob and Israel, concerning this too some such distinction is to be maintained. A house is a thing founded and stable and enclosed by fixed boundaries; but tents are certain dwellings of those who are always on the way and always walking and have not found the end of their journey. Therefore Jacob is to be understood in the persons of those who are perfect in acts and in work; but Israel are to be understood those who bear a zeal toward wisdom and knowledge. Since, then, the exercises of works and deeds are closed by a fixed end—for the perfection of works is not without an end—when someone has fulfilled all that he ought to do and has come to the end of the perfection of works, that very perfection of works will be said to be his good houses. But of those who apply themselves to wisdom and knowledge, since there is no end—for what will be the limit of God's wisdom? where, the more one has drawn near, the more profound the things he will find, and the more one has searched, the more he will find them ineffable and incomprehensible; for incomprehensible and inestimable is the wisdom of God—for that reason, of those who walk the way of God's wisdom he does not praise houses, for they have not arrived at an end, but he admires tents, in which they always walk and always advance, and the more they advance, the more the way of advancing is enlarged for them and stretches out into the immeasurable; and therefore, beholding through the spirit these very advances of theirs, he names them the tents of Israel. And truly, if anyone has taken up some advances in knowledge and has drawn some experience in such things, he knows assuredly that, when he has come to some contemplation and recognition of spiritual mysteries, there the soul tarries as if in a certain tent. But when out of the things he has found he searches out yet others and advances to other understandings, then, as if his tent had been raised, he stretches toward the higher things and there sets the seat of his soul, fixed by the stability of his senses; and thence again out of these very things he finds other spiritual senses, which without doubt the consequence of the former senses has laid open; and thus, always extending himself to the things before, he seems to march by certain tents. For there is never a time when a soul kindled by the little fire of knowledge can be idle and at rest, but it is always called forth from good things to better and again from better things to higher. This way, then, of God's wisdom he has described graciously enough and with much elegance, saying: "like shady groves, and like gardens beside rivers, and like the tents which the Lord has pitched, like cedars beside the waters." For those who walk this way walk through shady groves; for the groves that give them shade are the whole company of the just and the choir of the holy prophets. For under the shade of the meanings which they find written among these, their souls are refreshed, and, as it were walking through the shade of the groves, they are delighted in their teachings. These men also find gardens beside rivers, like and akin to that garden in which is the tree of life. And by the rivers we can understand either the Gospel and apostolic Scriptures, or even the aids of the angels and heavenly powers toward souls of this kind; for they are watered and flooded by them and are nourished unto all knowledge and recognition of heavenly things—although our Savior too is a river, who "gladdens the city of God," and the Holy Spirit is not only himself a river, but also, for those to whom he has been given, "rivers proceed from their belly"; and God the Father says: "They have forsaken me, the fountain of living water," from which fountain, namely, those rivers proceed. Flooded, therefore, with these rivers, the tents of Israel become tents such as those which the Lord has pitched. But perhaps it may move the attentive hearer that the present discourse mentions two kinds, as it were, of tents. For he says: "How good are your houses, O Jacob, your tents, O Israel! like shady groves, and like gardens beside rivers," and again he compares tents to tents and says: "and like the tents which the Lord has pitched." Therefore, after those we brought forward above, another exposition too can be received, so that we may say that the houses of Jacob are the law and the tents of Israel are the prophets. For he praises not Jacob himself, but his houses, nor Israel himself, but his tents; and he praises them then, when his eyes have been uncovered. For as long as a veil is placed over the reading of the law and the prophets, the tents are not seen to be good nor the houses praiseworthy. But when the veil has been taken away and the law has begun to be understood as spiritual, and the prophets likewise, then good and wonderful are the houses of Jacob; and then the tents of Israel will be admirable, when, the letter which kills being removed, you have begun to perceive from them the life-giving spirit. It can still be understood in yet another way, so that the bodies and souls of this believing and perfect people, which has been gathered by Christ from among the nations, seem to be praised together, and the house of Jacob is said of the bodies, just as also in a certain little book it is read that Jacob is the house of Israel—that is, that his body is called Jacob and his soul Israel. In like manner, therefore, the bodies also of all the perfect are said to be praiseworthy houses. For the body is a praiseworthy Jacob, when it is adorned with continence and chastity, and sometimes also with martyrdom. But the tents can be referred to perfect souls, to which the name Israel too fits, from seeing God. But these tents are, he says, "like shady groves, and like gardens beside rivers, and like the tents which the Lord has pitched." Therefore he shows that there are other tents which the Lord has pitched, to which the tents of Israel are like. It befits me to go forth outside this world, in order that I may see what are the tents which the Lord has pitched—those, no doubt, which he showed to Moses, when he was building the tabernacle in the desert, saying to him: "See," he says, "that you make all things according to the type which was shown you on the mountain." Therefore, in imitation of these tents which the Lord pitched, Israel ought to make tents, and each one of us to prepare and construct his own tent. Hence it seems to me not to have happened by chance that Peter indeed and Andrew and the sons of Zebedee were found fishermen by trade, but Paul a tentmaker by trade. And since those, called from the trade of catching fish, are changed and become fishers of men, the Lord saying: "Come after me, and I will make you fishers of men," there is no doubt that Paul too, since he also was called an Apostle through my Lord Jesus Christ, was changed by a similar transformation of his trade, so that, just as they from fishers of fish were made fishers of men, so this man too was transferred from making earthly tents to constructing heavenly tents. For he constructs heavenly tents, teaching each one the way of salvation and showing the road of the blessed mansions in the heavens. Paul makes tents when, from Jerusalem round about as far as Illyricum, he fills up the Gospel of God by constructing churches; and in this manner he too makes tents after the likeness of the heavenly tents which God showed to Moses on the mountain. But each one of us also, if indeed he has gone forth out of Egypt and dwells in the desert, ought to dwell in a tent and to keep the festal day in tents. For just as commemoration is made of the going out of Egypt through the Passover and the unleavened bread, so also memory is made of the sojourn in the desert through tents; for in tents our fathers dwelt in the desert. And from what should these tents be made, except from the words of the law and the prophets, from the discourses of the Psalms and of all that is contained in the law? For when out of the things that have been written the soul advances, and always indeed, forgetting the things that are behind, stretches itself to the things that are before, and, progressing from a lower place, grows and advances to the higher, from the increase of virtues and from the very changing of its advances it will deservedly be said to dwell in tents. But see whether the tents which God has pitched are not also those which the Savior mentions in the Gospel, saying: "Make yourselves friends of the mammon of iniquity, so that, when you fail, they may receive you into eternal tents." And they are said to be pitched by God, as those which are not carried about by every wind of doctrine. But these tents are still also "like cedars beside the waters." He does not here call cedars those in which a blameworthy loftiness is marked, but the cedars of God, which receive the branches of that vine which was transplanted from Egypt, and in which rests that fruit "whose shade covered the mountains." If you have understood how great a rest the way of wisdom has, how much grace and how much sweetness, do not disregard it, do not neglect it, but set out upon this way and do not shudder at the solitude of the wilderness. For as you dwell in tents of this kind, the heavenly manna too will meet you, and you will eat the bread of angels. Only begin, and let not the solitude of the desert, as we have said, terrify you. Soon into your company the angels also will come, whom I judge to be indicated under the appearance of the cedars.
'''
