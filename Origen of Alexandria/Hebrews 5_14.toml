[[commentary]]
quote='''
For in the words of the Song of Songs there is that food of which the Apostle speaks: "But solid food belongs to the perfect" … And indeed the little ones whom we have mentioned, if they should come to these passages, it may be that they will gain nothing from this Scripture, yet neither will they be greatly harmed … For, not knowing how to hear the names of love with pure and chaste ears … For this reason, therefore, I give warning and counsel to everyone who is not yet free from the troubles of flesh and blood … that he abstain wholly from the reading of this little book … For they say that among the Hebrews this too is observed: that unless a man has arrived at a perfect and mature age, he is not even permitted to hold this little book in his hands … together with those which they call deuteroseis, these four things are reserved to the last — that is, the beginning of Genesis … and the beginnings of the prophet Ezekiel … and the end, in which the building of the temple is contained; and this book of the Song of Songs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"
