[[commentary]]
quote='''
Finally, he sets forth in what follows how great is the power of charity. For he who loves his neighbor, he says, has fulfilled the law. For: You shall not commit adultery, you shall not kill, you shall not steal, you shall not bear false witness, you shall not covet; and if there is any other commandment, it is summed up again in this word: You shall love your neighbor as yourself. And at the last, gathering up briefly the reason for so great a good, he says: The love of one's neighbor works no evil; therefore love is the fullness of the law. Above he had said that he who loves his neighbor has fulfilled the law; and because it seemed difficult how anyone could fulfill the whole law in a single utterance, he renders the fullest account, saying: The love of one's neighbor works no evil, and therefore love is the fullness of the law. For set love alongside each single commandment of the law, and see how easily they are all fulfilled. Can he who loves his neighbor possibly kill him? It is certain that no one kills the person he loves. Love, then, is that by which the commandment is fulfilled which enjoins: You shall not kill. And again, does he who loves his neighbor commit adultery with his wife? Assuredly never. If, therefore, you love your neighbor, neither will you commit adultery. Likewise too, he who loves his neighbor does not steal what belongs to him; and he who loves his neighbor does not speak false witness against him. Likewise the remaining commandments of the law also, if there be love toward one's neighbor, are kept without any labor. Yet I think that in this too the Apostle wished us to learn something by a shorter road. For if you inquire more diligently who our neighbor is, you will learn in the Gospel that he is our neighbor who came, and, when we lay wounded by robbers and stripped bare by demons, set us upon the beast of his own body, and carried us to the inn of the Church, and granted to the innkeeper (whether to Paul himself, or to everyone who presides over the Church) the two denarii of the New and Old Testament for the expenses of our care and attendance. If, then, we love this neighbor, we fulfill the whole law and all the commandments in love of him. For Christ is the end of the law unto righteousness for everyone who believes; nor can it come about by any means that one who loves Christ with his whole heart and with all his inward parts should do anything that does not please Christ. For he who loves him not only does not kill him, which the law forbids, but does not even grow angry with his brother. He who so delights in the one he loves not only does not commit adultery, but does not even look upon a woman to lust after her; but says rather to him: My soul covets and faints for the living God. He who loves Christ, how should he think about theft, who even leaves behind all his own possessions, whatever he has, in order to follow Christ? He who loves Christ, when does he speak false witness, since he knows that the very one whom he loves was betrayed by false witness? And necessarily he who loves Christ also loves his neighbor. For by this sign alone is one marked out as a disciple of Christ, if he has charity toward his neighbors. For it is certain that he who does not love his neighbor does not know Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
