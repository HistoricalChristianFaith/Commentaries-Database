[[commentary]]
quote='''
To be free from all things belongs to a perfect apostle. For someone can be free from fornication but a slave to anger, free from love of money but a slave to vainglory; he can be free from one sin, but a slave to another sin. But to say Being free from all belongs to a perfect apostle; such as Paul was.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XLIII"
