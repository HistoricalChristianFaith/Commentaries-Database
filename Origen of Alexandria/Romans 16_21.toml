[[commentary]]
quote='''
Timothy my helper greets you, and Lucius, and Jason, and Sosipater my kinsmen. It seems to me that concerning these men, whom he set apart from the whole catalogue of those sending greetings, he had something more in mind. For he calls Timothy his helper, and all of them together his kinsmen. And indeed concerning Timothy it is reported very fully in the Acts of the Apostles that he was a citizen of Derbe, the son of a believing widow, by a Gentile father; of whom Paul himself also says that for this reason he had asked him to remain at Ephesus, so that he might charge certain persons not to teach otherwise, nor to give heed to fables and endless genealogies. And some maintain that Lucius is that same Luke who wrote the Gospel, on the ground that names are customarily pronounced sometimes according to the inflection of the native tongue, sometimes according to the Greek and Roman. Jason, moreover, is that man of whom it is also written in the Acts of the Apostles that at Thessalonica, when the crowds were stirring up a riot against Paul and Silas, he gave himself up, so as to secure for the apostles the freedom to depart. Sosipater too, who is joined with these, I suspect to be the very man who is described in the Acts of the Apostles as Sosipater son of Pyrrhus, of Beroea. But one who considers Paul's letters rather carefully, as though Christ were speaking in him, will doubtless be troubled at how Paul — who declared himself born at Tarsus in Cilicia, a Hebrew of the Hebrews — is now said to be the kinsman or blood relation either of Timothy, a citizen of Derbe by a Gentile father, or of Jason of Thessalonica, or of Sosipater son of Pyrrhus of Beroea. But if in defense of this someone should say that these men too came in some measure from the circumcision, then he ought not to have spoken of these in particular, but of all who were of the Jews, that they were kinsmen of Paul. As it is, however, since he by no means grants this title to the rest, but assigns it to these and to a few others, it is certain that he is naming some other kinship, one which he holds in common with Timothy and Luke and a few others like them; and this kinship or blood relation he doubtless knows to descend to him along with them from that fatherhood of which he says in another place: For this cause I bend my knees to the Father of our Lord Jesus Christ, from whom every fatherhood in heaven and on earth is named. Knowing, therefore, that there is a certain fatherhood in heaven just as there is on earth, it is certain that those who are in no way joined to him according to the kinship of an earthly fatherhood, he knew to be joined to him according to the kinship of the heavenly fatherhood. And for this reason he calls them kinsmen, and fellow captives, and helpers — inasmuch as with them he had received by the lot of birth a single kinship for preaching the gospel, and for enduring the captivity of the Babylon of this world. Or, if anyone will not allow these things to be explained by some such figurative reading, let him explain to us how Timothy and Lucius and Jason and Sosipater, citizens not only of far different cities but even of different provinces, could have been kinsmen and blood relations of Paul according to the flesh — and not only these, but also Andronicus and Junias and Herodion, all of whom he calls both his kinsmen and his fellow captives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
