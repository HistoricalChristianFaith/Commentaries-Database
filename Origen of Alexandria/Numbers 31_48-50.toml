[[commentary]]
quote='''
That there are differences of progress and of merits among the people of the faithful, anyone who attends more carefully to the reading will discover in many places in the divine volumes. And we gather this no less from the present reading also, from what is written: "And there came to Moses all who had been appointed leaders throughout the tribes in the army, commanders of thousands and commanders of hundreds. And they said to Moses: We your servants have gathered the sum total of our men of war, and not one of us was missing; and we have offered a gift to the Lord, each man whatever vessel of gold he found, a collar or a bracelet or a ring or an armlet or a little chain, to make propitiation for ourselves before the Lord." The chosen leaders, then, who had been appointed over the army, speak to Moses and, for their deeds well done, offer gifts to God, saying: "We are your servants, who have received the sum total of the warrior sons of Israel." Now by the sum total of the warriors they mean those twelve thousand men who were chosen out of all the tribes of Israel to do battle against the Midianites. There are, then, among the people of God many warriors, and there are also very many who are unfit for war; and again among the warriors there are certain ones who are called the sum total of the warriors, more eminent without doubt than those who are called warriors, just as the warriors too are more eminent than those unfit for war. And again there are some loftier than those who are called the sum total of the warriors, namely those who have been appointed leaders over them and set in command over each individual thousand of the chosen ones. There is, then, much diversity in that order which is called warriors. But even among those unfit for war there is nonetheless some difference; for not even they are all called unfit for war equally and in one and the same rank. For some are so unfit for war that they can never become warriors, as is old age and the whole female sex, and also the servile condition. But the age of boyhood is unfit for war in such a way that it holds a hope of one day becoming warlike; that is, when one shall have come to a perfect man, to the measure of the age, then they hope not only to become warriors out of boys, but also to come into the sum total of the warriors and to be chosen and to be numbered among the twelve thousand, or even to be preferred to these and to be leaders of the chosen ones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily26.html'
source_title="HOMILIES ON NUMBERS 26.1"
