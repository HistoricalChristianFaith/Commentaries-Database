[[commentary]]
quote='''
Let us therefore, we too, if it is thus necessary, fall into your detractions, provided only that the Church, now turned to Christ the Lord, may know the truth of the Word of God covered under the covering of the letter; for so the Apostle also said, that: "if anyone shall be turned to the Lord, the veil shall be taken away; for where the Spirit of the Lord is, there is liberty." Therefore the Lord himself, the Holy Spirit himself, must be entreated by us, that he may deign to take away every mist and every darkness which, thickened by the filth of sins, obscures the sight of our heart, so that we may be able to contemplate the spiritual and wonderful understanding of his law, according to him who said: "Uncover my eyes, and I will consider the wonders of your law."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily01.html'
source_title="HOMILIES ON LEVITICUS 1"


[[commentary]]
quote='''
Let us see, then, whether not only "when Moses is read," but also when Paul is read, "a veil" may be "placed over" our "heart." And plainly, if we hear negligently, if we bring no zeal to erudition and understanding, not only the Scripture of the law and the prophets, but even that of the Apostles and the Gospels is covered from us with a great veil. But I fear lest, through excessive negligence and dullness of heart, the divine volumes be for us not only veiled but even sealed, so that, "if a book to be read is given into the hands of a man who does not know letters, he says: I do not know letters; if it is given into the hands of a man who knows letters, he says: it is sealed." Whence it is shown that we must not only apply zeal to learning the sacred letters, but must also entreat the Lord and "day and night" beseech him, that the Lamb "from the tribe of Judah" may come and himself, taking the "sealed book," may deign to open it. For he it is who, "opening the Scriptures," kindled the hearts of the disciples, so that they said: "was not our heart burning within us, when he opened to us the Scriptures?" May he, therefore, even now deign to open to us what it is that he inspired his Apostle to say: "now the Lord is the Spirit; and where the Spirit of the Lord is, there is liberty."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily12.html'
source_title="HOMILIES ON EXODUS 12"
