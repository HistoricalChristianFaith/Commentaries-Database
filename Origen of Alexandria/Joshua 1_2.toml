[[commentary]]
quote='''
We must also give an account of the death of Moses; for unless we understand how Moses dies, we shall not be able to perceive how Jesus reigns. If therefore you consider Jerusalem overthrown, the altar abandoned, nowhere sacrifices nor victims nor drink offerings, nowhere priests, nowhere high priests, nowhere the ministries of the Levites: when you see all these things cease, say that "Moses the servant of God is dead." If you see no one "coming three times a year into the sight of the Lord," nor offering gifts in the temple, nor slaying the "Passover," nor "eating unleavened bread," nor offering "firstfruits," nor "consecrating the firstborn," when you see all these things not being celebrated, say that "Moses the servant of God is dead." But when you see the nations entering into the faith, churches being built, altars sprinkled not with the gore of beasts but consecrated with the "precious blood" of Christ, when you see priests and Levites ministering not "the blood of bulls and goats" but the word of God through the grace of the Holy Spirit, then say that Jesus after Moses has taken up and obtained the leadership — not that "Jesus the son of Nave," but Jesus the Son of God. When you see that "Christ our Passover has been sacrificed" and we eat "the unleavened bread of sincerity and truth," when you see the fruits of the good land in the church "thirtyfold and sixtyfold and a hundredfold," widows, virgins, and martyrs, when you see the seed of Israel multiplied from those who were "born not of blood, nor of the will of man, nor of the will of the flesh, but of God," and when you see "the sons of God who were scattered gathered into one," when you see "the people of God keeping the Sabbath," not keeping leisure from common intercourse, but keeping leisure from the working of sin, when you see all these things, say that "Moses the servant of God is dead" and Jesus the Son of God obtains the leadership. Finally, in a certain little book too — in which, although it is not held in the canon, nevertheless the figure of this mystery is described — it is related that two Moseses were seen: one alive in spirit and another dead in body. In which without doubt this is what was foreshadowed: that if you gaze upon the letter of the law as empty and void of all those things which we have mentioned above, that itself is the Moses dead in body. But if you are able to "remove the veil" of the law and to understand that "the law is spiritual," this is the Moses who lives in spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily02.html'
source_title="HOMILIES ON JOSHUA 2.1"
