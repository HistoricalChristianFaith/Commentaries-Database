[[commentary]]
quote='''
It is the book of Numbers that is read to us, in which there are many differences of numbers, which are recorded concerning the sons of Israel. But after the sons of Israel, the Levites too are numbered separately. For they had not been counted along with the sons of Israel, and they have a certain number set apart and distinguished above the rest, by which they are all together reported to be found twenty-two thousand, so that neither anything more nor less than this was found in the number. After this the Lord commanded that the firstborn of the sons of Israel also be numbered in the same order in which the Levites had been numbered, that is, from one month and upward, and the firstborn of the sons of Israel are found to be twenty-two thousand and two hundred and seventy-three. Do you suppose that through these things Moses wished to teach us only the bare history of number, and enclosed no mystery, according to his customary manner, in these varieties of numbers? Will there seem to be no reason in the fact that two hundred and seventy-three are said to abound so much among the firstborn of Israel, while among the Levites it is recorded that toward the twenty-two thousand nothing abounds nor is anything lacking? The number twenty-two, indeed, in the divine Scriptures, if anyone observes, he will frequently find to be assigned to certain principal causes. For they hand down that among the Hebrews the first elements of letters are twenty-two. Again, from Adam, the first-formed, down to Jacob, from whose seed the twelve tribes take their beginning, the fathers are numbered to have been twenty-two. They hand down also that the kinds of all God's creatures are gathered within the number twenty-two. But many other things too in the Scriptures, if anyone should pursue them more diligently, he will find consecrated under this number. For this reason, therefore, both the Levites, that is, those who serve God, and the firstborn of the sons of Israel are titled with this admirable and sacred number. But that among the sons of Israel two hundred and seventy-three are added seems to me neither idle, nor do I discern an easy way of solution, unless the Lord should deign to open and take away for us that veil placed upon these letters by Moses. Therefore the generation of the human race in the flesh, as those assert who are skilled in such matters, is indeed contained in the womb for nine months, but it is not said to move toward birth before even the three days of the tenth month pass; and thus it is found that this number, that is, two hundred and seventy-three, indicates those days which are gathered from the nine months and the three days of the tenth month, and together they make these two hundred and seventy-three days, in which entrance into this world is granted to the human race. And thus in the twenty-two numbers together the sum of the mystical reasons of all creatures is gathered; but in those which are found in excess among the firstborn of Israel, the mystery also of human generation is set forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily04.html'
source_title="HOMILIES ON NUMBERS 4.1"
