[[commentary]]
quote='''
Let us see, then, what the devil speaks to the Lord from the Scriptures: "For it is written, that he has commanded his angels concerning you, and in their hands they will lift you up, lest perhaps you dash your foot against a stone." See how, even in the testimonies themselves, he is shifty. For he wishes to diminish the glory of the Savior, as though he needed the help of the angels, being about to dash his foot unless he were lifted up by their hands. He takes up a testimony and interprets of Christ that which was written not of Christ, but of the saints generally. For freely and with all confidence I contradict the devil, that this cannot be understood of the person of Christ. For he does not need the help of the angels, who is greater than the angels and has obtained by inheritance a name better than they. To none of the angels did God ever say: "You are my Son, this day have I begotten you." To none of them did he speak as to a son, "he who makes his angels spirits, and his ministers a burning fire," but to his own proper Son, of whom he speaks innumerable things in the prophets. He does not need, I say, the help of the angels, the Son of God. Nay rather, learn, O devil, that, unless Jesus should help the angels, they dash their own foot. And if any of the angels has seemed to dash his foot—of whom it was read a little while ago: "that we shall judge angels"—he dashes it for this reason, that he did not stretch out his hand to Jesus, so that, being grasped by him, he might not dash it. For when anyone, trusting in his own strength, does not call upon the protection of Jesus, he dashes his foot and falls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily31.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 31"
