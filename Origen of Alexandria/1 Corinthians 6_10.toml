[[commentary]]
quote='''
Then he descends also to the sins that seem to be lesser, saying Nor thieves; and this sin of theft nearly all who serve as soldiers commit, not "being content with their wages", as the Gospel taught, but "extorting by intimidation and bringing false accusation". But also those who are liars in their business dealings are thieves, not inheriting the kingdom of God; and so too those who take advantage in their business dealings are the covetous; and others are drunkards; but he says also that revilers do not inherit the kingdom of God. Let sin therefore "reign" over no one; for the kingdom of God must be pure from all sins and faults, that God may reign.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XXVII"

[[commentary]]
quote='''
For the "reviler," not only against God but also against his neighbor, is by the sentence of the Apostle Paul excluded from the kingdom of God. For see how the Apostle says: "Do not err: neither fornicators nor adulterers nor the effeminate nor abusers of themselves with men nor thieves nor the covetous nor revilers shall possess the kingdom of God." See among what crimes—among "adulterers," among "abusers of themselves with men," among "the covetous," whom elsewhere he calls "servants of idols"—he has also placed "revilers" and has excluded them together with those from the kingdom of God. Let them see, then, if there are any who by an almost daily habit accustom their mouth to this vice, what peril hangs over them. For thinking this to be a slight and easy sin, they do not easily guard against it; but let them consider how the Apostle excludes the "reviler" from the kingdom of God, and how God through Moses commands the "reviler" to be punished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily14.html'
source_title="HOMILIES ON LEVITICUS 14"
