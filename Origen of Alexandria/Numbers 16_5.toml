[[commentary]]
quote='''
We say therefore with confidence that according to the Scriptures God does not know all. God does not know sin, and God does not know sinners; those estranged from himself he does not recognize. Hear the Scripture saying: "The Lord has known those who are his, and: let everyone who calls upon the name of the Lord depart from iniquity." The Lord knows his own, but the wicked and the impious he does not know. Hear the Savior saying: "Depart from me all you workers of iniquity, I have not known you." And again Paul says: "If anyone among you is a prophet or spiritual, let him recognize that the things I write are the Lord's. But he who is ignorant, is ignored." But we say these things not perceiving anything blasphemous about God, as you do, nor ascribing ignorance to him, but we understand it thus, that those whose deed is unworthy of God are also deemed unworthy of the knowledge of God. For God does not deign to know him who is turned away from him and is ignorant of him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.6"
