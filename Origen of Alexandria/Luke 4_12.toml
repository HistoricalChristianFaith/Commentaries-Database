[[commentary]]
quote='''
And when the devil deceitfully proposed this and, under the show of glory, was striving after something else, the Savior said: "It is written: you shall not tempt the Lord your God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily31.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 31"
