[[commentary]]
quote='''
"And the Lord spoke," it says, "to Moses, saying: Behold, I have taken the Levites from the midst of the sons of Israel, in place of every firstborn that opens the womb from among the sons of Israel; they shall be their redemption, and the Levites shall be mine. For every firstborn is mine. From the day when I struck every firstborn in the land of Egypt, I sanctified to myself every firstborn of Israel; from man even to beast it shall be mine; I am the Lord." The Levites are taken in place of the firstborn, though indeed they are not firstborn. For Levi is born third from Leah; for first is Reuben, second Simeon, third Levi; and these are taken as firstborn who by nature are not firstborn. Is it to be believed that these things are written in the law of God without purpose? Or does it teach us this: that with God those are not reckoned firstborn who come first by bodily birth, but those whom God himself, having inspected the purpose of the mind, judges to be taken into the order of the firstborn? For so with God Jacob, though later in birth, was judged firstborn and received the blessings of the firstborn through the blindness of the parent, which was divinely brought about. For out of the purpose of the heart, which lay open to God, even before they were born into this world or had done anything good or evil, the Lord pronounces concerning them: "Jacob I loved, but Esau I hated." The sons of Levi, therefore, are indeed not firstborn according to the flesh, but they are taken in place of the firstborn, so that it is something greater to be taken in place of the firstborn than to be born firstborn. "Behold," it says, "I have taken the Levites from the midst of the sons of Israel." Say simply: I have taken the Levites from the sons of Israel; what is it that you add, "and from the midst of the sons of Israel"? From what midst, then? Levi is third, as we said above, among the sons of Israel. From what midst, then, the Levites are taken, I should like to know. I find in the Scriptures that blessed Shunammite, who once had fed the prophet, answering with confidence the king of Israel, who wished to confer some benefit upon her, and saying: "I dwell in the midst of my people." But more grandly and more magnificently I see it written in the Gospels concerning our Lord and Savior, when John says: "In the midst of you stands one whom you do not know." I think therefore that he who has never turned aside to the right hand or to the left can be said to stand in the midst — he "who did no sin, neither was guile found in his mouth." And therefore he indeed, because he always stands, is said to stand in the midst; but if anyone is an imitator of him, as are all the saints and that blessed woman whom we mentioned above, he is not indeed said to stand — for it cannot be that one is not at some time inclined either to the right or to the left; for no one is clean from filth, not even if his life be of one day — yet he is said to dwell in the midst of the people. And so the Levites too are taken from the midst of the sons of Israel. For the Levites are those who have not known their right hand and their left, but, following Moses, that is, following the law of God, have not spared father or mother. And you too, therefore, if, when temptation comes, when the wrath of sin comes, you are not inclined to the right hand or to the left and do not transgress the law of God, but stand in the midst, fixed and stable, and are not inclined nor bend your knees to sin, nor follow the head of a beast, that is, the image of folly, you will be taken from the midst of the sons of Israel and placed in the number of the firstborn. These things concerning what is written: "And I will take the Levites from the midst of the sons of Israel."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily03.html'
source_title="HOMILIES ON NUMBERS 3.2"

[[commentary]]
quote='''
But, if it seems good, let us return once more to the very order of the history that is recounted in Numbers, and from it let us contemplate where and how the mystery of the firstborn ought to be sought. Let us therefore review more attentively how the twelve tribes are distributed by threes into four parts and settle in a fixed station at each of the quarters of the heavens, and we find Judah indeed stationed on the east with Issachar and Zebulun, but Reuben on the west with Simeon and Gad; on the south Ephraim with Benjamin and Manasseh, but on the north Dan with Naphtali and Asher. Out of all these, placed as it were around the four corners of the earth in a circuit, in the midst of them, as being nearest to God, around the very tabernacle of God, the Levites are stationed. In the camp of Judah indeed, which is on the east, Moses and Aaron; but in the camp of Reuben, Gershon; in the camp of Benjamin, Kohath; and where Dan set his camp, Merari is written to be placed; and so in the midst of the sons of Israel, on every side and round about, the sons of Levi seem to be inserted among the rest and interwoven, as it were. These are the things that the letter of the law sets forth for us, so that, gathering from them the seeds of the sacred mysteries, we may ascend as by certain steps from lowly things to lofty ones and from earthly things to heavenly ones. Ascend therefore now, O hearer, if you can, and be lifted up from earthly senses by the gaze of the mind and the keenness of the heart. Forget earthly things for a little while, and walk with the step of the mind above the clouds and above the very heaven. There seek the tabernacle of God, where as a forerunner for us Jesus entered and now stands before the face of God, interceding for us. There, I say, seek those fourfold orders and stations of the camps, there behold the Israelite ranks and the watches of the saints, and there examine those mysteries of the firstborn which we now seek here. But I do not dare to ascend there alone, I do not dare to plunge myself into these so secret recesses of the mysteries without the authority of some great teacher. I cannot ascend there unless Paul goes before me and himself shows me the way of this new and steep journey. He therefore, the greatest of the Apostles, who knew that there are many churches not only on earth but also in the heavens — of which John also enumerates seven — Paul himself, wishing to show that there is besides even a certain church of the firstborn, says, writing to the Hebrews: "For you have not drawn near to a burning and palpable fire, but you have drawn near to Mount Zion and to the city of the living God, the heavenly Jerusalem, and to multitudes of angels giving praise, and to the church of the firstborn enrolled in the heavens." Moses therefore describes the people of God divided by four camps on earth, and the Apostle describes four orders of saints in the heavens, to each of which he says that each one of us draws near. For not all draw near to all, but some indeed draw near to Mount Zion; and those a little better than these draw near to the city of the living God, the heavenly Jerusalem; and those who are more eminent even than these draw near to the multitude of angels giving praise; and those who are above all these draw near to the church of the firstborn enrolled in the heavens. If therefore from these things you have understood what the order of the firstborn is and what the mystery of that name is, prepare yourself and strive, as much as you are able, that perhaps by your deeds, your life, your morals, your faith and your practices you may make progress, so that you may be able to draw near to the church of the firstborn, which is enrolled in the heavens. But if you are not able for so much, but are a little lower, draw near to the multitude of angels giving praise. But if you cannot draw near even to that order, strive at least to hasten to the city of the living God, the heavenly Jerusalem. But if you are not fit even for this, strive at least toward Mount Zion, that you may be saved on the mountain. Only let it not be that you settle on the earth, that you remain in the valleys, that you persevere in things sunk down and lowly. To me it seems that this is how it must be understood, that the firstborn sons of Levi are taken, who minister to God and serve his altar and the tabernacle, and by perpetual watches celebrate together the divine services.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily03.html'
source_title="HOMILIES ON NUMBERS 3.3"
