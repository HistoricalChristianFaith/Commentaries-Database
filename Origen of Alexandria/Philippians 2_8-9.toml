[[commentary]]
quote='''
And Paul indeed says of the Savior, that "he humbled himself, being made obedient unto death, even the death of the cross". For it is not unseemly for one who wishes to number in how many things Christ humbled himself, to count out (beyond those things which Paul expounded, saying: "he humbled himself, being made obedient unto death"): unto the "palms of hands", unto the "confusion of spittings" and of "scourges" and of death, on account of all which "God exalted him". For it was not on account of death alone which he bore for us that he exalted him, but also on account of the palms and the spittings and the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252026.html'
source_title="COMMENTARY ON MATTHEW 113"
