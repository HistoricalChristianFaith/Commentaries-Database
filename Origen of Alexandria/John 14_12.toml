[[commentary]]
quote='''
But if, as the simpler suppose, those things which were done were done not "on account of us", but merely done, and were not examples of another reality, let them explain how this which was said, "seeing you will see and not know", has any sense. For if those things which "were seen" did not have some sacred meaning, such that with the carnal eyes they were also spiritually beheld, he would never have said: "seeing you will see and not know". And for the proof of these things let us bring forward the testimony of another passage from the Gospel, which, according to those who follow the letter only, is a falsehood. Our Savior and Lord says to the disciples in the Gospel according to John: "if you believe, not only will you do the things which I do, but you will do even greater than these". Let us see, then, whether the disciples "did" any "greater" things. What is "greater" than to "raise the dead"? Who — I do not say of us, but of the Apostles — "raised the dead"? The history relates that Paul "raised Eutychus from the dead", and Peter "Tabitha, which is interpreted Dorcas". But these things, and others of this kind, you can find; yet where are the "greater" things? But the Savior also made "the blind" see again, and, what is "greater", those who had been born so: let them show whom they have beheld "blind" from the womb cured by the hands of the Apostles. And countless other things one can find from the Gospels, who seeks them, since neither did the Apostles "do greater things than these" nor did their successors. But the word of Scripture spoke some such thing as this: "than these things which I have done", the bodily ones, "you will do greater". "I made men rise from the dead" bodily, you "will make them rise from the dead" spiritually. I poured this perceptible light upon "the blind", you will give spiritual light to those who do not see. And down to this present day I see these signs, "greater" than the bodily ones which Jesus "did", being done through the most faithful disciples of Jesus. Do not "the blind" now "see" and "the lame walk" and "the lepers are cleansed" and the rest come to pass, if he who yesterday was "blinded", approaching an idol as though to God, today calls upon the living God, abandoning his former ways? Does not he who yesterday was "lame" on account of sin, now, through the teaching of the disciples, taught the true way, walk with steady foot; and he who yesterday "had a withered hand", idle for doing good, today, receiving back his "hand", has it living? If you see someone polluted and having leprosy in his soul suddenly repent, pricked to the heart by the word of teaching, let it not irk you to say that it is "greater" that this man be spiritually "a leper" cleansed than that some other be carnally purged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily06.html'
source_title="HOMILIES ON ISAIAH 6"
