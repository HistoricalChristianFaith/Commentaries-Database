[[commentary]]
quote='''
But let us see what follows in the sequel: "and Jesus burned Ai," he says, "and it was made a wasteland, that it should not be inhabited forever." You see that these things which follow pertain more to the truth of the mystery than of the history. For that place of earth is not so much uninhabitable forever as the place of the demons will then be uninhabitable, when now no one will sin, "neither will sin reign" in anyone, when the devil and his angels will be delivered to eternal fire, our Lord Jesus Christ sitting as king and judge and saying to those who conquered, both the first and the last: "come, blessed of my Father, receive the kingdom which has been prepared for you by my Father." But to the others he will say: "go into the eternal fire, which God has prepared for the devil and his angels," until he takes counsel with remedies for every soul, for those whom he himself knows, and "all Israel is made safe."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily08.html'
source_title="HOMILIES ON JOSHUA 8.5"
