[[commentary]]
quote='''
But first of all, consider the meaning of the mystery, which anyone who observes it carefully will find in the Scriptures: that in the going out of the children of Israel from Egypt there were forty-two stations; and again, the coming of our Lord and Savior into this world is traced through forty-two generations. For thus the Evangelist Matthew recounts, saying: "From Abraham until David the king, fourteen generations, and from David until the deportation to Babylon fourteen generations, and from the deportation to Babylon until Christ fourteen generations." These forty-two stations of the generations, then, which Christ made in descending into the Egypt of this world, make up by the very same number the forty-two stations of those who go up from Egypt. And Moses set it down well and observantly, saying: "The children of Israel went up with their power." And what is their power, if not Christ himself, who is the power of God? He therefore who goes up, goes up together with him who came down to us from thence, so that he might arrive there whence that one descended not by necessity but by condescension, that the saying might be true which was spoken, that "he who descended is himself also the one who ascended." Therefore in forty-two stations the children of Israel arrive at the beginning of the taking of their inheritance. And the beginning of taking the inheritance was where Reuben and Gad and the half-tribe of Manasseh receive the land of Gilead. And so the number of Christ's descent through forty-two fathers according to the flesh, as though descending to us through forty-two stations, matches the ascent of the children of Israel through just as many stations up to the beginning of the promised inheritance. But if you have understood how great a mystery this number of the descent and the ascent contains, come now, and let us begin to ascend through those things by which Christ descended, and to make that first station which he made last, namely that by which he was born of a virgin; and let this be the first station for us who wish to go out of Egypt, in which, having left behind the worship of idols and of demons — not the veneration of gods — we believe that Christ was born of a virgin and of the Holy Spirit, and that the Word made flesh came into this world. After this, let us now strive to advance and to ascend to each and every degree of faith and of the virtues; and if we linger over each of these long enough until we come to perfection, we shall be said to have made a station in each of the degrees of the virtues, until, as we reach the very summit of instruction and of progress, the promised inheritance may be fulfilled for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.3"


[[commentary]]
quote='''
But the soul too, when it sets out from the Egypt of this life, that it may make its way to the land of promise, necessarily journeys along certain particular roads and, as we have said, completes certain fixed encampments. Mindful of these, I believe, the prophet said: "These things I have remembered, and I have poured out my soul upon myself, for I shall pass into the place of the wonderful tabernacle, even to the house of God." These are the encampments, and these the tabernacles, of which in another place also he says: "How lovely are your tabernacles, O Lord of hosts! My soul longs and faints for the courts of the Lord." Therefore in yet another place the same prophet says: "My soul has been a great wanderer." Understand then, if you can, what these wanderings of the soul are, in which with a certain groaning and grief it laments that it wanders too long. But the understanding of these things grows dull and is darkened while as yet the soul wanders; but then it will be more truly instructed and will more truly understand what was the reason of its pilgrimage, when it has returned to its rest, that is, to its homeland, paradise; and gazing on this under a mystery the prophet said: "Return, O my soul, to your rest, for the Lord has dealt bountifully with you." But in the meantime it wanders and pursues its journey and completes its encampments, dispensed through these things, without doubt for the sake of some benefit, by the providences of God, as also in a certain place he says: "I afflicted you, and fed you with manna in the desert, which your fathers did not know, that it might be discerned what is in your heart." These, then, are the encampments by which the journey is made from the lands to heaven. And who will be found so fit and so privy to the divine secrets that he can describe the encampments of this journey and ascent of the soul, and set forth either the labors or the rests of each place? For how should he relate that after the first and the second and the third encampment Pharaoh still pursues, the Egyptians pursue, and, though they do not overtake, yet they give chase, and, though they are drowned, yet they have given chase? How should he declare that the people of God, once made safe, after several encampments first sang a song, saying: "Let us sing to the Lord, for he has been gloriously honored; horse and rider he has cast into the sea"? But these things, as I have said, whoever should dare to open up through the individual encampments and, from the contemplation of the names, to conjecture also the qualities of the encampments — I do not know whether either the understanding of the one who speaks would suffice for the weight of the mysteries, or the hearing of the listeners would grasp it. For how should either the onset of the war of the Amalekites be explained, or the various temptations, and how should those be narrated whose limbs fell in the desert, and that it was not at all the sons of Israel, but the sons of the sons of Israel, who were able to reach the holy land, and that all that old people fell, who had had their converse and habitation with the Egyptians, while only the new people, who knew not the Egyptians, reached the kingdom, apart from the priests and the Levites? For if anyone has been able to place himself in the order of the priests and the Levites, if anyone has been able to have no portion in any lands, but the Lord alone, that man does not fall in the desert, but reaches the land of promise. Hence you too, if you wish not to fall in the desert, but to reach the promises of the fathers, have no lot in the land, and let there be nothing common to you with the earth. Let your portion be the Lord alone, and you will never fall. The ascent, then, is made from Egypt to the land of promise, through which, by mystical descriptions, as I have said, we are taught the ascent of the soul to heaven and the sacrament of the resurrection from the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.4"


[[commentary]]
quote='''
Now names are also assigned to the resting-places. For it did not seem fitting that every place under heaven should be called by the names of mountains or valleys or plains, while that ascent, by which the soul ascends to the kingdom of God, should not have the names of its own resting-places. It has names of resting-places fitted with mystical designations; it has too as its guide not Moses — for he himself did not know where he was going — but the pillar of fire and the cloud, that is, the Son of God and the Holy Spirit, just as in another place the prophet says: "the Lord himself was leading them." Such, then, will be the ascent of the blessed soul, when all the Egyptians and Amalekites and all who had assailed it have been drowned; so that, passing on through each and every resting-place — those many, namely, which are said to be with the Father — it may be enlightened yet more, and, coming from one to another, may ever gain greater increases of illumination, until it grow accustomed to endure the gaze of that true light itself, which enlightens every man, and to bear the radiance of the true majesty. But if we return to that second exposition which we mentioned above, and understand the advances of the soul set in this life to be taught through these things — the soul which, converted from a gentile manner of life, follows not so much Moses as the law of God, and not Aaron, but that priest who abides forever — before it comes to perfection, it dwells in the desert, where, namely, it may be trained in the precepts of the Lord and where its faith may be proved through temptations. And there, when it has overcome one temptation and its faith has been proved in it, from thence it comes to another, and passes as it were from one resting-place to another; and there, when it has held fast to the things that have befallen it and has borne them faithfully, it proceeds to another; and thus, through each and every trial of life and faith, the soul's advances are said to have resting-places, in which through each single thing increases of the virtues are sought. And there is fulfilled in these that which is written: "they shall go from strength to strength," until one arrives at the last — nay rather, at the highest — degree of the virtues, and the river of God is crossed and the promised inheritance is received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.5"


[[commentary]]
quote='''
Using this twofold exposition, therefore, we ought to consider this whole order of the encampments that has been recited, so that from both there may come a progress for our soul, as we learn from these things either how this life, which follows the law of God through conversion from error, ought to be conducted, or how great is the expectation of the future hope that is promised through the resurrection. For thus I think that in these things which are read there is taught an understanding worthy of the laws of the Holy Spirit. For to know in that desert what that place is called where, for example, the sons of Israel, then passing through, encamped — what usefulness does this bring to me, or what progress will be conferred by this upon those who read and meditate on the law of God day and night? — especially since we see that there was such great care on the Lord's part concerning the recording of these encampments that a description of them was inserted a second time into the divine laws. For these names were commemorated, though in some cases altered, already then, when the sons of Israel are said, through each place, to have set out from that place and to have encamped in that place; but now again they are ordered to be described by Moses through the word of the Lord. Hence this very fact, that this description is repeated a second time, seems to me quite fittingly suited to the mystery of the exposition which we have proposed; for they are repeated twice in order to show the two ways of the soul: one, by which, placed in the flesh, it is exercised in the virtues through the law of God, and ascending through certain steps of progress it advances, as we have said, from virtue to virtue and uses these very advances as encampments; but the other, by which, after the resurrection, being about to ascend to the heavens, it does not suddenly or importunately climb to the summit, but is led through many encampments, in which, illuminated through each one and always receiving an increase of splendor, made bright in each encampment by the light of wisdom, it may come at last to the very Father of lights. "The sons of Israel therefore went out," he says, "with their power." There was with them that power which had said: "I will go down with you into Egypt"; and because this power was with them, therefore the prophet says: "and there was none feeble in their tribes." "And they went out by the hand of Moses and Aaron." For going out of Egypt the one hand of Moses is not enough; the hand of Aaron also is required. Moses indicates the knowledge of the law, Aaron the skill of sacrificing and offering to God. It is needful, therefore, that we who go out of Egypt should have as fruit not only the knowledge of the law and of faith, but also of works, by which God is pleased. For this reason both the hand of Moses and of Aaron is mentioned, that by the hands you may understand works. For indeed, if going out of Egypt and being converted to God I cast away pride, I have sacrificed a bull to the Lord through the hands of Aaron. If I destroy wantonness and lasciviousness, I shall believe that I have slaughtered a he-goat to the Lord by the hands of Aaron. If I conquer lust, a calf; if folly, I shall be seen to have offered a sheep. Thus therefore, when the vices of the soul are purged, the hand of Aaron works in us; and the hand of Moses is with us, when we are illuminated from the law to understand these very things. And therefore both hands are necessary for those going out of Egypt, so that there may be found in them the perfection not only of faith and knowledge, but also of acts and works; and yet these two are not two hands, but one. For the Lord led them out "by the hand of Moses and Aaron," and not "by the hands of Moses and Aaron"; for the work of both hands is one, and one the fulfillment of perfection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.6"


[[commentary]]
quote='''
But lest this kind of exposition, which runs through the meanings of the Hebrew names, should seem to those unacquainted with the properties of that language to be forced and violently wrested out, we will give a comparison also in our own tongue, by which the reasoning of this sequence may become clear. In the schoolroom, where boys take up their first rudiments, some are called "alphabet-learners," others "syllable-learners," others "word-learners," and others are now called "reckoners"; and when we have heard these names, from them we recognize what progress there is in the boys. Likewise also in the liberal studies, when we have heard someone recite a passage, or an address, or a panegyric, or the other exercises in their order, from the name of the exercise we perceive the young man's progress. How then, even through these things which are recorded as the names of places, as it were of exercises, should we not believe that the progress of learners in divine instruction can be indicated? And just as those who linger over each several subject of learning seem, as it were, to make certain resting-places in them, and to advance from one to another and from that one again to yet another, so also here why should not the name of the "stations," and the advance from one to another and from one again to another, be believed to indicate the progress of the mind and to signify the increase of the virtues?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.13"
