[[commentary]]
quote='''
For there is a certain sleep of the soul, and a wakefulness; and therefore, turning the soul away from slumbering, the word through Solomon says, "Give not sleep to your eyes, nor drowsiness to your eyelids, that you may be saved like a gazelle from the snares and like a bird from the trap." And the Savior says, "Watch at every season and pray that you may be able to escape the trials that are about to come." Stand fast: be not shaken, but become steadfast. The double-minded man does not stand in the faith, nor does he who is in doubt about the matters pertaining to the faith. Be courageous: he speaks as to soldiers; for he says, "put on the whole armor of God, that you may be able to stand against the wiles of the devil." Be strong: as if to say, "Take up strength," that, having been strengthened, you may be able to say, "I can do all things in Christ Jesus who strengthens me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XC"
