[[commentary]]
quote='''
When "the children of Israel did evil in the sight of God, and forgot the Lord their God," and, forsaking him, "served the Baalim and the groves" of the nations, then, "storing up wrath for themselves," they "were handed over," by the just judgment of God, "into the hands of their enemies," according to what the present reading has declared: "into the hands," it says, "of Cushan-rishathaim, king of Mesopotamia." Now Cushan-rishathaim is interpreted as "their humiliation". They "were handed over," therefore, "into the hands" of him who would humiliate them. And because they themselves were acting impiously against the Most High upon the high places of the mountains, for that reason they are handed over by him into humiliation. But I would not have you think that this divine providence was directed only toward the ancients — namely, that it handed over those who impiously exalted themselves to be humbled, and by a saving method of medicine cured contraries with contraries — while now the omnipotent God lacks toward his Church such a saving providence. There is even now a "Cushan-rishathaim, king of Mesopotamia," to whom are handed over to be humbled and afflicted the souls that, despising Christian humility, have given themselves over to pride and arrogance. The vice of pride is exceedingly hateful in the sight of God, since, as Scripture says: "the beginning of departing from God is pride," and again elsewhere Scripture says: "God resists the proud, but to the humble he gives grace." If, therefore, anyone, despising the humility of Christ — who for our sake, "though he was God, was made man and humbled himself even unto death" — is lifted up and exalted, leaps forward toward the powers and dignities of the world, and does not shrink or shudder at the arts by which he strives to attain these things, even though they be against faith and religion, provided only he obtain what he desires, it comes about thereby that he "does evil in the sight of the Lord"; and after he has gained the highest insignia of the powers and has climbed to the very topmost heights of pride, cast down from there he "is handed over" to this "Cushan-rishathaim," that is, to one of the "airy princes" — as elsewhere Pharaoh, and elsewhere Hiram — that he may humble the one who had been too greatly exalted, that he may afflict and crush him, until he comes to his senses and seeks the Lord; because, while he was set in pride and elation, he did not know God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily03.html'
source_title="HOMILIES ON JUDGES 3"

[[commentary]]
quote='''
Now therefore let us see what these do who are handed over on account of sin and set in tribulation. Precisely that which is written: "and they cried out to the Lord when they were in tribulation, and he delivered them out of their distresses." "And he led them out of darkness and the shadow of death, and burst their bonds asunder." But each one of us also — even if he be small, even if he be the least, even if he enjoy no dignity in the world — can be afflicted with the vice of pride; and nothing is so foul nor so execrable, as Scripture says, as "a poor man who is proud and a rich man who is a liar." Sometimes, however, this disease of pride penetrates not only the poor of the common people, but strikes even the priestly and Levitical order itself. You may find sometimes even among us certain persons — we who are set as an example of humility and placed in the circle of the altar like mirrors, as it were, for those who look on — in whom the vice of arrogance reeks, and from the altar of the Lord, which ought to be fragrant with the sweetness of incense, there gleams forth the most foul odor of pride and elation. But let this most foul odor, I beg, be cast out from all this holy Church and especially from those who minister in holy things, so that we may be able, as Paul said, to be made "the good odor of Christ"; "lest perhaps the Lord be angered" and "we provoke the Holy One of Israel to wrath" and he "hand" us "over into the hands of Cushan-rishathaim," so that the humility which we ought to have taught in the knowledge of Christ we may learn in the tribulation of our chastisement. But behold the kindly Lord mingling mercy with severity and weighing the very measure of the punishment with a just and clement balance. He did not hand over the offenders forever, but for as long a time, he says, as they served the Baalim, for that same length they also "serve Cushan-rishathaim," that is, "for eight years." Learn this, you too, O hearer, whoever you are who are conscious to yourself of some error. And for however long a time you know yourself to have gone astray, for however long a time you have transgressed, for that same length of time nonetheless humble yourself before God and make satisfaction to him in the confession of repentance. Do not wait for Cushan-rishathaim to humble you and for necessity to wring repentance from you against your will, but do you yourself forestall the hands of that torturer, because, if you amend yourself, if you correct yourself, God is holy and merciful, and he tempers his vengeance from the one who forestalls it by repenting. But let us also consider this, that, so long as these who had been handed over for their offenses "served Cushan-rishathaim" and did not "cry out to the Lord," no one was raised up who could save them. But when "they cried out to the Lord, then the Lord raised up a Savior for Israel and saved them."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily03.html'
source_title="HOMILIES ON JUDGES 3"
