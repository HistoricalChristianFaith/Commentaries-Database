[[commentary]]
quote='''
But let us come also to the Gospels, if we find anything said in them concerning tabernacles, so that through the judgment of the Lord what we seek may be beyond doubt. We find, then, that the Savior himself, Jesus Christ, mentions not one tabernacle, but many, and not temporal, but eternal, when he says: "Make yourselves friends of the mammon, that, when it shall fail, they may receive you into the eternal tabernacles". Thou hast heard the Lord declaring the tabernacles to be eternal; hear now also the Apostle saying: "desiring to be clothed over with our tabernacle, which is from heaven". Is not the way now opened to thee from all these things, whereby, the earth being forsaken, following the prophetic and apostolic sense and — what is greatest of all — following the word of Christ with the whole mind and whole sense, thou mayest ascend to heaven and there seek the magnificence of the eternal tabernacle, whose figure is shadowed forth through Moses on the earth?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily09.html'
source_title="HOMILIES ON EXODUS 9"
