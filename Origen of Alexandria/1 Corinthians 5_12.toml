[[commentary]]
quote='''
Jesus alone was empowered to distinguish among the hearers His own from the outsiders, so as to speak to the outsiders in parables, but to explain the parables to those who entered with Him into the house. The outsiders and those who entered into the house have a mystical meaning. For "why should I judge outsiders?" Every sinner is an outsider. This is why the outsiders are addressed in parables: so that they might be able to leave the outer and enter the inner. Entering the house has a mysterious meaning: he who enters the house of Jesus becomes His true disciple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
