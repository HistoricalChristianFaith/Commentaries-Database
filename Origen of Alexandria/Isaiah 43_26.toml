[[commentary]]
quote='''
For so also elsewhere the prophet says: "do you", he says, "tell your iniquities first, that you may be justified". Does he not evidently show the mystery of which we treat, when he says: "do you tell them first?" — that he may show you that you ought to forestall him who is ready to accuse. "Do you", therefore, he says, "tell them first", lest he forestall you; for if you tell them "first" and offer the sacrifice of repentance according to the things which we said above are to be offered, and hand over your flesh to destruction, "that the spirit may be saved in the day of the Lord", it will be said to you also that "you have received your evils in your life, but now rest here".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily03.html'
source_title="HOMILIES ON LEVITICUS 3"
