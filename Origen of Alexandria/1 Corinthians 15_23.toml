[[commentary]]
quote='''
But since the merit of all is not one, nor is the advancement in faith one, therefore the ark too does not furnish one and the same dwelling to all these, but the lower parts are double-chambered and the upper parts triple-chambered, and nests are distinguished in it, so as to show that in the Church also, although all are contained within one faith and are washed by one baptism, nevertheless the advancement is not one and the same for all, "but each in his own order."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily02.html'
source_title="HOMILIES ON GENESIS 2.3"
