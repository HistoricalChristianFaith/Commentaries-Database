[[commentary]]
quote='''
Although the order of the readings which are recited demands rather that we speak of those things which the reader has set forth, nevertheless, since some of the brethren earnestly ask that rather those things which are written concerning the prophecy of Balaam be brought forward for the discourse of our discussion, I have thought it right to satisfy not so much the order of the readings as the desires of the hearers. First of all, then, let us inquire concerning Balaam himself, why in the Scriptures he is set forth now as blameworthy, now as praiseworthy. For he is blameworthy when, though forbidden by God to come to the king, he persists in coming, and, greedy for reward, consults God again, again inquires, until he is left to his own desires and goes in his own wishes. He is culpable when he builds altars and places victims upon them for demons and by magical apparatus seeks divine counsels. He is culpable when he gives that most wicked counsel, that the people be deceived through the Midianite women and the worship of idols. Again he is shown to be praiseworthy, when the word of God is placed in his mouth, when the Spirit of God comes upon him, when he prophesies concerning Christ, when he foretells to Jews and Gentiles the future mysteries concerning the coming of Christ, when instead of curses he bestows blessings upon the people and exalts the name of Israel above visible glory with mystical utterances. Since, then, divine Scripture indicates concerning him things so diverse and so varied, it seems very difficult to me to determine with any definiteness his person, to whom not only this diversity may suit, but to whom that also may be fitted which he himself, as though prophesying, says concerning himself: "Let my soul die among the souls of the righteous, and let my seed be as the seed of the righteous." But also through the prophet Micah the Lord gives such a testimony concerning him, where he says: "My people, what have I done to you? Answer me; for I called you back from the land of Egypt, and from the house of bondage I freed you, and I sent before your face Moses and Aaron and Miriam. My people, remember what Balak king of Moab plotted against you, and what Balaam son of Beor answered him from the ropes even to Gilgal, that the righteousness of the Lord might be known." He shows, then, through these words that, in order that the righteousness of the Lord might be recognized, for this reason Balaam son of Beor answered to king Balak all those things which are reported as written in the books. And who, do you think, will be found of such a kind as to be able to show from Balaam's very answers that the righteousness of God is made manifest in them? For truly, if the word of God has been placed in his mouth, and the Spirit of God has come upon him, and the righteousness of God is recognized and made manifest from his answers, then in every way the things which are said by him must be believed to be nothing other than prophetic and divine. And yet we scarcely read anywhere written that the Spirit of God came upon any of the prophets; but rather "the vision which he saw," or "the taking up of the word of God," or "the word of God came to" this one or that one, and certain other such things we read concerning the prophets. But that the Spirit of God came upon any of the prophets, I do not for the present recall to have read, except that concerning David I remember it thus written: "And the Spirit of God appeared," or "shone forth, upon David from that day and thereafter"—yet the Spirit of God was not "made" upon David. But concerning Saul I remember it thus written: "And the Spirit of the Lord shall fall upon you, and you shall prophesy with them, and you shall be turned into another man"; and again concerning the same it is said: "And the Spirit of the Lord departed from Saul, and an evil spirit from the Lord confounded him"; and again: "And it came to pass, when the evil spirit was upon Saul, David took up the psaltery and played with his hands, and struck it, and it was well with him, and the evil spirit departed from him." These things I have noted because that which is written, "and the Spirit of God came upon him," can seem to be something intermediate. Wherefore we too, according to what we had understood in the earlier treatise, shall now also attempt to explain this same Balaam under the person of the Pharisees and scribes and those like them. But come now, let us look at the words of his prophecy, which he is written to have spoken when he had taken up his parable. "From Mesopotamia," he says, "Balak king of Moab has called me, from the mountains of the East." By Mesopotamia he means the land which lies between the rivers of Babylonia, concerning which it is written: "Upon the rivers of Babylon, there we sat down and wept, while we remembered Zion." If, then, anyone is among these rivers of Babylon, if anyone is flooded by the streams of lust and washed about by the heats of wantonness, he is said not to stand, but to sit; and therefore those who were caught there said: "Upon the rivers of Babylon we sat and wept, while we remembered Zion." But they cannot even weep before, except when they have remembered Zion; for the remembrance of good things makes the causes of evils to be lamented. For unless a person remembers Zion, unless he looks upon the law of God and the mountains of the Scriptures, he does not begin to weep for his own evils. From these rivers, then, Balaam is called, and from these mountains of the East he is invited. These mountains are not those holy mountains, concerning which it is written: "Its foundations are in the holy mountains," and again: "Jerusalem, which is built as a city, whose sharing is together in one": "Mountains are round about it, and the Lord is round about his people." The mountains of Mesopotamia, then, are not such, but rather those of which it is said: "dark mountains," and again, of which it is said: "Behold, I am against you, O corrupt mountain." These are the mountains in which is "every height lifting itself up against the knowledge of God." From these mountains, then, this Balaam too is summoned. And of what kind these mountains are, such also is their East; for he too who "transforms himself as an angel of light" has the rising of his own light; he has that light concerning which it is written: "The light of the ungodly shall be extinguished." And just as this light of the ungodly, and that light which "transforms itself as an angel of light," is contrary to that light which said: "I am the light of the world," so also this East is contrary to that East concerning which it is written in Jeremiah: "Behold a man, the East is his name." From the borders of that East, then, not of this one, Balaam came, illumined without doubt by that Lucifer concerning whom it is said: "How has Lucifer fallen from heaven, who rose in the morning?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily15.html'
source_title="HOMILIES ON NUMBERS 15.1"

[[commentary]]
quote='''
But let us see what Balak king of Moab, who summoned him from the midst of the rivers from the mountains of the East, says to him. "Come," he says, "and curse me Jacob, and come, curse me Israel." In Latin speech the repetition seems almost superfluous, which says: "Curse me Jacob, and curse me Israel." But in the Greek text, under the name of Israel, there is in the cursing an addition of a preposition, which our translators omitted, either believing it to be said less fittingly, or reckoning that no force could be added to the expression from this. But we, though contrary to custom, coin an expression, so that we may gather the sense in full; it can therefore be said: "Come, curse me Jacob, and come, over-curse me Israel." By which it is shown that the speech was repeated for this reason, that Balak seems to demand a curse upon Israel with greater force and greater intensity than upon Jacob. For as long as anyone is only Jacob, that is, placed only in acts and works, he is assailed with lesser curses. But when he has advanced and has begun to sharpen and rouse the inner man, with the eye of the mind unveiled, to see God, then he will be assailed by the enemy not only with curses, but even with over-curses, that is, with more violent darts of curses. But at that time indeed Balaam's mouth was "full of cursing and bitterness, and under his tongue was labor and pain," and "he sat in ambush with the rich"; for he was awaiting rewards from the rich king, that "in secret places he might slay the innocent." But God, "who alone always does wonders," works salvation out of enemies; for he cast a word into his mouth, although his heart could not yet receive the word of God. For there was still in his heart the greed for reward, on account of which even after the word of God, which he had in his mouth, he said to Balak: "Come, and I will give you counsel," and he taught him how he might put a stumbling-block in the sight of the children of Israel, that they might eat things sacrificed to idols and might commit fornication. On account of which the people also fell, and a great plague came upon them, until Phinehas, having slain the Israelite who was fornicating with the Midianite woman, appeased the wrath of the Lord. And after these things, it says, Phinehas led out an army against the Midianites, and they killed twelve thousand men, and Balaam son of Beor by the sword. But these things we have introduced before their time, by a kind of digression, in order to show that Balaam had the word of God not in his heart, but only in his mouth. Meanwhile, what he brings forth, what he speaks, he speaks from the word of God, and therefore what he says is the word of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily15.html'
source_title="HOMILIES ON NUMBERS 15.2"
