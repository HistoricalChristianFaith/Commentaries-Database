[[commentary]]
quote='''
In Ecclesiastes there is a curious saying. To the undiscerning it will seem meaningless, but it is precisely for the wise man that Ecclesiastes says: "The wise man's eyes are in his head." In what head? Every man, even a madman and a fool, has fleshly eyes on his fleshly head. But the eyes of the wise man, of which it is said that they are enlightened by the commandments of God, are in his head, in Christ, because "the head of the man is Christ," says the Apostle. The capacity to think proceeds from Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
