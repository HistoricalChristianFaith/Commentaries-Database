[[commentary]]
quote='''
Neither God nor his inspired disciples always use kindly words toward those who hear, nor always severe ones, but sometimes the one and sometimes the other. Since, then, Paul's word had a rod, but had also a spirit of gentleness and of kindliness, he inquires of the Corinthians, not wishing too rashly and too quickly to employ the more severe course; not that the rod comes to be apart from love, but that the love is hidden in the one who holds the rod, and he does not display the love in the severity of the rebuke.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XXIII"
