[[commentary]]
quote='''
Abraham sets forth, as it were, moral philosophy, through obedience. For so great was his obedience and observance of the commandments that, when he heard: "Go forth from your land, and from your kindred, and from the house of your father," he did not delay, but did it at once … For hearing that he should sacrifice his son, not even then does he doubt, but he obeys the precept: and, to give to posterity an example of the obedience which is moral philosophy, he did not spare even his only son. Isaac also holds to natural philosophy, since he both digs wells and searches out the depths of things. But Jacob too holds the inspective place, inasmuch as he was named Israel on account of the contemplation of divine things, and saw the camps of heaven, and beheld the house of God and the ways of the angels — that is, the ladder stretched out from earth to heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"


[[commentary]]
quote='''
God has been recorded indeed to be the God "of Abraham, and the God of Isaac and the God of Jacob." He indeed who wishes the light to belong to none other than men (because it is said, "The life was the light of men") will think, according to this analogy, that the God of Abraham and the God of Isaac and the God of Jacob is the God of no one except these three fathers alone. But he is at least also the God of Elijah, and, as Judith says, the God of her father Simeon, and he is God of the Hebrews. Wherefore, according to the analogy, if nothing prevents him from being the God of others also, nothing prevents the light of men from also being the light of other creatures besides men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%25202.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 2.143"


[[commentary]]
quote='''
If the God of the universe, having been made familiar to the saints, becomes their God, the being named the God of Abraham and the God of Isaac and the God of Jacob, by how much more will it be possible for the Holy Spirit, having been made familiar to the prophets, to be called their spirit, that the Spirit might thus be said to be the spirit of Elijah and the spirit of Isaiah?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%25206.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 6.68"
