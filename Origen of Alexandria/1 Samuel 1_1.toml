[[commentary]]
quote='''
"There was, it says, one man of Ramathaim, of Mount Ephraim." It does not escape me that in the first place, in some copies it stands: "There was a certain man"; but in those copies which we have approved as more correct it stands thus: "There was one man." And in this the Hebrews too, who contradict us in other things, agree with us. There was, then, one man. See whether this very thing does not pertain to the praise of the righteous man, that it is said of him: "There was one man." We who are still sinners cannot acquire this title of praise, because each one of us is not one, but is many. For observe the countenance of someone now angry, and again sad, and a little later once more rejoicing, and again troubled, and again gentle; at one time consulting about divine things and the acts of eternal life, but a little after contriving the things that pertain either to avarice or to the glory of the world. You see how he who is thought to be one is not one, but there seem to be as many persons in him as there are moods, because also, according to the Scriptures, "the fool is changed as the moon." Whence the moon too, although it seems to be one, through the changing of its substance is nevertheless always other than itself and always different; and so even in it there stands the fact that the one is many. So then we also, who are still foolish and imperfect, because we are always changing our opinions and always desiring and perceiving different things, cannot be called one. But of the righteous, not only is each singly called one, but even all together are fittingly called one. And why should not all be called one, whose heart and soul are described as being one? They all meditate always one wisdom, they savor one thing, they perceive one thing, they venerate one God, they confess one Lord Jesus Christ, they are filled with one Spirit of God. Whence deservedly they too all are called, not only one thing, but even one man, as the Apostle also indicated when he said: "All indeed run, but one receives the prize." You see plainly that of all the righteous, it is one who receives the prize. For the righteous man who is such truly imitates the one Lord. For, as I judge, that saying too which is spoken through the prophet, "Hear, O Israel, the Lord thy God is one God," designates him as one not merely in number—he who assuredly is to be believed to be above all number—but rather is to be understood to be called one for this reason, that he is never made other than himself, that is, is never changed, is never turned into anything else, as David also testifies of him, saying: "But thou art the selfsame, and thy years shall not fail." But that too looks to this sense which is written: "I am the Lord your God, and I am not changed." Unchangeable, therefore, is God: and for this reason he is called one, that he is not changed. So then the righteous man too, the imitator of God, who has been made to the image of God, is himself also called one when he has come to perfection, because he too, when he stands in the summit of virtue, is not changed, but remains always one. For as long as each one is in wickedness, he is divided through many things and scattered into diverse things; and while he is in the many kinds of wickedness, he cannot be called one. Therefore, since according to this wonderful unity the righteous man is one, indeed since even many righteous are one, for this reason also the holy Apostle exhorts the whole Church, saying: "That ye all say the same thing, and that there be no schisms among you, but that ye be perfected in the same mind and in the same knowledge." Therefore also in the Acts of the Apostles the heart and soul of the believers is said to be one. But if we wish to consider something still more subtle, we can find another unity as well. For example, if I have so mortified my members that the flesh no longer lusts against the spirit, nor the spirit against the flesh; if there be no longer another law in my members which fights against the law of my mind, and leads me captive into the law of sin; if all the things that are within me be perfected in one and the same mind, and be moved by one and the same purpose—then I too shall be one man.
'''
