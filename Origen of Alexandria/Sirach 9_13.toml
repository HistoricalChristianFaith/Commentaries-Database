[[commentary]]
quote='''
Understand that you walk in the midst of snares, and pass beneath overhanging engines. All things are full of nets; the devil has filled everything with snares. But if the word of God has come to you, and has begun to lean out from the nets, saying: Our soul, like a sparrow, has been snatched from the snare of the hunters; the snare is broken, and we are set free. Blessed are we by the Lord, who made heaven and earth. The bridegroom, then, leans out through the nets, making a way for you. Jesus descended to earth, subjected himself to the nets of the world. Seeing a great flock of men entangled in the nets, and [seeing] that it could be cut apart by no other than himself, he came to the nets, taking on a human body, which was held by the snares of the hostile powers; he burst them apart for you, and you shall say: Behold, here he is, behind our wall, looking through the windows, leaning out through the nets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 2"
