[[commentary]]
quote='''
But you indeed then bore "the image of the earthly"; now, however, having heard these things, cleansed by the Word of God from all that earthly mass and oppression, make "the image of the heavenly" shine forth in you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily13.html'
source_title="HOMILIES ON GENESIS 13.4"


[[commentary]]
quote='''
For just as a coin or denarius bears the image of the emperors of the world, so he who does the works of "the ruler of these darknesses" bears the image of him whose works he has: which image Jesus here commanded to be rendered back and cast off from our face, and that image to be taken up according to which from the beginning we were fashioned to the likeness of God. The logical sequence of these things Paul too has expressed, saying: "as we have borne the image of the earthy, let us also bear the image of the heavenly". So then, what he says: "render what is Caesar's to Caesar", this he means: lay aside the person of the earthy, cast off the earthly image, so that, putting upon yourselves the person of the heavenly, you may be able to render "what is God's to God".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily39.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 39"
