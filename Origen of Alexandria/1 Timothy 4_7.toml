[[commentary]]
quote='''
Let the Church of God, therefore, so understand its births, so receive its generations, so uphold the deeds of the fathers with a fitting and honorable interpretation, so not disfigure the words of the Holy Spirit with foolish and Jewish fables, but assign them full of honor, full of virtue and usefulness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily06.html'
source_title="HOMILIES ON GENESIS 6.3"
