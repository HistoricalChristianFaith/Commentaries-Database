[[commentary]]
quote='''
But if you have understood how an animal or a vessel or a vestment is called holy, understand consequently that by these observances and laws a human being too is called holy. For if anyone has devoted himself to God, if anyone has entangled himself in no worldly affairs, "that he may please him to whom he has proved himself"; if anyone is separated and set apart from the rest of human beings who live carnally and are bound to mundane affairs, not "seeking the things that are upon the earth, but those which are in the heavens", that one is rightly called holy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily11.html'
source_title="HOMILIES ON LEVITICUS 11"
