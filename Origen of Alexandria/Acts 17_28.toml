[[commentary]]
quote='''
To those without the law as without the law: he came to Athens; he found philosophers there; he used neither prophetic words nor legal ones, but if anywhere there was some Greek learning from his prior education, being reminded of this he would say to the Athenians; for he says, "As also some of the poets among you have said, For we too are his offspring." There to those without the law he became as without the law, that he might gain those without the law. And again he says, "Passing through and observing your objects of worship, I found also an altar on which was inscribed, To an Unknown God. Whom therefore you worship in ignorance, this one I proclaim to you." And through these words he begins to hand down reverence for God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XLIII"
