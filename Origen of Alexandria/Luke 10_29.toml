[[commentary]]
quote='''
But when the doctor of the law "wished to justify himself" and to show that no one was neighbor to him, and said: "Who is my neighbor?", the Lord introduced a parable whose beginning is: "A certain man was going down from Jerusalem to Jericho", and the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily34.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 34"
