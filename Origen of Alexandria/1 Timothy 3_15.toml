[[commentary]]
quote='''
For the soul, the bride of the Word, which abides in the royal house — that is, in the Church — is taught by the Word of God, who is her Bridegroom, whatever things have been laid up and stored away within the royal hall and the king's chamber. In this house, which is the Church of the living God, she learns also the cellars of that wine which has been gathered from the holy winepresses — cellars of wine not only new but also old and sweet, which is the teaching of the law and the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FBook%25203.html'
source_title="COMMENTARY ON THE SONG OF SONGS, BOOK 3"
