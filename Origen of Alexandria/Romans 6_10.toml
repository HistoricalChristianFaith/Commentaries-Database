[[commentary]]
quote='''
These things we have said, as best we could, concerning the questions raised in this place, so that it might shine forth more clearly how Christ died once to sin, and dies no more; and that in that He lives, He lives unto God. But to live unto God is to be understood in this way: that, when that is completed whereby, being placed in the form of God, He emptied Himself and took the form of a servant and was made obedient unto death, He abides again in the form of God, and equal to the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook05.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
