[[commentary]]
quote='''
That which is created after the image of God is understood as immaterial and surpassing every corporeal substance not only by Moses, but also by the Apostle, as is clear from the following words: "...having put on the new man, who is renewed unto knowledge after the image of Him who created him." Therefore in each of us there are two men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
