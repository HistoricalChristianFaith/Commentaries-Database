[[commentary]]
quote='''
But if your enemy hunger, feed him; if he thirst, give him drink: for in doing this you will heap coals of fire upon his head. These things indeed the Lord also commands in the Gospels. And although that understanding lies open, according to what we have said above — namely, that insofar as to enemies and to those who injure us we not only do not render requital but even bestow good things upon them, so far do we heap up their punishments in the judgment of God (for it is truly a just condemnation if they are convicted before God of having inflicted evils upon those from whom they received good things) — nevertheless let us see whether perhaps this commandment may contain some worthier meaning. For Jeremiah the prophet also says to the sinful daughter of Babylon: You have coals of fire, sit upon them, these shall be to you for a help. Perhaps, then, here too these coals of fire which are heaped upon the enemy's head are heaped up for his help. For it can come about that the enemy's savage and barbarous mind, if it perceives our kindness, if it sees our humanity, our affection, our devotion, may take on compunction of heart and bear repentance for what it has committed; and from this a certain fire may be kindled in him, which tortures and burns him for the conscience of what he has committed; and these will be the coals of fire which are heaped upon his head out of our work of mercy and devotion. But by "head" is meant the ruling part of the heart; and rightly is that called the head by whose understanding and prudence all the members are governed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
