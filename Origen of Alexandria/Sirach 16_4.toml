[[commentary]]
quote='''
Set down the whole number of the human race and from all the nations choose the faithful: without doubt they will be fewer than are the whole. Then next from the number of the faithful choose the better: it is certain that a much smaller number will remain. And again from those very ones whom you have chosen, choose again the more perfect: you will surely find fewer. And the further you proceed in choosing, the more scanty and the fewest you will find, until at last you come to some one man who may confidently say: "I have labored more than all those."
These therefore, who in this manner are the many, will receive more land and more of the bodily inheritance; but the few will obtain some scanty thing of land, because they have more in the Lord; but others will receive nothing at all of earthly inheritance, if any are worthy to be priests and ministers of God; for of these the Lord himself will be wholly the inheritance. And who is so blessed as either among the few to receive a scanty portion of land, or among the chosen priests and ministers to deserve to receive by lot of inheritance the Lord alone? Although these too on account of their beasts of burden receive something of land, but of that land which is contiguous to the cities and adjoins the towns.
Yet this saying which says that "to the more numerous the inheritance shall be multiplied" can still be understood in another way also. For one just man, according to this — that he is accepted by God — is counted for many. Finally it is also written: "By one wise man a city shall be inhabited, but the tribes of the wicked shall be made desolate." And one just man is reckoned for the whole world, but the wicked, even if they are many, are counted scanty and for nothing before God. There is therefore also a praiseworthy multitude, as we see said also to Abraham, when he led him outside and said to him: "Look to heaven, if you can number the stars; so shall your seed be." In this consider also this: how the just man is within and always stands in the inner parts, because within, in secret, he prays to the Father, and all the glory of the king's daughter, that is, of the royal soul, is within; but nevertheless God leads him outside when the matter requires it and the account of visible things demands it. In this way too, therefore, for those many who are as the stars of heaven in multitude the inheritance can be multiplied, and for those scanty ones — namely those who, even if they are many in number, are yet held scanty by the unworthiness and vileness of their life — a scanty inheritance may be set.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily21.html'
source_title="HOMILIES ON NUMBERS 21.2"
