[[commentary]]
quote='''
"There shall be no augury in Jacob, nor divination in Israel; in due time it shall be told to Jacob and Israel what God will accomplish." Therefore, since it has now seemed good to us to discuss each single thing more carefully, it does not seem absurd if we also inquire what augury or divination is — since indeed it pleased Scripture to make mention of these, lest anyone perhaps ignorantly fall into them. It seems to me, then, that the foreknowledge of things to come, so far as concerns the thing itself, is something intermediate — that is, neither properly good nor properly evil; since sometimes even from the side of the devil a foreknowledge of things to come can reach the knowledge of men. But without doubt, when the time and occasion demand and it is the will of God, foreknowledge is also given by God to men through the prophets; and therefore we said that it cannot properly be called good, since it sometimes comes from evil, nor properly evil, since it sometimes descends from God. And although examples of this abundantly supply themselves even from the divine Scriptures, yet we believe it suffices if we use that which we read written in the books of Kingdoms, where the ark of God was captured by the Philistines and brought down to Azotus, and there "they brought it," it says, "into the house of Dagon, and Dagon was found to have fallen prone to the ground before the ark of the Lord's covenant. And the hand of the Lord was heavy upon the men of Azotus and scattered them, and struck them in the buttocks." After this, it says, the ark entered into Accaron, and the men of Accaron sent and gathered all the satraps of the Philistines and gathered their priests and diviners, saying: "What shall we do with the ark of the Lord? Show us how we shall send it back to its place." The priests and diviners answered: "If you send back the ark of the Lord God of Israel, do not send it away empty, but you shall surely give it a gift for your trespass, and then you shall be healed, and it shall be made known to you. But if not, his hand will not depart from you." And a little later: "And now," it says, "make a new cart, and take two cows that have calved, on which no yoke has been placed, and yoke the cows to the cart, and lead their calves back home away from them. And take the ark of the Lord, and place it upon the cart, and the golden vessels which you have offered to it for your trespass, place together upon the cart, and all its holy things; and send it away, and let it go; and see: if indeed it goes by its own way and ascends to its own borders, to Bethsamis, it is this that has done us these great evils; but if it does not go thither, we shall know that his hand has not touched us, but that these things happened to us by chance." Observe, then, in these things, how the priests and diviners consider by set signs the cause of the evils which had happened to the Philistines — whether it came from the hand of God and on account of the injury to the ark, or happened by chance — saying: "If it ascends by its own way and to its own borders, to Bethsamis, it is this that has done us these evils." Finally, in what follows it is reported: "And when they had placed the ark of the Lord upon the cart," it says, "they set the oxen straight on the way, over against the way that leads to Bethsamis, and they did not turn aside to the right or to the left." Who then, in these things, if he examines carefully, would say that this foreknowledge, which was foretold about the direction of the oxen, was either fortuitous or composed by some art, and not administered by a certain operation of demons — who greatly feared the power of the ark of the Lord, by which not only were the Philistines afflicted and punished, but the very worship of the demons was destroyed, since their images and temples fell down at the entrance of the ark of the Lord? There is, then, in the ministry of foreknowledge a certain operation of demons of this sort, which is gathered by certain arts by those who have handed themselves over to demons, and which seems to be grasped and understood now through those things which they call lots, now through those which they call auguries, now also from the inspection of entrails, which they call extispicy, and by other deceptions like these. These arts have advanced so far toward deceiving the human race that even Manasseh, the son of the most just Hezekiah, deceived by this error, built, as Scripture says, an altar to all the host of heaven in both houses of the Lord. But I judge this host of heaven to be what Paul writes of as the spiritual wickednesses set in the heavenly places. Unless, then, there were much of deception and error in these arts, I do not think the son of so great a man, brought up in the law of the Lord, could have fallen into those impieties which are recorded written about him in the fourth book of Kingdoms. For it says: "And he practiced lots and augury, and made a burnt offering, and led his sons through the fire, and made soothsayers to abound, to do evil in the eyes of the Lord and to provoke him." Such, then, were the things he sinned in, of which it could be said that they were done "with all power, with lying signs and wonders, so that even the elect were deceived." For through him the people also was deceived, to do evil in the sight of the Lord above those nations which God had destroyed from before the face of the children of Israel. But in the second book of Chronicles as well, similar things are written about Manasseh: "And he made groves," it says, "and worshiped all the host of heaven and served them. And he built altars in the house of the Lord, where the Lord had said: In Jerusalem shall my name be forever. And there he set up altars to all the magnificence of heaven in both houses of the Lord. And he himself led his sons through the fire in Gehennon; and he practiced lots and did sorceries and augury, and made ventriloquists and enchanters, and multiplied them, to do evil in the sight of the Lord, to provoke him." All these things, then — that is, whether augury, or extispicy, or any sacrifice whatever, or even the casting of lots, or any motions of birds or of beasts, and any inspection of entrails, so as to seem to show something about the future — I do not doubt are done by the operation of demons, who direct the motions of birds or beasts or entrails, or of lots, according to those signs which the same demons taught to be observed by those to whom they handed down the knowledge of this art. From all of which he who is a man of God and is numbered in God's portion ought to be utterly a stranger, and to have nothing in common with these things which demons work by hidden contrivances; lest perhaps through these he be again associated with demons and be filled with their spirit and power and be restored anew to the worship of idols. For our divine and heavenly religion abjures all these things, indicating it in Leviticus by an open law and saying: "You shall not divine, nor practice augury," and a little later: "You shall not follow ventriloquists," it says, "nor join yourselves to enchanters, to be defiled by them; I am the Lord your God." And again in Deuteronomy: "But if you," it says, "enter into the land which the Lord your God will give you, you shall not learn to do according to the abominations of those nations. Let there not be found in you one who purifies his son or his daughter in the fire, nor one divining divination, nor one casting lots, nor a sorcerer, nor an enchanter, nor a ventriloquist, nor an inspector of portents, nor one questioning the dead. For everyone who does these things is an abomination to the Lord; for on account of these abominations the Lord your God overthrows these nations from before you." In all of which he seems to show that everyone who is occupied in these things does nothing else than question the dead. For they are dead, because they are not partakers of life. But our God is the God of the living and not of the dead. But to all these laws this too is added: that he who wishes to be perfect should learn from no one else except from him who by the power of God has been chosen a prophet, to minister to the people. It says, therefore: "Be perfect in the sight of the Lord your God; for these nations, whose inheritance you have received, they hearken to soothsayers and diviners; but to you the Lord your God has not so given. For the Lord your God will raise up for you a prophet from your midst, from your brothers; him you shall hear. According to all that you asked of the Lord your God at Horeb in the day of the assembly, when you said: We will not continue to hear the voice of the Lord our God, and we will not see this great fire any more, lest we die." God does not wish us to become hearers and disciples of demons, nor does he wish that, if we want to learn anything, we learn it from demons. For it is better to be ignorant than to learn from demons, and it is better not even to learn from a prophet than to inquire of diviners. For divination is not, as some think, given divinely, but rather, as it seems to me, has received its name by antiphrasis, that is, by the contrary, as being something that happens through men filled with a demon. But the rite of the gentiles believed everything to be divine that is brought forth through any spirit whatsoever; yet God commands us to learn nothing from these, lest we become their associates and fall into the things which Isaiah says: "And your words shall be humbled to the earth, and your speech shall be sunk beneath the earth; and your voice shall be as of one speaking from the earth, and your voice shall be weakened to the ground." For this reason our Lord Jesus too does not deign to receive testimony from demons, but says: "Be silent and come out of him." His own apostle Paul too, imitating him, "grieving," it says, "turned and said to the spirit of Python: I command you in the name of Jesus Christ; depart from her." In which you may perhaps ask why Paul, grieving, rebukes the spirit of Python. Had it said anything blasphemous? For "a woman," it says, "having a spirit of Python followed Paul and those who were with him, and cried out, saying: These men are servants of the Most High God, who announce to you the way of salvation. And she did this for many days." Whence it is shown that Paul grieved not because of blasphemy, but because he judged it unworthy that testimony be given to his preaching by a spirit of Python. But if Paul does not allow it to give testimony to him, but grieves over this: how much more ought we to grieve, when at any time we see souls being deceived by those who believe, as though in some divine spirit, in a spirit of Python or a ventriloquist or a diviner or an augur or any other demons of this kind? For this reason, then, "there shall be," it says, "no augury in Jacob, nor divination in Israel." But what is added to these things? "In due time," it says, "it shall be told to Jacob and Israel what God will accomplish." What does "in due time it shall be told" mean? When it is fitting and when it is expedient — that is "in due time." If, then, it is expedient for us to foreknow the future, it will be told by God through the prophets of God, through the Holy Spirit; but if these things are not told nor announced, know that it is not expedient for us to foreknow what is to come. But if they are not told us for this reason, because it is not expedient for us to know them, those who by various arts and invocations of demons are eager to foreknow the future do nothing else than desire to learn the things which it is not expedient for them to know. But "Jacob" in these words is to be understood as everyone whose struggle is against the principalities and powers and against the rulers of this world; and understand "Israel" as everyone who, through the purity of faith and the cleanness of mind, sees God. But someone may say: if we ought to learn about the future from God alone and to receive neither a diviner nor an augur nor any other of these, then not even this Balaam himself is to be received by us; for he is one of those whom the divine judgment forbids to be received. But attend more carefully and remember what we read above, where it is said of him that the Lord put his word into his mouth; therefore we now learn these things not from Balaam, but from the word of God which is placed in his mouth. For unless they were the words of the Lord, he would surely not have revealed them to his servant Moses; and these things, since he was set far away when they were being spoken by him to King Balak, it is certain that Moses could not have known unless they had been revealed to him by God. But further, to destroy divination or augury and other such things utterly, we will also fittingly add this: that all these people use the ministry of birds or animals — but of such as are both written as unclean in the law and are found always to be lying in wait against the human race, from which fact they are indeed judged suitable and worthy for the ministry of demons. For dragons and other serpents are said to minister to spirits of Python; and to augurs and to those who are thought to catch auspices for divining from chance occurrences, either wolves bring omens, or foxes, or hawks, or ravens, or eagles, or other such creatures — which in the law Moses, for these reasons I believe, marked as unclean.
'''
