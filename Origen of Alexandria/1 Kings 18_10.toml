[[commentary]]
quote='''
As to my saying over the whole earth of Judea or Jerusalem, so that we may not understand every element of the earth, this is the proof, which is written in the third book of Kingdoms, where Obadiah the steward of Ahab said to Elijah: "what have I sinned, that you have given your servant into the hands of Ahab, that he may put me to death? As your God lives, if there is a nation or kingdom where my lord has not sent to seek you, and I said: he is not here, and he burned the kingdom and its regions, because he did not find you". For who would be so stony, reading these things, as to suppose that Ahab king of Israel sent into every nation of the world and into every kingdom of the whole earth seeking Elijah, and burned wherever it was said: Elijah is not here? But without doubt those things were said hyperbolically, showing that he sought him abundantly among the nations that were around Judea, according as he was able to seek.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252027.html'
source_title="COMMENTARY ON MATTHEW 134"
