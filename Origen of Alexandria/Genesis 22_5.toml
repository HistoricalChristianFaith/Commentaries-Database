[[commentary]]
quote='''
"Abraham," it says, "looking up saw the place from afar and said to his servants: sit here with the she-ass, but I and the boy will go as far as there, and when we have worshipped, we will return to you." He dismisses the servants. For the servants could not ascend with Abraham to the place of the burnt offering, which God had shown. "You," therefore, he says, "sit here, but I and the child will go; and when we have worshipped, we will return to you." Tell me, Abraham, do you truly say to the servants that you will worship and return with the child, or do you deceive? If you speak the truth, then you will not make him a burnt offering. If you deceive, it does not befit so great a patriarch to deceive. What state of mind, then, does this speech indicate in you? I speak the truth, he says, and I offer the boy as a burnt offering. For this reason I both carry the wood with me and return with him to you. For I believe, and this is my faith, that "God is able to raise him even from the dead."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily08.html'
source_title="HOMILIES ON GENESIS 8.5"
