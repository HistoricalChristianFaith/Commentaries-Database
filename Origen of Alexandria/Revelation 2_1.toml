[[commentary]]
quote='''
You will find in many places, and especially in the Psalms, that discourse is directed also to the angels, since power is given to man—to him, that is, who has the Holy Spirit—to address even the angels. Of these I will set down one example, that we may know that the angels too are instructed by human voices. It is written in the Apocalypse of John: "To the angel of the church of the Ephesians write: I have something against you". And again: "To the angel of the church of Pergamum write: I have something against you". Certainly it is a man who writes to the angels and commands them something.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily23.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 23"
