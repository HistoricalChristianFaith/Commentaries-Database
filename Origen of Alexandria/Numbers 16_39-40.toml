[[commentary]]
quote='''
With God, as we are given to understand, nothing is useless, nothing idle; but even those things which seem fit to be alienated and cast away by men are found to have some necessary function. This understanding is suggested to us by the present reading, which makes mention of the censers of Korah and of the rest who sinned along with him — that God commands that not even these be thrown away, but that from them beaten plates be made, and that the altar be encircled with them. Scripture therefore relates that, by the command of God, "Eleazar the son of Aaron the priest took," it says, "the bronze censers, which those who were burned up had offered, and they made of them plates, and set them upon the altar, for a memorial to the children of Israel, that no stranger who is not of the seed of Aaron should draw near to lay incense before the Lord, lest it should happen as with Korah and his conspiracy, as the Lord had spoken by the hand of Moses." Plainly in a certain place the Lord says through the prophet: "My counsels are not as your counsels, nor my thoughts as your thoughts." If this case were being judged today among men, and an examination held among the leaders of the churches concerning those men who, teaching things at variance with the churches, endured the vengeance of divine retribution, would it not be judged that whatever they had spoken, whatever they had taught, whatever also they had left in writing, should all alike perish together with their very ashes? But the judgments of God are not as our judgments. For hear how, concerning the censers of those who had risen up against the prophet of God, plates are commanded to be made and to be fastened around the altar. Korah holds the figure of those who rise up against the faith of the Church and the doctrine of the truth. It is written, then, of Korah and of his company that they offered incense of strange fire in bronze censers. The strange fire indeed is commanded by God to be scattered and poured out, but "the censers," it says, "because they are sanctified, make of them beaten plates, and encircle the altar with them, because they were offered before the Lord and are sanctified." This therefore seems to me to be shown through this figure: that those censers, which Scripture names as bronze, hold the figure of the divine Scripture. To this Scripture heretics, laying strange fire upon it — that is, introducing a meaning and understanding foreign to God and contrary to the truth — offer to the Lord an incense not sweet but abominable. And therefore a pattern is given to the priests of the churches, that, if ever any such thing should arise, those things indeed which are foreign to the truth should be utterly thrust away from the Church of God; but if any things be found inserted even in the very words of the heretics from the senses of the divine Scripture, these should not be rejected together with those things that are contrary to the truth and the faith; for the things that are brought forth from the divine Scripture are sanctified, and offered to the Lord. But it can also be understood in yet another way, that it is commanded concerning the censers of the sinners that they be joined and associated with the altar. And first this very point, that they are called bronze, will seem not idle. For where there is true faith and the whole preaching of the word of God, they are called either silver or golden, so that the gleam of gold may declare the purity of the faith, and the silver tried by fire may signify words that have been tested. But these, which are called bronze, consist only in the sound of the voice, not in the power of the spirit, and they are, as the Apostle says, like sounding brass or a tinkling cymbal. These bronze censers, then — that is, the utterances of the heretics — if we apply them to the altar of God, where there is the divine fire, where there is the true preaching of the faith, the truth itself will shine the better by comparison with what is false. For if, to give an example, I set down the sayings of Marcion or Basilides or of any other heretic whatsoever, and refute these with the discourses of truth and the testimonies of the divine Scriptures as with the fire of the divine altar, will not their impiety appear more evident from that very comparison? For if ecclesiastical doctrine were simple, and were girt about by no assertions of heretical dogmas from without, our faith could not seem so clear and so well tested. But for this reason the attack of gainsayers besets the catholic doctrine, so that our faith may not grow numb in idleness, but may be filed smooth by exercises. On account of this, finally, the Apostle also said: "But there must also be heresies, that they who are approved may be made manifest among you." This is to say: the altar must be encircled with the censers of the heretics, so that the difference between the faithful and the unfaithful may become certain and manifest to all. For when the ecclesiastical faith has begun to shine like gold, and its preaching has gleamed to those who behold it like silver tried by fire, then with greater foulness and disgrace will the voices of the heretics be sordid in the cheapness of dull bronze. But do you wish to know that the things which are good are known to be good rather from comparison with worse things? Who would know that light is good, unless we felt the darkness of night? Who would know the sweetness of honey, unless he had received a taste of bitterness? Finally, if you were to take away the devil himself and the contrary powers that struggle against us, the virtues of the soul could not shine forth without one who struggles against them. So therefore also the glory of the faithful priests will not be able to shine forth, unless the reprobation and punishment of the unfaithful commend it. But also from those things which we read, each single one of the just is seen to be held more illustrious before God by comparison with the rest. So of Noah it is written that he was "just and perfect in his generation." In which it is shown that he was not perfect absolutely, but perfect in his generation, and by comparison with the rest was pronounced just. In like manner I think it must be held also of Lot. For by how much worse the Sodomites daily became, by so much did he appear the more just. But also in this very book which we have in hand, when those who had inspected the land had returned, and ten of them had struck despair into the people by their fearful words, while the two remaining — that is, Caleb and Joshua — announced good things and exhorted the people to remain in their purpose, it was not so much their own confession as the fearfulness of their comrades that conferred upon them an immortal merit from the Lord. For the virtue of soul in them would not have shone so magnificently, had not the fearfulness of the base cowardice of the remaining ten lain open to view. These things we have said concerning the censers of those who were condemned, which are commanded to be fastened to the altar: that from comparison with the inferior the just appear more illustrious, and at the same time that an example might be given to those who come after, that no one puffed up with the presumption of a proud spirit should seize upon the office of the pontificate as a gift not given him by God, but that he should yield to that man whom neither human ambition nor corrupt favor has taken up, nor condemnable bribery substituted, but the consciousness of merits and the will of God has taken up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily09.html'
source_title="HOMILIES ON NUMBERS 9.1"
