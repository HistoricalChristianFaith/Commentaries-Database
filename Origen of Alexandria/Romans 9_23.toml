[[commentary]]
quote='''
And again, "upon vessels of mercy" — that is, upon those who have cleansed themselves from every stain of sin, from which "no one is clean, not even if his life has been of a single day" — he makes known the riches of his glory: which vessels he prepared unto glory not by some unreasoning or fortuitous grace, but because they had themselves purged themselves of the aforesaid stains.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"


[[commentary]]
quote='''
And he also makes known "the riches of his glory upon vessels of mercy, which he prepared unto glory." The riches of God become known when his mercy is shown toward those who are despised among men and are lowly, who hope not in their own riches nor in their own power, but in the Lord. Just as at that time the nation of the Hebrews, despaired of among men and cast off, obtained mercy from God; so therefore now also the people of the Gentiles, who were despised and despaired of by those who glory in circumcision, has obtained mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
