[[commentary]]
quote='''
And in the fourth place I would compare the dog-fly to the sect of the Cynics, who, among the rest of the wicked doings of their deception, even proclaim pleasure and lust to be the highest good. Since therefore through each of these the world was previously deceived, the word and law of God, coming, convicts it with corrections of this kind, so that from the quality of the punishments it may recognize the qualities of its own error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily04.html'
source_title="HOMILIES ON EXODUS 4"
