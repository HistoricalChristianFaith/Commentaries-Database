[[commentary]]
quote='''
"O Lord, humble for me those stronger than I". This is the voice of the faithful, who confess simply that their enemies are stronger, against whom is our struggle and battle, because "our battle is not against flesh and blood" — otherwise our adversary would not be stronger — but since "our wrestling is against principalities and powers and against the rulers of the darkness of this world and against the spiritual forces of wickedness", therefore the prophet says: "O Lord, humble for me those stronger than I". For how should this so great force of spirits not be far more powerful than human frailty? But in this God "helps our weakness", in that the Apostle says: "I can do all things in him who strengthens me, Christ". These powers, then, are indeed stronger than we; but again, "Christ", who is in us and "strengthens" us, is stronger than all, "to whom is glory and dominion unto the ages of ages. Amen!".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily06.html'
source_title="HOMILIES ON JUDGES 6"
