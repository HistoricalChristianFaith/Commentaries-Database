[[commentary]]
quote='''
"But also your face," he says, "is beautiful." If you understand that face of which Paul speaks: "But we all with unveiled face"; and again when he says: "But then face to face": then you will see what is the face of the soul which is praised by the Word of God and is said to be beautiful. That face, without doubt, which is daily renewed after the image of him who created it, which has in itself no spot, or wrinkle, or anything of this kind, but is holy and immaculate; such as Christ also presented the Church to himself … For just as, when the soul is in anger, it renders the countenance of the body troubled and fierce … so also the face of the Church is pronounced either comely or foul according to the virtues and morals of believers, according to that which we read written: "The trace of the heart in good things, a cheerful countenance." And again elsewhere: "The face of a glad heart is flourishing, but of one placed in sorrows the countenance is mournful." Therefore the heart is glad when it has in itself the Spirit of God: whose first fruit is charity, the second is joy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FBook%25204.html'
source_title="COMMENTARY ON THE SONG OF SONGS, BOOK 4"
