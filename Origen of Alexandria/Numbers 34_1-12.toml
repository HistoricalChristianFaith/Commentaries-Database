[[commentary]]
quote='''
The last narrative in the book of Numbers is recounted, in which the Lord commands Moses to give precepts to the children of Israel so that, when they have entered the holy land to receive its inheritance, they may know what boundaries of their borders they ought to observe in it. And after these things, with the Lord himself now describing it, it is said: toward the Africus, that is, toward the west, let the boundary of that place be observed, and of that one toward the east; and thus through the four quarters of heaven the Lord himself designates certain names which the people of God ought to keep in this earthly Judaea. Now the simpler among the hearers will say concerning these things that they can seem necessary and useful even according to the letter, for this reason: that no one may transgress the boundaries established by the Lord's precept, and that one tribe may not dare to violate the borders of another. And what shall we do, since in these lands there remains for the Jews no possibility not only of invading another's borders, but even of possessing anything in any way at all? For they are fugitives from it and, banished, live in exile; and the borders which those now in possession keep are not those which the divine law appointed, but those which the laws of the conquerors have assigned. What, I say, shall we do, who read these things in the Church? If we read them according to the understanding of the Jews, they will surely seem to us superfluous and empty. But I, who read what is written concerning wisdom, "Go out after her like a tracker," wish to go out after her; and since I do not find her in bodily things, I desire to follow her tracks and to investigate where she goes, and to see to what resting-places she draws my understanding. For I think that, if I am able diligently to follow her and to investigate her ways, she will give me some occasions from the Scriptures as to how we too ought to explain even these passages, if we believe those things which Paul speaks in a mystery: that those who serve through the law serve a shadow and an image of heavenly things. And if, no less according to his own opinion, the law—of which this reading that we have in hand is a part—has a shadow of the good things to come, it seems consequent and necessary that all things which are described in the law as though about earthly matters are shadows of heavenly goods, and that the whole inheritance of that land, which in Judaea is called the holy land and the good land, is an image of heavenly goods, of which these things that are recounted as good on earth hold, as we have said, the shadow and image.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily28.html'
source_title="HOMILIES ON NUMBERS 28.1"
