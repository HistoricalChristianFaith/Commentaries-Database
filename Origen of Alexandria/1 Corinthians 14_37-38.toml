[[commentary]]
quote='''
Concerning this the Apostle also adds, next after these words: "If anyone among you is a prophet or spiritual, let him recognize that the things I write are of God; but if anyone is ignorant, he is ignored." Not only, then, is the one who is ignorant of the Apostle's words ignored by God, but also, if anyone is ignorant—speaking by a divine spirit and yet saying that he does not speak by a divine spirit—he is ignored by God. And through these words the Apostle seems to teach that there is no man who does not have another spirit in him besides the spirit of the man that is in him. For whether he is a stranger to the faith or belongs to it, he has a spirit of his own from God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT XLVII"

[[commentary]]
quote='''
A spiritual man is one able to test every word and every meaning, even one that, through the great depth of meaning, is so hard to discern that it cannot be examined. Now it does not belong to any chance person to know that the things written by Paul are the Lord's, but to a prophet or a spiritual man; therefore he who does not know that they are the Lord's is neither a prophet nor a spiritual man. And it is one thing to believe and another to know; therefore he who is ignorant that they are the Lord's is ignorant, since he has not yet attained to being properly God's. For the one who is known is, in a certain manner, blended together with the one who knows him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LXXII*"

[[commentary]]
quote='''
In order, then, that we may recognize the things of God, let us entreat the one who gives gifts of grace, that he may give us a prophetic gift and make us spiritual by the Spirit that governs; and so we may be equipped to judge which things are God's or which are not his. For he who has been deprived of this grace cannot comprehend; whence he added But if anyone is ignorant, let him be ignorant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LXXV"
