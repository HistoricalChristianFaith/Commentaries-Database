[[commentary]]
quote='''
For of this matter there is also that image which is spoken of in the Gospel concerning "the steward of iniquity," who says to each debtor: "Take your bond, and sitting down write eighty," and the rest that is reported. You see, then, that it is said to each: "Take your bond." Whence it is established that the letters of sin are ours; but the letters of righteousness God writes. For thus says the Apostle: "For you are an epistle inscribed not with ink, but with the Spirit of the living God, not on tablets of stone, but on the fleshly tablets of the heart." You have, then, within you the letters of God and the letters of the Holy Spirit. But if you offend, you yourself write for yourself the handwriting of sin. But see that, once you have come to the cross of Christ and to the grace of baptism, your handwriting has been fastened to the cross and blotted out in the font of baptism. Do not write again the things that have been blotted out, nor restore the things that have been abolished; keep in you only the letters of God, let only the writing of the Holy Spirit remain in you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily13.html'
source_title="HOMILIES ON GENESIS 13.4"
