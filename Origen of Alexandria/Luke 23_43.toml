[[commentary]]
quote='''
For just as to that one who confessed he opened the gates of paradise by saying: "today you shall be with me in paradise", and through this gave to all who believe and confess an entrance for entering, which formerly, when Adam sinned, he had shut up — for who else could move aside "the flaming, turning sword which was set to guard the tree of life" and the doors of paradise? Who else could bend the "cherubim" watching with ever-wakeful guard, unless he alone to whom "all power in heaven and on earth has been given"? — so, I say, as none other but he himself could do these things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily09.html'
source_title="HOMILIES ON LEVITICUS 9"


[[commentary]]
quote='''
"I will recall you from there in the end." I think this means that at the end of the ages his only-begotten Son descended even into the nether regions, for the salvation of the world and recalled "the first-formed man" from there. Understand that what he said to the thief, "This day you shall be with me in paradise," was not said to him alone but also to all the saints for whom he had descended into the nether regions. In this man more than in Jacob the words will be fulfilled, "I will recall you from there in the end."
'''
source_url=''
source_title="HOMILY ON GENESIS 15.5"
