[[commentary]]
quote='''
From the text before us the resurrection of Christ is clear, having come about together with the flesh which he had; but they, the heterodox, wish to allegorize the resurrection of human beings. Then let them allegorize the Savior's resurrection also, wickedly annulling the text by their own [device].
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LXXXI*"
