[[commentary]]
quote='''
The outer man has ears, and it is said that the inner man too has them. "He who has ears to hear, let him hear!" All who heard Jesus had bodily ears, but not all succeeded in keeping their inner ears pure. The possession of the former does not depend on us; the possession of the latter — depends on us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
