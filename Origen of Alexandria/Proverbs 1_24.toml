[[commentary]]
quote='''
And these, if anyone should meditate upon them in the law of the Lord day and night, and if anyone, like the just man whose mouth meditates the wisdom of the Lord, shall be able to investigate them more diligently, he will also be able to find them — provided nevertheless that he has sought rightly, and, seeking, has knocked at the door of wisdom, asking of God that it may be opened to him, and that he may be worthy to receive through the Holy Spirit the word of wisdom and the word of knowledge, and to be made a partaker of that wisdom which was saying: "For I was extending my words, and you were not hearing." And rightly did she say that she extends her words in the heart of him to whom God has given, as we said above, breadth of heart. For the heart of that man is enlarged who is able to explain, with a broader teaching, those things which have been briefly said in mysteries, by means of assertions taken from the divine volumes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"


[[commentary]]
quote='''
How then is the heaven stretched forth? Wisdom stretches it forth. For it is clear that wisdom stretches it forth in the text: "Since I stretched forth words and you did not pay attention." He speaks of words being stretched forth; in this way the heaven is stretched forth.
'''
source_url='https://www.google.com/books/edition/Homilies_on_Jeremiah_and_1_Kings_28/UFInXpKNapEC?hl=en&gbpv=0'
source_title="HOMILIES ON JEREMIAH 8:2.3"
