[[commentary]]
quote='''
John ate locusts, suggesting that the people of God were being nourished by a word that traveled high aloft in the air and had not yet passed over the earth. In the second place John ate honey, which is not obtained by people through their own efforts. The honey produced under the law and the prophets was not accessible to those who were inquiring only superficially about the meaning of the Scriptures and not searching their deeper intention.
'''
source_url=''
source_title="FRAGMENT 41"


[[commentary]]
quote='''
"John was" therefore "in the desert" and was nourished in a new manner beyond human custom, Matthew himself recording the very thing: "and his food was locusts and wild honey". For because he was the minister of the first coming of the Savior and spoke only of the dispensation of the Lord's flesh, and his prophecy foretold him who had been born of a virgin, he did not have domestic honey refined by human care, but "wild honey" and winged — which was his food — winged, not great, not lifting itself on high, but a small winged thing, scarcely rising from the earth and leaping rather than flying. Why say more? It is said most plainly that "locusts" were his food, a small and clean animal. Consider therefore, dearest brethren, that he who had been born in a new way was in a new way also nourished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily11.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 11"
