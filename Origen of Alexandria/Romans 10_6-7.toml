[[commentary]]
quote='''
This righteousness, then, which is of faith, which is Christ, as living and subsisting, this, he says, speaks thus: "Say not in your heart: Who shall ascend into heaven? that is, to bring Christ down; or, Who shall descend into the abyss? that is, to bring Christ back from the dead." And do not wonder that, although Christ himself is righteousness, he here seems to speak of himself as though of another. For in many places you will find the Savior speaking of himself as though of another; as in the Gospel he says: "And he shall set the sheep on his right hand, but the goats on the left: and he shall say to those who are on the right hand," and again to those who are on the left, the things that are written. Now what he says: "Say not in your heart: Who shall ascend into heaven, or who shall descend into the abyss?" — apart from the clauses which he inserts in between, "that is, to bring Christ down, or to bring him back from the dead" — and also, "The word is near, in your mouth and in your heart," seems to be taken from Deuteronomy, where it is written in this manner: "This commandment, which I command you this day, is not too high for you, nor far from you. It is not in heaven, that you should say: Who shall ascend for us into heaven, and take it for us, that hearing it we may do it? Neither is it beyond the sea, that you should say: Who shall cross over the sea for us, and take it, that hearing it we may do it? The word is very near you, in your mouth, and in your heart, and in your hands, that you may do it." Since, therefore, these things are taken from Deuteronomy, and the Apostle writes that the righteousness which is of faith — which is Christ — says these very things, without doubt the Apostle declares that what is said in Deuteronomy was said by Christ. It is he, then, who says: "This commandment, which I give you this day, is not too high for you, nor far from you," and the rest that follows. What, then, is it that the Apostle teaches through this? Namely, that we should not say in our heart, and suppose, that Christ is confined in some one place, and is not everywhere, and diffused through all things: seeing that he, while he was on earth, said that he was also in heaven. For thus he spoke to his apostles: "No one has ascended into heaven, except him who descended from heaven, the Son of Man who is in heaven." He did not say, who was, but "who is in heaven." And again, lest we suppose that he is only in heaven, and that the abyss is empty of his presence, therefore the righteousness which is of faith says: "Say not in your heart: Who shall ascend into heaven?" And as though this were like saying, to bring Christ down from heaven, so the Apostle added: "That is, to bring Christ down." And again, if anyone should descend in mind and thought into the abyss, supposing Christ to be contained there alone, as though this were like calling Christ back from the dead, so he subjoins: "That is, to bring Christ back from the dead." But you ought, he says, so to think concerning Christ, as concerning the Word, and truth, and wisdom, and righteousness of God. Now all these things are not sought in a place, but are present everywhere: nor are they summoned up from the regions below, but are grasped by the mind and understanding alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook08.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
