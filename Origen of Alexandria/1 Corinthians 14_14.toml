[[commentary]]
quote='''
You see that everywhere the things which pertain to the praises of God — for this is "the sacrifice of praise" — ought to be "new and fresh", lest perchance, when you bring forth old things in the Church, your lips speak and your "mind be without fruit". But hear what the Apostle says: "if," he says, "I speak with tongues, my spirit prays, but my mind is without fruit. What then is it? I will pray," he says, "with the spirit, I will pray also with the mind, I will say a psalm with the spirit, I will say a psalm also with the mind". So therefore you too, if not out of spiritual learning, out of the doctrine of the grace of God, you bring forth a present and fresh discourse in the praises of God, your mouth indeed offers "a sacrifice of praise", but your mind is convicted for the barrenness of yesterday's flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily05.html'
source_title="HOMILIES ON LEVITICUS 5"
