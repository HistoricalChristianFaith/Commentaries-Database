[[commentary]]
quote='''
"But if any man has not the Spirit of Christ, he is none of his. And if Christ is in you, the body indeed is dead because of sin, but the spirit is life because of justification. But if the Spirit of him who raised up Jesus from the dead dwells in you, he who raised up Jesus Christ from the dead shall quicken also your mortal bodies because of his Spirit that dwells in you." That the apostle Paul employs firm syllogisms drawn together by the dialectical art, whether in this place or in others of his Epistles, does not seem to me a thing to be set forth now, lest perhaps we appear to be advocates not so much of his knowledge as of his speech — in which he does not wish to be called skilled; and therefore we shall hasten rather to examine the sense of the chapter set before us. In what went before, where he said: "But you are not in the flesh, but in the spirit, if so be that the Spirit of God dwells in you," we explained in a twofold manner what it is to be in the Spirit: that is, either to understand the law not according to the letter but according to the spiritual sense; or else, with the body mortified, to live by the laws of the spirit and not of the flesh. And now, therefore, as to what he says, "But if any man has not the Spirit of Christ, he is none of his," and then adds, "But if Christ is in you," it must be asked whether it is a different thing for the Spirit of God to be in someone, or the Spirit of Christ, or even Christ himself, or the Spirit of him who raised Jesus from the dead. But so far as I regard either the sequence of the present passage, or that which the Savior says in the Gospel concerning the Holy Spirit, that "he proceeds from the Father," and, "He shall receive of mine" — and he joins in what follows the explanation of this word, saying: "Father, all mine are thine, and thine are mine: therefore I said that he shall receive of mine" — when, I say, I behold so great a principle of unity between the Father and the Son, the Spirit of God and the Spirit of Christ seem to me to be called one and the same Spirit. Yet we can also understand in this way what he said, "But if any man has not the Spirit of Christ, he is none of his" (since in truth it seems to be pronounced abruptly), namely, that if anyone has not deserved to be so great and such a one as to be worthy to have the Spirit of Christ, he is straightway denied to belong to Christ — whereas he says in the Psalms: "Mine are all the wild beasts of the woods, the cattle on the mountains, and the oxen." And if the wild beasts and the cattle are his, how are men not his? But it can, as I have said, be understood thus, like that saying in the Gospel: "He who does not take up his cross and follow me is not worthy of me." And so here too, he who has not the Spirit of Christ — that is, who is not moved by that same Spirit, so as to be ready to go even unto death for justice, for truth, for announcing the word of God, for preaching the kingdom of heaven, for casting away the letter of the law and opening up its spirit, for resisting against sin — he who is not ready for all these things is not his disciple. He, therefore, who is not such, and does not bear such a Spirit within him, is indeed his creature, like the wild beasts of the woods and the cattle on the mountains and the oxen, but he is not his disciple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
