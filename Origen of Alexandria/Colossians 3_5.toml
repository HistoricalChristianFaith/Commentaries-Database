[[commentary]]
quote='''
Or did not the whole error of the heathen take its beginning from this, when they will that those things which men greatly love should be gods, and ascribe the divine name to any human vices and desires? For those greedy for money and burning with the love of avarice call Mammon, as among the Syrians, the god of that greed; the lovers of lust and pleasure ascribe to themselves Venus as the goddess of this vice by which they are driven. Likewise in the other vices too they have made this very affection, by which they are urged on, their God. Whence the Apostle also says the same thing; for he says: "and avarice, which is the worship of idols". You see, then, that not only to adore an idol, but even to be devoted to "avarice" is reckoned "the worship of idols" and slavery. So therefore we too, when we are so given over to certain vices that we "love them with all our heart and with all our soul and with all our strength", are said to adore idols and "to have gone after strange gods".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily02.html'
source_title="HOMILIES ON JUDGES 2"
