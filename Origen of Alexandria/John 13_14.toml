[[commentary]]
quote='''
But consider if it is not also difficult for anyone who is a disciple of Christ who wishes to fulfill the command that says, "You also ought to wash one another's feet," since he is obliged to desire to perform the work of washing his brothers' feet, which are physical and perceptible to the senses. Consequently, the faithful [are obliged] to do this in whatever station of life they happen to be, whether bishops and presbyters who seem to be in ecclesiastical prominence, or even those in other positions of honor in the world. This means that the master comes to wash the feet of the believing servant, and parents wash the feet of their son. This custom either does not occur, or it occurs exceedingly rarely and among those who are very simple and rustic.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252032.html'
source_title="COMMENTARY ON THE GOSPEL OF JOHN 32.133"


[[commentary]]
quote='''
Let us take, for example, "he washed the feet of the disciples", and they indeed "saw" well how the master "washed the feet" of "the disciples"; but others too who were present "saw" — yet only what was being done, not also why it was being done. For there was a likeness in the washing of "the feet" with which the Word of God "washed the feet of the disciples"; therefore the Savior says to Peter, who refused and said: "you shall not wash my feet", what does he say? "What I do you do not know now, but you shall know afterward". What, then, do "you do" now? says Peter; I see you "washing" our "feet", and the "basin" set, you "girded with a towel" and serving us and "wiping" our "feet". But because this was not the whole business — for indeed the Savior, stripped, "pours" spiritual "water into a basin" according to the scriptures and "washes the feet of the disciples", so that, when they have been made "clean", they may ascend to him who says: "I am the way", and not be full of the "dust" which he willed to be "shaken off" upon the unworthy and upon those who did not receive peace nor were worthy of the things which were spoken — and because this was what was signified, therefore he says: "what I do you do not know now, but you shall know afterward". And this was what was said in the rest: "you call me master and Lord, and you say well; for so I am. If then I, the Lord and master, have washed your feet, you also ought to wash one another's feet". Does he then say this, that the bishop, "pouring water into a basin and having laid aside his garments and being girded with a towel", should "wash" my "feet" as I stretch them out, seeing that "you", he says, "ought to wash one another's feet"? If this is what is meant, none of us will keep the commandment; for no deacon or presbyter or bishop, "taking a towel", has "washed the feet" of any and all who come. But if you understand what is written, those who are truly blessed bishops, serving the Church, "pour water" from the scriptures into the "basin" of the soul, which is according to the scriptures, and attempt to "wash" and cleanse away and cast off the filth of "the feet of the disciples". And thus the bishops keep the commandment, imitating Jesus, and thus also the presbyters. Would that I too might now receive "water" which could "wash the feet" of your soul, so that each one of you, when he has been "washed", may say: "I have washed my feet, how shall I defile them?". For the bride says this in the Song of Songs, showing not bodily "feet washed", but "feet that do not stumble", of which Solomon says: "let your foot not stumble", and of which it is also written in the Psalms: "but my feet were almost moved". And moreover, those women who are appointed "widows" in the churches — "if", he says, "she has washed the feet of the saints". But if you wish to hear more plainly how the "widow washes the feet of the saints", hear Paul in another place appointing rules for "widows" and saying: "teaching well, that they may make the young women chaste", "washing the filth of "the feet" of the young women". And these "widows" are worthy of ecclesiastical honor, whoever they be that "wash the feet of the saints" with the word of spiritual teaching — "the saints", however, not males, but women; for I do not permit a woman to teach nor to rule over a man. He wishes women to be "teaching well, that" they may urge to chastity not young men, but "young women" — for it is unseemly that a woman become the teacher of a man — but that they urge "young women" to chastity and to "love their husbands and their children". Let us learn, therefore, to "wash the feet of the disciples".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Isaiah%2FHomily06.html'
source_title="HOMILIES ON ISAIAH 6"
