[[commentary]]
quote='''
And on that account, shut up "in prison", he was anxious not about death, not about the uncertain judgment of the judge, but in his chains was thinking about Christ, whom he had proclaimed. And because he himself could not go to him, he sends his disciples to inquire: "Are you he who is to come, or do we look for another?" Take note that he taught "even in prison". For whence had he disciples even in that place, and for what reason did they persevere there, unless because even in prison he was performing the office of a master and was instructing them with divine discourses? And among these, when a question had arisen concerning Jesus, he sends some of his disciples and asks: "Are you he who is to come, or do we look for another?" The disciples return and report to their master what the Savior had commanded to be reported: armed with his words, John dies confidently for the battle and is gladly beheaded, confirmed by the very voice of the Lord that he whom he believed was truly the Son of God. So much concerning John and his liberty, and concerning the madness of Herod, who upon many crimes added this one also, that he first shut John up in prison and afterward beheaded him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily27.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 27"
