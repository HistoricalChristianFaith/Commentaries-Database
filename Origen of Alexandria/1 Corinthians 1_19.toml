[[commentary]]
quote='''
But if you wish to understand what I will destroy the wisdom of the wise and the understanding of the intelligent I will set aside means, consider for me someone quite formidable in heretical arguments—say, for instance, Marcion or Basilides—and one arguing on behalf of heretical doctrines with such power that no ordinary person could withstand him; then consider someone competent according to the truth, one who says "who also made us competent as ministers of a new covenant", and who shows that all those things in which the deceived man had put his trust are foolishness. It is the wisdom of those men, then, that he destroys, not that of the truly wise—of Isaiah, of Jeremiah, or of Solomon; it is the wisdom that seems to be wisdom that he destroys, not the true wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT VIII"
