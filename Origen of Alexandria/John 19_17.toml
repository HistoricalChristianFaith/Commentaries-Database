[[commentary]]
quote='''
For just as, according to the three evangelists, Jesus is tempted by the devil, but according to John (who made his discourse concern his spiritual nature) he is not tempted — for "the truth and the life" and "the resurrection" and "the true light" is not tempted, but he was tempted according to the man whom the only-begotten God had taken up — so according to John indeed the Savior, when those who had seized him laid it upon him, "bearing his own cross went out to the place which is called the place of Calvary", but according to the rest he does not bear it for himself. For those who were leading him away to be crucified, as they went out, found a certain man of Cyrene, named Simon, whom they compelled to take up the cross of Christ. But it was fitting not only for the Savior to take up his own cross, but it was fitting also for us to bear it, fulfilling the compulsion that is salutary for us. Nor, again, would we have been to be profited so much by taking up his cross, as we are now profited by his cross, when he himself takes it up for himself and bears it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252027.html'
source_title="COMMENTARY ON MATTHEW 126"


[[commentary]]
quote='''
And the place of Calvary is said to have no ordinary dispensation, in that there, where he who was to die for men was to die, he might die. For there has come to me a certain tradition of this kind, that the body of Adam, the first man, was buried there where Christ was crucified, so that "as in Adam all die, so in Christ all shall be made alive"; that in that place, which is called the place of Calvary, that is, the place of the head, the head of the human race might find resurrection together with the whole people through the resurrection of the Lord the Savior, who there suffered and rose again. For it was unfitting that, while many born from him should receive remission of sins and obtain the benefit of the resurrection, he himself, the father of all men, should not rather obtain grace of this kind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FCommentariorum%2520Series%2520-%2520Matthew%252027.html'
source_title="COMMENTARY ON MATTHEW 126"
