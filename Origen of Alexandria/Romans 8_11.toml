[[commentary]]
quote='''
"But if the Spirit of him who raised up Jesus from the dead dwells in you, he who raised up Jesus Christ from the dead shall quicken also your mortal bodies because of his Spirit dwelling in you." Since he had said above concerning those who, after the likeness of Christ's death, mortify their bodies that they may not sin, he necessarily now makes mention of him who raised Christ from the dead, so that in like manner and by the same reasoning by which they died together with him and were buried together with him, they may know that they are to be quickened through the Spirit of him who raised Jesus from the dead, and to be raised from the dead after the likeness of Christ. And he shows in what way this comes about, saying: "Because of his Spirit dwelling in you." For if the Spirit of Christ dwells in you, it seems necessary that his dwelling-place be restored to the Spirit, and his temple given back. Yet I should wish to know what this very thing is which is said — that either the Spirit of Christ, or the Spirit of God, or even Christ himself dwells in us: whether this Spirit is given to all from the beginning, and afterwards driven away by the worst deeds and by deeds estranged from God, according to that which is written, "My Spirit shall not remain in these men, because they are flesh"; or whether it is given afterwards by the merit of one's life and by the grace of faith, according to those things which are taught in the Acts of the Apostles, that the Holy Spirit came upon each one of them as it were in tongues of fire; or certainly as we are taught in the Gospel, when the Savior himself, after he rose from the dead, said to the disciples: "Receive the Holy Spirit," and breathed upon each one of them. Whence it seems to me that this gift is both won by merits, and preserved by innocence of life, and increased in each one according to his progress in faith and grace; and the purer the soul is rendered, the more abundantly is the Spirit poured into it. But as to what he said, "My Spirit shall not remain in these men, because they are flesh," this looks to the fact that, since their soul, having repudiated the service of the Spirit, turned itself wholly to the services of the flesh, it takes the very name of that flesh to which it joined itself and with which it was made one. In diverse ways, therefore, can the Spirit be had. Either the Spirit of Christ is had, according to what we said above, from divine inbreathing, where he says, "Receive the Holy Spirit," and breathed upon them; or again in that manner in which it is said in the Acts of the Apostles to have been done, that the apostles spoke in diverse tongues. There is also that manner which is related in the books of Kings, when Scripture says: "And the Spirit leaped upon Saul, and he began to prophesy." There is also yet another manner: as when the Savior after the resurrection, journeying with Cleopas and another disciple and opening the Scriptures to them, set them afire with the Spirit of his mouth, so that they said: "Was not our heart burning within us, when he opened the Scriptures to us?" But do you wish to know that not only did Jesus in speaking hand over his Spirit to his hearers, but also that he who speaks the word of God in his name hands over the Spirit of God to his hearers? See in the Acts of the Apostles how, while Peter was speaking to Cornelius, Cornelius himself and those who were with him were filled with the Holy Spirit. Whence you too, if you speak the word of God, and speak it faithfully out of a pure conscience, and are not yourself refuted by your own words as one who teaches one thing and does another, it can come about that while you speak the fire of the Holy Spirit inflames the hearts of your hearers, and that straightway they grow warm and burn to fulfill all the things that you teach, so that they may fulfill in deeds what they have learned in words, and may seek "the things that are above," where Christ is, sitting at the right hand of God: that they may be wise in "the things that are above, not the things that are upon the earth." But in this way too is each one proved to have the Spirit of Christ in himself. Christ is wisdom: if anyone is wise according to Christ, and is wise in the things that are Christ's, he has in himself through wisdom the Spirit of Christ. Christ is justice: if anyone has in himself the justice of Christ, through justice he has in himself the Spirit of Christ. Christ is peace: if anyone has in himself the peace of Christ, through the Spirit of peace he has in himself the Spirit of Christ. So also with charity, so also with sanctification, so also with each and every thing which Christ is said to be: he who has it is to be believed to have the Spirit of Christ in himself, and to hope that his mortal body will be quickened because of the Spirit of Christ dwelling in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
