[[commentary]]
quote='''
Celsus asks whether the blood in the body of the crucified Jesus was the same as that which flows in the bodies of the immortal gods. He asks in jest, but we shall show that it was no mythic or Homeric blood that flowed from the body of Jesus.… With other dead bodies the blood congeals and pure water does not flow. But in the case of Jesus' dead body, the miraculous feature was that both blood and water flowed forth from his side.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FAgainst%2520Celsus%2FBook%25202.html'
source_title="AGAINST CELSUS 2.36"


[[commentary]]
quote='''
If there is anyone who, reading Moses, murmurs against him, and the law which is written according to the letter displeases him, because in many things it does not seem to preserve consistency, Moses shows him the rock, which is Christ, and leads him to it, that he may drink from there and refresh his thirst. But this rock, unless it be struck, will not give waters; but when struck it brings forth fountains. For Christ, when struck and driven to the cross, brought forth the fountains of the New Testament; and therefore it was said of Him that "I will strike the shepherd, and the sheep will be scattered". It was necessary, then, that He be struck; for unless He had been struck and "water and blood had come forth from His side", we should all suffer "a thirst for the word of God". This, then, is what the Apostle also interpreted, that "they all ate the same spiritual food, and they all drank the same spiritual drink. For they drank from the spiritual rock that followed; and the rock was Christ".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily11.html'
source_title="HOMILIES ON EXODUS 11"


[[commentary]]
quote='''
The "twisted scarlet" contains the figure of the sacred blood, which was wrung out from his side through the wound of the "lance." … On account of which neither is the blood of the hen offered at the altar, but it says that "the hen shall be slain in an earthen vessel, in which vessel living water has been put," so that both water may be taken up for purification and the fullness of the mystery be completed in "water and blood," which is said "to have gone out from the side" of the Savior, and no less in what John sets down in his epistle and says, that purification is made "in water and blood and spirit." Whence here too I see all these things fulfilled. For there is the "spirit" of that hen which is slain, and the "living water" which is in the vessel, and the "blood" which is poured out over it; not that we should think the grace of baptism is to be repeated through these things, but that every purification of sins, even this which is sought through repentance, has need of the aid of him from whose side "water" proceeded "and blood."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily08.html'
source_title="HOMILIES ON LEVITICUS 8"
