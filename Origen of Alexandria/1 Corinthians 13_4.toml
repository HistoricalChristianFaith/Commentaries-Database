[[commentary]]
quote='''
He goes through the praises of love, which surpasses the spiritual gifts. For he had to teach both what love is and what sort of person the one who has love is. Love is patient: if you have "patience", which is "a fruit of the Spirit", you have it because of love. Is kind: what is contrary to kindness? Wickedness. If you act wickedly against someone, you do not have love. If you are kind and sweet toward all people, you have love. Love is not jealous: if there is in you jealousy such as was in Cain toward Abel, or such as was in the brothers of Joseph toward Joseph, you do not have love. Loving and being jealous are things at war with each other. Love is not boastful: when someone is rash, professing to know either about an art or about a science or about knowledge, this is the one who is boastful, from not having love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LI"
