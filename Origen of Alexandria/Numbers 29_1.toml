[[commentary]]
quote='''
After these, in the seventh month other festivals are celebrated. "On the first day of the month" there is the new moon of trumpets, just as it says in the psalm, "Play the trumpet at the beginning of the month." But "on the tenth day of the seventh month" there is the festival of atonement. Only "on this day" is the high priest dressed with all the pontifical garments. Then he is dressed in "the manifestation and truth." Then he goes into that inaccessible place where he can approach only "once a year," that is, into "the Holy of Holies." For "once a year" the high priest, leaving the people behind, enters that place where "the mercy seat" is, and above "the mercy seat is the cherubim," where "the ark of testimony" and "the altar of incense" are, where no one is permitted to enter except the high priest alone.Therefore if I should consider how the true "high priest," my Lord Jesus Christ, having indeed been placed in the flesh, was with the people all year, that year about which he himself says, "He sent me to proclaim good news to the poor and to announce the acceptable year of the Lord and the day of forgiveness," I perceive how "once in" this "year" on the day of atonement he enters into "the Holy of Holies." That is, when with his dispensation fulfilled "he penetrates the heavens" and goes to the Father to make atonement for the human race and prays for all those who believe in him.
'''
source_url='https://www.google.com/books/edition/Homilies_on_Leviticus_1_16/Eo9Da7xaBuUC?hl=en&gbpv=1&dq=homilies+on+leviticus+origen&printsec=frontcover'
source_title="HOMILIES ON LEVITICUS 9.5.7-8"

[[commentary]]
quote='''
Then next follows the festival of the sevenths. For just as among the days every seventh day is observed as a sabbath and is a festival, so also among the months every seventh month is the sabbath of the months. There is therefore kept in it the festival which is called the sabbath of sabbaths, and on the first day of the month there is made the memorial of trumpets. But who is it that keeps the festival of the memorial of trumpets, except he who is able to commit to memory the prophetic and evangelical and apostolic scriptures, which sound forth like a certain heavenly trumpet, and to store them up within the treasury of his heart? He therefore who does this, and meditates on the law of God day and night, this man keeps the festival of the memorial of trumpets. But also, if anyone is able to merit those graces of the Holy Spirit by which the prophets were inspired, and to say, singing psalms: "Sound the trumpet at the beginning of the month, on the day of its notable solemnity," and he who knows how to make a joyful noise in the psalms, he worthily keeps to God the solemnity of the trumpets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily23.html'
source_title="HOMILIES ON NUMBERS 23.9"
