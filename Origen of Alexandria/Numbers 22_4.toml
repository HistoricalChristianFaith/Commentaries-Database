[[commentary]]
quote='''
But that you may know that the king thought something of this sort, understand it from the words of Scripture, which I learned expounded by a certain teacher who had come to believe from among the Hebrews. It is written thus: "And Moab said to the elders of Midian: now this assembly will lick up all who are round about us, as the calf licks up the grass of the field." That teacher, then, who had come to believe from among the Hebrews, would say: why, he says, did he use such an example, saying: as the calf licks up the grass of the field? For this reason, without doubt, because the calf breaks off the grass from the field with its mouth and with its tongue, as with a sickle, cuts whatever it finds; so also this people, like a calf, fights with mouth and lips and has its arms in words and prayers. Knowing this, therefore, the king sends to Balaam, that he too may deliver words contrary to words and prayers against prayers. And do not wonder if there is something of this sort in the magical art; for Scripture too indicates that this art exists, but forbids the use of it. For Scripture indicates also that demons exist, but forbids that they be worshipped and entreated. Rightly, then, it also forbids the use of magic, because the ministers of magicians are apostate angels and malign spirits and unclean demons; for none of the holy spirits obeys a magician. A magician cannot invoke Michael, he cannot invoke Raphael nor Gabriel; much more can a magician not invoke Almighty God nor his Son Jesus Christ our Lord nor his Holy Spirit. We alone have received the power of invoking God the Father; we alone have the power of invoking his only-begotten Jesus Christ. But this is what I say: he who has now received the power of invoking Christ cannot again invoke demons, and he who has been made a partaker of the Holy Spirit ought not further to summon unclean spirits; for if he invokes unclean spirits, the Holy Spirit flees from him. They are magicians who invoke Beelzebul. In fact, that people knew this, and therefore, lying against my Lord Jesus and saying false things, they said: "this man casts out demons by Beelzebul, the prince of demons." But the Savior, knowing that it is indeed true that a certain Beelzebul is prince of demons, did not in this convict them of falsehood, but answered them: "if I cast out demons by Beelzebul, by whom do your sons cast them out?" Whence it is established that there are certain evil demons who, when invoked by magicians, are present to them for evil, not for good; for they are ready to do harm, but they do not know how to do good. These demons, then, by a certain art and composition of words, had passed, so to speak, into friendship with Balaam, and, relying on their friendships, he seemed great among men. On account of this, therefore, the king sends to him and says: "come now, and curse for me this people, for it is stronger than we, if perhaps we may be able to strike some of them and drive them out from the land." It seems to me that this king does not entirely trust in Balaam the diviner, being, I believe, greatly terrified by the report of the mighty deeds that had been done among the people of God; and therefore he says, if perhaps the curses of Balaam may prevail even to this extent, that he may be able to strike some of them, and to put the rest to flight, terrified, and drive them from their own land.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily13.html'
source_title="HOMILIES ON NUMBERS 13.5"
