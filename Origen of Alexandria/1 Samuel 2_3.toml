[[commentary]]
quote='''
"Do not multiply to speak lofty things." Why did she not say: Do not speak lofty things? Therefore it is permitted me to speak some lofty things, but to multiply lofty and arduous things is not permitted me; for this seems to be designated by that which was said: "Do not multiply to speak lofty things." What, then, is indicated by this, let us consider. It is not permitted to human nature to speak many lofty things, nor to understand many lofty things. For Solomon too says: "Seek not the things too high for thee, and search not the things too strong for thee, but of the things that are commanded thee, these understand." Therefore in this place too it is said "lofty things," not that thou shouldst not seek at all, but that thou shouldst not multiply questions concerning them. For to one who looks to the weakness of the human condition, let it suffice thee to have either inquired or spoken concerning the lofty and arduous things such things as give life to those who inquire or speak. But what are the things in which it is necessary for me to speak lofty things? When I speak of the omnipotence of God, of his invisibility and everlastingness, I speak lofty things. When I pronounce concerning the co-eternity of his Only-begotten and his other mysteries, I speak lofty things. When I discourse of the magnificence of the Holy Spirit, I speak lofty things. In these things only is it granted us to speak lofty things. After these three, speak thou nothing lofty any longer. For all things are lowly and cast down, so far as regards the loftiness of this Trinity. Do not, therefore, multiply to speak lofty things, except concerning the Father and the Son and the Holy Spirit. And that what we say may be more fully manifest, let us use still, if it seems good, examples. For instance, the gentiles introduce many gods. These multiply to speak lofty things. Certain of the heretics, abandoning the creator of the world, and his Son, feign for themselves some other, I know not what, loftier god, and introduce others likewise, whether those whom they call aeons, or those whom they call gods. These too, then, multiply to speak lofty things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.13"


[[commentary]]
quote='''
"Let not great speech come out of your mouth." See what was said by the Apostle: "Wretched man that I am, who shall deliver me from the body of this death?" This is fittingly said of every man. For wretched is the race of mortals: since indeed we are in peril not only in evils, but even in good things. For example, I have seen certain good visions, and they have become to me an occasion of elation. Signs and wonders have been fulfilled through me, and I have become proud in good things. I have kept righteousness, continence, virtue, but in these I am in peril. For when the Devil has done nothing else, for all these he stirs up pride in me, so that afterward I may have an angel of Satan to buffet me, lest I be exalted and great speech come out of my mouth, that is, lest I speak great things of myself, since indeed the Lord exterminates deceitful lips, and the boastful tongue of those who said: "We will magnify our tongue." Let not, therefore, great speech come out of your mouth, because the Lord is strong in knowledges.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.14"


[[commentary]]
quote='''
"And they did not amend, making excuses;" as it was also said there: "Let not thy heart incline to evil words, to make excuses for excuses in sins with men that work iniquity." And in the Proverbs it is said: "The sluggard takes occasions and says: There is a lion in the way, and murderers in the streets." We find, therefore, that sinners are such as accuse everything rather than themselves, and feign for themselves occasions of excuses, when they say: The Devil supplanted me, the woman seduced me, that man furnished me an occasion to sin—when assuredly one ought to remember the precept that says: "Declare thou thy sins first, that thou mayest be justified": for excuses do not amend, neither here nor in the future, if we have done evil. But that too seems necessarily to occur in passing. For it contains a wonderful sense, that it is written: "The righteous man is his own accuser in the beginning of his speech," whereas nevertheless the unrighteous is not his own accuser but of others. Just as the Devil too is indeed an accuser, but an accuser not of himself, but of the brethren. Meanwhile, it is necessary that all be accused; but if indeed I shall be righteous, I do not wait for another to accuse me, but I myself stand forth as my own accuser. Yet I should like to discuss more fully how the righteous man can be his own accuser. It is certain that as long as anyone sins and remains in offenses, he is neither righteous, nor his own accuser. For he does not accuse what he does. But when he has repented of his offenses, then he is made righteous, and stands forth as the accuser not of another, but of himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.15"
