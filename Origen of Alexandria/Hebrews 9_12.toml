[[commentary]]
quote='''
These are the things that the letter of the law sets forth for us, so that, gathering from them the seeds of the sacred mysteries, we may ascend as by certain steps from lowly things to lofty ones and from earthly things to heavenly ones. Ascend therefore now, O hearer, if you can, and be lifted up from earthly senses by the gaze of the mind and the keenness of the heart. Forget earthly things for a little while, and walk with the step of the mind above the clouds and above the very heaven. There seek the tabernacle of God, where as a forerunner for us Jesus entered and now stands before the face of God, interceding for us. There, I say, seek those fourfold orders and stations of the camps, there behold the Israelite ranks and the watches of the saints, and there examine those mysteries of the firstborn which we now seek here.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily03.html'
source_title="HOMILIES ON NUMBERS 3.3"
