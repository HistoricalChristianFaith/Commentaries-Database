[[commentary]]
quote='''
Since Solomon urges that "these things which we read be written on the heart in threefold manner," that also, besides those things which we have said, which occurs to my heart, I shall bring forth to your ears, and do you that which is written, that while one speaks the rest may examine. While I therefore speak what I feel, do you discern and examine whether it is right or less than right.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily21.html'
source_title="HOMILIES ON JOSHUA 21.2"
