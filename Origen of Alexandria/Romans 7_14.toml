[[commentary]]
quote='''
If perchance to anyone that exposition which we maintained concerning the diversity of laws seemed to be violently presumed, let him now observe in this chapter how not only a diversity of laws, but also of persons, is introduced. For Paul, who in other places said, "For we, walking in the flesh, do not war according to the flesh," in the present passage says that he is carnal: and here he says that he has been sold under sin, he who in other places said: "You have been bought with a price;" and again: "Christ has redeemed us;" and once more elsewhere he says: "Yet I live, no longer I, but Christ lives in me." And again, he who says, "On account of his Spirit dwelling in us," now says: "For there dwells not in me, that is, in my flesh, what is good." But if the good does not dwell in his flesh, how does he say that our body is the temple of God, and the temple of the Holy Spirit? And moreover the rest, in which he confesses that by the law which is in his members, and which fights against the law of his mind, he is led captive in the law of sin — how will these things befit apostolic dignity, and especially Paul, in whom Christ both lives and speaks? But let us gather from these things how it is the custom of divine Scripture to change secretly both persons, and things, and the matters of which it seems to be speaking, and names — or rather, to use the same names in one set of things and another, as in the present passage the Apostle says: "For we know that the law is spiritual." This much, that he said, "We know that the law is spiritual," he pronounces with apostolic authority. For he who is carnal and sold under sin does not know that the law is spiritual; but he who has in himself the Spirit of God, he knows that the law is spiritual: which is fittingly said of the law of Moses. For it is that very law which, to him who understands it spiritually, is a spiritual law, and a Spirit giving life; but to him who understands it carnally, it is recorded to be a law of the letter, and a letter that kills. But as to what he says, "But I am carnal, sold under sin," here he now, as a teacher of the Church, takes upon himself the person of the weak; on account of which he also said elsewhere: "I became weak to the weak, that I might gain the weak." And here therefore, for whoever are weaker — that is, for the carnal, and for those who have been sold under sin — Paul becomes carnal and sold under sin, and he speaks those things which it is their custom to speak, whether under the pretext of excusing or of accusing themselves. He says therefore of himself, as though speaking in their person: "But I am carnal, sold under sin": that is, living according to the flesh, and reduced by a price into the power of sin, of lust, and of concupiscence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook06.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
