[[commentary]]
quote='''
But perhaps the novelty of the saying may deter not only the Jews but also some of our brethren. For Paul seems to presume impossible things, in that he introduces "circumcision of the heart." For how can it come about that a member be circumcised which, hidden by the inner organs, lies concealed even from the very sight of men? Let us return, then, to the prophetic utterances, so that, while you pray, these matters about which we inquire may from there become clear. The prophet Ezekiel says: "Every stranger uncircumcised in heart and uncircumcised in flesh shall not enter into my sanctuary." And likewise elsewhere the prophet, reproaching them no less, says: "all the strangers are uncircumcised in flesh, but the sons of Israel are uncircumcised in heart." It is signified, therefore, that unless one has been circumcised in heart and circumcised in flesh, "he shall not enter into the sanctuary" of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily03.html'
source_title="HOMILIES ON GENESIS 3.4"
