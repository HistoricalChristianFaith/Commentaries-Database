[[commentary]]
quote='''
"And God said: Let there be a firmament in the midst of the water, and let it be dividing between the midst of water and water. And it was made so. And God made the firmament." Since God had already before made heaven, now he makes the firmament. For he made heaven first, of which he says: "Heaven is my seat." But after that he makes the firmament, that is, the corporeal heaven. For every body is without doubt firm and solid; and this is what "divides between the water which is above heaven and the water which is below heaven." For since all the things that God was going to make consisted of spirit and body, for this reason "in the beginning" and before all things heaven is said to have been made, that is, every spiritual substance, upon which, as upon a kind of throne and seat, God rests. But that heaven, that is, the firmament, is corporeal. And therefore that first heaven, which we called spiritual, is our mind, which is itself also spirit, that is, our spiritual man who sees and beholds God. But that corporeal heaven, which is called the firmament, is our exterior man, who beholds bodily. Just as, then, the firmament was called heaven from the fact that it divides between those waters which are above it and those which are below it, so also the man who is placed in the body, if he is able to divide and discern which are the waters that are higher "above the firmament" and which are those that are "below the firmament," will himself also be called heaven, that is, a heavenly man, according to the sentence of the Apostle Paul who says: "But our citizenship is in heaven." Thus, then, the very words of Scripture continue: "And God made the firmament, and divided between the midst of the water which is below the firmament, and the midst of the water which is above the firmament. And God called the firmament heaven. And God saw that it is good; and there was evening, and there was morning, the second day." Let each one of you, then, strive to become a divider of that water which is above and which is below, so that, namely, receiving the understanding and participation of the spiritual water which "is above the firmament," he may bring forth "from his belly rivers" of "living water" "leaping up into eternal life," being without doubt set apart and separated from that water which is below, that is, the water of the abyss, in which darkness is said to be, in which "the prince of this world" and the adversary "the dragon and his angels" dwell, as was indicated above. By participation, then, in that upper water, which is said to be above the heavens, each of the faithful is made heavenly, that is, when he holds his mind on lofty and exalted things, thinking nothing of earth but everything of heavenly things, seeking "the things that are above," where Christ is at the right hand of the Father. For then he too will be held worthy by God of that praise which is here written, when it says: "And God saw that it was good."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.2"
