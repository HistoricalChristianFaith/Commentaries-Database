[[commentary]]
quote='''
"And the Egyptians," it says, "were burying their dead"; the dead were burying their dead, but the living were following the Lord their God. After this it is said that: "and upon their gods the Lord took vengeance." But in Exodus too it says thus: "and upon all the gods of the Egyptians the Lord shall take vengeance." Here, however, it says that the Lord took vengeance upon them. There are certain beings which are called gods, whether in heaven or on earth, the Apostle says. But in the Psalms too it is said: "all the gods of the nations are demons." Therefore it is not the images, but the demons who preside over the images, that he calls gods, upon whom the Lord took vengeance. But I should like to inquire how God takes vengeance upon the demons, since assuredly the day of vengeance and of judgment has not yet come. But I think that this vengeance is wrought upon the demons when he who had been deceived by them into worshipping idols, being converted through the word of the Lord, worships the Lord; and from the very work of conversion vengeance is dealt upon him who had deceived. Likewise also, if he who had been deceived by the demons into fornicating is converted to chastity, loves purity, and weeps that he had gone astray, the demon is burned and set aflame by the tears of his repentance, and thus vengeance is dealt upon the author of the deception. Likewise too, if anyone returns from pride to humility, from luxury to frugality, through each of these things he scourges and torments the demons who had deceived him into them. With how great torments do you suppose they are driven, if they see someone, according to the word of the Lord, sell all his goods that he possesses and give to the poor, and take up his cross and follow Christ? But above all things this is the kind of torments and beyond all penalties for them, if they see someone give his labor to the word of God, searching out with intent zeal the knowledge of the divine law and the mysteries of the Scriptures; in this is all their flame, in these they are burned with the whole conflagration, since indeed they had darkened human minds with the darkness of ignorance and through these had obtained that God should be unknown, while the zeal of divine worship should be transferred to themselves. What vengeance do you think is dealt upon them, what flame of penalties is inflicted upon them, when they see these things opened up by the light of truth and the mists of their fraud unbarred through the recognition of the divine law? For they possess all who live in ignorance; and not only those who are still in ignorance, but they often thrust themselves upon those who have come to know God, and again try to work in them the works of ignorance. For no sin whatever is consummated without them. For when anyone commits adultery, it is assuredly not without a demon; or when he is carried away by immoderate anger, or when he plunders what belongs to another: and he who, "sitting, speaks against his neighbor" and "lays a stumbling block against his mother's son," is not without a demon. And therefore we must strive in every way, lest perhaps we raise up again within ourselves the firstborn of the Egyptians or their gods, whom the Lord struck and destroyed, if we give them a place to work within us those things which God hates. But if we restrain ourselves from all these things, in the manner in which we said above, the Lord has dealt vengeance upon all the gods of the Egyptians, and they receive their penalties from our amendment and conversion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.8"
