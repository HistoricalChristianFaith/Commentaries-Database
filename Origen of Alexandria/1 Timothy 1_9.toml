[[commentary]]
quote='''
If any are weak and incapable of the deeper mystery, let them be edified from the letter, and let them know that, if anyone "passing over shall pass over the commandments of the Lord and shall have lied to his neighbor concerning a deposit or a partnership or a robbery," he is declared guilty of an enormous sin. But far be it from the Church of God that I should believe there to be anyone in this assembly of the saints who conducts himself so wretchedly. For confidently I say concerning you that "you have not so learned Christ," nor have you "been so taught." But neither does the law itself prescribe these things to the holy and faithful. Do you wish to know that these things are not spoken to the holy and just? Hear the Apostle distinguishing: "for the just," he says, "the law is not laid down, but for the unjust and the insubordinate, for the wicked and the defiled, for parricides, matricides," and the like of these. Since therefore the Apostle says the "law" is "imposed" upon men of this kind, let the Church of God — which far be it that it should be stained with crimes of this sort — leave the letter to others and be more holily edified by the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily04.html'
source_title="HOMILIES ON LEVITICUS 4"
