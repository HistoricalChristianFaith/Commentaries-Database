[[commentary]]
quote='''
Twelve observers were sent from the sons of Israel to examine the land which had been promised to them, and these, returning after forty days, reported diverse things. For ten of them cast the people into despair, so that they wished to reject Moses, choose another leader, and return to Egypt. But the other two brought good tidings and exhorted the people to remain in faith, saying: "If the Lord loves us, let him bring us into this land." But the people, driven headlong by the despair of unbelief, rushed forward to stone those who brought good tidings; the majesty of the Lord, however, protected them in the clouds. And the Lord says to Moses: "I will strike them with death and destroy them, and I will make you and the house of your father into a great nation, more numerous than this one." This great threat, then, comes from the Lord, not that the divine nature should be shown as passible and subject to the vice of anger, but that through these things both the love which Moses had toward the people, and the goodness of God, which is above all understanding, might be made known. For God is written to be angry and to threaten destruction upon the people, so that man may be taught how great a place he holds with God and how great a confidence, so that, even if there be some indignation in God, it is softened by human entreaties, and man is able to obtain so much from him that God even changes his own decrees. For the goodness which follows upon the anger both shows the confidence Moses had with God and teaches that the divine nature is a stranger to the vice of anger. At the same time the utterance contains a mystery to be fulfilled in the ages to come, through which God promises that, when this people is rejected, he will raise up another people. For he says: "I will strike them with death and destroy them, and I will make you and the house of your father into a great nation, far more than this one." This threat, therefore, is not anger but prophecy. For another nation was to be taken up, that is, this people of the nations, but not through Moses; for Moses excused himself. For he knew that that great nation which is promised was not to be called through Moses, but through Jesus Christ, and that the people was to be named not Mosaic but Christian.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily08.html'
source_title="HOMILIES ON NUMBERS 8.1"
