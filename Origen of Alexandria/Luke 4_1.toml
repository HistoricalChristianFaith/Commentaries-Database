[[commentary]]
quote='''
When therefore you read that Jesus was full of the Holy Spirit, and it is written in the Acts concerning the Apostles, that they were filled with the Holy Spirit, you must not suppose that the Apostles were equal to the Saviour. For as if you should say, These vessels are full of wine or oil, you would not thereby affirm them to be equally full, so Jesus and Paul were full of the Holy Spirit, but Paul's vessel was far less than that of Jesus, and yet each was filled according to its own measure. Having then received baptism, the Saviour, being full of the Holy Spirit, which came upon Him from heaven in the form of a dove, was led by the Spirit, because, as many as are led by the Spirit, they are the sons of God, (Rom. 8:14.) but He was above all, especially the Son of God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
When you read in the Gospel: "But Jesus, full of the Holy Spirit, returned", and in the Acts of the Apostles, where it is written of them that they were "filled" with "the Holy Spirit", take care not to suppose that the apostles were equal to the Savior; rather, understand that Jesus and the apostles and any other of the saints are full of the Holy Spirit according to the measure of their own vessel. Just as, for example, if you wish to say: these vessels are full of wine or oil, you do not thereby indicate that they are full in equal measure — since one can hold a sextarius, another an urn, another an amphora — in the same way both Jesus and Paul were full of the Holy Spirit; but the vessel of Paul was much smaller than the vessel of Jesus, and yet each was full according to its own measure. And so, having received baptism, the Savior, "full of the Holy Spirit", which had come upon him from the heavens "in the form of a dove", "was led by the Spirit". For since "as many as are led by the Spirit of God, these are the sons of God", and he beyond all others was properly the Son of God, therefore he too had to be led by the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily29.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 29"
