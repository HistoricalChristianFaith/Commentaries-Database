[[commentary]]
quote='''
"The Lord kills and makes alive." Whom does the Lord kill, and whom does he make alive? Me myself he kills, when he makes me be dead to sin. And me myself he makes alive, when he makes me live to God. I was a sinner, and lived in offenses: he killed me from sins, he made me die to my former life, and he will make me alive, that I may live in his fear, that I may stand in his faith, that I may live no longer to sin, but to God, who raised me from the dead, that I may walk in newness of life in Christ Jesus our Lord, to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FHomily%25201%2520-%2520On%2520Elkanah%252C%2520Peninnah%252C%2520and%2520Hannah.html'
source_title="HOMILIES ON 1 SAMUEL 1.19"
