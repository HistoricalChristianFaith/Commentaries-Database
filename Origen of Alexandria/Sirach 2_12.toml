[[commentary]]
quote='''
When, therefore, we come to the grace of baptism, renouncing all other gods and lords, we confess God the Father alone and the Son and the Holy Spirit. But confessing this, unless we "love the Lord our God with the whole heart and with the whole soul" and cleave to him "with the whole strength", we have not been made "the Lord's portion", but, set as it were on a certain border, we both suffer offense from those we have fled, and do not render favorable the Lord to whom we have fled, whom we do not love "with the whole and entire heart". And therefore the prophet mourns over us, whom he sees wavering with inconstancy of this kind, and says: "woe to the double-minded", and again: "how long do you go lame on both your knees?" But the Apostle James also says: "a double-minded man is inconstant in all his ways". We are, then, we who follow our Lord with a faith neither whole nor perfect, and have withdrawn from alien gods, set as it were in a certain middle border, and by those we are struck at as fugitives, and by our own Lord, as unstable and doubtful, we are not defended.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
