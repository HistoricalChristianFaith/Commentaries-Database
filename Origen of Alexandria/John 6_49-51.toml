[[commentary]]
quote='''
And again the manna, which the Jews reckon food for the belly and satiety for the gullet, Paul names "spiritual food." And not only Paul, but the Lord Himself in the Gospel says concerning the same thing: "your fathers ate manna in the desert, and they died. But whoever shall eat of the bread which I give him shall not die for ever." And after this He says: "I am the bread which came down from heaven."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily05.html'
source_title="HOMILIES ON EXODUS 5"
