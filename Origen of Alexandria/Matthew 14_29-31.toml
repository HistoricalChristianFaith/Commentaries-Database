[[commentary]]
quote='''
But the saints are not sunk; rather they walk upon the waters, because they are light and are not weighed down by the burden of sin. Finally the Lord and Savior "walked upon the waters"; for he it is who truly knows no sin. His disciple Peter also "walked," although he trembled a little; for he was not so great and of such kind as to have nothing at all of the nature of lead mixed within him. He had some, though little. On account of which the Lord says to him: "O you of little faith, why did you doubt?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily06.html'
source_title="HOMILIES ON EXODUS 6"
