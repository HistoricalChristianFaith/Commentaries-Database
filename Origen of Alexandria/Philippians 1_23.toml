[[commentary]]
quote='''
In expressing such a desire he knew that when he returns to Christ he will know more plainly the causes of all that is happening on earth. He will then know more of what constitutes his own humanity, his soul, his mind, his spirit. He will then know more of what the Spirit is enabling and what grace it is that is being given to those who are faithful in the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDe%2520Principiis%2FBook%25202.html'
source_title="ON FIRST PRINCIPLES 2.11.5"


[[commentary]]
quote='''
If one grasps what the soul is, and that it belongs to the inner man, if one understands that it is precisely here that lies that which is in man according to the image, then, evidently, Paul has grounds to say: "for this is far better — to be released and to be with Christ." Before the resurrection the righteous man abides with Christ, and in his soul he lives with Christ. This is precisely why it is better — to be released and to be with Christ. According to your words, the soul remains in the grave together with the body, not leaving the body, not resting, not abiding in the blessedness of God, not reposing on the bosom of Abraham. According to such words of yours, it is not at all better — to be released and to be with Christ. … But in my view, and according to the word of God, the soul, released from labors, released from sweats, has been deprived of the flesh … It goes forth in peace and reposes with Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"


[[commentary]]
quote='''
But if you wish me to show you from the Scriptures who it is "whom the land has multiplied", look at the Apostle Paul, how he says: "but if to live in the flesh, this is for me the fruit of labor, and what I should choose I know not. For I am hard pressed from the two, having a desire to be dissolved and to be with Christ, for it is far better; but to remain in the flesh is more necessary for your sake". You see how "the land multiplies" this man? For while he remains on the land, that is, in his own flesh, he is multiplied by founding churches, he is multiplied by acquiring a people for God, and "by preaching the Gospel of God from Jerusalem round about as far as Illyricum".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily01.html'
source_title="HOMILIES ON EXODUS 1"
