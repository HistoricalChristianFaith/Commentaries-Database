[[commentary]]
quote='''
After these things one comes to Haradah, which in our language sounds "made fit"; assuredly so that the soul too may say: "He has made us fit ministers of the new testament."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily27.html'
source_title="HOMILIES ON NUMBERS 27.12"
