[[commentary]]
quote='''
And the Lord spoke to Moses and Aaron, saying: "Depart from the midst of this congregation, and I will destroy them at once." And they fell upon their face. In Sodom, indeed, at the very least, ten were required, through whom those who dwelt in the Pentapolis of the Sodomites could scarcely, if perhaps, be saved; but now even two, if however such be found as Moses was and Aaron, are able to suffice for the whole nation of the Israelites to be saved. What then shall we say is more in these two? What so great a virtue, what merit, whereby six hundred thousand and more are delivered from the destruction of the ravager? I think that in Moses the Law is signified, which teaches men the knowledge and the love of God, and that in Aaron consists the form of supplicating God and of beseeching him. If therefore it should happen at some time that God is angry with us or with the whole people, and if now the sentence of vengeance goes forth from the Lord, but the Law of God returns into our heart, admonishing us and teaching us to turn to repentance, to make satisfaction for our offenses, to supplicate for our faults—the anger will cease at once, the indignation will subside, the Lord will be appeased, as though Moses and Aaron were interceding for us and supplicating for the whole people. But if at some time the indignation of God arises and a fierce correction comes for our sins, and yet our hearts are hardened, so that we do not turn to the Lord nor humble ourselves in his sight, so as by the confession of supplications to soften his emotion and his anger, but on the contrary we say: God has no care for the life of mortals, nor do these things pertain to God, he has long since forsaken us, nor do such matters come to his knowledge—if we think such things in our hearts and these proceed from our mouth, it is certain that Moses and Aaron are not in us, namely the knowledge of the Law and the fruits of repentance, through whom we might be able to escape the destruction of the impending doom. This, I think, happened also to that people who lived before us, when "they all turned aside, together they became unprofitable, and there was none who did goodness, there was not even one." For if there had been, God would never at all have forsaken them. But let us too fear, lest perchance something similar be found in us; for I fear that sentence in which our Lord and Savior, who foreknows all things, as though in doubt says: "Do you think that the Son of Man, when he comes, will find faith upon the earth?" Moses and Aaron therefore are commanded to go out from the midst of the congregation, that the congregation may be destroyed at once. But let us see what these men do; they are holy, they are perfect, and more, disciples of the Gospel rather than of the Law, and therefore they love even their enemies and pray for their persecutors. For when those men came to slay them, these fell upon their face to the ground.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily09.html'
source_title="HOMILIES ON NUMBERS 9.3"
