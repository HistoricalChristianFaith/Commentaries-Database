[[commentary]]
quote='''
"According to the Gospel indeed they are enemies for your sake: but according to the election they are most dear for the sake of the fathers. For the gifts and the calling of God are without repentance. For as you also once did not believe God, but now have obtained mercy because of their unbelief: so these also have now not believed, that through the mercy shown to you they too may obtain mercy." The Apostle, still pursuing the same matters concerning Israel and the Gentiles, and reproaching the branches of the wild olive which insulted the broken branches of the olive tree, adds also these things: That Israel according to the Gospel has indeed been made an enemy to God, because it did not believe Christ: but so far as regards the honor due to the fathers, it is elect, and is held most dear with God. But election having once been granted to the seed of the fathers, and love conceded, God without doubt preserves his gifts and his calling toward the seed of those to whose merits he once bestowed this: nor does repentance come upon God, even if those upon whom the benefits promised to the fathers are conferred appear to be less worthy. But, as we have often advised, in the present passage also that distinction is to be observed, that the Israel which is an enemy to God is said to be that which cries out concerning Christ: "Away with him, away with him, crucify him." For how should they not be called enemies of God, who either then, or even now, have said such things, or say them? But when he says, "for your sake," this means, those namely whose salvation they envy, forbidding the apostles to speak to the Gentiles, and persecuting those who announce Christ. But according to the remnant which is said to be saved, in which the election of believers followed from Israel, they are "most dear for the sake of the fathers:" whose faith namely they follow, believing "in him who raised Christ Jesus from the dead." And according to this, toward such a seed "the gifts and the calling of God are without repentance." But after these things he opens also the hidden and deeper causes of their unbelief, and says: That just as you Gentiles once did not believe God, nor yet did God on that account utterly abandon you, but at last at some time you obtained mercy — yet the occasion of mercy being conferred upon you was the unbelief of the people of Israel — so also these who now from the people of Israel have not believed, and for their unbelief have been abandoned, so that the mercy of God might be turned toward you, will not be left forever in their unbelief; but after the dispensation of the fullness of the Gentiles has been fulfilled, they too shall obtain mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook08.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
