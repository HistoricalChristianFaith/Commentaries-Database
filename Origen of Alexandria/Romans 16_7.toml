[[commentary]]
quote='''
Greet Andronicus and Junia, my kinsmen and my fellow captives, who are noble among the apostles, who also were in Christ before me. It may indeed be that these were kinsmen of Paul according to the flesh, and believed before him, and were held to be noble among the apostles of Christ; concerning whom it is also possible to understand this, that perhaps they were among those seventy-two who were themselves also named apostles, and that for this reason he calls them noble among the apostles, and among those apostles who were before him. But this too moves me, that he says: my fellow captives. For what was that captivity of Paul in which he testifies that Andronicus and Junia also were fellow captives with him? — unless perhaps, by a more profound mystery, we look to that captivity which Christ came to loose, of which it is written that he came to give release to the captives and sight to the blind. In that captivity these persons appear to be by one and the same reckoning as Paul himself was. For example, if we should say: When the people of Israel were captive among the Assyrians or the Babylonians, all indeed appeared to be captives; but there was one reason for the captivity in the rest, and another in Daniel and Ananias and Azarias and Misael. For those were captives on account of their own sins; but these were themselves captives for the consolation of the captives. And therefore, if Daniel were to say of some one of the common people, "My fellow captive," it would not seem to be said so fittingly as if he said of Ananias and Azarias and Misael, "my fellow captives." For in these there is one single reckoning of captivity, which is far different from the reckoning of the rest of the people. So then Paul too, looking to the reasoning of a more hidden mystery, names something of this sort concerning himself and Andronicus and Junia, calling them his fellow captives in this world, and noble among the apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
