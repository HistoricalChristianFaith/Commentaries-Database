[[commentary]]
quote='''
Thou shalt love the Lord thy God with thy whole heart and with thy whole soul and with thy whole strength and with thy whole mind. Thou shalt love thy neighbour as thyself. He does not say that thou shalt love God as thyself, that a neighbour shall be loved with the whole heart, with the whole soul, with the whole strength, with the whole mind. Again, He said: Love your enemies, and did not add ‘with the whole heart.’ The Divine Word is not disordered, He does not command impossibilities, and He does not say ‘Love your enemies as yourselves,’ but only, Love your enemies. It is enough for them that we love them and do not hate them; but a neighbour is to be loved as thyself, and God with thy whole heart and with thy whole soul and with thy whole mind and with thy whole strength.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
