[[commentary]]
quote='''
But if you seek confirmation that we are able to change and to cease being serpents, swine, or dogs, let us turn to the words of the Apostle, that the transformation depends on us. For he speaks thus: "And we all, with unveiled face, reflecting as in a mirror the glory of the Lord, are transformed into His very image." If you were like a barking dog, and the Word molds and changes you, then you will cease to be a dog and will be a man. If you were unclean, and the Word touched your soul, and you have handed yourself over to the transforming Word, then you will cease to be a swine and will be a man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
