[[commentary]]
quote='''
But do you also wish to learn from the Gospels that he who "shall have received in this life his evil things" does not there receive them again, but he who has not received them here, there all things are reserved for him? The example of "poor Lazarus" and of that rich man teaches us, to whom it is said "in the netherworld" by the patriarch Abraham: "Remember, son, that you received your good things in your life, and Lazarus likewise the evil things. But now you indeed are tormented, while this one is at rest."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily14.html'
source_title="HOMILIES ON LEVITICUS 14"
