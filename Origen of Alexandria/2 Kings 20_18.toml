[[commentary]]
quote='''
"Spadones" are eunuchs. And he says this concerning the three young men and Daniel, since they were descended from this Hezekiah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FFragments%2520on%2520Kingdoms.html'
source_title="FRAGMENTS ON KINGDOMS 22"
