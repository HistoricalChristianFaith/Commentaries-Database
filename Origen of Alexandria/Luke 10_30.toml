[[commentary]]
quote='''
Although these things are said reasonably and beautifully, it is nevertheless not to be supposed that they pertain to every man. For not every man "goes down from Jerusalem to Jericho", nor do all on that account tarry in the present age, even though he who "was sent because of the lost sheep" — "of the house of Israel" — came. The man, therefore, who "went down from Jerusalem to Jericho", because he himself willed to go down, for that reason "fell among robbers". But the robbers are none other than those of whom the Savior says: "all who came before me were thieves and robbers". Yet he fell not among thieves, but among "robbers" much more wicked than thieves, who, when he was going down "from Jerusalem" and had fallen among them, "stripped him and laid blows upon him". What are the blows, what the wounds, by which the man was wounded? Vices and sins. Then, because the robbers who had stripped him and wounded him do not sit by the naked man, but, blows having again been laid on, abandon him, for this reason it is written: "stripping him and laying on wounds, they departed and left him" not dead, but "half-dead".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily34.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 34"
