[[commentary]]
quote='''
There is a time when we sow and the enemies cannot corrupt the seeds that we sow, they cannot lie in wait for our husbandry; but there is also a time when we sow and what we sow is corrupted. Let Paul the Apostle teach us about this difference in sowing. Hear, then, what he himself says: "he who sows," he says, "in the flesh, of the flesh shall reap corruption, and he who sows in the spirit, of the spirit shall reap life eternal." These, then, are they whose seeds the Midianites corrupt, who "sow in the flesh." These are they whose "fruits are destroyed" and perish. But those seeds which "are sown in the spirit" the Midianites cannot corrupt. For the adversary powers cannot ascend to the spiritual fields and defile the fresh-broken ground of the spirit belonging to those who "do not sow upon thorns, but break up for themselves fresh ground." But this too must be added; for I wish to admonish both myself along with you concerning wariness over the seeds and diligence over the spiritual fruits. It frequently happens that someone, toiling much in spiritual work, has produced very many fruits and filled his barns with the crops of righteousness and stored up many good works in the inner chamber of his conscience; but afterward, if he grows negligent and after his labor inclines too readily toward pleasures and self-indulgence, all those seeds of good things and the fruits of holy work will be corrupted under the dominion of lust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily07.html'
source_title="HOMILIES ON JUDGES 7"
