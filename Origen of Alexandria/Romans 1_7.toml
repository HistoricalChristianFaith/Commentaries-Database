[[commentary]]
quote='''
This blessing of peace and grace, which the apostle Paul gives to the beloved of God to whom he writes, I think is not less than was the blessing of Noah upon Shem and upon Japheth, which was fulfilled through the Spirit toward those who were blessed; and likewise that in which Abraham was blessed by Melchizedek, and Jacob by his father Isaac, and the twelve patriarchs who are blessed by their father Israel; or the blessing of Moses, with which he blessed the twelve tribes of Israel. I do not, then, judge this blessing of the Apostle, with which he blessed the Churches of Christ, inferior to all these. For he too says of himself: "For I think that I also have the Spirit of God." In the Spirit of God, therefore, the Apostle writes, and in the Spirit he blesses. Through that same Spirit, then, those who are blessed by the Apostle receive the blessings — if, that is, they are found worthy for his blessing to come upon them. Otherwise that will happen which is written: "If there be there a son of peace, your peace shall come upon him; but if not, your peace shall return to you." What is written, therefore, concerning peace will hold also for grace, since he joins grace together with peace. Yet it must be known that this custom of writing is not preserved by the Apostle toward all the Churches. For to the Corinthians indeed, in the first and second epistles, and to the Galatians, and to the Ephesians, and to the Philippians, he writes in like manner. But to the Colossians he says, "Grace to you and peace from God our Father", and does not add, "and our Lord Jesus Christ". To the Thessalonians the first epistle has thus: "Grace to you and peace", and nothing further. But in the second: "Grace to you, and peace from God our Father, and the Lord Jesus Christ." To Timothy, the first and the second: "Grace, mercy and peace from God the Father, and Christ Jesus our Lord." But to Titus: "Grace, mercy and peace from God the Father, and Christ Jesus our Savior." And although an observation of this kind may seem overly curious, nevertheless one who believes that nothing in the divine Scriptures is idle will judge that even these differences and diversities are not empty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook01.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
