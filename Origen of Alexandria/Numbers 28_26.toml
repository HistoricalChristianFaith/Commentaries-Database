[[commentary]]
quote='''
After this follows the sixth festival, which is called of the "new fruits," that is, when the firstfruits of the new produce are offered. For when the field has been sown and diligently cultivated, and the crop has come to maturity, then in the perfection of the fruits the festival of the Lord is kept. If, therefore, you too wish to keep the feast day of the new fruits with God, see how you sow or where you sow, that you may be able to reap such fruits from which you may make God glad and keep a feast day. This you will not be able to fulfill otherwise, unless you hear the Apostle saying: "He who sows in the spirit, of the spirit shall reap life everlasting." If you so sow and so reap, you will truly keep the feast day of the new fruits. Finally, therefore, the prophet also admonishes, saying: "Renew for yourselves new tillage, and do not sow upon thorns." He therefore who renews his heart and his inner man from day to day, this man renews for himself new tillage and sows not upon thorns but upon the good earth, which renders him fruit thirtyfold or sixtyfold or a hundredfold. This, then, is he who sows in the spirit and gathers the fruits of the spirit. And the first of all the fruits of the spirit is joy. And he rightly keeps the feast day of the new fruits who reaps joy, especially if together he reaps also peace and patience and goodness and gentleness; and if he gather the other fruits like to these, he will most worthily keep the festival of the new fruits to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily23.html'
source_title="HOMILIES ON NUMBERS 23.8"
