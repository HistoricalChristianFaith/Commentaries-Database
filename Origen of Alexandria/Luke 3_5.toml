[[commentary]]
quote='''
For when Jesus had come and sent His Spirit, every valley was filled with good works, and the fruits of the Holy Spirit, which if thou hast, thou wilt not only cease to become a valley, but will begin also to be a mountain of God.

Or you may understand the mountains and hills to be the hostile powers, which have been overthrown by the coming of Christ.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Let us see what things are foretold at the coming of Christ, among which first it is written concerning John: "The voice of one crying in the wilderness: prepare the way of the Lord, make straight his paths". And what follows pertains properly to the Lord the Savior. For "every valley" was not "filled" by John, but by the Lord the Savior. Let each one consider himself, what he was before he believed, and then he will observe that he was a lowly valley, a headlong valley plunged into the depths. But when the Lord Jesus came and sent the Holy Spirit as his vicar, "every valley" was "filled". And it was "filled" with good works and with the fruits of the Holy Spirit. Love does not permit a valley to remain in you, for, if you have peace and patience and goodness, not only will you cease to be a "valley", but you will even begin to be a "mountain" of God. We see this happening and being fulfilled daily among the Gentiles: "every valley shall be filled", as also concerning the people of Israel, who has been brought down from on high: "every mountain and hill shall be brought low". That people was once a "mountain" and a "hill", which has been brought down and destroyed. "By their transgression salvation has been given to the Gentiles, to provoke them to emulation". But if you should also say that the hostile powers, which were raised up against mortals, are the mountains and hills that have been brought down, you will not err. For in order that valleys of this kind may be filled, the hostile powers, the mountains and hills, must be brought low. But let us also contemplate whether this too, which was prophesied at the coming of Christ, has been fulfilled. For there follows: "and all the crooked shall be made straight". Each one of us was crooked—if indeed he was, and does not continue so to this very day—and through the coming of Christ, which has taken place unto our soul, whatever things were "crooked" have been "made straight". For what does it profit you, if Christ once came in the flesh, unless he has also come to your soul? Let us pray that his coming may be made to us daily, and that we may be able to say: "But I live, now not I, but Christ lives in me". For if Christ lives in Paul and does not live in me, what will it profit me? But when he has come also to me and I have had enjoyment of him, just as Paul had enjoyment of him, then I too shall speak like Paul: "I live, now not I, but Christ lives in me". Let us therefore consider also the other things that are foretold at the coming of Christ. Nothing was rougher than you: look at your former impulses, look at your anger and your other vices—if indeed they have ceased to be what they were—and you will understand that nothing was rougher than you and, to speak more pointedly, that nothing was more uneven. Your manner of life was uneven, and your speech, and your works were uneven. Therefore my Lord Jesus came and leveled your roughnesses and turned whatever was disordered "into level ways", so that there might be made in you a journeying without stumbling, and light and most pure, and that God the Father might walk in you, and that Christ the Lord might make his dwelling with you and say: "I and my Father will come and make our dwelling with him".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily22.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 22"
