[[commentary]]
quote='''
Let us try, therefore, to discuss the third exposition also, according to the moral topic. If there is anyone who, while evils increase and vices overflow, is able to turn himself away from fluid and perishing and falling things and to hear the word of God and the heavenly precepts, this one builds within his heart an ark of salvation and consecrates within himself, so to speak, a library of the divine word, and places in it length and breadth and height — faith, charity, and hope. He stretches the faith of the Trinity to the length of life and immortality, he founds the breadth of charity by the affection of pardon and kindness, he raises the height of hope to the heavenly and lofty things; for, walking upon the earth, he has his "conversation in the heavens." But the sum of his acts he brings back to one. For he knows that "all indeed run, but one receives the prize" — namely, the one who has not been manifold through the variety of thoughts and the instability of mind. But this library he builds not out of rough and unpolished timbers, but out of squared ones directed according to the line of equity — that is, not out of the volumes of secular authors, but out of the prophetic and Apostolic ones. For these are the ones who, hewn by diverse temptations, with all vices cut away and excised, keep a squared life balanced on every side. For the authors of secular books can indeed be called "lofty timbers" and "shady timbers" — for "under every lofty and leafy tree" Israel is accused of having committed fornication — because they indeed speak lofty things and use flowery eloquence, yet they did not act as they spoke; and therefore they cannot be named "squared timbers," because in them life and word by no means balance out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily02.html'
source_title="HOMILIES ON GENESIS 2.6"


[[commentary]]
quote='''
The God who "brings forth the sun on the evil and the good" is a desert to no one. To no one is he who "rains on the just and unjust" ever a land made dry. How is he a desert, when he brings forth the day and causes the night to rest? How is he a desert, when he causes the land to bear fruit? How is he a desert, when he provides for each person in his soul so that it is endowed with reason, so that it can grasp knowledge and exercise its intelligence, and in the body so that it has healthy sense faculties? And so with respect to the way of what is universal, God is not a desert.
'''
source_url='https://www.google.com/books/edition/Homilies_on_Jeremiah_and_1_Kings_28/UFInXpKNapEC?hl=en&gbpv=0'
source_title="HOMILIES ON JEREMIAH 3:2.1"
