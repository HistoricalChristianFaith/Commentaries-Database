[[commentary]]
quote='''
Lend your ears here, you who have drawn near to God, you who believe yourselves to be faithful, and consider more diligently how the faith of the faithful is proved by these things that have been read to us. "And it came to pass," it says, "after these words, God tempted Abraham and said to him: Abraham, Abraham. And he said: here I am." Observe each and every thing that is written. For in each single thing, if someone knows how to dig deep, he will find a treasure, and perhaps even where it is not expected the precious jewels of the mysteries lie hidden. This man was formerly called Abram, and nowhere do we read that God called him by this name or said to him: Abram, Abram. For he could not be called by God by a name that was to be abolished, but he calls him by this name that He Himself had bestowed, and He does not only call him by this name, but even doubles it. And when the other had answered, "here I am," He says to him: "take your most beloved son, whom you love, Isaac, and offer him to me. Go," He says, "into the high land, and there offer him as a burnt offering upon one of the mountains, which I will show you." Why God bestowed this name upon him and called him Abraham, He Himself has interpreted: "because," He says, "I have set you as a father of many nations." God gave him this promise when he had a son, Ishmael, but He promised him that in the son who would be born of Sarah this promise would be fulfilled. He had therefore kindled Abraham's own spirit into love of that son, not only for the sake of posterity, but also by the hope of the promises. But this son, in whom these great and marvelous promises were placed for him—this son, I say, in whom his name was called Abraham—he is commanded to offer as a "burnt offering" to the Lord upon one of the mountains. What do you say to this, O Abraham? What and what sort of thoughts are stirred in your heart? A voice has been uttered by God that would shake and prove your faith. What do you say to this? What do you think? What do you reconsider? Do you suppose you turn over in your heart the thought that, if in Isaac the promise was given to me, but I offer this one as a burnt offering, it remains that that promise is not to be hoped for? Or rather do you think these things and say that it is impossible for Him who promised to lie; whatever it may be, the promise will stand firm? But since I "am the least," I am not able to search out the thoughts of so great a patriarch, nor can I know what thoughts the voice of God, which had gone forth to tempt him, stirred in him, what feeling it brought when he was ordered to slay his only son. But since "the spirit of the prophets is subject to the prophets," Paul the Apostle, who through the spirit had learned, I believe, what mind, what counsel Abraham had carried out, indicated it, saying: "by faith Abraham did not hesitate, when he offered his only son, in whom he had received the promises, considering that God is able to raise him even from the dead." The Apostle therefore has disclosed to us the thoughts of the faithful man, that faith in the resurrection had already then begun to be held in Isaac. Abraham therefore hoped that Isaac would rise again and believed that would come to pass which had not yet been done. How then are they "sons of Abraham" who do not believe as accomplished in Christ what he believed as future in Isaac? Nay rather, that I may speak more openly, Abraham knew that he was prefiguring the image of the future truth; he knew that Christ would be born of his seed, who was both to be offered as the truer victim of the whole world and to rise again from the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily08.html'
source_title="HOMILIES ON GENESIS 8.1"
