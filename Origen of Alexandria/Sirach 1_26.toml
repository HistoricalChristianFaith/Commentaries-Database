[[commentary]]
quote='''
that wisdom which was saying: "For I was extending my words, and you were not hearing." And rightly did she say that she extends her words in the heart of him to whom God has given, as we said above, breadth of heart. For the heart of that man is enlarged who is able to explain, with a broader teaching, those things which have been briefly said in mysteries, by means of assertions taken from the divine volumes. It is fitting, therefore, according to this same teaching of the most wise Solomon, that he who desires to know wisdom should begin from moral instruction, and understand that which is written: "You have desired wisdom; keep the commandments, and the Lord will give it to you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"
