[[commentary]]
quote='''
No one urinates standing, and that against a wall, unless he is at leisure. This, then, is what he means: also the man who is carefree and expects to suffer nothing — provided he belongs to Nabal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%25201%2520Samuel%2FFragments%2520on%2520Kingdoms.html'
source_title="FRAGMENTS ON KINGDOMS 13"
