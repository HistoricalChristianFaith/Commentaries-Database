[[commentary]]
quote='''
Some see only a repetition of the narrative when, in the history of the creation of the world, after the creation of man, they read: "God took dust from the earth and created man." According to such an interpretation one must conclude that the following, "after the image," refers to the flesh, and that a human likeness is attributed to God, or that the image of God is like the human outward appearance. But we will not be so mad as to speak of God either as composed in His fullness of a subordinate and a governing element … or that the creation after the image was effected preferentially in the subordinate element, but not in the governing one. … When man was created, this was originally man created after the image. In him there was nothing material. He who is after the image is not from matter. … And when God created man, He took not the dust of the earth, as the second time, but created him after the image of God. That which is created after the image of God is understood as immaterial and surpassing every corporeal substance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
