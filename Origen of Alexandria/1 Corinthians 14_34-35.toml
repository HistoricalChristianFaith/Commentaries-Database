[[commentary]]
quote='''
Since the men had authority from the beginning to speak and to benefit those who heard, while the women asked questions about the things they were puzzled over. And by the Law he means what is said in Genesis: "Your turning shall be to your husband".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%25201%2520Corinthians%2FFragments%2520from%2520the%2520Greek%2520Catenae.html'
source_title="COMMENTARY ON 1 CORINTHIANS FRAGMENT LXXI*"
