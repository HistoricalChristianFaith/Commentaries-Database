[[commentary]]
quote='''
But that man has made an "idol" who, according to the Apostle who says that "an idol is nothing", makes what is not. And what is it that is not? A shape which the eye has not seen, but which the mind itself fashions for itself. For example's sake: as if one should form, upon human limbs, the head of a dog or of a ram, or again should fashion two faces on one human form, or join to a human breast the hinder parts of a horse or of a fish. He who makes these things and things like them makes not a likeness, but an idol. For he makes what is not, nor has it anything like itself. And therefore, knowing this, the Apostle says: "for an idol is nothing in the world"; for the shape is not taken from any of the things that exist, but is what the idle and curious mind has itself devised for itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily08.html'
source_title="HOMILIES ON EXODUS 8"
