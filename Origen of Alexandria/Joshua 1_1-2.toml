[[commentary]]
quote='''
To what end, then, do all these things look for us? Surely to this, that this book does not so much set forth for us the deeds of the son of Nave as it depicts for us the mysteries of my Lord Jesus. For it is he who after the death of Moses took up the command, it is he who leads the army and "fights against Amalek"; and what was there foreshadowed on the mountain with hands stretched out, "he fastens to his cross, triumphing over the principalities and powers in himself." "Moses died," therefore; for the law ceased, since "the law and the prophets were until John." But do you wish me to bring forth proofs from the Scriptures that Moses is called the law? Hear what he says in the Gospel: "They have Moses and the prophets; let them hear them"—here without doubt naming the law "Moses." "Moses the servant of God died," therefore; for the law has died and the precepts of the law now cease. Or if it seems to you too little authority when these things are brought forward by me, follow the authority of the Apostle who says that "the woman is bound by the law while her husband lives, and she will be called an adulteress if she be with another man; but if her husband is dead, she is loosed from the law of her husband, so that she is no longer an adulteress if she be with another man"—without doubt naming as the "woman" the soul, which was held under the law of Moses, of which he says: "While her husband lives she is bound by the law." "But if her husband is dead"—without doubt the law—he says that soul is "freed" which seemed to be subject. Therefore, for this reason, it is necessary that the law die, so that those who believe in Jesus may in no way incur the charge of adultery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily01.html'
source_title="HOMILIES ON JOSHUA 1.3"


[[commentary]]
quote='''
"And the Lord said," he says, "to Jesus the son of Nave, the minister of Moses: Moses my servant is dead. Now therefore arise and cross over this Jordan, you and all this people, into the land which I give to you." You will perhaps ask how our Lord Jesus the Son of God was also the "minister" of Moses: because "when the fullness of times had come, God sent his Son, made of a woman, made under the law." By this therefore, that "he was made under the law," he was made "the minister of Moses." But God says that they are to "cross over into the land," not which Moses gave, but "which I," he says, "give to you." You see therefore that, Moses being dead, God gives the "land" to the people through Jesus. What "land"? That land without doubt of which the Lord says: "blessed are the meek, for they shall possess the land as their inheritance."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Joshua%2FHomily02.html'
source_title="HOMILIES ON JOSHUA 2.2"
