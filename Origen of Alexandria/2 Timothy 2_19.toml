[[commentary]]
quote='''
The Lord knows his own, but the wicked and the impious he does not know. Hear the Savior saying: "Depart from me all you workers of iniquity, I have not known you." And again Paul says: "If anyone among you is a prophet or spiritual, let him recognize that the things I write are the Lord's. But he who is ignorant, is ignored." But we say these things not perceiving anything blasphemous about God, as you do, nor ascribing ignorance to him, but we understand it thus, that those whose deed is unworthy of God are also deemed unworthy of the knowledge of God. For God does not deign to know him who is turned away from him and is ignorant of him. And therefore the Apostle says that "he who is ignorant, is ignored."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily04.html'
source_title="HOMILIES ON GENESIS 4.6"


[[commentary]]
quote='''
Those who have been made one with and united with something know that with which they have been made one and have been united. Yet before such unity and participation, even if they objectively grasp something of the explanations given about a thing, they still do not know it.… For, in our view, the Lord has known those who are his because he has been made one with them and has given them a share of his own divinity and has taken them up, as the language of the Gospel says, into his own hand, since those who have believed in the Savior are in the Father's hand. For this reason also, unless they fall from his hand—thereby removing themselves from the hand of God, they will not be snatched away, for no one snatches anyone from the Father's hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252019.html'
source_title="COMMENTARY ON JOHN 19.22, 25"
