[[commentary]]
quote='''
The fig tree has put forth its green figs; the vines flower, they have given their fragrance. If the vines already burst into flower, the time will come, and there will be grapes. Rise up, come, my love, my beautiful one, my dove. These things which we have expounded above, the bridegroom speaks not while the maidens hear, but while the bride alone hears. But we wish now to hear his own word too, as he speaks to the bride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="HOMILIES ON THE SONG OF SONGS, HOMILY 2"
