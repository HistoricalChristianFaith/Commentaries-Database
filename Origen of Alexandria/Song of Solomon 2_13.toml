[[commentary]]
quote='''
‘THE FIG TREE HATH PUT FORTH HER GREEN FIGS.’ From the fig tree learn a parable: When the branch thereof is now tender and putteth forth leaves, know ye that summer is nigh. God wills to tell us by this declaration that after the winter, after its storms, the harvest of souls has drawn nigh; and He says: ‘The fig tree hath put forth her green figs, THE VINES ARE IN FLOWER, THEY YIELD THEIR SWEET SMELL.’ They are breaking out into blossom, and the time is coming when there will be grapes.

‘ARISE AND COME, MY NEIGHBOUR, MY BEAUTIFUL ONE, MY DOVE!’ The Bride, who alone hears the Bridegroom, speaks the words that we expounded previously, and that not in the hearing of the maidens. But we want to listen now to what He says when speaking to the Bride: ‘Arise and come, my neighbour.’ He does not address the maidens, nor does He say ‘Arise ye,’ but ‘Arise, come, my neighbour, my beautiful one, my dove; AND COME, MY DOVE, BENEATH THE SHELTER OF THE ROCK.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
