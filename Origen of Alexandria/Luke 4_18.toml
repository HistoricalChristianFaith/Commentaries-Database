[[commentary]]
quote='''
By the poor He means the Gentile nations, for they were poor, possessing nothing at all, having neither God, nor Law, nor Prophets, nor justice, and the other virtues.

For what had been so shattered and dashed about as man, who was set at liberty by Jesus and healed?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Let us therefore contemplate what those things are which he spoke in the prophet and afterward sounds forth about himself in the synagogue. "He sent me", it says, "to evangelize the poor". The "poor" signifies the nations; for these were "poor", possessing nothing at all, not God, not the law, not the prophets, not justice and the remaining virtues. For which cause God sent him to announce to the poor: "to preach release to the captives". Captives we were, whom for so many years Satan had bound, holding us captive and subject to himself. Jesus came "to preach release to the captives and to the blind, that they might see"; for indeed by the word and preaching of his teaching the blind see. Let the preaching therefore be understood ἀπὸ κοινοῦ (in common), not only over the captives, but also over the blind. "To send forth the broken into liberty". What was ever so broken and crushed as man, who was released and healed by Jesus?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily32.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 32"
