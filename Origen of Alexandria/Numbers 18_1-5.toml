[[commentary]]
quote='''
There follows after these things: "and you," it says, "and your sons shall take upon yourselves the sins of your priesthood. And your brethren, the tribe of Levi, the people of your father, take to yourself, and let them be joined to you and minister to you, and you and your sons with you in the sight of the tabernacle of testimony shall keep your watches and the watches of the tabernacle." It befits those especially who glory in the priestly order to observe more diligently and to attend to these things which are written, that they may know what it is that the divine law prescribes to them to be observed. "You," it says, "and your sons with you in the sight of the tabernacle of testimony, keep your watches and those of the altar and of the tabernacle." The commands indeed are certain and evident, that we ought to keep the watches of the tabernacle and of the altar and of the priesthood; but who indeed it is that keeps and does those things which are commanded to the priests, and who it is that makes use indeed of the order and honor of the priesthood, but does not observe the work and ministry of the priesthood, he alone can know who searches hearts and reins. Now there are commanded to be observed not only those things which are without, but "those things," it says, that the priests should especially attend to, which are within the veil, as though it said: let it be the care of the priests both to fulfill the evident and manifest commands of the divine law, and to contemplate its mysteries, hidden and veiled, with all perspicacity. But if you wish to refer the tabernacle of testimony to man, since indeed Paul calls the body of man a tabernacle when he says: "for we who are in this tabernacle groan, being weighed down, in which we do not wish to be stripped, but to be clothed upon"—if, then, we refer the tabernacle to man, the interior parts of the veil, where inaccessible things are covered, we shall call the ruling part of the heart, which alone can receive the mysteries of truth and be capable of the secrets of God. But the two altars, that is, the interior and the exterior, since the altar is an indication of prayer, that one I think signifies what the Apostle says: "I will pray with the spirit, I will pray also with the mind." For when I have prayed in the heart, I enter to the interior altar, and this I think is also what the Lord says in the Gospels: "but you, when you pray, enter into your chamber, and shut your door, and pray to your Father in secret." He, therefore, who prays thus, as I have said, enters to the altar of incense, which is interior. But when someone with clear voice and with words uttered with sound, as though to edify the hearers, pours out prayer to God, this man prays with the spirit and seems to offer a victim on the altar which is outside, appointed for the burnt offerings of the people. It behooves the priests, therefore, especially to attend to and guard those things which are covered within the interior veil, that nothing there be found polluted, nothing be found unclean; that is, to attend to the interior man and the secrets of the heart, that there they may remain immaculate. By the cherubim and the propitiatory the knowledge of the Trinity is to be understood; for the interpretation of "cherubim" indicates a multitude, that is, a perfection, of knowledge; and what is other perfection of knowledge except to have known the Father and the Son and the Holy Spirit? These things, therefore, are to be attended to by the priests, that they may be kept uncontaminated and unharmed. But also the urn holding the heavenly food of manna is surely a treasure of the divine word. And the golden ark, in which are the tables of the testament, is, as I think, declared to be nothing other than our mind, in which we ought to have the law of God written. And this mind ought to be golden, that is, pure and precious, in which we may always have the law of God written, as the Apostle says: "written not with ink, but with the Spirit of the living God, not on tables of stone, but on the fleshly tables of the heart." For this is also what is said concerning certain persons: "who show the work of the law written in their hearts." But who has written in their hearts, except God with his finger? The natural law, surely, which God gave to the human race and wrote in the minds of all; whence we also take our beginnings and receive certain seeds for searching out the truth; which seeds, if we cultivate them well, will bring forth in us the fruit of life in Christ Jesus our Lord, to whom be glory unto the ages of ages. Amen.
'''
