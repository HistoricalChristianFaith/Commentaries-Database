[[commentary]]
quote='''
After this, indeed joined continuously to it, follows the festival of the unleavened bread, which you will rightly celebrate if you drive out every leaven of malice from your soul and keep the unleavened bread of sincerity and truth. For it is not to be supposed that Almighty God writes laws for men about leaven, and for that reason commands the soul to be exterminated from the people, if perchance it is found to have had in its house any little bit of this leaven from the sprinkled flour; and that such care was a matter of great concern to the divine Majesty, that He should say Himself so greatly offended on account of this leaven, that He commands the soul which He Himself made to His own image and likeness to be exterminated and overthrown on this account — this does not seem to me an understanding worthy of the divine laws; but rather it is this, at which God shudders and rightly shudders, if the soul be leavened with the spirit of malice, of anger, of wickedness, and swell up to shameful deeds. These God does not wish to be in the soul, and unless we cast out such leaven from the house of our soul, we shall deservedly be exterminated. But do not despise it, even if you see a small malice being leavened within you, because a little leaven corrupts the whole lump; and therefore do not be negligent even of a small sin, since from one sin another too is generated. For just as from justice justice is generated, and from chastity chastity — for if anyone first begins to be chaste in a slight degree, having received the leaven of chastity he becomes daily more chaste — so also he who has once stored up within himself even a small leaven of malice becomes daily more wicked and worse than himself. And therefore, if you wish to keep the festival of unleavened bread with God, do not suffer even a small leaven of malice to remain within you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily23.html'
source_title="HOMILIES ON NUMBERS 23.7"
