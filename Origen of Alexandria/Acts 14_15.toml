[[commentary]]
quote='''
For to offer a son or a daughter or cattle or an estate — all this is outside of us; but to offer oneself to God, and to please him not by another's labor but by one's own, this is more perfect and more excellent than all vows; and he who does this is an imitator of Christ. For he gave to man the earth, the sea, and all that is in them; he gave them for his service, and he granted heaven, the sun also and the moon and the stars, to the ministry of men; rains, winds, and all whatsoever is in the world, he bestowed upon men. But after all these things he gave himself; for thus God loved the world, that he gave his only-begotten Son for the life of this world. What great thing therefore will man do if he offers himself to God, to whom God himself first offered himself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily24.html'
source_title="HOMILIES ON NUMBERS 24.2"
