[[commentary]]
quote='''
We now have in hand the third prophecy of those which the Word of God brought forth through Balaam, so that concerning it too we may discuss some things, as the Lord shall grant. For that unhappy Balak, supposing that what had been lacking to Balaam for cursing by divine leave was the favorable position of the place rather than the will, and judging it more advantageous if he changed the place, says, "Come and I will lead you to another place, if it please God, and you shall curse it from there." And Balak took Balaam himself to the top of Mount Peor, which looks out over the desert. Those indeed whom God calls, He sets upon the top of Mount Sinai; but this Balak, who is contrary to God, sets Balaam on the top of Mount Peor. Now Peor is interpreted "delight"; upon the top, therefore, of delight and lust this Balak sets men. For he is a lover of pleasure rather than of God, and therefore he places them on the summit and top of pleasure, that he may shut them out from God; for Balak is interpreted "one who shuts out" and "devouring." And so for this reason too Peor looks toward the wilderness, that is, toward those affairs which are wilderness and desert to God. And Balaam said to Balak, "Build me here seven altars, and prepare me here seven calves and seven rams." And Balak did as Balaam had told him, and he offered a calf and a ram upon the altar. The saying of the Apostle is indeed plain, when he says, "For the things which the nations sacrifice, they sacrifice to demons and not to God"; but the prophet likewise says, "They sacrificed to demons and not to God." Yet since the law of God also gives commandment concerning sacrifices and hands down the rite of sacrificing to the sons of Israel, perhaps it may be asked why these things, though they seem dedicated to demons, are also commanded to be offered to God. And there will indeed be a simple and ready answer: that just as in other matters we have shown that the giving of the bill of divorce was not of the will of God — who did not wish that which He had joined to be separated — but Moses wrote these things properly for the hardness of the heart of the Jews, so also concerning this it can be seen that God, as He says through another prophet, "does not eat the flesh of bulls nor drink the blood of goats," and likewise as it is written elsewhere, "For I gave no command there concerning sacrifices and victims in the day when I led you out of the land of Egypt," but that Moses commanded these things to them for the hardness of their heart, on account of the wicked custom with which they had been imbued in Egypt, so that those who could not abstain from sacrificing might at least sacrifice to God and not to demons. Yet it must be considered whether perhaps there is also some more hidden and more secret reason for sacrificing to God. Perhaps, I say, the sacrifices which are offered to God are made for the destruction of those sacrifices which are immolated to demons, so that, because through the latter souls are wounded, through the former they may be healed. Just as those also confirm who possess skill in medicine; for they report that the poisons of serpents are nonetheless driven off by medicines compounded from serpents. So then, too, the venom of the demonic sacrifices is driven off through the sacrifices offered to God, just as the death of Jesus does not permit the death of sin to hold dominion over believers. And indeed, while the time allowed it, sacrifices were set against sacrifices; but when there came the perfect victim and the spotless lamb, who would take away the sin of the whole world, those sacrifices which were offered one by one to God now seemed superfluous, since by one victim all worship of demons was driven away. But this Balaam, whether according to the purpose of his heart, which he had not amended, or according to that figure by which we said that he holds the person of the teachers and Pharisees of the unbelieving people, still sets up victims anew and orders sacrifices to be prepared. For in these things all their hope is borne by those whose heart does not receive the faith of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily17.html'
source_title="HOMILIES ON NUMBERS 17.1"
