[[commentary]]
quote='''
Having therefore first set out such a distinction concerning the term "spirit," let us now see what the meaning is of what he said: "For you have not received the spirit of servitude again in fear, but you have received the spirit of the adoption of sons, in which we cry: Abba, Father." It is written also in the prophet Malachi: "A son honors his father, and a servant his master: and if I am a Father, where is my honor? and if I am a Lord, where is my fear? says the Lord almighty." But it is certain that a person becomes a son of God through the spirit of adoption, and a servant of God through the spirit of servitude. The beginning, therefore, of serving God — since "the beginning of wisdom is the fear of the Lord" — is fulfilled through the spirit of fear, while one is still called a little child. And for little children fear is indeed a tutor. Whence the Apostle also says concerning such a little child: "As long as the heir is a little child, he differs in nothing from a servant, though he be lord of all; but he is under guardians and stewards until the time predetermined by the father; so also we, when we were little children, were in servitude under the elements of this world." You see how Paul, according to the wisdom granted him by God, has here called the spirits that are given in fear the guardians and stewards of little children — spirits which keep each one of us, so long as he is a little child, in fear according to the inner man, until he comes to that age at which he may deserve to receive the spirit of the adoption of sons, and may now be a son and lord of all. "For all things," he says, "are yours," and together with Christ God has given us all things. This, then, is what Paul teaches: that after we have died together with Christ, and his Spirit has come to be in us, we have not again received the spirit of servitude in fear — that is, we have not once more been made little children and beginners, but as men already perfected we have received once for all the spirit of adoption, "in which" spirit "we cry: Abba, Father." For no one calls him father except a son. But as for his adding "Abba," he repeated the very same thing in the vocabulary of his native tongue, as if he had said: Father, father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook07.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
