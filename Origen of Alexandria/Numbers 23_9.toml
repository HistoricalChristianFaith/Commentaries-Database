[[commentary]]
quote='''
And nevertheless, what the reason is that the Lord does not curse Jacob nor Israel, let us hear more carefully from Balaam himself, or rather from the word which God placed in his mouth: "For from the peaks of the mountains," he says, "I shall behold him, and from the hills I shall understand him." Because, he says, Israel is placed upon lofty mountains and high hills, that is, in a lofty and steep life, for beholding and understanding which one does not easily become fit unless he ascends to eminent and lofty knowledge, therefore, he says, God does not curse him; for his life is high and exalted, not lowly and cast down. Yet this does not seem to me to have been said concerning that Israel which is Israel according to the flesh, but concerning that one whose conversation, as he walks upon the earth, is in heaven. Or if these words are to be referred also to that people, he rightly says with a distinction: "I shall behold and I shall understand," so as to signify a future time, that one without doubt when all Israel, coming to the faith of Christ, shall be saved and shall be beheld from the mountains and hills; from those, without doubt, who, rising together with Christ, shall have practiced a lofty and heavenly life upon the earth. But also the fact that he said concerning Jacob "I shall see," but concerning Israel "I shall understand," this too is to be taken with a most apt distinction, so that the one may be referred to visible acts, the other to invisible faith and intelligible knowledge. Or if we turn these things to the future age, that is, to the time of the resurrection, "Jacob I shall see" can be understood as said of the bodies, but "Israel I shall understand" can be understood to signify the spirits and souls of those who rise again. "Behold," he says, "the people shall dwell alone, and shall not be reckoned among the nations." This can indeed stand also according to the letter; for the people of Jacob alone is not mingled with the rest of men, nor is it reckoned among the other nations: for it had certain fixed privileges in its observances and in its ordinances, by which it was held to be set apart from the other nations. For just as the tribe of Levi is not mingled among the other tribes nor is numbered among them, in this same way all Israel too is neither mixed with the other nations nor reckoned among them. These things indeed will have been in that people according to the pattern of future good things; but the true Jacob and the spiritual Israel shall truly dwell alone among the nations. For if we have come to Mount Zion and the city of the living God, the heavenly Jerusalem, and have come to the spiritual Judea, which is God's portion, and, placed on earth, have our conversation there, truly we are not reckoned among the other nations, nor are the borders of the remaining nations mingled with our borders, even if Sodom be restored to its ancient state and Egypt return to its condition, and whatever else of this kind is written in the prophets. Nevertheless, to that Jacob and spiritual Israel, when they shall have ascended to the church of the firstborn, none will be made equal, none will be mingled, even if these nations shall have been restored according to the prophetic sayings. For unless the branch of the wild olive has been grafted in and has become a partaker of the root of the olive's richness, how can it be associated and joined to Jacob or Israel, since without that root no one can be called either Jacob or Israel? Neither, then, if anyone of Jacob or Israel sins, can he be called Jacob or Israel; nor, if anyone of the nations has entered the church of the Lord, will he any longer be reckoned among the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily15.html'
source_title="HOMILIES ON NUMBERS 15.3"
