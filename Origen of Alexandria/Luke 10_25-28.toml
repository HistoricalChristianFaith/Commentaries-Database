[[commentary]]
quote='''
Although there are many precepts in the law, the Savior set down in the Gospel only these, which by a kind of summary would lead the obedient to eternal life. For he has regard to that which the doctor of the law had asked him, saying: "Master, what shall I do to possess eternal life?" — the reading which according to Luke has today been recited to you. He answered: "What is written in the law? how do you read? You shall love the Lord your God with your whole heart, and with your whole soul, and with your whole strength, and with your whole mind; and your neighbor as yourself". And then he said: "You have answered well; do this, and you shall live". There is no doubt that it is everlasting life about which both the doctor of the law had inquired and the Savior's discourse had treated. And at the same time we are plainly taught that it is commanded in the law that we should love God. In Deuteronomy he says: "Hear, O Israel, the Lord your God is one God", and: "You shall love the Lord your God with your whole mind" and the rest, and "your neighbor as yourself". And the Savior bore witness concerning these things, saying: "On these two commandments the whole law hangs, and the prophets".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily34.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 34"
