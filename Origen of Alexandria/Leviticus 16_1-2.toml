[[commentary]]
quote='''
The Day of Atonement is needed by all who have sinned, and therefore among the solemnities of the law, which contain the figures of the heavenly mysteries, there is held a certain solemnity which is called the Day of Atonement. This, then, which has now been read out, is the legislation of that very solemnity which, as we have said, is called the Day of Atonement. But let us see first what the content of the letter itself intends, so that, while you pray — provided that you so beseech the Lord that you may deserve to be heard — we may be able to receive the grace of the Spirit, through which we may have strength to explain the mysteries which are contained in the law. "Two sons of Aaron died, Nadab and Abihu, when they offered strange fire at the altar of the Lord." It was necessary that Aaron should be instructed by heavenly teaching in what manner he ought to approach the altar, and by what rite of supplications he might make God propitious, so that he too might not incur those things which his sons had incurred by approaching the altar of God incautiously and improperly, offering "strange fire" and not that which had been divinely given. Therefore, then, concerning these things the law spoke beforehand in this manner: "and the Lord spoke to Moses, after the two sons of Aaron died while they offered strange fire before the Lord, and they died. And the Lord said to Moses: speak to Aaron your brother, that he enter not at every hour into the interior holy place, which is within the veil before the sight of the propitiatory, which is above the ark of testimony, and he shall not die." From which it is shown that, if he should "enter the holy place at every hour" unprepared, not clothed in the priestly garments, nor with the appointed victims prepared, nor with God first made propitious, he shall die. And justly indeed, as one who has not done those things which it is fitting to do before one approaches the altar of God. This word touches all of us, it pertains to all, what the law here speaks; for it has commanded that we should know how we ought to approach the altar of God. For there is an altar upon which we offer our prayers to God, so that we may know how we ought to offer, namely that we should put off the "filthy garments", which is the uncleanness of the flesh, the vices of morals, the defilements of lusts. Or do you not know that to you too, that is, to the whole church of God and to the people of believers, the priesthood has been given? Hear how Peter says of the faithful: "a chosen" he says "race, royal, priestly, a holy nation, a people for acquisition." You have therefore the priesthood, because you are a "priestly nation", and therefore you "ought to offer to God the victim of praise", the victim of prayers, the victim of mercy, the victim of chastity, the victim of righteousness, the victim of holiness. But that you may offer these worthily, you have need of garments that are clean and set apart from the common garments of the rest of men, and you have as necessary the divine fire, not some fire "strange" to God, but that which is given by God to men, of which the Son of God says: "I came to send fire upon the earth, and how I wish that it be kindled." For if we use not this, but another fire and one contrary to this, that fire of him who "transforms himself as an angel of light", we shall without doubt suffer the same things which "Nadab and Abihu" suffered. Therefore the divine command has commanded that Aaron be instructed "not to enter the holy place at every hour" to the altar, but only when he has first done those things which are commanded to be done, lest perchance he die.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily09.html'
source_title="HOMILIES ON LEVITICUS 9"
