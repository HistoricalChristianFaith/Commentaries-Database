[[commentary]]
quote='''
Bless those who persecute you; bless, and do not curse. The Apostle, pursuing the moral topic more broadly, orders the deeds, the mind, the purpose, and also the very mouth and tongue of the disciples. He does not wish those who believe in Christ to bring forth a curse out of their mouth, but to speak well, to bless, to pray well, so that from this they may be believed both to be servants of a good Lord and disciples of a good Master. Yet it must be known that this word "blessing" is found placed in the Scriptures in various senses. For God is found to bless either human beings or the other things he had created; and human beings, or the other creatures, are commanded to bless God. But God's blessing always imparts some gift to those who are blessed by him, whereas human beings are said to bless God in the sense of praising him and returning thanks. Here, however, the Apostle, in saying Bless, and do not curse, admonishes that when we are provoked by enemies, or goaded by injuries, we should not return curses for curses, but should do what he writes of himself where he says: We are cursed, and we bless.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook09.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
