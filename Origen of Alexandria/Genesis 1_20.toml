[[commentary]]
quote='''
"And God said: Let the waters bring forth creeping things of living souls and flying things flying over the earth according to the firmament of heaven. And it was made so." According to the letter, by the command of God there are brought forth from the waters "creeping things" and "flying things," and we know by whom these things which we see were made. But let us see how, according to our own firmament of heaven, that is, the solidity of our mind or heart, these same things come to be. I think that, if our mind has been enlightened by our sun, Christ, it is afterward commanded to bring forth from the waters which are in it "creeping things" and "flying things flying," that is, to bring forth into the open good or evil thoughts, so that a distinction may be made of the good from the evil, both of which surely proceed from the heart. For from our heart, as from waters, there are brought forth both good thoughts and evil ones. But let us by the word and precept of God bring forth both into the sight and judgment of God, so that with his enlightenment we may be able to discern from the good what is evil, that is, so that we may separate from ourselves the things that creep upon the earth and carry earthly cares; but the things that are better, that is, "the flying things," let us allow to fly not only "over the earth," but also "according to the firmament of heaven"; that is, so that we may treat within ourselves the meaning and reason both of earthly and of heavenly things, and may also be able to understand which in us are harmful among the creeping things. If we look "upon a woman to lust after her," that is in us a venomous reptile; but if there is in us the sense of sobriety, even if the Egyptian mistress falls in love with us, we are made birds and, leaving the Egyptian garments in her hands, we shall fly away from the obscene snares. If there is in us a sense provoking us to steal, that is a most wicked reptile; but if there is in us a sense that, even if we have "two mites," we may offer these very things out of mercy "into the gifts of God," this sense is a bird, thinking nothing of earthly things, but tending by its flights to the firmament of heaven. If there comes to us a sense persuading us that we ought not to endure the torments of martyrdom, that will be a venomous reptile; but if there ascends in us such a sense and thought that we should strive even unto death for the truth, this will be a bird striving from earthly things to the things above. Similarly also concerning the other kinds either of sins or of virtues one must judge and discern which are "creeping things" and which are "flying things," which our waters are commanded to bring forth for discernment in the sight of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.8"
