[[commentary]]
quote='''
Yet far more execrable is that general fornication in which every kind of sin is alike contained. Now it is called general fornication when the soul, which has been admitted into fellowship with the Word of God and in some manner joined to Him in matrimony, is corrupted and violated by some other — namely by one foreign and hostile to that Husband who betrothed her to Himself in faith. The bridegroom, then, and husband of the pure and chaste soul is the Word of God, who is Christ the Lord, as the Apostle also writes: "I wish to present you all as a chaste virgin to one husband, Christ; but I fear lest perhaps, as the serpent seduced Eve by his cunning, your senses be corrupted from the simplicity which is in Christ Jesus." As long, therefore, as the soul clings to her bridegroom and hears his word and embraces him, without doubt she receives from him the seed of the word; and as he said: "From fear of you, Lord, we have conceived in the womb," so also she says: "From your word, Lord, I conceived in the womb and travailed and brought forth the spirit of your salvation upon the earth." If, therefore, the soul thus conceives from Christ, she makes sons, for whom it may be said of her that: "She shall be saved through the bearing of children, if they continue in faith and charity and holiness with sobriety" — even if the soul may seem first, like Eve, to have been seduced. And so the offspring is truly blessed where there has been an intercourse of the soul with the Word of God and where they have given embraces to one another. Thence a noble progeny will be born, thence chastity will arise; thence righteousness, thence patience, thence gentleness and charity, and the venerable offspring of all the virtues will follow. But if the unhappy soul forsakes the holy nuptials of the divine word and, deceived by the enticements of the devil and of other demons, gives herself over to adulterous embraces, she will without doubt beget sons even from that, but those of whom it is written: "The sons of adulterers shall be imperfect, and from the unjust bed the seed shall be exterminated." All sins, therefore, are sons of adultery and sons of fornication. Whence it is shown that through each single thing which we do, our soul gives birth and generates sons — namely the thoughts and works which it does. And if indeed what it does is according to the law and according to the word of God, it brings forth the spirit of salvation, and therefore it shall be saved through the bearing of children; and these are the sons of whom the prophet says: "Your sons like young olive-shoots round about your table." But if what it does is against the law and is sin, without doubt from the conception of the contrary spirit it begets a wicked offspring; for it brings forth sons of sin. And these are the accursed generations, in which by some of the saints even the day on which they were born is cursed. There is therefore never a time when the soul does not give birth; the soul always gives birth, always generates sons. But that generation indeed is blessed which, conceived of the word of God, is generated, and this is the bearing of children through which she shall be saved. But if, as we have said, she conceives from the contrary spirit, it is certain that she bears sons of wrath fitted for destruction. And perhaps to both these generations of the soul that refers which was said: "For when they were not yet born, nor had done anything good or evil, that the purpose of God according to election might stand, not of works but of him who calls, it was said that the greater shall serve the lesser, as it is written: Jacob I loved, but Esau I hated." For such generations of the soul, even before they do anything good — if indeed they are generated of the Holy Spirit — are already loved; but if they are of the evil spirit, even before they accomplish anything of evil in work, yet by this very thing, that the soul has brought forth a will of this kind, the execrable conception of the evil will is worthily hated in her. Therefore perhaps, as a figure of this sacrament, even the boy Canaan is cursed before he was born. For Ham his father had sinned, and Noah, prophesying, when he was signing out each best thing to each of his sons, when it came to Ham, said: "Cursed be the boy Canaan." Ham sinned, and Canaan his offspring is cursed and was cursed. And therefore we must apply ourselves more sharply and look ahead, lest perhaps the soul generate something worthy of a curse; even if it has not yet accomplished it in work, yet in its very will and purpose there will be an accursed progeny of this kind. And if perhaps this should ever happen — for who will easily be found who is held immune from such generation, that is, from the will to sin? — if therefore anything of the sort should happen, let us seek from the divine volumes what remedy is given. We find, then, written in the Psalms concerning this: "O wretched daughter of Babylon, blessed is he who will repay you the repayment which you repaid to us; blessed is he who will hold and dash your little ones against the rock." Even if this conceived Babylonian has not yet performed any work in us, while it is still a little one, do not pity it nor spare it, but at once kill it — for it is hateful — destroy it, slay it, dashing it against the rock. And the rock is Christ. Who then is so great and such a man that he will not by any means wait until the Babylonian offspring grows within him and the works of confusion are increased within him, but at the very first beginnings, when they have begun to be born and to grow strong from the motions of the will, and, so to speak, when the pernicious desires conceived by the inspiration of the evil spirit have begun to bring forth their head from the womb of the soul, will at once seize them and dash them against the rock — that is, bring them to Christ, so that, placed in the sight of His fearful judgment, they may wither away and perish? These things have been said by us concerning the general fornication, which has very many species, of which one is this which, in common usage, on account of bodily debauchery is called fornication. But I, reading the Apostle, when I had come to that place in which he says: "He who joins himself to the Lord is one spirit," and: "He who joins himself to a harlot is one body," was inquiring whether there is anything else in between besides this — that either one is joined to the Lord or to a harlot; and, examining according to my strength the sufficiently deep and hidden sense in these words, I beheld the meaning of the Apostle, who thus defined that every soul is either joined to the Lord or to a harlot, and I understood that by the Lord he meant the virtues, which are Christ, that is, the word, the wisdom, the truth, the righteousness, and the rest of this kind, but by the harlot all the contrary species of malice. This I understand to be said also in Solomon in that which he says of the harlot, that: "She looks out through the windows into the streets, and if she sees any of the foolish young men and one lacking in senses passing by the corners of her house and speaking in the evening darkness, when there is the silence of night or the gloom of night, a woman meets him, having the appearance of a harlot, who makes the hearts of young men fly away." This, then, which is called a harlot, is malice itself, and he who joins himself to this harlot becomes one body of malice. As, therefore, he who joins himself to the Lord joins himself to wisdom, joins himself to righteousness, joins himself to piety and truth, and with all these becomes one spirit, so also he who joins himself to this harlot joins himself to unchastity, to impiety, to iniquity, to falsehood, and at once to all the evils of sins, with which he becomes one body.
'''
