[[commentary]]
quote='''
And I think myself that the birth of Jesus also originated from—not in—the shadow, but was consummated in the truth. The Holy Spirit, it was said, shall come upon thee, and the power of the Most High shall overshadow thee. The birth of Christ took its inception from the shadow; yet not in Mary only did His nativity begin with overshadowing; in you too, if you are worthy, the Word of God is born. See, then, that you may be able to receive His shadow; and, when you have been made worthy of the shadow, His body, from which the shadow is born, will in a manner of speaking come to you; for he that is faithful in a little will be faithful also in greater things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520the%2520Song%2520of%2520Songs%2FHomily%25202.html'
source_title="Homilies on the Song of Songs, Homily 2"
