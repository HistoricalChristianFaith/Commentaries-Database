[[commentary]]
quote='''
You, therefore, if you wish to fast, fast according to the precept of the Gospel, and observe in your fasts the evangelical laws, in which the Savior commands concerning fasts in this manner: "But you, if you fast, anoint your head and wash your face." And if you inquire how you should "wash your face," the Apostle Paul teaches how you may "with unveiled face behold the glory of the Lord, transformed into the same image from glory to glory, as by the Spirit of the Lord." "Anoint" also "your head," but take care that it be not with the oil of sin: for "let not the oil of the sinner make fat your head." But "anoint your head" with the oil of exultation, with the "oil of gladness," with the oil of mercy, so that, according to the command of wisdom, "mercy and faith may not forsake you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily10.html'
source_title="HOMILIES ON LEVITICUS 10"
