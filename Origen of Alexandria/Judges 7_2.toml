[[commentary]]
quote='''
Vast was the multitude that had been gathered against Israel, so great that for its number it was compared to "locusts". "And their camels", it says, "were like the sand which is beyond number upon the shore of the sea". Let us see, then, how so countless a multitude of enemies could be overcome: there went out, it says, thirty-two thousand armed men from the sons of Israel with Gideon to fight against all that multitude. And God gave answer to Gideon, saying: "The multitude that is with you is great". And what if "the multitude is great"? Does not a more numerous army in wars afford safer defenses? By no means, He says, for divine battles are not carried out as human ones are. The work of the divine power is not made illustrious if it is propped up by human supports, because: "a king is not made safe by the greatness of his own power". Therefore, lest perhaps Israel should boast and in its vaunting claim a share of the victory, the Lord says to Gideon: "The people with you are many; I will not deliver Midian into their hands, lest perhaps Israel exult against Me, saying that my own hand has saved me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily09.html'
source_title="HOMILIES ON JUDGES 9"
