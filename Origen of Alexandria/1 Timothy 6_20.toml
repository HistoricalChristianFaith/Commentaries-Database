[[commentary]]
quote='''
Let us therefore now see what is the "deposit" which each of the faithful has received. I think that we have received both our own soul and our body as a deposit from God. And do you wish to see another, greater "deposit" which you have received from God? To your very soul God entrusted "his own image and likeness." This deposit, therefore, must be restored by you as whole as it is established to have been received by you. For if you are merciful, "as your Father in heaven is merciful," the image of God is in you and you preserve the "deposit" whole. If you are perfect, "as your Father also in heaven is perfect," the deposit of the image of God remains in you. And likewise all the rest: if you are devout, if you are just, if holy, if "pure in heart," and if all the things which are present in God by nature subsist in you by imitation, the "deposit" of the divine image is safe with you. But if on the contrary you act, and instead of merciful are cruel, instead of devout impious, instead of kind violent, instead of tranquil turbulent, instead of generous a plunderer, then, having cast away the image of God, you have taken up in yourself the image of the devil and have denied the good "deposit" entrusted to you from on high. Or was this not what the Apostle, under a mystery, was commanding to his chosen disciple Timothy, saying: "O Timothy, guard the good deposit"? I even add this, that we have received Christ the Lord as a "deposit" and have the Holy Spirit as a "deposit." We must therefore take heed that we do not use this holy deposit unholily and, when sins solicit us to consent to them, swear that we have not received a "deposit." For if indeed we have it within us, we cannot consent to sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily04.html'
source_title="HOMILIES ON LEVITICUS 4"


[[commentary]]
quote='''
To go into the way of the Gentiles is to adopt some Gentile teaching which is foreign to the "Israel of God" and to walk according to it. And to enter a city of the Samaritans is to be engaged in some knowledge falsely so-called of those who claim to devote themselves to the words of the law or the prophets or the Gospels or the apostles. 
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%252013.html'
source_title="Commentary on John 13.343"


[[commentary]]
quote='''
Celsus also says that "they were of one mind," not seeing even here that from the outset there were disagreements among the believers about the interpretation of the books regarded as divine.… In the epistles of Paul, who was contemporary with those who had seen Jesus, there are some statements to be found which concern certain disputes about the resurrection, and about the view that it had already occurred, and about the question whether the day of the Lord was already present or not. Moreover, the words "Turning away from the profane babblings and oppositions of the knowledge falsely so-called, which some have professed and made shipwreck concerning the faith" show that from the beginning there were certain varieties of interpretation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FAgainst%2520Celsus%2FBook%25203.html'
source_title="AGAINST CELSUS 3.11"
