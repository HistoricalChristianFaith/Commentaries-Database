[[commentary]]
quote='''
After this it says: "hear, O kings, and give ear, O satraps: to the Lord I will sing, I will sing praise to the God of Israel". "Hear", it says, "O kings". It calls "kings" those who are summoned to hear the word of God. Exult, O people of God, hearing the insignia of your nobility. You are called to hear the word of God, and you are called not as the common crowd, but as a king. For to you it has been said: "a royal priestly race, a people for acquisition". Therefore, because you are "kings", deservedly is our king Christ the Lord called "king of kings and lord of those who rule". But just as you have exulted over the title of your nobility, so ought you to learn what each of you must do to become a king. Which I will define for you thus, briefly. It makes you a king over all, if Christ reigns in you; for a king is so called from ruling. If therefore in you too the mind reigns and the body obeys, if you send the desires of the flesh under the yoke of your dominion, if you press down the nations of the vices with the tighter reins of your sobriety, deservedly are you called a "king", who have known how to rule yourself rightly. When therefore you have been made such, worthily, as a king, will you be called to hear the divine words. But this which follows indicates something more corporeal, where it says: "give ear, all you satraps". For just as a satrap is lower than a king, so also to give ear seems to be something lower than to hear. For to hear pertains to the inner man, as the Lord too said: "he who has ears to hear, let him hear"; but to give ear regards the outer and bodily hearing. Therefore here too those who ought to "hear" are called "kings", but those who are to "give ear" are called "satraps". "I to the Lord will sing, and I will sing praise to the God of Israel". Blessed are those who are able "to sing a song to the Lord". When we return to the Scriptures, we find many songs committed to the sacred volumes. We have a whole volume written about the Songs of Songs. Behold, in this book of Judges too we have a song, and in Numbers a song is written, and in Deuteronomy, and in Exodus, and in the first book of Kingdoms; in the first book of Chronicles too, and in many other places, you will find that divine songs are recorded. Here therefore the voice of the just man says: "I to the Lord will sing, and I will sing praise to the God of Israel". Who, do you think, is of so tuneful a voice and of a spirit so pure and a mind so sincere, that his singing can delight the divine hearing? He assuredly is the one who has in himself no hoarse sound of sin, who bears nothing of offense on his tongue, nothing of grossness in his spirit — he can rightly say: "I to the Lord will sing, I will sing praise to the God of Israel".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Judges%2FHomily06.html'
source_title="HOMILIES ON JUDGES 6"
