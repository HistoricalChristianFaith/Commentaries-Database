[[commentary]]
quote='''
In the wicked sin reigns over the soul, being settled as on its own throne in the mortal body, so that the soul obeys its lusts … but in the case of those who have become perfected, the spirit has gained the mastery and put to death the deeds of the body. It imparts to the body of its own life and there arises a concord of the two, body and spirit, on the earth.… But still more blessed is it if the three [i.e., body, soul and spirit] be gathered together in the name of Jesus, that this may be fulfilled, "May God sanctify you wholly, and may your spirit and soul and body be preserved entire without blame at the coming of our Lord Jesus Christ."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Matthew%2FIntroduction.html'
source_title="COMMENTARY ON MATTHEW 14.3"


[[commentary]]
quote='''
From the Holy Scriptures we are taught that man is a composite being. And the Apostle confirms it: "May God sanctify your spirit and soul and body," and: "may He sanctify you wholly, and may your whole being, spirit and soul and body, be preserved blameless at the coming of our Lord Jesus Christ." … And so our Lord and Savior, desiring the salvation of man, wished … to save the body, just as He wished to save also the soul and the remaining part of man — the spirit. Man would not be saved entirely if he were not taken up entirely. … These three parts were divided at the time of the sufferings. These three parts were reunited at the time of the resurrection. At the time of the sufferings they were divided. In what way? The body in the tomb, the soul in hell, the spirit was given up to the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
