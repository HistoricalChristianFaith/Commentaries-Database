[[commentary]]
quote='''
There were five daughters, whose names too are recorded in Scripture, born of a certain Israelite named Zelophehad, who died in the desert leaving behind no male offspring. These daughters of Zelophehad therefore approach Moses and demand a share of their father's inheritance, saying: let not the name of their father be blotted out from the midst of his people, because no son was born to him. On this matter Moses refers the question to God. But the mercy of Almighty God does not spurn or despise a consultation offered by young women, and not only deigns to give an answer, but so approves and embraces their words that from them he establishes eternal laws for men, to be observed for all ages. For the Lord says, speaking to Moses: the daughters of Zelophehad have spoken rightly; you shall give them a possession in the midst of their father's brothers, and you shall give the inheritance of their father to them. And you shall speak to the children of Israel, saying: if a man dies and has no son, you shall give his inheritance to his daughters; but if he has no daughter, you shall give his inheritance to his brother; but if he has no brothers, you shall give his inheritance to his father's brother; but if his father has no brothers, you shall give the inheritance to the kinsman who is nearest to him from his own tribe, and he shall take his inheritance. And this shall be for the children of Israel a statute of judgment, as the Lord appointed to Moses. What force these things have according to the historical sense is plain to all who know that these laws are kept not only among the children of Israel, but among all men who live by laws at all. From which it appears that the freedom of the daughters of Zelophehad conferred an inheritance not only upon themselves, but also gave perpetual laws of living to the world. You see how great is the usefulness even of the historical account itself in the law of God. Who can ever dissolve these laws which the whole world employs? But nevertheless let us seek how we too may be edified spiritually. For it can happen that I have neither daughters according to the flesh nor any land whose inheritance could be received. What then? Will this law accomplish nothing in the case of such a person, and will what has been sanctioned by the divine voice be idle for anyone? Let us therefore inquire, even in the spiritual law, who these five daughters are, who, even if their father has died for some sin, may themselves receive an inheritance from the word of God. In earlier passages, when we were treating of spiritual sons, we taught that the virtues of the soul and the perceptions of the mind are called sons. It seems, without doubt, a consequence and fitting that daughters too should be understood as works, which are accomplished by the ministry of the body. And therefore too the number five is assigned to them; for there are five bodily senses, by which every work is accomplished in the body. These five daughters, then — that is, the perfection of works — even if they are bereaved of their father and remain orphans, are nevertheless not cast out from the inheritance nor excluded from the kingdom, but receive a portion of the inheritance in the midst of the people of God. But now let us see who is their father who is said to have died to them. Zelophehad, it says. Now Zelophehad is interpreted "a shadow in his mouth." The father of works is understanding. It often happens, then — and there are not a few among our brothers — in whom there is no higher or deeper understanding, but in whom the perception is dead, as is written of a certain man: and his heart died within him. This man, therefore, even if he has no taste for spiritual understanding, but is dead, nevertheless, if he begets daughters — that is, works of ministry, works of obedient service, works of the commandments of God — will obtain an inheritance in the land with the people of the Lord. He will not indeed be able to be numbered among those whose portion is the Lord, whose inheritance is God; he will not be able to be received into the number of the ministers and priests; yet in the order of the common people he will receive an inheritance of the land of promise: for many are called, but few are chosen. Yet the cause is also shown from the interpretation of the very name, why this Zelophehad could not beget sons but daughters; for it is interpreted, as we have said, "a shadow in his mouth." You see, then, that if anyone has the shadow of the law in his mouth and not the very image of the realities, this man, because he can perceive nothing spiritual, nothing of deep understanding, but there is only a shadow of the law in his mouth, cannot beget living and spiritual perceptions, yet can beget works and acts, which are the ministries of a simpler life. And therefore in these the mercy of God shows that the more innocent, even if they are deficient in understanding, yet have good works, are not excluded from the inheritance of the saints. Rightly, therefore, have the daughters of Zelophehad spoken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Numbers%2FHomily22.html'
source_title="HOMILIES ON NUMBERS 22.1"
