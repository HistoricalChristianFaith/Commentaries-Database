[[commentary]]
quote='''
And he teaches that he who was going down was neighbor to no one except to him who was willing to keep the precepts and to prepare himself, so as to be neighbor to every man who is in need of aid. For this is what is set down at the end after the parable: "Which of these three seems to you to be neighbor to him who fell among the robbers?" For neither the priest nor the Levite was his neighbor, but, as the doctor of the law himself also answered, "he who did mercy" was his neighbor. Whence it is also said by the Savior: "Go, and you also do likewise".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily34.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 34"

[[commentary]]
quote='''
Truly this "guardian" of souls is nearer than the law and the prophets — he "who did mercy to him who had fallen among robbers" — and he appeared as his "neighbor" not so much by word as by deed. Since, therefore, it is possible, according to that which is said: "Be imitators of me, as I also am of Christ", for us to imitate Christ and to have mercy on those who "have fallen among robbers", to approach them, to bind up their wounds, to pour in oil and wine, to set them upon our own beast and to bear their burdens — for this reason the Son of God, exhorting us to such things, speaks not so much to the doctor of the law as to us all also: "Go, and you also do likewise". And if we shall do likewise, we shall attain eternal life in Christ Jesus: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily34.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 34"
