[[commentary]]
quote='''
The reading about the well and the song which Israel sang at the well has been recited to us from the book of Numbers — a reading which we see overflowing with mysteries in the usual measure, or rather perhaps even beyond the usual. For it says: "and from there, the well; this is the well of which the Lord said to Moses: Gather the people, and I will give them water to drink." But in these words the historical letter does not seem to me to possess much claim. For what is it that the Lord so greatly commanded Moses to gather the people, that he might give them water to drink from the well? — as if indeed the people would not of their own accord come together at the well for the sake of drinking. Why, then, is it so emphatically commanded to the prophet, that by his own zeal and labor he should gather the people to draw the water of the well? Hence the cheapness of the letter sends us back to the preciousness of the spiritual understanding. And therefore I think it fitting to gather the mysteries of wells also from other places of Scripture, so that from a comparison of many, if the present passage contains anything of obscurity, it may become clear. The Spirit of God therefore says through Solomon in Proverbs: "Drink waters from your own vessels and from the fountain of your own wells. And let not the waters be overpoured for you outside your own fountain" — although in other copies we have read: "and let the waters be poured out for you outside your own fountain." "Let your waters be for yourself alone, and let no stranger partake of them." Therefore each one of us has, as is designated in these words, a well within himself. Nay, we say something even more: each one of us has not one well, but many wells, and not one vessel of water, but many vessels; for it did not say: "Drink waters from your vessel," but "from your vessels," and it did not say: "and from the fountain of your well," but "from the fountain of your wells." We read that the patriarchs too had wells: Abraham had them, Isaac also had them; and I think Jacob had them as well. And taking your beginning from these wells, run through all Scripture seeking wells, and come even to the Gospels, and there you will find the well above which our Savior sat resting after the labor of the journey — then, when the Samaritan woman came and wished to draw water from the well, the power of the well or of wells in the Scriptures is expounded, and a comparison of waters is made, where also the secrets of the divine mystery are laid open. For it is said that, if anyone drinks from these waters which that earthly well contained, he thirsts again; but whoever drinks from those which Jesus gives, there becomes in him a fountain of water springing up into eternal life. But in another place of the Gospel there is now spoken not of a fountain nor a well, but of something more. "He who believes in me," it says, "as the Scripture says, rivers of living water shall proceed from his belly." You see, then, that he who believes in him has within himself not only a well, but wells, and not only fountains, but rivers; and fountains and rivers not such as would console this mortal life, but such as would confer the eternal. Therefore, according to those things which we set forth as written in Proverbs, where wells are named together with a fountain, the Word of God is to be understood as a well indeed, if it covers something of a deep mystery, but as a fountain, if it abounds and flows forth to the peoples. But it must be inquired, not idly, how we can expound the plural number regarding the wells and the singular regarding the fountain, since in Proverbs Wisdom says: "Drink waters from the fountain of your wells." Let us see, then, of which wells it called the fountain one. I think that the knowledge of the unbegotten Father can be understood as one well, but the recognition of his only-begotten Son ought to be understood as another well. For the Son is other than the Father, and the Son is not the same as the Father, as he himself says in the Gospels: "It is another who bears witness of me, the Father." And again I think that the knowledge of the Holy Spirit can be seen as a third well. For he too is other than the Father and the Son, as it is likewise said of him in the Gospels: "The Father will send you another Paraclete, the Spirit of truth." There is therefore this distinction of three persons in the Father and the Son and the Holy Spirit, which is referred to the plural number of wells. But of these wells there is one fountain; for the substance and nature of the Trinity is one. And in this way the distinction of the holy Scripture will be found not idle, which says: "from the fountain of your wells." But it marked the mystical utterances observantly, so that what was said in the plural should belong to the persons, and in the singular should fit the substance. But those also can be seen as wells, of the knowledge of which he spoke who was filled with the wisdom of God: "For he gave me the true knowledge of the things that are, that I might know the substance of the world and the power of the elements, the beginning and end and middle of times, the changes of the vicissitudes and the alterations of the seasons, the cycles of the year and the positions of the stars, the natures of animals and the raging of beasts, the violences of spirits and the thoughts of men, the differences of plants and the powers of roots." You see how many wells there are in the knowledge of things? A well, for example, is the knowledge of plants, and perhaps the nature of each single plant has its own well. And likewise there is a well concerning the knowledge of animals, and perhaps each single species of animals has its own well. And again there is a well concerning the reckoning of times and their vicissitude and change. And since these individual things have a high and deep knowledge, they are rightly called wells figuratively. And as long as the mystery of Christ was hidden from the ages and generations, the knowledge of these things was rightly called wells; but when, as Paul says, God revealed it to believers through his Spirit, all these become fountains and rivers, so that the knowledge of them is no longer held so in secret, but is brought forth to many and waters the believers and satisfies them. And therefore, I believe, the Savior was saying to his disciples that whoever believes in him and drinks the water of his teaching — there will be in him no longer a well nor a fountain, but rivers of living water. For just as this one well, which is the Word of God, becomes innumerable wells and fountains and rivers, so also the soul of man, which is according to the image of God, can have within itself and produce from itself both wells and fountains and rivers. But in truth the wells which are in our soul need one who digs; for they must be cleansed, and everything that is earthly must be removed from them, so that those veins of rational senses which God implanted in it may produce pure and sincere streams. For as long as earth covers the veins of the waters and blocks the eye of the stream, the wave of pure liquid cannot flow forth. Finally, therefore it is written that the servants of Abraham were digging wells, and the Philistines were filling them and covering them with earth. But Isaac too, who had received the inheritance of his father, again dug wells and removed the earth of the Philistines, which they had thrown upon the waters through envy. But we have also observed this in Genesis, from which this history seems to be taken, that as long as Abraham was alive, the Philistines did not dare to fill the wells or throw earth on them; but when he departed from this life, then the Philistines prevailed and lay in wait against his wells. But afterward they are restored through Isaac and return to their state. Moreover the servant of Abraham too, when he goes to betroth and bring back a wife for Isaac, found Rebecca at the wells — she who is interpreted as "patience": she is made the wife of Isaac nowhere else but at the wells. Similarly Jacob too, when he came to Mesopotamia having the command of his father not to take a wife of foreign race or of alien blood, himself also found Rachel at the wells. And Moses found Zipporah at the wells. If, then, you have understood what and of what sort are the wives of the saints, you too, if you wish to take patience to yourself in marriage, or wisdom, or whatever those virtues of the soul are, and to say what was said of wisdom: "Her I sought to bring to myself as a wife" — be frequent, be assiduous around those wells, and there you will find a spouse of this kind. For at the living waters, that is, at the streams of the living word, it is certain that all the virtues of the soul dwell. There are therefore many wells, which we have said to be within the soul. And there are very many others, which are understood in each single word and sense of the Scriptures. Yet more eminent than the rest and outstanding is this well, of which in the present passage Scripture says that it was dug not by any common men whatsoever, but by princes, and by those still more sublime than these, whom it called kings; on account of which also a hymn is sung to God at this same well. And therefore it is written: "Go," it says, "to the well. This is the well of which the Lord said to Moses: Gather the people, and I will give them water from the well, says the Lord." Moses is commanded to gather the people, that it may come together to the well and drink water; and we have often shown that Moses ought to be taken as the Law. It is therefore the Law of God which calls you together, that you may come to the well. What well, except that one of which we spoke above — Jesus Christ the Son of God, subsisting indeed in his own substance, yet named with the Father and the Holy Spirit in the one fountain of the Godhead? To this well, then, that is, to faith in Christ, the Law calls us together. For he himself says: "Moses wrote of me." For what does it call us together? That we may drink the waters and sing to it a song, that is, that we may believe with the heart unto righteousness and confess with the mouth unto salvation.
'''
