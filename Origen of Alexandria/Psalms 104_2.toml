[[commentary]]
quote='''
And therefore of him it is rightly said: "who has his hands perfected, to be clothed with the holy things". For this is he who is truly "clothed with the holy things", not those which were "in type", but those very things which are truly "holy". But if you wish to hear of his more exalted garments, receive the prophetic words: "clothed" it says "with light as with a garment, the deep as a garment is his clothing". This is the habit of my great high priest, by which it is signified that he is clothed with the profound light of knowledge and wisdom, which are truly "holy" garments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily12.html'
source_title="HOMILIES ON LEVITICUS 12"
