[[commentary]]
quote='''
Furthermore, since something was added about the image of Caesar, we must also touch briefly upon this. Some suppose that it was said by the Savior simply: "render to Caesar what is Caesar's", that is: pay the tribute which you owe. For who among us objects to paying tribute to Caesar? Therefore the passage holds something mystical and hidden. There are two images in man: one, which he received from God when he was made in the beginning, as it is written in Genesis: "according to the image and likeness of God"; the other of the earthy, which afterward, when he had been cast out of paradise because of disobedience and sin, he took on, persuaded by the enticements of "the prince of this world". For just as a coin or denarius bears the image of the emperors of the world, so he who does the works of "the ruler of these darknesses" bears the image of him whose works he has: which image Jesus here commanded to be rendered back and cast off from our face, and that image to be taken up according to which from the beginning we were fashioned to the likeness of God. And thus it comes about that we render "what is Caesar's to Caesar, and what is God's to God". "Show me", he says, "the coin", for which in Matthew is written "denarius". And when he had received it, he said: "whose inscription does it have?" They answering said: "Caesar's". To them again he said: "render what is Caesar's to Caesar, and what is God's to God". The logical sequence of these things Paul too has expressed, saying: "as we have borne the image of the earthy, let us also bear the image of the heavenly". So then, what he says: "render what is Caesar's to Caesar", this he means: lay aside the person of the earthy, cast off the earthly image, so that, putting upon yourselves the person of the heavenly, you may be able to render "what is God's to God". God demands us back. What does he demand back? Read Moses: "and now what does the Lord your God demand back from you?" and the rest that follows. God therefore requires of us and beseeches us, not because he has need of anything that we might bestow upon him, but so that, after we have given it to him, he may bestow that very thing upon us for salvation. And that this may become clearer, let me set down the parable of the minas. He who had received one mina and had made ten and offered it to the Lord, by whom the mina had been entrusted to him, received also another which he had not had before. For the mina of him who had not multiplied what he had received the Lord orders to be taken away and given to the one who has others; "take away", he says, "the mina and give it to him who has ten minas". And in this manner, the things we have given to God he will restore to us, those very things, together with the things we had not had before. God exacts and requires of us, so that he may have occasion for giving, so that he himself may bestow, who paid it out. For by his own grace the mina was doubled, and to each of the worthy more was given than they hoped for. Wherefore, rising up, let us pray to God that we may be worthy to offer him gifts which he may restore to us, and that in exchange for earthly things he may lavish heavenly ones upon us, in Christ Jesus: to whom is glory and dominion unto the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily39.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 39"
