[[commentary]]
quote='''
The body in the tomb, the soul in hell, the spirit was given up to the Father. … If it is true that He entrusted the spirit to the Father, then He committed it as a deposit. For it is one thing to give a thing as a gift, another to give it away, and another to give it as a deposit. A depositor places a thing in safekeeping, intending to receive his deposit back. Why then did the Savior entrust His spirit to the Father as a deposit? … just as His body could not descend into hell … so also His spirit could not descend into hell. Therefore He entrusted the spirit to the Father as a deposit, until He should rise from the dead. As He entrusted this deposit, so He took it back again. When did this happen? Not at the very moment of the resurrection, but immediately after the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FDialogue%2520with%2520Heraclides.html'
source_title="DIALOGUE WITH HERACLIDES"
