[[commentary]]
quote='''
To be fully alive belongs to God, more fully than to any creature. The apostle considered the superiority of the life of God to be beyond comparison. It is with this in mind that Scripture says "Surely as I live, all the earth will be filled with the glory of the Lord." This is God, "Who alone has immortality," because none of the living beings with God has the life whose aliveness is absolutely unchangeable and immutable. 
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520John%2FBook%25202.html'
source_title="Commentary on John 2.123"


[[commentary]]
quote='''
It must therefore be understood that this charity which is God, when it has been in anyone, loves nothing earthly, nothing material, nothing corruptible. For it is contrary to its nature to love anything corruptible, since it is itself the fount of incorruption. For it alone is that which has immortality: seeing that God is charity, who alone has immortality, dwelling in light inaccessible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs%2FPrologue.html'
source_title="COMMENTARY ON THE SONG OF SONGS, PROLOGUE"
