[[commentary]]
quote='''
"And the earth brought forth the grass of hay sowing seed according to its kind and according to its likeness, and the fruit-bearing tree making fruit, whose seed is in itself making fruit according to its kind upon the earth. And God saw that it is good. And there was evening, and there was morning, the third day." He commands the earth not only to bring forth "the grass of hay," but also to bring forth "seed," so that it may always be able to bear fruit. And he commands not only "the fruit-bearing tree," but also that which "makes fruit whose seed is in itself, according to its kind," that is, so that it may always be able to bear fruit from these seeds which it has in itself. And we too, then, ought thus both to bear fruit as fruit and to have seeds in our very selves, that is, to contain in our heart the seeds of all good works and of all virtues, so that, having these fixed in our minds, we may from them now carry out according to justice all the acts which come upon us. For these are the fruits of that seed, our acts, which are brought forth "from the good treasure of our heart." But if we indeed hear "the word" and from the hearing "immediately" our earth produces grass, and this grass, before it comes to maturity or to fruit, "withers," our earth will be called "rocky." But if the things that are said rest on deeper roots in our heart, so that they both "bear fruit" of works and have in themselves the seeds of future ones, then truly the earth of each one of us bears fruit according to its power, one "a hundredfold," another "sixtyfold," another "thirtyfold." But we have thought it necessary to give this warning also, that our fruit nowhere have "tares," that is, nowhere have "darnel," so that it may not be "along the way," but may be sown in the very way, in that which says: "I am the way," so that "the birds of heaven" may not eat our fruits nor our vineyard. Yet if any of us has deserved to be a vineyard, let him see that he does not bear "thorns" instead of grapes; and on account of this it will then "neither be pruned, nor dug, nor committed to the clouds that they should rain rain upon it," but on the contrary it will be left "deserted," so that "thorns" may grow up upon it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.4"
