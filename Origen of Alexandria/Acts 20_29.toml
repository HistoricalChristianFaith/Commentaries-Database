[[commentary]]
quote='''
But if you touch also "what is caught by a wild beast", you will be unclean. What is the wild beast? Is it a lion or a wolf, which snatches away men or beasts? That, I believe, is the wild beast of which the Apostle Peter says: "your adversary the devil, like a roaring lion, goes about seeking whom he may devour. Resist him, strong in faith". And again, of whom does the Apostle Paul say: "for after my departure there will enter in ravening wolves, not sparing the flock". If, therefore, you see one "caught" by these "wild beasts", do not follow him, do not touch him, lest you too be made unclean. There are, besides, also other unclean animals, whose carcass it forbids to be touched. The unclean animals are men who are outside Christ, in whom there is neither reason nor any religion. If, therefore, you see the "carcasses" of all these, that is, their sins, the lawgiver tells you not to touch them, not to defile yourself with them, not to handle them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily03.html'
source_title="HOMILIES ON LEVITICUS 3"
