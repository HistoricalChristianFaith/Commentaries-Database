[[commentary]]
quote='''
And he wept over Jerusalem, "saying: if you too had known, even in this your day, the things that are for your peace; but now they are hidden from your eyes", and the rest, up to the place where it says: "because you have not known the time of your visitation". Let one of the hearers say: What is said here is plain, and has been fulfilled in deed concerning Jerusalem: for the Roman army surrounded it and laid it waste even to utter destruction, and the time will come when a stone shall not be left upon a stone upon it. I do not deny that that Jerusalem too was destroyed because of the crimes of its inhabitants; but I ask whether perhaps this weeping pertains also to this our Jerusalem. For we are the Jerusalem that is wept over, we who seem to ourselves to have the greater vision. For if, after the mysteries of truth, after the word of the Gospel, after the teaching of the Church and after the vision of the sacraments of God, someone among us should sin, he will be lamented and wept over. For no Gentile is wept over, but only he who was of Jerusalem and has ceased to be so. And this our Jerusalem is wept over, because after sins "enemies surround" it — namely the hostile powers, the wicked spirits — and cast "a rampart" around about it and besiege it "and leave not a stone upon a stone", especially if, after much continence, after some years of chastity, someone should be overcome and, enticed by the blandishments of the flesh, should lose the endurance of purity. If you have committed fornication, "they will not leave a stone upon a stone in you". For he says in another place: "I will not remember his former righteous deeds; in his sin, in which he shall be caught, in that very sin will I judge him". This, then, is the Jerusalem that is wept over.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily38.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 38"
