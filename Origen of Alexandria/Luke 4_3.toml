[[commentary]]
quote='''
When a father is asked by his son for bread, he does not give him a stone for bread, but the devil like a crafty and deceitful foe gives stones for bread.

I suppose also that even now at this very time the devil shows a stone to men that he may tempt them to speak, saying to them, Command this stone to be made bread. If thou seest the heretics devouring their lying doctrines as if they were bread, know that their teaching is a stone which the devil shows them.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And when the days were completed, he hungered. And the devil said to him: If you are the Son of God, tell this stone to become bread". "Tell", he says, "this stone". Which stone? Surely the one the devil was pointing out, the one he wants to be made bread. What sort of temptation is this, that when a son asks his father for bread and the father does not give him a stone, this adversary, crafty and deceitful, should give a stone in place of bread? Is this the whole of what the devil wanted — that a stone should become bread, and that men should feed not on bread but on a stone, which the devil had pointed out in place of bread? I think that even to this day the devil shows a stone and urges each person to say: "tell this stone to become bread". By every temptation with which men were to be tempted, the Lord was tempted first, according to his assumption of the flesh. And he is tempted for this reason, that we too, when he conquers, may conquer. What I say perhaps becomes obscure, unless it is made clearer by an example. If you see heretics eating the lie of their own doctrines in place of bread, know that their teaching is a stone which the devil points out. But do not suppose that he has only one stone; he has many stones, from which he is introduced speaking in Matthew: "tell these stones to become loaves". Marcion spoke, and the devil's stone became bread for him. Valentinus spoke, and another stone was turned into bread for him. Basilides too had bread of this kind, and so did the rest of the heretics. Hence we must anxiously take care, lest perhaps, while eating the devil's stone, we suppose that we are feeding on the bread of God. Otherwise, what temptation was there in a stone becoming bread and being eaten by the Savior? For let us imagine that, at the devil's suggestion, the Lord had turned a stone into bread, and had eaten what he himself had made by his own power, and had satisfied his hunger: what sort of temptation is this, what victory over the devil, if these things were written down in a plain sense? But these things, as we have said, when their reason is discerned, both show that there would have been a temptation, if they had been done, and that the victory came about because they were spurned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Luke%2FHomily29.html'
source_title="HOMILIES ON THE GOSPEL OF LUKE 29"
