[[commentary]]
quote='''
Greet Apelles approved in Christ. I think that this Apelles had passed through many tribulations patiently and bravely endured, and that for this reason he is pronounced approved by the Apostle, according to those things which he himself said elsewhere, that tribulation works patience, and patience approval, and approval hope. It should indeed be considered whether perhaps this is the very man who in the Acts of the Apostles is named Apollo, an Alexandrian, learned in the Scriptures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"

[[commentary]]
quote='''
Greet those who are of the household of Aristobulus. Since nothing is idly either added or diminished in the letters of the Apostle, these who are either of the house or of the family of Aristobulus he names not without purpose neither beloved, nor approved, nor helpers in Christ; but perhaps because they had nothing of the sort in their merits, therefore he honored them with the title of greeting alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FCommentary%2520on%2520Romans%2FFrom%2520Latin%2FBook10.html'
source_title="COMMENTARY ON THE EPISTLE TO THE ROMANS"
