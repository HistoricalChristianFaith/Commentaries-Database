[[commentary]]
quote='''
But just as we read written that "the eye is not satisfied with seeing, nor the ear with hearing", so we too cannot be satisfied in beholding and considering the things that are written, from how many sides they build us up, in how many ways they instruct us. For indeed, when I perceive that Moses, a prophet full of God, to whom God spoke "face to face", received counsel from Jethro, a priest of Midian, I fall into an amazement of mind out of exceeding wonder. For the Scripture says: "and Moses heard the voice of his father-in-law, and did whatever he said to him". He did not say that 'God speaks to me, and what I ought to do is conveyed to me by heavenly discourse', and 'how shall I accept counsel from a man, and from a gentile man, a stranger to the people of God?', but he hears his voice and does all that he says, and he listens not to who says it, but to what he says. Wherefore we too, if perhaps we sometimes find something said wisely by the gentiles, ought not straightway to spurn both the sayings along with the name of the author; nor, because we hold the law given by God, is it fitting that we swell with pride and spurn the words of the prudent, but as the Apostle says: "proving all things, holding fast that which is good". But who today among those who preside over the peoples—I do not say, if some things have already been revealed to him by God, but if he has some merit in the knowledge of the law—deigns to accept the counsel even of a lesser priest, not to say of a layman, still less of a gentile? But Moses, who was "a man meek above all men", accepted the counsel of a lesser man, both to give the princes of the peoples a form of humility and to designate the image of a future sacrament. For he knew that it would sometime come to pass that the gentiles would bring forward good counsel to Moses, that they would bring a good and spiritual understanding to the law of God; and he knew that the law would hear them and would do all things as they say. "For the law cannot do", as the Jews say, because "the law is weakened in the flesh", that is, in the letter, and can do nothing according to the letter: "for the law brought nothing to perfection". But according to this counsel, which we bring to the law, all things can be done spiritually, and sacrifices too can be offered spiritually, which now cannot be done carnally; the law of leprosy too can be kept spiritually, which cannot be kept according to the letter. So, then, in the way that we understand, in the way that we perceive and give counsel, the law does all things; but according to the letter it does not do all things, but only very few.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Exodus%2FHomily11.html'
source_title="HOMILIES ON EXODUS 11"
