[[commentary]]
quote='''
Indeed, the things too which are described in what follows about the third day agree with this same understanding. For it says: "And God said: Let the water which is below heaven be gathered into one gathering, and let the dry land appear. And it was so." Let us, then, labor to gather "the water which is below heaven," and to cast it away from us, so that, when this has been done, "the dry land" may appear, which are our works done in the flesh, "so that, namely, men seeing our good works may glorify our Father who is in heaven." For if we do not separate from ourselves those waters which are below heaven, that is, the sins and vices of our body, our dry land will not be able to appear nor to have confidence to come forth into the light. "For everyone who does evil hates the light and does not come to the light, so that his works may be made manifest, and it may be seen whether they are done in God." This confidence surely will not otherwise be given, unless we cast away as it were the waters from ourselves and set apart the vices of the body, which are the matter of sins. When this is done, our dry land will no longer remain "dry," as is shown from what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.2"
