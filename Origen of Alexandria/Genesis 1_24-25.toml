[[commentary]]
quote='''
"And God said: Let the earth bring forth the living soul according to its kind, four-footed things and creeping things and beasts of the earth according to their kind. And it was made so. And God made the beasts of the earth according to their kind, and all the creeping things of the earth according to their kind. And God saw that they are good." According to the letter indeed there is no question. For it is plainly said that either the animals or the four-footed things or the beasts or the serpents upon the earth were created by God. But to fit these to the things which we explained above, according to the spiritual understanding, is not an idle matter. There indeed it was said: "Let the waters bring forth creeping things of living souls and flying things flying over the earth according to the firmament of heaven," but here it says: "Let the earth bring forth the living soul according to its kind, four-footed things and creeping things and beasts of the earth according to their kind." And those things indeed which were brought forth from the waters, we said, ought to be understood as the movements and thoughts of our mind, which are brought forth from the depth of the heart. But now this which is said: "Let the earth bring forth the living soul according to its kind, of the four-footed things and creeping things and beasts upon the earth according to their kind," I think indicates the movements of our exterior man, that is, of the carnal and earthly man. Indeed he indicated nothing flying among those things which he speaks of concerning the flesh, but only "four-footed things" and "creeping things" and "beasts of the earth." According indeed to that which was said by the Apostle, that "there dwells no good in my flesh" and that "the wisdom of the flesh is an enemy to God," these surely are the things which the earth, that is, our flesh, brings forth, concerning which the Apostle again instructs, saying: "Mortify your members which are upon the earth, fornication, uncleanness, unchastity, avarice, idolatry," and the rest. When, therefore, all these things which are seen came to be by the command of God through his Word, and this immense visible world was being prepared, and at the same time it was being shown through the figure of allegory what the things were that could adorn the lesser world, that is, man, then man himself is now created according to the things which are declared in what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Genesis%2FHomily01.html'
source_title="HOMILIES ON GENESIS 1.11"
