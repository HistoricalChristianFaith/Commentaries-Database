[[commentary]]
quote='''
But behold also how holy and how wonderful is the very order of the things. Not first the "breastpiece" and afterward the "ephod", because wisdom is not before works, but works ought first to be had and afterward wisdom is to be sought. Then, next, not "manifestation" before the "rational", because we ought not to teach others before we ourselves are instructed and rational. But above these is added "truth", because "truth" is the highest wisdom. Finally the prophet too keeps this same order, when he says: "Sow for yourselves unto righteousness, and reap the fruit of life, kindle for yourselves the light of knowledge." You see how he does not say first: "Kindle for yourselves the light of knowledge", but first: "Sow for yourselves unto righteousness", and it does not suffice to sow, but "reap," he says, "the fruit of life", so that after these things you may be able to fulfill what follows: "Kindle for yourselves the light of knowledge."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Origen%2520of%2520Alexandria%2FHomilies%2520on%2520Leviticus%2FHomily06.html'
source_title="HOMILIES ON LEVITICUS 6"
