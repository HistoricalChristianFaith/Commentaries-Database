[[commentary]]
quote='''
After what has gone before, our Lord fitly questions the lawyer; Which of these three thinkest thou was neighbour to him who fell among thieves? But he said, He that showed mercy on him. For neither Priest nor Levite became neighbour to the sufferer, but he only who had compassion on him. For vain is the dignity of the Priesthood, and the knowledge of the Law, unless they are confirmed by good works. Hence it follows, And Jesus saith unto him, Go and do thou likewise.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Justly therefore He asked, which of these three he thinks was the sufferer's neighbour. And he said, "He that wrought mercy with him." And to this Christ added, "Go you also, and act in like manner." You have seen, O lawyer, and it has been proved by the parable, that it is of no avail whatsoever to any man, to be set up by empty names, and to pride himself upon unmeaning and ridiculous titles, so long as the excellence of deeds does not accompany them. For the dignity of the priesthood is unavailing to its owners, and equally so is the being called learned in the law, to those who are so reputed, unless they excel also in deeds. For lo! a crown of love is being twined for him who loves his neighbour: and he proves to be a Samaritan. Nor is he rejected on this account: for he who was foremost among the disciples, even the blessed Peter, testified, thus writing, "In truth I perceive that God is not a respecter of persons: but in every nation, whosoever fears Him, and works righteousness, is accepted by Him." For Christ, Who loves our virtues, accepts all who are diligent in good pursuits: by Whom and with Whom, to God the Father be praise and dominion with the Holy Ghost, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
