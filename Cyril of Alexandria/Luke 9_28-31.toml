[[commentary]]
quote='''
How therefore did He make those who had received the promise spectators of a thing so wonderful? He goes up into the mountain taking with Him three chosen disciples: and is transformed to so surpassing and godlike a brightness, that His garments even glittered with rays of fire, and seemed to flash like lightning. And besides, Moses and Elijah stood at Jesus' side, and spake with one another of His departure, which He was about, it says, to accomplish at Jerusalem: by which is meant the mystery of the dispensation in the flesh; and of His precious suffering upon the cross. For it is also true that the law of Moses, and the word of the holy prophets, foreshewed the mystery of Christ: the one by types and shadows, painting it, so to speak, as in a picture; while the rest in manifold ways declared beforehand, both that in due time He would appear in our likeness, and for the salvation and life of us all, consent to suffer death upon the tree. The standing, therefore, of Moses and Elijah before Him, and their talking with one another, was a sort of representation, excellently displaying our Lord Jesus Christ, as having the law and the prophets for His body guard, as being the Lord of the law and the prophets, and as foreshown in them by those things which in mutual agreement they before proclaimed. For the words of the prophets are not at variance with the teachings of the law. And this I imagine was what Moses the most priestly and Elijah the most distinguished of the prophets were talking of with one another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
