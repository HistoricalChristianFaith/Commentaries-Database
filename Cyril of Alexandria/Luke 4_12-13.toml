[[commentary]]
quote='''
For He answers, "It is said, thou shalt not tempt the Lord thy God." For God grants not His aid to those who tempt Him, but to those who believe in Him: nor ought we, because He deigns us mercy, therefore to make a vain display. Moreover, Christ never gave a sign to those who tempted Him: "for a wicked generation, He saith, seeketh after a sign, and a sign shall not be given it." And let Satan now when tempting hear the same. Wo therefore won the victory in Christ: and he who conquered in Adam went away ashamed, that we might have him under our feet; for Christ as Conqueror handed on to us also the power to conquer, saying, "Behold I have granted you to tread upon serpents, and scorpions, and all the power of the enemy."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
