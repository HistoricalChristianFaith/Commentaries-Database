[[commentary]]
quote='''
God forbid that Paul should ever say that Christ's body was made of sinful flesh! Rather, it was in the likeness of sinful flesh, for although it was similar to our bodies it can scarcely be compared with them in the sense that it could not be ill with carnal uncleanness. Even from the womb Christ's body was a holy temple, and no one is afraid to state that in so far as it was flesh, when it attained the age of reason it behaved in the way flesh normally does. Nevertheless, because the Word which sanctifies all things dwelt in his body, the potential for sin was condemned so that the fruit of this blessing might come across into us as well. For we have been transformed into his likeness, not only in spirit but in body also. When Christ dwells in us by the Holy Spirit and the sacramental blessing, then the law of sin is really condemned in us. So it is truly said that what was impossible for the law, which had been weakened by the flesh, became possible through Christ, who condemned and destroyed sin in the flesh so that the righteousness of the law might be fulfilled in us.
'''
source_url=''
source_title="EXPLANATION OF THE LETTER TO THE ROMANS"

[[commentary]]
quote='''
Wouldst thou learn also another reason of the matter? Remember what the very wise Paul has written of Him. "For as to the powerlessness of the law, wherein it was weak through the flesh, God having sent His Son in the likeness of sinful flesh, and because of sin, has condemned  the sin in His flesh, that the just requirement of the law might be fulfilled in us, who walk not according to the flesh, but according to the Spirit ." What then is the meaning of his saying that the Son was sent "in the likeness of sinful flesh?" It is this. The law of sin lies hidden in our fleshly members, together with the shameful stirring of the natural lusts: but when the Word of God became flesh, that is man, and assumed our likeness, His flesh was holy and perfectly pure; so that He was indeed in the likeness of our flesh, but not according to its standard. For He was entirely free from the stains and emotions natural to our bodies , and from that inclination which leads us to what is not lawful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
