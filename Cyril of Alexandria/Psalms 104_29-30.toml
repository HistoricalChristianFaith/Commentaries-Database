[[commentary]]
quote='''
And the Psalmist bears witness, thus speaking concerning them in words addressed to God the Saviour of us all. "When Thou turnest away Thy face they are troubled, and return to their dust. Thou sendest Thy Spirit, and they are created, and Thou renewest the face of the ground." For it was by reason of Adam's transgression of the commandment that we, having our faces turned away from God, returned to our dust: for the sentence of God upon human nature was, "Dust thou art, and unto dust thou shalt return:" but at the time of the consummation of this world, the face of the earth shall be renewed: for God the Father by the Son in the Spirit will give life to all those who are laid within it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
[[commentary]]
quote='''
And the blessed David also somewhere in the Psalms says of all those upon earth, "You take away their spirit, and they die, and return to their dust: You send Your Spirit, and they are created, and You renew the face of the earth." Do you hear that the working and life-giving grace of the Holy Spirit will renew the face of the earth? And by its face is meant its beauty; and the beauty of human nature is justly understood to be incorruption. "For it is sown, it says, in corruption, it is raised in incorruption; it is sown in weakness, it is raised in power; it is sown in dishonour, it is raised in glory."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
