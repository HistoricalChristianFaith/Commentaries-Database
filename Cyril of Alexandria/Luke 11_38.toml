[[commentary]]
quote='''
For Christ, knowing the wickedness of those Pharisees, Himself purposely condescends to be occupied in admonishing them, after the manner of the best physicians, who bring remedies of their own making to those who are dangerously ill. Hence it follows, And he went in and sat down to meat. But what gave occasion for the words of Christ was, that the ignorant Pharisees were offended, that while men thought Him to be a great man and a prophet, He conformed not to their unreasonable customs. Therefore it is added, But the Pharisee began to think and say within himself, Why had he not first washed before dinner?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The Pharisee therefore for some purpose of his own invites Him to an entertainment: and the Saviour of all submits, as I said, to this, for the economy's sake. But He made the matter an opportunity of giving instruction, not consuming the time of their meeting in the enjoyment of food and delicacies, but in the task of making those more virtuous who were assembled there. And the dull Pharisee himself supplied an occasion for His discourse, for "he wondered," it says, "that He had not washed before dinner." Did he then wonder at Him, as having done something of which he approved, as being especially worthy of the saints? This was not his view: how could it be? On the contrary he was offended, because having the reputation among them of a righteous man and a prophet, He did not conform Himself to their unreasonable customs. For they washed before meat, as though they so freed themselves from all pollution. But this was very absurd. For the washing with water is highly useful for those who are unclean in body; but how can it free men from the defilement of the mind and heart?

Our argument however is this: O foolish Pharisee, you boast much of your knowledge of the sacred Scriptures: you are ever quoting the law of Moses. Tell us therefore where Moses gave you this precept? What commandment can you mention, ordained by God, requiring men to wash before meat? The waters of sprinkling were indeed given by the command of Moses for the cleansing of corporeal uncleanness, as being a type of the baptism which really is holy and cleansing, even that in Christ. Those also who were called to the priesthood were bathed in water: for so did the divine Moses bathe Aaron, and the Levites with him, the law thereby declaring by means of the baptism enacted in type and shadow, that even its priesthood had not that which suffices for sanctification, but, on the contrary, needs divine and holy baptism for the true cleansing: and further, beautifully showing us that the Saviour of all is sufficient to sanctify and cleanse from all defilement, by means of holy and precious baptism, ourselves, who are the generation consecrated to and elect of God. Plainly however, he nowhere commands it as a duty to wash before eating. Why therefore do you wonder, or for what reason are you offended, O Pharisee? He Who Himself spoke it in old time has not violated the precept of Moses: and, as I said, the law, which you makea profession of honouring, has nowhere given you any such commandment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
