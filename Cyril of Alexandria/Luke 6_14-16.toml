[[commentary]]
quote='''
But mark the extreme moderation of the Evangelist: for he does not simply say that the holy Apostles were appointed, but rather, by introducing the record of these chief ones each by name, takes care that no one should venture to enrol himself in the company of those that were chosen. For as Paul saith, "No man taketh this honour upon himself, but he that is called by God." And though the holy Apostles were called by name to this great and splendid dignity, yet from time to time some men have gone to such a pitch of madness and audacity, as even to name themselves Apostles of Christ, and to usurp an honour not granted unto them. Of these the divine disciples have made mention; for they say, "Such are false apostles, deceitful workers, transforming themselves into angels of righteousness. And no wonder: for Satan even transforms himself into an angel of light. It is no great thing, therefore, if his ministers also transform themselves into angels of righteousness." But we neither acknowledge nor will receive any one, except those only so named in the Evangelic writings, and him who was appointed after them, the most wise Paul: to whom also the Saviour Himself bore witness, saying, that he is a vessel of election for Me, to carry My name before all the heathen."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"

[[commentary]]
quote='''
If further you wish to learn the interpretation of the Apostles' names, know that Peter is explained as meaning "loosing," or "knowing:" Andrew as "comely strength," or "answering:" James as "one who takes labour by the heel:" John, "the grace of the Lord:" Matthew, "given:" Philip, "the opening of the hands," or "the mouth of a lamp:" Bartholomew, "the son suspending water:" Thomas, an "abyss," or "a twin:" James, the son of Alphaeus, "the supplanting "of the passage of life:" Judas, "thanksgiving:" and Simon, "obedience."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
