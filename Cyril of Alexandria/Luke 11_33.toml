[[commentary]]
quote='''
The Jews said, that our Lord performed His miracles not for faith, i. e. that they might believe on Him, but to gain the applause of the spectators, i. e. that He might have more followers. He refutes therefore this calumny, saying, No man, when he hath lighted a candle, putteth it in a secret place, neither under a bushel, but on a candlestick.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"No man, having lighted a lamp, puts it into a cellar, nor under the bushel, but upon the lampstand, that they who enter in may see the light." And what was the object of such words as these? He combats the Jews by an objection drawn from their own folly and ignorance: for they said that He wrought miracles, not that He might be more fully believed in, but that He might have numbers of followers, and catch the applause of those who saw his wondrous acts. And this calumny He refutes by taking as an example the use of a lamp. For a lamp, He says, is always elevated, and put upon a stand, to be of use to those who see. And let us consider the inference which follows from this. Before then the coining of our Saviour, the father of darkness, even Satan, had made the world dark, and blackened all things with an intellectual gloom; but in this state the Father gave us the Son, to be as it were a lamp to the world, to irradiate us with divine light, and rescue us from Satanic darkness. But, O Jew, if you blame the lamp, because it is not hidden, but on the contrary, being set on high on a stand, gives its light to those who see, then blame Christ for not wishing to be concealed, but on the contrary to be seen of all, illuminating those in darkness, and shedding on them the light of the true knowledge of God. He did not therefore fulfil His miracles so much in order to be wondered at, nor seek by them to become famous, as that we might rather believe, that whereas He is God by nature, yet He became man for our sakes, but without ceasing to be what He was. And upon the holy church as a lamp-stand, shining by the doctrine He proclaims, He gives light to the minds of all by filling them with divine knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
