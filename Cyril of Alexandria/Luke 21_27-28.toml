[[commentary]]
quote='''
"Then, He says, they shall see the Son of man coming in a cloud with power and great glory." Christ therefore will come not secretly nor obscurely, but as God and Lord, in glory such as becomes Deity; and will transform all things for the better. For He will renew creation, and refashion the nature of man to that which it was at the beginning. "For when these things, He says, come to pass, lift up your heads, and look upwards: for your redemption is near." For the dead shall rise, and this earthly and infirm body shall put off corruption, and shall clothe itself with incorruption by Christ's gift, Who grants to those that believe in Him to be conformed to the likeness of His glorious body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
