[[commentary]]
quote='''
Lo! those who know the divine laws, and with haughty countenance say, "We are Moses' disciples," beseech that He may be condemned to death, Who is guilty of no base action, yes, rather Who is the Head and Teacher of all piety, and Who renders those who believe in Him skilful in every virtue: and when he whose duty it was to judge Him acquitted Him, to make their doom of torment more severe, they earnestly beg that He Who was guilty of no base deed might suffer as from them the penalty of death. " For the whole multitude cried out, saying, Away with this Man: but loose to us Barabbas." Plainly therefore "they denied the Holy and the Just, and, as the blessed Peter says, asked for a murderer to be granted to them," that they might be sharers of his lot, and partners in his guilt. And this it was their lot to suffer. For they were given up to destruction and slaughter, and perished together with their whole race.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
