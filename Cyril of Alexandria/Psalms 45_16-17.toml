[[commentary]]
quote='''
And of this appointment of the holy Apostles, the blessed David also makes mention, addressing himself, as it were, to Christ: "Thou shalt make them rulers over all the earth; they shall make mention of Thy name in every successive generation." For verily, while they were in the body, they made mention of the glory of Christ, telling His mystery both in cities and villages: and now that they have been called to the mansions that are above, none the less do they still even thus converse with us about Him, by the most wise history which they have written concerning Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
