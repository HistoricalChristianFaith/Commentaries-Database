[[commentary]]
quote='''
Let no one therefore cavil at the resurrection: and though you hear the sacred Scripture say of the human body, that "it is sown an animal body, it is raised a spiritual body," do not deny the return even of human bodies to incorruption. For as the animal is that which follows after, and is subject to animal, that is, to fleshly lusts, so also the spiritual is that which submits itself to the will of the Holy Spirit. For after the resurrection from the dead, there will be no longer the opportunity for carnal affection, but, the goad of sin will be entirely powerless. That very (body) therefore which has been brought down to the earth, shall be clothed with incorruption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
