[[commentary]]
quote='''
For He said Himself to the holy apostles, "Verily I say unto you, except your righteousness be over and above, more than of the Scribes and Pharisees, ye cannot enter into the kingdom of heaven." This then it is necessary to discuss, what, namely, is meant by the "over and above" in the righteousness in accordance with the saving message of the Gospel.

The law spoken by Moses to them of old time enacted like for like: and while it forbade the doing a wrong, it by no means commanded those who had already been injured to bear patiently, as the Gospel law requires. For it says, "Thou shalt not kill: thou shalt not steal: thou shalt not forswear thyself." But to this is added, "Eye for eye, hand for hand, foot for foot, wound for wound, bruise for bruise." Such an enactment required a man not to injure others; and supposing him to have sustained an injury, that his anger at the wrong doer must not go beyond an equal retribution. But the general bearing of the legal mode of life was by no means pleasing to God; it was even given to those of old time as a schoolmaster, accustoming them by little and little to a fitting righteousness, and leading them on gently to the possession of the perfect good. For it is written, "To do what is just is the beginning of the good way:" but finally, all perfection is in Christ, and His precepts. "For to him that striketh thee. He saith, on the check, offer also the other." In this there is pointed out to us the pathway to the highest degree of patience.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
