[[commentary]]
quote='''
And others also there are who wrong the servants of God, and whom we may without sin attack in prayer. And who again are these? They are the evil and opposing powers, and Satan the adversary of us all, who fiercely resists those who would live well; who casts into the pitfalls of wickedness whoever slumbers; who plants in us the seeds of every sin. For with his satellites he presses upon us furiously. And on this account the Psalmist called out against them, saying, "How long set you yourselves against man? and you slay all of you, as it were a leaning wall, and a bowing fence." For just as a wall that already leans on one side, and a fence that bows over as having been loosened, readily fall when any one pushes against them, so also the mind of man, by reason of its own great inclination of itself to the love of worldly pleasures, readily falls into them whenever any one draws and entices it thereto. And this is Satan's business: and therefore we say in our prayers to Him Who is able to save, and to drive away from us that wicked being, "Avenge me of my adversary."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
