[[commentary]]
quote='''
For that there have been joined unto the faith in concord and unity of mind and will, the savage in company with the gentle; the impure and sin-stained with the saints; those, that is, of the herds of the Gentiles with those of Israel who believed; the prophet Isaiah shews, thus speaking in the Spirit: "And the wolf shall graze with the lamb; and the leopard rest with the kid; and the bear and the cow shall graze together; and the ox and the lion eat provender together, and their young ones shall be with one another." Consider, my beloved, and understand that those who were sanctified by faith did not conform to the habits of the heathen, but on the contrary those who were called of the heathen conformed to them. For such beasts as the wolf and lion, the bear and leopard, are eaters of flesh; but those animals which are of a gentle nature, kids and lambs, and steers, feed upon grass. But those beasts of prey, he says, shall graze with these gentle ones, and eat their food. It is not therefore the gentle ones who have conformed to the habits of the savage: but, on the contrary, as I said, the savage who have imitated them. For they have abandoned their cruel disposition for the gentleness that becometh saints, and been changed by Christ, so that the wolves have become lambs; for He it is Who hath made them gentle, and united, as I said, the two nations unto a mind full of the love of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
