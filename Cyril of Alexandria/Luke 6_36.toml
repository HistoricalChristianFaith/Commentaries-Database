[[commentary]]
quote='''
Great then is the praise of mercy. For this virtue makes us like unto God, and imprints upon our souls certain signs as it were of a heavenly nature. Hence it follows, Be ye then merciful, as your heavenly Father also is merciful.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Be ye therefore merciful.

Great is the glory of compassion, and so verily it is written, that "man is a great thing, and the merciful man an honourable thing." For virtue restores us to the form of God, and imprints on our souls certain characters as it were of the supreme nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
