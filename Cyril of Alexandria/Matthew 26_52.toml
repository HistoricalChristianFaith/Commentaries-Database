[[commentary]]
quote='''
And the blessed disciples, pricked with the goading of divine love, drew their swords to repel the attack. But Christ would not permit this to be done, but rebuked Peter, saying, "Put up your sword into its sheath: for all who have taken swords shall die by swords." And herein He has given us also a pattern of the manner in which we must hold fast by our love to Him, and of the extent to which the burning zeal of our piety may proceed. For He would not have us use swords wherewith to resist our enemies, but rather employing love and prudence, we so must mightily prevail over those who oppose us. And similarly Paul teaches us, saying, "Casting down reasonings and every high thing that exalts itself against the knowledge of God, and bringing captive every thought to obedience to Him." For the war for truth's sake is spiritual, and the panoply that becomes saints is intellectual, and full of love to God. "For we must put on the breastplate of righteousness, and the helmet of salvation; and take the shield of faith, and the sword of the Spirit, which is the word of God." And so then the Saviour moderates the unmeasured heat of the holy apostles: and by preventing the example of such an act, declares that those who are the chief in His religion have no need in any way whatsoever of swords.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
