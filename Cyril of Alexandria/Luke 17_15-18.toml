[[commentary]]
quote='''
The nine then, as being Jews, falling into a thankless forgetfulness, did not return to give glory to God: by which He shows that Israel was hard of heart, and utterly unthankful: but the stranger,----for as being a Samaritan he was of foreign race, having been brought thither from Assyria: for the phrase is not without meaning, "in the middle of Samaria and Galilee:" ----returned with a loud voice to glorify God. It shows therefore that the Samaritans were grateful, but that the Jews, even when benefited, were ungrateful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
