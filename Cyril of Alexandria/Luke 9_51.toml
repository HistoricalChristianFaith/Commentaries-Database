[[commentary]]
quote='''
When the time was near at hand in which it behoved our Lord to accomplish His life-giving Passion, and ascend up to heaven, He determines to go up to Jerusalem, as it is said, And it came to pass, &c.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"
