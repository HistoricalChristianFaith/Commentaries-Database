[[commentary]]
quote='''
After the ordination of the Apostles, the Saviour directed His disciples to the newness of the evangelical life.

In the Gospel according to St. Matthew it is said, Blessed are the poor in spirit, that we should understand the poor in spirit to be one of a modest and somewhat depressed mind. Hence our Saviour says, Learn from me, for I am meek and lowly of heart. But Luke says, Blessed are the poor, without the addition of spirit, calling those poor who despise riches. For it became those who were to preach the doctrines of the saving Gospel to have no covetousness, but their affections set upon higher things.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Blessed are ye poor: for yours is the kingdom of God.

Those are the Saviour's words, when directing His disciples into the newness of the Gospel life after their appointment to the apostolate. But we must see of what poor it is that He speaks such great things: for in the Gospel according to Matthew it is written, "Blessed are the poor in spirit; for theirs is the kingdom of heaven:" wishing us to understand by the poor in spirit the man who entertains lowly thoughts of himself, and whoso mind, so to speak, is closely reefed, and hi3 heart gentle, and ready to yield, and entirely free from the guilt of pride.

Such a one is worthy of admiration, and the friend of God; yea, He even said by one of the holy prophets; "Upon whom will I look but upon the humble and peaceable, and that trembleth at my words?" And the prophet David also said, that "a contrite and humbled heart God will not set at nought." Moreover, the Saviour Himself also says, "Learn of Me, for I am meek and humble in heart." In the lessons, however, now set before us, He says, that the poor shall be blessed, without the addition of its being in spirit. But the Evangelists so speak, not as contradicting one another, but as dividing oftentimes the narrative among them: and at one time they recapitulate the same particulars, and at another that which has been omitted by one, another includes in his narrative, that nothing essential for their benefit may be hidden from those who believe on Christ.—It seems likely, therefore, that He here means by the poor, whom He pronounces blessed, such as care not for wealth, and are superior to covetousness, and despisers of base gifts, and of a disposition free from the love of money, and who set no value upon the ostentatious display of riches.

And so the most wise Paul manifestly guides us into the best doctrines, where he says, "Let your disposition be free from the love of money, being contented with what it has:" and to this he has added, that "having nourishment and the means of shelter, we will be therewith content." For it was necessary, absolutely necessary, for those whose business it would be to proclaim the saving message of the Gospel to have a mind careless about wealth, and occupied solely with the desire of better things. The argument, however, does not affect all whose means are abundant, but those only whose desire is set upon riches: and who are these? All to whom our Saviour's words apply: "Store not up for yourselves treasures upon the earth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
