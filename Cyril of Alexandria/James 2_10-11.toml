[[commentary]]
quote='''
THOSE who are exact observers of the sacred commandments do not venture in any way whatsoever to offend the God of all. For they feel the truth of what is written, "That whosoever shall keep the whole law, but shall offend in one particular, becomes guilty of all. For He Who said, You shall not commit adultery, said also, You shall not kill. If then you do not commit adultery, but yet kill, you are become a transgressor of the law." The transgression therefore of one commandment transgresses the law, that is, proves the man to be without the law. But when any one disregards those commandments, which especially are important above the rest, what words will he find able to save him from deserved punishment?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
