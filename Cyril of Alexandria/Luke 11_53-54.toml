[[commentary]]
quote='''
Now this urging is taken to mean pressing upon Him, or threatening Him, or waxing furious against Him. But they began to interrupt His words in many ways, as it follows, And to force him to speak of many things.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And thus being indignant at this reproof, ''they began," it says, "to urge Him vehemently;" by which is meant, to attack Him with cunning, and oppose Him, and show their hatred of Him. And they ventured also, it says, even "to put Him to silence about many things." And what again is the meaning of their putting Him to silence? It is that they required Him at once, and so to speak, without consideration to make answer to their wicked questions; expecting forsooth that he would fall, and say something or other open to objection. But they knew not that He was God; or rather, they were despisers, and proud and contemptuous.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
