[[commentary]]
quote='''
But He knowing as God with what intention John had sent them, and the cause of their coming, was at the time performing many miracles, as it follows, And in the same hour he healed many of their infirmities, &c.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"
[[commentary]]
quote='''
And what follows? Inasmuch as Christ by nature and in truth is God, the purpose of John did not escape Him, but as well knowing the cause of his disciples' coming, He especially at that particular time began accomplishing divine miracles many times more numerous than those which He had hitherto wrought. For so the wise Evangelist has told us, saying, "In that same hour He healed many of sicknessess and of scourges, and of evil spirits: and gave sight to many that were blind."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
