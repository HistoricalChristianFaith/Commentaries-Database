[[commentary]]
quote='''
And I say unto you, My friends, Fear not them that kill the body, and afterwards have nothing more to do. But I will show you Whom you shall fear: fear Him Who after He has killed has power to cast into hell: yea, I say unto you, fear Him. Are not five sparrows sold for two halfpence; and not one of them is forgotten before God. But even the hairs of your head are all numbered. Fear not: you are of more value than many sparrows.

PATIENCE, and an enduring and courageous mind, form the impenetrable armour of the saints: for they render them approved and resplendent with the praises of piety. For one also of the holy apostles thus spake, at one time; "In patience possess you your souls:" at another; "You have need of patience, that by doing the will of God, you may receive the promise." By such manly virtues we become famous, and praiseworthy, and renowned among men everywhere, and worthy of honours and the blessings that are prepared for the saints: even those which "eye has not seen, nor ear heard," as wise Paul says. And how must not those things be worth the gaining and admirable, which surpass our understanding and reason? And therefore, as I said, He prepares those who love Him for spiritual fortitude, thus speaking; "I say unto you, My friends."

His present discourse therefore does not, as it seems, belong to every one absolutely: but, on the contrary, to those only who evidently love Him with all their heart, and can fitly say; "Who shall separate me from the love of Christ? shall tribulation, or distress, or persecution, or famine, or nakedness, or peril, or sword?" For those who have as yet no sure and certain and well-founded love of Him, as long as they live in tranquil times, may indeed possibly preserve their faith in Him: but if distress or persecution harass them a little, they turn away and forsake Him, losing, together with their faith, that which stirred them up to love Him. For just as young plants, which have lately sprung up, cannot endure the violence of too tempestuous a wind, because they have not as yet struck their roots deep; while those which are firmly fixed, and well rooted, remain secure in the ground, even though a gale of fierce winds shake them: so those whose mind is not yet firmly and securely fixed upon Him are very easily drawn aside, and readily desert; while those who have stored up and possais in mind and heart a secure and unwavering love of Him, are unalterable in mind, and unwavering in heart, being superior to all indolence, and looking with contempt upon the most intolerable dangers, and making a mock at terrors, so as even to ridicule the violence of death. The commandment therefore so to act belongs to those who love Him.

But who are those who love Him? They are, so to speak, such as are like-minded with Him, and anxious to follow in His footsteps. And to this His disciple encourages us by saying; "Forasmuch then as Christ has suffered for us in the flesh, do you for His sake arm yourselves with the same mind." He laid down His life for us, and was "among the dead as one free." For death did not attack Him, as it attacks us, because of sin: for He was and is far removed from all sin, and incapable of iniquity: but of His own will He endured it for our sakes, because of His boundless love toward us. For listen to Him as He plainly says; "Greater love has no man than this, that a man lay down his life for his friends." And how then is it not a most base thing not to return to Christ, as a most necessary debt, that which we have received of Him? And, to put it in another light; as being His friends, we ought not to fear death, but rather imitate the faith of the holy fathers. The patriarch Abraham, when tempted, offered his only-begotten son Isaac, "accounting that God was able to raise him up even from the dead." What terror of death, therefore, can assail us, now that "Life has abolished death?" for Christ is "the Resurrection and the Life."

And this too we must bear in mind, that the crowns are to be won by labour. It is strong exertion united with skill that perfects those mighty athletes in the games. It is courage and a brave mind that are most serviceable to those who are skilled in battles: while the man who throws away his shield is ridiculed even by the foe: and if the runaway live, he leads a life of disgrace. But he who was steadfast in the battle, and stood stoutly and courageously with all his might against the enemy, is honoured if he win the victory; and if he fall, is looked upon with admiration. And so ought we to reckon for ourselves; for to endure patiently, and maintain the conflict with courage, brings with it great reward, and is highly desirable, and wins for us the blessings bestowed by God: while to refuse to suffer death in the flesh for the love of Christ, brings upon us lasting, or rather never-ending punishment. For the wrath of man reaches at most to the body, and the death of the flesh is the utmost that they can contrive against us: but when God punishes, the loss reaches not to the flesh alone;—how could it?—but the wretched soul also is cast alone; with it into torments. Let our lot therefore rather be the honoured death; for it makes us mount up to the commencement of an eternal life, to which of necessity are attached those blessings also which come from the divine bounty: and let us flee from and despise a life of shame; a life accursed, and of short duration, and which leads down to bitter and everlasting torment.
'''
