[[commentary]]
quote='''
Let us seek, therefore, not such food as is unnecessary and superfluous, but whatsoever tends unto the salvation of the soul: not raiment of great price, but how to deliver our body from the fire, and from judgment. And this let us do, seeking His kingdom; even all that will aid us in becoming partakers of the kingdom of Christ: by Whom and with Whom, to God the Father be praise and dominion, with the Holy Spirit, for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
