[[commentary]]
quote='''
Hence it follows, And he says unto them, Whosoever shall receive a child in my name, receiveth me. As if He were to say, Seeing that there is one and the same reward to those that honour the saints, whether perchance such an one be the least, or one distinguished for honours and glory, for in him is Christ received, how vain is it to seek to have the preeminence?

Now He still more plainly conveys the meaning of the preceding words, saying, For he that is least among you all, the same shall be great; in which He speaks of the modest man who from honesty thinks nothing high of himself.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"
