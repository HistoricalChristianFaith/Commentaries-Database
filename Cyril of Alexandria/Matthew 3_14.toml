[[commentary]]
quote='''
We must, however, bear in mind, that although the blessed Baptist was thus great in virtue, yet he plainly confessed that he stood in need of holy baptism: for he somewhere said, speaking to Christ, the Saviour of us all, "I have need to be baptized of Thee." But he would have had no need of holy baptism, nor have requested leave to have it granted him, had there not been in it something more and better, than the righteousness that is by the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
