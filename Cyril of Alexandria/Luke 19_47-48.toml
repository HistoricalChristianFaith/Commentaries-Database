[[commentary]]
quote='''
It was their duty therefore, I say their duty, rather to worship Him, as One who with God the Father was Lord of the temple. But this in their great folly they did not do: but rather being savagely eager for hatred, they both set up against Him the sharp sting of wickedness, and hastened to murder, the neighbour and brother of envy. For "they sought, it says, to destroy Him, but could not: for all the people were hanging upon Him to hear Him." And does not this then make the punishment of the scribes and pharisees, and all the rulers of the Jewish ranks, more heavy? that the whole people, consisting of unlearned persons, hung upon the sacred doctrines, and drank in the saving word as the rain, and were ready to bring forth also the fruits of faith, and place their neck under His commandments: but they whose office it was to urge on their people to this very thing, savagely rebelled, and wickedly sought the opportunity for murder, and with unbridled violence ran upon the rocks, not accepting the faith, and wickedly hindering others also.

And how is not what I have said true? For the Saviour Himself reproached them, saying, "And to you, lawyers, woe! for you have taken away the key of knowledge: you enter not in yourselves, and those that are entering in you have hindered."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
