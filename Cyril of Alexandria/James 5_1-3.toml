[[commentary]]
quote='''
Christ's disciple therefore rebukes the rich, saying, "Come now, you rich men, weep, and lament over the miseries that are coming upon you. Your wealth is decayed, your garments are motheaten. Your gold and your silver are rusted, and the rust of them shall be your testimony." How then are the gold and silver rusted? By being stored up in excessive abundance; and this very thing is the witness against them before the divine judgment seat, of their being unmerciful. For having gathered into their treasuries a great and unnecessary abundance, they made no account of those who were in need, although it was in their power, had they so wished, to do good easily to many; but they were not "faithful in the little."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
