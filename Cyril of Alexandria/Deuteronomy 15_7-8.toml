[[commentary]]
quote='''
And we find also that the commandment given by Moses urges us to love for the poor, and arouses us to charity. For it was not one God Who of old appointed the commandment by Moses, and another Who set before us the pathway of Gospel conduct; but rather it was One and the Same, inasmuch as He does not change. For by one of the holy prophets He has said, "I that speak to you am near." He therefore thus spoke by Moses; "But if there be among you a poor man of your brethren in one of your cities in the land which the Lord your God gives you, you shall not turn away your heart, nor shut your hand from your brother that is in need. You shall open your hands wide to him; lend him readily whatsoever he needeth, and according to that which he lacks." You hear him call their almsgiving a loan; for it is God that receives, and requites it, not with equal, but rather with overflowing measure. "For good measure, He says, pressed down, and running over, shall they pour into your bosom."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
