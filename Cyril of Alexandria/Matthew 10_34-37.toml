[[commentary]]
quote='''
Men therefore leave father and mother, and wife and brethren, and oftentimes count for nought the natural affection due to the ties of kindred, for love's sake to Christ. And in what manner they do so, He teaches us by saying, at one time, "He that loves father or mother more than Me is not worthy of Me; and he that loves son or daughter more than Me is not worthy of Me:" and at another time again, "Think not that I am come to send peace on earth; I tell you nay, I am not come to send peace, but division: for I am come to divide a man from his father, and the daughter from her mother, and the daughter-in-law from her mother-in-law." For when the divine message of the gospel is catching as in a net the whole world to faith in Him, and raising it up to the light of the true knowledge of God, there are those who would readily enter in, did they not suffer from an injurious shame, as being afraid either on their father's account, or their mother's, and taking too much into consideration their anger or their sorrow. For if these are idolaters, they will not consent that their sons or daughters should yield themselves to Christ's service, and abandon the error in which they have been brought up, and which has become habitual with them. And often when the sons are unbelieving and ill-disposed, their fathers have not the courage to vex them by hastening to the faith, and seizing the salvation which is by Christ. And the same explanation may be given respecting brethren with brethren, and the daughter-in-law with her mother-in-law, and the latter with the former. But those who are strong in mind, and prefer nothing to the love of Christ, eagerly grasp the faith, and earnestly endeavour to gain admission into His household hy a spiritual relationship, heeding nothing the wars, or rather divisions which will follow, with those who are their kindred according to the flesh. And in this way then men leave house and kindred for Christ's sake, that they may win His Name, being called Christians; or rather for His glory's sake, for frequently His Name means His glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
