[[commentary]]
quote='''
The Son therefore is, as I said, Lord; yet must He not be reckoned with those other lords, to whom the name of lordship is given and imputed: for He alone, as I said, is Lord by nature, being God the Word, Who transcends every created thing. And this the wise Paul teaches us saying; "That though there be in heaven or in earth certain Gods many, and Lordships many: yet to us there is one God the Father, from Whom is everything and we from Him: and one Lord Jesus Christ, by Whom is everything and we by Him." But even though there be but one God, Whose name is the Father; and one Lord, Who is the Son; yet neither is the Father put aside from being Lord, by reason of His being God by nature: nor docs the Son cease from being God, because He is Lord by nature. For perfect freedom is the attribute of the divine and supreme substance only, and to be entirely separate from the yoke of servitude: or rather, to have the creation put in subjection under Its feet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
