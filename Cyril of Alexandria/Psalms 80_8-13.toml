[[commentary]]
quote='''
When Israel suffered these things, the Psalmist so to speak wailed over him, and said to the God of all: "The vine that Thou broughtest out of Egypt, Thou castedst out the nations and plantedst it." And again thus proceeds: "Its shade covered the mountains; and its boughs were as the cedars of God: it sent forth its branches to the sea, and its foliage to the river." He made too supplications for what they had suffered, saying; "Why hast Thou broken down her hedges, and all the wayfarers pluck her? The boar out of the wood destroyeth her: and the ass of the desert feedeth upon her." For the soul that is undefended, and deemed unworthy of protection from on high, becomes a pasture ground for evil beasts. For it is plundered by Satan and his angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
