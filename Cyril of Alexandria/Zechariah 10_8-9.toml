[[commentary]]
quote='''
Of them in sooth He said by the voice of Isaiah, "I will make signs unto them, and receive them, because I will ransom them, and they shall be multiplied, as they were many: and I will sow them among the nations, and they who are afar off shall remember Me." For very many were they that were astray, but were called through Christ: and again they are many as they were before; for they have been received and ransomed, having obtained as the token of peace from God the Father, the adoption into His family and the grace that is by faith in Jesus Christ. And the divine disciples were sown widely among the nations: and what is the consequence? Those who in disposition were far from God, have been made near. To whom also the divine Paul sends an epistle, saying, "Now ye who some time were afar off have been made near in the blood of Christ."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
