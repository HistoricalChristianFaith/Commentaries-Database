[[commentary]]
quote='''
For the prophets have in many ways foretold the mystery of Christ; it became them therefore, if they were wise, to stretch their prospect beyond to the future, nor will ignorance of the time to come avail them after the present life. For there will be wind and rain, and a future punishment by fire; and this is signified when it is said, A shower cometh. It became them also not to be ignorant of the time of salvation, that is, the coming of the Saviour, through whom perfect piety entered into the world. And this is meant when it is said, Ye say that there will be heat. Whence it follows in censure of them, Ye hypocrites, ye can discern the face of the sky and the earth, but how is it that ye do not discern this time?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And He said also to the multitudes, When you have seen a cloud rising out of the west, straightway you say, that rain comes; and so it is. And when [you see] the south wind blowing, you say, There will be heat: and so it is. You hypocrites! you know how to prove the face of the sky, and of the earth: how then know you not how to prove this time? and why even of yourselves judge you not what is just? For whilst you are going with him who has a suit against you in the way to the magistrate, give diligence that you may be delivered, from him; lest he drag you to the judge, and the judge deliver you to the exactor, and the exactor cast you into prison. I tell you, you shall not come out thence, until you have made compensation unto the last mite.

THOSE physicians who are exact in their art, and have become proficients by great practice, deliver the sick from their maladies, by making use of many kinds of drugs, by the aid of which they appease the anguish of men's sufferings, gathering from all quarters whatever may benefit them. And this we also find Christ, the Saviour of all, here doing: for He is the Physician of spirits, and delivers us from the maladies of the soul For He even said by one of the holy prophets; "Return, you returning sons; and I will heal your breaches." And as knowing this, the prophet Jeremiah offered up his supplications unto Him in these words: "Heal me, O Lord, and I shall be healed: save me, O Lord, and I shall be saved: for You are my glory,"

Observe, therefore, how he prepares for us the medicine of admonition, not using as He so often did direct discourse, but mingling, so to speak, and entwining with it images drawn from examples, to make it the more abundantly profitable. For He cried unto the multitudes, saying; "When you see a cloud rising out of the west, straightway you say that rain comes; and it is so. And when [you see] the south wind blowing, you say there will be heat: and so it is." For men fix their attention on things of this kind, and from long observation and practice tell beforehand when rain will fall, or gusts happen of violent winds: and one especially sees sailors very skilful in this matter. Well therefore, He says, well would it become those who can calculate things of this sort, and foretell, it may be, storms that are about to happen, to fix the penetrating glance of the mind also upon matters of importance. And what are these? The law showed beforehand the mystery of Christ; and that certainly He would shine forth in the last ages of the world upon the inhabitants of the earth, and submit to be a sacrifice for the salvation of all. For it even commanded a lamb to be sacrificed as a type of Him towards evening, and at lamp-lighting; that we might understand, that when, like the day, this world was declining to its close, the great and precious and truly-saving passion would be fulfilled: and the door of salvation be thrown widely open unto those who believe in Him, and abundant happiness be their lot. For also in the Song of Songs we find Christ calling to the bride there described, and who represents the person of the Church, in these words: "Arise, come, My neighbour, My beautiful dove: for lo! the winter is past, and the rain is gone: it has passed away. The flowers appear on the ground: the time of the pruning is come." As I said, therefore, a certain springlike calm was about to arise for those who believe in Him.

But against those, who, in the greatness of their wickedness, have scorned His goodness, and rejected the Saviour, there is decreed wrath and misery; and, as it were, a winter of torment and punishment, from the blast of which hard will it be to escape. For, as the Psalmist says; "Fire, and brimstone, and the whirlwind, is the portion of their cup." And why so? Because they have rejected, as I said, the grace that is by faith; and therefore the guilt of their sins cannot be wiped away, and they must bear, as they deserve, the punishment due to those who love sin. For so, when speaking of the Jews, He said; "Verily I say unto you, that if you believe not that I am He, you shall die in your sins."

And that the blessed prophets also in manifold ways preached the mystery of Christ, no one can doubt. For one of them thus speaks as in the person of God the Father: "Behold I lay in Sion a stone of stumbling, and a rock of offence: and whosoever believes in Him shall not be ashamed." For those who are in their sins are full of shame. For so it is somewhere said of the Israelites, who violated the law of Moses: "Like the shame of a thief when he is caught, so shall the children of Israel be ashamed." But those who are in Christ by faith, escaping from the pollutions of sin, are not only not full of shame, but have that boldness which becomes those who are free.

It was their duty, therefore, yes! their duty, He says, as being possessed of understanding, and able to discern the face of the sky and of the earth, to examine also things future, and not to let those tempests escape their observation, which come after this world. For there will be the south wind and rain: that is to say, fiery torment. For the south wind is hot: and the infliction of that punishment is vehement and inevitable, like the rain falling upon those overtaken by it. They must not, therefore, let the time of salvation pass by unnoticed: that time in which our Saviour came, and at which perfect knowledge of the truth reached mankind, and the grace shone forth which purifies the wicked. And that, not by means of the law: for "it made nothing perfect," having only types and shadows; but by faith rather in Christ, not rejecting the law, but fulfilling it by a spiritual service. For the very wise Paul wrote; "Do we then make void the law through faith? It may not be: but we establish the law." For we who are justified by Christ establish that law of faith, which in manifold ways was proclaimed beforehand by Moses and the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
