[[commentary]]
quote='''
He had shown His glory on the mount to His disciples, and after this delivered a man from an evil spirit, but it was necessary for Him to undergo His passion for our salvation. Now His disciples might have been perplexed, saying, "Have we then been deceived in that we thought him to be God?" That they might know then what was to happen to Him, He bids them lay up in their minds as a certain deposit the mystery of His passion, saying, Let these sayings sink down in your hearts. By the word your, He distinguishes them from others. For the multitude were not to know that He was about to suffer, but were rather to be assured that the dead would rise again, destroying death, lest they should be offended.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"
