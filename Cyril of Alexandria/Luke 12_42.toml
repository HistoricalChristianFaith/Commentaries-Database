[[commentary]]
quote='''
Now to the courageous rightly belong the great and difficult of God's holy commandments, but to those who have not yet attained to such virtue, belong those things from which all difficulty is excluded. Our Lord therefore uses a very obvious example, to show that the above-mentioned command is suited to those who have been admitted into the rank of disciples, for it follows, And the Lord said, Who then is that faithful steward?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Such then is the simple and plain meaning of the passage: but if we now fix our mind accurately upon it, we shall see what is signified by it, and how useful it is for their benefit who have been called to the apostleship, to the office, that is, of teacher. The Saviour has ordained as stewards, so to speak, over his servants;----that is, over those who have been won by faith to the acknowledgment of His glory;----men faithful and of great understanding, and well instructed in the sacred doctrines. And He has ordained them, commanding them to give their fellow-servants their allowance of food; and that not simply and without distinction, but rather at its proper season: by which is meant such food, I mean spiritual food, as is sufficient and fitting for each individual. For it is not fitting to address simply to all who have believed in Christ instruction upon all points; for it is written, "With knowledge learn the souls of your flock." For very different is the way in which we establish in the paths of truth one who has but just now become a disciple, using simple teaching, in which there is nothing profound nor difficult to understand, counselling him to escape from the error of polytheism, and fittingly persuading him to discern by the beauty of things created, the universal Creator and Artificer, Who is One by nature, and verily God: from the way in which we instruct those who are more confirmed in mind, and able to understand what is the height and depth, and what the length and breadth, of the definitions of the supreme Godhead. For as we have already said, " Solid meat belongs to them that are full grown."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
