[[commentary]]
quote='''
After having commanded them to embrace poverty, He then crowns with honour those things which follow from poverty. It is the lot of those who embrace poverty to be in want of the necessaries of life, and scarcely to be able to get food. He does not then permit His disciples to be fainthearted on this account, but says, Blessed are ye who hunger now.

But poverty is followed not only by a want of those things which bring delight, but also by a dejected look, because of sorrow. Hence it follows, Blessed are ye that weep. He blesses those who weep, not those who merely drop tears from their eyes, (for this is common to the believing and unbelieving, when sorrow befals them,) but rather He calls those blessed, who shun a careless life, mixed up with sin, and devoted to carnal pleasures, and refuse enjoyments almost weeping from their hatred of all worldly things.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Blessed are ye that hunger now; for ye shall be filled.

In Matthew, however, again He says; "Blessed are they that hunger and thirst after righteousness: for they shall be filled:" but here He simply says, that "those that hunger shall be filled." We say, therefore, that it is a great and noble thing to hunger and thirst after righteousness: that is, habitually to take part in earnest endeavours after piety:—for such is the meaning of righteousness:—as if it were our meat and drink. And inasmuch as we ought to give to this passage also a meaning, in accordance with the foregoing explanations, we say again as follows: The Saviour pronounced those blessed who love a voluntary poverty, to enable them honourably, and without distraction, to practise the apostolic course of life. For it is in plain keeping with the having neither gold nor silver in their purses, nor two coats, to endure also very great hardness in their way of life, and scarcely obtain food for their need. But this is a burdensome thing for those who are suffering poverty and persecutions, and therefore He That knoweth hearts, very suitably does not permit us to be dispirited because of the results of poverty: for He says, that those who hunger now for their piety's sake towards Him shall be filled: that is, they shall enjoy the intellectual and spiritual blessings that are in store.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"

[[commentary]]
quote='''
Blessed are ye that weep now, for ye shall laugh.

He pronounces them that weep blessed, and says that they shall laugh. But by those who weep, we say that those are not meant who simply shed tears from their eyes: for this is a thing common to all without exception, whether believers or unbelievers, if ought happen of a painful nature; but those rather who shun a life of merriment and vanity, and carnal pleasures. —For of the one we say, that they live in enjoyment and laughter; whereas believers abandoning luxury and the careless life of carnal pleasures, and all but weeping because of their abhorrence of worldly things, are, our Saviour declares, blessed; and for this reason, as having commanded us to choose poverty, He also crowns with honours the things which necessarily accompany poverty: such, for instance, as the want of things necessary for enjoyment, and the lowness of spirits caused by privation: for it is written, that "many are the privations of the just, and the Lord shall deliver them out of them all."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
