[[commentary]]
quote='''
As if He said, Whereas the law of Moses expressly says, Give a righteous judgment, and ye shall not respect persons in judgment, (Deut. 1:16, 17.) how now do ye blame My disciples, who even to this day extol David as a saint and prophet, though he kept not the commandment of Moses?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus answered and said unto them, Have ye not even read what David did ...?

Now even though David thus acted contrary to what tho law approves, yet he is rightly and justly esteemed by us as worthy of all admiration: for he was in truth a saint and prophet. Since, therefore, the law of Moses expressly commands, "Judge just judgment, and regard not the person in judgment;" how, saith He, condemn ye My disciples, while ye still admire as a saint and prophet the blessed David, although he did not keep Moses' command?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
