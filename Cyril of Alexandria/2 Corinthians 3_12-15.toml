[[commentary]]
quote='''
"But they are hidden, He says, from your eyes." For they were not worthy to know, or rather to understand, the Scriptures inspired of God, and which speak of the mystery of Christ. For Paul said, "Seeing then that we have so great a hope, we use great freedom of speech: and not as Moses, who put a veil over his face, that the children of Israel might not behold the glory of his countenance, which was fading away. But their minds were blinded; for even to this day the same veil remains upon the reading of the old covenant: for when Moses is read, the veil is laid upon their hearts, and is not taken off, because it is done away in Christ.'' But in what way is the veil done away in Christ? It is because He, as being the reality, makes the shadow cease: for that it is His mystery which is represented by the shadow of the law, He assures us, saying to the Jews, "Had you believed Moses, you would have believed also Me: for he wrote of Me." For it was because they had not carefully examined the types of the law, that they did not see the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
