[[commentary]]
quote='''
For this reason the divinely-inspired Scripture very fitly says to those who would attain to glory by leading a course of holy conduct, "My son, if you draw near to serve the Lord, prepare yourself for temptation. Direct your heart, and endure." For it does not so speak in order to produce in men an abject slothfulness which will win no reward, but that they may know that by practising patience and endurance, they will overcome the temptations which happen to all who would live virtuously, and prove superior to every thing that could harass them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
