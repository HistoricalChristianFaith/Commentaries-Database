[[commentary]]
quote='''
So too at Athens some once ridiculed the divine Paul. For he indeed taught them "that God dwelleth not in temples made with hands," being incorporeal and infinite, and That Which filleth all, but is contained by none: and declared that he preached unto them "Him Whom though they knew Him not, they imagined they rightly worshipped." But they being given up to superciliousness, and greatly priding themselves on their fluent tongue, said in their folly, "What would this seed-picker say? For he seemeth to be a setter forth of foreign gods." Seed-picker was the name they gave to a worthless bird, whose habit it was to pick up the seeds scattered on the roads: and in comparing to it the divine Paul, these foolish men were ridiculing the word of salvation then offered them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
