[[commentary]]
quote='''
As therefore His disciple says, "The day of the Lord will come as a thief; in which the heavens indeed shall suddenly pass away, and the elements being on fire shall be dissolved, and the earth and all the works that are therein shall be burnt up." And further, he adds thereunto, "Since therefore all these things are being dissolved, what sort of persons ought we to be, that we may be found holy, and without blame, and unreproved before Him?" And Christ also Himself says, "Be you therefore always watching, supplicating that you may be able to escape from all those things that are about to happen, and to stand before the Son of Man." "For we shall all stand before His judgment seat," to give an account of those things that we have done. But in that He is good and loving to mankind, Christ will show mercy on those that love Him; by Whom and with Whom to God the Father be praise and dominion, with the Holy Spirit, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
