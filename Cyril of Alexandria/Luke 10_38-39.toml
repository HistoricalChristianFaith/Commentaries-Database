[[commentary]]
quote='''
The first thing however which we must examine is the manner in which the Saviour again benefits His disciples, by setting Himself before them as an example, in order that they may know how and in what manner to behave in the houses of such as receive them. For they must not immediately on entering indulge themselves in relaxation, or suppose that this is the reason why they lodge with men, but rather that they may fill them with every blessing, and the divine and sacred doctrines. So somewhere the blessed Paul also sends a message to certain: "For I desire to see you, that I may give you some spiritual gift, that you may be confirmed." Observe therefore, that our Lord Jesus Christ, on entering to lodge with these holy women, did not cease from giving instruction, but still grants them, without stint, the sober doctrines of salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
