[[commentary]]
quote='''
And this the letter of the Mosaic law has signified to us in an enigma: for it runs thus, "And the Lord spoke unto Moses, saying, You shall make unto thyself two trumpets of beaten metal, of silver shall you make them, and they shall be unto you to call the synagogue together, and to move the camp." And soon afterwards, "And the priests, the sons of Aaron, shall sound the trumpets, and it shall be a perpetual law for your generations." By this then you are intended to understand both the preparatory training of the law, and the perfectness attained to in Christ by the gospel mode of life, and the teaching which surpasses shadows and types. The law then is a trumpet, and equally so is the saving preaching of the Gospel; for by this name does the prophet Isaiah also make mention of it, saying, "And it shall come to pass on that day that they shall sound with the great trumpet," For in very deed a great trumpet sounded forth by the voice of the holy apostles, not setting at nought the first [trumpet], but containing it also within it; for they ever prove what they say concerning Christ by the law and the prophets, making use of the testimonies of older times.

There were then two trumpets made of beaten silver, in which the silver signifies splendour; for every word of God is glorious, having in it none of the darkness of the world: and the hammering out of the metal showed that the sacred and divine trumpet, that is, both the old and new preaching, would advance and grow onward: for that which is hammered out advances as it were continually onward, and extends in breadth and length. "For at Christ's rising for the inhabitants of earth, both the ancient law was to advance unto its spiritual interpretation; for so we preach it who have attained unto spiritual illumination in Christ: and the message of the Gospel was to spread until it embraced the whole world. And to the priests the law gave the use of the trumpets to command the people: but Christ gave the ministers of the new proclamations, by whom are meant the holy apostles, the command to preach Him and His precepts. For they proclaim His mystery, using as it were two trumpets, both preaching Him, as having been "from the beginning eyewitnesses and ministers of the Word," and adding, in confirmation of their words, the true testimonies of the law and the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
