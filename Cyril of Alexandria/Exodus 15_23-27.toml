[[commentary]]
quote='''
And yet again, we find the twelve disciples, and these seventy also, indicated to us by the shadow of the law. For it is thus written in the Exodus concerning the children of Israel; "And they came to Marah : and the people could not drink the waters of Marah; for they were bitter. And Moses cried unto the Lord, and the Lord shewed him a tree; and he cast it into the waters, and the waters were made sweet." Now Marah, when translated, means bitterness; and. is taken by us as a type of the law. For the law was bitter, in that it punished with death. And of this Paul is witness, saying, "He that hath despised Moses' law is put to death without mercy at the mouth of two or three witnesses." It was bitter therefore, and unendurable to those of old time, and was unacceptable on this account, just as were also those bitter waters. But it also was sweetened by the precious cross, of which that tree there shewn by God to the blessed Moses was a type. For now that the shadow has changed to the spiritual contemplation, we behold with the eyes of the mind the mystery of Christ, that lay hid in the types of the law. Although therefore the law was bitter, it has now ceased to be so any longer.

"And after Marah, they came, it says, to Elim." And Elim again when translated means an ascent or increase. And what again was there at Elim? "Twelve wells of water, it says, and seventy palm trees." For as we ascend to more perfect knowledge, and hasten onward to spiritual increase, we find twelve wells, that is, the holy Apostles: and seventy palm trees, those, namely, who were appointed by Christ. And very excellently the disciples are compared to wells, and the seventy, who were subsequently chosen, to palm trees. For as from holy wells we draw from the disciples of our Saviour the knowledge of all good: while we praise the seventy also, and, so to speak, call them palms; for this tree is strong-hearted, and firm of root, and very fruitful, and constantly grows besides the waters. And such we affirm the saints to be: for their mind is pure, and steadfast, and fruitful, and habitually delights itself in the waters of knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
