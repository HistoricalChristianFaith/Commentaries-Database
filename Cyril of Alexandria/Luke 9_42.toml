[[commentary]]
quote='''
But that no man might imagine that Christ also was unable to work the miracle, He rebuked the unclean spirit, and forthwith delivered the youth from his malady, and gave him to his father. For up to this time he had not been his father's, but the property of the spirit that possessed him: but being now delivered from his violence, he became once again his father's property, as Christ's gift: Who also gave the holy apostles authority to work divine miracles, and rebuke with irresistible might impure spirits, and crush Satan.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
