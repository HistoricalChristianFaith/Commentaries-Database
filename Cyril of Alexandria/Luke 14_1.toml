[[commentary]]
quote='''
Although our Lord knew the malice of the Pharisees, yet He became their guest, that He might benefit by His words and miracles those who were present. Whence it follows, And it came to pass, as he went into the house of one of the chief Pharisees to eat bread on the sabbath day, that they watched him; to see whether He would despise the observance of the law, or do any thing that was forbidden on the sabbath day.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"
