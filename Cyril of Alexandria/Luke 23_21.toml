[[commentary]]
quote='''
"For they cried out, it says, saying, Crucify Him, crucify Him." And this their unholy cry the Lord blamed, saying, by the voice of Jeremiah, "I have left My house, I have abandoned My inheritance: I have given My dearly beloved, My soul, into the hand of her enemies. My inheritance has become to Me like a lion in a thicket: it has uttered its voice against Me; therefore I have hated it." It was hated therefore because as a lion it sprang upon Christ, and uttered a cruel and pitiless cry against Him: but we praise Christ, Who for our sakes and in our stead suffered in the flesh: by Whom and with Whom to God the Father be praise and dominion, with the Holy Spirit, for ever and over. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
