[[commentary]]
quote='''
He said to them, Why are you troubled? and why do reasonings arise in your hearts?

To convince them firmly and indubitably, that He is the same Who suffered, He immediately shows that being God by nature, He knows what is hidden, and that the tumultuous thoughts within them escape Him not: for He said, "Why are you troubled? And this is a very plain proof that He Whom they see before them is not some other person, but the very same Whom they had seen both suffering death upon the cross and laid in the tomb, even Him Who sees reins and heart, and from Whom nothing that is in us is hid. This therefore He gives them as a sign, His knowledge namely of the tumult of thoughts that was within them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
