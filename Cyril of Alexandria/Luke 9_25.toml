[[commentary]]
quote='''
But that incomparable exercise of the passion of Christ, which surpasses the delights and precious things of the world, is alluded to when he adds, What is a man advantaged, if he gain the whole world and lose himself, or be a cast away? As if he says, When a man, through his looking after the present delights, gains pleasure, and refuses indeed to suffer, but chooses to live splendidly in his riches, what advantage will he get then, when he has lost his soul? For the fashion of this world passeth away, and pleasant things depart as a shadow. (1 Cor. 7:31. Sap. 5:9.) For the treasures of ungodliness shall not profit, but righteousness snatches a man from death. (Prov. 10:2.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But  that it is incomparably better, far above the splendour and pleasure of the world, to excel in the love of Christ, He shows us by saying, "For what is a man profited who hath gained the whole world, but hath lost himself, or fallen short?" For when a man looks chiefly to that which is pleasant and profitable for the moment, and therefore avoids suffering, and desires to live joyously, even though he have wealth and abundance of possessions, yet what profit hath he therefrom when he has lost himself? "Treasures profit not the wicked," but "the fashion of this world passeth away:" and "like clouds those pleasures recede," and riches flies away from those that possess it: "but righteousness delivereth from death."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
