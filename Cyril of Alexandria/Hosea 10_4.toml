[[commentary]]
quote='''
For that the message of salvation would take possession of the whole world, the God of all declared by one of the holy prophets, saying of it, "Judgment springeth up like couch-grass in the furrows of the field." For like as the couch-grass springs up in the furrows that are left without cultivation, and takes possession of them, and spreads everywhere, constantly advancing onwards, so in an exactly similar manner has judgment, that is to say, the grace that justifieth the world as declared in the saving tidings of the Gospel, taken possession of every city and place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
