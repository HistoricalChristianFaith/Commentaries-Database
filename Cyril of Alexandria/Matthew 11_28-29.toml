[[commentary]]
quote='''
And the Saviour Himself taught us this, crying out and saying; "Come unto Me, all you weary, and heavy laden; and I will give you rest. Take My yoke upon you, and learn of Me; for I am meek and lowly in heart; and you shall find rest for your-selves." Weary then and heavy laden are those, He says, who are under the law: while He calls Himself meek, as though the law had nothing in it of this character. For, as Paul says; "Whosoever has despised Moses' law is put to death without mercy at the mouth of two or three witnesses."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
