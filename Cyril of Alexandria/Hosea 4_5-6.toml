[[commentary]]
quote='''
For He even said by one of the holy prophets to the people of the Jews, "I have compared your mother to the night: My people is like to him that has no knowledge. Because you have rejected knowledge, I also will reject you from being My priest: and because you have forgotten the law of your God, I will also forget your sons." Observe therefore that He compares Jerusalem to the night; for the darkness of ignorance veiled the heart of the Jews, and blinded their eyes: and for this reason they were given over to destruction and slaughter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
