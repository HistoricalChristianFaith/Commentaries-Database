[[commentary]]
quote='''
For what profits the nobleness we inherit through the flesh, unless it be supported by kindred feelings in us? It is folly then to boast of our worthy ancestors, and fall away from their virtues.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Bring forth therefore fruits meet for repentance.

Moreover, the fruit of repentance is, in the highest degree, faith in Christ: and next to it, the evangelic mode of life, and in general terms the works of righteousness in contradistinction to sin, which the penitent must bring forth as fruits worthy of repentance. And he has added; "Begin not to say within yourselves, We have Abraham for our father: for I tell you that God is able of these stones to raise up children unto Abraham." You see how most skilfully he humbles their foolish pride, and shews that their being born of Abraham according to the flesh is useless for their profit. For of what benefit is nobility of birth, if men practise not the like earnest deeds, nor imitate the virtue of their ancestors? For the Saviour says unto them, "if ye were Abraham's children, ye would have done the works of Abraham." The relationship which God requires is one in character and manners: so that it is a vain thing to boast of holy and good parents, while we fall far short of their virtue.

But, says the Jew, if this be so, in what way is the send of Abraham still to be multiplied, and the promise made to him of God hold true, of which the terms are, that "He will multiply his seed as the stars of heaven?" By the calling of the Gentiles, O Jew: for it was said to Abraham himself, that "in Isaac shall a seed for thee be called:" and that "I have set thee as a father of many nations." But the phrase "in Isaac" means, According to promise. He is set therefore as a father of many nations by faith, that is to say, in Christ. And of these it was that God spake also by the voice of Ezekiel: "And I will take away out of their flesh the heart of stone, and will give them a heart of flesh, that they may know Me, that I am the Lord."

And the blessed Baptist apparently calls them stones, because they as yet knew not Him Who is by nature God, but were in error, and in their great folly worshipped the creation instead of the Creator: but they were called, and became the sons of Abraham, and acknowledged, by believing in Christ, Him Who is by nature God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
