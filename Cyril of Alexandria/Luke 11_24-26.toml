[[commentary]]
quote='''
After what had gone before, our Lord proceeds to show how it was that the Jewish people had sunk to these opinions concerning Christ, saying, When the unclean spirit is gone out of a man, &c. For that this example relates to the Jews, Matthew has explained when he says, Even so shall it be also unto this wicked generation. (Matt. 12:45.) For all the time that they were living in Egypt in the practice of the Egyptians, there dwelt in them an evil spirit, which was drawn out of them when they sacrificed the lamb as a type of Christ, and were sprinkled with its blood, and so escaped the destroyer.

The last state also is worse than the first, according to the words of the Apostle, It were better not to have known the way of truth, than after they have known it to turn back from it. (2 Pet. 2:21.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The cause however which made the Jewish multitudes fall into such thoughts concerning Christ He Himself makes plain, by saying; "When the wicked spirit has gone forth from the man, it returns with seven other spirits more bitter than itself; and the last state of that man is worse than the first." For as long as they were in bondage in Egypt, and lived according to the customs and laws of the Egyptians, which were full of all impurity, they led polluted lives; an evil spirit dwelt in them: for it dwells in the hearts of the wicked. But when in the mercy of God they had been delivered by Moses, and received the law as a schoolmaster, calling them to the light of the true knowledge of God, the impure and polluted spirit was driven out. But because they did not believe in Christ, but rejected the Saviour, the impure spirit again attacked them: for he found their heart empty, and devoid of all fear of God, and, swept as it were, and took up his abode in them. For just as the Holy Spirit, when He sees any one's heart free from all impurity, and clean, dwells and abides there, and rests therein; so also the impure spirit is wont to dwell in the souls of the wicked. For they are devoid, as I said, of all virtue: and thero is in them no fear of God. The last state therefore of the Israelites has become worse than the first. For as the disciple of the Saviour said; "It had been better for them not to have known the way of truth, than that when they have known it, they should turn back again from the holy commandment that was delivered unto them. It has happened to them according to the true proverb; The dog that returned to its vomit; and the washed sow to wallow in the mire." Let us flee therefore from being like the Jews; let Christ Who works miracles, be extolled by us: by Whom and with Whom to God the Father be praise and dominion, with the Holy Spirit, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
