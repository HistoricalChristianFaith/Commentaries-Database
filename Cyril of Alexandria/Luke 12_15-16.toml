[[commentary]]
quote='''
And to view it in yet another light; it avails nothing, because a man's life, as He says, is not from his possessions, by reason of his having a superfluity. And this is plainly true: for the duration of a man's life is not extended in proportion to his wealth, nor does the sum of his life run parallel with that of his wicked gains. And this the Saviour has clearly and manifestly shown us, by very excellently adding the present parable in connexion with His previous argument. "For the ground, He said, of a certain rich man brought forth abundant crops." Consider it exactly, that you may admire the beautiful art of the discourse. For He has not pointed out to us an estate of which one portion only brought forth abundant harvests; but the whole of it was fertile for its owner, showing thereby the vastness of his wealth. Similar to this is that passage of one of the holy apostles; "Behold, the hire of the labourers who have reaped your land, which is of you kept back by fraud, cries out: and the supplications of those that reaped have entered into the ears of the Lord of Sabaoth." The Saviour therefore said that all his estate brought forth abundant harvests.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
