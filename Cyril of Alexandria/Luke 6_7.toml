[[commentary]]
quote='''
But the Pharisees watched Him, to see if He would heal on the sabbath: for such is the nature of an envious man, that he makes the praises of others food for his own disease, and wickedly is maddened by their reputation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
