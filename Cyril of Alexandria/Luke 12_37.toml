[[commentary]]
quote='''
When then our Lord coming shall find us awake and girded, having our hearts enlightened, He will then pronounce us blessed, for it follows, Verily I say unto you, that he shall gird himself; from which we perceive that He will recompense us in like manner, seeing that He will gird Himself with those that are girded. (Isa. 11:5.)

He will then make them to sit down as a refreshment to the weary, setting before them spiritual enjoyments, and ordering a sumptuous table of His gifts.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
When therefore He comes and finds us girt and wakeful, and with our heart enlightened, then forthwith He will make us blessed: for "He will gird up His loins, and serve them." By which we learn that he will requite us proportionately: and because we are as it were weary with toil, He will comfort us, setting before us spiritual banquets, and spreading the abundant table of His gifts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
