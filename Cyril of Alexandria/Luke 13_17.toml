[[commentary]]
quote='''
But they had nothing to answer; they themselves unanswerably condemned themselves. Hence it follows, And when he had said these things, all his adversaries were ashamed. But the people, reaping great good from His miracles, rejoiced at the signs which they saw, as it follows, And all the people rejoiced. For the glory of His works vanquished every scruple in them who sought Him not with corrupt hearts.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
All His adversaries were ashamed.

Shame fell then on those who had uttered these corrupt opinions: who had stumbled against the chief corner stone, and been broken; who had resisted the Physician, who had clashed against the wise Potter, when busied in straightening His crooked vessels: and there was no reply which they could make. They had unanswerably convicted themselves, and were put to silence, and in doubt what they should say. So had the Lord closed their audacious mouth. But the multitudes, who reaped the benefit of the miracles, were glad. For the glory and splendour of His works solved all inquiry and doubt in those who sought Him without malice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
