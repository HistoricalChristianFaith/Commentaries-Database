[[commentary]]
quote='''
For those who have died in the faith, the light-bearing lamp has risen and the day dawns, according to the Scriptures, and to them the light of truth is sent, which is the face of the Holy Spirit.
'''
source_url=''
source_title="LETTERS 55.6"

[[commentary]]
quote='''
For this His disciple also taught us thus saying; "We have for confirmation the word of prophecy, into which you do well to look, as upon a torch shining in a dark place, until the day dawn, and the star of light arise in your hearts." On us then who are in Christ the day has shone, and the star of the rational dawn has arisen, possessing as we do a correct and blameless knowledge of Him: for He has Himself put into our mind and heart divine knowledge, being the Saviour and Lord of all; by Whom and with Whom to God the Father be praise and dominion, with the Holy Spirit, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"

[[commentary]]
quote='''
For one of them even said to those who have been called by faith to the acknowledgment of the glory of Christ, "And we have the more sure prophetic word, to which you do well to look, as to a torch that shines in a dark place, until the day dawn, and the light-star arise in your hearts." For before the coming of the Saviour, the predictions of the law and the prophets concerning Christ, were as some torch in a dark place. For the mind of the Jews was always gross, and, so to speak, full of thick darkness. For they understood not in the least what was said concerning Christ. But when the day dawned, when the light that is of truth arose, henceforth the prophetic word is no small torch, but resembles rather the bright rays of the morning star.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
