[[commentary]]
quote='''
And they ware filled with madness.

Is not the miracle enough to produce faith? Thou seest Him working with godlike dignity, and with supreme power healing the sick, and travaillest thou with murder, bred of envy and malice?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
