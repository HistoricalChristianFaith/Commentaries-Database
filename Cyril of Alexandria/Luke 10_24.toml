[[commentary]]
quote='''
We have heard His ineffable teaching: He has given us the knowledge of God the Father: He has shown Him to us in His own nature. The things that were by Moses were but types and symbols: Christ has revealed the truth to us. He has taught us that not by blood and smoke, but rather by spiritual sacrifices, we must honour Him Who is incorporeal and immaterial, and above all understanding. Many holy prophets desired to see these things; yes, and many kings: for we find them at one time saying, "Show me Your mercy, O Lord: and, O Lord, grant us Your salvation." For they call the Son Mercy and Salvation. At another time again; "Remember me, O Lord, with the favour of Your people: and visit me with Your Salvation: that we may see the happiness of Your chosen, and rejoice in gladness with Your people." And who the people are, that are chosen in Christ by God the Father, the wise Peter tells us, when saying to those who have been ennobled by faith: "But you are a chosen generation: a royal priesthood: a holy people, a redeemed multitude: that you may tell forth His virtues, Who has called you out of darkness into His marvellous light."

And to this we have been called by Christ: by Whom and with Whom, to God the Father be praise and dominion, with tho Holy Ghost, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
