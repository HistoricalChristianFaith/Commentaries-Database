[[commentary]]
quote='''
What therefore does the Saviour say of them by the voice of the Psalmist? "That without cause have they hid for Me the destruction of their snare: without reason have they reproached My soul. Let a snare come upon them which they know not: and let the net which they hid for Me catch themselves, and let them fall into their own snare." For so verily they did fall; for because they delivered Jesus to Pilate, they were themselves given over to destruction, and the Roman host consumed them with fire and sword, and burnt up all their land, and even the glorious temple that was among them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
