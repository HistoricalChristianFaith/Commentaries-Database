[[commentary]]
quote='''
For calling back to his consciousness the crimes he had committed, he is alarmed and trembles, and as being unclean, he believes it impossible he can receive Him who is clean, for he had learnt from the law to distinguish between what is defiled and holy.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when Simon Peter saw it.

For this reason also Peter, carried back to the memory of his former sins, trembles and is afraid, and as being impure ventures not to receive Him Who is pure: and his fear was laudable: for he had been taught by the law to distinguish between the holy and the profane.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
