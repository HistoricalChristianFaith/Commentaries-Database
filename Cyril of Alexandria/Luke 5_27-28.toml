[[commentary]]
quote='''
And He saw a publican named Levi.

For Levi was a publican, a man insatiable after filthy lucre, of unbridled covetousness, careless of justice in his eagerness after what was not his own; for such was the character of the publicans: yet was he snatched from the very workshop of iniquity, and saved beyond hope, at the call of Christ the Saviour of us all. For He said unto him, "Follow Me: and he left all and followed Him," Seest thou that most wise Paul truly says, that "Christ came to save sinners?" Seest thou how the Only-begotten Word of God, having taken upon Him the flesh, transferred unto Himself the devil's goods?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"

[[commentary]]
quote='''
"Or how can a man enter the house of the strong man, and spoil his vessels, unless first he have bound the strong man, and then he will spoil his vessels." By the house of the strong man, that is of Satan, He means this country upon earth, and his vessels are those who are likeminded with him. For just as we call the saints holy vessels, so there is nothing to prevent our giving the name of "vessels of the devil" to those who are the contrivers of all wickedness. The Only-begotten Word therefore of God at His incarnation entered into the strong man's house, even into this world, and having bound him, and "sunk him in fetters of darkness," as it is written, spoiled his goods.

And Levi verily was saved, while in us the deed suggests happy hopes; for by the very fact we are taught that repentance will save. Yea, moreover, God Himself, Who is Lord of all, shall be our surety, whore He says by the voice of the prophet, "Return unto Me, and be ye saved, even from the ends of the earth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
