[[commentary]]
quote='''
And what his end will be, we learn from the words of Isaiah. For he says: "For the vineyard of the Lord of Hosts is the man of Judah: a plant new and well-beloved: and I looked that it would bring forth grapes, but it brought forth iniquity, and not righteousness, but a cry." And that Israel was thus punished for its neglect of that fruitfulness which was both fitting for itself and well pleasing to God; having neither obeyed His commands, nor consented to perform them; we learn again from' His words, where He says: "But now I will shew you what I will do to My vineyard. I will take away its fence, and it shall be wasted: and I will rend its wall, and it shall be trampled under foot. And I will abandon My vineyard: and it shall not be pruned, nor tilled: and thorns shall grow up in it as on waste ground; and I will command the clouds to rain no rain upon it." It is plain, therefore, to every man, that God hath no respect for the wicked soul that beareth thorns. For it is left unprotected, and without a wall, and exposed to the depredations of whoever will; a place for thieves and wild animals; and sharing in no spiritual consolation. For this I consider, and this only, is the meaning of there falling upon it no rain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
