[[commentary]]
quote='''
And He sends messengers to make a place for Him and His companions, who when they came to the country of the Samaritans were not admitted, as it follows, And sent messengers before his face: and they went, and altered into a village of the Samaritans, to make ready for him. And they did not receive him.

But our Lord, Who knew all things before they came to pass, knowing that His messengers would not be received by the Samaritans, nevertheless commanded them to go before Him, because it was His practice to make all things conduce to the good of His disciples. Now He went up to Jerusalem as the time of His suffering drew near. In order then that they might not be offended, when they saw Him suffer, bearing in mind that they must also endure patiently when men persecute them, He ordained beforehand as a kind of prelude this refusal of the Samaritans. It was good for them also in another way. For they were to be the teachers of the world, going through towns and villages, to preach the doctrine of the Gospel, meeting sometimes with men who would not receive the sacred doctrine, allowing not that Jesus sojourned on earth with them. He therefore taught them, that in announcing the divine doctrine, they ought to be filled with patience and meekness, without bitterness, and wrath, and fierce enmity against those who had done any wrong to them.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
It would be untrue, then, to affirm that our Saviour did not know what was about to happen: for as He knows all things, He knew, of course, that His messengers would not be received by the Samaritans. Of this there can be no doubt. Why, then, did He command them to precede Him? The reason of it was His custom assiduously to benefit the holy Apostles in every possible way: and for this end His practice sometimes was to put them to the proof. As for instance, He was sailing once upon the lake of Tiberias with those named above; and while so doing he fell asleep purposely: and a violent wind having risen upon the lake, a rough and unusual storm began to rage, and the boat was in danger, and the crew in alarm. For He intentionally permitted the storm and the fury of the tempest to rage against the ship, to try the faith of the disciples, and to make manifest the greatness of His power. And this, also, was the result. For they, in the littleness of their faith, said, "Master, save us, we perish." And He at once arose and shewed that He is Lord of the elements; for He rebuked the sea and the tempest, and there was an exceeding great calm. And so also on this occasion: He knew, indeed, that those who went forward to announce that he would lodge with them would not be received by the Samaritans; but He permitted them to go, that this again might be a means of benefiting the holy Apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
