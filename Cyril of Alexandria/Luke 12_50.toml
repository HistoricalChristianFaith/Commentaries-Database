[[commentary]]
quote='''
But our Lord was hastening the kindling of the fire, and hence it follows, And what will I, save that it be kindled? (nisi ut accendatur) For already some of the Jews believed, of whom the first were the holy Apostles, but the fire once lighted in Judaea was about to take possession of the whole world, yet not till after the dispensation of His Passion had been accomplished. Hence it follows, But I have a baptism to be baptized with. For before the holy cross and His resurrection from the dead, in Judaea only was the news told of His preaching and miracles; but after that the Jews in their rage had slain the Prince of life, then commanded He His Apostles, saying, Go and teach all nations. (Matt. 28:19.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And this He teaches us by saying, "But I have a baptism to be baptized with, and how am I straitened until it be accomplished!" And by His baptism He means His death in the flesh: and by being straitened because of it He means, that He was saddened and troubled until it was accomplished. For what was to happen when it was accomplished? That henceforth not in Judaea only should the saving message of the Gospel be proclaimed: comparing which to fire He said, "I am come to send fire upon earth:"----but that now it should be published even to the whole world. For before the precious cross, and His resurrection from the dead, His commandments and the glory of His divine miracles, were spoken of in Judaea only. But because Israel sinned against Him, for they killed the Prince of Life, as far as they were concerned, even though He arose having spoiled the grave: then immediately He gave commandment to the holy apostles in these words: "Go, make disciples of all nations, baptizing them in the name of the Father and of the Son, and of the Holy Spirit; and teaching them to observe all those things which I have commanded you." Behold therefore, yes see, that throughout all nations was that sacred and divine fire spread abroad by means of the holy preachers.

And of the holy apostles and evangelists Christ somewhere spoke by one of the prophets: "And it shall come to pass in that day, that I will make the heads of the thousands of Judaea like a firebrand among wood, and like a fiery lamp among reeds; and they shall devour on the right hand and on the left all the nations round about." For, so to speak, like fire they ate up all the nations, and fed upon the whole earth, kindling all its inhabitants, who as I said were cold, and had suffered the death of ignorance and sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
