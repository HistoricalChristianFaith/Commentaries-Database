[[commentary]]
quote='''
And this word concerning Him went forth in all Judaea, and in all the region round about. And his disciples told John of all these things: and John called certain two of his disciples, and sent them unto Jesus, saying, Art Thou He that cometh, or look we for another? When the men came to Him, they said, John the Baptist sent us to Thee, saying, Art Thou He that cometh, or look we for another? But in that same hour he healed many of sicknesses and scourges, and of evil spirits: and unto many that were blind He gave sight. And He answered and said to them, Go tell John what things ye have seen and heard: that the blind see; and the lame walk; and the lepers are cleansed; and the deaf hear; the dead arise, and the poor are preached unto; and blessed is he who is not offended in Me.

On the present occasion also the Word about to be addressed to you, and the investigation of the sacred doctrines cannot but be most certainly for your benefit. Come then, that together with the holy angels we may praise the universal Saviour: for He is worshipped, as in heaven so also in earth; and to Him every knee shall bow, as it is written. Be it therefore known to people everywhere, that the Lord is God, and even though He appeared in fashion like unto us, yet has He given us the indications of a godlike power and majesty on many occasions, and in a multitude of ways: by driving away diseases; by rebuking unclean spirits; by bestowing on the blind their sight; and finally, oven by expelling death itself from the bodies of men;—death which cruelly and mercilessly had tyrannized from Adam even unto Moses, according to the expression of the divine Paul. That widow's son then at Nain arose unexpectedly and wonderfully, and the miracle remained unknown to no one throughout the whole of Judaea, but was noised abroad as a divine sign, and admiration was upon every tongue. And some of his intimate friends, that is, his disciples, tell it also to the blessed Baptist: and he chose out and selected two persons from the rest, and sends them to Jesus to ask Him, if it is He Who cometh, or whether they must wait for another. What hast thou done, O excellent Baptist! Dost thou not know Him Whom thou preachedst, being thyself the precursor of this rising, as the morning star proclaims the coming sun? Thou wentest before Him like a torch. Thou pointedst Him out to the holy apostles, saying very plainly, "Behold the Lamb of God, Who taketh away the sin of the world!" Elsewhere also we heard Thee saying to the multitudes of the Jews, that "after me cometh the man who was before me, because He is before me. And I knew Him not: but He who sent me to baptize in water, He said unto me, On Whom thou seest the Holy Ghost descend from heaven, and remain upon Him, He it is Who baptizeth in the Holy Ghost. And I saw, and bore witness, that This is the Son of God." How then dost thou ask, if it is He that cometh? For thou saidst, "I saw and bore witness, that He is the Son of God." But the blessed Baptist did not fail to recognise the Word of God Who had become man. Do not imagine so. Well and very clearly was he persuaded that He was He that cometh; but what He did was something wise and well-contrived, and fit in no slight degree to benefit his disciples. For they indeed, because they did not yet know Christ, inasmuch as His glory and all-excelling majesty was concealed from them, were even silently stung at His working miracles, and surpassing the Baptist in the greatness of the deeds wrought by Him. For on one occasion they even drew near to him, pining with envy and vexation, and with their heart still requiring to set free from Jewish maladies, and said to the blessed Baptist concerning Christ the universal Saviour, "Rabbi, He Who was with thee on the other side of Jordan, to Whom thou bearest witness, He baptizeth, and every man cometh to Him." For they did not wish any one else to baptize at all, and exalt himself against the honour of John. They learnt however from him the superiority of Christ's glory, and the incomparable greatness of His splendour: for they heard him say in answer, "Ye are yourselves my witnesses that I said, that I am not the Christ, but that I have been sent before Him. He who hath the bride is the bridegroom: but the bridegroom's friend, who standeth and heareth his voice, joyfully rejoiceth because of the bridegroom's voice: this therefore, which is my joy, is complete. He must grow great, but I must be made small." We do not however say that the blessed Baptist in any respect whatsoever decreased in dignity, himself of himself, during the time that Christ's glory was constantly receiving addition from those that believed on Him: but inasmuch as the blessed John continued in the measure of human nature:—for it was not possible for him ever to advance to anything beyond:—but the incarnate Word, being in His nature God, and ineffably begotten of God the Father, advancing continually to His proper glory, was admired of all men; for this reason it was he said, "He must grow great, but I must be made small." For he who remains in exactly the same state seems to grow small, in comparison with one who is continually advancing. But that it was right that as being by nature God, He should surpass in might and glory human things, he explained to them saying: "He Who cometh from above is above all: and he who is of the earth, belongeth to the earth, and speaketh of the earth." Who then is He Who cometh from above, and is above all as being God? Plainly the only-begotten Word of the Father, Who was in His likeness, and on an equality with Him: but for the love He had unto the world, humbled Himself to our estate. As being such therefore, He must necessarily surpass one who was of the earth: one, that is to say, numbered among the things of earth, and their like in nature, such as was the Baptist. For he was indeed praiseworthy in virtue, and incomparable in piety, and had attained to the perfection of all righteousness, and was honourable and worthy of admiration: for the Lord bore him witness saying, "There hath not risen among the sons of women one greater than John the Baptist." But he was not from above; not of the Substance, I mean, that is set above all: rather he was from below, a son of earth, and one of us. Therefore, to return from this digression, as their heart was not free from Jewish maladies, they tell the blessed Baptist of the Saviour's divine signs: and he, as thoroughly knowing Who it was That wrought the miracles, exulted indeed in himself, in seeing the Saviour's glory spread abroad: but to produce a firm and steadfast faith in Him, in those, who as yet were halting, nor thus far convinced that He is the Christ, he puts on the appearance of ignorance, and so sends to Him certain to ask Him, saying, "Art Thou He That cometh, or do we wait for another?" Cometh whither perhaps some will say: for there are men who think that we ought to understand something of this sort: —that as the Baptist was about before the precious cross to undergo death by the wickedness of Herod, and, so to speak, anticipate Christ's departure, and as His forerunner, precede His arrival in Hades, he asks whether He will come there also, to redeem those in darkness and the shadow of death, and entangled in inevitable bonds. But such an opinion is utterly to be rejected: for nowhere do we find that the Scripture inspired of God has declared that the divine Baptist preached beforehand to the spirits in Hades the coming of the Saviour. And this also we may truly say, that inasmuch as once for all he knew the whole effect of the dispensation in the flesh of the Only-begotten, he of course knew, in addition to the other particulars, that He will redeem those in Hades, and shine forth even upon them, as "by the grace of God tasting death for every man," that as Paul says, "He may be Lord both of the dead and of the living."
'''
