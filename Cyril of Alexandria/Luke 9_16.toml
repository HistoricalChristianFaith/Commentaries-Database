[[commentary]]
quote='''
This also He did purposely for our sakes, that we may learn that at the commencement of a feast when we are going to break bread, we ought to offer thanks for it to God, and to draw forth the heavenly blessing upon it. As it follows, And he blessed, and brake.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
To magnify, therefore, the greatness of the miracle, and make it in every way evident that He is in His own nature God, He multiplies that little many times, and looks up to heaven to ask a blessing from above, being intent in this also upon our good. For He is Himself That which filleth all things, being the blessing that cometh from above from the Father. But that we may learn that when we commence a meal, and are about to break bread; it is our duty to offer it to God, placing it, so to speak, upon our stretched out hands, and calling down a blessing upon it from above, He purposely became our precedent, and type, and example in the matter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
