[[commentary]]
quote='''
As he knew therefore that he was covetous, he leads him to the Pharisees and captains; and to them he promised that he would betray his teacher. And they purchase the treachery, or rather their own destruction, with sacred money. Oh! what tears could suffice, either for him who betrayed Jesus for hire, or for those who hired him, and purchased with consecrated money a guilty murder! What darkness had come upon the soul of him who received the bribe! For a little silver, he lost heaven; he missed the crown of immortality, and the desirable honour of the apostleship, and to be numbered among the twelve, to whom Christ somewhere said, "You are the light of the world." He cared not to be a light of the world: he forgot Christ, Who says, "You who have followed Me in My temptations, when the Son of man shall sit upon the throne of His glory, you also shall sit upon twelve thrones, and judge the twelve tribes of Israel." But he wanted not to reign with Christ. What a confusion too of error blinded the mind of that covetous man! He delivered to death Him Who is greater than death. Did you not know that Lazarus was raised on the fourth day from the grave, and that at His nod the widow's son also revived, and the daughter of the chief of the synagogue? Did you not hear Him say to the Jews concerning His body, "Destroy this temple: and in three days I will raise it up again?" Did you forget His words, "I am the resurrection and the life?" What therefore was the cause of such utter frenzy? The Evangelist tells us, where he says, "Satan entered into him," having obtained as his pathway and door the passion of avarice. And yet "the fear of God with a sufficiency is great gain:" and, as the sacred Scripture says, "We neither brought anything into the world, nor can we carry [anything] out." And "those who seek to be rich, fall into numerous and unprofitable lusts, which sink men in pitfalls and destruction." And of this the disciple who became a traitor is a manifest proof: for he perished for the sake of a few wretched shekels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
