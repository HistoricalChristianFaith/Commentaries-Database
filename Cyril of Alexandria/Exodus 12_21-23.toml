[[commentary]]
quote='''
For, to shew my meaning by an example, they were not able to flee away from the bondage of Egypt, nor escape from the hand that oppressed them, until they had sacrificed a lamb according to the law of Moses; and when they had eaten its flesh, they anointed the lintels with its blood; and so put the destroyer to shame. But it was not the mere sacrifice of a sheep that made them, superior to death and the destroyer. Types travail with the truth: and this act of theirs was, as I said, a foreshowing, by means of what was done in shadows, of the saving efficacy of the death of Christ, and of the abolition of destruction by His blood: Who also further drives away our cruel tyrant, Satan, and delivers from the mastery of impure spirits those whom they had enslaved, and who, like the Israelites made to serve in bricklaying, had become the victims of earthly cares, and polluted fleshly lusts, and the unprofitable distractions of this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
