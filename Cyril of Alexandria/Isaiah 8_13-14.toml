[[commentary]]
quote='''
And what does the prophet Symeon say of Christ? "Behold This child is set for the fall and rising again of many in Israel, and for a sign that shall be spoken against." For the Immanuel is set by God the Father for the foundations of Sion, "being a stone elect, chief of the corner, and honourable." Those then that trusted in Him were not ashamed: but those who were unbelieving and ignorant, and unable to perceive the mystery regarding Him, fell, and were broken in pieces. For God the Father again has somewhere said, "Behold I lay in Sion a stone of stumbling and a rock of offence, and He that believeth on It shall not be ashamed; but on whomsoever It shall fall, It will winnow him." But the prophet bade the Israelites be secure, saying, "Sanctify the Lord Himself, and He shall be thy fear: and if thou trust upon Him, He shall be thy sanctification, nor shall ye strike against Him as on a stone of stumbling, and a rock of offence." Because however Israel did not sanctify the Emmanuel Who is Lord and God, nor was willing to trust in Him, having stumbled as upon a stone because of unbelief, it was broken in pieces and fell. But many rose again, those, namely, who embraced faith in Him. For they changed from a legal to a spiritual service: from having in them a slavish spirit, they were enriched with That Spirit Which maketh free, even the Holy Ghost: they were made partakers of the divine nature: they were counted worthy of the adoption of sons: and live in hope of gaining the city that is above, even the citizenship, to wit, the kingdom of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"

[[commentary]]
quote='''
But that the phrase, that God is hallowed by us, is a confession of our regarding Him as Holy of Holies, and does not bestow on Him any additional holiness, you may understand hence. One of the holy prophets said, "Hallow the Lord, and He shall be Your fear: and if you trust in Him, He shall be holiness unto you." Do we then make God holy? Is it the act of human nature to bestow ought on God? Does the thing made benefit the Maker? Does any man imagine that He, Who of his fulness richly distributes to the creature His gifts, will Himself receive ought of us, whose place it is to listen to the words of the blessed Paul; "What have you that you have not received? When, therefore, the prophet said, "Hallow the Lord, and He shall be your fear, and holiness to you;" we affirm that what he teaches is, 'Believe that He is holy, for then you will fear Him; and so He will thus be to you the means of holiness.'' And it is written again of Christ the Saviour of us all; "Hallow Him, Who despised Himself." For He did despise Himself, by deeming His life of no account, and laying it down for our sakes. But let Him be hallowed, it says, by you: that is, let Him be acknowledged as holy. For such He is by nature, as being true God, and the Son of God. For to be essentially holy suits not any one whatsoever of those things, which from nonexistence have been brought into being: but only that supreme nature which transcends all. By believing therefore that He is by nature holy;—for this is the meaning of our hallowing Him; — we further acknowledge Him to be true God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
