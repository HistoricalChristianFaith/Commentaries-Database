[[commentary]]
quote='''
But our Lord, to show that His coming into this world was to be the loosing of human infirmities, healed this woman. Hence it follows, And when Jesus saw her, he called her to him, and said unto her, Woman, thou art loosed from thine infirmity. A word most suitable to God, full of heavenly majesty; for by His royal assent He dispels the disease. He also laid His hands upon her, for it follows, He laid his hands on her, and immediately she was made straight, and glorified God. We should here answer, that the Divine power had put on the sacred flesh. For it was the flesh of God Himself, and of no other, as if the Son of Man existed apart from the Son of God, as some have falsely thought.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The Incarnation of the Word, and His assumption of human nature took place for the overthrow of death and destruction, and of that envy nourished against us by the wicked serpent, who was the first cause of evil. And this is plainly proved to us by facts themselves. And so He set free the daughter of Abraham from her protracted sickness, calling out and saying, "Woman, you are loosed from your infirmity." A speech most worthy of God, and full of supernatural power: for with the kingly inclination of His will He drives away the disease. And He also lays His hands upon her: and immediately, it says, she was made straight. And hence too it is possible to sec that His holy flesh bore in it the power and activity of God. For it was His own flesh, and not that of some other Son beside Him, distinct and separate from Him, as some most impiously imagine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
