[[commentary]]
quote='''
By day He was in Jerusalem, but when the darkness of night came on He held converse with His disciples on the mount of Olives; as it is added, And his disciples followed.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And He came out and went, as He was wont, to the Mount of Olives; and the disciples also followed Him. And when He was at the place, He said to them, Pray that you enter not into temptation. And He went apart from them about a stone's throw, and knelt down and prayed, saying, Father, if You will, put away this cup from Me: but not My will, but Yours be done. And He rose up from prayer, and went to the disciples, and found them asleep from sorrow. And He said to them, Why sleep you? Arise, pray that you enter not into temptation.

OUR Lord Jesus Christ requires those who love Him to be accurate investigators of whatsoever is written concerning Him: for He has said, "that the kingdom of heaven is like to a treasure hid in a field." For the mystery of Christ is deposited, so to speak, at a great depth, nor is it plain to the many: but he who uncovers it by means of an accurate knowledge, finds the riches which are therein, and resembles that wise woman, even Mary, of whom Christ said, that "she had chosen the good part, that should not be taken away from her." For these earthly and temporal things fade away with the flesh: but those which are divine and intellectual, and that benefit the life of the soul, are firmly established, and their possession cannot be shaken. Let us look therefore into the meaning of the lessons set before us. "By day then the Saviour abode in Jerusalem," instructing evidently the Israelites, and revealing to them the way of the kingdom of heaven; but when the evening came, He continued with the holy disciples on the Mount of Olives at a spot called Gethsemane: for so the wise Evangelist Matthew tells us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
