[[commentary]]
quote='''
They learnt however from him the superiority of Christ's glory, and the incomparable greatness of His splendour: for they heard him say in answer, "Ye are yourselves my witnesses that I said, that I am not the Christ, but that I have been sent before Him. He who hath the bride is the bridegroom: but the bridegroom's friend, who standeth and heareth his voice, joyfully rejoiceth because of the bridegroom's voice: this therefore, which is my joy, is complete. He must grow great, but I must be made small." We do not however say that the blessed Baptist in any respect whatsoever decreased in dignity, himself of himself, during the time that Christ's glory was constantly receiving addition from those that believed on Him: but inasmuch as the blessed John continued in the measure of human nature:----for it was not possible for him ever to advance to anything beyond:----but the incarnate Word, being in His nature God, and ineffably begotten of God the Father, advancing continually to His proper glory, was admired of all men; for this reason it was he said, "He must grow great, but I must be made small." For he who remains in exactly the same state seems to grow small, in comparison with one who is continually advancing. But that it was right that as being by nature God, He should surpass in might and glory human things, he explained to them saying: "He Who cometh from above is above all: and he who is of the earth, belongeth to the earth, and speaketh of the earth." Who then is He Who cometh from above, and is above all as being God? Plainly the only-begotten Word of the Father, Who was in His likeness, and on an equality with Him: but for the love He had unto the world, humbled Himself to our estate. As being such therefore, He must necessarily surpass one who was of the earth: one, that is to say, numbered among the things of earth, and their like in nature, such as was the Baptist. For he was indeed praiseworthy in virtue, and incomparable in piety, and had attained to the perfection of all righteousness, and was honourable and worthy of admiration: for the Lord bore him witness saying, "There hath not risen among the sons of women one greater than John the Baptist." But he was not from above; not of the Substance, I mean, that is set above all: rather he was from below, a son of earth, and one of us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
