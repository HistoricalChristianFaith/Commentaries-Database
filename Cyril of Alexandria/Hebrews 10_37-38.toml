[[commentary]]
quote='''
For by faith is the knowledge of the truth, as the prophet Isaiah somewhere says; " If you will not believe, neither shall you understand." This same way of salvation by faith in Christ He before declared unto us by the holy prophets, saying; "Yet a little, a little while, and he that comes shall come, and shall not tarry. And whosoever shall draw back, in him My soul shall have no pleasure." And what is meant by a person's drawing back is his giving way to slothfulness. When therefore He says, that no one of those who have been called must draw back, it means, that if he grow slothful in his progress towards the grace which is by faith, My soul shall have no pleasure in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
