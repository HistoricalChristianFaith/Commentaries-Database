[[commentary]]
quote='''
But whom can we suppose these to be who refused to come for the reason just mentioned, but the rulers of the Jews, whom throughout the sacred history we find to have been often reproved for these things?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"
