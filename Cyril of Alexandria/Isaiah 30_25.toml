[[commentary]]
quote='''
For the flocks of the believers have, as it were, a pasture full of divers plants and flowers, in the holy Scriptures, which are their wise guides: and filled with spiritual joy at the glorious doctrines and instructions which they contain, they frequent the sacred courts. And this it is which long ago was proclaimed in the words of Isaiah: "And there shall be upon every high mountain, and upon every high hill, running waters upon that day." And again; "And the mountains shall drop sweetness: and the hills flow with milk." For it is the custom of divine Scripture to compare to mountains and hills those set over others, and whose office it is to teach, inasmuch as they are high exalted, in respect, I mean, of their thoughts being occupied with elevated subjects, and withdrawn from things earthly: while the waters and the sweetness and the milk are the instructions which flow from them as from fountains. "There shall be then, He says, at that time from every high mountain, and from every high hill, flowing waters, and sweetness and milk." And these are the spiritual consolations of holy instructors, offered to the people under their charge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
