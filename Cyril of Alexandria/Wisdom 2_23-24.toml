[[commentary]]
quote='''
So He wept also over Lazarus, that we again might understand that it grieved Him that the nature of man had fallen under the power of death. For "He created all things to incorruption; but by the envy of the devil death entered into the world:" not indeed because the envy of the devil is more powerful than the will of the Creator, but because it was necessary that there should follow, upon the transgression of the divine commandment, a penalty that would humble to corruption whosoever had despised the law of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
