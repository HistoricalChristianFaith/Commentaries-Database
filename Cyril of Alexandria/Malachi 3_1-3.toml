[[commentary]]
quote='''
It is the custom moreover of the divinely inspired Scripture to give the name of fire sometimes to the divine and sacred words, and to the efficacy and power which is by the Holy Spirit, and whereby we are made, as I said, "fervent in spirit." For one of the holy prophets thus spoke as in the person of God respecting Christ our common Saviour: "The Lord, Whom you seek, shall suddenly come to His temple, even the Messenger of the covenant, Whom you desire: behold He comes, says the Lord. And who shall endure the day of His coming? or who shall stand at the sight of Him? For lo! He comes like the fire of a furnace, and like the sulphur of the bleacher. And He shall sit, like one that smelts and purifies as silver and as gold." Now by the temple he here means the body, holy of a truth and undefiled, which was born of the holy virgin by the Holy Spirit in the power of the Father. For so was it said to the blessed virgin, "The Holy Spirit shall come upon you, and the power of the Highest shall overshadow you." And he styles Him the Messenger of the covenant," because He makes known and ministers unto us the good-will of the Father. For He has Himself said to us, "All things that I have heard of the Father, 1 have made known unto you." And the prophet Isaiah also thus writes respecting Him; "Unto us a Child is born; yes, unto us a Son is given: and His government shall be upon His shoulder: and His name shall be called, The Messenger of the great counsel." Just therefore as those who know how to refine gold and silver, melt out the dross contained in them by the use of fire; so also the Saviour of all cleanses by the doctrines of the Gospel in the power of the Spirit, the mind of all those who have believed in Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
