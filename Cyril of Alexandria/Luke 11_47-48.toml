[[commentary]]
quote='''
(con. Julian. lib. 10.) Now here the apostate Julian says, that we must avoid graves which Christ says are unclean; but he knew not the force of our Saviour's words, for He did not command us to depart from the graves, but likened to them the hypocritical people of the Pharisees.

Having then condemned the burdensome dealing of the Lawyer, He brings a general charge against all the chief men of the Jews, saying, Woe to you who build the tombs of the prophets, and your fathers killed them.

Although then He says pointedly of this generation, He expresses not merely those who were then standing by Him and listening, but every manslayer. For like is attributed to like.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And having thus shown the worthlessness of this abominable crew of lawyers, He goes on to utter a common reproof to all the chiefs of the Jews: "Woe unto you! for you build the sepulchres of the prophets: and your fathers killed them. Therefore you bear witness, and approve of the deeds of your fathers; for they indeed killed them, and you build their sepulchres." Let us then carefully examine what the Saviour means; for what wicked act can we say that they were guilty of in building the tombs of the saints? Were they not rather doing them distinguished honour? What doubt can there be of this? It is necessary therefore to see what it is which Christ teaches us. The ancestors then of the Jews had from time to time put the holy prophets to death, when bringing them the word of God, and leading them unto the right way: but their descendants, acknowledging that the prophets were holy and venerable men, built over them sepulchres or tombs, as bestowing upon them an honour suitable to the saints. Their fathers therefore slew them; but they, as believing that they were prophets and holy men. became the judges of those that slew them. For by determining to pay honour to those who had been put to death, they thereby accused the others of having done wrongfully. But they, who condemned their fathers for such cruel murders, were about to incur the guilt of equal crimes, and to commit the same, or rather more abominable offences. For they slew the Prince of Life, the Saviour and Deliverer of all: and added also to their wickedness towards Him other abominable murders. For Stephen was put to death, not as being accused of any thing base, but rather for admonishing them, and speaking unto them what is contained in the inspired Scriptures. And other crimes besides were committed by them against every saint who preached unto them the Gospel message of salvation.

The lawyers therefore and Pharisees were reproved in every way, as being haters of God, and boastful, and lovers of pleasure more than lovers of God: and as everywhere hating to be saved. For this reason Christ added always that word "woe," as something peculiarly theirs: by Whom and with Whom to God the Father be praise and dominion, with the Holy Spirit, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
