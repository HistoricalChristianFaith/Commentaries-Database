[[commentary]]
quote='''
This the divine Psalmist also prayed might be accomplished, when thus addressing Christ the Saviour of all. "Let sinners perish from off the earth: and the wicked, so that they may not be found." For verily we must not say of one clothed with the Spirit, that he curseth those who are infirm and sinful:----for it is not fitting for the saints to curse any:----but rather that he prays this of God. For before the coming of the Saviour we all were in sin: there was no one who acknowledged Him Who by nature and verily is God. "There was no one doing good, no not one; but they all had turned aside together, and become reprobate." But because the Only-begotten submitted Himself to emptiness, and became flesh, and was made man, sinners have perished, and exist no longer. For the dwellers upon earth have been justified by faith, have washed away the pollution of sin by holy baptism, have been made partakers of the Holy Ghost, have sprung out of the hand of the enemy; and having bidden as it were the hosts of devils to depart, dwell under the yoke of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
