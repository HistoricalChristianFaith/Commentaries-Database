[[commentary]]
quote='''
Those persons therefore who were restored to life by the power of Christ, we take as a pledge of the hope prepared for us of a resurrection of the dead: and these were, this young man, and Lazarus of Bethany, and the daughter of the chief of the synagogue. And this truth the company of the holy prophets proclaimed before: for the blessed Isaiah said, "The dead shall arise, and those in the graves shall be restored to life: for the dew from Thee is healing to them." And by dew he means the life-giving operation of Christ, which is by the instrumentality of the Holy Ghost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
[[commentary]]
quote='''
The prophet Isaiah therefore has said to us, "Your dead men shall arise: and those in the graves shall be raised; and they who are in the earth shall rejoice: for the dew from You is healing to them." And by the dew I imagine he means the life-giving power of the Holy Spirit, and that influence which abolishes death, as being that of God and of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
