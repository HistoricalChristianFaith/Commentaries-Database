[[commentary]]
quote='''
It was their duty to have known the meaning of what had been spoken of old, as being before decreed by God concerning them. For among others are words like these, "My wrath is kindled against the shepherds, and I will visit the lambs." For the wicked shepherds perished miserably: while the calling of those who were obedient to salvation was a kind of visitation; for a remnant of Israel was saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
