[[commentary]]
quote='''
This man represents God the Father just as images are formed to give the resemblance of power. For as often as God wishes to declare His avenging power, He is called by the names of bear, leopard, lion, and others of the same kind; but when He wishes to express mercy, by the name of man. The Maker of all things, therefore, and Father of Glory, or the Lord, prepared the great supper which was finished in Christ.
For in these latter times, and as it were the setting of our world, the Son of God has shone upon us, and enduring death for our sakes, has given us His own body to eat. Hence also the lamb was sacrificed in the evening according to the Mosaic law. Rightly then was the banquet which was prepared in Christ called a supper.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And here let us first of all inquire, what was the reason why it is rather to a supper than a dinner that the guests were invited; or rather, even before this, who is to be understood by the man who sent one to invite to the supper; and who also is the inviter, and who in fine they are who were invited, but despised the summons.

By the man therefore is to be understood God the Father. For similitudes are formed to represent the truth, and are by no means the truth themselves. He therefore, the Creator of the universe, and the Father of glory, made a great supper, that is, a festival for the whole world, in honour of Christ. In the last times then of the world, and. so to speak, at this our world's setting, the Son arose for us: at which time also He suffered death for our sakes, and gave us His flesh to eat, as being the bread from heaven, Which gives life to the world. Towards evening also, and by the light of torches, the lamb was sacrificed, according to the law of Moses. And therefore with good reason the invitation that is by Christ is called a supper.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
