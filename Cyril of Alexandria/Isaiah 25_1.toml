[[commentary]]
quote='''
O COME, all ye who love the glory of the Saviour, and thereby weave crowns for your heads, come once again, that we may rejoice in Him, and as we extol Him with endless praises, let us say in the words of the prophet Isaiah: "O Lord, my God, I will praise Thee; and I will laud Thy name; for Thou hast wrought wonderful works, even a counsel true from the beginning." What then is the counsel and purpose of God the Father, which was from the beginning, and was true? Plainly that respecting us. For Christ foreknew, even before the foundations of the world, His mystery: but it was in the last ages of the world that He arose for the inhabitants of earth, that having borne the sin of the world, He might abolish both it and death, which is its consequence, and was brought upon us by its means. For so He Himself plainly said, "I am the resurrection and the life:" and "he that believeth on Me hath everlasting life, and shall not come into judgment, but hath passed from death unto life."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
