[[commentary]]
quote='''
And what benefit at all is there in living luxuriously? Or rather, will it not bring with it utter destruction? For quickly of a certainty there enter along with luxurious pleasures the infamies of sensuality, and the assaults of base and contemptible lusts;—things whose approach is difficult to combat. And the being clad too in splendid apparel is of no benefit whatsoever. "For consider," He says, "the lilies, how they grow. They toil not, neither do they spin. I tell you, that not even Solomon in all his glory was arrayed like one of these." And this also is true: for both in lilies and other flowers that spring up in the fields, the lustre of the colours possesses an admirable beauty, both by the diversity of the hues, and the variety of the arrangement, as they glitter in their natural purple, or shine with the brilliancy of other colours: but all that is made by the art of man in imitation of them, whether by the painter's skill, or in embroidery, altogether falls short of the reality: and even though it be successful as a work of art, it scarcely even approaches the truth.

If therefore these representations by means of art, are so inferior to the glory of the lily, and the beautiful colours of other flowers, how is it not true, that even Solomon, though so magnificent a king, in all his glory was not arrayed like one of these? Vain therefore is our toil for beautiful apparel. Sufficient is it for men of sense that their raiment being such as necessity requires should be decorous, and easily procurable; and with it such a bare sufficiency of food as merely satisfies the demands of nature. Let their banquet in Christ be sufficient for the saints: a banquet spiritual, divine, and intellectual: and the glory that will follow. "For He shall change the body of our humiliation into the likeness of the body of His glory;" and as He Himself says, " They shall shine like the sun in the glory of their Father." What garments therefore are not surpassed in splendour by the magnificence that is in Christ?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
