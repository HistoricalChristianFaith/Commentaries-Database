[[commentary]]
quote='''
At this one of the saints very beautifully expressed his admiration, thus saying somewhere to us, or rather to all the sons of men; "For in that you are righteous, what will you give Him? Or what will He receive at your hand? Your wickedness is to the man that is your equal: and your righteousness to the son of man." Our deeds then are indeed done, as I said, to those who are our fellows and brethren, but God takes it to Himself, because He is loving to man, and counts it as spiritual fruitfulness, in order that He may have an occasion of showing mercy upon those who habitually thus act, and may free them from all sin. For it is written, that mercy glories against judgment."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
