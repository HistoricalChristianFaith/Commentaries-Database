[[commentary]]
quote='''
Away then with this pleasure-loving wealth; this parent of base lusts; this inciter to carnal impurity; this friend of covetousness; this worker of boasting: which, as with indissoluble bonds, chains the human mind in effeminacy and indolence towards all that is good, and stretches out, so to speak, a stiff and haughty neck against God: for it yields not itself to that yoke which would lead it unto piety. And be gentle, and merciful, ready to communicate, and courteous. For the Lord is true, Who says; "that where your treasure is, there is your heart also." For the whole earnestness of those who value these temporal things is set upon them; while those who wish for that which is in heaven, direct thither the eye of the mind. Bo therefore, as I said, friendly to your companions, and merciful. And the blessed Paul makes me speak unto you, where he writes; "Charge them who are rich in this world, that they be not high-minded, nor trust in riches, wherein is no reliance, but on God, Who gives us all things richly to enjoy: that they do good: that they be rich in good works, ready to give, and willing to share with others; laying up for themselves treasures that shall be a good foundation for that which is to come, that they may lay hold upon true life." These are the things which, if we earnestly practise, we shall become heirs of the kingdom of heaven, by Christ; by Whom and with Whom to God the Father be praise and dominion, with the Holy Spirit, for ever and over, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
