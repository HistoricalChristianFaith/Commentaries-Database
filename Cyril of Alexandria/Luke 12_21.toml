[[commentary]]
quote='''
It is true therefore, that a man's life is not from his possessions, by reason of his having a superfluity: but very blessed, and of glorious hope is he who is rich towards God. And who is he? Evidently one who loves not wealth, but virtue rather, and to whom few things are sufficient: and whose hand is open to the necessities of the indigent, comforting the sorrows of those in poverty, according to his means, and the utmost of his power. It is he who gathers in the storehouses that are above, and lays up treasures in heaven. Such a one shall find the usury of his virtue, and the recompense of his upright and blameless life; Christ shall bless him: by Whom, and with Whom, to God the Father be praise and dominion with the Holy Spirit, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
