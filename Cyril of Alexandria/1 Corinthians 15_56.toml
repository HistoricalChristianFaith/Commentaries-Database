[[commentary]]
quote='''
Now what is meant by the condemnation of death, and by its sting also, the blessed Paul has taught us, saying, "But the sting of death is sin: and the strength of sin is the law." For he compares death to a scorpion, the sting of which is sin: for by its poison it slays the soul. And the law, he says, was the strength of sin: for so he himself again elsewhere protests, saying, "I had not known sin but by the law:" "for where there is no law, there is no transgression of the law." For this reason Christ has removed those who believe in Him from the jurisdiction of the law that condemns: and has also abolished the sting of death, even sin: and sin being taken away, death, as a necessary consequence, departed with it; for it was from it, and because of it, that death came into the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
