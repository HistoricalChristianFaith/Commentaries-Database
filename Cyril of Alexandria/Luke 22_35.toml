[[commentary]]
quote='''
Our Lord had foretold to Peter that he should deny Him; namely, at the time of His being taken. But having once made mention of His being taken captive, He next announces the struggle that would ensue against the Jews. Hence it is said, And he said unto them, When I sent you without purse, &c. For the Saviour had sent the holy Apostles to preach in the cities and towns the kingdom of heaven, bidding them to take no thought of the things of the body, but to place their whole hope of salvation in Him.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And He said to them, When I sent you without purse and without bag and shoes, lacked you anything? And they said, Nothing. And He said to them, But now, he that has a purse, let him take it: and in like manner also a bag: and he that has not one, let him sell his garment, and buy a sword. For I say to you, that this that is written must be accomplished in Me, that he was numbered also with the transgressors. For that which concerns Me has an end. And they said, Lord, behold here are two swords. And He said to them, It is enough.

THE blessed Moses impressed the fear of God upon the Israelites by saying, "It is a fearful thing to fall into the hands of the living God: for our God is a consuming fire." And another holy prophet has also said concerning Him, "His wrath consumes the princes, and the rocks are melted at Him." Moreover the blessed David says of Him somewhere in the Psalms, "You are to be feared, and who shall rise up before You at Your wrath?" For what power of man, or of ought whatsoever that is created, can stand against the irresistible force of Almighty God? But His wrath does not descend upon any righteous man whatsoever;—for God does not commit injustice;—but upon those rather whose sins are numerous and intolerable, and their wickedness beyond bounds.

And as an example of what we have said, take that which happened to the Jewish multitudes after Christ rose from the dead, and ascended up to heaven. For God the Father sent to them His Son, inviting them to a service superior to the law, and to the knowledge of all good: He sent Him to free them from all guilt, and deliver them from the stains of sin; to bring them to the adoption of sons, to glory, to honour, and to the communion of the Holy Spirit; to life incorruptible; to never-ending glory; and to the kingdom of heaven. But though they ought eagerly to have hastened to this grace, and with grateful praises have honoured Him Who came to aid them, and joyfully have accepted the grace that is by faith, they did verily nothing of the kind, but betook themselves to the very reverse: for they rose up against Him, setting Him at nought by their disobedience, reviling even His divine signs, and after doing and saying every thing that was abominable, finally they crucified Him. And so it became their lot to suffer those things which the company also of the holy prophets had before proclaimed. For one of them said, "God shall put them far away, because they did not hear Him, and they shall be wanderers among the nations." And again, "Because Jerusalem is forsaken, and Judah is fallen, and their tongues are with iniquity; they disobey the Lord; therefore now is their glory brought low, and the shame of their faces has stood up against them." And in another place they are thus addressed as in the person of God over all; " And now, because you have done all these works, and I spoke to you and you did not hear, and I called to you and you answered not: therefore will I do to this house, on which My name is called, and wherein you trust; and to this place which I have given to you and to your fathers as I did to Shilom: and I will cast you from before My face, as I cast away your brethren, even the whole seed of Ephraim." For they were delivered up, as I have said, to desolation, and were dispersed over all the earth, their temple being consumed with fire, and all Judaea taken captive.

That this would be the case Christ had before announced to the disciples, the occasion which caused Him to speak upon this subject being some such as follows: He had forewarned the admirable Peter, that he would thrice deny Him, at the time namely of His seizure, when the band of Pilate's soldiers with the officers of the Jews brought Him to the chief priests for judgment: for there Peter denied Him. And inasmuch as mention had now once been made of His seizure, and of his being taken before Caiaphas, there naturally followed upon this allusion a reference to that also which was next to come to pass, even His passion upon the cross: and then it was that He foretold the war about to burst upon the Jews, and which with unendurable violence spread like some river over all their land. On this account He says; "When I sent you without purse and without bag and shoes, lacked you anything? And they said, No." For the Saviour sent the holy apostles, with the command to preach to the inhabitants of every village and city the gospel of the kingdom of heaven, and to heal every grief and every sickness among the people. And on their journey He bade them not to occupy themselves with things that concern the body, but rather without baggage and unencumbered, and resting all their hope of sustenance on Him, so to traverse the land: and this they also did, making themselves an example of praiseworthy and apostolic conduct.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
