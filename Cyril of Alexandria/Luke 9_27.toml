[[commentary]]
quote='''
But I say unto you truly, there are some of those standing here who shall not taste of death, until they have seen the kingdom of God. And there were after these things about eight days, and He took Peter, and John, and James, and went up to the mountain to pray. And while He was praying, the look of His countenance was altered, and His raiment was white, shining like lightning: and behold! two men talked with Him, who were Moses and Elijah: who having appeared in glory, spake of His departure, that He was about to accomplish at Jerusalem. But Peter and they that were with him were heavy with sleep: but having roused themselves, they both saw His glory, and the two men that stood with Him. And it came to pass, that when they were separating from Him, Peter said unto Jesus, Master, it is good for us to be here: and let us make three tabernacles, one for Thee: and one for Moses: and one for Elijah: not knowing what he said. While he spake these things, there came a cloud, and overshadowed them; and they feared as they entered the cloud. And there was a voice from the cloud, saying, This is My beloved Son, hear Him. And when there was the voice, Jesus was found alone; and they kept silence, and told no man in those days ought of the things they had seen.

THOSE who are skilful in the combat rejoice when the spectators clap their hands, and are roused to a glorious height of courage by the hope of the chaplets of victory: and so those whoso desire it is to be counted worthy of the divine gifts, and who thirst to be made partakers of the hope prepared for the saints, joyfully undergo combats for piety's sake towards Christ, and lead elect lives, not setting store by a thankless indolence, nor indulging in a mean timidity, but rather manfully resisting every temptation, and setting at nought the violence of persecutions, while they count it gain to suffer in His behalf. For they remember that the blessed Paul thus writes, "The sufferings of this present time are not worthy of the glory that is about to be revealed in us."

Observe, therefore, how perfectly beautiful is the method which our Lord Jesus Christ uses here also for the benefit and edification of the holy Apostles. For He had said unto them, "Whosoever will come after Me, let him deny himself and take up his cross every day, and follow Me. For he that will save his life shall lose it; and he that will lose his life for My sake shall find it." The commandment is indeed both for the salvation and honour of the saints, and the cause of the highest glory, and the means of perfect joy: for the choosing to suffer for the sake of Christ is not a thankless duty, but on the contrary makes us sharers in everlasting life, and the glory that is prepared. But as the disciples had not yet obtained power from on high, it probably occasionally happened, that they also fell into human weaknesses, and when thinking over with themselves any such saying as this, may have asked "how does a man deny himself?" or how having lost himself does he find himself again? And what reward will compensate those who thus suffer? Or of what gifts will they be made partakers? To rescue them therefore from such timid thoughts, and, so to speak, to mould them unto manliness, by begetting in them a desire of the glory about to be bestowed upon them, He says, "I say unto you, there are some of those standing here, who shall not taste of death until they have seen the kingdom of God." Does He mean that the measure of their lives will be so greatly prolonged as even to reach to that time when He will descend from heaven at the. consummation of the world, to bestow upon the saints the kingdom prepared for them? Even this was possible for Him: for He is omnipotent: and there is nothing impossible or difficult to His all-powerful will. But by the kingdom of God He means the sight of the glory in which He will appear at His manifestation to the inhabitants of earth: for He will come in the glory of God the Father, and not in low estate like unto us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
