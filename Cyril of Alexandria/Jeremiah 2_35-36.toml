[[commentary]]
quote='''
And besides this we say, that it makes God angry for us to imagine that we are free from all impurity: for He is even found saying to one of those who led polluted lives, "Behold I have a lawsuit with you because you say I have not sinned, in that you have acted very contemptuously in repeating your ways." For the repetition of the way to sin is for us, when we are overtaken by offences, to refuse to believe that we are guilty of the defilement which arises from them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
