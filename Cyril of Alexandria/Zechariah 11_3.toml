[[commentary]]
quote='''
And, as if already, so to speak, they had fallen into ruin and destruction, and were wailing and weeping on this account, the prophet hoard, he says, "the voice of shepherds wailing, because their might was brought low: the voice of lions roaring, because the pride of Jordan was spoiled." He calls the lions the pride of Jordan, by whom wore figured the chiefs of the Jewish synagogue: who, in just requital of their wickedness against Christ, wailed with their fathers and children, being consumed as with fire and sword, while the temple at Jerusalem was also burnt, and the cities throughout all Judaea abandoned to utter desolation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
