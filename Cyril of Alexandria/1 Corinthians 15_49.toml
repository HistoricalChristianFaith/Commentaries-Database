[[commentary]]
quote='''
And of this Paul is witness, who thus writes: "For as we have been clothed with the image of the earthy, we shall also be clothed with the image of the heavenly:"—meaning by the earthy man, Adam, the first created: but by the heavenly, the Word Who is from above, and Who shone forth from the substance of God the Father, but was made, as I said, in our likeness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
