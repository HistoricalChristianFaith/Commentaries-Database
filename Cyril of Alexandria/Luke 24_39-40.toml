[[commentary]]
quote='''
Here then was a most evident sign that He whom they now see was none other but the same whom they had seen dead on the cross, and lain in the sepulchre, who knew every thing that was in man.

Now our Lord testifying that death was overcome, and human nature had now in Christ put on incorruption, first shows them His hands and His feet, and the print of the nails; as it follows, Behold my hands and my feet, that it is I myself.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And to prove moreover in another way that both death is conquered, and that human nature has put off corruption in Him as the foremost, He shows His hands and His feet, and the holes of the nails, and permits them to handle Him, and in every way convince themselves that the very body which had suffered was, as I said, risen. Let no one therefore cavil at the resurrection: and though you hear the sacred Scripture say of the human body, that "it is sown an animal body, it is raised a spiritual body," do not deny the return even of human bodies to incorruption. For as the animal is that which follows after, and is subject to animal, that is, to fleshly lusts, so also the spiritual is that which submits itself to the will of the Holy Spirit. For after the resurrection from the dead, there will be no longer the opportunity for carnal affection, but, the goad of sin will be entirely powerless. That very (body) therefore which has been brought down to the earth, shall be clothed with incorruption.

That the disciples therefore might be quite sure that it is the very same Who suffered and was buried and rose again, He shows, as I said, both His hands and feet: and He bids them be fully convinced that it is not a spirit, as they thought, but rather in very truth a body, saying, "And you see that a spirit has not flesh and bones, as you see Me have." For a shadow and spirit and apparition merely could not endure the touch of the hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
