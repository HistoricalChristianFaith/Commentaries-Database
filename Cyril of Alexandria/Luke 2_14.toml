[[commentary]]
quote='''
Look not therefore upon Him Who was laid in the manger as a babe merely, but in our poverty see Him Who as God is rich, and in the measure of our humanity Him Who excels the inhabitants of heaven, and Who therefore is glorified even by the holy angels. And how noble was the hymn, "Glory to God in the highest, and on earth peace, and among men good will!" For the angels and archangels, thrones and lordships, and high above them the Seraphim, preserving their settled order, are at peace with God: for never in any way do they transgress His good pleasure, but are firmly established in righteousness and holiness. But we, wretched beings, by having set up our own lusts in opposition to the will of our Lord, had put ourselves into the position of enemies unto Him. But by Christ this has been done away: for He is our peace; for He has united us by Himself unto God the Father, having taken away from the middle the cause of the enmity, even sin, and so justifies us by faith, and makes us holy and without blame, and calls near unto Him those who were afar off: and besides this, He has created the two people into one new man, so making peace, and reconciling both in one body to the Father. For it pleased God the Father to form into one new whole all things in Him, and to bind together things below and things above, and to make those in heaven and those on earth into one flock. Christ therefore has been made for us both Peace and Goodwill; by Whom and with Whom to God the Father be glory and honour and might with the Holy Ghost, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
