[[commentary]]
quote='''
But Christ brings a severe charge against the Lawyers, and subdues their foolish pride, as it follows, And he said, Woe unto you also, ye Lawyers, for ye lade men, &c. He brings forward an obvious example for their direction. The Law was burdensome to the Jews as the disciples of Christ confess, but these Lawyers binding together legal burdens which could not be borne, placed them upon those under them, taking care themselves to have no toil whatever.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Nothing however of this sort enters the mind of the lawyers, but they venture even to say; "In speaking these things, You reproach us also:" ignorantly giving the name of reproach to a reproof which was for their benefit and advantage. What then does Christ reply? He makes His reproof yet more severe, and humbles their empty pride, thus saying; "Also to you, lawyers, woe! for you burden men with burdens heavy and grievous to be borne: and you yourselves touch not the burdens with one of your fingers." He frames His argument against them out of a plain example. For the law was confessedly grievous to the Israelites, as the divine disciples also acknowledged. For they even rebuked those who were endeavouring to make such as had already believed desire to return to the legal ritual: for they said; "And now why tempt you God, to put a yoke upon the neck of the disciples, which neither we nor our fathers were able to bear? And the Saviour Himself taught us this, crying out and saying; "Come unto Me, all you weary, and heavy laden; and I will give you rest. Take My yoke upon you, and learn of Me; for I am meek and lowly in heart; and you shall find rest for your-selves." Weary then and heavy laden are those, He says, who are under the law: while He calls Himself meek, as though the law had nothing in it of this character. For, as Paul says; "Whosoever has despised Moses' law is put to death without mercy at the mouth of two or three witnesses." Woe to you, therefore, He says, O lawyers: for while you bind burdens grievous to be borne, and intolerable to carry, and lay them on those who are under the law, you yourselves will not touch them. For while commanding that the ordinance of Moses should be kept inviolate, and passing sentence of death upon any who despise it, they themselves paid not the slightest heed to the duty of performing its precepts. As accustomed thus to act, the wise Paul also rebukes them, saying; "Behold you are called a Jew, and rest in the law, and make your boast of God; and know His will, and discern the things that are more excellent, being instructed by the law; and are confident of thyself, that you are a guide of the blind; an instructor of those without understanding; a teacher of babes; and that you have the form of knowledge and of truth in the law. You therefore that teach others, teach you not thyself? you that say that men should not steal, do you steal? you that say that men should not commit adultery, do you commit adultery? And you that despise idols, do you plunder the sanctuary? And you that boast in the law, by the transgression of the law despise you God?" For the teacher is rejected with infamy when his conduct does not agree with his words. Upon him our Saviour also passes the sentence of severe punishment: "for whosoever," He says, "has taught and done, shall be called great: but whosoever shall teach and not do, he shall " be called small in the kingdom of heaven." And for the same reason the disciple of the Saviour also writes to us; "Let there not be many teachers among you, my brethren; knowing that we shall receive the greater condemnation. For in many things we all of us commit wrong."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
