[[commentary]]
quote='''
For that they were to be caught in Christ's net, He teacheth thee where He saith by one of the holy prophets, "For this wait for Me, saith the Lord, until the day of My rising up to bear witness, because My judgment is for the congregations of the heathen." For when Christ rose from the dead, He bestowed on those that were in error that judgment which is for their happiness and salvation. For He even commanded the holy disciples, "Go make disciples of all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost: and teaching them to observe all those things that I have commanded you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
