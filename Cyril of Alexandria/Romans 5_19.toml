[[commentary]]
quote='''
For let us see, if you will, even from the writings of Moses, the grief to which disobedience has brought us. We have been driven from a paradise of delights, and have also fallen under the condemnation of death; and while intended for incorruption:----for so God created the universe:----we yet have become accursed, and subject to the yoke of sin. And how then have we escaped from that which befel us, or Who is He that aided us, when we had sunk into this great misery? It was the Only-begotten Word of God, by submitting Himself to our estate, and being found in fashion as a man, and becoming obedient unto the Father even unto death. Thus has the guilt of the disobedience that is by Adam been remitted: thus has the power of the curse ceased, and the dominion of death been brought to decay. And this too Paul teaches, saying, "For as by the disobedience of the one man, the many became sinners, so by the obedience of the One, the many became righteous." For the whole nature of man became guilty in the person of him who was first formed; but now it is wholly justified again in Christ. For He became for us the second commencement of our race after that primary one; and therefore all things in Him have become new. And Paul assures of this, writing, "Therefore every man who is in Christ is a new creation; and the former things have passed away: behold, they have become new."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
