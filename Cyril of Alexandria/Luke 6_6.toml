[[commentary]]
quote='''
But He taught things far beyond their comprehension, and opened to his hearers the way to future salvation by Him; and then after having first taught them, He suddenly showed His divine power, as it follows, and there was a man there whose right hand was withered.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And He was teaching: and there was a man there whose right hand was withered.

But His teaching was ever of things too high for reason, and such as made plain to His hearers the pathway of salvation opened through Him: and immediately after His teaching He displayed His godlike power, having first by words smoothed, as it were, the road to belief. For the miracle sometimes converts unto faith those who had disbelieved the word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
