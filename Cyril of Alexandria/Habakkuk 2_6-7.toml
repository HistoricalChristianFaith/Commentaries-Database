[[commentary]]
quote='''
God also makes mention of them by the voice of Jeremiah, saying of the enemy of all, even Satan; "Woe to him, who multiplieth for himself that which is not his, and maketh his collar thick and heavy: for suddenly shall they arise that shall bite him, and thy adversaries shall wake up, and thou shalt be their prey." For Satan had gathered unto him all the inhabitants of the earth, though they were not his, and had caused them to be his worshippers, making his collar heavy: but those who were to plunder his goods woke up: for the net of the apostolic teaching caught all those that were in error, and brought back unto God the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
