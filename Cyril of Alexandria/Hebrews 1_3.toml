[[commentary]]
quote='''
Does not the divine Word [Scripture] indicate to us that the Son exists in the form of God, and does it not say that he is the image and stamp of the one who begot him?
'''
source_url=''
source_title="ON THE INCARNATION 686"


[[commentary]]
quote='''
He continues with the following words: "When he had made purification for sins, he sat down at the right hand of the Majesty on high, having become as much superior to angels as the name he has obtained is more excellent than theirs." Having demonstrated that he is the stamp of the Father's hypostasis and, indeed, the brightness of his glory, he necessarily passes over to the economy of the incarnation, through which we have been saved and enriched by the forgiveness of sins and sanctified through his blood.
'''
source_url=''
source_title="COMMENTARY ON HEBREWS"

[[commentary]]
quote='''
And in another way: as most wise Paul, says, "He is the image of the invisible God:" and the image, because He displays in His own nature the beauty of Him Who fathered Him. How therefore can we see in the Son, Who is not good, the Father, Who is by nature and truly good? "He is the brightness and likeness of His person:" but if He be not good, as the senseless heretic asserts, but the Father is by nature good, it is a brightness different in nature, and that possesses not the splendour of Him Who bade it shine. And the likeness too is counterfeit, or rather is now no likeness at all: for it represents not Him Whose likeness it is, if, as all must allow, that which is not good is the contrary of that which is good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
