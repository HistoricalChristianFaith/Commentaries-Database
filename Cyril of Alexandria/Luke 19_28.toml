[[commentary]]
quote='''
And when He had said these things, He went onwards, going up to Jerusalem. And it came to pass, that when He was come close to Bethphage and Bethany, at the mount called of Olives, He sent two of His disciples, saying, Go into the village over against us, in which at your entering you shall find a colt, tied, whereon yet never man sat: loose, and bring it. And if any man ask you, Why loose you it? thus shall you say to him, It is wanted for the Lord. And when they that were sent had gone their way, they found even as He had said to them. And as they loosed the colt, the owners thereof said to them, Why loose you the colt? And they said, It is wanted for the Lord. And they brought it to Jesus: and when they had cast their garments upon the colt, they made Jesus ride thereon: and as He went, they spread their garments before Him in the way. And when He had now arrived at the descent of the Mount of Olives, the whole multitude of the disciples began with joy to praise God with a loud voice for all the mighty works that they had seen, saying, Blessed be the King that comes in the name of the Lord: peace in heaven, and glory in the highest. And some of the Pharisees from among the multitude said to Him, Teacher, rebuke Your disciples. And He answered, and said to them, I tell you, that if these be silent, the stories will cry out.

THE disciples praise Christ the Saviour of all, calling Him King and Lord, and the peace of heaven and earth: and let us also praise Him, taking, so to speak, the Psalmist's harp, and saying; "How great are your works, O Lord: in wisdom have You made them." For there is nothing whatsoever of the works wrought by Him but is in wisdom; for He guides all useful things each in its proper manner, and assigns to his acts that season which suiteth them. As long then as it was fitting that He should traverse the country of the Jews, endeavouring to win by lessons and admonitions superior to the law many to the grace that is by faith, He ceased not so to do: but inasmuch as the time was now at length calling Him to that Passion which was for the salvation of the whole world, to free the inhabitants of the earth from the tyranny of the enemy, and abolish death, and destroy the sin of the world, He goes up to Jerusalem, pointing out first to the Israelites by a plain fact, that a new people from among the heathen shall be subject to Him, while themselves are rejected as the murderers of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
