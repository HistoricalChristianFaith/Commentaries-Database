[[commentary]]
quote='''
The Pharisee, while our Lord still continued on speaking, invites Him to his own house. As it is said, And while he was speaking, a certain Pharisee besought him to dine with him.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And as He was speaking, a certain Pharisee besought Him to dine with him: and He went in and lay down to meat. But the Pharisee, when he saw it, wondered that He had not first washed before dinner. But the Lord said unto him, Now do you Pharisees make clean the outside of the cup and the dish,, but that which is within you is full of rapine and wickedness. O you little-minded, did not He Who made that which is without, make that which is within also? But whatever there is give as alms, and behold! every thing is clean unto you.

THE very wise Paul truly tells us, that "Christ came into the world to save sinners." For this was His aim, and for this purpose He humbled Himself to the emptying of His glory, and appeared upon earth in the flesh, and conversed with men. For it was right, that as being the Creator and Lord of all, He should give a saving hand to those who had fallen into sin, and show unto them that were wandering in error, a pathway that would lead them straight unto every good work, and the excellence of virtuous deeds. And it is said somewhere also by one of the holy prophets, concerning those who have been called by faith to the knowledge of His glory "And they shall be all taught of God." How, therefore, does He lead us into every thing that is useful? By humbling Himself to be with sinners, and condescending sometimes even to those things that He would not, that so He might save many. That this was the case we may see by the lessons from the gospel now set before us; for one of the Pharisees, it says, besought Him to dine at His house: "and He went in, and lay down to meat." And yet how is it not plain to every one, that the gang of the Pharisees were always wicked and impure, hateful to God, and envious, ready for anger, of innate pride, and ever bold of speech against Christ the Saviour of us all? For they found fault with His divine miracles, and gathering wicked troops of counsellors, plotted His death. How then did He become their guest? Was He not aware of their maliciousness? But how can this be safely affirmed? For as God He knowcth all things. What therefore is the explanation? It is this, that He was especially anxious to admonish them, therein resembling the most excellent physicians. For they apply the remedies of their are to those who are most dangerously ill, struggling against the disease under which they suffer, and assuaging its cruel attacks. As they therefore without restraint gave way to an infatuated mind, it was necessary for Christ to speak unto them what was requisite and useful for their salvation. For as He Himself somewhere says, "He came not to call the righteous, but sinners to repentance." And again He also said, that "they who are whole need not a physician, but they who are sick."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
