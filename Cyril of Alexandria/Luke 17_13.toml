[[commentary]]
quote='''
The lepers then having met the Saviour, earnestly besought Him to free them from their misery, and called Him Master, that is, Teacher.

No one pitied them when suffering this malady: but He Who had appeared on earth for this very reason, and had become man that He might show pity unto all, He was moved with compassion for them, and had mercy upon them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
