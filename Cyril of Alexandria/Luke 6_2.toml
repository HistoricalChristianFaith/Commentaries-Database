[[commentary]]
quote='''
But the Pharisees and Scribes not knowing the Holy Scriptures agreed together to find fault with Christ's disciples, as it follows, And certain of the Pharisees said unto them, Why do ye, &c. Tell me now, when a table is set before you on the sabbath day; do you not break bread? Why then do you blame others?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Why do ye that which is not lawful to do on the sabbaths?

Yet a new covenant God promiseth us, now that "the first hath waxed old and is near to vanish away," according to the words of the divine Paul. Yea, He even says by one of tho holy prophets, "Behold the days come, saith the Lord, when I will perfect with the house of Israel, and with tho house of Judah, a new covenant: not according to the covenant which I made with their fathers in tho day when I took hold of their hand to bring them out of the land of Egypt." If therefore the new covenant is the second, and different from the first, there is every necessity for those who wish to live according to it, to abandon the old laws, and conform to those which will guide them into the newness of the gospel polity. But of all this we can see that the Scribes and Pharisees comprehended nothing: for being altogether destitute of knowledge of the sacred Scriptures, they had but one sole purpose, on every occasion to find fault with the divine and heavenly preaching. They lie in wait therefore for the holy apostles in their constant attendance upon our common Saviour Christ, and tell Him concerning them; "Behold we see those who are under Thy instruction acting contrary to the precepts of the law: for they do what it is not lawful to do on the sabbaths: for while the law enjoins men to do no work on the sabbath, and to meddle with no labour whatsoever, tho disciples are rubbing ears of corn with their hands." But tell me, dost not thou thyself, when setting thy sabbath meal, break the bread? Why then dost thou blame others? But that we may use against thee the bulwark of the Saviour's words, listen;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
