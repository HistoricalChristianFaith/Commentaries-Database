[[commentary]]
quote='''
"Which of you that has a hundred sheep, and has lost one of them, will not leave the ninety-nine in the mountain, and go and seek that which has gone astray? And if he chance to find it, verily I say unto you, that he rejoices more in it, than in the ninety-nine which went not astray." For the multitude of rational created beings which form Christ's flock in heaven and on earth is innumerable, and so great as even to mount up unto a perfect number. For this is what is signified to us by the term "one hundred." The companies then of the holy angels are the ninety-nine; for, as I said, they are many: but the flock on earth is one, but yet useful to complete the number, and sought for also by Christ. Did He then seek it as that which was lost, or as that which had not yet suffered this? But it is plain that that which is lost is sought for. In what manner then had it been lost? By being brought down into sin: by wandering from the divine will, and going far astray from the universal Shepherd.

But none of these things moved the Pharisees: on the contrary, they find fault with them to the disciples; for listen,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
