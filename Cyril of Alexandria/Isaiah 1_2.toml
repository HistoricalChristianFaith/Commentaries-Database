[[commentary]]
quote='''
THE God of all, blaming the haughtiness of the Jews, and their constant tendency to run into disobedience, thus spoke by the voice of Isaiah; "Hear, O heavens, and give ear, O earth; for the Lord has spoken. I have begotten, and brought up sons; and they have rejected Me." For they rejected God the Father, by setting in manifold ways the Son at nothing, Who, though sprung from Him by nature, yet afterwards was made like unto us for our sakes: and yet He called them unto the grace that is by faith, and would have fulfilled the promise given unto their fathers. For of this the sacred Paul bears witness, where he writes, "For I say that Christ was a minister of the circumcision, to fulfil the promises of the fathers: and that the Gentiles might glorify God for mercy." The Only-begotten Word of God therefore was made man, that He might fulfil the promise of the blessing granted unto them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
