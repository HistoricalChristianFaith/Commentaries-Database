[[commentary]]
quote='''
THE very wise Paul truly tells us, that "Christ came into the world to save sinners." For this was His aim, and for this purpose He humbled Himself to the emptying of His glory, and appeared upon earth in the flesh, and conversed with men. For it was right, that as being the Creator and Lord of all, He should give a saving hand to those who had fallen into sin, and show unto them that were wandering in error, a pathway that would lead them straight unto every good work, and the excellence of virtuous deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
