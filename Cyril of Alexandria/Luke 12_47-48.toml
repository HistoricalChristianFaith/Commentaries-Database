[[commentary]]
quote='''
And that bitter and inevitable punishment is threatened against those who are slothful in this duty, the Saviour immediately showed, by adding to what had been already said two examples one after the other. "For the servant," He says, "who knew his master's will, and did it not, neither prepared according to his will, shall be beaten with many stripes: but he who knew it not, and did things worthy of stripes, shall be beaten with few stripes." Now the guilt is indisputable in the case of him who knew his master's will, but afterwards neglected it, and did nothing that was fitting, and which it was his duty to do. For it is manifest contumely, and therefore the many stripes. But for what reason were the few stripes inflicted on him who neither knew nor did his master's will? For some one, for instance, may say, How can he who knew it not be guilty? The reason is, because he would not know it, although it was in his power to learn. But if he who is. entirely ignorant of it does not escape from anger, because when it was his duty to know he neglected the means of learning, what plea can deliver him from justly bearing many stripes, who knew, and disregarded it? "For unto whomsoever much is given, of him shall be much required: and to whom men have committed much, of him they will require the more."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
