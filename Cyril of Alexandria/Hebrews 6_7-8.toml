[[commentary]]
quote='''
Now though the argument already brought forward is sufficient for the persuasion of right-thinking men, yet I will add for their advantage that also which is correctly said in the words of the blessed Paul: "For the land that hath drunk in the rain that hath come oft upon it, and bringeth forth the root serviceable for them for whose sake it is tilled, receiveth a blessing from God. But if it bring forth thorns and thistles, it is rejected, and is nigh unto cursing: and its end is to be burnt." For like rain, the Saviour sendeth down upon the hearts of those who hear, the word of spiritual consolation; even the sacred doctrine of salvation. If then a man be possessed of understanding, he will bring forth the fruits of an abundant intellectual harvest: but if he be careless and negligent, he of course has no claim to the praises of virtue, and instead of grapes will bring forth thorns.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
