[[commentary]]
quote='''
"And no man puts now wine into old skins." The heart of the Jews then is an old skin, and therefore cannot hold the new wine: for this is the saving commandment of the Gospel, making glad the heart of man. But Christ hath filled us with these great blessings, by bountifully endowing us with spiritual gifts, and opening the pathway wide unto all virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
