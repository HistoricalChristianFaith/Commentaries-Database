[[commentary]]
quote='''
For He is our Mediator, our Propitiation, our Comforter, and the Bestower of every request, it is our duty therefore to "pray without ceasing," according to the words of the blessed Paul, as well knowing, and being thoroughly assured, that He Whom we supplicate is able to accomplish all things. "For let a man, it says, ask in faith, in nothing divided: for he who is divided is like a wave of the sea, troubled and blown about by the wind. For let not, it says, that man think that he will receive anything of the Lord." For he that is divided is really guilty of mockery: for if you do not believe that He will incline unto you, and gladden you, and fulfil your request, do not draw near to Him at all, lest you be found an accuser of the Almighty, in that you foolishly art divided. We must avoid therefore so base a malady.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
