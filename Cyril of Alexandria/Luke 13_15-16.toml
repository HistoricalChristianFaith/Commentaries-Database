[[commentary]]
quote='''
Now the ruler of the synagogue is convicted a hypocrite, in that he leads his cattle to watering on the Sabbath-day, but this woman, not more by birth than by faith the daughter of Abraham, he thought unworthy to be loosed from the chain of her infirmity. Therefore He adds, And ought not this woman, being a daughter of Abraham, whom Satan has bound, lo, these eighteen years, to be loosed from this bond on the sabbath-day? The ruler preferred that this woman should like the beasts rather look upon the earth than receive her natural stature, provided that Christ was not magnified.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
You hypocrite! does not each one of you on the sabbath loose his ox or his ass from the stall, and lead him away to watering?

You wonder, He says, at Me, Who have loosed a daughter of Abraham; and yet you give rest to your ox and your ass, loosing them from their labours, and leading them away to watering: but when a human being suffering from sickness is marvellously healed, and God has shown mercy, you blame both as transgressors: the One for having healed, and the other for being delivered from her malady.

Behold, I pray, the ruler of the synagogue, how a human being is of less account in his sight than a beast, since at least he counts his ox and his ass worthy of care on the sabbath, but in his envy would not have Christ deliver from her infirmity the woman who was bowed together, nor wishes her to recover her natural form.

But the envious ruler of the synagogue would have preferred the woman who was made straight to be bowed down after the manner of four-footed beasts, rather than that she should recover the form fitting for man; having no other view than that Christ might not he magnified, nor he proclaimed as God by His deeds. But he is convicted of being a hypocrite, if at least he leads his dumb cattle upon the sabbath to watering, but is indignant that this woman, who was a daughter of Abraham by descent, and still more by her faith, should be freed from the chain of her infirmity. For he considers her deliverance from sickness as a transgression of the sabbath.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
