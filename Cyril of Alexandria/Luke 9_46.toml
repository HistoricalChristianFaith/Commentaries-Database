[[commentary]]
quote='''
(non occ.) The devil lays plots of various kinds for them that love the best way of life. And if indeed by carnal allurements he can gain possession of a man's heart, He sharpens his love of pleasure; but if a man has escaped these snares, he excites in him a desire of glory, and this passion for vain-glory had seized some one of His apostles. Hence it is said, Then there arose a reasoning among them, which of them should be the greatest. For to have such thoughts, belongs to him who desires to be superior to the rest; but I think it improbable that all the disciples gave way to this weakness; and therefore suppose that the Evangelist, not to seem to lay the charge to any individual, expresses himself indefinitely, saying, that there arose a reasoning among them.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And there entered a thought among them, which of them is the greatest. And Jesus, knowing the thought of their heart, took a child, and set him by Him, and said unto them, Whosoever shall receive this child in My name, receiveth Me: and whosoever receiveth Me, receiveth Him Who sent Me. For he that is least among you all, shall be the chief.

YE who are zealous after spiritual skilfulness, and thirst for the communication of the sacred doctrines, receive once again the things ye love. And it is no earthly teacher Who leads you to the gainful booty, nor one like unto us Whom ye obtain as your guide, but the Word of God, Who came down from above, even from heaven, and is the true light of heaven and earth. For the whole rational creation is illuminated by His means, inasmuch as He is the giver of all wisdom and understanding. From Him we receive all knowledge of virtue, and the perfect ability to perform good works such as become saints. For, as Scripture saith, "we are taught of God." And the passage just laid before us bears witness also to what I have said. "For there entered," it says, "a thought among them:"----that is, among the holy Apostles,----"which of them is chief."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
