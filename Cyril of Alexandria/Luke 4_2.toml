[[commentary]]
quote='''
Lo! He appears among the combatants, Who as God bestows the prize: among those who wear the chaplet of victory is He Who crowns the heads of the saints. Let us behold therefore the skilfulncss of His wrestlings; how He overthrows the devil's wickedness. When forty days had been spent in fasting, "He afterwards hungered." But He it is Who gives food to the hungry, and is Himself the bread that came down from heaven, and gives life to the world, as being That whereby all things consist. But because, on the other hand, it was necessary that He Who refused not our poverty should withdraw from nothing whatsoever that belongs to man's condition, He consented for His flesh to require its natural supplies; and hence the words, "He hungered." It was not however till He had fasted sufficiently, and by His Godlike power had kept His flesh unwasted, though abstaining from meat and drink, that scarcely at length He permitted it to feel its natural sensations: for it says, that He hungered. And for what reason? That skilfully by means of the two , He Who is at once God and Man, might be recognised as such in one and the same person, both as superior to us in His divine nature, and in His human nature as our equal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
