[[commentary]]
quote='''
Now one of the thieves uttered the same revilings as the Jews, but the other tried to check his words, while he confessed his own guilt, adding, We indeed justly, for we receive the due reward of our deeds.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Two thieves therefore were hanged with Him, as I said, in mockery even of the passion which brings salvation to the whole world: but of these, the one, it says, resembled in his conduct the impiety of the Jews, belching forth the same words as they did, and giving free utterance to blasphemous expressions. "For if, says he, You be the Christ, save Yourself, and us." But the other, following a different course, is justly worthy of our admiration: for he believed in Him: and while suffering so bitter a punishment, he rebuked the vehement outcries of the Jews, and the words of him who was hanging with him. He "confessed his sin, that he might be justified:" he became the accuser of his own wicked ways, that God might remit his guilt; for it is written, "I said that I will confess of myself my iniquity to the Lord, and You forgave the wickedness of my heart." He bore to Christ a blameless testimony, and reproved the Jewish want of love to God, and condemned the sentence of Pilate: "for This Man, he says, has done nothing that is hateful." O how beautiful is this confession! how wise the reasonings, and how excellent the thoughts! He became the confessor of the Saviour's glory, and the accuser of the pride of those who crucified Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
