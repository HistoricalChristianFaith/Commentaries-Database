[[commentary]]
quote='''
Now there were in the temple a number of sellers who sold animals, by the custom of the law, for the sacrificial victims, but the time was now come for the shadows to pass away, and the truth of Christ to shine forth. Therefore Christ, who together with the Father was worshipped in the temple, commanded the customs of the law to be reformed, but the temple to become a house of prayer; as it is added, My house, &c.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And having entered into the temple, He began to cast out those who sold therein, saying to them, It is written that My house is a house of prayer: but you have made it a den of thieves. And he taught daily in the temple: but the chief priests and scribes and rulers of the people sought to destroy Him; and found not what they might do to Him, for all the people were hanging upon Him to hear Him. And it came to pass on one of the days, as He taught the people in the temple, and preached, the chief priests and scribes, with the elders, rose up against Him, and said to Him, Tell us by what authority You do these things? or who it is that gave You this authority? But He answered and said to them, I also will ask you one word, and tell Me: the baptism of John, was it from heaven, or of men? And they considered with themselves, saying, That if we shall say, From heaven; He will say, Why therefore did you not believe him? But if we say, Of men; all the people will stone us: for they are persuaded, that John is a prophet. And they answered, that they knew not whence it was. And Jesus said to them, Neither tell I you by what authority I do these things.

IT is written, that "there is a light always for the righteous; but the light of the wicked shall be put out." For to those who have embraced the righteousness that is in Christ, God the Father imparts the inextinguishable light of the true knowledge of the true vision of God: for He reveals to them the Son; as the Saviour Himself also in a certain place said to the Jews, "Murmur not one with another: no man can come to Me, except the Father Who sent Me draw him." But He draws, of course, by light and knowledge, and the cords of love. But those who are not so disposed in will, but wickedly reject Christ's commandments, from their mind even that light, which they had by the commandment of Moses, vanishes away, and is extinguished, while the darkness of ignorance usurps its place.

And that this is true, and the real state of the case, the blindness of the Jews proves to us. For they were dark, and unable to see the glory of the Word, Who became man for our sakes, although He revealed Himself to them by the working of many miracles, and a godlike authority, an instance of which we have in what happened in the temple. For there was in it a multitude of merchants, and others also, guilty of the charge of the base love of lucre, moneychangers, I mean, or keepers of exchange tables; sellers of oxen, moreover, and dealers in sheep, and sellers of turtle doves and pigeons; all which things were used for the sacrifices according to the legal ritual. But the time had now come for the shadow to draw to an end, and for the truth, so to speak, to shine forth; even the lovely beauty of Christian conduct, and the glories of the blameless life, and the sweet rational savour of the worship in spirit and in truth.

For this reason very justly did the Truth, even Christ, as One Who with His Father was also honoured in their temple, command that those things that were by the, law should be carried away, even the materials for sacrifices and burning of incense, and that the temple should manifestly be a house of prayer. For His rebuking the dealers, and driving them from the sacred courts, when they were selling what was wanted for sacrifice, means certainly this, as I suppose, and this alone.

We must observe however that another of the holy Evangelists mentions, that not only did the Lord rebuke those dealers by words, but that He also made a scourge of cords, and threatened to inflict stripes upon them; for it was right for those who honoured the legal service after the manifestation of the truth, to know, that by retaining the spirit of bondage, and refusing to be set free, they became subject to stripes, and liable to slavish torture. The Saviour therefore of all, and Lord, manifests to them His glory for their benefit, in order that they may believe in Him. For as one Who possessed authority over the temple, He both took care of it, and also called God His Father. For as that other holy Evangelist wrote, He said to the dealers, "Make not My Father's house a house of merchandize." And again, " It is written, that My house shall be called a house of prayer: but you have made it a den of thieves."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
