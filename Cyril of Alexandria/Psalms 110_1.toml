[[commentary]]
quote='''
And we too will put to the Pharisees of later days a similar question: Let them, who deny that He Who was born of the holy virgin is very Son of God the Father, and Himself also God, and divide the one Christ into two sons; let them, I say, explain to us, in what manner David's son is his Lord, and that not so much with regard to human lordship as divine. For to sit at all at the right hand of the Father is the assurance and pledge of supreme glory. For those who share the same throne are equal also in dignity: and those who are crowned with equal honours are understood of course to be equal in nature. But to sit by God can signify nothing else than sovereign authority, and the throne declares to us that He possesses empire over every thing, and supremacy by right of His substance. How therefore is the Son of David David's Lord, and seated also at the right hand of God the Father, and on the throne of Deity? Or is it not altogether according to the unerring word of the mystery, that the Word being God, and sprung from the very substance of God the Father, and being in His likeness and on an equality with Him, became flesh, that is, man, perfectly, and yet without departing from the incomparable excellence of the divine dignities, continuing rather in that estate in which He had ever been, and still being God, though He had become flesh and in form like to us. He is David's Lord therefore according to that which belongs to His divine glory and nature and sovereignty: but his son according to the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
