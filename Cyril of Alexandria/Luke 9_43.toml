[[commentary]]
quote='''
Now before not his father but the devil possessed him, but now the Evangelist adds that the people were astonished at the greatness of God, saying, And all were amazed at the mighty power of God, which he says, because of the gift of Christ, who conferred on the holy Apostles also the power of working divine miracles, and having the mastery over evil spirits.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
(non occ.) Every thing that Jesus did claimed admiration from all men for a peculiar and divine light reflected upon each of His works, according to the Psalms, honour and majesty wilt thou lay upon him. (Ps. 21:5.) Although all indeed marvelled at those things which He did, He however addresses what follows, not to all, but to His disciples; as it is said, But while they wondered every one, &c.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the multitudes, the blessed Evangelist says, wondered at the majesty of God. When Christ then works miracles, it is God Who is glorified, and God only and solely. For He is by nature God, and His majesty is incomparable, and His supremacy without a rival, resplendent with the sovereignty of God the Father. He is therefore to be extolled with praises, and let us say unto him, "O Lord God of powers, Who is like unto Thee? Powerful art Thou, O Lord, and Thy truth is round about Thee." For all things are possible to Him, and easy to accomplish, and nothing whatsoever is too difficult or high: by Whom and with Whom, to God the Father be praise and dominion, with the Holy Ghost, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
