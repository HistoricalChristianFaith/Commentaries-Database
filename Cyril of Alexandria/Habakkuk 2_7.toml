[[commentary]]
quote='''
And yet in old time he had said: "I will hold the whole world in my hand as a nest, and will take it as eggs that are left: and there is no one that shall escape from me, or speak against me." He missed, then, the truth, and fell from his hope, proud and audacious though he was, and vaunting himself over the infirmity of mankind. For the Lord of powers marshalled against him the ministers of the sacred proclamations. And this verily had been foretold by one of the holy prophets when speaking of Satan and the holy teachers: "That suddenly they shall arise that bite thee: and they shall awake that afflict thee, and thou shalt be their prey." For, so to speak, they bit Satan by attacking his glory, and making his goods a spoil, and bringing them unto Christ by means of faith in Him: for so they attacked Satan himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
