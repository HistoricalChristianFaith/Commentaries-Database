[[commentary]]
quote='''
THE prophet Isaiah bids those who embrace a life of piety towards Christ to go to the proclamations of the Gospel, saying, "You who thirst, go to the waters." But these waters are not the material waters of earth, but rather are divine and spiritual, poured forth for us by Christ Himself. For He is the river of peace, and the torrent of pleasure, and the fountain of life. And so we have heard Himself plainly saying, "Whosoever thirsts, let him come to Me and drink."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
