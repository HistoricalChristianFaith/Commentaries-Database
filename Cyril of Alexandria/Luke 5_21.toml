[[commentary]]
quote='''
By this they hasten the sentence of death, for it was commanded in the law, that whoever blasphemed God should be punished with death. (Lev. 24:16.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"
