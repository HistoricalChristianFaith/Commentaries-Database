[[commentary]]
quote='''
And the same method of explanation will hold good of the kingdom of God being also compared unto leaven. For the leaven is small in quantity, yet forthwith it seizes upon the whole mass, and quickly communicates to it its own properties. And the word of God operates in us in a similar manner: for when admitted within us, it makes us holy and without blame, and pervading our mind and heart, it renders us spiritual, that as Paul says, "Our whole body and spirit and soul may be "kept blameless in the day of our Lord Jesus Christ." And that the divine word is poured out even into the depth of our understanding, the God of all clearly shows, where He says by one of the holy prophets, "Behold the days come, says the Lord, and I will accomplish upon the house of Israel and upon the house of Judah a new covenant, not according to the covenant which I made with their fathers, in the day that I took them by the hand to bring them out of the land of Egypt, because they have not continued in My covenant, and I have also rejected them, says the Lord. But this is the covenant which I will make with them, after those days, says the Lord, I will put My laws in their mind, and will write them on their hearts."

We receive therefore the rational and divine leaven in our mind and understanding, that by this precious and holy and pure leaven we may be found spiritually unleavened, as having in us none of the wickedness of the world, but being rather pure and holy and partakers of Christ; by Whom and with Whom to God the Father be praise and dominion, with the Holy Spirit, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
