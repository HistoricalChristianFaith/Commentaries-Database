[[commentary]]
quote='''
As therefore He says, "Salt is good: but if the salt be tasteless, with what can it be seasoned? It is cast out," He says. Let there be therefore, He proceeds, salt in you," that is, the divine words which bring salvation: but which if we despise, we become without savour, and foolish, and utterly useless. Such things must the congregation of the saints cast out, by the gift unto them of mercy and love from Christ, the Saviour of us all; by Whom and with Whom to God the Father be praise and dominion, with the Holy Spirit, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
