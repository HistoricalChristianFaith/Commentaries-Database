[[commentary]]
quote='''
And Matthew says, that when the traitor drew near to Christ, our common Saviour, he both kissed Him, and added thereto, "Hail, Master." Do you say hail to Him Who by your instrumentality is made the prey of death? How could such a word possibly be true? So that we see, that inasmuch as that false one, Satan, was within Him, he used falsehood even in saying, Hail. Because of such deeds the prophet somewhere says, "Their tongue is a piercing spearhead: the words of their mouth are deceitful: to his neighbour he speaks things of peace, but in his soul there is enmity."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
