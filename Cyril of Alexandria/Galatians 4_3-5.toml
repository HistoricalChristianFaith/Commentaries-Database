[[commentary]]
quote='''
And to-day too we have seen Him obedient to the laws of Moses, or rather we have seen Him Who as God is the Legislator, subject to His own decrees. And the reason of this the most wise Paul teaches us, saying, "When we were babes we were enslaved under the elements of the world; but when the fulness of the time came, God sent forth His Son, born of a woman, born under the law, to redeem them that were under the law." Christ therefore ransomed from the curse of the law those who being subject to it, had been unable to keep its enactments. And in what way did He ransom them? By fulfilling it. And to put it in another way: in order that He might expiate the guilt of Adam's transgression, He showed Himself obedient and submissive in every respect to God the Father in our stead: for it is written, "That as through the disobedience of the One man, the many were made sinners, so also through the obedience of the One, the many shall be made just." He yielded therefore His neck to the law in company with us, because the plan of salvation so required: for it became Him to fulfil all righteousness. For having assumed the form of a slave, as being now enrolled by reason of His human nature among those subject to the yoke, He once even paid the half shekel to the collectors of the tribute, although by nature free, and as the Son not liable to pay the tax. When therefore them seest Him keeping the law, be not offended, nor place the free-born among the slaves, but reflect rather upon the profoundness of the plan of salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
