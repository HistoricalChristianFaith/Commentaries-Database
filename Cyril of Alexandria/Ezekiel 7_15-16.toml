[[commentary]]
quote='''
For the God of all spoke by the voice of Ezechiel: "As I live, says the Lord, surely inasmuch as you have defiled My holy things with all your impurities, I will also reject you; My eye shall not spare, nor will I pity." "They that are in the plain shall die by the sword: and them that are in the city famine and pestilence shall consume. And those of them that are saved shall be delivered, and shall be upon the mountains as meditative doves." For Israel did not perish from the very roots, nor, so to speak, stock and branch: but a remnant was delivered, of which the foremost and the first-fruits were the blessed disciples, of whom it is that he says, that they were upon the mountains as meditative doves. For they were as heralds throughout the whole world, forth-telling the mystery of Christ, and their office is praise and song, and, so to speak, to cry aloud in psalms, "My tongue shall meditate on Your righteousness: and all the day on Your praise."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
