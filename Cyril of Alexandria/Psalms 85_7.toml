[[commentary]]
quote='''
Many holy prophets desired to see these things; yes, and many kings: for we find them at one time saying, "Show me Your mercy, O Lord: and, O Lord, grant us Your salvation." For they call the Son Mercy and Salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
