[[commentary]]
quote='''
But He said unto them, Can ye make the sons of the bride-chamber fast, while the bridegroom is with them?

Observe, I pray again, the manner in which Christ shews that they have no share in the feast, but are altogether strangers to the joy felt on His account, and without part in the world's groat festival. For the revelation of our Saviour to the world was nothing else than a general festival, at which He spiritually united to Himself the nature of man, to be as it were His bride: that she who had been long barren might be fruitful, and blessed with a numerous offspring. All therefore are the children of the bridechamber who are called by Him through the new message of the Gospel: but not the scribes and Pharisees, who attached themselves solely to the shadow of the law. But as He had once granted permission to the children of the bridechamber not to afflict themselves, as a a concession suitable to the season, inasmuch as they were keeping a spiritual feast, that fasting might not be entirely rejected by us, He adds most suitably.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
