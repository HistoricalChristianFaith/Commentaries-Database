[[commentary]]
quote='''
Would you see the end of your artifices? Hear what the blessed David says; that "God has scattered the bones of them that please men." And by bones he here of course means not those of the body; for there are no instances of any men having suffered this: but rather the powers of the mind and heart, by means of which a man is able to effect good. The powers then of the soul are that earnestness which leads on strenuously to perseverance, spiritual manliness, patience and endurance. These qualities God will scatter in such as please men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
