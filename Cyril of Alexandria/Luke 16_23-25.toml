[[commentary]]
quote='''
And to torment him the more now that he dwells in Hades, he beheld, it says, Lazarus in the bosom of Abraham: and made supplication that he might be sent to drop a little water upon his tongue: for he was tormented, it says, as in a fierce flame. And what reply does the patriarch Abraham make? "Son, you received your good things in your life: and Lazarus his evil things." You were enamoured, He says, of these temporal things; you were clad in fine linen and purple ; you were boastful and haughty; all your time was spent in luxury; you offered up your wealth to your appetite and to flatterers; but you never once called to mind the sick and sorrowful: you had no compassion on Lazarus when you saw him thrown down at your portals. You beheld the man suffering incurable misery, and a prey to intolerable griefs: for two maladies at once possessed him, each worse than the other, the cruel pain of his ulcers, and the want of the necessaries of life. The very beasts soothed Lazarus, because he was in pain; "the dogs licked his sores," but you were more hard-hearted than the beasts. "You have received therefore, He says, your good things in your life, and Lazarus his evil: and now here he is comforted, and you are tormented;" and, as the sacred Scripture says, "they shall have judgment without mercy who have wrought no mercy." You would have been a partner with Lazarus, and a portion of his consolation would have been given you by God, if you had admitted him to be a partner of your wealth. But this you did not do, and therefore you alone are tormented: for such is the fitting punishment of the unmerciful, and of those whose mind feels no sympathy for the sick.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
