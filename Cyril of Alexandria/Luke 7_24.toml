[[commentary]]
quote='''
(ubi sup.) The Lord, knowing the secrets of men, foresaw that some would say, If until now John is ignorant of Jesus, how did lie show Him to us, saying, Behold the Lamb of God, which taketh away the sins of the world? To quench therefore this feeling which had taken possession of them, He prevented the injury which might arise from the offence, as it follows, And when the messengers of John were departed, he began to speak unto the people concerning John, what went ye out for to see? A reed shaken in the wind? As if He said, Ye marvelled at John the Baptist, and oftentimes came to see him, passing over long journeys in the desert; surely in vain, if you think him so fickle as to be like a reed bending down whichever way the wind moves it. For such he appeal's to be, who lightly avows his ignorance of the things which he knows.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"
[[commentary]]
quote='''
And when the messengers of John had departed, He began to speak unto the multitudes concerning John, What went ye out into the wilderness to see? A reed, shaken with the wind? But what went ye out to see? A man clad in soft garments? Behold they who wear soft clothing, are in the abodes of kings. But what went ye out to see? A Prophet? Yea, I say unto you: and more than a prophet: for this is he of whom it is written, Behold I send My messenger before Thy face, to prepare Thy way before Thee. Verily I say unto you, Among those born of women there is no one greater than John: but he who is least in the kingdom of God is greater than he.

YE who thirst for the knowledge of the divine doctrines, open once again the treasure-house of your minds: satiate yourselves with the sacred words: or rather, give way to no feeling of satiety herein: for gluttony in things that tend to edification is a quality worth the gaining. Let us approach, then, the Saviour's words, not carelessly, and without due preparation, but with that attentiveness and vigilance which befits those who would learn. For so alone can those subjects for contemplation, which are difficult of comprehension, be rightly understood. Let us, therefore, ask of Christ that light, which He sends down upon the mind and heart, that thus being enabled correctly to understand the force of what is said, we may again admire the beautiful skill of the management. For He had been asked by the disciples of John, whether He is He that cometh? When then: He had answered them in a suitable manner, and commanded them to return to him that sent them. He began to say unto the multitudes concerning him, "What went ye out into the wilderness to see? a reed shaken by the wind?" And what the instruction is which we gain from this, or what the end to which our Saviour's words have reference, how must it not be worth our while to inquire? Let us examine, therefore, the meaning of what is said: let us search it as a treasure: let us spy into its secrets: and fixing our mind upon the profundity of the mystery, let us be like careful moneychangers, proving every thing, as Scripture says.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
