[[commentary]]
quote='''
The voice of one invoking in faith stops Christ, for He looks back upon them who call upon Him in faith. And accordingly He calls the blind man to Him, and bids him draw nigh, that he in truth who had first laid hold on Him in faith, might approach Him also in the body. The Lord asks this blind man as he drew near, What will thou that I shall do? He asks the question purposely, not as ignorant, but that those who stood by might know that he sought not money, but divine power from God. And thus it follows, But he said, Lord, that I may receive my sight.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He was justly therefore honoured by Christ: for he was called by Him, and commanded to draw near. Understand from this, my beloved, that faith sets us also in Christ's presence, and so brings us to God, as for us to be even counted worthy of His words. For when the blind man was brought to Him, He asked him, saying, "What do you want me to do for you? Was his request then unknown to Him? For was it not plain that he sought deliverance from the malady that afflicted him? How can there be any doubt of this? He asked him therefore purposely, that those who were standing by, and accompanying Him, might learn, that it was not money he sought, but rather that regarding Him as God, he asked of Him a divine act, and one appropriate solely to the nature that transcends all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
