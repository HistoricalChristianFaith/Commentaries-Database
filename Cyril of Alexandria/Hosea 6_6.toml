[[commentary]]
quote='''
Most of all, worship of God displays love.… For truly the compassion from beside the Father is Christ, as he takes away the sins, dismisses the charges and justifies by faith, and recovers the lost and makes [them] stronger than death. For what is good and he does not give? Therefore the knowledge of God is better than sacrifice and holocausts, as it is brought to perfection in Christ. For by him and in him we have known the Father, and we have become rich in the justification by faith.
'''
source_url = "https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Twelve%2520Minor%2520Prophets%2Fhosea.html"
source_title="COMMENTARY ON HOSEA 4:65"

[[commentary]]
quote='''
But God said, I require mercy, and not sacrifice: and the acknowledgment of God, and not whole burnt offerings.

What is meant by mercy? and what by sacrifice? By mercy then is signified, Justification and grace in Christ: even that which is by faith. For we have been justified, not by the works of the law that we have done, but by His great mercy. And sacrifice means the law of Moses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
