[[commentary]]
quote='''
And the prophet David also blames those who love temporal honours; for he also thus spoke of them, "Let them be as the grass upon the housetops, which withers before it is plucked up." For just as the grass that springs up upon the housetops has no deep fixed root, and for this reason is easily parched up; so he who values worldly honour, after he has been for a short time conspicuous, and, so to speak, in flower, sinks at last into nothingness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
