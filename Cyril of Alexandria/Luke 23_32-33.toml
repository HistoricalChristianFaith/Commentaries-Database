[[commentary]]
quote='''
And there were led also two others, who were malefactors, to be put to death with Him. And when they came to the place which is called a skull, there they crucified Him and the malefactors, one on the right hand and the other on the left. And dividing His garments, they cast lots. And the people stood looking on. And the rulers also derided Him, saying. He saved others; let Him save Himself if This is the Christ the elect of God. And the soldiers also mocked Him, coming to Him, and offering Him vinegar, and saying, If You are the King of the Jews, save Yourself And there was also a writing written over Him, This is the King of the Jews. And one of the malefactors which were hanged blasphemed Him, saying, If You are the Christ, save Yourself and us. But the other answered rebuking him, and said, Do you not fear God, seeing you are in the same condemnation? And we indeed justly; for we receive the due retribution of our deeds: but this man has done nothing that is hateful. And he said, Jesus, remember me when You come in Your kingdom. And Jesus said to him, Verily I say to you, To-day shall you be with Me in paradise.

THE blessed Paul counts the mystery of the incarnation of the Only-begotten worthy of all admiration, and, so to speak, is in amaze at the wisdom and excellence of the plan of salvation, saying, "O the depth of the riches both of the wisdom and the knowledge of God." For consider how the Saviour of all and Lord, by Whom the Father brought all things into existence, refashions man's nature, restoring it to that which it was in the beginning by becoming Himself like to us, and bearing our sufferings for our sakes. For the first man was indeed in the beginning in the paradise of delight, being ennobled by the absence both of suffering and of corruption: but when he despised the commandment that had been given him, and fell under a curse and condemnation, and into the snare of death, by eating the fruit of the forbidden tree, Christ, as I said, by the very same thing restores him again to his original con-dition. For He became the fruit of the tree by having endured the precious cross for our sakes, that He might destroy death, which by means of the tree had invaded the bodies of mankind. He bore suffering that He might deliver us from sufferings: "He was despised and not esteemed," as it is written, that He might make us honourable: He did no sin, that He might crown our nature with similar glory: He Who for our sakes was man submitted also to our lot; and He Who gives life to the world submitted to death in the flesh. Is not therefore the mystery profound? Must we not own that the dispensation is more than language can describe? What doubt can there be of this? Let us therefore, as we offer Him our praise, repeat that which was sung by the Psalmist's harp; "How great are Your works, O Lord! in wisdom have You made them all."

When therefore He hung upon the precious cross, two thieves were hung with Him. And what follows from this? It was verily mockery as far as regards the object of the Jews; but the commemoration of prophecy: for it is written, that "He was also numbered with the transgressors." For our sakes He became a curse, that is, accursed: for it is written again, that "Cursed is every one that hangs on a tree." But this act of His did away with the curse that was upon us: for we with Him and because of Him are blessed. And knowing this, the blessed David says: "Blessed are we of the Lord, Who made heaven and earth:" for by His sufferings blessings descend to us. He in our stead paid our debts: He bore our sins; and as it is written, "in our stead He was stricken." "He took them up in His own body on the tree:" for it is true that "by His bruises we are healed." He too was sick because of our sins, and we are delivered from the sicknesses of the soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
