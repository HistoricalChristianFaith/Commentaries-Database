[[commentary]]
quote='''
There is however an apparent incompatibility between the two declarations: for if we are to receive "good measure, and squeezed down, and running over," how "shall we be paid back the same measure wherewith we mete?" for this implies an equal recompense, and not one of far-surpassing abundance. What say we then? The all wise Paul frees us from our difficulties, by bringing us the solution of the matters in question. For he says, that "he that soweth sparingly, meaning thereby, that he who distributeth the necessaries of life to those who are in penury and affliction moderately, and so to speak, with contracted hand, and not plentifully and largely," shall also reap sparingly: and he "that soweth in blessings, in blessings shall also reap." By which is meant, he who bountifully * * * * * So that if anyone hath not, he has not sinned by not giving it; for a man is acceptable according to that which he hath, and not according to that which he hath not. And this the law of the very wise Moses has taught us in type: for those that were under the law brought sacrifices to God according to what they severally possessed, and were able to afford: some for instance bullocks, and some rams, or sheep, or doves, or pigeons, or meal mingled with oil, but even he who offered this * *, because he had no calf to offer, though so little and to be procured so cheaply, was equal to the other as regards his intention.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
