[[commentary]]
quote='''
If, therefore, a man be ready to endure and despise the terrors of death, has he lost himself and departed, and is there nothing more in store for him? By no means: for in that he loses his life, he especially finds it; while to find it is to bring upon himself destruction. What fear, therefore, can the saints now feel, if that which seemed to be hard proves rather joyous to them that bear it; while that which is dear to men, as being exempt from pain, leads them especially downwards to destruction and the snare of hell, according to the Scripture.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
