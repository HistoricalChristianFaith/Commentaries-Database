[[commentary]]
quote='''
Zacchaeus, come down quickly: for to-day I must abide at your house.

This was an act of divine foreknowledge; for He well knew what would happen. He saw the man's soul prepared most readily to choose a holy life, and converted him therefore to pietyThe man therefore received Jesus joyfully: and this was the commencement of his turning himself to good, of his departure from his former faults, and of his manfully betaking himself to a better course.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
