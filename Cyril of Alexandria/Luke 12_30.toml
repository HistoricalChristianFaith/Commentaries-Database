[[commentary]]
quote='''
And in another view it was unbefitting for those who were to be the type and pattern for others of holy conduct, themselves carelessly to fall into those things, which as soon as they became the world's teachers, they would have to warn others to abandon. And it would have been no slight injury both to their zeal, and to the usefulness of their sacred preaching, for the disciples to have been burdened with the care of worldly pursuits. On the contrary, it was their duty with determined mind entirely to disregard such things, and simply and earnestly to be anxious for apostolic victories. Very justly for this reason He openly reprobates the pursuit of the things of time, "for the nations of the world," He says, "seek after them:" and raises them to the unwavering conviction, that certainly and under all circumstances they will have enough, because their Father well knows of what things they have need, even He Who is in heaven. And at a most fitting season He calls Him Father, that they may know, that He will not forget His children, but be kind and loving unto them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
