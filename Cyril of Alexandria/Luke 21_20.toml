[[commentary]]
quote='''
And, to make His prediction yet again more clear, and more plainly to mark the time of its capture, He says, "When you have seen Jerusalem girt about with armies, then know that its destruction is nigh."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
