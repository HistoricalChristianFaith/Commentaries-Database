[[commentary]]
quote='''
To what therefore shall I liken the men of this generation, and to what are they like? They are like to children sitting in the market-place, and calling one to another, and saying, We have played unto you, and ye have not danced: we have wailed unto you, and ye have not wept. For John the Baptist came, neither eating bread, nor drinking wine, and ye say, that he hath a devil. The Son of man came eating and drinking: and ye say, Behold a man gluttonous, and a wine drinker: a friend of publicans and sinners. And wisdom is justified of her children.

THOSE who have a sound mind examine everything, rejecting the false, but receiving and praising that which is without blame. And such the wise Paul also requires us to be, where writing he said: " Be ye wise money-changers; prove all things, and hold that which is good: abstain from every evil kind." We therefore also, as I said, must closely examine with the discerning eye of the mind whatever is done, and search into the nature of actions, that so we may approve of that which is without blame, while we reject that which is counterfeit. But if, making no distinctions, we run the risk of passing an evil sentence upon things highly praiseworthy: and of deeming that which is evil fit for commendation and applause, the prophet's words will apply to us: "Woe unto them that call evil good, and good evil: who call bitter sweet, and sweet bitter: who put light for darkness, and darkness for light." Such was the character of the Israelites, and especially of those whose lot it was to be their chiefs, the Scribes namely and Pharisees: of whom Christ said, "To what shall I liken the men of this generation? and so on."

There was perchance a sort of game among the Jewish children, something of this kind. A troop of youths was divided into two parts: who, making sport of the confusion in the world, and the uneven course of its affairs, and the painful and rapid change from one extreme to the other, played some of them on instruments of music: while the rest wailed. But neither did the mourners share the merriment of those who were playing music and rejoicing: nor again did those with the instruments of music join in the sorrow of those who were weeping: and finally, they reproached one another with their want of sympathy, so to speak, and absence of affection. For the one party would say, "We have played unto you, and ye have not danced:" to which the others would rejoin, "We have wailed unto you, and ye have not wept."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
