[[commentary]]
quote='''
The disciples did not as yet know exactly what the Prophets had foretold, but after He rose again, He opened their understanding that they should understand the Scriptures. (Luke 24:25.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"
