[[commentary]]
quote='''
And what was the contrivance of this many-headed serpent? "He entered, it says, into Judah Iscariot, who was one of the twelve." Why not rather into the blessed Peter, or into James, or John, or some other of the rest of the apostles, but into Judah Iscariot? What place did Satan find in him? Of all whom we have here mentioned he could approach none, because their heart was steadfast, and their love to Christ immoveable; but there was a place for him in the traitor. For the bitter malady of covetousness, which the blessed Paul says is "the root of all evil," had overpowered him. For once also when a woman had poured ointment upon the Saviour, he alone of all rebuked her, saying, "To what purpose is this waste? For it could have been sold for much, and given to the poor." But the wise Evangelist rose, so to speak, against his feigned words: for immediately he adds: "But this he spoke, not because he had forethought for the poor, but because he was a thief, and carried the purse, and whatever fell therein, he was the bearer of." And Satan, being crafty in working evil, whenever he would gain possession of any man's soul, does not attack him by means of vice generally, but searches out rather that particular passion which has power over him, and by its means makes him his prey.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
