[[commentary]]
quote='''
The lesson therefore which He teaches us is love unto the poor, which is a thing precious in the sight of God. Do you feel pleasure in being praised when you have any friends of relatives feasting with you? I tell you of something far better: angels shall praise your bounty, and the rational powers above, and holy men as well: and He too shall accept it Who transcends all, and Who loves mercy and is kind. Lend unto Him fearing nothing, and you shall receive with usury whatever you gave: "for he, it says, who has pity on the poor lends unto God." He acknowledged the loan, and promises repayment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
