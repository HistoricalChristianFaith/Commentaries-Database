[[commentary]]
quote='''
When the ordination of the Apostles was accomplished, and great numbers were collected together from the country of Judæa, and from the sea coast of Tyre and Sidon, (who were idolaters,) he gave the Apostles their commission to be the teachers of the whole world, that they might recal the Jews from the bondage of the law, but the worshippers of devils from their Gentile errors to the knowledge of the truth. Hence it is said, And he came down with them, and stood in the plain, and a great multitude from Judæa, and the sea coast, &c.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He stood upon level ground, and a crowd of His disciples and a great multitude of the people.

But observe, I pray, the manner of the election. For the most wise Evangelist says that it was not done in a corner and secretly, but rather when many disciples were gathered together, and a vast crowd from all the country of the Jews, and from the sea-coast of Tyre and Sidon. These latter were idolaters, lame in the hollow of both knees, in part observing the customs of the Jews, but yet not altogether abandoning their idolatrous practices. The election, therefore, was held in the presence of all these spectators, and teachers appointed for all beneath the heaven: and this duty they also fulfilled, summoning the Jews from their legal worship, and those who served demons, from Grecian error to the acknowledgment of the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
