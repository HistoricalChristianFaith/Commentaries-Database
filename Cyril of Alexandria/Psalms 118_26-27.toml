[[commentary]]
quote='''
By the holy prophets therefore the Saviour and Lord of all is called, "He that cometh." For the prophet David in a psalm declares: "Blessed be He That cometh in the Name of the Lord." And what means that expression "in the Name of the Lord?" it means in godlike glory, and lordship, and all transcending majesty. And this again he has signified in what follows: "The Lord is God, and hath shone forth upon us." For Moses indeed came, and appeared in his season, and by his instrumentality the law was spoken to the Israelites: and then after him Jesus the son of Nun commanded the host, and then in order the blessed prophets. And they were indeed holy men, honourable beyond comparison, and endowed with a spiritual and all-excelling splendour: but no one of them shone forth upon the inhabitants of earth in the name of the Lord, in the glory that is of Godhead and dominion. But the only-begotten Word of God shone forth upon us as being in His nature and verily God and Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
