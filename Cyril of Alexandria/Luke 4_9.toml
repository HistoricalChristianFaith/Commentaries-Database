[[commentary]]
quote='''
If Thou be the Son of God, cast Thyself down hence.

The third temptation which the devil employs is that of vain-glory, saying, "Cast Thyself down hence," as a proof of Thy divinity. But neither did he make Him fall by means of vanity, but himself in this also shot wide of the mark.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
