[[commentary]]
quote='''
The law also ordered, that those who were cleansed from leprosy should offer sacrifice for the sake of their purification.

Whereby the Jewish priests who were jealous of His glory might know that it was by Christ granting them health that they were suddenly and miraculously healed.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He said unto them, Go and show yourselves unto the priests.

And why did He not rather say, "I will, be you cleansed;" as he did in the case of another leper: but commanded them rather to show themselves unto the priests? It was because the law gave directions to this effect to those who were delivered from leprosy: for it commanded them to show themselves to the priests, and to offer a sacrifice for their cleansing. He commanded them therefore to go, as being already healed, and, that they might, so to speak, bear witness to the priests, as the rulers of the Jews, and ever envious of His glory, that wonderfully, and beyond their hope, they had been delivered from their misfortune by Christ's willing that they should be healed. He did not heal them first, but sent them to the priests, because the priests knew the marks of leprosy, and of its being healed. He sent them to the priests, and with them He sent also the healing. What however was the law of leprosy, and what the rules for its purification, and what the meaning of each of the particulars commanded by the law, we have more fully described at the commencement of our Saviour's miracles as recorded by Luke, and referring thither such as are anxious for learning, let us now proceed to what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
