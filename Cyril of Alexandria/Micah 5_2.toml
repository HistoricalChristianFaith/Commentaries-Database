[[commentary]]
quote='''
And it is written again, "And you Bethlehem, the house of Ephrata, are small to be among the thousands of Judah: out of you shall He come forth for Me Who shall be the Head of Israel." For Bethlehem was indeed small, and in comparison with the general populousness of the Jews, its inhabitants were very few; yet from it came forth Christ, as having been born in it of the holy virgin: not as one subject to the shadows of the law, but rather as ruler both over the law and the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
