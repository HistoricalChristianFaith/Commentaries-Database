[[commentary]]
quote='''
But of whom says He this? Is it of Himself, or also of us? Both the one and the other are true. For He forgives sins as being the Incarnate God, the Lord of the law: and we too have received from Him this splendid and most admirable grace. For He hath crowned man's nature with this great honour also, having even said to the holy apostles, "Verily I say unto you, whatsoever things ye bind on earth shall be bound in heaven: and whatsoever things ye loose on earth shall be loosed in heaven." And again, "Whosesoever sins ye remit, they shall be remitted unto them: and whosesoever ye bind shall be bound." And what is the occasion on which we find Him thus speaking unto them? It was after He had trampled upon the power of death, and risen from the grave, when He breathed upon them, and said, "Receive the Holy Ghost." For having made them partakers of His nature, and bestowed upon them the indwelling of the Holy Ghost, He also made them sharers of His glory, by giving them power both to remit and to bind sins. And as we have been commanded to perform this very act, how must not He much more Himself remit sins, when He giveth unto others authority to enable them to do so?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
[[commentary]]
quote='''
For when Christ rose, and spoiled hell, the spirit of adoption was then given to them that believed on Him, and first of all to the holy disciples; for "He breathed upon them, saying, Receive ye the Holy Ghost. If ye remit the sins of any, they are remitted them; and if ye retain the sins of any, they are retained." For inasmuch as they have become partakers of the divine nature, by being richly endowed with that lordly and all-governing Spirit; therefore He has also given them the godlike power of remitting the sins of whomsoever they will, and of retaining those of all others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
