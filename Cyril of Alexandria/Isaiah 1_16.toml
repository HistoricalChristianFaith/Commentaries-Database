[[commentary]]
quote='''
And again the prophet Isaiah speaks as in the person of God, "Wash you, make you clean; put away iniquities from your souls from before My eyes. Cease from your iniquities." Observe the exactness of the expression: for His words are, "From before My eyes put away iniquities from your souls." For the wicked do sometimes escape the eyes of men, but never can they escape those of God. It is our duty therefore, inasmuch as God sees what is secret, to put away wickedness from before His eyes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
