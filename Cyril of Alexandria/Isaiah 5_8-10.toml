[[commentary]]
quote='''
And this you may learn from what He Himself says thereupon by the mouth of the holy prophets; "Therefore because you have bruised the heads of the poor, and taken from them chosen gifts, you shall build houses of carved stone, but you shall not dwell therein: and you shall plant desirable vineyards, but you shall not drink of their wine. For I know your many wickednesses, and mighty are your sins." And again, "Woe unto those who add house to house, and join field to field, that they may take away something from their neighbour. Will you dwell alone in the earth? For these things have been heard in the ears of the Lord of hosts. For though your houses be many, they shall be a desolation: though they be great and fair, there shall be none to inhabit them. For the ground that ten yoke of oxen till shall produce one pitcher full: and he that sows six artabae shall gather three measures," Although therefore houses and fields may be the fruit of the oppression of others, yet these, He says, shall lie waste, without inhabitants, and shall yield no profit whatsoever to those who will act wickedly, because the just wrath of God is poured out upon them. In every way therefore there is no profit in covetousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
