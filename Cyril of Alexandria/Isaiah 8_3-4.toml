[[commentary]]
quote='''
Wouldst thou see another virtue of the Child? Wouldst thou see that He is by nature God, Who in the flesh was of woman? Learn what the prophet Isaiah says of Him: "And I drew near unto the prophetess, and she conceived, and bare a male; and the Lord said unto me, Call His name, Quick take captive, and spoil hastily. For before the Child shall know to call father or mother, He shall take the strength of Damascus." For contemporaneously with the birth of Christ the power of the devil was spoiled. For in Damascus he had been the object of religious service, and had had there very many worshippers; but when the holy Virgin brought forth, the power of his tyranny was broken; for the heathen were won unto the knowledge of the truth; and their firstfruits and leaders were the Magi, who came from the East to Jerusalem; whose teacher was the heaven, and their schoolmaster a star.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
