[[commentary]]
quote='''
But even when so speaking, Pilate rebuked them, excusing himself, and saying, "I find no cause at all in Him." " For you have brought me, he says, This Man, as one Who upturns the people, and behold, I having tried Him in your presence, have not found in This Man any cause of those things whereof you accuse Him. No, nor yet Herod: for he has sent Him back to us: and, behold, nothing is done by Him worthy of death."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
