[[commentary]]
quote='''
But the rude or unlearned man will more reasonably ask for pardon of the avenger. Hence it is added, But he that knew not, and did commit things worthy of stripes, shall be beaten with few stripes.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Very severe therefore is the condemnation of those who teach. And this Christ's disciple shows us, saying, "Let there not be many teachers among you, my brethren, knowing that we shall receive the greater condemnation." For abundant is the bestowal of spiritual gifts upon those who are the chiefs of the people: for so the wise Paul also somewhere wrote to the blessed Timothy; "The Lord shall give you wisdom in every thing." And, "Despise not the gift that is in you, which was given you by the laying on of my hands." From such as these then, the Saviour of all, in that He has given them much, requires much in return. And what are the virtues He requires? Constancy in the faith; correctness in teaching; to be well grounded in hope; unwavering in patience; invincible in spiritual strength; cheerful and brave in every more excellent achievement: that so we may be examples to others of the evangelic life. For if we will thus live, Christ will bestow upon us the crown; by Whom and with Whom, to God the Father be praise and dominion, with the Holy Spirit, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
