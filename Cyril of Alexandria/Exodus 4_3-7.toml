[[commentary]]
quote='''
and which He spoke to the divine Moses; the rod was changed into a serpent. And what thing is this? some one, forsooth, may say; or what is the truth it hints at? And this certainly we must examine: for I say that of all that is contained in the sacred Scriptures, there is nothing which is not useful for edification. When Israel then had dwelt for a lengthened period in Egypt, and been brought up in the customs of its inhabitants, he wandered far from God, and became like one that had fallen from His hand, and been made a serpent, by which is meant one naturally of a thoroughly wicked disposition. But inasmuch as God again took hold of him, he was restored to his former state, and became a rod, that is to say, a plant of Paradise. For he was called to the true knowledge of God, and enriched with the law as the means of a virtuous life.

Moreover God wrought also something further of an equally miraculous character. For He said unto Moses, "Put your hand into your bosom. And he put his hand into his bosom; and he drew forth his hand from his bosom, and his hand had become leprous, like snow. And he said again, Put your hand into your bosom. And he put his hand into his bosom; and he drew it forth from his bosom, and it had gained again the colour of his flesh." For as long as Israel adhered to the customs of his fathers, and represented in his own manners the type of virtuous living which he had in Abraham, and Isaac, and Jacob, he was, as it were, in the bosom of God, that is, under His guardianship and protection: but by abandoning the virtue of his ancestors, he became, so to speak, leprous; and fell into impurity: for the leper by the law of Moses was impure. But when He was again accepted by God, and placed under His protection, he was delivered from his leprosy; and put away the impurity of the Egyptian mode of life. And when these signs were wrought in their presence, they believed Moses, saying, "The Lord God of your fathers has sent me unto you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
