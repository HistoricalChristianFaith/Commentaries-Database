[[commentary]]
quote='''
In Matthew, however, again He says; "Blessed are they that hunger and thirst after righteousness: for they shall be filled:" but here He simply says, that "those that hunger shall be filled." We say, therefore, that it is a great and noble thing to hunger and thirst after righteousness: that is, habitually to take part in earnest endeavours after piety:—for such is the meaning of righteousness:—as if it were our meat and drink.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
