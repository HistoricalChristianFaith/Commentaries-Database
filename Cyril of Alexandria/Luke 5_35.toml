[[commentary]]
quote='''
Having granted to the children of the Bridegroom that it was not fitting that they should be troubled, as they were keeping a spiritual feast, but that fasting should be abolished among them, He adds as a direction, But the days shall come when the Bridegroom shall be taken from them, and then shall they fast in those days.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But the days will come, when also the bridegroom shall be taken away from them; then shall they fast in those days.

For all things are good in their season. But what is the meaning of the bridegroom being taken away from them? It is His being taken up into heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
