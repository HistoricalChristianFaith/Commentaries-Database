[[commentary]]
quote='''
And judgment shall roll down as water, and righteousness as an impassable torrent. The righteous verdict against them will be like an impassable torrent, that is, dragging away what falls into it and sparing nothing. For when God drives someone into destruction and troubles, who is the one who will save? Who is the one who will help and deliver from judgment? Or what way will there be, by which if one passed through, he might be outside of the evils? None at all. "For who will turn back the high hand?" And, "If he shuts a man in, who can open it?" according to what is written.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Twelve%2520Minor%2520Prophets%2Famos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
And it is no difficult thing to see, that the message of the Gospel preaching, being small at first, was soon to leap forth as it were unto great increase, inasmuch as God had foretold of it by the voice of Isaiah, "that the whole earth has been filled with the knowledge of the Lord, as the deep waters that cover the seas." For the preaching of salvation is everywhere poured forth like a sea, and its onward course is irresistible. And this too the God of all clearly told us by the voice of the prophet, "And judgment shall roll as the waters, and righteousness as an impassable flood." For He gives the names of judgment and righteousness to the gospel message, and grants us the assurance that it shall roll over the world like waters and as a flood, whoso rushing streams, as it violently pours along, no man can stay.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
