[[commentary]]
quote='''
Then came the day of unleavened bread, on which it was fitting for the passover to be sacrificed. And He sent Peter and John, saying, Go and prepare for us the passover, that we may eat. And they said to Him, Where will You that we prepare? And He said to them, Behold, when you have entered into the city, there shall meet you a man carrying a pitcher of water: follow him to the house into which he enters. And say to the master of the house, The Teacher says to you, Where is the guest-chamber, where I may eat the passover with My disciples? And he will show you a large upper room, provided with couches; there make ready. And they went, and found as He said to them; and they made ready the passover. And when the time was come, He lay down to meat, and the twelve apostles with Him. And He said to them, I have desired a desire to eat this passover with you before I suffer: for 1 say to you, that henceforth I twill not eat of it, until it is fulfilled in the kingdom of God.

THE law by its shadows prefigured from of old the mystery of Christ: and of this He is Himself the witness where He said to the Jews, "If you had believed Moses, you would have believed also Me: for he wrote concerning Me." For everywhere He is set forth, by means of shadows and types, both as slain for us, as the Lamb without blame and true; and as sanctifying us by His life-giving blood. And we further find the words of the holy prophets in complete accordance with those of most wise Moses. But when "the fulness of time was come," as Paul says, in which the Only-begotten Word of God was about to submit to the emptying of Himself, and to endure the birth in the flesh of a woman, and subjection also to the law, according to the measure that was fitting for human nature, then He was also sacrificed for us, as the lamb without blame and true, on the fourteenth day of the first month. And this feast-time was called Phasek, a word belonging to the Hebrew language, and signifying the passing over: for so they explain it, and say that this is its meaning.

We must explain then what it is from which we pass over, and on our journey to what country, and in what manner we effect it.

As then Israel was delivered from the tyranny of the Egyptians, and having loosed its neck from the yoke of bondage, was now free; and fleeing from the violence of the tyrant passed with dry foot in a manner wonderful and beyond the power of language to describe through the midst of the sea, and journeyed onwards to the promised land: so must we too, who have accepted the salvation that is in Christ, be willing no longer to abide in our former faults, nor continue in our evil ways, but manfully cross over the sea, as it were, of the vain trouble of this world, and the tempest of affairs that is therein. We pass over therefore from the love of the flesh to temperance; from our former ignorance to the true knowledge of God; from wickedness to virtue: and in hope at least, from the blame of sin to the glories of righteousness, and from death to incorruption. The name therefore of the feast on which Emmanuel bore for us the saving cross, was the Passover.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
