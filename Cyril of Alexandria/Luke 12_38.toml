[[commentary]]
quote='''
Our Lord knew the proneness of human infirmity to sin, but because He is merciful, He docs not allow us to despair, but rather has compassion, and gives us repentance as a saving remedy. And therefore He adds, And if he shall come in the second watch, &c. For they who keep watch on the walls of cities, or observe the attacks of the enemy, divide the night into three or four watches.

Of the first watch, however, he makes no mention, for childhood is not punished by God, but obtains pardon; but the second and third age owe obedience to God, and the leading of an honest life according to His will.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And whether He come in the second watch, it says, or whether He come in the third watch, blessed are they." Here observe I pray, the breadth of the divine gentleness, and the bountifulness of His mildness towards us. For verily He knows our frame, and the readiness with which man's mind wanders into sin. He knows that the power of fleshly lust tyrannizes over us, and that the distractions of this world even, so to speak, against our will drag us on by force, leading the mind into all that is unseemly. But in that He is good, He does not leave us to despair, but on the contrary, pities us, and has given us repentance as the medicine of salvation. For this reason He says, that "whether He come in the second watch, or whether He come in the third watch, and find them so doing, blessed are they." Now the meaning of this you will certainly wish clearly to understand. Men therefore divide the night into three or four watches. For the sentinels on city walls, who watch the motions of the enemy, after being on guard three or four hours, deliver over the watch and guard to others. So with us there are three ages: the first, that in which we are still children; the second, in which we are young men; and the third, that in which we come to old age. Now the first of these, in which we are still children, is not called to account by God, but is deemed worthy of pardon, because of the imbecillity as yet of the mind, and the weakness of the understanding. But the second and the third, the periods of manhood and old age, owe to God obedience and piety of life, according to His good pleasure. Whosoever therefore is found watching, and, so to speak, well girt, whether, if it so chance, he be still a young man, or one who has arrived at old age, blessed shall he be. For he shall be counted worthy of attaining to Christ's promises.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
