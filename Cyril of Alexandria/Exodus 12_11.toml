[[commentary]]
quote='''
And in like manner the law also of Moses plainly commands those who ate of the lamb: "Thus shall ye eat it: your loins shall be girt: and your staves in your hands: and your sandals on your feet." Observe, therefore, that those in whom Christ, the true Lamb, dwells, must be like men girt for a journey: for they must "shoe their feet with the readiness of the Gospel of peace," as blessed Paul wrote unto us; and be clad as becometh wayfarers. For it is not fitting for those charged with the divine message, if they would prosper in their office, to remain stationary; but, as it were, they must constantly be moving forward, and run, not for an uncertainty, but to win a glorious hope. For even those who once had fallen under the hand of the enemy, if by faith they fight for Christ, the Saviour of us all, will inherit an incorruptible crown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"

[[commentary]]
quote='''
And let us know that the law also of the very wise Moses is found to have commanded something of the kind to the Israelites. For a lamb was sacrificed on the fourteenth day of the first month, as a type of Christ. "For our passover, Christ is sacrificed," according to the testimony of most sacred Paul. The hierophant Moses then, or rather God by his means, commanded them, when eating its flesh, saying, "Let your loins be girt, and your shoes on your feet, and your staves in your hands." For I affirm that it is the duty of those who are partakers of Christ, to beware of a barren indolence; and yet further, not to have as it were their loins ungirt and loose, but be ready cheerfully to undertake whatever labours become the saints; and to hasten besides with alacrity whithersoever the law of God leads them. And for this reason He very appropriately made them wear [at the passover] the garb of travellers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
