[[commentary]]
quote='''
The law indeed pointed them out before in type, and the prophets also proclaimed them. As, for instance, it is written in the Mosaic record, "And ye shall take fine flour, and make it into twelve loaves: and he shall put them in two rows upon the pure table before the Lord. And ye shall put upon the row frankincense and salt: and they shall be for loaves, sot before the Lord for a memorial." For the bread that came down from heaven, and giveth life to the world, Who else can it be but Christ the Saviour of the universe? And in imitation too of Him, the blessed disciples also are named loaves: for having been made partakers of Him Who nourishes us unto life eternal, they also nourish by their own writings those who hunger and thirst after righteousness. And as the Saviour Who is the true light called the disciples also light:----"for ye are the light of the world:"----so also being Himself the broad of life, He has bestowed upon His disciples to be ranked as loaves." And observe, I pray, the marvellous art of the law: "for ye shall put, it says, upon the loaves frank-incense and salt." Now the frankincense is the symbol of a sweet odour; and the salt that of understanding and good sense: both of which existed in the highest degree in the holy Apostles. For their life was one of a sweet savour, as they also said, that "we are a sweet savour of Christ unto God:" and they were moreover also full of understanding, so that I hear the prophet David even singing of them in the Psalms: "There is Benjamin in entrancement: the princes of Judah are their leaders: the princes of Zebulon, the princes of Nephthalim." For the blessed disciples were chosen out of almost every tribe of Israel, and were the bearers of light to the world, "holding up the word of life."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
