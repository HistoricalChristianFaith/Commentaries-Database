[[commentary]]
quote='''
And the Saviour Himself also somewhere said in another parable, "Who therefore is the faithful and wise servant, whom his lord shall set over his household, to give them their food at its season? Blessed is that servant, whom his lord when he comes shall find so doing. Verily I say to you, that he will set him over all that he has." And what is the meaning of his giving his follow servants food, except it be the distributing to the people committed to his charge the benefit of spiritual instruction, and the satisfying, so to speak, with spiritual victuals those who hunger after righteousness?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
