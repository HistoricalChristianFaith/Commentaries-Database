[[commentary]]
quote='''
Because our Saviour, in His discourses which He addressed to others, spake often of the kingdom of God, the Pharisees derided Him; hence it is said, And when he was asked by the Pharisees when the kingdom of God should come. As though they said tauntingly, "Before the kingdom of God come, which Thou speakest of, the death of the cross will be Thy lot." But our Lord testifying His patience, when reviled reviles not again, but the rather because they were evil, returns not a scornful answer; for it follows, He answered and said, The kingdom cometh not with observation; as if he says, "Seek not to know the time when the kingdom of heaven shall again be at hand. For that time can be observed neither by men nor angels, not as the time of the Incarnation which was proclaimed by the foretelling of Prophets and the heraldings of Angels." Wherefore He adds, Neither shall they say, Lo here! or, Lo there! Or else, They ask about the kingdom of God, because, as is said below, they thought that on our Lord's coming into Jerusalem, the kingdom of God would be immediately manifested. Therefore our Lord answers, that the kingdom of God will not come with observation.

Now it is only for the benefit of each individual that He says that which follows, For behold the kingdom of God is within you; that is, it rests with you and your own hearts to receive it. For every man who is justified by faith and the grace of God, and adorned with virtues, may obtain the kingdom of heaven.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And having been asked by the Pharisees when the kingdom of God comes, He answered and said unto them, The kingdom of God comes not by watchings; neither shall they say, Lo! here, or Lo! there: for behold! the kingdom of God is within you. And He said unto the disciples, The days will come, when you shall desire to see one of the days of the Son of man, and shall not see it. And if they shall say unto you, Lo! here, or Lo! there, go you not, neither run thither. For as the lightning that lightens from under heaven gives light to that which is under heaven, so shall the Son of man be in His day. But first He must suffer many things, and be rejected by this generation. And as it was in the days of Noah, so shall it also be in the days of the Son of man. They were eating, and drinking, and were taking wives, and being made the wives of men, until the day that Noah entered into the ark; and the flood came, and destroyed them all. Likewise also as it was in the days of Lot: they were eating and drinking; they were buying and selling; they were planting, were building: but on the day that Lot went out of Sodom, there rained fire and brimstone from heaven, and destroyed them all. So shall it be in the day when the Son of man is revealed.

AGAIN is the Pharisee fighting against God, nor feels that he is kicking against the pricks: for while assuming the appearance of being anxious to learn, he makes a mock at divine mysteries so holy, that "the angels desire to look into them," according to the word of the blessed Peter. For this reason "blindness in part has happened unto Israel," and darkness has blinded their eyes. For that they were dark and blind, so as even often to make the mystery of Christ an occasion of ridicule, any one may learn from what has now been read to us. For they drew near asking Him, and saying, "When will the kingdom of God come?" Moderate your pride, O foolish Pharisee: desist from a mockery that exposes you to heavy and inevitable guilt. "For he, it says, that does not believe the Son, is condemned already, because he has not believed in the Name of the Son of God." For the divine Moses showed before by type and shadow that the Word is the world's way and door of salvation, in that though He is God, He appeared in human form, and endured the death of the flesh for the sake of the whole earth. And the declarations also of the holy prophets agree with what was said by Moses. For they foretold that He would come in due time in form like unto us. And this also came to pass: for He was manifested to those upon earth, having assumed the form of a slave; but even so He retained His natural lordship, and power, and glory such as befits God, as is proved by the splendour of the works He wrought. But you did not believe in Him: you did not accept justification by His means, in that you were obdurate and proud. And after this you ask, "When the kingdom of God shall come?"

As I said therefore, he mocks at a mystery thus truly holy and worthy of admiration. For because the Saviour of all in His public discourses spoke from time to time of the kingdom of God, therefore these miserable men, in contempt of Him,----or perhaps even having it in their mind that being entrapped by their malice, He will have to endure the death upon the cross,----ask in mockery, "When the kingdom of God will come;" as much as to say, that before this kingdom which You talk about, the cross and death will seize You. What therefore does Christ reply? Again He displays His long-suffering and incomparable love unto man: for "being reviled, He does not revile back: suffering, He does not threaten." He does not therefore harshly chide them, nor yet because of their wickedness does He deign to give them an answer to their question, but says that only which is for the benefit of all men, that "the kingdom of God comes not by watchings: for behold! the kingdom of God is within you." For ask not, He says, about the times in which the season of the kingdom of heaven shall again arise and come: but rather be in earnest, that you may be found worthy of it, for "it is within you," that is, it depends upon your own wills, and is in your own power, whether or not you receive it. For every man who has attained to justification by means of faith in Christ, and is adorned by all virtue, is counted worthy of the kingdom of heaven s.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
