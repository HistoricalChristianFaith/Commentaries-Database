[[commentary]]
quote='''
And of this the divine Psalmist shall again be our proof, where he says concerning them; at one time, "Thou hast inclined Thine ear because of the preparation of their heart;" and at another, "Many were their infirmities, and afterwards they went quickly." For many indeed were the offences laid to their charge, to which he gently gives the name of infirmities: for they were wandering in error, and guilty of abominable crimes, not merely in one way, but in many: but they went quickly to the faith, that is, they were not slow in accepting the commands of Christ, but very readily embraced the faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
