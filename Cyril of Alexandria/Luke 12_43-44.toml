[[commentary]]
quote='''
Thus the faithful and wise servant prudently giving out in due season the servants' food, that is, their spiritual meat, will be blessed according to the Saviour's word, in that he will obtain still greater things, and will be thought worthy of the rewards which are duo to friends. Hence it follows, Of a truth I say unto you, that he will make him ruler over all that he hath.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Whoever therefore shall wisely in due season, and according to their need, divide to his fellow-servants their portion, that is, their food, very blessed shall he be, according to the Saviour's word. For he shall be counted worthy of still greater things, and shall receive a suitable recompense for his fidelity. "For he will set him, He says, over all that he has." And this the Saviour has elsewhere taught us, where praising the active and faithful servant, He said, "O good and faithful servant, you have been faithful over few things, I will set you over many things: enter into the joy of your lord."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
