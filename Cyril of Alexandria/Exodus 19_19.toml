[[commentary]]
quote='''
And this is pictured for thee in the writings of Moses. For the God of all came down in the likeness of fire on Mount Sinai, and there was a cloud, and darkness, and gloom, and the voice of the trumpet with a loud ringing sound, according to the Scripture. But the notes of the trumpet were, it says, few at first, but afterwards they waxed longer, and became louder and louder continually. What then was it which the shadow of the law signified to us by these things? Was it not this: that at first there were but few to publish the Gospel tidings; but afterwards they became many? And Christ began the work: and having first chosen the twelve apostles, He afterwards appointed, it says, seventy others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
