[[commentary]]
quote='''
And in commanding us to watch, He adds further for our safety a plain example, which very excellently shows that it is dangerous to act otherwise. For He says, "that if the master of the house had known at what hour the thief would come, he would be awake, and not have suffered his house to be dug through. Be you therefore also ready, for in an hour that you expect not, the Son of man comes." For as His disciple said, "The day of the Lord will come as a thief, in which the heavens shall suddenly pass away, and the elements being on fire shall melt, and the earth, and the works that are therein shall be utterly burned. But we look for new heavens and a new earth, and His promises." And to this he adds, "Since then all these things shall be dissolved, what manner of persons ought we to be found, being holy and without blame before Him? " For no one at all knows the time of the consummation of all things, at which Christ shall appear from above, from heaven, to judge the world in righteousness. Then shall He give an incorruptible crown to them that are watching; for He is the Giver, and Distributor, and Bestower of the Divine gifts: by Whom, and with Whom, to God the Father be praise and dominion with the Holy Spirit, for ever and ever, Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
