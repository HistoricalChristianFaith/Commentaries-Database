[[commentary]]
quote='''
And their scribes and pharisees murmured, saying unto His disciples:

There are however some  who endeavour to deprive those entangled in sin of the divine gentleness: for they do not admit of repentance, but as it were rebuke the Saviour for seeking His own, and gathering from every quarter that which was scattered: and to these we say, The pharisees set you the example of murmuring, when they saw Levi called, and a crowd of publicans gathered together, and feasting with Christ the Saviour of us all. And going up to the holy apostles, they vented their blame, saying, "Why do ye eat and drink with the publicans?" But they had for answer, "They that are whole need not a physician." For the Saviour of all, as being the physician of spirits, does not withdraw from those in need of Him, but as being able to cleanse them, purposely conversed with those not as yet purified of their sins. But let us see, O pharisee, the overweening pride of thy disposition: for let us take Christ Himself, to Whom all things are known, as the expounder of the great blame that thou broughtest upon thyself by thy overbearing treatment of sinners. For speaking of a Pharisee who vaunted himself when praying, and of a certain publican who accused himself, He said, "Verily I say unto you, that he went down justified to his house rather than that Pharisee." The publican therefore, who confessed his sin, is justified rather than the haughty Pharisee. But for what reason do the Pharisees blame the Saviour for eating with sinners? Because it was the law to put a distinction between the holy and the profane: that is, that whatever was hallowed was not to be brought into contact with things profane. They made the accusation therefore as vindicating the law forsooth: but really it was envy against the Lord, and readiness to find fault. But He shews them that He is present now, not as a judge, but as a physician; and performs the proper duty of the physician's office, in being in the company of those in need of healing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
