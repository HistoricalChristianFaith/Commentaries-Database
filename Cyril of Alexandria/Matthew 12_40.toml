[[commentary]]
quote='''
He said, however, the sign only of Jonah shall be given them, by which is meant the passion upon the cross, and the resurrection from the dead. "For as Jonah," He says, "was in the belly of the fish three days and three nights, so shall also the Son of Man be in the heart of the earth three days and three nights." But had it been possible for Jesus not to have willed to suffer death in the flesh upon the cross, neither would this sign have been given to the Jews: but inasmuch as the passion, wrought for the salvation of the world, was indispensable, it was given these unbelievers for their condemnation. For also in speaking to the Jews, He said, "Destroy this temple, and in three days I will raise it up." But that the abolishing of death, and restoration of corruption by the resurrection from the dead, is a very great sign of the power and godlike authority of the Incarnate Word, will be sufficiently proved, as I imagine, in the judgment of serious men, by the soldiers of Pilate, who were appointed to guard the tomb, having been bribed with a large sum of money to say, that "the disciples came by night, and stole Him." It was therefore no unavailing sign, but rather one sufficient to convince all the inhabitants of the whole earth, that Christ is God, that of His own choice He suffered death in the flesh, but rose again, having commanded the bonds of death to depart, and overthrown corruption. But the Jews did not believe even this: for which reason it was very justly said of them, that "the queen of the south shall rise up in the judgment against this generation."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
