[[commentary]]
quote='''
At another time again; "Remember me, O Lord, with the favour of Your people: and visit me with Your Salvation: that we may see the happiness of Your chosen, and rejoice in gladness with Your people." And who the people are, that are chosen in Christ by God the Father, the wise Peter tells us, when saying to those who have been ennobled by faith: "But you are a chosen generation: a royal priesthood: a holy people, a redeemed multitude: that you may tell forth His virtues, Who has called you out of darkness into His marvellous light."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
