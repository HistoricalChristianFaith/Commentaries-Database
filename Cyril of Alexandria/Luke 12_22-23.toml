[[commentary]]
quote='''
Now the soul is more excellent than food, and the body than clothing. Therefore He adds, The life is more than meat, &c. As if He said, "God who has implanted that which is greater, how will He not give that which is less?" Let not our attention then be stayed upon trifling things, nor our understanding serve to seek for food and raiment, but rather think on whatever saves the soul, and raises it to the kingdom of heaven.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And He said unto His disciples; Therefore I say unto you, Be not anxious for your life, what you shall eat: nor for your body, what you shall put on. For the life is more than meat, and the body than raiment. Consider the ravens, that they sow not nor reap: which have neither closet nor store, and God feeds them: how much more are you better than the birds! And which of you by being anxious can add to his stature one cubit? If you then be not able to do even that which is least, why are you anxious about any thing else? Consider the lilies how they grow: they toil not, neither do they spin: but I say unto you, that even Solomon in all his glory was not arrayed like one of these. If then God so clothe the grass, which is today in the field, and tomorrow is cast into the oven, how much more will He you, O you of little faith? And seek not what you shall eat, nor what you shall drink, neither let your mind be unsettled: for all these things the nations of the world seek after: but your Father knows that you have need of them. But seek His kingdom, and all these things shall be added unto you.

THE law of Moses was ordained for the Israelites, to guide them unto all which it was their duty to do, and to set clearly before them whatever was for their benefit. And they made this a matter of the greatest joy, saying, " Blessed are the children of Israel: for unto us arc made known the things that please the Lord." But I affirm, that we can even more fitly and appropriately use these words: for it was not a prophet, nor yet an angel, who spake unto us, but the Son in His own person, even He Who is Lord of the holy angels and of the prophets. And this the wise Paul, the minister of His mysteries, clearly teaches us, thus writing; "God, Who in manifold parts and manifold manners spoke in old times to the fathers by the prophets, has in these last days spoken unto us by the Son, Whom He has appointed Heir of all; and by Whom also He made the worlds." Blessed therefore are we, in that we are taught by Himself His good and saving will, by which we are guided into all virtuous pursuits, that having so fulfilled a life worthy of emulation, such as befits the elect, we may reign with Him.

Observe therefore how carefully, and with what great skill He fashions the lives of the holy apostles unto spiritual excellence. But with them He benefits us also: for He wills that all mankind should be saved, and should choose the wise and more excellent life. For this reason He makes them abandon superfluous anxiety, and does not permit them to practise a careworn and urgent industry through the wish of gathering what exceeds their necessities; for in these matters a superfluity adds nothing to our benefit. "Be not anxious therefore, He says, for your life, what you shall eat: nor for your body, what you shall put on. For the life is more than meat, and the body than raiment." He did not simply say, "Be not anxious;" but added "for your life:" that is, do not expend any careful study on these things, but bestow your earnestness on things of far higher importance. For the life indeed is of more importance than food, and the body than raiment. Since therefore a risk is laid upon us that concerns both life and body, and pain and punishment are decreed against those who will not live uprightly, let all anxiety be laid aside respecting raiment and food.

And besides how is it not a base thing for those who arc lovers of virtue, and earnest followers after such manly virtues as are excellent and approved of God, to be intoxicated with fine apparel like young boys, and to run after expensive banquets! For there follow immediately upon these things a savage crowd also of other lusts: and the result is apostasy from God: for it is written, "Love not the world, neither the things that are in the world." And again; "Know you not that the love of the world is enmity with God!" It is our duty therefore to keep our foot apart from all worldly desires, and rather to take delight in those things which please God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
