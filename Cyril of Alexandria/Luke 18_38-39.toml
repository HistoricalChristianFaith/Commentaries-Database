[[commentary]]
quote='''
Having been brought up a Jew, he was not ignorant that of the seed of David should God be born according to the flesh, and therefore he addresses Him as God, saying, Have mercy upon me. Would that those might imitate him who divide Christ into two. For he speaks of Christ as God, yet calls Him Son of David. But they marvel at the justice of his confession, and some even wished to prevent him from confessing his faith. But by checks of this kind his ardour was not damped. For faith is able to resist all, and to triumph over all. It is a good thing to lay aside shame in behalf of divine worship. For if for money's sake some are bold, is it not fitting when the soul is at stake, to put on a righteous boldness? As it follows, But he cried out the more, Son of David, & c.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"
