[[commentary]]
quote='''
They know not how great is that nature which the mind cannot understand nor speech describe, and which rules over all. For to it all things are small: and so the blessed prophet Isaiah teaches us where he says; "If it is true that all the nations are as a drop from a cask, and are reckoned as the turn of a balance, and shall be counted as spittle, to what have you likened the Lord?" For what is one drop from a cask? and what is the turn of a balance? and what too is spittle?—that is, a single expectoration? If therefore this be the position of all things towards God, how can it be a great matter to Him, or one that occasions Him trouble, to have the care of all things? The noxious sentiments therefore of the heathen are bereft of reason.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
