[[commentary]]
quote='''
Having thus then stirred up their minds by the writings of the law and the prophets, He afterwards more plainly sets Himself before them, when, having consented to their request to go with them to the village, He took bread, and blessed it, and brake, and divided it among them. " For their eyes, it says, "were held that they might not know Him," until namely the word had entered stirring up their heart to faith, and then, rendering what they had before heard and believed visible, He offered them the sight seasonably after the hearing. He does not, however, continue with them, for "He vanished, it says, out of their sight." For our Lord's relation to men after His resurrection does not continue the same as before, for they too have need of renovation, and a second life in Christ, that the renewed may associate with the renewed, and the incorruptible approach the incorruptible. For which reason, as John tells us, He did not permit Mary to touch Him, until He should go away and return again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
