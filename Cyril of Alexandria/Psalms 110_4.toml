[[commentary]]
quote='''
O foolish Pharisee, come and let me tell you somewhat you cannot gainsay, pleading to you the cause of Christ our common Saviour. If you were acquainted with the Scriptures, which are inspired by God, and the words and predictions of the holy prophets, you would have remembered perchance the blessed David, who says in the Spirit to Christ the Saviour of all, "The Lord has sworn, and will not repent, You are a priest for ever after the order of Melchisedek." Explain, therefore, what Pharisee or Scribe has ministered to God after the order of Melchisedek, who blessed and received tithes of Abraham? And as the very wise Paul writes, "Without all contradiction the less is blessed of the better." The root and commencement therefore of the very existence of Israel, even the patriarch Abraham, was blessed by the priesthood of Melchisedek: but Melchisedek and his priesthood was a type of Christ the Saviour of us all, Who has been made our High Priest and Apostle; not bringing near to God the Father those who believe in Him, by means of bloody sacrifices and offerings of incense, but perfecting them to holiness by a service superior to the law: for "such a High Priest have we, Who has sat down at the right hand of the throne of the Majesty on high."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
