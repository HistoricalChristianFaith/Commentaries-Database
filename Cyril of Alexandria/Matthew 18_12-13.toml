[[commentary]]
quote='''
"Which of you that has a hundred sheep, and has lost one of them, will not leave the ninety-nine in the mountain, and go and seek that which has gone astray? And if he chance to find it, verily I say unto you, that he rejoices more in it, than in the ninety-nine which went not astray." For the multitude of rational created beings which form Christ's flock in heaven and on earth is innumerable, and so great as even to mount up unto a perfect number. For this is what is signified to us by the term "one hundred." The companies then of the holy angels are the ninety-nine; for, as I said, they are many: but the flock on earth is one, but yet useful to complete the number, and sought for also by Christ. Did He then seek it as that which was lost, or as that which had not yet suffered this? But it is plain that that which is lost is sought for. In what manner then had it been lost? By being brought down into sin: by wandering from the divine will, and going far astray from the universal Shepherd.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"

[[commentary]]
quote='''
And He calls these on earth a "little flock.'' For we are inferior to the multitude of the angels, who are innumerable, and incomparably surpass in might our mortal things. And this too the Saviour has Himself taught us, in that parable in the Gospels so excellently framed for our instruction: for He said, "What man of you, that has a hundred sheep, and one of them go astray, will not leave the ninety and nine upon the mountains, and go to seek that which has strayed? And if he chance to find it, verily I say unto you, that he will rejoice in it more than in the ninety and nine which went not astray." Observe therefore, that while the number of rational created beings extends to ten times ten, the flock that is upon earth is but as one out of a hundred. But though it is little, both by nature and number and dignity, compared with the countless troops of the spirits that are above, yet has the goodness of the Father, which surpasses all description, given also to it the portion of those transcendent spirits, I mean the kingdom of heaven: for permission is given to whosoever will to attain thereunto.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
