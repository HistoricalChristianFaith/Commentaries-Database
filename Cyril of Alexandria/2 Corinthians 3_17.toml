[[commentary]]
quote='''
The Son therefore is in His own nature Lord as being free: as the wise Paul has again taught us, thus writing: "But we all, with open face, beholding as in a glass the glory of the Lord, are changed into the same likeness, from glory to glory, as by the Lord, the Spirit." "Now the Spirit is the Lord: but where the Spirit of the Lord is, there is liberty." Observe therefore how he affirms that the Spirit is Lord: not as possessed of sonship; for He is the Spirit, and not the Son; but as being co-essential with the Son, Who is Lord and free, and proved by this natural equality with Him to possess that freedom which befits God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
