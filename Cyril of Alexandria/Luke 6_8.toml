[[commentary]]
quote='''
For this is the way of the envious man, he feeds in himself his pang of grief with the praises of others. But the Lord knew all things, and searches the hearts; as it follows, But he knew their thoughts, and said to the man who had the withered hand, Rise up, and stand. And he arose, and stood forth, that perchance he might stir up the cruel Pharisees to pity, and allay the flames of their passion.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And what once more said He to this, Who knoweth all things, Who searcheth the hearts, and understandeth whatever is therein? "For with Him is the light," as Scripture declares. "He spake to him that had the withered hand, Stand forth into the midst." And why did He do this? It might perhaps be to move the cruel and unpitying Pharisee to compassion: the man's malady perhaps might shame them, and persuade them to allay the flames of envy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
