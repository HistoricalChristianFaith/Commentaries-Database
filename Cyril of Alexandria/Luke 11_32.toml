[[commentary]]
quote='''
He says, moreover, that the Ninevites will appear for the condemnation of the Jews at the season of judgment: for they were rude and barbarous people, ignorant of Him Who by nature and in truth is God, who had never even heard of the predictions of Moses, and were without knowledge of the glorious tidings of prophecy: but even though this was their mental state, they repented, He says, at the preaching of Jonah. Far better therefore were they than the Israelites, and will condemn them. But listen to the very words: "The men of Nineveh shall rise up in the judgment with this generation, and shall condemn it; for they repented at the preaching of Jonah, and behold! a greater than Jonah is here."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
