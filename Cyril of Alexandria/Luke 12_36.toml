[[commentary]]
quote='''
Now consider that He comes from the wedding as from a festival, which God is ever keeping; for nothing can cause sadness to the Incorruptible Nature.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And that we ought to look for the coming again of Christ from heaven;—for He will come in the glory of the Father with the holy angels;—He has taught us saying, "That we must be like unto men that wait for their lord, when he will return from the banqueting-house, that when he has come and knocked, they may open to him immediately." For Christ will return as from a feast: by which is plainly shown, that God over dwells in festivals, such as befit Him. For above there is no sadness whatsoever: since nothing can grieve That nature Which is incapable of passion, and of being affected by anything whatsoever of this kind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
