[[commentary]]
quote='''
But if I by Beelzebub cast out the devils, by whom do your sons cast them out? Therefore they shall be your judges. But if I by the finger of God cast out the devils, then the kingdom of God has come upon you. When the strong man armed guards his house, his goods are in peace: but when He Who is stronger than he shall come upon him, and overcome him, He takes from him all his armour wherein he trusted, and divides his spoils. He that is not with Me is against Me: and he that gathers not with Me, scatters for Me. When the unclean spirit has gone forth from the man, it wanders about in places where there is no water, seeking rest: and not having found it, then it says, I will return to my house, whence I came out. And when it comes, it finds it empty, swept, and garnished. Then it goes, and brings seven other spirits worse than itself, and they enter in and dwell there. And the last state of that man is made worse than the first.

THE God of all, blaming the haughtiness of the Jews, and their constant tendency to run into disobedience, thus spoke by the voice of Isaiah; "Hear, O heavens, and give ear, O earth; for the Lord has spoken. I have begotten, and brought up sons; and they have rejected Me." For they rejected God the Father, by setting in manifold ways the Son at nothing, Who, though sprung from Him by nature, yet afterwards was made like unto us for our sakes: and yet He called them unto the grace that is by faith, and would have fulfilled the promise given unto their fathers. For of this the sacred Paul bears witness, where he writes, "For I say that Christ was a minister of the circumcision, to fulfil the promises of the fathers: and that the Gentiles might glorify God for mercy." The Only-begotten Word of God therefore was made man, that He might fulfil the promise of the blessing granted unto them. And that they might know that it was He Whom the law had prefigured by shadows, and Whom the company also of the holy prophets had foretold, He wrought these godlike deeds, and rebuked the unclean spirits. But they, though it was their duty to have praised Him, as doing wonders, as One Who possessed a power and authority beyond that of nature, and incomparable in degree, on the contrary disparaged His glory, saying, "This man only casts out devils by Beelzebub the prince of the devils." And what doth Christ reply to this? "If I by Beelzebub cast out devils, by whom do your sons cast them out?"

Now this subject was explained by me to you at length at our last meeting. But inasmuch as it is right that the wickedness of the Jews, in thus idly prating against Him, should still further be rebuked by many and convincing arguments, He adds on this account to what had been already said, an unanswerable consideration. And what this is, I will now mention to you as to my children.

The blessed disciples were Jews, and the children of Jews, according to the flesh; but they had obtained authority from Christ over unclean spirits, and set free those that were possessed by them, by calling over them these words, "In the Name of Jesus Christ." For Paul also once with apostolic authority commanded an unclean spirit, saying, "I command you, in the Name of Jesus Christ, to come out of her." When therefore He says, your own children in My Name trample upon Beelzebub, by rebuking his satellites, and expelling them forthwith from those in whom they are, what else is it but manifest blasphemy, joined with great ignorance, to say that I borrow this power from Beelzebub? You are convicted therefore, He says, by the faith of your own children, if, as is the case, they having received of Me authority and power, overthrow Satan, and against his will drive him from those in whom he dwells; while you affirm, that I make use of his agency in working divine miracles. But inasmuch as what you say is not true, but, on the contrary, empty and false, and liable to the charge of calumny, it is plain that I cast out devils by the finger of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
