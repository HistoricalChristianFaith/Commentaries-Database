[[commentary]]
quote='''
What reward therefore did he receive? Of what honours was he counted worthy? Or what benefit did the thief gain who was the first to profess faith? He lit upon a treasure worth the having: he became rich unexpectedly, and possessed of every blessing: he won the inheritance of the saints, and to have his name written above, in heaven: he was in the book of life who was bearing the sentence of death, and is numbered with the dwellers in the city that is above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
