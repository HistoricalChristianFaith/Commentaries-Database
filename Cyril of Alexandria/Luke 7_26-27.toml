[[commentary]]
quote='''
What then did ye go out to see? Perhaps ye say, A Prophet. Yea, I also say as well as you. For he is a saint and a prophet: nay, he even surpasses the dignity of a prophet; for not only did he announce before that I am coming, but pointed Me out close at hand, saying? "Behold the Lamb of God, That beareth the sin of the world." Moreover, he was testified of by the prophet's voice, "as sent before My face, to prepare the way before Me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Cyril%2520of%2520Alexandria%2FCommentary%2520on%2520the%2520Gospel%2520of%2520Luke.html'
source_title="Commentary on the Gospel of Luke"
