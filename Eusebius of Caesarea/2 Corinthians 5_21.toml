[[commentary]]
quote='''
And any Jews, of course, who have taken refuge in Christ, even if they attend no longer to the ordinances of Moses, but live according to the new covenant, are free from the curse ordained by Moses, for the Lamb of God has surely not only taken on Himself the sin of the world, but also the curse involved in the breach of the commandments of Moses as well. The Lamb of God is made thus both sin and curse—sin for the sinners in the world, and curse for those remaining in all the things written in Moses' law. And so the Apostle says: "Christ has redeemed us from the curse of the law, being made a curse for us"; and "Him that knew no sin, for our sakes he made sin."For what is there that the Offering for the whole world could not effect, the Life given for the life of sinners, Who was led as a lamb to the slaughter, and as a lamb to the sacrifice, and all this for us and on our behalf? And this was why those ancient men of God, as they had not yet the reality, held fast to their symbols. This is exactly what our Saviour teaches, saying:

"Many prophets and righteous men have desired to see those things which ye see, and have not seen them; and to hear those things which ye hear, and have not heard them."

And we, who have received both the truth, and the archetypes of the early copies through the mysterious dispensation of Christ, can have no further need for the things of old.

He then that was alone of those who ever existed, the Word of God, before all worlds, and High Priest of every creature that has mind and reason, separated One of like passions with us, as a sheep or lamb from the human flock, branded on Him all our sins, and fastened on Him as well the curse that was adjudged by Moses' law, as Moses foretells: "Cursed is every one that hangeth on a tree." This He suffered "being made a curse for us; and making himself sin for our sakes."And then "He made him sin for our sakes who knew no sin,"and laid on Him all the punishments due to us for our sins, bonds, insults, contumelies, scourging, and shameful blows, and the crowning trophy of the Cross. And after all this when He had offered such a wondrous offering and choice victim to the Father, and sacrificed for the salvation of us all, He delivered a memorial to us to offer to God continually instead of a sacrifice.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 10"
