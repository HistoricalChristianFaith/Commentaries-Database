[[commentary]]
quote='''
The words:

"If an enemy had reproached me, I could have borne it, and if he that hated me had magnified himself against me, I would have hid myself from him: but it was even thou, O man like-minded, my guide and my friend, who in companionship with me sweetened my food,"

resemble—"For the man of my peace, in whom I trusted, he that ate of my bread, hath lifted up his heel against me," said of Judas in the previous prophecy. As then there he was shewn to be a man of peace, when he was the Saviour's disciple and numbered among the apostles, so here he is called like-minded, His guide and His friend. And as there it was said of him, "He that eateth with me hath lifted up his heel against me," so also here it is said to the same person, "Who in companionship with me sweetened my food." Yea, for he was privileged to be one of them that partook of the secret companionship and spiritual food that our Saviour gave His disciples. For to the crowds and multitudes without He spoke in parables, but only to His disciples, of whom Judas was reckoned one, did He unfold all things. So it is said, "He that ate my bread hath lifted up his heel against me," and, "who in companionship sweetened my bread." This Aquila interprets more clearly, "We together supped sweetly on mysteries," and Symmachus, "We joined together in sweet companionship." And instead of, "Thou, O man like-minded, my guide and friend," Symmachus renders, "Thou, O man of like disposition, my guide and my friend." Now if he was privileged to stand so high among the friends of our Saviour, His words about him are natural, "If an enemy had reviled me, I would have borne it," and that which follows.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 2"
