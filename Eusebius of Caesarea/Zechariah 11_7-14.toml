[[commentary]]
quote='''
But if the price of Him that was valued, there cast down rendered the House profane, it is natural for Him to proceed to say, "And I cast the second rod, the Rope, to break the covenant between Judah and Israel."

For from that day the multitude of the nation was cut away from God's ancient providential guardianship. And I suppose the second rod to mean the whole Jewish nation. It is therefore called a Rope in the words, "The one I called Beauty, and the other I called a Rope." And he proceeds to speak clearly of the second: "And I cast away the second rod, the Rope, to break my covenant between Judah and Israel." For they were the Rope and the second rod. But the first rod, called Beauty, was Jerusalem itself, and the Mosaic Worship, and the whole of the old covenant. This is shewn by the prophecy, saying, "And I will take my rod of beauty, and I will cast it away, to break my covenant." You sec that it says that the first rod was the Covenant, and the second rod the Rope, but He threatens to cast them both away, first saying, "And I will take for myself two rods, the one I called Beauty, and the other I called a Rope"; or with Symmachus, "The one I called glory, and the other I called a Rope." For thus he rightly styled the glory and beauty of the whole nation the divine Law, and the Covenant, which it included. For the solemnities of Jerusalem, and the high-priestly ritual, and all the ancient observances of the divine Law and old Covenant, were a fair glory to them that lived under their order. And the multitude of the nation is called a Rope by Moses, when he says: "The portion of the Lord is His people Jacob, and Israel is the Rope of His inheritance."

But here it is prophesied that there will be a complete change of the two rods at the time named, so that the ancient Covenant that was therein of old, and its ancient beauty being destroyed, and the Rope and the whole nation broken through, when they had valued for thirty pieces of silver Him that was valued, they should bear the fit dishonour for their impiety. It therefore says, "And I will take my rod of Beauty, and cast it away, and break my covenant." And also, "And I cast away the second rod, the Rope." And when the prophecy goes on to say, "And I will take away three shepherds in one month," I think that it refers to the three divisions of the ancient leaders of the people of God----the King, the Prophet, and the High-Priest----for by those three shepherds all the affairs of the ancients were managed. But since those three offices were destroyed together in our Saviour's time----(for their king reigned not in accordance with the Law, being a foreigner and not a member of the Jewish race; their high-priest was appointed to his office by the Romans, and did not attain his rank by the order of succession of the tribe, nor according to lawful custom; and their prophets that had ceased until John arose were no longer active among them, but they had instead a wicked false prophet who led the people astray)---- He rightly threatens that He will take away at one time the three offices of grace, that had of old adorned the whole nation with wondrous glory, and says, "And I will take away three shepherds in one month, and my heart shall be sorrowful for them." For which Aquila renders, "And my soul was torn asunder for them," Symmachus, "And my soul perished for them," and Theodotion, "And my soul perished about them." And he gives the reason of the perishing of his soul, saying, "For their souls were hardened to me." Instead of this Aquila has, "For their soul was strong in me"; and Symmachus, "And their soul reached its height in me." And a similar expression to the words, "Their souls are hardened to me," of the Septuagint, is found in Jeremiah as spoken by the Lord, namely:

"I have left my home, I have forsaken my inheritance, I have given my beloved soul into the hand of its enemies. My inheritance has become to me as a lion in a forest, it has opened on me its voice. Is not my beloved now to me as a hyaena's cave? "

And then He naturally goes on to say:

"I will not shepherd you, that which is dying may die, that which is failing may fail, and let the remnant eat each one the flesh of his neighbour."

And after this He says, "I will take my rod of beauty and cast it away." For which Aquila renders: "And I took my rod, the Glory, and cut it off," meaning the Mosaic Worship. Thus the first rod mentioned in the beginning of the passage is said to be the first to be broken and cast away. But when the price of Him that was valued and the money paid for Him to the traitor was cast into the House of the Lord as into a furnace, then we see what is prophesied will happen to the second rod, that is to say to the whole nation in the words, "And I cast away the second rod, the Rope, to break my covenant between Judah and Israel."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 4"
