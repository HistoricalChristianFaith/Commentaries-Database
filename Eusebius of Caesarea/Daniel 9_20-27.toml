[[commentary]]
quote='''
[Passage quoted, Dan. ix. 20-27.] (Given in full on account of wide divergence from S.)

"20. AND while I yet spake and prayed and confessed my sins and the sins of my people Israel, and casting my misery before the holy Mount of my God, 21. and while I yet spake in prayer, behold the man Gabriel, whom I had seen at the beginning came flying, and he touched me about the time of the evening sacrifice. 22. And he instructed me and spake with me, saying, O Daniel, 23. I am now come forth to impart to thee understanding. At the beginning of thy supplication the word came forth, and I am come to tell thee, for thou art a man greatly beloved: therefore consider the matter, understand the vision, for thou art a man greatly beloved. 24. Seventy weeks have been decided on for thy people, and for the holy city, for sin to be ended, and to seal up transgressions, and to blot out iniquities, and to make atonement for iniquities, and to bring in everlasting righteousness, and to seal the vision and the prophecy, and to anoint the Most Holy. 25. And thou shalt know and understand, that from the going forth of the command for the answer and for the building of Jerusalem until Christ the Prince shall be seven weeks, and sixty-two weeks; and then it shall return, and the street shall be built, and the wall, and the times shall be exhausted. 26. And after the sixty-two weeks, the Anointing shall be destroyed, and there is no judgment in him, and he shall destroy the city and the sanctuary together with the coming prince; they shall be cut off in a flood, and, to the end of the war which is rapidly completed, in desolations. 27. And one week shall establish the covenant with many: and in the midst of the week my sacrifice and drink-offering shall be taken away: and on the temple shall be an abomination of desolations: and at the end of time shall an end be put to the desolation.

When the captivity of the Jewish people at Babylon was near its end, the Archangel Gabriel, one of the holy ministers of God, appeared to Daniel as he prayed, and told him that the restoration of Jerusalem was to follow without the slightest delay, and he defines the period after the restoration by numbering the years, and foretells that after the predetermined time it will again be destroyed, and that after the second capture and siege it will no longer have God for its guardian, but will remain desolate, with the worship of the Mosaic Law taken away from it, and another new Covenant with humanity introduced in its place. This was what the Angel Gabriel revealed to the prophet as by secret oracles.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 2"
