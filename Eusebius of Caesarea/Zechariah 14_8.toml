[[commentary]]
quote='''
And in that day it says: "Living water shall come forth out of Jerusalem." This is that spiritual, sweet, life-giving and saving drink of the teaching of Christ, of which He speaks in the Gospel according to John, when instructing the Samaritan woman:

"If thou knewest who it is that saith to thee, Give me to drink, thou wouldst have asked of him, and he would have given thee living water."

This was the living water, then, that came forth from Jerusalem? For it was thence that its Gospel went forth, and its heralds filled the world, which is meant by the words: "The living water shall go forth to the first sea and the last sea," by which is meant the bounds of the whole world, that toward the Eastern Ocean being called "the first sea," that toward the West being meant by "the last sea," which, indeed, the living water of saving Gospel teaching has filled. Of which He also taught, when He said: "Whosoever shall drink of the water, which I shall give him, shall never thirst." And again He says: "Rivers of living water shall flow out of his belly, springing up into everlasting life." And again: "If any thirst, let him come unto me and drink."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 18"
