[[commentary]]
quote='''
But in order not to extend my present argument to too great length, to sum all up I will consider His Death, which was not the common death of all men. For He was not destroyed by disease, nor by the cord, nor by fire, nor even on the trophy of the Cross were His legs cut with steel like those of the others who were evil-doers; neither, in a word, did He reach His end by suffering from any man any of the usual forms of violence which destroy life. But as if He were only handing His life over willingly to those who plotted against His body, as soon as He was raised from the earth He gave a cry upon the tree, and commended His Spirit to His Father, saying these words: "Father, into thy hands I commend my spirit"; thus uncompelled and of His own free will He departed from the body. And His body having then been taken by His friends, and laid in the fitting tomb, on the third day He again took back again the body which He had willingly resigned before when He departed.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 4"

[[commentary]]
quote='''
Now the laws of love summoned Him even as far as Death and the dead themselves, so that He might summon the souls of those who were long time dead. And so because He cared for the salvation of all for ages past, and that "He might bring to naught him that hath the power of death," as Scripture teaches, here again he underwent the dispensation in His mingled Natures: as Man, he left His Body to the usual burial, while as God He departed from it. For He cried with a loud cry, and said to the Father: "I commend my spirit," and departed from the body free, in no wise waiting for death, who was lagging as it were in fear to come to Him; nay, rather, He pursued him from behind and drove him on, trodden under His feet and fleeing, and He burst the eternal gates of his dark realms, and made a road of return back again to life for the dead there bound with the bonds of death. Thus, too, His own body was raised up, and many bodies of the sleeping saints arose, and came together with Him into the holy and real City of Heaven, as rightly is said by the holy words: "Death has prevailed and swallowed men up"; and again: "The Lord God has taken away every tear from every face."

And the Saviour of the Universe, our Lord, the Christ of God, called Victor, is represented in the prophetic predictions as reviling death, and releasing the souls that are bound there, by whom He raises the hymn of victory, and He says these words:

"From the hand of Hades I will save them, and from death I will ransom their souls. O Death, where is thy victory? O Death, where is thy sting? The sting of death is sin, and the strength of sin is the law."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 12"
