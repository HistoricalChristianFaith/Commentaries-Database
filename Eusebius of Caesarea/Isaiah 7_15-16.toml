[[commentary]]
quote='''
But also Emmanuel, the child of the Virgin, is to be endowed with more than human power, He is to choose the good before He knows evil, and to refuse evil in choosing the good: and this not in manhood but in childhood. Therefore it runs, "Before the child knows good or evil, he shall refuse evil in choosing the good," which shews that He is completely immune from evil.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
