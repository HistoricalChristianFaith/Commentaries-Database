[[commentary]]
quote='''
[Passage quoted, Gen. xviii. 27.]

The oracle says that God will not hide from the man dear to Him a mystery that is hidden and secret to many, but will reveal it to him. And this was the promise that all the nations should be blessed, which had of old been hidden through all the nations in Abraham's day being given over to unspeakably false superstition, but is now unveiled in our time, through the Gospel teaching of our Saviour that he who worships God in the manner of Abraham will share His blessing. We must not suppose that this oracle referred to Jewish proselytes, since we have very fully shown in the preceding book the impossibility of all nations following the law of Moses. And as I have proved in the same book that the blessing on all nations given to Abraham could only apply to the Christians of all nations, I will refer those interested to the former passage.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 1"
