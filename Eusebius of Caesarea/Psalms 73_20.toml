[[commentary]]
quote='''
And now they are not,—the haters of God,—for they never were. After they had troubled and been troubled for a little time, they suffered the fitting punishment, and brought themselves and their friends and their relatives to total destruction, so that the declarations inscribed of old in sacred records have been proved true by facts. In these declarations the divine word truly says among other things the following concerning them:

'The wicked have drawn out the sword, they have bent their bow, to slay the righteous in heart; let their sword enter into their own heart and their bows be broken.' And again: 'Their memorial is perished with a sound' and 'their name hast thou blotted out forever and ever'; for when they also were in trouble they 'cried out, and there was none to save: unto the Lord, and he heard them not.' But 'their feet were bound together, and they fell, but we have arisen and stand upright.' And that which was announced beforehand in these words,—'O Lord, in thy city thou shalt set at naught their image,'—has been shown to be true to the eyes of all.

But having waged war like the giants against God, they died in this way.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%252010.html"
source_title="Church History, Book 10, Chapter 4"
