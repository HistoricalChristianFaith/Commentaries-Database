[[commentary]]
quote='''
"And they that are left in Judaea, shall take root downwards, and bear fruit upwards, because there shall be a remnant from Jerusalem, and the preserved from Mount Sion. The zeal of the Lord of Sabaoth will do this."

He prophesies that those of the Jewish race that are left according to the election of grace, will cast root downwards and bear fruit upwards, shewing very clearly the election of the apostles and disciples of our Saviour. For they, being left from those of the Circumcision, thrust down into the earth the roots of their teaching, so that they have fixed and rooted their teaching throughout the whole world : and they have exhorted men to bear both seed and fruit upwards towards the heavenly promises.

Thus those men themselves, who were left of the Jewish race, when the rest were destroyed, alone are said to be saved. The zeal of the Lord has accomplished this. The zeal of the Lord elected them, in order to provoke the wicked of the Circumcision to jealousy, and He provoked them to jealousy, according to the saying of Moses :

"They have provoked me to jealousy by that which is not God, and I will provoke them to jealousy by that which is not a people. By a foolish people I will anger them."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
