[[commentary]]
quote='''
And this shall take place, it says, "About thee, the Christ of God," for, "Thou Thyself O Lord, who art my hope, hast made the Highest thy refuge." Here, too, you will observe how the prophet, in saying to the Lord Himself, "Thou, Lord, art my hope, thou hast made the Highest Thy refuge," discriminates carefully between One who is Lord in a special sense, and His Father, God Most High. And, therefore, as Christ has made His Father, God Most High, His refuge, it is said to Him:

" Evil shall not attack thee, and no scourge shall approach thy dwelling, for he shall charge his angels concerning thee, to keep thee in all thy ways: They shall bear thee in their hands, lest at any time thou dash thy foot against a stone."

And note, carefully, how in, "For thou, Lord, art my hope, Thou hast made the Highest thy refuge," the equivalent for "Lord" in Hebrew is the Tetragram, which the sons of the Hebrews say must not be spoken and reserve for God alone; but I have previously shewn that it is also used for the Godhead of the Word in many places of Scripture, as in this Psalm which says, as speaking to the person of the Lord Himself, "For Thou, Lord, art my hope, thou hast set the Most High for thy refuge "; as much as to say:

"For thou thyself, O Lord, who art the hope of me that utter this prophecy, knowest a greater than thyself, God Most High, and thou hast made Him thy refuge."

So in the opening of the Psalm it was said of Him:

"He that dwelleth under the protection of the Most High, shall abide under the shadow of the Almighty. He shall say to the Lord, Thou art my helper and my refuge, my God, my Succour, and I will trust on him."

"Since then, thou, O Lord, hast made the Most High thy refuge."

the Psalmist therefore says:

"He shall save thee from the snares of the hunters, and from the troubling word and with his shoulders he shall overshadow thee. Therefore, having such fatherly succour from the Highest, Thou shalt not fear the terror by night, nor any of the evils that are mentioned before, or added after. For thou, O Lord, hast made the highest thy refuge, therefore evil shall not attack thee, and no scourge shall come nigh thy dwelling."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 7"
