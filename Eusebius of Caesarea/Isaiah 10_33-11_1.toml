[[commentary]]
quote='''
And the figure used by the prophet is also exceedingly strange when he says, "O Libanus, open thy gates, and let fire devour thy cedars." For he calls the Temple here, as was not unusual, by the name of Libanus (it is so called in other prophecies). To this the Jews themselves now assent, since Isaiah, too, has a similar prophecy to the one before us, namely:

"Behold, the Lord of Sabaoth shall disturb the noble with might, and the lofty shall be crushed in their pride." And Libanus shall fall with its lofty ones, and there shall come forth a rod from the stem of Jesse, and a flower shall spring up from his roots, and the spirit of the Lord shall rest upon him."

To which he adds:

"And there shall be a root of Jesse, and he that shall rise to rule the Gentiles, in him shall the Gentiles trust."

Here, too, the destruction of Libanus and the call of the Gentiles is connected with the birth of Christ, of the seed of Jesse and David.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 4"
