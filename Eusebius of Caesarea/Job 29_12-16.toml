
[[commentary]]
quote='''
What is to be said of Job the thrice-blessed, the true, the blameless, the just, the holy, what was the cause of his holiness and justice, was it Moses' commandments? Certainly not. Was it the keeping of the Sabbath, or any other Jewish observance? How could that be, if Job was earlier than the time of Moses and his legislation? For Moses was seventh from Abraham, and Job fifth, preceding him by two generations. And if you regard his life, you will see it was untouched by the Mosaic legislation, but not foreign to the teaching of our Saviour. Thus in reviewing his life in his apology to his friends he says:

"12. For I saved the poor from the hand of the powerful, and I helped the orphan who had no helper. The mouth of the widow blessed me, 14. and I was clad in righteousness. I put on judgment as a cloak, 15. an eye was I to the blind, a foot to the lame, 16. I was a father of the weak."

This surely is exactly the same teaching which is preached to us all in the Gospel.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"
