[[commentary]]
quote='''
[Passage quoted, Zech. xiv. 1, 2.]

The fulfilment of this also agrees with the passages quoted on the destruction of the whole Jewish race, which came upon them after the coming of Christ. For Zechariah writes this prophecy after the return from Babylon, foretelling the final siege of the people by the Romans, through which the whole Jewish race was to become subject to their enemies : he says that only the remnant of the people shall be saved, exactly describing the apostles of our Saviour.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
