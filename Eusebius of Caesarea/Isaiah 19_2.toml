[[commentary]]
quote='''
Hence, soon among the Egyptians as among other nations, revolution and civil war arose, between those who gave up polytheistic error and turned to the Word of Christ, and those who warred with them, urged on by their own daemons, so that brothers were parted one from the other, and the dearest fought together because of the Gospel of Christ, for the oracle says, "And Egyptians shall rise against Egyptians, and a man shall fight with his brother, and a man with his neighbour." And our Saviour Himself confirms the prophet's prediction, saying in the Gospels:

"Brother shall deliver brother to death, and father child, and children shall rise up against their parents and slay them."

And again:

"Think not that I came to give peace on earth. I say not so unto you, but division. For there shall be from this time five in one house divided, three against two and two against three: For the father shall be divided from his son, and the son from his father, the mother against her daughter, and the daughter against her mother, the mother-in-law against the bride, and the bride against her mother-in-law."

How do those words differ from the prophet's cry concerning the coming of the Lord to Egypt: "Egyptians shall rise against Egyptians, and man shall war against his brother"?

And the law of the new Covenant of Christ was raised against the law of polytheistic superstition, when the law of idolatrous nations warred against the teaching of Christ, and the city and polity of the Church of Christ took the place of the polities of the heathen nations. And this explains "city against city, and law against law."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 20"
