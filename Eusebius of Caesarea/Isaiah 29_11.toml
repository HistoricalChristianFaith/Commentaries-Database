[[commentary]]
quote='''
Instead of "Seal the vision and the prophet,'' Aquila gives, I think, a more suitable rendering, viz. "And for fulfilling vision and prophet." For our Lord Jesus Christ did not come as it were to seal up the visions of the prophets, for He rather opened and explained those that were of old obscure and sealed, tearing away so to say the seals impressed on them, and taught His disciples the meaning of the Holy Scriptures. Hence He says, "Behold, the lion of the tribe of Judah hath prevailed, and he has opened the seals that were set on the book," in John's Apocalypse. What are these seals but the obscurities of the prophets? Isaiah knew them well and definitely says too: "And these words shall be as the words of the sealed book." The Christ of God did not come then to shut up the vision and the prophet, but rather to open them and bring them to the light.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 2"
