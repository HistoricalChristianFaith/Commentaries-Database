[[commentary]]
quote='''
And when with divine eyes He saw His body being suspended on the tree, the unembodied and invisible powers without in the air hovering around Him like voracious birds and wild beasts, and knew that almost at once His body would be a corpse, and felt the powers and rulers of the air surging around Him on every side, the spirit which now worketh in the children of disobedience, and the daemons flying over the earth wherever men inhabit, and perhaps also the wild and dreadful beasts of Tartarus, of which Isaiah said, addressing Lucifer that had fallen from heaven: "Hades beneath was disturbed to meet thee, all the giants rose before thee." When, then, He saw all those without surrounding His crucified body, and preparing to attack Him, He describes their array when He says: "Many oxen have surrounded me, fat bulls hem me in. They have opened their mouths against Me, as a lion voracious and roaring." For most likely they thought that the soul which dwelt in the body of Jesus was human and like other human souls; and opened their mouths as if to devour it like the other human souls. So He says, "They opened their mouths on me, like a lion voracious and roaring."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
