[[commentary]]
quote='''
And the same [Moses] by divine inspiration foresaw the name Jesus very clearly and again also endowed this with special privilege. The name of Jesus, which had never been uttered among men before it was made known to Moses, Moses applied first to this one alone. He knew that Joshua, again as a type and a symbol, would receive the rule over all after Moses' death. His successor, at any rate, had never before used the title Jesus. He had been called by another name, Auses, which his parents had bestowed upon him. Moses himself proclaims Jesus, as a privilege of honor far greater than a royal crown, giving him the name because Jesus, the son of Nave, himself bore a resemblance to our Savior, who alone, after Moses and the completion of the symbolic worship transmitted by him, received the rule of true and pure religion. 
'''
source_url=''
source_title="ECCLESIASTICAL HISTORY 1.3"

[[commentary]]
quote='''
MOSES was also the first to use the Name Jesus, when he changed the name of his successor and altered it to Jesus. For it is written: "These are the names of the men whom Moses sent to spy out the land, and Moses called Nauses, the son of Nave, Jesus, and sent them." And notice how the prophet, who was deeply versed in the significance of names, and had gone to the roots of the philosophy of the changed names of the inspired men in his record, and the reasons why their names were changed, introduces Abraham as receiving as a reward of virtue from God a complete change of name from that of his father, the meaning of which it is now the time to explain at length. And so, also, in naming Sara Sarra, and Isaac called before his birth "the laugh," and Jacob given as a reward of his struggle the name of Israel, and in exhibiting in many other cases connected with the power and significance of names superhuman insight in his inspired wisdom and knowledge, when no one of those before him had ever used the name Jesus, he first of all, impelled by the Holy Spirit, gives the name of Jesus to him whom he is about to constitute the successor of his rule over the people, changing the other name he had used before. He did not consider the name of his forefather given him when he was born sufficient (for his parents called him Nauses). But being the prophet of God he changed the name received by birth, and called the man Jesus at the bidding of the Holy Spirit; that he might lead the whole people after his own death, (with the knowledge that) when the law laid down by Moses some day should be changed and have an end, and should pass away like Moses himself, that no one else but Jesus the Christ of God would lead that other polity, which would be better than the former. And so Moses, the most wonderful of all the prophets, understanding by the Holy Spirit both the names of our Saviour, Jesus Christ, honoured the choicest of all his rulers by bestowing them as kingly crowns, naming worthily the two leaders and rulers of the people the high priest and his own successor, Christ and Jesus, calling Aaron Christ, and Nauses Jesus, as his successor after his death. In this manner, then, the writings of Moses himself are adorned with the names of our Saviour Jesus Christ.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 17"
