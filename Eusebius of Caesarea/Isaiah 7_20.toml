[[commentary]]
quote='''
It is also said that the same Lord will shave with the razor of the Assyrian king, that is to say with the discipline of the Prince of this world, the head and the feet and the beard of what can only mean the Jewish race. That is to say He will take away their order and beauty by the might of some universal Empire, He disguises the Romans in this way. For I believe that under the name of Assyrians he means the rule of races, that gain Empire at each period of history, because Assyrians in Hebrew means Rulers. And the Romans are now such Rulers.

And in truth the God of the Universe has taken away all the glory of the Jews, which was as their hair, and all their manhood, signified by their beard and the hairs of their feet, by means of the Roman razor, that is to say their statecraft and military power. And it was only after the Birth of our Saviour, Emmanuel Himself, that God took away all their glory through the Roman rule.

Aquila translates, "By the kingdom of Assyria," for "of the king of Assyria," Theodotion and Symmachus, "By the king of the Assyrians," making it clear that there is no threat to shave the head of the king of Assyria, but that by means of his razor and by means of the king of Assyria the things prophesied will fall on the Jewish nation. And the event justified the prophecy. And one could note carefully at leisure many other sayings in the prophecies apparently directed against the Assyrians, which are quite inapplicable to them, since they refer to the rule of the dominant nation at some particular period. We have thus already seen the Persians called Assyrians by the Hebrews; and so we may conclude that the prophecy here refers to the Roman Empire. For we see them as Rulers under the Rule of God in the period after our Saviour's coming. Yet no one must understand me to say that every reference to the Assyrians in Holy Scripture refers to the Romans; that would be foolish and absurd. But I will shew in the proper place that there are certain prophecies concerned with the witness to Christ, which are to be understood of the Romans under the name of Assyrians, since the meaning of the word always implies the dominant Power of an epoch.

For my part, and I have thoroughly reasoned out the grounds of my opinion, I am persuaded that the only reason why the prophetic writings abstain from naming the Romans is that the teaching of our Saviour Jesus Christ was going to shine throughout the Roman Empire on all mankind, and that the books of the prophets would be popular in Rome itself, and among all the nations under Roman rule. It was therefore to prevent any offence being taken by the rulers of the Empire from a too clear reference to them, that the prophecy was cloaked in riddles, in many other contexts, notably in the visions of Daniel, just as in the prophecy we are considering, in which it calls them Assyrians, meaning Rulers.

It is then with their razor that it prophesies that after the birth of Emmanuel the whole order of the Jews will be abolished.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
