[[commentary]]
quote='''
And afterwards comes the one remaining week, separated from them and divided by a long interval, during which occurred all the other events that are predicted in between, all of which being foretold in the middle of the oracle were fulfilled; they run in the following way: "After the seven and sixty-two weeks the Unction shall be cast out, and there is no judgment in it. And he will destroy the city and the Holy Place with the leader that cometh, and they shall be cut off as by a flood, and until the end of the completion of the war by destructions."

And this was evidently fulfilled in the time of Augustus and Herod, at whose day I say the seven weeks foretold were summed up. The regular and orderly Unction of the High Priest continued uninterrupted until the time of Herod and Augustus, and the ancient line of the High-Priesthood was ended with Alexander, the Father of Hyrcanus; and Herod, after murdering Hyrcanus, is said to have conferred the office no longer on members of the ancestral line, but on obscure and unknown men. This the oracle foresaw and predicted, when it said, "And after the seven and sixty-two weeks, the Unction shall be cast out, and judgment shall not be in it." And this is made clear by the other translators: for Aquila says, "And after the seven weeks and the sixty-two, he that is anointed shall be cast out, and there is no place for him." And Symmachus, "And after the weeks the seven and sixty-two the Christ shall be cut off, and shall not belong to him:" which seems strong confirmation of my interpretation of "Christ the Governor."

It says then that Christ shall be cast out after the completion of the said weeks. Who can this be but the governor and ruler of the high-priestly line? He remained therefore until the weeks were fulfilled; and when they came to an end, the ruler of the nation in the line of succession was cut off as the prophecy foretold. And this was Hyrcanus, whom Herod murdered, and seized the kingdom on which he had no special claim, and he was its first king of alien stock. And moreover Hyrcanus was not only personally cut off as the last anointed successor of the ancient high-priests, but the line as well which descended from those ancient high-priests was itself cut off, and the Legal Unction was no longer used according to judgment, but in a confused and disorderly way not according to the Mosaic enactments. And these events happened concurrently and fulfilled the prediction, "The Unction shall be cast out, and there is no judgment in it." Josephus, himself a Hebrew, is sufficient evidence of this, giving the history of those times in the Eighteenth Book of the Archaeology of the Jews:

"Herod was then made king by the Romans, but did no longer appoint High-Priests out of the family of Asamonaeus, and these were called Maccabeans, but made certain men to be so that were of no eminent families, but only of the Hebrew race, excepting that he gave that dignity to Aristobulus; for he made this Aristobulus, the son of Hyrcanus, high priest, and took his sister Mariamne to wife, aiming at winning the goodwill of the people through their memory of Hyrcanus. Yet did he afterwards, out of his fear lest they should all bend their inclinations to Aristobulus, put him to death in Jericho, and that by contriving to have him suffocated while swimming, as I have already related. But after this man he never entrusted the High Priesthood to the descendants of Hyrcanus. Archelaus also acted like his father Herod in the appointment of the High-Priests, as did also the Romans, who took the government over the Jews into their hands afterwards."

And again in another place he says of them:

"But when Herod came to be king he rebuilt this tower, which was very conveniently situated, in a magnificent manner, and called it Antonia, and he took the high-priestly vestments, which he found lying there, and kept them, believing that while he had them the people would not revolt against him. And Herod's example was followed by Archelaus his son, who was made king after him, after whom the Romans when they entered on the government took possession of the high-priestly vestments, and had them laid up in a stone chamber under a seal."

I think it must be clear to all that this was the fulfilment of the oracle, which said, "And after the seven and sixty-two weeks the Unction shall be cast out, and there is no judgment in it."

And you may see better the meaning of the words, "And there is no judgment in it," if you consider the haphazard appointments of the high-priests after Herod's time and in the time of our Saviour. For whereas by the divine Law it was ordained that a high-priest should hold office all his life and be succeeded by his legitimate son, in the period in question, when the Unction had been cast out as the prophecy foretold, Herod first, and after him the Romans, appointed what high-priests they liked haphazard or not according to the Law, bestowing the dignity on common and unknown men, selling and peddling the office, giving it now to one now to another for a year. And the Evangelist St. Luke seems to imply this, where he says, "In the fifteenth year of the reign of Tiberius Caesar, Pontius Pilate being governor of Judaea, and Herod, Philip and Lysanias being tetrarchs, Annas and Caiaphas being high-priests." For how could they both be high-priest at the same time unless the rules of the high-priesthood were disregarded? "In witness whereof Josephus writes:

"Valerius Gratus the Roman General, after closing the high-priesthood of Ananus, appointed Ismael the son of Pheba, and removing him shortly afterwards appointed Eleazar son of Ananus the high-priest. A year later he removed him, and gave the office to Simon son of Cathimus. He did not remain high priest more than a year, when Josephus, son of Caiaphas, took his place."

I was obliged to give this quotation because of the words "The Unction shall be cast out, and there is no judgment in it,'' which seem to me proved by it beyond any doubt.

After this the prophecy says, "And the city, and the holy place, he will destroy, with the governor that cometh." Here again I understand the rulers of foreign stock who succeeded him to be meant. For as above he named the High-Priests, Christs and Governors, saying, "Until Christ the Governor," in the same way after their time and after their abolition there was no other ruler to come but the same Herod of foreign stock, and the others ruled the nation in order after them, in whose company and by whose aid, using them as his agents, that hateful bane of good men is said to have destroyed the city and the Holy Place. And indeed he destroyed of a truth the whole nation, now upsetting the established order of the priesthood, now perverting the whole people, and encouraging the city (which stands metaphorically for its people) in impiety. And Aquila agrees with my interpretation of the passage, translating thus, "And the people of the governor that cometh will destroy the city and the holy place." Meaning that the city and the Holy Place are not only to be ruined by the leader to come, whom I have identified in my interpretation, but also by his people. And you would not be far wrong in saying, too, that the Roman general and his army are meant by the words before us, where I think the camps of the Roman rulers are meant, who governed the nation from that time, and who destroyed the city of Jerusalem itself, and its ancient venerable Temple. For they were cut off by them as by a flood, and were at once involved in destruction until the war was concluded, so that the prophecy was fulfilled and they suffered utter desolation after their plot against our Saviour, which was followed by their extreme sufferings during the siege. You will find an accurate account of it in the history of Josephus.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 2"
