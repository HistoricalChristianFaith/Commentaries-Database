[[commentary]]
quote='''
But the words, "The things laid up for him," have another sense; let us now consider them, only premising that the Holy Scriptures are accustomed to give the Christ different names. Sometimes they call Him Jacob:

"Jacob, my son, I will help thee; Israel, my chosen, my soul hath received him, he shall bring judgment unto the nations,"

and that which follows. To which is added, "Till he place judgment on the earth, and in his name shall the Gentiles hope." Sometimes they name Him Solomon or David: Solomon as in the 71st Psalm, inscribed to Solomon, whose contents evidently refer to Christ. For the words, "He shall rule from sea to sea, and from the river to the world's end, and all the nations shall serve him," and the contents of the Psalm that follow, can only apply to the Christ. Christ, again, is called David in the 88th Psalm, for expressions therein are only applicable to Him, and not to David, for instance:

"He shall call me, Thou art my father, and I will make him my firstborn, high above the kings of the earth. I will keep my mercy for him for ever."

And again:

"His seed shall remain for ever, and his throne is as the sun before me, and as the moon fixed in the heaven."

So, then, besides the many other names given to Christ by the Holy Scriptures, it is possible that He may be called Judah also in the passage before us, especially as He sprang from the tribe of Judah. For the apostle certifies the fact that our Lord and Saviour sprang from the tribe of Judah. For Him, then, were "the things laid up for Judah" figuratively intended in the prophecy. And what were they? First, the praise of His brethren; second, to lay his hands on the back of His enemies; third, to be worshipped by the sons of His Father. And they came to pass, for His performance of miracles and wondrous prodigies aroused wonder, and He was praised and worshipped by His own disciples and apostles, whom He shrank not from calling brethren, saying by the Psalm, "I will declare thy name to my brethren, in the midst of the Church I will praise thee," and also when He bids the women with Mary announce the news to them as His brethren, for He says, "Make known to my brethren that I ascend to my Father, and your Father, and to my God, and your God." Thus then, His brethren at first praised Him only as a remarkable man because of His miracles, believing Him most likely to be one of the prophets; but when meanwhile they saw His wonderful miracles, and how He destroyed the enemy and the avenger, and death the prince of this world, together with the other unseen hostile powers, thenceforth they believed Him to be God and worshipped Him. And the hands of our Saviour were upon the back of His enemies, when He directed all His deeds and powers and miracles to the destruction of the daemons and evil spirits. Yea, when too He spread out His hands on the Cross, even then His hands were on the back of His enemies, since they fled and turned their backs on Him, and even more, when yielding up His spirit to the Father, disembodied and stripped of that flesh, which He had assumed, He went to the place of His enemies, having life in Himself, to loose death, and the powers arrayed against Him, which perhaps at first conceived that He was an ordinary man and like all men, and so encircled Him and attacked Him as they would any one else, but when they knew that He was superhuman and divine, they turned their backs and fled from Him, so that He laid His hands on them, and drave them on with His divine and sharpened arrows, as is here said, "Thy hands shall be on the backs of thy enemies."

And if to-day many enemies of our Saviour attempt from time to time to war against His Church, these too He routs with invisible hand and divine power, even as it is said of them, "His hands shall be on the back of his enemies." And since also He has received the trophies of victory over His enemies, the words, "The sons of thy father shall worship thee," are also fulfilled: that is to say, all the angels of heaven, and the ministering spirits, and the divine powers, and on earth the apostles and evangelists, and after them those of all nations who through Him are enrolled under the one and only true God and Father, have learned that Christ is God the Word, and have consented to worship Him as God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 1"
