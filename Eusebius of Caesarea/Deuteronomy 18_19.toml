[[commentary]]
quote='''
So then we are not apostates from Hellenism who have embraced Judaism, nor are we at fault in accepting the law of Moses and the Hebrew Prophets, and we do not live as Jews, but according to the system of the men of God who lived before Moses. Nay, we claim that in this we authenticate Moses and the succeeding prophets, in that we accept the Christ foretold by them, and obey His laws, and endeavour prayerfully to tread in the steps of His teaching, for so we do what Moses himself would approve. For he says, in foretelling that God will raise up a prophet like himself, "and every soul which doth not hear that prophet shall be cast out from its race."Therefore the Jews, because they rejected the prophet, and did not hearken to His holy words, have suffered extreme ruin according to the prediction. For they neither received the law of Christ of the new covenant, nor were they able to keep the commands of Moses without some breach of his law; and so they fell under the curse of Moses, in not being able to carry out what was ordained by him, being exiled as they were from their mother-city, which was destroyed, where alone it was allowed to celebrate the Mosaic worship. Whereas we, who accept Him that was foretold by Moses and the prophets, and endeavour to obey Him prayerfully, must surely be fulfilling the prophecy of Moses, where he said: "And every soul, which doth not hear that prophet, shall be cast out from its race."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 7"
