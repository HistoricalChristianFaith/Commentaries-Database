[[commentary]]
quote='''
[Passage quoted, Ezek. vi. 7.]

This also seems to me to agree with the passages from the other prophets. For whom could you call the "saved" but those called by the others "a remnant, and the drop, and the dew of that people," by which was signified the band of the Apostles of our Saviour? They truly being saved from the destruction of all their race, even in their scattering remembered God, so that it must be agreed that what was written referred to them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
