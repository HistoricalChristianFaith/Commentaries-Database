[[commentary]]
quote='''
"The Lord has ascended to the heavens and has thundered: he will judge the extremities of the earth, and he gives strength to our kings, and will exalt the horn of his Christ."

The words mean the return of Christ (Who is named) or of God to heaven, and His Teaching heard like thunder by all, and Holy Scripture foretells His future Judgment of all afterwards. And after this it is said that the Lord will give strength to our kings. And these would be the apostles of Christ, of Whom it is written in Ps. lxvii.: "The Lord will give a word to the preachers of the Gospel with much power." Here, also, he mentions Christ by name, humanly known as our Saviour, Whose horn he says shall be exalted, meaning His invisible Power and Kingdom. For it is usual for Scripture to call a kingdom a "horn," It is found also in Ps. lxxxviii.: "And in my Name shall his horn be exalted."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
