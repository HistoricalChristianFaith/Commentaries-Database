
[[commentary]]
quote='''
And Judah and Israel were to be saved in His days, that is to say all the Jews who through Him reached holiness, His apostles, disciples and evangelists, or perhaps all who represent the Jew mystically understood and the true Israel which sees God spiritually.

"For he is not a Jew," the apostle says, "that is one outwardly, nor circumcision the outward circumcision in the flesh, but he is a Jew which is one in secret, and circumcision is of the heart in the spirit not the letter, whose praise is not of men, but of God."

It is these, then, the secret Jew and the true Israel, that he says are through Christ's calling to be named by a new name, neither Jew nor Israel, but one quite different from these. For He says that the Lord will call them by the name of Josedekeim, which means, "The Lord's just ones."

And I ask you to consider whether this name Josedekeim, by which the disciples of Jesus are called by God, be not formed from Joshua; they would thus be named by men from the name of Christ which is Greek (i. e. Christians), and by the prophets, from Jesus, in the Hebrew tongue, because they are saved by Him, Josedekeim. So it is said, "And this is the name by which the Lord shall call them, Josedekeim among the prophets." So, then, we see that the people that are to become through the subject of the prophecy the spiritual Jews and the true Israel, will be called Josedekeim from Joshua, and they will be called by this name, he says, not by men, but by God, and by His prophets. For you must note carefully the passage that says, "And this is the name which the Lord shall call them, Josedekeim by his prophets." And its translation in Greek is. as I said, "God's just ones."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 3"
