[[commentary]]
quote='''
[Passage quoted, Isa. xlii. 1-7.]

THE Evangelist alludes to this passage, when the Pharisees went out and took counsel against our Saviour to put Him to death, when He healed the sick on the Sabbath day. But Jesus, knowing, as He says, this conspiracy against Him, departed thence, and great multitudes followed Him, and He healed them all, and He straitly charged them that they should not make Him known. And He adds to this the words, "All this was done" (that is to say His departure, and His yielding to those that plotted, and His effort to escape notice in the miracles that He did, and His pledging those that were healed not to make Him known), in order that what was said by the prophet might be fulfilled, when He said:

"Behold, my son, in whom I am well pleased, my beloved in whom my soul delighteth; I will put my spirit upon him, and he shall bear forth judgment to the Gentiles; he shall not strive nor cry, neither shall his voice be heard in the streets. A bruised reed shall he not break, and smoking flax shall he not quench, until he bring forth judgment to victory, and on his name shall the Gentiles trust."

Notice carefully how Matthew, when he says, "Behold my son, in whom I am well pleased, my beloved in whom my soul delighteth," mentions neither Jacob nor Israel. He does not say, "Jacob my son and Israel my beloved," but simply "Behold, my son and my beloved." Hence the names of Jacob and Israel are obelized in the Septuagint, as if the prophecy were not in the Hebrew. And it is silently omitted by the other translators, as it is not found in the Hebrew. And thus it is not inserted by the Evangelist, who was a Hebrew, and followed the Hebrew text in his quotation. Therefore the prophecy does not apply either actually or figuratively to the Jews, but only to the Christ of God, to Whom the clear evidence and the results bear witness. For He alone prophesied the future judgment to the Gentiles, quietly sojourning in human life, and setting judgment on the earth. And not only did He not break the bruised reed, but so to say bound it up, setting up and strengthening the weak and the bruised in heart. And just as He did not neglect the sick and corrupt, who needed His medicine, nor bruise the repentant with hard judgment, so He did not quench them that continued in evil, and were smoking under the fire of passion, by preventing their following their own choice, nor did He punish any of them before the time, reserving the time of their due chastisement for the general Judgment: therefore it is said, "And the smoking flax He shall not quench."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 15"
