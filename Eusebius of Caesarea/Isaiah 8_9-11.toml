[[commentary]]
quote='''
Thus, then, the Hebrew Scriptures contain the double message that Emmanuel would be rejected by the Jews and cause their great miseries, and that He would be accepted by us Gentiles and prove Himself our source of salvation and of the knowledge of God. Wherefore the next saying is, "God is with us: know ye Gentiles and yield." How truly do we yield, we Gentiles that believe on Him, vanquished by the truth and power of Him Who is God with us, and conquered we obey Him everywhere alike, even though we dwell in the very ends of the earth, according to the prophecy which says, "Obey even at the ends of the earth." Yet though we obey Him and hear His call, the prophecy as it proceeds must refer to those nations that do not yet believe, saying, "Ye that were strong be vanquished. For if ye again be strong, ye shall again be vanquished, and whatever word ye take, shall not remain among you, for God is with us. Thus saith the Lord to them that disbelieve with strong hand."

In which words the prophecy says clearly to them that are restive under and rebel against Christ's teaching and put no trust in His strong hand, that they will have no strength if they attempt to war with the God with us, and that whatever counsel they take against Him shall not abide with them, because Emmanuel is with us, and it is easy for us who see the threats directed against us and the attacks of rulers in these days, to realize the truth of the conclusion, and that they can never carry out their threats because God is with us.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
