
[[commentary]]
quote='''
And Jerusalem being meant by Libanus, as is made clear by many prophecies, because of its ancient altar and temple, and the offerings thereon to the honour of God like Libanus, the Church of the Gentiles the fruit of Christ is said to be about to be exalted above Libanus. And if the studious consider this Psalm in its literal sense at leisure, they will find that its contents only apply to our Lord, and not to Solomon of old, or any of his successors on the throne of Judaea, who reigned but a few years, and only over the Jewish land.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 3"
