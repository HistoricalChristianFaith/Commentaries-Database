[[commentary]]
quote='''
And it says lower down :

"And the remnant of Jacob shall be among the nations in the midst of many peoples, as a lion among the cattle of the forest, and as a lion's whelp in the pastures of sheep; as when he goes through, and chooses, and spoils, and there is none to save."

By which I think is meant the bravery and intrepidity of the apostles' preaching. They threw themselves like a lion and a lion's whelp on the thicket of the Gentiles and on the flocks of human sheep, they parted the worthy from the unworthy, and subjected them to the word of Christ.

And then His victories are proclaimed to Him : "Thy hand shall be exalted against them that trouble thee, and all thy enemies shall be destroyed."

And we can see this with our own eyes. For though many have afflicted the word of Christ, and are even now contending with it, yet it is lifted above them and become stronger than them all. Yes, verily, the hand of Christ is raised against all that afflicted Him, and all His enemies who from time to time rise up against His Church are said to be "utterly destroyed."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
