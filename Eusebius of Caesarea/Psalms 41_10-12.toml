[[commentary]]
quote='''
And since the enemies in their plotting said: "When shall he die, and his name perish?" and thought that if he lay down he would never rise up again, therefore our Lord and Saviour praying for the reverse of this, and assured of an unhindered resurrection by His Father, says:

"Lord, have mercy upon me, and raise me up, and I will reward them. In this I know that thou hast favoured me, because my enemy shall not triumph over me."

And it is quite clear how after His resurrection from the dead immediate judgment, that did not tarry, fell on the conspirators, so that death who was the enemy of His return to life was made ashamed, and they that mocked Him said, "O death, where is thy sting? O death, where is thy victory? "And those who have read the history of the times after our Saviour's resurrection, in Josephus, will remember what troubles fell on the Jews and their rulers, involved in which they received the right reward for what they did to Him. All this, then, that fell upon them was the fulfilment of the prophecy: but our Saviour's Resurrection from the dead proved to all that in Him the Father was well pleased, as He tells us when He says:

"Have mercy upon me, and raise me up, and I will reward them. By this I know thou hast favoured me, because my enemy doth not triumph over me."

And notice how in pouring forth this prayer to His God and Father, with what confidence He witnesses boldly to His own sinlessness, although He had said before, "Heal my soul, for I have sinned against thee." But I have already shewn that the words, "I have sinned against thee," are not to be taken literally, and Symmachus interprets them more clearly when he says, "Heal my soul, even if I have sinned against thee," as could well be said of our sins, which our Lord and Saviour took upon Himself. Whereas the words, "Thou hast protected me for my innocence," exhibit the absolute integrity of His nature, to which He traces in His teaching the stability and sureness of His life and His preservation after His Resurrection, when He adds, "Thou hast established me before thee for ever": or, "And thou wilt establish me before thee for ever," according to Symmachus.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 1"
