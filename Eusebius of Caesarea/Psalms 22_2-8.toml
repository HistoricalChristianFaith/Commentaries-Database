[[commentary]]
quote='''
He next says, "My God, I will cry by day, and thou wilt not hear, and by night, and it shall not be folly for me." Instead of which Symmachus has, "My God, I will call by day, and thou wilt not hear, and by night, and there is no silence." He is surely shewing His surprise here that the Father does not hear Him, He regards it as something strange and unusual. But that Father reserved His hearing till the fit time that He should be heard. That time was the hour of dawn, of the Resurrection from the dead, when to Him it could be more justly said than to any, "In a time accepted I heard thee, and in a day of salvation I succoured thee. Behold, now is the accepted time; behold, now is the day of salvation." This, of course, could be said in another sense by our Saviour, as one always accustomed to be heard by the Father, as if He said, to put it more clearly: "Is it possible, O Father, that I, Thine only and beloved Son, should not be heard, when I cry and call to my Father? "For this is the very point He dwells on in John's Gospel at the raising of Lazarus, when He says, "Take away the stone from the sepulchre," and "raised his eyes to heaven and said, Father, I thank thee that thou hast heard me. And I knew that thou hearest me always." If, then, He heareth Him always, it is not in doubt but in absolute assurance that He will be heard, as if it were impossible for Him not to be heard, that He speaks in the form of a question the words: "My God, shall I cry in the day, and thou not hear?" And we must put a note of interrogation after "hear," and understand that the answer to the question is a negative.

And He shews that this is right a little further on in the Psalm, when He says:

"He hath not despised, nor been angry at the prayer of the poor, nor turned his face from him, but when he cried unto him he heard him."

For how could He say negatively, "My God, I will cry by day, and thou wilt not hear," except in the sense I have suggested? And I think He implies this sense when He says, "My God, shall I cry by day, and wilt thou not hear? and by night, and it is not folly for me." "For I do not cry 'Thou wilt not hear,' He says, 'in folly': for I know that I say this inspired by the conviction that it is Thy nature to help and to hear not only me, but all Thy saints. For Thou ever 'dwellest in Thy saints' continually, and art 'the praise' of every godly man that is called 'Israel.' For Thy sake to every one that worships Thee no common praise accrues; in Thee our fathers hoped, and by their trust were saved from the evils that attacked them, 'Unto Thee they cried, and were saved.' Since, then, all Thy saints have had this blessing of Thee, to cry unto Thee and be heard and not be ashamed, how much more readily and specially wilt Thou hear Thy beloved Son that cries? And, if I ask as one who wonders, 'Shall I cry and Thou wilt not hear?' yet shall not My words be regarded as folly. For I know that I utter My prayer, not as one that glories or as one that boasts, but as one of lowly mind. For being gentle and lowly in heart, My words are humble and spoken in humility like My own gentleness, even as I call Myself a worm. For what could be more lowly than a worm? Hence I call Myself 'no man,' since I have descended from My own majesty to such lowliness, that I seem to be no more than a worm, so that I may undergo even death and the destruction of My body. For how else can worms be generated but from the destruction of bodies, and I going to such destruction recognize Myself rightly as a worm and no man. So, too, have I become a reproach of men and the outcast of the people, and I should have become neither unless I had reached the state of a worm at the time of My Passion. For it was then that they who saw Me hanging on the Cross mocked Me, and spake with their lips, and shook their heads saying, 'He trusted in God, let Him deliver him, let Him save him if He desires him.'"
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
