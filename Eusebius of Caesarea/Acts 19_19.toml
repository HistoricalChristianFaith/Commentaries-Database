[[commentary]]
quote='''
But that my argument may not be based solely on the unwritten, hear the proofs also that I draw from the written record. The first disciples of Jesus in the Book of their own Acts, describe without doubt how the Gentiles thronging to their teaching (were so impressed), that many of those with a bad reputation for sorcery, changed their ways to such an extent that they had the courage to bring the forbidden books into the midst, and commit them to the fire in the sight of all. Hear how the Scripture describes it:

"And many of those who used curious arts, brought their books, and burned them before all, and they reckoned the price of the books, and found it fifty thousand pieces of silver."

It shews what our Saviour's disciples were, it shews the extraordinary influence of their words when they addressed their audience, that they so touched the depths of their souls, caught hold of and pierced the individual conscience, that men no longer hid anything away in concealment, but brought their forbidden things to light, and themselves completed the indictment of themselves and their own former wickedness. It shews what their pupils were like, how pure and honourable in disposition, determined that nothing evil in them should lurk below the surface, and how boldly they prided themselves on their change from the worse to the better. Yes, they who gave their magic books to the flames, and voted for their complete destruction, left no one in any doubt that they would never again have anything to do with sorcery, and from that day forth were pure from the slightest suspicion of it.

If, then, our Saviour's disciples are seen to have been like this, must not their Master have been so long before them?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 6"
