[[commentary]]
quote='''
Simon was at that time so celebrated, and had acquired, by his jugglery, such influence over those who were deceived by him, that he was thought to be the great power of God. But at this time, being amazed at the wonderful deeds wrought by Philip through the divine power, he feigned and counterfeited faith in Christ, even going so far as to receive baptism.

And what is surprising, the same thing is done even to this day by those who follow his most impure heresy. For they, after the manner of their forefather, slipping into the Church, like a pestilential and leprous disease greatly afflict those into whom they are able to infuse the deadly and terrible poison concealed in themselves. The most of these have been expelled as soon as they have been caught in their wickedness, as Simon himself, when detected by Peter, received the merited punishment.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25202.html"
source_title="Church History, Book 2, Chapter 1"
