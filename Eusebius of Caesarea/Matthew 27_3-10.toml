[[commentary]]
quote='''
But since the fire shall try every man's work of what sort it is, He rightly bids them cast it into the furnace, adding, "As I was tested by them." Perhaps the House of God is here called a Furnace. For the Lord says, according to the Septuagint, "Cast them into the Furnace," and adds, "And they cast them into the Furnace, the House of God"; while according to Aquila the Lord says, "Cast it, that is the money, to the potter," and adds, "And I cast it in the House of the Lord to the potter." According to Symmachus, the Lord says, "Cast it into the furnace," and adds, "I cast it into the House of the Lord, into the Furnace." And was not this fulfilled when Judas----

"3. that betrayed the Lord, seeing that he was condemned, repented and returned the money to the chief priests and elders, saying, I have sinned in that I have betrayed the innocent blood? 4. And they said to him, What is that to us? see thou to that. 5. And he cast down the money in the Temple and went and hanged himself. 6. And the chief priests took the money and said, It is not lawful to put them in the treasury, for it is the price of blood. 7. And they took counsel, and bought with them the potters' field to bury strangers in: 8. Wherefore that field is called the field of blood unto this day. 9. Then was fulfilled that which was spoken by Jeremiah the prophet saying, And they took the thirty pieces of silver, the price of him that was valued, whom they of the children of Israel did value, 10. and gave them for the potter's field, as the Lord appointed me."

But as this passage is not found in the prophecy of Jeremiah, you must consider whether it is to be supposed that they have been removed through any evil intention, or whether there has been an error in copying, through the mistake of some careless transcriber of the Holy Gospels, who wrote Jeremiah instead of Zechariah, where he ought to have copied, "Then was fulfilled that which was written by Zechariah the prophet," and instead of, "And they cast them into the house of the Lord, into the furnace," wrote in error, "And they bought with them the field of the potter." For the prophecy explicitly states that the money was cast into the Temple of the Lord, so does the Gospel: for, "Judas," it says, "cast the money into the Temple, and departed." And perhaps it was through this money that the Temple was rendered profane, and the words, "Behold, your house is left unto you desolate," were fulfilled. And you may well ask whether the House of God was called a Furnace, because it is there that the souls of men are fashioned as in a crucible by the fire of divine teaching, or convicted of impurity, as if they were fired and tried in a furnace. Hence Aquila says, "I cast the money in the house of the Lord to the potter," clearly teaching that the Divine Word dwells like a potter in the House of the Lord, and moulds and renews the souls of them that enter.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 4"
