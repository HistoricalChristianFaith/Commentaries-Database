[[commentary]]
quote='''
To this is added quite in the prophetic manner a veiled prediction of the change of the long-time desert and thirsty land, referring either to the individual soul, or to the turning of the Gentile Church to holiness, and of its fertility in divine words. This is clearly predicted in a veiled way, when it says, "He made the desert into pools of water," and that which follows. But to understand this one must have wisdom from God; according to the monition at the end of the Psalm, which says, "Who is wise, and he will keep this? "and that which follows.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 7"
