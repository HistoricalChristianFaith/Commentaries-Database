[[commentary]]
quote='''
As the great Evangelist St. John, teaching of our Lord and Saviour as the very Word of God full of supernatural power, begins his holy Gospel, by setting side by side His Divinity and His Humanity in His presence among men, saying, "In the beginning was the Word, and the Word was with God, and the Word was God. He was in the beginning with God. All things were made by him," and adding after this, "and the Word became flesh, and tabernacled among us"; so in the same strain the inspired prophet, about to proclaim God born of a Virgin, tells first the vision of His Divine glory, when he thus describes the Being of God:

"1. I saw the Lord sitting upon a throne high and exalted. And the house was full of his glory. 2. And Seraphim stood round about him: each one had six wings: with two he covered his face, and with two he covered his feet, and with two he did fly. 3. And they cried one to another and said, Holy, Holy, Holy, the Lord of Sabaoth, the whole earth is full of his glory."

And he adds also:

"8. And I heard the voice of the Lord saying, Whom shall I send, and who will go to this people? And I said, Behold, Here am I. Send me. 9. And he said, Go and say to this people, Ye shall hear indeed, but shall not understand; and ye shall see indeed, but not perceive. 10. For this people's heart has become gross, and their ears are dull of hearing, and their eyes have they closed; lest they should see with their eyes, and hear with their ears, and understand with their heart, and be converted, and I should heal them. 11. And I said, How long, O Lord? And He said, Until the cities be deserted, by reason of their being uninhabited, and the houses by reason of there being no man."

What Lord may we say the prophet saw but Him Whom we have proved to have been seen and known by the fathers with Abraham in previous days? He, we have already learned, was both God and Lord, and Angel and Captain of the Lord's power as well. So then in approaching the account of His Coming to men the prophecy before us tells first of His divine kingdom, in which it says that the prophet saw Him sitting on a throne high and exalted. This is that throne which is mentioned in the Psalm of the Beloved, "Thy throne, O God, is for ever and ever," on which the Most High Creator of the Universe, His God and Father, bade his Only-begotten sit, saying, "Sit thou on my right hand, until I make thine enemies thy footstool." John the Evangelist supports my interpretation of this passage, when he quotes the words of Isaiah, where it is said, "For this people's heart is become gross, and their ears are dull of hearing, and their eyes have they closed," referring them to Christ, saying, "This said Isaiah, when he saw his glory, and bare witness of him." The prophet then seeing our Saviour sitting on His Father's throne in the divine and glorious kingdom, and moved by the Holy Spirit, and being about to describe next His coming among men and His Birth of a Virgin, foretells that His knowledge and praise would be over all the earth, by introducing the song of the Seraphim round His throne: Holy, Holy, Holy, Lord of Sabaoth, the whole earth is full of his glory. And who are the Seraphim around the Christ of God? Perhaps the choirs of angels and divine powers, perhaps the prophets and apostles. For the translation of Seraphim is "Rule of His Mouth." The prophets and apostles would bear this name, because from their mouth were the firstfruits of the preaching of salvation. So also the powers of the Holy Spirit are called "Wings," as hiding the beginning and the end of the knowledge of God, as being secret and inconceivable in nature, but they reveal the central parts of his dispensation, since these alone are knowable by men; that which is beyond and that which comes after them is left unsaid. And the divine and heavenly powers are signified by the Seraphim, according to another rendering of the word, as "fires." As it is said, "He maketh his angels spirits and his ministers a flame of fire." These cry and shout one to another according to their power, shewing forth the holiness of the Being acclaimed as God, and, strangest of all, they do not acclaim His Godhead because heaven and the things of heaven alone are full of His glory, but because all the earth also shares in His power by His Coming from heaven to men as prophesied, in the prediction which follows, announcing His Birth of a Virgin and His glory spread through all the earth.

Lord of Sabaoth is translated "Lord of Powers." And He is the Captain of the Powers of the Lord, Whom also the divine powers salute as Lord of Sabaoth in the 23rd Psalm, foretelling His return from earth to heaven: "Lift up your gates, ye princes, and be lifted up, ye everlasting doors, and the King of glory shall come in. Who is the King of glory? The Lord of Powers, He is the King of glory."

In the Hebrew He is here again called Lord of Sabaoth. And since He is the King of glory, and by His sojourn here the whole earth would be filled with His glory, both in the psalm and in the prophecy the fulfilment is rightly placed in the present: in the prophecy in the words, "The whole earth is full of his glory," in the psalm at the beginning where it says, "The earth is the Lord's and the fullness thereof, the world and all that dwell therein."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
