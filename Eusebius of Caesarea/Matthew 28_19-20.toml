[[commentary]]
quote='''
Hence, of course, our Lord and Saviour, Jesus the Son of God, said to His disciples after His Resurrection:

"Go and make disciples of all the nations,'' and added: "Teaching them to observe all things, whatsoever I have commanded you.''

For He did not bid them to teach the laws of Moses to all nations, but whatsoever He Himself had commanded: that is to say, the contents of the Gospels. And agreeably to this His disciples and apostles in considering the requirements of the Gentiles decided that Moses' enactments were unsuitable to their needs, since neither they themselves nor their fathers had found them easy to be kept. As St. Peter says in the Acts:

"Now therefore why do ye attempt to lay a yoke upon the necks of the disciples, which neither our fathers nor we were able to bear?"
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 3"

[[commentary]]
quote='''
This "new covenant" Isaiah, another of the Hebrew prophets, calls the "new law,"when he says:

"3. For out of Sion shall go forth a law, and the word of the Lord from Jerusalem. And all the nations shall go, and all the peoples shall be gathered together, and shall say, Let us go up to the Mount of the Lord, and to the house of the God of Jacob."

This law going forth from Sion, different from the law enacted in the desert by Moses on Mount Sinai, what can it be but the word of the Gospel, "going forth from Sion" through our Saviour Jesus Christ, and going through all the nations? For it is plain that it was in Jerusalem and Mount Sion adjacent thereto, where our Lord and Saviour for the most part lived and taught, that the law of the new covenant began and from thence went forth and shone upon all, according to the commands which He gave his disciples when He said:

"Go ye, and make disciples of all the nations, teaching them to observe all things, whatsoever I have commanded you."

What could He mean but the teaching and discipline of the new covenant?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 4"

[[commentary]]
quote='''
Such was the message to all nations given by the word of the new covenant by the teaching of Christ. And the Christ of God bade His disciples teach them to all nations, saying:

"Go ye into all the world, and make disciples of all the nations . . . teaching them to observe whatsoever I have commanded you."

And in giving them to all men both Greeks and barbarians to keep He clearly revealed the nature of Christianity, the nature of Christians, and the nature of the Teacher of the words and instruction, our Lord and Saviour the Christ of God Himself. He set up this new and perfect system throughout the whole world, that such teaching and such wisdom might be the food, not only of men but of women, of rich and poor alike, and of slaves with their masters.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"

[[commentary]]
quote='''
What sorcerer has ever thought of establishing laws against idolatry in direct opposition to the decrees of kings, ancient legislators, poets, philosophers, and theologians, and of giving them power, and of promulgating them so that they should last on unconquered and invincible for long ages? But our Lord and Saviour did not conceive and not dare to attempt, neither did he attempt and not succeed.

With one word and voice He said to His disciples: "Go, and make disciples of all the nations in My Name, teaching them to observe all things whatsoever I have commanded you," and He joined the effect to His Word; and in a little while every race of the Greeks and Barbarians was being brought into discipleship, and laws were spread among all nations opposed to the superstition of the ancients, laws inimical to daemons, and to all the deceits of polytheism, laws that have made Scythians, Persians, and the other barbarians temperate, and revolutionized every lawless and uncivilized custom, laws that have overturned the immemorial habits of the Greeks themselves, and heralded a new and real religion.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 6"

[[commentary]]
quote='''
I myself, when I frankly turn the account over in my own mind, have to confess that I find in it no power to persuade, no dignity, no credibility, not even enough plausibility, to convince just one of the most simple, But when I turn my eyes away to the evidence of the power of the Word, what multitudes it has won, and what enormous churches have been founded by those unlettered and mean disciples of Jesus, not in obscure and unknown places, but in the most noble cities----I mean in Royal Rome, in Alexandria, and Antioch, throughout the whole of Egypt and Libya, Europe and Asia, and in villages and country places and among the nations----I am irresistibly forced to retrace my steps, and search for their cause, and to confess that they could only have succeeded in their daring venture, by a power more divine, and more strong than man's, and by the co-operation of Him Who said to them: "Make disciples of all the nations in my Name."

And when He said this He appended a promise, that would ensure their courage and readiness to devote themselves to carrying out His commands. For He said to them: "And lo! I am with you all the days, even unto the end of the world."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 7"
