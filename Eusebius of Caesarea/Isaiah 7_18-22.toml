[[commentary]]
quote='''
21. "And it shall come to pass in that day, a man will nourish a heifer and two sheep. 22. And it shall come to pass from their drinking much milk, every one left on the land shall eat butter and honey."

Here if you inquire to what day the prophet looks forward, you will find it to be the very time of the appearance of our Saviour. For when the prophet says: " Behold a virgin shall be with child, and shall bring forth a son," though he interposes many things, yet he prophesies of the things that will come to pass on that very day, that is to say about the time of our Saviour's appearance.

For he says that unseen powers, and foes and enemies, allegorically designated flies and bees, will attack the land of the Jews, and that the Lord with the razor of its foes will shave the head of the Jewish race, as if it were one great body, and the hairs from its feet, and its beard—in a word its whole glory. And this being done in the day prophesied when He shall be born of a virgin, he foretells that a man who is left from the destruction of the whole race, that is to say all of them who believe in the Christ of God, shall nourish a heifer of the bulls and two sheep, and from their producing very much milk shall eat butter and honey : and you will understand that this is mystically fulfilled in our Saviour's apostles. For each one of them in the churches which he established by Christ's help, nourished two sheep, that is to say two orders of disciples coming like sheep into the sheepfold of Christ, the one as yet probationary, the other already enlightened by baptism, and in addition to these one heifer, the ecclesiastical rule of those who preside with their inspired food of the word, and produced from them a fruitful increase of milk and honey from the food they have laboured to provide.

That holy Scripture often likens the multitudes of less perfect disciples to sheep I need not say; every scripture teaches it. And its comparison of the perfect man, who being the leader works the body of the Church as a farmer, to the work of bulls on the soil, the holy apostle uses, when he says:

"Doth God take care for oxen? Or saith he it altogether for our sakes? That he that ploweth should plow in hope, and that he that thresheth, should thresh in hope of partaking."

And if any one is disgusted with such metaphorical interpretation, let him beware lest refusing to regard figuratively what are called flies, or bees, or a razor, or a beard, or hairs on the feet, he falls into absurd and inconsistent mythology.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
