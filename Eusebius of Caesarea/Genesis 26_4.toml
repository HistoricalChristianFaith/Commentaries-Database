[[commentary]]
quote='''
The Lord conferring with Isaac, after saying other things, proceeds —

[Passage quoted, Gen. xxvi. 3.]

Our Lord and Saviour Jesus Christ was born of the seed of Isaac, according to the flesh, in Whom all the nations of the earth are blessed, in learning through Him of Almighty God, and in being taught through Him to bless men dear to God. So there is reciprocal blessing, they enjoying the same blessing as the men they bless, according to God's saying to Abraham : " Blessed be they that bless thee."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 1"
