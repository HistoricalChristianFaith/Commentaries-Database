[[commentary]]
quote='''
Such were the thoughts of Hebrews long ago about the birth of Christ among men. Do they, then, describe in their prophecy some famous prince or tyrant, or some one in any other class of those who have great power in earthly things? One cannot say so, for no such man appeared. But as He was in His life, so they prophesied that He would be, in no way failing in truth. For Isaiah said: "We proclaimed him before, as a child, as a root in thirsty soil.'' And then he proceeds saying:

"2. He hath no form or glory, and we saw him, and he had no form or beauty, 3. And his form was dishonourable and slight even compared with the sons of men, a man in suffering, and knowing to bear sickness he was dishonoured, and not esteemed." What remains for him to say?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"
