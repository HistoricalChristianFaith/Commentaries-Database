[[commentary]]
quote='''
"9. Behold, O God, our defender, | and look upon the face of thy Christ. | 10. For one day in thy courts is better than a thousand. | I have chosen to abase myself in the house of my God, rather than to dwell in the tabernacles of sinners | ."

They who know the Christ of God to be the Word, the Wisdom, the True Light and the Life, and then realize that He became man, are struck by the miracle of His Will, so that they exclaim:

"And we saw him, | and he had no form nor beauty. [Isa. liii. 2.] 3. But his form was ignoble, and inferior to that of the sons of men. He was a man in suffering, and knowing the bearing of affliction, because he turned away his face, he was dishonoured."

They rightly call on God to look upon the Face of the Christ, dishonoured and insulted for our sake, and to be merciful to us for His sake. "For He bore our sins, and on our behalf is pained." Thus they beseech, altogether desiring and expressing in their prayer the desire to see the face of the glory of Christ, and to behold the day of His light. And this was the day of His Resurrection from the dead, which they say, as being the one and only truly Holy Day and the Lord's Day, is better than any number of days as we ordinarily understand them, and better than the days set apart by the Mosaic Law for Feasts, New Moons and Sabbaths, which the Apostle teaches are the shadow of days and not days in reality. And this Lord's Day of our Saviour is alone said to shew its light not in every place but only in the courts of the Lord. And these must mean the Churches of Christ throughout the world, which are courts of the one House of God, in which he who knows these things loves and chooses to be abased, prizing far more the time spent in them than that spent in the tabernacles of sinners. Unless we are to understand that everyone who chooses the synagogues of the Jews, which deny the Christ of God, or those of godless sectaries and other unbelieving heathen, professes them to be better than the Churches of Christ.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
