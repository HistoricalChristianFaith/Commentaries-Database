
[[commentary]]
quote='''
[Passages quoted, Jer. xxiii. 6-8, xxx. 8, 9.]

Jeremiah prophesies thus long after the death of David and even the time of Solomon concerning a king who is to arise from the seed of David, whom he first calls "the rising," not simply but with the adjective "just," as though he were to shine forth from the sun of righteousness, of whom I treated in my evidences about the Second Cause, where I shewed that the pre-existent Word of God besides many other names was called Sun of Righteousness, quoting the prophecy which said, "To them that fear my name shall the sun of righteousness arise." Therefore the prophecy in the present passage is that God will raise up "a righteous rising" to David, in the sense of a sun of righteousness. And he calls the same Being an understanding king, and one who does judgment and justice on the earth. He gives him too the same name as David, who died very long before. For you must note carefully how at the beginning he says, "And I will raise up to David a righteous rising," and adds at the end, "And I will raise up David to be his king." Whose, but David's?—for it was to him that he said He would raise up a righteous rising.

And Zechariah prophesying of the same Being likewise calls Him "arising," saying, "Behold I will raise up my servant, the rising," and also, "Behold a man whose name is 'The Rising,' and beneath him springs righteousness."

But no one, it is certain, arose after the time of Jeremiah among the Jews who could be called "a righteous rising" and "an understanding king doing judgment and righteousness on the earth." For if it be suggested that Jesus son of Josedec is meant, it must be answered that the prophecy is inapplicable to him. For he was neither of David's seed nor did he reign as king. How could this apply to him, "And I will raise up David to be his king," when he was of the tribe of Levi, and of high-priestly rank, and of another tribe than David, and is never recorded to have been king? We conclude that, as no other can be discovered, we must agree that the subject of this prophecy can only be our Lord and Saviour, called in other places "the light of the world," and "the light of the nations." He therefore must be the subject of this prophecy, and the prediction is absolutely true. For He alone of David's seed and figuratively named after his ancestor, for David means "strong-handed," preached judgment and justice by His teaching to all men on earth, and alone of all that ever lived is king not of one land only, but of the whole world, and alone has caused righteousness to arise over all the world, according to what is said of Him in the Psalm: "Righteousness shall arise in his days, and abundance of peace."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 3"
