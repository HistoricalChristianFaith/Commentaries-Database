[[commentary]]
quote='''
He urges God by his tolerance and the strength of his mercy and patience that he grant a time of trials of long duration to the people harassing him. Before he had prayed that the nations be judged in the sight of God; now he asks that a lawgiver be appointed for the nations before the future judgment, so that they might learn they are people and not brute animals, for the law was hardly given to brutish animals. This law is not from Moses, who once had carried it from the midst of people; it is not about the law given to the Jews alone, nor does he wish that another law be awaited, as the law of the New Testament stretches over the whole earth. Indeed, Christ is the Lawgiver, and the Gospel message applies to the nations.
'''
source_url=''
source_title="COMMENTARY ON PSALMS 9:20, 21"

[[commentary]]
quote='''
THESE, then, are the reasons why we have accepted and loved as belonging to ourselves the sacred books of the Hebrews, including as they do prophecies relating to us Gentiles. And the more so, since it was not Moses only who foretold the coming of the Lawgiver of the Gentiles after him, but really the whole succession of the prophets, who proclaimed the same truth with one voice, as David, when he said:

"Appoint, O Lord, a Lawgiver over them: let the nations know that they are but men."

See how he too speaks of a second Lawgiver of the nations.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 4"

[[commentary]]
quote='''
Moses was the first leader of the Jewish race. He found them attached to the deceitful polytheism of Egypt, and was the first to turn them from it, by enacting the severest punishment for idolatry. He was the first also to publish the theology of the one God, bidding them worship only the Creator and Maker of all things. He was the first to draw up for the same hearers a scheme of religious life, and is acknowledged to have been the first and only lawgiver of their religious polity. But Jesus Christ too, like Moses, only on a grander stage, was the first to originate the teaching according to holiness for the other nations, and first accomplished the rout of the idolatry that embraced the whole world. He was the first to introduce to all men the knowledge and religion of the one Almighty God. And He is proved to be the first Author and Lawgiver of a new life and of a system adapted to the holy.

And with regard to the other teaching on the genesis of the world, and the immortality of the soul, and other doctrines of philosophy which Moses was the first to teach the Jewish race, Jesus Christ has been the first to publish them to the other nations by His disciples in a far diviner form. So that Moses may properly be called the first and only lawgiver of religion to the Jews, and Jesus Christ the same to all nations, according to the prophecy which says of Him:

"Set, O Lord, a lawgiver over them: that the Gentiles may know themselves to be but men."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"
