[[commentary]]
quote='''
[Passage quoted, Obad. 1.]

THE Lord God has heard a report from the Lord. And this report was about the call of the Gentiles.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 24"
