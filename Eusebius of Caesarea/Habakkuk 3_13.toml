[[commentary]]
quote='''
"Thou wentest forth for the safety of thy people to save thy Christs: Thou hast brought death on the heads of transgressors."

Aquila: "Thou wentest forth for the safety of thy people, for the safety of thy people with thy Christ." As Aquila renders by the singular instead of the plural, saying that the Supreme God has made salvation for the people "with Christ," I have rightly set down the passage, which clearly supports my position. But there would be according to the Septuagint version more persons who are called Christs from Him and for the sake of Whom it is said: "Touch not my Christs, and do my prophets no harm," who believed on Him, and were thought worthy of the holy anointing of regeneration in Christ, and who were able to say with the holy apostle: "We are become partakers of Christ."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
