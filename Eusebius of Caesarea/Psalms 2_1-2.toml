[[commentary]]
quote='''
The leaders of the nations throughout the whole world and the kings of the earth who have held dominion at various times have all been drawn into this impious alliance together, holding on to whatever insult or for whatever reason, or having suffered whatever offense, so that they devise treacheries, they enter into the wicked counsel against the Lord of the universe and God the King and against his anointed one.
'''
source_url=''
source_title="COMMENTARY ON PSALMS 2:2"

[[commentary]]
quote='''
[Passages quoted, Ps. ii. 1, 2, 7, 8 ]

IN these words the Holy Spirit very clearly addresses Christ, and calls Him the Son of God, as has been said before, and at the same time indicates that there will be a plot against Him, and foretells the calling of the Gentiles as brought about through Him. And all this the course of events has shewn to be exactly fulfilled by the actual facts in our Lord and Saviour Jesus Christ. For even now nations, rulers, peoples and kings have not yet ceased their combined attack on Him and His teaching. And if the Jews prefer to refer these predictions to some time yet to come, they ought to agree that their expected Christ will again be plotted against, according to the present oracle: "The kings of the earth stood up, and the rulers were gathered together against the Lord and against his Christ." Which they would never grant, inasmuch as they expect the coming Christ to be a great Ruler, and an eternal King, and their Ransomer. But supposing their Christ should indeed come and suffer the same as He Who has already come, why ought we to believe or disbelieve in theirs rather than ours?

And if they cannot give an answer to this, but proceed to refer the oracle to David or some one of the Jewish kings of his stock, even then we can shew, that neither David nor any other celebrated Hebrew is recorded to have been proclaimed as Son of God by the oracle, nor as begotten of God, as was the subject of the prophecy in the Psalm, nor to have ruled over nations, kings, rulers and people while involved in plots. Wherefore if none of them is found so to have done, whereas all this agrees in actual fact in His case, both in His patience long ago, and in the attack made on Him to-day as the Christ of God by kings and rulers, nations and peoples, what hinders Him from being the subject of the prophecy in the words which said, "The kings of the earth stood up, and the rulers were gathered together against the Lord and against his Christ"?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
