[[commentary]]
quote='''
And that which follows in the Psalm, "Myrrh, aloes and cassia from his garments," and the other words besides, which speak as of a princess leaving her father's house, and being wedded to Him who has been foreshewn to be Christ and King and God, and calling Him her Lord, might be referred to the Church of the nations, forsaking ancestral daemonic error, and purified and brought into the communion of the divine Word, if time allowed them to have their true interpretation.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 2"
