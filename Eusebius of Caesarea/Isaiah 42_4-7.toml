[[commentary]]
quote='''
The words, "And in his name shall the Gentiles trust," have also been exactly fulfilled. For the nations of Christians trust only in the Name of our Saviour Jesus Christ, and are marked with His Name as that of the Father of the religion with which they are associated. For it was foretold that He should be given for a Light to none but the Gentiles. And by Him in accordance with the prediction, the eyes of the blind—those that had long been impaired in understanding, and not only of these but of those who had lost their very bodies, and those who before were involved, bound and chained in sin, in darkness and ignorance of true religion, by Him freed from their sins— were accounted worthy of the light of knowledge and of the freedom of God. And if you at your leisure test the rest of the passage, as I have so far done, you will find each one of its predictions fulfilled in our Lord and Saviour, and in Him alone.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 15"
