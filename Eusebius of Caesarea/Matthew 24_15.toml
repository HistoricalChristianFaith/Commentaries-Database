[[commentary]]
quote='''
And from that time a succession of all kinds of troubles afflicted the whole nation and their city until the last war against them, and the final siege, in which destruction rushed on them like a flood with all kinds of misery of famine, plague and sword, and all who had conspired against the Saviour in their youth were cut off; then, too, the abomination of desolation stood in the Temple, and it has remained there even till to-day, while they have daily reached deeper depths of desolation. And perhaps this will be so until the end of the world, according to the limit set by the prophet when he said, "And unto the consummation of time a fulfilment shall be given to the desolation." These words our Lord and Saviour Jesus Christ sealed, when He said, "When ye shall see the abomination of desolation spoken of by Daniel the Prophet, standing in the Holy Place, then ye shall know that her desolation draws near."

And if the Jews are hard to persuade of this, they must be convicted not only of a shameless opposition to truth and clear evidence, but also of misrepresenting, so far as they can, the predictions as falsehoods, if it is to be thought that in the seventy weeks of years some of them include all the time, while they prophesy of what is to happen in the intermediate period, while others, though we are now nearly a thousand years from the date of the prophecy, admit no sign of the fulfilment of what was written, although their Unction has been abolished, as the divine prediction foretold, and their sanctuary, and the former inhabitants destroyed and utterly brought to naught in the flood of the completed war, and strangest thing of all even now to be seen, I mean, the abomination of desolation still standing in the one holy place, concerning which our Lord and Saviour said what I have quoted.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 2"
