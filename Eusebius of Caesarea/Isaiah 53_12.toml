[[commentary]]
quote='''
And since He willed it, and being willing took away the travail of His soul, and shewed Him light, the prophet rightly proceeds with the words: "Therefore he shall inherit from many, and shall divide the spoil of the strong."

Here it remained for him to mention the heritage of Christ, in agreement with the Second Psalm, in which the prophetic word foretells the plot that was hatched against Him, giving His name:

"2. The kings of the earth stood up,
And the rulers were gathered together
Against the Lord and against his Christ."

And it adds next:

"3. The Lord said to me, Thou art my son,
To-day I have begotten thee;
Ask of me and I shall give thee the Gentiles for thine inheritance

And the bounds of the earth for thy possession." It was to these Gentiles that the Prophet darkly referred, saying: "He shall inherit from many, and shall divide the spoil of the strong." For he rescued the subject souls from the opposing powers, which of old ruled over the Gentiles, and divided them as spoils among his disciples. Wherefore Isaiah says of them: "And they shall rejoice before thee, as they who divide the spoils."

And the Psalmist:

"12. The Lord will give a word to the preachers with much power.
13. The king of the powers of the beloved, in the beauty of his house divideth the spoils."

He rightly, therefore, says this also of Christ: "Therefore he shall have the inheritance of many, and divide the spoils of the strong." And shortly after he tells us why, saying:

"Because his soul was delivered to death, and he was reckoned among the transgressors, and he himself bare the sins of many, and was delivered for their iniquities."

For it was as a meet return for all this, because of His obedience and long-suffering, that the Father gave Him what we have seen, for He was obedient to the Father even unto death. Wherefore it is prophesied that He should receive the inheritance of many, and should be reckoned with the transgressors not before but after His being delivered to death. For therefore He is said "to receive the inheritance of many, and to share the spoil of the strong." And I consider that it is beyond doubt that in these words the resurrection from the dead of the subject of the prophecy is shewn. For how else can we regard Him as led as a sheep to the slaughter, and delivered to death for the sins of the Jewish people, numbered with transgressors, and delivered to burial, then cleansed by the Lord, and seeing light with Him, and receiving the inheritance of many, and dividing the spoils with his friends?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"
