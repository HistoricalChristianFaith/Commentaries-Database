[[commentary]]
quote='''
He also most accurately forecasts the future when He says: "For this gospel must first be preached to all the world, for a witness to all nations."

These words were said in a corner of the earth then, and only those present heard it. How, I ask, did they credit them, unless from other divine works that He had done they had experienced the truth in His words? Not one of them disobeyed His command: but in obedience to His Will according to their orders they began to make disciples of every race of men, going from their own country to all races, and in a short time it was possible to see His words realized.

The Gospel, then, in a short time was preached in the whole world, for a witness to the heathen, and Barbarians and Greeks alike possessed the writings about Jesus in their ancestral script and language.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 7"
