[[commentary]]
quote='''
On the top of all this, if we carefully examine the lives of the ancient men of whom I am speaking, we shall find that they had children in early life, but later on abstained and ceased from having them. For it is written that "Enoch pleased God after Methusaleh was born." Scripture expressly records that he pleased God after the birth of his son, and tells nothing of his having children afterwards.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 9"
