[[commentary]]
quote='''
But one must start fresh in considering that which succeeds it, which runs thus:

"When the Assyrian shall attack your land, and come against your country, there shall be raised up against him seven shepherds, and eight 'bites' of men,"

with that which follows, whose meaning we are not now called upon to unfold.

Now it might be said that after the expedition of the Assyrians into Judaea, when they overcame the Jews, the number of rebellions against them is shewn by the seven shepherds and the eight "bites": and that historians of Assyria would know this, and at the end of their rule the one foretold was born at Bethlehem, after the seven shepherds and the eight "bites" had happened to the Assyrians in the period after their expedition against Judaea. But we must not now devote more time to what would entail a long inquiry.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 2"
