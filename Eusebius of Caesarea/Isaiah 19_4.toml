[[commentary]]
quote='''
But when they flee, it says, to them that falsely appear to be gods, they will receive no help, for then will God chiefly deliver them to cruel kings and rulers, when under the influence of their daemons, and in their power, they arouse persecutions against the Churches of Christ. And, please, notice the fact, that until the appearance of our Saviour Jesus Christ all Egypt had its own kings, as a separate and responsible state, and the Egyptians were autonomous and free, and their dynasty was great and famous through long ages, and it was after that date, when Augustus, in whose time our Lord was born, being the first Roman to subjugate Egypt, captured Cleopatra the last of the Ptolemies, that they came under the Roman power, laws, and enactments, losing their former autonomy and freedom. So that here also the prophecy is true, regarding first the governors and rulers sent out to those places, and the other officials in their several positions, saying, "And I will deliver Egypt into the hand of cruel rulers," and also in what follows regarding the general conduct of the government.

Instead of which Aquila says, "And a mighty king shall reign over them." And Symmachus, "And a strong king shall reign over them." Thus the kingdom of Rome seems to be meant, which has bound with bridle and bond not only the Egyptians, the most superstitious of men, but all other men as well, so that they dare no longer to blaspheme against the Church of our Saviour Jesus Christ. And after this the prophecy proceeds to darker and disguised sayings, which require longer and more profound allegorical interpretation, which in the proper place shall receive their proper exposition at leisure when with God's help I treat of the promises.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 20"
