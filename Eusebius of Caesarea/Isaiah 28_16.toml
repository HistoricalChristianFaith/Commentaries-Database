[[commentary]]
quote='''
He ordained that the former Law should stand till He came, and He was revealed as the originator of the second Law of the new covenant preached to all nations, as being responsible for the Law and influence of the two religions, I mean Judaism and Christianity. And it is wonderful that divine prophecy should accord:

"Behold, I lay in Zion a stone, choice, a cornerstone; precious, and he that believes on him shall not be ashamed."

Who could be the corner-stone but He, the living and precious stone Who supports by His teaching two buildings and makes them one? For He set up the Mosaic building, which was to last till His day, and then fitted on to one side of it our building of the Gospel. Hence He is called the corner-stone.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 7"
