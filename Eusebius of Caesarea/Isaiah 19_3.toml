[[commentary]]
quote='''
It is the fact also that all the Egyptian idolaters, and the spirit of idolatry working in them, are even now conscious of their confusion, and though they make many plans against the teaching of Christ, to quench it, and abolish it from among men, yet they are ever scattered by God, as it is said in the prophecy, "And the spirit of the Egyptians shall be disturbed within them, and I will scatter their counsel."

And they who make many inquiries and ask endless questions against us of the oracles and diviners of their gods, and of the daemons that haunt the idols, and the familiar spirits who were of old so powerful among them, get no more profit of them. For Scripture says:

"And they will inquire of their gods, and their idols, and the familiar spirits."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 20"
