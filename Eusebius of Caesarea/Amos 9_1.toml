[[commentary]]
quote='''
This I take from the work of Josephus on Jewish Antiquities. And I found in the beginning of the Prophet Amos the statement that he began to prophesy "in the days of Ozias, king of Judah, two years before the earthquake." What earthquake he does not clearly say. But I think the same prophet further on suggests this earthquake, when he says: "I saw the Lord standing on the altar. And He said, Strike the altar, and the doors shall be shaken, and strike the heads of all, and the remnant I will slay with the sword."

Here I understand a prediction of the earthquake, and of the destruction of the ancient solemnities of the Jewish race, and of the worship practised by them in Jerusalem, the ruin that should overtake them after the coming of our Saviour, when, since they rejected the Christ of God, the true High Priest, leprosy infected their souls, as in the days of Ozias, when the Lord Himself standing on the altar gave leave to him that struck, saying: "Strike the altar." For He shewed this in effect, when He said: "Your house is left unto you desolate." Concurrently, too, with His Passion "The veil of the Temple was rent from the top to the bottom," as Josephus records as happening also in the time of Ozias. Then, first the courts were shaken, when the earth was shaken at the time of His Passion, and not long after, they underwent their final ruin, the striker received authority and struck upon the heads of all.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 18"
