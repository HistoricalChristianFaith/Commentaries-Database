[[commentary]]
quote='''
And He came, too, as overseer of His own angels, who were first set over the nations: and they at once very distinctly recognized their helper and Lord, and came gladly and ministered to Him, as the Holy Scripture teaches, saying: "And angels came and ministered to him," and when, too, "a multitude of the heavenly host praising God said, 'Glory to God in the highest, and on earth peace, goodwill among men.' " These, then, as being His own angels He thus received, since they were in need of His help, but those that of old had flown around the pursuits of men, the malicious daemons who both visibly and invisibly had tyrannized over those on earth, and the tribes of wild and merciless spirits, with their leader in all evil, that cunning and baneful one He put to flight and subdued with mighty and divine power, as certain of them that recognized Him said: "What have we to do with thee, Son of God? Hast thou come to torment us before the time?"
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 10"
