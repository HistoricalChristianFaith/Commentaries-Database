[[commentary]]
quote='''
[Passage quoted, Ps. xcv. 1-13.]

HERE again the Coming of the Lord to men is foretold, and that a new song shall be sung at His Coming, by which is meant the new Covenant, by the whole earth, not by the Jewish race; and that the good news will be no longer for Israel, but for all the nations, since it says that the Lord Who is to come will be their King. But who could this be but God the Word, Who, intending to judge the world in righteousness and the human race in truth, reckons all men in the world equally worthy of His call, and of the salvation of God consequent thereon?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 5"
