[[commentary]]
quote='''
And this Mount of Olives is said to be over against Jerusalem, because it was established by God after the fall of Jerusalem, instead of the old earthly Jerusalem and its worship. For as Scripture said above with reference to Jerusalem: "The city shall be taken, and the nations that are her enemies and foes shall be gathered together against her, and her spoils shall be divided," it could not say that the feet of the Lord should stand upon Jerusalem. How could that be, once it were destroyed? But it says that they will stand with them that depart from it to the mount opposite the city called the Mount of Olives. And this, too, the prophet Ezekiel anticipates by the Holy Spirit and foretells. For he says:

"22. And the Cherubim lifted their wings, and the wheels beside them, 23. and the glory of the God of Israel was on them above them, and he stood on the mount which was opposite to the city."

Which it is possible for us to see literally fulfilled in another way even to-day, since believers in Christ all congregate from all parts of the world, not as of old time because of the glory of Jerusalem, nor that they may worship in the ancient Temple at Jerusalem, but they rest there that they may learn both about the city being taken and devastated as the prophets foretold, and that they may worship at the Mount of Olives opposite to the city, whither the glory of the Lord migrated when it left the former city. There stood in truth according to the common and received account the feet of our Lord and Saviour, Himself the Word of God, through that tabernacle of humanity He had borne up the Mount of Olives to the cave that is shewn there; there He prayed and delivered to His disciples on the summit of the Mount of Olives the mysteries of His end, and thence He made His Ascension into heaven, as Luke tells us in the Acts of the Apostles, saying that while the apostles were with Him on the Mount of Olives:

"While they beheld he was taken up, and a cloud received him out of their sight. And as they gazed steadfastly into heaven while he went up, behold two men stood by them in white apparel, who also said, Ye men of Galilee, why stand ye gazing into heaven? This same Jesus that is taken up from you into heaven shall so come in like manner as ye have seen him go into heaven."

To which he adds: "Then they returned from the mount called the Mount of Olives, which is opposite to Jerusalem." The Mount of Olives is therefore literally opposite to Jerusalem and to the east of it, but also the Holy Church of God, and the mount upon which it is founded, of which the Saviour teaches: "A city set on a hill cannot be hid," raised up in place of Jerusalem that is fallen never to rise again, and thought worthy of the feet of the Lord, is figuratively not only opposite to Jerusalem, but east of it as well, receiving the rays of the divine light, and become much before Jerusalem, and near to the Sun of Righteousness Himself, of Whom it is said: "And on them that fear me shall the sun of righteousness arise."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 18"
