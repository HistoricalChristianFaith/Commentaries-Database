[[commentary]]
quote='''
Consider, again, other instances of the impossibility of all men following the law of Moses. He makes a distinction between voluntary transgressions and those hard to evade, and after assigning penalties to sins which deserve the severest punishment, he provides laws by which those who sin unwittingly are to receive different treatment. One of these runs as follows:

"27. And if a soul of the people of the land shall sin unwittingly by doing anything contrary to the commandments of the Lord that ought not to be done, and shall transgress, 28. and his sin shall be known to him, wherein he hath sinned [in it], then shall he bring [his gift] a kid of the goats, a female without blemish, he shall bring it for his sin that he hath sinned 29. in the place where they slay the whole burnt-offerings, 30. and the priest shall take of the blood."

You see here how one who has sinned unintentionally is required to present himself at the place where the whole burnt-offerings are sacrificed. And this is the place the law has already so often mentioned, when it says:

"The place which the Lord thy God shall choose."

But, indeed, the Lawgiver himself perceived the impossibility for all mankind to carry out the law, and clearly noted it by not promulgating his law universally for all, but with this limitation:

"If a soul sin unwittingly of the people of the land."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 3"
