[[commentary]]
quote='''
He ordained that the former Law should stand till He came, and He was revealed as the originator of the second Law of the new covenant preached to all nations, as being responsible for the Law and influence of the two religions, I mean Judaism and Christianity. And it is wonderful that divine prophecy should accord:

"Behold, I lay in Zion a stone, choice, a cornerstone; precious, and he that believes on him shall not be ashamed."

Who could be the corner-stone but He, the living and precious stone Who supports by His teaching two buildings and makes them one? For He set up the Mosaic building, which was to last till His day, and then fitted on to one side of it our building of the Gospel. Hence He is called the corner-stone. And it is said in the Psalms: "22. The stone which the builders refused, the same is become the head of the corner. 23. This is of the Lord, and it is marvellous in our eyes."

This oracle too indubitably indicates the Jewish conspiracy against the subject of the prophecy, how He has been set at naught by the builders of the old wall, meaning the Scribes and Pharisees, the High-Priests and all the rulers of the Jews. And it prophesied that though He should be despised and cast out He would become the head of the corner, regarding Him as the originator of the new covenant, according to the above proofs.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 7"

[[commentary]]
quote='''
"A special discourse would be needed accurately to survey and explain all this; and also to describe how great the zeal of the laborers is regarded by him who is celebrated as divine, who looks upon the living temple which we all constitute, and surveys the house, composed of living and moving stones, which is well and surely built upon the foundation of the apostles and prophets, the chief cornerstone being Jesus Christ himself, who has been rejected not only by the builders of that ancient building which no longer stands, but also by the builders—evil architects of evil works—of the structure, which is composed of the mass of men and still endures. But the Father has approved him both then and now, and has made him the head of the corner of this our common church.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%252010.html"
source_title="Church History, Book 10, Chapter 4"
