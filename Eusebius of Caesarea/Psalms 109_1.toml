[[commentary]]
quote='''
He says, then, "O God, pass not over my praise in silence," praying that the instruction delivered by Him to His disciples and the praise of the new Covenant might not be lost in silence, but might live to the end of time.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 3"
