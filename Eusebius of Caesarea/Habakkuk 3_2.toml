[[commentary]]
quote='''
[Passage quoted, Hab. iii. 2-5.]

LISTENING to himself, or rather to the divine prophetic spirit within him, which said of the subject of the prophecy, "He that cometh will come, and will not tarry, and the just shall live by my faith," and believing as a just man in the oracle, the holy prophet says in the passage before us, "O Lord, I have heard thy report, and I was afraid," and the words that follow in which he clearly announces that God will come to men.

And who could this be who was known of old, and was to be known afterwards when the time drew near, and was to be shewn forth at the date predicted, but that same Being before shewn to be the second Lord of the Universe, who agreeably to the prophecy at the end of the ages has been proclaimed for all to hear? It was surely His works that are written in the Holy Gospels, and it was clearly His Birth from the Virgin Tabernacle whence he sprang, and how "being in the form of God, he thought it not a thing to be grasped at to be equal with God, but emptied himself, taking the form of a slave," and it was the miracles He performed among men, and the insults offered to Him by the Jewish race that the prophet anticipated with the eyes of his soul; and learning of the Holy Spirit his Teacher what would accrue to minds purified from sin, he confessed that he was astonished and afraid at what he heard, and said, "Lord, I have heard thy report, and I was afraid, I understood thy works, and was astonished."

Our Lord and Saviour, too, the Word of God Himself, "was known between two lives." The word ζωῶν is plural and accented with circumflex on the last syllable as the plural of the singular noun ζωή (life). It is not ζώων accented acute on the penultimate from ζῶον (a living creature), but with circumflex on the last syllable (ζωῶν) from nominative plural ζωαί (lives). He says, therefore, He was known between two lives. One life is that according to God, the other that according to man; the one mortal, the other eternal. And the Lord having experienced both, is rightly said to have been made known between two lives in the LXX translation. Aquila translates differently: "In the nearing of the years, cause it to live." What does "it" mean here but "thy work"? And Theodotion says: "In the midst of the years, cause him to live," and Symmachus renders: "Within the years, revive him." They all by the use of ζώωσον (cause to live) shew clearly that the word in the original does not refer to irrational or rational animals. And so following the rendering of the Septuagint, "He was made known between two lives," and not the commentators who have preceded me, I understand that the two lives of the Subject of the prophecy are referred to, the Divine and the Human.

To this the prophet adds: "When my soul is troubled thou wilt in wrath remember mercy," teaching that when he foresaw the time of the Passion of the Subject of the prophecy he was troubled in spirit. Yet at that very time, he says, in which I was troubled in spirit, though at no other time such anger ever threatened men for the impiety dared against their Lord, the Lord of Love Himself in place of wrath remembered mercy, as the Son of the good Father. For His Passion became to all the world the ground of God's salvation and mercy.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 15"
