[[commentary]]
quote='''
But since as time went on none of the prophets who succeeded Moses had the power to cure the evils of life owing to excess of wickedness, and the activity of the daemons daily waxed greater, so that even the Hebrew race was hurried along in the destruction of the godless, at last the Saviour and Physician of the Universe comes down Himself to men, bringing reinforcement to His angels for the salvation of men, since the Father had promised Him that He would give Him this boon, as He therefore teaches in the Psalms, when He says:

" 7. The Lord said to me, Thou art my Son, This day have I begotten thee, 8. Desire of me, and I shall give thee the heathen for thine inheritance, And utmost parts of the earth for thy possession."

And thus He no longer claimed as under His own authority just and clear-sighted Israel, nor His own proper portion only, but all the nations on the earth, which before were allotted to many angels, and were involved in all sorts of wickedness, and He came announcing to all the knowledge and love of His Father, and promising the remission and forgiveness of their former ignorance and sins, which He also announced clearly when He said: "The strong have no need of a physician, but they that are sick: I came not to call the righteous, but sinners to repentance."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 10"
[[commentary]]
quote='''
The same historian records another fact still more wonderful than this. He says that a certain oracle was found in their sacred writings which declared that at that time a certain person should go forth from their country to rule the world. He himself understood that this was fulfilled in Vespasian.

But Vespasian did not rule the whole world, but only that part of it which was subject to the Romans. With better right could it be applied to Christ; to whom it was said by the Father, "Ask of me, and I will give thee the heathen for thine inheritance, and the ends of the earth for thy possession." At that very time, indeed, the voice of his holy apostles "went throughout all the earth, and their words to the end of the world."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25203.html"
source_title="Church History, Book 3, Chapter 8"
