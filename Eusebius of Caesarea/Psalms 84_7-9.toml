[[commentary]]
quote='''
[Passage quoted, Ps. Ixxxiii. 7.]

AFTER saying that the God of gods shall be seen, he prays that His Manifestation may take place quickly, teaching in what manner He will be seen in the words, "Look on the face of thy Christ," as if he said more clearly, "Manifest thyself to us in the person of Christ." For since "He that hath seen me hath seen the Father that sent me," He naturally promises that the God of God who dwells in Christ will manifest Himself in the Person of Christ.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 4"
