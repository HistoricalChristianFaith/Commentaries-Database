[[commentary]]
quote='''
"8. The Lord is the strength of his people, | and is the shield of salvation of his Christ."

The Psalm we are considering also is referred to Christ, including the prayer of Christ which He prayed at the time of His Passion, and therefore in the opening of the Psalm He says:

"1. To thee, O Lord, have I cried: My God, | be not silent before me, | Lest I be like unto them that go down into the pit. |"

And at the end He prophesies His Resurrection, saying:

"6. Blessed be the Lord, for He hath hearkened to the voice of my prayer. | 7. The Lord is my helper and my defender; | my heart hoped in him, and I was helped: | and my flesh has revived, | and I will gladly give him praise: |"

To which the divine and prophetic Spirit adds:

" 8. The Lord is the strength of his people, and the shield | of his Christ."

Teaching us that all the wonders of Christ written in the holy Scriptures, done for man's salvation, whether teachings or writings, or the mysteries of His Resurrection now referred to, were all done by the will and power of the Father defending His own Christ as with a shield in all His marvellous and saving words and works.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
