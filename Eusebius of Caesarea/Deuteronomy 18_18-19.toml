[[commentary]]
quote='''
And since the Word predicted that the prophet would be raised up for them of the Circumcision, our Lord and Saviour, being Himself the One foretold, rightly said:

"I am not come but to the lost sheep of the house of Israel." "And He commanded His apostles saying, Go not into the road of the Gentiles, and into any city of the Samaritans enter ye not, but rather go to the lost sheep of the house of Israel";

shewing clearly that He was primarily sent to them as the prophecy required. But when they would not receive His grace, He reproves them elsewhere, saying, "For I came, and there was no man, I called and there was none that heard." And He says to them, "The kingdom of God shall be taken away from you, and shall be given to a nation bearing the fruits of it." And He bids His own disciples after their rejection, "Go ye and make disciples of all nations in my name.'' So, then, we that are the Gentiles know and receive the prophet that was foretold, and sent by His Father, as being Lawgiver to all men of the religion of the God of the Universe, through His saving Gospel teaching, that other prediction being fulfilled at the same time which says, "Set, Lord, a Lawgiver over them, let the Gentiles know themselves to be men," while the Jewish nation, not receiving Him that was foretold, has paid the fit penalty according to the divine prediction which said, "And the man who will not hear all things whatsoever the prophet shall speak in My Name, I will exact vengeance on him." Surely He has avenged on that people all the blood poured out on the earth, from the blood of Abel to the blood of Zechariah, yea, even to crown all to the Christ Himself, Whose blood they called down not only on themselves but on their children, and even now they pay the penalty of their presumptuous sin.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 11"
