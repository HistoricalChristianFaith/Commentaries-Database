[[commentary]]
quote='''
And agreeably to this Moses himself for this very reason said that another prophet would be raised up "like unto him"; and publishes the good news that he should be a lawgiver for all the nations. He speaks of Christ in a riddle. He orders his followers to obey him in these prophetic words.

"15. A prophet shall the Lord your God raise up to you from your brethren, like unto me, ye shall hear him [whatsoever he saith unto you]. 19. And it shall be that every soul who will not hear that prophet shall be cast out of its race."

And that this prophet, who is clearly the Christ, should come forth from the Jews and rule all nations, he proclaims again when he says:

"5. How fair are thy dwellings, O Jacob, and thy tents, O Israel, 6. as shady groves, and as a garden by a river, and as tents which God pitched. 7. There shall come a man out of his seed, and he shall rule over many nations, and his kingdom shall be exalted."

He makes it clear from which tribe of all the twelve that comprised the Hebrew race, namely the tribe of Judah, Christ the Lawgiver of the Gentiles according to the prophecy should arise. He is clear as to the date, for it would be after the cessation of the Jewish monarchy which had been handed down from their forefathers.

"A ruler shall not fail from Juda, nor a prince from his loins, until there come the things stored up for him; and he is the expectation of the nations."

What "expectation" could this be, but that expressed in the promise to Abraham that in him all the families of the earth should be blessed? Moses has, therefore, made it quite plain from his own words that he was quite well aware of the failure of the law he had laid down to apply to all nations, and that another prophet would be necessary for the fulfilment of the oracles given to Abraham. And this was He, of Whom his prophecy proclaimed the good news that one should arise from the tribe of Judah and rule all nations.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 3"

[[commentary]]
quote='''
That Moses' prediction was not indefinite, and that he did not see his prophecy in the shadows of illimitable and unmeasured time, but circumscribed the fulfilment of his predictions with the greatest accuracy by temporal limits, hear how he speaks prophetically about Him: "There shall not fail a prince from Juda, and a leader from his loins until he come in whom it is laid up, and he is the expectation of the Gentiles"---- which means that the order and succession of rulers and leaders of the Jewish race will not fail until the coming of the Prophesied, but that when there is a failure of their rulers the Prophesied will come. By Judah here he does not mean the tribe of Judah, but since in later days the whole race of the Jews came to be called after the kingly tribe, as even now we call them Jews, in a very wonderful and prophetic way he named the whole Jewish race, just as we do when we call them Jews.

Next he says that the rulers and heads of their race will not fail, before the Prophesied appear: and that on his arrival the Jewish state will be at once dissolved, and that he will be no longer the expectation of the Jews, but of the Gentiles. Now you could not apply this prophecy to any of the prophets, but only to our Lord and Saviour. For immediately on his appearance the kingdom of the Jews was taken away. For at once their king in the direct line failed, who ruled them according to their own laws, Augustus then being the first Roman Emperor, and Herod, who was of an alien race, becoming their king. And while they failed, the expectation of the Gentiles throughout the whole world appeared according to the divine prophecy, so that even now all men of all nations who believe in Him place the hope of godly expectation in Him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"

[[commentary]]
quote='''
[Passage quoted, Isa. viii. 5-8.]

It is clear that the only way to preserve the sense of this passage is to explain it figuratively. Thus it means by the water of Siloam that goes softly, the Gospel teaching of the word of salvation. For Siloam means "sent." And this would be God the Word, sent by the Father, of Whom Moses also says, A ruler shall not fail from Juda, nor a prince from his loins, until he come for whom it is stored up, and he is the expectation of nations. For instead for whom it is stored up, the Hebrew has "Siloam," the word of prophecy using the same word Siloam there and here, which means "the one that is sent."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"

[[commentary]]
quote='''
[Passage quoted, Gen. xlix. 8-10.]

The whole Hebrew race consisted of twelve tribes, one of which had Judah for its ancestor and head, to whom the above words were addressed, telling him that the Christ should spring from him. And if you compare with this prophecy the other prophecies I have quoted, you will find all through them that the same Being is proclaimed by a sign common to all. For one said of Him that springs from the root of Jesse, "And there shall be one arising to rule the nations, on him shall the nations trust." Another said of the son of Solomon, "He shall rule from sea to sea, and from the river to the ends of the world, and in him all nations shall be blessed." And the one before us similarly says, "Until he come for whom it is laid up, and he shall be the expectation of nations."

If, then, the predictions about the nations are in accord, and the previous ones have been proved to refer to our Saviour, nothing prevents us referring this one to Him as well, if these prophecies are agreed to be in harmony, especially with regard to the fact that the kings and rulers of the Jewish nation continued in the same line of succession until the period of Christ's appearing, but failed directly He appeared, and by the prediction of Jacob the expectation of the nations demanded a satisfaction.

Christ therefore is foretold here also, as destined to come from the tribe of Judah, and since He has been shewn to have been born of David, Solomon, and the root of Jesse, it is evident He came from the same tribe as they. For David was son of Jesse, and Solomon of David, both of the tribe of Judah. Our Lord and Saviour must therefore spring from it, as the wonderful evangelist Matthew states in his geneaology, "The Book of the generation of Jesus Christ, son of David, son of Abraham. Abraham begat Isaac, Isaac begat Jacob, Jacob begat Judah."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 3"

[[commentary]]
quote='''
1. "Jacob called his sons and said, Come together and hear what shall befall you at the end of the days. Come together and hear, ye sons of Jacob, hear your father."

Then, after rebuking his elder sons, one for one thing, one for another, as being unworthy because of their sins of the prophecy about to be given, he prophesies thus to his fourth son, as having shewn himself a better man than his brothers:

8. " Judah, thy brethren shall praise the, | thy hands shall be on the back of thy enemies, | the sons of thy father shall bow down to thee. | 9. Judah is a lion's whelp, | Thou hast sprung up, my son, from a slip. | Lying down thou didst sleep as a lion and a whelp, | Who shall arouse thee? | 10. A ruler shall not fail from Judah, | nor a governor from his loins, | until the things laid up for him come, | and he is the expectation of the nations."

First, consider what is meant by "the things laid up for him," and see if they be not the prophecies about the calling of the Gentiles, that God gave to those with Abraham. For it is written, that God said to Abraham :

"And thou shalt be blessed, and I will bless them that bless thee, and curse them that curse thee: and in thee shall all the families of the earth be blessed."

And again:

"Abraham," he says, "shall become a great and mighty nation, and in him shall all the nations of the earth be blessed."

Similar oracles were spoken to Isaac in this wise :

"And I will multiply thy seed as the stars of heaven, and in thy seed shall all nations of the world be blessed."

And also to Jacob this is said :

"I am the Lord God of Abraham thy father, and the God of Isaac, fear not."

And then :

"And in thee shall all the families of the earth be blessed."

And at another time God said to him :

"I am thy God, increase and multiply: nations and assemblies of nations shall come out of thee, and kings shall come out of thy loins."

Jacob, who knew the predictions of God concerning the calling of the nations, having twelve sons, called them all together to his deathbed, to discover in the line of which son God's predictions would be fulfilled. And, then, having laid rebukes on the three first for their wrongdoings, he tells them also that the fulfilment of the prophecies will not come about through them because of their wicked deeds. But coming to the fourth, who was Judah, he at once prophesies to him that the oracle, which says, "kings shall come from thy loins," will be fulfilled in his descendants. For it was plain that the kingly family was established in the tribe of Judah: and he shews at the same time at what period the prophecies of God and the promises to the Gentiles will fall due, and he teaches that one will come forth from him who will cause all nations and tribes to be admitted to the blessings of Abraham. All these things, then, were "the things laid up for him," that is to say, the ancient prophecies concerning the nations, and the words, "kings shall come out of thee," whereby his tribe has precedence of those of his brethren, as royal and pre-eminent.

Directly the whole nation was organized in the time of Moses God gave his tribe the chief rank among the tribes. For it is written:

"And the Lord spake to Moses and Aaron, saying, Let the children of Israel encamp fronting one another, every man keeping his own rank, according to their standards, according to the houses of their families before the Lord, around the tabernacle of witness; and they that encamp first towards the east, shall be the order of the camp of Judah with their host."

And later in the part that refers to the renewing of the sanctuary:

"The Lord said to Moses, One prince each day shall offer their gifts. And he that offered the first day was Naason, son of Aminadab, prince of the tribe of Judah."

And in the Book of Joshua, son of Nave, when the land of promise was divided by lot among the other tribes, the tribe of Judah took its own portion of the land without casting lots, and first of all. And, moreover, "After the death of Joshua the children of Israel inquired of the Lord, saying, Who shall go up for us against the Canaanite, leading our fighting against him? And the Lord said, Judah shall go up. Behold, I have given the land into his hands." These words, then, make it clear that God ordained the tribe of Judah to be the head of all Israel, and the account goes on: "And Judah went up, and the Lord delivered the Canaanite and Perizzite into his hand." And also: "And the children of Judah fought against Jerusalem and took it, and the sons of Judah came down from fighting against the Canaanite." And again: "And Judah went up with Symeon, his brother." And then: "And the Lord was with Judah, and gave him the Mount as his portion." And after this: "And the sons of Joseph went up, they also who were in Bethel, and Judah with them." And in the Book of Judges, when different men at different times were at the head of the people, though individually the Judges were of different tribes, yet speaking generally the tribe of Judah was head of the whole people, and much more so in the times of David and his successors, who belonged to the tribe of Judah, and continued to rule until the Babylonian Captivity, after which the leader of those who returned from Babylon to their own land was Zerubbabel, the son of Salathiel, of the tribe of Judah, who also built the Temple. Hence, too, the Book of Chronicles, when giving the genealogies of the twelve tribes of Israel, begins with Judah. And you will see it follows from this that, in the days that succeeded, the same tribe had the headship, although different individuals had temporary leadership, whose tribes it is impossible to decide with accuracy, because there is no sacred book handed down to give the history of the period from then to the time of our Saviour. But it is true to say that the tribe of Judah continued so long as the free and autonomous constitution of the whole nation lasted under its own leaders and kings. And this was the case from the beginning until the time of Augustus, when, after our Saviour's appearance among men, the whole nation became subject to Rome. And then instead of their ancestral and constitutional rulers they were ruled first by Herod, a foreigner, and next by the Emperor Augustus. And so long as there had not yet failed a prince from Judah, nor a leader from his loins, the dates of the prophecies are given from the reigns of the kings. Thus Isaiah prophesies in the reigns of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah. As did Hosea. Amos, in the days of Uzziah, king of Judah, and in the days of Jeroboam, son of Joash, king of Israel; and Zephaniah in the days of Josiah, son of Amos, king of Judah. And Jeremiah too. But when a prince failed from Judah, and a governor from his loins, when the expectation of the Gentiles foretold in Christ was just about to shine on human life, there were no longer any rulers styled kings in Judah or governors in Israel. And since they had failed at the appointed time in accordance with prophecy, Augustus first, and then Tiberius, was called king of the Jewish nation, in common with the other nations, and under them were procurators and tetrarchs of Judaea, and Herod of course, who, as I have already said, was not a Jew by birth, and received his authority over the Jews from Rome.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 1"
