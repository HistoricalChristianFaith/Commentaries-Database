[[commentary]]
quote='''
"18. In that day the mountains shall be consumed, and the hills, and forests, and shall be devoured from soul to body. And he that flees shall be as one that fleeth from burning flame, 19. and they that are left of them shall be a number, and a little child shall write them. 20. And it shall come to pass in that day, the remnant of Israel shall no more be added, and they that are saved of Jacob shall no more trust in those that wronged them, and they shall trust in the God the holy one of Israel in truth, 21. and the remnant of Israel shall turn to the mighty God. 22. And though the people of Israel be as the sand of the sea, the remnant of them shall be saved. 23. For he will finish the account, and cut it short in righteousness, for God will make a short account in the whole world."

And notice here, that in his denunciations of gloom, he says :

"He that fleeth shall be as one that fleeth from a burning flame; and their remnant shall be a number, and a little child shall write them"----

by which, he emphasizes the scanty number of those of the Circumcision who will escape destruction, and the burning of Jerusalem. "And they who are left," he says, "will be a number": that is they will be amenable to number, or few and easily numbered. As many, then, as those who believed in our Lord and Saviour were in comparison of the whole Jewish race, who also were thought worthy of being enrolled by Him, as the verse shews, which says: "And a little child shall write them." Having told us before Who the little child was, where he said: "Behold, the virgin shall be with child, and shall bring forth a son." And: "Before the child shall know to call on its father or mother."

And since in this place he says: "A little child shall write them," it can be seen why he said in the previous one : "And these shall be a remnant in Sion, and a remnant in Jerusalem, all shall be called holy, and shall be written in [the book of] life." As therefore among them a remnant is named, and it is they who were written in [the book of] life, so also here "the remnant from them shall be a number, and a little child shall write them." And this "remnant from Israel, and they that are saved from Jacob no more" he says "shall be with those that do them wrong, but shall trust in the Lord, the Holy One of Israel." So note if it is not with this very trust that they who went forth from the Jewish race, those who were left behind in the falling away of Israel, the disciples and apostles of our Saviour, taking no notice of the rulers of this world, or of the rulers of the people of the Circumcision who did them wrong of old, went forth to all the nations, preaching the word of Christ, and by their trust in God (for according to the prophecy "they were trusting in God, the holy one of Israel, in truth," for they gave up their whole selves in hope, without deceit or hypocrisy, but with truth) not only went forth from their own land, but prospered in that whereto they were sent. And this same remnant was like the seed of the falling away of Jacob that trusted in the strength of God, and this remnant of the whole race that once was as the sand of the sea, but not as the stars of the heaven, was thought worthy of salvation by God, as the Apostle bore witness saying :

"Isaiah cries concerning Israel, If the number of the children of Israel shall be as the sand of the sea, a remnant shall be saved."

For of the promises gives by the oracle to Abraham concerning those who were to come after him that "they shall be as the stars of the heaven, and as the sand of the sea," the friends of God are meant, on the one hand shining like the heavenly lights, such as were those of old, the prophets and our Saviour's apostles, to whom He bore witness saying : "Ye are the light of the world" ; but, on the other, the earth-born who lie upon the ground are compared to the sand of the shore. The prophetic word speaks rightly in the above, first where the whole multitude of Israel's sons, fallen from their true and magnificent virtue to the ground, is compared to the sand of the sea, and then when it says only the remnant shall be saved. But I have now dealt sufficiently with the question of the remnant. And he says that this will come to pass, when "the Lord cutting short and completing his word shall accomplish it through the whole world" : clearly pointing to the Gospel preaching, by which, the whole Mosaic circle of symbols and signs and bodily ordinances being taken away, the complete word of the Gospel given to all men has confirmed the truth of the prophecy.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
