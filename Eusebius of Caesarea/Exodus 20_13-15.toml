[[commentary]]
quote='''
And His precepts were those of a philosopher's life, which He outlined when He said to them: "Provide neither gold nor silver in your girdles, nor a staff for the road," and similar words, that they should commit themselves to all-governing Providence, and take no care for their needs, and bade them to aim higher than the Jews under Moses' commandments, to whom he gave a law as to men prone to murder. "Do not kill," and likewise, "Thou shalt not commit adultery" as to men who were lascivious and lecherous, and again, "Thou shalt not steal," as to men of the type of slaves; but our Saviour taught that they must regard such laws as not applying to them, and aim above all at a soul free from passion, cutting away from the depths of their minds as from the roots the shoots of sin: they must try to master anger and every base lust, and more, they must never ruffle the sublime calm of the soul with anger: they must not look upon a woman with unbridled lust, and so far from stealing they must lavish their own property on the needy: they must not be proud of not defrauding one another, but consider rather that they must bear no malice against those who defrauded them. But why should I collect everything that He taught and that they learned? He commanded them besides all this to hold so fast to truth, that so far from swearing falsely they should not need to swear at all, and to contrive to exhibit a life more faithful than any oath, going so far only as Yea and Nay, and using the words with truth.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 5"
