[[commentary]]
quote='''
Here I think it will be well to quote the words of the other translators, to put what I have said on an exact foundation. Of whom, Aquila said:

"For thou, Lord, my hope, hast set thy dwelling very high. Evils shall not affect thee, and no touch shall come near to thy shelter: for he gave command to his angels to guard thee in all thy ways.''

And Symmachus has:

"Thou, Lord, art my security, thou hast set thy dwelling very high. Evil shall have no power over thee, and no touch shall draw near thy tent. For he gave charge to his angels concerning thee to keep thee in all thy ways."

The Lord, then, is here addressed about some one greater than Himself, Who

"has charged his angels concerning thee, to keep thee in all thy ways. In their hands they shall bear thee (i.e., The Lord) lest at any time thou, O Lord, dash thy foot against a stone."

And the devil used these words in his Temptation of our Saviour, when he took Him into the holy city, and set Him upon the wing of the Temple and said to Him:

"If thou be the Son of God, cast thyself down hence, for it is written, he shall give his angels charge over thee, and in their hands they shall bear thee up, lest at any time thou dash thy foot against a stone,"

To whom the Lord answered and said:

"It is written, Thou shalt not tempt the Lord thy God."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 7"
