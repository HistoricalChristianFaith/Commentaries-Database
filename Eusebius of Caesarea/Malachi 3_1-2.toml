[[commentary]]
quote='''
[Passage quoted, Mal. iii. 1-2.]

THIS, too, is like the former prophecies. For the Lord God Himself, the Almighty, says that a Lord will come in His own temple, speaking of another: And He surely means God the Word. And after this also He names Him "the Angel of the Covenant" of Whom, too, Almighty God teaches that He will Him send forth before His face, saying, "Behold, I send forth my angel before my face." And this same Being, Whom He has called "My angel," He calls Lord directly after, and adds, "The Lord shall suddenly come, and the Angel of the Covenant." Thus having referred to one and the same Being, He proceeds, "Behold he comes, and who will abide the day of his coming?" meaning His Second and Glorious Coming. And the Lord who makes this prophecy is God, the Sovereign of the Universe.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 28"
