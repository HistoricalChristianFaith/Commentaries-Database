[[commentary]]
quote='''
[Passages quoted, Isa. 1. 1, 2 a, b.]

HERE the Lord Himself recording plainly His Coming among men rebukes the Jewish people, because they will not receive Him when He comes, nor hear Him when He calls. And He teaches, as if by way of apology, that this is the cause of their own rejection. "For when I came," He says, "I was not among you as a man: I called, and there was none that heard: therefore," He says, "ye were sold for your sins, inasmuch as ye were of yourselves divorced from my call, not that I had given you a bill of divorcement." This is clearly addressed to the Jews, and at the same time reveals their outrages on Him at His Passion, when it says: "I gave my back to scourges, and my cheeks to blows," and that which follows. But these words shall be properly interpreted at leisure.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 23"
