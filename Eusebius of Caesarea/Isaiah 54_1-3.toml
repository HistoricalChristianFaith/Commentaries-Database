[[commentary]]
quote='''
And the conclusion of the prophecy of Isaiah, tells of the soul once sterile and empty of God, or perhaps of the Church of the Gentiles, agreeably to the view I have taken. For since Christ has borne all for its sake, he rightly goes on after the predictions about them, to say:

"Rejoice, thou barren that bearest not; break forth and cry, thou that travailest not; for more are the children of the desolate, than of her that hath a husband, for the Lord has said, Enlarge the place of thy tent, and the skins of thy hangings peg down, do not spare. Widen thy cords, and strengthen thy pins: spread out still more to the right and left, and thy seed shall inherit the heathen."

This is the good news the Word gives the Church gathered from the Gentiles scattered throughout the world and stretching from sunrise to sunset, shewn forth very clearly when it says: "And thy seed shall inherit the Gentiles."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"
