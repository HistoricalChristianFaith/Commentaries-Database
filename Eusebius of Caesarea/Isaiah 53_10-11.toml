[[commentary]]
quote='''
It would have sufficed for him to have concluded the prophecy at this point, if he had not seen that something else would happen after the death of Christ. But as He after His death and entombment is to return and rise again almost at once, he adds this also concerning Him, saying next:

"The Lord also is pleased to purify him from his stroke----if ye can give an offering for sin, your soul shall see a life-long seed. And the Lord wills to take away from the travail of his soul, to shew him light."

He said above: "A man stricken, and knowing to bear weakness"; and now after his death and burial, he says: "The Lord wishes to cleanse him from his strokes." And how will this be done? "If ye offer," he says, "for sin, your soul shall see a seed that prolongs its days." For it is not allowed to all to see the seed of Christ that prolongs its days, but to those only who confess and bring the offerings for sins to God. For the soul of these only shall see the seed of Christ prolonging its days, be it His eternal life after death, or the word sown by Him through the whole world, which will prolong its days and endure for ever.

And as he said above: "And we reckoned him to be in trouble," so, now, after His slaughter and death, he says: "And the Lord wills to take his life away from its trouble, and to give it light." Since then the Lord, the Almighty God, willed to cleanse Him from this stroke, and to show Him light, if He willed He would most certainly do what He willed; for there is nothing that He wills which is not brought to pass: but He willed to cleanse Him and to give Him light; therefore he accomplished it, He cleansed Him and gave Him light.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"
