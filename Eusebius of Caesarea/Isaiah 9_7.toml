[[commentary]]
quote='''
Now consider yourself whether it does not overstep the limits of human nature that His peace should be said to be endless, and that He should be called Eternal Father; and also that He should be called not simply Angel, but Angel of Great Counsel, and Mighty God, and the other names in the list. And it says too that the kingdom of David will be restored by Him, which you will understand thus: there were many promises given to David, in which it was said:

"And I will set his hand in the sea, and his right hand in the rivers: he shall call upon me, Thou art my father, my God, and the helper of my salvation, And I will make him my firstborn, high above the kings of the earth. For ever I will keep my mercy for him, and my covenant shall stand firm with him, and I will make his seed for ever and ever, and his throne as the days of heaven."

And again:

"Once have I sworn by my holiness, I will not fail David, his seed shall remain for ever, and his throne is as the sun before me, and as the moon established for ever."

God promised all this to David in the Psalms, but through the sins of his successors the opposite actually happened— for the kings of David's seed lasted until Jeremiah, and ceased on the siege of the holy city by the Babylonians, so that from that date neither the throne of David nor his seed ruled the Jewish nation. And the Holy Spirit thus foretells the failure of the promises made to David in the same passage of the Psalm:

"But thou hast rejected, and made of no account, thou hast cast down thy Christ: Thou hast destroyed the covenant of thy servant, and cast his glory to the ground, thou hast broken down all his strongholds."

And a few verses later:

"Thou hast broken down his throne to the ground, thou hast lessened the days of his time, thou hast proved dishonour upon him";

a course of events which has been begun and carried to its conclusion from the Babylonian captivity of the Jews up to the Roman Empire and Tiberius. For no one of the seed of David appears to have sat on the throne of the Hebrews in the intervening period up to the coming of Christ. But when our Lord and Saviour Jesus Christ, Who was of David's seed, was proclaimed King of all the world, that very throne of David, as though renewed from its degradation and fall, was restored in the divine kingdom of our Saviour, and will last for ever; and even now, like the sun in God's Presence, is lighting the whole world with the rays of His teaching, according to the witness of the Psalm and the prophecy before us, which says concerning the Child that should be born, on the throne of David (that is to say, the eternal and lasting throne promised to David), He should sit in His kingdom, to guide it, and uphold it in justice and judgment from now even for ever. The Angel Gabriel should be a sufficient teacher that this was fulfilled, when he said in his sacred words to the Virgin:

"Fear not, Mary, for thou hast found favour with God; and behold thou shalt conceive in thy womb, and bear a son, and thou shalt call his name Jesus. He shall be great, and shall be called Son of the Highest, and the Lord God shall give unto him the throne of his father David, and he shall reign over the house of Jacob for ever, and of his kingdom there shall be no end."

And the prophet expecting this birth of Christ in the aforesaid Psalm, and regarding its postponement and delay as if it were the cause of the fall of David's throne, cries in disgust, "But thou hast refused, and made of no account, and cast off thy Christ." And he prays as though doubting the Divine Being, that the promise may be somehow swiftly fulfilled: "Where is thine ancient pity, Lord, which thou swarest unto David in thy truth? "which same things his prophecy most clearly says will be fulfilled at the birth of the Angel of Great Counsel.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"

[[commentary]]
quote='''
He says that the ground of this whole dispensation is the zeal of the Lord, "The zeal of the Lord of Sabaoth will do this." What is the character of this zeal? Is it not that recorded by Moses, where he says:

"They have provoked me to jealousy, but not according to God. They have angered me with their idols. And I will provoke them to jealousy by a nation which is not. By a foolish nation I will anger them "?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
