[[commentary]]
quote='''
"Hear ye isles, which are forsaken and tortured, hear, what I heard from the Lord of Sabaoth: the God of Israel has announced (it) to us.

Note the way in this passage also in which he does not call those of the Circumcision to hear the unspeakable words, but those only, whom he calls "forsaken and tortured," as were those in the apostolic age who bewailed and lamented the evil of the life of men.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
