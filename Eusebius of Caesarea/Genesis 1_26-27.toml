[[commentary]]
quote='''
"AND God said, Let us make man in our image, and likeness." And also: "And God said, It is not good for man to be alone, let us make a helper for him." And he at once shews that the Being addressed is not an angel of God, so that it may not be thought that this was said to angels, with the words: "And God made man, in the image of God he made him."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 7"
