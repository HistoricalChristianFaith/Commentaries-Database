[[commentary]]
quote='''
"20. And behold, I send my angel before thy face, that he may keep thee in the way, that he may bring thee into the land which I have prepared for thee. Take heed to thyself and hearken unto him and disobey him not; for he will not give way to thee, for my name is upon him."

"With my Name, who teach you these things," says the Lord Himself, is he inscribed, who is to lead the people into the land of promise. And if He was Jesus and none other, it is plain how He says that His name is set on Him. Nor is it strange that he calls him Angel, since it is said of John also, who was but a man: "Behold, I send my angel before thy face, who shall prepare thy way before thee."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 17"
[[commentary]]
quote='''
[Passages quoted, Exod. xxiii. 20, 21; xxxii. 34; xxxiii. i.]

IT will be plain to all that these could not be the words of a mere angel of God. But of what God could they be, but of the One seen by the forefathers, whom Jacob clearly called the Angel of God? And He we know was the Word of God, being called both the Servant of God, and God Himself and Lord.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 15"
