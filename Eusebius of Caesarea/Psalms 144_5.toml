[[commentary]]
quote='''
The words, "Touch the mountains and they shall smoke," I think are a veiled prophecy of the burning and abolition of all forms of idolatry, which had its chief seats among the ancients in mountains, it being a common charge against the Jews themselves, that they worshipped idols on every high mountain in imitation of foreign nations.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 9"
