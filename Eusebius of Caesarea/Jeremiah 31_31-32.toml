
[[commentary]]
quote='''
And theirs is the new covenant, not according to the old. Do not allow the covenant of the pre-Mosaic Saints to be called "the old covenant,"but that which was given to the Jews by the Law of Moses. For the text which says that the new will be quite unlike the old clearly implies which one was the old:

"I will make a new covenant, not according to the covenant I made with their fathers, in the day that I took them by the hand to lead them out of Egypt."

"Not according to the covenant of the Mosaic Law,"he says. For that was introduced to the Jews at the exodus from Egypt. It might have seemed that he was introducing a new covenant opposed to the religious ideals of the Abrahamic Saints, if he had not distinctly said:

"Not according to the covenant, which I made with their fathers, in the day that I took them by the hand to lead them out of Egypt."

He prophesied that the new covenant would not be according to the one enacted at the time of the Exodus and the wanderings in the wilderness, but according to the ancient one under which the pre-Mosaic saints flourished.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"
