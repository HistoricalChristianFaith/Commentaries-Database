[[commentary]]
quote='''
And in them too the rest of the prophecy was fulfilled, when on the day of our Saviour's coming living water came forth from Jerusalem, and the fruitful living word of Gospel Teaching went forth to all nations, beginning from Jerusalem, yea, from Jerusalem itself, and was spread over all the earth, even to the utmost bounds of the world. The Lord and Saviour Himself speaks of this water to the Samaritan woman:

"If thou knewest who it is that asketh thee for drink, thou wouldst have asked of him, and he would have given thee living water."

And He goes on to teach what advantage would accrue to all that taste of the living spiritual spring, saying that they that drink thereof, denying the many evil daemons who ruled them of old, will confess their one Lord and King, and that the Lord, that once was known only to the Hebrews, will become King of all nations that believe in Him from all the earth, and that His Name will be one, encircling all the earth and the wilderness. And who is not struck at seeing this fulfilled? For the Christian name, derived from the Name of Christ (and Christ was indeed the Lord) has encircled every place and city and land, and the very nations that dwell in the wilderness and at the ends of the earth, as the prophecy foretold.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 7"
