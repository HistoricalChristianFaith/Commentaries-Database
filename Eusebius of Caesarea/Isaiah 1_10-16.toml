[[commentary]]
quote='''
And to shew that the prophecy can only refer to the time of our Saviour's coming, the words that follow the text—"unless the Lord of Sabaoth had left unto us a very small remnant, we should have been as Sodom, and we should have been like unto Gomorrah," naming the whole people of the Jews as the people of Gomorrah, and their rulers as the princes of Sodom—imply a rejection of the Mosaic worship, and introduce in the prediction about them the characteristics of the covenant announced to all men by our Saviour, I mean regeneration by water, and the word and law completely new. For it says :

"Hear the word of the Lord, ye rulers of Sodom, give heed to the law of God, ye people of Gomorrah, What is the multitude of your sacrifices to me?" .

and that which follows. Thus it takes away what belongs to the Mosaic law, and introduces in its place another mode of the forgiveness of sins, through the washing of salvation and the life preached in accordance with it, saying :

"Wash you, be ye clean ; take away the evils from your souls."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
