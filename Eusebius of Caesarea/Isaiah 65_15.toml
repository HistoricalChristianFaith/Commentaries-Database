[[commentary]]
quote='''
On them Scripture now proceeds to prophesy that a new name shall be conferred, saying to the wicked :

"For your name shall be left, as a loathing for my chosen, and the Lord shall destroy you : but my servants shall be called by a new name."

And this new name, which was not known to them of old time, what could it be but the name of "Christians," blessed through all the world, formed from the name of our Saviour Jesus Christ?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
