[[commentary]]
quote='''
But it is worthy of notice why the Lord promises that a prophet shall arise. For when He had commanded Moses to sanctify the whole people for three days, that they might see and hear His Divine Appearing, and they were too weak for the favour of God: wherefore when they were at the beginning of the vision they refused and said to Moses: "Speak thou to us, and let not God speak to us, that we die not," and the Lord, as was meet, was pleased by their caution, and says, "They have rightly spoken all that they have spoken. A prophet will I raise up to them from the midst of their brethren, like unto thee." Then it was that He gave the reason of His own future Coming to men like a prophet. It was man's weakness, and his refusal of the greater vision of the greater. You see, too, the reason why the prophet that was foretold should become Incarnate. And so it was natural for the Jews, who expected Him, to inquire of John the Baptist, and say, "Art thou the prophet? and he said, No." And John spoke the truth, he did not deny that he was a prophet, for he was, but he denied that he was the prophet meant by Moses, because he taught that he was sent before that prophet.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 11"
