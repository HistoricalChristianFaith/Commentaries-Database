[[commentary]]
quote='''
"The Spirit of the Lord is on me because he has anointed me." Clearly this happened to those who thought that the Christ of God was neither a mere man nor an unfleshed and unembodied Word who did not take on a mortal nature. Instead they say he is both God and human, God in that he is the only-begotten God who was in the bosom of the Father, and man … from the seed of David according to the flesh. Thus, God the Word, who through the prophecy has been called Lord, speaks out this prophecy that is preeminent among other promises: "I am the Lord, and in the right time I will draw them together." … Taking the chrism in the Holy Spirit, he, chosen from among all, appears as the only-begotten Christ of God. And the verse "he has sent me to proclaim good news to the poor," he fulfilled in that time when he "was preaching the kingdom of heaven" and explaining the beatitudes to the disciples by saying, "Blessed are the poor in spirit, for theirs is the kingdom of God." … And for those nations then imprisoned in their souls by the invisible and spiritual powers he preached release to his newly encouraged disciples.… Therefore, he preached release to the prisoners and to those suffering from blindness who were those enslaved by the error of polytheism, and he creates a year that is acceptable, through which he made all time his own year. And from the passing years of humanity he provides days of created light for those close to him. He never kept hidden the age that is to come after the perfecting of the present. For that age will be a time much on the Lord's mind, being an age and day of requiting. For he will grant a change of fortune or a year of favor to those struggling in the present life.
'''
source_url=''
source_title="COMMENTARY ON ISAIAH 2:51"

[[commentary]]
quote='''
MY witness of this shall be from the words of Isaiah, who cries in the Person of Christ:

"The Spirit of the Lord is upon me, because he has sent me to preach good news to the poor, to proclaim deliverance to the captives, and recovery of sight to the blind."

Our Saviour, after reading this prophecy through in the Synagogue one day to a multitude of Jews, shut the book and said: "This day is this Scripture fulfilled in your ears." And beginning His own teaching from that point He began to preach the Gospel to the poor, putting in the forefront of His blessings: "Blessed are the poor in spirit, for theirs is the kingdom of heaven." Yea, and to those who were hampered by evil spirits, and bound for a long time like slaves by daemons, He proclaimed forgiveness, inviting all to be free and to escape from the bonds of sin, when He said: "Come unto me, all ye that labour, and are heavy laden, and I will refresh you."

And to the blind He gave sight, giving the power of seeing to those whose bodily vision was destroyed, and dowering with the vision of the light of true religion those who of old in their minds were blind to the truth.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 1"

[[commentary]]
quote='''
Now listen to Isaiah prophesying in the clearest words thus about Christ, as one to be sent by God to men as their Redeemer and Saviour, and coming to preach forgiveness to those in bondage of spirit, and recovery of sight to the blind. For here again the prophet teaches that the Christ has been anointed not with a prepared unguent, but with the spiritual and divine anointing of His Father's Divinity, conferred not by man but by the Father. He says then in the person of Christ:

"The Spirit of the Lord is upon me, because he has anointed me. He has sent me to preach glad tidings to the poor, to proclaim liberty to the captives, to heal the broken in heart, and recovery of sight to the blind."

Let this point then be regarded as certain, that Isaiah, equally with David, prophesies that He that should come to mankind to preach liberty to the captives and recovery of sight to the blind would not be anointed with a prepared unguent, but with an anointing of the power of His Father Unbegotten and Perfect. And according to the manner of prophecy the prophet speaks of the future as past, and as one predicting about himself.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 15"

[[commentary]]
quote='''
And we should here again remember Isaiah, who said:

"The Spirit of the Lord is upon me, for whose sake he hath anointed me. He has sent me to preach the gospel to the poor, to heal the broken-hearted, to proclaim liberty to the captives, and sight to the blind."

And we have already shewn that the priests from among men, who in long distant times were consecrated to the service of God, were anointed with a prepared unguent. But he that is spoken of in the prophecy is said to have been anointed with the Divine Spirit. And this passage in its entirety was referred to Jesus the only true Christ of God, Who one day took the prophecy in the Jewish synagogue, and after reading the selected portion, said that what He had read was fulfilled in Himself. For it is written, that having read it:

"And closing the book, and giving it to the minister, he sat down. And the eyes of all them that were in the synagogue were fastened upon him, 21. And he began to say unto them, This day is this Scripture fulfilled in your ears."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"

[[commentary]]
quote='''
[Passage quoted, Isa. lxi. 1.]

Now this prediction our Lord Himself claims to be fulfilled in Himself, when He came to Nazareth, where He was brought up:

"He entered, as his custom was on the Sabbath day, into the synagogue, and stood up to read. And there was delivered unto him the book of the prophet Esaias. And when he had opened the book he found the place where it was written, The Spirit of the Lord is upon me, because he hath anointed me, to preach the gospel to the poor: he hath sent me to proclaim deliverance to the captives, and giving of sight to the blind, to set at liberty them that are bruised, to proclaim the acceptable year of the Lord. And he closed the book, and he gave it again to the minister, and sat down. And the eyes of all them that were in the synagogue were fastened upon him. And he began to say unto them, This day is this Scripture fulfilled in your ears."

Our Lord and Saviour is clearly shewn in this passage to have been anointed with another and a better unction than the priests of old days, who were externally anointed, not with oil manufactured, nor by men, as were those others, but with the Divine Spirit of His God and Father, whereby as sharing in His unbegotten Godhead He is called God and Lord by the Holy Scriptures.

And in harmony with the prophecy before us He is introduced by Matthew preaching the Gospel to the poor when—

"Seeing the multitudes he went up into a mountain, and when he had sat down, his disciples came unto him, and he opened his mouth and taught them, saying, Blessed are the poor in spirit, for theirs is the kingdom of heaven."

And it is recorded that He gave sight to many that were blind, not only enlightening them that were deprived of bodily vision, but also causing them that were before blind in soul to receive spiritual vision and the knowledge of God. And, moreover, He preached freedom and release from their bonds to the prisoners bound and constrained by the unseen daemonic powers, and hampered by the chains of sin, if they, too, would believe His preaching, and run to Him as their Ransom and Saviour, and trust His promises.

The remainder of this oracle I will expound in its place in the section concerning the promises.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 10"
