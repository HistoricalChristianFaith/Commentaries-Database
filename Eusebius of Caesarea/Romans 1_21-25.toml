
[[commentary]]
quote='''
But though they did not know the Supreme God, nor the path of true religion, yet inspired by conceptions of natural religion they agreed in self-taught principles about the existence of a divine power, regarded it as and called it God, and considered the name one of salvation and beneficence, but they were not yet able to realize anything beyond a Being transcending the world of visible nature. Wherefore some of them—

25. "worshipped and served the creature rather than the creator; 21. and they became vain in their imaginations, and their foolish heart was darkened; 23. and they changed the glory of the incorruptible God into an image made like unto corruptible man, and to birds and four-footed beasts and creeping things."

And so they made images of their kings and tyrants long dead, and paid them divine honours, and by imputing divinity to them sanctified their wicked and lustful deeds as works of the gods.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Introduction"
