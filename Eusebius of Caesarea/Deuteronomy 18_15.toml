[[commentary]]
quote='''
For since as yet the prophecies lacked the fulfilment of their conclusions and of their words, He must necessarily fulfil them. As for example the prophecy in Moses says:

"A prophet shall the Lord your God raise up to you like unto me, him shall ye hear in all things, whatsoever that prophet shall speak to you."

He fulfilled what remained to be fulfilled in this prophecy, appearing as the second Lawgiver after Moses, giving to men the Law of the Supreme God's true holiness. For Moses does not say simply "a prophet,"but adds "like unto me": ("For a prophet," he says, "shall the Lord your God raise up unto you, like unto me. Him shall ye hear"), and this can only mean that He who was foretold would be equal to Moses. And Moses was the giver of the Law of holiness of the Supreme God. So He that was foretold, to be like Moses, would probably be like him in being a Lawgiver. And though there were many prophets in later days, none of them is recorded to have been "like Moses."

For they all referred their hearers to him. Even Scripture bears witness that "a prophet has not arisen like Moses": neither Jeremiah, nor Isaiah, nor any other of the prophets was like him, because not one of them was a Lawgiver. When the expectation was that a prophet who was also a Lawgiver like Moses should arise, Jesus Christ came giving a Law to all nations, and accomplishing what the Law could not. As He said:

"it was said to them of old time, Thou shalt not commit adultery: but I say unto you, Thou shalt not desire to." And, "It was said to them of old time, Thou shalt not kill, but I say unto you, Thou shalt not be angry." And, "No more in Jerusalem, but in every place must you worship." And, "Worship not with incense and sacrifices, but in spirit and in truth." And all such things that are recorded of His teaching are surely the laws of a Lawgiver very wise and very perfect.

Wherefore Holy Scripture says His hearers were "astounded," because He taught them "as one having authority, and not as the Scribes and the Pharisees"—an oracle which supplied what was lacking to the fulfilment of the prophecy of Moses. And the same can be said of the other prophecies about Him, and the calling of the Gentiles. He was, therefore, the fulfiller of the Law and the prophets since He brought the predictions referring to Himself to a conclusion.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 7"

[[commentary]]
quote='''
[Passage quoted, Deut. xviii. 15-19.]

IT must be noticed that no prophet like Moses has ever arisen among the Hebrews, who was a lawgiver and a teacher of religion to men, except our Saviour, the Christ of God. Therefore at the end of Deuteronomy it is said: "There has not arisen a prophet in Israel like unto Moses," though, of course, many prophets succeeded him, but none were like him. And the promise of God recognizes the whole future, that one only, and not many, should arise and be like him. And it implies that he will be a lawgiver and a teacher of religion to men, such as none but our Lord and Saviour Jesus Christ has been proved to be, being lawgiver and prophet of the God of the Universe His Father at the same time.

But Moses was leader of but one nation, and his legislation has been proved to be only applicable to that one nation; whereas the Christ of God, receiving the promise from His Father, "Desire of me, and I will give thee the nations for thine inheritance," as being established by His Father the Giver of the new law of holiness not to the Jews only, but to the whole human race, in calling all nations set before them a legislation that they could obey and that suited them. Thus by a diviner power than that of Moses He ordained through all the world His holy laws by His evangelists, legislating with more than human authority, saying, "Ye have heard that it was said to them of old time, Thou shalt not kill: but I say unto you that ye must not be angry without a cause," and that which follows this saying, as it is preserved in His written teaching, with regard to which the Evangelist says, "They were astonished at his teaching, for he taught them as one having authority, and not as their scribes."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 11"
