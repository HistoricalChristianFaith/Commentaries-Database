[[commentary]]
quote='''
And you will understand the sentence that follows if you compare with it these words in Zechariah:

"8. I saw the night, and behold a man sitting on a bay horse, and he stood in the midst of the shady mountains."

I believe this rider on the bay horse who stands in the midst of the shady mountains to be the same person mentioned in the prophecy before us, which says that the Holy One will come from a thick and shady mountain.

In each passage shady mountains are mentioned, and I believe they refer to the Paradise of God, which He planted eastward in Eden, or perhaps to the Heavenly Jerusalem. For "there are mountains around it, and the Lord is in the midst of his people." And these mountains are said to be shady, because they are full of divine powers and holy spirits, as of trees planted there and far-spreading. But in Zechariah clearly the vision was of a man riding on a bay horse, by which the Incarnation of our Saviour was meant, and the flesh in which He rode: while here "God a Holy One" is named. For to mark that it was from God that He made His approach to men, and that He arrived from diviner regions, it is said, "God came from Thaeman, and the Holy One from a thick and shady mountain."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 15"
