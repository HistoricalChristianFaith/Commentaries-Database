[[commentary]]
quote='''
And if it is the Christ and no one else Who is prophesied as springing from the root of Jesse, and this at least is so strongly held by the Hebrews themselves, that not one of them questions its truth at all, consider how He is proclaimed as about to arise to reign not over Israel but over the Gentiles, and how the Gentiles are said to be about to hope in Him, and not Israel, inasmuch as He is the expectation of the Gentiles. Wherefore He is said "to be about to bring judgment to the Gentiles," and "to be for a light to the Gentiles." And again it is said: "In his name shall the Gentiles trust," and that He shall be given for salvation not only to the Jews but to all men, even to those at the ends of the earth. Wherefore it was said to Him by the Father that sent Him down :

"I gave thee for a covenant of the race, for a light of the Gentiles, to establish the earth, and to inherit the waste heritages." He says He is "a witness to the Gentiles," meaning that nations which have never before learned anything about Christ, when they knew His dispensation, and the might that was in Him, have called on Him, and that the peoples who did not before of old know Him, have taken refuge in Him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"

[[commentary]]
quote='''
[Passage quoted, Isa. xi. 1-10.]

This Jesse was David's father. As, then, in the preceding prophecies it was foretold that one should come forth of the fruit and seed of David, and also of the seed of Solomon, in the same way here it is prophesied that one will come forth of the seed of Jesse, that is to say of David, many years after the death of both David and Solomon. And this passage decides the quibble of the Jews already noticed with regard to Solomon. For Isaiah writes this prophecy about some one other than him many years after the death of Solomon, who should arise from the stem of Jesse, and the seed of David. And I do not think it can be doubted that the words apply only to our Saviour, the Christ of God, considering the promise in the prediction, which says, "And there shall be a root of Jesse, and he that riseth to rule the nations, in him shall the nations trust," and the way in which our Saviour fulfils them.

For He alone, after His Resurrection from the dead, intended here I think by the word "Arise," ruled not only the Jews but all nations, so that the prophecy does not lack fulfilment, as it is quite clear that the words, "In Him shall the Gentiles trust," are fulfilled in Him, as well as the other prophecies.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 3"

[[commentary]]
quote='''
And the figure used by the prophet is also exceedingly strange when he says, "O Libanus, open thy gates, and let fire devour thy cedars." For he calls the Temple here, as was not unusual, by the name of Libanus (it is so called in other prophecies). To this the Jews themselves now assent, since Isaiah, too, has a similar prophecy to the one before us, namely:

"Behold, the Lord of Sabaoth shall disturb the noble with might, and the lofty shall be crushed in their pride." And Libanus shall fall with its lofty ones, and there shall come forth a rod from the stem of Jesse, and a flower shall spring up from his roots, and the spirit of the Lord shall rest upon him."

To which he adds:

"And there shall be a root of Jesse, and he that shall rise to rule the Gentiles, in him shall the Gentiles trust."

Here, too, the destruction of Libanus and the call of the Gentiles is connected with the birth of Christ, of the seed of Jesse and David.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 4"
