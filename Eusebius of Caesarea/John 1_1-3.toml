[[commentary]]
quote='''
Now it is evident that with the Psalm before us which says, "By the word of the Lord the heavens were made firm," the holy gospel exactly agrees when it says, "In the beginning was the Word, and the Word was with God, and the Word was God. The same was in the beginning with God. All things were made by him, and without him was not anything made." The Gospel rightly calls Him God: for this same being who is now regarded as God, has been called in our previous quotations, the Word, the Wisdom and the Offspring of God, and the Priest, the Christ, King, Lord, God, and the Image of God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 5"
