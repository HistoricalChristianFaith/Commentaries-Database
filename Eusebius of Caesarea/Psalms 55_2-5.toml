[[commentary]]
quote='''
Thus in prayer He speaks of the time before His death during which Judas hatched his treachery against Him. And it was then that our Lord and Saviour, as one who mourned for the destruction and ruin of His friend, and still more for the casting away of the whole Jewish race, as if in sympathy with friends gone mad who were very dear to Him, calls all His union with them and instruction of them wasted, in that it has profited them nothing, saying:

"I was grieved with my wasted efforts, and I was moved by the voice of the enemy, and by the affliction of the sinner. For they fell," He says, "into iniquity, and reviled me in anger."

This may either be referred to the Jewish rulers, who attempted to catch Him with enmity and conspiracy, or it may have been spoken of the invisible powers that fought against Him from without, and inspired the plot that was carried through by men. And this I think agrees with His words in the Gospels at the time of the Passion, when He says to His disciples: "My soul is exceeding sorrowful, even unto death: tarry ye here, and watch with me.'' And again, "Now is my soul troubled." The words of the Psalm are similar to those, where it said: "My heart is moved within me, and the fear of death is fallen upon me; Fear and trembling have come upon me, and darkness hath covered me," in which He reveals the attacks of the opposing powers upon Him. As then in the prophets a certain "spirit of adultery "is named, e.g. "They were deceived by a spirit of adultery" and "the spirit of error in the wilderness," so also the spirit of death would cause fear, just as the spirit of strength would be the source of power and divine bravery. So we should call it "the spirit of fear and trembling," and, indeed, "the spirit of fear and confusion "as well, which usually comes on nearly all that die as martyrs for their religion, and much more would be laid on Him that underwent death for all. But whether it was the spirit of fear and of death, or of fear and trembling, or any other like power that fell upon Him, at any rate it did not break Him down, for He, like a noble athlete, threw far from Him the fear of death by His assurance of life, for He is the Life. And so He drove far off the spirit of fear and trembling which attacked Him by the power of the spirit of bravery, might, and strength. For according to Isaiah, "There rested on Him (together with the other spirits), the spirit of counsel and strength." So, too, He puts to flight the spirit of darkness by the power of His own light. For, "The light shineth in darkness, and the darkness comprehended it not." You will find similar passages in Psalm xxi., where again, in His person, it is said, "Many oxen have come about me: fat bulls hemmed me in. They gaped upon me with their mouths, as a ramping and roaring lion." And also, "Many dogs have encircled me, the council of the wicked-doers has surrounded me." And once more:

"Save my soul from the sword, and my only-begotten from the power of the dog. Save me from the lion's mouth, and my humility from the horns of the unicorns."

Here He clearly calls the evil powers bulls and calves, lions, dogs and unicorns, who hemmed Him in and surrounded Him at the time of His Passion, but were not able to do aught against Him. And this follows, only if these parts of the Psalm refer to our Lord and Saviour: but if they do not refer to Him, but to some one else, you must yourself reduce the passage to harmony.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 2"
