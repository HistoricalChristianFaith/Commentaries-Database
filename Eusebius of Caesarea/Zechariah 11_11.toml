[[commentary]]
quote='''
And as the oracle intended clearly their destruction by this, it naturally goes on to say that they shall no longer recognize the power of things prophesied, but the Canaanites will, when He says, "And the Canaanites shall know, my sheep kept for me, because it is the Word of the Lord." Who are meant by the Canaanites but ourselves, who once were foreigners, and sheep kept for Christ from all the old heathen and sinful nations? We that have been converted by His grace, and understanding the things prophesied, have received the true knowledge of the word of the Lord; yea, we Canaanites know and understand what was meant; but they that boasted of Israel, and gloried in being of the seed of Abraham, neither knew nor understood.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 4"
