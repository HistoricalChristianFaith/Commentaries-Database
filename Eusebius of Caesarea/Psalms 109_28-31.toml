[[commentary]]
quote='''
And since, even now, the Jews draw down the curse of their fathers upon themselves, and are wont with blasphemy and impious words to anathematize our Lord and Saviour and all that believe on Him, He goes on to say:

"They shall curse, but thou wilt bless. May they that arise against me be ashamed, but thy servant shall rejoice. Let them who speak evil of me be clothed with shame, and be clothed in confusion as with a cloak. But I will confess the Lord with my mouth, and amid many will I praise him, for he stood by the right hand of the poor, to save my soul from the persecutors."

And it is quite clear, even now, to what evils they that invoke curses in their synagogues have grown accustomed, never at all being able to recover from those same times, while He offers to His Father in the midst of many nations the praise of His new Covenant, having the Father working with Him, Who sits at His own right hand. "Wherefore," He says, "in the midst of many will I praise him, for he stood at the right hand of the poor." And He assures of His own preservation after death in the words: "To save my soul from the persecutors." For after He had said above, "He persecuted the poor man and the beggar and him that was stricken in heart even unto death," and had shewed forth His own death outlining the prophecy, He said figuratively, "For he stood at the right hand of the poor, to save his soul from the persecutors."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 3"
