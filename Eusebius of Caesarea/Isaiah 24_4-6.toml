[[commentary]]
quote='''
"4 b. The lofty men of the earth mourned, 5. and the earth waxed lawless through her inhabitants. 6b. Therefore, the inhabitants of the earth shall be poor, and few men shall be left."

Here again having rebuked the transgressors of the law of the covenant of God who belong to the people of the circumcision, and threatened them with what was written, he prophesies that some few men of them will be left. And these would be those named of the apostle "the remnant according to the election of grace."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
