[[commentary]]
quote='''
[Passage quoted, Zech. xiv. 16-19.]

This passage clearly implies the calling of all the Gentiles, if we only regard the sense of what is said about Jerusalem and the tabernacle, to which I will give the proper interpretation in its right place.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 1"

[[commentary]]
quote='''
And if they say that they were chosen out to act as priests and to offer worship to God, it can be shewn that the Word promised that He would give to the Gentiles an equal share in His service, when He said: "Render to the Lord, O ye kindreds of the nations, render to the Lord glory and honour: bring sacrifices and come into his courts." To which the oracle in Isaiah may be conjoined, which says: "There shall be an altar to the Lord in the land of Egypt . . . and the Egyptians will know the Lord. And they shall do sacrifice, and say prayers to the Lord, and offer." And in this you will understand that it is prophesied that an altar will be built to the Lord away from Jerusalem in Egypt, and that the Egyptians will there offer sacrifice, say prayers and give gifts to the Lord. Yes, and not only in Egypt, but in the true Jerusalem itself, whatever it is thought to be, all the nations, and the Egyptians forsooth, the most superstitious of them all, are invited to keep the Feast of Tabernacles, as a feast of the heart.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"

[[commentary]]
quote='''
And it was when our Lord Jesus, the Christ of God, had visited the olive-grove over against Jerusalem, since the words of the prophecy were fulfilled which said, "His feet shall stand upon the Mount of Olives opposite to Jerusalem," that is, the life of holiness having been established throughout all the world, that all the nations, according to the prophecy, kept the Feast of Tabernacles together in every place to the God of the prophets, and the Egyptians from that time recognizing God erected tents in every town and country place, which mean the local Christian Churches. For the power of our Saviour Jesus Christ has pegged them far better than Moses' tents through the whole world, so that every race of men and all the Gentiles may keep their Feast of Tabernacles to Almighty God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 4"
