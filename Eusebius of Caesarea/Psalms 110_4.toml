[[commentary]]
quote='''
And while in the previous passage we read, "Anointed with the oil of gladness above thy fellows"—it being the Hebrew custom to anoint priests —the passage before us now pronounces Him priest in clearer terms, adding more teaching about Him, by which we learn that He unlike all previous priests is the Eternal Priest, an idea which cannot be associated with mere humanity. He says that He is made a priest after the order of Melchizedek, in contradistinction to the ordinance of the Mosaic priesthood, held either by Aaron or any of his descendants, none of whom were priests until they had been anointed with a prepared ointment, and so became, as by type and symbol, a kind of shadowy and symbolical Christ. He was one of course that because of his mortality could not extend his priesthood long, and moreover was only consecrated for Jewish people, not for the other nations. He did not enter on his priestly duty under an oath of God, but was only honoured by the judgment of men, so that it was sometimes the case that something unworthy of God's service was found in them, as is recorded of Eli. And moreover besides all this, that ancient priest of the Mosaic order could only be selected from the tribe of Levi. It was obligatory without exception that he should be of the family descending from Aaron, and do service to God in outward worship with the sacrifices and blood of irrational animals. But he that is named Melchizedek, which in Greek is translated "king of righteousness," who was king of Salem, which would mean "king of peace," without father, without mother, without line of descent, not having, according to the account, "beginning of years, nor end of life," had no characteristics shared by the Aaronic priesthood. For he was not chosen by men, he was not anointed with prepared oil, he was not of the tribe of those who had not yet been born; and strangest of all, he was not even circumcised in his flesh, and yet he blesses Abraham, as if he were far better than he; he did not act as priest to the Most High God with sacrifices and libations, nor did he minister at the Temple in Jerusalem. How could he? it did not yet exist. And he was such of course because there was going to be no similarity between our Saviour Christ and Aaron, for He was neither to be designated priest after a period when He was not priest, nor was He to become priest, but be it. For we should notice carefully in the words, "Thou art a priest for ever," He does not say, "Thou shalt be what thou wert not before," any more than, "Thou wert that before, which thou art not now"—but by Him Who said, "I am that I am," it is said, "Thou art, and remainest, a priest for ever."

Since, then, Christ neither entered on His priesthood in time, nor sprang from the priestly tribe, nor was anointed with prepared and outward oil, nor will ever reach the end of His priesthood, nor will be established only for the Jews but for all nations, for all these reasons He is rightly said to have forsaken the priesthood after Aaron's type, and to be a priest after the order of Melchizedek. And the fulfilment of the oracle is truly wondrous, to one who recognizes how our Saviour Jesus the Christ of God even now performs through His ministers even to-day sacrifices after the manner of Melchizedek's. For just as he, who was priest of the Gentiles, is not represented as offering outward sacrifices, but as blessing Abraham only with wine and bread, in exactly the same way our Lord and Saviour Himself first, and then all His priests among all nations, perform the spiritual sacrifice according to the customs of the Church, and with wine and bread darkly express the mysteries of His Body and saving Blood. This by the Holy Spirit Melchizedek foresaw, and used the figures of what was to come, as the Scripture of Moses witnesses, when it says:

"And Melchizedek, king of Salem, brought out bread and wine: and he was priest of the Most High God, and he blessed Abraham."

And thus it followed that only to Him with the addition of an oath:

"The Lord God sware, and will not repent, Thou art a priest for ever after the order of Melchizedek."

Hear, too, what the apostle also says about this:

"17. Wherein God willing more abundantly to shew unto the heirs of the kingdom the immutability of his counsel mediated it by an oath: 18. That by two immutable things, in which it was impossible for God to lie, we might have a strong encouragement, who have fled for refuge to lay hold on the hope set before us."

And he adds:

"23. And they indeed have been made priests many in number, because that by death they were hindered from continuing. 24. But he, because he abideth, hath an unchangeable priesthood. 25. Wherein he is able to save to the uttermost them that come unto God by him, seeing he ever liveth to make intercession for them. 26. For such an high priest became us, who is holy, guileless, undefiled, separated from sinners, and made higher than the heavens."

And he adds:

"1. Now in the things which we are saying the chief point is this: We have such an high priest, who sat down on the right hand of the Majesty in the heavens, 2. a minister of the holy things, and of the true tabernacle, which God has pitched, and not man."

So says the apostle.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 3"
