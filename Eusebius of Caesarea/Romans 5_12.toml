[[commentary]]
quote='''
Since the apostle said, "By man death entered into the world," it was surely essential that the victory over death should be achieved by man as well, and the body of death be shewn to be the body of life, and the reign of sin that before ruled in the mortal body be destroyed, so that it should no longer serve sin but righteousness. And since long ago man fell through the sins of the flesh, the standard of victory over his enemies was rightly upraised again by one that was sinless and undefiled of all evil. And who were these enemies, but they who of old had overcome the human race by the pleasures of the flesh?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
