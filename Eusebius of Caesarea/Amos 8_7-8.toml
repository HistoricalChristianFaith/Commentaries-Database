[[commentary]]
quote='''
[Passage quoted, Amos viii. 7-12.]

THIS prophecy foretells the pride, insolence and rebellion of the Jews against our Saviour, and says that the Lord sware against the presumption of Jacob, that their insolence against Him should never be forgotten, and that their land and its inhabitants should undergo suffering and mourning, and that no more as before should they be punished a little while and then restored, but that this judgment should last for ever. For He says, "Complete destruction shall come upon them," meaning that wrath in the time of the Roman Empire would attack them, that a river should rise on them as on men who before were lifted up.

And then after this anger of God against them, their state, He says, will again "Come down like the river of Egypt."

By which I think is meant, that the ancient glories of the Jews once so lofty, so prized by God, and as it were exalted on high, will become like the state of the heathen nations, which flow and pass by like a river, and will go from height to depth.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 6"
