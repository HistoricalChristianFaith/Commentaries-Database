[[commentary]]
quote='''
"For sin to be ended, and to seal up transgressions, and to blot out iniquities, and to make atonement for iniquities, and to bring in everlasting righteousness, and to seal the vision and the prophet, and to anoint the most holy."

Instead of, "For sin to be ended, and to seal up transgressions," Aquila translated, "For ending disobedience, and for completing transgression." I think that our Saviour's words to the Jews, "Ye have filled up the measure of your fathers," are parallel to this. For the transgression of the Jewish nation culminated in the plot they dared to make against Him, and what Aquila calls their "disobedience "to God reached its end. For many times of old the long-suffering of God had borne with their transgressions before the Saviour came, as is shewn by the prophet's words: but just as in the case of the ancient foreign inhabitants of the land of promise it was said to Abraham, "The sins of the Amorites are not yet fulfilled," and if they were not yet fulfilled they could not yet be driven from their native land, but when they were fulfilled, they were then destroyed by Joshua, the successor of Moses: so also you will understand in the case of the before-mentioned people. For while their sins were not fulfilled, the patience and long-suffering of God bore with them, calling them many times to repentance by the prophets. But when, as our Saviour said, they had filled up the measure of their fathers, then the whole collected weight worked their destruction at one time, as our Lord taught again when He said:

"All the blood poured forth from the foundation of the world, from the blood of righteous Abel to the blood of Zacharias, shall come upon this generation."

For presuming last of all to lay their hands on the Son of God they completed their disobedience and completed their sins, according to Aquila's translation, or according to the Septuagint, "Their sin was bound and sealed."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 2"
