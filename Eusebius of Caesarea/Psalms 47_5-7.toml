[[commentary]]
quote='''
And the Word of God, of Whom I have discoursed so much, after accomplishing all things in His appearance among men, "ascended with a shout." This is interpreted by the apostle, who says: "That he ascended, what is it but that he also descended first to the lower parts of the earth? He that descended is the same as He Who ascended far above all heavens." And he says that He ascended with a shout, because of the companies of angels proclaiming His Divinity as He went up, who also said: "Open your gates, ye rulers, and be ye lift up, ye everlasting doors, and the King of glory shall come in."

And you would not err in identifying the sound of the trumpet with the preaching of the Gospel heard in all the world. For as the trumpet is the loudest of all musical instruments, it seems a fit symbol to shew forth that the teaching given to all men about Christ is proclaimed in stronger and louder tones than any other teaching has ever been, by which as by a trumpet for the hearing of all men the Holy Spirit shouts and cries what follows in this Psalm, "Sing to the Lord, sing, sing to our King, sing, That God is King "not only of the Jewish race in the future, he says, but "of all the earth, sing with understanding."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 2"
