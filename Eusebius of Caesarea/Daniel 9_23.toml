[[commentary]]
quote='''
So then he says to Daniel:

"I am now come forth to impart to thee understanding, at the beginning of thy supplication the word came forth, and I am come to tell thee, for thou art a man greatly beloved. Consider the matter, understand the vision";

clearly urging him to a deeper consideration and understanding of the meaning of his words. He calls it then a vision from its involving deeper consideration, and more than common understanding: wherefore we, too, if we call on Him who gives understanding, and pray that the eyes of our understanding may be enlightened, should trust confidently in the vision of this passage:
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 2"
