[[commentary]]
quote='''
"5. The Lord fulfil all thy requests. | 6. Now I know that the Lord has saved His Christ, | and will hear him from his holy heaven. | "

Since it is now my object to shew in how many places the Christ is mentioned by name in the prophecies, I naturally set before you those which plainly foretell the Christ. And all this Psalm voices a prayer as spoken by holy men to the Person of Christ. For since for our sakes and on our behalf He received insult when He had become man, we are taught to join our prayers with His as He prays and supplicates the Father on our behalf, as one who repels attacks against us both visible and invisible. And so we speak to Him as such in the Psalm.

"1. The Lord hear thee in the day of affliction |, the name of the God of Jacob shield thee. 2. May he send thee help from his holy (place) |, and strengthen thee from Zion. |"

And then, since it is fitting for Him, as being our great High Priest, to offer the spiritual sacrifices of praise and words to God on our behalf, and since as a priest He offered both Himself, and the Humanity which He assumed on earth as a whole burnt-offering for us, to God and the Father, we therefore say to Him:

" 4. May he remember all thy sacrifice, | and fatten thy burnt sacrifice. | "

And since all that He plans is saving and useful to the world, we rightly call on Him:

"5. The Lord give thee thy heart's desire,"

saying:

"And fulfil all thy mind."

And afterwards remembering His Resurrection from the dead, we say:

"6. We will exult in thy salvation."

For what else could the salvation of Christ be, but His Resurrection from the dead, by which also He raises all the fallen? Next we say:

"8b. And we will triumph in the name of our God: and the Lord fulfil all thy requests."

And to crown all we are taught to say:

"7. Now I know that the Lord has saved his Christ."

As if we had not known it before, we understand His Salvation in perceiving the power of His Resurrection.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
