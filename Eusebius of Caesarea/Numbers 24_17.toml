
[[commentary]]
quote='''
Let us now learn the reason why the star appeared. Now Moses says, that all the stars were set in the firmament by God "for signs and for seasons." But this was a strange and unusual star, not one of the many known stars, but being new and fresh by its appearance here it portended a new luminary that should shine on all the Universe, the Christ of God, a great and a new Star, whose likeness the star that appeared to the wise men symbolically shewed. For since in all the holy and inspired Scriptures the leading object of the meaning is to give mystic and divine instruction, while preserving as well the obvious meaning in its own sphere of historical facts, so the prediction before us was properly and literally fulfilled in the matter of the star that was prophesied to appear at our Saviour's Birth.

In the case of other remarkable and famous men we know that strange stars have appeared, what some call comets, or meteors, or tails of fire, or similar phenomena that are seen in connection with great unusual events. But what event could be greater or more important for the whole Universe than the spiritual light coming to all men through the Saviour's Advent, bringing to human souls the gift of holiness and true knowledge of God? Wherefore the herald star gave the great sign, telling in symbol that the Christ of God would shine as a great new light on all the world.

And the prophecy foretells a man as well as a star, for it says: "A star shall rise out of Jacob, and a man shall spring from Israel," naming first the heavenly light, the Word of God, and next the Humanity. And He is called, as I have shewn in my former books, in other places by the varying names of Rising, Light, and Sun of Righteousness. And here, by applying to Him the verb from "Rising," "a star shall rise out of Jacob," it shews His Diviner aspect, as "giving light to every man that cometh into the world"; while it shews the Humanity, by the suffering that comes to Him, where it foretells that He will fall to rise again, in words like what Isaiah says of Him: "And there shall be a root of Jesse, and he that shall rise to rule the Gentiles; in Him shall the Gentiles trust." And we see how true it is that the light of our Saviour, which rose from Jacob, that is from the Jews, has shone on all nations but Jacob, from whence it came forth.

And while this can be found in many prophecies, which say as it were to Christ Himself: "Behold, I have set thee for a light to the Gentiles, for a covenant of thy race," it is especially obvious in the words of Balaam, when he says: "A man shall come from his seed, and shall rule many nations." Whose seed but Israel's, as the context shews? And thus our Saviour, the Word, as the prophecy foretold, ruling over the nations threw down the invisible noxious powers which had governed them so long, the spirits of evil, and the band of daemons, called figuratively here the princes of Moab, Seth, Edom, and Esau.

The words: "I will point to him, but not now, I bless him but he draws not near," which are obscure in the Septuagint, are more clearly rendered by Aquila: "I shall see him, but not now; I expect him, but he is not near." And Symmachus more plainly still says: "I see him but not near." Balaam would speak thus of things revealed to him that would be accomplished a very long time after his own days. And so at the conclusion of two thousand years after his prediction they were fulfilled in our Saviour's Coming among men.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 1"
