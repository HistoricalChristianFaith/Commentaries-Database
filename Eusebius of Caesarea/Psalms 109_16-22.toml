[[commentary]]
quote='''
But just as in the preceding prophecy, our Lord and Saviour was called a beggar and a poor man, as I have pointed out in expounding, "Blessed is the man that considereth the poor and needy," so in the present Psalm He is called by these names.

May such and such judgments fall on Judas, He says, and those who have like desires to his. What those judgments are He adds in these words:

"Because he remembered not to do mercy, and persecuted the poor and the beggar and the stricken in spirit even unto death. He loved cursing and it shall come to him; he wished not blessing, and it shall be far off from him."

And a little lower down He again calls Himself a poor man and a beggar, and says:

"And thou, Lord most high, have mercy on me, for thy name's sake, for good is thy mercy. Save me, for I am poor and a beggar."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 3"
