[[commentary]]
quote='''
[Passages quoted, Isa. vi. i; 8-10.]

THIS, too, is fulfilled in our Saviour, according to John, when he says:

"37. But though he had done so many miracles before them, yet they believed not on him: 38. That the saying of Esaias the prophet might be fulfilled, which he spake, Lord, who hath believed our report? and to whom hath the arm of the Lord been revealed?" 39. Therefore they could not believe, because that Esaias said again, 40. He hath blinded their eyes, and hardened their heart; that they should not see with their eyes, nor understand with their heart, and be converted, and I should heal them. 41. These things said Esaias, when he saw his glory, and spake of him."

Or according to Matthew:

"10. And the disciples came and said to him, Why speaketh thou unto them in parables? 11. He answered and said unto them, Because it is given unto you to know the mysteries of the kingdom of heaven, but to them it is not given ... 13. Therefore speak I unto them in parables, because they seeing see not, and hearing they hear not, neither do they understand . . . 15. lest they should be converted, and I should heal them."

Then was fulfilled in them the prophecy of Isaiah which said, "Go and say to this people, Hearing ye shall hear, and not understand," and that which follows. Notice how S. John proceeds saying, "These things said Esaias, when he saw his glory, and spake of him." As the prophet had seen the Christ and the glory of Christ in the vision in which he said, "I saw the Lord of Sabaoth sitting upon a throne, high and lifted up," and that which follows. And who would not be struck by the prophecy, seeing so clearly even now the unbelief of the Jews? Even so of old, when they saw Him Incarnate and working miracles among them, they did not behold Him with the eyes of their soul and with understanding vision, nor had they any vision of spiritual inspiration, so as to understand what power it was that worked so wondrously and so prodigally among them. Yes, they who were counted worthy to receive with their eyes the words of eternal life, and listened to the voice of divine wisdom, did not hear with the ears of their understanding, and so made themselves an evident fulfilment of the prophecy. And even until now, though the power of Christ, by which every race of mankind, divorced from its ancestral superstition, is being led to the Christian religion, is so obvious to them, yet they do not regard it with their understanding, nor consider that what neither Moses nor his successors among the prophets achieved has been brought to pass by these alone, namely, to give up idolatry and pay no heed to polytheistic error, which has been accomplished among all nations by the power of our Saviour. And so when they read the witness of the prophets concerning Him, they hear with their ears and do not understand, and the prophecy before us is literally even now fulfilled against them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 16"
