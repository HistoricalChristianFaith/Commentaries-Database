[[commentary]]
quote='''
Let us now proceed to investigate, in what way the expressions of the Psalm must be referred to Him. And first we will deal with the inscription which says, "To the end," or according to Aquila, "To the Conqueror," or according to Symmachus, "Ode of Victory concerning the Succour." I have an idea, based on the words of the Evangelists, "There was darkness from the sixth hour unto the ninth hour," that our Saviour's Passion was concluded about the ninth hour, when with a loud voice He spake the words quoted a little before, and that we should consider that His Passion was past at eventide on the approach of night. Then His Resurrection from the dead, which was the Succour of the Father Who succoured Him, and drew Him to Himself, from the land of death, and received Him, must have taken place at dawn, as we learn from the Evangelists. For Luke says, "On the first day of the week at the break of dawn they came [that is the women], to the sepulchre, bearing the spices which they had prepared, and certain others with them. And they found the stone rolled away from the sepulchre. And going in they did not find the Body, because our Saviour was already risen from the dead." Mark also tells the same story, saying:

"And very early in the morning, on the first day of the week they went to the sepulchre, at the rising of the sun, and said to one another, Who shall roll us away the stone from the door of the Sepulchre? for it was very great."

They went, and found it rolled away. And He was already risen. There is the same witness in John: "On the first day of the week cometh Mary Magdalene to the sepulchre, while it was still dark, and seeth the stone taken away from the sepulchre." And Matthew too, although he had said, "late on the Sabbath," adds, "As it began to dawn on the first day of the week, came Mary Magdalene, and the other Mary to see the sepulchre, and behold there was a great earthquake. For the Angel of the Lord descended from heaven and came and rolled away the stone from the door of the sepulchre." I have necessarily given these quotations to shew the meaning of the "succour at dawn "predicted in the Psalm. For since it tells of our Saviour's Passion, and since the dispensation concerning Him was in no way hindered by the Passion, and the end of the Passion was His Resurrection from the dead and "the succour at dawn," the oracle crowns its description with the final miracle, as if the whole account and the sufferings before the end were incidental to the Resurrection from the dead, and the succour at dawn. For our Lord and Saviour said, "My God, my God, give ear to me, why hast thou forsaken me? "And then added, "I am a worm and no man, a reproach of men, and the outcast of the people"; and in addition to this, "Many oxen have encircled me, fat bulls have hemmed me in"; and gave a clear prediction of His Death in the verse, "Thou hast brought me into the dust of death, for many dogs have surrounded me, the council of the wicked has hemmed me in, they pierced my hands and my feet;" and He gave still further details of His Passion in the words, "They parted my garments among them, and upon my vesture did they cast lots." And having given those and similar predictions He did not cease there, but added: "Ye that fear the Lord praise him, for he hath not despised, nor been angered at the prayer of the poor, nor turned his face from him, but when I cried unto him he heard me." How could He claim to have been heard, unless He had had a complete answer to the prayers which He had just uttered, when He said, "Thou hast brought me into the dust of death. Save my soul from the sword, and my only-begotten from the power of the dog"? Nay, having prayed thus, and asked that He might be rescued and saved from these enemies, He adds, '' He hath not despised, nor been angry at the prayer of the poor, nor turned away his face from him: but when I cried unto him, he heard me." He evidently means His Return to life after death, which came to pass through the Succour at dawn, which the Psalm goes on to shew, saying, "But thou, O Lord, do not remove thy help, come to my succour." And it is this succour that is referred to by the Inscription of the Psalm.

So much about the Inscription of the Psalm.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"

[[commentary]]
quote='''
Let us now sound the deeper studies of the Hebrews on the words, "Eli, Eli, lama sabachthani," which were said by. our Saviour in the hour of His Passion in the actual Hebrew words, and which are enshrined in the Psalm. Now Eloeim is a name for God. And you will find it throughout nearly all the Scriptures: and even now in the Septuagint He is called properly by the Hebrew name. Though of course the Hebrews had other expressions for the divine Name----such as Saddai, Jao, El, and the like.

This Psalm then uses "Eli, Eli, Eli, lama sabachthani," as our Lord Himself does, and not Eloeim. And so Aquila, aware of the distinct meaning of God's Hebrew name of Eloeim, did not, like the other translators, think good to render them "My God, my God"----but "My strong one, my strong one," or more accurately, "My strength, my strength." So that taking this sense the Lamb of God our Saviour, when he said, "Eli, Eli," to His Father, meant, "My strong one, my strong one, why hast thou forsaken me?" And maybe He was crucified, because His Strong One had left Him, as the apostle says, "For he was crucified in weakness, but he liveth by the power of God," implying that He would not have been crucified, unless His Strong One had left Him. And surely it befits the Lamb of God, Who was led as a sheep to the slaughter, and as a lamb before its shearers is dumb, to attribute His own powers to God, and to reckon He had nothing of His own except His Father: wherefore He calls His Father His Strength, just as in Psalm xviii. He gives Him the names of Strength and Refuge, saying:

"I will love thee, O Lord, my strength. The Lord is my foundation, and my refuge, and saviour. My God, my helper, and I will trust in him; my protector, the horn also of my refuge, and my succour.

His Strong One forsook Him then, because He wished Him to go unto death, even "the death of the cross," and to be set forth as the ransom and sacrifice for the whole world, and to be the purification of the life of them that believe in Him. And He, since he understood at once His Father's Divine counsel, and because He discerned better than any other why He was forsaken by the Father, humbled Himself even more, and embraced death for us with all willingness, and "became a curse for us," holy and all-blessed though He was, and "He that knew no sin, became sin, that we might become the righteousness of God in Him." Yea more----to wash away our sins He was crucified, suffering what we who were sinful should have suffered, as our sacrifice and ransom, so that we may well say with the prophet, He bears our sins, and is pained for us, and he was wounded for our sins, and bruised for our iniquities, so that by His stripes we might be healed, for the Lord hath given Him for our sins. So, as delivered up by the Father, as bruised, as bearing our sins, He was led as a sheep to the slaughter. With this the apostle agrees when he says, "Who spared not his own Son, but delivered him for us all." And it is to impel us to ask why the Father forsook Him, that He says, "Why hast thou forsaken me? "The answer is, to ransom the whole human race, buying them with His precious Blood from their former slavery to their invisible tyrants, the unclean daemons, and the rulers and spirits of evil.

And the Father forsook Him for another reason, namely, that the love of Christ Himself for men might be set forth. For no one had power over His life, but He gave it willingly for men, as He teaches us Himself in the words, "No one taketh my life from me: I have power to lay it down, and I have power to take it again."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"

[[commentary]]
quote='''
After this He says, "Far from my salvation are the words of my sins." Instead of which Aquila translates, "Far from my salvation are the words of my complaint"; and Symmachus, "The words of my lamentations are removed from my salvation." And in yet a fifth translation it is rendered, "Far from my salvation are the words of my requests." It I is to be especially remarked that in neither of these translations does the expression "of my sins "appear, as it sometimes happens that similar alterations are made in a text by the error of a copyist. And we must accept the version given by the majority of the translators, unless we can understand Him to mean that the sins are ours, but that He has made them His own.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"

[[commentary]]
quote='''
He then in His Passion prays such a prayer to His Father, and says:

"Many hostile forces will surround Me, unclean daemons, and spirits of wickedness, and above all the prince of this world himself the vilest of them all, who because of their wickedness may well be called after evil beasts, be it savage bulls, or calves, or lions, or dogs. And as I essay to withstand them all, but to do them no good, because from the intense evil of their nature they are incapable of receiving good from Me, with none of them for My helper or fellow-worker in My contest on behalf of the souls in Hades, am I not right in saying, 'Trouble is near, and there is no helper'?"

Of course it was not to be expected that any of the evil and hostile powers would have worked with Him, or aided Him in His mission of good. But surely the bitterest element in the cup of pain that was His, was that none of the good and favouring angels, and none of the divine powers, dared to venture to the halls of Death and help Him in succouring the souls there. For in Him alone was there courage, since to Him only were the gates of death opened, Him only the janitors of Hades saw and feared, and He that has the power of death, descending from His royal throne, as recognizing Him only for His Lord, spoke gently to Him with prayer and supplication, as Job relates. Yet He, seeing the impious realm of the tyrant so strong that no heavenly being dared to accompany Him to that bourne, or to help Him in saving the souls there, cries naturally, "Trouble is near, and there is no helper," since the only Being from heaven who could have helped Him had forsaken Him, so that the glory and independence of His own choice and of His own victory might be proclaimed to all. And since the only Being that could help Him was not then His helper, it is natural that His first words should be, "Eli, Eli, lama sabachthani?" that is, "My God, My God, why hast thou forsaken me?" For when He was conceived, and when He was brought forth by the Holy Virgin His Father's power was with Him, when the Holy Spirit came upon the maiden, and the Power of the Highest overshadowed her, and the Father Himself, as the oracle shews, drew forth Him that was begotten from her womb. But when in the hour of His Passion He entered on His struggle with Death, the Helper was no longer with Him. Yea, I believe His own witness of this. For the words, "Eli, Eli, lama sabachthani?" which He spoke on the Cross, and which were prophetically foretold in the Psalm, what else do they mean but that like a great athlete He was matched against all these adversaries, while Almighty God ordered the contest and gave the decision? Thus He summons His Father as the overseer of what is being done, and as the adviser, like a clever Anointer, to come to Him, especially as He has no other helper, but only Him that governs the contest. And so He says in prayer, "Be not thou far from me, for trouble is near, and there is no helper."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
