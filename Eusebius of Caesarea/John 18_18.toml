[[commentary]]
quote='''
And the mention of the wintry season is astonishing indeed in the words of the prophecy, which say, "There shall be frost and cold"; for this is supported by the evidence of the Gospel, which tells how Peter following Jesus warmed himself in the Hall of Caiaphas with the others, where a fire was kindled. John actually mentions the cold, saying, "The servants and attendants stood round, having made a fire of coals, for it was cold, and they warmed themselves." The prophecy was thus literally fulfilled.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 7"
