[[commentary]]
quote='''
And quite necessarily the prophet prefaces Christ's Birth of a Virgin by an exhortation to attention, crying aloud to his hearers, "If ye will not believe, neither shall ye understand."

And then he adds the following words:

"10. And the Lord added to speak unto Ahaz saying, 11. Ask for thyself a sign from the Lord thy God in the depth or in the height. 12. And Ahaz said, I will not ask, neither will I tempt God. 13. And he said, Hear now, house of David; is it a small thing to you to strive with man, and how do ye strive with the Lord? 14. Therefore the Lord shall give you a sign: Behold a virgin shall conceive, and bear a son, and thou shalt call his name Emmanuel: 15. Butter and honey shall he eat, before he knows to choose the good and refuse the evil. 16. Wherefore before the child know good or evil, he does not obey wickedness, that he should choose the good. And the earth shall be forsaken, on account of that which thou fearest, of her two kings."

Such is the prophecy. But the opening of the prophecy is worthy of our study, which bears witness to those that read it, "If ye do not believe, neither will ye understand." And it is above all necessary to note that the words shew that its readers need not only intellect but faith, and not only faith but intellect. Hence the Jews who do not believe in Christ, though they are even now hearers of these words, have not even yet understood Him of Whom the prophecy was given, so that in their case the prediction has its primary fulfilment. For though they hear daily with their ears the prophecies about Christ, they hear them not with the ears of their mind. And the sole cause of their ignorance is unbelief, as the prophecy truly reveals of them and to them. For it says, "If ye will not believe, neither shall ye understand."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
