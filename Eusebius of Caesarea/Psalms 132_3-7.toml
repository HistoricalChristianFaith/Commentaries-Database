[[commentary]]
quote='''
"11. The Lord sware to David the truth, and he will never set him at naught, | of the fruit of thy body I will set upon thy seat."

And lower down,

"17. There will I lift up the horn of David, | I have prepared a lantern for my Christ: | 18. As for his enemies I will clothe them with shame, j but upon himself shall blossom my holiness. | "

Now here the Lord swears about one of the seed of David, Whom He calls His seed and horn. And again addressing Christ by name, He says that He has prepared a lantern for Him, which seems to refer to the prophetic word, which shewed the coming of Christ before, Who alone, like the light of the sun, has now risen on all men through the whole world. And David Himself was prepared as a lantern for the Christ, taking the place of a lantern in comparison with the perfect light of the sun. And then He says: "I will lift up the horn," shewing the place where He means Christ to be born. For when David is praying that he may behold before in spirit the place of Christ's birth, and saying:

"3. I will not go into the tabernacle of my house, | I will not climb to the couch of my bed. | 4. I will not give sleep to my eyes, nor slumber to my eyelids, | nor rest to my temples, | 5. until I find a place for the Lord, a tabernacle for the God of Jacob. |"

—the Holy Spirit reveals the place as Bethlehem. Therefore he proceeds:

"6. Behold we heard of it in Ephratha | (that is, Bethlehem), and we found it in the fields of the wood. | 7. We will go into his tabernacle, we will worship in the place, where his feet stood. | "

And suitably after this revelation He adds:

"There will I lift up the horn of David, I have prepared a lantern for my Christ."

Maybe also the Body assumed by Christ at Bethlehem may be meant, since the Divine Power inhabiting it through His body as through an earthen vessel, like a lamp, shot forth to all men the rays of the Divine Light of the Word.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
