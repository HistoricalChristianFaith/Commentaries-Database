[[commentary]]
quote='''
WHEREFORE we must recognize with awe throughout the whole of the sphere of creation generally one divine Power, and not suppose there to be many. For the general creative Power is One, and One is the Word, Creator of the Universe, in the beginning with God: Whom it truly behoves us not to ignore, but to worship and honour worthily, because not only at the beginning of the Creation did all things exist through Him, but since then for ever and now as well, and without Him nothing was made. For if there is life in things that exist, that life was what was begotten in Him. (For from Him and through Him is the life-power and the soul-power of all things.) Be it rhythm, beauty, harmony, order, blending of qualities, substance, quality, quantity, the one Word of the Universe holds all in union and order, and One Creative power of God is at the Head of all.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 5"
