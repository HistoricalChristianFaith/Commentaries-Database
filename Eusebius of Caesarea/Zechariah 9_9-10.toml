[[commentary]]
quote='''
So prophesied Zechariah after the Return from Babylon, in the reign of Darius, King of Persia, when Jerusalem was but just arisen from the desolation which it suffered under the Babylonians. And the whole period from Darius the Persian, in whose time Zechariah prophesied, even to Augustus, Emperor of Rome, amounts to the seven and sixty-two weeks of years in Daniel, which are equivalent to 483 years, as I have shewn in my recent investigations. And neither in the time of the Macedonians from Alexander onwards, not even if you include the reign of Augustus, was anything similar to the words of the prophet fulfilled. For when in those days did the Lord, Whom the prophet speaks of as divine, come among men, and many nations know Him, and confess Him to the only God, and take refuge in Him, and be to Him a people? Or when in the times of the Macedonians or Persians did the king who was foretold come, sitting upon an ass and a young colt? When did He come and utterly destroy the royal array of the Jewish nation, here called Ephraim, and of Jerusalem itself, called chariots and horses, and conquer the army of the Jews? For this is what the oracle revealed, saying:

"Behold thy king cometh to thee, righteous and a saviour, himself meek, and sitting upon an ass and a young colt, and he shall utterly destroy the warlike bow."

For so it was prophesied concerning the destruction of the royal glory of the Jewish nation, at the same time, as, on the other hand, the prophecy of peace for the Gentiles was repeated in agreement with those previously quoted, namely, "And abundance of peace shall be from the Gentiles." In place of which Aquila and the other translators render, "And he shall speak peace to the Gentiles," which stands specially and literally fulfilled from the reign of Augustus, since from that date varieties of government ceased, and peace enwrapped most of the nations of the world. And before the Roman days under Persians or Macedonians what King of the Jews was there, who "ruled from sea to sea, and from the rivers to the ends of the earth?" And so the other translators have shewn. Therefore Aquila says:

"And he shall speak peace to the Gentiles, and his power shall be from sea to to sea, and from the river to the ends of the world."

With this agrees the passage in the 101st Psalm concerning the Christ that is to be born of the seed of Solomon:

"In his days righteousness shall arise, and abundance of peace, so long as the moon endureth, and he shall rule from sea to sea, and from the river to the ends of the world."

For these words about the son of Solomon are as exalted as those in the prophet. When, then, this took place and in what way, and in what period, let him that can, inform me.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 4"

[[commentary]]
quote='''
[Passage quoted, Zech. ix. 9, 10]

As Zechariah prophesied thus after the Return from Babylon towards the conclusion of prophecy, there is no record of a Jewish king, such as the prophecy predicts, except our Lord and Saviour Jesus Christ, in Whom this prediction was fulfilled, when He literally said to His disciples:

"Go ye into the village over against you, and ye shall find an ass tied and a colt with her; loose them and bring them unto me. And if any man say, What do ye? ye shall say to him, The Lord hath need of them. And they went and did as he commanded them."

Such, then, was the prophecy and such the fulfilment. But what was His riding on an ass meant to shew forth but the lowly and humble manner which marked His first Coming? For the second Coming shall be glorious, that of which Daniel speaks unfolding and revealing his vision:

"9. I saw until the thrones were set, and the Ancient of Days did sit. Thousand thousands ministered to him, and ten thousand times ten thousand stood before him. 13. And, behold, one as a son of man coming with the clouds of heaven. And he came even to the Ancient of Days, 14. and there was given to him rule and honour and a kingdom, and all peoples, tribes, and tongues serve him. His power is an everlasting power, which shall not pass away, and his kingdom shall not be destroyed."

But the first Coming of His Incarnation and humiliation has this great symbol and sign among others, the prophecy that He should be called meek and gentle, and that He should come sitting upon an ass. For this is a proof of His sharing our humanity. Whereas the glory of His second divine Coming is shewn by His being borne on the clouds of heaven, and His eternal rule over all nations. And it is reasonable to quote them both to the Jews, and to ask them to explain how they can save the credit of the prophecies, if they confine them to a reference to a single Coming of Christ: for if they both refer to Christ, as they agree, they are bound to tell us when we ask them, how it is possible for the same person at the same coming to be borne upon the clouds of heaven, and also to ride on an ass and a young colt: for these two things are very different. And if you collect the many similar prophecies concerning Christ, and compare their differences side by side, you will decide that some of them refer to His first Coming, being fulfilled at His first Epiphany, while others apply to His second Coming in glory.

For He utterly destroyed by His Divine Power the chariots and horses and weapons of war at His first Coming from the material Jerusalem and the people of Ephraim: wherefore from that day to this their kingdom has never existed, nor their ancient powerful military array or warlike power. And all the Jewish people are here well called Ephraim, not Israel or Judah, so as not to bring into dishonour names of more dignity. And you will find that other prophets call the whole people Ephraim, when charging and accusing them of great crimes, as here. For after the return from Babylon, when the former division of the people had ceased, who are more likely to be meant by Ephraim than the actual inhabitants of Jerusalem? And it was their warlike and military power, that had lasted until Roman times, that our Saviour's Coming destroyed with divine secret power, as the prophecy foretold.

The oracle also calls here on the Church of the Gentiles, not simply to rejoice, But to rejoice greatly, in its message of good news, because of the coming of the Word of God to her; and it calls her the daughter of the heavenly Zion and of the former congregation, because all we that are Gentiles, who believe in Christ, are the offspring and children of Christ and His Apostles, as they whose mother is the Jewish synagogue: and that which follows was also fulfilled at our Saviour's Coming. For unexampled peace has filled all nations from the time of His coming: no longer do states war with states as before, nor nations contend with nations, nor is human life as of old in a state of constant disturbance; Athenians do not attack Lacedaemonians, Syrians Phoenicians, Arabians the inhabitants of Palestine, nor the Egyptians their neighbours. All have been united from that time by God's help, and it is true that there has been "abundance of peace" among the nations from that day to this, according to the prophecy. Jesus alone, and the word of Gospel teaching preached by Him, have ruled men from sea to sea, from the east to the setting sun. and from the rivers to the bounds of the earth, as the prophecy foretold.

Aquila's rendering of this is as follows:

"He shall speak peace among the nations, and his power shall be from sea to sea, and from the rivers to the ends of the earth."

Compare with this what occurs in the Psalm, inscribed "To Solomon, of the King's Son," that is to say, of Him that will spring from Solomon's seed, of Whom the Psalm says, "And he shall rule from sea to sea, and from the rivers to the ends of the world." And the same Psalm refers to the peace here described, when it says, "In his days righteousness shall arise, and abundance of peace." Isaiah, too, agrees with this when he says, "And they shall beat their swords into ploughshares, and their lances into pruning-hooks; nation shall not take up sword against nation, and they shall not learn war any more." You will find Micah in agreement with this, and many other prophets. And if you note, as I said, the dates, you will be able to appreciate that from the time of Augustus, and of the Epiphany of our Saviour that shone forth in his day, during the period of the Roman Empire the old dissensions and varieties of national government have ceased, and thus from that date the peace of the prophecy began. Just as it then began, a day will come when the prophecy will be fulfilled in all its fullness, when, as the apostle says, "the fullness of the Gentiles shall come in."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 17"
