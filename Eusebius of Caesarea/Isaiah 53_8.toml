[[commentary]]
quote='''
But with regard to these questions, let men decide them as they will. It is enough for me to repeat again that true and blessed saying, and so conclude my quest, the saying which I have often repeated: "Who shall describe His generation? "For of a truth the generation of the Only-begotten of God is seen to be beyond the reach not only of men, but of the powers that are beyond every being, as also our Lord and Saviour Himself says in mystic language this very thing to His own disciples. "No one knows the Father save the Son." To which he adds "and no one knows the Son save the Father."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 1"
[[commentary]]
quote='''
No language is sufficient to express the origin and the worth, the being and the nature of Christ. Wherefore also the divine Spirit says in the prophecies, "Who shall declare his generation?" For none knoweth the Father except the Son, neither can any one know the Son adequately except the Father alone who hath begotten him.

For who beside the Father could clearly understand the Light which was before the world, the intellectual and essential Wisdom which existed before the ages, the living Word which was in the beginning with the Father and which was God, the first and only begotten of God which was before every creature and creation visible and invisible, the commander-in-chief of the rational and immortal host of heaven, the messenger of the great counsel, the executor of the Father's unspoken will, the creator, with the Father, of all things, the second cause of the universe after the Father, the true and only-begotten Son of God, the Lord and God and King of all created things, the one who has received dominion and power, with divinity itself, and with might and honor from the Father; as it is said in regard to him in the mystical passages of Scripture which speak of his divinity: "In the beginning was the Word, and the Word was with God, and the Word was God." "All things were made by him; and without him was not anything made."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25201.html"
source_title="Church History, Book 1, Chapter 2"
