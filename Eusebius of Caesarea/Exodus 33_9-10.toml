[[commentary]]
quote='''
[Passages quoted, Exod. xix. 9; xxxiii. 9; Num.xii. 5.]

The people then beheld the pillar of cloud, and it spoke to Moses. But who was the speaker? Obviously the pillar of cloud, which before appeared to the fathers in a human form. And I have already shewn that this was not the Almighty God, but another Being Whom we name, as the Word of God, the Christ Who was seen for the sake of the multitude of Moses and the people in a pillar of cloud, because it was not possible for them to see Him like their fathers in human shape. For, surely, it was reserved for the Perfect to be able to see beforehand His future Incarnate appearance among men, and since it was impossible then for the whole people to bear it, He was seen now in fire in order to inspire fear and wonder, and now in a cloud, as it were in a shadowy and veiled form ruling them, as He was also seen, by Moses for their sake.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 14"
