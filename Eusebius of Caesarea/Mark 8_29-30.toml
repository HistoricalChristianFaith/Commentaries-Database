[[commentary]]
quote='''
Neither did Peter permit himself to write a Gospel through his excessive reverence. Mark, being his friend and companion, is said to have recorded the accounts of Peter about the acts of Jesus, and when he comes to that part of the story where Jesus asked whom men said that He was, and what opinion His disciples had of Him, and Peter had replied that they regarded Him as (the) Christ, he writes that Jesus answered nothing, and said naught to him, except that He charged them to say nothing to any one about Him.

For Mark was not present when Jesus spoke those words; and Peter did not think it right to bring forward on his own testimony what was said to him and concerning him by Jesus. But Matthew tells us what was actually said to him, in these words:

"15. But whom say ye that I am? 16. And Simon Peter answered and said, Thou art the Christ, the Son of the living God. 17. And Jesus answered and said unto him, Blessed art thou, Simon bar-Jonah: for flesh and blood have not revealed it unto thee, but my Father which is in heaven. 18. And I also say unto thee. That thou art Peter, and upon this rock I will build my Church; and the gates of hell shall not prevail against it. 19. And I will give unto thee the keys of the Kingdom of Heaven: and whatsoever things thou shalt bind on earth shall be bound in heaven: and whatsoever things thou shalt loose on earth shall be loosed in heaven."

Though all this was said to Peter by Jesus, Mark does not record it, because, most likely, Peter did not include it in his teaching—see what he says in answer to Jesus' question: "Peter answered and said, Thou art the Christ. And he straitly charged them that they should tell no man." About this event Peter for good reasons thought it best to keep silence. And so Mark also omitted it, though he made known to all men Peter's denial, and how he wept about it bitterly.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 5"
