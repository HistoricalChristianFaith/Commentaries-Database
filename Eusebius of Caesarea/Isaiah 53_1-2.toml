[[commentary]]
quote='''
And the miracle of His birth Isaiah teaches sometimes mysteriously, and sometimes more plainly: mysteriously, when he says:

"Lord, who hath believed our report? And the arm of the Lord to whom hath it been revealed? we proclaimed him before as a child, as a root in a thirsty soil."

Instead of which Aquila interpreted thus: "And he shall be proclaimed as a suckling before his face, and as a root from an untrodden ground." And Theodotion: "And he shall go up as a suckling before him, and as a root in a thirsty land."

For in this passage, the prophet having mentioned "the Arm of the Lord," which was the Word of God, says: "In his sight we have proclaimed (him) as a sucking child, and one nurtured at the breast, and as a root from untrodden ground." The child that is "a suckling and nurtured at the breast" exactly therefore shews forth the birth of Christ, and "the thirsty and untrodden land" the Virgin that bare Him, whom no man had known, from whom albeit untrodden sprang up "the blessed root," and "the sucking child that was nurtured by the breast." But this prophecy was darkly and obscurely given: the same prophet explains his meaning more plainly, when he says: "Behold a Virgin shall be with child, and shall bring forth a son, and they shall call his name God with us," for Emmanuel signifies this.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"
