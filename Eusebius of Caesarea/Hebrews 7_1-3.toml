[[commentary]]
quote='''
But he that is named Melchizedek, which in Greek is translated "king of righteousness," who was king of Salem, which would mean "king of peace," without father, without mother, without line of descent, not having, according to the account, "beginning of years, nor end of life," had no characteristics shared by the Aaronic priesthood. For he was not chosen by men, he was not anointed with prepared oil, he was not of the tribe of those who had not yet been born; and strangest of all, he was not even circumcised in his flesh, and yet he blesses Abraham, as if he were far better than he; he did not act as priest to the Most High God with sacrifices and libations, nor did he minister at the Temple in Jerusalem. How could he? it did not yet exist. And he was such of course because there was going to be no similarity between our Saviour Christ and Aaron, for He was neither to be designated priest after a period when He was not priest, nor was He to become priest, but be it. For we should notice carefully in the words, "Thou art a priest for ever," He does not say, "Thou shalt be what thou wert not before," any more than, "Thou wert that before, which thou art not now"—but by Him Who said, "I am that I am," it is said, "Thou art, and remainest, a priest for ever."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 3"
