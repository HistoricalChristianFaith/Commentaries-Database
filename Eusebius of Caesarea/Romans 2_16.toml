[[commentary]]
quote='''
And they say that Paul meant to refer to Luke's Gospel wherever, as if speaking of some gospel of his own, he used the words, "according to my Gospel."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25203.html"
source_title="Church History, Book 3, Chapter 4"
