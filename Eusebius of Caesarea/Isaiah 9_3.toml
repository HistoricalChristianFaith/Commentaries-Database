[[commentary]]
quote='''
It says, too, that the spring of their joy will be the shining of a great light, for them who before His Coming sat continually in darkness and the shadow of death. But that when the light of salvation has sprung up, they will rejoice as men rejoice in harvest, and as they who divide the spoils. And this was actually fulfilled, when our Lord and Saviour, calling His Apostles from Galilee, shewed forth to them His miracles and His teaching. The prophecy says that they will rejoice before Him, "as men rejoice in harvest." In what harvest, I ask, but that of which He spake in His teaching, "Lift up your eyes and behold the lands, that they are already white unto harvest"? By this He meant the gathering in of the Gentiles: of whom it is also said, "They shall rejoice, as they who divide the spoils." Therefore the disciples and evangelists of our Saviour, dividing between them the lands of the nations, and all the earth under heaven, despoiled the countless princes of this world, who were before rulers of the nations.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 8"
