[[commentary]]
quote='''
And He proceeds: "The poor shall eat and be satisfied, and they that seek the Lord shall praise him----their heart shall live for ever. All the ends of the earth shall remember and shall turn to the Lord, and all the kindreds of the nations shall worship before him. For the Kingdom is the Lord's, and he rules over the nations."

In these words He very aptly proclaims the glorious works after His Resurrection, which are fulfilled in the calling of men from all nations, and by the election of men from the ends of the earth, the results of which being visible to all eyes afford evidence of the truth of the words of the Psalm. And we, too, are the poor, whom like beggars in the things of God, the word of salvation nourishes with spiritual bread, the life-giving food of the soul, and affords eternal life. So the Psalm says: "The poor shall eat and be satisfied, and they that seek the Lord shall praise him, their heart shall live for ever."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
