[[commentary]]
quote='''
And when He has thus shewn His Resurrection, He again returns to His Father, and says: "From thee is my praise in the great Church," remembering the great Church of all nations established throughout all the world, in which the Saviour's praise is for ever sung, by the will and co-operation of His Father. So He says: "From thee is my praise in the great Church." For of a truth it is great, this Church, gathered of every race of mankind, and above all comparison in gravity and nobility of life, and majesty of belief, while the Jewish nation, and the synagogue of the Circumcision, is so attenuated in the poverty of its teaching, and life, and thought, and conceptions of God.

Then He adds: "I will pay my vows in the sight of all that fear him," meaning by "all that fear him," the aforesaid great Church, to which He said: "Ye that fear the Lord, praise him." And what vows does He mean that He will pay, but those which He promised? And what did He promise, but those, of which He said: "I will tell thy Name to my brethren. In the midst of the Church I will praise thee? "
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
