[[commentary]]
quote='''
[Passage quoted, Zeph. iii. 9.]

And in this passage the Lord promised that there will be left for Him a people meek and lowly, meaning none others but they of the Circumcision who believed in His Christ. And He again proclaimed that only the remnant of Israel should be saved, with those called from the other nations, as He shewed in the beginning of the prophecy.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
