[[commentary]]
quote='''
Since in accordance with thy wishes, my most holy Paulinus, we have added the tenth book of the Church History to those which have preceded, we will inscribe it to thee, proclaiming thee as the seal of the whole work; and we will fitly add in a perfect number the perfect panegyric upon the restoration of the churches, obeying the Divine Spirit which exhorts us in the following words:

"Sing unto the Lord a new song, for he hath done marvelous things. His right hand and his holy arm hath saved him. The Lord hath made known his salvation, his righteousness hath he revealed in the presence of the nations."

And in accordance with the utterance which commands us to sing the new song, let us proceed to show that, after those terrible and gloomy spectacles which we have described, we are now permitted to see and celebrate such things as many truly righteous men and martyrs of God before us desired to see upon earth and did not see, and to hear and did not hear.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%252010.html"
source_title="Church History, Book 10, Chapter 1"
