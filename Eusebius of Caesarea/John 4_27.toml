[[commentary]]
quote='''
And on one occasion when they saw Him conversing with a woman of Samaria when it was the only possible way to aid and save many, they wondered that He spoke with the woman, thinking they saw something marvellous, such as they had never before seen.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 6"
