
[[commentary]]
quote='''
And moreover He too, the Man who came from Israel, Who ruleth many nations, having lain down, "rested as a lion," he says, plainly indicating the dispensation He had accepted, according to which like a kingly and terrible wild beast He rested, for none were able to remove His rule and His Kingdom, and all who blessed the Christ, glorifying the greatness of their teaching by word and deed, received in return the blessing of God, increasing and multiplying daily, according to the divine commandment, "Increase and multiply and replenish the earth," which in them is fulfilled more truly and divinely. While in contrast to them, they who since their original plot against Him even until now curse Him in their synagogues, have drawn down the curse of God on their heads from that day to this. Wherefore they do not cease to behold the utter desolation and destruction of their kingdom and of their Temple of old so venerable.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 3"
