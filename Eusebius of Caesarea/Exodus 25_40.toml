[[commentary]]
quote='''
And the prophet, well understanding this, had none of these ideas that have been suggested about unguents or incense, but presented the images of greater and divine things, so far as he could, in an outward way to those who could learn the divine in that way only and no other. And that is exactly what the divine oracle is reported to have expressed, when it said: "See thou make (all) things according to the type shewn in the Mount.": Therefore, when completing the symbols of the other things, which it is usual to call types, it appointed the anointing with the unguent. The account of it loftily and mysteriously expressed as it is, so far as I can explain it, had this meaning, that the only good and only truly sweet and noble, the cause of all life, and the gift bestowed on all in their being and their well-being, that this One Being was believed by the Hebrew reason to be the first cause of all, and Itself the highest and the All-Ruling and the All-Creating God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 15"

[[commentary]]
quote='''
This Being, then, it was that Moses had seen by the help of the Divine Spirit, when he established figures and symbols of Him, as suitable for men, anointing and hallowing the priest selected from among men with prepared unguents as yet, and not with the Holy Spirit, and calling him Christ and anointed, as a representation of the true. And who could give better evidence of this than Moses himself? In his own writings he distinctly says that the God and Lord Who answered him bade him establish a more material worship on earth according to the spiritual and heavenly vision that had been shewn him, which should form an image of the spiritual and immaterial worship. And so he is said to have sketched a kind of copy of the order of the angels of heaven and the powers divine, since the oracle said to him, "Thou shalt make all things according to the pattern shewed thee in the Mount." So then he introduces the High Priest, as he did all the other elements, and anointed him with earth-born unguents, working out a Christ and a High Priest of shadow and symbol, a copy of the Heavenly Christ and High Priest.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 15"

[[commentary]]
quote='''
With all this we should again compare the records of Moses, who when he established his own brother as High Priest, according to the pattern that had been shewn to him, agreeably to the oracle which said to him: "Thou shalt make all things according to the pattern shewn to thee in the Mount," plainly shews that he had perceived with the eyes of the mind and by the Divine Spirit the great High Priest of the Universe, the true Christ of God, Whose image he represented together with the rest of the material and figurative worship, and honoured the person named with the name of the real Christ.

And this has the support of the inspired apostle, who says when treating of the law of Moses: "Who serve under the example and shadow of heavenly things." And again: "For the law having a shadow of good things to come." And again: "16. Let no man, therefore, judge you in meat or in drink, or in respect of a holy day, or of the new moon, or of the Sabbath days, 17. which are a shadow of things to come." For if the enactments relating to the difference of foods, and the holy days and the Sabbath, like shadowy things, preserved a copy of other things, that were mystically true, you will say not without reason that the High Priest also represented the symbol of another High Priest, and that he was called Christ, as the pattern of that other, the only real Christ: and so far was he from being the real one, that the real Christ hears from the Supreme God: "Sit thou on my right hand, until I make thine enemies the footstool of thy feet." And: "Be thou ruler in the midst of thine enemies." And: "The Lord sware, and will not repent. Thou art a priest for ever after the order of Melchizedek." By which He was revealed clearly as eternal Priest, existing as Offspring and Son of God before the Morning Star and before the whole creation. And the Christ of Moses, like one who has acted the character in a drama for a short time, retires as one reckoned among mortals, and hands on the reality to the only true and real. While the real Christ needing not the Mosaic unction, nor prepared oil, nor earthly material, yet has filled the world with His goodness and His name, establishing the race of Christians, named after Him, among all nations. But Moses' Christ, not that he was ever plainly so called among men, except through the writings of Moses—he, I say, some time long after the Exodus from Egypt purified with certain lustrations and sacrifices of blood was anointed with prepared oil, Moses anointing him. But the Christ, archetypal, and real from the beginning, and for infinite ages whole through the whole, and Himself ever like Himself in all ways, and changing not at all, was ever anointed by the Supreme God, with His unbegotten Divinity, both before His sojourn among men, and after it likewise, not by man or by any material substance existing among men.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
