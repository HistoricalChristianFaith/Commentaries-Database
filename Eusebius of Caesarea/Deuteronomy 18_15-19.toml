[[commentary]]
quote='''
And agreeably to this Moses himself for this very reason said that another prophet would be raised up "like unto him"; and publishes the good news that he should be a lawgiver for all the nations. He speaks of Christ in a riddle. He orders his followers to obey him in these prophetic words.

"15. A prophet shall the Lord your God raise up to you from your brethren, like unto me, ye shall hear him [whatsoever he saith unto you]. 19. And it shall be that every soul who will not hear that prophet shall be cast out of its race."

And that this prophet, who is clearly the Christ, should come forth from the Jews and rule all nations, he proclaims again when he says:

"5. How fair are thy dwellings, O Jacob, and thy tents, O Israel, 6. as shady groves, and as a garden by a river, and as tents which God pitched. 7. There shall come a man out of his seed, and he shall rule over many nations, and his kingdom shall be exalted."

He makes it clear from which tribe of all the twelve that comprised the Hebrew race, namely the tribe of Judah, Christ the Lawgiver of the Gentiles according to the prophecy should arise. He is clear as to the date, for it would be after the cessation of the Jewish monarchy which had been handed down from their forefathers.

"A ruler shall not fail from Juda, nor a prince from his loins, until there come the things stored up for him; and he is the expectation of the nations."

What "expectation" could this be, but that expressed in the promise to Abraham that in him all the families of the earth should be blessed? Moses has, therefore, made it quite plain from his own words that he was quite well aware of the failure of the law he had laid down to apply to all nations, and that another prophet would be necessary for the fulfilment of the oracles given to Abraham. And this was He, of Whom his prophecy proclaimed the good news that one should arise from the tribe of Judah and rule all nations.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 3"

[[commentary]]
quote='''
MOSES was the first of the prophets to tell the good news that another prophet like unto himself would arise. For since his legislation was only applicable to the Jewish race, and only to that part of it resident in the land of Judaea or its neighbourhood, and not to those living far away abroad (as has been seen in my previous book); and as it was surely necessary that He Who was not only the God of the Jews, but also of the Gentiles, should provide helpful means for all the Gentiles to know Him and to become holy in their lives, He makes known by the oracle accordingly that another prophet will arise from the Jewish race, no whit inferior to His own dispensation. And God Himself names him in this manner:

"A prophet will I raise up to them from their brethren like unto thee, and I will put my word in his mouth, and he shall speak to them according to what I command him. And whatsoever man shall not hear that prophet['s words], whatsoever he shall speak in my name, I will take vengeance on him."

And Moses speaks similar words when interpreting the oracle of God to the people:

"A prophet shall the Lord thy God raise up of your brethren like unto me. Him shall ye hear according to all things that ye asked of the Lord God in Horeb in the day of the assembly."

Was then any of the prophets after Moses, Isaiah, say, or Jeremiah, or Ezekiel, or Daniel, or any of the twelve, like Moses in being a lawgiver? Not one. Did any of them behave like Moses? One cannot affirm it. For each of them from the first to the last referred their hearers to Moses, and based their rebukes of the people on their breaches of the Mosaic law, and did nothing but exhort them to hold fast to the Mosaic enactments. You could not say that any of them was like him: and yet Moses speaks definitely of one who should be. Whom then does the oracle prophesy will be a prophet like unto Moses, but our Lord and Saviour Jesus Christ, and none other?

We must consider thoroughly why this was said. Moses was the first leader of the Jewish race. He found them attached to the deceitful polytheism of Egypt, and was the first to turn them from it, by enacting the severest punishment for idolatry. He was the first also to publish the theology of the one God, bidding them worship only the Creator and Maker of all things. He was the first to draw up for the same hearers a scheme of religious life, and is acknowledged to have been the first and only lawgiver of their religious polity. But Jesus Christ too, like Moses, only on a grander stage, was the first to originate the teaching according to holiness for the other nations, and first accomplished the rout of the idolatry that embraced the whole world. He was the first to introduce to all men the knowledge and religion of the one Almighty God. And He is proved to be the first Author and Lawgiver of a new life and of a system adapted to the holy.

And with regard to the other teaching on the genesis of the world, and the immortality of the soul, and other doctrines of philosophy which Moses was the first to teach the Jewish race, Jesus Christ has been the first to publish them to the other nations by His disciples in a far diviner form. So that Moses may properly be called the first and only lawgiver of religion to the Jews, and Jesus Christ the same to all nations, according to the prophecy which says of Him:

"Set, O Lord, a lawgiver over them: that the Gentiles may know themselves to be but men."

Moses again by wonderful works and miracles authenticated the religion that he proclaimed: Christ likewise, using His recorded miracles to inspire faith in those who saw them, established the new discipline of the Gospel teaching. Moses again transferred the Jewish race from the bitterness of Egyptian slavery to freedom: while Jesus Christ summoned the whole human race to freedom from their impious Egyptian idolatry under evil daemons. Moses, too, promised a holy land and a holy life therein under a blessing to those who kept his laws: while Jesus Christ says likewise: "Blessed are the meek, for they shall inherit the earth," promising a far better land in truth, and a holy and godly, not the land of Judaea, which in no way excels the rest (of the earth), but the heavenly country which suits souls that love God, to those who follow out the life proclaimed by Him. And that He might make it plainer still, He proclaimed the kingdom of heaven to those blessed by Him. And you will find other works done by our Saviour with greater power than those of Moses, and yet resembling the works which Moses did. As, for example, Moses fasted forty days continuously, as Scripture witnesses, saying: "And (Moses) was there with the Lord forty days and forty nights; he did neither eat bread nor drink water." And Christ likewise: For it is written: "And he was led by the Spirit into the wilderness, being forty days tempted of the devil; and in those days he did eat nothing."

Moses again fed the people in the wilderness: for Scripture says: Behold, I give you bread from heaven." And after a little:

"It came to pass as the dew ceased round about the camp, and behold on the face of the wilderness a small thing, like white coriander seed, as frost upon the ground."

And our Lord and Saviour likewise says to His disciples:

" 8. O ye of little faith, why reason ye among yourselves, because ye have brought no bread? 9. Do ye not yet understand, neither remember the five loaves of the five thousand, and how many baskets ye took up? 10. Neither the seven loaves of the four thousand, and how many baskets ye took up?"

Moses again went through the midst of the sea, and led the people; for Scripture says:

"And Moses stretched forth his hand over the sea, and the Lord carried back the sea with a strong south wind all the night, and the water was divided. And the children of Israel passed through the midst of the sea on the dry land, and the water was a wall to them on the right and a wall on the left."

In the same way, only more divinely, Jesus the Christ of God walked on the sea, and caused Peter to walk on it. For it is written:

"25. And in the fourth watch of the night he went unto them, walking on the sea. 26. And when they saw him walking on the sea, they were troubled."

And shortly after:

"28. And Peter answered him and said, Lord, if it be thou, bid me come unto thee on the water. 29. And he said, Come. And when Peter was come down out of the ship, he walked on the water."

Moses again made the sea dry with a strong south wind. For Scripture says: "Moses stretched forth his hand over the sea, and the Lord drave back the sea with a strong south wind," and he adds: "The waves were congealed in the midst of the sea." In like manner, only much more grandly, our Saviour "rebuked the winds and the sea, and there was a great calm." Again when Moses descended from the Mount, his face was seen full of glory: for it is written:

"And Moses descending from the Mount did not know that the appearance of the skin of his face was glorified while He spake to him. And Aaron and all the elders [of the children] of Israel saw Moses, and the appearance of the skin of his face was glorified."

In the same way only more grandly our Saviour led His disciples "to a very high mountain, and he was transfigured before them, and his face did shine as the sun, and his garments were white like the light."

Again Moses cleansed a leper: for it is written: " And behold Miriam (was) leprous (as white) as snow."

And a little further on: "And Moses cried to the Lord: O God, I pray thee to heal her."

And in the same way, but with more superb power, the Christ of God, when a leper came to him, saying: "If thou wilt, thou canst make me clean; answered: I will; be thou clean. And his leprosy was cleansed."

Moses, again, said that the law was written with the finger of God: for it is written:

"And he gave to Moses, when he ceased speaking to him in Mount Sinai, the two tables of witness, stone tables written with the finger of God."

And in Exodus: "The magicians therefore said to Pharaoh, It is the finger of God."

In like manner Jesus, the Christ of God, said to the Pharisees: "If I by the finger of God cast out devils." Moreover, Moses changed the name of Nave to Jesus, and likewise the Saviour changed that of Simon to Peter. And Moses set up seventy men as leaders to the people. For Scripture says:

"16. Bring together to me seventy men of the elders of Israel, 17. and I will take of the spirit that is upon thee, and I will put it upon them. ... 24. And he brought together seventy men."

Likewise our Saviour "chose out His seventy disciples, and sent them two and two before his face." Moses again sent out twelve men to spy out the land, and likewise, only with far higher aims, our Saviour sent out twelve Apostles to visit all the Gentiles. Moses again legislates saying:

"Thou shalt not kill, Thou shalt not commit adultery, Thou shalt not steal, Thou shalt not forswear thyself."

But our Saviour, extending the law, not only forbids to kill, but also to be angry: instead of "Thou shalt not commit adultery," He forbids to look on a woman with unbridled lust. Instead of "Thou shalt not steal," He enjoins that we should give what is our own to the needy. And transcending the law against false swearing, He lays down the rule of not swearing at all. But why need I seek further for proof that Moses and Jesus our Lord and Saviour acted in closely similar ways, since it is possible for any one who likes to gather instances at his leisure? Even when they say that no man knew the death of Moses, or his sepulchre, so (none saw) our Saviour's change after His Resurrection into the divine. If then no one but our Saviour can be shewn to have resembled Moses in so many ways, surely it only remains for us to apply to Him, and to none other, the prophecy of Moses, in which he foretold that God would raise up one like unto himself, saying:

"18. I will raise a prophet to them of their brethren like thee; and I will put my words in his mouth, and he shall speak to them, as I shall bid him. 19. And whatever man will not hear whatsoever words that prophet saith, I will take vengeance on him."

And Moses himself, interpreting the words to the people, said:

"15. A prophet shall the Lord thy God raise up to thee of thy brethren, like me; him ye shall hear; 16. according to all things which you desired of the Lord your God in Horeb in the day of the assembly."

But the Old Testament clearly teaches that, of the prophets after Moses, no one before our Saviour was raised up like unto Moses, when it says:

"And there has not arisen yet a prophet like Moses whom the Lord knew face to face in all his signs and wonders."

I have then proved that the Divine Spirit prophesied through Moses of our Saviour, if He alone and none other has been shewn to fulfil the requirements of Moses' words.
'''
