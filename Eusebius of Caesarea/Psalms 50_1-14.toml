[[commentary]]
quote='''
[Passage quoted, Ps. xlix. 1-14.]

HERE the divine prediction clearly prophesies that God will come manifestly, meaning none other but the Word of God. And it shews the reason of His coming, again emphasizing the calling of all nations of the world. For it says, "He has called the earth from the rising of the sun to the setting"; and it teaches that the rejection of the outward worship according to the Mosaic Law will follow hard after His Manifestation and the calling of the Gentiles, a worship which actually ceased after the manifestation of the Word of God to all men. For from that day to this all men throughout all the world have been called, and all the nations of the east and west. And the Jewish worship has ceased and been abolished, all men being called to worship according to the new Covenant of the preaching of the Gospel, and not according to the Law of Moses. We might also apply these prophecies to our Saviour's second and glorious Coming.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 3"
