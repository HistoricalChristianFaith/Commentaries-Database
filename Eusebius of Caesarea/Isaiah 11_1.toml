[[commentary]]
quote='''
"10. And in that day there shall be a root of Jesse, and one arising to rule the Gentiles. In him shall the Gentiles hope, and his rest shall be glory, 11. And it shall be in that day, the Lord shall again shew his hand, to be jealous and to seek the remnant remaining from his people, which is left by the Assyrians, and from Egypt, and Babylon, and Ethiopia, and from the Elamites, and from the East, and from the isles of the sea. 12. And he will raise a standard to the nations, and will gather together the dispersed of Judah, from the four corners of the earth."

As certain events were many times foretold as about to take place on a definite day, that is to say, when a certain time had come, I have by the use of reasoning proved that the said events must follow the appearance of God, for when He appears, the whole Jewish race falling away, holy Scripture makes it clear that a scanty few of them will be left behind, while the passage now in our hands shews in the clearest way both the day, and the time meant by it, and the events that were to follow it. For it prophesies the birth of the Christ of the seed of David, and at the same time foretells the falling away of the Jews. For it says thus :

"Behold, the Lord, the Lord of Sabaoth, will mightily confound the glorious ones, and the lofty men shall be humbled, and the lofty shall fall by the sword, and Libanus shall fall with the lofty."

By Libanus here Jerusalem is meant, as I have shewn elsewhere, which Scripture threatens shall fall with all its venerable and glorious men within it. And having thus begun, it says afterwards : "And a rod shall come out of the stem of Jesse, and a flower shall spring up from his root."

By showing very clearly that the birth of Christ should be from the root of Jesse, who was the father of David, it explains upon what birth the call of the Gentiles should follow, which it had previously only given obscurely in the prophetic manner. For "the wolf shall feed with the lamb, and the leopard shall lie down with the kid," and such passages, are only intended to shew the change of savage and uncivilized nations in no way differing from wild beasts to a holy, mild, and social way of life. And this is what it teaches afterwards without disguise, in the words : "The whole [earth] shall be filled with the knowledge of the Lord, as the waters cover the sea."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"

[[commentary]]
quote='''
[Passage quoted, Isa. xi. 1-10.]

This Jesse was David's father. As, then, in the preceding prophecies it was foretold that one should come forth of the fruit and seed of David, and also of the seed of Solomon, in the same way here it is prophesied that one will come forth of the seed of Jesse, that is to say of David, many years after the death of both David and Solomon. And this passage decides the quibble of the Jews already noticed with regard to Solomon. For Isaiah writes this prophecy about some one other than him many years after the death of Solomon, who should arise from the stem of Jesse, and the seed of David. And I do not think it can be doubted that the words apply only to our Saviour, the Christ of God, considering the promise in the prediction, which says, "And there shall be a root of Jesse, and he that riseth to rule the nations, in him shall the nations trust," and the way in which our Saviour fulfils them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 3"
