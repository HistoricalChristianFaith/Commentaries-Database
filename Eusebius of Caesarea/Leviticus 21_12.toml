[[commentary]]
quote='''
But He is said to have been brought up at Nazara, and also to have been called a Nazarene We know that the Hebrew word "Naziraion" occurs in Leviticus in connection with the ointment which they used for unction. And the ruler there was a kind of image of the great and true High Priest, the Christ of God, being a shadowy type of Christ. So there it is said about the High Priest according to the Septuagint: "And he shall not defile him that is sanctified to his God, because the holy oil of his God hath anointed him": where the Hebrew has nazer for oil. And Aquila reads: "Because the separation, the oil of God's unction, is on him"; and Symmachus: "Because the pure oil of his God's anointing is on him ": and Theodotion: "Because the oil nazer anointed by his God is upon him." So that nazer according to the Septuagint is "holy," according to Aquila "separation," according to Symmachus "pure," and the name Nazarene will therefore mean either holy, or separate, or pure. But the ancient priests, who were anointed with prepared oil, which Moses called Nazer, were called for that reason Nazarenes; while our Lord and Saviour having naturally holiness, purity, and separation from sin, needed no human unguent, yet received the name of Nazarene among men, not because He was a Nazarene in the sense of being anointed with the oil called Nazer, but because He naturally had the qualities it symbolized, and also because He was called Nazarene from Nazara, where He was brought up by His parents according to the flesh and passed His childhood. And so it is said in Matthew:

"Being warned of God in a dream [Joseph is referred to] he departed into the regions of Galilee, and came and lived in a city called Nazara, that the saying of the prophets might be fulfilled, He shall be called a Nazarene."

For it was altogether necessary that He Who was a Nazarene naturally and truly, that is holy, and pure and separate from men, should be called by the name. But since, needing no human unction, He did not receive the name from the oil nazer, He acquired it from the place named Nazara.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 2"
