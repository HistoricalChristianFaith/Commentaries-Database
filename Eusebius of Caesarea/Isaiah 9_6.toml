[[commentary]]
quote='''
[Passage quoted, Isa. ix. 1-7.]

This is the third prophecy of the Child, making known the same thing in different ways. As our present object is to exhibit the manner of God's coming to men, note the number of ways in which He is shewn forth. First, He was set before us under the name of Emmanuel, God born of a Virgin; secondly, as the Child of the prophetess and the Holy Spirit, being none other than the before-named; thirdly, in the present passage, being one and the same as in the former, wherein His Name is said to be, according to the Septuagint, Angel of Great Counsel, and as some of the copies have, "Wonderful Counsellor, Mighty God, Potentate, Prince of Peace, Father of the World to Come." In the Hebrew, as Aquila says:

"For unto us a child is born, to us a son is given, and a measure was upon his shoulders. And his name was called Wonderful Counsellor, Mighty, Powerful, Father, even Prince of Peace, and of his peace there is no end."

And as Symmachus:

"For a youth is given to us, a son is given us; and his instructions shall be upon his shoulders, and his name shall be called Miraculous, Counselling, Strong, Powerful, Eternal Father, Prince of Peace, and of his peace there is no end."

In the Septuagint it is not simply Angel, but that he should be born as Angel of Great Counsel, and Wonderful Counsellor, and Mighty God, and Potentate, and Prince of Peace, and Father of the World to Come, and it was there prophesied that He should be a Child. He is referred to that was previously called differently the Word of God, and God and Lord, and also named the Angel of His Father, and the Captain of the Lord's Host. But who can this be who, in Aquila's version and those even now current among the Hebrews, is "begotten among men, and become a child, Wonderful and Strong, Counsellor, Powerful, and Father, yea even Prince of peace, Whose peace, he says, will never end?" or in that of Symmachus, "Miraculous, Counselling, Strong, Powerful, Eternal Father, Prince of peace, and that endless and infinite"; or in Theodotion's "Counselling wonderfully, Strong, Powerful, Father, Prince of peace, for increasing instruction, of Whose peace there is no end."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"

[[commentary]]
quote='''
And all this, He says, they will suffer, because "Unto us a child is born, a son is given to us, the Angel of Great Counsel.'' Who are meant by "us," but we who have believed in Him, and all Galilee of the Gentiles, on whom the great light is sprung up? And what is this light but the Child that was born, and the Son that was given us by God, Who is named the Angel of Great Counsel, and the Prince of Peace, the Potentate, the Mighty God, and the Father of the world to come? But I have already shewn in its right place that these words can only be referred to our Lord and Saviour.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 8"
