[[commentary]]
quote='''
After these observations, we will now attempt a consideration of the prophecy: "Judah, thy brethren shall praise thee." Jacob had twelve sons, the fourth being Judah, who as I have said already, was the one and only head of the Hebrew tribes. But it will be evident, that the words addressed to him by his father did not refer to him as an individual man, if we consider the words of Holy Scripture, and especially the speech of Jacob to his sons:

"And Jacob called his sons to him, Come together and I will tell you what shall come to pass in the last days. Gather together and hear, ye sons of Jacob, hear Israel your father."

For he clearly promises here to predict what will happen to them a long time afterwards, or, in his own words, in the last days. And for other reasons what Jacob said could not apply to the first individual who bore the name of Judah. His brethren did not praise him: for what great deed of his could they have done so? It would have been more applicable, if it had been addressed to Joseph, for we know that Judah himself with his other brethren bowed down to him, except of course that this happened before the prophecy; but afterwards there is no record of anything of the kind connected with Joseph, or Judah. And the words, "Thou didst fall and sleep as a lion and a lion's whelp," seem to call for a wider interpretation than one concerning Judah. The words that follow, too: "There shall not fail a prince from Judah, nor a governor from his loins, until that come which is laid up for him, and he is the expectation of nations," seem to me to give in a disguised form the time of the coming of the subject of the prophecy. For the one event, he says, will not take place, until the other does. The kings and rulers of the Jewish nation, that is, will not cease before the expectation of the nations shall come, and that which is laid up for the subject of the prophecy. Theodotion agrees with this rendering of the Septuagint, but Aquila thus translates:

"The sceptre shall not be removed from Judah, and he who knoweth exactly from between his feet, until also there come to him a congregation of people."

And this saying, "There shall not fail a prince from Judah," cannot be referred to Judah as an individual man any more than, "Judah, thy brethren shall praise thee." For there were rulers and governors of the Jewish nation at many times who were not descended from him. Moses, for instance, its first ruler, was not of the tribe of Judah but of Levi. Joshua was of the tribe of Ephraim; after whom their ruler was Deborah, of the tribe of Ephraim, and Barak of the tribe of Naphthali, then Gedeon of Manasseh, then Gedeon's son, and after him Thola of the same tribe, then Esebon of Bethlehem, and then Ailon of Zabulon, Labdon of Ephraim, and Samson of Dan; then there being no regular ruler, Eli the priest, of the tribe of Levi, was their leader, All these Judges judged Israel, not in the line of succession from Judah, but one from one tribe and one from another. And they were followed by the first king, Saul, of the tribe of Benjamin. How, then, can the words, "there shall not fail a prince from Judah, nor a governor from his loins," be referred, as one would suppose they should be, to rulers and governors of the tribe of Judah, when from the time of Jacob's death, for nearly a thousand years, they do not appear to have been drawn from the tribe of Judah only, but some from one tribe, some from another, up to the time of David? And if it be true that David and his successors sprung from the tribe of Judah ruled the Jewish nation, after so many others, yet we must remember that they did not continue to rule the whole people for the whole of those five hundred years, but only three tribes, and not the whole of them, for during their reigns other kings governed the larger part of the nation---- that is to say, the whole of the other nine tribes. For after the death of Solomon, since the whole nation was divided from Judah, the successors of David, as I said, did not rule the whole Jewish nation up to the time of the Babylonian Captivity. And in their times the heads of Samaria, which was the name of the State held by the nine tribes, were not drawn from Judah, but now from one tribe, now from another, the first being Jeroboam, of the tribe of Ephraim, and those immediately after him, so that in the period between David and the Babylonian Captivity, kings of the line of Judah never ruled the whole nation.

There is no need to add that after the return from Babylon for more than five hundred years again until the birth of Christ the Jewish constitution was aristocratic, the high priests, for the time being, acting as heads of the State, none of whom came from the tribe of Judah. So from all these reasons it is proved that there is no reference here to Judah the original individual, to his descendants, nor in the oracle that said: "A prince shall not fail from Judah, nor a governor from his loins," but that the only consistent interpretation of the passage is the one I have already given, that we must understand it of the tribe as a whole. The tribe most certainly was leader of the whole nation from the very beginning, from Moses' own time. And in accordance with such headship, as being designed by God from the outset, the country is even now called Judaea after the tribe, and the whole race are known as Jews. We must, therefore, understand it to mean what would be expressed more clearly, if it were said that the tribe of Judah would never lose its headship of the whole nation. So Symmachus says: "The power shall not be taken away from Judah," shewing of course the authority and the royal position of what was afterwards to be the tribe of Judah. From it neither "the sceptre," as Aquila says, this being the symbol of royal rule, nor "the power," according to Symmachus, shall be taken away, the prophecy affirms, "until he come," it says, "for whom it is laid up, and he shall be the expectation of the nations." What expectation was this, but that of which Abraham and those after him had received the prophecies? First, is it not very striking that though there were twelve Hebrew tribes, the race even now has its name from none but Judah? It can only be explained by the prophetic oracle, which attached the royal position to the tribe, of Judah. And it is for this same reason that their fatherland is called Judaea. For why was not the nation called after the eldest of the twelve, I mean Reuben, according to the divine law of primogeniture? Why not from Levi, who was greater than Judah in order of birth, and also in receiving the priesthood? Why not, even more, was the race and the country not called after Joseph, from his acquiring rule not only over the whole of Egypt, but over his own relations, and because his descendants, long years after, were to rule as many as nine tribes of the nation, on whose account it was far more probable that the whole race and the country would have been named after their ancestor? And who would not agree that they might reasonably have been called from Benjamin, since their famous mother-city and the all-holy Temple of of God was in the portion of his tribe? But yet, in spite of all, the name of the Lord and of the whole nation was . drawn from none of them but Judah, as the prophecy foretold. I have, therefore, referred the words, "A prince shall not fail from Judah," to the tribe, and only in that sense is the prediction true. For from the time of Moses there has not failed a continued line of rulers of part of the nation, drawn as I said from different tribes, but the tribe of Judah has all along stood forth as the head of the whole nation. An illustration will make what I have said clear. Just as the procurators and governors appointed in the Roman Empire over nations, their praefects and military chiefs, and their highest kings, are not all drawn from Rome nor from the seed of Remus and Romulus, but from many different races, and yet all their kings and the rulers and governors below them are all called Romans, and their power is named Roman, and the rule of them all generally has this appellation, in the same way we should think of the Hebrew state, where you have the name of the tribe of Judah applied generally to the whole nation, though there be kings and governors of divisions from different tribes, but all honoured with the name of Judah. We understand then that the prophet's words: "Judah, thy brethren shall praise thee," were to be applied to the whole tribe. For he knew that being marked out for precedence it would be honoured more than the other tribes, and since it was best in warfare, and the sole leader of the whole nation in operations against the enemy, he rightly continues: "Thy hands shall be on the back of thy enemies." Then for its ruling and royal position he calls it, "a lion's" whelp." And as ancestor and prophet, glorying in the reputation of the tribe, he adds: "From a seed, my son, thou hast ascended"; while the words: "Falling down thou hast slept as a lion, and as a lion's whelp," shew its character of terror and bravery, its utter fearlessness of external attack, and contempt of its foes. He being such, or rather, his tribe being such, who, he says, shall arouse it? He suggests that the Person who is to remove the tribe in question from its throne, and move it from its royal position, will be some one great, wonderful, unusual, and hard to imagine. Then he tells us who it is to be, telling us that it is He Who is the Expectation of nations, of Whom it is predicted that He will only appear among men, when the ruler fails, and the governor is changed, and the tribe of Judah is removed from its position of power. Who is this, but our Lord and Saviour Jesus Christ?----at Whose birth, as the prophecy before us predicted, the rulers and governors set over their nation from the Jews themselves would fail, the tribe of Judah lose the dominant and royal position that it had held over the nation for so long, and be subject to the Romans, their rulers from that day to this, who overcame the Jewish nation together with the rest of the world, and under whom Herod, a man of alien birth apart from their race, was appointed king by Augustus and the Roman Senate. For Herod was son of Antipater, and Antipater belonged to Ascalon, and was son of some temple-server at the Temple of Apollo, who married a woman named Kuprine, of Arab race, and begat Herod. He, you will remember, being sprung from this family, got rid of and slew Hyrcanus, the last of the line of ruling high-priests, with whom the government of the Jews by native rulers came to an end, Herod being, as I say, the first foreigner to be called the King of the Jews. In his time Jesus Christ was born, and at one and the same time the position of the tribe of Judah was taken away, the authority of the kingdom of the Jews destroyed, and the prophecy preceding this fulfilled: "There shall not fail a prince from Judah, nor a governor from his loins, until there come the things laid up for him," who, he says, will not only be the expectation of the Jews, but of the Gentiles. As, therefore, the expectation of the call of the Gentiles, prophesied long before to Abraham, was "laid up," until the rulers and governors of the Jewish race should have ceased, and their independent government should have been changed to submission to Rome, and to the Gentile Herod, the Evangelist Luke, noting the date of the cessation of Jewish rulers, tells us that the teaching of Christ began in the fifteenth year of the reign of Tiberius Caesar, when Pontius Pilate was governor of Judaea; and Matthew says the same in a disguised form. For having described the birth of our Lord and Saviour, he adds: "And when Jesus was born in Bethlehem of Judaea, in the days of Herod the king, behold wise men came from the East to Jerusalem, saying, Where is that which is born king of the Jews?" wherein he shews clearly enough both that they were under foreign rule, and also the calling of the foreign nations from the East by God. For foreigners ruled over the Jews, and foreigners coming from the East recognized and worshipped the Christ of God, Who had been prophesied of old. The prophecy of Jacob is thus seen clearly to have been fulfilled, being brought to pass at the end of the national existence of the Jews, even as he predicted to his sons, saying: "Come together, that I may announce to you, what shall happen to you at the end of the days." For we must understand by the end of the days the end of the national existence of the Jews. What, then, did he say they must look for? The cessation of the rule of Judah, the destruction of their whole race, the failing and ceasing of their governors, and the abolition of the dominant kingly position of the tribe of Judah, and the rule and kingdom of Christ, not over Israel but over all nations, according to the words, "This is the expectation of the nations."

And who would not agree that all this has been definitely fulfilled in the coming of our Saviour, when they who of old before Christ's birth, with their native rulers and governors and wise hearers of the holy oracles, prided themselves in their own kings, high priests and prophets, and when the tribe of Judah, being the royal tribe, the conqueror of their enemies, the leader and ruler of the whole nation, with its men of old renown has from that day to this lain under the heel of Rome? For the Christ of God was definitely manifested, and from that day the said expectation of the Gentiles is preached to all nations, Or who can deny, that concurrently with the appearance of our Saviour Jesus the solemnities of the Jews, their city with its Temple and the worship performed therein, have come to an end, together with their native rulers and governors, and that from that time the hope and expectation of the nations through all the world has been made known, since the things laid up in the Lord have come. What are these things, but those set forth by Judah?----

"Thy brethren shall praise thee, thy hands shall be on the back of thine enemies, lion of the tribe of Judah. O my son, thou hast ascended from a seed, falling thou hast slept as a lion and as a lion's whelp: who shall awake thee?"
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 1"

[[commentary]]
quote='''
And it is worth comparing with this prophecy that of Jacob to Judah, which I have already shewn to be most clearly applicable to our Saviour, and to recognize the agreement of the two. For as we have here, "A man shall come forth from his seed," i. e. Jacob's, so we had there, "From a slip, my son, thou hast ascended," said by Jacob to the subject of the prophecy.

As we read too in this prophecy, "And he shall rule many nations," in the other we have similarly, "And he shall be the expectation of nations." Again this one says, "He shall eat the Gentiles his enemies, and with his darts he shall shoot his enemies," just as the other, "Thy hands shall be on the back of thine enemies"; while, "The whelp of the lion of Judah," and, "Falling down thou didst couch as a lion, and as a young lion who shall arouse thee? "in the other prophecy are, I think, identical with the words in the one before us, "Lying down he couched as a lion, and as a lion's whelp, who shall raise him up? "I have set these passages side by side, so that the proof concerning our Saviour may rest on a firmer foundation, established on the agreement "of the mouth of two witnesses."

All therefore that I have deduced from the prediction of Jacob would apply to that of Balaam, because of the similarity of their sayings. And if it was then established by a lengthy demonstration that the former were fulfilled in our Saviour, it follows that this is also true of the latter.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 3"
