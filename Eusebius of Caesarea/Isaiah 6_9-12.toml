[[commentary]]
quote='''
And this which has really come to pass :

" 9. Ye shall hear indeed, and shall not understand : and seeing ye shall see and not perceive. 10. For the heart of this people is waxed gross, and they hear with heavy ears, and they have closed their eyes, lest they should ever see with their eyes, and hear with their ears, and turn, and I should heal them. 11. And I said, Until when, O Lord? And he said, Until the cities be desolated that none dwell in them, and houses that no men be in them, and the earth be left desolate. 12. And afterwards God will increase men, and they that are left on the earth shall be increased."

And notice here how they that are left again on the earth, all the rest of the earth being desolate, alone are said to multiply. These must surely be our Saviour's Hebrew disciples, going forth to all men, who being left behind like a seed have brought forth much fruit, namely, the Churches of the Gentiles throughout the whole world. And see, too, how at the same time he says that only those will multiply who are left behind from the falling away of the Jews, while the Jews themselves are utterly desolate: "Their land," he says, "shall be left unto them desolate." And this was also said to them before by the same prophet : "Your land is desolate, your cities are burnt with fire, your country strangers devour it before your eyes."

And when was this fulfilled, except from the times of our Saviour? For up to the time they had not yet dared to do impiety to Him, their land was not desolate, their cities were not burned with fire, nor did strangers devour their land. But from that inspired word, by which our Lord and Saviour Himself predicted what was about to fall on them, saying : "Your house is left unto you desolate," from that moment and not long after the prediction they were besieged by the Romans and brought to desolation. And the word of prophecy gives the cause of the desolation, making the interpretation almost certain, and showing the cause of their falling away. For when they heard our Saviour teaching among them, and would not listen with their mind's ear, nor understood Who He was, seeing Him with their eyes, but not beholding Him with the eyes of their spirit, " they hardened their heart, and all but closed the eyes of their mind, and made their ears heavy."

As the prophecy says, because of this He says that their cities would be made desolate so that none should dwell in them, and their land should become desolate, and only a few of them be left behind, kept like fruitful and spark-like seed, who it is said, should go forth to all men, and multiply on the earth.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
