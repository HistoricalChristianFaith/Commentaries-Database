
[[commentary]]
quote='''
And, therefore, our Lord and Saviour rightly says to those who suppose that God ought only to be worshipped in Jerusalem, or in certain mountains, or some definite places:

"1. The hour cometh and now is, when the true worshippers shall neither in this mountain nor in Jerusalem worship the Father. For God is a Spirit, and they that worship him must worship him in spirit and in truth."

So He said, and presently, not long after, Jerusalem was besieged, the holy place and the altar by it and the worship conducted according to Moses' ordinances were destroyed, and the archetypal holiness of the pre-Mosaic men of God reappeared. And the blessing assured thereby to all nations came, to lead those who came to it from the first step and from the first elements of the Mosaic worship to a better and more perfect life. Yes, the religion of those blessed and godly men, who did not worship in any one place exclusively, neither by symbols nor types, but as our Lord and Saviour requires "in spirit and in truth," by our Saviour's appearance became the possession of all the nations, as the prophets of old foresaw. For Zephaniah says the very same thing:

"The Lord shall appear against them, and shall utterly destroy all the gods of the nations of the earth. And they shall worship him each one from his own place."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"

[[commentary]]
quote='''
Suffice it to say now, that we must hold to the truth, that the prophecies have only been fulfilled after the coming of Jesus our Saviour. For it is through Him that in our day that old system of Abraham, the most ancient and venerable form of religion, is followed by the Egyptians, the Persians, the Syrians and the Armenians. The Barbarians from the end of the earth, those of them who were of old the most uncivilized and wild, yea, they that inhabit the isles, for prophecy thought well even to mention them, follow it as well. And who would not be struck by the extraordinary change—that men who for ages have paid divine honour to wood and stone and daemons, wild beasts that feed on human flesh, poisonous reptiles, animals of every kind, repulsive monsters, fire and earth, and the lifeless elements of the universe should after our Saviour's coming pray to the Most High God, Creator of Heaven and earth, the actual Lord of the prophets, and the God of Abraham and his forefathers? That men a little while before involved in marriage with mothers and daughters, in unspeakable vice and all sorts of vileness, men who lived like wild beasts, now converted by the divine power of our Saviour, and become like different beings, should crowd the public schools and learn lessons of virtue and purity. That not men only, but women, poor and rich, learned and simple, children even and slaves, should be taught in their daily occupation in town or country the loftiest ethics, which forbids to look with eyes unbridled, to be careless even in words, or to follow the path of custom and fashion. That they should learn the true ideal of worshipping the Supreme God, and serving Him in every place, according to the prophecy, which says: "And they shall worship Him each from his own place."Every one, then, whether Greek or Barbarian, is worshipping the Supreme God, not running to Jerusalem, nor made holy with bloody sacrifices, but staying at home in his own land, and offering in spirit and in truth his pure and bloodless offering.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"

[[commentary]]
quote='''
And if it was true long ago: "Jacob is become the portion of the Lord, and Israel the rope of his inheritance." Yet afterwards it was also said that all the nations would be given to the Lord for His inheritance, the Father saying to him : " Desire of me, and I shall give thee the heathen for thine inheritance." And it is also prophesied that He shall rule from sea to sea and to the ends of the world : "All the Gentiles shall serve him, and in him shall the tribes of the earth be blessed." And the reason of this was that the Supreme God should make known His salvation before all nations. And I have already noted before that the name of Jesus translated from Hebrew into Greek would give "salvation," so that "the salvation of God" is simply the appellation of our Saviour Jesus Christ.

And Simeon bears witness to this in the Gospel, when he takes the infant in his hands, I mean of course Jesus, and prays:

"Now, Lord, lettest thou thy servant depart in peace, according to thy word :
For mine eyes have seen thy salvation,
Which thou hast prepared before the face of all people;
A light to lighten the Gentiles."

And this same salvation the Psalmist meant, when he said:

"The Lord declared his salvation, in the sight of the heathen he openly shewed his righteousness."

And, according to Isaiah, it will be when they behold this very salvation that all men will worship the supreme God, Who has bestowed His salvation on all ungrudgingly. And they will worship Him not in Jerusalem below, which is in Palestine, but each from his own place, and all who are in the isles of the Gentiles; and then, too, the oracle shall be fulfilled which said that all men should call no longer on their ancestral gods, nor on idols, nor on daemons, but on the Name of the Lord, and shall serve Him under one yoke, and shall offer to Him from the furthest rivers of Ethiopia the reasonable and bloodless sacrifices of the new Covenant of Christ, to be sacrificed not in Jerusalem below, nor on the altar there, but in the aforesaid borders of Ethiopia.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
