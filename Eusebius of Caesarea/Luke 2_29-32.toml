[[commentary]]
quote='''
And if it was true long ago: "Jacob is become the portion of the Lord, and Israel the rope of his inheritance." Yet afterwards it was also said that all the nations would be given to the Lord for His inheritance, the Father saying to him : " Desire of me, and I shall give thee the heathen for thine inheritance." And it is also prophesied that He shall rule from sea to sea and to the ends of the world : "All the Gentiles shall serve him, and in him shall the tribes of the earth be blessed." And the reason of this was that the Supreme God should make known His salvation before all nations. And I have already noted before that the name of Jesus translated from Hebrew into Greek would give "salvation," so that "the salvation of God" is simply the appellation of our Saviour Jesus Christ.

And Simeon bears witness to this in the Gospel, when he takes the infant in his hands, I mean of course Jesus, and prays:

"Now, Lord, lettest thou thy servant depart in peace, according to thy word :
For mine eyes have seen thy salvation,
Which thou hast prepared before the face of all people;
A light to lighten the Gentiles."

And this same salvation the Psalmist meant, when he said:

"The Lord declared his salvation, in the sight of the heathen he openly shewed his righteousness."

And, according to Isaiah, it will be when they behold this very salvation that all men will worship the supreme God, Who has bestowed His salvation on all ungrudgingly. And they will worship Him not in Jerusalem below, which is in Palestine, but each from his own place, and all who are in the isles of the Gentiles; and then, too, the oracle shall be fulfilled which said that all men should call no longer on their ancestral gods, nor on idols, nor on daemons, but on the Name of the Lord, and shall serve Him under one yoke, and shall offer to Him from the furthest rivers of Ethiopia the reasonable and bloodless sacrifices of the new Covenant of Christ, to be sacrificed not in Jerusalem below, nor on the altar there, but in the aforesaid borders of Ethiopia.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
