[[commentary]]
quote='''
And if we read a little further on in the Psalm we shall find that the subject of the prophecy, this very "beloved of God," is anointed, once more not as by Moses, nor as by any human being, but by the Most High and Supreme God and Father Himself. As he says further on, "Wherefore God, even thy God, hath anointed thee with the oil of gladness above thy fellows." And by what name else could one call Him that is here acknowledged to have been anointed by the Supreme God Himself, but Christ? So we have here in this passage two names of the subject of the prophecy, Christ and the Beloved, the author of this anointing being one and the same: and it shews the reason why He is said to be anointed with the oil of gladness, which will be plain to you, when we proceed a little further, and still more if you take into account the whole intention of the passage. For the Psalm addresses the subject of the prophecy, Christ the Beloved of God, in the words quoted a little before, in which it was said: "Thy throne, O God, is for ever and ever: a sceptre of righteousness is the sceptre of thy Kingdom. Thou hast loved righteousness and hated injustice: therefore God, even thy God, hath anointed thee with the oil of gladness above thy fellows." See, then, if these words are not addressed directly to God: He says,

"For thou, ὁ Θεός," instead of ὦ Θεέ. "Thy throne is for ever and ever, and a sceptre of righteousness is the sceptre of thy Kingdom." And then, "Thou, O God, hast loved righteousness and hated injustice; therefore God, even Thy God, hath anointed thee," and established Thee as Christ above all. The Hebrew shews it even more clearly, which Aquila most accurately translating has rendered thus: "Thy throne, God, is for ever and still, a sceptre of righteousness is the sceptre of thy Kingdom. Thou hast loved justice and hated impiety: wherefore God, thy God, hath anointed thee with the oil of gladness apart from thy fellows." Instead therefore of "God, thy God" the actual Hebrew is, "O God, thy God." So that the whole verse runs: "Thou hast, O God, loved justice and hated impiety: therefore in return, O God, the highest and greater God, Who is also thy God"—so that the Anointer, being the Supreme God, is far above the Anointed, He being God in a different sense. And this would be clear to any one who knew Hebrew. For in the place of the first name, where Aquila has "Thy throne, O God," clearly replacing ὁ Θεός by Θεέ, the Hebrew has Elohim. And also for "Therefore, O God, he has anointed thee" the Hebrew has Elohim, which Aquila shewed by the vocative ὦ Θεέ.

Instead of the nominative case of the noun, which would be "Therefore God, even thy God, hath anointed thee—" the Hebrew with extreme accuracy has Eloach, which is the vocative case of Elohim, meaning "O God," whereas the nominative Elohim means "God." So that the interpretation which says "Therefore, O God, thy God hath anointed," is accurate.

And so the oracle in this passage is clearly addressing God, and says that He has been anointed with the oil of gladness beyond any of those who have ever borne the same name as He. Therefore in these words you have it clearly stated that God was anointed and became the Christ, not with prepared unguent nor at the hands of man, but in a way different from other men. And this is He Who was the Beloved of the Father, and His Offspring, and the eternal Priest, and the Being called the Sharer of the Father's Throne. And Who else could He be but the Firstborn Word of God, He that in the beginning was God with God, reckoned as God through all the inspired Scriptures, as my argument as it proceeds further will abundantly prove?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 15"

[[commentary]]
quote='''
Such are the many instances of the prediction of the Christ by name; but, as in most cases, the Sufferings of Christ are conjoined to His Name, we must return to what was said before about His Divinity, which I have showed previously to be touched on in the 45th Psalm, entitled FOR THE BELOVED, where Scripture, after first describing Him as King, proceeds to say other things about the Divinity of Christ:

"Thy throne, O God, is for ever and ever: a sceptre of righteousness is the sceptre of thy kingdom: Thou hast loved righteousness, and hated injustice: therefore God, even thy God, hath anointed thee with the oil of gladness above thy fellows."

For, as I have already shewn, these words clearly imply that the God referred to is one and the same Being, Who loved righteousness and hated iniquity; and that because of this He was anointed by another greater God, His Father, with a better and more excellent unction than that foreshadowed by the types, which is called "the oil of gladness." And what else could He be properly named but Christ, Who is anointed with this oil, not by man but by God Most High? The same Person, therefore, is shewn to be called God, as indeed I have already shewn in the proper places.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
