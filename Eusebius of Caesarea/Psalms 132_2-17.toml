[[commentary]]
quote='''
[Passages quoted, Ps. cxxxi. 1-7, 10, 11, 17.]

This prophecy agrees with the preceding in stating that the God about whom the prophecy is made will come forth from Bethlehem. And it is about this place that David first prays God to teach him, since he does not know it, and then after his prayer he is taught. For when he has received the oracle addressed to him in the Psalm which said: "Of the fruit of thy body I will set upon thy seat," and, "There will I raise up a horn for David, I have prepared a lantern for my Christ," he rightly falls down before God, and there fallen to the earth worships, and with yet greater intensity of prayer swears that he will not enter the tabernacle of his house, nor allow his eyes to sleep, nor his eyelids to slumber, nor ascend the couch of his bed, but will lie on the ground worshipping and adoring, until he finds a place for the Lord, and a tabernacle for the God of Jacob—that is, until he learns by the Lord's revelation to him the birthplace of the Christ.

So having prayed and desired to learn it, not long after he beholds by the Holy Spirit what will be in the future; for God has promised to His people that he will hear them even while they speak. So his prayer being heard he is favoured with an oracle which cries "Bethlehem," that being the place of the Lord, and the tabernacle of the God of Jacob. And so when the Holy Spirit prophesied that this was within him, he, listening to his inner voice, adds: "Lo, we heard of it in Ephratha." And Ephratha is the same as Bethlehem, as is clear from Genesis, where it is said of Rachel, "And they buried her in the Hippodrome of Ephratha,'' and this is Bethlehem. And the previous prophecy ran: "And thou, Bethlehem, house of Ephratha." "Behold," he says, "we have heard it! "—evidently meaning the birth of Christ and the entering of the God of Jacob into His tabernacle. For what else could the tabernacle of the God of Jacob be but the Body of Christ, which was born at Bethlehem, in which, as in a tabernacle, the divinity of the Only-begotten dwelt? And the habitation is not said to be simply of God, but is qualified as of the God of Jacob, that we may know that it is the God that dwells therein, Who was seen by Jacob in human form and shape, wherefore he was deemed worthy of the name, Seer of God, for such is the translation of his name. And I have established in the early part of this work that He that was seen by Jacob was none other than the Word of God. Bethlehem was therefore revealed to David when he prayed and desired to know the place and the habitation of the Lord and God of Jacob, wherefore he said: "Behold, we heard it at Ephiatha," and added: "Let us worship at the place where his feet stood." Therefore in these words the Lord God of Jacob Himself foretold that His own place and habitation would be in Ephratha, which is Bethlehem, agreeing with the prophecy of Micah, which said: "And thou, Bethlehem, house of Ephratha, out of thee shall come a governor, and his goings forth are from eternity," which, when we lately examined, we found could only apply to our Lord and Saviour Jesus Christ, Who was born at Bethlehem according to the predictions. For it is certain that no one else can be shewn to have come forth from there with glory after the date of the prophecy: there was no king, or prophet, or any other Hebrew saint who can be shewn to have been of David's seed, and also born at Bethlehem, except our Lord and Saviour, the Christ of God. We must, therefore, own that He, and no one else, is the subject of this prophecy, and for the additional reason that further on the same Psalm proves it, calling Him Christ by name, where it says: "For the sake of David thy servant, turn not away the face of thy Christ." And again: "There will I raise up a horn for David, I have prepared a lantern for my Christ, his enemies I will clothe with shame, but upon him my holiness shall flower." Where else does he say: "I will raise up a horn for David," but in Bethlehem—Ephratha? For it was there the horn of David, the Christ according to the flesh, arose like a great light, and there the God of the Universe prepared the lantern of the Christ. And the human tabernacle was the lantern as it were of his spiritual light, through which, like an earthen vessel, as if through a lantern, He poured forth the rays of His own light on all who were oppressed by ignorance of God and thick darkness.

Yes, indeed, I think that it was clearly revealed here that the God of Jacob, from the beginning the Eternal, would dwell among men, and that He would be born nowhere else but in the place at Bethlehem, near Jerusalem, in the spot that is even now pointed out, for there no one is witnessed to by all the inhabitants as having been born there in accordance with the Gospel story, no one remarkable or famous among all men, except Jesus Christ. And Bethlehem is translated, "House of Bread," bearing the name of Him Who came forth from it, our Saviour, the true Word of God, and nourisher of spiritual souls, which He Himself shews by saying: "I am the Bread that came down from heaven." And since it was David's mother-town as well, the Son of David according to the flesh rightly made His entrance from it according to the predictions of the prophets, so that the reason is clear why He chose Bethlehem for His mother-town.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 2"
