[[commentary]]
quote='''
[Passage quoted, Isa. xlviii. 12 and 16.]

You have here the Lord sent and the Lord sending, that is to say the Father and God of the Universe, entitled Lord twice as was usual.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 22"
