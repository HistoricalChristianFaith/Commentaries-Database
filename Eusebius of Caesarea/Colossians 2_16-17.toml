[[commentary]]
quote='''
With all this we should again compare the records of Moses, who when he established his own brother as High Priest, according to the pattern that had been shewn to him, agreeably to the oracle which said to him: "Thou shalt make all things according to the pattern shewn to thee in the Mount," plainly shews that he had perceived with the eyes of the mind and by the Divine Spirit the great High Priest of the Universe, the true Christ of God, Whose image he represented together with the rest of the material and figurative worship, and honoured the person named with the name of the real Christ.

And this has the support of the inspired apostle, who says when treating of the law of Moses: "Who serve under the example and shadow of heavenly things." And again: "For the law having a shadow of good things to come." And again: "16. Let no man, therefore, judge you in meat or in drink, or in respect of a holy day, or of the new moon, or of the Sabbath days, 17. which are a shadow of things to come." For if the enactments relating to the difference of foods, and the holy days and the Sabbath, like shadowy things, preserved a copy of other things, that were mystically true, you will say not without reason that the High Priest also represented the symbol of another High Priest, and that he was called Christ, as the pattern of that other, the only real Christ: and so far was he from being the real one, that the real Christ hears from the Supreme God: "Sit thou on my right hand, until I make thine enemies the footstool of thy feet." And: "Be thou ruler in the midst of thine enemies." And: "The Lord sware, and will not repent. Thou art a priest for ever after the order of Melchizedek." By which He was revealed clearly as eternal Priest, existing as Offspring and Son of God before the Morning Star and before the whole creation. And the Christ of Moses, like one who has acted the character in a drama for a short time, retires as one reckoned among mortals, and hands on the reality to the only true and real.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
