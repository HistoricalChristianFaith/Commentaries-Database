[[commentary]]
quote='''
And Ezekiel actually calls Jerusalem Libanus when he says, "The great eagle, with great wings, that hath the dominion, cometh to Libanus, and tore off the tender boughs of the cedar." And he goes on to explain this himself, as happening when Nebuchadnezzar shall come to Jerusalem and take her rulers, and that which follows. But Ezekiel's prophecy is about the first siege, and Zechariah's about the second.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 4"
