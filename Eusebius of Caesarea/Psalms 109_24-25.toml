[[commentary]]
quote='''
And he adds after an interval:

"My knees were weak through fasting, and my flesh was changed for lack of oil, and I become a jest to them. They saw me, and shaked their heads at me."

And all this was fulfilled, when "The passers-by reviled him, wagging their heads and saying, He saved others, himself he cannot save."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 3"
