[[commentary]]
quote='''
[Passage quoted, Gen. xxxv. 1-3.]

HERE the very God of the Universe, the only Unbegotten and Most High (not seen, for He answers Jacob invisibly, and moving him by His unspeakable power), speaks clearly of Another than Himself. God then said to him, "Make an altar to the God that appeared to thee." I have already shewn Who this was that was described before as appearing to him, and proved that it was the Word of God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 12"
