[[commentary]]
quote='''
And then the prophecy proceeds to predict the state of desolation of those who rejected Him when He came. For it says, "He turned rivers into a wilderness, and rivers of waters into thirst, a fruitful land into saltness for the wickedness of them that dwell therein": which you will understand if you behold Jerusalem of old, the famous city of the Jewish race, her glory and her fruitfulness, despoiled now of her holy citizens and pious men. For after the coming of Christ she became as the prophet truly says without fruit or water, and quite deserted, "saltness for the wickedness of them that dwell therein."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 7"
