[[commentary]]
quote='''
While then the better, the great and worthy and divine sacrifice was not yet available for men, it was necessary for them by the offering of animals to pay a ransom for their own life, and this was fitly a life that represented their own nature. Thus did the holy men of old, anticipating by the Holy Spirit that a holy victim, dear to God and great, would one day come for men, as the offering for the sins of the world, believing that as prophets they must perform in symbol his sacrifice, and shew forth in type what was yet to be. But when that which was perfect was come, in accordance with the predictions of the prophets, the former sacrifices ceased at once because of the better and true Sacrifice.

This Sacrifice was the Christ of God, from far distant times foretold as coming to men, to be sacrificed like a sheep for the whole human race. As Isaiah the prophet says of him:

"As a sheep he was led to slaughter, and as a lamb dumb before her shearers."

And he adds:

"4. He bears our sins and is pained for us; yet we accounted him to be in trouble, and in suffering and in affliction. 5. But he was wounded on account of our sins, and he was made sick on account of our iniquities, the chastisement of our peace was upon him, and with his stripe we are healed. ... 6. And the Lord hath given him up for our iniquities ... .9 for he did no sin himself, nor was guile found in his mouth.''

Jeremiah, another Hebrew prophet, speaks similarly in the person of Christ: "I was led as a lamb to the slaughter."

John Baptist sets the seal on their predictions at the appearance of our Saviour. For beholding Him, and pointing Him out to those present as the one foretold by the prophets, he cried: "Behold the Lamb of God, which taketh away the sin of the world.''

Since then according to the witness of the prophets the great and precious ransom has been found for Jews and Greeks alike, the propitiation for the whole world, the life given for the life of all men, the pure offering for every stain and sin, the Lamb of God, the holy sheep dear to God, the Lamb that was foretold, by Whose inspired and mystic teaching all we Gentiles have procured the forgive ness of our former sins, and such Jews as hope in Him are freed from the curse of Moses, daily celebrating His memorial, the remembrance of His Body and Blood, and are admitted to a greater sacrifice than that of the ancient law, we do not reckon it right to fall back upon the first beggarly elements, which are symbols and likenesses but do not contain the truth itself.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 10"
