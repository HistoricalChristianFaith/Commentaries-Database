
[[commentary]]
quote='''
Then again as one well acquainted with the words, "Weep with those that weep," and "Blessed are they that weep, for they shall laugh"; and "If one member suffer, all the members suffer with it,"which are included in the Gospel teaching, he shews his sympathy for the miserable by saying:

"25. And I wept for every weak one—I groaned when I saw a man in difficulties."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"
