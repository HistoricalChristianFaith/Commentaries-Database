[[commentary]]
quote='''
And it predicts also of those that shall be left in the land, that something else will happen in that day, that is to say at the time of Emmanuel's presence. What is it? Every place, it says, of the people of the Circumcision, where there were 1000 vines for 1000 shekels, shall be dry and thorny. For with arrow and bow they shall come there (obviously the enemy) and the land shall be dry and thorny.

And note that everything the prophecy predicts will fall on the Jewish race in the day of Emmanuel, I mean at the time when the spiritual light of our Saviour's gifts shines on all men. He says that unclean and hostile powers which worked of old among the Gentiles, in Egypt and the land of the Assyrians, when the Lord hisses, and as it were urges them on and encourages them, will come upon their land, because they deserved the visitation. And it says that these powers will rest in valleys, and in caves of the rocks, in caverns, and in all their clefts, both figuratively understood of their souls, their bodily senses, their reason, and their divided minds, and directly in a literal sense of the whole country. Who would not wonder, when he sees how enemies have taken possession of every part of Judaea, and how foreigners and idolaters rest in all their cities and country? And the prophecy says that He will not only treat them thus, but will shave their head, the hairs of their feet and their beard, that is to say the whole order that of old was theirs, with the razor of the king of the Assyrians, as I have interpreted him.

At the same day and at the same time he threatens that he will plunge them into an extreme poverty of godly riches, so that they are devoid of rational bread, and of solid spiritual food, and are all content to be nourished with the milk of infants, and with elementary teaching. And to crown all, their vines will be dry. For when, as the same prophet says, their farmer and master expected them to bring forth a bunch of grapes, and they brought forth thorns, and not justice, but a cry, it is said that he will take away his mound and destroy the wall, and turn the vineyard into a dry place, and will deliver it to enemies, who, he says, will come there with arrow and bow, receiving their authority from God, Who delivers it to them not unjustly, but most justly, because all their land is become dry and thorny. Therefore, then, since they have made themselves dry and thorny, men will come, he says, with arrow and bow, with authority against them. Wonder not if this is expressed in dark and riddling figures. For I have already attributed the cause of such economy of Scripture to the desire to hide the final destruction of the Jewish race, so that they might preserve the Scriptures for our benefit and use. For if the prophets had openly predicted destruction for them, and prosperity for the Gentiles, none of the Jews would have loved them, but they would have destroyed their writings as hostile and opposed to them, and it would have been impossible for us Gentiles to have made use of the prophetic evidence about our Saviour and ourselves. But yet when all this shall have happened to the Jewish race in Emmanuel's day, according to my interpretation of the prophecy, a scanty remnant of them is said to be left, of which the apostle says: "There was a remnant according to the election of grace." This it is surely, which shall rear a red heifer and two sheep, and from the abundance of their milk feed on butter and honey. And I have shewed according to my second interpretation that this describes the whole apostolic choir of the disciples of our Saviour Jesus Christ. But as those who are left behind are thus described in the prophecy, so also when the whole land of the Jewish nation and their vineyard has been transformed into sand and thorns, and therefore delivered to the enemy, it is prophesied in direct opposition to this that every arable mountain shall be ploughed. And I think that the Church of our Saviour Jesus Christ is thus suggested, of which He also says: "A city set on a hill cannot be hid." For I think that the exalted, high, and lofty constitution of the Church is here called a mountain. It is, then, this arable mountain that it says shall be ploughed, so that no fear may attack it, and that it shall be so far changed from its former desolation, aridity, and thorns, as to be fit for "a pasture for sheep, and a place for cattle to tread."

And we can remember, that the Church of Christ which of old was dry and thorny, has undergone by His grace such a transformation, that it grows such a crop of the grass and fodder of spiritual harvest, that the sheeplike and simpler souls can delight in it, and that those who have reached a more perfect development, here called bulls, can plough and till it, as I shewed that the holy apostle taught, when he said:

"Doth God take care for oxen, or doth he say it altogether for your sakes? For your sakes was it written, that he that plougheth should plough in hope, and he that harroweth in hope to share therein."

Thus the land that was before desert and dry has been transformed after the coming of Christ, so that it is fit for those, whom I understand as the bulls, to cultivate suitably.

And notice how the Virgin Birth is prophesied under the same figure, by which at the same time the prophecy says that the land that of old bore fruit worth a thousand shekels will be dry and thorny, and all the land because it is so dry and thorny will be delivered to those that attack it with arrow and bow; while to every mountain the opposite will happen. They will be transformed from their previous dry and thorny state into a pasture of flocks and a place for cattle to tread, and no fear shall enter there. Whereby I think our Saviour's Virgin Birth is clearly meant, and all that happened after it both to the whole Jewish community and to the other nations. The prophecy plainly foretells the change of each of these divisions to the opposite of what they were before, the change of the Jewish nations from better to worse, and the change of the Gentile Church from its old desolation to a divine fruit-fulness, both of which are to be brought to pass according to the prophecy at the same time, that of the appearance of Emmanuel, and are shewn to have actually been fulfilled after our Saviour's birth, and at no other time, both by the events in Jewish history which have been clearly told, and by the existence of the Gentile Church.

For if after the coming of our Saviour Jesus Christ Himself the kingdoms of Damascus and Judaea had not come to an end, and if we could not see with our own eyes their lands released from them, and given over to foreign idolaters to inhabit; and, moreover, if the old stately beauty of their very Temple had not become sand and thorns, and if no impure idolaters had come as their enemies to attack them with bow and arrow, urged on by the Lord Himself from abroad, and stayed in their country making every place and every city their own; and on the other side, if by the teaching of our Saviour no nations brought to believe in Him had changed from the sands and thorns of their ancient barrenness and brought forth a holy and godly spiritual harvest; and again, if they who saw Christ with their eyes had not rejected Him, if they who heard Him speak had not turned a deaf ear to Him, and if the rest of the prophecy could not be proved to have been most exactly fulfilled from the days of Jesus our Saviour—then He would not be the subject of the prophecy. But if the fulfilment of the prophecies is. as the saying is, clear to a blind man, as only brought to pass from the period of His coming, why need we any longer be in doubt about the Virgin Birth, or refuse by wise reasoning to base our belief in that which was the beginning of this matter, on the evidence of what we can even now see? And what do we even now see, but the Jews' disbelief in Him, so clearly fulfilling the oracle, which said: "Hearing ye shall hear and not understand, and seeing ye shall see and not perceive, for the heart of this people is waxed hard," and the siege of Jerusalem, and the total desolation of their ancient Temple, and the settling of foreign races on their land, enslaving them with stings, that is to say with harsh enactments—for this is meant by the figures of the flies and bees—and above all the transformation of the heathen world from its former desolation into the field of God. Who would not be struck with astonishment at these spectacles? And who would not agree that the prediction is truly inspired, when he heard that these words were consigned to books and taken care of by our ancestors a thousand years ago, and only brought to a fulfilment after our Saviour's coming? If, then, the prediction was wonderful, and the result of the prediction yet more wonderful, and beyond all reason, why should we disbelieve that the actual entrance of Him that was foretold was allotted a miraculous and superhuman kind of birth, especially as the clear evidence of the other miracles, as marvellous (as the Birth itself) in their sequence from that Birth compels us to accept the evidence of the other wonders connected with Him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
