[[commentary]]
quote='''
[Passage quoted, Zech. xi. 7b-14.]

THIS was fulfilled when, according to Luke:

"Judas went away, and spoke with the chief priests and scribes and captains of the Temple, that he might betray him unto them. And they were glad, and covenanted to give him money;"

or, according to Mark when, "he went to the chief priests to betray him; and they were glad and promised to give him money." In each case it is simply money that is named. But in Matthew the amount is recorded, and it agrees with the quotation from Zechariah. For Matthew says:

"Then went one of the twelve, called Judas Iscariot, to the chief priests, and said to them, What will ye give me, and I will deliver him unto you? and they weighed unto him thirty staters."

And this agrees with, "And they weighed my price thirty pieces of silver," spoken by the Lord in the prophecy.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 4"
