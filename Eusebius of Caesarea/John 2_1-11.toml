[[commentary]]
quote='''
[Passage quoted, Isa. ix. 1-6.]

THIS also was fulfilled in our Lord and Saviour Jesus Christ besides all the other prophecies, when according to the wondrous Evangelist—

[Passage quoted, Matt. iv. 12-25.]

I have quoted this passage in its entirety, because the prophecy promised that there would be a great light in Galilee, or in the land of Zabulon and Nephthalim, which are the same as Galilee. Now why did He pass most of His life in Galilee of the Gentiles? Surely that He might make a beginning of the calling of the Gentiles, for He called His disciples from thence. Wherefore, shortly after, in the same Gospel you will find that Matthew was called from Galilee, and in another Gospel, Levi also. And Philip, according to John, came from Bethsaida, the city of Andrew and Peter, which was in Galilee. The marriage too, in the same Gospel, was in Cana of Galilee, when the Lord miraculously transformed the water into wine. "There he made a beginning of signs, when also he manifested his glory, and his disciples believed on him." Consider whether this first miracle of our Saviour that took place in Cana of Galilee, of the transformation of the water into wine, is not foretold in the beginning of this prophecy, where it says: "Drink this first. Act quickly, land of Zabulon and Nephthalim, Galilee of the Gentiles." And if this miracle were a sign of the mystic wine, that wine of the faith of the new Covenant that is transformed from bodily joy to a joy of mind and spirit, consider whether this too was not suggested in what follows about Galilee, in the prophecy that the inhabitants of Zabulon and Nephthalim would be the first to come into the presence of Christ, to partake of the draught of Gospel preaching. It says, too, that the spring of their joy will be the shining of a great light, for them who before His Coming sat continually in darkness and the shadow of death.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 8"
