[[commentary]]
quote='''
[Passage quoted, Gen. xxxv. 11.]

As it is quite certain that only one nation, that of the Jews, arose from Jacob, how can this oracle speak truly of a multitude of nations? Since the Christ of God being born of the seed of Jacob brought together many multitudes of nations by His Gospel teaching, in Him and through Him the prophecy has attained its natural fulfilment already, and will attain it still more.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 1"
