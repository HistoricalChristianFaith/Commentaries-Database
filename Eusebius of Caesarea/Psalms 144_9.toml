[[commentary]]
quote='''
But we should also note here the new Covenant, into which the Coming of Christ was about to invite men. And the new Covenant is that which succeeds the old and is given to all nations. And so the oracle before us says, "O God, I will sing a new song to thee."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 9"
