[[commentary]]
quote='''
It is equally clear in its distinction between the angel and the Lord in the account of what happened at the Red Sea, where it says:

"And the angel of the Lord that went before the children of Israel, removed and went behind them; and the pillar of the cloud also removed from before them."

And as in the former passage the Lord is introduced as answering the men of the old time in human form, so also is He here by the cloud. For it is said afterwards:

"And it came to pass in the morning-watch, that the Lord looked upon the camp of the Egyptians in a pillar of fire and cloud. And God answered Moses in the pillar of the cloud through the whole of the wanderings in the wilderness."

So Scripture is quite exact when the nature of an angel is meant, for it calls him neither God nor Lord, but simply Angel. But when it knows that He that appears was Lord and God, it clearly uses those terms.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 11"
