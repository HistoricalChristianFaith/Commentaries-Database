[[commentary]]
quote='''
But with regard to these questions, let men decide them as they will. It is enough for me to repeat again that true and blessed saying, and so conclude my quest, the saying which I have often repeated: "Who shall describe His generation? "For of a truth the generation of the Only-begotten of God is seen to be beyond the reach not only of men, but of the powers that are beyond every being, as also our Lord and Saviour Himself says in mystic language this very thing to His own disciples. "No one knows the Father save the Son." To which he adds "and no one knows the Son save the Father." Since then the theology both of the Father and of the Son is equally unknown to all but Themselves, let us heed Wisdom speaking as it were in secrets in the passage of Solomon set before us: "Before the mountains were established, and the earth formed, and before all the hills he begets me." And also He says that He was present with the Father when He formed the Heaven. "For when he formed the heaven, I was present with him." And He reveals the eternity from endless ages of His presence with the Father, where He adds: "I was by him in harmony, I was that in which he delighted, and I daily delighted in his presence." And we must either understand the abysses and founts of waters, the mountains and hills, and the other things which in this place are designated by common words, to refer to the constitution of the Universe, referring to the whole by its part, or interpreting more metaphorically, we must transfer the meaning to spiritual essences and divine powers, all of whom the Firstborn Wisdom and the Only-begotten and First-begotten Word of the Father, Whom we call Christ, preceded; so the apostle teaches us, who says, "Christ the power of God and the wisdom of God." And He is called here probably by the Name of Wisdom, as He Who —— the all-wise and prudent plans of the only wise Father . . . .
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 1"
