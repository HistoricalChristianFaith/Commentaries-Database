[[commentary]]
quote='''
And next He adds, "I am poured out like water." This may be said to have been fulfilled outwardly and historically, when One of the soldiers, according to the Evangelist John, "pierced the side "of the Lamb of God "with a spear, and forthwith came there out blood and water." But He rather seems to refer to the dying of His entire spiritual being when He says:

"I am poured out like water, and all my bones are loosened, my heart in the midst of my body is like melting wax. My strength is dried up like a potsherd, and my tongue has cleaved to my throat."

For this is surely a description of a dead body. So, too, He adds, "And thou hast brought me to the dust of death."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
