[[commentary]]
quote='''
And when the prophecy goes on to say, "And I will take away three shepherds in one month," I think that it refers to the three divisions of the ancient leaders of the people of God----the King, the Prophet, and the High-Priest----for by those three shepherds all the affairs of the ancients were managed. But since those three offices were destroyed together in our Saviour's time----(for their king reigned not in accordance with the Law, being a foreigner and not a member of the Jewish race; their high-priest was appointed to his office by the Romans, and did not attain his rank by the order of succession of the tribe, nor according to lawful custom; and their prophets that had ceased until John arose were no longer active among them, but they had instead a wicked false prophet who led the people astray)---- He rightly threatens that He will take away at one time the three offices of grace, that had of old adorned the whole nation with wondrous glory, and says, "And I will take away three shepherds in one month, and my heart shall be sorrowful for them." For which Aquila renders, "And my soul was torn asunder for them," Symmachus, "And my soul perished for them," and Theodotion, "And my soul perished about them." And he gives the reason of the perishing of his soul, saying, "For their souls were hardened to me." Instead of this Aquila has, "For their soul was strong in me"; and Symmachus, "And their soul reached its height in me." And a similar expression to the words, "Their souls are hardened to me," of the Septuagint, is found in Jeremiah as spoken by the Lord, namely:

"I have left my home, I have forsaken my inheritance, I have given my beloved soul into the hand of its enemies. My inheritance has become to me as a lion in a forest, it has opened on me its voice. Is not my beloved now to me as a hyaena's cave? "
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 4"
