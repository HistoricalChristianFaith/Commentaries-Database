[[commentary]]
quote='''
Then after this prophecy about Judas, He proceeds to foretell His own preservation and escape from death, in the words:

"I cried unto God, and the Lord saved me. At evening and morning and at noon I will tell and proclaim, and he shall hear my voice, and shall ransom my soul in peace."

Thus in prayer He speaks of the time before His death during which Judas hatched his treachery against Him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 2"
