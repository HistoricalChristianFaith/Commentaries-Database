[[commentary]]
quote='''
And the fact that He wills it, is the sole cause of all things that exist coming into being and continuing to be. For it comes of His will, and He wills it, because He happens to be good by nature. For nothing else is essential by nature to a good person except to will what is good. And what He wills, He can effect. Wherefore, having both the will and the power, He has ordained for Himself, without let or hindrance, everything beautiful and useful both in the visible and invisible world, making His own Will and Power as it were a kind of material and substratum of the genesis and constitution of the Universe, so that it is no longer reasonable to say that anything that exists must have come from the non-existent, for that which came from the non-existent would not be anything. For how could that which is non-existent cause something else to exist? Everything that has ever existed or now exists derives its being from the One, the only existent and pre-existent Being, Who also said: "I am the existent," because, you will see, as the Only Being, and the Eternal Being, He is Himself the cause of existence to all those to whom He has imparted existence from Himself by His Will and His Power, and gives existence to all things, and their powers and forms, richly and ungrudgingly from Himself.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 1"
