[[commentary]]
quote='''
[Passage quoted, Zech. xiv. 1-10.]

AFTER the first siege of Jerusalem, and its total destruction and desolation by the Babylonians, and after the Return of the Jews from their enemies' land to their own, which came to pass in the time of Cyrus king of Persia, when Jerusalem has just been restored, and the Temple and its Altar renewed by Darius the Persian, the present prophecy foretells a second siege of Jerusalem which is to take place afterwards, which it suffered from the Romans, after its inhabitants had carried through their outrage on our Saviour Jesus Christ. Thus the coming of our Saviour and the events connected therewith are very clearly shewn in this passage—I mean what was done at the time of His Passion, and the siege that came on the Hebrew race directly after, the taking of Jerusalem, the call of the Gentiles also, and the knowledge attained by all nations of the one and only God. But the inspired prophet pathetically bewails the woes of the Jews as those of his own people, and begins his prophecy with a cry against them. He means by "days of the Lord," here as well as in other places, the time of our Lord's presence among men. And he clearly shews how the Lord Himself, as being the true Light, will become some day the maker of His own days, and will shine on all men in the world, all the nations receiving Him and the rays of His light, when all nations are enlightened, according to the words, "I have set Thee for a light to the Gentiles, for a covenant of my race," and the Jewish nation through their unbelief will fall into great trouble.

For such is the meaning of "Behold the days of the Lord come, and thy spoils shall be divided within thee, and I will gather all the Gentiles to Jerusalem to war. And the city shall be taken, the houses plundered, and the women ravished, and half of the city shall go into captivity."

And after the siege of Jerusalem, and the captivity of the Jews which succeeds it, he next adds a prophecy of good things for all: "And the Lord shall be King over all the earth." And again: "There shall be one Lord, and his name one, encircling all the earth and the wilderness."

But who would not be surprised at the fulfilment of a prophecy which revealed that the Jewish people would undergo these sufferings in the days of the Lord? For as soon as Jesus our Lord and Saviour had come and the Jews had outraged Him, everything that had been predicted was fulfilled against them without exception 500 years after the prediction: from the time of Pontius Pilate to the sieges under Nero, Titus and Vespasian they were never free from all kinds of successive calamities, as you may gather from the history of Flavius Josephus. It is probable that half the city at that time perished in the siege, as the prophecy says. And not long after, in the reign of Hadrian, there was another Jewish revolution, and the remaining half of the city was again besieged and driven out, so that from that day to this the whole place has not been trodden by them.

Now if any one supposes that this was fulfilled in the time of Antiochus Epiphanes, let him inquire if the rest of the prophecy can be referred to the times of Antiochus —I mean the captivity undergone by the people, the standing of the Lord's feet on the Mount of Olives, and whether the Lord became King of all the earth in that day, and whether the name of the Lord encircled the whole earth and the desert during the reign of Antiochus. And how can the fulfilment of the remainder of the prophecy in the days of Antiochus be asserted? But, according to my interpretation, they are fulfilled both literally and also in another sense. For after the coming of our Saviour Jesus Christ, their city, Jerusalem itself, and the whole system and institutions of the Mosaic worship were destroyed; and at once they underwent captivity in mind as well as body, in refusing to accept the Saviour and Ransomer of the souls of men, Him Who came to preach release to those enslaved by evil daemons, and giving of sight to those blind in mind. And while they suffered through their unbelief, those of them who recognized their Ransomer became His own disciples, apostles and evangelists, and many others of the Jews believed on Him, of whom the apostle says, "So also now there is a remnant according to the election of grace." And "If the Lord of Sabaoth had not left unto us a seed we should have been as Sodom, and we should have been like unto Gomorra." They were preserved safe from the metaphorical siege, and also from the siege literally understood. For the apostles and disciples of our Saviour, and all the Jews that believed on Him, being far from the land of Judaea, and scattered among the other nations, were enabled at that time to escape the ruin of the inhabitants of Jerusalem. And the prophecy anticipated and foretold this where it said, "And the remnant of my people shall not be utterly destroyed." To which it adds afterwards, "And the Lord shall go forth, and shall fight for those nations, as a day of his battle in the day of war." For which nations will the Lord fight, but for those that shall besiege Jerusalem? The passage shews that the Lord Himself will fight for the besiegers, being among them and drawn up with them, like their general and commander warring against Jerusalem. For it does not say that the Lord will fight against the nations. With whom and against whom, then, will He fight? Surely against Jerusalem and her inhabitants, concerning whom it is spoken.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 18"
