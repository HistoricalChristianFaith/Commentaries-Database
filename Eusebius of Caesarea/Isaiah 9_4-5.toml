[[commentary]]
quote='''
And we should also recognize that He says there will be another reason for their joy, viz.: their relief from the external yoke of the law, that of old was laid on them, which neither they nor their fathers were able to bear. And not only was this yoke removed from them, but the rod of the exactors which before pressed on their neck. He shews who the exactors are in another passage, where He says: "My people, your factors take your corn, and the exactors rule over you." But these men of Zabulon and Nephthalim will rejoice having seen the great light for these reasons, and they who exacted of them of old will be required to repay even to the last farthing, and repaying every garment and vestment they will be burned with fire in the day of retribution.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 8"
