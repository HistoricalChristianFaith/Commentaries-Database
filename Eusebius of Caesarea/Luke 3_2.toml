[[commentary]]
quote='''
And you may see better the meaning of the words, "And there is no judgment in it," if you consider the haphazard appointments of the high-priests after Herod's time and in the time of our Saviour. For whereas by the divine Law it was ordained that a high-priest should hold office all his life and be succeeded by his legitimate son, in the period in question, when the Unction had been cast out as the prophecy foretold, Herod first, and after him the Romans, appointed what high-priests they liked haphazard or not according to the Law, bestowing the dignity on common and unknown men, selling and peddling the office, giving it now to one now to another for a year. And the Evangelist St. Luke seems to imply this, where he says, "In the fifteenth year of the reign of Tiberius Caesar, Pontius Pilate being governor of Judaea, and Herod, Philip and Lysanias being tetrarchs, Annas and Caiaphas being high-priests." For how could they both be high-priest at the same time unless the rules of the high-priesthood were disregarded? "In witness whereof Josephus writes:

"Valerius Gratus the Roman General, after closing the high-priesthood of Ananus, appointed Ismael the son of Pheba, and removing him shortly afterwards appointed Eleazar son of Ananus the high-priest. A year later he removed him, and gave the office to Simon son of Cathimus. He did not remain high priest more than a year, when Josephus, son of Caiaphas, took his place."

I was obliged to give this quotation because of the words "The Unction shall be cast out, and there is no judgment in it,'' which seem to me proved by it beyond any doubt.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 2"
