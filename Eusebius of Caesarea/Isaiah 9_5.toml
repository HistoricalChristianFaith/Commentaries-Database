[[commentary]]
quote='''
And that which follows I leave you to consider by yourself, only remarking that this Being Who is called Eternal Father, and Prince of Endless Peace, and Angel of Great Counsel is prophesied of as being begotten and becoming a child, and on His birth among men wills that they shall be burnt with fire who grudge the salvation He wins for the Gentiles, be they evil daemons, or be they wicked men, of whom He says, "That every garment and raiment wrought by guile, they will repay with interest." And who can these be, but those of whom it was elsewhere spoken in the person of our Saviour, "They parted my garments among them, and upon my vesture did they cast lots "? And they who are partakers of their sin, who will also desire, when they shall see their own judgment at some future time, that they had been burnt with fire before they sinned, before the Angel of Great Counsel had been sinned against by them?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
