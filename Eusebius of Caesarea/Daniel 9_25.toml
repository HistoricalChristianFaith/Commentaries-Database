[[commentary]]
quote='''
So when the aforesaid Angel had given this summary prediction to the prophet, he again returns to the subject of the seventy weeks, explaining accurately and in detail at what point the weeks must begin to be counted, and what will happen at the time said. He therefore says: "And thou shalt know and understand, that from the going forth of the command for the answer and for the building of Jerusalem shall be seven weeks and sixty-two weeks, and then it shall return, and the street and wall shall be built." And with regard to this I think it right not to leave unknown the studies of a predecessor on this subject, but to quote from them as suitable to my readers. For it is a good saying that "the goods of friends are common." And as it is right to use what others have expressed well in a right spirit, and not to deprive fathers of their children, or the first begetters of their own offspring, I will quote his exact words. This extract from Africanus is to be found in the Fifth Book of his Chronography, and it runs as follows:

"The section thus expressed gives much strange information. But here I will make the necessary examination of the times and the matters connected with them. It is clear, then, that the coming of the Christ is foretold as to occur after seventy weeks. For in the time of our Saviour, or after His time, sins are done away and transgressions ended. And by this remission iniquities are blotted out by a propitiation together with unrighteousness, eternal righteousness is published beyond that of the law, visions and prophecies (last) until John, and the Holy of holies is anointed. For these things existed in expectation only before our Saviour's Coming. And the angel explains we must count the numbers, that is to say the seventy weeks, which are 490 years, from the going forth of the word of answer and from the building of Jerusalem. This took place in the twentieth year of Artaxerxes, King of Persia. For Nehemiah his cup-bearer made the request, and received the answer that Jerusalem should be rebuilt, and the order went forth to carry it out. For till that date the city lay desolate. For when Cyrus after the seventieth year of the Captivity spontaneously allowed every one who wished to return, those with Joshua the High Priest and Zerubbabel went back, and those afterwards with Ezra, and were at first prevented from building the Temple, and the wall of the City, as no order had been given for it; and so there was a delay until Nehemiah and the reign of Artaxerxes and the one hundred and fifteenth year of the Persian Empire. And this was 185 years from the taking of Jerusalem. It was then that King Artaxerxes gave the order for it to be built. And Nehemiah was sent to take charge of the work, and the street and wall were built, as it had been prophesied. And from that date to the coming of Christ is seventy weeks. For if we begin to count from any other point but this, not only the dates will not agree, but many absurdities arise. If, for instance, we begin counting the seventy weeks from Cyrus and the first Mission, the period will be too long by more than a century, if from the day the angel prophesied to Daniel still longer, and longer still if we start from the beginning of the Captivity. For we find the length of the Persian Empire to be 230 years, and of the Macedonian 300, and from then to the sixteenth year of Tiberius Caesar 60 years. And from Artaxerxes to the time of Christ seventy weeks are completed according to Jewish reckoning. For from Nehemiah, who was sent by Artaxerxes to rebuild Jerusalem, in the one hundred and fifteenth year of the Persian Empire, and in the twentieth year of Artaxerxes, and in the fourth year of the eighty-third Olympiad up to that date, which was the second year of the two hundred and second Olympiad, and the sixteenth year of the reign of Tiberius Caesar, there are 475 years, or 490 according to Hebrew reckoning. For they reckon years by the course of the moon, I ought to tell you, counting 354 days, while the course of the sun is 365 ¼ days, twelve lunar revolutions, being exceeded by one solar by 11¼ days. Therefore the Greeks and the Jews add three intercalary months to every eighth year. For eight times 11¼ days makes three months. So then 465 years, in eight-year cycles, makes fifty-nine years and three months. Since adding the three intercalary months every eighth year, we have a few days short of fifteen years. And these added to the 475 years complete the seventy weeks."

This, then, is from Africanus. And if I may make an apposite comment myself on the passage, I would say that the prophecy does not make the division of the seventy weeks without an object or haphazard. For having divided them into the first seven, and another sixty-two, it adds the last one after a quantity of intermediate matter, and thus determines the number of seventy weeks. And so it says, "And thou shalt know and understand from the going out of the word of answering and of building Jerusalem until Christ the governor there are seven weeks and sixty-two weeks." Then having interposed other matter, it adds the last saying, "And He shall make a covenant with many one week." I do not think that any one who regards these as the words of God, can suppose that these statements have no object, or are scattered without the divine intention. I thought it was right first to draw attention to this, and then to give a more elaborate solution of the problem to my readers. And if I must reveal what is in my mind, I would say that according to another meaning or interpretation, he that is called in the preceding extract "Christ the governor" (viz. "From the going forth of the word of answering and the building of Jerusalem until Christ the governor"), is none other than the roll of the high priests who governed the people after the prophecy and the Return from Babylon, whom Scripture commonly calls Christs. For I have shewn that they were the only governors of the nation, beginning with Joshua, son of Josedec, the Great Priest, after the return from Babylon, and up to the date of the Coming of our Saviour Jesus Christ. For I think that the fact that the intermediate period of their primacy, during which they governed, is meant, is shewn by the words, "From the going forth of the answering and the building of Jerusalem, until Christ the governor, is seven weeks and sixty-two weeks." And the weeks of years make 483 years added together from the reign of Cyrus up to the Roman Empire, when Pompeius the Roman general attacked Jerusalem and took the city by siege, and the whole city became subject to Rome, so that thenceforward it paid taxes, and obeyed the Roman enactments.

At this period, then, is concluded the 483 years, when they came to an end who held, according to the Mosaic Law, the primacy of the nation, and the priesthood, whom I understand the Holy Scriptures to call here "Christ the governor." And if it be necessary to publish a roll of the succession of the high priests who held office during this intermediate period, I have no objection so to do in confirmation of my statements. First, then, after Daniel's prophecy, in the reign of Cyrus, King of Persia, after the Return from Babylon, came Joshua son of Josedec, called the Great Priest, with Zerubbabel from captivity, and laid the foundations of the Temple, but since he was hindered in the work by the neighbours, the first seven weeks of years named by the prophet came to an end, during which the building of the Temple remained unfinished. This is why the divine word separates the first seven from the remaining weeks, saying seven weeks, and then after an interval adding, and sixty-two weeks. For from Cyrus to the completion of the building of the Temple are seven weeks of years. Hence the Jews attacking our Saviour said, "Forty and six years was this Temple in building, and wilt thou raise it up in three days?'' These men, you say, said that the Temple was built in forty-six years. So they reckoned from the reign of Cyrus first, who first permitted those of the Jews who wished to go up to their own land, to the sixth year of King Darius, in whose reign the Temple was finally completed. But Josephus, a Jewish author, says that three more years were spent in completing the surrounding outside buildings, so that it seems probable that the seven first weeks were divided in the prophet's words into nine years and forty years, and that the remaining sixty-two were counted from the reign of Darius, in whose time Joshua, son of Josedec, and Zerubbabel, son of Salathiel, who were still alive, were both at the head of the rebuilding of the Temple, when Haggai and Zechariah were prophets, after whom Ezra and Nehemiah, who also came up from Babylon, built the wall of the city, when Joiachim was high priest. He was son of Joshua, son of Josedec, and Eliashib succeeded him in the high-priesthood, then Joiada, after him Jonathan, and after him Jaddua. The books of Ezra record them, saying, "And Jeshua begat Joiakim, Joiakim begat Eliashib, and Eliashib begat Joiada, and Joiada begat Jonathan, and Jonathan begat Jaddua."

In the time of this Jaddua, Alexander of Macedon conquered Alexandria, and, as Josephus relates, came to Jerusalem and worshipped God. And Alexander died at the beginning of the 114th Olympiad, 236 years after Cyrus, who began to rule over the Persians in the first year of the fifty-fifth Olympiad.

Now after the death of Alexander of Macedon, and after the said High Priest, Onias ruled the nation, also enjoying the high-priestly office: in whose day Seleucus conquered Babylon and put on the crown of Asia, twelve years after Alexander's death, and the whole period from him to Cyrus is 248 years From that point the Book of Maccabees begins to count the years of the Hellenic Empire. And after Onias, the High Priest Eleazar ruled the Jews, in whose time the Seventy translated the Holy Scriptures and deposited them in the Library of Alexandria. And after him a second Onias, followed by Simon, in whose day flourished Jesus, son of Sirach, who wrote the excellent book called Wisdom. After him a third Onias ruled, in whose time Antiochus besieged the Jews and compelled them to hellenize. After whom Judas, called the Maccabee, was at the head of the State, and cleansed the land of the unholy, being succeeded by his brother Jonathan. And then Simon, to whose death the First Book of Maccabees reckons 177 years from the beginning of the Syrian rule, and ends its history at that date. So that the period from the first year of Cyrus and the Persian Empire up to the end of the record of the Maccabees and the death of Simon is 425 years. And then Jonathan held the high-priesthood, according to Josephus, for twenty-nine years. After him Aristobulus ruled for a year, who was the first to assume the royal diadem besides the high-priesthood after the return from Babylon. Alexander succeeded him, as both king and high priest, and was at the head of the State for twenty-seven years. To whose date is comprised in all, from the first year of the reign of Cyrus and from the return of the Jews from Babylon, 482 years, in which period the high priests ruled, who I believe are called in the prophecy "Christs and governors." After whom, when the last of them the High Priest Alexander died, the State of the Jews was left without king or leader, so that the kingdom came to a woman. And when her two sons, Aristobulus and Hyrcanus, were quarrelling with each other, Pompey, the Roman general, attacked Jerusalem, and took the city by siege, defiled its holy places, and even entered the Holiest of all. And this came to pass in the first year of the 179th Olympiad, 495 years after the empire of Cyrus, who began to rule in the fifty-fifth Olympiad. And Pompey, then, having taken Jerusalem by force, sent the before-named Aristobulus a prisoner to Rome, bestowing the High-Priesthood on his brother Hyrcanus, and the whole nation was from that date subject to Rome. Then after this, Herod, the son of Antipater, destroyed Hyrcanus, and was entrusted with the Jewish kingdom by the Roman senate, being the first ruler of a foreign stock, and he destroyed the order of the Mosaic High-Priesthood. For the divine Law ordained that the most high high-priest should hold office for life; but Herod preferred to the office men who were not of the priestly tribe nor otherwise suitable, who were alien and strange to the priestly line of succession, and he gave the position not even to them for life, but only for a short and limited time, sometimes to one, sometimes to another; so that the first seven weeks must be reckoned from Cyrus to Darius, and the remaining sixty-two from Darius to Pompey the Roman general.

And if you reckon the period of the seven and sixty-two weeks in another way a third time, they will comprise 483 years, up to Augustus and Herod, the first king of foreign stock, in whose reign the Birth of our Saviour Jesus Christ is recorded to have occurred, if you begin to reckon from Darius and the completion of the Temple. For the prophet Zechariah shews that the seventy years of the Desolation of Jerusalem were completed in the second year of Darius, when he says: "On the twenty-fourth day of the eleventh month (this is the Sabbath), in the second year of Darius, the word of the Lord came to Zechariah son of Barachiah." And then he adds, "And the Angel of the Lord answered, and said, O Almighty Lord, how long wilt thou not pity Jerusalem, and the cities of Judah, which thou hast despised these seventy years past?"

This, then, was the very time that Daniel, inspired by the divine spirit, marked when he said, "I Daniel understood in the books the number of the years, what was the word of the Lord to Jeremiah the prophet, for the fulfilment of the desolation of Jerusalem seventy years, and I turned my face to the Lord my God, to present my prayer and petition." Then after his prayer the Angel prophesied to him of the seventy weeks, and told him at what point to begin to reckon the time, saying, "And thou shalt know and understand from the going forth of the word of answering and from the building of Jerusalem until Christ the governor." The first answer allowing Jerusalem to be rebuilt was of course that of Cyrus, but it did not take effect, because the neighbours interfered. But when Darius gave his order afterwards, and the building of the Temple was also completed in his reign, from that date began to be fulfilled the prophecy of Daniel, which said, "From the going forth of the word of answering and from the building of Jerusalem," and that which said, "I Daniel understood in the books the number of the years, which was the word of the Lord to Jeremiah the prophet, for the fulfilment of the desolation of Jerusalem seventy years." The completion of the period of seventy years is therefore shewn to have been reached in the second year of Darius, so that we must anyway reckon the seventy weeks from the sixty-sixth Olympiad, and from the second year of Darius, in which the building was completed. And if you reckon the succeeding period from that date up to King Herod and the Roman Emperor Augustus, in whose times our Saviour was born on earth, you will find it amounts to 483 years, which are the seven and sixty-two weeks of the prophecy of Daniel. From the sixty-sixth Olympiad to the 186th Olympiad there are 121 Olympiads, or 484 years, an Olympiad consisting of four years, during which time Augustus the Roman Emperor, in the fifteenth year of his reign, gained the kingdom of Egypt and of the whole world, under whom Herod was the first foreigner to ascend the Jewish throne, and our Lord and Saviour Jesus Christ was born, the time of His birth synchronizing with the fulfilment of the seven and sixty-two weeks of Daniel's prophecy.
'''
