[[commentary]]
quote='''
This new song is called by Jeremiah, another Hebrew prophet, "a new covenant"where he says:

"31. Behold the days come, saith the Lord, when I will make a new covenant with the house of Israel, and with the house of Juda: 32. not according to the covenant that I made with their fathers, in the day that I took them by the hand to lead them out of the land of Egypt: for they abode not in my covenant, and I disregarded them, saith the Lord. 33. For this is my, covenant which I will make with the house of Israel, saith the Lord, I will put my laws in their minds, and on their hearts I will write (them), and I will be their God, and they shall be my people."

You see here that he distinguishes two covenants, the old and the new, and says that the new would not be like the old which was given to the fathers. For the old covenant was given as a law to the Jews, when they had fallen from the religion of their forefathers, and had embraced the manners and life of the Egyptians, and had declined to the errors of polytheism, and the idolatrous superstitions of the Gentiles. It was intended to raise up the fallen, and to set on their feet those who were lying on their faces, by suitable teaching.

"For the law, it is said, is not for the righteous, but for the unjust and disorderly, for the unrighteous and for sinners, and for those like them."

But the new covenant leads those who, through our Saviour by the grace and gift of God are raised up, to a rapid march into the kingdom promised by God. It summons all men equally to share together the same good things.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 4"

[[commentary]]
quote='''
And we heard just now what the ordinances of the prophet were, which we must obey, their wisdom, perfection and heavenliness, which he thought fit to inscribe, not on tables of stone like Moses, nor yet with ink and parchment, but on the hearts of his pupils, purified and open to reason. On them he wrote the laws of the new covenant, and actually fulfilled the prophecy of Jeremiah.

"I will make a new covenant, not according to the covenant which I made with their fathers. For this is the covenant which I will make with the house of Israel, I will give my laws into their mind, and upon their heart I will write them, and I will be their God, and they shall be my people.

THE one wrote on lifeless tables, the Other wrote the perfect commandments of the new covenant on living minds.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapters 7-8"
