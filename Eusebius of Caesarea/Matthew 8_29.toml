[[commentary]]
quote='''
Who does not know how we love by the mere Name of Jesus and the purest prayers to drive away all the work of the daemons? The mere word of Jesus and His teaching has made us all far stronger than this invisible Power, and has trained us to be enemies and foes of daemons, not their friends or associates, and certainly not their slaves and tributaries. And how could He Who has led us on to this, Himself be the slave of the daemons? How could He sacrifice to evil spirits? Or how could He have invoked the daemons to aid Him in His Miracles, when even to-day every daemon and unclean spirit shudders at the Name of Jesus as at something that is likely to punish and torment its own nature, and so departs and yields to the power of His Name alone? So was it of old in the days when He sojourned in this life: they could not bear His Presence, but cried, one from, one side and one from another: "Come, what have we to do with thee, Jesus, Son of God? Art thou come to torment us before the time?"
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 6"
