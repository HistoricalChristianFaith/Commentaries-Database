
[[commentary]]
quote='''
So, again, whereas the teaching of the Gospel says:

"43. It was said to them of old time, Thou shalt love thy neighbour and hate thine enemy. But I say unto you, Love your enemies": Job wonderfully anticipating the command by his own original teaching actually carried it out, for he says:

"29. And if I, too, was glad at the fall of my enemies, and said in my heart, It is well—30. then let my ear hear my curse."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"
