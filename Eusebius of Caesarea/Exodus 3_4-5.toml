[[commentary]]
quote='''
[Passage quoted, Josh. v. 13-15.]

THE same words, you will remember, were said by the same Lord to Moses at the beginning of the vision of the Bush, for Scripture says:

"4. And when the Lord saw that he drew nigh to see, He called him from the midst of the Bush, saying, Moses, Moses, come not near here; loose thy shoes from off thy feet, for the place whereon thou standest is holy ground."

So, then, the command that was given shews that the God Who answered on both occasions was one and the same. Though here He prophesies through the Chief and Captain of His power, and to Moses by the vision of the angel.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 19"
