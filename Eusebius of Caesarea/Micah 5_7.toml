[[commentary]]
quote='''
"2. And thou Bethlehem, house of Ephratha, art the least among the thousands of Juda. Out of thee shall come forth my leader, to be for a prince to Israel, and his goings forth from the beginning are from the days of eternity. 3. Therefore shall he give them until the time of her that brings forth. She shall bring forth, and the remainder of their brethren shall turn."

And after a little he adds :

"7. And the remnant of Jacob shall be among the nations, in the midst of many peoples, as dew falling from the Lord, and as lambs on the pasture; that none may assemble or resist among the sons of men. 8. And the remnant of Jacob shall be among the nations in the midst of many peoples, as a lion among cattle in the forest, and as a lion's whelp in the pastures of sheep : as when he goes through and chooses and carries off, and there is none to deliver. 9. Thine hand shall be exalted against them that afflict thee, and all thine enemies shall be utterly destroyed."

Nothing surely could be more clear than this; at one and the same time it proclaims the birth of the Saviour at Bethlehem, and His existence before eternity, His Birth of the Virgin, the call of His apostles and disciples, and their preaching of the Christ carried throughout all the world. For when this Ruler, Whose goings forth the Scripture says are from eternity, shall have gone forth from Bethlehem, and when the holy maiden who was to bear Him shall have brought Him forth, it does not say that all they of the Circumcision will be saved, but only they that are left, who will be also a remnant of Jacob, and will be given as dew to all the Gentiles. For the remnant of Jacob, he says, shall be among the nations, as dew falling from the Lord, and as lambs in a pasture. Instead of which Aquila translates, "as drops on the grass," and Theodotion, "as snow on grass." And again, instead of "so that none may assemble or resist among the sons of men, and no son of men attack," Theodotion reads "who shall not wait for man, and shall not hope in the son of man." And Aquila "who shall not await a man, and shall not be concerned with the sons of men."

Through which the whole hope of the apostles of our Saviour is [shown to be] not in man, but in their Lord and Saviour, and He was the Word of God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
