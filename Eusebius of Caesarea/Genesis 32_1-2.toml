[[commentary]]
quote='''
But he saw Another, Whose name it was not yet the time to reveal to curious Jacob. And if we were to suppose that he saw an angel, or that one of the divine spirits in heaven whose duty it is to bring oracles to the holy, we should clearly be wrong; firstly, because He is called Lord and God, for certainly Holy Scripture calls him God in distinct terms, and names Him Lord, honouring Him with the name signified by the Tetragram, which the Hebrews only apply to the unspeakable and secret name of God: and secondly, because when Scripture desires to speak of angels, it clearly distinguishes them as such, as when the God and Lord Who replies to Abraham no longer thinks the sinners of Sodom worthy of His presence, and Holy Scripture says:

"And the Lord departed, and ceased speaking with Abraham. And the two angels departed to Sodom at evening."

And to Jacob:

" There came two angels of God: and he saw them, and said, It is the camp of God. And he called the name of that place, Encampments."

Here, then, the godly man clearly distinguished the nature of the visions, since he now called the name of the place Encampments, from his seeing the encampments of the angels. Whereas when he communes with God, he calls the name of the place, Sight of God, adding, "For I have seen God face to face."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 11"
