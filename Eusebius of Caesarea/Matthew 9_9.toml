[[commentary]]
quote='''
The Apostle Matthew, if you consider his former life, did not leave a holy occupation, but came from those occupied in tax-gathering and over-reaching one another. None of the evangelists has made this clear, neither his fellow-apostle John, nor Luke, nor Mark, but himself, who brands his own life, and becomes his own accuser. Listen how he dwells emphatically on his own name in the Gospel written by him, when he speaks in this way:

"9. And as Jesus passed by from thence, he saw a man, called Matthew, sitting at the place of toll, and he saith unto him, Follow me. And he arose, and followed him. 10. And it came to pass, as he sat at meat in the house, behold, many publicans and sinners came and sat down with Jesus and his disciples."

And again further on, when he gives a list of the disciples, he adds the name "Publican" to his own. For he says:

"Of the twelve apostles the names are these: First, Simon, called Peter, and Andrew his brother; James the son of Zebedee, and John his brother; Philip and Bartholomew; Thomas, and Matthew the publican."

Thus Matthew, in excess of modesty, reveals the nature of his own old life, and calls himself a publican, he does not conceal his former mode of life, and in addition to this he places himself second after his yoke-fellow. For he is paired with Thomas, Peter with Andrew, James with John, and Philip with Bartholomew, and he puts Thomas before himself, preferring his fellow-apostle to himself, while the other evangelists have done the reverse. If you listen to Luke, you will not hear him calling Matthew a publican, nor subordinating him to Thomas, for he knows him to be the greater, and puts him first and Thomas second. Mark has done the same. Luke's words are as follows:

"And when it was day, he called his disciples unto him, and chose twelve whom he also named apostles, Simon whom he also called Peter, and Andrew his brother, James and John, and Philip and Bartholomew, Matthew and Thomas."

So Luke honoured Matthew, according to what they delivered, who from the beginning were eye-witnesses and ministers of the word.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 5"
