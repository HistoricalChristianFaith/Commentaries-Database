[[commentary]]
quote='''
But moreover, according to what was previously said, the same David in Ps. xliv., using as inscription the words "Concerning the beloved, and those to be changed," speaks of one and the same Being as God and King and Christ, writing thus:

" 1. My heart has uttered a good matter: I declare my works to the King: My tongue is the pen of a ready writer, 2. Thou art more beautiful than the sons of men."

To which he adds:

" 6. Thy throne, O God, is for ever and ever, a sceptre of righteousness is the sceptre of thy kingdom: 7. Thou hast loved righteousness and hated iniquity, wherefore God, even thy God, hath anointed thee with the oil of gladness above thy fellows."

Now look a little more carefully, and see how in the inscription of the Psalm he prefaces that the subject is " concerning the beloved," adding the words "for instruction" to prepare the hearers for what he is about to say. He shews also the reason of the Incarnation of the Word, with the words:

" For the end, for the changed, with a view to understanding, for the beloved."

And whom could you better regard as "those to be changed," for whom the Psalm is spoken, than those who are going to be changed from their former life and conversation, to be transformed and altered by Him Whom the prophecy concerns? And this was the beloved of God, on whose behalf the Psalm's preface advises us to have understanding with regard to the prophecy. And if you were at a loss about the Person of this Beloved One, with whom the prophecy in the Psalm is concerned, the word that faces you at the very beginning will inform you, which says: "My heart hath produced a good word." It may surely be said that by this is meant the Word that was in the beginning with God, Whom the great Evangelist John shewed forth as God, saying: "In the beginning was the Word, and the Word was with God, and the Word was God." And the words, "My heart hath produced a good word," if it be spoken in the person of the Supreme God and Father, would suggest the Only-begotten Word of God, as being the Son of the Father, not by projection, nor by division, or scission, or diminution, or any conceivable mode of bodily birth; for such ideas are blasphemous, and very remote from the ineffable generation. And we must understand this according to our previous interpretation; as when it was said that He was born from the womb of God before the Morning Star, and we understood it figuratively, so we must understand this similar statement only in a spiritual sense. For in the words "My heart has produced a good word," the Holy Spirit inspires this saying also as purely spiritual. To which it seems right forme to add what I am accustomed to quote in every question that is debated about His Godhead, that reverent saying: "Who shall declare his generation?" even if the holy Scriptures are wont in our human and earthly language to speak of His Birth, and use the word "womb."

For such expressions are connected with mental imagery alone, and are accordingly subject to the laws of metaphor. And so the words, "My heart hast produced a good word," may be explained as referring to the constitution and coming into being of the primal Word, since it would not be right to suppose any heart, save one that we can understand to be spiritual, to exist in the case of the Supreme God.

One might also say that the Psalmist referred to "the Word that was in the beginning with God, "a Word rightly named "good" as being the offspring of a Father All-Good.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 15"
