[[commentary]]
quote='''
[Passage quoted, Ps. xc. 9-13.]

THESE are the words that the devil uses in the Temptation of our Saviour. Notice, then, how the Psalm says to the Lord Himself: "For thou, O Lord my hope, hast made the Most High thy refuge.'' For Thou Thyself, he says, my hope, O Lord, hast made thy refuge One greater than Thyself, God Himself the Most Highest over all and Thine own Father; wherefore evils shall not come upon Thee, and no scourge shall come nigh Thy dwelling. And although wicked men attempt to scourge Thee, when Thou shalt become man, and to put Thee to death, yet for all that the scourge of God shall not come nigh Thy dwelling, that is Thy body, which Thou shalt wear for our sakes having become man. In the same way you will refer to Him all the remainder of the Psalm, which I will consider also in its fit place.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 21"
