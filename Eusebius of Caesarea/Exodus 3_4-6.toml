[[commentary]]
quote='''
Joshua, also, the successor of Moses, calls him, as leader of the heavenly angels and archangels and of the supramundane powers, and as lieutenant of the Father, entrusted with the second rank of sovereignty and rule over all, "captain of the host of the Lord," although he saw him not otherwise than again in the form and appearance of a man. For it is written:

"And it came to pass when Joshua was at Jericho that he looked and saw a man standing over against him with his sword drawn in his hand, and Joshua went unto him and said, Art thou for us or for our adversaries? And he said unto him, As captain of the host of the Lord am I now come. And Joshua fell on his face to the earth and said unto him, Lord, what dost thou command thy servant? and the captain of the Lord said unto Joshua, Loose thy shoe from off thy feet, for the place whereon thou standest is holy."

You will perceive also from the same words that this was no other than he who talked with Moses. For the Scripture says in the same words and with reference to the same one, "When the Lord saw that he drew near to see, the Lord called to him out of the bush and said, Moses, Moses. And he said, What is it? And he said, Draw not nigh hither; loose thy shoe from off thy feet, for the place whereon thou standest is holy ground. And he said unto him, I am the God of thy fathers, the God of Abraham, and the God of Isaac, and the God of Jacob."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25201.html"
source_title="Church History, Book 1, Chapter 2"
