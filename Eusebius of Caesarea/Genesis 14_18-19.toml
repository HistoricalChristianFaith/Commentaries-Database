[[commentary]]
quote='''
The law and life of our Saviour Jesus Christ shows itself to be such, being a renewal of the ancient pre-Mosaic religion, in which Abraham, the friend of God, and his forefathers are shown to have lived. And if you cared to compare the life of Christians and the worship introduced among all nations by Christ with the lives of the men who with Abraham are witnessed to by Scripture as holy and righteous, you would find one and the same ideal. For they too turned their backs on the errors of polytheism, they relinquished idolatrous superstition, they looked beyond the whole of the visible creation and deified neither sun nor moon, nor any part of the whole. They raised themselves to the Supreme God, Himself the Highest, the Creator of heaven and earth. And Moses himself bears this out in his history of ancient times when he records Abraham's saying:

"I will stretch forth my hand unto God most high, who hath created the heaven and the earth."

And when, before this, he introduces Melchizedek, whom he calls the priest of the Most High God, blessing Abraham as follows:

"Blessed be Abraham by God most high, who hath created the heaven and the earth."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 5"

[[commentary]]
quote='''
JUST as a life of virtue and a system of holiness is through the teaching of Christ preached to all nations without any reference to the Mosaic legislation, so by these men of old time the same independent ideal of holiness was upheld. They cared nothing for circumcision, nor do we. They did not abstain from eating certain beasts, neither do we. For instance, Moses introduces Melchizedek, priest of the Most High God, uncircumcised, not anointed with prepared ointment according to Moses, knowing naught of the Sabbath, paying no heed whatever to the commandments afterwards given by Moses to the whole Jewish race, but living exactly according to the Gospel of Christ. And yet Moses says he was the priest of the Most High God, and the superior of Abraham. For he is introduced as blessing Abraham.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"

[[commentary]]
quote='''
"For the Lord sware," he said, "and will not repent, Thou art a priest after the order of Melchizedek." For as Moses relates that this Melchizedek was priest of the Most High God, not anointed with a prepared unguent, since he was priest of the Most High God long before the Institution of the Law, and far above the famous Abraham in virtue—for he says, "And Melchizedek, King of Salem, Priest of the Most High God, blessed Abraham." "And without any contradiction," says the apostle, "the less is blessed by the greater." As therefore, Melchizedek, whoever he was, is introduced as one who acts as priest to the Most High God, without having been anointed with a prepared unguent, He that is prophesied of by David as of the order of Melchizedek. is also spoken of as a great Being surpassing everyone in nature, as being Priest of the supreme God, and sharing the throne of His unbegotten power, and as the Lord of the prophet; and He is not simply "priest," but "eternal priest of the Father."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 15"

[[commentary]]
quote='''
But he that is named Melchizedek, which in Greek is translated "king of righteousness," who was king of Salem, which would mean "king of peace," without father, without mother, without line of descent, not having, according to the account, "beginning of years, nor end of life," had no characteristics shared by the Aaronic priesthood. For he was not chosen by men, he was not anointed with prepared oil, he was not of the tribe of those who had not yet been born; and strangest of all, he was not even circumcised in his flesh, and yet he blesses Abraham, as if he were far better than he; he did not act as priest to the Most High God with sacrifices and libations, nor did he minister at the Temple in Jerusalem. How could he? it did not yet exist. And he was such of course because there was going to be no similarity between our Saviour Christ and Aaron, for He was neither to be designated priest after a period when He was not priest, nor was He to become priest, but be it. For we should notice carefully in the words, "Thou art a priest for ever," He does not say, "Thou shalt be what thou wert not before," any more than, "Thou wert that before, which thou art not now"—but by Him Who said, "I am that I am," it is said, "Thou art, and remainest, a priest for ever."

Since, then, Christ neither entered on His priesthood in time, nor sprang from the priestly tribe, nor was anointed with prepared and outward oil, nor will ever reach the end of His priesthood, nor will be established only for the Jews but for all nations, for all these reasons He is rightly said to have forsaken the priesthood after Aaron's type, and to be a priest after the order of Melchizedek. And the fulfilment of the oracle is truly wondrous, to one who recognizes how our Saviour Jesus the Christ of God even now performs through His ministers even to-day sacrifices after the manner of Melchizedek's. For just as he, who was priest of the Gentiles, is not represented as offering outward sacrifices, but as blessing Abraham only with wine and bread, in exactly the same way our Lord and Saviour Himself first, and then all His priests among all nations, perform the spiritual sacrifice according to the customs of the Church, and with wine and bread darkly express the mysteries of His Body and saving Blood. This by the Holy Spirit Melchizedek foresaw, and used the figures of what was to come, as the Scripture of Moses witnesses, when it says:

"And Melchizedek, king of Salem, brought out bread and wine: and he was priest of the Most High God, and he blessed Abraham."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 3"
