[[commentary]]
quote='''
"Sion shall be ploughed as a field, and Jerusalem shall be as a granary, and the mount of the house as a grove of the wood."

Sion and Jerusalem and the so-called "mount of the house" are what were represented before in, "And the mountains shall be shaken from beneath him, and the valleys shall be melted as wax before the fire for the iniquity of Jacob." For the mountains and the dwellers thereon were besieged for the iniquity they had wrought against Him soon and not long after Mount Sion was burned and left utterly desolate, and the Mount of the House of God became as a grove of the wood.

If our own observation has any value, we have seen in our own time Sion once so famous ploughed with yokes of oxen by the Romans and utterly devastated, and Jerusalem, as the oracle says, deserted like a lodge. And this has come to pass precisely because of their impieties, for the sake of which the Heavenly Word has come forth from His own place.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 13"

[[commentary]]
quote='''
Therefore, it says this, "Zion shall be plowed as a field, and Jerusalem shall be as a storehouse of fruit," a prophecy which was only actually fulfilled after the impious treatment of our Saviour. For from that time to this utter desolation has possessed the land; their once famous Mount Sion, instead of being, as once it was, the centre of study and education based on the divine prophecies, which the children of the Hebrews of old, their godly prophets, priests and national teachers loved to interpret, is a Roman farm like the rest of the country, yea, with my own eyes I have seen the bulls plowing there, and the sacred site sown with seed. And Jerusalem itself is become but a storehouse of its fruit of old days now destroyed, or better, as the Hebrew has it, a stone-quarry.

So Aquila says, "Therefore for your sake the land of Zion shall be ploughed, and Jerusalem shall be a quarry of stone," for being inhabited by men of foreign race it is even now like a quarry, all the inhabitants of the city choosing stores from its ruins as they will for private as well as public buildings. And it is sad for the eyes to see stones from the Temple itself, and from its ancient sanctuary and holy place, used for the building of idol temples, and of theatres for the populace.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 3"
