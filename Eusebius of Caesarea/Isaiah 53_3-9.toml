[[commentary]]
quote='''
Surely, if they predicted His tribe and race and manner of birth, and the miracle of the Virgin, and His manner of life, it was impossible for them to pass over in silence that which followed, namely His Death: and what does Isaiah prophesy about it?

"3. A man" he says "in suffering, and knowing to bear sickness, he was dishonoured and not esteemed. 4. This man bears our sins, and is pained for our sake. And we thought him to be in trouble, in suffering, and in evil; 5. He was wounded for our sins, and bruised for our iniquities. The chastisement of our peace was upon him, and by his stripe we are healed. 6. All we as sheep have gone astray, and the Lord delivered him for our sins, and he because of his affliction opens not his mouth. He was led as a sheep to the slaughter, and as a lamb dumb before her shearers, so he opens not his mouth. 8. Who shall declare his generation? for his life is taken from the earth."

In this he shews that Christ, being apart from all sin, will receive the sins of men on Himself. And therefore He will suffer the penalty of sinners, and will be pained on their behalf; and not on His own. And if He shall be wounded by the strokes of blasphemous words, this also will be the result of our sins. For He is weakened through our sins, so that we, when He had taken on Him our faults and the wounds of our wickedness, might be healed by His stripes. And this is the cause why the Sinless shall suffer among men: and the wonderful prophet, in no way shrinking, clearly rebukes the Jews who plotted his death; and complaining bitterly of this very thing he says: "For the transgressions of my people he was led to death." And then because total destruction overtook them immediately, and not a long time after their evil deed to Christ, when they were besieged by the Romans, he does not pass this over either, but adds: "And I will give the wicked for his tomb, and the rich for his death."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"
