[[commentary]]
quote='''
This was the view of the ancient Greeks, but it does not agree with the Hebrew Scriptures. They record that the first men, as soon as they were created, honoured God with animal sacrifices at the very creation of their life. For they say:

"And it came to pass after some days that Cain brought of the fruits of the earth a sacrifice to the Lord. And Abel also brought of the first-born of his sheep.. . . And God looked upon Abel and his gifts. But Cain and his sacrifices he regarded not."

Here you will understand that he who sacrificed an animal is said to have been more accepted by God than he who brought an offering of the fruits of the earth. Noah again brought to the altar his first-fruits of all clean cattle, and of all clean fowls; Abraham also is described as sacrificing: so that if we accept the evidence of Holy Scripture, the first sacrifices thought of by the ancient men of God were those of animals.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 10"
