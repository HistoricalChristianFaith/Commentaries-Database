[[commentary]]
quote='''
And moreover the prophetic word proceeds to interpret itself:

"And there shall be in that day a root of Jesse, and one arising to rule the Gentiles. In him shall the Gentiles trust, and his rest shall be glory."

Since, then, it had predicted the falling away of the Jewish race in a veiled way, and then the calling of the Gentiles, first in a veiled way and then openly, it is natural for it in returning to the same topic to mention those of the Circumcision who should believe in Christ, that it may not seem to shut them altogether from hope in Christ.

"For there shall be," it says, "one to arise to rule over the Gentiles."

Who could this be Who is to arise, but the root of Jesse, whom it so clearly says is to reign over the Gentiles, but not over Israel? Since then it had taught in various ways of the conversion of the Gentiles consequent upon the birth and growth of Him Who came from the root of Jesse, and had then nothing bright to say of those of the Circumcision, it naturally here supplies the gap in the prediction, saying, "And it shall come to pass in that day," i.e. in the time of him that is born of the root of Jesse, the Lord moreover shall put forth His power, to be jealous for and to seek the remnant remaining of His people that were left of such and such enemies. In place of which Aquila has read :

"And it shall be in that day, the Lord will shew his hand a second time, to possess the remnant of his people, which shall be left by the Assyrians," etc.

And you will understand this, if you consider that the enemies of the people of God are certain intelligent and spiritual beings, either evil daemons, or powers opposed to the word of holiness, who in invisible leadership of the nations named, in days of old laid siege to the souls of Israel, involved them in various passions, seducing them and enslaving them to a life like that of the other nations. When, then, you may almost say that the whole people was taken captive in soul by these powers, they who were kept safe and intact, unwounded and undespoiled according to the prophecy received the message, that they should see the hand of the Lord, and become His possession, according to the words of the oracle, "the Lord will add to shew his hand, to be jealous for the remnant remaining of his people."

But what will the Lord add? Surely to those to whom once long before He had proclaimed by the prophets "the hand of the Lord has been added," yea, to those who are, as it were, preserved in the fall of the whole people He proclaims that He will add what was lacking to the former. And these are the mysteries of the new covenant, shewn by the hand of the Lord to the remnant of the people. But He also says that "He will be jealous of the remnant that is left of the people." Instead of which Aquila and Theodotion agree in reading : "that He must acquire the remnant of His people, whatever is left from the Assyrians, and the other nations that were their enemies."

And this remnant which is left of His people "shall lift up" he says "a standard to the Gentiles." Through them clearly the Lord will shew His sign among all the Gentiles, and through them will gather together the lost of Israel and the scattered abroad of Judah from the four corners of the earth to the Christ of God, who take refuge in Him through the preaching of His apostles, saying that those gathered together come from them who of old were exiled and cut off from the figurative Israel and Judah. The ideals of such souls shew them to be the true Israel of God, for in contrast to them the weak and sinful nature of Israel according to the flesh makes Him prophetically call them : "Rulers of Sodom and people of Gomorrah."

Thus the "remnant according to the election of grace," and that which is called in the prophecy, "the remnant that is left of the people," has proclaimed the sign of the Lord to all the Gentiles, and has joined to God as one people, that is drawn to Him, the souls of the Gentiles that are brought out of destruction to the knowledge of the Lord, a people which from the four corners of the earth even now is welded together by the power of Christ. And these same refugees from the lost race of the Jews, the disciples and apostles of our Saviour belonging to different tribes, thought worthy of one calling, and one grace and one Holy Spirit, will cast away all the love, which the tribes of the Hebrew race had to them, as the prophecy says. Bound together, then, by the same mind and will, they have not only traversed the continent, but the isles of the Gentiles also, making plunder of all the souls of men everywhere, and bringing them into captivity to the obedience of Christ, according to the oracle, which said :

"And they shall fly in the ships of strangers ; they shall at the same time spoil the sea, and them from the sun-rising."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
