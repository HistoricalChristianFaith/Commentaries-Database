[[commentary]]
quote='''
And that they did not use human words to persuade their hearers, but that it was the power of God that worked with them in the Gospel preaching, again another prophet says:

"The Lord will give a word to those that bring good tidings with much power."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 1"
