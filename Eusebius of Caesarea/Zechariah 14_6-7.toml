[[commentary]]
quote='''
In that day (for this is the usual name given in Holy Scripture to the time of His sojourn on earth) the prophecy before us was fulfilled as well as the other predictions, when at the time of His Passion, "From the sixth hour unto the ninth hour there was darkness over all the earth." Therefore the prophecy says, "In that day there shall be no light." And also, "It shall not be day nor night: but towards evening it shall be light." Where we have, I think, an exact description of the time, when, our Lord being lifted up, though it was day, night filled the atmosphere from the sixth to the ninth hour. And afterwards the darkness cleared, and it was bright daylight, until night fell as usual. So the word of the prophecy implies, "And that day is known to the Lord, and it shall be neither day nor night: and towards evening it shall be light." For it was not day because of the midday darkness; nor was it night because of the returning day, which is shewn by the words, "Towards evening it shall be light." And the mention of the wintry season is astonishing indeed in the words of the prophecy, which say, "There shall be frost and cold"; for this is supported by the evidence of the Gospel, which tells how Peter following Jesus warmed himself in the Hall of Caiaphas with the others, where a fire was kindled. John actually mentions the cold, saying, "The servants and attendants stood round, having made a fire of coals, for it was cold, and they warmed themselves." The prophecy was thus literally fulfilled. And figuratively, as well in regard to the whole Jewish nation the reality of which those things were symbols was also fulfilled----when the light of salvation shone on them, and they chose darkness rather than light, and the light departed from them, and unspeakable night overwhelmed them, and the eyes of their mind were darkened, so that the rays of the Gospel should not shine in their hearts, and when too their love to God waxed cold.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 7"
