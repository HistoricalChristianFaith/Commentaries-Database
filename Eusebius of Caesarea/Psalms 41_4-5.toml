[[commentary]]
quote='''
So it proceeds in the rest to speak in the person of a poor man and a beggar, that is to say of our Saviour Who for our sakes became poor: "I said, Lord, have mercy on me." And John, the Evangelist, is an independent witness that the words of this Psalm are spoken in the Person of our Saviour. For he records, that:

"Jesus once took a towel and girded himself, and washed the feet of his disciples and said, I know whom I have chosen. But that the Scripture may be fulfilled, He that eateth with me, the same hath lifted his heel against me."

For He made it clear there that the Scripture referred to was the Psalm before us, in which it is said: "For the man of my peace, in whom I trusted, he that ate of my bread hath raised his heel against me." He it is, then, Who says at the beginning: "I said, Lord, have pity on me, heal my soul, for I have sinned against thee," and speaks through the whole Psalm. Symmachus gives a clearer rendering of these words, as follows:

"When I said, O Lord, have pity on me, heal my soul, even if I have sinned against thee, my enemies have spoken evil against me, when shall he die and his name perish? And when he comes to gaze on me his heart speaks vanity, it gathers unrighteousness on itself: and when he goes out he tells it. All they that hate me have whispered against me with one consent, conceiving evil concerning me. An unrighteous word is poured out within them, and when he fall may he never rise up. Yea, even the man who was at peace with me, in whom I trusted, who did eat of my bread, has magnified himself against me accordingly. But thou, O Lord, pity me, and raise me, that I may reward them. By this I shall know that thou wishest it, if my enemy does not revile me. Thou hast defended me because of my innocence, and shall set me before thee for ever."

And Aquila is in exact agreement with Symmachus. With regard first to the words which are apparently said in the Person of our Saviour: "Heal my soul, for I have sinned against thee," you will notice in Symmachus they are not so rendered, but thus: "Heal my soul, even if I have sinned against thee." And He speaks thus, since He shares our sins. So it is said: "And the Lord hath laid on him our iniquities, and he bears our sins." Thus the Lamb of God, that taketh away the sins of the world, became a curse on our behalf:

"Whom, though he knew no sin, God made sin for our sake, giving him as redemption for all, that we might become the righteousness of God in him."

But since being in the likeness of sinful flesh He condemned sin in the flesh, the words quoted are rightly used. And in that He made our sins His own from His love and benevolence towards us, He says these words, adding further on in the same Psalm: "Thou hast protected me because of my innocence," clearly shewing the impeccability of the Lamb of God. And how can He make our sins His own, and be said to bear our iniquities, except by our being regarded as His body, according to the apostle, who says: "Now ye are the body of Christ, and severally members?" And by the rule that "if one member suffer all the members suffer with it," so when the many members suffer and sin, He too by the laws of sympathy (since the Word of God was pleased to take the form of a slave and to be knit into the common tabernacle of us all) takes into Himself the labours of the suffering members, and makes our sicknesses His, and suffers all our woes and labours by the laws of love. And the Lamb of God not only did this, but was chastised on our behalf, and suffered a penalty He did not owe, but which we owed because of the multitude of our sins; and so He became the cause of the forgiveness of our sins, because He received death for us, and transferred to Himself the scourging, the insults, and the dishonour, which were due to us, and drew down on Himself the apportioned curse, being made a curse for us. And what is that but the price of our souls? And so the oracle says in our person: "By his stripes we were healed," and "The Lord delivered him for our sins," with the result that uniting Himself to us and us to Himself, and appropriating our sufferings, He can say, "I said, Lord, have mercy on me, heal my soul, for I have sinned against thee," and can cry that they who plot against Him, not men only but invisible daemons as well, when they see the surpassing power of His Holy Name and title, by means of which He filled the world full of Christians a little after, think that they will be able to extinguish it, if they plot His death. This is what is proved by His saying: "My enemies have spoken evil of me, saying, When shall he die and his name perish?"
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 1"
