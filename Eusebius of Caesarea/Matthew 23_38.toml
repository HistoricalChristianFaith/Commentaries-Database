[[commentary]]
quote='''
And moreover, half through this week, during which He confirmed the said Covenant with many, the sacrifice and libation was taken away, and the abomination of desolation began, for in the middle of this week after the three-and-a-half days of His Teaching, at the time when He suffered, the Veil of the Temple was torn asunder from the top to the bottom, so that in effect from that time sacrifice and libation were taken away, and the abomination of desolation stood in the holy place, inasmuch as the Being had left them desolate, Who had been from time immemorial till that day the guardian and protector of the place. For it is fitting to believe that up to the Saviour's Passion there was some Divine Power guarding the Temple and the Holy of Holies. For He could not have attended with the multitude at the Temple to keep the Feasts according to the laws, if He had not known that it still remained a place worthy of God. Therefore there were in the Temple also some that prophesied up to that time, as Anna the Prophetess, daughter of Phanuel, and Simeon, who took Him into his arms when He was an infant, whose prophecies are handed down in Scripture. Nor could our Lord have said to the leper, "Go, shew thyself to the priest, and offer the gift which Moses commanded for a testimony unto thee," if He had not considered it right for the legal observances to be carried out there as in a holy place worthy of God. Nor would He have thrust out those who bought and sold, saying, "Take these things hence, and make not my Father's House a house of merchandise," if He had not thought that the Temple was still to be reckoned sacred. But it was when the hour of their extreme wickedness drew near, that He explained all when He said, "Behold your house is left unto you desolate," which also was fulfilled, when at his Passion the Veil of the Temple was wholly rent in twain, and from that moment the sacrifice and libation well pleasing to God according to the ordinance of the Law was in effect taken away, and when it was removed, the abomination of desolation, as the prophecy before us says, appeared in its place. And if it be said that the worship of the Sanctuary appeared to continue for a time, yet it was not pleasing to God, being offered without judgment and not according to the Law. For as before of old when the Unction was abolished, and the lawful line of High Priests ceased after the death of Hyrcanus, they who held the office afterwards seemed to perform disordered and illegal rites, since they were breaking the fitting Laws, of whom the prophecy said, "The Unction shall be cast out, and there is no judgment in it," referring to its illegality and lack of judgment; so here you will rightly say it has happened to the offering and libation, which were rightly and lawfully offered before our Saviour's Passion, while the Power still guarded the Holy Places, but which were taken away directly after the perfect and supreme Sacrifice which He offered, when He offered Himself for our sins, being the Lamb of God, that taketh away the sin of the world, which sacrifice having been delivered to all men in the new Sacraments of the new Covenant, the Sacrifices of the old are taken away. For concurrently with the fulfilment of the oracle which says, "And he shall confirm a covenant with many one week," all that is connected with the old Covenant is abolished. And when was the new Covenant confirmed, but when our Lord and Saviour, about to consummate the great Mystery of His delivery to death, on the night in which He was betrayed, delivered to His disciples the symbols of the unspeakable words of the new Covenant referring to Him? For concurrently with this celebration, the old Covenant of Moses was abolished, which was shewn by the veil of the Temple being rent at the very time. Sacrifice and libation being from that time abolished and ceasing in effect and truth, any sacrifices that were afterwards thought to be offered there were celebrated in a profane place by profane and unhallowed men.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 2"
