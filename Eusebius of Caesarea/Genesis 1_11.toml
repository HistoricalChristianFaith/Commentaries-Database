[[commentary]]
quote='''
In teaching that the blood of the brutes is their life, it in no way implies that they share in the essence of thought and reason, for they are composed of matter and body, in the same way as the vegetation of the earth and plants. Thus Moses tells that God said in one creative word:

"Let the earth bring forth herb of grass and the fruit tree."

And again in like manner:

"Let the earth bring forth four-footed things, and creeping things, and wild beasts of the earth after their kind."

We must, therefore, regard the brutes as akin in kind and nature and essence to the vegetation of the earth and the plants, and conclude that those who sacrifice them commit no sin. Noah indeed was told to eat flesh, as the herb of the field.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 10"
