[[commentary]]
quote='''
But after the prophecy of the events that happened to the Jewish nation in the intermediate period between the seven and sixty-two weeks, there follows the prophecy of the new Covenant announced by our Saviour. So when all the intermediate matter between the seven and the sixty-two weeks is finished, there is added, "And he will confirm a Covenant with many one week," and in half the week the sacrifice and the libation shall be taken away, and on the Holy Place shall come the abomination of desolation, and until the fullness of time fullness shall be given to the desolation. Let us consider how this was fulfilled.

Now the whole period of our Saviour's Teaching and working of Miracles is said to have been three-and-a-half years, which is half a week. John the Evangelist, in his Gospel, makes this clear to the attentive. One week of years therefore would be represented by the whole period of His association with the Apostles, both the time before His Passion, and the time after His Resurrection. For it is written that before His Passion He shewed Himself for the space of three-and-a-half years to His disciples and also to those who were not His disciples: while by teaching and miracles He revealed the powers of His Godhead to all equally whether Greeks or Jews. But after His Resurrection He was most likely with His disciples a period equal to the years, being seen of them forty days, and eating with them, and speaking of the things pertaining to the Kingdom of God, as the Acts of the Apostles tells us. So that this would be the prophet's week of years, during which He "confirmed a covenant with many," confirming that is to say the new Covenant of the Gospel Preaching. And who were the many to whom He confirmed it, but His own disciples and Apostles, and such of the Hebrews who believed in Him? And moreover, half through this week, during which He confirmed the said Covenant with many, the sacrifice and libation was taken away, and the abomination of desolation began, for in the middle of this week after the three-and-a-half days of His Teaching, at the time when He suffered, the Veil of the Temple was torn asunder from the top to the bottom, so that in effect from that time sacrifice and libation were taken away, and the abomination of desolation stood in the holy place, inasmuch as the Being had left them desolate, Who had been from time immemorial till that day the guardian and protector of the place. For it is fitting to believe that up to the Saviour's Passion there was some Divine Power guarding the Temple and the Holy of Holies. For He could not have attended with the multitude at the Temple to keep the Feasts according to the laws, if He had not known that it still remained a place worthy of God. Therefore there were in the Temple also some that prophesied up to that time, as Anna the Prophetess, daughter of Phanuel, and Simeon, who took Him into his arms when He was an infant, whose prophecies are handed down in Scripture. Nor could our Lord have said to the leper, "Go, shew thyself to the priest, and offer the gift which Moses commanded for a testimony unto thee," if He had not considered it right for the legal observances to be carried out there as in a holy place worthy of God. Nor would He have thrust out those who bought and sold, saying, "Take these things hence, and make not my Father's House a house of merchandise," if He had not thought that the Temple was still to be reckoned sacred. But it was when the hour of their extreme wickedness drew near, that He explained all when He said, "Behold your house is left unto you desolate," which also was fulfilled, when at his Passion the Veil of the Temple was wholly rent in twain, and from that moment the sacrifice and libation well pleasing to God according to the ordinance of the Law was in effect taken away, and when it was removed, the abomination of desolation, as the prophecy before us says, appeared in its place. And if it be said that the worship of the Sanctuary appeared to continue for a time, yet it was not pleasing to God, being offered without judgment and not according to the Law. For as before of old when the Unction was abolished, and the lawful line of High Priests ceased after the death of Hyrcanus, they who held the office afterwards seemed to perform disordered and illegal rites, since they were breaking the fitting Laws, of whom the prophecy said, "The Unction shall be cast out, and there is no judgment in it," referring to its illegality and lack of judgment; so here you will rightly say it has happened to the offering and libation, which were rightly and lawfully offered before our Saviour's Passion, while the Power still guarded the Holy Places, but which were taken away directly after the perfect and supreme Sacrifice which He offered, when He offered Himself for our sins, being the Lamb of God, that taketh away the sin of the world, which sacrifice having been delivered to all men in the new Sacraments of the new Covenant, the Sacrifices of the old are taken away. For concurrently with the fulfilment of the oracle which says, "And he shall confirm a covenant with many one week," all that is connected with the old Covenant is abolished. And when was the new Covenant confirmed, but when our Lord and Saviour, about to consummate the great Mystery of His delivery to death, on the night in which He was betrayed, delivered to His disciples the symbols of the unspeakable words of the new Covenant referring to Him? For concurrently with this celebration, the old Covenant of Moses was abolished, which was shewn by the veil of the Temple being rent at the very time. Sacrifice and libation being from that time abolished and ceasing in effect and truth, any sacrifices that were afterwards thought to be offered there were celebrated in a profane place by profane and unhallowed men. Hear the witness of Josephus about this:

"On the day of Pentecost, the priests going by night into the Temple, as was their custom, for the services, said that they were first conscious of a quaking and a sound, and afterwards of a sudden voice which said, Let us depart hence."

And he records this to have taken place after the Passion of our Saviour. And the same writer says elsewhere: "Pilate the Governor "(meaning the Pilate of our Saviour's time) "brought the images of Caesar into the Temple by night, which was unlawful, and caused a great outburst of tumult and disorder among the Jews." Which Philo confirms, saying:

"Pilate laid up in the Temple by night the imperial emblems, and from that time the Jews were involved in rebellion and mutual troubles."

And from that time a succession of all kinds of troubles afflicted the whole nation and their city until the last war against them, and the final siege, in which destruction rushed on them like a flood with all kinds of misery of famine, plague and sword, and all who had conspired against the Saviour in their youth were cut off; then, too, the abomination of desolation stood in the Temple, and it has remained there even till to-day, while they have daily reached deeper depths of desolation. And perhaps this will be so until the end of the world, according to the limit set by the prophet when he said, "And unto the consummation of time a fulfilment shall be given to the desolation." These words our Lord and Saviour Jesus Christ sealed, when He said, "When ye shall see the abomination of desolation spoken of by Daniel the Prophet, standing in the Holy Place, then ye shall know that her desolation draws near."

And if the Jews are hard to persuade of this, they must be convicted not only of a shameless opposition to truth and clear evidence, but also of misrepresenting, so far as they can, the predictions as falsehoods, if it is to be thought that in the seventy weeks of years some of them include all the time, while they prophesy of what is to happen in the intermediate period, while others, though we are now nearly a thousand years from the date of the prophecy, admit no sign of the fulfilment of what was written, although their Unction has been abolished, as the divine prediction foretold, and their sanctuary, and the former inhabitants destroyed and utterly brought to naught in the flood of the completed war, and strangest thing of all even now to be seen, I mean, the abomination of desolation still standing in the one holy place, concerning which our Lord and Saviour said what I have quoted.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 2"
