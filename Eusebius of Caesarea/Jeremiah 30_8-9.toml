
[[commentary]]
quote='''
And God promises that He will break from those who are thus to be saved the old heavy yoke of bitter daemons and shatter the bonds of the sins by which they were held of old, so that they will no more serve strange gods, but bear fruit and please Him only. Compare with this the oracle in the Second Psalm concerning the Coming of Christ and the calling of the Gentiles, which says: "Let us break their bonds asunder, and cast off their yoke from us." To which, I think, this we are considering is akin when it says:

"In that day, saith the Lord, I will break the yoke from off their necks, and shatter their bonds, and they shall not serve other gods, but shall serve the Lord their God."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 3"
