[[commentary]]
quote='''
And in the preceding prophecy, coincident with the birth of Emmanuel, before the Child knows good or evil, it is said that the land is forsaken by the two kings that are attacking it, namely the kings of Samaria and Damascus; while in this prophecy it says that before the Child calls on His father or mother, He shall take the power of Damascus and the spoils of Samaria, whose kings He previously prophesied would be destroyed at the birth of Emmanuel.

I have already pointed out that actually in the time of Ahaz two kings made a covenant and attacked those ruled by David's successors; the one, ruler of the idolatrous Gentiles of Damascus; the other, king of the Jewish people in the city of Palestine called Samaria, which we call Sebaste. Concerning whom God said to Ahaz: "Fear not, let thy heart not be sick, for these two smoking firebrands." And he foretells that the destruction of these men will be immediate, and proceeds to prophesy that on the birth of God with us, both their kingdoms will be utterly extinguished and destroyed. And we know from history that until the coming of our Saviour Jesus Christ the kingdoms of Judaea and Damascus continued, but that after His appearance to all men, they ceased in accordance with the prophecy, for the Roman Empire absorbed them concurrently with the preaching of our Saviour.

And after this literal prediction the prophecy passes to a figurative and generally more spiritual form of revelation, and it understands two ranks of invisible enemies and hostile daemons, warring in different ways against humanity, one active always and everywhere in promoting idolatry and false beliefs among mankind, the other occasioning the corruption of morals. And taking the type of idolatrous error in the king of Damascus, and of the decline of the pure and healthy life in the king of Samaria, it says that the earth, meaning thereby the men who inhabit it, will only be released from their power, when God appears on earth as Emmanuel. When He has shone forth and ruled over the soul of man, none of the old tyrants will be left. Thus, then, you will understand that here it refers to the same beings, when it says: "He will take the power of Damascus and the spoils of Samaria," for our Saviour Jesus Christ's power conquers completely all our unseen enemies, who for long ages besieged all men with their aforesaid godless and harmful activities. And in the literal sense as well you may see the power of Damascus destroyed concurrently with the Birth and appearance of our Saviour, and the spoils of Samaria taken, that is to say their kingdoms, which continued up to the time stated, but in the fulfilment of the divine prediction have ceased from then till now.

Some say, interpreting otherwise, that the Magi, who came from the East to worship Christ, the young Child, are meant by the "power of Damascus": and you might say more universally that all who have rejected godless, polytheistic idolatry, and obeyed the word of Christ, especially if they be furnished with this world's reason and wisdom, are those meant by the "power of Damascus." And by the "spoils of Samaria" you will in this case understand our Saviour's Jewish apostles and disciples, whom as it were He took as His spoils from the hostile Jews who attacked Him, and armed for the conflict with the king of the Assyrians, by whom again the Prince of this world is figuratively meant. But as Aquila has translated more clearly: "The adversary of the king of the Assyrians" by "In the face of the king of the Assyrians,'' it is worth considering whether here the Roman Empire is not meant, if the translation given a little before of "Assyrians" as "rulers or ruled" be correct. As then here, also, the king of the Assyrians is connected with the appearing of our Saviour, it is probable that here also the Roman Empire is intended, through their being directed by God to subject the nations to themselves. It is therefore prophesied that the child that is born will take the power of Damascus, and the spoils of Samaria, and will deliver them against the face of the Assyrians, and before the eyes of those ruled by God, and that He will do this at the time of His Birth, directing the fate of humanity with secret divine power, while physically still a babe.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"

[[commentary]]
quote='''
And if the Jews say that even now we are to expect the fulfilment in the future, expecting these things to be accomplished actually and literally by the Christ they look for, let us ask them, how he that is to come will take the power of Damascus and the spoils of Samaria against the king of the Assyrians, inasmuch as Samaria at the present time is destroyed, and no longer exists, and the power that bore the name of Damascus is abolished, and so is the Assyrian Empire, which the Medes and Persians destroyed and superseded between them? And as none of these people hold empire, how is it possible to look for their destruction in the future?

Neither is it possible to claim that they were fulfilled at any other time in the distant past. No Hebrew sprung from the union of a prophetess with the prophet Isaiah ever took the spoils of Samaria and the power of Damascus warring against the king of Assyria, as the literal sense would imply. So that everything compels us to agree that the fulfilment has only been in the way I have described, and at no other time than that of the appearance of Jesus our Saviour, in Whose day I have proved that the things aforesaid were fulfilled.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
