[[commentary]]
quote='''
And all this it says will come to pass because of the sin of the house of Jacob, and the transgression of the house of Israel. And it goes on to describe this sin and transgression, "They that defile judgment and pervert all that is right, who build Sion with blood and Jerusalem with unrighteousness." With blood! Yes, this was the cause of their final misery, for that they pronounced the impious curse upon themselves, saying, "His blood be on us and on our children."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 3"
