[[commentary]]
quote='''
"8. Thus saith the Lord, as a grape-stone shall be found in the cluster, and they shall say, Destroy it not, for a blessing is in it: so will I for the sake of him that serves me, for his sake I will not destroy all. 9. And I will lead out the seed of Jacob and Juda, and they shall inherit my holy mountain : and my chosen and my servants shall inherit it and dwell there. 10. And there shall be in the forest a fold of sheep, and the valley of Achor shall be a resting-place for the herds of my people, who have sought me.

"11. But ye are they that have left me, and forget my holy mountain and prepare a table for chance, 12. and fill up the drink-offering to the Demon. I will deliver you up to the sword, ye shall all fall by slaughter, because I called you and ye did not hear, and did evil before me, and chose that which I willed not."

In this passage the Scripture distinguishes, and says that but a small seed from Jacob will attain the promises, and that the elect are those that dwell in the wood. It points here to the calling of the Gentiles, in which the elect of the Lord and the seed of Jacob are [included], and these would be the apostles and disciples of our Saviour, and the rest beyond them are subject to the before-mentioned threats, Scripture stating as clearly as possible, that the whole Jewish nation could not attain the promises of God, but only the seed which is named, and those called "the elect of God." For many are called, but few are chosen.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
