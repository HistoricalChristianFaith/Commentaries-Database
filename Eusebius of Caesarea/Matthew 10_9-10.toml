[[commentary]]
quote='''
And who would not be astonished at their indifference to money, certified by their not turning from but welcoming a Master, Who forbade the possession of gold and silver, Whose law did not even allow the acquisition of a second coat? Why, any one only hearing such a law might reject it as too heavy, but these men are shewn to have carried out the words in fact. For once, when a lame man was begging from Peter's companions (it was a man in extreme need who begged for food), Peter, not having anything to give him, confessed that he had no belongings in silver or gold, and said: "Silver and gold have I none, but such as I have, give I unto thee: In the Name of Jesus Christ, arise and walk."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 5"

[[commentary]]
quote='''
For a sorcerer being truly unholy and vile in his nature, dealing with things forbidden and unholy, always acts for the sake of base and sordid gain. Our Lord and Saviour Jesus, the Christ of God, was surely not open to such a charge. In what sense could such a thing be said of One Who said to His disciples, according to their written record: " Provide neither gold nor silver in your girdles, nor a staff for the road, nor shoes"? How could they have heeded His sayings, and thought fit to hand them down recorded in writing, if they had seen their Master bent on making money, and Himself doing the opposite of what He taught others? They would soon have ridiculed Him and His words and left their discipleship in natural disgust, if they had seen Him laying down such noble laws for them, and Himself the Lawgiver in no way following His own words.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 6"

[[commentary]]
quote='''
Most of all, he thought that the words of the Saviour in the Gospel should be observed, in which he exhorts not to have two coats nor to use shoes, nor to occupy oneself with cares for the future.

With a zeal beyond his age he continued in cold and nakedness; and, going to the very extreme of poverty, he greatly astonished those about him. And indeed he grieved many of his friends who desired to share their possessions with him, on account of the wearisome toil which they saw him enduring in the teaching of divine things.
'''
source_url = "https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25206.html"
source_title = "Church History, Book 6, Chapter 3"
