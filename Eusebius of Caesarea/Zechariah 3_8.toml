[[commentary]]
quote='''
But in all battles He triumphed over the devil, and all the unseen enemies and foes led by him, and made us who were slaves His own people, and built of us, as of living stones, the house of God, and the state of holiness, so that He exactly agrees with the oracle, which says:

"Behold a man, whose name is the Branch. And he shall spring up from below, and shall build the house of the Lord. And he shall receive virtue, and shall sit and rule upon his throne."

Note, therefore, with care, in what manner in speaking mystically of the Jesus of days of old, who bears the image of the true, he says: "Behold a man, whose name is the Branch." And a little later, it is said to Jesus himself then present, as if concerning some one else who was the Branch: "Hear, Jesus, the High Priest, thou and thy neighbour, for the men are diviners. Behold, I bring my servant the Branch."

If, then, the speech related to some one yet to come, who was more truly called the Branch than he that bore the name then, he must have been only an image of him that was yet to come, as he is not only called Jesus in figure, but the Branch as well, if this was said to him when present: "Behold a man, whose name is the Branch." He was, therefore, naturally because he was the image thought worthy of the name of the Saviour, as well as of the Branch: for the name of Jesus translated into Greek means "Salvation of God." For in Hebrew "Isoua" is "salvation," and the son of Nave is called by the Hebrews Joshua, Joshua being "Salvation of Jab," that is, Salvation of God. It follows that wherever the Salvation of God is named in the Greek versions, you are to understand that nothing but Jesus is meant.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 17"
