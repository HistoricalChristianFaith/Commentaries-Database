[[commentary]]
quote='''
The prophecy before us shews it to be essential that Christ Himself should be the originator and leader of the Gospel activity, and the same prophet foretells that after Him His own disciples should be ministers of the same system:

"How beautiful are the feet of them that bring good tidings of good things, and of those that bring good tidings of peace."

Here he says very particularly that it is the feet of those who publish the good news of Christ that are beautiful. For how could they not be beautiful, which in so small, so short a time have run over the whole earth, and filled every place with the holy teaching about the Saviour of the world?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 1"
