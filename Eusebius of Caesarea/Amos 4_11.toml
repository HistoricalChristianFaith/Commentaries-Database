[[commentary]]
quote='''
[Passage quoted, Amos iv. ii.]

AND here the Lord Himself says that some God has caused the destruction of Sodom, since He Himself must plainly be a different Being from the One of Whom He speaks. Therefore two Lords stands out in the destruction of Sodom and Gomorrah, when the Lord rained the fire of the Lord on them. You also, he says, will suffer a destruction such as Sodom underwent for its unnatural wickedness, and even so did not turn to Me. Scripture generally regards the future as past, so that we must understand the past to be meant in spite of the tense. The future "I will overthrow" must be understood for the past "I overthrew," and "ye will not turn," for "ye did turn."

This is levelled at the Jewish race, and only received its fulfilment in their case, after their plot against our Saviour, Their ancient holy place, at any rate, and their Temple are to this day as much destroyed as Sodom. Yet though they have suffered in accordance with the prediction, they have not hitherto turned to Christ, on Whose account they have suffered so much. And so the prophecy before us is justly inspired to say: "And neither so have ye returned to me, saith the Lord."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 23"
