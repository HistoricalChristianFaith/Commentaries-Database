[[commentary]]
quote='''
"20. The breath of our countenance, the Lord Christ was taken in their destructions, of whom we said, In his shadow we shall live among the Gentiles."

The inspired prophets of God, knowing the future by the Holy Spirit, foretold that they themselves would live, and that their words would work among the Gentiles as the words of living men, but not in Israel. They said again that the Christ (Whom they named) as being He from Whom the prophetic spirit was supplied to them, would be taken in their snares. The snares of whom? Plainly of the Jews who plotted against Him. And notice here that the prophecy says that the Christ will be taken, which would not correspond with the second Coming of Christ, which the prophecies predict will be glorious and bring in the Divine Kingdom. Wherefore it seems that the Jews are wrong in taking the sayings about His second Appearance, as if they were about His first Coming, which the sense will in no way allow. Since it is impossible to regard Him as at one and the same time glorious and without glory, honoured and kingly, and then without form or beauty, but dishonoured more than the sons of men; and again, as the Saviour and Redeemer of Israel, while plotted against by them, and led as a sheep to the slaughter, delivered to death by their sins. The prophecies about the Christ should be divided, as our investigation of the facts shews, into two classes: the first which are the more human and gloomy will be agreed to have been fulfilled at His first Coming, the second the more glorious and divine even now await His second Coming for their fulfilment. And a clear proof of the former is the actual progress of the knowledge of God through Him in all nations, which many prophetic voices foretell in various strains, like the one before us, in which it is said: "Of whom we said, In his shadow we will live among the Gentiles."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
