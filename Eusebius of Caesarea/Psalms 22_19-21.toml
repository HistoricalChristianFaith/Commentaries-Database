[[commentary]]
quote='''
To crown all this He addresses the following prayer to His God and Lord and Father: "But thou, O Lord, take not far off thy help." Left for a little while alone for the shewing forth of the contest, and stripped to contend with Death without a helper, well aware that His only succour from His Father will be by the Resurrection from the dead, He naturally now prays to escape from the array of His adversaries. So He says: "Thou, O Lord, remove not far thy help, afford me succour. For my succour will come from thy help," and it is perhaps in reference to His succour that the whole Psalm is entitled "Concerning the succour at dawn."

"Have regard then to My succour, extending to Me as soon as dawn comes the succour of the Resurrection from the dead, which I know that I shall receive, if thou remove it not from Me. Save My soul from the sword, My Only-begotten from the power of the dog. Thou wilt save Me from the mouth of the lion, and my lowliness from the horns of the unicorns."

By which I understand Him to mean the powers of the under-world, which it is not in my power to distinguish and divide into classes, shewing which was the sword that threatened our Saviour's life, or which one like a dog of death stretched forth its death-fraught paw, to capture it. For He says: "Save my soul from the sword, my Only-begotten from the power of the dog." And another evil power reckoned as one of the wild beasts there, called a lion, opening wide its vast and yawning mouth of death, essays to devour His soul with the others of them that go down to Hades, just as long before mighty Death devoured them, being none other than the lion that opened his mouth before our Saviour, from which He prayed to His Father to deliver Him, saying: "Save me from the lion's mouth."

And there were other evil and impious powers working against the Unicorn of God, and attempting to seduce Him from His purpose, from whom too the Unicorn of God, our Lord having His Father as His only horn, prays that His lowliness may be saved, saying: "And my lowliness from the horns of the unicorn." What lowliness, but that wherewith, being in the form of God, He humbled Himself and emptied Himself, being obedient unto death, even the death of the Cross. Yea, so low descending, and coming even to this, I mean even to the sword in Hades, and to the hand of Him that is called its dog. (Whence, perhaps, the Greeks hearing of some such dog of death, painted it with three heads): and coming to the throat of the said lion, and subjecting His lowliness to the attacks of the impious Unicorns, and thus having completed the whole dispensation of His self-emptying and humiliation, and prayed that now at last He may receive help and the succour of His Father, He adds: "Thou, O Lord, remove not thy help far off, attend to my succour." And though He says this, His Father is not too far off to hear Him, He is not removed far off, He is not separated by the smallest space, but is actually saying to Him: "While thou speakest, I will say, I am here."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
