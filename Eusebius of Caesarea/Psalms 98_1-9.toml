[[commentary]]
quote='''
[Passage quoted, Ps. xcvii. 1-8.]

IT is prophesied here that the Coming of the Lord will be the cause of great benefits to the nations, which have been proved to have actually accrued to them, through the manifestation of our Saviour. For of a truth from then and not before the new song of the new Covenant has been sung among all men, and His wonders have been known and heard by all men through the written gospels. Yea, and salvation also, by the Resurrection of the Lord from the dead, has been revealed to all nations, and the true righteousness, by which it has been clearly proved, that God is not the God of the Jews only, but of the Gentiles. "Since there is one God," in the words of the holy apostle, "who will judge the circumcision from their faith, and the uncircumcision through faith." And the words, "for he cometh to judge the earth," might refer also to His second Coming."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 6"
