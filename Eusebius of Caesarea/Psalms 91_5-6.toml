[[commentary]]
quote='''
And whereas His Temptation lasted forty days, and as many nights, it is said of those that attacked Him by night, "Thou shalt not fear the terror by night"; and of those that warred against Him by day, "From the arrow that flieth by day." And also of the foe of night, "From the thing that walketh in darkness," and of those of daytime, "From the attack and the demon of mid-day."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 7"
