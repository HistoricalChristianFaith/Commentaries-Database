[[commentary]]
quote='''
"Seven times seventy weeks," he says, "have been decided on for this people and for thy holy city, for sin to be ended, and to seal up transgression, and to blot out iniquities, and to make atonement for iniquities, and to bring in everlasting righteousness, and to seal the vision and the people, and to anoint the most holy."

It is quite clear that seven times seventy weeks reckoned in years amounts to 490. That was therefore the period determined for Daniel's people, which limited the total length of the Jewish nation's existence. And he no longer calls them here "God's people," but Daniel's, saying, "thy people." Just as when they sinned and worshipped idols in the wilderness, God called them no more His people, but Moses', saying, "Go, descend, for thy people has sinned." In the same way here too he explains why the definite limit of time is determined for them. It was that they might know they were no longer worthy to be called the people of God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 2"
