[[commentary]]
quote='''
But as it was necessary for the mysteries of both His Birth and Death to be included in the prophecy concerning Him, Jacob rightly proceeds to add to what has gone before:

"Judah is a lion's whelp. From a seed, my son, thou hast ascended, falling down thou hast slept as a lion and a lion's whelp: who shall arouse thee?"

He calls Him then a lion's whelp because of His being born of the royal tribe. For He was of the seed of David according to the flesh. "From a shoot thou hast grown, my son," he says, because He was born of the seed and root of Jacob who foretold it, being primarily God the Word, and becoming secondarily the Son of man, through the dispensation He undertook for us. And the words, "Falling down thou didst sleep as a lion and a whelp," are significant of His Death, because Scripture is accustomed, as is shewn in many other places, from the conviction of their kinship to call death a sleep. And "Who shall awake him?" is a wonderful reference to His Resurrection from the dead. For he who said, "Who will awake him?" knew quite well that He would be awaked. And it is remarkable that he should add, "Who then shall do this and raise him up? "so as to impel us to ask who it was that raised up our Lord Who died on our behalf. For Who else was it, but the God of the Universe, His Father, to Whom the Saviour's Resurrection is solely to be attributed, according to the Scripture which says, "Whom the Father raised from the dead "?

Instead of, "Judah is a lion's whelp, from a shoot, my son, thou hast ascended, falling down thou hast slept," Aquila says more plainly, "Judah is a lion's cub, from destruction, my son, hast thou ascended, bending thou hast laid down." And Symmachus says, "Judah is a lion's whelp, from capture, my son, hast thou ascended, having knelt thou hast been established.'' By which the Resurrection of the dead is clearly meant, and the escape of our Saviour from Hades, as from a trap for wild beasts. The kneeling and the being established instead of falling, signify death by the kneeling, and not being dragged away like the souls of other men by "being established." All this then was laid up before for Christ. But while this remained unfulfilled, the Jewish nation lasted, and their rulers and governors and they who were wise interpreters of the sacred oracles about the Christ stood out among them; but when that which had been laid up for Judah had come, and He appeared on earth of Whom it was foretold that He should spring from the seed and shoot of the prophet himself, after falling down and sleeping, or "kneeling," according to Symmachus, He was established and raised up, laying His hands on the back of His unseen spiritual enemies; and His brothers and disciples first praising Him and wondering, afterwards were convinced that He was God, and worshipped Him as God; then were fulfilled the things laid up for Him, for because of this the answer was given, "Until there come the things laid up for him." For from that day to this, the things laid up for Him being come, the rulers and governors of the Jewish nation have ceased, the rulers of the Gentiles have been placed at their head, and the nations on the other hand knowing the Christ of God have made Him their Saviour and Hope.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 1"
