[[commentary]]
quote='''
After all this there follows:

"Binding his foal to the vine, and the foal of the ass to the branch, he shall wash his robe in wine, and his garment in the blood of the grape. His eyes shall be cheering from wine, and his teeth white as milk."

Here I should understand by the foal, the choir of apostles and disciples of our Saviour, and by the vine to which the foal is bound, His divine and invisible power, as He Himself taught when He said, "I am the true vine, and my Father is the husbandman." And the branch of the said vine is the teaching of the Word of God, by which He bound the foal of the ass—that is to say, the new people of the Gentiles, the offspring of His Apostles. And you may say that this was literally fulfilled, when, according to Matthew, the Lord said to His disciples:

"Go into the village over against you, and straightway ye shall find an ass tied, and a colt with her; loose them and bring them to me."

And there is real food for wonder if one studies the account in the prediction of the prophet, that he should have foreseen by the Holy Spirit, that the subject of his prophecy would not come riding on chariots and horses like some distinguished man, but on an ass and a foal, like a poor common man of the people. And this raised another prophet's wonder, who said:

"Rejoice greatly, daughter of Zion, behold thy King cometh unto thee meek, sitting upon an ass, and a colt the foal of an ass."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 1"
