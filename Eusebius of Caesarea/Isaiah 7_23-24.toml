[[commentary]]
quote='''
And to crown all, their vines will be dry. For when, as the same prophet says, their farmer and master expected them to bring forth a bunch of grapes, and they brought forth thorns, and not justice, but a cry, it is said that he will take away his mound and destroy the wall, and turn the vineyard into a dry place, and will deliver it to enemies, who, he says, will come there with arrow and bow, receiving their authority from God, Who delivers it to them not unjustly, but most justly, because all their land is become dry and thorny. Therefore, then, since they have made themselves dry and thorny, men will come, he says, with arrow and bow, with authority against them. Wonder not if this is expressed in dark and riddling figures. For I have already attributed the cause of such economy of Scripture to the desire to hide the final destruction of the Jewish race, so that they might preserve the Scriptures for our benefit and use. For if the prophets had openly predicted destruction for them, and prosperity for the Gentiles, none of the Jews would have loved them, but they would have destroyed their writings as hostile and opposed to them, and it would have been impossible for us Gentiles to have made use of the prophetic evidence about our Saviour and ourselves.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
