[[commentary]]
quote='''
As it has been supposed by some that the Book of Psalms merely consists of hymns to God and sacred songs, and that we shall look in vain in it for predictions and prophecies of the future, let us realize distinctly that it contains many prophecies, far too many to be quoted now, and it must suffice for proof of what I say to make use of two Psalms ascribed to Asaph, written in the time of David. For Asaph was one of the Temple Musicians then, as is stated in the Book of Chronicles, and was inspired by the Divine Spirit to speak the Psalms inscribed with his name. And what do these Psalms include? Predictions of the siege of Jerusalem, the royal city of the Jewish race, which took place nearly five hundred years after the prediction. For we read in the 73rd Psalm, inscribed "A Psalm of understanding for Asaph":

"Wherefore hast thou rejected us, O God, for ever? | Wherefore is thy wrath kindled against the sheep of thy pasture? | 2. Remember thy congregation, which thou hast possessed of old, | and hast ransomed as the rod of thy inheritance; | this Mount Zion wherein thou hast dwelt. | 3. Lift up thine hands against their pride unto the end: what things hath the enemy done evilly in thy sanctuaries, | 4. and they that hate thee have boasted in the midst of thy Feast: | 5. they have set up their banners for signs, ignorantly as it were in the entrance above. | They cut down its doors at once with axes as in a wood of trees, | they have broken it down with hatchet and stone-cutter. | 7. They have burnt thy sanctuary to the ground with fire, | and have profaned even with the ground the dwelling-place of thy name."

This is in Psalm lxxiii.; and Psalm lxxviii. of Asaph contains this:

"O God, the Gentiles have entered into thine inheritance, and defiled thy holy temple; they have made Jerusalem a store-house of fruits, they have given the dead bodies of thy servants to be meat for the birds of the air, the flesh of thy saints to the beasts of the fields."

The first of these passages, I mean the one from Psalm lxxiii., was spoken in David's reign before the building of Solomon's Temple, and it was only fulfilled the first time by the siege by the Babylonians, and the second time in the Roman war against the Jews. For what was predicted and proclaimed in the said Psalms by Asaph was brought to pass in the destruction of the first and second Temples.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 1"
