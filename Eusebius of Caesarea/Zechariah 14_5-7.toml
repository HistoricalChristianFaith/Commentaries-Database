[[commentary]]
quote='''
After this the prophecy recurring to the Coming of the Lord announces it more clearly, saying: "And the Lord my God shall come, and all His holy ones with Him," referring either to His apostles and disciples as holy ones, or certain invisible powers and ministering spirits, of whom it was said: "And angels came and ministered to him." And then of the Coming of the Lord, he says: "It shall be day, and it shall not be light, and cold and frost shall I be for one day." Instead of which Symmachus translated:

"And in that day there shall be no light, but frost and cold shall be for one day, which is known to the Lord, not day nor night, but at eventide it shall be light."

See how clearly this description of the day of our Saviour's Passion, a day in which "there shall be no light," was fulfilled, since "from the sixth hour to the ninth hour there was darkness over all the earth." And also the "frost and cold," since according to Luke:

"They led Jesus to the palace of the high priest. And Peter followed afar off. And while they kindled a fire in the midst of the hall, he sat down, according to Mark, with the others to warm himself. And John, too, especially mentions the cold, saying, The servants and the ministers stood, having made a fire of coals, for it was cold, and they warmed themselves.''

And this day, he says, was known to the Lord, and was not night. It was not day, because, as has been said already, "there shall be no light"; which was fulfilled, when "from the sixth hour there was darkness over all the earth until the ninth hour." Nor was it night, because "at eventide it shall be light" was added, which also was fulfilled when the day regained its natural light after the ninth hour. And this was fulfilled figuratively as well, generally in the Jewish race, darkness, cold, and frost coming on them after their outrage on the Christ, their understanding being darkened, so that the light of the Gospel should not shine in their hearts, and their love to God waxing cold, and then at eventide the light of the knowledge of the Christ arose, so that they who sat of old in darkness and the shadow of death saw a great light, in the words of the prophet Isaiah.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 18"
