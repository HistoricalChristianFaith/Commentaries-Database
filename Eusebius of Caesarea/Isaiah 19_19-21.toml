
[[commentary]]
quote='''
And Isaiah literally shouts and cries his prophecy to the same effect:

"19. There shall be an altar to the Lord in the land of Egypt. . . . And the Lord shall be known to the Egyptians ... 20. And he shall send to them a man who shall save them, . . . 21, and the Egyptians shall know the Lord in that day, and shall offer sacrifice, and vow vows to the Lord and pay (them). And they shall he turned to the Lord, and he shall hear them and heal them."

Do we not say truly then that the prophets were inspired to foretell a change of the Mosaic Law, nay its end and conclusion? Moses lays down that the altar and the sacrifices should be nowhere else on earth but in Judaea, and there only in one city. But this prophecy says that an altar to the Lord shall be set up in Egypt, and that Egyptians shall celebrate their sacrifices to the Lord of the prophets and no longer to their ancestral gods. It foretells that Moses shall not be the medium of their knowledge of God, nor any other of the prophets, but a man fresh and new sent from God. Now if the altar is changed contrary to the commandment of Moses, it is beyond doubt necessary that the Law of Moses should be changed also. Then, too, the Egyptians, if they "sacrifice to the Supreme God," must be admittedly worthy of the priesthood. And if the Egyptians are priests Moses' enactments about the Levites and the Aaronic succession would be useless to the Egyptians. The time, therefore, will have come when a new legislation will be needed for their support. What follows? Have I spoken at random? Or have I proved my contention? Behold how to day, yes in our own times, our eyes see not only Egyptians, but every race of men who used to be idolaters, whom the prophet meant when he said "Egyptians," released from the errors of polytheism and the daemons, and calling on the God of the prophets! They pray no longer to lords many, but to one Lord according to the sacred oracle; they have raised to Him an altar of unbloody and reasonable sacrifices according to the new mysteries of the fresh and new covenant throughout the whole of the inhabited world, and in Egypt itself and among the other nations, Egyptian in their superstitious errors. Yes, in our own time the knowledge of the Omnipotent God shines forth, and sets a seal of certainty on the forecasts of the prophets. You see this actually going on, you no longer only expect to hear of it, and if you ask the moment when the change began, for all your inquiry you will receive no other answer but the moment of the appearance of the Saviour. For He it was, of Whom the prophet spoke, when he said that the Supreme God and Lord would send a man to the Egyptians, to save them, as also the Mosaic oracles taught in these words: "A man shall come forth from his seed, and shall rule over many nations"; among which nations the Egyptians would certainly be numbered. But a great deal could be said on these points, and with sufficient leisure one could deal with them more exhaustively. Suffice it to say now, that we must hold to the truth, that the prophecies have only been fulfilled after the coming of Jesus our Saviour. For it is through Him that in our day that old system of Abraham, the most ancient and venerable form of religion, is followed by the Egyptians, the Persians, the Syrians and the Armenians. The Barbarians from the end of the earth, those of them who were of old the most uncivilized and wild, yea, they that inhabit the isles, for prophecy thought well even to mention them, follow it as well. And who would not be struck by the extraordinary change—that men who for ages have paid divine honour to wood and stone and daemons, wild beasts that feed on human flesh, poisonous reptiles, animals of every kind, repulsive monsters, fire and earth, and the lifeless elements of the universe should after our Saviour's coming pray to the Most High God, Creator of Heaven and earth, the actual Lord of the prophets, and the God of Abraham and his forefathers? That men a little while before involved in marriage with mothers and daughters, in unspeakable vice and all sorts of vileness, men who lived like wild beasts, now converted by the divine power of our Saviour, and become like different beings, should crowd the public schools and learn lessons of virtue and purity. That not men only, but women, poor and rich, learned and simple, children even and slaves, should be taught in their daily occupation in town or country the loftiest ethics, which forbids to look with eyes unbridled, to be careless even in words, or to follow the path of custom and fashion. That they should learn the true ideal of worshipping the Supreme God, and serving Him in every place, according to the prophecy, which says: "And they shall worship Him each from his own place."Every one, then, whether Greek or Barbarian, is worshipping the Supreme God, not running to Jerusalem, nor made holy with bloody sacrifices, but staying at home in his own land, and offering in spirit and in truth his pure and bloodless offering.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"

[[commentary]]
quote='''
And if they say that they were chosen out to act as priests and to offer worship to God, it can be shewn that the Word promised that He would give to the Gentiles an equal share in His service, when He said: "Render to the Lord, O ye kindreds of the nations, render to the Lord glory and honour: bring sacrifices and come into his courts." To which the oracle in Isaiah may be conjoined, which says: "There shall be an altar to the Lord in the land of Egypt . . . and the Egyptians will know the Lord. And they shall do sacrifice, and say prayers to the Lord, and offer." And in this you will understand that it is prophesied that an altar will be built to the Lord away from Jerusalem in Egypt, and that the Egyptians will there offer sacrifice, say prayers and give gifts to the Lord. Yes, and not only in Egypt, but in the true Jerusalem itself, whatever it is thought to be, all the nations, and the Egyptians forsooth, the most superstitious of them all, are invited to keep the Feast of Tabernacles, as a feast of the heart.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"

[[commentary]]
quote='''
[Passages quoted, Isa. xix. 1-3; xix. 19-21.]

THIS is a passage that I have already partly expounded. Now if the Egyptians are not seen in our own time deserting their ancestral gods and calling upon the God of the prophets; if throughout Egypt in every locality, town and country there are not altars erected to the God that was formerly acknowledged only by the Hebrews; if the idols of Egypt have not been shaken, for that the power of the daemons that hung about them is gone, and the ancient superstition driven from the soul of the Egyptians; and once more, if there is not intestine war arisen through all the households of Egypt, between them that receive the Lord and worship the God of the prophets and reject their immemorial polytheistic error, and them that oppose the converts of the Lord in their adherence to the evil of their fathers; if they do not even now in their efforts to question their own gods and the idols and them that speak out of the ground and the diviners by familiar spirits, make a vain and useless appeal to them because the daemons are no longer able to work in them as they did of old—if all these things are not seen to have been actually fulfilled, why then, you may consider that the prophetic oracle is unfulfilled, and that the Lord that was prophesied has not yet visited our human life.

But if, on the other hand, we can see the people of Egypt far more patently in actual fact than in mere description, some of them acknowledging the God of the prophets, and for His sake renouncing their ancestral gods, some of them raising political dissension against the converts, some of them even now calling upon their gods and images and them that speak from the ground, who no longer can effect aught, and some throughout all Egypt raising an altar to the Lord of the prophets for each local Church, calling no longer in their troubles and persecutions on beasts or reptiles as their gods, nor on wild animals and unreasoning brutes as their fathers did, but on the Supreme God, retaining Him only and the fear of Him in their minds, praying to Him, and not to the daemons, and promising what men should promise God—how can we deny that the prophecies of long ago have at last been fulfilled? And these foretold that the Lord would come to Egypt not in an unembodied state, but in a light cloud, or better "in light thickness," for such is the meaning of the Hebrew, shewing figuratively His Incarnate state. Therefore the prophecy goes on to call Him a man that is a Saviour, saying, "And the Lord shall send to them a man that is a Saviour." Here again the Hebrew is, "And He shall send to them a Saviour, who shall save them." As the proof is now so clear from this, I consider that there is no question of the time at which the prophecies foretold the Lord's Coming.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 5"
