
[[commentary]]
quote='''
Malachi as well contends against those of the circumcision, and speaks on behalf of the Gentiles, when he says:

"10. I have no pleasure (in you), saith the Lord Almighty, and I will not accept a sacrifice at your hands. 11. For from the rising of the sun even to the setting my name has been glorified among the Gentiles; and in every place incense is offered to my name, and a pure offering."

By "the incense and offering to be offered to God in every place,"what else can he mean, but that no longer in Jerusalem nor exclusively in that (sacred) place, but in every land and among all nations they will offer to the Supreme God the, incense of prayer and the sacrifice called "pure," because it is not a sacrifice of blood but of good works?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"
