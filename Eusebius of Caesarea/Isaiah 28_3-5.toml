[[commentary]]
quote='''
" 3. The crown of pride, the hirelings of Ephraim shall be beaten down. 4. And the fading flower of glorious hope on the top of the high mountain shall be as the early fig: he that sees it will desire to swallow it, before he takes it into his hand. 5. In that day the Lord shall be the crown of hope, the garland of glory to the remnant of his people; for they shall be left in the spirit of judgment."

And here he prophesies that the Lord will be "a crown of hope and glory" to the remnant of his people, not to all their nation, but to those only signified by the remnant, and names the others in contrast to the remnant of his people "a crown of shame and hirelings of Ephraim."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
