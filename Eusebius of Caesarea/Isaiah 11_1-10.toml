[[commentary]]
quote='''
And Isaiah definitely foretells in words akin to his of one who shall rise from the seed and line of King David:

"A rod shall come forth from the root of Jesse, and a flower shall spring forth from his root, and the spirit of God shall rest on him, the spirit of wisdom and understanding."

And then he proceeds in prophetic style to paint the change that will transform all races of men, both Greek and barbarian, from savagery and barbarism to gentleness and mildness. For he says:

"And the wolf shall feed with the lamb, and the leopard shall lie down with the goat, and the calf and the bull and lion shall feed together."

And similar things, which he at once makes clear by interpretation, saying:

"And he that arises to rule the Gentiles, on him shall the Gentiles trust."

Thus he has made it clear that the unreasoning animals, and the wild beasts mentioned in the passage, represent the Gentiles, by reason of their being by nature like wild beasts; and he says that one arising from the seed of Jesse, from whom the genealogy of our Lord and Saviour runs, will rule over the Gentiles; on Him the nations that now believe in Him fix their hope, agreeably to the prediction, "And it shall be that he who shall rise to reign over the Gentiles, in him shall the Gentiles trust." And the words "In him shall the Gentiles trust" are the same as "And he will be the expectation of the Gentiles." For there is no difference between saying "In him shall the Gentiles trust" and "He shall be the expectation of the Gentiles."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"
