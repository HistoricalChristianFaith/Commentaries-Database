[[commentary]]
quote='''
[Passages quoted, Zech. iii. 1—6, 9; vi. 9-13.]

In this passage too the prophet-high-priest called Jesus presents, I think, a very clear picture and plain symbol of our Lord and Saviour Jesus Christ, being honoured by bearing His Name, and made the leader of the return of the people from the Babylonian captivity. Since, also, our Saviour Jesus Christ is said by the Prophet Isaiah to have been sent to preach liberty to the captives and recovery of sight to the blind, to comfort all that mourn, and to give to all that mourn in Zion glory for dust, the ointment of gladness. You have, therefore, her two great High Priests, first the Christ in Moses, and second the Jesus of whom I am speaking, both bearing in themselves the signs of the truth concerning our Lord and Saviour Jesus Christ.

But Aaron, the "Christ" in Moses' writings, having freed the people from slavery in Egypt, and led them in freedom and with all carefulness in their journey from Egypt, seems to present a picture of the real Lord, Who has redeemed us, who are of all nations, from Egyptian idolatry; while the Jesus in the prophet, the High Priest who was at the head of the return from Babylon to Jerusalem, also presents a figure of Jesus our Saviour, Whom we have as a great High Priest, that has passed through the heavens, through Whom also we ourselves, redeemed as it were in this present life from Babylon, that is from confusion and slavery, are taught to hasten to the heavenly city, the true Jerusalem.

Jesus too, since he bore in himself the image of the true, was naturally clad in filthy garments, and the devil is said to stand at his right hand and to oppose him, since also Jesus, truly our Saviour and Lord, descending into our state of slavery took away our sins, and washed away the stains of humanity, and underwent the shame of the Passion, through His love for us. Wherefore, Isaiah says:

"He bears our sins, and is pained for us, and we thought him to be in labour, and smitten, and afflicted: He was wounded for our sins, and weakened for our iniquities."

And John the Baptist also, seeing the Lord, said: "Behold the Lamb of God, which taketh away the sins, of the world." Paul also, writing in the same way about Him, says: "Him that knew no sin made sin for us, that we might become the righteousness of God in Him," and "Christ has ransomed us from the curse of the law, being made a curse for us." All these things the inspired prophet referred to when he said, "And Jesus was clad in filthy garments." But He put them from Him by His Ascension into the heavens, and the return from our condition of slavery to His own glory, and He is crowned with the diadem of His Father's Divinity, and is girt with the bright robe of His Father's light, and is glorified with the divine Mitre, and the other high priestly adornments. Nor is it difficult to explain the part about the devil, who even now is opposed to the teaching of Christ, and to His Church established throughout the whole world, and has ever been opposed to our Saviour, and marched against Him before, when He came to save us from our slavery to himself. He tempted Him also the first time, and the second time again, when by the Passion he arranged a plot against Him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 17"
