[[commentary]]
quote='''
And this very thing the great prophet Isaiah wonderfully foreknew by the Holy Spirit, and foretold. And he therefore says thus:

"O Lord, my God, I will glorify thee, I will hymn thy name, for thou hast done marvellous things."

And he goes on to explain what these things so truly "wonderful" are:

"And the Lord of Sabaoth shall make a feast for all the nations. They shall drink joy, they shall drink wine, they shall be anointed with myrrh (on this mountain). Impart thou all these things to the nations. For this is God's counsel upon all the nations."

These were Isaiah's "wonders."the promise of the anointing with ointment of a good smell, and with myrrh made not to Israel but to all nations. Whence not unnaturally through the chrism of myrrh they gained the name of Christians. But he also prophesies the "wine of joy "to the nations, darkly alluding to the sacrament of the new covenant of Christ, which is now openly celebrated among the nations.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 10"
