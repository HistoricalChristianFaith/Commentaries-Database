[[commentary]]
quote='''
He promises so to do, and from that very point earnestly bids the Church, and His brethren to hymn the Father's praise. Wherefore He says: "Ye that fear the Lord praise him, glorify him all ye seed of Jacob." And: "Let all the seed of Jacob fear him, for he hath not despised, nor been angered at the prayer of the poor, nor turned away his face from him, but when he cried unto him he heard him." And thus he clearly shewed His release from the evils that were named before. For if God heard Him when He cried to Him, when He prayed for His life to be delivered from the sword, and His Only-begotten from the dog, and His lowliness from the mouth of the lion, and the horns of the unicorn, it follows that we must understand Him to be released from them, when He says: "For God was not angered by his prayer, and turned not his face from him, but when he called unto him, he heard him." And so it came to pass that being rescued from His woes, and escaping from death, He sojourned with His disciples and brethren, and sang His Father's praise "in the midst of the Church." And notice how He calls Himself "poor," in harmony with the prophecies already quoted, in which He was called poor and a beggar.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
