[[commentary]]
quote='''
And which were the days after the age of Zechariah, when the spoils of Jerusalem were divided, and all nations were gathered against them in battle, and the city was taken, their houses looted, their women defiled, and they themselves led into captivity, while the Lord was at the same time aiding the nations warring against Jerusalem and drawn up against them? Or when did His feet stand on the Mount of Olives? Or when was the Lord King of all the earth, when was there one Lord over all men, when did His Name encircle the whole earth and the wilderness? It is impossible to argue that this was fulfilled previously to the period of the Romans, in whose time the Jewish Temple was burnt for the second time after its destruction by the Babylonians, and their city from then till now has been inhabited by foreign nations.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 4"
