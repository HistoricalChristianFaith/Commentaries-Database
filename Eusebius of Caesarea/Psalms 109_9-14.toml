[[commentary]]
quote='''
And you will understand the rest of the Psalm in a similar sense. The words that follow, spoken as of certain children of Judas, "Let his children be orphans," and the like, may be referred primarily to Judas, and secondarily to all who like him betray the word of salvation. And you may understand in a similar way, his wife, and the sins of his father, and of the Jewish Synagogue, which is called his mother. For I think that this is meant by "let not the sin of his mother be done away."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 3"
