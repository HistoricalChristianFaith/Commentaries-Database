[[commentary]]
quote='''
And this same remnant was like the seed of the falling away of Jacob that trusted in the strength of God, and this remnant of the whole race that once was as the sand of the sea, but not as the stars of the heaven, was thought worthy of salvation by God, as the Apostle bore witness saying :

"Isaiah cries concerning Israel, If the number of the children of Israel shall be as the sand of the sea, a remnant shall be saved."

For of the promises gives by the oracle to Abraham concerning those who were to come after him that "they shall be as the stars of the heaven, and as the sand of the sea," the friends of God are meant, on the one hand shining like the heavenly lights, such as were those of old, the prophets and our Saviour's apostles, to whom He bore witness saying : "Ye are the light of the world" ; but, on the other, the earth-born who lie upon the ground are compared to the sand of the shore. The prophetic word speaks rightly in the above, first where the whole multitude of Israel's sons, fallen from their true and magnificent virtue to the ground, is compared to the sand of the sea, and then when it says only the remnant shall be saved.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
