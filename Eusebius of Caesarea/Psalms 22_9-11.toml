[[commentary]]
quote='''
Such, then, was His prayer concerning the affliction that overtook Him. And since He knew that His original union with our flesh, and His birth of a woman that was a Virgin was no worse experience than the suffering of death, while He speaks of His death He also mentions His birth, saying to the Father:

"Thou art he that took me out of my mother's womb: Thou wast my hope even from my mother's breasts. On thee was I cast from my mother: from my mother's womb thou art my God."

Thus He naturally remembers this to comfort Him in His present affliction.

"For just as Thou wert My Succour," He says, "when I took the body of man, when Thou, my God and Father, like a midwife didst draw the body that had been prepared for Me by the Holy Spirit from My travailing mother, putting forth Thy power, to prevent any attempt or plan of hostile powers, envious of My entry into humanity. And since at the very Conception Thou didst overshadow that which was in the womb, so that the rulers of this world might not be aware of the Conception of the Holy Virgin by the Holy Spirit; which mighty mystery thy Archangel Gabriel did reveal to Mary, saying: 'The Holy Spirit shall come upon thee, and the power of the Highest shall overshadow thee.' Just as the power of the Highest overshadowed Me when I was conceived, and took Me out of My mother's womb when I was born, so it is now My sure consolation, that Thou wilt much more save Me from death. And in this hope I put My trust in Thee, My God, My Lord, My Father: I put My trust not as now first beginning My hope in Thee, for I trusted Thee even when I drew My infant food from My mother's breasts, and was thought to be like human babes powerless and without reason. Such I was not, though I had a human body: it was not like in power or substance to other bodies, I was free and unfettered, as Thy Lamb, O God, though at that age nourished with milk, I mean from My mother's breasts. And no one will think this impossible, if he remembers that even before I was cast on Thee from My mother, and from the womb of My mother Thou art My God. For while still carried in the treasury of her that brought Me forth I saw Thee, My God, as one who continued separate and untroubled though in such close contact with things of flesh, yea, as one who had no body yet and was free of all bonds. And so was I cast on Thee from My mother, on Thee, My God, from My mother's breasts, so that My power was felt while I was still borne in the womb of the Holy Virgin by My forerunner John, while he was yet in the womb of Elizabeth, so that, stirred by My divinity, he leapt for joy, and was filled with the Holy Spirit.

"Bearing such memories in My mind, and ever setting My God and Father before My eyes, it is not strange that in this present hour of supreme suffering I should do the same, when in My obedience to Thee, My Father, of My own will and consent I became a worm and no man, a reproach of men and the outcast of the people. And now when all who gaze on My body nailed to the Cross think they see a sight of ill omen and mock Me, pouring such a flood of reviling and satire upon Me, shewing that they not only think evil of Me and harbour it in their minds, but speak it without fear and say it openly: for 'They spoke with their lips, and shook their heads, saying, He trusted in the Lord, let Him deliver him.'

"So now when such troubles hem Me in, I call upon Thee, My Father, who drew Me out of My mother's womb, on Whom I was cast from My mother, in Whom I trusted from her breasts, made known to Me and acknowledged as My God even from My mother's womb, and I beseech Thee not to depart from Me, for affliction is near. For there comes, He says, yea, is all but come and at the door, afflicting Me and pressing upon Me the last cloud of all, the cloud of My surpassing trouble. I do not mean this trouble which now enfolds Me, nor the Cross, nor the jeers of men, nor the mockery, nor anything at all that I underwent before the Cross, scourging, insults, nor all My vile treatment from the sons of men; but I look to the dissolution of the body in death itself, and the descent into Hades next thereto, and the onset of the hostile powers opposed to God. And I therefore say, 'Trouble is near, and there is no helper.'"

It is surely the very climax of affliction to have no helper.

For Christ went thither for the salvation of the souls in Hades that had so long awaited His arrival, He went down to shatter the gates of brass, and to break the iron bonds, and to let them go free that before were prisoners in Hades. Which was indeed done, when many bodies of the saints that slept arose and entered with Him into the true Holy City of God. But the opposing powers, added to mere human evil, attacked Him, grieving and afflicting Him sorely, though in His excess of goodness He lamented even over them.

But observe how all this is said, as in the person of Him that was carried in a mother's womb, and born of a mother, Whom we called the Lamb of God. For the words about the Passion apply to Him, just as did those about the Incarnate Birth. For that which is born must die, and that which dies can only travel the road to death which starts from birth.

This, then, our Lord and Saviour unfolds, not as being in nature without flesh and body, nor in so far as He is regarded as the Word of God and Divine, but in so far as He was able to say in His prayer to His Father:

"Thou didst draw me out of my mother's womb, thou wast my hope from my mother's breasts. I was cast on thee from my mother, thou art my God from my mother's womb."

He then in His Passion prays such a prayer to His Father, and says:

"Many hostile forces will surround Me, unclean daemons, and spirits of wickedness, and above all the prince of this world himself the vilest of them all, who because of their wickedness may well be called after evil beasts, be it savage bulls, or calves, or lions, or dogs. And as I essay to withstand them all, but to do them no good, because from the intense evil of their nature they are incapable of receiving good from Me, with none of them for My helper or fellow-worker in My contest on behalf of the souls in Hades, am I not right in saying, 'Trouble is near, and there is no helper'?"

Of course it was not to be expected that any of the evil and hostile powers would have worked with Him, or aided Him in His mission of good. But surely the bitterest element in the cup of pain that was His, was that none of the good and favouring angels, and none of the divine powers, dared to venture to the halls of Death and help Him in succouring the souls there. For in Him alone was there courage, since to Him only were the gates of death opened, Him only the janitors of Hades saw and feared, and He that has the power of death, descending from His royal throne, as recognizing Him only for His Lord, spoke gently to Him with prayer and supplication, as Job relates. Yet He, seeing the impious realm of the tyrant so strong that no heavenly being dared to accompany Him to that bourne, or to help Him in saving the souls there, cries naturally, "Trouble is near, and there is no helper," since the only Being from heaven who could have helped Him had forsaken Him, so that the glory and independence of His own choice and of His own victory might be proclaimed to all. And since the only Being that could help Him was not then His helper, it is natural that His first words should be, "Eli, Eli, lama sabachthani?" that is, "My God, My God, why hast thou forsaken me?" For when He was conceived, and when He was brought forth by the Holy Virgin His Father's power was with Him, when the Holy Spirit came upon the maiden, and the Power of the Highest overshadowed her, and the Father Himself, as the oracle shews, drew forth Him that was begotten from her womb. But when in the hour of His Passion He entered on His struggle with Death, the Helper was no longer with Him. Yea, I believe His own witness of this. For the words, "Eli, Eli, lama sabachthani?" which He spoke on the Cross, and which were prophetically foretold in the Psalm, what else do they mean but that like a great athlete He was matched against all these adversaries, while Almighty God ordered the contest and gave the decision? Thus He summons His Father as the overseer of what is being done, and as the adviser, like a clever Anointer, to come to Him, especially as He has no other helper, but only Him that governs the contest. And so He says in prayer, "Be not thou far from me, for trouble is near, and there is no helper."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
