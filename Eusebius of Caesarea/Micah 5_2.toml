[[commentary]]
quote='''
And moreover, the definite place of His prophesied birth is foretold by Micah, saying: "And thou, Bethlehem, House of Ephratha, art the least that can be among the thousands of Judah. Out of thee shall come a leader, who shall feed my people Israel. And his goings forth are from the beginning from the days of eternity."

Now all agree that Jesus Christ was born in Bethlehem, and a cave is shewn there by the inhabitants to those who come from abroad to see it. The place of His birth then was foretold.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"

[[commentary]]
quote='''
And after this the same prophet, having prepared the way by telling of what related to the fact of the Descent of God the Word from heaven, and foretold what should be the causes of His coming, proceeds to relate His birth among men, and to name the place where He should be born, in the following words:

"2. And thou, Bethlehem, house of Ephratha, art the least to be among the thousands of Judah, out of thee shall come forth for me a leader, to be for a ruler in Israel, and his goings-forth are from the beginning from the days of eternity."

Note with care how he says that the goings forth of Him that shall appear at Bethlehem are from above and from eternity, by which he shews the pre-existence and essential origin of Him that is to come forth from Bethlehem. Now if any person can apply the oracle to any one but Jesus, let him shew who it is; but if it is impossible to find any one but our Lord Jesus Christ, Who is the only Person after the date of this prophecy Who came forth thence and attained to fame, what should hinder us from acknowledging the truth of the prophecy, which directs its prediction on Him only? For He alone of all men is known to have come forth from the before-named Bethlehem after the date of the prophecy, putting on a human shape, and what had been foretold was fulfilled at His coming. For at once and not after a long time the woes that were foretold fell on the Jewish nation, and blessings in accordance with the prophecies on the nations as well, and He Himself, our Lord and Saviour Who came from Bethlehem, was shewn to be the ruler of the spiritual Israel, such being the name of all people of vision and piety. Note too that it is said that the goings-forth of His Divine Pre-existence are from the beginning and from the days of eternity, which would not agree with mere humanity.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 13"


[[commentary]]
quote='''
[Passage quoted, Micah v. 2-6.]

EMMANUEL, which is interpreted God with us, has been clearly shewn in the passages quoted to have been born of the Virgin, and the Angel of Great Counsel to have become a child. But the place of His Birth had also to be pointed out. It was therefore prophesied that a ruler would come forth from Bethlehem, whose goings forth were from eternity. And this could not be referred to a human being, but only to the nature of Emmanuel and the Angel of Great Counsel.

For eternal existence can be assumed only of God. A person who exists from eternity, then, is predicted as about to come forth from Bethlehem, a Jewish town not far from Jerusalem. And we find that the only famous man who was born there was David, and then later our Lord and Saviour, Jesus the Christ of God, and besides them no other. But David, who came before the date of the prophecy, was dead many years before the prediction: nor were his goings forth from the days of eternity. It only remains that the words were fulfilled in Him that was born afterwards from Bethlehem, the true Emmanuel, God the Word going forth before the whole creation, and called "God with us," especially as His Birth at Bethlehem undoubtedly shewed God's Presence, by the wonders connected with it: for St. Luke writes its record thus:

[Passage quoted, Luke ii. 1-18.]

So Luke writes. And Matthew tells the story of our Saviour's birth as follows:

[Matt. ii. 1-12.]

I have quoted these passages in full to shew that what happened at Bethlehem at the Birth of our Saviour furnishes adequate evidence that He was the Person meant by the prophecy.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 2"
