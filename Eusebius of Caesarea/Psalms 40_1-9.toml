[[commentary]]
quote='''
And after all this when He had offered such a wondrous offering and choice victim to the Father, and sacrificed for the salvation of us all, He delivered a memorial to us to offer to God continually instead of a sacrifice.

This also the wondrous David inspired by the Holy Spirit to foresee the future, foretold in these words:

"I waited patiently for the Lord, and he inclined unto me |, and heard my calling |. 2. And he brought me up out of a pit of misery |, and from miry clay |. And he set my feet on a rock | and ordered my steps aright |. 3. And he hath put a new song in my mouth |, a hymn to our God. |"

And he shews clearly what "the new song" is when he goes on to say:

"7. Sacrifice and offering thou wouldest not ; but a body hast thou prepared me |; whole burnt-offering; and sin offering thou didst take no pleasure in |. 8. Then said I, Lo, I come: | in the volume of the book it is written of me |, to do thy will, O God, I desired. |"

And he adds: "I have preached righteousness in the great congregation." He plainly teaches that in place of the ancient sacrifices and whole burnt-offerings the incarnate presence of Christ that was prepared was offered. And this very thing He proclaims to his Church as a great mystery expressed with prophetic voice in the volume of the book.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 10"
