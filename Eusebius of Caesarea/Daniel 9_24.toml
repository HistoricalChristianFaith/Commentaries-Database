[[commentary]]
quote='''
"Seven times seventy weeks," he says, "have been decided on for this people and for thy holy city, for sin to be ended, and to seal up transgression, and to blot out iniquities, and to make atonement for iniquities, and to bring in everlasting righteousness, and to seal the vision and the people, and to anoint the most holy."

It is quite clear that seven times seventy weeks reckoned in years amounts to 490. That was therefore the period determined for Daniel's people, which limited the total length of the Jewish nation's existence. And he no longer calls them here "God's people," but Daniel's, saying, "thy people." Just as when they sinned and worshipped idols in the wilderness, God called them no more His people, but Moses', saying, "Go, descend, for thy people has sinned." In the same way here too he explains why the definite limit of time is determined for them. It was that they might know they were no longer worthy to be called the people of God. And he adds, "And for thy holy city": where we hear again the unusual "thy," for he says, "for thy people, and for thy holy city," as much as to say, "the city you think to be holy." The original Hebrew and the other translators agree in the addition of "thy" both to the people and the city. For Aquila has, "On thy people, and on thy sacred city"; and Symmachus, "Against thy people, and thy holy city": wherefore in accurate codices of the Septuagint "thy" is added with an asterisk. For since Daniel had often called the people "the people of God "in the words of his prayer, and the place of the city "the holy place of God," the One who answers in contrast says that neither people nor city are God's, but "thine," who hast prayed and spoken thus of the people and the place and the city. Daniel's words run thus: "16. Let thy anger be turned away, even thy anger from Jerusalem thy city, thy holy mountain." And, "Thy people is a source of ridicule to all that are round about them." And again, "17. Shew thy face upon the desolation of thy sanctuary." And once more, "18. Behold the ruin of thy city, which is called by thy name," followed by, "19. That thy name may be named upon thy city, and upon thy people." After this prayer he adds: "20. And while I was yet speaking and praying, behold Gabriel, whom I saw in my vision, came flying, and touched me, and said what is written above."

The prophet then clearly called the city not a city pure and simple but "God's city," and the sanctuary, "God's sanctuary," and the people "God's people," from his feeling for the people. But Gabriel does not describe them in this way; on the contrary, he says, "for thy people," and "for thy holy city," shewing in so many words that city, people, and sanctuary were unworthy to be called God's.

So, then, he first defines the length of time determined for the people, and then for the city. And it is seen to be the period from the restoration of Jerusalem, which was in the reign of Darius, King of Persia, until the reign of Augustus, Emperor of Rome, and of Herod the foreign King of the Jews, in whose times our Saviour's Birth is recorded, as the prophecy goes on to shew. And he adds next:

"For sin to be ended, and to seal up transgressions, and to blot out iniquities, and to make atonement for iniquities, and to bring in everlasting righteousness, and to seal the vision and the prophet, and to anoint the most holy."

Instead of, "For sin to be ended, and to seal up transgressions," Aquila translated, "For ending disobedience, and for completing transgression." I think that our Saviour's words to the Jews, "Ye have filled up the measure of your fathers," are parallel to this. For the transgression of the Jewish nation culminated in the plot they dared to make against Him, and what Aquila calls their "disobedience "to God reached its end. For many times of old the long-suffering of God had borne with their transgressions before the Saviour came, as is shewn by the prophet's words: but just as in the case of the ancient foreign inhabitants of the land of promise it was said to Abraham, "The sins of the Amorites are not yet fulfilled," and if they were not yet fulfilled they could not yet be driven from their native land, but when they were fulfilled, they were then destroyed by Joshua, the successor of Moses: so also you will understand in the case of the before-mentioned people. For while their sins were not fulfilled, the patience and long-suffering of God bore with them, calling them many times to repentance by the prophets. But when, as our Saviour said, they had filled up the measure of their fathers, then the whole collected weight worked their destruction at one time, as our Lord taught again when He said:

"All the blood poured forth from the foundation of the world, from the blood of righteous Abel to the blood of Zacharias, shall come upon this generation."

For presuming last of all to lay their hands on the Son of God they completed their disobedience and completed their sins, according to Aquila's translation, or according to the Septuagint, "Their sin was bound and sealed." But since He came not only for the falling but for the rising again of many in Israel, as is said of Him, "Behold, he is set for the fall and rising again of many in Israel," Daniel rightly proceeds to add, "And for the blotting out of transgressions and for making atonement for iniquities." For since it was impossible for the blood of bulls and of goats to take away sins, and the whole race of mankind needed a living and true offering, of which the Mosaically designed propitiation was a type, and our Lord and Saviour was this Lamb of God, as it was said of Him, "Behold the Lamb of God, which taketh away the sin of the world; and again, "He is the propitiation for our sins, and not for ours only, but for those of the whole world "; He brings redemption also, according to Paul's words, "Who is become wisdom to us from God, and righteousness and sanctification and redemption"----he naturally teaches that His coming is at once the fulfilment and the completion of the sin of those who have sinned against Him, at the same time as it is the blotting out and purification of sins, and the propitiation for the transgressions of them that believe in Him.

And Aquila to the words, "For the fulfilling of their disobedience and the completion of their sin," added, "For the propitiation of their transgression," clearly suggesting that He would be the propitiation for all transgressions of old time done in ignorance. Next to this comes, "For the bringing in of everlasting righteousness." The Word of God is in truth Himself eternal Righteousness, Who is made unto us by God Wisdom, and Righteousness, and Sanctification, and Redemption, in the words of the Apostle. But further by His own Presence also He shared Righteousness with all men, shewing by His works that God is not only the God of the Jews, but also of the Gentiles: for there is one God, Who will judge the Circumcision from their faith, and the Uncircumcision by faith. Wherefore Peter wondering at those with Cornelius being thought worthy of receiving the Holy Spirit says, "Of a truth I perceive that God is no respecter of persons, but in every nation he that feareth him, and worketh righteousness is accepted with him." And Paul also says that the Gospel is of righteousness, saying, "For it is the power of God unto salvation to every one that believeth, to the Jew first and also to the Gentile. For the righteousness of God is revealed in it." And it is said of Christ in the Psalms: "In His days shall arise righteousness, and abundance of peace." And His coming shewed clearly the righteousness of God, who reckoned the whole of mankind worthy of the calling of God. Such was not the Mosaic dispensation, which was given to the Jews only: wherefore having appeared for a time it has passed away. But the righteousness proclaimed by our Saviour is fitly called eternal righteousness, as Gabriel said, "And to bring in eternal righteousness."

Instead of "Seal the vision and the prophet,'' Aquila gives, I think, a more suitable rendering, viz. "And for fulfilling vision and prophet." For our Lord Jesus Christ did not come as it were to seal up the visions of the prophets, for He rather opened and explained those that were of old obscure and sealed, tearing away so to say the seals impressed on them, and taught His disciples the meaning of the Holy Scriptures. Hence He says, "Behold, the lion of the tribe of Judah hath prevailed, and he has opened the seals that were set on the book," in John's Apocalypse. What are these seals but the obscurities of the prophets? Isaiah knew them well and definitely says too: "And these words shall be as the words of the sealed book." The Christ of God did not come then to shut up the vision and the prophet, but rather to open them and bring them to the light. Hence I prefer Aquila's rendering, "For fulfilling the vision and the prophet." And it agrees also with our Saviour's words, "I have not come to destroy the law or the prophets, I have not come to destroy but to fulfil." "For the end of the law is Christ," and all the prophecies concerning Him we know remained unfulfilled and uncompleted, until He came and brought fulfilment to the prophecies about Himself. It is possible, too, for the version of the Septuagint, "To seal up the vision and the prophet," to bear this meaning: "For the Law and the prophets continued until John," and from his day the ancient inspiration of the Jewish race has ceased, and its predictions of the Christ, and they who in the Holy Scriptures saw genuine visions have come to an end, as if divine grace were shut up and bound with seals: and so it is the case that from that day there has been no activity of prophet or seer among them; this has altogether ceased from the time named till our own day.

He proceeds, "And to anoint the Most Holy"; and this also is plain for the same reason, that until the time of our Saviour the Most Holy, the High Priests were anointed following the ritual performed according to the Mosaic Law, but from that date they have ceased to be, as the prophecy foretells. So too the words of Jacob to Judah foretold the cessation of the princes and rulers of the Jewish nation, as I have already stated. Now since the prophets' and priests' primacy of the people was very much later than that of the kings, the oracle in the prophecy first quoted foretells the destruction of the princes and governors of the Jewish nation, while the one we are considering predicts the cessation of the prophets and priests as well, who were of old their chief ornament, which the Coming of our Saviour actually fulfilled. And as Aquila translates, "For the anointing the most consecrated," it might be thought that the ancient Jewish High Priest was meant, since many of the inferior priests were called "holy," but only the High Priest "Most Holy." And this idea at first sight is tempting. For up to the times of our Saviour the High Priests in continuous line at the same time ruled the people, as they continuously performed the service of God according to the ritual ordained by Moses; but from our Saviour's times their order was first thrown into confusion, and shortly afterwards altogether abolished. But as I find nowhere in the Holy Scriptures the High Priest called "Most Holy," I am of opinion that in this passage only the Only-begotten Word of God is meant, who is properly and truly worthy of that name. For if men excel and reach all attainable virtue they should be content to be called "holy," sharing and participating in the character of Him Who said, "Be ye holy, for I the Lord am Holy." But what human being could rightly be called "Most Holy," except the one Beloved Son of the Father, called Holy of holies as also King of kings and Lord of lords? For to Him only, as excelling whoever of Moses' ordaining that were anointed with earthly and manufactured oil, was it said, "Thou hast loved righteousness, and hated iniquity, therefore God, even thy God, hath anointed Thee with the oil of gladness beyond thy fellows."

Being anointed wherewith, He says in His own Person in Isaiah: "The Spirit of the Lord is upon me, because he hath anointed me." Since, then, it is evident that our Saviour was anointed uniquely beyond all that ever were with the excellent spiritual, or rather divine unction, He is rightly called "Holy of holies," as one might say, "High Priest of high priests," and "Sanctified of the sanctified" according to the oracle of Gabriel.

And all these things were fulfilled when the seventy weeks were completed at the date of our Saviour's Coming.
'''
