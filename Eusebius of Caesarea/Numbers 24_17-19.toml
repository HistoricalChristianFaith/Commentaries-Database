
[[commentary]]
quote='''
MOSES, in the Book of Numbers, says of the star that appeared at the Birth of our Saviour, as follows.

[Passage quoted, Num. xxiv. 15-19.]

We are told that Balaam's successors moved by this (for the prediction was preserved most likely among them), when they noticed in the heavens a strange star besides the usual ones, fixed above the head, so to say, and, vertically above Judaea, hastened to arrive at Palestine, to inquire about the King announced by the star's appearance. Matthew the Evangelist witnesses to this as follows:

1. "And when Jesus was born in Bethlehem of Judaea, in the days of Herod the king, behold, wise men from the east came to Jerusalem saying, 2. Where is he that is born King of the Jews? for we have seen his star in the east and are come to worship him."

And when they had been sent on their way they reached Bethlehem.

9. "And, behold, again, the (same) star, which they saw before in the east, went before them, until it came and stood over where the young child was. 10. And when they saw the star, they rejoiced with exceeding great joy, and going into the house they saw the child with Mary his mother, and fell down and worshipped him."

This is the account in the Holy Gospel. But the word of the prophecy says that striking events will be heralded by the rising of the star and the birth of our Saviour Jesus Christ, viz., the crushing of the leaders of Moab, and the raid on the sons of Seth, and the inheriting by the Jewish nation of its other enemies, these being Edom and Esau. What could be thus figuratively described by the leaders of Moab, but the destruction of the invisible rulers, I mean the daemons whom the Moabites had of old considered gods? But others were not mentioned, because of Israel's idolatry in the wilderness, when "the people were initiated into the rites of Belphegor." (This daemon was honoured as a god by Balak, King of Moab.)

As, therefore, Israel was conquered on this occasion by the invisible powers of Moab, I mean by those regarded as gods by the Moabites (for they committed idolatry and worshipped idols, as Scripture says, and were initiated into the cult of Belphegor, a Moabitish daemon, and committed adultery with the women of Moab), Balaam in his prophecy appositely paints the picture of a complete reversal and change in days to come: "A star shall rise out of Jacob, and a man shall spring from Israel, and he shall crush the leaders of Moab." As if he had said, more plainly, that the daemons of Moab who once triumphed over Israel would suffer a crushing defeat on the birth of the subject of the prophecy, and that when these were crushed, the sons of Seth, Edom and Esau, and the other nations, by whom, I think, are meant those that had long been the slaves of daemonic error, would be converted from their superstition to the service of Him that was foretold. For it says: "And Edom shall be an inheritance, and Esau his enemy shall be an inheritance." So it says that those who were once enemies of God and of Israel will become the inheritance of Him that was prophesied. For He it was to Whom it was said by God and His Father: "Desire of me, and I will give thee the heathen for thine inheritance." And while they enter into the inheritance of the saints, the reverse is prophesied for Israel—for it says: "Israel hath wrought in strength." And it wrought in strength the worst sin of all; wherefore He will be aroused by them, and will drive them out. Who is this but the Word of God that was foretold, Who also "destroyed him that was saved from the city"? And I think that this refers figuratively to Jerusalem, in which all that were saved perished, or perhaps to the whole constitution of the Jewish nation. I need not describe at greater length how this was fulfilled, how, when our Saviour shone forth on mankind, the nations that before were idolaters were converted and became His portion, at the same time that the Jewish nation and their mother-city underwent unexampled sufferings. Thus, I will conclude what I have to say of the agreement of prophetic prediction with Gospel fulfilment.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 1"
