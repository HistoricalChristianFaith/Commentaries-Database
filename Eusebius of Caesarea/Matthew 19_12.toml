[[commentary]]
quote='''
And surely our Saviour's words commend a serious and severe tone of behaviour: while of His purity the great evidence is that teaching of His, in which He taught men to attain purity by cutting away from the depth of the heart the lustful desires:

"There are some eunuchs who so were born, and there are eunuchs who were made eunuchs of men, and there are eunuchs who have made themselves eunuchs for the kingdom of heaven's sake."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 6"


[[commentary]]
quote='''
At this time while Origen was conducting catechetical instruction at Alexandria, a deed was done by him which evidenced an immature and youthful mind, but at the same time gave the highest proof of faith and continence.

For he took the words, "There are eunuchs who have made themselves eunuchs for the kingdom of heaven's sake," in too literal and extreme a sense. And in order to fulfill the Saviour's word, and at the same time to take away from the unbelievers all opportunity for scandal,—for, although young, he met for the study of divine things with women as well as men,—he carried out in action the word of the Saviour.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25206.html"
source_title="Church History, Book 6, Chapter 8"
