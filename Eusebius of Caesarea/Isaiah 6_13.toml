[[commentary]]
quote='''
But also even after the departure of those who are clearly the apostles of our Saviour, he says that "a tenth" will still remain on Jewish soil:

"And again it shall be for a spoil, as a terebinth, and as an acorn, when it falls out of its husk."

The Scripture, as I suppose, means by this, that after the first siege, which they are recorded to have undergone in the time of the apostles, and of Vespasian, Emperor of the Romans, being a second time besieged again under Hadrian they were completely debarred from entering the place, so that they were not even allowed to tread the soil of Jerusalem. And this he darkly suggests in the words : "And again it shall be for a spoil, as a terebinth, and as an acorn when it falls out of its husk "
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
