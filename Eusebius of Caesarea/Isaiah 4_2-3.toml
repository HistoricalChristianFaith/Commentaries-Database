[[commentary]]
quote='''
[Passage quoted Isa. iv. 2.]

And the meaning of "the remnant of Israel" the prophet himself clearly explains by the words, "All who are registered in Jerusalem, and called holy." It will be clear to you, if you run through the whole course of this section, what that day is, in which it is said God will glorify and exalt the remnant of Israel and those who are called holy and to be written in (the book of) life. For in the beginning of his complete book the prophet having seen the vision against Judah and Jerusalem, and numbered in many words the sins of the whole people of the Jews, and uttered threats and spoken about their ruin and the complete desolation of Jerusalem, brings his vision about them to an end with the words :

" 30. For they shall be as a terebinth that has cast her leaves, and as a garden without water. 31. And their strength shall be as a thread of tow, and their works as sparks of fire, and the transgressors and the sinners shall be burnt together, and there shall be none to quench them."

And having inscribed here the prediction against them, he "lowers his tone": and making another start he enters on a second subject, and as a preface, so to say, employs such words as these, "The word which came to Isaiah the son of Amos concerning Judah and Jerusalem"; or, as Symmachus interpreted it, "on behalf of Judah and Jerusalem." From which one would perhaps expect that he was about to change to more favourable prophecies about the same peoples on whom his former predictions had showered sadness. But the succeeding passages would certainly not confirm the expectation, since they contain nothing at all that is good with regard to the race of the Jews, or that which is called Israel, neither for Judah nor Jerusalem. On the contrary, they bring many charges and accusations against Israel, and gloomy threats against Jerusalem, and prophesy for all the Gentiles salvation in their call and in the knowledge of the Supreme God. While in addition to this they tell of the coming of a new Mount, and the manifesting of another House of God, besides the one in Jerusalem. For he says after speaking about Judaea and Jerusalem:

"2. In the last days the Mount of the Lord shall be manifest, and the house of the Lord upon the tops of the mountains, and it shall be exalted above the hills, 3. and all nations shall come to it, and shall say, Come and let us go up to the Mount of the Lord, and to the house of the God of Jacob."

Such are his prophecies about all the Gentiles. Hear what he proceeds to add about the Jews:

" 6. For he has rejected his people, the house of the God of Jacob, for the land is filled as at the beginning with auguries, as the land of strangers, and many children of strangers are born to them. 7. For the land was filled with silver and gold, and there was no end of their treasures."

And that which follows after this, to which he adds:

"9. And they worshipped that which their own fingers had made, and a man bowed down, and was humbled, and I will not reject them. 10. And now enter ye into the rocks, and hide yourselves in the earth from the face of the fear of the Lord, and from the face of his glory, when he arises to shake the earth."

And in this he teaches that there will be a Resurrection of the Lord, at which all the land of the Jewish people will be shattered. For the whole portion refers to them, in the following sections as well, saying : "For the day of the Lord of Sabaoth shall be upon every one that is proud and insolent, and upon every one that is lofty and exalted." And that which follows. Wherefore it is on the day of the Lord's Resurrection, that the prophet having first addressed those who lift themselves up against the knowledge of God, says: "On this very day"; "the Lord shall be exalted in that very day, and they shall hide all the work of their hands, bearing them into the caves," clearly showing the destruction of the idols, which the Jews themselves and all other men cast away after the appearance of the Saviour, despising all superstitions :

" 20. On that day, he says, a man shall cast away his abominations of gold and silver which they made to worship vanities."

Thus speaking, it would seem, generally about all men, because of the coming call of the Gentiles. But he alludes particularly again to the Jewish race under one head as follows:

"Behold now, the Lord, the Lord of Sabaoth, will take away from Judaea and from Jerusalem the strong man and strong woman, the strength of bread, and the strength of water, 2. The giant and the strong man, and the man of war, and the judge, and the prophet, and the counsellor, and elder, and captain of fifty, 3. And the wonderful counsellor, and the clever artificer, and the wise hearer."

And that which follows. Stop at this point, and set beside the above the introduction to the prophecy, in which it was said: "The word that came from the Lord to Isaiah the son of Amoz on behalf of Judah and Jerusalem," and see how much more in accordance with what follows "against" is than "for," unless indeed some hidden meaning is contained in the words. For how could one about to take away from Judah and Jerusalem strong man and strong woman, the strength of bread and the strength of water, and all things that of old were beautiful among them, introduce his prophecy by saying it was "for" Judah and Jerusalem? And how could that which follows again be "for" them :

"Jerusalem is forsaken, and Judaea hath fallen, and their tongues [have spoken] with iniquity, disbelieving the things of the Lord "?

Nay, rather, at a time when it should be necessary for the Mountain of the Lord to be proclaimed to all the Gentiles, and the House of God on the Mount, when all the Gentiles meet and say: "Come and let us go up to the Mount of the Lord, and to the House of the God of Jacob": the Scripture using such accusations of the Jewish race, and threatening them so sorely, adds thereto all the sayings I have quoted, and teaches that of the whole Jewish race which will fall away from the holiness of God, there will be left over some of them not immersed in their common evils; and further, that being saved as it were from the sinful and lawless, and embracing piety in sincerity and truth, they will be reckoned worthy of God's Scripture, and will be called holy servants of God. And it means by these, the apostles, disciples, and evangelists of our Saviour, and all the others of the Circumcision, who believed on Him, at the time of the falling away of their whole race. Scripture darkly implies this, when it says: "In that day"—i.e. the day in which plainly all the aforesaid things shall take place connected with the calling of the Gentiles, and the falling away of the Jews—"God shall shine gloriously in counsel on the earth, to uplift and to glorify the remnant of Israel, and there shall be a remnant in Sion, and a remnant in Jerusalem, and all who are written for life in Jerusalem shall be called holy."

And it was these, who came forth from Judaea and Jerusalem that the preface meant the prophecy to allude to, when it said: "For Judaea and Jerusalem," yea, both the actual Jerusalem, and the figurative Jerusalem thought of as analagous to it. And which of the apostles of our Saviour or of His evangelists, beholding the inspired power by which "their sound is gone out into all lands, and their words to the ends of the earth," and by which all the Churches of Christ from that day to this have their words and teaching on their lips, and the laws of Christ of the new covenant preached by them, would not bear witness to the truth of the prophecy, which says that God openly will exalt and glorify in counsel and with glory the remnant of Israel through all the world, and that the remnant in Sion and the remnant in Jerusalem shall be called holy, all they who are written in the book of life? Instead of the reading of the LXX, "in counsel with glory," Aquila and Theodotion agree in interpreting "for power and glory" indicating the power given to the apostles by God, and their consequent glory with God— according to the words: "The Lord will give a word to the preachers with much power."
