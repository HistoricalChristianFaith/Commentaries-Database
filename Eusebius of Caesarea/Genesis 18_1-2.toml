[[commentary]]
quote='''
And he is no angel who is named in the previous passage, but One greater than an angel, the God and Lord who was seen beside the before-mentioned oak with the two angels in human form. Nor can it be thought that Almighty God Himself is meant. For it is impious to suggest that the Divine changes and puts on the shape and form of a man. And so it remains for us to own that it is the Word of God who in the preceding passage is regarded as divine: whence the place is even to-day honoured by those who live in the neighbourhood as a sacred place in honour of those who appeared to Abraham, and the terebinth can still be seen there. For they who were entertained by Abraham, as represented in the picture, sit one on each side, and he in the midst surpasses them in honour. This would be our Lord and Saviour, Whom though men knew Him not they worshipped, confirming the Holy Scriptures. He then thus in person from that time sowed the seeds of holiness among men, putting on a human form and shape, and revealed to the godly ancestor Abraham Who He was, and shewed him the mind of His Father.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 9"
[[commentary]]
quote='''
All that are said to have excelled in righteousness and piety since the creation of man, the great servant Moses and before him in the first place Abraham and his children, and as many righteous men and prophets as afterward appeared, have contemplated him with the pure eyes of the mind, and have recognized him and offered to him the worship which is due him as Son of God.

But he, by no means neglectful of the reverence due to the Father, was appointed to teach the knowledge of the Father to them all. For instance, the Lord God, it is said, appeared as a common man to Abraham while he was sitting at the oak of Mambre. And he, immediately falling down, although he saw a man with his eyes, nevertheless worshiped him as God, and sacrificed to him as Lord, and confessed that he was not ignorant of his identity when he uttered the words, "Lord, the judge of all the earth, wilt thou not execute righteous judgment?"

For if it is unreasonable to suppose that the unbegotten and immutable essence of the almighty God was changed into the form of man or that it deceived the eyes of the beholders with the appearance of some created thing, and if it is unreasonable to suppose, on the other hand, that the Scripture should falsely invent such things, when the God and Lord who judgeth all the earth and executeth judgment is seen in the form of a man, who else can be called, if it be not lawful to call him the first cause of all things, than his only pre-existent Word? Concerning whom it is said in the Psalms, "He sent his Word and healed them, and delivered them from their destructions."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25201.html"
source_title="Church History, Book 1, Chapter 2"
