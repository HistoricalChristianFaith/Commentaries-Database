[[commentary]]
quote='''
And he is no angel who is named in the previous passage, but One greater than an angel, the God and Lord who was seen beside the before-mentioned oak with the two angels in human form. Nor can it be thought that Almighty God Himself is meant. For it is impious to suggest that the Divine changes and puts on the shape and form of a man. And so it remains for us to own that it is the Word of God who in the preceding passage is regarded as divine: whence the place is even to-day honoured by those who live in the neighbourhood as a sacred place in honour of those who appeared to Abraham, and the terebinth can still be seen there. For they who were entertained by Abraham, as represented in the picture, sit one on each side, and he in the midst surpasses them in honour. This would be our Lord and Saviour, Whom though men knew Him not they worshipped, confirming the Holy Scriptures. He then thus in person from that time sowed the seeds of holiness among men, putting on a human form and shape, and revealed to the godly ancestor Abraham Who He was, and shewed him the mind of His Father.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 9"
