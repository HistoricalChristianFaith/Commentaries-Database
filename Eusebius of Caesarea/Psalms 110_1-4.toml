[[commentary]]
quote='''
It is now time to see how the teaching of the Hebrews shews that the true Christ of God possesses a divine nature higher than humanity. Hear, therefore, David again, where he says that he knows an Eternal Priest of God, and calls Him his own Lord, and confesses that He shares the throne of God Most High in the 109th Psalm, in which he says as follows—

"The Lord said unto my Lord, Sit thou on my right hand, | till I make thine enemies the footstool of thy feet. | 2. The Lord shall send the rod of power for thee out of Zion, | and thou shalt rule in the midst of thine enemies. | 3. With thee is dominion in the day of thy power, | in the brightness of thy saints. | I begat thee from my womb before the Morning Star. 4. The Lord sware and will not repent, | Thou art a priest for ever, after the order of Melchizedek." |

And note that David in this passage, being king of the whole Hebrew race, and in addition to his kingdom adorned with the Holy Spirit, recognized that the Being of Whom he speaks Who was revealed to him in the spirit, was so great and surpassingly glorious, that he called Him his own Lord. For he said "The Lord said to my Lord." Yea: for he knows Him as eternal High Priest, and Priest of the Most High God, and throned beside Almighty God, and His Offspring. Now it was impossible for Jewish priests to be consecrated to the service of God without anointing, wherefore it was usual to call them Christs. The Christ, then, mentioned in the Psalm will also be a priest. For how could He have been witnessed to as priest unless He had previously been anointed? And it is also said that He is made a priest forever. Now this would transcend human nature. For it is not in man to last for ever, since our race is mortal and frail. Therefore the Priest of God, spoken of in this passage, Who by the confirmation of an oath received a perpetual and limitless priesthood from God, was greater than man. "For the Lord sware," he said, "and will not repent, Thou art a priest after the order of Melchizedek." For as Moses relates that this Melchizedek was priest of the Most High God, not anointed with a prepared unguent, since he was priest of the Most High God long before the Institution of the Law, and far above the famous Abraham in virtue—for he says, "And Melchizedek, King of Salem, Priest of the Most High God, blessed Abraham." "And without any contradiction," says the apostle, "the less is blessed by the greater." As therefore, Melchizedek, whoever he was, is introduced as one who acts as priest to the Most High God, without having been anointed with a prepared unguent, He that is prophesied of by David as of the order of Melchizedek. is also spoken of as a great Being surpassing everyone in nature, as being Priest of the supreme God, and sharing the throne of His unbegotten power, and as the Lord of the prophet; and He is not simply "priest," but "eternal priest of the Father." And the divine apostle also says, examining the implications of these passages:

"17. Wherein God, willing more abundantly to shew to the heirs of promise the immutability of his counsel, confirmed it by an oath: 18. That of two immutable things, in which it was impossible for God to lie, we might have a strong consolation."

And again:

"21. For those priests were made without an oath: but this with an oath by him that said unto him: 'The Lord sware and will not repent, Thou art a priest for ever after the order of Melchizedek.'"

And:

"23. They truly were many priests, because they were not suffered to continue by reason of death. 24. But this man because he continueth ever hath an unchangeable priesthood. 25. Wherefore he is able also to save them to the uttermost that come unto God by him, seeing he ever liveth to make intercession for them."

In this a divine Power is represented as being in existing things, and underlying things that are only grasped by the mind, Which according to the Hebrew oracles is Priest to the God of the Universe, and is established in the office of priesthood to the Most High, not by earthy and human unguent, but by holy and divine virtue and power. The Object of the Psalmist's prophecy therefore is presented distinctly as an eternal Priest, and Son of the Most High God, as begotten by the Most High God, and sharing the throne of His Kingdom.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 15"

[[commentary]]
quote='''
It is therefore plain that it would be wrong to allot to any among begotten beings the sitting at the right hand of the Almighty's rule and kingdom, except to Him alone Whom I have shewn in many ways, by what I have laid before you, to be God. Understand then, that the Highest and Almighty Lord bestows on one and the same being the words, "Sit thou on my right hand," and also, "Before the morning-star I have begotten thee," and He delivers with an oath of confirmation the honour unshakeable and immutable of the continuous priesthood for ever and ever, "The Lord swore and will not repent, Thou art a priest for ever." And who could be supposed—leaving human beings out of account — even of those of the nature of angels, to have been begotten of God, and made a priest for ever, but He alone Who also said in the former prophecy, "The Lord created me as the beginning of the way for his works, before the ages he established me, in the beginning before the mountains were established, before all the hills he begets me." Give your careful attention to understanding the relations of the present Psalm to the words quoted in the previous passage; in this one the Most High God establishes to share His own throne the Second Lord, who is our Lord, saying, "Sit thou on my right hand," while in the preceding one the Scripture said that His throne would remain for ever and ever, calling Him at the same time God when it says, "Thy throne, O God, is for ever and ever." Again, in the passage before us, it says, "The Lord shall send the rod of thy power out of Sion," and in the other, "The sceptre of righteousness is the sceptre of thy kingdom"; and once more this passage says, "Sit thou on my right hand, until I make thine enemies the footstool of thy feet, and thou shalt rule in the midst of thine enemies," and the former one, "Thy arrows are sharp, O mighty one, in the heart of the king's enemies." So that what is said about His enemies in both is in agreement. Who, then, seeing with his eyes in the midst of cities, villages and countries throughout the world the Churches of our Saviour, the peoples ruled by Him, and the vast multitudes of those sanctified by Him encircled on all sides by enemies and foes of the teaching of Christ, some visible among men, some invisible and beyond the power of sight, would not wonder at this oracle addressed to the person of the subject of the prophecy, which says, "Rule in the midst of thine enemies"?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 3"
