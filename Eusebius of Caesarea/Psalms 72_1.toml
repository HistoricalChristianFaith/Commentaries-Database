
[[commentary]]
quote='''
[Passages quoted, Ps. lxxii., i, 5-8, 16b.]

As this Psalm is addressed to Solomon, the first verse of the Psalm must be referred to him, and all the rest to the son of Solomon, not Rehoboam, who was king of Israel after him, but Him that was of his seed according to the flesh, the Christ of God: for all who are acquainted with the Holy Scriptures will agree that it is impossible to connect what is said in this Psalm with him or his successors, because of what they reveal about him. Nay, how is it possible to apply to Solomon, or his son Rehoboam, the burden of the whole Psalm?—for instance, "He shall rule from sea to sea, and from the river to the ends of the earth." And "He shall remain as long as the sun, and before the moon for ever," and other similar statements. Yet the words at the beginning of the Psalm are at once seen to apply to Solomon, which say, "O God, thou wilt give judgment to the king." And the addition, "And thy justice to the king's son," to the Son of Solomon, not his firstborn who succeeded him in the kingdom (for he only ruled the Jewish nation seventeen years, being a wicked king), nor any of the successors of Rehoboam, but only to one of the seed of David, who could thus be called the son both of David and Solomon. And this is our Lord and Saviour Jesus Christ.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 3"
