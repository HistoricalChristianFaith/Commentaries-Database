[[commentary]]
quote='''
[Passage quoted, Ps. cviii. 1-8.]

AND the Apostle Peter is a sufficient witness that this prophecy refers to the traitor Judas, when, after the Saviour's Ascension, all the apostles being gathered together with many of the brethren, he stood up in the midst, and said:

"Men and brethren, this Scripture must needs have been fulfilled, which the Holy Ghost spake before by the mouth of David concerning Judas, which was guide to them that took Jesus. For he was numbered with us, and had obtained part of this ministry. Now this man purchased a field with the reward of iniquity; and falling headlong, he burst asunder in the midst, and all his bowels gushed out. And it was known unto all the dwellers at Jerusalem, insomuch as that field is called in their proper tongue Aceldama, that is to say, The field of blood. For it is written in the Book of Psalms, Let his habitation be desolate, and let no man dwell therein: and his bishopric let another take."

Peter, then, in saying thus, suggested that another must be chosen in place of Judas, to fill up the deficient number of the twelve apostles, so that the prophecy might be fulfilled. And when the lot had been cast, it fell upon Matthias, and he was numbered with the twelve apostles. Since this was thus fulfilled, it follows that the person who speaks in this Psalm can only be our Saviour, Who thought good to anticipate by the record of the Holy Spirit the very prayer that was sent up by Him to the Father at the time of His Passion, foretelling what would happen to Him in the future.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 3"
