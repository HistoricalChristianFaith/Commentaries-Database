[[commentary]]
quote='''
When the Master gave them gloomy prophecies, if they gave heed to the things He said to them: "Ye shall have tribulation," and again: "Ye shall weep and lament, but the world shall rejoice"—the strength and depth of their nature is surely plain, since they did not fear the discipline of the body, nor run after pleasures. And the Master also, as One Who would not soothe them by deceit Himself, was like them in renouncing His property, and in His prophecy of the future, so open and so true, fixed in their minds the choice of His way of life. These were the prophecies of what would happen to them for His Name's sake—in which He bore witness, saying that they should be brought before rulers, and come even unto kings, and undergo all sorts of punishments, not for any fault, nor on any reasonable charge, but solely for this—His Name's sake. And we who see it now fulfilled ought to be struck by the prediction; for the confession of the Name of Jesus ever inflames the minds of rulers. And though he who confesses Christ has done no evil, yet they punish him with every contumely "for His Name's sake," as the worst of evil-doers, while if a man swears away the Name, and denies that he is one of Christ's disciples, he is let off scot-free, though he be convicted of many crimes.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 5"
