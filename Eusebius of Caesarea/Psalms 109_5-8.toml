[[commentary]]
quote='''
And they did evil to Him instead of good, and gave Him hate in return for His love, when they were ill-disposed towards the Saviour, and Benefactor and Teacher, Who had given them such healing and treatment by His words and teaching and all sorts of benefits. In return for which, since they did evil to Him instead of good, and gave Him hatred for love, He rightly adds:

"Set a sinner over him, and let Satan stand at his right hand. When he is judged let him go forth condemned, and let his prayer be turned into sin; let his days be few, and another take his office."

And the holy apostle, applying this Scripture to the traitor, shewed clearly by anticipation what would be the end of these things. Now you yourself can see, how a sinful ruler and head was given to the Jewish race, after their presumptuous deeds against the Saviour, and how they were forced to serve strangers and idolaters instead of their ancient godly rulers. Who would not be struck by the fulfilment of the prediction? For the oracle says, "Let his days be few," and there is no doubt that the whole period after their plot against our Saviour was short, during which they appeared to abide, after which they underwent the siege and were utterly destroyed, and then another took office, namely the people founded by Christ.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 3"
