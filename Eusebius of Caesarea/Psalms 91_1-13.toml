[[commentary]]
quote='''
[Passage quoted, Ps. xc. 1-13.]

Our Lord and Saviour Jesus the Christ, so far as He is regarded as Man, is said "to dwell under the succour of the Most High, and to rest under the shelter of his God and Father." We know that, by making His Father His only refuge in the time of His Temptation by the devil, He was saved from the nets of the powers opposed to Him, here called "hunters," when, like an ordinary human being, He was driven into the wilderness to be tempted of the devil, and was in the wilderness forty days and forty nights tempted of Satan, and was, as the evangelist tells us, "with the wild beasts." These were the same, as those this Psalm mentions, when it says to Him that dwells under the protection of the Most High, "Thou shalt go upon the asp and the basilisk, and shalt trample on the lion and dragon." And it not only says that He shall be saved from them, but from "the troubling word" also. What can this mean, but the words which according to the Holy Gospel were directed against Him by the tempter?

It is worth our consideration why our Saviour, being what He was, should undergo temptation. He came to expel from man every disease and sickness, and the spirits that hampered him, and the unclean daemons which had ruled all men on earth from immemorial time by means of polytheistic superstition. He did not attack them secretly as one who hides himself, but He marched against their leaders who surrounded Him and were before invisible, in the Humanity that He had assumed, He charged into the midst of the devil and his array of daemons, trod upon asp and basilisk, trampled on lion and dragon, and destroyed the thousands and ten thousands of enemies that had ruled so long, some fighting on His right hand, some on His left, rulers and powers, and those too who are called "World-rulers of this darkness," and spiritual powers of evil; He proved thus, that they were quite powerless, and finally frightened away, far from Him, with the word of His mouth the devil himself, their instigator to evil. He went through and trampled on every power opposed to Him, He offered Himself as a target to those who wished to attack and tempt Him, and as none were able to resist Him, He won salvation for mankind. Wherefore, when the daemons saw Him, they recognized Him, because of the aforesaid sojourn in the wilderness, and said to Him, "What have we to do with thee, Jesus, Son of God? "Let this suffice on this matter.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 7"
