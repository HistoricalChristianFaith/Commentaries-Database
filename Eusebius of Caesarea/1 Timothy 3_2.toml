[[commentary]]
quote='''
If there is any question about the families of Abraham and Jacob, a longer discussion will be found in the book I wrote about the polygamy and large families of the ancient men of God. To this I must refer the student, only warning him that according to the laws of the new covenant the producing of children is certainly not forbidden, but the provisions are similar to those followed by the ancient men of God. "For a bishop," says the Scripture, "must be the husband of one wife." Yet it is fitting that those in the priesthood and occupied in the service of God, should abstain after ordination from the intercourse of marriage. To all who have not undertaken this wondrous priesthood, Scripture almost completely gives way, when it says: "Marriage is honourable, and the bed undefiled, but whoremongers and adulterers God will judge."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 9"
