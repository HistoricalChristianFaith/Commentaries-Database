[[commentary]]
quote='''
Who would not wonder hearing the Lord say by the prophet, "I come to bring together all nations and tongues," and then seeing throughout the whole inhabited world the congregations welded together in the Name of Christ through the Coming and the Call of our Saviour Jesus Christ, with the tongues of all nations in varying dialects calling on one God and Lord? To crown all, who beholding all them that believe in Christ using as a seal the sign of salvation, would not rightly be astounded hearing the Lord saying in days of old, "And they shall come and see my glory, and I will leave my sign upon them"?

We see in part, indeed, now with our own eyes the fulfilment of the holy oracles as to the first Epiphany of our Saviour to man. May it be seen completely as well in His second glorious Advent, when all nations shall see His glory, and when He comes in the heavens with power and great glory.

To that day the remainder of the prophecy must be referred, as I shall show in my own argument.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 25"
