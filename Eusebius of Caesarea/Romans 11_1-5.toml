[[commentary]]
quote='''
For I have proved, on the contrary, that it was prophesied that all the Gentiles would benefit by the coming of Christ, while the multitudes of the Jews would lose the promises given to their forefathers through their unbelief in Christ, few of them believing in our Lord and Saviour, and therefore attaining the promised spiritual redemption through Him.

About which the wonderful Apostle teaches something when he says :

"27. Isaiah also crieth concerning Israel, Though the number of the children of Israel be as the sand ot the sea, the remnant shall be saved : 28. For finishing the word and cutting it short in righteousness, because a word cut short will the Lord do upon the earth. 29. And as Isaiah said before, If the Lord of Sabaoth had not left to us a seed, we should have been as Sodom, and we should have been like to Gomorrah."

To which he adds after other things:

"1. Hath God cast away his people? God forbid. For I also am an Israelite, of the seed of Abraham, of the tribe of Benjamin. 2. God hath not cast away his people, which he foreknew. Know ye not what the Scripture saith of Elias? how he intercedes with God, speaking of Israel, 3. Lord, they have killed thy prophets, and digged down thine altars; and I only am left, and they seek my life to take it away. 4. But what saith the answer of God to him? I have reserved to myself 7000 men, who have not bowed the knee to Baal. 5. Even so then at this present time also there is a remnant according to the election of grace."

In these words the Apostle clearly separates, in the falling away of the whole Jewish people, himself and the Apostles and the Evangelists of our Saviour like Himself and all the Jews now who believe in Christ, as the seed named by the prophet in the words: "Unless the Lord of Sabaoth had left unto us a seed." And he implies that they also are that which is styled in the other prophecies "the remnant," which he says was preserved by the election of grace. And with reference to this remnant I will now return to the prophets and explain what they say, so that the argument may be based on more evidence, that God did not promise to the whole Jewish nation absolutely that the coming of Christ would be their salvation, but only to a small and quite scanty number who should believe in our Lord and Saviour, as has actually taken place in agreement with the predictions.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
