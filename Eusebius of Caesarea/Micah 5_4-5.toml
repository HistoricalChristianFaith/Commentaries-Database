[[commentary]]
quote='''
But the account of the Coming from Heaven to men of the Lord and Shepherd Himself I have already quoted from the prophecy we have before us, in which it is said:

"Hear all peoples, and let the earth attend, and all that are therein, and the Lord shall be a witness to you, the Lord from his holy house. Wherefore behold the Lord, the Lord comes forth from his place, and shall descend,"

(and that which follows); to which he adds, "For the sin of Jacob is all this done, and for the transgression of the house of Israel." But it is clear, from what the same prophet goes on to say, that it was not only because of the sin of the Jews, that the Lord came down, but also for the salvation and calling of all nations. For he proceeds to say:

"And the mountain of the Lord shall be visible to the end of the days, and many peoples shall haste to it, and many nations shall come and say, Come, let us go up to the Mount of the Lord."

And therefore, after the proclamation that the Eternal shall come forth from Bethlehem, he says that he will no more rule only over Israel, but over all men together even unto the ends of the earth; for he says:

"And he shall stand and see, and shall feed his flock with the strength of the Lord, and they shall live in the glory of the name of the Lord God: wherefore now they shall be glorified even unto the ends of the earth, and this shall be peace."

Who shall have this peace, but the earth, in which the flocks of the Lord shall be glorified? And it is plain to all that this was fulfilled after the coming of our Saviour Jesus Christ.

For before Him there was great variety of government, all nations being under tyrannical or democratic constitutions, as for instance, Egypt was ruled by its own king, and so were the Arabs, the Idumaeans, the Phoenicians, the Syrians and the other nations; there were risings of nations against nations and cities against cities, there were countless sieges and enslavements carried through in every place and country, until the Lord and Saviour came, and concurrently with His coming, the first Roman Emperor, Augustus, conquered the nations, variety of government was almost completely ended, and peace was spread through all the world, according to the prophecy before us which expressly says of Christ's disciples: "Wherefore they shall be glorified to the ends of the earth, and this shall be peace."

And the oracle in the Psalms, which says about Christ, "There shall rise in his days justice and peace," is in agreement with this. And I think that is why He is called "Prince of Peace" in the prophecy that I quoted before this. And I would ask you to notice that the prophet we are considering says at the outset that the Lord will come from heaven, and that the subject of the prophecy will only pasture his flock after His birth at Bethlehem. And the Evangelist, whose words I have cited, furnishes the evidence that this was the case with regard to our Lord and Saviour.

The Christ is called the governor and shepherd of Israel, in accord with the custom of Holy Scripture to give the name of the true Israel figuratively to all who see God and live according to His Will: just as contrariwise it calls the Jews, when they sin, by names that suit their ways, Canaanites, and seed of Canaan not Judah, Rulers of Sodom, and people of Gomorrah. Though, of course, also, all our Saviour's life was literally passed with the Jewish race, and He was the Leader of many gathered out of Israel, as many of the Jews as knew Him and believed in Him.

Such, then, was the fulfilment of the prophecy quoted.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 2"
