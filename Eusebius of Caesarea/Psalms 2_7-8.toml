[[commentary]]
quote='''
And what follows in the Psalm would agree with Him alone, where it says: "The Lord said to me, Thou art my Son. To-day have I begotten thee. Desire of me, and I shall give thee the heathen for thine inheritance, and the utmost parts of the earth for thy possession." For surely only in Him has this part of the prophecy received an indubitable fulfilment, since the voice of His disciples has gone forth into all the earth, and their words to the ends of the world. And the passage distinctly names Christ, saying as in His own person, that He is the Son of God, when it says: "The Lord said unto me, Thou art my Son. To-day I have begotten thee." With which you may compare the words in the Proverbs, also spoken in His own Person: "Before the mountains were established, before all the hills he brings me forth." And also the address by the Father to Him in Psalm cix.: "I begat thee from my womb before the Morning Star." Understand then how the holy Scriptures prophesy that one and the same Being, Christ by name, Who is also Son of God, is to be plotted against by men, to receive the nations for His inheritance, and to rule over the ends of the earth, shewing His dispensation among men by two proofs: the one being the attacks upon Him, and the other the subjection of the nations to Him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
