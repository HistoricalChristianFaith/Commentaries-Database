[[commentary]]
quote='''
He, you will remember, being sprung from this family, got rid of and slew Hyrcanus, the last of the line of ruling high-priests, with whom the government of the Jews by native rulers came to an end, Herod being, as I say, the first foreigner to be called the King of the Jews. In his time Jesus Christ was born, and at one and the same time the position of the tribe of Judah was taken away, the authority of the kingdom of the Jews destroyed, and the prophecy preceding this fulfilled: "There shall not fail a prince from Judah, nor a governor from his loins, until there come the things laid up for him," who, he says, will not only be the expectation of the Jews, but of the Gentiles. As, therefore, the expectation of the call of the Gentiles, prophesied long before to Abraham, was "laid up," until the rulers and governors of the Jewish race should have ceased, and their independent government should have been changed to submission to Rome, and to the Gentile Herod, the Evangelist Luke, noting the date of the cessation of Jewish rulers, tells us that the teaching of Christ began in the fifteenth year of the reign of Tiberius Caesar, when Pontius Pilate was governor of Judaea; and Matthew says the same in a disguised form. For having described the birth of our Lord and Saviour, he adds: "And when Jesus was born in Bethlehem of Judaea, in the days of Herod the king, behold wise men came from the East to Jerusalem, saying, Where is that which is born king of the Jews?" wherein he shews clearly enough both that they were under foreign rule, and also the calling of the foreign nations from the East by God. For foreigners ruled over the Jews, and foreigners coming from the East recognized and worshipped the Christ of God, Who had been prophesied of old.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 1"

[[commentary]]
quote='''
MOSES, in the Book of Numbers, says of the star that appeared at the Birth of our Saviour, as follows.

[Passage quoted, Num. xxiv. 15-19.]

We are told that Balaam's successors moved by this (for the prediction was preserved most likely among them), when they noticed in the heavens a strange star besides the usual ones, fixed above the head, so to say, and, vertically above Judaea, hastened to arrive at Palestine, to inquire about the King announced by the star's appearance. Matthew the Evangelist witnesses to this as follows:

1. "And when Jesus was born in Bethlehem of Judaea, in the days of Herod the king, behold, wise men from the east came to Jerusalem saying, 2. Where is he that is born King of the Jews? for we have seen his star in the east and are come to worship him."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 1"
