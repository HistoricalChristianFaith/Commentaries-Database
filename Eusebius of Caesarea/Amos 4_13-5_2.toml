[[commentary]]
quote='''
[Passage quoted, Amos. iv. 12—v. 2.]

God now proclaiming the Christ by name the seventh time is said to "strengthen the thunder" and "to create the wind," the proclamation of the Gospel being called thunder from its being heard by all men, and similarly the spirit that Christ breathed on His apostles is meant; and also the Saviour's sojourn among men has clearly fulfilled the prophecy in which God is said to make "morning" and "mist" together, morning for those that receive salvation, but for the Jews that disbelieve in Him the contrary. On whom also Scripture foretells an extreme curse, adding a lamentation for the Jewish race, which actually overtook them immediately after their impiety against our Lord and Saviour Jesus Christ. For of a truth from that day to this the House of Israel has fallen, and the vision once shewn by God and the rejection have been brought to pass, concerning the falling of their house in Jerusalem, and against their whole state, that it should not be possible for any one to lift them up, who will never more be lifted up. "There is," he says, "therefore no one to lift her up." For since they did not accept the Christ of God when He came, perforce He left them and turned to all the Gentiles, telling the cause of his turning, when He said with tears, as if almost apologizing:

"Jerusalem, Jerusalem, which killeth the prophets, and stonest them which are sent unto her, how often would I have gathered thy children together, even as a bird gathereth her nestlings under her wings, and ye would not: behold, your house is left unto you desolate."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
