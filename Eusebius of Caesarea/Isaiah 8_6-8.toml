[[commentary]]
quote='''
[Passage quoted, Isa. viii. 5-8.]

It is clear that the only way to preserve the sense of this passage is to explain it figuratively. Thus it means by the water of Siloam that goes softly, the Gospel teaching of the word of salvation. For Siloam means "sent." And this would be God the Word, sent by the Father, of Whom Moses also says, A ruler shall not fail from Juda, nor a prince from his loins, until he come for whom it is stored up, and he is the expectation of nations. For instead for whom it is stored up, the Hebrew has "Siloam," the word of prophecy using the same word Siloam there and here, which means "the one that is sent."

And Raashim again was king of the idolatrous Gentiles in Damascus, as was also the son of Romelias of the Jews in Samaria who deserted the Jewish worship of their ancestors. And so God threatens that on those who will not accept Siloam, that is to say Emmanuel, who is sent to them, and the Son born of the prophetess, and His pleasant and fruitful Word, but reject it, though it flows softly and gently, and choose for their own selves the prince of idolatrous Gentiles or the leaders of the apostasy of God's people, He will bring the strong and full flood of the river, which the word of the prophecy interprets for us to be the king of the Assyrians: meaning here again either figuratively the Prince of this world, or the power of Rome actually dominant, to which they were delivered who rejected the said water of Siloam that went softly, and embraced beliefs utterly hostile to good teaching. At once surely and without delay on those who rejected the Gospel of our Saviour, and refused the water of Siloam that went softly, the Roman army came under God's direction through all their valleys, trod down all their walls, took away from Judaea every man who could raise his head, or was able to do anything at all, and so great was their camp that it filled the whole breadth of Judaea.

So the prophecy was literally fulfilled against them. Learn why it was if you desire to know. Because Emmanuel, God with us, the Child of the Virgin, was not with them, for if they had had Him, they would not have suffered thus. Wherefore the prophet next cries to the Gentiles, saying, "Emmanuel, God with us: know ye nations and yield." And this I have interpreted, so as to shew that most prophecies can be explained either literally or figuratively.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
