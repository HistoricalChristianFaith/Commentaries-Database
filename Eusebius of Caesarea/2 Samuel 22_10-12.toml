[[commentary]]
quote='''
[Passages quoted, 2 Sam. xxii. 1, 10-12, 44-46.]

THE God that bowed the heavens and came down, Who mounted upon the man whom He had chosen, called here Cherubim by Scripture, flew up with Him making His Ascension with the divine spirits as His bodyguard, and these are called the wings of the winds. And it suggests that this was done darkly and in obscurity by some secret and hidden words, when it says, "And he made darkness his secret place."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 11"
