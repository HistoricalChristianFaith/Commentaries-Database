[[commentary]]
quote='''
Then saying that He will record the things of ages past, He goes on to say: "The Lord created me as the beginning of his ways for his works, he established me before time was." By which He teaches both that He Himself is begotten, and not the same as the Unbegotten, one called into being before all ages, set forth as a kind of foundation for all begotten things. And it is probable that the divine apostle started from this when he said of Him: "Who is the image of the invisible God, the firstborn of every creature, for all things were created in him, of things in heaven and things in earth." For He is called "Firstborn of every creature," in accordance with the words: "The Lord created me as the beginning of his road to his works." And He would naturally be considered the image of God, as being That which was begotten of the nature of the Unbegotten. And, therefore, the passage before us agrees, when it says: "Before the mountains were established, and before all the hills, he begets me."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 1"
