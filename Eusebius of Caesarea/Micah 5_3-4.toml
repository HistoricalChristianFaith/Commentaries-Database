[[commentary]]
quote='''
And to this day the inhabitants of the place, who have received the tradition from their fathers, confirm the truth of the story by shewing to those who visit Bethlehem because of its history the cave in which the Virgin bare and laid her infant, as the prophecy says:

"Therefore he shall give them until the time of her that brings forth: She shall bring forth, and the rest of their brethren shall turn to them."

And by "her that brings forth "he means accordingly her that in the former prophecies was called a Virgin, and the prophetess who was delivered of Emmanuel and the Angel of Great Counsel. For until her day and that of Him she bare the old conditions of the nation were unaltered, the prescription being laid down until the time of "her that brings forth, "that is, until the miraculous Birth of Him that was born of the Virgin; but after His day their kingdom was taken away, and the remnant of their brethren, those, that is to say, who believed in the Christ of God, became apostles and disciples and evangelists of our Saviour, whom, when they turn to Him, the Lord Himself is said to feed, not as before by angels or men that served him, but by Himself personally, so that thus they might be glorified to the ends of the earth. For they were glorified when "their voice went into all the earth, and their words to the end of the world." It is clear what a great flock of spiritual human sheep has been won for the Lord throughout the whole world by the apostles: and this flock the Lord Himself is said personally to look after and feed with His strength, being both Shepherd and Lord of the flock, so that the sheep are protected by the strong hand and mighty arm of their Master and Shepherd, from danger of attack from wild and savage beasts.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 2"
