[[commentary]]
quote='''
Yes, Moses himself writes prophetically in the oracles addressed to Abraham, that in days to come not only Abraham's descendants, his Jewish seed, but all the tribes and nations of the earth will be counted worthy of God's blessing on the common basis of a piety like Abraham's.

"1. And the Lord said to Abram, Go forth out of thy land, and from thy kindred, and from the house of thy father, and come hither into the land which I shall shew thee. 2. And I will make of thee a great nation, and I will bless thee and magnify thy name, and thou shalt be blessed, 3. and I will bless those that bless thee, and I will curse those that curse thee, and in thee all the tribes of the earth shall be blessed."

And again God said:

"Shall I hide from Abraham my servant that I shall do? For Abraham shall become a great and numerous nation, and in him all the nations of the earth shall be blessed."

How could all the nations and families of the earth be blessed in Abraham, if there was no connection between him and them, either of spiritual character or physical kinship? There was assuredly no physical kinship between Abraham and the Scythians, or the Egyptians, or the Aethiopians, or the Indians, or the Britons, or the Spaniards: such nations and others more distant than they could not surely hope to receive any blessing because of any physical kinship to Abraham. It was quite as unlikely that all the nations would have any common claim to share the spiritual blessings of Abraham. For some of them practised marriage with mothers and incest with daughters, some of them unmentionable vice. The religion of others lay in slaughter, and the deification of animals, idols of lifeless wood, and superstitions of deceiving spirits. Others burned their old men alive, and commended as holy and good the customs of delivering their dearest to the flames, or feasting on dead bodies. Men brought up in such savage ways could not surely share in the blessing of the godly, unless they escaped from their savagery, and embraced a way of life similar to the piety of Abraham. For even he, a foreigner and a stranger to the religion which he afterwards embraced, is said to have changed his life, to have cast away his ancestral superstition, to have left his home and kindred and fathers' customs, and the manner of life in which he was born and reared, and to have followed God, Who gave him the oracles which are preserved in the Scriptures.

If Moses then, who came after Abraham and established a polity for the Jewish race on the basis of the law which he gave them, had laid down the kind of laws which were the guide of godly men before his own time, and such as it was possible for all nations to adopt, so that it should be possible for all the tribes and nations of the world to worship according to Moses' enactments; which is the same as saying that the oracles foretold that through Moses' lawgiving men of all nations would worship God and follow Judaism, being brought to it by the law, and would be blessed with the blessing of Abraham—then it would have been right for us to be keeping the enactments of Moses. But if the' polity of Moses was not applicable to the other nations, but only to the Jews and not to all of them, but only to the inhabitants of Judaea, then it was altogether necessary to set up another kind of religion different from the law of Moses, that all the nations of the world might take it as their guide with Abraham, and receive an equal share of blessing with him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 2"
