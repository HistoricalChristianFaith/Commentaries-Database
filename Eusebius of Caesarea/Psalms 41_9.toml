[[commentary]]
quote='''
So far it has spoken generally about all those who conspired against Him at the time of His Passion; but it goes on now to speak of the traitor particularly, as of one of His disciples: "For the man of my peace also, in whom I trusted, who ate of my bread, hath lifted up his heel against me." Instead of which Symmachus again renders: "And a man, who was at peace with me, in whom I had confidence, who ate of my bread with me, hath magnified himself against me." For of a truth it is the lowest and most accursed of men who after sharing a master's table, and the nurture of his instruction, goes wrong and treats his benefactor in the opposite way to which he has been treated himself.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 1"
