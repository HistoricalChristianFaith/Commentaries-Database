[[commentary]]
quote='''
[Passages quoted, Ps. cxliii. 3, 5, 9.]

I CONSIDER this to be connected with my present subject. For in his wonder at the knowledge of God the Word coming to men, the Psalmist is astonished above measure at the love by which He descends from His Divinity, and lessens His natural Majesty, and reckons the human race worthy of bearing Him. So here he prays, saying, "Lord, bow the heavens and descend." While in the Seventeenth Psalm it is written, "And he bowed the heavens, and descended, and it was dark under his feet. And he rode upon Cherubim, and flew, he flew upon the wings of the winds," wherein there is a prophecy of His Ascension from earth to heaven. And when there is a fit opportunity I will shew that we must understand the Descent and Ascension of God the Word not as of one moving locally, but in the metaphorical sense which Scripture intends in the use of such conventional terms.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 9"
