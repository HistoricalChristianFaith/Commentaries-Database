
[[commentary]]
quote='''
[Passage quoted, Num. xxiv. 3-9.]

THE oracle in the previously-quoted prophecy, in saying that the Lord would come into Egypt, foretold the journey of our Lord Jesus Christ, when He went into Egypt with His parents. Here we have the prophecy of His return from Egypt in its natural order, when He came back with His parents into the land of Israel, in the words: "God led him out of Egypt." For our Lord and Saviour Jesus, the Christ of God, was the only one of the seed of Israel and of the Jewish race, Who has ruled over many nations, so that it is indisputable that He is the fulfilment of the prophecy which says, literally, "that a man will come from the Jewish race, and rule over many nations." If He be not, let him who will suggest some other famous man among the Hebrews, who has ruled over many nations. But this he cannot do, for such a man never existed. But with regard to our Saviour, truth itself will shout and cry aloud, even if we say nothing, shewing plainly that His Divine Power through the human body He took of the seed of Israel according to the flesh has ruled, yea, and even now will rule many nations.

He it was, then, and none other, Whom the prophecy foretold, in Whose time the kingdom of Gog should be exalted concurrently with the growth of Christ's power. It is said that by this figure the Hebrews disguised the Roman Empire, which grew concurrently with the teaching of Christ. And the Prophet Ezekiel also mentions Gog, naming him Ruler of Ros, Mosoeh, and Thobel, probably disguising the city of Rome under the name of Ros, because empire and power are signified in Hebrew by that word; by Mosoeh, he meant Mysia and the adjacent nations, which are now subject to Rome; and by Thobel Josephus means Iberia, saying that the Thobelian Iberians sprang from Thobel. He says that Gog, the ruler of all of them, will be exalted at the coming of the Christ prophesied, Whom God led out of Egypt, when, as Matthew records, Herod laid a plot against Him when He was a Child, and Joseph informed by God took the young Child and His mother, and afterwards returned into the land of Israel.

And Christ possessed "the glory of an Unicorn," because in Him was pleased "to dwell all the fullness of the Godhead," in the words of the Holy Apostle. And, therefore, as accounting the God of the Universe and His Father to be His Horn, He was called "Unicorn" also in other Scriptures.

And He, the Word of God, defeated with shafts of mind and spirit His enemy and opponent the devil, and all the invisible and evil powers around Him with greater invincible might, and even now rules over many nations whose gross fleshly instincts He fines down and makes them fit to tread the narrow way of eternal life.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 3"
