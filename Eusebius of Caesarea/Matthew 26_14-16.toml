[[commentary]]
quote='''
And since they attacked Him with the words of guile, attempting to entangle Him, as Holy Writ bears witness, telling us how different charges and accusations were engineered against Him at different times, He therefore adds: "And if he come to see me, his heart speaks vanity, he heaps unrighteousness on himself; he has gone out, and spoken the same against me." After this, too, He clearly reveals the vile traitor himself, who, after making a covenant with the rulers of the Jews to betray his master, no more went as he used to the school of His holy teaching, nor went as to His teacher, nor like the others passed His time with the Saviour, but awaited and hunted for an opportunity to lay hands on Him. For this is what he is accused of doing by the Holy Evangelists, of whom Matthew says:

"Then one of the twelve, called Judas Iscariot, went unto the chief priests, and said unto them, What will ye give me, and I will deliver him unto you? And they covenanted with him for thirty pieces of silver. And from that time he sought an opportunity to betray him to them."

And Mark says:

"And Judas Iscariot, one of the twelve, went unto the chief priests, to betray him unto them. And when they heard it they were glad, and promised to give him money: and he sought how he might conveniently betray him."

And Luke writes thus:

"And Satan entered into Judas that was called Iscariot, being of the number of the twelve, and he departed and spake with the chief priests and scribes, and the captains of the Temple, that he might betray him unto them, and they were glad, and covenanted to give him money. And he sought opportunity to betray him unto them apart from the multitude."

So the prophecy before us prophesies the same things, when it says:

"And if he came to see me his heart spake vanity, he gathered iniquity on himself. He went out, and spake the same. Against me all my enemies whispered";

where Symmachus renders:

"Coming in to spy on me, his heart spake vanity, he heaped unrighteousness upon it: and when he went out he spake against me. All they that hate me whispered with one voice against me."

Yes, for he alone went into his master as a friend and a disciple, to spy and search out, while he hid his plot in his own heart. And when he went out, he spake against Him at once with many of the same mind, betraying the Saviour to His enemies, and secretly made a pact with the rulers of the Jews, about other things, but of course about money as well, for which he promised to betray Him, and about which he whispered with them. Wherefore it says:

"He went out and spake at once. All my enemies whispered against me, against me they imagined evils. They determined an evil plan against me."

Perhaps the covenant for the money is meant by the "unjust word" of the prophecy, or perhaps the impious and unjust intentions they had against Him, supposing that He would be extinguished and destroyed after death, and would no longer be reckoned among the living. For such is the meaning of: "When he sleepeth he shall surely never rise up again," which Symmachus has expressed more clearly: "And falling he will not arise"; where Aquila says: "And whosoever sleep, he shall not rise again."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 1"
