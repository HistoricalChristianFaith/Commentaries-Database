
[[commentary]]
quote='''
And where the Mosaic law says "Thou shalt not commit adultery,"and assigns death as the punishment of adulterers, He who draws out the law of the Gospel teaching, says: "It was said to them of old time, Thou shalt not commit adultery; but I say unto you, thou shalt not desire at all."

Look well at the man of whom we are speaking; he was so good a Christian in his life that he restrained even his looks when they were wayward, and made it his boast so to do— for he says:

"9. And if my heart has followed my eye for the wife of another man."

And he gives the reason, as he continues:

"11. For the spirit of a man is not to be stayed, in the case of defiling another man's wife. 12. For it is a fire burning on every side, and where it enters, it utterly destroys."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"
