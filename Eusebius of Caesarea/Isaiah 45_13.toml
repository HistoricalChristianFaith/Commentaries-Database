[[commentary]]
quote='''
[Passage quoted, Isa. xlv. 12-13.]

IN these words God the Creator of the Universe first foretells by the prophet a King and Saviour who will come to build up a holy constitution, and ransom all men who are enslaved by the errors of daemons.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 4"
