[[commentary]]
quote='''
Luke, in the Acts, introduces Gamaliel as saying, at the consultation which was held concerning the apostles, that at the time referred to, "rose up Theudas boasting himself to be somebody; who was slain; and all, as many as obeyed him, were scattered." Let us therefore add the account of Josephus concerning this man.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25202.html"
source_title="Church History, Book 2, Chapter 11"
