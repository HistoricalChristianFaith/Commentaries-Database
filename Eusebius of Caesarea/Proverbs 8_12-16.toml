[[commentary]]
quote='''
And that there is a certain substance which lived and subsisted before the world, and which ministered unto the Father and God of the universe for the formation of all created things, and which is called the Word of God and Wisdom, we may learn, to quote other proofs in addition to those already cited, from the mouth of Wisdom herself, who reveals most clearly through Solomon the following mysteries concerning herself: "I, Wisdom, have dwelt with prudence and knowledge, and I have invoked understanding. Through me kings reign, and princes ordain righteousness. Through me the great are magnified, and through me sovereigns rule the earth."

To which she adds: "The Lord created me in the beginning of his ways, for his works; before the world he established me, in the beginning, before he made the earth, before he made the depths, before the mountains were settled, before all hills he begat me. When he prepared the heavens I was present with him, and when he established the fountains of the region under heaven I was with him, disposing. I was the one in whom he delighted; daily I rejoiced before him at all times when he was rejoicing at having completed the world."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25201.html"
source_title="Church History, Book 1, Chapter 2"
