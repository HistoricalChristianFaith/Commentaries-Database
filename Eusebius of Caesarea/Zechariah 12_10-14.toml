[[commentary]]
quote='''
Yea, in return for their insults to the Lord who thus prophesied, there has not failed for them lamentation, mourning and wailing. And it was only after our Saviour came, and even until our own time, that all the families of the Jewish nation have suffered pain worthy of wailing and lamentation because God's hand has struck them, delivering their mother-city over to strange nations, laying their Temple low, and driving them from their country, to serve their enemies in a hostile land; wherefore even now every house and every soul is a prey to lamentation. And so the prophecy says, "And family shall mourn by family, the family of the house of David by itself, and their wives by themselves, and all that follows this."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 4"
