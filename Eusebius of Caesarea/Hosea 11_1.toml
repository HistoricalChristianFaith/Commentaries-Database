
[[commentary]]
quote='''
[Passages quoted, Hos. x. 14; xi. 1.]

FOLLOWING the Hebrew slavishly, Aquila translates, "Out of Egypt have I called my son." But I have noted the exact words, because Matthew quoted the prophecy, when he recorded that Jesus was carried into Egypt, and returned thence to the land of Israel. And if any one objects to the idea of our Saviour's going into Egypt, let him know that He went for good reasons. For neither was it fitting for Him to restrain Herod from his self-chosen wickedness, nor that our Saviour while still an infant should begin to shew His Divine Power by working miracles before the time, which would have been the case, if He had punished Herod miraculously for plotting against Him, and had not submitted to go down to Egypt with His parents. For it was surely the note of a better dispensation that He should wait till the fitting time to begin the miracles of His Divinity, Whose whole life is known to have been gentle and patient, ready to do good deeds and acts of kindly service, and not to defend Himself from them that would not hear Him, even when "He was led as a Lamb to the slaughter, and as a sheep before her shearers was dumb." Where then is the improbability that one like Him when a child should give way before Herod's wickedness, Who we know when a man yielded and submitted to evil men, hid Himself and shrank from the glory of His miraculous works? For He used to bid those He had healed tell no one.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 4"
