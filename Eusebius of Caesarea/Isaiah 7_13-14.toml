[[commentary]]
quote='''
And if they say that she who conceived is called not a virgin but a young woman in Scripture (for so it is said it is explained among them) what worthy sign of the promise of God, we answer, would this be, if like all women after union with a man a young woman were naturally to conceive? And how could he that were born of her be God? And not simply God, but "God with us"? For that is the meaning of Emmanuel, which name it says the child is to be called. "For behold a virgin," it says, "shall conceive and bear a son, and thou shalt call his name Emmanuel, which is interpreted God with us." Where would be God's struggle, where His labour and difficulty, if a woman were to bring forth in the accustomed manner?

For in our versions translated by the Seventy, men of Hebrew race, experts in the accuracy of their knowledge of their national language, we find: "Is it a small thing for you to contend with man? And how will ye contend with God also? Therefore the Lord himself will give you a sign: Behold, a virgin shall conceive and bear a son, who shall be called God with us." (For as I said this is the meaning of Emmanuel.) And in the versions of the Jews according to the transcript of Aquila [Aquila was a proselyte, and not a Jew by birth] we have a rendering to the same effect, "Hear then, house of David; is it a small thing with you to weary men that ye would weary my God also? Therefore He will give you this sign: Behold, a young woman shall conceive and bear a son, and thou shalt call His name Emmanuel." In Symmachus it stands thus— [Symmachus is said to have been an Ebionite. There was a sect of the Jews so designated said to have believed in Christ, to which Symmachus belonged, and his rendering is as follows]—"Hear, house of David, is it not enough for you to weary men, that ye weary my God? "Therefore the Lord Himself will give you this sign: "Behold a young woman conceives and bears a son, and thou shalt call his name Emmanuel." For since the hardness of the Jewish character and their disinclination for holiness caused sweat and toil, and no common labour and struggle to the prophets of old time, therefore he says, "Is it not enough for you to weary the prophets of God, and to contend with men: but now will ye even weary my God, and contend even with my God also?" Such is Theodotion's translation. Thus the prophet calls the God, Who is like to be wearied and challenged to contend, his own God, and not the God of those whom he addresses, which he could hardly do if he referred to the Supreme God of the Jews, among whom it had been handed down from their Fathers that they must preserve the worship of God the Creator of all things. And what could the contest and labour or the toil of this God in the prophecy refer to but His entry by human birth, as I and the Septuagint interpret it, of a virgin, or even according to the current Jewish rendering, of a young woman? For you will find in Moses the phrase "young woman "used of one who is undoubtedly a virgin, at least he uses the word of one who has been violated by one person after her betrothal to another.

But also Emmanuel, the child of the Virgin, is to be endowed with more than human power, He is to choose the good before He knows evil, and to refuse evil in choosing the good: and this not in manhood but in childhood. Therefore it runs, "Before the child knows good or evil, he shall refuse evil in choosing the good," which shews that He is completely immune from evil. And He bears a greater than any human name, God with us. And this is why the sign connected with Him is said to have depth, and also height: depth, by reason of His descent to humanity, and His presence here even unto death: height, by reason of the restitution of His divine glory from the depth, or because of the divine nature of His pre-existence. Emmanuel can only be He Who has already been proved to be God the Lord, Who was seen by Abraham in human shape. And if the Jews refer the prophecy to Hezekiah, son of Ahaz, saying that his birth was thus predicted to his father, we answer that Hezekiah was not God with us, nor was any sign shewn forth in him of a divine nature. Nor was there any divine struggle or labour attendant on his birth. Hezekiah, moreover, can be shewn to be excluded by the date of the prophecy. For this prophecy was given about future events when his father Ahaz was actually king, whereas Hezekiah is known to have been born before Ahaz came to the throne. And if the prophecy we are considering has no reference to him, it is still further from referring to any other Jew who lived after its date, except to the birth of the true Emmanuel, that is, God born with us, and to the sojourn among men of our Saviour the Word of God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
