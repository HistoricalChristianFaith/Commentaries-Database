[[commentary]]
quote='''
Moses, too, promised a holy land and a holy life therein under a blessing to those who kept his laws: while Jesus Christ says likewise: "Blessed are the meek, for they shall inherit the earth," promising a far better land in truth, and a holy and godly, not the land of Judaea, which in no way excels the rest (of the earth), but the heavenly country which suits souls that love God, to those who follow out the life proclaimed by Him. And that He might make it plainer still, He proclaimed the kingdom of heaven to those blessed by Him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"
