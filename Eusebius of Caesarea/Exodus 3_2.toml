[[commentary]]
quote='''
And when an angel appears to Moses, Holy Scripture also makes it plain, saying: "The angel of the Lord appeared to him in a flame of fire in a bush." But when it refers to the actual being who replies, it calls him God and Lord, and no longer an angel.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 11"
[[commentary]]
quote='''
[Passages quoted, Exod. iii. 1, 2, 4, 5, 14; vi. 2-4.]

IN the case of the Prophets, Isaiah, say, or Jeremiah, or those like them, a man was seen, and God prophesied through him that was seen, as by an instrument; and now the Person of Christ, now that of the Holy Spirit, and now that of Almighty God, answered through the prophet. So we must suppose the Most High and Almighty God now prophesies the things before us to Moses who is under instruction by the angel that appeared to him. The intention of which must have been of this nature: "To you, O prophet, as one being instructed and not fit for aught but angelic visions, hitherto I have willed to send my angel; and I make my Name clear to thee alone, teaching thee that I am what I am, and that my Name is the Lord; but I not only showed this to thy fathers, but I gave them a greater gift, I appeared to them." I have already shewn Who it was that appeared to the fathers, when I shewed that the angel of God was called God and Lord. It will naturally be asked how He that is beyond the universe, Himself the only Almighty God, appeared to the fathers. And the answer will be found if we realize the accuracy of Holy Scripture. For the Septuagint rendering, "I was seen of Abraham, Isaac, and Jacob, being their God." Aquila says, "And I was seen by Abraham, Isaac, and Jacob as a sufficient God," clearly shewing that the Almighty God Himself, Who is One, was not seen in His own Person; and that He did not give answers to the fathers, as He did to Moses by an angel, or a fire, or a bush, but "as a sufficient God": so that the Father was seen by the fathers through the Son, according to His saying in the Gospels, "He that hath seen me, hath seen the Father." For the knowledge of the Father was revealed in Him and by Him. But in cases when He appeared to save men, He was seen in the human form of the Son, giving an earnest before the time to the godly of that salvation which should come through Him to all men; whereas when He was going to be the avenger and chastiser of the wicked Egyptians, He appeared no longer as a sufficient God, but as an angel ministering punishment, and in form of fire and flame, ready at once to devour them like wild and thorny undergrowth. So they say that the bush darkly refers to the wild, savage, and cruel character of the Egyptians, and the fire to the avenging power of the chastisement that overtook them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 13"
