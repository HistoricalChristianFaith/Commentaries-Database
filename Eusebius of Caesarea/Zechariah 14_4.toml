[[commentary]]
quote='''
And the words, "And his feet shall stand in that day on the Mount of Olives, which is before Jerusalem to the eastward," what else can they mean than that the Lord God, that is to say the Word of God Himself, will stand, and stand firm, upon His Church, which is here metaphorically called the Mount of Olives? For as "My Beloved had a vineyard," and "There was a vineyard of the Lord of Sabaoth," are used in a figurative sense of "the house of Israel and the plant of Judah His beloved vine," so also we may say in the same sense that the Church of the Gentiles has become an olive-garden to the Master, which of old He planted with wild olives, and grafted them on the apostolic roots of the good olive after cutting away the old branches, as the apostle teaches. And the Lord planted it for Himself, saying as much in the prophecy: "The Lord hath called thy name a beautiful and shady olive." For when the first vineyard should have brought forth grapes it brought forth thorns, and not justice but a cry, God rightly withdrew from it as unfruitful, its mound and its wall, and gave it to its enemies, "to rob and to tread down," according to the prophecy of Isaiah, but established another field for Himself, here named "the olive-garden," as that which had obtained God's mercy, and been planted by Christ with ever-flourishing plants, that is with souls that are holy and nourish the light, which can say, "I am like a fruitful olive-tree in the house of God."

And this Mount of Olives is said to be over against Jerusalem, because it was established by God after the fall of Jerusalem, instead of the old earthly Jerusalem and its worship. For as Scripture said above with reference to Jerusalem: "The city shall be taken, and the nations that are her enemies and foes shall be gathered together against her, and her spoils shall be divided," it could not say that the feet of the Lord should stand upon Jerusalem. How could that be, once it were destroyed? But it says that they will stand with them that depart from it to the mount opposite the city called the Mount of Olives. And this, too, the prophet Ezekiel anticipates by the Holy Spirit and foretells. For he says:

"22. And the Cherubim lifted their wings, and the wheels beside them, 23. and the glory of the God of Israel was on them above them, and he stood on the mount which was opposite to the city."

Which it is possible for us to see literally fulfilled in another way even to-day, since believers in Christ all congregate from all parts of the world, not as of old time because of the glory of Jerusalem, nor that they may worship in the ancient Temple at Jerusalem, but they rest there that they may learn both about the city being taken and devastated as the prophets foretold, and that they may worship at the Mount of Olives opposite to the city, whither the glory of the Lord migrated when it left the former city. There stood in truth according to the common and received account the feet of our Lord and Saviour, Himself the Word of God, through that tabernacle of humanity He had borne up the Mount of Olives to the cave that is shewn there; there He prayed and delivered to His disciples on the summit of the Mount of Olives the mysteries of His end, and thence He made His Ascension into heaven, as Luke tells us in the Acts of the Apostles, saying that while the apostles were with Him on the Mount of Olives:

"While they beheld he was taken up, and a cloud received him out of their sight. And as they gazed steadfastly into heaven while he went up, behold two men stood by them in white apparel, who also said, Ye men of Galilee, why stand ye gazing into heaven? This same Jesus that is taken up from you into heaven shall so come in like manner as ye have seen him go into heaven."

To which he adds: "Then they returned from the mount called the Mount of Olives, which is opposite to Jerusalem." The Mount of Olives is therefore literally opposite to Jerusalem and to the east of it, but also the Holy Church of God, and the mount upon which it is founded, of which the Saviour teaches: "A city set on a hill cannot be hid," raised up in place of Jerusalem that is fallen never to rise again, and thought worthy of the feet of the Lord, is figuratively not only opposite to Jerusalem, but east of it as well, receiving the rays of the divine light, and become much before Jerusalem, and near to the Sun of Righteousness Himself, of Whom it is said: "And on them that fear me shall the sun of righteousness arise."

And if it says next: "That the Mount of Olives shall be divided, half of it to the east and towards the sea, a very great chasm, and half of it shall lean towards the north, and half of it towards the south," it possibly shews the expansion of the Church throughout the whole inhabited world, for it has filled the east, and the western and eastern nations; it stretches to the western sea, and the isles therein; yea, it has reached to west and south, and to north and north-east. On all sides and everywhere the Church figuratively called the Olive of the Lord is planted. And it is possible that by its division is figuratively meant the schisms and heresies and moral declensions in everyday life that have taken place in the Church of Christ, and are even now taking place; for it says, the mountain shall be divided, half of it towards the east and the sea, a very great chasm, and half of it shall lean towards the north, and half of it towards the south, as being divided into four parts, two of which are worthier and better, and two the reverse. And note in this passage how the part to the east and the part to the south may refer to two sections of those who have made progress in the things of God, the first those who are perfected in knowledge and reason and the other graces of the Holy Spirit; and the second, those who live a good life but pass their time in ways self-chosen. And the other two parts separated from the first, one to the sea and one towards the north, both signify tendency to evil. For "from the face of the north," he says, "shall be burned the evil of all the inhabitants of the earth," while the Dragon is said to have his home in the sea. So that, probably, two kinds of character in those that fall away from the Church, the morally sinful, and the one who slips away from healthy and orthodox knowledge, are here figuratively represented by the prophecy as divisions in the Mount of Olives.
'''
