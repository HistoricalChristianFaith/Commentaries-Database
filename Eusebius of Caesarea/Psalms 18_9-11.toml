[[commentary]]
quote='''
[Passage quoted, Ps. xvii. 9-11.]

I CONSIDER that we have here an express prophecy of God's Descent from heaven. For after telling many divine truths he adds the above. In saying "He bowed the heavens and came down," he notes that humiliation of the Divine Glory, which the divine apostle expressed, when he said:

"Who being in the form of God, did not consider it a prize to be equal with God, but emptied himself, and took the form of a servant."

And by the words, "He rode upon Cherubim and flew," I believe he presents darkly the return to Divine Glory, which He made surrounded by troops of angelic and divine powers. And this also seems to be intended by, "He flew upon the wings of the wind." And by "making darkness his secret-place, and darkness under his feet," is signified the hidden and secret dispensation, under which He accomplished all this. What shall we understand by "round about him was his tabernacle" but His Holy Catholic Church, either the earthly, or the heavenly?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 1"
