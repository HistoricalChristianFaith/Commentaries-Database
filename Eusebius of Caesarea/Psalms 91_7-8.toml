[[commentary]]
quote='''
Then, as in the Temptation, the evil powers encircled Him, some on His right side, and some on His left; the right being the stronger side, it is naturally said to Him, "A thousand shall fall at Thy side, and ten thousand at thy right hand, but they shall not come near Thee." "At thy side" is used for "on thy left hand," in order, perhaps, not to utter the word "left," because nothing ill omened or left-handed was found in Him. And since a myriad and a thousand are said to fall at His side and on His right hand, the next sentence comes naturally, "Yea, with thine eyes shalt thou behold, and see the reward of sinners."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 7"
