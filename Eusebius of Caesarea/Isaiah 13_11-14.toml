[[commentary]]
quote='''
"13. And I will command evils for the whole world, and their sins for the unholy, and I will destroy the pride of the lawless, and will humble the pride of the insolent, 14. and they that are left shall be more precious than gold unsmelted, and a man shall be more precious than the stone of Suphir." And afterwards it adds: "And they that are left shall be as a fleeing fawn, or as a straying sheep."

In this too the Scripture shews most plainly the small number of the saved in the time of the ruin of the wicked, so that it is not possible to expect that absolutely all the circumcised without exception and the whole Jewish race will attain to the promises of God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
