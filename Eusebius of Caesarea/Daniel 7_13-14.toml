[[commentary]]
quote='''
But what was His riding on an ass meant to shew forth but the lowly and humble manner which marked His first Coming? For the second Coming shall be glorious, that of which Daniel speaks unfolding and revealing his vision:

"9. I saw until the thrones were set, and the Ancient of Days did sit. Thousand thousands ministered to him, and ten thousand times ten thousand stood before him. 13. And, behold, one as a son of man coming with the clouds of heaven. And he came even to the Ancient of Days, 14. and there was given to him rule and honour and a kingdom, and all peoples, tribes, and tongues serve him. His power is an everlasting power, which shall not pass away, and his kingdom shall not be destroyed."

But the first Coming of His Incarnation and humiliation has this great symbol and sign among others, the prophecy that He should be called meek and gentle, and that He should come sitting upon an ass. For this is a proof of His sharing our humanity. Whereas the glory of His second divine Coming is shewn by His being borne on the clouds of heaven, and His eternal rule over all nations. And it is reasonable to quote them both to the Jews, and to ask them to explain how they can save the credit of the prophecies, if they confine them to a reference to a single Coming of Christ: for if they both refer to Christ, as they agree, they are bound to tell us when we ask them, how it is possible for the same person at the same coming to be borne upon the clouds of heaven, and also to ride on an ass and a young colt: for these two things are very different. And if you collect the many similar prophecies concerning Christ, and compare their differences side by side, you will decide that some of them refer to His first Coming, being fulfilled at His first Epiphany, while others apply to His second Coming in glory.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 17"
