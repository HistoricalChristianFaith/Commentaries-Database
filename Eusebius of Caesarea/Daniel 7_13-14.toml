[[commentary]]
quote='''
But what was His riding on an ass meant to shew forth but the lowly and humble manner which marked His first Coming? For the second Coming shall be glorious, that of which Daniel speaks unfolding and revealing his vision:

"9. I saw until the thrones were set, and the Ancient of Days did sit. Thousand thousands ministered to him, and ten thousand times ten thousand stood before him. 13. And, behold, one as a son of man coming with the clouds of heaven. And he came even to the Ancient of Days, 14. and there was given to him rule and honour and a kingdom, and all peoples, tribes, and tongues serve him. His power is an everlasting power, which shall not pass away, and his kingdom shall not be destroyed."

But the first Coming of His Incarnation and humiliation has this great symbol and sign among others, the prophecy that He should be called meek and gentle, and that He should come sitting upon an ass. For this is a proof of His sharing our humanity. Whereas the glory of His second divine Coming is shewn by His being borne on the clouds of heaven, and His eternal rule over all nations. And it is reasonable to quote them both to the Jews, and to ask them to explain how they can save the credit of the prophecies, if they confine them to a reference to a single Coming of Christ: for if they both refer to Christ, as they agree, they are bound to tell us when we ask them, how it is possible for the same person at the same coming to be borne upon the clouds of heaven, and also to ride on an ass and a young colt: for these two things are very different. And if you collect the many similar prophecies concerning Christ, and compare their differences side by side, you will decide that some of them refer to His first Coming, being fulfilled at His first Epiphany, while others apply to His second Coming in glory.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 17"
[[commentary]]
quote='''
Then, finally, at the time of the origin of the Roman Empire, there appeared again to all men and nations throughout the world, who had been, as it were, previously assisted, and were now fitted to receive the knowledge of the Father, that same teacher of virtue, the minister of the Father in all good things, the divine and heavenly Word of God, in a human body not at all differing in substance from our own. He did and suffered the things which had been prophesied. For it had been foretold that one who was at the same time man and God should come and dwell in the world, should perform wonderful works, and should show himself a teacher to all nations of the piety of the Father. The marvelous nature of his birth, and his new teaching, and his wonderful works had also been foretold; so likewise the manner of his death, his resurrection from the dead, and, finally, his divine ascension into heaven.

For instance, Daniel the prophet, under the influence of the divine Spirit, seeing his kingdom at the end of time, was inspired thus to describe the divine vision in language fitted to human comprehension: "For I beheld," he says, "until thrones were placed, and the Ancient of Days did sit, whose garment was white as snow and the hair of his head like pure wool; his throne was a flame of fire and his wheels burning fire. A river of fire flowed before him. Thousand thousands ministered unto him, and ten thousand times ten thousand stood before him. He appointed judgment, and the books were opened."

And again, "I saw," says he, "and behold, one like the Son of man came with the clouds of heaven, and he hastened unto the Ancient of Days and was brought into his presence, and there was given him the dominion and the glory and the kingdom; and all peoples, tribes, and tongues serve him. His dominion is an everlasting dominion which shall not pass away, and his kingdom shall not be destroyed."

It is clear that these words can refer to no one else than to our Saviour, the God Word who was in the beginning with God, and who was called the Son of man because of his final appearance in the flesh.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25201.html"
source_title="Church History, Book 1, Chapter 2"
