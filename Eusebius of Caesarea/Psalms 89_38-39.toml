[[commentary]]
quote='''
"39. But thou hast cast off and made of no account, | thou hast rejected thy Christ, | 40. and overthrown the covenant of thy servant, | Thou hast desecrated his sanctuary even to the ground. | "

And the context. To which he adds:

"51. Remember, Lord, the reproach of thy servants, | which I have borne in my bosom, even (the reproach) of many nations, | 52. wherewith thine enemies, O Lord, have reviled, | wherewith they have reviled those who suffer in exchange for thy Christ."

Christ is here clearly mentioned by name, and the circumstances attending His Passion predicted. If I had time I could shew by examining the whole Psalm that what is expressed can only apply to our Lord and Saviour, and no one else. But when Christ is named the second time here it refers to some one else than Him, in exchange for whom He is the one taken, and the Church is plainly meant, and indeed those who are called Christ's enemies have reviled it, and even now revile it. Yea, every one opposed to Christ's teaching is wont to revile us about the Sufferings of our Saviour, which He underwent for us, and especially about His Cross and Passion.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 16"
