[[commentary]]
quote='''
And the same Isaiah, continuing, prophesies these things about Christ:

"Behold my servant, whom I have chosen, my beloved in whom my soul is well pleased, he shall bring judgment to the nations."

And he adds: "Till he place judgment upon the earth, and in his name shall the Gentiles trust."

Here, then, the second time the prophet states that the Gentiles will hope in Christ, having said above "In Him shall the Gentiles trust." Though here it is "In His name shall the Gentiles trust."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 2"
