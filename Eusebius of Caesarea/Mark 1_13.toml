[[commentary]]
quote='''
Then, though the evangelist tells that, during the Temptation, He was with the wild beasts, we are not told what they were, but the prophecy in the Psalm tells us more clearly in a disguised way the kinds of beasts, viz.: "Thou shalt step on the asp and the basilisk, and shalt trample on the lion and dragon." It is thus said that he will trample on the kingliest of the wild beasts of the spirit, the lion and dragon, as well as the asp and the basilisk, that is to say, the devil himself, and the ruling evil powers that follow him.

And He bestows the power on His disciples and apostles who possess goodness like His own of walking upon serpents and scorpions, not allowing them to be tempted above that they are able; for it was for Him alone to destroy the most evil powers, and the chief of them all, the prince of this world, by His Divine Power.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 7"
