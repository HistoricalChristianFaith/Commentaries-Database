[[commentary]]
quote='''
[Passage quoted, Ps. xxi. 2-32.]

THE words, "My God, give ear to me, why hast thou forsaken me?" spoken at the opening of the Psalm, are recorded by Matthew to have been said by our Saviour at the time of the Passion:

"And at the sixth hour, there was darkness over all the earth until the ninth hour, and at the ninth hour Jesus called with a loud voice, Eloim, Eloim, lama sabachthani, that is to say, being interpreted, My God, my God, why hast thou forsaken me?"

And the Hebrew words are taken from this prophecy. So, then, the beginning of the Psalm includes the words "Eli, Eli, lama sabachthani" in the same syllables, which Aquila has thus translated: "My strong one, my strong one, why hast thou left me?" And everyone will agree that this is equivalent to our Saviour's words at the time of His Passion. You may therefore be quite convinced that the Psalm refers to Him and no one else, for its contents harmonize with none other but Him. The other predictions are exactly fulfilled in Him; and especially the words, "They parted my garments among them, and upon my vesture did they cast lots." It also foretells literally the driving in of the nails, when His hands and feet were nailed to the Cross, saying "They pierced my hands and my feet, they numbered all my bones." And the other predictions apply to Him alone, as my argument will shew. But if any one would apply them to some other person, whether king, prophet, or other godly man among the Jews, let him prove if he can how what is written is in harmony with him. For who of those who were ever born of women has attained such heights of virtue and power, as to embrace the knowledge of God with unchanging reason, with unruffled soul, and with sober mind, and to fasten all his trust on God, so as to say, "Thou art He that took me out of my mother's womb, my hope from my mother's breasts. I was cast on thee from my mother, from my mother's womb Thou art my God." And who that has ever been so cared for by God, has also become "a reproach of men "and "the outcast of the people''? By what bulls and calves can we suppose such a man to have been surrounded? And in what suffering was he "poured out like water"? How were "all his bones loosened"? How was "he brought into the dust of death," and being brought into the dust of death how does he say those words still and live and speak? Who are "the dogs "that surround him, that are other than the beforenamed "bulls and calves"? What gathering of evil men pierced his feet as well as his hands, stripped him of his raiment, divided some of it among themselves, and cast lots for the remainder? What was the sword, the dog, and the lion? Who are they that surrounded him that are called Unicorns? And how after a struggle with such numbers, after being brought into the dust of death, can he promise to proclaim His Father's name, not to all, but only to his brethren?

Who are the brethren, and what church is it of which this sufferer says, "In the midst of the Church I will hymn thee," adding, not the one Jewish nation but, "All the earth shall understand, and turn to the Lord, and all the kindreds of the nations shall worship before him"? It is for you yourself to test every expression in the Psalm, and see if it is possible to apply them to any chance character. You will find them only applicable to our Saviour, Who is most true and most to be trusted, and Who applied the words of the Psalm to Himself, as the Evangelists bear witness: Matthew in the quotations I have given, and Mark in his own record, where he says:

"And at the sixth hour there was darkness over all the earth until the ninth hour. And at the ninth hour Jesus cried with a loud voice saying, Eli, Eli, lama sabachthani, which is to say, being interpreted, My God, my God, why hast thou forsaken me? And certain of them that heard said, He calleth for Elias.''
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
