[[commentary]]
quote='''
And the prophet himself at once supplies the reason, why he called them rulers of Sodom, and people of Gomorrah: "For your hands are full of blood." And again a little further on :

"They have proclaimed their sin as Sodom and made it manifest. Woe to their soul, because they have taken evil counsel with themselves, saying, We will bind the just, for he is burdensome to us."

Since he so very clearly mentions some one's blood, and a plot against some one just man, what could this be but the plot against our Saviour Jesus Christ, through which and after which all the things aforesaid overtook them?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
