[[commentary]]
quote='''
But it must be noted here that Papias, their contemporary, says that he heard a wonderful tale from the daughters of Philip. For he relates that in his time one rose from the dead. And he tells another wonderful story of Justus, surnamed Barsabbas: that he drank a deadly poison, and yet, by the grace of the Lord, suffered no harm.

The Book of Acts records that the holy apostles after the ascension of the Saviour, put forward this Justus, together with Matthias, and prayed that one might be chosen in place of the traitor Judas, to fill up their number. The account is as follows: "And they put forward two, Joseph, called Barsabbas, who was surnamed Justus, and Matthias; and they prayed and said."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25203.html"
source_title="Church History, Book 3, Chapter 39"
