[[commentary]]
quote='''
"4. And there shall be in that day a failing of the glory of Jacob, and the riches of his glory shall be shaken. 5. And it shall be as when one gathers standing corn, and reaps the grain of the ears; 6. And it shall be as when one gathers ears in a rich valley, and stubble is left. Or as the berries of an olive tree are left, two or three on the topmost bough, or four or five on its branches, thus saith the Lord God of Israel. 7. In that day a man shall trust in him that made him, and his eyes shall look on the Holy One of Israel, 8. and they shall not trust in the altars, nor in the work of their hands, which their own fingers have made."

And in this it is clearly prophesied how Israel's glory and all her riches will be taken away, and how but a few, easily numbered, like the few berries on the branch of an olive tree, are said to be left; and these would be those of them who are believers in our Lord. And immediately after what is said about these, there is a prophecy of the whole race of mankind turning away from the error of idolatry, and coming to know the God of Israel.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
