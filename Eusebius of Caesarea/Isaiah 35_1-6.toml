[[commentary]]
quote='''
[Passage quoted, Isa. xxxv. 1-7.]

HERE also the Coming of God for salvation, bringing many blessings, is precisely foretold. The prophet says that there will be a cure for the deaf, sight for the blind, yea, even healing for the lame and tongue-tied, and this was only fulfilled at the Coming of our Saviour Jesus Christ, by Whom the eyes of the blind were opened, and the deaf regained their hearing; why need I say, how many palsied and deaf and lame also received physical cure by the hands of His disciples? And how many others, afflicted with various diseases and maladies, received of Him healing and salvation, according to the inspired prediction of prophecy, and according to the unimpeachable testimony of the Holy Gospels? And the prophecy here disguises under the name of "desert" the Church of the Gentiles, which for long years deserted of God is being evangelized by those of whom we are speaking, and it says that besides other blessings the glory of Libanus will be given to the desert. Now it is customary to call Jerusalem Lebanon allegorically, as I will show, when I have time, by proofs from Holy Scripture. This prophecy before us, therefore, teaches that by God's presence with men the glory of Libanus will be given to that which is called "desert," that is to say, the Church of the Gentiles. And for, "And the honour of Carmel," Aquila says, "the beauty of Carmel, and of Sharon, they shall see the glory of the Lord." Symmachus, "The grace of Carmel and of the plain, those shall see the glory of the Lord." And Theodotion, "The beauty of Carmel and of Sharon, they shall see the glory of the Lord." In which I think the prophet means, figuratively, not that Jerusalem, nor Judaea, but the land of the Gentiles will be counted worthy of divine knowledge. For Carmel, and that which is called Sharon were places that belonged to foreign races. That would be the literal meaning: but figuratively, even to-day, they that were before so blinded in soul, as to bow down to wood and stone and other lifeless substances, earth-bound daemons, and evil spirits instead of the God of the Universe, and they that were deaf in the ears of their mind, and lame, and palsied in all their life, are even now being released from all these and many other sufferings and weaknesses by the teaching of our Saviour Jesus Christ, receiving far better healing and benefit than that of the body, and shewing forth clearly the divine and superhuman power of the presence of the Word of God among men.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 21"

[[commentary]]
quote='''
[Passage quoted, Isa. xxxv. 3-6.]

THIS, too, was fulfilled, was clearly fulfilled, by our Saviour's miraculous works after John's preaching. Notice therefore how He bears good tidings to the desert, not generally, or to any desert, but to one particular desert by the bank of Jordan. This was because John lived there and baptized there, as Scripture says:

"John was in the desert baptizing, and there went out unto him all the land of Judaea, and all they of Jerusalem, and were baptized of him in Jordan."

I think the desert here is a symbol of that which of old was void of all God's good things, I mean the Church of the Gentiles, and the river by the desert that cleanses all that are bathed therein is a figure of some cleansing spiritual power, of which the Scriptures speak, saying, "The movements of the river make glad the city of God." And this means the ever-flowing stream of the Holy Spirit welling from above and watering the city of God, which is the name for life according to God. This river of God, then, has reached even unto the desert, that is the Gentile Church, and even now supplies it with the living water that it bears.

Moreover, it is said in this prophecy that the glory of Lebanon and the honour of Carmel shall be given to this wilderness. What is the glory of Lebanon, but the worship performed through the sacrifices of the Mosaic Law, which God refused in the prophecy which says, "Why do you bring me Libanus from Saba? And of what service to me is the multitude of your sacrifices?" He has transferred the glory of Jerusalem to the desert of Jordan, since, from the times of John, the ritual of holiness began to be performed not at Jerusalem but in the desert. In like manner, too, the honour of the Law and of its more external ordinances, was transferred to the wilderness of Jordan for the same reason, viz. that they who need the healing of their souls no longer hastened to Jerusalem but to that which was called the wilderness, because there the forgiveness of sins was preached. And I think our Saviour's own Presence at the Baptism is meant by, "And my people shall see the glory of the Lord, and the majesty of God." For then it was that the glory of our Saviour was seen, when:

"Being baptized he went up from the water, and the heavens were opened to him, and he saw the Spirit of God descending as a dove, and staying upon him."

When also there was heard "A voice from heaven, saying, This is my beloved son, in whom I am well-pleased." Yea, and every one that rightly approaches the Sacrament of Baptism, and accepts the teaching of Christ's Divinity, shall see His glory, and shall say with Paul, "Even we have known Christ after the flesh, yet now we know him not."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 6"
