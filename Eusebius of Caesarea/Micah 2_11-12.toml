[[commentary]]
quote='''
[Passage quoted, Micah ii. 11.]

Micah, too, agrees with the passages from Isaiah in stating that God will not receive all without qualification, but only those who are left. And as in Isaiah "their remnant" was called "a seed," so now those of them that are to be saved are called "a drop." And the choir of the apostles is shewn forth by those figures, as being a drop and a seed from the Jewish race, a drop from which all they that have known the Christ of God through the whole world and received His teaching, have been made worthy of the congregation foretold, having obtained redemption from their enemies.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"
