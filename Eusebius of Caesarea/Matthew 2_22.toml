[[commentary]]
quote='''
After this an angel appeared in a dream to Joseph in Egypt and commanded him to go to Judea with the child and its mother, revealing to him that those who had sought the life of the child were dead. To this the evangelist adds, "But when he heard that Archelaus did reign in the room of his father Herod he was afraid to go thither; notwithstanding being warned of God in a dream he turned aside into the parts of Galilee."

The historian already mentioned agrees with the evangelist in regard to the fact that Archelaus succeeded to the government after Herod. He records the manner in which he received the kingdom of the Jews by the will of his father Herod and by the decree of Cæsar Augustus, and how, after he had reigned ten years, he lost his kingdom, and his brothers Philip and Herod the younger, with Lysanias, still ruled their own tetrarchies.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25201.html"
source_title="Church History, Book 1, Chapters 8-9"
