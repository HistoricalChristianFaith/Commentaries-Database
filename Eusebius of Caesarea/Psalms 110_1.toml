[[commentary]]
quote='''
[Passage quoted, Ps. cix. 1-5.]

THE Lord upon thy right hand! The Psalmist here calls "Lord," our Lord and Saviour, the Word of God, "firstborn of every creature," the Wisdom before the ages, the Beginning of the Ways of God, the Firstborn and Only-begotten Offspring of the Father, Him Who is honoured with the Name of Christ, teaching that He both shares the seat and is the Son of the Almighty God and Universal Lord, and the Eternal High-Priest of the Father. First, then, understand that here this Second Being, the Offspring of God, is addressed. And since prophecy is believed by us to be spoken by the Spirit of God, see if it is not the case that the Holy Spirit in the prophet names as His own Lord a Second Being after the Lord of the Universe, for he says, "The Lord said to my Lord, Sit thou on my right hand." The Hebrews named the First Person Lord, as being universally the Lord of all, by the unspeakable Name expressed in the four letters. They did not call the Second Person Lord in a like sense, but only used the word as a special title. Naturally, then, our Lord and Saviour, Jesus Christ Himself, the Son of God, when He inquired of the Pharisees, "What think ye of Christ? Whose son is he?" on their saying, "The son of David," asked, "How then can David in spirit call him Lord, saying, The Lord said to my Lord, Sit thou on my right hand"? practically interpreting the text as not only calling Him the Lord of David, but the Lord also of the Spirit in the prophet. And if the prophetic Spirit, which we believe to be the Holy Spirit, confesses Him to be Lord, Who He teaches shares the Father's Throne, and not generally but as "His own Lord," how incomparably more certain is it that the rational powers, who come after the Holy Spirit, must say the same, and the whole visible creation, embodied and unembodied, of which of course the only Sharer of the Father's Throne would be marked out as Lord, by Whose agency all things came into being, as the holy apostle says: "In him all things were created, of things in heaven, and things in earth, visible and invisible." For He alone would have the authority of likeness to the Father, as being the only Person shewn to be throned with Him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 3"
