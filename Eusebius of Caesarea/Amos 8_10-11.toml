[[commentary]]
quote='''
This prophecy was thus fulfilled, and it goes on to say:

"And I will turn your feasts into mourning, and all your song into lamentation. And I will bring sackcloth on all loins, and baldness on every head: And I will make him as grief for a dear one, and them with him as a day of pain. Behold, the days come, saith the Lord, that I will send famine upon the earth, not a famine of bread, nor a thirst for water, but a famine of hearing the word of the Lord," etc.

And all this prophecy of what would result from their insolence against the Christ has been clearly proved to have taken place after their plot against our Saviour. For it was not before it, but afterwards from that day to this that God turned their feasts into mourning, despoiled them of their famous mother-city, and destroyed the holy Temple therein when Titus and Vespasian were Emperors of Rome, so that they could no longer go up to keep their feasts and sacred meetings. I need not say that a famine of hearing the Word of the Lord has overtaken them all, in return for their rejection of the Word of God; since with one voice they refused Him, so He refuses them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 6"
