
[[commentary]]
quote='''
So there were before the Mosaic law other commandments of God, and ordinances not like those of Moses, other laws and precepts of Christ, by which they were justified. Moses clearly shews that these were not the same as his own enactments, when he says to the people:

"Hear, Israel, the ordinances and the judgments, all that I speak in your ears this day, and ye shall learn them, and observe to do them. The Lord your God made a covenant with you in Choreb; the Lord did not make this covenant with your fathers, but with you."

See how distinctly he alludes to this covenant, when he says God did not give the same covenant to their fathers. For if he had said that absolutely no covenant was given to their fathers it would have been a false statement. For Holy Scripture testifies that a covenant of some kind was given both to Abraham and Noah. And so Moses adds that one "not the same" was given to their fathers, implying that other greater and glorious covenant, by which they were shown forth as friends of God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"
