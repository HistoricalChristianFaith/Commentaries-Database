[[commentary]]
quote='''
[Passages quoted, Gen. xii. 7; xvii. 1; xviii. 1, 17.]

AND again he adds to this, as if speaking of Another:

"For I knew that he will establish his children, and his house after him, and they will keep the ways of the Lord, to do righteousness and judgment, so that the Lord will bring on Abraham what things he spake to him."

The Lord Who answers, Who is recorded to have said this to Abraham, is represented as clearly confessing another Lord to be his Father and the Maker of all things.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 9"
