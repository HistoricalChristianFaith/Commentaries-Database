[[commentary]]
quote='''
And He, well aware of this, and receiving succour from His Father, as He had prayed, begins from that point to chant the Hymn of Triumph, making the Psalm, "Concerning the succour at dawn," in which He says: "I will recite thy name with my brethren, in the midst of the Church I will hymn thee." First, of course, to the disciples and apostles, whom He calls His brethren, He promises to announce the good news of joy and gladness in Him, And in accordance with this, Matthew teaches, saying;

"And, behold, Jesus met them, that is to say, those with Mary Magdalene, saying, All Hail. And they came to him and clasped his feet, and worshipped him. Then Jesus saith to them, Fear not, go tell my brethren, that they must go before me into Galilee. And there shall they see me."

And John, too, after the Resurrection from the dead, introduces Jesus saying to Mary:

"Touch me not, for I am not yet ascended to my Father. Go to my brethren and say to them, I ascend to my Father and your Father, and to my God and your God."

Thus He says that He will tell the Name of His Father first to the apostles, whom He calls His brethren. And after them, with swift progress, He promises that He will teach the Hymn of His Father to the Church founded in His Name throughout all the world. It is just as if some supreme teacher of philosophy should give a course of instruction in the midst of his pupils for them to hear and and understand, that He in the midst of the Church says: "I will hymn thy praise," that the Church, learning and hearing His words, might in fit manner sing back the praises, no longer of the daemons, but of the One Almighty God, by Him that preached Him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
