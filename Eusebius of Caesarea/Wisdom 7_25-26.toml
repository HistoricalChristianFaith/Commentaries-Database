[[commentary]]
quote='''
AND as the Father is One, it follows that there must be one Son and not many sons, and that there can be only one perfect God begotten of God, and not several. For in multiplicity will arise otherness and difference and the introduction of the worse. And so it must be that the One God is the Father of one perfect and only-begotten Son, and not of more Gods or sons. Even so, light being of one essence, we are absolutely obliged to regard the perfect thing that is begotten of light to be one also. For what other thing would it be possible to conceive of as begotten of light, but the ray only, which proceeds from it, and fills and enlightens all things? Everything surely that is foreign to this would be darkness and not light. And analogously to this there can be nothing like unto, nor a true copy of, the Supreme Father, Who is unspeakable light, except as regards this one thing only, Whom we are able to call the Son. For He is the radiance of the eternal light, and the unblurred mirror of the activity of God, and the image of His goodness. Wherefore it was said: " Who being the brightness of his glory, and the express image of his person." Except that the radiance is inseparable from the light of sense, while the Son exists in Himself in His own essence apart from the Father. And the ray has its range of activity solely from the light, whereas the Son is something different from a channel of energy, having His Being in Himself. And, moreover, the ray is coexistent with the light, being a kind of complement thereof; (for there could be no light without a ray:) they exist together and simultaneously. But the Father precedes the Son, and has preceded Him in existence, inasmuch as He alone is unbegotten. The One, perfect in Himself and first in order as Father, and the cause of the Son's existence, receives nothing towards the completeness of His Godhead from the Son: the Other, as a Son begotten of Him that caused His being, came second to Him, Whose Son He is, receiving from the Father both His Being, and the character of His Being. And, moreover, the ray does not shine forth from the light by its deliberate choice, but because of something which is an inseparable accident of its essence: but the Son is the image of the Father by intention and deliberate choice. For God willed to beget a Son, and established a second light, in all things made like unto Himself. Since, then, the unbegotten and eternal light is one, how could there be any other image of it, except the ray, which itself is light, preserving in all respects its likeness to its prototype? And how could there be an image of the One itself, unless it were the same as it in being one? So that a likeness is implied not only of the essence of the first, but also one of numerical quantity, for one perfect Being comes of the one eternal light, and the first and only-begotten Issue was not different or many, and it is this very Being to Which, after that Being which had no origin or beginning, we give the names of God, the Perfect, the Good: for the Son of a Father who is One must be also One. For we should have to agree that from the one fragrance of any particular object that breathes it forth, the sweet odour shed forth on all is one and the same, not diverse and many. So it is right to suppose that from the first and only Good, Which is Almighty God, is supplied an odour divine and life-giving, perceptible by mind and understanding, which is one and not many. For what variation could there be from this complete likeness to the Father, except one that was a declension and an inferiority; a supposition that we must not admit into our theology of the Son: for He is a breath of the power of God, and a pure effluence of the glory of the Creator. For a fragrant breath is poured forth from any sweet-scented substance, say from myrrh or any of the flowers and odorous plants that spring from the earth, beyond the original substance into the surrounding atmosphere, and fills the air far and wide as it is shed forth, without any deprivation, or lessening, or scission, or division of the said substance. For it still remains in its own place, and preserves its own identity, and though begetting this fragrant force it is no worse than it was before, while the sweet odour that is begotten, possessing its own character, imitates in the highest degree possible the nature of that which produced it by its own [fragrance]. But these are all earthly images and touched with mortality, parts of this lower corrupt and earthly constitution, whereas the scope of the theology we are considering far transcends all illustrations, and is not connected with anything physical, but imagines with the acutest thought a Son Begotten, not at one time non-existent, and existent at another afterwards, but existent before eternal time, and pre-existent, and ever with the Father as His Son, and yet not Unbegotten, but begotten from the Father Unbegotten, being the Only-begotten, the Word, and God of God, Who teaches that He was not cast forth from the being of the Father by separation, or scission, or division, but unspeakably and unthinkably to us brought into being from all time, nay rather before all times, by the Father's transcendent and inconceivable Will and Power. "For who shall describe his generation?" he says, and "As no one knoweth the Father save the Son, so no one knoweth the Son save the Father that begat Him."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 3"

[[commentary]]
quote='''
For if there is anything in the nature of the Universe left unexplained and inconceivable for us, and we know that there are many, such things as are promised to the godly — which eye hath not seen, nor ear heard, neither hath entered into the heart of man—according to the holy apostle, much further beyond our conception, unexplained and unnamed, inconceivable and unimaginable must be that which concerned the generation of the Only-begotten of God, since we have nothing else to say or to think of Him, except, "Who shall declare his generation?" And if one, greatly daring, were led to compare things in all ways inconceivable with visible and physical likenesses, one perchance might say that, like a fragrance or a ray of light, the Son underlay from infinite ages or rather before all ages the Father's Unbegotten Nature and ineffable Essence, and was one with Him, and was always united to the Father, as fragrance to an ointment and the ray to the light, but not analogously in all senses to such likenesses, as was said before. For lifeless bodies hold their accidents in qualities; and the ray being of one origin with the nature of light, and being in essence the same as light, could not exist outside that in which it is. Whereas the Word of God has Its own essence and existence in Itself, and is not identical with the Father in being Unbegotten, but was begotten of the Father as His Only-begotten Son before all ages; while the fragrance being a kind of physical effluence of that from which it comes, and not filling the air around it by itself apart from its primary cause, is seen to be itself also a physical thing. We will not, then, conceive thus about the theory of our Saviour's coming-into-being. For neither was He brought into being from the Unbegotten Being by way of any event, or by division, nor was He eternally coexistent with the Father, since the One is Unbegotten and the other Begotten, and one is Father and the other Son. And all would agree that a father must exist before and precede his son. Thus also would the image of God be a kind of living image of the living God, in a mode once more that is beyond our words and reasoning, and existing in Itself immaterially and unembodied, and unmixed with anything opposite to Itself, but not such an image as we connote by the term, which differs in its essential substance and its species, but one which itself contains the whole of its species, and is like in its own essence to the Father, and so is seen to be the liveliest fragrance of the Father, in a mode once again beyond our words and reasoning. For everything that is true about Him could not be spoken in human words, and could not be reasoned with the reasoning of men according to strict logic. But the Scriptures give us such instruction as it is good for us to hear. Has not the holy apostle described himself and those like him as "a fragrance of Christ," by their participation in the Spirit of Christ; and is not the heavenly Bridegroom in the Canticles addressed as "Ointment poured forth"? Wherefore all things visible and invisible, embodied and unembodied, rational and irrational participating in that outpouring of Him in due proportion are thought worthy of His presence, and have their lot in the communion of the divine Word. Yes, the whole universe imparts a share of His divine breath to those whose rational perception is not maimed, so that bodies by nature earthy and corruptible give forth an immaterial and uncorrupted fragrance; for as the God of the Universe wells down from above, Who, being Father of the Only-begotten Word, Himself must be the first and chief and only true good begetting good, so taking the second place the Son draws His supplies from the primary and original Essence, Who also is alone called the fragrance of His Father's Essence by us who use the Scripture that teaches us concerning Him, that He is "a breath of the power of God, and a pure effluence of the glory of the Almighty, and a radiance of the everlasting light, and an unsullied mirror of the action of God, and an image of his goodness."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 1"
