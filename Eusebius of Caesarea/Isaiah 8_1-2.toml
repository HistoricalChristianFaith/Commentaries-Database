[[commentary]]
quote='''
The prophet commands all this to be delivered in a new and great book in the writing of a man, by which is meant the new Covenant. And he adds as witnesses of his sayings a priest and a prophet: his word thus teaching us, of the necessity of using in Christian evidences the witness of the sacrificial system in the law, and of the prophets who succeeded it; and he desires, for other reasons, that there should be eye-witnesses of the Child's birth, that we might be able to understand what is prophesied of Him. For it was said above: "For if ye will not believe, neither will ye understand," and (he writes) that the one should have "the Light of God" (this is the meaning of Uriah), and that the other being "the Son of Blessing" should bear the "memory of God in himself" (this is the meaning of Zachariah son of Barachiah).
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
