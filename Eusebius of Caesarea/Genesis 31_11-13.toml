[[commentary]]
quote='''
Yes, and equally with us they knew and bore witness to the Word of God, Whom we love to call Christ. They were thought worthy in very remarkable ways of beholding His actual presence and theophany.

Remember how Moses calls the Being, Who appeared to the patriarchs, and often delivered to them the oracles afterwards written down in Scripture, sometimes God and Lord, and sometimes the Angel of the Lord. He clearly implies that this was not the Omnipotent God, but a secondary Being, rightly called the God and Lord of holy men, but the Angel of the Most High His Father. Thus he says:

"10. And Jacob went forth ... to Charran, 11. and came to a certain place, and he slept there. . . . And he took of the stones of the place, and put it at his head, and lay down to sleep in that place, 12. and he dreamed: and behold, a ladder fixed on the earth whose top reached to heaven, and the angels of God ascended and descended on it. 13. And the Lord stood upon it, and said, I am the God of Abraham thy father, and the God of Isaac: fear not, the earth, the land on which thou liest, to thee will I give it, and to thy seed: 14 and thy seed shall be as the sand of the earth."

To which he adds:

"16. And Jacob arose in the morning, and took the stone, which he had put under his head, and set it up as a pillar."

Then further on he calls this God and Lord Who appeared to him the Angel of God. For Jacob says:

"11. For the Angel of God said to me in a dream, Jacob. And I said, What is it? "

And then:

"12. I have seen, he says, all that Laban does to thee. I am the God that was seen by thee in the place of God, where thou anointedst for me there a pillar, and thou vowedst to me there a vow."

This same being who appeared to Abraham is called Lord and God. He teaches the saint mysteriously of His Father's rule, and speaks some things, as it were, of another God, which I will examine in their place.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 5"

[[commentary]]
quote='''
[Passage quoted, Gen. xxviii. 10-19.]

THIS Being who here answers him at such length, you will find, if you read on, to be Lord and God, and the Angel of God, from the words Jacob himself says to his wives:

"And the angel of the Lord said to me in sleep, Jacob. And I said, Here am I."

And also:

"I have seen, he says, all that Laban doeth to thee. I am the God, that was seen of thee in the place where thou anointedst the pillar for me, and offeredst prayer to me."

Therefore He that said before, I am the Lord God of Abraham thy Father, and the God of Isaac, to whom godly Jacob raises the pillar, was indeed God and Lord: for we must believe that which He Himself says. Not of course the Almighty, but the Second to Him, Who ministers for His Father among men, and brings His Word. Wherefore Jacob here calls Him an Angel: "The Angel of God said to me, speaking in my sleep, ' I am the God who was seen by thee in this place.' " So the same Being is clearly called the Angel of the Lord, and God and Lord in this place. And by Isaiah the Prophet he is called "Angel of Great Counsel," as well as God and Ruler and Potentate, where His Incarnation is prophesied in the words:

"For unto us a child is born, and to us a son is given, on whose shoulder shall be the rule, and his name shall be called the Angel of Great Counsel, Prince of Peace, the Mighty God, the Potentate, the Father of the Age to Come."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 10"
