[[commentary]]
quote='''
Now let me ask myself what it was in John that struck the multitude with fear, so that they marvelled at him and put trust in his baptism of repentance, and all from every side left their homes, and flowed in one stream into the wilderness, having regard to the fact that the records give no account of anything he did; for we are not told that he raised the dead, or worked other miracles.

What then was it that struck the multitude? Surely it was his manner of life so strange and different to that of the people; for he came forth from the desert clad in a strange garment, refusing all social human intercourse, he went not into village or city or the human haunts of men, he did not even share their common food; for it is written that from childhood he was in the deserts, until the day of his shewing forth, to Israel, yes, and his raiment was made of camels' hair, and his food locusts and wild honey.

How, then, should they not have been naturally alarmed, when they saw a man, with the hair of a Nazarite of God, and a divine face, suddenly appearing from the lonely wilderness clothed in a strange kind of dress, and after preaching to them going back again into the wilderness, without eating or drinking or mingling with the people, and must they not have suspected that he was more than human? For how could a man not need food? And so they understood him to be an angel, the very angel foretold by the prophet, in the words, "Behold, I send my angel before thy face, who shall prepare thy way before thee," a passage of Scripture which is quoted by the Evangelist Mark. And the Saviour also bears witness in the words, "John came neither eating nor drinking, and you say, He hath a devil." For it was just as natural that unbelievers, with minds hardened and shut against the truth, should thus blaspheme John because of his living as he did, as that those who were in accord with his noble character should reckon him an angel. Such, then, I understand to be the reasons why John was a marvel to those who saw him; and therefore they hastened from all sides to the cleansing of the soul, of which he preached.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25209.html"
source_title="The Proof of the Gospel, Book 9, Chapter 5"
