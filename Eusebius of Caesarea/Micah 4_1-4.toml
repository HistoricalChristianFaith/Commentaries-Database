[[commentary]]
quote='''
These things are open for the eyes to see, and it should be clear as well that it is hence that the new law and word of the new Covenant of our Saviour Jesus Christ goes forth. For countless companies of people, races of all kinds deserting their fathers' gods and their old superstitions, call on the Supreme God. And thus it is reckoned the deepest peace, there being no diversity of government or national rule, that nation should not take up sword against nation, and that they should not learn war any more, but that each farmer should rest under his vine and under his fig tree, according to the prophecy, and that none should make him afraid.

As this state of things was never achieved at any other time but during the Roman Empire, from our Saviour's birth till now, I consider the proof irrefutable that the prophet refers to the time of our Saviour's coming among men.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 3"
