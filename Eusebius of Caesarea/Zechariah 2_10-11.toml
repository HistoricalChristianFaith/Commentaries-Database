[[commentary]]
quote='''
And if it be admitted to be a noble privilege to be and to be reckoned the people of God, and if this one thing is the noblest of the divine promises, that God should say of those who are worthy of Him, "I will be their God, and they shall be my people," Israel was naturally proud in days of old of being the only people of God, but now the Lord has come to sojourn with us and promises graciously to extend this privilege to the Gentiles, saying:

"Lo, I come, and I will dwell in the midst of you, and many nations shall flee unto the Lord, and they shall be to him a people."

On which I may aptly quote : "And I will say to a people that were not my people, Ye are my people. And they shall say, Thou art the Lord our God."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25202.html"
source_title="The Proof of the Gospel, Book 2, Chapter 3"

[[commentary]]
quote='''
[Passage quoted, Zech. ii. 10, 11.]

AND this prophecy is like the former one, telling of the coming of the Christ to men, and the call of the Gentiles to salvation through Him.

"For I the Lord myself will come," He says, "and at My coming no longer Israel of old, nor one single nation of the earth alone, but many nations shall take refuge in the greater and high Lord, the God of Me Myself and of the Universe, to Whom fleeing the nations shall reap the great harvest of being called and actually becoming the people of God, and of dwelling in the midst of her that is called the daughter of Zion."

So it is common in Holy Scripture to call the Church of God on earth, as being as it were a daughter of the heavenly Zion. And this good news is told in the oracle which says:

"Rejoice and be glad, O daughter of Zion, because I come, and I will dwell in the midst of thee." For we believe that God the Word dwells in the midst of the Church. As indeed He promised when He said, " Lo, I am with you all the days, until the end of the world''—and, "Where two or three are gathered together in my name, there am I in the midst of them." And when, He says:

"I the Lord Myself, do come and dwell in the midst of you; thou shalt receive a greater knowledge of God, for I the Lord will refer the cause of My being sent to men to My Father who sent Me. Thou shalt know that the Lord Almighty has sent Me unto you."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 26"

[[commentary]]
quote='''
[Passage quoted, Zech. ii. 10.]

As it is now my object to unfold from the prophets the second cause of our Lord's living our life on earth, the prophecy before us appears to state it so clearly that it hardly needs any elaboration. You will notice that He gives the cause of His coming, where He says, "And many nations shall flee unto the Lord in that day, and they shall be to me for a people." And the Word announces this to the daughter of Sion, calling the Church of God by this name, through her seeming to be the daughter of the heavenly Jerusalem, she that is the mother of the Saints, according to the holy apostle. Or the Church of God might be called the daughter of Sion for another reason as one separated from the former congregation of the Jews by the apostles and evangelists, who also were the children of a mother divorced for her own impiety, and a widow because she had driven away her Husband, Who rebuked her by the prophets and said, "Hast thou not called me as a husband, and father, and leader of thy virginity?" And accusing their mother's ways also to them that were born of her He says: "Where is the bill of thy mother's divorcement, by which I rejected her?" And again: "Judge the cause of your mother, judge it, because she is not my wife, and I am not her husband."

So, then, this prophecy rightly announces the presence of the Lord to those who had rejected their mother (calling them) the daughter of the Lord. And it is the Church of the Gentiles that is reckoned by the apostles of our Saviour to have taken the place of her that before was daughter.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 17"

[[commentary]]
quote='''
So prophesied Zechariah after the Return from Babylon, in the reign of Darius, King of Persia, when Jerusalem was but just arisen from the desolation which it suffered under the Babylonians. And the whole period from Darius the Persian, in whose time Zechariah prophesied, even to Augustus, Emperor of Rome, amounts to the seven and sixty-two weeks of years in Daniel, which are equivalent to 483 years, as I have shewn in my recent investigations. And neither in the time of the Macedonians from Alexander onwards, not even if you include the reign of Augustus, was anything similar to the words of the prophet fulfilled. For when in those days did the Lord, Whom the prophet speaks of as divine, come among men, and many nations know Him, and confess Him to the only God, and take refuge in Him, and be to Him a people?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 4"
