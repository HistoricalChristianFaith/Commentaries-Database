[[commentary]]
quote='''
What, then, must be our conclusion from all this, when, as we have said, we find Moses summing up his whole system with a curse, where he says:

"Cursed is everyone, who shall not remain in all the things written in this law. to do them "?

Was it, then, meant that Moses' future disciples from the ends of the earth must do all these things, if they were to escape the curse and receive the blessing promised to Abraham? Were they to go thrice a year to Jerusalem, and were the female worshippers of all nations, fresh from the pangs of childbirth, to undertake so long a journey, to offer the sacrifice ordained by Moses for each one of their children? Were those who had touched a dead body, or had forsworn themselves, or had sinned against their will, to come from the ends of the earth, to run and hasten to the purification that was required by the law, in order to escape the visitation of the curse? Of course it is clear to you that it was hard enough to follow Moses' rule of life for those who lived round Jerusalem, or only inhabited Judaea, and that it was quite out of the question for the other nations to fulfil it.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 3"

[[commentary]]
quote='''
And to this day it is forbidden for the children of the Hebrews outside the boundaries of their ruined mother-city to sacrifice according to the law, to build a temple or an altar, to anoint kings or priests, to celebrate the Mosaic gatherings and feasts, to be cleansed from pollution, to be loosed from offences, to bear gifts to God, or to propitiate Him according to the legal requirements.

And therefore, of course, they have fallen under Moses' curse, attempting to keep it in part, but breaking it in the whole, as Moses makes absolutely clear:

"Accursed is he, who does not continue in all the things written in this law, to do them."

And they have come to this impasse, although Moses himself foresaw by the Holy Spirit, that, when the new covenant was revived by Christ and preached to all nations, his own legislation would become superfluous, he rightly confined its influence to one place, so that if they were ever deprived of it, and shut out of their national freedom, it might not be possible for them to carry out the ordinances of his law in a foreign country, and as of necessity they would have to receive the new covenant announced by Christ. Moses had foretold this very thing, and in due course Christ sojourned in this life, and the teaching of the new covenant was borne to all nations, and at once the Romans besieged Jerusalem, and destroyed it and the Temple there. At once the whole of the Mosaic law was abolished, with all that remained of the old covenant, and the curse passed over to those who became lawbreakers, because they obeyed Moses' law, when its time had gone by, and still clung ardently to it, for at that very moment the perfect teaching of the new Law was introduced in its place.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"
