[[commentary]]
quote='''
THAT the enactments of Moses, as I said, were only applicable to the Jews, but not to all of them, and certainly not to the dispersed (among the Gentiles), only in fact to the inhabitants of Palestine, will be plain to you if you reflect thus. For the law of Moses says:

"Thrice in the year shall all thy males appear before the Lord thy God."

And it defines more exactly at what place they should all meet, when it says:

"Three times in the year shall thy males appear before the Lord, thy God, in the place which the Lord shall choose."

You see that it does not bid them meet in each city, or in any indefinite place, but "in the place which the Lord thy God shall choose." There thrice a year it enacts that they must assemble together, and it determines the times, when they must meet at the place where the rites of the worship there are to be celebrated. One season is that of the Passover, the second,' fifty days later, is called the Feast of Pentecost, and the third is in the seventh month after the Passover, on the Day of Atonement, when all the Jews still perform their fast. And a curse is laid on all who do not obey what is enacted. It is plain that all who were to meet at Jerusalem thrice in the year and perform their rites would not be able to live far from Judaea: but they live all round its boundaries. If then it would be impossible even for the Jews whose home is the farthest from Palestine to obey their law, it would be absurd to hold that it could be applicable to all nations and to men in the uttermost parts of the earth.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 3"
