[[commentary]]
quote='''
[Passage quoted, Zech. ii. 8.]

IF, then, the Lord that sent (Him) is Lord Almighty, and He that says He was sent is so also, surely there are Two; And He that was sent as Almighty Lord of the nations says clearly, "He sent me."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 25"
