[[commentary]]
quote='''
For the land of the Jews was left desolate by the loss of its two kings, as the oracle said would come to pass as follows: "The land shall be deserted from the face of two kings"; and this actually and literally took place. For in the time of King Ahaz and Isaiah son of Amos at the date of this prophecy, the king of Syria in Damascus, and the king of Israel in Samaria, not the king who ruled at Jerusalem, but the king of the multitude of Jews who revolted from the law of God, made a compact one with another, and besieged them that were under the sovereignty of David's successors. The prophecy foretells the destruction of both these kings, both the Jew and the one of foreign race, who had combined together against the Lord's people, and says that they will swiftly be severed and give up the war: and that their kingdom and succession will be completely destroyed and extinguished after the birth of Him who is foretold as "God with us."

Now recognize at what date the kingdoms of Damascus and Judaea both ceased to exist, and at what period the land of the Jews was left without a king, as well as the land of the Damascenes, once so powerful, formerly the great overlord of all Syria. For the probability is that at the time of their destruction Emmanuel would be born, and He that was foretold would come. If we to-day could see the kingdoms referred to still in existence, it would be vain to inquire further, we could only extend our hopes into the future; but if their destruction is actually evident, so that our time sees no kingdom either of Damascus or of Judaea, it is clear that the prophecy has been fulfilled which said, "And the land shall be deserted from the face of two kings, whom thou fearest, from their face,"—kings being used for "kingdoms." For Symmachus says, "The land shall be left, from which you suffer ill, by the face of her two kings." And Aquila, "The land shall be left, which thou disdainest, from the face of her two kings." And Theodotion translates thus, "The land shall be left, which thou hatest, from the face of her two kings." Do you see how it is prophesied that the land shall be left kingless? What land, but that of Damascus, and that of Israel? For the kings to whom the prophecy refers ruled these lands. It was their lands that Ahaz despised or hated, wearied and suffering under their attacks. When then did they fall? For if this part of the prophecy was fulfilled, the foregoing part must have also taken place, and this was, that a Virgin should bear "God with us."

Now if we inquire of history it is abundantly clear that the line of kings of Damascus was uninterrupted up to the date of the appearance of our Saviour Jesus Christ. The holy apostle mentions Aretas, King of Damascus, and the kingship of the Jews continued untouched even until then, though it was irregular: for Herod and his successors in the time of our Saviour did not inherit the throne as being of David's line.

And it was after His Appearing, and the preaching of the Gospel of the Virgin's Son to all mankind, that the land was "left of the face of two kings." For from that date by the rule of the Roman Emperor over all nations, all local dominion in city and state ceased, and the prophecy before us in common with the others was fulfilled.

Such was the literal fulfilment. But the prophecy also shews figuratively the stability, the calmness and peace of every soul, who receives the God that was born, Emmanuel Himself. For now that the one Christ, and the Word proclaimed by Him, rule as kings over the souls of men, the old enemies have been put to flight, the two forms of sin, the one that leads men into idolatry and into a diversity of varied beliefs, the other that tempts them to moral ruin. Of these I say the earthly kings of old above-named were symbols. Of these the king of Damascus was the picture of the Gentile errors with regard to idols. And the other, of those who had rebelled from Jerusalem, that is to say from the worship of God according to the Law.

That we should understand the passage figuratively can also be seen from what follows, where it is prophesied that in the time of Emmanuel certain flies and bees will attack the Jews, some from Egypt, some from Assyria, and that a man will shave their head and feet and beard, and that a man will nourish a heifer and two sheep, and other things destined to happen at one and the same time, which it is impossible to understand literally, but only figuratively.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
