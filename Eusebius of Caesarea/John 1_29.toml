[[commentary]]
quote='''
John Baptist sets the seal on their predictions at the appearance of our Saviour. For beholding Him, and pointing Him out to those present as the one foretold by the prophets, he cried: "Behold the Lamb of God, which taketh away the sin of the world.''

Since then according to the witness of the prophets the great and precious ransom has been found for Jews and Greeks alike, the propitiation for the whole world, the life given for the life of all men, the pure offering for every stain and sin, the Lamb of God, the holy sheep dear to God, the Lamb that was foretold, by Whose inspired and mystic teaching all we Gentiles have procured the forgive ness of our former sins, and such Jews as hope in Him are freed from the curse of Moses, daily celebrating His memorial, the remembrance of His Body and Blood, and are admitted to a greater sacrifice than that of the ancient law, we do not reckon it right to fall back upon the first beggarly elements, which are symbols and likenesses but do not contain the truth itself. And any Jews, of course, who have taken refuge in Christ, even if they attend no longer to the ordinances of Moses, but live according to the new covenant, are free from the curse ordained by Moses, for the Lamb of God has surely not only taken on Himself the sin of the world, but also the curse involved in the breach of the commandments of Moses as well. The Lamb of God is made thus both sin and curse—sin for the sinners in the world, and curse for those remaining in all the things written in Moses' law. And so the Apostle says: "Christ has redeemed us from the curse of the law, being made a curse for us"; and "Him that knew no sin, for our sakes he made sin."For what is there that the Offering for the whole world could not effect, the Life given for the life of sinners, Who was led as a lamb to the slaughter, and as a lamb to the sacrifice, and all this for us and on our behalf?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 10"

[[commentary]]
quote='''
But before beginning my argument let me repeat what I have often said about the dispensation of Christ, that we must strictly distinguish what belongs to His Divinity from what belongs to His Humanity. As Divine we recognize Him as the Word of God, the Power of God, the Wisdom of God, the Angel of Great Counsel, and the Great Eternal High Priest, offering sacrifice for the existence and preservation of all, and propitiating the Father. And as Human we know Him as the Lamb of God that taketh away the sin of the world, and as a sheep led to the slaughter. And this was the human body, which as a high priest He took like a lamb or sheep from the flock of humanity, and offering the firstfruits of the human race, sacrificed them to the Father. By it He entered into human nature, which could only thus perceive the Word of God, and His spiritual unembodied power, being able with eyes of flesh to see nothing higher than flesh and physical things. So that everything that follows, which may seem to lower His glory, must be taken as conceived of the Lamb of God that takes away the sin of the world, and of His human body.

For He was the Lamb that takes away sin, according to John the Baptist, when he said: "Behold the Lamb of God, that taketh away the sin of the world," and He was the Lamb led to the slaughter in the oracle of Isaiah, which said: "He was led as a sheep to the slaughter, and as a lamb before her shearers is dumb." And of Him as of a lamb was it said: "For the sins of my people he was led to death." For it was necessary that the Lamb of God, taken by the great High-Priest on behalf of the other kindred lambs, for all the flock of mankind, should be offered as a sacrifice to God: "For since by man came death, by man came also the resurrection of the dead," says the apostle; "and as by the offence of one, judgment came upon all men to condemnation: even so by the righteousness of one the free gift came upon all men unto justification of life." Hence, also, He taught His disciples that He was life and light and truth, and the other conceptions of His Divinity, whereas to them that were not initiated into the secrets of His nature, He said: "Why do ye seek to kill me, a man that has told you the truth?"
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Introduction"
