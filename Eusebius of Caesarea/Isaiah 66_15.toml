[[commentary]]
quote='''
[Passage quoted, Isa. lxvi. 18, 19.]

HERE also the Coming of the Lord to men is exactly foretold. And as it said, "He will come as fire," our Saviour rightly says, "I came to cast fire on the earth, and what will I, if it be already kindled?" You may say His "chariots" are His attendant divine powers, and the holy angels chosen to minister to Him, of whom it is said, "and angels came and ministered to Him," and His holy apostles and disciples, borne up by whom, the Word of God with divine invisible power ran through all the world. One might also literally in another way connect fire and chariots with His coming, through the siege that attacked Jerusalem after our Saviour's Advent, for the Temple was burned with fire not long after, and was reduced to extreme desolation, and the city was encircled by the chariots and camps of the enemy, after which too the promises to the Gentiles were fulfilled in harmony with the prophecy.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 25"
