[[commentary]]
quote='''
[Passage quoted, Jer. xvii. 1-4.]

THOUGH this passage is not found in the Septuagint, yet it is in the Hebrew and in the editions of the other translators, and is quoted with asterisks in the more accurate copies of the Septuagint. I have necessarily quoted it, because it gives the name of the traitor Judas, and teaches that the sin he committed can never be wiped out. For this I think is implied by the words, "The sin of Judas is written with a pen of iron, and with the point of a diamond." It could refer also to the whole Jewish nation, as a threat of the utter destruction that would overtake them in the immediate train of their indelible iniquity, an interpretation I have no time now to expound word by word,
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 5"
