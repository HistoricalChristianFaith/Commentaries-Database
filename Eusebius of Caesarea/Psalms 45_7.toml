[[commentary]]
quote='''
It is thus the power of this Being, the all strong, the all-good, the source of all beauty in the highest unbegotten Godhead, the Divine Spirit (which by the use of a proper and natural analogy) it calls the (Oil of God), and therefore it calls one who partakes of it Christ and Anointed. Do not think of oil as pity in this connection, nor as sympathy for the unfortunate, but as that which the fruit of the tree affords, something unmixed with any damp matter, nourisher of light, healer of toilers, disperser of weariness, that which makes those who use it of a cheerful countenance, streaming with rays like light, making bright and shining the face of him who uses it, as holy Scripture says: "That he may rejoice my face with oil."

Therefore the prophetic word by this analogy referring to the highest power of God, the King of kings and Lord of lords, calls Him the Christ and the Anointed, Who is the first and only one to be anointed with this oil in its fullness, and is the sharer of the Father's divine fragrance communicable to none other, and is God the Word sole-begotten of Him, and is declared to be God of God by His communion with the Unbegotten that begat Him, both the First and the Greater. Wherefore in the Psalms the oracle says thus to this same Being anointed of the Father:

"7. Thy throne, O God, is for ever and ever:
A sceptre of righteousness is the sceptre of thy kingdom:
8. Thou hast loved righteousness, and hated injustice:
Wherefore God, thy God,
Hath anointed thee with the oil of gladness above thy fellows."

But the nature of the oil of olive is one, whereas the nature of the unguent shews a union of many in one. And so the original and unbegotten power of Almighty God, insofar as it is conceived of as simple, uncompounded, and unmingled with any other essence, is metaphorically compared with the simple essence of the olive oil. But insofar as it is inclusive of many ideas in the same, i. e. the creative or kingly, the conceptions of providence, judgment, and countless others, such power as inclusive of many good qualities is more suitably likened to the unguent, which the holy Scriptures teach us that the true and only High Priest of God uses.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25204.html"
source_title="The Proof of the Gospel, Book 4, Chapter 15"
