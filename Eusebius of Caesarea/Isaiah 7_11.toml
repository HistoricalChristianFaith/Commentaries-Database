[[commentary]]
quote='''
And He bears a greater than any human name, God with us. And this is why the sign connected with Him is said to have depth, and also height: depth, by reason of His descent to humanity, and His presence here even unto death: height, by reason of the restitution of His divine glory from the depth, or because of the divine nature of His pre-existence.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25207.html"
source_title="The Proof of the Gospel, Book 7, Chapter 1"
