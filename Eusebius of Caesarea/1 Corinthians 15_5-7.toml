[[commentary]]
quote='''
And upon examination you will find that our Saviour had more than seventy disciples, according to the testimony of Paul, who says that after his resurrection from the dead he appeared first to Cephas, then to the twelve, and after them to above five hundred brethren at once, of whom some had fallen asleep; but the majority were still living at the time he wrote.

Afterwards he says he appeared unto James, who was one of the so-called brethren of the Saviour. But, since in addition to these, there were many others who were called apostles, in imitation of the Twelve, as was Paul himself, he adds: "Afterward he appeared to all the apostles."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25201.html"
source_title="Church History, Book 1, Chapter 12"
