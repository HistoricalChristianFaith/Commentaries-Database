[[commentary]]
quote='''
And the peroration of the whole prophecy crowning all----"The generation that cometh shall be announced to the Lord, and they shall announce his righteousness to a people that shall be born, whom the Lord has made"----specifically foretells the Church of the Gentiles, and the generation established on the earth, through our Saviour Jesus Christ. For what could this people be which, it is here said, will be born for God after these things, which did not exist of old, and did not appear among men, but will be hereafter? What was the generation, which was not then, but which it is said will come, but the Church established by our Saviour in all the world, and the new people from the Gentiles, of which the Holy Spirit wonderfully spake by Isaiah, saying, "Who hath heard such things, and who hath seen them thus? The earth was in travail for one day, and a nation was born at once."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%252010.html"
source_title="The Proof of the Gospel, Book 10, Chapter 8"
