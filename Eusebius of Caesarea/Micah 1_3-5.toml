[[commentary]]
quote='''
I HAVE already considered this prophecy among the passages. And I have pointed out that only from the date of our Saviour Jesus Christ's Coming among men have the objects of Jewish reverence, the hill called Zion and Jerusalem, the buildings there, that is to say, the Temple, the Holy of Holies, the Altar, and whatever else was there dedicated to the glory of God, been utterly removed or shaken, in fulfilment of the Word which said:

"Behold the Lord, the Lord comes forth from his place, and he shall descend on the high places of the earth, and the mountains shall be shaken under him."

And when those kings are shaken, the souls of the Jews, called "valleys," because of the contrast of their wretchedness with their former exaltation, bewailing the passing of the aforesaid glory, will melt like wax before the fire, and be as water rushing down a chasm, through the multitude of those that fall from bad to worse. And all this it says will come to pass because of the sin of the house of Jacob, and the transgression of the house of Israel.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 3"
