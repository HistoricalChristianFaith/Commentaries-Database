[[commentary]]
quote='''
When, then, after the time of Zechariah in the time of the Macedonian Empire was the Temple burnt? There was no such time. For after its burning by the Babylonians, it was not burned again till in the time of Titus and Vespasian, the Roman Emperors, it was utterly destroyed by fire, and it is in relation to this that the prophet summons the ancient rulers of the nation in a figure to mourn and weep, when he says: "Let the pine weep because the cedar is fallen, because the great ones are in great misery. Let the oaks of Bashan weep, because the wood that is planted is torn down: a voice of shepherds that lament, because their greatness is in misery." Then truly Jerusalem was as a portico shaken by all nations around it, and there was a force encircling Judaea, and their venerated Temple and its Holy Place is even to-day a stone trodden under the feet of all nations, and all that mock are mocked according to the prophecy.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25208.html"
source_title="The Proof of the Gospel, Book 8, Chapter 4"
