[[commentary]]
quote='''
This, too, the great Moses teaches, when, as the most ancient of all the prophets, he describes under the influence of the divine Spirit the creation and arrangement of the universe. He declares that the maker of the world and the creator of all things yielded to Christ himself, and to none other than his own clearly divine and first-born Word, the making of inferior things, and communed with him respecting the creation of man. "For," says he, "God said, Let us make man in our image and in our likeness."

And another of the prophets confirms this, speaking of God in his hymns as follows: "He spake and they were made; he commanded and they were created." He here introduces the Father and Maker as Ruler of all, commanding with a kingly nod, and second to him the divine Word, none other than the one who is proclaimed by us, as carrying out the Father's commands.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%25201.html"
source_title="Church History, Book 1, Chapter 2"

[[commentary]]
quote='''
What king prevails to such an extent, and even after death leads on his soldiers, and sets up trophies over his enemies, and fills every place, country and city, Greek and barbarian, with his royal dwellings, even divine temples with their consecrated oblations, like this very temple with its superb adornments and votive offerings, which are themselves so truly great and majestic, worthy of wonder and admiration, and clear signs of the sovereignty of our Saviour? For now, too, 'he spake, and they were made; he commanded, and they were created.' For what was there to resist the nod of the universal King and Governor and Word of God himself?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FTHE%2520CHURCH%2520HISTORY%2520OF%2520EUSEBIUS%2FBook%252010.html"
source_title="Church History, Book 10, Chapter 4"
