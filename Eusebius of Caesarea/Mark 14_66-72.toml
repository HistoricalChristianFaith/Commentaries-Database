[[commentary]]
quote='''
And so Mark also omitted it, though he made known to all men Peter's denial, and how he wept about it bitterly. You will find Mark gives this account of him:

"66. And as Peter was in the court, there cometh one of the maids of the high priest; 67. and when she saw Peter warming himself, she looked upon him and said, And thou also wast with Jesus of Nazareth. 68. But he denied saying (I know not) neither understand what thou sayest; and he went into the outside porch, and the cock crew. 69. And the maid saw him again, and began to say to them that stood by, This is one of them. 70. And he denied it again. And a little after, they that stood by said again to Peter, Surely thou art one of them: for thou art a Galilaean. 71. But he began to curse and to swear, saying, I know not this man of whom ye speak. 72. And the second time the cock crew."

Mark writes thus, and Peter through him bears witness about himself. For the whole of Mark's Gospel is said to be the record of Peter's teaching. Surely, then, men who refused (to record) what seemed to them to spread their good fame, and handed down in writing slanders against themselves to unforgetting ages, and accusations of sins, which no one in after years would ever have known of unless he had heard it from their own voice, by thus placarding themselves, may justly be considered to have been void of all egoism and false speaking, and to have given plain and clear proof of their truth-loving disposition.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25203.html"
source_title="The Proof of the Gospel, Book 3, Chapter 5"
