
[[commentary]]
quote='''
So Moses records that Abraham by his faith in Almighty God attained righteousness when he says:

"Abraham believed in God, and it was counted unto him for righteousness."

This text shews clearly that he received the sign of circumcision after his attainment of righteousness and after the witness to his holiness, and that this added nothing at all to his justification.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 6"
