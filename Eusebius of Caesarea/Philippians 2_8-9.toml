[[commentary]]
quote='''
The Psalm too, continuing, shews in veiled phrase even the Passion of the Subject of the prophecy, saying: "He shall drink of the brook in the way, therefore shall he lift up his head." And another Psalm shews "the brook" to mean the time of temptations: "Our soul hath passed through the brook, yea, our soul has passed through the deep waters." He drinks, then, in the brook, it says, that cup, evidently, of which He darkly spoke at the time of His Passion, when He said: "Father, if it be possible, let this cup pass from me." And also, "If it be not possible for it to pass from me, except I drink it, thy will be done."

It was, then, by drinking this cup that He lifted up His head, as the apostle also says, for when he was "Obedient to the Father unto death, even the death of the cross, therefore," he says, "God hath highly exalted him," raising Him from the dead, and setting Him at His right hand, far above all rule and authority and power and dominion, and every name which is named, not only in this world, but in that which is to come. And He hath put all things in subjection under his feet, according to the promise made to Him, which He expresses through the Psalmist, saying, "Sit thou on my right hand, until I make thine enemies the footstool of thy feet. Be thou ruler in the midst of thine enemies."

It is plain to all that to-day the power of our Saviour and the word of His teaching rule over all them that have believed in Him, in the midst of His enemies and foes.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25205.html"
source_title="The Proof of the Gospel, Book 5, Chapter 3"
