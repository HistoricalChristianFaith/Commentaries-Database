[[commentary]]
quote='''
As we have received a memorial of this offering which we celebrate on a table by means of symbols of His Body and saving Blood according to the laws of the new covenant, we are taught again by the prophet David to say:

"5. Thou hast prepared a table before me in the face of my persecutors |. Thou hast anointed my head with oil |, and thy cup cheers me as the strongest (wine). |"

Here it is plainly the mystic Chrism and the holy Sacrifices of Christ's Table that are meant, by which we are taught to offer to Almighty God through our great High Priest all through our life the celebration of our sacrifices, bloodless, reasonable, and well-pleasing to Him.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25201.html"
source_title="The Proof of the Gospel, Book 1, Chapter 10"
