[[commentary]]
quote='''
[Passage quoted, Isa. xix. 1-4 and the context.]

HERE the prophecy before us states that the Second after the God and Lord of the Universe, I mean the Word of God, will come into Egypt, and will come not imperceptibly nor invisibly, nor without any bodily vesture, but riding on a light cloud, or better "on light thickness": for such is said to be the meaning of the Hebrew word. Let the sons of the Hebrews tell us, then, on what occasion after Isaiah's time the Lord visited Egypt, and what Lord he was. For . the Supreme God is one: let them say how He is said to ride on "light thickness," and to alight locally on any part of the earth. And let them interpret "light thickness," and explain why the Lord is said not to visit Egypt without it. And also when the words of the prophecy are recorded to have been fulfilled, the shaking of the idols of Egypt made by hand, I mean, and the warring of Egyptians with Egyptians through the Coming of the Lord. And their gods, that is to say the daemons, that were so mighty of old, when did they have power no more, and refrain from answering their inquirers through fear of the Lord? And into the hands of what cruel lord, let them say, and of what kings was Egypt delivered after the coming of the Lord that was foretold, and why when the Lord came they were delivered to evil rulers? And let him, who likes, interpret the rest of the prophecy in the same way. But I contend that it can only be understood consistently, of the appearing of our Saviour Jesus Christ to men. For He, being Word of God and Power of God, fulfilled the aforesaid prediction both literally and metaphorically, visiting the land of the Egyptians on a light cloud. The name, "light cloud," is allegorically given to the visitation He made by means of the Body, which He took of the Virgin and the Holy Spirit, as the Hebrew original and Aquila clearly suggests, when he says, "Behold the Lord rides on light thickness, and conies to Egypt," naming the body that came from the Holy Spirit, "light thickness." And surely this part of the prophecy was literally fulfilled, when the Angel of the Lord appeared in a dream to Joseph and said: "Arise, and take the young child and his mother, and flee into Egypt, and stay there until I tell thee." For then, the Lord God the Word, uniting with the child's growth, and present in the Flesh that had been furnished Him of the Holy Virgin, visited the land of the Egyptians. (His flesh was "thick" as representing bodily substance, "light" again through its being better than ours, and it is called "a light cloud "because it was not formed of the sensuous passions of corruption, but of the Holy Spirit.) But the cause of His journey thither is as follows. When it is remembered that the first origin of idolatrous error was in Egypt, and the Egyptians seemed to be the most superstitious of men, and bitter enemies of the people of God, and as far removed from the prophets as possible, we can see why the Power of God came to them first of all. And therefore the word of Gospel teaching has waxed stronger among the Egyptians than among any other men. Hence this prophecy foretells that the Lord will sojourn among them. But it does not say that the Egyptians will come to the land of the Jews, nor worship him at Jerusalem, nor become Jewish proselytes there according to the enactments of Moses, nor sacrifice at the altar in Jerusalem. It says naught of this, but that the Lord will Himself visit the Egyptians, and will think these men worthy of His Presence, and will be the occasion of great blessings to them. For His sojourn would accomplish those very things, which we see to have been actually fulfilled after the appearance of our Saviour Jesus Christ. Let us see what these were. The evil and noxious daemons who infested Egypt before, inhabiting images for long ages, and enslaving the souls of the Egyptians with all manner of deceitful superstition, when they became aware of a strange divine power sojourning among them, were all at once disturbed and tossed to and fro, and their heart and power of thought was minished within them, yielding to and conquered by the invisible power that drave on them and consumed them with its sacred word as with fire. Yea, the daemons suffered thus invisibly when our Saviour Jesus Christ sojourned in Egypt in flesh and blood; and, again, when afterwards His Gospel was preached openly to the Egyptians as well as to the other nations, for His unseen power was with His Apostles imperceptibly working with them, co-operating, announcing by their tongues His holy teaching, exhorting men to worship only the one and true God, and rescuing the victims from the daemons that of old had been deceived by them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Eusebius%2520of%2520Caesarea%2FThe%2520Proof%2520of%2520the%2520Gospel%2FBook%25206.html"
source_title="The Proof of the Gospel, Book 6, Chapter 20"
