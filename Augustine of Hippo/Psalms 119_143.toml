[[commentary]]
quote='''
On account of this law the younger suffered persecution from the elder, so that the younger saith what followeth: “Trouble and hardship have taken hold upon me: yet is my meditation in Thy commandments” (ver. 143). Let them rage, let them persecute; as long as the commandments of God be not abandoned, and, after those commandments, let even those who rage be loved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
