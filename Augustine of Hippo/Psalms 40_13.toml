[[commentary]]
quote='''
“Be pleased, O Lord, to deliver me” (ver. 13). As if he were saying, “‘If Thou wilt, Thou canst make me clean.’ Be pleased to deliver me. O Lord, look upon me to help me.” Look, that is, on the penitent members, members that lie in pain, members that are writhing under the instruments of the surgeon; but still in hope.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"
