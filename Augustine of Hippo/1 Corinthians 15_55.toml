[[commentary]]
quote='''
Because human nature was subjected to an enemy as the just desert of sin, man must first be rescued from his power, that he might find him. Then if his life in this flesh is prolonged, he is assisted in the conflict that he may overcome the enemy. And finally the victor will be beatified, that he may reign, and at the very end he will ask: "Death, where is thy devouring?".
'''
source_url=''
source_title="AGAINST JULIAN 20.65"

[[commentary]]
quote='''
I think that "death" in this passage refers to a carnal habit which resists the good will through a delighting in temporal pleasures.
'''
source_url=''
source_title="QUESTIONS 70"

[[commentary]]
quote='''
What then is that full and perfect liberty in the Lord Jesus, who said, "If the Son shall make you free, then shall ye be free indeed;" and when shall it be a full and perfect liberty? When enmities are no more; when "death, the last enemy, shall be destroyed." "For this corruptible must put on incorruption, and this mortal must put on immortality.-And when this mortal shall have put on immortality, then shall be brought to pass the saying that is written. Death is swallowed up in victory. O death, where is thy struggle?" What is this, "O death, where is thy struggle"? "The flesh lusteth against the spirit, and the spirit against the flesh," but only when the flesh of sin was in vigor. "O death, where is [now] thy struggle?" Now shall we live, no more shall we die, in Him who died for us and rose again: "that they," he says, "who live, should no longer live unto themselves, but unto Him who died for them and rose again."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252041.html'
source_title="Tractates on John 41"
