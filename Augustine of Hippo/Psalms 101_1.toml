[[commentary]]
quote='''
In fact, to that prepared feast of which the Lord speaks in the Gospel, not all who were called wanted to come, nor could those come who did come except they were called. Accordingly neither should those who came give themselves the credit, for they came by invitation, nor should those who did not want to come blame it on another, but only on themselves, for they had been invited to come of their free will. Therefore, before merit, the calling determines the will. For this reason, even if someone called takes the credit for coming, he cannot take the credit for being called. And as for him who is called and does not come, just as his calling was not a deserved reward, so his neglecting to come when called lays the foundation for a deserved punishment. There will thus be the following two things: "Of your mercy and judgment will I sing, O Lord." To mercy belongs the calling; to judgment belongs the blessedness of those who did not want to come.
'''
source_url=''
source_title="ON EIGHTY-THREE VARIED QUESTIONS 68:5"


[[commentary]]
quote='''
While the reprobate angels and people continue in eternal punishment, the saints will have fuller knowledge of the good conferred on them by grace. Then, through the very facts themselves they will gain a clearer understanding of what is written in the psalm: "Mercy and judgment I will sing to you, O Lord," for it is only through unmerited mercy that anyone is freed and only through deserved judgment that anyone is condemned. Then will be clear what now is dark: When one of two children is through his mercy chosen by God for himself, while the other through his judgment is to be abandoned (the one chosen knowing what would have been his due through judgment had not mercy come to his aid), why the one rather than the other is chosen, when the condition of the two was the same? Or again, why miracles were not worked in the presence of some people who, had they been worked, would have done penance, while miracles were worked in the presence of those who were not going to believe anyway? For this is the Lord's very clear statement: "Woe to you, Korazin! Woe to you, Bethsaida! For if in Tyre and Sidon had been worked the miracles that have been worked in you, they would have repented long ago in sackcloth and ashes." And surely there was no injustice in God's not willing that they be saved, though they could have been saved if he had so willed it.
'''
source_url='https://www.newadvent.org/fathers/1302.htm'
source_title="Enchiridion 24:94-95"


[[commentary]]
quote='''
But, inasmuch as "Christ has died for the wicked," what person has been found good by the Lord? He therefore found all trees bad, but, to those who believe in his name, "he gave the power of becoming children of God." Hence, whoever is now a good person (that is to say, a good tree) was found bad and has been made good. If the Lord had willed to root up the bad trees when he came, what tree would have been left that would not deserve to be rooted up? But he came to dispense mercy beforehand, so that he might afterwards dispense justice, for he is the Lord to whom the psalmist says, "Mercy and judgment I will sing to you, O Lord." He therefore gave remission of sins to those who believe. Of them, he would not even demand an accounting of previous decrees. He gave remission of sins; he made the trees good. He delayed the axe; he removed the threat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252072.html'
source_title="SERMON 72:2"


[[commentary]]
quote='''
Obviously, it is just that those who have pardoned should receive pardon and that it should be given to those who give. It is natural that there should be in God both mercy for him that judges and judgment for him that shows mercy. That is why we say to him, "Mercy and judgment I will sing to you, O Lord." Whoever, presuming on his own justice, expects judgment with mercy as if he were secure provokes the most just anger, of which the psalmist said in fear, "Enter not into judgment with your servant." Therefore, God says to his perverse people, "Why will you contend with me in judgment?" For when "the just king shall sit on his throne, who will boast that he has a chaste heart, or who will boast that he is pure of sin?" What hope is there, then, unless "mercy exalts itself above judgment," but only toward those who have shown mercy by saying sincerely, "Forgive us as we forgive" and by giving without protest? "For God loves a cheerful giver." Finally, in order to comfort those in whom the former sentence had roused extreme fear, James in the sequence to that passage speaks of the works of mercy, when he points out how even daily sins, without which there is no living in this world, are expiated by daily remedies. Without these, the person who becomes guilty of all by offending in one point and by offending in many—"because in many things we all offend"—would drag with him to the judgment seat of the great judge a mighty load of guilt, gathered up bit by bit, and would not find the mercy that he had not shown. By forgiving and giving, he deserves to have his debts forgiven and the promised reward given to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 167:20"

[[commentary]]
quote='''
Accordingly, the first dispensation of our Lord Jesus Christ is medicinal, not judicial; for if He had come to judge first, He would have found none on whom He might bestow the rewards of righteousness. Because, therefore, He saw that all were sinners, and that none was exempt from the death of sin, His mercy had first to be craved, and afterwards His judgment must be executed; for of Him the psalm had sung, "Mercy and judgment will I sing to Thee, O Lord." Now, He says not judgment and mercy," for if judgment had been first, there would be no mercy; but it is mercy first, then judgment. What is the mercy first? The Creator of man deigned to become man; was made what He had made, that the creature He had made might not perish. What can be added to this mercy?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252036.html'
source_title="Tractates on John 36"

[[commentary]]
quote='''
In this Psalm, we ought to seek in the whole body of it what we find in the first verse: “Mercy and judgment will I sing unto Thee, O Lord” (ver. 1). Let no man flatter himself that he will never be punished through God’s mercy; for there is judgment also; and let no man who hath been changed for the better dread the Lord’s judgment, seeing that mercy goeth before it. For when men judge, sometimes overcome by mercy, they act against justice; and mercy, but not justice, seemeth to be in them: while sometimes, when they wish to enforce a rigid judgment, they lose mercy. But God neither loseth the severity of judgment in the bounty of mercy, nor in judging with severity loseth the bounty of mercy. Suppose we distinguish these two, mercy and judgment, by time; for possibly, they are not placed in this order without a meaning, so that he said not “judgment and mercy,” but “mercy and judgment:” so that if we distinguish them by succession in time, perhaps we find that the present is the season for mercy, the future for judgment. How is it that the season of mercy cometh first? Consider first how it is with God, that thou also mayest imitate the Father, in so far as He shall permit thee.…“He maketh His sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust.” Behold mercy. When thou seest the just and the unjust behold the same sun, enjoy the same light, drink from the same founts, satisfied with the same rain, blessed with the same fruits of the earth, inhale this air in the same way, possess equally the world’s goods; think not that God is unjust, who giveth these things equally to the just and the unjust. It is the season of mercy, not as yet of judgment. For unless God spared at first through mercy, He would not find those whom He could crown through judgment. There is therefore a season for mercy, when the long-suffering of God calleth sinners to repentance.

Hear the Apostle distinguishing each season, and do thou also distinguish it.…“Thinkest thou,” he saith, “O man, that judgest them that do such things, and doest the same, that thou shalt escape the judgment of God?” And as if we were to reply, Why do I commit such sins daily, and no evil occurreth unto me? he goeth on to show to him the season of mercy: “Despisest thou the riches of His goodness, and forbearance, and long-suffering?” And he did indeed despise them; but the Apostle hath made him anxious. “Not knowing,” he saith, “that the goodness of God leadeth thee to repentance?” Behold the season of mercy. But that he might not think this would last for ever, how did he in the next verse raise his fears? Now hear the season of judgment; thou hast heard the season of mercy, on which account, “mercy and judgment will I sing unto Thee, O Lord:” “But thou,” saith the Apostle, “after thy hardness and impenitent heart, treasurest up unto thyself wrath against the day of wrath, and revelation of the righteous judgment of God, who will render to every man according to his deeds.” Lo, “mercy and judgment.” But he hath threatened concerning judgment: is therefore the judgment of God to be feared only, and not to be loved? To be feared by the wicked on account of punishment, to be loved by the good on account of the crown. Because then the Apostle hath alarmed the wicked in the testimony which I have quoted, hear where he giveth hope concerning judgment to the good. He puts forth himself, and shows in himself too the season of mercy. For unless he found a period of mercy, in what condition would judgment find him? A blasphemer, a persecutor, an injurer of others. For he thus speaketh, and praiseth the season of mercy, in which season we are now living: “I who was before,” he saith, “a blasphemer, and a persecutor, and injurious: but I obtained mercy.” But perhaps he only hath obtained mercy? Hear how he cheereth us: “That in me,” he saith, “first, Christ Jesus might show forth all long-suffering, for a pattern to them which should hereafter believe on Him to life everlasting.” What meaneth, “that He might show forth all long-suffering”? That every sinner and wicked man might see that Paul received pardon, and might not despair of himself? Lo, he hath instanced himself, and thereby cheered others also.…But did Paul alone deserve this? For I had asserted, that as he raised our fears by the former testimony, so did he encourage us by the latter. When he said, “The Lord, the righteous Judge, shall render to me at that day:” he addeth, “and not to me only, but unto all them also that love His appearing” and His kingdom. Since therefore, brethren, we have a season of mercy, let us not on that account flatter, or indulge ourselves, saying, God spareth ever.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520101.html'
source_title="Exposition on Psalm 101"
