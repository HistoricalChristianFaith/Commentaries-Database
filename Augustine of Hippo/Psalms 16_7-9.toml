[[commentary]]
quote='''
“My righteous help is from the Lord, who maketh whole the upright in heart.” God, who searcheth the hearts and reins, directeth the righteous; but with righteous help maketh He whole the upright in heart. He doth not as He searcheth the hearts and reins, so make whole the upright in heart and reins; for the thoughts are both bad in a depraved heart, and good in an upright heart; but delights which are not good belong to the reins, for they are more low and earthly; but those that are good not to the reins, but to the heart itself. Wherefore men cannot be so called upright in reins, as they are called upright in heart, since where the thought is, there at once the delight is too; which cannot be, unless when things divine and eternal are thought of. “Thou hast given,” he says, “joy in my heart,” when he had said, “The light of Thy countenance has been stamped on us, O Lord.” For although the phantoms of things temporal, which the mind falsely pictures to itself, when tossed by vain and mortal hope, to vain imaginations oftentimes bring a delirious and maddened joy; yet this delight must be attributed not to the heart, but to the reins; for all these imaginations have been drawn from lower, that is, earthly and carnal things. Hence it comes, that God, who searcheth the hearts and reins, and perceiveth in the heart upright thoughts, in the reins no delights, affordeth righteous help to the upright in heart, where heavenly delights are coupled with clean thoughts. And therefore when in another Psalm he had said, “Moreover even to-night my reins have chided me;” he went on to say as touching help, “I foresaw the Lord alway in my sight, for He is on my right hand, that I should not be moved.” Where he shows that he suffered suggestions only from the reins, not delights as well; for he had suffered these, then he would of course be moved. But he said, “The Lord is on my right hand, that I should not be moved;” and then he adds, “Wherefore was my heart delighted;” that the reins should have been able to chide, not delight him. The delight accordingly was produced not in the reins, but there, where against the chiding of the reins God was foreseen to be on the right hand, that is, in the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25207.html'
source_title="Exposition on Psalm 7"
