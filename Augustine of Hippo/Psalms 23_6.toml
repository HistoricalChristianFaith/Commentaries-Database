[[commentary]]
quote='''
In the sacred Eloquence we read, "His mercy goes before me," and, "His mercy shall follow me." It predisposes a person before he wills, to prompt his willing. It follows the act of willing, lest one's will be frustrated. Otherwise, why are we admonished to pray for our enemies, who are plainly not now willing to live piously, unless it is that God is even now at work in them and in their wills? Or again, why are we admonished to ask in order to receive, unless it is that he who grants us what we will is he through whom it comes to pass that we will? We pray for enemies, therefore, that the mercy of God should go before them, as it goes before us; we pray for ourselves that his mercy shall follow us.
'''
source_url=''
source_title="ENCHRIDION 9:32"

[[commentary]]
quote='''
“And Thy mercy shall follow me all the days of my life:” that is, as long as I live in this mortal life, not Thine, but mine. “That I may dwell in the house of the Lord for length of days” (ver. 6). Now Thy mercy shall follow me not here only, but also that I may dwell in the house of the Lord for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252023.html'
source_title="Exposition on Psalm 23"

[[commentary]]
quote='''
“I will dwell,” he saith, “in the house of the Lord, for length of days.” Wherefore for length of days, but because now is the shortness of days? For everything which hath an end, is short: but of this King are days upon days, so that not only while these days pass away, Christ reigneth in His Church, but the Saints shall reign together with Him in those days which have no end.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252061.html'
source_title="Exposition on Psalm 61"
