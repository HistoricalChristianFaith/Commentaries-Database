[[commentary]]
quote='''
For the same figure also it is that Eliseus at first sent a staff by his servant to raise up the dead child. There had died the son of a widow his hostess; it was reported to him, to his servant he gave his staff: go thou, he saith, lay it on the dead child. Did the prophet not know what he was doing? The servant went before, he laid the staff upon the dead, the dead arose not. “For if there had been given a law which could have made alive, surely out of the law there had been righteousness.” The law sent by the servant made not alive: and yet he sent his staff by the servant, who himself afterwards followed, and made alive. For when that infant arose not, Eliseus came himself, now bearing the type of the Lord, who had sent before his servant with the staff, as though with the Law: he came to the child that was lying dead, he laid his limbs upon it. The one was an infant, the other a grown man: he contracted and shortened in a manner the size of his full growth, in order that he might fit the dead child. The dead then arose, when he being alive adapted himself to the dead: and the Master did that which the staff did not; and grace did that which the letter did not. They then that have remained in the staff, glory in the letter; and therefore are not made alive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252071.html'
source_title="Exposition on Psalm 71"
