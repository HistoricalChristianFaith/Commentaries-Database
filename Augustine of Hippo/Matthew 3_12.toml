[[commentary]]
quote='''
God erreth not in judgment. Live ye separate, though separate ye were not born; not vainly hath a voice gone forth from your mouth and heart, “Destroy not my soul with sinners, nor my life with bloody men.” He shall winnow with such art, carrying in His hand a fan, that not one grain of wheat shall fall into the heap of chaff prepared to be burned, nor one beard of chaff pass to the heap to be laid up in the garner. Be glad, O ye daughters of Judæa, because of the judgments of God that erreth not, and do not yet judge rashly. To you let it belong to collect, to Him let it belong to separate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
