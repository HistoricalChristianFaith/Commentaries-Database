
[[commentary]]
quote='''
For in them Christ was sleeping, therefore were they tossed: Christ awoke (as but now we heard out of the Gospel), He commanded the winds, and they were still. Since Christ is in each man’s heart by faith, it is signified to us, that his heart as a ship in this world’s tempest is tossed, who forgetteth his faith: as though Christ sleeping it is tossed, but Christ awaking cometh tranquillity. Nay, the Lord Himself, what said He? “Where is your faith?” Christ aroused, aroused up faith, that what had been done in the ship, might be done in their hearts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
