[[commentary]]
quote='''
But that you may know, my brethren, that not from a necessity of any chain of sin did the Lord come to this John, as the other evangelists say when the Lord came to him to be baptized, John himself said, "Comest Thou to me? I have need to be baptized of Thee." What did He reply to him? "Suffer it to be so now: let all righteousness be fulfilled?" What meaneth this, "let all righteousness be fulfilled"? I came to die for men, have I not to be baptized for men? What meaneth" let all righteousness be fulfilled"? Let all humility be fulfilled. What then? Was not He to accept baptism from a good servant who accepted suffering at the hands of evil servants?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25204.html'
source_title="Tractates on John 4"

[[commentary]]
quote='''
Already I knew by whom I was sent; already I knew Him to whom I said, "Comest Thou to me to be baptized? I have need to be baptized of Thee." So far, then, did I know the Lord, that I wished to be baptized by Him, not that He should be baptized by me; and then He said to me, "Suffer it to be so now; for thus it becometh us to fulfill all righteousness." I came to suffer; do I not come to be baptized? "Let all righteousness be fulfilled," says my God to me. Let all righteousness be fulfilled; let me teach entire humility. I know that there will be proud ones in my future people; I know that some men then will be eminent in some grace, so that when they see ordinary persons baptized, they, because they consider themselves better, whether in continence, or in alms-giving, or in doctrine, will perhaps not deign to receive what has been received by their inferiors. It was needful that I should heal them, so that they should not disdain to come to the baptism of the Lord, because I came to the baptism of the servant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25205.html'
source_title="Tractates on John 5"
