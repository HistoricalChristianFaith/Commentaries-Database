[[commentary]]
quote='''
(Serm. in Mont. i. 2.) Otherwise; mourning is sorrow for the loss of what is dear; but those that are turned to God lose the things that they held dear in this world; and as they have now no longer any joy in such things as before they had joy in, their sorrow may not be healed till there is formed within them a love of eternal things. They shall then be comforted by the Holy Spirit, who is therefore chiefly called, The Paraclete, that is, 'Comforter;' so that for the loss of their temporal joys, they shall gain eternal joys.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But he that owneth himself to be in true misery, will also be in true happiness: and yet now because thou art miserable, hear the Lord saying, “Blessed are they that mourn.” O blessed they that mourn! Nothing is so akin to misery as mourning: nothing so remote and contrary to misery as blessedness: Thou speakest of those who mourn, and Thou callest them blessed! Understand, He saith, what I say: I call those who mourn blessed. Wherefore blessed? In hope. Wherefore mourning? In act. For they mourn in this death, in these tribulations, in their wandering: and because they own themselves to be in this misery, and mourn, they are blessed. Wherefore do they mourn? The blessed Cyprian was put to sorrow in his passion: now he is comforted with his crown; now though comforted, he was sad. For our Lord Jesus Christ still intercedeth for us: all the Martyrs who are with Him intercede for us. Their intercessions pass not away, except when our mourning is passed away: but when our mourning shall have passed away, we all with one voice, in one people, in one country, shall receive comfort, thousands of thousands joined with Angels playing upon harps, with choirs of heavenly powers living in one city.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"

[[commentary]]
quote='''
For I thought I might rejoice and exult in the vain help of man; but when I had heard from my Lord, “Blessed are they that mourn, for they shall be comforted:” I did not wait until I should lose those temporal blessings in which I rejoiced, and should then mourn: but I gave heed to that very misery of mine which caused me to rejoice in such things, which I both feared to lose, and yet could not retain; I gave heed to it firmly and courageously, and I saw that I was not only agonized by the adversities of this world, but even bound by its good fortune; and thus “I found the trouble and heaviness” which had escaped me, “and called upon the Name of the Lord; O Lord, I beseech Thee, deliver my soul.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520116.html'
source_title="Exposition on Psalm 116"
