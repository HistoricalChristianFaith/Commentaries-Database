[[commentary]]
quote='''
While such things are mystifying if we take them in a carnal sense, we may be warned thereby to think of them as ineffably spiritual. For this reason, even if we think of the Lord's body, which was raised from the tomb and ascended into heaven, only as having a human appearance and parts, we are not to think that he sits at the right hand of the Father in such a way that the Father should seem to sit [literally] at his left hand. Indeed, in that bliss which surpasses human understanding, the only right hand and the same right hand is a name for that same bliss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 120, TO CONSENTIUS"

[[commentary]]
quote='''
Do not doubt, then, that the man Christ Jesus is now there whence he shall come again. Cherish in your memory and hold faithfully to the profession of your Christian faith that he rose from the dead, ascended into heaven, sits at the right hand of the Father, and will come from no other place but there to judge the living and the dead. He will so come, on the testimony of the angel's voice, as he was seen going into heaven, that is, in the same form and substance of flesh to which, it is true, he gave immortality, but did not take away its nature. According to this fleshly form, we are not to think that he is everywhere present. We must beware of so stressing the divinity of the man that we destroy the reality of his body. It does not follow that what is in God is in him so as to be everywhere as God is. The Scripture says, with perfect truth: "In him we live and move and are," yet we are not everywhere present as he is, but man is in God after one manner, while God is in man quite differently, in his own unique manner. God and man in him are one person, and both are the one Jesus Christ who is everywhere as God, but in heaven as man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 187, TO DARDANUS 10"

[[commentary]]
quote='''
(Con. Evang. iii. 25) By which words He seems to show clearly enough that the foregoing discourse was the last that He spake to them upon earth, though it does not appear to bind us down altogether to this opinion. For He does not say, After He had thus spoken unto them, wherefore it admits of being understood not as if that was the last discourse, but that the words which are here used, After the Lord had spoken unto them, he was received into heaven, might belong to all His other discourses. But since the arguments which we have used above make us rather suppose that this was the last time, therefore we ought to believe that after these words, together with those which are recorded in the Acts of the Apostles, our Lord ascended into heaven.

(de Symbolo, 4) Let us not therefore understand this sitting as though He were placed there in human limbs, as if the Father sat on the left, the Son on the right, but by the right hand itself we understand the power which He as man received from God, that He should come to judge, who first had come to be judged. For by sitting we express habitation, as we say of a person, he sat himself down in that country for many years; in this way then believe that Christ dwells at the right hand of God the Father. For He is blessed and dwells in blessedness, which is called the right hand of the Father; for all is right hand there, since there is no misery.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
In what follows we have a further recommendation to take this to have been the last manifestation of Himself in bodily fashion which the Lord gave to the apostles. For the same Mark continues in these terms: "And these signs shall follow them that believe: In my name shall they cast out devils; they shall speak with new tongues; they shall take up serpents; and if they drink any deadly thing, it shall not hurt them; they shall lay hands on the sick, and they shall recover." Then he appends this statement: "So then, after the Lord had spoken unto them, He was received up into heaven, and sat on the right hand of God. And they went forth, and preached everywhere, the Lord working with them, and confirming the word by signs following." Now, when he says, "So then, after the Lord had spoken unto them, He was received up into heaven," he appears probably enough to indicate that this was the last discourse He held with them upon the earth. At the same time, the words do not seem to shut us up to that idea absolutely. For what he says is not, "after He had spoken these things unto them," but simply, "after He had spoken unto them;" and hence it would be quite admissible, were there any necessity for such a theory, to suppose that this was not the last discourse, and that that was not the last day on which He was present with them upon the earth, but that all the matters regarding which He spake with them in all these days may be referred to in the sentence," After He had spoken unto them, He was received up into heaven." But, inasmuch as the considerations which we have detailed above lead us rather to conclude that this was the last day, than to suppose that the allusion is specifically to the eleven at a time when, in consequence of the absence of Thomas, they were only ten, we are of opinion that after this discourse which Mark mentions, and with which we have to connect in their proper order those other words, whether of the disciples or of the Lord Himself, which are recorded in the Acts of the Apostles, we must believe the Lord to have been received up into heaven, to wit, on the fortieth day after the day of His resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"

[[commentary]]
quote='''
Consequently, in the four evangelists we find mention made of ten distinct appearances of the Lord to different persons after His resurrection. First, to the women near the sepulchre. Secondly, to the same women as they were on the way returning from the sepulchre. Thirdly, to Peter. Fourthly, to the two who were going to the place in the country. Fifthly, to the larger number in Jerusalem, when Thomas was not present. Sixthly, on the occasion when Thomas saw Him. Seventhly, by the sea of Tiberias. Eighthly, on the mountain in Galilee, of which Matthew speaks. Ninthly, at the time to which Mark refers in the words, "Lastly, as they sat at meat," thereby intimating that now they were no more to eat with Him upon the earth. Tenthly, on the same day, not now indeed upon the earth, but lifted up in the cloud, as He ascended into heaven, as Mark and Luke record. This last appearance, indeed, is introduced by Mark, directly after he has told us how the Lord showed Himself to them as they sat at meat. For his narrative goes on connectedly as follows: "So then, after the Lord had spoken unto them, He was received up into heaven." Luke, on the other hand, omits all that may have passed between Him and His disciples during the forty days, and, after giving the history of the first day of His resurrection-life, when He showed Himself to the larger number in Jerusalem, he silently connects therewith the closing day on which He ascended up into heaven. His statement proceeds in this form: "And He led them out as far as to Bethany; and He lifted up His hands, and blessed them; and it came to pass, that while He blessed them, He was parted from them, and carried up into heaven." Thus, therefore, besides seeing Him upon the earth, they beheld Him also as He was borne up into heaven. So many times, then, is He reported in the evangelical books to have been seen by different individuals, previous to His completed ascension into heaven, namely, nine times upon the earth, and once in the air as He was ascending.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
