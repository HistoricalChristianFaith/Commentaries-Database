[[commentary]]
quote='''
Paul the apostle also says, "To each of us is given grace according to the measure of the gift of Christ;" and then, that he might show that by the gift of Christ he meant the Holy Spirit, he has gone on to add, "Wherefore He saith, He hath ascended up on high, He hath led captivity captive, and hath given gifts to men." And every one knows that the Lord Jesus, when He had ascended into heaven after the resurrection from the dead, gave the Holy Spirit, with whom they who believed were filled, and spake with the tongues of all nations. And let no one object that he says gifts, not gift: for he quoted the text from the Psalm. And in the Psalm it is read thus, "Thou hast ascended up on high, Thou hast led captivity captive, Thou hast received gifts in men." For so it stands in many Mss., especially in the Greek Mss., and so we have it translated from the Hebrew. The apostle therefore said gifts, as the prophet did, not gift. But whereas the prophet said, "Thou hast received gifts in men," the apostle has preferred saying, "He gave gifts to men:" and this in order that the fullest sense may be gathered from both expressions, the one prophetic, the other apostolic; because both possess the authority of a divine utterance. For both are true, as well that He gave to men, as that He received in men. He gave to men, as the head to His own members: He Himself that gave, received in men, no doubt as in His own members; on account of which, namely, His own members, He cried from heaven, "Saul, Saul, why persecutest thou me?" And of which, namely, His own members, He says, "Since ye have done it to one of the least of these that are mine, ye have done it unto me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520The%2520Trinity%2FBook%252015.html'
source_title="ON THE TRINITY 15:5.34"

[[commentary]]
quote='''
In the next place, turning his address to the Lord Himself, “Thou hast gone up,” he saith, “on high, Thou hast led captivity captive, Thou hast received gifts in men” (ver. 18). Of this the Apostle thus maketh mention, thus expoundeth in speaking of the Lord Christ: “But unto each one of us,” he saith, “is given grace after the measure of the giving of Christ: for which cause he saith, He hath gone up on high, He hath led captive captivity, He hath given gifts to men.”…And let it not move us that the Apostle making mention of that same testimony saith not, “Thou hast received gifts in men;” but, “He hath given gifts unto men.” For he with Apostolic authority hath spoken thus according to the faith that the Son is God with the Father. For in respect of this He hath given gifts to men, sending to them the Holy Spirit, which is the Spirit of the Father and of the Son. But forasmuch as the self-same Christ is understood in His Body which is the Church, wherefore also His members are His saints and believers, whence to them is said, “But ye are the Body of Christ, and the members,” doubtless He hath Himself also received gifts in men. Now Christ hath gone up on high, and sitteth at the right hand of the Father: but unless He were here also on the earth, He would not thence have cried, “Saul, Saul, why persecutest thou me?” When the Same saith Himself, “Inasmuch as to one of My least ye have done it, to Me ye have done it:” why do we doubt that He receiveth in His members, the gifts which the members of Him receive?

But what is, “Thou hast led captivity captive”? Is it because He hath conquered death, which was holding captive those over whom it reigned? Or hath he called men themselves captivity, who were being held captive under the devil? Which thing’s mystery even the title of that Psalm doth contain, to wit, “when the house was being builded after the captivity:” that is, the Church after the coming in of the Gentiles. Calling therefore those very men who were being held captive a captivity, as when “the service” is spoken of there are understood those that serve also, that same captivity he saith by Christ hath been led captive. For why should not captivity be happy, if even for a good purpose men may be caught? Whence to Peter hath been said, “From henceforth thou shalt catch men.” Led captive therefore they are because caught, and caught because subjugated, being sent under that gentle yoke, being delivered from sin whereof they were servants, and being made servants of righteousness whereof they were children. Whence also He is Himself in them, that hath given gifts to men, and hath received gifts in men. And thus in that captivity, in that servitude, in that chariot, under that yoke, there are not thousands of men lamenting, but thousands of men rejoicing. For the Lord is in them, in Sina, in the holy place.…

But what next doth he adjoin? “For they that believe not to dwell” (ver. 18): or, as some copies have, “For not believing to dwell:” for what else are men not believing, but they that believe not? To whom this hath been said, is not easy to perceive. For as though a reason were being given of the above words, when it had been said, “Thou hast led captivity captive, Thou hast received gifts in men:” there hath been added in continuation, “for they that believe not to dwell,” that is, not believing that they should dwell. What is this? Of whom saith he this? Did that captivity, before it passed into a good captivity, show whence it was an evil captivity? For through not believing they were possessed by the enemy, “that worketh in the sons of unbelief: among whom ye were sometime, while ye were living among them.” By the gifts therefore of His grace, He that hath received gifts in men, hath led captive that captivity. For they believed not that they should dwell. For faith hath thence delivered them, in order that now believing they may dwell in the House of God, even they too becoming the House of God, and the Chariot of God, consisting of thousands of men rejoicing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
