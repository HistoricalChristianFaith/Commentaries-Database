[[commentary]]
quote='''
There is no way that this gospel truth could have been made acceptable to some philosophers and debaters. They follow a way of life that does not stand in the truth but is only an imitation of it. They deceived themselves and others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 120, TO CONSENTIUS"

[[commentary]]
quote='''
For what improvidence is there in Christ? Is He not Himself the Virtue of God, and the Wisdom of God? Doth He call this His improvidence, whereof the Apostle speaketh, “the foolishness of God is wiser than men”? Mine improvidence, that very thing which in Me they derided that seem to themselves to be wise, Thou hast known why it was done. For what was so much like improvidence, as, when He had it in His power with one word to lay low the persecutors, to suffer Himself to be held, scourged, spit upon, buffeted, with thorns to be crowned, to the tree to be nailed? It is like improvidence, it seemeth a foolish thing; but this foolish thing excelleth all wise men. Foolish indeed it is: but even when grain falleth into the earth, if no one knoweth the custom of husbandmen, it seemeth foolish…Improvidence it appeareth; but hope maketh it not to be improvidence. He then spared not Himself: because even the Father spared Him not, but delivered Him up for us all. And of the Same, “Who loved me,” saith the Apostle, “and delivered up Himself for me:” for except a grain shall have fallen into the land so that it die, fruit, He saith, it will not yield. This is the improvidence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
