[[commentary]]
quote='''
Whence also the Lord, when on the eve of appointing martyrs and becoming the head-martyr Himself, said, "Be not afraid of them that kill the body, and after that have no more that they can do."How "have they no more that they can do"? What if, after having slain one, they threw his body to be mangled by wild beasts, and torn to pieces by birds? Cruelty seems still to have something it can do. But to whom is it done? He has departed. The body is there, but without feeling. The tenement lies on the ground, the tenant is gone. And so "after that they have no more that they can do;" for they can do nothing to that which is without sensation. "But fear Him who hath power to destroy both body and soul, in hell fire." Here is the death that He spake of when He said, "He that keepeth my saying shall never see death."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252043.html'
source_title="Tractates on John 43"

[[commentary]]
quote='''
The apostle also says to Timothy, "For God hath not given to us the spirit of fear, but of power, and of love, and of a sound mind." Now in respect of this passage of the apostle, we must be on our guard against supposing that we have not received the spirit of the fear of God, which is undoubtedly a great gift of God, and concerning which the prophet Isaiah says, "The Spirit of the Lord shall rest upon thee, the spirit of wisdom and understanding, the spirit of counsel and might, the spirit of knowledge and piety, the spirit of the fear of the Lord." It is not the fear with which Peter denied Christ that we have received the spirit of, but that fear concerning which Christ Himself says, "Fear Him who hath power to destroy both soul and body in hell; yea, I say unto you, Fear Him." This, indeed, He said, lest we should deny Him from the same fear which shook Peter; for such cowardice he plainly wished to be removed from us when He, in the preceding passage, said, "Be not afraid of them that kill the body, and after that have no more that they can do." It is not of this fear that we have received the spirit, but of power, and of love, and of a sound mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 39"
