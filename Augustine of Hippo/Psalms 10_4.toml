[[commentary]]
quote='''
“The sinner hath angered the Lord” (ver. 4). Let no one congratulate the man that prospers in his way, to whose sins no avenger is nigh, and an approver is by. This is the greater anger of the Lord. For the sinner hath angered the Lord, that he should suffer these things, that is, should not suffer the scourging of correction. “The sinner hath angered the Lord: according to the multitude of His anger He will not search it out.” Great is His anger, when He searcheth not out, when He as it were forgetteth and marketh not sin, and by fraud and wickedness man attains to riches and honours: which will especially be the case in that Antichrist, who will seem to man blessed to that degree, that he will even be thought God. But how great this anger of God is, we are taught by what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252010.html'
source_title="Exposition on Psalm 10"
