[[commentary]]
quote='''
But let us see what answer our Lord gave to such words. See, brethren: He does not say to him, Thou speakest so on account of thy thievishness. He knew him to be a thief, yet did not betray him, but rather endured him, and showed us an example of patience in tolerating the wicked in the Church. "Then said Jesus to him: Let her keep it against the day of my burial." He announced that His own death was at hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252050.html'
source_title="Tractates on John 50"
