[[commentary]]
quote='''
Let the nation of the Jews remain: certes conquered it hath been by the Romans, certes effaced is the city of them, Jews are not admitted into their city, and yet Jews there are. For all those provinces by the Romans have been subjugated. Who now can distinguish the nations in the Roman empire the one from the other, inasmuch as all have become Romans and all are called Romans? The Jews nevertheless remain with a mark; nor in such sort conquered have they been, as that by the conquerors they have been swallowed up. Not without reason is there that Cain, on whom, when he had slain his brother, God set a mark in order that no one should slay him. This is the mark which the Jews have: they hold fast by the remnant of their law, they are circumcised, they keep Sabbaths, they sacrifice the Passover; they eat unleavened bread. These are therefore Jews, they have not been slain, they are necessary to believing nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"
