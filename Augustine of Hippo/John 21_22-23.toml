[[commentary]]
quote='''
(Tract. cxxiv) Jesus saith unto him, What is that to thee? and He then repeats, Follow thou Me, as if John would not follow Him, because he wished to remain till He came; Then went this saying abroad among the disciples, that that disciple should not die. Was it not a natural inference of the disciple's? But John himself does away with such a notion: Yet Jesus said not unto him, He shall not die; but, If I will that he tarry till I come, what is that to thee? But if any so will, let him contradict, and say that what John says is true, viz. that our Lord did not say that that disciple should not die, but that nevertheless this was signified by using such words as John records.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But let any one who so listeth still refuse his assent, and declare that what John asserts is true enough, that the Lord said not that that disciple dieth not, and yet that this is the meaning of such words as He is here recorded to have used; and further assert that the Apostle John is still living, and maintain that he is sleeping rather than lying dead in his tomb at Ephesus. Let him employ as an argument the current report that there the earth is in sensible commotion, and presents a kind of heaving appearance, and assert whether it be steadfastly or obstinately that this is occasioned by his breathing. For we cannot fail to have some who so believe, if there is no want of those also who affirm that Moses is alive; because it is written that his sepulchre could not be found, and that he appeared with the Lord on the mountain along with Elias, of whom we read that he did not die, but was translated. As if Moses' body could not have been hid somewhere in such a way as that its position should altogether escape discovery by men, and be raised up therefrom by divine power at the time when Elias and he were seen with Christ just as at the time of Christ's passion many bodies of the saints arose, and after His resurrection appeared, according to Scripture, to many in the holy city. But still, as I began to say, if some deny the death of Moses, whom Scripture itself, in the very passage where we read that his sepulchre could nowhere be found, explicitly declares to have died; how much more may occasion be taken from these words where the Lord says, "Thus do I wish him to stay till I come," to believe that John is sleeping, but still alive, beneath the ground? Of whom we have also the tradition (which is found in certain apocryphal scriptures), that he was present, in good health, when he ordered a sepulchre to be made for him; and that, when it was dug and prepared with all possible care, he laid himself down there as in a bed, and became immediately defunct: yet as those think who so understand these words of the Lord, not really defunct, but only lying like one in such a condition; and, while accounted dead, was actually buried when asleep, and that he will so remain till the coming of Christ, making known meanwhile the fact of his life by the bubbling up of the dust, which is believed to be forced by the breath of the sleeper to ascend from the depths to the surface of the grave. I think it quite superfluous to contend with such an opinion. For those may see for themselves who know the locality whether the ground there does or suffers what is said regarding it, because, in truth, we too have heard of it from those who are not altogether unreliable witnesses.

Meanwhile let us yield to the opinion, which we are unable to refute by any certain evidence, lest we stir up still another question that may be put to us, Why the very ground should seem in a kind of way to live and breathe upon the interred corpse? But can so great a question as the one before us be settled on such grounds as these, if by a great miracle, such as can be wrought by the Almighty, the living body lies so long asleep beneath the ground, till the coming of the end of the world? Nay, rather, does there not arise a wider and more difficult one, why Jesus bestowed on the disciple, whom He loved beyond the others to such an extent that he was counted worthy to recline on His breast, the gift of a protracted sleep in the body, when He delivered the blessed Peter, by the eminent glory of martyrdom, from the burden of the body itself, and vouchsafed to him what the Apostle Paul said that he desired, and committed to writing, namely, "to be let loose, and to be with Christ"? But if, what is rather to be believed, Saint John declared that the Lord said not, "He dieth not," for the very purpose that no such meaning might be attached to the words which He used; and his body lieth in its sepulchre lifeless like those of others deceased; it remains, if that really takes place which report has spread abroad regarding the soil, which grows up anew, though continually carried away, that it is either so done for the purpose of commending the preciousness of his death, seeing it wants the commendation of martyrdom (for he suffered not death at a persecutor's hand for the faith of Christ), or on some other account that is concealed from our knowledge. Still there remains the question, why the Lord said of one who was destined to die, "Thus I wish him to remain till I Come."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520124.html'
source_title="Tractates on John 124"
