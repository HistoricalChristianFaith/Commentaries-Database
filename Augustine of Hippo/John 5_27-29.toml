[[commentary]]
quote='''
He has finished speaking of the resurrection of souls; it remains to speak more evidently of the resurrection of bodies. "And hath given Him authority also to execute judgment:" not only to raise up souls by faith and wisdom, but also to execute judgment. But why this? "Because He is the Son of man." Therefore the Father doeth something through the Son of man, which He doeth not from His own substance, to which the Son is equal: as, for instance, that He should be born, crucified, dead, and have a resurrection; for not any of these is contingent to the Father. In the same manner also the raising again of bodies. For the raising to life of souls the Father effects from His own substance, by the substance of the Son, in which the Son is equal to Him; because souls are made partakers of that unchangeable light, but not bodies; but the raising again of bodies, the Father effects through the Son of man. For "He hath given Him authority also to execute judgment, because He is the Son of man;" according to that which He said above, "For the Father judgeth not any man." And to show that He said this of the resurrection of bodies, He goes on: "Marvel not at this, for the hour cometh:" not, and now is; but, "the hour cometh, in which all that are in the graves (this ye have already heard sufficiently explained yesterday) shall hear His voice, and come forth." Where? Into judgment: "They that have done well, into the resurrection of life; and they that have done evil, into the resurrection of judgment."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252023.html'
source_title="Tractates on John 23"
