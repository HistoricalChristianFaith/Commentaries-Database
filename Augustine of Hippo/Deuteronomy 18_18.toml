[[commentary]]
quote='''
Perhaps they still thought Christ to be a prophet for this reason, namely, that they were sitting on the grass. But He was the Lord of the prophets, the fulfiller of the prophets, the sanctifier of the prophets, but yet a prophet also: for it was said to Moses, "I will raise up for them a prophet like unto thee." Like, according to the flesh, but not according to the majesty. And that this promise of the Lord is to be understood concerning Christ Himself,is clearly expounded and read in the Acts of the Apostles. And the Lord says of Himself, "A prophet is not without honor, except in his own country." The Lord is a prophet, and the Lord is God's Word, and no prophet prophesies without the Word of God: the Word of God is with the prophets, and the Word of God is a prophet. The former times obtained prophets inspired and filled by the Word of God: we have obtained the very Word of God for our prophet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252024.html'
source_title="Tractates on John 24"
