[[commentary]]
quote='''
“From Thy Temple in Jerusalem, to Thee kings shall offer presents” (ver. 29). Jerusalem, which is our free mother, because the same also is Thy holy Temple: from that Temple then, “to Thee kings shall offer presents.” Whatever kings be understood, whether kings of the earth, or whether those whom “He that is above the heavens distinguisheth over the dove silvered;” “to Thee kings shall offer presents.” And what presents are so acceptable as the sacrifices of praise?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
