[[commentary]]
quote='''
In the same way I too was having the truth about the catholic church, as it is spread throughout the whole world, dinned into me from every side by the words of the divine Scriptures; and the false accusations about the betrayers leveled against it by my relatives made me deaf. I am not comparing myself with Paul's merits but with his sins. Even if I have not been found worthy to be as good as he was, still, before receiving the remedy of correction, I was not as bad. He failed to recognize the bridegroom in the books he read, and I failed to recognize the bride. The one who revealed to him what is written about Christ's glorification, "Be exalted over the heavens, God," also revealed to me what follows about the spread of the church: "over the whole earth your glory." The evidence of both texts is plain to those who can see but hidden from the blind. It was the baptism of Christ that opened his eyes, the peace of Christ that opened mine. He was made new by the washing of the holy water; whereas it was charity that covered the multitude of my sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520360.html'
source_title="SERMON 360"


[[commentary]]
quote='''
Call to mind the psalm. To whom was it said, "Be exalted above the heavens, O God"? Who was being spoken to? It would not be said to God the Father, would it, "be exalted," seeing that he has never been brought low? No, you are exalted, you who were enclosed in your mother's womb; you who were made in her whom you had made; you who lay in the manger; you, suckled at the breast as a baby, according to the very nature of flesh; you, holding up the world and being held by your mother; you, the baby acknowledged by Simeon the old man and praised as great; you, seen by the widow Anna being suckled and acknowledged as almighty; you, who were hungry for our sakes, thirsty for our sakes, tired along the road for our sakes—did you ever hear of bread being hungry, a fountain being thirsty, a road being tired?—you who endured all these things on our account; you who went to sleep, and yet you "slumber not, watching over Israel"; you, finally, whom Judas sold, whom the Jews bought and did not gain possession of; you, arrested, bound, scourged, crowned with thorns, hung on the tree, pierced with the lance, you dead, you buried: "be exalted above the heavens, O God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520262.html'
source_title="SERMON 262:4"

[[commentary]]
quote='''
And what have they done to Thee, O Lord? Let the Prophet here exult! For above, all those verses the Lord was speaking: a Prophet indeed, but in the person of the Lord, because in the Prophet is the Lord.…“Be exalted,” he saith, “above the Heavens, O God.” Man on the Cross, and above the Heavens, God. Let them continue on the earth raging, Thou in Heaven be judging. Where are they that were raging? where are their teeth, the arms and arrows? Have not “the stripes of them been made the arrows of infants”? For in another place a Psalm this saith, desiring to prove them vainly to have raged, and vainly unto frenzies to have been driven headlong: for nothing they were able to do to Christ when for the time crucified, and afterwards when He was rising again, and in Heaven was sitting. How do infants make to themselves arrows? Of reeds? But what arrows? or what powers? or what bows? or what wound? “Be Thou exalted above the Heavens, O God, and above all the earth Thy glory” (ver. 6). Wherefore exalted above the Heavens, O God? Brethren, God exalted above the Heavens we see not, but we believe: but above all the earth His glory to be not only we believe, but also see. But what kind of madness heretics are afflicted with, I pray you observe. They being cut off from the bond of the Church of Christ, and to a part holding, the whole losing, will not communicate with the whole earth, where is spread abroad the glory of Christ. But we Catholics are in all the earth, because with all the world we communicate, wherever the Glory of Christ is spread abroad. For we see that which then was sung, now fulfilled. There hath been exalted above the Heavens our God, and above all the earth the Glory of the Same. O heretical insanity! That which thou seest not thou believest with me, that which thou seest thou deniest: thou believest with me in Christ exalted above the Heavens, a thing which we see not; and deniest His Glory over all the earth, a thing which we see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"
