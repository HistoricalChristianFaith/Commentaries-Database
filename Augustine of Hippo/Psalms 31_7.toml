[[commentary]]
quote='''
“I will be glad, and rejoice in Thy mercy:” which doth not deceive me. “For Thou hast regarded My humiliation:” wherein Thou hast subjected me to vanity in hope. “Thou hast saved my soul from necessities” (ver. 7). Thou hast saved my soul from the necessities of fear, that with a free love it may serve Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
