[[commentary]]
quote='''
“Who brought out Israel from the midst of them” (ver. 11). He brought out also His saints and faithful ones from the midst of the wicked. “With a mighty Hand and stretched-out Arm” (ver. 12). What more powerful, what more out-stretched, than that of which is said “To whom is the Arm of the Lord revealed?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520136.html'
source_title="Exposition on Psalm 136"
