[[commentary]]
quote='''
(ubi sup.) Otherwise; That the disciples in working their miracles should not be lifted up with pride, they are warned rather by the humbleness of their faith, as by a grain of mustard-seed, to take care that they remove all pride of earth, which is signified by the mountain in this place.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The faith of believers seems a thing of little value,-you have no scales to weigh it. Hear then to what it attains, and see its greatness: as the Lord Himself says in another place, "If ye have faith as a grain of mustard seed." What is there of less account than that, yet what is there pervaded with greater energy? What more minute, yet what more fervidly expansive?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252040.html'
source_title="Tractates on John 40"
