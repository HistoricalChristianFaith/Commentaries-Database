[[commentary]]
quote='''
“I will follow up mine enemies, and seize them” (ver. 37). I will follow up my carnal affections, and will not be seized by them, but will seize them, so that they may be consumed. “And I will not turn, till they fail.” And from this purpose I will not turn myself to rest, till they fail who make a tumult about me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
