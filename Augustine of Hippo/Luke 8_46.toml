[[commentary]]
quote='''
Why, then, should we not believe that the Holy Spirit proceedeth also from the Son, seeing that He is likewise the Spirit of the Son? For did He not so proceed, He could not, when showing Himself to His disciples after the resurrection, have breathed upon them, and said, "Receive ye the Holy Spirit." For what else was signified by such a breathing upon them, but that from Him also the Holy Spirit proceedeth? And of the same character also are His words regarding the woman that suffered from the bloody flux: "Some one hath touched me; for I perceive that virtue is gone out of me." For that the Holy Spirit is also designated by the name of virtue, is both clear from the passage where the angel, in reply to Mary's question, "How shall this be, seeing I know not a man?" said, "The Holy Ghost shall come upon thee, and the power [virtue] of the highest shall overshadow thee;" and our Lord Himself when giving His disciples the promise of the Spirit, said, "But tarry ye in the city, until ye be endued with power [virtue] from on high;" and on another occasion, "Ye shall receive the power [virtue] of the Holy Ghost coming upon you, and ye shall be witnesses unto me." It is of this virtue that we are to believe, that the evangelist says, "Virtue went out of Him, and healed them all."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252099.html'
source_title="Tractates on John 99"
