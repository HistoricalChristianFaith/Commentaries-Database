[[commentary]]
quote='''
“And the words of my mouth shall be pleasing, and the meditation of my heart is always in Thy sight” (ver. 14). The meditation of my heart is not after the vain glory of pleasing men, for now there is pride no more, but in Thy sight alway, who regardest a pure conscience. “O Lord, my Helper, and my Redeemer” (ver. 15). O Lord, my Helper, in my approach to Thee; for Thou art my Redeemer, that I might set out unto Thee: lest any attributing to his own wisdom his conversion to Thee, or to his own strength his attaining to Thee, should be rather driven back by Thee, who resistest the proud; for he is not cleansed from the great offence, nor pleasing in Thy sight, who redeemest us that we may be converted, and helpest us that we may attain unto Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252019.html'
source_title="Exposition on Psalm 19"
