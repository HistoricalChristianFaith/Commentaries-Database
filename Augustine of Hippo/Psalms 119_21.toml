[[commentary]]
quote='''
“Thou hast rebuked the proud: and cursed are they that do err from Thy commandments” (ver. 21). For the proud err from the commandments of God. For it is one thing not to fulfil the commandments of God through infirmity or ignorance; another to err from them through pride; as they have done, who have begotten us in our mortal state unto these evils.…But consider now, after saying, “Thou hast rebuked the proud,” he saith not, Cursed are they that have erred from Thy commandments; so that only that sin of the first men should come into the mind; but he saith, “Cursed are they that do err.” For it was needful that all might be terrified by that example, that they might not err from the divine commandments, and by loving righteousness in all time, recover in the toil of this world, what we lost in the pleasure of Paradise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
