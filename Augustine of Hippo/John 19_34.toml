[[commentary]]
quote='''
(Tr. cxx.) The Evangelist has expressed himself cautiously; not struck, or wounded, but opened His side: (ἔνυξε, aperuit V.) whereby was opened the gate of life, from whence the sacraments of the Church flowed, without which we cannot enter into that life which is the true life: And forthwith came thereout blood and water. That blood was shed for the remission of sins, that water tempers the cup of salvation. This it was which was prefigured when Noah was commanded to make a door in the side of the ark, by which the animals that were not to perish by the deluge entered; which animals prefigured the Church. To shadow forth this, the woman was made out of the side of the sleeping man; for this second Adam bowed His head, and slept on the cross, that out of that which came therefrom, there might be formed a wife for Him. O death, by which the dead are quickened, what can be purer than that blood, what more salutary than that wound!
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But where did He sleep? On the Cross. When He slept on the Cross, He bore a sign, yea, He fulfilled what had been signified in Adam: for when Adam was asleep, a rib was drawn from him and Eve was created; so also while the Lord slept on the Cross, His side was transfixed with a spear, and the Sacraments flowed forth, whence the Church was born. For the Church the Lord’s Bride was created from His side, as Eve was created from the side of Adam. But as she was made from his side no otherwise than while sleeping, so the Church was created from His side no otherwise than while dying.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520127.html'
source_title="Exposition on Psalm 127"
