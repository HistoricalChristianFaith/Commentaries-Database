[[commentary]]
quote='''
“Thou hast made known to Me the paths of life” (ver. 11). Thou hast made known through Me the paths of humiliation, that men might return to life, from whence they fell through pride; in whom because I am, “Thou hast made known to Me.” “Thou wilt fill Me with joy with Thy countenance.” Thou wilt fill them with joy, that they should seek nothing further, when they shall see Thee “face to face;” in whom because I am, “Thou wilt fill Me.” “Pleasure is at Thy right hand even to the end.” Pleasure is in Thy favour and mercy in this life’s journey, leading on even to the end of the glory of Thy countenance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252016.html'
source_title="Exposition on Psalm 16"
