
[[commentary]]
quote='''
“All that saw Me laughed Me to scorn” (ver. 7). All that saw Me derided Me. “And spake with the lips, and shook the head.” And they spoke, not with the heart, but with the lips.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
