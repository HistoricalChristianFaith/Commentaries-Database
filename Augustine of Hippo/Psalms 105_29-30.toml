[[commentary]]
quote='''
“He turned their waters into blood, and slew their fish” (ver. 29). “He made their land frogs, yea, even in the king’s chambers” (ver. 30): as if he were to say, He turned their land into frogs. For there was so great a multitude of frogs, that this might well be said by hyperbole.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520105.html'
source_title="Exposition on Psalm 105"
