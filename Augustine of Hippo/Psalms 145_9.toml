[[commentary]]
quote='''
“Sweet is the Lord to all, and His compassions are over all His works.” Why then doth He condemn? why doth He scourge? Are not they whom He condemneth, whom He scourgeth, His works? Plainly they are. And wilt thou know how “His compassions are over all His works”? Thence is that long-suffering, whereby “He maketh His sun to rise on the evil and on the good.” Are not “His compassions over all His works, who sendeth rain upon the just and upon the unjust”? In His long-suffering He waiteth for the sinner, saying, “Turn ye to Me, and I will turn to you.” Are not “His compassions over all His works”? And when He saith, “Go ye into everlasting fire, prepared for the devil and his angels,” this is not His compassion, but His severity. His compassion is given to His works: His severity is not over His works, but over thy works. Lastly, if thou remove thine own evil works, and there remain in thee nought but His work, His compassion will not leave thee: but if thou leavest not thy works, there will be severity over thy works, not over His works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520145.html'
source_title="Exposition on Psalm 145"
