[[commentary]]
quote='''
“Thou spakest sometime in vision unto Thy sons, and saidst” (ver. 19). Thou spakest in thy vision. Thou didst reveal this to Thy Prophets. For this reason Thou spakest in vision, that is, in revelation: whence Prophets were called seers. They saw something within, which they were to speak without: and secretly they heard what they preached openly. Then “Thou spakest in vision unto Thy sons, and saidst, I have laid help upon One that is mighty.” Ye understand Who is meant by mighty? “I have exalted One chosen out of the people.” And Who is meant by chosen? One who, ye rejoice, is already exalted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
