[[commentary]]
quote='''
(Tr. xix. s. 19) We were about to ask Christ, Thou wilt judge, and the Father not judge: wilt not Thou then judge according to the Father? He anticipates us by saying, I can of Mine own Self do nothing.

(Tr. xxiii. s. 15) When He spoke of the resurrection of the soul, He did not say, Hear, but, See. (v. 19) Hear implies a command issuing from the Father. He speaks as man, who is inferior to the Father.

(Serm. contr. Arrian. c. 9. [xiv.]) As I hear, I judge, is said with reference either to His human subordination, as the Son of man, or to that immutable and simple nature of the Sonship derived from the Father; in which nature hearing and seeing is identical with being. (ut sup. c. xvii.). Wherefore as He hears, He judges. The Word is begotten one with the Father, and therefore judges according to truth. (c. xviii). It follows, And My judgment is just, because I seek not Mine own will, but the will of the Father which hath sent Me. This is intended to take us back to that man (sc. Adam.) who, by seeking his own will, not the will of Him who made him, did not judge himself justly, but had a just judgment pronounced upon him. He did not believe that, by doing his own will, not God's, he should die. So he did his own will, and died; because the judgment of God is just, which judgment the Son of God executes, by not seeking His own will, i. e. His will as being the Son of man. Not that He has no will in judging, but His will is not His own in such sense, as to be different from the Father's.

(Tr. xix. 19.) I seek not then Mine own will, i. e. the will of the Son of man, in opposition to God: for men do their own will, not God's, when, to do what they wish, they violate God's commands. But when they so do what they wish, as at the same time to follow the will of God, they do not their own will. Or, I seek not Mine own will: i. e. because I am not of myself, but of the Father.

(Tr. xxi) The only Son says, I seek not Mine own will: and yet men wish to do their own will. Let us do the will of the Father, Christ, and Holy Ghost: for these have one will, power, and majesty.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"I cannot of myself do anything: as I hear, I judge: and my judgment is just."Else we might have said to Him, "Thou wilt judge, and the Father will not judge, for `all judgment hath He given to the Son;' It is not, therefore, according to the Father that Thou wilt judge." Hence He added, "I cannot of myself do anything: as I hear, I judge: and my judgment is just; because I seek not my own will, but the will of Him that sent me." Undoubtedly the Son quickeneth whom He will. He seeketh not His own will, but the will of Him that sent Him. Not my own, my proper will; not mine, not the Son of man's; not mine to resist God. For men do their own will, not God's, when they do what they list, not what God commands; but when they do what they list, so as yet to follow God's will, they do not their own will, notwithstanding they do what they list to do. Do what thou art bidden willingly, and thus shall thou both do what thou willest, and also not do thine own will, but His that biddeth.

What then? "As I hear, I judge." The Son "heareth," and the Father "showeth" to Him, and the Son seeth the Father doing. But we had deferred these matters, in order to handle them, so far as might lie in our abilities, with somewhat greater plainness and fullness, should time and strength remain to us after finishing the perusal of the passage. If I say that I am able to speak yet further, you perhaps are not able to go on hearing. Again, perhaps, in your eagerness to hear, you say, "We are able." Better, then, that I should confess my weakness, that, being already fatigued, I am not able to speak longer, than that, when you are already satiated, I should continue to pour into you what you cannot well digest. Then,as to this promise, which I deferred until today, should there be an opportunity, hold me, with the Lord's help, your debtor until to-morrow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252019.html'
source_title="Tractates on John 19"

[[commentary]]
quote='''
"I cannot of myself do anything; as I hear I judge, and my judgment is just." If as Thou hearest Thou judgest, of whom dost Thou hear? If of the Father, yet surely "the Father judgeth not any man, but hath given all judgment to the Son.' When dost Thou, being in a manner the Father's herald, declare what Thou hearest? I speak what I hear, because what the Father is, that I am: for, indeed, speaking is my function; because I am the Father's Word. For this Christ says to thee. Thereupon, of thine. What is "As I hear I judge," but "As I am"? For in what manner does Christ hear? Let us inquire, brethren, I beg of you. Does Christ hear of the Father? How doth the Father speak to Him? Undoubtedly, if He speaks to Him, He uses words to Him; for every one who says something to any one, says it by a word. How doth the Father speak to the Son, seeing that the Son is the Father's Word? Whatever the Father says to us, He says it by His Word: the Word of the Father is the Son; by what other word, then, doth He speak to the Word Himself? God is one, has one Word, contains all things in one Word. What does that mean, then, "As I hear, I judge?" Just as I am of the Father, so I judge. Therefore "my judgment is just." If Thou doest nothing of Thyself, O Lord Jesus, as carnal men think; if Thou doest nothing of Thyself, how didst Thou say a while before, "So also the Son quickeneth whom He will"? Just now Thou sayest, Of myself I do nothing. But what does the Son declare, but that He is of the Father? He that is of the Father is not of Himself. If the Son were of Himself, He would not be the Son: He is of the Father. That the Father is, is not of the Son; that the Son is, is of the Father. Equal to the Father; but yet the Son of the Father, not the Father of the Son.

"Because I seek not my own will, but the will of Him that sent me." The Only Son saith, "I seek not my own will," and yet men desire to do their own will! To such a degree does He who is equal to the Father humble Himself; and to such a degree does He extol Himself, who lies in the lowest depth, and cannot rise except a hand is reached to Him! Let us then do the will of the Father, the will of the Son, the will of the Holy Ghost; because of this Trinity there is one will, one power, one majesty. Yet for that reason saith the Son, "I came not to do mine own will, but the will of Him that sent me;" because Christ is not of Himself, but of the Father. But what He had that He might appear as a man, He assumed of the creature which He himself formed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252022.html'
source_title="Tractates on John 22"
[[commentary]]
quote='''
And dost Thou do this alone, because the Father hath given all judgment to the Son, and judgeth not any man? I, saith He, do it. But how doest Thou it? "I cannot of myself do anything; as I hear, I judge; and my judgment is just." When He was treating of the resurrection of souls, He did not say, I hear; but, I see. For I hear refers to the command of the Father as giving order. Therefore, now as a man, just as He than whom the Father is greater; as from the form of a servant, not from the form of God, "As I hear, I judge; and my judgment is just." Whence is the man's judgment a just one? My brethren, mark well: "Because I seek not my own will, but the will of Him that sent me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252023.html'
source_title="Tractates on John 23"
