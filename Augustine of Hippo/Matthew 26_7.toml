[[commentary]]
quote='''
(de Doctr. Christ. iii, 12.) But let not any suppose that the Lord's feet were by this woman bathed in ointment after the manner which the luxurious and debauched use. In all things of this nature, it is not the thing itself, but the mind of him who uses it, that is in fault. Whoso uses things after such sort as to pass the bounds observed by good men with whom he lives, either has some meaning in what he does, or is vicious. What then is vice in others, in a divine or prophetic person is a sign of some great thing. The good odour is the good report which one has gained by the works of a good life, and in following Christ's footsteps sheds a most precious odour on His feet.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Let us therefore notice how harmony is maintained here between these three evangelists, Matthew, Mark, and John, regarding whom there is no doubt that they record the self-same occurrence at Bethany, on occasion of which the disciples also, as all three mention, murmured against the woman, ostensibly on the ground of the waste of the very precious ointment. Now the further fact that Matthew and Mark tell us that it was the Lord's head on which the ointment was poured, while John says it was His feet, can be shown to involve no contradiction, if we apply the principle which we have already expounded in dealing with the scene of the feeding of the multitudes with the five loaves. For as there was one writer who, in giving his account of that incident, did not fail to specify that the people sat down at once by fifties and by hundreds, although another spoke only of the fifties, no contradiction could be supposed to emerge. There might indeed have seemed to be some difficulty, if the one evangelist had referred only to the hundreds, and the other only to the fifties; and yet, even in that case, the correct finding should have been to the effect that they were seated both by fifties and by hundreds. And this example ought to have made it plain to us, as I pressed it upon my readers in discussing that section, that even where the several evangelists introduce only the one fact each, we should take the case to have been really, that both things were elements in the actual occurrence. In the same way, our conclusion with regard to the passage now before us should be, that the woman poured the ointment not only upon the Lord's head, but also on His feet. It is true that some person may possibly be found absurd and artful enough to argue, that because Mark states that the ointment was poured out only after the alabaster vase was broken there could not have remained in the shattered vessel anything with which she could anoint His feet. But while a person of that character, in his endeavours to disprove the veracity of the Gospel, may contend that the vase was broken, in a manner making it impossible that any portion of the contents could have been left in it, how much better and more accordant with piety must the position of a very different individual appear, whose aim will be to uphold the truthfulness of the Gospel, and who may therefore contend that the vessel was not broken in a manner involving the total outpouring of the ointment! Moreover, if that calumniator is so persistently blinded as to attempt to shatter the harmony of the evangelists on this subject of the shattering of the vase, he should rather accept the alternative, that the [Lord's] feet were anointed before the vessel itself was broken, and that it thus remained whole, and filled with ointment sufficient for the anointing also of the head, when, by the breakage referred to, the entire contents were discharged. For we allow that there is a due regard to the several parts of our nature when the act commences with the head, but [we may also say that] an equally natural order is preserved when we ascend from the feet to the head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 79"

[[commentary]]
quote='''
Once more, John joins Matthew and Mark in what is recorded about Bethany, where the scene took place with the precious ointment which was poured upon His feet and His head by Mary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 10"
