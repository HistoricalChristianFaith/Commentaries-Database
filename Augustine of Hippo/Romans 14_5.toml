[[commentary]]
quote='''
When he says: One indeed judges between day and day, but another judges every day, setting aside for the moment a better consideration, it seems to me to be said not of two men, but of man and God. For he who judges between day and day is man, for he can judge one thing today and another tomorrow—that is, whomever he has today condemned as a proven or confessed evildoer, he may find good tomorrow, when he has corrected himself; or, on the contrary, when he has today praised someone as righteous, he may find him tomorrow depraved. But he who judges every day is God, because he knows not only what each one is, but also what he will be on every day. Therefore: Let each one abound in his own understanding, he says—that is, let him dare to judge only so far as is granted to human understanding, or to each man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
