[[commentary]]
quote='''
“For the King hath greatly desired thy beauty” (ver. 11). What “beauty” is that, save that which is His own work? “Greatly desired the beauty”—Of whom? Of her the sinner, the unrighteous, the ungodly, such as she was with her “father,” the devil, and among her own “people”? No, but hers of whom it is said, “Who is this that cometh up made white?” She was not white then at the first, but was “made” white afterwards. For “though your sins shall be as scarlet, I will make them white as snow.” “The king has greatly desired thy beauty.” What King is this? “For He is the Lord thy God.” Now consider whether thou oughtest not to forego that thy father, and thy own people, and to come to this King, who is thy God? Thy God is “thy King,” thy “King” is also thy Bridegroom. Thou weddest to thy King, who is thy God: being endowed by Him, being adorned by Him; redeemed by Him, and healed by Him. Whatever thou hast, wherewith to be pleasing to Him, thou hast from Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"
