[[commentary]]
quote='''
Matthew goes on with his narrative in the following terms: "And when they drew nigh unto Jerusalem, and were come to Bethphage, unto the Mount of Olives, then sent Jesus two disciples, saying unto them, Go into the village over against you, and straightway ye shall find an ass tied, and a colt with her;" and so on, down to the words, "Blessed is He that cometh in the name of the Lord: Hosanna in the highest." Mark also records this occurrence, and inserts it in the same order. Luke, on the other hand, tarries a space by Jericho, recounting certain matters which these others have omitted,—namely, the story of Zacchæus, the chief of the publicans, and some sayings which are couched in parabolic form. After instancing these things, however, this evangelist again joins company with the others in the narrative relating to the ass on which Jesus sat. And let not the circumstance stagger us, that Matthew speaks both of an ass and of the colt of an ass, while the others say nothing of the ass. For here again we must bear in mind the rule which we have already introduced in dealing with the statements about the seating of the people by fifties and by hundreds on the occasion on which the multitudes were fed with the five loaves. Now, after this principle has been brought into application, the reader should not feel any serious difficulty in the present case. Indeed, even had Matthew said nothing about the colt, just as his fellow-historians have taken no notice of the ass, the fact should not have created any such perplexity as to induce the idea of an insuperable contradiction between the two statements, when the one writer speaks only of the ass, and the others only of the colt of the ass. But how much less cause then for any disquietude ought there to be, when we see that the one writer has mentioned the ass to which the others have omitted to refer, in such a manner as at the same time not to leave unnoticed also the colt of which the rest have spoken! In fine, where it is possible to suppose both objects to have been included in the occurrence, there is no real antagonism, although the one writer may specify only the one thing, and another only the other. How much less need there be any contradiction, when the one writer particularizes the one object, and another instances both!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 66"
