[[commentary]]
quote='''
“I spoke of Thy testimonies also,” he saith, “before kings, and I was not ashamed” (ver. 46): as one who had sought and had received grace to answer those who reproached him with the word, and the promise that the word of truth should not be taken from his mouth. Struggling for this truth even unto death, not even before kings was he ashamed to speak of it. For testimonies, whereof he doth avow that he was speaking, are in Greek styled μαρτύρια, a word which we now employ instead of the Latin. The name of “Martyrs,” unto whom Jesus foretold, that they should confess Him even before kings, is derived hence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
