[[commentary]]
quote='''
Next he saith, “The iniquity of the proud hath been multiplied upon me” (ver. 69): of those, that is, whom it profited not that human nature was humbled after it went wrong. “But I will search Thy commandments with my whole heart.” Howsoever, he saith, iniquity shall abound, love shall not grow cold in me. He, as it were, saith this, who in His sweetness learneth the righteousnesses of God. For in proportion as the commandments of Him who aideth us are the more sweet, so much the more doth he who loveth Him search after them, that he may perform them when known, and may learn them by doing them; because they are more perfectly understood when they are performed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
