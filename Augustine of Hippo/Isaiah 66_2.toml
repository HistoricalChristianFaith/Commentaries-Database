[[commentary]]
quote='''
"On whom does my Spirit rest, if not on one who is humble and quiet and who trembles at my words?" So when he becomes the occupant, he fills and guides and leads the person, restrains from evil and spurs on to good, makes justice delightful, so that the person does good out of love for what is right, not out of fear of punishment. No one is capable on their own of doing what I have said. But if you have the Holy Spirit as the occupant of your house, you will find him also assisting you in everything good. 
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252072A.html'
source_title="SERMON 72a.2"


[[commentary]]
quote='''
At these words Peter trembled, Plato did not; so let the fisherman keep what the great and famous philosopher ignored! "You have hidden these things from the wise and the knowing and have revealed them to the little ones."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252068.html'
source_title="SERMON 68:7"

[[commentary]]
quote='''
Where did he seek a place for the Lord? If he was meek, he sought it in himself. For how is one a place for the Lord? Hear the Prophet: “Upon whom shall My Spirit rest? Even upon him that is poor and of a contrite spirit, and trembleth at My words.” Dost thou wish to be a place for the Lord? Be thou poor in spirit, and contrite, and trembling at the word of God, and thou wilt thyself be made what thou seekest. For if what thou seekest be not realized in thyself, what doth it profit thee in another.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520132.html'
source_title="Exposition on Psalm 132"
