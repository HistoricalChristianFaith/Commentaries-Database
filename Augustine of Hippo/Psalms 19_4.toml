[[commentary]]
quote='''
The sun's maker could only be seen by the sun's light, because he "set his tabernacle in the sun." He who was before the sun that he made, before the day star and all stars, before all angels, the true Creator (for all things were made by him, and without him was nothing made), that he might be seen by the eyes of flesh that see the sun, set his own tabernacle in the sun—showed his flesh in manifestation by this light.
'''
source_url=''
source_title="HOMILIES ON 1 JOHN 1:2"

[[commentary]]
quote='''
“Their sound is gone out into all the earth, and their words to the ends of the world” (ver. 4).

“In the sun hath He set His tabernacle.” Now that He might war against the powers of temporal error, the Lord, being about to send not peace but a sword on earth, in time, or in manifestation, set so to say His military dwelling, that is, the dispensation of His incarnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252019.html'
source_title="Exposition on Psalm 19"
