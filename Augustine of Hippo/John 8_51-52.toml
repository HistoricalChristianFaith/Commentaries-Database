[[commentary]]
quote='''
But what sayest Thou, O Lord, of Thyself? "Verily, verily, I say unto you, If a man keep my saying, he shall never see death." Ye say, "Thou hast a devil." I call you to life: keep my word and ye shall not die. They heard, "He shall never see death who keepeth my word," and were angry, because already dead in that death from which they might have escaped. "Then said the Jews, Now we know that thou hast a devil. Abraham is dead, and the prophets; and thou sayest, If a man keep my saying, he shall never taste of death." See how Scripture speaks: "He shall not see," that is, "taste of death." "He shall see death-he shall taste of death." Who seeth? Who tasteth? What eyes has a man to see with when he dies? When death at its coming shuts up those very eyes from seeing aught, how is it said, "he shall not see death"? With what palate, also, and with what jaws can death be tasted, that its savor may be discovered? When it taketh every sense away, what will remain in the palate? But here, "he will see," and "he will taste," are used for that which is really the case, he will know by experience.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252043.html'
source_title="Tractates on John 43"
