[[commentary]]
quote='''
“Before the Lord, for He is come; for He is come to judge the earth” (ver. 9). “The hills” signify the great. The Lord cometh to judge the earth, and they rejoice. But there are hills, who, when the Lord is coming to judge the earth, shall tremble. There are therefore good and evil hills; the good hills, are spiritual greatness; the bad hills, are the swelling of pride. “Let the hills be joyful together before the Lord, for He is come; for He is come to judge the earth.” Wherefore shall He come, and how shall He come? “With righteousness shall He judge the world, and the people with equity” (ver. 10). Let the hills therefore rejoice; for He shall not judge unrighteously. When some man is coming as a judge, to whom the conscience cannot lie open, even innocent men may tremble, if from him they expect a reward for virtue, or fear the penalty of condemnation; when He shall come who cannot be deceived, let the hills rejoice, let them rejoice fearlessly; they shall be enlightened by Him, not condemned; let them rejoice, because the Lord will come to judge the world with equity; and if the righteous hills rejoice, let the unrighteous tremble. But behold, He hath not yet come: what need is there they should tremble? Let them mend their ways, and rejoice. It is in thy power in what way thou willest to await the coming of Christ. For this reason He delayeth to come, that when He cometh He may not condemn thee. Lo, He hath not yet come: He is in heaven, thou on earth: He delayeth His coming, do not thou delay wisdom. His coming is hard to the hard of heart, soft to the pious. See therefore even now what thou art: if hard of heart, thou canst soften; if thou art soft, even now rejoice that He will come. For thou art a Christian. Yea, thou sayest. I believe that thou prayest, and sayest, “Thy kingdom come.” Thou desirest Him to come, whose coming thou fearest. Reform thyself, that thou mayest not pray against thyself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252098.html'
source_title="Exposition on Psalm 98"
