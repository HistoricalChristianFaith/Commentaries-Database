[[commentary]]
quote='''
(Tr. xlii. 11) Our Lord by His Father wishes us to understand God: as if to say, I have seen the truth, I speak the truth, because I am the truth. If our Lord then speaks the truth which He saw with the Father, it is Himself that He saw, Himself that He speaks; He being Himself the truth of the Father.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
You have heard, indeed, the Lord saying, "I know that ye are Abraham's children." Hear what He says afterwards: "I speak that which I have seen with my Father; and ye do that which ye have seen with your father." He had already said, "I know that ye are Abraham's children." What is it, then, that they do? What He told them: "Ye seek to kill me." This they never saw with Abraham. But the Lord wishes God the Father to be understood when He says, "I speak that which I have seen with my Father." I have seen the truth: I speak the truth, because I am the Truth. For if the Lord speaks the truth which He has seen with the Father, He has seen Himself-He speaks Himself; because He Himself is the Truth of the Father, which He saw with the Father. For He is the Word-the Word which was with God. The evil, then, which these men do, and which the Lord chides and reprehends, where have they seen it? With their father. When we come to hear in what follows the still clearer statement who is their father, then shall we understand what kind of things they saw with such a father; for as yet He names not their father. A little above He referred to Abraham, but in regard to their fleshly origin, not their similarity of life. He is about to speak of that other father of theirs, who neither begat them nor created them to be men. But still they were his children in as far as they were evil, not in as far as they were men; in what they imitated him, and not as created by him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252042.html'
source_title="Tractates on John 42"
