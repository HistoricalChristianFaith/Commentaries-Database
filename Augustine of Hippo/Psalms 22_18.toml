[[commentary]]
quote='''
"They divided My garments for themselves, and cast the lot upon My vesture"  [Psalm 22:18].
'''
source_url='https://www.newadvent.org/fathers/1801022.htm'
source_title="Exposition on Psalm 22"

[[commentary]]
quote='''
The account given by this evangelist is also in harmony with the testimony of prophecy, which he likewise immediately subjoins, saying, "That the scripture might be fulfilled which saith, They parted my raiment among them, and for my vesture they did cast lots." For He says not, they cast lots, but "they parted:" nor does He say, casting lots they parted; but while making no mention whatever of the lot in regard to the rest of the garments, He afterwards said, "and for my vesture they did cast lots," in reference solely to the coat that remained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520118.html'
source_title="Tractates on John 118"
