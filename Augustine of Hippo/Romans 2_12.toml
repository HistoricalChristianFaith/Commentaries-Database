[[commentary]]
quote='''
It is generally agreed that judgment is the usual expression for eternal damnation.
'''
source_url=''
source_title="FAITH AND WORKS 23.43"

[[commentary]]
quote='''
It remains for us to inquire, whether those who, prior to the coming of Christ in His Church to the Gentiles and to their hearing of His Gospel, have been, or are now being, overtaken by the close of this life, can have such an excuse? Evidently they can, but not on that account can they escape damnation. "For as many as have sinned without the law, shall also perish without the law; and as many as have sinned in the law, shall be judged by the law." And these words of the apostle, inasmuch as his saying, "they shall perish," has a more terrible sound than when he says, "they shall be judged," seem to show that such an excuse can not only avail them nothing, but even becomes an additional aggravation. For those that excuse themselves because they did not hear, "shall perish without the law."

But it is also a worthy subject of inquiry, whether those who met the words they heard with contempt, and even with opposition, and that not merely by contradicting them, but also by persecuting in their hatred those from whom they heard them, are to be reckoned among those in regard to whom the words, "they shall be judged by the law," convey somewhat of a milder sound. But if it is one thing to perish without the law, and another to be judged by the law; and the former is the heavier, the latter the lighter punishment: such, without a doubt, are not to have their place assigned in that lighter measure of punishment; for, so far from sinning in the law, they utterly refused to accept the law of Christ, and, as far as in them lay, would have had it altogether annihilated. But those that sin in the law, are such as are in the law, that is, who accept it, and confess that it is holy, and the commandment holy, and just, and good; but fail through infirmity in fulfilling what they cannot doubt is most righteously enjoined therein. These are they in regard to whose fate there may perhaps be some distinction made from the perdition of those who are without the law: and yet if the apostle's words, "they shall be judged by the law," are to be understood as meaning, they shall not perish, what a wonder if it were so For his discourse was not about infidels and believers to lead him to say so, but about Gentiles and Jews, both of whom, certainly, if they find not salvation in that Saviour who came to seek that which was lost, shall doubtless become the prey of perdition; although it may be said that some shall perish in a more terrible, others in a more mitigated sense; in other words, that some shall suffer a heavier, and others a lighter penalty in their perdition. For he is rightly said to perish as regards God, whoever is separated by punishment from that blessedness which He bestows on His saints, and the diversity of punishments is as great as the diversity of sins; but the mode thereof is accounted too deep by divine wisdom for human guessing to scrutinize or express. At all events, those to whom Christ came, and to whom He spake, have not, for their great sin of unbelief, any such excuse as may enable them to say, We saw not, we heard not: whether it be that such an excuse would not be sustained by Him whose judgments are unsearchable, or whether it would, and that, if not for their entire deliverance from damnation, at least for its partial alleviation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252089.html'
source_title="Tractates on John 89"

[[commentary]]
quote='''
But these sinners are of two kinds: there are some that have received Law, there are others that have not received: all the heathen have not received Law, all Jews and Christians have received Law. Therefore the general term is sinner; either a transgressor of the Law, if he hath received Law; or only unjust without Law, if he hath not received the Law. Of both kinds speaketh the Apostle, and saith, “They that without Law have sinned, without Law shall perish, and they that in the Law have sinned, by the Law shall be judged.” But thou that amid both kinds dost groan, say to God that which thou hearest in the Psalm, “My God, deliver me from the hand of the sinner.” Of what sinner? “From the hand of him that transgresseth the Law, and of the unjust man.” He that transgresseth the Law is indeed also unjust; for not unjust he is not, that transgresseth the Law: but every one that transgresseth the Law is unjust, not every unjust man doth transgress the Law. For, “Where there is not a Law,” saith the Apostle, “neither is there transgression.” They then that have not received Law, may be called unjust, transgressors they cannot be called. Both are judged after their deservings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252071.html'
source_title="Exposition on Psalm 71"

[[commentary]]
quote='''
The next words in the Psalm are, “I have counted,” or “thought,” or “esteemed, all the ungodly of the earth as transgressors” (ver. 119). In the Latin version many different renderings are given of the Greek ἐλογισάμην; but this passage hath a deep meaning. For the following words, “Therefore have I ever loved Thy testimonies:” make it far more profound. For the Apostle saith, “The law worketh wrath;” and, explaining these words, he addeth, “For where no law is, there is no transgression:” thereby showing that not all are transgressors. For all have not the law. That all have not the law, he declareth more explicitly in another passage, “as many as have sinned without law, shall also perish without law.” What then meaneth, “I have held all the ungodly of the earth as transgressors”? “As transgressors;” or rather “transgressing,” for the Greek saith, παραβαίνοντας, not παραβάτας.…“The law entered that sin might abound.” But since all sins are remitted through grace, not only those which are committed without the law, but those also which are committed in the law; he addeth, “But where sin abounded, grace did much more abound.”…But, indeed, when the Apostle said, “As many as have sinned without law, shall perish without law,” he was speaking of that law which God gave to His people Israel through Moses His servant.…For some even Catholic expositors, from a want of sufficient heedfulness, have pronounced contrary to the truth, that those who have sinned without the law perish; and that those who have sinned in the law, are only judged, and do not perish, as if they should be considered destined to be cleansed by means of transitory punishments, as he of whom it is said, “he himself shall be saved, yet so as by fire.”…The Psalmist also hath subjoined: “Therefore I loved Thy testimonies.” As if he should say: Since the law, whether given in paradise, or implanted by nature, or promulgated in writing, hath made all the sinners of the earth transgressors; “Therefore I loved Thy testimonies,” which are in Thy law, of Thy grace; so that not my but Thy righteousness is in me. For the law profiteth unto this end, that it send us forward unto grace. For not only because it testifieth towards the manifestation of the righteousness of God, which is without the law; but also in this very point that it rendereth men transgressors, so that the letter even slayeth, it driveth us to fly unto the quickening Spirit, through whom the whole of our sins may be blotted out, and the love of righteous deeds be inspired.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
