[[commentary]]
quote='''
(de Con. Evan. ii. 17) But let no one suppose that Simon now received his name and was called Peter, for thus he would make Mark contrary to John, who relates that it had been long before said unto him, Thou shalt be called Cephas. (John 1:42) But Mark gives this account by way of recapitulation; for as he wished to give the names of the twelve Apostles, and was obliged to call him Peter, his object was to intimate briefly, that he was not called this originally, but that the Lord gave him that name.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
I recollect having already stated that no one should suppose that Peter received that name for the first time on the occasion when He said to Him, "Thou art Peter, and upon this rock I will build my Church." For the time at which he did obtain this name was that referred to by John, when he mentions that he was addressed in these terms: "Thou shalt be called Cephas, which is, by interpretation, Peter." Hence, too, we are as little to think that Peter got this designation on the occasion to which Mark alludes, when he recounts the twelve apostles individually by name, and tells us how James and John were called the sons of thunder, merely on the ground that in that passage he has recorded the fact that He surnamed him Peter. For that circumstance is noticed there simply because it was suggested to the writer's recollection at that particular point, and not because it took place in actual fact at that specific time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 53"

[[commentary]]
quote='''
Mark proceeds thus: "And He goeth up into a mountain, and calleth unto Him whom He would: and they came unto Him. And He ordained twelve that they should be with Him, and that He might send them forth to preach; and He gave them power to heal sicknesses, and to cast out devils. And Simon He surnamed Peter;" and so on, down to where it is said, "And he departed, and began to publish in Decapolis how great things Jesus had done: and all men did marvel." I am aware that I have spoken already of the names of the disciples when following the order of Matthew's narrative. Here, therefore, I repeat the caution, that no one should suppose Simon to have received the name Peter on this occasion for the first time, or fancy that Mark is here in any antagonism with John, who reports that disciple to have been addressed long before in these terms: "Thou shalt be called Cephas, which is, by interpretation, A stone." For John has there recorded the very words in which the Lord gave him that name. Mark, on the other hand, has introduced the matter in the form of a recapitulation in this passage, when he says, "And Simon He surnamed Peter." For, as it was his intention to enumerate the names of the twelve apostles here, and it was necessary for him thus to mention Peter, he decided briefly to intimate the fact that the said name was not borne by that disciple all along, but was given him by the Lord, not, however, at the time with which Mark was immediately dealing, but on the occasion in connection with which John has introduced the very words employed by the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 3"
