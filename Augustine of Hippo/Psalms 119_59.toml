[[commentary]]
quote='''
And as if he had been heard and aided by Him whom he prayed unto, “I thought,” he saith, “on mine own ways, and turned away my feet unto Thy testimonies” (ver. 59). That is, I turned them away from mine own ways, which displeased me, that they might follow Thy testimonies, and there might find a path. For most of the copies have not, “Because I thought,” as is read in some; but only, “I thought.” But what is here written, “and I turned away my feet:” some read, “Because I thought, Thou also hast turned away my feet:” that this may rather be ascribed to the grace of God, according to the Apostle’s words, “For it is God who worketh in us.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
