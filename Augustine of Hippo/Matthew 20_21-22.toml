[[commentary]]
quote='''
For those disciples, too, were of course seeking glory who wished to sit, one at His right hand and the other at His left: they thought only of the goal, and saw not by what way it must be reached; the Lord recalled them to the way, that they might come to their fatherland in due order. For the fatherland is on high, the way thither lies low. That land is the life of Christ, the way is Christ's death; that land is the habitation of Christ, the way is Christ's suffering. He that refuses the way, why seeks he the fatherland? In a word, to these also, while seeking elevation, He gave this answer: "Can ye drink the cup which I am about to drink?" Behold the way by which you must come to that height which you desire. The cup He made mention of was indeed that of His humility and suffering.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252028.html'
source_title="Tractates on John 28"
