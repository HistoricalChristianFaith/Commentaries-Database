[[commentary]]
quote='''
But even if there result not to me now the good things which I ask, I am secured nevertheless that hereafter they will come. For even in the case of transgressions a certain man is said to have asked of God, and not to have been hearkened to for his good. For privations of this world had inspired him to prayer, and being set in temporal tribulations he had wished that temporal tribulations should pass away, and there should return the flower of grass; and he saith, “My God, my God, why hast Thou forsaken me?” The very voice of Christ it is, but for His members’ sake. “The words,” he saith, “of my transgressions I have cried to Thee throughout the day, and Thou hast not hearkened: and by night, and not for the sake of folly to me:” that is, “and by night I have cried, and Thou hast not hearkened; and nevertheless in this very thing that Thou hast not hearkened, it is not for the sake of folly to me that Thou hast not hearkened, but rather for the sake of wisdom that Thou hast not hearkened, that I might perceive what of Thee I ought to ask. For those things I was asking which to my cost perchance I should have received.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252054.html'
source_title="Exposition on Psalm 54"
