[[commentary]]
quote='''
Nothing can be said to revive if it had not been previously alive.
'''
source_url=''
source_title="TO SIMPLICIAN ON VARIOUS QUESTIONS 1.4"

[[commentary]]
quote='''
When he says "I died," Paul means that he realized that he was already dead, because one who sees through the law what he should do but does not do it sins with transgression.
'''
source_url=''
source_title="QUESTIONS 66.5"

[[commentary]]
quote='''
When he says: But I once lived without the law, it must be understood: I seemed to myself to live, because before the commandment sin lay hidden. And when he says: But when the commandment came, sin revived, and I died, it must be understood: sin began to appear, and I recognized that I was dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
