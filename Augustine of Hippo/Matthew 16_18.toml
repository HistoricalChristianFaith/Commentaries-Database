[[commentary]]
quote='''
(de Cons. Ev. ii. 53.) But let none suppose that Peter received that name here; he received it at no other time than where John relates that it was said unto him, Thou shalt be called Cephas, which is interpreted, Peter. (John 1:42.)

(Retract. i. 21.) I have said in a certain place of the Apostle Peter, that it was on him, as on a rock, that the Church was built. But I know that since that I have often explained these words of the Lord, Thou art Peter, and on this rock will I build my Church, as meaning upon Him whom Peter had confessed in the words, Thou art Christ, the Son of the living God; and so that Peter, taking his name from this rock, would represent the Church, which is built upon this rock. For it is not said to him, Thou art the rock, but, Thou art Peter. (1 Cor. 10:4.) But the rock was Christ, whom because Simon thus confessed, as the whole Church confesses Him, he was named Peter. Let the reader choose whether of these two opinions seems to him the more probable.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
“On the Rock Thou hast exalted me.” Now therefore here we perceive who is crying from the ends of the earth. Let us call to mind the Gospel: “Upon this Rock I will build My Church.” Therefore She crieth from the ends of the earth, whom He hath willed to be builded upon a Rock. But in order that the Church might be builded upon the Rock, who was made the Rock? Hear Paul saying: “But the Rock was Christ.” On Him therefore builded we have been.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252061.html'
source_title="Exposition on Psalm 61"

[[commentary]]
quote='''
Neither is there anything contradictory here to that other passage where Matthew tells us how the Lord said to Peter, "Thou art Peter, and upon this rock will I build my Church." But we are not to understand that that was the time when he first received this name; but we are rather to suppose that this took place on the occasion when it was said to him, as John mentions, "Thou shall be called Cephas, which is, by interpretation, A stone." Thus the Lord could address him at that later period by this very name, when He said, "Thou art Peter." For He does not say then, "Thou shalt be called Peter," but, "Thou art Peter;" because on a previous occasion he had already been spoken to in this manner, "Thou shalt be called."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 17"

[[commentary]]
quote='''
I recollect having already stated that no one should suppose that Peter received that name for the first time on the occasion when He said to Him, "Thou art Peter, and upon this rock I will build my Church." For the time at which he did obtain this name was that referred to by John, when he mentions that he was addressed in these terms: "Thou shalt be called Cephas, which is, by interpretation, Peter." Hence, too, we are as little to think that Peter got this designation on the occasion to which Mark alludes, when he recounts the twelve apostles individually by name, and tells us how James and John were called the sons of thunder, merely on the ground that in that passage he has recorded the fact that He surnamed him Peter. For that circumstance is noticed there simply because it was suggested to the writer's recollection at that particular point, and not because it took place in actual fact at that specific time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 53"
