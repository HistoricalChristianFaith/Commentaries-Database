[[commentary]]
quote='''
“He that burst asunder the rock in the desert, and gave them water as in a great deep” (ver. 15); “and brought out water from the rock, and brought down waters like rivers” (ver. 16), is surely able upon thirsty faith to pour the gift of the Holy Spirit (the which gift the performance of that thing did spiritually signify), to pour, I say, from the Spiritual Rock that followed, which is Christ: who did stand and cry, “If any is athirst, let him come to Me:” and, “he that shall have drunk of the water which I shall give, rivers of living water shall flow out of his bosom.” For this He spake, as is read in the Gospel, to the Spirit, which they were to receive that believed in Him, unto whom like the rod drew near the wood of the Passion, in order that there might flow forth grace for believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
