[[commentary]]
quote='''
It is concerning conjugal chastity itself that the apostle treats, when he says, "Let him do what he will, he sinneth not if he marry;" and yet this too is God's gift, for the Scripture says, "It is by the Lord that the woman is joined to her husband." Accordingly the teacher of the Gentiles, in one of his discourses, commends both conjugal chastity, whereby adulteries are prevented, and the still more perfect continence which foregoes all cohabitation, and shows how both one and the other are severally the gift of God. Writing to the Corinthians, he admonished married persons not to defraud each other; and then, after his admonition to these, he added: "But I could wish that all men were even as I am myself,"—meaning, of course, that he abstained from all cohabitation; and then proceeded to say: "But every man hath his own gift of God, one after this manner, and another after that."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 8"
