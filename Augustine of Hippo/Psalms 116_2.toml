[[commentary]]
quote='''
But whence hath he hoped for this? Since, he saith, “He hath inclined His ear unto me: and in my days I have called upon Him” (ver. 2). I loved, therefore, because He will hear; He will hear, “because He hath inclined His ear unto me.” But whence knowest thou, O human soul, that God hath inclined His ear unto thee, except thou sayest, “I have believed”? These three things, therefore, “abide, faith, hope, charity:” because thou hast believed, thou hast hoped; because thou hast hoped, thou hast loved.…

And what are thy days, since thou hast said, “In my days I have called upon Him”? Are they those perchance, in which “the fulness of time came,” and “God sent His Son,” who had already said, “In an acceptable time have I heard thee, and in a day of salvation have I helped thee”?…I may rather call my days the days of my misery, the days of my mortality, the days according to Adam, full of toil and sweat, the days according to the ancient corruption. “For I lying, stuck fast in the deep mire,” in another Psalm also have cried out, “Behold, Thou hast made my days old;” in these days of mine have I called upon Thee. For my days are different from the days of my Lord. I call those my days, which by my own daring I have made for myself, whereby I have forsaken Him: and, since He reigneth everywhere, and is all-powerful, and holdeth all things, I have deserved prison; that is, I have received the darkness of ignorance, and the bonds of mortality.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520116.html'
source_title="Exposition on Psalm 116"
