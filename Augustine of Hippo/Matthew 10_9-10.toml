[[commentary]]
quote='''
(Serm. 46.) The Gospel therefore is not for sale, that it should be preached for reward. For if they so sell it, they sell a great thing for a small price. Let preachers then receive their necessary support from the people, and from God the reward of their employment. For the people do not give pay to those that minister to them in the love of the Gospel, but as it were a stipend that may support them to enable them to work.

(De Cons. Ev. ii. 30.) Otherwise; When the Lord said to the Apostles, Possess not gold, He added immediately, The labourer is worthy of his hire, to show why He would not have them possess and carry about these things; not that these things were not needed for the support of this life, but that He sent them in such a way as to show that these things were due to them from those to whom they preached the Gospel, as pay to soldiers. It is clear that this precept of the Lord does not at all imply that they ought not according to the Gospel to live by any other means, than by the contributions of those to whom they preached; otherwise Paul transgressed this precept when he lived by the labour of his own hands. But He gave the Apostles authority that these things were due to them from the house in which they abode. But when the Lord has issued a command, if it be not performed, it is the sin of disobedience; when He bestows a privilege, it is in any one's power not to use it, and as it were to refrain from claiming his right. The Lord then having sanctioned this maxim, that they who preach the Gospel should live of the Gospel, He spoke these things to the Apostles, that being confident they should not possess nor carry about with them the necessaries of life, neither things great nor things small. Therefore He adds, Nor a staff, to show that from His people all things are due to His ministers, and they require no superfluities. This authority He signifies by the staff, saying in Mark, Take nothing but a staff only. (Mark 6:18.) And when He forbids them (in Matthew) to take with them shoes, He forbids that carefulness and thought which would be anxious to carry them lest they should be wanting. Thus also we must understand concerning the two coats, that none should think it necessary to carry another besides that which he wore, supposing that he should have need of it; for it would be in his power to obtain one by this authority which the Lord gave. Further that we read in Mark that they should be shod with sandals, seems to imply that this kind of shoe has a mystic meaning in it, that the foot should neither be covered above, nor yet bare beneath, that is, that the Gospel should not be hid, nor yet rest itself on earthly advantage. Also when He forbids them to carry two coats, He warned them not to walk deceitfully, but in simplicity. So we cannot doubt that all these things were said by the Lord, partly in a direct, partly in a figurative sense; and that of the two Evangelists one inserted some things, the other other things, in his narrative. If any one should think that the Lord could not in one speech speak some things in a direct, and some things in a mystic sense, let him look at any other of His sayings, and he will see how hasty and unlearned his opinion is. When the Lord commands that the left hand should not know what the right hand doeth, does he think that almsgiving, and the rest of His precepts in that place are to be taken figuratively?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Another question which it is also usual to put is this: How comes it that Matthew and Luke have stated that the Lord said to His disciples that they were not to take a staff with them, whereas Mark puts the matter in this way: "And He commanded them that they should take nothing for their journey, save a staff only;" and proceeds further in this strain, "no scrip, no bread, no money in their purse:" thereby making it quite evident that his narrative belongs to the same place and circumstances with which the narratives of those others deal who have mentioned that the staff was not to be taken? Now this question admits of being solved on the principle of understanding that the staff which, according to Mark, was to be taken, bears one sense, and that the staff which, according to Matthew and Luke, was not to be taken with them, is to be interpreted in a different sense; just in the same way as we find the term "temptation" used in one meaning, when it is said, "God tempteth no man," and in a different meaning where it is said, "The Lord your God tempteth [proveth] you, to know whether ye love Him." For in the former case the temptation of seduction is intended; but in the latter the temptation of probation. Another parallel occurs in the case of the term "judgment," which must be taken in one way, where it is said, "They that have done good unto the resurrection of life, and they that have done evil unto the resurrection of judgment;" and in another way, where it is said, "Judge me, O God, and discern my cause, in respect of an ungodly nation." For the former refers to the judgment of damnation, and the latter to the judgment of discrimination.

And there are many other words which do not retain one uniform signification, but are introduced so as to suit a variety of connections, and thus are understood in a variety of ways, and sometimes, indeed, are adopted along with an explanation. We have an example in the saying, "Be not children in understanding; howbeit in malice be ye little children, that in understanding ye may be perfect." For here is a sentence which, in a brief and pregnant form, might have been expressed thus: "Be ye not children; howbeit be ye children." The same is the case with the words, "If any man among you thinketh himself to be wise in this world, let him become a fool that he may be wise." For what else is the statement there but this: "Let him not be wise, that he may be wise"? Moreover, the sentences are sometimes so put as to exercise the judgment of the inquirer. An instance of this kind occurs in what is said in the Epistle to the Galatians: "Bear ye one another's burdens, and so ye will fulfil the law of Christ. For if a man thinketh himself to be something, when he is nothing, he deceiveth himself. But it is meet that every man should prove his own work; and then shall he have rejoicing in himself, and not in another. For every man shall bear his own burden." Now, unless the word "burden" can be taken in different senses, without doubt one would suppose that the same writer contradicts himself in what he says here, and that, too, when the words are placed in such close neighbourhood in one paragraph. For when he has just said, "One shall bear another's burdens," after the lapse of a very brief interval he says, "Every man shall bear his own burden." But the one refers to the burdens which are to be borne in sharing in one's infirmity, the other to the burdens borne in the rendering of an account of our own actions to God: the former are burdens to be borne in our [duties of] fellowship with brethren; the latter are those peculiar to ourselves, and borne by every man for himself. And in the same way, once more, the "rod" of which the apostle spoke in the words, "Shall I come unto you with a rod?" is meant in a spiritual sense; while the same term bears the literal meaning when it occurs of the rod applied to a horse, or used for some other purpose of the kind, not to mention, in the meantime, also other metaphorical significations of this phrase.

Both these counsels, therefore, must be accepted as having been spoken by the Lord to the apostles; namely, at once that they should not take a staff, and that they should take nothing save a staff only. For when He said to them, according to Matthew, "Provide neither gold nor silver, nor money in your purses, nor scrip for your journey, neither two coats, neither shoes, nor yet a staff," He added immediately, "for the workman is worthy of his meat." And by this He makes it sufficiently obvious why it is that He would have them provide and carry none of these things. He shows that His reason was, not that these things are not necessary for the sustenance of this life, but because He was sending them in such a manner as to declare plainly that these things were due to them by those very persons who were to hear believingly the gospel preached by them; just as wages are the soldier's due, and as the fruit of the vine is the right of the planters, and the milk of the flock the right of the shepherds. For which reason Paul also speaks in this wise: "Who goeth a warfare any time at his own charges? who planteth a vineyard, and eateth not of the fruit thereof? who feedeth a flock, and eateth not of the milk of the flock?" For under these figures he was speaking of those things which are necessary to the preachers of the gospel. And so, a little further on, he says: "If we have sown unto you spiritual things, is it a great thing if we shall reap your carnal things? If others are partakers of this power over you, are not we rather? Nevertheless we have not used this power." This makes it apparent that by these instructions the Lord did not mean that the evangelists should not seek their support in any other way than by depending on what was offered them by those to whom they preached the gospel (otherwise this very apostle acted contrary to this precept when he acquired a livelihood for himself by the labours of his own hands, because he would not be chargeable to any of them), but that He gave them a power in the exercise of which they should know such things to be their due. Now, when any commandment is given by the Lord, there is the guilt of non-obedience if it is not observed; but when any power is given, any one is at liberty to abstain from its use, and, as it were, to recede from his right. Accordingly, when the Lord spake these things to the disciples, He did what that apostle expounds more clearly a little further on, when he says, "Do ye not know that they who minister in the temple live of the things of the temple? and they which wait at the altar are partakers with the altar? Even so hath the Lord ordained, that they which preach the gospel should live of the gospel. But I have used none of these things." When he says, therefore, that the Lord ordained it thus, but that he did not use the ordinance, he certainly indicates that it was a power to use that was given him, and not a necessity of service that was imposed upon him.

Accordingly, as our Lord ordained what the apostle declares Him to have ordained,—namely, that those who preach the gospel should live of the gospel,—He gave these counsels to the apostles in order that they might be without the care of providing or of carrying with them things necessary for this life, whether great or the very smallest; consequently He introduced this term, "neither a staff," with the view of showing that, on the part of those who were faithful to Him, all things were due to His ministers, who themselves, too, required nothing superfluous. And thus, when He added the words, "For the workman is worthy of his meat," He indicated quite clearly, and made it thoroughly plain, how and for what reason it was that He spake all these things. It is this kind of power, therefore, that the Lord denoted under the term "staff," when He said that they should "take nothing" for their journey, save a staff only. For the sentence might also have been briefly expressed in this way: "Take with you none of the necessaries of life, neither a staff, save a staff only." So that the phrase "neither a staff" may be taken to be equivalent to "not even the smallest things;" while the addition, "save a staff only," may be understood to mean that, in virtue of that power which they received from the Lord, and which was signified by the name "staff" [or, "rod"], even those things which were not carried with them would not be wanting to them. Our Lord therefore used both phrases. But inasmuch as one and the same evangelist has not recorded them both, the writer who has told us that the rod, as introduced in the one sense, was to be taken, is supposed to be in antagonism to him who has told us that the rod, as occurring again in the other sense, was not to be taken. After this explanation of the matter, however, no such supposition ought to be entertained.

In like manner, also, when Matthew tells us that the shoes were not to be carried with them on the journey, what is intended is the checking of that care which thinks that such things must be carried with them, because otherwise they might be unprovided. Thus, too, the import of what is said regarding the two coats is, that none of them should think of taking with him another coat in addition to the one in which he was clad, as if he was afraid that he might come to be in want, while all the time the power (which was received from the Lord) made him sure of getting what was needful. To the same effect, when Mark says that they were to be shod with sandals or soles, he gives us to understand that this matter of the shoe has some sort of mystical significance, the point being that the foot is to be neither covered, nor yet left bare to the ground; by which the idea may be conveyed that the gospel was neither to be concealed, nor yet made to depend on the good things of earth. And as to the fact that what is forbidden is neither the carrying nor the possessing of two coats, but more distinctly the putting of them on,—the words being, "and not put on two coats,"—what counsel is conveyed to them therein but this, that they ought to walk not in duplicity, but in simplicity?

Thus it is not by any means to be made a matter of doubt that the Lord Himself spake all these words, some of them with a literal import, and others of them with a figurative, although the evangelists may have introduced them only in part into their writings,—one inserting one section, and another giving a different portion. Certain passages, at the same time, have been recorded in identical terms either by some two of them, or by some three, or even by all the four together. And yet not even when this is the case can we take it for granted that everything has been committed to writing which was either uttered or done by Him. Moreover, if any one fancies that the Lord could not in the course of the same discourse have used some expressions with a figurative application and others with a literal, let him but examine His other addresses, and he will see how rash and inconsiderate such a notion is. For, then (to mention but a single instance which occurs meantime to my mind), when Christ gives the counsel not to let the left hand know what the right hand doeth, he may suppose himself under the necessity of accepting in the same figurative sense at once the almsgivings themselves referred to, and the other instructions offered on that occasion.
'''
