[[commentary]]
quote='''
(de Con. Evan. lib. ii. c. 40.) For in order to relate this, Luke has made a variation from Matthew, at that place where both had mentioned what our Lord said concerning the sign of Jonah, and the queen of the south, and the unclean spirit; after which discourse Matthew says, While he yet talked to the people, behold his mother and his brethren stood without desiring to speak to him; but Luke having also in that discourse of our Lord related some of our Lord's sayings which Matthew omitted, now departs from the order which he had hitherto kept with Matthew.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But on the conclusion of this discourse Luke proceeds to another subject, as to which it is uncertain whether, in the account which he gives of it, he has kept by the order of actual occurrence. For he connects it in this way: "And as He spake, a certain Pharisee besought Him to dine with him." He does not say, however, "as He spake these words," but only "as He spake." For if he had said, "as He spake these words," the expression would of course have compelled us to suppose that the incidents referred to, besides being recorded by him in this order, also took place on the Lord's part in that same order.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 39"
