[[commentary]]
quote='''
But observe holy men, who are like the Angels. When thou hast found some holy man who serveth God, if thou wish to worship him instead of God, he forbiddeth thee: he will not arrogate to himself the honour due to God, he will not be unto thee as God, but be with thee under God. Thus did the holy Apostles Paul and Barnabas. They preached the word of God in Lycaonia. When they had performed wonderful works in Lycaonia, the people of that country brought victims, and wished to sacrifice to them, calling Barnabas Jupiter, and Paul Mercury: they were not pleased. Did they perchance refuse to be sacrificed to, because they abhorred to be compared to devils? No, but because they shuddered at divine honour being paid to men. Their own words show this: it is no guess of ours; for the text of the book goeth on to say how they were moved.…Just then, as good men forbade those who had wished to worship them as gods, and wish rather that God alone be worshipped, God alone be adored, to God alone sacrifice be offered, not to themselves; so also all the holy Angels seek His glory whom they love; endeavour to impel and to excite to the contemplation of Him all whom they love: Him they declare to them, not themselves, since they are angels; and because they are soldiers, they study only how to seek the glory of their Captain; but if they have sought their own glory, they are condemned as usurpers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
