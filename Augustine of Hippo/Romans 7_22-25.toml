[[commentary]]
quote='''
Hence, from the fact that some infirmity remains, I venture to say that, in what measure we serve God, we are free; in what measure we serve the law of sin, we are still in bondage. Hence says the apostle, what we began to say, "I delight in the law of God after the inward man. " Here then it is, wherein we are free, wherein we delight in the law of God; for liberty has joy. For as long as it is from fear that thou doest what is right, God is no delight to thee. Find thy delight in Him, and thou art free. Fear not punishment, but love righteousness. Art thou not yet able to love righteousness? Fear even punishment, that thou mayest attain to the love of righteousness.

In the measure then spoken of above, he felt himself to be already free, and therefore said, "I delight in the law of God after the inward man." I delight in the law, I delight in its requirements, I delight in righteousness itself. "But I see another law in my members"-this infirmity which remains-"warring against the law of my mind, and bringing me into captivity to the law of sin, which is in my members." On this side he feels his captivity, where righteousness has not been perfected; for where he delights in the law of God, he is not the captive but the friend of the law; and therefore free, because a friend. What then is to be done with that which so remains? What, but to look to Him who has said, "If the Son shall make you free, then shall ye be free indeed"? Indeed he also who thus spake so looked to Him: "O wretched man that I am," he says, "who shall deliver me from the body of this death? I thank God, through Jesus Christ our Lord." Therefore "if the Son shall make you free, ye shall be free indeed." And then he concluded thus: "So then, with the mind I myself serve the law of God; but with the flesh the law of sin." I myself, he says; for there are not two of us contrary to each other, coming from different origins; but "with the mind I myself serve the law of God, and with the flesh the law of sin," so long as languor struggles against salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252041.html'
source_title="Tractates on John 41"
[[commentary]]
quote='''
The Spirit calls upward, the weight of the flesh calls back again downward: between the double effort to raise and to weigh down, a kind of struggle ensues: this struggle goes toward the pressure of the winepress. Hear how the Apostle describes this same struggle of the winepress, for he was himself afflicted there, there he was pressed.…“Miserable man that I am: who shall deliver me from the body of this death? The grace of God through Jesus Christ our Lord.”…“For I delight in the Law of God according to the inner man.” But what shall I do? how shall I fly? how shall I arrive thither? “I see another law in my members,” etc.…And as in the words of the Apostle, that difficulty and that almost inextricable struggle is alleviated by the addition, “The grace of God through Jesus Christ our Lord;” so here, when he sighed in the ardent longing for the house of God, and those praises of God, and when a kind of despair arose at the feeling of the burden of the body and the weight of the flesh, again he awoke to hope, and said (ver. 5), “Blessed is the man whose taking up is in Thee.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"
