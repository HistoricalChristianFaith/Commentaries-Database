[[commentary]]
quote='''
But what are we to say of the hireling? He is not mentioned here among the good. "The good Shepherd," He says, "giveth His life for the sheep. But he that is an hireling, and not the Shepherd, whose own the sheep are not, seeth the wolf coming, and leaveth the sheep, and fleeth; and the wolf catcheth them, and scattereth the sheep." The hireling does not here bear a good character, and yet in some respects is useful; nor would he be called an hireling, did he not receive hire from his employer. Who then is this hireling, that is both blameworthy and needful? And here, brethren, let the Lord Himself give us light, that we may know who the hirelings are, and be not hirelings ourselves. Who then is the hireling? There are some in office in the church, of whom the Apostle Paul saith, "Who seek their own, not the things that are Jesus Christ's." What means that, "Who seek their own"? Who do not love Christ freely, who do not seek after God for His own sake; who are pursuing after temporal advantages, gaping for gain, coveting honors from men. When such things are loved by an overseer, and for such things God is served, whoever such an one may be, he is an hireling who cannot count himself among the children. For of such also the Lord saith: "Verily, I say unto you, they have their reward." Listen to what the Apostle Paul says of St. Timothy: "But I trust in the Lord Jesus to send Timothy shortly unto you, that I also may be of good comfort, when I know your circumstances; for I have no man like-minded, who will naturally care for you. For all seek their own, not the things which are Jesus Christ's." The shepherd mourned in the midst of hirelings. He sought some one who sincerely loved the flock of Christ, and round about him, amongst those who were with him at that time, he found not one. Not that there was no one then in the Church of Christ but the Apostle Paul and Timothy, who had a brother's concern for the flock; but it so happened at the time of his sending Timothy, that he had none else of his sons about him; only hirelings were with him, "who sought their own, not the things which are Jesus Christ's." And yet he himself, with a brother's anxiety for the flock, preferred sending his son, and remaining himself amongst hirelings. Hirelings are also found among ourselves, but the Lord alone distinguisheth them. He that searcheth the heart, distinguisheth them; and yet sometimes we know them ourselves. For it was not without a purpose that the Lord Himself said also of the wolves: "By their fruits ye shall know them." Temptations put many to the question, and then their thoughts are made manifest; but many remain undiscovered. The Lord's fold must have as overseers, both those who are children and those who are hirelings. But the overseers, who are sons, are the shepherds. If they are shepherds, how is there but one Shepherd, save that all of them are members of the one Shepherd, to whom the sheep belong? For they are also members of Himself as the one sheep; because "as a sheep he was led to the slaughter."

But give heed to the fact that even the hirelings are needful. For many indeed in the Church are following after earthly profit, and yet preach Christ, and through them is heard the voice of Christ; and the sheep follow, not the hireling, but the Shepherd's voice speaking through the hireling. Hearken to the hirelings as pointed out by the Lord Himself: "The scribes," He saith, "and the Pharisees sit in Moses' seat: do what they say; but do not what they do." What else said He but, Listen to the Shepherd's voice speaking through the hirelings? For sitting in Moses' seat, they teach the law of God; therefore God teacheth by them. But if they wish to teach their own things, hear them not, do them not. For certainly such seek their own, not the things which are Jesus Christ's; but no hireling has dared to say to Christ's people, Seek your own, not the things which are Jesus Christ's. For his own evil conduct he does not preach from the seat of Christ: he does injury by the evil that he does, not by the good that he says. Pluck the grapes, beware of the thorn. It is well I see that you have understood; but for the sake of those that are slower, I shall repeat these words with greater plainness. How said I, Pluck the bunch of grapes, beware of the thorn; when the Lord saith, "Do men gather grapes of thorns, or figs of thistles"? That is quite true: and yet what I said is also true, Pluck the bunch of grapes, beware of the thorn. For sometimes the grape-cluster, springing from the root of the vine, finds its support in a common hedge; its branch, grows, becomes embedded among thorns, and the thorn bears other fruit than its own. For the thorn has not been produced from the vine, but has become the resting-place of its runner. Make thine inquiries only at the roots. Seek for the thorn-root, thou wilt find it apart from the vine: seek the origin of the grape, and from the root of the vine it will be found to have sprung. And so, Moses' seat was the vine; the morals of the Pharisees were the thorns. Sound doctrine cometh through the wicked, as the vine-branch in a hedge, a bunch of grapes among thorns. Gather carefully, so as in seeking the fruit not to tear thine hand; and while thou art to hear one speaking what is good, imitate him not when doing what is evil. "What they tell you, do,"-gather the grapes; "but what they do, do not,"-beware of the thorns. Even through hirelings listen to the voice of the Shepherd, but be not hirelings yourselves, seeing ye are members of the Shepherd. Yea, Paul himself, the holy apostle who said, "I have no one who hath a brother's concern about you; for all seek their own, not the things which are Jesus Christ's," draws a distinction in another place between hirelings and sons; and see what he saith: "Some preach Christ even of envy and strife, and some also of good will: some of love, knowing that I am set for the defence of the gospel; but some also preach Christ of contention, not sincerely, supposing to add affliction to my bonds." These were hirelings who disliked the Apostle Paul. And why such dislike, but just because they were seeking after temporal things? But mark what he adds: "What then, notwithstanding, every way, whether in pretence or in truth, Christ is preached: and I therein do rejoice, yea, and will rejoice." Christ is the truth: let the truth be preached in pretense by hirelings, let it be preached in truth by the children: the children are waiting patiently for the eternal inheritance of the Father, the hirelings are longing for, and in a hurry to get, the temporal pay of their employer. For my part let me be shorn of the human glory, which I see such an object of envy to hirelings: and yet by the tongues both of hirelings and of children let the divine glory of Christ be published abroad, seeing that, "whether in pretense or in truth, Christ is preached."
'''
