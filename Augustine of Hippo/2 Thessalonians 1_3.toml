[[commentary]]
quote='''
Whence the Apostle Paul pronounces in the Thessalonians this benediction: "The Lord make you to increase and abound in love one toward another, and toward all men." This benediction to love one another He gave us, who had also given us a law that we should love each other. Then, in another passage addressed to the same church, seeing that there now existed in some of its members the disposition which he had wished them to cultivate, he says, "We are bound to thank God always for you, brethren, as it is meet, because that your faith groweth exceedingly, and the charity of every one of you all toward each other aboundeth." This he said lest they should make a boast of the great good which they were enjoying from God, as if they had it of their own mere selves. Because, then, your faith has so great a growth (this is the purport of his words), and the love of every one of you all toward each other so greatly abounds, we ought to thank God concerning you, but not to praise you, as if you possessed these gifts of yourselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 38"
