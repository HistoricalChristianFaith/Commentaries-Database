[[commentary]]
quote='''
“Serve the Lord with fear;” lest what is said, “Ye kings and judges of the earth,” turn into pride: “And rejoice with trembling” (ver. 11). Very excellently is “rejoice” added, lest “serve the Lord with fear” should seem to tend to misery. But again, lest this same rejoicing should run on to unrestrained inconsiderateness, there is added “with trembling,” that it might avail for a warning, and for the careful guarding of holiness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25202.html'
source_title="Exposition on Psalm 2"


[[commentary]]
quote='''
He admonisheth, moreover, by such an example, that no one ought to lift himself up in prosperous circumstances. For many fear adverse circumstances, fear not prosperous circumstances. Prosperity is more perilous to soul than adversity to body. First, prosperity doth corrupt, in order that adversity may find something to break. My brethren, stricter watch must be kept against felicity. Wherefore, see ye after what manner the saying of God amid our own felicity doth take from us security: “Serve ye,” He saith, “the Lord in fear, and exult unto Him with trembling.” In exultation, in order that we may render thanks; in trembling, lest we fall.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"