[[commentary]]
quote='''
"They cursed him, and said, Thou art his disciple." Such a malediction be upon us, and upon our children! For a malediction it is, if thou layest open their heart, not if thou ponderest the words. "But we are Moses' disciples. We know that God spake unto Moses: as for this fellow, we know not from whence he is." Would ye had known that "God spake to Moses!" ye would have also known that God preached by Moses. For ye have the Lord saying, "Had ye believed Moses, ye would have also believed me; for he wrote of me." Is it thus ye follow the servant, and turn your back against the Lord? But not even the servant do ye follow; for by him ye would be guided to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252044.html'
source_title="Tractates on John 44"
