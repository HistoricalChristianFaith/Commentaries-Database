[[commentary]]
quote='''
“For better is Thy mercy than lives.” Many are the lives of men, but one life God promiseth: and He giveth not this to us as if for our merits but for His mercy.…For what is so just a thing as that a sinner should be punished? Though a just thing it be that a sinner should be punished, it hath belonged to the mercy of Him not to punish a sinner but to justify him, and of a sinner to make a just man, and of an ungodly man to make a godly man. Therefore “His mercy is better than lives.” What lives? Those which for themselves men have chosen. One hath chosen for himself a life of business, another a country life, another a life of usury, another a military life; one this, another that. Divers are the lives, but “better is Thy” life “than” our “lives.”…“My lips shall praise Thee.” My lips would not praise Thee, unless before me were to go Thy mercy. By Thy gift Thee I praise, through Thy mercy Thee I praise. For I should not be able to praise God, unless He gave me to be able to praise Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
