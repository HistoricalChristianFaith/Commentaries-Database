[[commentary]]
quote='''
According to the form of God, all things that the Father hath are His, and "All mine," He says, "are Thine, and Thine are mine;" according to the form of a servant, the doctrine is not His own, but His that sent Him. Again, "Of that day and that hour knoweth no man, no, not the angels which are in heaven; neither the Son, but the Father." For He is ignorant of this, as making others ignorant; that is, in that He did not so know as at that time to show His disciples: as it was said to Abraham, "Now I know that thou fearest God," that is, now I have caused thee to know it; because he himself, being tried in that temptation, became known to himself.… He was "ignorant," therefore, among them of that which they were not able to know from him. And that only he said that he knew, which it was fitting that they should know from him. In short, he knew among the perfect what he knew not among babes; for he there says: "We speak wisdom among them that are perfect." For a man is said not to know what he hides, after that kind of speech, after which a ditch is called blind which is hidden. For the Scriptures do not use any other kind of speech than may be found in use among men, because they speak to men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520The%2520Trinity%2FBook%25201.html'
source_title="ON THE TRINITY 1.12.23"

[[commentary]]
quote='''
I am by no means of the opinion that a figurative mode of expression can be rightly termed a falsehood. For it is no falsehood to call a day joyous because it makes people joyous. A lupine seed is not sad because it lengthens the face of the eater because of its bitter taste. So also we say that God "knows" something when he makes his hearers know it (an instance quoted by yourself in the words of God to Abraham, "Now I know that you fear God"). These are by no means false statements, as you yourself readily see. Accordingly, the blessed Hilary threw light on an obscure point by this kind of figurative expression, showing how we ought to understand the words that "he did not know the day," with no other meaning than this: In proportion as he had made others ignorant by concealing his meaning, he spoke of it figuratively as his own lack of knowledge. So by concealing it, he so to speak caused others not to know it. He did not by this explanation condone lying, but he proved that it was not lying to use the common figures, including metaphors, as a form of speech available to all, a mode of expression entirely familiar to all in daily conversation. Would anyone call it a lie to say that vines are jeweled with buds, or that a grainfield waves, or that a young man is in the flower of his youth, because he sees in these objects neither waves nor precious stones, nor grass, nor trees to which these expressions would literally apply?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 180, TO OCEANUS 3"

[[commentary]]
quote='''
“Of the eighth,” seems here obscure. For the rest of this title is more clear. Now it has seemed to some to intimate the day of judgment, that is, the time of the coming of our Lord, when He will come to judge the quick and dead. Which coming, it is believed, is to be, after reckoning the years from Adam, seven thousand years: so as that seven thousand years should pass as seven days, and afterwards that time arrive as it were the eighth day. But since it has been said by the Lord, “It is not yours to know the times, which the Father hath put in His own power:” and, “But of the day and that hour knoweth no man, no, neither angel, nor Power, neither the Son, but the Father alone:” and again, that which is written, “that the day of the Lord cometh as a thief,” shows clearly enough that no man should arrogate to himself the knowledge of that time, by any computation of years. For if that day is to come after seven thousand years, every man could learn its advent by reckoning the years. What comes then of the Son’s even not knowing this? Which of course is said with this meaning, that men do not learn this by the Son, not that He by Himself doth not know it: according to that form of speech, “the Lord your God trieth you that He may know;” that is, that He may make you know: and, “arise, O Lord;” that is, make us arise. When therefore the Son is thus said not to know this day; not because He knoweth it not, but because He causeth those to know it not, for whom it is not expedient to know it, that is, He doth not show it to them; what does that strange presumption mean, which, by a reckoning up of years, expects the day of the Lord as most certain after seven thousand years?

Be we then willingly ignorant of that which the Lord would not have us know: and let us inquire what this title, “of the eighth,” means.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25206.html'
source_title="Exposition on Psalm 6"

[[commentary]]
quote='''
Indeed, the very day of the Lord’s advent may be rightly numbered among the hidden things of the Son, although the very presence of the Lord itself will be manifest. For of that day it is said, that no man knoweth it, neither angels, nor powers, nor the Son of man. What then so hidden, as that which is said to be hidden even to the Judge Himself, not as regards knowledge, but disclosure?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252010.html'
source_title="Exposition on Psalm 10"

[[commentary]]
quote='''
With terror do they hear of the coming of the last day, who will not be secure by living well: and who fain would live ill, long. But it was for useful purposes that God willed that day to remain unknown; that the heart may be ever ready to expect that of which it knows it is to come, but knows not when it is to come. Seeing, however, that our Lord Jesus Christ was sent to us to be our “Master,” He said, that “of the day not even the Son of Man knew,” because it was not part of His office as our Master that through Him it should become known to us. For indeed the Father knoweth nothing that the Son knoweth not; since that is the Very Knowledge of the Father Itself, which is His Wisdom; now His Son, His Word, is “His Wisdom.” But because it was not for our good to know that, which however was known to Him who came indeed to teach us, though not to teach us that which it was not good for us to know, He not only, as a Master, taught us something, but also, as a Master, left something untaught. For, as a Master, He knew how both to teach us what was good for us, and not to teach us what was injurious. Now thus, according to a certain form of speech, the Son is said not to know what He does not teach: that is, in the same way that we are daily in the habit of speaking, He is said not to know what He causes us not to know.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"
