[[commentary]]
quote='''
(De Cons. Ev. ii. 4.) Or, one of Christ's forefathers is counted twice, because in him, Jeconiah to wit, there was made a passing off to strange nations since he was carried to Babylon. Wherever a series turns out of the right line to go in any other direction there is an angle made, and that part that is in the angle is reckoned twice. Thus here is a figure of Christ, who passes from the circumcision to the uncircumcision, and is made a cornerstone.

(ubi sup.) After having divided the whole into three periods of fourteen generations, he does not sum them all up and say, The sum of the whole is forty and two; because one of those fathers, that is Jeconiah, is reckoned twice; so that they do not amount to forty-two, as three times fourteen does, but because one is reckoned twice over, there are only forty-one generations. Matthew therefore, whose purpose was to draw out Christ's kingly character, counts forty successions in the genealogy exclusive of Christ. This number denotes the time for which we must be governed by Christ in this world, according to that painful discipline which is signified by the iron rod of which it is written in the Psalms, Thou shall rule them with a rod of iron. That this number should denote this our temporal life, a reason offers at hand, in this, that the seasons of the year are four, and that the world itself is bounded by four sides, the east, and west, the north, and the south. But forty contains ten four times. Moreover, ten itself is made up by a number proceeding from one to four.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The matter next to be introduced, moreover, is one requiring, in order to its right apprehension and contemplation, a reader of the greatest attention and carefulness. For it has been acutely observed that Matthew, who had proposed to himself the task of commending the kingly character in Christ, named, exclusive of Christ Himself, forty men in the series of generations. Now this number denotes the period in which, in this age and on this earth, it behoves us to be ruled by Christ in accordance with that painful discipline whereby "God scourgeth," as it is written, "every son that He receiveth;" and of which also an apostle says that "we must through much tribulation enter into the kingdom of God." This discipline is also signified by that rod of iron, concerning which we read this statement in a Psalm: "Thou shalt rule them with a rod of iron;" which words occur after the saying, "Yet I am set king by Him upon His holy hill of Zion!" For the good, too, are ruled with a rod of iron, as it is said of them: "The time is come that judgment should begin at the house of God; and if it first begin at us, what shall the end be to them that obey not the gospel of God? and if the righteous scarcely be saved, where shall the ungodly and the sinner appear?" To the same persons the sentence that follows also applies: "Thou shall dash them in pieces like a potter's vessel." For the good, indeed, are ruled by this discipline, while the wicked are crushed by it. And these two different classes of persons are mentioned here as if they were the same, on account of the identity of the signs employed in reference to the wicked in common with the good.

That this number, then, is a sign of that laborious period in which, under the discipline of Christ the King, we have to fight against the devil, is also indicated by the fact that both the law and the prophets solemnized a fast of forty days,—that is to say, a humbling of the soul,—in the person of Moses and Elias, who fasted each for a space of forty days. And what else does the Gospel narrative shadow forth under the fast of the Lord Himself, during which forty days He was also tempted of the devil, than that condition of temptation which appertains to us through all the space of this age, and which He bore in the flesh which He condescended to take to Himself from our mortality? After the resurrection also, it was His will to remain with His disciples on the earth not longer than forty days, continuing to mingle for that space of time with this life of theirs in the way of human intercourse, and partaking along with them of the food needful for mortal men, although He Himself was to die no more; and all this was done with the view of signifying to them through these forty days, that although His presence should be hidden from their eyes, He would yet fulfil what He promised when He said, "Lo, I am with you, even to the end of the world." And in explanation of the circumstance that this particular number should denote this temporal and earthly life, what suggests itself most immediately in the meantime, although there may be another and subtler method of accounting for it, is the consideration that the seasons of the years also revolve in four successive alternations, and that the world itself has its bounds determined by four divisions, which Scripture sometimes designates by the names of the winds,—East and West, Aquilo [or North] and Meridian [or South]. But the number forty is equivalent to four times ten. Furthermore, the number ten itself is made up by adding the several numbers in succession from one up to four together.

In this way, then, as Matthew undertook the task of presenting the record of Christ as the King who came into this world, and into this earthly and mortal life of men, for the purpose of exercising rule over us who have to struggle with temptation, he began with Abraham, and enumerated forty men. For Christ came in the flesh from that very nation of the Hebrews with a view to the keeping of which as a people distinct from the other nations, God separated Abraham from his own country and his own kindred. And the circumstance that the promise contained an intimation of the race from which He was destined to come, served very specially to make the prediction and announcement concerning Him something all the clearer. Thus the evangelist did indeed mark out fourteen generations in each of three several members, stating that from Abraham until David there were fourteen generations, and from David until the carrying away into Babylon other fourteen generations, and another fourteen from that period on to the nativity of Christ. But he did not then reckon them all up in one sum, counting them one by one, and saying that thus they make up forty-two in all. For among these progenitors there is one who is enumerated twice, namely Jechonias, with whom a kind of deflection was made in the direction of extraneous nations at the time when the transmigration into Babylon took place. When the enumeration, moreover, is thus bent from the direct order of progression, and is made to form, if we may so say, a kind of corner for the purpose of taking a different course, what meets us at that corner is mentioned twice over,—namely, at the close of the preceding series, and at the head of the deflection specified. And this, too, was a figure of Christ as the one who was, in a certain sense, to pass from the circumcision to the uncircumcision, or, so to speak, from Jerusalem to Babylon, and to be, as it were, the corner-stone to all who believe on Him, whether on the one side or on the other. Thus was God making preparations then in a figurative manner for things which were to come in truth. For Jechonias himself, with whose name the kind of corner which I have in view was prefigured, is by interpretation the "preparation of God." In this way, therefore, there are really not forty-two distinct generations named here, which would be the proper sum of three times fourteen; but, as there is a double enumeration of one of the names, we have here forty generations in all, taking into account the fact that Christ Himself is reckoned in the number, who, like the kingly president over this [significant] number forty, superintends the administration of this temporal and earthly life of ours.
'''
