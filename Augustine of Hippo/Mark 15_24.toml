
[[commentary]]
quote='''
But we must not speak in a mere cursory way of the partition and dividing by lot of His garments. For although all the four evangelists make mention thereof, yet the others do so more briefly than John: and their notice of it is obscure, while his is in the plainest manner possible. For Matthew says, "And after they crucified Him, they parted His garments, casting lots." Mark: "And they crucified Him, and parted His garments, casting lots upon them, what every man should take." Luke: "And they parted His raiment, and cast lots." But John has told us also how many parts they made of His garments, namely, four, that they might take one part apiece. From which it, is apparent that there were four soldiers, who obeyed the governor's orders in crucifying Him. For he plainly says: "Then the soldiers, when they had crucified Him, took His garments, and made four parts, to every soldier a part; and likewise the coat," where there is understood, they took: so that the meaning is, they took His garments, and made four parts, to every soldier a part; and they took also His coat. And he so spake, that we might see that there was no lot cast on His other garments; but His coat, which they took along with the others, they did not similarly divide. For in regard to it he proceeds to explain, "Now the coat was without seam, woven from the top throughout." And then telling us why they cast lots on it, he says, "They said therefore among themselves, Let us not rend it, but cast lots for it, whose it shall be." Hence it is clear that in the case of the other garments they had equal parts, so that there was no need to cast lots: but that as regards this one, they could not have had a part each without rending it, and thereby possessing themselves only of useless fragments of it; to prevent which, they preferred letting it come to one of them by lot. The account given by this evangelist is also in harmony with the testimony of prophecy, which he likewise immediately subjoins, saying, "That the scripture might be fulfilled which saith, They parted my raiment among them, and for my vesture they did cast lots." For He says not, they cast lots, but "they parted:" nor does He say, casting lots they parted; but while making no mention whatever of the lot in regard to the rest of the garments, He afterwards said, "and for my vesture they did cast lots," in reference solely to the coat that remained. On which I shall speak as He Himself enables me, after I have first refuted the calumny, which may possibly arise, as if the evangelists disagreed with one another, by showing that the words of none of the others are inconsistent with the narrative of John.

For Matthew, in saying, "They parted His garments, casting lots," wished it to be understood, that in the whole affair of parting the garments, the coat was also included, on which they cast lots; for in course of parting all the garments, of which it also was one on it alone they cast lots. To the same purpose also are the words of Luke: "Parting His garments, they cast lots;" for in the process of parting they came to the coat whereon the lot was cast, that the entire parting of His garments among them might be completed. And what difference is there whether it is said, "Parting they cast lots," according to Luke; or, "They parted, casting the lot," according to Matthew: unless it be that Luke, in saying "lots," used the plural for the singular number,-a form of speech that is not unusual in the Holy Scriptures, although some copies are found to have "lot," and not "lots"? Mark, therefore, is the only one who seems to have introduced any kind of difficulty; for in saying, "Casting the lot upon them, what every man should take," his words seem to imply, as if the lot was cast on all the garments, and not on the coat alone. But here also brevity is the cause of the obscurity; for the words, "Casting the lot upon them," are as if it were said, Casting the lot when they were in the process of division; which was also the case. For the partition of all His garments would not have been complete, had it not been declared by lot which of them also should get possession of the coat, so as thereby to bring any contention on the part of the dividers to an end, or rather prevent any such from arising. In saying, therefore, "What every man should take," so far as that has to do with the lot, we must not take it as referring to all the garments that were divided; for the lot was cast, who should take the coat: whereof having omitted to describe the particular form, and how, in the equal division that was made of the parts, it remained by itself, in order, without being rent, to be awarded by lot, he therefore made use of the expression, "what every man should take," in other words, who it was that should take it: as if the whole were thus expressed, They parted His garments, casting the lot upon them, who should take the coat, which had remained over in addition to their equal shares of the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520118.html'
source_title="Tractates on John 118"
