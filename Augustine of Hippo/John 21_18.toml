[[commentary]]
quote='''
Whence then doth He so cry out, as though He were suffering something against His will, except because the Head doth prefigure the Members? For He suffered because He willed: but the Martyrs even though they willed not; for to Peter thus He foretold his passion: “When thou shalt be old,” He saith, “another shall gird thee, and lead thee whither thou wilt not.” For though we desire to cleave to Christ, yet we are unwilling to die: and therefore willingly or rather patiently we suffer, because no other passage is given us, through which we may cleave to Christ. For if we could in any other way arrive at Christ, that is, at life everlasting, who would be willing to die?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
