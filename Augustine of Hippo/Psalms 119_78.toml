[[commentary]]
quote='''
He then goeth on as follows: “Let the proud be confounded, for they have unrighteously practised iniquity against me: but I will be occupied in Thy commandments” (ver. 78). Behold, what he saith, the meditation of the law of God, or rather, his meditation the law of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
