[[commentary]]
quote='''
He next addeth: “I am Thine: O save me, for I have sought Thy righteousnesses” (ver. 94). We must not understand lightly the words, “I am Thine.” For what is not His? Why then is it that the Psalmist hath commended himself unto God somewhat in a more familiar sense, in these words, “I am Thine: O save me;” save because he wished it to be understood that he had desired to be his own only to his harm, which is the first and the greatest evil of disobedience? and as if he should say, I wished to be my own, and I lost myself: “I am Thine,” he saith, “O save me, for I have sought Thy righteousnesses;” not my own inclinations, whereby I was my own, but “Thy righteousnesses,” that I might now be Thine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
