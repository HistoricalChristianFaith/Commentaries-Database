[[commentary]]
quote='''
(Tr. xvii. c. 1) Judging on low and human notions of this miracle, it is not at all a striking display of power, and only a moderate one of goodness. Of so many, who lay sick, only one was healed; though, had He chosen, He could have restored them all by a single word. How must we account for this? By supposing that His power and goodness were asserted more for imparting a knowledge of eternal salvation to the soul, than working a temporal cure on the body. That which received the temporal cure was certain to decay at last, when death arrived: whereas the soul which believed passed into life eternal. The pool and the water seem to me to signify the Jewish people: for John in the Apocalypse obviously uses water to express people. (Rev. 17:15.)

(Tr. xvii. c. 2) The water then, i. e. the people, was enclosed within five porches, i. e. the five books of Moses. But those books only betrayed the impotent, and did not recover them; that is to say, the Law convicted the sinner, but did not absolve him.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
It ought not to be a matter of wonder that a miracle was wrought by God; the wonder would be if man had wrought it. Rather ought we to rejoice than wonder that our Lord and Saviour Jesus Christ was made man, than that He performed divine works among men. It is of greater importance to our salvation what He was made for men, than what He did among men: it is more important that He healed the faults of souls, than that He healed the weaknesses of mortal bodies. But as the soul knew not Him by whom it was to be healed, and had eyes in the flesh whereby to see corporeal deeds, but had not yet sound eyes in the heart with which to recognise Him as God concealed in the flesh, He wrought what the soul was able to see, in order to heal that by which it was not able to see.

He entered a place where lay a great multitude of sick folk-of blind, lame, withered; and being the physician both of souls and bodies, and having come to heal all the souls of them that should believe, of those sick folk He chose one for healing, thereby to signify unity. If in doing this we regard Him with a commonplace mind, with the mere human understanding and wit, as regards power it was not a great matter that He performed; and also as regards goodness He performed too little. There lay so many there, and yet only one was healed, whilst He could by a word have raised them all up. What, then, must we understand but that the power and the goodness was doing what souls might, by His deeds, understand for their everlasting salvation, than what bodies might gain for temporal health? For that which is the real health of bodies, and which is looked for from the Lord, will be at the end, in the resurrection of the dead. What shall live then shall no more die; what shall be healed shall no more be sick; what shall be satisfied shall no more hunger and thirst; what shall be made new shall not grow old. But at this time, however, the eyes of the blind, that were opened by those acts of our Lord and Saviour Jesus Christ, were again closed in death; and limbs of the paralytics that received strength were loosened again in death; and whatever was for a time made whole in mortal limbs came to nought in the end: but the soul that believed passed to eternal life. Accordingly, to the soul that should believe, whose sins He had come to forgive, to the healing of whose ailments He had humbled Himself, He gave a significant proof by the healing of this impotent man. Of the profound mystery of this thing and this proof, so far as the Lord deigns to grant us, while you are attentive and aiding our weakness by prayer, I will speak as I shall have ability. And whatever I am not able to do, that will be supplied to you by Him by whose help I do what I can.

Of this pool, which was surrounded with five porches, in which lay a great multitude of sick folk, I remember that I have very often treated; and most of you will with me recollect what I am about to say, rather than gain the knowledge of it for the first time. But it is by no means unprofitable to go back upon matters already known, that both they who know not may be instructed, and they who do know may be confirmed. Therefore, as being already known, these things must be touched upon briefly, not leisurely inculcated. That pool and that water seem to me to have signified the Jewish people. For that peoples are signified under the name of waters the Apocalypse of John clearly indicates to us, where, after he had been shown many waters, and he had asked what they were, was answered that they were peoples. That water, then-namely, that people-was shut in by the five books of Moses, as by five porches. But those books brought forth the sick, not healed them. For the law convicted, not acquitted sinners. Accordingly the letter, without grace, made men guilty, whom on confessing grace delivered. For this is what the apostle saith: "For if a law had been given which could have given life, verily righteousness should have been by the law." Why, then, was the law given? He goes on to say, "But the Scripture hath concluded all under sin, that the promise by faith of Jesus Christ might be given to them that believe." What more evident? Have not these words expounded to us both the five porches, and also the multitude of sick folk? The five porches are the law. Why did not the five porches heal the sick folk? Because, "if there had been a law given which could have given life, verily righteousness should have been by the law." Why, then, did the porches contain those whom they did not heal? Because "the Scripture hath concluded all under sin, that the promise by faith of Jesus Christ might be given to them that believe."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252017.html'
source_title="Tractates on John 17"
