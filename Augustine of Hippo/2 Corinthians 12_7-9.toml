[[commentary]]
quote='''
The Apostle Paul besought Him that He would take away the thorn in his flesh, and He would not. Was he disturbed? Was he filled with sadness, and did he speak of himself as deserted? Rather did he say that he was not deserted, because that was not taken away which he desired to be taken away, to the end that infirmity might be cured. For this he found in the voice of the Physician, "My grace is sufficient for thee; for my strength is made perfect in weakness." Whence knowest thou, then, that God does not wish to heal thee? As yet it is expedient for thee to be scourged. Whence knowest thou how diseased that is which the physician cuts, using his knife on the diseased parts? Does he not know the measure, what he is to do, and how far he is to do it? Does the shrieking of him he cuts restrain the hands of the physician cutting according to his art? The one cries, the other cuts. Is he cruel who does not listen to the man crying out, or is he not rather merciful in following the wound, that he may heal the sick man?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
source_title="Tractates on John 7"

[[commentary]]
quote='''
For even good things are hurtful, and evil things are beneficial, according to the character of the recipients. "Sin," says the apostle, "that it might appear sin, wrought death to me by that which is good." Thus, you see, evil is brought about by the good, so long as that which is good is wrongly received. It is he also that says: "Lest I should be exalted unduly through the greatness of my revelations, there was given to me a thorn in my flesh, the messenger of Satan to buffet me. For which thing I besought the Lord thrice, that He would take it away from me; and He said unto me, My grace is sufficient for thee: for strength is made perfect in weakness." And here, you see, good was brought about by that which was evil, when the evil was received in a good spirit. Why, then, do we wonder if Christ's bread was given to Judas, that thereby he should be made over to the devil; when we see, on the other hand, that Paul was visited by a messenger of the devil, that by such an instrumentality he might be perfected in Christ? In this way, both the good was injurious to the evil man, and the evil was beneficial to the good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252062.html'
source_title="Tractates on John 62"

[[commentary]]
quote='''
If the teacher of the Gentiles, Paul the Apostle, saith, “For what we should pray for as we ought, we know not,” how much more we? Who nevertheless, when he seemed to himself to pray wisely, namely, that from him should be taken away the thorn of the flesh, the angel of Satan, that did buffet him, in order that he might not in the greatness of the revelations be lifted up, heard from the Lord what? Was that done which he wished? Nay, in order to that being done which was expedient, he heard from the Lord, I say, what? “Thrice,” he saith, “I besought the Lord that He would take it from me; and He said to me, My Grace sufficeth for thee: for virtue in weakness is made perfect.” Salve to the wound I have applied; when I applied it I know, when it should be taken away I know. Let not a sick man draw back from the hands of the physician, let him not give advice to the physician.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252054.html'
source_title="Exposition on Psalm 54"

[[commentary]]
quote='''
In a word, all vices in evil-doings are to be feared, pride in well-doings is more to be feared. It is no wonder, then, that so humble is the Apostle, as to say, “When I am made weak, then I am strong.” For lest he should himself be tempted by this sin, what sort of medicine doth he say was applied to him against swelling by the Physician, who knew what He was healing? “Lest by the greatness,” he saith, “of the revelations I should be exalted, there was given to me a thorn of my flesh, the angel of Satan, to buffet me: wherefore thrice the Lord I besought, that it should depart from me: and He said to me, My grace is sufficient for thee, for virtue in weakness is made perfect.” See what the consummations are. An Apostle, the teacher of Gentiles, father of the faithful through the Gospel, received a thorn of the flesh whereby he might be buffeted. Which of us would dare to say this, unless he had not been ashamed to confess this? For if we shall have said that Paul had not suffered this; while to him as it were honour we give, a liar we make him. But because truthful he is, and truth he hath spoken; it behoveth us to believe that there was given to him an angel of Satan, lest by the greatness of the revelations he should be exalted. Behold how much to be feared is the serpent of pride.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"
