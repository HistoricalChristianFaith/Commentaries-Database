[[commentary]]
quote='''
The Apostle Paul besought Him that He would take away the thorn in his flesh, and He would not. Was he disturbed? Was he filled with sadness, and did he speak of himself as deserted? Rather did he say that he was not deserted, because that was not taken away which he desired to be taken away, to the end that infirmity might be cured. For this he found in the voice of the Physician, "My grace is sufficient for thee; for my strength is made perfect in weakness." Whence knowest thou, then, that God does not wish to heal thee? As yet it is expedient for thee to be scourged. Whence knowest thou how diseased that is which the physician cuts, using his knife on the diseased parts? Does he not know the measure, what he is to do, and how far he is to do it? Does the shrieking of him he cuts restrain the hands of the physician cutting according to his art? The one cries, the other cuts. Is he cruel who does not listen to the man crying out, or is he not rather merciful in following the wound, that he may heal the sick man?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
source_title="Tractates on John 7"

[[commentary]]
quote='''
For even good things are hurtful, and evil things are beneficial, according to the character of the recipients. "Sin," says the apostle, "that it might appear sin, wrought death to me by that which is good." Thus, you see, evil is brought about by the good, so long as that which is good is wrongly received. It is he also that says: "Lest I should be exalted unduly through the greatness of my revelations, there was given to me a thorn in my flesh, the messenger of Satan to buffet me. For which thing I besought the Lord thrice, that He would take it away from me; and He said unto me, My grace is sufficient for thee: for strength is made perfect in weakness." And here, you see, good was brought about by that which was evil, when the evil was received in a good spirit. Why, then, do we wonder if Christ's bread was given to Judas, that thereby he should be made over to the devil; when we see, on the other hand, that Paul was visited by a messenger of the devil, that by such an instrumentality he might be perfected in Christ? In this way, both the good was injurious to the evil man, and the evil was beneficial to the good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252062.html'
source_title="Tractates on John 62"
