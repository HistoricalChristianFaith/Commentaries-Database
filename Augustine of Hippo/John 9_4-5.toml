[[commentary]]
quote='''
What is that night wherein, when it comes, no one shall be able to work? Hear what the day is, and then thou wilt understand what the night is. But how shall we hear what the day is? Let Himself tell us: "As long as I am in this world, I am the light of the world." See, He Himself is the day. Let the blind man wash his eyes in the day, that he may behold the day. "As long," He says, "as I am in the world, I am the light of the world." Then will it be night of a kind unknown to me, when Christ will no longer be there; and so no one will be able to work. An inquiry remains, my brethren; patiently listen to me as I inquire. With you I inquire: With you shall I find Him to whom my inquiry is addressed. We are agreed; for it is expressly and definitely stated that the Lord proclaimed Himself in this place as the day, that is, the light of the world. "As long," He says, "as I am in this world, I am the light of the world." Therefore He Himself works. But how long is He in this world? Are we to think, brethren, that He was here then, and is here no longer? If we think so, then already, after the Lord's ascension, did that fearful night begin, when no one can work. If that night began after the Lord's ascension, how was it that the apostles wrought so much? Was that the night when the Holy Spirit came, and, filling all who were in one place, gave them the power of speaking in the tongues of every nation? Was it night when that lame man was made whole at the word of Peter, or rather, at the word of the Lord dwelling in Peter? Was it night when, as the disciples were passing by, the sick were laid in couches, that they might be touched at least by their shadow as they passed? Yet, when the Lord was here, there was no one made whole by His shadow as He passed; but He Himself had said to the disciples, "Greater things than these shall ye do." Yes, the Lord had said, "Greater things than these shall ye do;" but let not flesh and blood exalt itself: let such hear Him also saying, "Without me ye can do nothing."

What then? What shall we say of that night? When will it be, when no one shall be able to work? It will be that night of the wicked, that night of those to whom it shall be said in the end, "Depart into everlasting fire, prepared for the devil and his angels." But it is here called night, not flame, nor fire. Hearken, then, why it is also night. Of a certain servant He says, "Bind ye him hand and foot, and cast him into outer darkness." Let man, then, work while he liveth, that he may not be overtaken by that night when no man can work. It is now that faith is working by love; and if now we are working, then this is the day-Christ is here. Hear His promise, and think Him not absent. It is Himself who hath said, 'Lo, I am with you." How long? Let there be no anxiety in us who are alive; were it possible, with this very word we might place in perfect security the generations still to come. "Lo," He says," I am with you always, even to the end of the world." That day, which is completed by the circuit of yonder sun, has but few hours; the day of Christ's presence extends even to the end of the world. But after the resurrection of the living and the dead, when He shall say to those placed at His right hand, "Come, ye blessed of my Father, receive the kingdom;" and to those at His left, "Depart into everlasting fire, prepared for the devil and his angels;" then shall be the night when no man can work, but only get back what he has wrought before. There is a time for working, another for receiving; for the Lord shall render to every one according to his works. While thou livest, be doing, if thou art to be doing at all; for then shall come that appalling night, to envelope the wicked in its folds. But even now every unbeliever, when he dies, is received within that night: there is no work to be done there. In that night was the rich man burning, and asking a drop of water from the beggar's finger; he mourned, agonized, confessed, but no relief was vouchsafed. He even endeavored to do good; for he said to Abraham, "Father Abraham, send Lazarus to my brethren, that he may tell them what is being done here, lest they also come into this place of torment." Unhappy man! when thou wert living, then was the time for working: now thou art already in the night, in which no man can work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252044.html'
source_title="Tractates on John 44"
