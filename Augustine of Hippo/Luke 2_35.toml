[[commentary]]
quote='''
(de Nov. ac vet, Test. c. 73.) Or by this is signified that Mary also, through whom was performed the mystery of the incarnation, looked with doubt and astonishment at the death of her Lord, seeing the Son of God so humbled as to come down even to death. And as a sword passing close by a man causes fear, though it does not strike him; so doubt also causes sorrow, yet does not kill; for it is not fastened to the mind, but passes through it as through a shadow.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Next he doth relate the story, mentioning what Joseph suffered in his low estate, and how he was raised on high. “His feet they hurt in the stocks: the iron entered into his soul, until his word came” (ver. 18). That Joseph was put in irons, we do not indeed read; but we ought no ways to doubt that it was so. For some things might be passed over in that history, which nevertheless would not escape the Holy Spirit, who speaketh in these Psalms. We understand by the iron which entered into his soul, the tribulation of stern necessity; for he did not say body, but “soul.” There is a somewhat similar expression in the Gospel, where Simeon saith unto Mary, “A sword shall pierce through thy own soul also.” That is, the Passion of the Lord, which was a fall unto many, and in which the secrets of many hearts were revealed, since their sentiments respecting the Lord were extorted from them, without doubt made His own Mother exceeding sorrowful, heavily struck with human bereavement.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520105.html'
source_title="Exposition on Psalm 105"
