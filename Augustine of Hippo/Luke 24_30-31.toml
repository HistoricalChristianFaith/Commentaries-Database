[[commentary]]
quote='''
And no one should doubt that his being recognized in the breaking of bread is the sacrament, which brings us together in recognizing him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 149"

[[commentary]]
quote='''
Remember, though, dearly beloved, how the Lord Jesus desired to be recognized in the breaking of bread, by those whose eyes had been kept till then from recognizing him. The faithful know what I'm talking about. They know Christ in the breaking of bread. It isn't every loaf of bread, you see, but the one that receives Christ's blessing and becomes the body of Christ. That's where they recognized him. They were overjoyed and went straight to the others. They found whom they already knew. By telling what they had seen, they added to the gospel. It was all said, all done, all written down. And it has reached us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520234.html'
source_title="SERMON 234.2"

[[commentary]]
quote='''
(de Con. Ev. lib. iii. c. 25.) For they walked not with their eyes shut, but there was something within them which did not permit them to know that which they saw, which a mist, darkness, or some kind of moisture, frequently occasions. Not that the Lord was not able to transform His flesh that it should be really a different form from that which they were accustomed to behold; since in truth also before His passion, He was transfigured in the mount, so that His face was bright as the sun. But it was not so now. For we do not unfitly take this obstacle in the sight to have been caused by Satan, that Jesus might not be known. But still it was so permitted by Christ up to the sacrament of the bread, that by partaking of the unity of His body, the obstacle of the enemy might be understood to be removed, so that Christ might be known.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Again, if Mark tells us that the Lord appeared to these persons in another form, Luke refers to the same when he says that their eyes, were holden, that they should not know Him. For something had come upon their eyes which was suffered to remain until the breaking of the bread, in reference to a well-known mystery, so that only then was the different form in Him made visible to them, and they did not recognise Him, as is shown by Luke's narrative, until the breaking of the bread took place. And thus, in apt accordance with the state of their minds, which were still ignorant of the truth, that it behoved Christ to die and rise again, their eyes sustained something of a similar order; not, indeed, that the truth itself proved misleading, but that they were themselves incompetent to perceive the truth, and thought of the matter as something else than it was. The deeper significance of all which is this, that no one should consider himself to have attained the knowledge of Christ, if he is not a member in His body—that is to say, in His Church—the unity of which is commended to our notice under the sacramental symbol of the bread by an apostle, when he says: "We being many are one bread and one body." So was it that, when He handed to them the bread which He had blessed, their eyes were opened, and they recognised Him, that is to say, their eyes were opened for such knowledge of Him, in so far as the impediment was now removed which had prevented them from recognising Him. For certainly they were not walking with closed eyes. But there was something in them which debarred them from seeing correctly what was in their view,—a state of matters, indeed, which is the familiar result of darkness, or of a certain kind of humour. It is not meant by this, however, that the Lord could not alter the form of His flesh, so that His figure might be literally and actually different, and not the one which they were in the habit of beholding. For, indeed, even before His passion, He was transfigured on the mount so that His countenance "did shine as the sun." And He who made genuine wine out of genuine water can also transform any body whatsoever in all unquestionable reality into any other kind of body which may please Him. But what is meant is, that He had not acted so when He appeared in another form unto those two individuals. For He did not appear to be what He was to these men, because their eyes were holden, so that they should not know Him. Moreover, not unsuitably may we suppose that this impediment in their eyes came from Satan, with the view of precluding their recognition of Jesus. But, nevertheless, permission that it should be so was given by Christ on to the point at which the mystery of the bread was taken up. And thus the lesson might be, that it is when we become participants in the unity of His body, that we are to understand the impediment of the adversary to be removed, and liberty to be given us to know Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
