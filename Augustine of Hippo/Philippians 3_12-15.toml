[[commentary]]
quote='''
“Deliver me from all mine offences:” me being thus minded, and holding fast what the Apostle said, “As many of us as be perfect, let us be thus minded.” For at the time that he said that he was not “already perfect,” he then immediately goes on and says, “As many of us as be perfect, let us be thus minded.”…Art thou then, O Apostle, not perfect, and are we perfect? But hath it escaped you, that he did just now call himself “perfect”? For he does not say, “As many of you as are perfect, be ye thus minded;” but “As many of us as be perfect, let us be thus minded;” after having said a little before, “Not that I have already attained; either am already perfect.” In no other way then can you be perfect in this life, than by knowing that you cannot be perfect in this life. This then will be your perfection, so to have “over-leaped” some things, as to have still some point to which you are hastening on: so as to have something remaining, to which you will have to leap on, when everything else has been passed by. It is such faith as this that is secure; for whoever thinks that he has already attained, is “exalting himself,” so as to be “abased” hereafter.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252039.html'
source_title="Exposition on Psalm 39"
