
[[commentary]]
quote='''
“I will declare Thy name to My brethren” (ver. 22). I will declare Thy name to the humble, and to My Brethren that love one another as they have been beloved by Me. “In the midst of the Church will I sing of Thee.” In the midst of the Church will I with rejoicing preach Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
