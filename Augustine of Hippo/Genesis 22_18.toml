[[commentary]]
quote='''
And to Abraham's seed he promised—what? In your seed shall all the nations of the earth be blessed. His seed is Christ; because from Abraham came Isaac, from Isaac Jacob, from Jacob twelve sons, from these twelve the people of the Jews, from the people of the Jews the Virgin Mary, from the Virgin Mary our Lord Jesus Christ. And what was promised to Abraham we find fulfilled among ourselves. In your seed, it says, shall all the nations of the earth be blessed. He believed this before he had seen anything; he believed, and he never saw what was promised. 
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520113A.html'
source_title="SERMON 113A.10"

[[commentary]]
quote='''
“He stretcheth forth His hand in requiting” (ver. 20). “They have polluted His Testament.” Read the testament which they have polluted: “In thy seed shall be blessed all nations.” Thou against these words of the Testator sayest what? The Africa of holy Donatus hath alone deserved this grace, in him hath remained the Church of Christ. Say at least the Church of Donatus. Wherefore addest thou, of Christ? Of whom it is said, “In thy seed shall be blessed all nations.” After Donatus wilt thou go? Set aside Christ, and then secede. See therefore what followeth: “They have polluted His Testament.” What Testament? To Abraham have been spoken the promises, and to his seed. The Apostle saith, “Nevertheless, a man’s testament confirmed no one maketh void, or super-addeth to: to Abraham have been spoken the promises, and to his seed. He saith not, And to seeds, as if in many; but as if in one, And to thy Seed, which is Christ.” In this Christ, therefore, what Testament hath been promised? “In thy seed shall be blessed all nations.” Thou that hast given up the unity of all nations, and in a part hast remained, hast polluted His Testament.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"

[[commentary]]
quote='''
I begin the statement of His doings among men with Abraham. To this man, indeed, was given by an angelic oracle an intelligible promise, which we now see in its realization. For to him it was said, "In thy seed shall all nations be blessed." Of his seed, then, sprang the people of Israel, whence came the Virgin Mary, who was the mother of Christ; and that in Him all the nations are blessed, let them now be bold enough to deny if they can. This same promise was made also to Isaac the son of Abraham. It was given again to Jacob the grandson of Abraham. This Jacob was also called Israel, from whom that whole people derived both its descent and its name so that indeed the God of this people was called the God of Israel: not that He is not also the God of the Gentiles, whether they are ignorant of Him or now know Him; but that in this people He willed that the power of His promises should be made more conspicuously apparent. For that people, which at first was multiplied in Egypt, and after a time was delivered from a state of slavery there by the hand of Moses, with many signs and portents, saw most of the Gentile nations subdued under it, and obtained possession also of the land of promise, in which it reigned in the person of kings of its own, who sprang from the tribe of Judah. This Judah, also, was one of the twelve sons of Israel, the grandson of Abraham. And from him were descended the people called the Jews, who, with the help of God Himself, did great achievements, and who also, when He chastised them, endured many sufferings on account of their sins, until the coming of that Seed to whom the promise was given, in whom all the nations were to be blessed, and [for whose sake] they were willingly to break in pieces the idols of their fathers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25201.html'
source_title="The Harmony of the Gospels, Book 1, Chapter 25"
