[[commentary]]
quote='''
There is therefore one hope: “for the sake of Thy law have I borne Thee, O Lord.” What law? That which made men guilty. For a “law, holy, just, and good,” was given to the Jews; but its effect was to make them guilty. A law was not given that could give life, but which might show his sins to the sinner. For the sinner had forgotten himself, and saw not himself; the law was given him, that he might see himself. The law made him guilty, the Lawgiver freed him: for the Lawgiver is the Supreme Power.…There is therefore a law of the mercy of God, a law of the propitiation of God. The one was a law of fear, the other is a law of love. The law of love giveth forgiveness to sins, blotteth out the past, warneth concerning the future; forsaketh not its companion by the way, becometh a companion to him whom it leadeth on the way. But it is needful to agree with the adversary, whilst thou art with him in the way. For the Word of God is thine adversary, as long as thou dost not agree with it. But thou agreest, when it has begun to be thy delight to do what God’s Word commandeth. Then he who was thine adversary becometh thy friend: so, when the way is finished, there will be none to deliver thee to the Judge. Therefore, “For the sake of Thy law I have waited for Thee, O Lord,” because thou hast condescended to bring in a law of mercy, to forgive me all my sins, to give me for the future warnings that I may not offend.…“For the sake,” therefore, “of” this “law I have waited for Thee, O Lord.” I have waited until Thou mayest come and free me from all need, for in my very need Thou hast not forsaken the law of mercy.…“My soul hath waited for Thy word.”…

We therefore trust without fear on the word of Him who cannot deceive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520130.html'
source_title="Exposition on Psalm 130"
