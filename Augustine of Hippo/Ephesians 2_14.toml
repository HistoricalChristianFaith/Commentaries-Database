[[commentary]]
quote='''
This we also say: Love ye peace, love ye Christ. For if they love peace, they love Christ. When therefore we say, Love ye peace, we say this, Love ye Christ. Wherefore? For the Apostle saith of Christ, “He is our peace, who hath made both one.” If Christ is therefore peace, because He hath made both one: why have ye made two of one? How then are ye peace-makers, if, when Christ maketh one of two, ye make two of one? But since we say these things, we are peace-makers with them that hate peace; and yet they who hate peace, when we spake to them, made war on us for nought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520120.html'
source_title="Exposition on Psalm 120"
