[[commentary]]
quote='''
(de Con. Evan. ii. 25) But Matthew writes this miracle as if it were done in the city of the Lord, whilst Mark places it in Capernaum, which would be more difficult of solution, if Matthew had also named Nazareth. But seeing that Galilee itself might be called the city of the Lord, who can doubt but that the Lord did these things in His own city, since He did them in Capernaum, a city of Galilee; particularly as Capernaum was of such importance in Galilee as to be called its metropolis? Or else, Matthew passed by the things which were done after He came into His own city, until He came to Capernaum, and so adds on the story of the paralytic healed, subjoining, And, behold, they presented to him a man sick of the palsy, after he had said that He came into His own city.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
A difficulty, however, may certainly arise when we observe how Matthew tells the story of the paralytic after this fashion: "And He entered into a ship, and passed over, and came into His own city. And, behold, they brought to Him a man sick of the palsy, lying on a bed;" whereas Mark speaks of the incident as taking place not in His own city, which indeed is called Nazareth, but in Capharnaum. His narrative is to the following effect:—" And again He entered into Capharnaum after some days; and it was noised that He was in the house. And straightway many were gathered together, insomuch that there was no room to receive them, no, not so much as about the door: and He spake a word unto them. And they came unto Him, bringing one sick of the palsy, which was borne of four. And when they could not come nigh unto Him for the press, they uncovered the roof where He was: and when they had broken it up, they let down the bed wherein the sick of the palsy lay. And when Jesus saw their faith;" and so forth. Luke, on the other hand, does not mention the place in which the incident happened, but gives the tale thus: "And it came to pass on a certain day that He was sitting teaching, and there were Pharisees and doctors of the law also sitting by, which were come out of every town of Galilee, and Judæa, and Jerusalem: and the power of the Lord was present to heal them. And, behold, men brought in a bed a man which was taken with a palsy: and they sought means to bring him in, and to lay him before Him. And when they could not find by what way they might bring him in because of the multitude, they went upon the house-top, and let him down through the tiling with his couch into the midst before Jesus. And when He saw their faith, He said, Man, thy sins are forgiven thee;" and so forth. The question, therefore, remains one between Mark and Matthew, in so far as Matthew writes of the incident as taking place in the Lord's city; while Mark locates it in Capharnaum. This question would be more difficult to solve if Matthew mentioned Nazareth by name. But, as the case stands, when we reflect that the state of Galilee itself might have been called Christ's city, because Nazareth was in Galilee, just as the whole region which was made up of so many cities is yet called a Roman state; when, further, it is considered that so many nations are comprehended in that city, of which it is written, "Glorious things are spoken of thee, O city of God;" and also that God's ancient people, though dwelling in so many cities, have yet been spoken of as one house, the house of Israel,—who can doubt that [it may be fairly said that] Jesus wrought this work in His own city [or, state], inasmuch as He did it in the city of Capharnaum, which was a city of that Galilee to which He had returned when He crossed over again from the country of the Gerasenes, so that when He came into Galilee He might correctly be said to have come into His own city [or, state], in which ever town of Galilee He might happen to be? This explanation may be vindicated more particularly on the ground that Capharnaum itself held a position of such eminence in Galilee that it was reckoned to be a kind of metropolis. But even were it altogether illegitimate to take the city of Christ in the sense either of Galilee itself, in which Nazareth was situated, or of Capharnaum, which was distinguished as in a certain sense the capital of Galilee, we might still affirm that Matthew has simply passed over all that happened after Jesus came into His own city until He reached Capharnaum, and that he has simply tacked on the narrative of the healing of the paralytic at this point; just as the writers do in many instances, leaving unnoticed much that intervenes, and, without any express indication of the omissions they are making, proceeding precisely as if what they subjoin, followed actually in literal succession.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 25"
