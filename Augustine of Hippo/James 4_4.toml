[[commentary]]
quote='''
But the enemies of God are openly blasphemers, and daily they are found hidden. Beware of such enmities of God. For the Scripture revealeth some such secret enemies of God: that because thou knowest them not in thy heart, thou mayest know in God’s Scriptures, and beware of being found with them. James saith openly in his Epistle, “Know ye not that the friendship of the world is enmity with God?” Thou hast heard. Dost thou wish not to be an enemy of God? Be not a friend of this world: for if thou art a friend of this world, thou wilt be an enemy of God. For as a wife cannot be an adulteress, unless she be an enemy to her own husband: so a soul which is an adulteress through its love of worldly things, cannot but be an enemy to God. It feareth, but loveth not: it feareth punishment but is not delighted with righteousness. All lovers of the world, therefore, are enemies of God, all the curious after trifles, all consulters of diviners astrologers, and evil spirits. Let them enter, or not enter, Churches: they are enemies of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252092.html'
source_title="Exposition on Psalm 92"
