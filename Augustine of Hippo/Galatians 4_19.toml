[[commentary]]
quote='''
Humans are conceived in their mother's womb in order to be formed, yet only when fully formed do they go into labor. One might be surprised by his statement: "You with whom I am again in travail until Christ be formed in you." We are to understand this travail to stand for the agonies of concern that they might be born in Christ. Then he labors for them once again because of the dangers of their seduction, by which he sees them being disturbed.
'''
source_url=''
source_title="EPISTLE TO THE GALATIANS 38 [1B.4.19]"

[[commentary]]
quote='''
Perchance therefore sinners have been alienated from a certain womb, wherein that charity was suffering pains, which speaketh through the Apostle, “Of whom again I am in labour, until Christ be formed in you.” Expect thou therefore; be formed: do not to thyself ascribe a judgment which perchance thou knowest not. Carnal thou art as yet, conceived thou hast been: from that very time when thou hast received the name of Christ, by a sort of sacrament thou hast been born in the bowels of a mother. For not only out of bowels a man is born, but also in bowels. First he is born in bowels, in order that he may be able to be born of bowels. Wherefore it hath been said even to Mary, “For that which is born in thee, is of the Holy Spirit.” Not yet of Her It had been born, but already in Her It had been born. Therefore there are born within the bowels of the Church certain little ones, and a good thing it is that being formed they should go forth, so that they drop not by miscarriage. Let the mother bear thee, not miscarry. If patient thou shalt have been, even until thou be formed, even until in thee there be the sure doctrine of truth, the maternal bowels ought to keep thee. But if by thy impatience thou shalt have shaken the sides of thy mother, with pain indeed she expelleth thee out, but more to thy loss than to hers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
