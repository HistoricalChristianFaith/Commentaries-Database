[[commentary]]
quote='''
People become heretics, even though they would still have held wrong opinions if they had remained within the church. Now that they are outside, they do us more good, not by teaching the truth, for they do not know it, but by provoking carnal Christians to seek the truth and spiritual Christians to expound it. In the church there are innumerable people who are approved by God, but they do not become manifest among us as long as we are content with the darkness of our ignorance and prefer to sleep rather than to behold the light of truth.
'''
source_url=''
source_title="ON TRUE RELIGION 7.15"

[[commentary]]
quote='''
“And His heart hath drawn near” (ver. 22). Of whom do we understand it, except of Him, by the anger of whom they have been divided? How “hath his heart drawn near”? In such sort, that we may understand His will. For by heretics hath been vindicated the Catholic Church, and by those that think evil have been proved those that think well. For many things lay hid in the Scriptures: and when heretics had been cut off, with questions they troubled the Church of God: then those things were opened which lay hid, and the will of God was understood. Thence is said in another Psalm, “In order that they might be excluded that have been proved with silver.” For let them be excluded, He hath said, let them come forth, let them appear. Whence even in silver-working men are called “excluders,” that is, pressers out of form from the sort of confusion of the lump. Therefore many men that could understand and expound the Scriptures very excellently, were hidden among the people of God: but they did not declare the solution of difficult questions, when no reviler again urged them. For was the Trinity perfectly treated of before the Arians snarled thereat? Was repentance perfectly treated of before the Novatians opposed? So not perfectly of Baptism was it treated, before rebaptizers removed outside contradicted; nor of the very oneness of Christ were the doctrines clearly stated which have been stated, save after that this separation began to press upon the weak: in order that they that knew how to treat of and solve these questions (lest the weak should perish vexed with the questions of the ungodly), by their discourses and disputations should bring out unto open day the dark things of the Law.…This obscure sense see in what manner the Apostle bringeth out into light; “It is needful,” he saith, “that also heresies there be, in order that men proved may be made manifest among you.” What is “men proved”? Proved with silver, proved with the word. What is “may be made manifest”? May be brought out. Wherefore this? Because of heretics. So therefore these also “have been divided because of the anger of His countenance, and His heart hath drawn near.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
