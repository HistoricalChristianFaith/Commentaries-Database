[[commentary]]
quote='''
Paul shows that both life and death exist in a man living in his body—death in his body, life in his spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252020.html'
source_title="City of God 20.15"

[[commentary]]
quote='''
When he says: The body indeed is dead because of sin, but the spirit is life because of righteousness, the body is called dead in the sense of mortal. For from its mortality the need of earthly things solicits the soul and stirs up certain desires, which, so as to sin, he does not obey who now serves the law of God with his mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
