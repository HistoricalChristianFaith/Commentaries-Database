[[commentary]]
quote='''
Paul shows that both life and death exist in a man living in his body—death in his body, life in his spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252020.html'
source_title="City of God 20.15"

[[commentary]]
quote='''
When he says: The body indeed is dead because of sin, but the spirit is life because of righteousness, the body is called dead in the sense of mortal. For from its mortality the need of earthly things solicits the soul and stirs up certain desires, which, so as to sin, he does not obey who now serves the law of God with his mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"


[[commentary]]
quote='''
For the punishment of the flesh is death, and surely there is in it liability to death itself. Whence the Apostle spoke not of the body as if to die, but as if dead: “The body indeed is dead,” he saith, “because of sin, but the Spirit is life because of righteousness.” How then without bond of sin is born that which is conceived and sown of a body dead because of sin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"

[[commentary]]
quote='''
And whither do we go after death, unless there is a depth deeper than this depth in which we are in the flesh and in this mortal state? For “the body is dead,” saith the Apostle, “because of sin.” Therefore even here are the dead; that thou mayest not wonder because it is called infernum, if it abounds with the dead. For he saith not, the body is about to die: but, “the body is dead.” Even now surely our body hath life: and yet compared with that body which is to be like the bodies of Angels, the body of man is found to be dead, although still having life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
