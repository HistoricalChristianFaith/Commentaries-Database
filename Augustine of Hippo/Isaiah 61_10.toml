[[commentary]]
quote='''
But whether Head speaketh or whether members speak, Christ speaketh: He speaketh in the person of the Head, He speaketh in the person of the Body. But what hath been said? There shall be two in one flesh. “This is a great Sacrament:” “I,” he saith, “speak in Christ and in the Church.” And He Himself in the Gospel, “Therefore no longer two, but one flesh.” For in order that ye may know these in a manner to be two persons, and again one by the bond of marriage, as one He speaketh in Isaiah, and saith, “As upon a Bridegroom he hath bound upon me a mitre, and as a Bride he hath clothed me with an ornament.” A Bridegroom He hath called Himself in the Head, a Bride in the Body. He is speaking therefore as One, let us hear Him, and in Him let us also speak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252075.html'
source_title="Exposition on Psalm 75"
