[[commentary]]
quote='''
“Wherefore God shall destroy thee at the end” (ver. 6): though now thou seemest to flourish like grass in the field before the heat of the sun. For, “All flesh is grass, and the brightness of man as the bloom of grass: the grass hath withered, and the bloom hath fallen down: but the word of the Lord abideth for everlasting.” Behold that to which thou mayest bind thyself, to what “abideth for everlasting.” For if to grass, and to the bloom of grass, thou shalt have bound thyself, since the grass shall wither, and the bloom shall fall down, “God shall destroy thee at the end:” and if not now, certainly at the end He shall destroy, when that winnowing shall have come, and the heap of chaff from the solid grain shall have been separated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252052.html'
source_title="Exposition on Psalm 52"

[[commentary]]
quote='''
But if we must take, “and they shall flourish like the grass of the earth,” in the same manner as is said, “all flesh is grass, and the glory of a man like the flower of grass:” certainly then that city must be understood which doth intimate this world’s society: for it was not to no purpose that Cain was the first to build a city. Thus the fruit of Christ being exalted above Libanus, that is, above enduring trees and undecaying timbers, because He is the everlasting fruit, all the glory of a man according to the temporal exaltation of the world is compared to grass; for by believers and by men already hoping for life eternal temporal felicity is despised, in order that there may be fulfilled that which hath been written, “all flesh is grass, and all the glory of flesh as the flower of grass: the grass hath dried, the flower hath fallen off, but the word of the Lord doth endure for ever.” There is the fruit of Him exalted above Libanus. For always flesh hath been grass, and the glory of flesh as the flower of grass: but because it was not clearly proved what felicity ought to have been chosen and preferred, the flower of grass was esteemed for a great matter: not only it was by no means despised, but it was even chiefly sought after. As if therefore at that time He shall have begun to be thus, when there is reproved and despised whatever used to flourish in the world, thus hath been said, “superexalted above Libanus shall be the fruit of Him, and they shall flourish from the city like grass of the earth:” that is, glorified above all things shall be that which is promised for everlasting, and compared to the grass of the earth shall be whatever is counted a great matter in the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252072.html'
source_title="Exposition on Psalm 72"

[[commentary]]
quote='''
“For he flourisheth as a flower of the field.” The whole splendour of the human race; honour, powers, riches, pride, threats, is the flower of the grass. That house flourisheth, and that family is great, that family flourisheth; and how many flourish, and how many years do they live! Many years to thee, are but a short season unto God. God doth not count, as thou dost. Compared with the length and long life of ages, all the flower of any house is as the flower of the field. All the beauty of the year hardly lasteth for the year. Whatever there flourisheth, whatever there is warmed with heat, whatever there is beautiful, lasteth not; nay, it cannot exist for one whole year. In how brief a season do flowers pass away, and these are the beauty of the herbs! This which is so very beautiful, this quickly falleth. Inasmuch then as He knoweth as a father our forming, that we are but grass, and can only flourish for a time; He sent unto us His Word, and His Word, which abideth for evermore, He hath made a brother unto the grass which abideth not. Wonder not that thou shalt be a sharer of His Eternity; He became Himself first a sharer of thy grass. Will He who assumed from thee what was lowly, deny unto thee what is exalted in respect of thee?

“The wind shall go over on it, it shall not be; and the place thereof shall know it no more” (ver. 16). For he is not speaking of grass, but of that for whose sake even the Word became grass. For thou art man, and on thy account the Word became man. “All flesh is grass:” “and the Word was made flesh.” How great then is the hope of the grass, since the Word hath been made flesh? That which abideth for evermore, hath not disdained to assume grass, that the grass might not despair of itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
