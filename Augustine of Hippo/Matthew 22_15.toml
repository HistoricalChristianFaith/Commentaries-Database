[[commentary]]
quote='''
Matthew then continues in these terms: "Then went the Pharisees, and took counsel how they might entangle Him in His talk. And they send out unto Him their disciples, with the Herodians, saying, Master, we know that thou art true, and teachest the way of God in truth, neither carest thou for any man; for thou regardest not the person of men: tell us therefore, What thinkest thou? Is it lawful to give tribute to Cæsar, or not?" and so on, down to the words, "And when the multitude heard this, they were astonished at His doctrine." Mark and Luke give a similar account of these two replies made by the Lord,—namely, the one on the subject of the coin, which was prompted by the question as to the duty of giving tribute to Cæsar; and the other on the subject of the resurrection, which was suggested by the case of the woman who had married the seven brothers in succession. Neither do these two evangelists differ in the matter of the order. For after the parable which told of the men to whom the vineyard was let out, and which also dealt with the Jews (against whom it was directed), and the evil counsel they were devising (which sections are given by all three evangelists together), these two, Mark and Luke, pass over the parable of the guests who were invited to the wedding (which only Matthew has introduced), and thereafter they join company again with the first evangelist, when they record these two passages which deal with Cæsar's tribute, and the woman who was the wife of seven different husbands, inserting them in precisely the same order, with a consistency which admits of no question.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 72"
