[[commentary]]
quote='''
“For all that wait upon Thee shall not be confounded” (ver. 3).

“Let them be confounded who do vain things unrighteously.” Let them be confounded who act unrighteously for the acquiring things that pass away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
