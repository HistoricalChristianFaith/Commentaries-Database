[[commentary]]
quote='''
“God hath spoken in His Holy One” (ver. 6).…In what Holy One of His? “God was in Christ reconciling the world to Himself.” In that Holy One, of whom elsewhere ye have heard, “O God, in the Holy One is Thy way.” “I will rejoice and will divide Sichima.…and the valley of tabernacles I will measure out.” Sichima is interpreted shoulders. But according to history, Jacob returning from Laban his father-in-law with all his kindred, hid the idols in Sichima which he had from Syria, where for a long time he had dwelled, and at length was coming from thence. But tabernacles he made there because of his sheep and herds, and called the place Tabernacles. And these I will divide, saith the Church. What is this, “I will divide Sichima”? If to the story where the idols were hidden is the reference, the Gentiles it signifieth; I divide the Gentiles. I divide, is what? “For not in all men is there faith.” I divide, is what? Some will believe, others will not believe.…The shoulders are divided, in order that their sins may burthen some men, while others may take up the burden of Christ. For godly shoulders He was requiring when He said, “For My yoke is gentle, and My burden is light.” Another burden oppresseth and loadeth thee, but Christ’s burden relieveth thee: another burden hath weight, Christ’s burden hath wings. For even if thou pull off the wings from a bird, thou dost remove a kind of weight; and the more weight thou hast taken away, the more on earth it will abide. She that thou hast chosen to disburden lieth there: she flieth not, because thou hast taken off a weight: let there be given back the weight, and she flieth. Such is Christ’s burden; let men carry it, and not be idle: let them not be heeded that will not bear it; let them bear it that will, and they shall find how light it is, how sweet, how pleasant, how ravishing unto Heaven, and from earth how transporting.…Perchance because of the sheep of Jacob, “the valley of Tabernacles” is to be understood of the nation of the Jews, and the same is divided: for they have passed from thence that have believed, the rest have remained without.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252060.html'
source_title="Exposition on Psalm 60"

[[commentary]]
quote='''
Also in the LXth, “I will rejoice, I will divide Shechem:” here “I will be exalted, and will divide Shechem.” Where is shown what is signified in the division of Shechem, which it was prophesied should happen after the Lord’s exaltation, and that this joy doth refer to that exaltation; so that He rejoiceth, because He is exalted. Whence he elsewhere saith, “Thou hast turned my heaviness into joy; Thou hast put off my sackcloth and girded me with gladness.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520108.html'
source_title="Exposition on Psalm 108"
