[[commentary]]
quote='''
But it hath been clearly enough intimated, that by the judgment of God these things befell them through the instrumentality of evil angels, in this wicked world, as though it were in Egypt and in the plain of Thanis, where we ought to be humble, until there come that world, wherein we may earn to be exalted out of this humiliation. For even Egypt in the Hebrew tongue doth signify darkness or tribulations, in which tongue, Thanis, as I have observed, is understood to be humble commandment. Concerning the evil angels therefore in this Psalm, while he was speaking of those very plagues, there hath been something inserted, which must not be passed over cursorily: “He sent upon them,” he saith, “an infliction through evil angels.” Now that the devil and his angels are so very evil, that for them everlasting fire is prepared, no believer is ignorant: but that there should be sent by means of them an infliction from the Lord God upon certain whom He judgeth to be deserving of this punishment, seemeth to be a hard thing to those who are little prone to consider, how the perfect justice of God doth use well even evil things. For these indeed, as far as regardeth their substance, what other person but Himself hath made? But evil He hath not made them: yet He doth use them, inasmuch as He is good, well, that is, conveniently and justly: just as on the other hand unrighteous men do use His good creatures in evil manner. God therefore doth use evil angels not only to punish evil men, as in the case of all those concerning whom the Psalm doth speak, as in the case of king Achab, whom a spirit of lying by the will of God did beguile, in order that he might fall in war: but also to prove and make manifest good men, as He did in the case of Job. But as far as regardeth that corporal matter of visible elements, I suppose that thereof angels both good and evil are able to make use, according to the power given to each: just as also men good and evil do use such things, as far as they are able, according to the measure of human infirmity. For we use both earth and water, and air, and fire, not only in things necessary for our support, but also in many operations superfluous and playful, and marvellously artificial. For countless things, which are called μηχανήματα, are moulded out of these elements scientifically employed. But over these things angels have a far more extended power, both the good and the evil, though greater is that which the good have; but only so far as is commanded or permitted by the will and providence of God; on which terms also we have it. For not even in these cases are we able to do all that we will. But in a book the most unerring we read that the devil was able even to send fire from Heaven, to burn up with wonderful and awful fierceness so great a number of the cattle of a holy man: which thing no one of the faithful would dare perchance to ascribe to the devil, except it were read on the authority of Holy Scripture. But that man, being by the gift of God just and firm, and of godly knowledge, saith not, The Lord hath given, the devil hath taken away: but, “The Lord hath given, the Lord hath taken away:” very well knowing that even what the devil was able to do with these elements, he would still not have done to a servant of God, except at his Lord’s will and permission; he did confound the malice of the devil, forasmuch as he knew who it was that was making use thereof to prove him. In the sons then of unbelief like as it were in his own slaves, he doth work, like men with their beasts, and even therewith only so far as is permitted by the just judgment of God. But it is one thing when his power is restrained from treating even his own as he pleases, by a greater power; another thing when to him power is given even over those who are alien from him. Just as a man with his beast, as men understand it, doeth what he will, and yet doth not indeed, if he be restrained by a greater power: but with another man’s beast to do something, he doth wait until power be given from him unto whom it belongeth. In the former case the power which there was is restrained, in the latter that which there was not is conceded.

And if such be the case, if through evil angels God did inflict those plagues upon the Egyptians, shall we dare to say that the water also was turned into blood by means of those same angels, and that frogs were created by means of the same, the like whereunto even the magicians of Pharaoh were able to make by their enchantments; so as that evil angels stood on both sides, on the one side afflicting them, on the other side deceiving them, according to the judgment and dispensation of the most just and most omnipotent God, who doth justly make use of even the naughtiness of unrighteous men? I dare not to say so. For whence was it that the magicians of Pharaoh could by no means make lice? Was it not because even these same evil angels were not suffered to do this? Or, to speak more truly, is not the cause hidden, and it doth exceed our powers of inquiry? For if we shall have supposed that God wrought those things by means of evil angels, because punishments were being inflicted, and not blessings being bestowed, as though God doth inflict punishments upon no one by means of good angels, but by means of those executioners as it were of the heavenly wrath; the consequence will be that we must believe that even Sodom was overthrown by means of evil angels, and that Abraham and Lot would seem to have entertained under their roof evil angels; the which, as being contrary to the most evident Scriptures, far be it that we should think. It is clear then that these things might have been done to men by means of good and evil angels. What should be done or when it should be done doth escape me: but Him that doeth it, it escapeth not, and him unto whom He shall have willed to reveal it. Nevertheless, as far as divine Scripture doth yield to our application thereto, on evil men that punishments are inflicted both by means of good angels, as upon the Sodomites, and by means of evil angels, as upon the Egyptians, we read: but that just men with corporal penances by means of good angels are tried and proved, doth not occur to me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
