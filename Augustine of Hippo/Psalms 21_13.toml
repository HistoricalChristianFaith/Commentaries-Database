[[commentary]]
quote='''
“Be Thou exalted, O Lord, in Thy strength” (ver. 13). Be Thou, Lord, whom in humiliation they did not discern, exalted in Thy strength, which they thought weakness. “We will sing and praise Thy power.” In heart and in deed we will celebrate and make known Thy marvels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
