[[commentary]]
quote='''
He “knows” it in Himself; He “searches it out” for our sakes. For it is for this reason God sometimes “searches a thing out;” and speaks of that becoming known to Himself, which He is Himself making known to thee. He is speaking of His own work, not of His knowledge. We commonly say, “A gladsome day,” when it is fine. Yet is it the day itself that experiences delight? No: we speak of the day as gladsome, because it fills us with delight. And we speak of a “sullen sky.” Not that there is any such feeling in the clouds, but because men are affected with sullenness at the sight of such an appearance of the skies, it is called sullen for this reason, that it makes us sullen. So also God is said to “know” when He causes us to know. God says to Abraham, “Now I know that thou fearest God.” Did He then not know it before then? But Abraham did not know himself till then: for it was in that very trial he came to know himself.…And God is said to “know” that which He had caused him to know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252044.html'
source_title="Exposition on Psalm 44"

[[commentary]]
quote='''
But that which he hath added, “and see,” must be understood as, make it to be seen that I run, make it to be seen that I am guided: according to that figure wherein this also hath been said to Abraham, “Now I know that thou fearest God.” God saith, “Now I know:” whence, but because I have made thee to know? For unknown to himself every one is before the questioning of temptation: just as of himself Peter in his confidence was ignorant, and by denying learned what kind of powers he had, in his very stumbling he perceived that it was falsely he had been confident: he wept, and in weeping he earned profitably to know what he was, and to be what he was not. Therefore Abraham when tried, became known to himself: and it was said by God, “Now I know,” that is, now I have made thee to know. In like manner as glad is the day because it maketh men glad; and sad is bitterness because it maketh sad one tasting thereof: so God’s seeing is making to see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"
