[[commentary]]
quote='''
“I will break them, and they shall not be able to stand” (ver. 38): and they shall not hold out against me. “They shall fall under my feet.” When they are cast down, I will place before me the loves whereby I walk for evermore.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
