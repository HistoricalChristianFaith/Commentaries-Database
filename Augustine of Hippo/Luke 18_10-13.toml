[[commentary]]
quote='''
How useful and necessary a medicine is repentance! People who remember that they are only human will readily understand this. It is written, "God resists the proud, but gives grace to the humble." … The Pharisee was not rejoicing so much in his own clean bill of health as in comparing it with the diseases of others. He came to the doctor. It would have been more worthwhile to inform him by confession of the things that were wrong with himself instead of keeping his wounds secret and having the nerve to crow over the scars of others. It is not surprising that the tax collector went away cured, since he had not been ashamed of showing where he felt pain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520351.html'
source_title="SERMON 351.1"
[[commentary]]
quote='''
To whom is the Lord near? “Even” unto them that “are of a broken heart.” He is far from the proud: He is near to the humble. “For though the Lord is high, yet hath He respect unto the lowly.” But let not those that are proud think themselves to be unobserved: for the things that are high, He “beholdeth afar off.” He “beheld afar off” the Pharisee, who boasted himself; He was near at hand to succour the Publican, who made confession. The one extolled his own merits, and concealed his wounds; the other boasted not of his merits, but laid bare his wounds. He came to the Physician; he knew that he was sick, and that he required to be made whole; he “dared not lift up his eyes to Heaven: he smote upon his breast.” He spared not himself, that God might spare him; he acknowledged himself guilty, that God might “ignore” the charge against him. He punished himself, that God might free him from punishment.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"
