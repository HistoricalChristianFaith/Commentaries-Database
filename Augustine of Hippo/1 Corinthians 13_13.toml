[[commentary]]
quote='''
There are three things at least that the apostle commends when he says, "But now abide faith, hope, charity, these three; but the greatest of these is charity." And although in charity, that is, in love, are comprehended the two commandments; yet it is here declared to be the greatest only, and not the sole one. Accordingly, what a host of commandments are given us about faith, what a multitude about hope! who is there that could collect them together, or suffice to number them?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252083.html'
source_title="Tractates on John 83"
