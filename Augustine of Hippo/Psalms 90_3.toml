[[commentary]]
quote='''
But as our life here is exposed to numerous and great temptations, and it is to be feared lest we may be turned aside by them from that refuge, let us see what in consequence of this the prayer of the man of God seeks for. “Turn not Thou man to lowness” (ver. 3): that is, let not man, turned aside from Thy eternal and sublime things, lust for things of time, savour of earthly things. This prayer is what God has Himself enjoined us, in the Prayer, “Lead us not into temptation,” He adds, “Again Thou sayest, Come again, ye children of men.” As if he said, I ask of Thee what Thou hast commanded me to ask: giving glory to His grace, that “he that glorieth, in the Lord he may glory:” without whose help we cannot by an exertion of our own will overcome the temptations of this life. “Turn not Thou man to lowness: again thou sayest, Turn again, ye children of men.” But grant what Thou has enjoined, by hearing the prayer of him who can at least pray, and aiding the faith of the willing soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252090.html'
source_title="Exposition on Psalm 90"
