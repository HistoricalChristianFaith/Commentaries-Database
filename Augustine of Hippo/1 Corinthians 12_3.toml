[[commentary]]
quote='''
And besides, this is the apostolic declaration, "No one saith, Lord Jesus, but in the Holy Spirit: and who is it that calleth Him Lord Jesus but he that loveth Him, if he so call Him in the way the apostle intended to be understood? For many call Him so with their lips, but deny Him in their hearts and works; just as He saith of such, "For they profess that they know God, but in works they deny Him." If it is by works He is denied, it is doubtless also by works that His name is truly invoked. "No one," therefore, "saith, Lord Jesus," in mind, in word, in deed, with the heart, the lips, the labor of the hands,-no one saith, Lord Jesus, but in the Holy Spirit; and no one calls Him so but he that loveth, And accordingly the apostles were already calling Him Lord Jesus: and if they called Him so, in no way that implied a feigned utterance, with the mouth confessing, in heart and works denying Him; if they called Him so in all. truthfulness of soul, there can be no doubt they loved. And how, then, did they love, but in the Holy Spirit?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252074.html'
source_title="Tractates on John 74"
