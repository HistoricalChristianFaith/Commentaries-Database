[[commentary]]
quote='''
And the apostle himself, after saying, "By grace are ye saved through faith; and that not of yourselves, it is the gift of God: not of works, lest any man should boast;" saw, of course, the possibility that men would think from this statement that good works are not necessary to those who believe, but that faith alone suffices for them; and again, the possibility of men's boasting of their good works, as if they were of themselves capable of performing them. To meet, therefore, these opinions on both sides, he immediately added, "For we are His workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them." What is the purport of his saying, "Not of works, lest any man should boast," while commending the grace of God? And then why does he afterwards, when giving a reason for using such words, say, "For we are His workmanship, created in Christ Jesus unto good works"? Why, therefore, does it run, "Not of works, lest any man should boast"? Now, hear and understand. "Not of works" is spoken of the works which you suppose have their origin in yourself alone; but you have to think of works for which God has moulded (that is, has formed and created) you. For of these he says, "We are His workmanship, created in Christ Jesus unto good works." Now he does not here speak of that creation which made us human beings, but of that in reference to which one said who was already in full manhood, "Create in me a clean heart, O God;" concerning which also the apostle says, "Therefore, if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new. And all things are of God." We are framed, therefore, that is, formed and created, "in the good works which" we have not ourselves prepared, but "God hath before ordained that we should walk in them."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 20"
