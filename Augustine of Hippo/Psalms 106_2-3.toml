[[commentary]]
quote='''
“Who can express the mighty acts of the Lord?” (ver. 2). Full of the consideration of the Divine works, while he entreateth His mercy, “Who,” he saith, “can express the mighty acts of the Lord, or make all His praises heard?” We must supply what was said above, to make the sense complete here, thus, “Who shall make all His praises heard?” that is, who is sufficient to make all His praises heard? “Shall make” them “heard,” he saith; that is, cause that they be heard; showing, that the mighty acts of the Lord and His praises are so to be spoken of, that they may be preached to those who hear them. But who can make “all,” heard? Is it that as the next words are, “Blessed are they that alway keep judgment, and do righteousness in every time” (ver. 3); he perhaps meant those praises of His, which are understood as His works in His commandments? “For it is God,” saith the Apostle, “who worketh in you,”…since He worketh in these things in a manner that cannot be spoken. “Who will do all His praises heard?” that is, who, when he hath heard them, doth all His praises? which are the works of His commandments. As far as they are done, although all which are heard are not performed, He is to be praised, who “worketh in us both to will and to do of His good pleasure.” For this reason, while he might have said, all His commandments, or, all the works of His commandments; he preferred saying, “His praises.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
