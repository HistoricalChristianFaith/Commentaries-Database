[[commentary]]
quote='''
(Tr. l. 13) He was speaking of His bodily presence; for in respect of His majesty, providence, ineffable and invisible grace, those words are fulfilled, Lo, I am with you alway, even unto the end of the world. (Mat. 28:20) (c. 12.). Or thus: In the person of Judas are represented the wicked in the Church; for if thou art a good man, thou hast Christ now by faith, and the Sacrament, and thou shalt have Him always, for when thou hast departed hence, thou shalt go to Him who said to the thief, To-day shalt thou be with Me in paradise. (Luke 23:43) But if thou art wicked, thou seemest to have Christ, because thou art baptized with the baptism of Christ, because thou approachest to the altar of Christ: but by reason of thy wicked life, thou shalt not have Him alway. It is not thou hast, but ye have, the whole body of wicked men being addressed in Judas.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But what follows? "For the poor ye have always with you, but me ye will not have always." We can certainly understand, "the poor ye have always;" what He has thus said is true. When were the poor wanting in the Church? "But me ye will not have always;" what does He mean by this? How are we to understand, "Me ye will not have always"? Don't be alarmed: it was addressed to Judas. Why, then, did He not say, thou wilt have, but, ye will have? Because Judas is not here a unit. One wicked man represents the whole body of the wicked; in the same way as Peter, the whole body of the good, yea, the body of the Church, but in respect to the good. For if in Peter's case there were no sacramental symbol of the Church, the Lord would not have said to him, "I will give unto thee the keys of the kingdom of heaven: whatsoever thou shalt loose on earth shall be loosed in heaven; and whatsoever thou shalt bind on earth shall be bound in heaven." If this was said only to Peter, it gives no ground of action to the Church. But if such is the case also in the Church, that what is bound on earth is bound in heaven, and what is loosed on earth is loosed in heaven,-for when the Church excommunicates, the excommunicated person is bound in heaven; when one is reconciled by the Church, the person so reconciled is loosed in heaven:-if such, then, is the case in the Church, Peter, in receiving the keys, represented the holy Church. If, then, in the person of Peter were represented the good in the Church, and in Judas' person were represented the bad in the Church, then to these latter was it said, "But me ye will not have always." But what means the "not always;" and what, the "always"? If thou art good, if thou belongest to the body represented by Peter, thou hast Christ both now and hereafter: now by faith, by sign, by the sacrament of baptism, by the bread and wine of the altar. Thou hast Christ now, but thou wilt have Him always; for when thou hast gone hence, thou wilt come to Him who said to the robber, "To-day shalt thou be with me in paradise." But if thou livest wickedly, thou mayest seem to have Christ now, because thou enterest the Church, signest thyself with the sign of Christ, art baptized with the baptism of Christ, minglest thyself with the members of Christ, and approachest His altar: now thou hast Christ, but by living wickedly thou wilt not have Him always.

It may be also understood in this way: "The poor ye will have always with you, but me ye will not have always." The good may take it also as addressed to themselves, but not so as to be any source of anxiety; for He was speaking of His bodily presence. For in respect of His majesty, His providence, His ineffable and invisible grace, His own words are fulfilled, "Lo, I am with you alway, even to the end of the world." But in respect of the flesh He assumed as the Word, in respect of that which He was as the son of the Virgin, of that wherein He was seized by the Jews, nailed to the tree, let down from the cross, enveloped in a shroud, laid in the sepulchre, and manifested in His resurrection, "ye will not have Him always." And why? Because in respect of His bodily presence He associated for forty days with His disciples, and then, having brought them forth for the purpose of beholding and not of following Him, He ascended into heaven and is no longer here. He is there, indeed, sitting at the right hand of the Father; and He is here also, having never withdrawn the presence of His glory. In other words, in respect of His divine presence we always have Christ; in respect of His presence in the flesh it was rightly said to the disciples, "Me ye will not have always." In this respect the Church enjoyed His presence only for a few days: now it possesses Him by faith, without seeing Him with the eyes. In whichever way, then, it was said, "But me ye will not have always," it can no longer, I suppose, after this twofold solution, remain as a subject of doubt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252050.html'
source_title="Tractates on John 50"
