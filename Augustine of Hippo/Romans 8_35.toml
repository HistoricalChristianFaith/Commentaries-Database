[[commentary]]
quote='''
When he says: Who shall separate us from the love of Christ? Tribulation, or distress, or persecution? and the rest, it depends on the earlier statement, where he says: If indeed we suffer together, that we may also be glorified together; for I reckon that the sufferings of this present time are not worthy to be compared with the future glory that shall be revealed in us. For the whole intent of this passage is directed to this exhortation: that those to whom he speaks might not be broken by persecutions, if they were to live according to the prudence of the flesh, by which temporal goods are desired and temporal evils feared.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
