[[commentary]]
quote='''
(Tr. lii. 2) I hear Him say, He that hateth his life in this world, shall keep it unto life eternal; and I am ravished, I despise the world; the whole of this life, however long, is but a vapour in My sight; all temporal things are vile, in comparison with eternal. And again I hear Him say, Now is My soul troubled. Thou biddest my soul follow Thee; but I see Thy soul troubled. What foundation shall I seek, if the Rock gives way? Lord, I acknowledge Thy mercy. Thou of Thy love wast of Thine own will troubled, to console those who are troubled through the infirmity of nature; that the members of Thy body perish not in despair. The Head took upon Himself the affections of His members. He was not troubled by any thing, but, as was said above, He troubled Himself. (c. 11:33)

(Tr. lii) Lastly, let the man who would follow Him, hear at what hour he should follow. A fearful hour has perhaps come: a choice is offered, either to do wrong, or suffer: the weak soul is troubled. Hear our Lord. What shall I say?

(Tr. lii. 3) He teaches thee Whom thou shouldest call on, whose will prefer to thine own. Let Him not seem to fall from His greatness, because He wishes thee to rise from thy meanness. He took upon Him man's infirmity, that He might teach the afflicted to say, Not what I will, but what Thou wilt. Wherefore He adds, But for this cause came I unto this hour. Father, glorify Thy name: i. e. in My passion and resurrection.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
In a word, let the man who would follow learn the road by which he must travel. Perhaps an hour of terrible trial has come, and the choice is set before thee either to do iniquity or endure suffering; the weak soul is troubled, on whose behalf the invincible soul [of Jesus] was voluntarily troubled; set then the will of God before thine own. For notice what is immediately subjoined by thy Creator and thy Master, by Him who made thee, and became Himself for thy teaching that which He made; for He who made man was made man, but He remained still the unchangeable God, and transplanted manhood into a better condition. Listen, then, to what He adds to the words, "Now is my soul troubled." "And what shall I say? Father, save me from this hour: but for this cause came I unto this hour. Father, glorify Thy name." He has taught thee here what to think of, what to say, on whom to call, in whom to hope, and whose will, as sure and divine, to prefer to thine own, which is human and weak. Imagine Him not, therefore, as losing aught of His own exalted position in wishing thee to rise up out of the depths of thy ruin. For He thought it meet also to be tempted by the devil, by whom otherwise He would never have been tempted, just as, had He not been willing, He would never have suffered; and the answers He gave to the devil are such as thou also oughtest to use in times of temptation. And He, indeed, was tempted, but not endangered, that He might show thee, when in danger through temptation, how to answer the tempter, so as not to be carried away by the temptation, but to escape its danger. But when He here said, "Now is my soul troubled;" and also when He says, "My soul is sorrowful, even unto death;" and "Father, if it be possible, let this cup pass from me;" He assumed the infirmity of man, to teach him, when thereby saddened and troubled, to say what follows: "Nevertheless, Father, not as I will, but as Thou wilt." For thus it is that man is turned from the human to the divine, when the will of God is preferred to his own. But to what do the words "Glorify Thy name" refer, but to His own passion and resurrection? For what else can it mean, but that the Father should thus glorify the Son, who in like manner glorifieth His own name in the similar sufferings of His servants? Hence it is recorded of Peter, that for this cause He said concerning him, "Another shall gird thee,and carry thee whither thou wouldest not." because He intended to signify "by what death he should glorify God." Therefore in him, too, did God glorify His name, because thus also does He glorify Christ in His members.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252052.html'
source_title="Tractates on John 52"
