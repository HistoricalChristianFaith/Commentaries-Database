[[commentary]]
quote='''
Matthew then proceeds with his narrative in the same connection as follows: "Then cometh Jesus with them unto a place called Gethsemane." This is mentioned also by Mark. Luke, too, refers to it, although he does not notice the piece of ground by name. For he says: "And He came out, and went, as was His wont, to the Mount of Olives; and His disciples also followed Him. And when He was at the place, He said unto them, Pray that ye enter not into temptation." That is the place which the other two have instanced under the name of Gethsemane. There, we understand, was the garden which John brings into notice when he gives the following narration: "When Jesus had spoken these words, He went forth with His disciples over the brook Cedron, where was a garden, into the which He entered, and His disciples."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 4"
