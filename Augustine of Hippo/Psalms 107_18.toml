
[[commentary]]
quote='''
“Their soul abhorred all manner of meat” (ver. 18). Now they suffer satiety. They are sick of satiety. They are in danger from satiety. Unless perchance thou thinkest they could be killed with famine, but cannot with satiety. See what followeth. When he had said, “Their soul abhorred all manner of meat,” lest thou shouldest think them, as it were, safe of their fulness, and not rather see that they would die of satiety: “And they came near,” he saith, “even unto the gates of death.” What then remaineth? That even when the word of God delighteth thee, thou account it not to thyself; nor for this be puffed up with any sort of arrogance, and having an appetite for food, proudly spurn at those who are in danger from satiety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520107.html'
source_title="Exposition on Psalm 107"
