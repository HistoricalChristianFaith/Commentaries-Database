[[commentary]]
quote='''
“They who trouble me cast me in the teeth.” Again that voice! “While they say daily unto me, Where is thy God?” (ver. 10). And it is principally in the temptations of the Church they say this, “Where is thy God?” How much was this cast in the teeth of the Martyrs! Those men so patient and courageous for the name of Christ, how often was it said to them, “Where is your God?” “Let Him deliver you, if He can.” For men saw their torments outwardly; they did not inwardly behold their crowns! “They who trouble me cast me in the teeth, while they say daily unto me, Where is thy God?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252042.html'
source_title="Exposition on Psalm 42"
