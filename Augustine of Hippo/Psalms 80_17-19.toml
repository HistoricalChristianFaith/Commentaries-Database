[[commentary]]
quote='''
“Let Thy hand be upon the Man of Thy right hand, and upon the Son of Man whom Thou hast strengthened Thyself” (ver. 17). “And we depart not from Thee.…Thou wilt quicken us, and Thy Name we will invoke” (ver. 18). Thou shalt be sweet to us, “Thou wilt quicken us.” For aforetime we did love earth, not Thee: but Thou hast mortified our members which are upon the earth. For the Old Testament, having earthly promises, seemeth to exhort that God should not be loved for nought, but that He should be loved because He giveth something on earth. What dost thou love, so as not to love God? Tell me. Love, if thou canst, anything which He hath not made. Look round upon the whole creation, see whether in any place thou art held with the birdlime of desire, and hindered from loving the Creator, except it be by that very thing which He hath Himself created, whom thou despisest. But why dost thou love those things, except because they are beautiful? Can they be as beautiful as He by whom they were made? Thou admirest these things, because thou seest not Him: but through those things which thou admirest, love Him whom thou seest not. Examine the creation; if of itself it is, stay therein: but if it is of Him, for no other reason is it prejudicial to a lover, than because it is preferred to the Creator. Why have I said this? With reference to this verse, brethren. Dead, I say, were they that did worship God that it might be well with them after the flesh: “For to be wise after the flesh is death:” and dead are they that do not worship God gratis, that is, because of Himself He is good, not because He giveth such and such good things, which He giveth even to men not good. Money wilt thou have of God? Even a robber hath it. Wife, abundance of children, soundness of body, the world’s dignity, observe how many evil men have. Is this all for the sake of which thou dost worship Him? Thy feet will totter, thou wilt suppose thyself to worship without cause, when thou seest those things to be with them who do not worship Him. All these things, I say, He giveth even to evil men, Himself alone He reserveth for good men. “Thou wilt quicken us;” for dead we were, when to earthly things we did cleave; dead we were, when of the earthly man we did bear the image. “Thou wilt quicken us;” Thou wilt renew us, the life of the inward man Thou wilt give us. “And Thy Name we will invoke;” that is, Thee we will love. Thou to us wilt be the sweet forgiver of our sins, Thou wilt be the entire reward of the justified. “O Lord God of virtues, convert us, and show Thy face, and we shall be whole” (ver. 20).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"
