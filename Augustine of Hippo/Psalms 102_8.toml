[[commentary]]
quote='''
“Mine enemies revile me all day, and they that praised me are sworn together against me” (ver. 8). With their mouth they praised, in their heart they were laying snares for me. Hear their praise: “Master, we know that Thou art true, and teachest the way of God in truth, neither carest Thou for any man. Is it lawful to give tribute unto Cæsar, or not?” And whence this evil repute, except because I came to make sinners my members, that by repentance they may be in my body? Thence is all the calumny, thence the persecution. “Why eateth your Master with publicans and sinners? They that be whole need not a physician, but they that be sick.” Would that ye were aware of your sickness, that ye might seek a physician; ye would not slay Him, and through your infatuated pride perish in a false health.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
