
[[commentary]]
quote='''
And you know, brethren, that this death entered into the world through the devil's envy. "God made not death," saith the Scripture, "nor delights He in the destruction of the living; but He created all things to be." But what saith it here? "But by the devil's envy, death entered into the whole world." To the death offered for our entertainment by the devil, man would not come by constraint; for the devil had not the power of forcing, but only cunning to persuade. Hadst thou not consented, the devil had brought in nothing: thy own consenting, O man, led thee to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252012.html'
source_title="Tractates on John 12"
