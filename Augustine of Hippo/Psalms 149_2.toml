[[commentary]]
quote='''
You ask what to rejoice about when you are singing? "Let Israel rejoice in the one who made him," and all he can find to rejoice about is God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252034.html'
source_title="SERMON 34:6"
