[[commentary]]
quote='''
This Psalm doth contain the things which are said to have been done among the old people: but the new and latter people is being admonished, to beware that it be not ungrateful regarding the blessings of God, and provoke His anger against it, whereas it ought to receive His grace.…The Title thereof doth first move and engage our attention. For it is not without reason inscribed, “Understanding of Asaph:” but it is perchance because these words require a reader who doth perceive not the voice which the surface uttereth, but some inward sense. Secondly, when about to narrate and mention all these things, which seem to need a hearer more than an expounder: “I will open,” he saith, “in parables my mouth, I will declare propositions from the beginning.” Who would not herein be awakened out of sleep? Who would dare to hurry over the parables and propositions, reading them as if self-evident, while by their very names they signify that they ought to be sought out with deeper view? For a parable hath on the surface thereof the similitude of something: and though it be a Greek word, it is now used as a Latin word. And it is observable, that in parables, those which are called the similitudes of things are compared with things with which we have to do. But propositions, which in Greek are called προβλήματα, are questions having something therein which is to be solved by disputation. What man then would read parables and propositions cursorily? What man would not attend while hearing these words with watchful mind, in order that by understanding he may come by the fruit thereof?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
