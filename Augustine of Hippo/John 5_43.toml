[[commentary]]
quote='''
But when the Jews suppose that that prophecy belongeth to their visible kingdom, because they know not how to rejoice in the hope of good things unseen, they are about to rush into the snares of him, of whom the Lord saith, “I am come in My Father’s Name, and ye receive Me not: if another shall come in his own name, him ye will receive.” Of whom the Apostle Paul saith: “that Man of Sin shall be revealed, the son of perdition,” etc. And a little after he saith, “Then shall that Wicked be revealed, whom the Lord shall consume with the Spirit of His mouth, and shall destroy with the brightness of His coming,” etc.…Through that Apostate, through him who exalteth himself above all that is called God, or that is worshipped, it seemeth to me, that the carnal people of Israel will suppose that prophecy to be fulfilled, where it is said, “Deliver us, O Lord, and gather us from among the heathen;” that under His guidance, before the eyes of their visible enemies, who had visibly taken them captive, they are to have visible glory. Thus they will believe a lie, because they have not received the love of truth, that they might love not carnal, but spiritual blessings.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
