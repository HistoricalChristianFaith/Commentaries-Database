[[commentary]]
quote='''
What the finger of God is, the Gospel explaineth to us; for the finger of God is the Holy Ghost. How do we prove this? Our Lord, when answering those who accused Him of casting out devils in the name of Beelzebub, saith, “If I cast out devils by the Spirit of God;” and another Evangelist, in relating the same saying, saith, “If I with the finger of God cast out devils.” What therefore is in one stated clearly, is darkly expressed in another. Thou didst not know what was the finger of God, but another Evangelist explains it by terming it the Spirit of God. The Law then written by the finger of God was given on the fiftieth day after the slaughter of the lamb, and the Holy Ghost descended on the fiftieth day after the Passion of our Lord Jesus Christ. The Lamb was slain, the Passover was celebrated, the fifty days were completed, and the Law was given. But that Law was to cause fear, not love: but that fear might be changed into love, He who was truly righteous was slain: of whom that lamb whom the Jews were slaying was the type. He arose from the dead: and from the day of our Lord’s Passover, as from that of the slaying of the Paschal lamb, fifty days are counted; and the Holy Ghost descended, now in the fulness of love, not in the punishment of fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"
