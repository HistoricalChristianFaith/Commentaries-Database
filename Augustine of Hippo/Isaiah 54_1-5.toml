[[commentary]]
quote='''
What, then, do these men, who are at once the perverse applauders of Christ and the slanderers of Christians, say to these facts? Can it be that Christ, by the use of magical arts, caused those predictions to be uttered so long ago by the prophets? or have His disciples invented them? Is it thus that the Church, in her extension among the Gentile nations, though once barren, has been made to rejoice now in the possession of more children than that synagogue had which, in its Law or its King, had received, as it were, a husband? or is it thus that this Church has been led to enlarge the place of her tent, and to occupy all nations and tongues, so that now she lengthens her cords beyond the limits to which the rights of the empire of Rome extend, yea, even on to the territories of the Persians and the Indians and other barbarous nations? or that, on the right hand by means of true Christians, and on the left hand by means of pretended Christians, His name is being made known among such a multitude of peoples? or that His seed is made to inherit the Gentiles, so as now to inhabit cities which had been left desolate of the true worship of God and the true religion? or that His Church has been so little daunted by the threats and furies of men, even at times when she has been covered with the blood of martyrs, like one clad in purple array, that she has prevailed over persecutors at once so numerous, so violent, and so powerful? or that she has not been confounded, like one put to shame, when it was a great crime to be or to become a Christian? or that she is made to forget her confusion for ever, because, where sin had abounded, grace did much more abound? or that she is taught not to remember the shame of her widowhood, because only for a little was she forsaken and subjected to opprobrium, while now she shines forth once more with such eminent glory? or, in fine, is it only a fiction concocted by Christ's disciples, that the Lord who made her, and brought her forth from the denomination of the devil and the demons, the very God of Israel is now called the God of the whole earth; all which, nevertheless, the prophets, whose books are now in the hands of the enemies of Christ, foretold so long before Christ became the Son of man?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25201.html'
source_title="The Harmony of the Gospels, Book 1, Chapter 32"
