[[commentary]]
quote='''
There followeth: “Thou wilt feed us with the bread of tears, and wilt give us to drink with tears in measure” (ver. 5). What is, “in measure”? Hear the Apostle: “Faithful is God, who doth not suffer you to be tempted above that ye are able to bear.” The measure is, according to your powers: the measure is, that thou be instructed, not that thou be crushed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"
