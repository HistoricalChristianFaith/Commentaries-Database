[[commentary]]
quote='''
The works, then, are doubtless those miracles of healing in connection with their bodily complaints which He exhibited to such an extent as no one before had furnished amongst them: for these they saw, and it is in reproaching them therewith that He proceeds to say, "But now have they both seen and hated both me and my Father: but [this cometh to pass] that the word might be fulfilled that is written in their law, They hated me without a cause [gratuitously]." He calls it, their law, not as invented by them, but given to them: just as we say, "Our daily bread;" which, nevertheless, we ask of God in conjoining the words "Give us." But one hates gratuitously who neither seeks advantage from the hatred nor avoids inconvenience: so do the wicked hate the Lord; and so also is He loved by the righteous, that is to say, gratuitously [gratis, freely,] inasmuch as they expect no other gifts beyond Himself, for He Himself will be all in all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252091.html'
source_title="Tractates on John 91"
