[[commentary]]
quote='''
The Church saith also what followeth, “Mine eyes have prevented the morning watch, that I might meditate on Thy words” (ver. 148). Let us suppose the morning to mean the season when “a light arose for them that sat in the shadow of death;” did not the eyes of the Church prevent this morning watch, in those Saints who before were on earth, because they foresaw beforehand that this would come to pass, so that they meditated on the words of God, which then were, and announced these things to be destined in the Law and the Prophets?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
