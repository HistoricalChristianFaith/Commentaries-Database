[[commentary]]
quote='''
“And they shall know how God shall have dominion of Jacob, and of the ends of the earth” (ver. 13). For before they thought themselves just men, because the Jewish nation had received the Law, because it had kept the commandments of God: it is proved to them that it hath not kept them, since in the very commandments of God Christ it perceived not, because “blindness in part has happened to Israel.” Even the Jews themselves see that they ought not to despise the Gentiles, of whom they deemed as of dogs and sinners. For just as alike they have been found in iniquity, so alike they will attain unto salvation. “Not only to Jews,” saith the Apostle, “but also even to Gentiles.” For to this end the Stone which the builders set at nought, hath even been made for the Head of the corner, in order that two in itself It might join: for a corner doth unite two walls. The Jews thought themselves exalted and great: of the Gentiles they thought as weak, as sinners, as the servants of demons, as the worshippers of idols, and yet in both was there iniquity. Even the Jews have been proved sinners; because “there is none that doeth good, there is not even so much as one:” they have laid down their pride, and have not envied the salvation of the Gentiles, because they have known their own and their weakness to be alike: and in the Corner Stone being united, they have together worshipped the Lord.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"
