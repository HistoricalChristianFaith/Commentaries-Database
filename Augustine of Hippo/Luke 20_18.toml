[[commentary]]
quote='''
Because then it had not yet increased, they stumbled at Him as at a stone: and that happened in them which is written, "Whosoever shall fall upon that stone shall be broken; but on whomsoever that stone shall fall, it will grind them to powder." At first they fell upon Him lowly: as the lofty One He shall come upon them; but that He may grind them to powder when He comes in His exaltation, He first broke them in His lowliness. They stumbled at Him, and were broken; they were not ground, but broken: He will come exalted and will grind them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25204.html'
source_title="Tractates on John 4"
