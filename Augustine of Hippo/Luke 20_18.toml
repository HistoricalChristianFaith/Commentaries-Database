[[commentary]]
quote='''
Because then it had not yet increased, they stumbled at Him as at a stone: and that happened in them which is written, "Whosoever shall fall upon that stone shall be broken; but on whomsoever that stone shall fall, it will grind them to powder." At first they fell upon Him lowly: as the lofty One He shall come upon them; but that He may grind them to powder when He comes in His exaltation, He first broke them in His lowliness. They stumbled at Him, and were broken; they were not ground, but broken: He will come exalted and will grind them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25204.html'
source_title="Tractates on John 4"

[[commentary]]
quote='''
For it was a great thing for the Jews to see the stone. For the stone was yet small: and small they deservedly despised it, and despising they stumbled, and stumbling they were broken; remains that they be ground to powder. For so was it said of the stone, “Whosoever shall fall upon that stone shall be broken; but on whomsoever it shall fall, it will grind him to powder.” It is one thing to be broken, another to be ground to powder. To be broken is less than to be ground to powder: but none grindeth He coming exalted, save whom He brake lying low. For now before His coming He lay low before the Jews, and they stumbled at Him, and were broken; hereafter shall He come in His Judgment, glorious and exalted, great and powerful, not weak to be judged, but strong to judge, and grind to powder those who were broken stumbling at Him. For “A stone of stumbling and a rock of offence,” is He to them that believe not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"

[[commentary]]
quote='''
Christ will come, but He will come as Judge; the first time to call, afterwards to sever. He will come, because He hath come, and that He will come is evident; but hereafter from above He will come. Before thee He was, O Israel. Thou wast bruised because thou didst stumble against Him lying down: that thou mayest not be ground to powder, observe Him coming from above. For thus it was foretold by the prophet: “Whoever shall stumble upon that stone shall be bruised, and upon whomsoever it shall have come, it shall grind him to powder.” He doth bruise when little, He shall grind to powder when great.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252074.html'
source_title="Exposition on Psalm 74"

[[commentary]]
quote='''
These kings He wounded by His glory, and by the weight of His Name made kings weak, so that they had not power to effect what they wished. For they strove amain to blot out the Christian name from the earth, and could not; for “Whosoever shall fall on this stone shall be broken.” Kings therefore fall on this “stone of offence,” and are therefore wounded, when they say, Who is Christ? I know not what Jew or what Galilean He may have been, who died, who was slain in such a manner! The stone is before thy feet, lying, so to speak, mean and humble: therefore by scorning thou dost stumble, by stumbling thou fallest, by falling thou art wounded.…“But on whomsoever it shall fall, it will grind him to powder.” When therefore any one falleth upon it, it lieth as it were low; it then woundeth: but when it shall grind him to powder, then it will come from above. See how in these two words, it shall wound him and grind him to powder: he striketh upon it, and it shall come down upon him: are distinguished the two seasons, of the humiliation and the majesty of Christ, of hidden punishment and future judgment. He will not crush, when He cometh, that man whom He doth not wound when He lieth in a contemptible appearance.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520110.html'
source_title="Exposition on Psalm 110"
