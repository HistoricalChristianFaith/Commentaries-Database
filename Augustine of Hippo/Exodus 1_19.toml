[[commentary]]
quote='''
Many lies indeed seem to be for some one’s safety or advantage, spoken not in malice, but in kindness: such was that of those midwives in Exodus, who gave a false report to Pharaoh, to the end that the infants of the children of Israel might not be slain. But even these are praised not for the fact, but for the disposition shown; since those who only lie in this way, will attain in time to a freedom from all lying. For in those that are perfect, not even these lies are found. For to these it is said, “Let there be in your mouth, yea, yea; nay, nay; whatsoever is more, is of evil.” Nor is it without reason written in another place, “The mouth that lieth slayeth the soul:” lest any should imagine that the perfect and spiritual man ought to lie for this temporal life, in the death of which no soul is slain, neither his own, nor another’s. But since it is one thing to lie, another to conceal the truth (if indeed it be one thing to say what is false, another not to say what is true), if haply one does not wish to give a man up even to this visible death, he should be prepared to conceal what is true, not to say what is false; so that he may neither give him up, nor yet lie, lest he slay his own soul for another’s body. But if he cannot yet do this, let him at all events admit only lies of such necessity, that he may attain to be freed even from these, if they alone remain, and receive the strength of the Holy Ghost, whereby he may despise all that must be suffered for the truth’s sake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25205.html'
source_title="Exposition on Psalm 5"
