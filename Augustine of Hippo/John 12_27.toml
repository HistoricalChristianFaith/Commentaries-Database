[[commentary]]
quote='''
After the Lord Jesus Christ, in the words of yesterday's lesson, had exhorted His servants to follow Him, and had predicted His own passion in this way, that unless a corn of wheat fall into the ground and die, it abideth alone; but if it die, it bringeth forth much fruit; and also had stirred up those who wished to follow Him to the kingdom of heaven, to hate their life in this world if their thought was to keep it unto life eternal,-He again toned down His own feelings to our infirmity and says, where our lesson to-day commenced, "Now is my soul troubled." Whence, Lord, was Thy soul troubled? He had, indeed, said a little before, "He that hateth his life [soul] in this world shall keep it unto life eternal." Dost thou then love thy life in this world, and is thy soul troubled as the hour approacheth when thou shalt leave this world? Who would dare affirm this of the soul [life] of the Lord? We rather it was whom He transferred unto Himself; He took us into His own person as our Head, and assumed the feelings of His members; and so it was not by any others He was troubled, but, as was said of Him when He raised Lazarus, "He was troubled in Himself." For it behoved the one Mediator between God and men, the man Christ Jesus, just as He has lifted us up to the heights of heaven, to descend with us also into the lowest depths of suffering.

I hear Him saying a little before, "The hour cometh that the Son of man should be glorified: if a corn of wheat die, it bringeth forth much fruit." I hear this also, "He that hateth his life in this world shall keep it unto life eternal." Nor am I permitted merely to admire, but commanded to imitate, and so, by the words that follow, "If any man serve me, let him follow me; and where I am, there shall also my servant be," I am all on fire to despise the world, and in my sight the whole of this life, however lengthened, becomes only a vapor; in comparison with my love for eternal things, all that is temporal has lost its value with me. And now, again, it is my Lord Himself, who by such words has suddenly transported me from the weakness that was mine to the strength that was His, that I hear saying, "Now is my soul troubled." What does it mean? How biddest Thou my soul follow Thee if I behold Thine own troubled? How shall I endure what is felt to be heavy by strength so great? What is the kind of foundation I can seek if the Rock is giving way? But methinks I hear in my own thoughts the Lord giving me an answer, saying, Thou shalt follow me the better, because it is to aid thy power of endurance that I thus interpose. Thou hast heard, as addressed to thyself, the voice of my fortitude hear in me the voice of thy infirmity: I supply strength for thy running, and I check not thy hastening, but I transfer to myself thy causes for trembling, and I pave the way for thy marching along. O Lord our Mediator, God above us, man for us, I own Thy mercy For because Thou, who art so great, art troubled through the good will of Thy love, Thou preservest, by the richness of Thy comfort, the many in Thy body who are troubled by the continual experience of their own weakness, from perishing utterly in their despair.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252052.html'
source_title="Tractates on John 52"
