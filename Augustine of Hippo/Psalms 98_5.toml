[[commentary]]
quote='''
“Make melody unto the Lord upon the harp: on the harp and with the voice of a Psalm” (ver. 5). Praise Him not with the voice only; take up works, that ye may not only sing, but work also. He who singeth and worketh, maketh melody with psaltery and upon the harp.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252098.html'
source_title="Exposition on Psalm 98"
