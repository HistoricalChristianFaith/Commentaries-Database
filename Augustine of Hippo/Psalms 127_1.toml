[[commentary]]
quote='''
But someone, perhaps, will say, "I did indeed receive faith, but it is I who have guarded and kept it." You perhaps say this, whoever you are, listening to all this and having no sense: "I received faith, but it is I who have guarded and kept it." It is not what our Paul says, "It is I who have guarded and kept it." He had his eyes, you see, on [the words] "unless the Lord keeps watch over the city, he labors in vain who guards it." Labor, by all means, guard it; but it is good for you that you are being guarded. Because you are not up to guarding yourself. If you are left to yourself, you will doze off and fall asleep. "He," though, "does not doze nor sleep, the one who guards Israel."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520297.html'
source_title="SERMON 297:7"

[[commentary]]
quote='''
Among all the Songs entitled the Song of degrees, this Psalm hath a further addition in the title, that it is “Solomon’s.” For thus it is entitled, “A Song of degrees of Solomon.” It hath therefore aroused our attention, and caused us to enquire the reason of this addition, “of Solomon.” For it is needless to repeat explanations of the other words, Song of degrees.…Solomon was in his time David’s son, a great man, through whom many holy precepts and healthful admonitions and divine mysteries have been wrought by the Holy Spirit in the Scriptures. Solomon himself was a lover of women, and was rejected by God: and this lust was so great a snare unto him, that he was induced by women even to sacrifice to idols, as Scripture witnesseth concerning him. But if, by his fall what was delivered through him were blotted out, it would be judged that he had himself delivered these precepts, and not that they were delivered through him. The mercy of God, therefore, and His Spirit, excellently wrought that whatever of good was declared through Solomon, might be attributed unto God; and the man’s sin, unto the man. What marvel that Solomon fell among God’s people? Did not Adam fall in Paradise? Did not an angel fall from heaven, and become the devil? We are thereby taught, that no hope must be placed in any among men.…The name of Solomon is interpreted to mean peacemaker: now Christ is the True Peacemaker, of whom the Apostle saith, “He is our Peace, who hath made both one.”…Since, therefore, He is the true Solomon; for that Solomon was the figure of this Peace maker, when he built the temple; that thou mayest not think he who built the house unto God was the true Solomon, Scripture showing unto thee another Solomon, thus commences this Psalm: “Except the Lord build the house, their labour is but lost that build it” (ver. 1). The Lord, therefore, buildeth the house, the Lord Jesus Christ buildeth His own house. Many toil in building: but, except He build, “their labour is but lost that build it.” Who are they who toil in building it? All who preach the word of God in the Church, the ministers of God’s mysteries. We are all running, we are all toiling, we are all building now; and before us others have run, toiled, and built: but “except the Lord build, their labour is but lost.” Thus the Apostles seeing some fall bewailed these men, in that they had laboured in vain for them. We, therefore, speak without, He buildeth within. We can observe with what attention ye hear us; He alone who knoweth your thoughts, knoweth what ye think. He Himself buildeth, He Himself admonisheth, He Himself openeth the understanding, He Himself kindleth your understanding unto faith; nevertheless, we also toil like workmen; but, “except the Lord build,” etc.

But that which is the house of God is also a city. For the house of God is the people of God; for the house of God is the temple of God.…This is Jerusalem: she hath guards: as she hath builders, labouring at her building up, so also hath she guards. To this guardianship these words of the Apostle relate: “I fear, lest by any means your minds should be corrupted from the simplicity which is in Christ.” He was guarding the Church. He kept watch, to the utmost of his power, over those over whom he was set. The Bishops also do this. For a higher place was for this reason given the Bishops, that they might be themselves the superintendents and as it were the guardians of the people. For the Greek word Episcopus, and the vernacular Superintendent, are the same; for the Bishop superintends, in that he looks over. As a higher place is assigned to the vinedresser in the charge of the vineyard, so also to the Bishops a more exalted station is alloted. And a perilous account is rendered of this high station, except we stand here with a heart that causeth us to stand beneath your feet in humility, and pray for you, that He who knoweth your minds may be Himself your keeper. Since we can see you both coming in and going out; but we are so unable to see what are the thoughts of your hearts, that we cannot even see what ye do in your houses. How then can we guard you? As men: as far as we are able, as far as we have received power. And because we guard you like men, and cannot guard you perfectly, shall ye therefore remain without a keeper? Far be it! For where is He of whom it is said, “Except the Lord keep the city, the watchman waketh but in vain?” (ver. 1). We are watchful on our guard, but vain in our watchfulness, except He who seeth your thoughts guard you. He keepeth guard while ye are awake, He keepeth guard also whilst ye are asleep. For He hath once slept on the Cross, and hath risen again; He no longer sleepeth. Be ye Israel: for “the Keeper of Israel neither sleepeth nor slumbereth.” Yea, brethren, if we wish to be kept beneath the shadow of God’s wings, let us be Israel. For we guard you in our office of stewards; but we wish to be guarded together with you. We are as it were shepherds unto you; but beneath that Shepherd we are fellow-sheep with you. We are as it were your teachers from this station; but beneath Him, the One Master, we are schoolfellows with you in this school.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520127.html'
source_title="Exposition on Psalm 127"
