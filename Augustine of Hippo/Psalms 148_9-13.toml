[[commentary]]
quote='''
Then he mentioneth, that they may praise the Lord, “mountains and hills, fruitful trees and all cedars” (ver. 9): “beasts and all cattle, creeping things, and winged fowls” (ver. 10). Then he goeth to men; “kings of the earth and all people, princes and all judges of the earth” (ver. 11): “young men and maidens, old men and young, let them praise the Name of the Lord” (ver. 12). Ended is the praise from heaven, ended is the praise from earth. “For His Name only is exalted” (ver. 13). Let no man seek to exalt his own name. Wilt thou be exalted? Subject thyself to Him who cannot be humbled. “His confession is in earth and heaven” (ver. 14). What is “His confession”? Is it the confession wherewith He confesseth? No, but that whereby all things confess Him, all things cry aloud: the beauty of all things is in a manner their voice, whereby they praise God. The heaven crieth out to God, “Thou madest me, not I myself.” Earth crieth out, “Thou createdst me, not I myself.” How do they cry out? When thou regardest them, and findest this out, they cry out by thy voice, they cry out by thy regard. Regard the heavens, it is beautiful: observe the earth, it is beautiful: both together are very beautiful. He made them, He ruleth them, by His nod they are swayed, He ordereth their seasons, He reneweth their movements, by Himself He reneweth them. All these things then praise Him, whether in stillness or in motion, whether from earth below or from heaven above, whether in their old state or in their renewal. When thou seest all these things, and rejoicest, and art lifted up to the Maker, and gazest on “His invisible things understood by the things which are made,” “His confession is in earth and heaven:” that is, thou confesseth to Him from things on earth, thou confesseth to Him from things in heaven. And since He made all things, and nought is better than He, whatsoever He made is less than He, and whatsoever in these things pleaseth thee, is less than He. Let not then what He hath made so please thee, as to withdraw thee from Him who made: if thou lovest what He made, love much more Him who made. If the things which He hath made are beautiful, how much more beautiful is He who made them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520148.html'
source_title="Exposition on Psalm 148"
