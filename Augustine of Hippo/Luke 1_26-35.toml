[[commentary]]
quote='''
After the enumeration of the generations, Matthew proceeds thus: Now the birth of Christ was on this wise. Whereas His mother Mary was espoused to Joseph, before they came together, she was found with child of the Holy Ghost. What Matthew has omitted to state here regarding the way in which that came to pass, has been set forth by Luke after his account of the conception of John. His narrative is to the following effect: And in the sixth month the angel Gabriel was sent from God unto a city of Galilee named Nazareth, to a virgin espoused to a man whose name was Joseph, of the house of David: and the virgin's name was Mary. And the angel came in unto her, and said, Hail, thou that art full of grace, the Lord is with thee: blessed art thou among women. And when she saw these things, she was troubled at his saying, and cast in her mind what manner of salutation this should be. And the angel said unto her: Fear not, Mary; for thou hast found favour with God. Behold, thou shalt conceive in thy womb, and bring forth a son, and shalt call His name Jesus. He shall be great, and shall be called the Son of the Highest; and the Lord God shall give unto Him the throne of His father David: and He shall reign in the house of Jacob for ever; and of His kingdom there shall be no end. Then said Mary unto the angel, How shall this be, seeing I know not a man? And the angel answered and said unto her, The Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee: therefore also that holy thing which shall be born shall be called the Son of God; and then follow matters not belonging to the question at present in hand. Now all this Matthew has recorded [summarily], when he tells us of Mary that "she was found with child of the Holy Ghost." Neither is there any contradiction between the two evangelists, in so far as Luke has set forth in detail what Matthew has omitted to notice; for both bear witness that Mary conceived by the Holy Ghost. And in the same way there is no want of concord between them, when Matthew, in his turn, connects with the narrative something which Luke leaves out. For Matthew proceeds to give us the following statement: Then Joseph, her husband, being a just man, and not willing to make her a public example, was minded to put her away privily. But while he thought on these things, behold, the angel of the Lord appeared unto him in a dream, saying, Joseph, thou son of David, fear not to take unto thee Mary thy wife, for that which is conceived in her is of the Holy Ghost. And she shall bring forth a son, and thou shalt call His name Jesus; for He shall save His people from their sins. Now all this was done that it might be fulfilled which was spoken of the Lord by the prophet, saying, Behold, a virgin shall be with child, and shall bring forth a son; and His name shall be called Emmanuel, which, being interpreted, is, God with us. Then Joseph, being raised from sleep, did as the angel of the Lord had bidden him, and took unto him his wife; and knew her not till she had brought forth her first-born son; and he called His name Jesus. Now when Jesus was born in Bethlehem of Judæa, in the days of Herod the king, and so forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 5"
