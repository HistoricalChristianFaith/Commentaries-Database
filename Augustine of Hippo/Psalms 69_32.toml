[[commentary]]
quote='''
“Let the needy see and rejoice” (ver. 32). Let them believe, and in hope be glad. Let them be more needy, in order that they may deserve to be filled: lest while they belch out pride’s satiety, there be denied them the bread whereon they may healthily live. “Seek the Lord,” ye needy, hunger ye and thirst; for He is Himself the living bread that came down from Heaven. “Seek ye the Lord, and your soul shall live.” Ye seek bread, that your flesh may live: the Lord seek ye, that your soul may live.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
