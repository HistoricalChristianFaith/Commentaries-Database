[[commentary]]
quote='''
But is Christ king only of the Jews, or of the Gentiles also? Yes, of the Gentiles also. For when He said in prophecy, "I am set king by Him upon His holy hill of Zion, declaring the decree of the Lord," that no one might say, because of the hill of Zion, that He was set king over the Jews alone, He immediately added, "The Lord said unto me, Thou art my Son; this day have I begotten Thee. Ask of me, and I will give Thee the Gentiles for Thine inheritance, and the uttermost parts of the earth for Thy possession." Whence He Himself, speaking now with His own lips among the Jews, said, "Other sheep I have which are not of this fold; them also I must bring, and they shall hear my voice, and there shall be one flock and one Shepherd."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520117.html'
source_title="Tractates on John 117"

[[commentary]]
quote='''
Let them run then, kings after a king; kings, let them acknowledge the King. Therefore saith He elsewhere, “Yet have I been set by Him a King upon His holy hill of Sion.”…A King then was heard of, set up in Sion, to Him were delivered possessions even to the uttermost parts of the earth. Kings behoved to fear lest they should lose the kingdom, lest the kingdom be taken from them. As wretched Herod feared, and for the Child slew the children. But fearing to lose his kingdom, he deserved not to know the King. Would that he too had adored the King with the Magi: not by ill-seeking the kingdom, slain the Innocents, and perished guilty. For as concerning him, he destroyed the Innocents: but as for Christ, even a Child, the children dying for Him did He crown. Therefore behoved kings to fear when it was said, “Yet have I been set a King by Him upon His holy hill of Sion,” and inheritance to the uttermost parts of the earth shall He give Him, who set Him up King.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
