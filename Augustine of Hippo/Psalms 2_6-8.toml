[[commentary]]
quote='''
But is Christ king only of the Jews, or of the Gentiles also? Yes, of the Gentiles also. For when He said in prophecy, "I am set king by Him upon His holy hill of Zion, declaring the decree of the Lord," that no one might say, because of the hill of Zion, that He was set king over the Jews alone, He immediately added, "The Lord said unto me, Thou art my Son; this day have I begotten Thee. Ask of me, and I will give Thee the Gentiles for Thine inheritance, and the uttermost parts of the earth for Thy possession." Whence He Himself, speaking now with His own lips among the Jews, said, "Other sheep I have which are not of this fold; them also I must bring, and they shall hear my voice, and there shall be one flock and one Shepherd."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520117.html'
source_title="Tractates on John 117"
