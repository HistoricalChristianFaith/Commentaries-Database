[[commentary]]
quote='''
Even prayers are often hindered by vain thoughts, so that the heart scarcely remains fixed on God: and it would hold itself so as to be fixed, and somehow flees from itself, and finds no frames in which it can enclose itself, no bars by which it may keep in its flights and wandering movements, and stand still to be made glad by its God. Scarcely does one such prayer occur amongst many. Each one might say that this happened to him, but that it happened not to others, if we did not find in the holy Scripture David praying in a certain place, and saying, “Since I have found my heart, O Lord, so that I might pray unto Thee.” He said that he had found his heart, as if it were wont to flee from him, and he to follow it like a fugitive, and not be able to catch it, and to cry to God, “For my heart hath deserted me.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
