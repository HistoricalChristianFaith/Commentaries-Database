[[commentary]]
quote='''
Furthermore, they who deride His Cross, by devils, as by beasts, are devoured. For this also a certain Scripture signified. When God’s Prophet Elisha was going up, children called after him mocking, “Go up thou bald head, Go up thou bald head:” but he, not so much in cruelty as in mystery, made those children to be devoured by bears out of the wood. If those children had not been devoured, would they have lived even till now? Or could they not, being born mortal, have been taken off by a fever? But so in them had no mystery been shown, whereby posterity might be put in fear. Let none then mock the Cross of Christ. The Jews were possessed by devils, and devoured; for in the place of Calvary, crucifying Christ, and lifting on the Cross, they said as it were with childish sense, not understanding what they said, “Go up, thou bald head.” For what is, “Go up”? “Crucify Him, Crucify Him.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252047.html'
source_title="Exposition on Psalm 47"
