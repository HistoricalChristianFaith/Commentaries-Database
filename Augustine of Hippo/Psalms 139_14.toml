[[commentary]]
quote='''
“I will confess to Thee, O Lord, for terribly hast Thou been made wonderful: wondrous are Thy works, and my soul knoweth it right well” (ver. 14). Aforetime “Thy knowledge was made wonderful from me, it had waxed great, nor could I attain unto it.” From me then “it had waxed great.” Whence doth “my soul” now “know right well,” save because the “night is light in my delight?” save because Thy grace hath come unto me, and enlightened my darkness? save because Thou hast possessed my reins? save because Thou hast taken me up from my mother’s womb?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520139.html'
source_title="Exposition on Psalm 139"
