[[commentary]]
quote='''
"Verily, verily, I say unto you, The Son cannot of Himself do anything, but what He seeth the Father doing; for what things soever He has done, these also the Son doeth in like manner." Yes, the heaven, the earth, the sea; the things that are in heaven, on the earth, and in the sea; the visible and invisible, the animals on the land, the plants in the fields, the creatures that swim in the waters, that fly in the air, that shine in heaven; besides all these, angels, virtues, thrones, dominations, principalities, powers; "all were made by Him." Did God make all these, and show them when made to the Son, that He also should make another world full of all these? Certainly not. But, on the contrary, what does He say? "For what things soever He has made, these," not others, but "these also the Son doeth," not differently, "but in like manner." "For the Father loveth the Son, and showeth Him all things which Himself doeth." The Father showeth to the Son that souls may be raised, for souls are raised up by the Father and the Son; nor can souls live except God be their life. If souls, then, cannot live unless God be their life, just as themselves are the life of bodies; what the Father shows to the Son, that is, what He doeth, He doeth through the Son. For it is not by doing that He shows to the Son, but by showing He doeth through the Son. For the Son sees the Father showing before anything is done; and from the Father's showing and the Son's vision, is done what is done by the Father through the Son. So are souls raised up, if they can see that conjunction of unity, the Father showing, the Son seeing, and the creature made by the Father's showing and the Son's seeing; and that thing made by the Father's showing and the Son's seeing, which is neither the Father nor the Son, but beneath the Father and the Son, whatever is made by the Father through the Son. Who sees this?

Behold, again we humble ourselves to carnal notions, and descend to you, if indeed we had at any time ascended somewhat from you. Thou wishest to show something to thy son, that he may do what thou doest; thou art about to do, and thus to show the thing. Therefore, what thou art about to do, in order to show it to thy son, thou doest not surely by thy son; but thou alone doest that thing which, when done, he may see, and do another such thing in like manner. This is not the case there; why goest thou on to thy own similitude, and blottest out the similitude of God within thee? There, the case is wholly otherwise. Find a case in which thou showest to thy son what thou doest before thou doest it; so that, after thou hast shown it, it will be by the son thou doest. Perhaps something like this now occurs to thee: Lo, sayest thou, I think to make a house, and I wish it to be built by my son: before I build it myself, I point out to my son what I mean to do: both he doeth, and I too by him to whom I pointed out my wish. Thou hast retreated, indeed, from the former similitude, but still thou liest in great dissimilitude. For, lo, before thou canst make the house. thou dost inform thy son, and point out to him what thou meanest to do; that, upon thy showing before thou makest, he may make what thou hast shown, and so thou mayest make by him: but thou wilt speak words to thy son, words will have to pass between thee and him; between the person showing and the person seeing, between speaker and hearer, flies articulate sound, which is not what thou art, nor what he is. That sound, indeed, which goes out of thy mouth, and by the concussion of the air touches thy son's ear, and filling the sense of hearing, conveys thy thought to his heart that sound, I say, is not thyself, nor thy son. A sign is given from thy mind to thy son's mind, but that sign not either thy mind or thy son's mind, but something else. Is it thus that we think the Father has spoken to the Son? Were there words between the Father and the Word? Then how is it? Or, whatever the Father would say to the Son, if He would say it by a word, the Son Himself is the Word of the Father, would He speak by a word to the Word? Or, since the Son is the great Word, had smaller words to pass between the Father and Son? Was it so, that some sound, as it were a temporal, fleeting creature, had to issue from the mouth of the Father, and strike upon the ear of the Son? Has God a body, that this should proceed, as it were, from His lips? And has the Word the ears of a body, into which sound may come? Lay aside all notions of corporeal forms, regard simplicity, if thou art single. minded. But how wilt thou be single-minded? If thou wilt not entangle thyself with the world. but disentangle thyself from the world. For by disentangling thyself, thou wilt be single-minded. And see, if thou canst, what I say; or if thou canst not, believe what thou dost not see. Thou speakest to thy son; thou speakest by a word: neither art thou, nor is thy son, the word that sounds.

I have, sayest thou, another method of showing; for so well instructed is my son, that he hears without my speaking, but I show him by a nod what to do. Lo, show him by a nod what thou wilt, yet certainly the mind holds within itself that which it would show. By what dost thou give this nod? With the body,-namely, with the lips, the look, the brows, the eyes, the hands. All these are not what thy mind is: these, too, are media; there was something understood by these signs which are not what thy mind is, not what the mind of thy son is; but all this which thou doest by the body is beneath thy mind, and beneath the mind of thy son: nor can thy son know thy mind, unless thou give him signs by the body. What, then, do I say? This is not the case there; there all is simplicity. The Father shows to the Son what He is doing, and by showing begets the Son. I see what I have said; but because I see also to whom I have said it, may such understanding be some time or other formed in you as to grasp it. If ye are not able now to comprehend what God is, comprehend at least what God is not: you will have made much progress, if you think of God as being not something other than He is. God is not a body, not the earth, not the heaven, not the moon, or sun, or stars-not these corporeal things. For if not heavenly things, how much less is He earthly things! Put all body out of the question. Further, hear another thing: God is not a mutable spirit. For I confess,-and it must be confessed, for it is the Gospel that speaks it,-" God is a Spirit." But pass beyond all mutable spirit, beyond all spirit that now knows, now knows not; that now remembers, now forgets; that wills what before it willed not, that wills not what before it willed; either that suffers these mutabilities now or may suffer them: pass beyond all these. Thou findest not any mutability in God; nor aught that may have been one way before, and is otherwise now. For where thou findest alternation, there a kind of death has taken place: since, for a thing not to be what it was, is a death. The soul is said to be immortal; so indeed it is, because it ever lives, and there is in it a certain continuous life, but yet a mutable life. According to the mutability of this life, it may be said to be mortal; because if it lived wisely, and then becomes foolish, it dies for the worse; if it lived foolishly, and becomes wise, it dies for the better. For the Scripture teaches us that there is a death for the worse, and that there is a death for the better. In any case, they had died for the worse, of whom it said, "Let the dead bury their dead;" and, "Awake, thou that sleepest, and arise from the dead, and Christ shall give thee light;" and from this passage before us, "When the dead shall hear, and they that hear shall live." For the worse they had died; therefore do they come to life again. By coming to life they die for the better, because by coming to life again they will not be what they were; but for that to be, which was not, is death. But perhaps it is not called death if it is for the better? The apostle has called that death: "But if ye be dead with Christ from the elements of this world, why do ye judge concerning this world as if ye were still living?" And again, "For ye are dead, and your life is hid with Christ in God." He wishes us to die that we may live, because we have lived to die. Whatever therefore dies, both from better to worse, and from worse to better, is not God; because neither can supreme goodness proceed to better, nor true eternity to worse. For true eternity is, where is nothing of time. But was there now this, now that? Immediately time is admitted, it is not eternal. For that ye may know that God is not thus, as the soul is,-certainly the soul is immortal,-what, however, saith the apostle of God, "Who alone hath immortality," unless that he openly says this, He alone hath unchangeableness, because He alone hath true eternity? Therefore no mutability is there.

Recognize in thyself something which I wish to say within, in thyself; not within as if in thy body, for in a sense one may say, "in thyself." For there is in thee health, thy age whatever it be, but this in regard to the body. In thee is thy hand and thy foot; but there is one thing in thee, within; another thing in thee as in thy garment. But leave outside thy garment and thyself, descend into thyself, go to thy secret place, thy mind, and there see, if thou canst, what I wish to say. For if thou art far from thyself, how canst thou come near to God? I was speaking of God, and thou believedst that thou wouldst understand. I am speaking of the soul, I am speaking of thyself: understand this, there I will try thee. For I do not travel very far for examples, when I mean to give thee some similitude to thy God from thy own mind; because surely not in the body, but in that same mind, was man made after the image of God. Let us seek God in His own similitude; let us recognize the Creator in His own image. There within, if we can, let us find this that we speak of,-how the Father shows to the Son, and how the Son sees what the Father shows, before anything is made by the Father through the Son. But when I shall have spoken, and thou hast understood, thou must not think that spoken of to be something just such as our example, that thou mayest therein keep piety, which I wish to be kept by thee, and earnestly admonish thee to keep: that is, if thou art not able to comprehend what God is, do not think it a small matter for thee to know what He is not.

Behold, in thy mind, I see some two things, thy memory and thy thought, which is, as it were, the seeing faculty and the vision of thy soul. Thou seest something, and perceivest it by the eyes, and thou committest it to the care of the memory. There, within, is that which thou hast committed to thy memory, laid up in secret as in a storehouse, as in a treasury, as in a kind of secret chamber and inner cabinet. Thou thinkest of something else, thy attention is elsewhere; what thou didst see is in thy memory, but not seen by thee, because thy thought is bent on another thing. I prove this at once. I speak to you who know; I mention by name Carthage; all who know it have instantly seen Carthage within the mind. Are there as many Carthages as there are minds of you? You have all seen it by means of this name, by means of these syllables known to you, rushing forth from my mouth: your ears were. touched; the sense of the soul was touched through the body, and the mind bent back from another object to this word, and saw Carthage. Was Carthage made there and then? It was there already, but latent in the memory. Why was latent there? Because thy mind was engaged on another matter; but when thy thought turned back to that which was in the memory, thence it was shaped, and became a kind of vision of the mind. Before, there was not a vision, but there was memory; the vision was made by the turning back of thought to memory. Thy memory, then, showed Carthage to thy thought; and that which was in it before thou didst direct thy mind to the memory, it exhibited to the attention of thy thought when turned upon it. Behold, a showing is effected by the memory, and a vision is produced in thought; and no words passed between, no sign was given from the body: thou didst neither nod, nor write, nor utter a sound; and yet thought saw what the memory showed. But both that which showed, and that to which it showed, are of the same substance. But yet, that thy memory might have Carthage in it, the image was drawn in through the eyes, for thou didst see what thou didst store up in thy memory. So hast thou seen the tree which thou rememberest; so the mountain, the river; so the face of a friend, of an enemy, of father, mother, brother, sister, son, neighbor; so of letters written in a book, of the book itself; so of this church: all these thou didst see, and didst commit to thy memory after they were seen; and didst, as it were, lay up there what thou mightst by thinking see at will, even when they should be absent from these eyes of the body. Thou sawest Carthage when thou wast at Carthage; thy soul received the image by the eyes; this image was laid up in thy memory; and thou, the person who wast present at Carthage, didst keep something within thee which thou mightst be able to see with thyself, even when thou shouldst not be there. All these things thou didst receive from without. What the Father shows to the Son, He does not receive from without: all comes to pass within, because there would be no creature at all without, unless the Father had made it by the Son. Every creature was made by God; before it was made it was not in being. It was not therefore seen, after being made and retained in memory, that the Father might show it to the Son, as the memory might show to thought; but, on the contrary, the Father showed it to be made, the Son saw it to be made; and the Father made it by showing, because He made it by the Son seeing. And therefore we ought not to be surprised that it is said, "But what He seeth the Father doing," not showing. For by this it is intimated that, with the Father, to do and to show is the same thing; that hence we may understand that He doeth all things by the Son seeing. Neither is that showing, nor that seeing, temporal. Forasmuch as all times are made by the Son, they could not certainly be shown to Him at any point of time to be made. But the Father's showing begets the Son's seeing, just in the same manner as the Father begets the Son. For the showing produces the seeing, not the seeing the showing. And if we were able to look into this matter more purely and perfectly, perhaps we should find that the Father is not one thing, His showing another; nor the Son one thing, His seeing another. But if we have hardly apprehended this,-if we have hardly been able to explain how the memory exhibits to the thought what it has received from without,-how much less can we take in or explain how God the Father shows to the Son, what He has not from elsewhere, or that which is not other than Himself! We are only little ones: I tell you what God is not, do not show you what God is. What shall we do, then, that we may apprehend what He is? Can ye do this by or through me? I say this to the little ones, both to you and to myself; there is by whom we can: we have just now sung, just now heard, "Cast thy care upon the Lord, and He will nourish thee." The reason why thou art not able, O man, is because thou art a little one; being a little one, thou must be nourished; being nourished, thou wilt become full-grown; and what as a little one thou couldst not, thou shalt see when full-grown; but that thou mayest be nourished, "cast thy care upon the Lord, and He will nourish thee."
'''
