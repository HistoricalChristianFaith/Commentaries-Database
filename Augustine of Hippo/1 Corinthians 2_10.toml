[[commentary]]
quote='''
The former question then is solved as followeth: ofttimes the Scripture speaketh in such manner, that what by the gift of God a creature doth, God is said to do.…For hence has been said the following also, “For the Spirit searcheth all things, even the depth of God;” not because He that knoweth all things searcheth, but because to thee hath been given the Spirit, which maketh thee also to search: and that which by His own gift thou doest, He is said to do; because without Him thou wouldest not do it: therefore God is said to do, when thou doest.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252053.html'
source_title="Exposition on Psalm 53"
