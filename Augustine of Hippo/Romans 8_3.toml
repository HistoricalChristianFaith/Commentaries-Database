[[commentary]]
quote='''
The reason why grace was bestowed on us through our mediator is that we who were polluted by sinful flesh might be purified by the "likeness of sinful flesh."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252010.html'
source_title="City of God 10.22"

[[commentary]]
quote='''
What does sinful flesh have? Death and sin. What does the likeness of sinful flesh have? Death without sin. If it had sin it would be sinful flesh; if it did not have death it would not be the likeness of sinful flesh. As such he came—he came as Savior. He died but he vanquished death. In himself he put an end to what we feared; he took it upon himself and he vanquished it—as a mighty hunter he captured and slew the lion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520233.html'
source_title="SERMONS FOR EASTER SEASON, HOMILY 233.3"

[[commentary]]
quote='''
Sackcloth, haply He calleth His mortal flesh. Wherefore Sackcloth? For the likeness of sinful flesh. For the Apostle saith, “God sent His Son in the likeness of sinful flesh, that through sin He might condemn sin in the flesh:” that is, He clothed His Own Son with sackcloth, that through sackcloth He might condemn the goats. Not that there was sin, I say not in the Word of God, but not even in that Holy Soul and Mind of a Man, which the Word and Wisdom of God had so joined to Himself as to be One Person. Nay, nor even in His very Body was any sin, but the likeness of sinful flesh there was in the Lord; because death is not but by sin, and surely that Body was mortal. For had It not been mortal, It had not died; had It not died, It had not risen again; had It not risen again, It had not showed us an example of eternal life. So then death, which is caused by sin, is called sin; as we say the Greek tongue, the Latin tongue, meaning not the very member of flesh, but that which is done by the member of flesh. For the tongue in our members is one among others, as the eyes, nose, ears, and the rest: but the Greek tongue is Greek words, not that the tongue is words, but that words are by the tongue.…So then the sin of the Lord is that which was caused by sin; because He assumed flesh, of the same lump which had deserved death by sin. For to speak more briefly, Mary who was of Adam died for sin, Adam died for sin, and the Flesh of the Lord which was of Mary died to put away sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"

[[commentary]]
quote='''
The Law may be understood to have been made weak, because it was not fulfilled; not that of itself it is weak, but because it maketh men weak, by threatening punishment, and not aiding through grace. For also the very word the Apostle hath used, where he saith, “For that which was impossible of the Law, wherein it was made weak through the flesh:” willing to intimate that through the Spirit it is fulfilled: nevertheless, itself he hath said is made weak, because by weak men it cannot be fulfilled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
