[[commentary]]
quote='''
(Tr. xxi. s. 5) But now from Him whom we called coeternal with the Father, who saw the Father, and existed in that He saw, we return to the things of time, And He will show him greater works than these. But if He will show him, i. e. is about to show him, He hath not yet shown him: and when He does show him, others also will see; (Tr. xix). for it follows, That ye may believe. It is difficult to see what the eternal Father can show in time to the coeternal Son, Who knows all that exists within the Father's mind. For as the Father raiseth up the dead, and quickeneth them, even so the Son quickeneth whom He will. To raise the dead was a greater work than to heal the sick. But this is explained by consideriug that He Who a little before spoke as God, now begins to speak as man. As man, and therefore living in time, He will be shown greater works in time. Bodies will rise again by the human dispensation by which the Son of God assumed manhood in time; but souls by virtue of the eternity of the Divine Substance. For which reason it was said before that the Father loved the Son, and showed Him what things soever He did. For the Father shows the Son that souls are raised up; for they are raised up by the Father and the Son, even as they cannot live, except God give them life. (Tr. xxi). Or the Father is about to show this to us, not to Him; according to what follows, That ye may believe. This being the reason why the Father would show Him greater things than these. But why did He not say, shall show you, instead of the Son? Because we are members of the Son, and He, as it were, learns in His members, even as He suffers in us. For as He says, Inasmuch as ye have done it unto one of the least of these My brethren, ye have done it unto Me: (Matt. 25:40) so, if we ask Him, how He, the Teacher of all things, learns, He replies, When one of the least of My brethren learns, I learn.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
(Tr. xxi. s. 5, 6) Having said that the Father would show the Son greater works than these, He proceeds to describe these greater works: For as the Father raiseth up the dead, and quickeneth them, even so the Son quickeneth whom He will. These are plainly greater works, for it is more of a miracle that a dead man should rise again, than that a sick man should recover. We must not understand from the words, that some are raised by the Father, others by the Son; but that the Son raises to life the same whom the Father raiseth. And to guard against any one saying, The Father raises the dead by the Son, the former by His own power, the latter, like an instrument, by another power, He asserts distinctly the power of the Son: The Son quickeneth whom he will. Observe here not only the power of the Son, but also His will. Father and Son have the same power and will. The Father willeth nothing distinct from the Son; but both have the same will, even as they have the same substance.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But what are the greater works? For perhaps this is easy to understand. "For as the Father," saith He, "raiseth up the dead, and quickeneth them, even so the Son quickeneth whom He will." To raise the dead, then, are greater works than to heal the sick. But "as the Father raiseth the dead, and quickeneth them, so also the Son quickeneth whom He will." Hence, the Father some, the Son others? But all things are by Him: therefore the Son the same persons as the Father doth; since the Son doeth not other things and in a different manner, but "these" and in "like manner." Thus clearly it must be understood, and thus held. But keep in memory that" the Son quickeneth whom He will." Here, too, know not only the power of the Son, but also the will. Both the Son quickeneth whom He will, and also the Father quickeneth whom He will-the Son the same persons as the Father; and hence the power of the Father and of the Son is the same, and also the will is the same.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252019.html'
source_title="Tractates on John 19"

[[commentary]]
quote='''
This, then, He is about to show us; this He showed to His disciples, who saw Him in the flesh. What is this? "As the Father raiseth the dead, and quickeneth them, so also the Son quickeneth whom He will." Is it that the Father some, the Son others? Surely all things were made by Him. What do we say, my brethren? Christ raised Lazarus; what dead man did the Father raise, that Christ might see how to raise Lazarus? When Christ raised Lazarus, did not the Father raise him? or was it the doing of the Son alone, without the Father? Read ye the passage itself, and see that He invokes the Father that Lazarus may rise again. As a man, He calls on the Father; as God, He doeth with the Father. Therefore also Lazarus, who rose again, was raised both by the Father and by the Son, in the gift and grace of the Holy Spirit; and that wonderful work the Trinity performed. Let us not, therefore, understand this, "As the Father raiseth the dead, and quickeneth them, so also the Son quickeneth whom He will," in such wise as to suppose that some are raised and quickened by the Father, others by the Son; but that the Son raiseth and quickeneth the very same whom the Father raiseth and quickeneth; because" all things were made by Him, and without Him was nothing made." And to show that He has, though given by the Father, equal power, therefore He saith, "So also the Son quickeneth whom He will," that He might therein show His will; and lest any should say, "The Father raiseth the dead by the Son, but the Father as being powerful, and as having power, the Son as by another's power, as a servant does something, as an angel," He indicated His power when He saith, "So also the Son quickeneth whom He will." It is not so that the Father willeth other than the Son; but as the Father and the Son have one substance, so also one will.

And who are these dead whom the Father and the Son quicken? Are they the same of whom we have spoken-Lazarus, or that widow's son, or the ruler of the synagogue's daughter? For we know that these were raised by Christ the Lord. it is some other thing that He means to signify to us,-namely, the resurrection of the dead, which we all look for; not that resurrection which certain have had, that the rest might believe. For Lazarus rose to die again; we shall rise again to live for ever. Is it the Father that effects such a resurrection, or the Son? Nay verily, the Father in the Son. Consequently the Son, and the Father in the Son. Whence do we prove that He speaks of this resurrection? When He had said, "As the Father raiseth up the dead, and quickeneth them, so also the Son quickeneth whom He will." Lest we should understand here that resurrection which He performs for a miracle, not for eternal life, He proceeded, saying, "For the Father judgeth not any man, but all judgment hath He given to the Son." What is this? He was speaking of the resurrection of the dead, that "as the Father raiseth the dead, and quickeneth them, so also the Son quickeneth whom He will;" and immediately thereupon added as a reason, concerning the judgment, saying, "for the Father judgeth not any man, but all judgment hath He given to the Son." Why said He this, but to indicate that He had spoken of that resurrection of the dead which will take place in the judgment?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252021.html'
source_title="Tractates on John 21"
