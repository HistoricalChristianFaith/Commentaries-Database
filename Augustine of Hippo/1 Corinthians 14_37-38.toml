[[commentary]]
quote='''
And still further, knowing that what he wrote to the Corinthians might doubtless be understood in one way by those who were still babes, and differently by those of greater capacity, he said, "If any one among you is a prophet, or spiritual, let him acknowledge that the things that I write unto you are the commandment of the Lord; but if any man be ignorant, let him be ignorant." Assuredly he would have the knowledge of the spiritual to be substantial, wherever not only faith had found a suitable abode, but a certain power of understanding was possessed; and whereby such believed those very things which as spiritual they likewise acknowledged. But "let him be ignorant," he says, who "is ignorant;" because it was not yet revealed to him to know that which he believes. When this takes place in a man's mind, he is said to be known of God; for it is God who endows him with this power of understanding, as it is elsewhere said, "But now, knowing God, or rather, being known of God." For it was not then that God first knew those who were foreknown and chosen before the foundation of the world; but then it was that He made them to know Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252098.html'
source_title="Tractates on John 98"
