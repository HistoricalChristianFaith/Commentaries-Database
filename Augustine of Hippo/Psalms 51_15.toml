[[commentary]]
quote='''
“O Lord, my lips Thou shalt open, and my mouth shall tell of Thy praise” (ver. 15). “Thy praise,” because I have been created: “Thy praise,” because sinning I have not been forsaken: “Thy praise,” because I have been admonished to confess: “Thy praise,” because in order that I might be secured I have been cleansed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"
