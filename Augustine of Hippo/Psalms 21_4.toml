[[commentary]]
quote='''
“He asked life; and Thou gavest Him:” He asked a resurrection, saying, “Father, glorify Thy Son;” and Thou gavest it Him, “Length of days for ever and ever” (ver. 4). The prolonged ages of this world which the Church was to have, and after them an eternity, world without end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
