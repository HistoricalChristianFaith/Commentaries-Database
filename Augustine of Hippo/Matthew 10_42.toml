[[commentary]]
quote='''
If charity be destitute of means, so that it cannot find what to bestow upon the poor, let it love: let it give “one cup of cold water;” as much shall be laid to its account, as to Zaccheus who gave half his patrimony to the poor. Wherefore this? The one gave so little, the other so much, and shall so much be imputed to the former? Just so much. For though his resources are unequal, his charity is not unequal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520122.html'
source_title="Exposition on Psalm 122"
