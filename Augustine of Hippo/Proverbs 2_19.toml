[[commentary]]
quote='''
“And He remembered that they are flesh, a spirit going and not returning” (ver. 39). Therefore calling them and pitying them through His grace, He called them back Himself, because of themselves they could not return. For how doth flesh return, “a spirit walking and not turning back,” while a weight of evil deserts doth weigh it down unto the lowest and far places of evil, save through the election of grace?…For thus also is solved this no unimportant question, how it is written in the Proverbs, when the Scripture was speaking of the way of iniquity, “all they that walk in her shall not return.” For it hath been so spoken as if all ungodly men were to be despaired of: but the Scripture did only commend grace; for of himself man is able to walk in that way, but is not able of himself to return, except when called back by grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
