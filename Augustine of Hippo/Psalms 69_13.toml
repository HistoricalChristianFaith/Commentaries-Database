[[commentary]]
quote='''
“But I with My prayer with Thee, O Lord” (ver. 13). But I was with Thee. But how? With Thee by praying. For when thou art evil spoken of, and knowest not what thou mayest do; when at thee are hurled reproaches, and thou findest not any way of rebuking him by whom they are hurled; nothing remaineth for thee but to pray. But remember even for that very man to pray. “But I with my prayer with Thee, O Lord. It is the time of Thy good pleasure, O God.” For behold the grain is being buried, there shall spring up fruit. “It is the time of Thy good pleasure, O God.” Of this time even the Prophets have spoken, whereof the Apostle maketh mention: “Behold now the time acceptable, behold now the day of salvation.” “It is the time of Thy good pleasure, O God. In the multitude of Thy mercy.” This is the time of good pleasure, “in the multitude of Thy mercy.” For if there were not a multitude of Thy mercy, what should we do for the multitude of our iniquity? “In the multitude of Thy mercy; Hearken to me in the truth of Thy Salvation.” Because He hath said, “of Thy mercy,” he hath added truth also: for “mercy and truth” are all the ways of the Lord. Why mercy? In forgiving sins. Why truth? In fulfilling the promises.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
