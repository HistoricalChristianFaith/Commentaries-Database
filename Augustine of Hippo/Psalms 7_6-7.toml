[[commentary]]
quote='''
It can be taken also in this sense: “Arise, O Lord, in Thine anger, and be exalted in the borders of mine enemies:” that is, arise in Thine anger, and let not mine enemies understand Thee; so that to “be exalted,” should be this, become high, that Thou mayest not be understood; which has reference to the silence spoken of above. For it is of this exaltation thus said in another Psalm, “And He ascended upon Cherubim, and flew:” and, “He made darkness His secret place.” In which exaltation, or concealment, when for their sins’ desert they shall not understand Thee, who shall crucify Thee, “the congregation” of believers “shall surround Thee.” For in His very humiliation He was exalted, that is, was not understood. So that, “And arise, O Lord my God, in the commandment that Thou hast given:” may have reference to this, that is, when Thou showest Thyself, be high or deep that mine enemies may not understand Thee. Now sinners are the enemies of the just man, and the ungodly of the godly man. “And the congregation of the people shall surround Thee:” that is, by this very circumstance, that those who crucify Thee understand Thee not, the Gentiles shall believe on Thee, and so “shall the congregation of the people surround Thee.” But what follows, if this be the true meaning, has in it more pain, that it begins already to be perceived, than joy that it is understood. For it follows, “and for their sakes return Thou on high,” that is, and for the sake of this congregation of the human race, wherewith the Churches are crowded, return Thou on high, that is, again cease to be understood. What then is, “and for their sakes,” but that this congregation too will offend Thee, so that Thou mayest most truly foretell and say, “Thinkest Thou when the Son of man shall come, He will find faith on the earth?” Again, of the false prophets, who are understood to be heretics, He says, “Because of their iniquity the love of many shall wax cold.” Since then even in the Churches, that is, in that congregation of peoples and nations, where the Christian name has most widely spread, there shall be so great abundance of sinners, which is already, in great measure, perceived; is not that famine of the word here predicted, which has been threatened by another prophet also? Is it not too for this congregation’s sake, who, by their sins, are estranging from themselves the light of truth, that God returns on high, that is, so that faith, pure and cleansed from the corruption of all perverse opinions, is held and received, either not at all, or by the very few of whom it was said, “Blessed is he that shall endure to the end, the same shall be saved”? Not without cause then is it said, “and for the sake of this” congregation “return Thou on high:” that is, again withdraw into the depth of Thy secrecy, even for the sake of this congregation of the peoples, that hath Thy name, and doeth not Thy deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25207.html'
source_title="Exposition on Psalm 7"
