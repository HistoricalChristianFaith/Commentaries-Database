[[commentary]]
quote='''
“Destroy them, O Lord, from off the earth, scatter them in their life.” O Lord, destroy them from off the earth, which they inhabit, scatter them throughout the world in this life, which only they think their life, who despair of life eternal. “And by Thy hidden things their belly hath been filled.” Now not only this visible punishment shall overtake them, but also their memory hath been filled with sins, which as darkness are hidden from the light of Thy truth, that they should forget God. “They have been filled with swine’s flesh.” They have been filled with uncleanness, treading under foot the pearls of God’s words. “And they have left the rest to their babes:” crying out, “This sin be upon us and upon our children.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252017.html'
source_title="Exposition on Psalm 17"

[[commentary]]
quote='''
In that verse indeed where it is said, “filled with swine’s flesh,” some copies have, “filled with children:” for from the ambiguity of the Greek a double interpretation has resulted. Now by “children” we understand works; and as by good children, good works, so by evil, evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252017.html'
source_title="Exposition on Psalm 17"
