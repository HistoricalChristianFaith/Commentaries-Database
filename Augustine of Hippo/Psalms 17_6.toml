[[commentary]]
quote='''
“I have cried out, for Thou hast heard Me, O God” (ver. 6). With a free and strong effort have I directed My prayers unto Thee: for that I might have this power, Thou hast heard Me when praying more weakly. “Incline Thine ear to Me, and hear My words.” Let not Thy hearing forsake My humiliation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252017.html'
source_title="Exposition on Psalm 17"
