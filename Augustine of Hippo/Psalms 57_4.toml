[[commentary]]
quote='''
But if in addition to all these former deeds of yours, you also cried out, "Crucify, crucify [him];" then hear what it is against you that the prophet proclaims: "The sons of men, whose teeth are spears and arrows, and their tongue a sharp sword." These, look you, are the spears, the arrows, the sword, wherewith you slew the righteous, when you said that it was not lawful for you to put any man to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520114.html'
source_title="Tractates on John 114"
