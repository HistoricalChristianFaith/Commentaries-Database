[[commentary]]
quote='''
But if in addition to all these former deeds of yours, you also cried out, "Crucify, crucify [him];" then hear what it is against you that the prophet proclaims: "The sons of men, whose teeth are spears and arrows, and their tongue a sharp sword." These, look you, are the spears, the arrows, the sword, wherewith you slew the righteous, when you said that it was not lawful for you to put any man to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520114.html'
source_title="Tractates on John 114"

[[commentary]]
quote='''
Who are the lions’ whelps? That lesser people, unto evil deceived, unto evil led away by the chiefs of the Jews: so that these are lions, those lions’ whelps. All roared, all slew. For we are to hear even here the slaying of these very men, presently in the following verses of this Psalm.

“And hath drawn out,” he saith, “my soul from the midst of the lions’ whelps” (ver. 4). Why sayest thou, “And hath drawn out my soul”? For what hadst thou suffered, that thy soul should be drawn out? “I have slept troubled.” Christ hath intimated His death.…

Whence “troubled”? Who troubling? Let us see in what manner he brandeth an evil conscience upon the Jews, wishing to excuse themselves of the slaying of the Lord. For to this end, as the Gospel speaketh, to the judge they delivered Him, that they might not themselves seem to have killed Him.…Let us question Him, and say, since Thou hast slept troubled, who have persecuted Thee? who have slain Thee? was it perchance Pilate, who to soldiers gave Thee, on the Tree to be hanged, with nails to be pierced? Hear who they were, “Sons of men” (ver. 5). Of them He speaketh, whom for persecutors He suffered. But how did they slay, that steel bare not? They that sword drew not, that made no assault upon Him to slay; whence slew they? “Their teeth are arms and arrows, and their tongue a sharp sword.” Do not consider the unarmed hands, but the mouth armed: from thence the sword proceeded, wherewith Christ was to be slain: in like manner also as from the mouth of Christ, that wherewith the Jews were to be slain. For He hath a sword twice whetted: and rising again He hath smitten them, and hath severed from them those whom He would make His faithful people. They an evil sword, He a good sword: they evil arrows, He good arrows. For He hath Himself also arrows good, words good, whence He pierceth the faithful heart, in order that He may be loved. Therefore of one kind are their arrows, and of another kind their sword. “Sons of men, their teeth are arms and arrows, and their tongue a sharp sabre.” Tongue of sons of men is a sharp sabre, and their teeth arms and arrows. When therefore did they smite, save when they clamoured, “Crucify, crucify”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"
