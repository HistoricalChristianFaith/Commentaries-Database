[[commentary]]
quote='''
(Tr. xlix. 2) The Arians, when they hear this passage, appeal immediately to the gradations in their system, that as far as the Apostle is from the Lord, so far is the Son from the Father. But our Lord hath left us no room for doubt on this head; for He saith, I and My Father are one. (supr. 10:30) But how shall we understand those words of our Lord, He that receiveth Me, receiveth Him that sent Me? If we take them to mean that the Father and the Son are of one nature, it will seem to follow, when He says, He that receiveth whomsoever I send, receiveth Me, that the Son and an Apostle are of one nature. May not the meaning be, He that receiveth whosoever I send, receiveth Me, i. e. Me as man: But He that receiveth Me, i. e. as God, receiveth Him that sent Me. But it is not this unity of nature, which is here put forth, but the authority of the Sender, as represented by Him who is sent. In Peter hear Christ, the Master of the disciple, in the Son the Father, the Begotten of the Only Begotten.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"
[[commentary]]
quote='''
He then proceeds to say: "Verily, verily, I say unto you, He that receiveth whomsoever I send, receiveth me; and he that receiveth me, receiveth Him that sent me." Did He mean us to understand that there is as little distance between one sent by Him, and Himself, as there is between Himself and God the Father? If we take it in this way, I know not what measurements of distance (which may God forbid!) we shall be adopting, in the Arian fashion. For they, when they hear or read these words of the Gospel, have immediate recourse to their dogmatic measurements, whereby they ascend not to life, but fall headlong into death. For they straightway say: The Son's messenger stands at the same relative distance from the Son, as expressed in the words, "He that receiveth whomsoever I send, receiveth me," as that in which the Son Himself stands from the Father, when He said, "He that receiveth me, receiveth Him that sent me." But if thou sayest so, thou forgettest, heretic, thy measurements. For if, because of these words of the Lord, thou puttest the Son at as great a distance from the Father as the messenger [apostle] from the Son, where dost thou purpose to place the Holy Spirit? Has it escaped thee, that ye are wont to place Him after the Son? He will therefore come in between the messenger and the Son; and much greater, then, will be the distance between the Son and His messenger, than between the Father and His Son. Or perhaps, to preserve that distinction between the Son and His messenger, and between the Father and His Son, at their equality of distance, will the Holy Spirit be equal to the Son? But as little will ye allow this. And where, then, do ye think of placing Him, if ye place the Son as far beneath the Father, as ye place the messenger beneath the Son? Restrain, therefore, your foolhardy presumption; and do not be seeking to find in these words the same distance between the Son and His messenger as between the Father and His Son. But listen rather to the Son Himself, when He says, "I and my Father are one." For there the Truth hath left you no shadow of distance between the Begetter and the Only-begotten; there Christ Himself hath erased your measurements, and the rock hath broken your staircase to pieces.

But now that the heretical slander has been disposed of, in what sense are we to understand these words of the Lord: "He that receiveth whomsoever I send, receiveth me; and he that receiveth me, receiveth Him that sent me"? For if we were inclined to understand the words, "He that receiveth me, receiveth Him that sent me," as expressing the oneness in nature of the Father and the Son; the sequence from the similar arrangement of words in the other clause, "He that receiveth whomsoever I send, receiveth me," would be the unity in nature of the Son and His messenger. And there might, indeed, be no impropriety in so understanding it, seeing that a twofold substance belongeth to the strong man, who hath rejoiced to run the race; for the Word was made flesh, that is, God became man. And accordingly He might be supposed to have said, "He that receiveth whomsoever I send, receiveth me," with reference to His human nature; "and he that receiveth me" as God, "receiveth Him that sent me." But in so speaking, He was not commending the unity of nature, but the authority of the Sender in Him who is sent. Let every one, therefore, so receive Him that is sent, that in His person he may give heed to Him who sent Him. If, then, thou lookest for Christ in Peter, thou wilt find the disciple's instructor; and if thou lookest for the Father in the Son, thou wilt find the Begetter of the Only-begotten: and so in Him who is sent, thou art not mistaken in receiving the Sender. What follows in the Gospel cannot be compressed within the shortness of the time remaining. And therefore, dearly beloved, let what has been said, if thought sufficient, be received in a healthful way, as pasture for the holy sheep; and if it is somewhat scanty, let it be ruminated over with ardent desire for more.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252059.html'
source_title="Tractates on John 59"
