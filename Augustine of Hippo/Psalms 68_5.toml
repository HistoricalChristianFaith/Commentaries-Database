[[commentary]]
quote='''
For they that in the sight of men trouble you, “shall be troubled by the face of Him, the Father of orphans and Judge of widows” (ver. 5). For desolate they suppose them to be, from whom ofttimes by the sword of the Word of God both parents from sons, and husbands from wives, are severed: but persons destitute and widowed have the consolation “of the Father of orphans and Judge of widows:” they have the consolation of Him that say to Him, “For my father and my mother have forsaken me, but the Lord hath taken up me:” and they that have hoped in the Lord, continuing in prayers by night and by day: by whose face those men shall be troubled when they shall have seen themselves prevail nothing, for that the whole world hath gone away after Him. For out of those orphans and widows, that is, persons destitute of partnership in this world’s hope, the Lord for Himself doth build a Temple: whereof in continuation he saith, “The Lord is in His holy place.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
