[[commentary]]
quote='''
(de Con. Evang. iii. 22) In performing this last office to our Lord, he showed a bold indifference to the Jews, though he had avoided our Lord's company when alive, for fear of incurring their hatred.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
John, on the other hand, first narrates the breaking of the legs of those who had been crucified with the Lord, and the piercing of the Lord's side with the lance (which whole passage has been recorded by him alone), and then subjoins a statement which is of the same tenor with what is given by the other evangelists. It proceeds in these terms: "And after this, Joseph of Arimathea, being a disciple of Jesus, but secretly for fear of the Jews, besought Pilate that he might take away the body of Jesus: and Pilate gave him leave. He came therefore, and took the body of Jesus." There is nothing here to give any one of them the appearance of being in antagonism with another. But some one may perhaps ask whether John is not inconsistent with himself, when he at once unites with the rest in telling us how Joseph begged the body of Jesus, and comes forward as the only one who states here that Joseph had been a disciple of Jesus secretly for fear of the Jews. For the question may reasonably be raised as to how it happened that the man who had been a disciple secretly for fear had the courage to beg His body—a thing which not one of those who were His open followers was bold enough to do. We must understand, however, that this man did so in the confidence which his dignified position gave him, the possession of which rendered it possible for him to make his way on familiar terms into Pilate's presence. And we must suppose, further, that in the performance of that last service relating to the interment, he cared less for the Jews, however he tried in ordinary circumstances, when hearing the Lord, to avoid exposing himself to their enmity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 22"
