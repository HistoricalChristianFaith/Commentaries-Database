[[commentary]]
quote='''
Hear what is even more wonderful, that the hidden and veiled mysteries of the ancient books are in some degree revealed by the ancient books. For Micah the prophet speaketh thus. “According to the days of thy coming out of Egypt will I show unto him marvellous things, etc.…In this Psalm, therefore, although the wonderful spirit of prophecy doth look into the future, yet it seemeth, as it were, to be merely detailing to the past. “Judah,” he saith, “was His sanctuary: the sea saw that and fled:” “was,” “saw,” and “fled,” are words of the past tense; and “Jordan was driven back, and the mountains skipped, and the earth trembled,” in like manner have a past expression, without, however, any difficulty in understanding by them the future.…For though it was so long after the departure of that people from Egypt, and so long before these seasons of the Church, that he sang what I have quoted; nevertheless, he witnesseth that he is foretelling the future without any question. “According to the days,” he saith, “of thy coming out of the land of Egypt will I show unto him marvellous things.” “The nations shall see and be confounded.” This is what is here said, “The sea saw that, and fled:” for if in this passage, through words of the past tense the future is secretly revealed, as is the case; who would venture to explain the words, “shall see and be confounded,” of past events? And a little lower down he alludeth more clearly than light itself to those very enemies of ours, who followed us flying, that they might slay us, that is, our sins, which are overwhelmed and extinguished in Baptism, just as the Egyptians were drowned in the sea, saying, since “He retaineth not His anger for ever, because He is of good will and merciful, He will turn again, He will have compassion upon us, He will drown our iniquities: and Thou wilt cast all their sins into the depths of the sea.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520114.html'
source_title="Exposition on Psalm 114"
