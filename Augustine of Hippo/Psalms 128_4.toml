[[commentary]]
quote='''
If therefore we have, why have we? Because we fear the Lord. “Lo, thus shall the man be blessed that feareth the Lord” (ver. 4). He is the man, who is also the men; and the men are one man; because many are one, because Christ is One.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520128.html'
source_title="Exposition on Psalm 128"
