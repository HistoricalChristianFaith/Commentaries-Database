[[commentary]]
quote='''
“And that because of thine indignation and wrath: because thou hast taken me up, thou hast cast me down” (ver. 10). This is thy wrath, O Lord, in Adam: that wrath in which we were all born, which cleaveth unto us by our birth; the wrath from the stock of iniquity, the wrath from the mass of sin: according to what the Apostle saith, “We also were once the children of wrath, even as others.” For He saith not, the wrath of God shall come upon him: but, “abideth upon him:” because that wrath in which he was born is not taken away.…Man set in honour, is made in the image of God: raised up to this honour, lifted up from the dust, from the earth, he hath received a reasonable soul; by the vivacity of that very reason, he is placed before all beasts, cattle, birds that fly, and fishes. For which of these hath reason to understand? Because none of them is created in the image of God.…Therefore, “Because Thou hast taken me up, Thou hast cast me down:” punishment followeth me, because Thou hast given me a free choice. For if Thou hadst not given me a free choice, and for this reason didst not make me better than cattle, just condemnation would not follow me when I sinned. Thus Thou hast taken me up in giving me freedom of choice, and by Thy judgment Thou hast cast me down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
