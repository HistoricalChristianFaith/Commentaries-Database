[[commentary]]
quote='''
“Thou hast prepared a table in my sight, against them that trouble me” (ver. 5). Now after the rod, whereby, whilst a little one, and living the natural life, I was brought up among the flock in the pastures; after that rod, I say, when I began to be under the staff, Thou hast prepared a table in my sight, that I should no more be fed as a babe with milk, but being older should take meat, strengthened against them that trouble me. “Thou hast fattened my head with oil.” Thou hast gladdened my mind with spiritual joy. “And Thy inebriating cup, how excellent is it!” And Thy cup yielding forgetfulness of former vain delights, how excellent is it!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252023.html'
source_title="Exposition on Psalm 23"

[[commentary]]
quote='''
Wherefore also in another Psalm it is said, “Thy cup inebriating, how excellent is it!” With this cup were the Martyrs satiated when going to their passion, they knew not their own. What so inebriated as not to know a wife weeping, not children, not parents? They knew them not, they thought not that they were before their eyes. Wonder not: they were inebriated. Wherewith were they so? Lo, they had received a cup wherewith they were satiated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252036.html'
source_title="Exposition on Psalm 36"

[[commentary]]
quote='''
All sinners shall drink, but see, who the dreg, who the wine. For those by drinking the dreg have come to nought: these by drinking the wine have been justified. I would dare to speak of them even as inebriated, and I shall not fear: and O that all ye were thus inebriated. Call to mind, “Thy cup inebriating, how passing beautiful!” But why? Do ye think, my brethren, that all those who by confessing Christ even willed to die, were sober? So drunk they were, that they knew not their friends. All their kindred, who strove to divert them from the hope of Heavenly rewards by earthly allurements, were not acknowledged, were not heard by them drunken. Were they not drunken, whose heart had been changed? Were they not drunken, whose mind had been alienated from this world?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252075.html'
source_title="Exposition on Psalm 75"

[[commentary]]
quote='''
“And wine maketh glad the heart of man” (ver. 15). Let no man prepare himself for intoxication; nay, let every man prepare him for intoxication. “How excellent is Thy cup which maketh inebriate!” We choose not to say, Let no man be drunk. Be inebriated; yet beware, from what source. If the excellent cup of the Lord doth saturate you, your ebriety shall be seen in your works, it shall be seen in the holy love of righteousness, it shall, lastly, be seen in the estrangement of your mind, but from things earthly to heavenly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
