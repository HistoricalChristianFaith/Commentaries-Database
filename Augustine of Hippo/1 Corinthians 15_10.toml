[[commentary]]
quote='''
Gladly and with the eyes of faith do all in the City of God look up to this great man, Paul, this athlete of Christ, who was anointed by Christ and instructed by him. With him he was nailed to the cross, and through him made glorious. This man was made a spectacle to the world, to angels and to men. He lawfully carried on a great conflict in the theater of this world and strained forward to the prize of his heavenly calling.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252014.html'
source_title="City of God 14.9"

[[commentary]]
quote='''
Paul did not labor in order to receive grace, but he received grace so that he might labor.
'''
source_url=''
source_title="PROCEEDINGS OF PELAGIUS 14.36"

[[commentary]]
quote='''
How, then, is God's commandment accomplished, even with difficulty, without his help, since if the Lord does not build, the builder is said to have labored in vain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 186, FROM ALYPIUS AND AUGUSTINE TO PAULINUS"

[[commentary]]
quote='''
Do not despise low places, thence flow springs. “Thou sendest out springs in the little valleys.” Hear a mountain. The Apostle saith, “I laboured more than they all.” A certain greatness is brought before us: yet immediately, that the waters may flow, he hath made himself a valley: “Yet not I, but the grace of God with me.” It is no contradiction that they who are mountains be also valleys: for as they are called mountains because of their spiritual greatness, so also valleys because of the humility of their spirit. “Not I,” he saith, “but the grace of God with me.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
