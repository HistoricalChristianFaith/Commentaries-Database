[[commentary]]
quote='''
Thanks to the “Corn of wheat,” because He willed to die and to be multiplied: thanks to the only Son of God, our Lord and Saviour Jesus Christ, who disdained not to undergo our death, in order that He might make us worthy of His life. Behold Him that was single until He went hence; as He said in another Psalm, “Single I am until I go hence;” for He was a single corn of wheat in such sort as that He had in Himself a great fruitfulness of increase; in how many corns imitating the Passion of Him we exult, when we celebrate the nativities of the Martyrs! Many therefore members of Him, under one Head our Saviour Himself, being bound together in the bond of love and peace (as ye judge it fit that ye know, for ye have often heard), are one man: and of the same, as of one man, the voice is ofttimes heard, in the Psalms, and thus one crieth as though it were all, because all in one are one.…

There is then in this Psalm the voice of men troubled, and so indeed of Martyrs amid sufferings in peril, but relying on their own Head. Let us hear them, and speak with them out of sympathy of heart, though it be not with similarity of suffering. For they are already crowned, we are still in peril: not that such sort of persecutions do vex us as have vexed them, but worse perchance in the midsts of all kinds of so great scandals. For our own times do more abound in that woe, which the Lord cried: “Woe to the world because of scandals.” And, “Because iniquity hath abounded, the love of man shall wax cold.” For not even that holy Lot at Sodom suffered corporal persecution from any one, or had it been told him that he should not dwell there: the persecution of him were the evil doings of the Sodomites. Now then that Christ sitteth in Heaven, now that He is glorified, now that necks of kings are made subject to His yoke, and their brows placed beneath His sign, now that not any one remaineth to dare openly to trample upon Christians, still, however, we groan amid instruments and singers, still those enemies of the Martyrs, because with words and steel they have no power, with their own wantonness do persecute them. And O that we were sorrowing for Heathens alone: it would be some sort of comfort, to wait for those that not yet have been signed with the Cross of Christ; when they should be signed, and when, by His authority attached, they should cease to be mad. We see besides men wearing on their brow the sign of Him, at the same time on that same brow wearing the shamelessness of wantonness, and on the days and celebrations of the Martyrs not exulting but insulting. And amid these things we groan, and this is our persecution, if there is in us the love which saith, “Who is weak, and I am not weak? Who is scandalized, and I burn not?” Not any servant of God, then, is without persecution: and that is a true saying which the Apostle saith, “But even all men that will to live godly in Christ, shall suffer persecution.”…

“O God, to my aid make speed” (ver. 1). For need we have for an everlasting aid in this world. But when have we not? Now however being in tribulation, let us especially say, “O God, to my aid make speed.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
source_title="Exposition on Psalm 70"
