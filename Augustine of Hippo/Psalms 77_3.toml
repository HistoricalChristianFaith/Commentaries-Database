[[commentary]]
quote='''
…“I have been mindful of God, and I have been delighted” (ver. 3). My hands had not wrought in vain, they had found a great comforter. While not being idle, “I have been mindful of God, and I have been delighted.” God must therefore be praised, of whom this man being mindful, hath been delighted, and hath been comforted in sorrowful case, and refreshed when safety was in a manner despaired of: God must therefore be praised. In fine, because he hath been comforted, in continuation he saith, “I have babbled.” In that same comfort being made mindful of God, I have been delighted, and have “babbled.” What is, “I have babbled”? I have rejoiced, I have exulted in speaking. For babblers they are properly called, that by the common people are named talkative, who at the approach of joy are neither able nor willing to be silent. This man hath become such an one. And again he saith what? “And my spirit hath fainted.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252077.html'
source_title="Exposition on Psalm 77"
