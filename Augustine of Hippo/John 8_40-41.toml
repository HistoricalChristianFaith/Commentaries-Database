[[commentary]]
quote='''
Why, then, does this empty and vain bragging exalt itself? Let them cease boasting that they are the children of Abraham. They have heard what they ought to have heard: "If ye are the children of Abraham," prove it by your deeds, not by words. "Ye seek to kill me, a man;"-I say not, meanwhile, the Son of God; I say not God; I say not the Word, for the Word dies not I say merely this that you see; for only what you see can you kill, and whom you see not can you offend. "This," then, "did not Abraham." "Ye do the works of your father." And as yet He says not who is that father of theirs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252042.html'
source_title="Tractates on John 42"
