[[commentary]]
quote='''
“Draw not My Soul away with sinners, and destroy me not with them that work iniquity, with them that speak peace with their neighbours” (ver. 3). With them that say unto Me, “We know that Thou art a Master come from God.” “But evil in their hearts.” But they speak evil in their hearts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252028.html'
source_title="Exposition on Psalm 28"
