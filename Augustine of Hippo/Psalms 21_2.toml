[[commentary]]
quote='''
“Thou hast given Him the desire of His soul” (ver. 2). He desired to eat the Passover, and to lay down His life when He would, and again when He would to take it; and Thou hast given it to Him. “And hast not deprived Him of the good pleasure of His lips.” “My peace,” saith He, “I leave with you:” and it was done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
