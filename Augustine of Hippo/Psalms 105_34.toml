[[commentary]]
quote='''
“He spake the word, and the locust came, and the caterpillar, of which there was no number” (ver. 34). The locusts and the caterpillars are one plague: of which the one is the parent, the other the offspring.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520105.html'
source_title="Exposition on Psalm 105"
