[[commentary]]
quote='''
Therefore He showed that for the sake of men He desired to have Himself revealed by a lamp to the faith of those who believed, that by means of the same lamp His enemies might be confounded. There were enemies who tempted Him, and said, "Tell us by what authority doest thou these things?" "I also," saith He, "will ask you one question; answer me. The baptism of John, whence was it? from heaven, or of men? And they were troubled, and said among themselves, If we shall say, From heaven, he will say unto us, Why did ye not believe him?" (Because he had borne testimony to Christ, and had said, I am not the Christ, but He. "But if we shall say, Of men, we fear the people, lest they should stone us: for they held John as a prophet." Afraid of stoning, but fearing more to confess the truth, they answered a lie to the Truth; and "wickedness imposed a lie upon itself." For they said, "We know not." And the Lord, because they shut the door against themselves, by professing ignorance of what they knew, did not open to them, because they did not knock. For it is said, Knock, and it shall be opened unto you." Not only did these not knock that it might be opened to them; but, by denying that they knew, they barred that door against themselves. And the Lord says to them, Neither tell I you by what authority I do these things." And they were confounded by means of John; and in them were the words fulfilled, "I have ordained a lamp for mine anointed. His enemies will I clothe with shame."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25202.html'
source_title="Tractates on John 2"

[[commentary]]
quote='''
Tell me certainly, that thou mayest be confounded by that lamp by which also were the former enemies confounded, who were like to thee, the Pharisees, who, when they questioned the Lord by what authority He did those things: "I also," said He, "will ask you this question, Tell me, the baptism of John, whence is it? from heaven, or of men?" And they, who were preparing to spread their wiles, were entangled by the question, and began to debate with themselves, and say, "If we shall answer, It is from heaven, He will say unto us, Wherefore did ye not believe him?" For John had said of the Lord, "Behold the Lamb of God, who taketh away the sin of the world!" Why then do you inquire by what authority I act? O wolves, what I do, I do by the authority of the Lamb. But that you may know the Lamb, why do you not believe John, who said, "Behold the Lamb of God, who taketh away the sin of the world"? They, then, knowing what John had said regarding the Lord, said among themselves, "If we shall say that John's baptism is from heaven, He will say unto us, Wherefore then did ye not believe him? If we shall say, It is of men, the people will stone us; for they hold John as a prophet." Hence, they feared men; hence, they were confounded to confess the truth. Darkness replied with darkness; but they were overcome by the light. For what did they reply? "We know not;" regarding that which they knew, they said, "We know not." And the Lord said, "Neither tell I you by what authority I do these things." And the first enemies were confounded. How? By the lamp. Who was the lamp? John. Can we prove that he was the lamp? We can prove it; for the Lord says: "He was a burning and a shining lamp." Can we prove also that the enemies were confounded by him? Listen to the psalm: "I have prepared," he says, "a lamp for my Christ. His enemies I will clothe with shame."

As yet, in the darkness of this life, we walk by the lamp of faith: let us hold also to the lamp John, and let us confound by him the enemies of Christ; indeed, let Christ Himself confound His own enemies by His own lamp. Let us put the question which the Lord put to the Jews, let us ask and say, "The baptism of John, whence is it? from heaven, or of men?" What will they say? Mark, if they are not as enemies confounded by the lamp. What will they say? If they shall say, Of men, even their own will stone them; but if they shall say, From heaven, let us say to them, Wherefore, then, did ye not believe him? They perhaps say, We believe him. Wherefore, then, do you say that you baptize, when John says, "This is He which baptizeth"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25205.html'
source_title="Tractates on John 5"

[[commentary]]
quote='''
But when the Jews said to the Lord, "Tell us by what authority thou doest these things," He, knowing that they regarded John the Baptist as a great one, and that the same whom they regarded as a great one had borne witness to them concerning the Lord, answered them, "I also will ask you one thing; tell me, the baptism of John, whence is it from heaven, or from men?" Thrown into confusion, they considered among themselves that, if they said, "From men," they might be stoned by the people, who believed John to be a prophet; if they said, "From heaven," He might answer them, "He whom ye confess to have been a prophet from heaven bore testimony to me, and ye have heard from him by what authority I do these things." They saw, then, that whichever of these two answers they made, they would fall into the snare, and they said, "We do not know." And the Lord answered them, "Neither tell I you by what authority I do these things." "I tell you not what I know, because you will not confess what you know." Most justly, certainly, were they repulsed, and they departed in confusion; and that was fulfilled which God the Father says by the prophet in the psalm, "I have prepared a lamp for my Christ" (the lamp was John); "His enemies I will clothe with confusion."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252035.html'
source_title="Tractates on John 35"

[[commentary]]
quote='''
Of that sort is also the following: “In what power doest Thou these things? I also will ask of you one question, answer me.” And He asked them of John, whence was the Baptism of John, from heaven, or of men? so that whatever they might answer might tell against themselves.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
