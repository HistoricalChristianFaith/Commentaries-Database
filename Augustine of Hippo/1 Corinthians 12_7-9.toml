[[commentary]]
quote='''
For the Spirit is given, as the apostle saith, "to manifestation." To what manifestation? Just as the same apostle saith, "For to one is given by the Spirit the word of wisdom, to another the word of knowledge after the same Spirit, to another faith in the same Spirit, to another the gift of healing in one Spirit, to another the working of miracles in the same Spirit." For there are many gifts given to manifestation, but thou, it may be, hast nothing of all those I have said. If thou lovest, it is not nothing that thou hast: if thou lovest unity, whoever has aught in that unity has it also for thee. Take away envy, and what I have is thine too. The envious temper puts men apart, soundness of mind unites them. In the body, the eye alone sees; but is it for itself alone that the eye sees? It sees both for the hand and the foot, and for all the other members. If a blow be coming against the foot, the eye does not turn away from it, so as not to take precaution. Again, in the body, the hand alone works, but is it for itself alone the hand works? For the eye also it works: for if a coming blow comes, not against the hand, but only against the face, does the hand say, I will not move, because it is not coming to me? So the foot by walking serves all the members: all the other members are silent, and the tongue speaks for all. We have therefore the Holy Spirit if we love the Church; but we love the Church if we stand firm in its union and charity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252032.html'
source_title="Tractates on John 32"
