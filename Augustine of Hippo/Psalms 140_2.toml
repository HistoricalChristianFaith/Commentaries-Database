[[commentary]]
quote='''
“Who have imagined unrighteousnesses in their heart” (ver. 2).…From them free me, from them let Thy hand be most powerful to deliver me. For easy is it to avoid open enmities, easy is it to turn aside from an enemy declared and manifest, while iniquity is in his lips as well as his heart; he is a troublesome enemy, he is secret, he is with difficulty avoided, who beareth good things in his lips, while in his heart he concealeth evil things. “All the day long did they make war.” What is, “war”? They made for me what I was to fight against all the day. For from thence, from such hearts as these, ariseth all that the Christian fighteth against. Be it sedition, be it schism, be it heresy, be it turbulent opposition, it springeth not save from these imaginings which were concealed, and while they spake good words with their lips, “all the day long did they make war.” Ye hear words of peace, yet making war departeth not from their thoughts. For the words, “all the day long,” signify without intermission, throughout the whole time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520140.html'
source_title="Exposition on Psalm 140"
