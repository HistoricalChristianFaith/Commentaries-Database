[[commentary]]
quote='''
(Tr. xlix) For who but Himself could trouble Him? Christ was troubled, because it pleased Him to be troubled; He hungered, because it pleased Him to hunger. It was in His own power to be affected in this or that way, or not. The Word took up soul and flesh, and whole man, and fitted it to Himself in unity of person. And thus according to the nod and will of that higher nature in Him, in which the sovereign power resides, He becomes weak and troubled.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
(Tract. in Joan. xlix. 19) The Lord groaned, wept, cried with a loud voice. It is hard for Him to arise, who is bowed down with the weight of evil habits. Christ troubleth Himself, to signify to thee that thou shouldest be troubled, when thou art pressed and weighed down with such a mass of sin. Faith groaneth, he that is displeased with himself groaneth, and accuseth his own evil deeds; that so the habit of sin may yield to the violence of repentance. When thou sayest, I have done such a thing, and God has spared me; I have heard the Gospel, and despised it; what shall I do? then Christ groaneth, because faith groaneth; and in the voice of thy groaning appeareth the hope of thy rising again.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"Then when Mary was come where Jesus was, and saw Him, she fell down at His feet, saying unto Him, Lord, if Thou hadst been here, my brother had not died. When Jesus therefore saw her weeping, and the Jews also weeping, who were with her, He groaned in the spirit, and troubled Himself, and said, Where have ye laid him?" Something there is, did we but know it, that He has suggested to us by groaning in the spirit, and troubling Himself. For who could trouble Him, save He Himself? Therefore, my brethren, first give heed here to the power that did so, and then look for the meaning. Thou art troubled against thy will; Christ was troubled because He willed. Jesus hungered, it is true, but because He willed; Jesus slept, it is true, but because He willed; He was sorrowful, it is true, but because He willed; He died, it is true, but because He willed: in His own power it lay to be thus and thus affected or not. For the Word assumed soul and flesh, fitting on Himself our whole human nature in the oneness of His person. For the soul of the apostle was illuminated by the Word; so was the soul of Peter, the soul of Paul, of the other apostles, and the holy prophets,-the souls of all were illuminated by the Word; but of none was it said, "The Word was made flesh;" of none was it said," I and the Father are one." The soul and flesh of Christ is one person with the Word of God, one Christ. And by this [Word] wherein resided the supreme power, was infirmity made use of at the beck of His will; and in this way "He troubled Himself."

I have spoken of the power: look now to the meaning. It is a great criminal that is signified by that four days' death and burial. Why is it, then, that Christ troubleth Himself, but to intimate to thee how thou oughtest to be troubled, when weighed down and crushed by so great a mass of iniquity? For here thou hast been looking to thyself, been seeing thine own guilt, been reckoning for thyself: I have done this, and God has spared me; I have committed this, and He hath borne with me; I have heard the gospel, and despised it; I have been baptized, and returned again to the same course: what am I doing? whither am I going? how shall I escape? When thou speakest thus, Christ is already groaning; for thy faith is groaning. In the voice of one who groaneth thus, there comes to light the hope of his rising again. If such faith is within. there is Christ groaning; for if there is faith in us, Christ is in us. For what else says the apostle: "That Christ may dwell in your hearts by faith." Therefore thy faith in Christ is Christ Himself in thy heart. This is why He slept in the ship; and why, when His disciples were in danger and already on the verge of shipwreck, they came to Him and awoke Him. Christ arose, laid His commands on the winds and waves, and there ensued a great calm. So also with thee; the winds enter thy heart, that is, where thou sailest, where thou passest along this life as a stormy and dangerous sea; the winds enter, the billows rise and toss thy vessel. What are the winds? Thou hast received some insult, and art wroth: that insult is the wind; that anger, the waves. Thou art in danger, thou preparest to reply, to render cursing for cursing, and thy vessel is already nigh to shipwreck. Awake the Christ who is sleeping. For thou art in commotion, and making ready to render evil for evil, because Christ is sleeping in thy vessel. For the sleep of Christ in thy heart is the forgetfulness of faith. But if thou arousest Christ, that is, recallest thy faith, what dost thou hear said to thee by Christ, when now awake in thy heart? I [He says] have heard it said to me, "Thou hast a devil," and I have prayed for them. The Lord hears and suffers; the servant hears and is angry! But thou wishest to be avenged. Why so? I am already avenged. When thy faith so speaks to thee, command is exercised, as it were, over the winds and waves, and there is a great calm. As, then, to awaken Christ in the vessel is just to awaken faith; so in the heart of one who is pressed down by a great mass and habit of sin, in the heart of the man who has been a transgressor even of the holy gospel and a despiser of eternal punishment, let Christ groan, let such a man betake himself to self-accusation. Hear still more: Christ wept; let man bemoan himself. For why did Christ weep, but to teach man to weep? Wherefore did He groan and trouble Himself, but to intimate that the faith of one who has just cause to be displeased with himself ought to be in a sense groaning over the accusation of wicked works, to the end that the habit of sinning may give way to the vehemence of penitential sorrow?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"
