[[commentary]]
quote='''
"Whoever believes in the Son has eternal life." Why? Because he has done the work of God, seeing that this is the work of God that you should believe in the one whom he has sent. "But whoever does not believe in the Son will not have life, but the wrath of God remains on him"; not "will come upon him" but "remains on him." He is abandoned, not healed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520130A.html'
source_title="SERMON 130A.7"

[[commentary]]
quote='''
(Tr. xiv. c. 13) Nor does He say, The wrath of God cometh to him, but, abideth on him. For all who are born, are under the wrath of God, which the first Adam incurred. The Son of God came without sin, and was clothed with mortality: He died that thou mightest live. Whosoever then will not believe on the Son, on him abideth the wrath of God, of which the Apostle speaks, We were by nature the children of wrath. (Eph. 2:3)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"
