[[commentary]]
quote='''
“They have been bound, and fallen” (ver. 8). And therefore were they bound by the lust of temporal things, fearing to spare the Lord, lest they should lose their place by “the Romans:” and rushing violently on the stone of offence and rock of stumbling, they fell from the heavenly hope: to whom the blindness in part of Israel hath happened, being ignorant of God’s righteousness, and wishing to establish their own. “But we are risen, and stand upright.” But we, that the Gentile people might enter in, out of the stones raised up as children to Abraham, who followed not after righteousness, have attained to it, and are risen; and not by our own strength, but being justified by faith, we stand upright.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252020.html'
source_title="Exposition on Psalm 20"
