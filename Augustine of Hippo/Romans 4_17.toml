[[commentary]]
quote='''
Everything which God did not beget of himself but made through his Word he made not out of things which already existed but out of what did not exist at all, i.e., out of nothing.
'''
source_url=''
source_title="THE NATURE OF THE GOOD 26"

[[commentary]]
quote='''
When he says: Before God, in whom he believed, he indicated that faith is in the inner man, in the sight of God, not in the display before men, such as is the circumcision of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
