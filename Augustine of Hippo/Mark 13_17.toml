[[commentary]]
quote='''
“But woe to them that are with child, and that give suck in those days!” Ye have heard but now in the Gospel: “Take ye heed, for ye know not at what hour He cometh.” This is said figuratively. Who are those with child, and who give suck? Those who are with child, are the souls whose hope is in the world: but those who have gained what they hoped for, are meant by “they who give suck.” For example: one wisheth to buy a country seat; he is with child, for his object is not gained as yet, the womb swelleth in hope: he buyeth it; he hath brought forth, he now giveth suck to what he hath bought. “Woe to them that are with child, and that give suck in those days!” Woe to those who put their hope in the world; woe to them that cling to those things which they brought forth through hope in the world. What then should the Christian do? He should use, not serve, the world. What is this? Those that have as those that have not.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252096.html'
source_title="Exposition on Psalm 96"
