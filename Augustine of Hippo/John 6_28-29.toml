
[[commentary]]
quote='''
"They said therefore unto Him, What shall we do, that we may work the works of God?" For He had said to them, "Labor not for the meat which perisheth, but for that which endureth unto eternal life." "What shall we do?" they ask; by observing what, shall we be able to fulfill this precept? "Jesus answered and said unto them, This is the work of God, that ye believe on Him whom He has sent." This is then to eat the meat, not that which perisheth, but that which endureth unto eternal life. To what purpose dost thou make ready teeth and stomach? Believe, and thou hast eaten already. Faith is indeed distinguished from works, even as the apostle says, "that a man is justified by faith without the works of the law:" there are works which appear good, without faith in Christ; but they are not good, because they are not referred to that end in which works are good; "for Christ is the end of the law for righteousness to every one that believeth." For that reason, He willeth not to distinguish faith from work, but declared faith itself to be work. For it is that same faith that worketh by love. Nor did He say, This is your work; but, "This is the work of God, that ye believe on Him whom He has sent;" so that he who glories, may glory in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252025.html'
source_title="Tractates on John 25"
