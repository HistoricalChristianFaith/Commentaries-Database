[[commentary]]
quote='''
Grace causes sin not to have power over you. Therefore do not trust in yourself, lest sin thereby have much more power over you.
'''
source_url='https://www.newadvent.org/fathers/1308.htm'
source_title="On Continence 5.12"

[[commentary]]
quote='''
When he says: For sin shall not have dominion over you, for you are not under the law but under grace, this surely pertains now to that third stage, where a man already serves the law of God with his mind, although with the flesh he serves the law of sin. For he does not obey the desire of sin, although concupiscences still solicit and provoke him to consent, until the body too is made alive and death is swallowed up in victory. Since, therefore, we do not consent to evil desires, we are in grace, and sin does not reign in our mortal body; and altogether, from that passage where he says: We who are dead to sin, how shall we live in it? he describes the one who is established under grace. But he over whom sin has dominion, although he may wish to resist sin, is still under the law, not yet under grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
For they were under the law, not under grace, and therefore sin had dominion over them, from which a man is not freed by the law, but by grace. On which account he elsewhere says, "For sin shall not have dominion over you; because ye are not under the law, but under grace." Not that the law is evil; but because they are under its power, whom it makes guilty by imposing commandments, not by aiding. It is by grace that any one is a doer of the law; and without this grace, he who is placed under the law will be only a hearer of the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 24"
