[[commentary]]
quote='''
The apostle also says: "The wrath of God is revealed from heaven against all ungodliness and unrighteousness of men who hold back the truth in unrighteousness; because that which may be known of God is manifest in them; for God hath showed it unto them. For the invisible things of Him are from the creation of the world clearly seen—being understood by the things that are made—even His eternal power and Godhead, so that they are inexcusable." In what sense does he pronounce them to be "inexcusable," except with reference to such excuse as human pride is apt to allege in such words as, "If I had only known, I would have done it; did I not fail to do it because I was ignorant of it?" or, "I would do it if I knew how; but I do not know, therefore I do not do it"? All such excuse is removed from them when the precept is given them, or the knowledge is made manifest to them how to avoid sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 2"
