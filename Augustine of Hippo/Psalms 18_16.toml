[[commentary]]
quote='''
“He hath sent down from on high, and hath fetched Me (ver. 16): by calling out of the Gentiles for an inheritance “a glorious Church, not having spot, or wrinkle.” “He hath taken Me out of the multitude of waters.” He hath taken Me out of the multitude of peoples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
