[[commentary]]
quote='''
The title of this Psalm, which we have just chanted and proposed to discuss, is, “On the end, for Idithun, a Psalm for David himself.” Here then we must look for, and must attend to, the words of a certain person who is called Idithun; and if each one of ourselves may be Idithun, in that which he sings he recognises himself, and hears himself speak. For thou mayest see who was called Idithun, according to the ancient descent of man; let us, however, understand what this name is translated, and seek to comprehend the Truth in the translation of the word. According therefore to what we have been able to discover by enquiry in those names which have been translated from the Hebrew tongue into the Latin, by those who study the sacred writings, Idithun being translated is “over-leaping them.” Who then is this person “over-leaping them”? or who those whom he hath “over-leaped”?…For there are some persons, yet clinging to the earth, yet bowed down to the ground, yet setting their hearts on what is below, yet placing their hopes in things that pass away, whom he who is called “over-leaping them” hath “over-leaped.”

You know that some of the Psalms are entitled, “Songs of Degrees;” and in the Greek it is obvious enough what the word ἀναβαθμῶν means. For ἀναβαθμοὶ are degrees (or steps) of them that ascend, not of them that descend. The Latin, not being able to express it strictly, expresses it by the general term; and in that it called them “steps,” left it undetermined, whether they were “steps” of persons ascending or descending. But because there is no “speech or language where their voices are not heard among them,” the earlier language explains the one which comes after it: and what was ambiguous in one is made certain in another. Just then as there the singer is some one who is “ascending,” so here is it some one who is “over-leaping.”…Let this Idithun come still to us, let him “over-leap” those whose delight is in things below, and take delight in these things, and let him rejoice in the Word of the Lord; in the delight of the law of the Most High.…

“I said, I will take heed to my ways, that I sin not with my tongue” (ver. 1).…For it is not without reason that the tongue is set in a moist place, but because it is so prone to slip. Perceiving therefore how hard it was for a man to be under the necessity of speaking, and not to say something that he will wish unsaid, and filled with disgust at these sins, he seeks to avoid the like. To this difficulty is he exposed who is seeking to “leap beyond.”…Although I have “leaped beyond” the pleasures of earth, although the fleeting passions for things temporal ensnare me not, though now I despise these things below, and am rising up to better things than these, yet in these very better things the satisfaction of knowledge in the sight of God is enough for me. Of what use is it for me to speak what is to be laid hold of, and to give a handle to cavillers? Therefore, “I said, I will take heed to my ways, that I sin not with my tongue. I keep my mouth with a bridle.” Wherefore is this? Is it on account of the religious, the thoughtful, the faithful, the holy ones? God forbid! These persons hear in such a manner, as to praise what they approve; but as for what they disapprove, perhaps, among much that they praise they rather excuse than cavil at it; on account of what persons then dost thou “take heed to thy ways,” and place a guard on thy lips “that thou mayest not sin with thy tongue”? Hear: it is, “While the wicked standeth over against me.” It is not “by me” that he takes up his station, but “against me.” Why?…Even the Lord Himself says, “I have yet many things to say unto you, but ye cannot bear them now.” And the Apostle, “I could not speak unto you as unto spiritual, but as unto carnal.” Yet not as to persons to be despaired of, but as to those who still required to be nourished. For he goes on to say, “As babes in Christ, I have fed you with milk, and not with meat; for hitherto ye were not able.” Well, tell it unto us even now. “Neither yet now are ye able.” Be not therefore impatient to hear that which as yet thou art not capable of; but grow that thou mayest be “able to bear it.” It is thus we address the little one, who yet requires to be fed with kindly milk in the bosom of Mother Church, and to be rendered meet for the “strong meat” of the Lord’s Table. But what can I say even of that kind to the sinner, who “taketh his stand against me,” who either thinks or pretends himself capable of what he “cannot bear;” so that when I say anything unto him, and he has failed to comprehend it, he should not suppose that it was not he that had failed to comprehend, but I who had broken down. Therefore because of this sinner, who “taketh up his stand against me, I keep my mouth as it were with a bridle.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252039.html'
source_title="Exposition on Psalm 39"

[[commentary]]
quote='''
It is certain that it is we that act when we act; but it is He who makes us act, by applying efficacious powers to our will, who has said, "I will make you to walk in my statutes, and to observe my judgments, and to do them." When he says, "I will make you . . . to do them," what else does He say in fact than, "I will take away from you your heart of stone," from which used to arise your inability to act, "and I will give you a heart of flesh," in order that you may act? And what does this promise amount to but this: I will remove your hard heart, out of which you did not act, and I will give you an obedient heart, out of which you shall act? It is He who causes us to act, to whom the human suppliant says, "Set a watch, O Lord, before my mouth." That is to say: Make or enable me, O Lord, to set a watch before my mouth,—a benefit which he had already obtained from God who thus described its influence: "I set a watch upon my mouth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 32"
