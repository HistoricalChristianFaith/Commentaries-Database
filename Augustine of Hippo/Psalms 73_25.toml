[[commentary]]
quote='''
And he is beginning to think of that same Heavenly felicity, and to reprove himself, because he hath been a beast, and hath longed for things earthly. “For what have I in Heaven, and from Thee what have I willed upon earth?” (ver. 25). By your voice I see that ye have understood. He compared with his earthly will the heavenly reward which he is to receive; he saw what was there being reserved for him; and while thinking and burning at the thought of some ineffable thing, which neither eye hath seen, nor ear heard, nor into the heart of man hath ascended, he hath not said, this or that I have in Heaven, but, “what have I in Heaven?” What is that thing which I have in Heaven? What is it? How great is it? Of what sort is it? “And,” since that which I have in heaven doth not pass away, “from Thee what have I willed upon earth?”…Thou reservest, he saith, for me in Heaven riches immortal, even Thyself, and I have willed from Thee on earth that which even ungodly men have, which even evil men have, which even abandoned men have, money, gold, silver, jewels, households, which even many wicked men have: which even many profligate women have, many profligate men: these things as a great matter I have desired of my God upon earth: though my God reserveth Himself for me in Heaven!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
