[[commentary]]
quote='''
But our very life came down to earth and bore our death, and killed death with the very abundance of his own life. And thundering, he called us to return to him into that secret place from which he came forth to us—coming first into the virginal womb, where the human creature, our mortal flesh, was joined to him that it might not be forever mortal—and came "as a bridegroom coming out his chamber, rejoicing as a strong man to run a race." For he did not delay but ran through the world, crying out by words, deeds, death, life, descent, ascension—crying aloud to us to return to him. And he departed from our sight that we might return to our hearts and find him there. For he left us, and behold, he is here. He could not be with us long, yet he did not leave us. He went back to the place that he had never left, for "the world was made by him." In this world he was, and into this world he came, to save sinners. To him my soul confesses, and he heals it, because it had sinned against him. O mortals, how long will you be so slow of heart? Even now after life itself has come down to you, will you not ascend and live?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FConfessions%2FBook%25204.html'
source_title="Confessions 4.12.19"


[[commentary]]
quote='''
He came in the flesh intending to cleanse the vices of the flesh. He came, clothed in healing human clay, to cure our interior eyes that our outer earthy vesture had blinded, so that, with soundness of vision restored, we who had before been darkness might become a shining light in the Lord and so that the Light might no longer shine in darkness but might be clearly envisaged by those perceiving it. For this purpose, he came forth as a bridegroom from his chamber and "has rejoiced as an athlete to run the course." Comely as a bridegroom, strong as a giant; amiable and terrible, severe and serene; beautiful to the good, stern to the evil—remaining in the bosom of his Father, he took possession of the womb of his mother. In this bridal chamber, that is, in the womb of the Virgin, he united human to divine nature. The Word was made flesh for us so that coming forth from his mother, he might dwell among us, and so that, going forth to his Father, he might prepare a dwelling place for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520195.html'
source_title="SERMON 195:3"

[[commentary]]
quote='''
The Lord, on being invited, came to the marriage. What wonder if He came to that house to a marriage, having come into this world to a marriage? For, indeed, if He came not to a marriage, He has not here a bride. But what says the apostle? "I have espoused you to one husband, to present you a chaste virgin to Christ." Why does he fear lest the virginity of Christ's bride should be corrupted by the subtilty of the devil? "I fear," saith he, "lest as the serpent beguiled Eve by his subtilty, so also your minds should be corrupted from the simplicity and chastity which is in Christ." Thus has He here a bride whom He has redeemed by His blood, and to whom He has given the Holy Spirit as a pledge. He has freed her from the bondage of the devil: He died for her sins, and is risen again for her justification. Who will make such offerings to his bride? Men may offer to a bride every sort of earthly ornament,-gold, silver, precious stones, houses, slaves, estates, farms,-but will any give his own blood? For if one should give his own blood to his bride, he would not live to take her for his wife. But the Lord, dying without fear, gave His own blood for her, whom rising again He was to have, whom He had already united to Himself in the Virgin's womb. For the Word was the Bridegroom, and human flesh the bride; and both one, the Son of God, the same also being Son of man. The womb of the Virgin Mary, in which He became head of the Church, was His bridal chamber: thence He came forth, as a bridegroom from his chamber, as the Scripture foretold, "And rejoiced as a giant to run his way." From His chamber He came forth as a bridegroom; and being invited, came to the marriage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25208.html'
source_title="Tractates on John 8"

[[commentary]]
quote='''
“And He as a bridegroom coming forth out of His chamber” (ver. 5). And He, coming forth out of the Virgin’s womb, where God was united to man’s nature as a bridegroom to a bride. “Rejoiced as a giant to run His way.” Rejoiced as One exceeding strong, and surpassing all other men in power incomparable, not to inhabit, but to run His way. For, “He stood not in the way of sinners.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252019.html'
source_title="Exposition on Psalm 19"

[[commentary]]
quote='''
There are commonly spoken by balladists certain verses to Bridegrooms and Brides, called Epithalamia. Whatever is sung there, is sung in honour of the Bride and Bridegroom. Is there then no Bridechamber in that marriage-feast to which we are invited? Whence then does another Psalm say, “He hath set up His tabernacle in the Sun; and He is even as a bridegroom coming out of his chamber.” The nuptial union is that of “the Word,” and the flesh. The Bridechamber of this union, the Virgin’s womb. For the flesh itself was united to the Word: whence also it is said, “Henceforth they are not twain, but one flesh.” The Church was assumed unto Him out of the human race: so that the Flesh itself, being united to the Word, might be the Head of the Church: and the rest who believe, members of that Head.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"
