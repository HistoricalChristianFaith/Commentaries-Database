[[commentary]]
quote='''
Behold, there he is, wherever truth is known. He is within the inmost heart, yet the heart has wandered from him. Return to your heart, O you sinners, and hold fast to him who made you. Stand with him, and you shall stand firmly. Rest in him, and you shall be at rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FConfessions%2FBook%25204.html'
source_title="Confessions 4.12.18"

[[commentary]]
quote='''
"Go back, therefore, to the heart," and if you are believers, you will find Christ there. He himself is speaking to you there. Yes, here am I, shouting my head off—but he, in silence, is doing more teaching. I am speaking by the sound of these words; he is speaking inwardly by the awe you feel in your thoughts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520102.html'
source_title="SERMON 102:2"

[[commentary]]
quote='''
And we, who see in one way, and hear in another way, how know we this? We return perhaps to ourselves, if we are not the trangressors to whom it is said, "Return, O trangressors, to your heart." Return to your heart: why go from yourselves, and perish from yourselves? Why go the ways of solitude? You go astray by wandering: return ye. Whither? To the Lord. 'Tis quickly done: first return to thine own heart; thou hast wandered abroad an exile from thyself; thou knowest not thyself, and yet thou art asking by whom thou wast made! Return, return to thy heart, lift thyself away from the body: thy body is thy place of abode; thy heart perceives even by thy body. But thy body is not what thy heart is; leave even thy body, return to thy heart. In thy body thou didst find eyes in one place, ears in another place: dost thou find this in thy heart? Or hast thou not ears in thy heart? Else of what did the Lord say, "Whoso hath ears to hear, let him hear?" Or hast thou not eyes in thy heart? Else of what saith the apostle. "The eyes of your heart being enlightened?" Return to thy heart; see there what, it may be, thou canst perceive of God, for in it is the image of God. In the inner man dwelleth Christ, in the inner man art thou renewed after the image of God, in His own image recognize its Author.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252018.html'
source_title="Tractates on John 18"
