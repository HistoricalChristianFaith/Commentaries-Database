[[commentary]]
quote='''
“Teach me to do Thy will, for Thou art my God” (ver. 10). Glorious confession! glorious rule! “For Thou,” saith he, “art my God.” To another will I hasten to be re-made, if by another I was made. Thou art my all, “for Thou art my God.” Shall I seek a father to get an inheritance? “Thou art my God,” not only the Giver of mine inheritance, but mine Inheritance itself. “The Lord is the portion of mine inheritance.” Shall I seek a patron, to obtain redemption? “Thou art my God.” Lastly, having been created, do I desire to be re-created? “Thou art my God,” my Creator, who hast created me by Thy Word, and re-created me by Thy Word. “Teach Thou me:” for it cannot be that Thou art my God, and yet I am to be mine own master. See how grace is commended to us. This hold fast, this drink in, this let none drive out of your hearts, lest ye have “a zeal, of God, but not according to knowledge.” Say then this: “Thy good Spirit,” not my bad one, “Thy good Spirit shall lead me into the right land.” For my bad spirit hath led me into a crooked land. And what have I deserved? What can be reckoned as my good works without Thy aid, through which I might obtain and be worthy to be led by Thy Spirit into the right land?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520143.html'
source_title="Exposition on Psalm 143"
