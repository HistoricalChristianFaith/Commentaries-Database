[[commentary]]
quote='''
And in what sense the devil is to be understood as the prince of the world, is still more clearly unfolded by the Apostle Paul, who, after saying, "We wrestle not against flesh and blood," that is, against men, went on to say, "but against principalities and powers, and the world-rulers of this darkness." For in the very next word he has explained what he meant by "world," when he added, "of this darkness;" so that no one, by the name of the world, should understand the whole creation, of which in no sense are fallen angels the rulers. "Of this darkness," he says, that is, of the lovers of this world: of whom, nevertheless, there were some elected, not from any deserving of their own, but by the grace of God, to whom he says, "Ye were sometimes darkness; but now are ye light in the Lord." For all have been under the rulers of this darkness, that is, [under the rulers] of wicked men, or darkness, as it were, in subjection to darkness: but "thanks be to God, who hath delivered us," says the same apostle, "from the power of darkness, and hath translated us into the kingdom of the Son of His love."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252079.html'
source_title="Tractates on John 79"

[[commentary]]
quote='''
“Pour forth the weapon, and stop the way against them that persecute me” (ver. 3). Who are they that persecute thee? Haply thy neighbour, or he whom thou hast offended, or to whom thou hast done wrong, or who would take away what is thine, or against whom thou preachest the truth, or whose sin thou rebukest, or whom living ill by thy well living thou offendest. There are indeed even these enemies to us, and they persecute us: but other enemies we are taught to know, those against whom we fight invisibly, of whom the Apostle warneth us, saying, “We wrestle not against flesh and blood,” that is, against men; not against those whom ye see, but against those whom ye see not; “against principalities, against powers, against the rulers of the world, of this darkness.”…“The whole world lieth in wickedness;” therefore the Apostle explained of what world they were rulers, he said, “of this darkness.” The rulers of this world, I say, are the rulers of this darkness.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"

[[commentary]]
quote='''
Private enmities therefore let no one think of, when about to hear the words of this Psalm: “Know ye that for us the wrestling is not against flesh and blood, but against princes and powers, and spiritual things of wickedness,” that is, against the devil and his angels; because even when we suffer men that annoy us, he is instigating, he is inflaming, as it were his vessels he is moving. Let us give heed therefore to two enemies, him whom we see, and him whom we see not; man we see, the devil we see not; man let us love, of the devil beware; for man pray, against the devil pray, and let us say to God, “Have pity on me, O Lord, for man hath trodden me down” (ver. 1).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"

[[commentary]]
quote='''
For who are these enemies, but they of whom the Apostle saith, “Ye have not wrestling against flesh and blood.”…Against the devil and his angels we are waging hostilities. Rulers of the world he hath called them, because they do themselves rule the lovers of the world. For they do not rule the world, as if they were rulers of heaven and earth: but he is calling sinners the world.…With the devil and his angels there is no concord. They do themselves grudge us the kingdom of Heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252077.html'
source_title="Exposition on Psalm 77"

[[commentary]]
quote='''
The rulers of this world, of this darkness, the rulers of the wicked; against these ye wrestle. Great is your conflict, not to see your enemies, and yet to conquer. Against the rulers of this world, of this darkness, the devil, that is, and his angels; not the rulers of that world, whereof is said, “the world was made by Him,” but that world whereof is said, “the world knew Him not.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520143.html'
source_title="Exposition on Psalm 143"
