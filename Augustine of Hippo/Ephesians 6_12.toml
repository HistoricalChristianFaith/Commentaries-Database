[[commentary]]
quote='''
And in what sense the devil is to be understood as the prince of the world, is still more clearly unfolded by the Apostle Paul, who, after saying, "We wrestle not against flesh and blood," that is, against men, went on to say, "but against principalities and powers, and the world-rulers of this darkness." For in the very next word he has explained what he meant by "world," when he added, "of this darkness;" so that no one, by the name of the world, should understand the whole creation, of which in no sense are fallen angels the rulers. "Of this darkness," he says, that is, of the lovers of this world: of whom, nevertheless, there were some elected, not from any deserving of their own, but by the grace of God, to whom he says, "Ye were sometimes darkness; but now are ye light in the Lord." For all have been under the rulers of this darkness, that is, [under the rulers] of wicked men, or darkness, as it were, in subjection to darkness: but "thanks be to God, who hath delivered us," says the same apostle, "from the power of darkness, and hath translated us into the kingdom of the Son of His love."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252079.html'
source_title="Tractates on John 79"
