[[commentary]]
quote='''
“The Lord is the strength of His people” (ver. 8). Not that people “ignorant of the righteousness of God, and willing to establish their own.” For they thought not themselves strong in themselves: for the Lord is the strength of His people, struggling in this life’s difficulties with the devil. “And the protector of the salvation of His Christ.” That, having saved them by His Christ after the strength of war, He may protect them at the last with the immortality of peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252028.html'
source_title="Exposition on Psalm 28"
