[[commentary]]
quote='''
But there is a certain disputer who seemeth unto himself learned, and saith, I do not worship that stone, nor that image which is without sense;…I worship not this image but I adore what I see, and serve him whom I see not. Who is that? Some invisible deity, he replieth, who presideth over that image. By giving this account of their images, they seem to themselves able disputants, because they do not worship idols, and yet do worship devils. “The things,” brethren, saith the Apostle, “which the Gentiles sacrifice, they sacrifice unto devils, and not to God; we know that an idol is nothing: and that what the Gentiles sacrifice, they sacrifice to devils, and not to God; and I would not that ye should have fellowship with devils.” Let them not therefore excuse themselves on this ground, that they are not devoted to insensate idols; they are rather devoted to devils, which is more dangerous. For if they were only worshipping idols, as they would not help them, so they would not hurt them; but if thou worship and serve devils, they themselves will be thy masters.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
