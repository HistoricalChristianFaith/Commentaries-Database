[[commentary]]
quote='''
The creed builds up in you what you ought to believe and confess in order to be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520214.html'
source_title="SERMONS FOR THE RECENT CONVERTS, HOMILY 214.1"

[[commentary]]
quote='''
“She answered Him:” but where? “in the path of His strength.”…The Church therefore answered Him not in the way of weakness; because after His resurrection He called the Church from the whole world, no longer weak upon the cross, but strong in heaven. For it is not the praise of the Christian faith that they believe that Christ died, but that they believe that He arose from the dead. Even the Pagan believeth that He died; and maketh this a charge against thee, that thou hast believed in one dead. What then is thy praise? It is that thou believest that Christ arose from the dead, and that thou dost hope that thou shalt rise from the dead through Christ: this is the praise of faith. “For if thou shalt confess with thy mouth that Jesus is the Lord, and shalt believe in thy heart that God hath raised Him from the dead, thou shalt be saved.”…This is the faith of Christians. In this faith then, in which the Church is gathered, “She hath answered Him,” She gave Him worship according to His commandments: “in the path of His strength,” not in the path of His weakness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
