[[commentary]]
quote='''
“Out of thy ivory palaces, whereby kings’ daughters have made Thee glad.” Choose whichever you please, “ivory” palaces, or “magnificent,” or “royal” palaces, it is out of these that the kings’ daughters have made Christ glad. Would you understand the spiritual sense of “ivory palaces”? Understand by them the magnificent houses, and tabernacles of God, the hearts of the Saints; and by these self-same “kings” those who rule their flesh; who bring into subjection to themselves the rebellious commonalty of human affections, who chastise the body, and reduce it to bondage: for it is from these that the daughters of kings have made Him glad. For all the souls that have been born through their preaching and evangelizing are “daughters of kings:” and the Churches, as the daughters of Apostles, are daughters of kings. For He is “King of kings;” they themselves kings, of whom it was said, “Ye shall sit upon twelve thrones, judging the twelve tribes of Israel.” They preached the “Word of Truth;” and begat Churches not for themselves, but for Him.…Therefore as “raising up seed to their brother,” to as many as they begat, they gave the name not of “Paulians” or “Petrians,” but of “Christians.” Observe whether that sense is not wakefully kept in these verses. For when he said, “out of the ivory palaces, he spake of mansions royal, ample, honourable, peaceful, like the heart of the Saints; he added, “Whereby the kings’ daughters have made Thee glad in Thine honour.” They are indeed daughters of kings, daughters of thine Apostles, but still “in Thine honour:” for they raised up seed to their brother. Hence Paul, when he saw those whom he had raised up unto his Brother, running after his own name, exclaimed, “Was Paul crucified for you?”…No; for he says, “Or were ye baptized in the name of Paul?”

“The daughters of kings have made Thee glad in Thine honour.” Keep, hold fast this “in Thine honour.” This is meant by having “a wedding garment;” seeking His honour, His glory. Understand moreover by “kings’ daughters” the cities, which were founded by kings, and have received the faith: and out of the ivory palaces (palaces rich, the proud, the lifted up). “Kings’ daughters have made Thee glad in Thine honour;” in that they sought not the honour of their founders, but have sought Thine honour. Show me at Rome a temple of Romulus held in so great honour as I can show you the Monument of Peter. In Peter, who is honoured but He who died for us? For we are followers of Christ, not followers of Peter. And even if we were born from the brother of Him that is dead, yet are we named after the name of Him who is dead. We were begotten by the one, but begotten to the other. Behold, Rome, Carthage, and several other cities are the daughters of kings, and yet have they “made glad the King in His honour:” and all these make up one single Queen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"
