[[commentary]]
quote='''
Look at the Lord who did precisely what he commanded. After so many things the godless Jews committed against him, repaying him evil for good, did he not say as he hung on the cross, "Father, forgive them, because they do not know what they are doing"? He prayed as man, and as God with the Father, he heard the prayer. Even now he prays in us, for us and is prayed to by us. He prays in us as our high priest. He prays for us as our head. He is prayed to by us as our God. When he was praying as he hung on the cross, he could see and foresee. He could see all his enemies. He could foresee that many of them would become his friends. That is why he was interceding for them all. They were raging, but he was praying. They were saying to Pilate "Crucify," but he was crying out, "Father, forgive." He was hanging from the cruel nails, but he did not lose his gentleness. He was asking for pardon for those from whom he was receiving such hideous treatment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520382.html'
source_title="SERMON 382.2"

[[commentary]]
quote='''
So, brothers and sisters, let us learn above all from the example of this martyr [Stephen] how to love our enemies. We have just had the example given us of God the Father, who makes his sun rise on the good and the bad. The Son of God also said this after receiving his flesh, through the mouth of the flesh which he received for love of his enemies. After all, he came into the world as a lover of his enemies, he found absolutely all of us his enemies, he didn't find anyone a friend. It was for enemies that he shed his blood, but by his blood that he converted his enemies. With his blood he wiped out his enemies' sins; by wiping out their sins, he made friends out of enemies. One of these friends was Stephen, or rather, is and will be. Yet the Lord himself was the first to show on the cross what his instructions were. With the Jews, you see, howling at him from all sides, furious, mocking, jeering, crucifying him, he could still say, "Father, forgive them, because they do not know what they are doing; after all, it is blindness that is crucifying me." Blindness was crucifying him, and the crucified was making an eye-salve for them from his blood.But people who are reluctant to carry out the precept, eager to get the reward, who don't love their enemies but do their best to avenge themselves on them, don't pay any attention to the Lord, who would have had nobody left to praise him if he had wanted to avenge himself on his enemies. So when they hear this place in the Gospel, where the Lord says on the cross, "Father, forgive them, because they do not know what they are doing," they say to themselves, He could do that as the Son of God, as the only Son of the Father. Yes, it was flesh hanging there, but God was hidden within. As for us, though, what are we to do that sort of thing?
So didn't he really mean it when he gave this order? Perish the thought; he certainly meant it. If you think it is asking too much of you to imitate your Lord, look at Stephen your fellow servant.…
So Stephen loved his enemies. I mean, while he stood up to pray for himself, he knelt down for them. Clearly he fulfilled what had been written. He proved to be a true imitator of the Lord's passion and a perfect disciple of Christ, completing in his own passion what he had heard from the Master. The Lord, you see, while hanging on the cross had said, "Father, forgive them because they do not know what they are doing." And the blessed Stephen, when he was already almost buried under the stones, spoke like this: "Lord Jesus, do not hold this sin against them." Oh, what an apostolic man, already from being a disciple become a master! It was necessary, after all, for the first martyr of Christ to follow the teaching of the Master. He prays for the godless, he prays for blasphemers, he prays for those who are stoning him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520317.html'
source_title="SERMON 317.2-3, 6"

[[commentary]]
quote='''
Let me now tell you something that will help you believe what you cannot possibly understand unless you believe. Tell me, how many souls were there, in the Acts of the Apostles, who believed when they observed the miracles of the apostles? I mean those Jews who had crucified the Lord, who brought along blood stained hands, who had sacrilegious ears, whose tongues were compared with a sword. "Their teeth are weapons and arrows, and their tongue a sharp sword." Christ had not prayed for them in vain. He did not say in vain, "Father, forgive them, because they do not know what they are doing." From their number, a very great many believed. As we can read, "There believed on that day," as it says, "three thousand souls." There you have thousands of souls, and here so many thousand souls. The Holy Spirit came on them, through whom loved is poured out in our hearts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520229G.html'
source_title="SERMON 229G.5"

[[commentary]]
quote='''
You are a Christian. You carry the cross of Christ on your forehead. The mark stamped on you teaches you what you should profess. He was hanging on the cross, which you carry on your forehead. Do not delight in the sign of the wood but in the sign of the one hanging on it. When he was hanging on the cross, he was looking around at the people raving against him, putting up with their insults and praying for his enemies. While they were killing him, the doctor was curing the sick with his blood. He said, "Father, forgive them, because they do not know what they are doing." These words were not futile or without effect. Later, thousands of those people believed in the one they murdered, so that they learned how to suffer for him who had suffered for them and at their hands.Brothers and sisters, we should understand this from this sign, from this stamp that Christians receive even when they become catechumens. From this, we should understand why we are Christians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520302.html'
source_title="SERMON 302.3"

[[commentary]]
quote='''
(de Con. Ev. lib. iii. c. 12.) This matter indeed was briefly related by the three first Evangelists, but John more distinctly explains how it was done.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
A great wickedness indeed it was, the thought of which might make them despair; yet it did not behove them to despair, for whom the Lord, as He hung on the cross, deigned to pray. For He had said, "Father, forgive them; for they know not what they do. He saw some who were His own among many who were aliens; for these He sought pardon, from whom at the time He was still receiving injury. He regarded not that He was being put to death by them, but only that He was dying for them. It was a great thing that was forgiven them, it was a great thing that was done by them and for them, so that no man should despair of the forgiveness of his sin when they who slew Christ obtained pardon. Christ died for us, but surely He was not put to death by us? But those men indeed saw Christ dying by their own villany; and yet they believed on Christ pardoning their villanies. Until they drank the blood they had shed, they despaired of their own salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252031.html'
source_title="Tractates on John 31"

[[commentary]]
quote='''
But we must not speak in a mere cursory way of the partition and dividing by lot of His garments. For although all the four evangelists make mention thereof, yet the others do so more briefly than John: and their notice of it is obscure, while his is in the plainest manner possible. For Matthew says, "And after they crucified Him, they parted His garments, casting lots." Mark: "And they crucified Him, and parted His garments, casting lots upon them, what every man should take." Luke: "And they parted His raiment, and cast lots." But John has told us also how many parts they made of His garments, namely, four, that they might take one part apiece. From which it, is apparent that there were four soldiers, who obeyed the governor's orders in crucifying Him. For he plainly says: "Then the soldiers, when they had crucified Him, took His garments, and made four parts, to every soldier a part; and likewise the coat," where there is understood, they took: so that the meaning is, they took His garments, and made four parts, to every soldier a part; and they took also His coat. And he so spake, that we might see that there was no lot cast on His other garments; but His coat, which they took along with the others, they did not similarly divide. For in regard to it he proceeds to explain, "Now the coat was without seam, woven from the top throughout." And then telling us why they cast lots on it, he says, "They said therefore among themselves, Let us not rend it, but cast lots for it, whose it shall be." Hence it is clear that in the case of the other garments they had equal parts, so that there was no need to cast lots: but that as regards this one, they could not have had a part each without rending it, and thereby possessing themselves only of useless fragments of it; to prevent which, they preferred letting it come to one of them by lot. The account given by this evangelist is also in harmony with the testimony of prophecy, which he likewise immediately subjoins, saying, "That the scripture might be fulfilled which saith, They parted my raiment among them, and for my vesture they did cast lots." For He says not, they cast lots, but "they parted:" nor does He say, casting lots they parted; but while making no mention whatever of the lot in regard to the rest of the garments, He afterwards said, "and for my vesture they did cast lots," in reference solely to the coat that remained. On which I shall speak as He Himself enables me, after I have first refuted the calumny, which may possibly arise, as if the evangelists disagreed with one another, by showing that the words of none of the others are inconsistent with the narrative of John.

For Matthew, in saying, "They parted His garments, casting lots," wished it to be understood, that in the whole affair of parting the garments, the coat was also included, on which they cast lots; for in course of parting all the garments, of which it also was one on it alone they cast lots. To the same purpose also are the words of Luke: "Parting His garments, they cast lots;" for in the process of parting they came to the coat whereon the lot was cast, that the entire parting of His garments among them might be completed. And what difference is there whether it is said, "Parting they cast lots," according to Luke; or, "They parted, casting the lot," according to Matthew: unless it be that Luke, in saying "lots," used the plural for the singular number,-a form of speech that is not unusual in the Holy Scriptures, although some copies are found to have "lot," and not "lots"? Mark, therefore, is the only one who seems to have introduced any kind of difficulty; for in saying, "Casting the lot upon them, what every man should take," his words seem to imply, as if the lot was cast on all the garments, and not on the coat alone. But here also brevity is the cause of the obscurity; for the words, "Casting the lot upon them," are as if it were said, Casting the lot when they were in the process of division; which was also the case. For the partition of all His garments would not have been complete, had it not been declared by lot which of them also should get possession of the coat, so as thereby to bring any contention on the part of the dividers to an end, or rather prevent any such from arising. In saying, therefore, "What every man should take," so far as that has to do with the lot, we must not take it as referring to all the garments that were divided; for the lot was cast, who should take the coat: whereof having omitted to describe the particular form, and how, in the equal division that was made of the parts, it remained by itself, in order, without being rent, to be awarded by lot, he therefore made use of the expression, "what every man should take," in other words, who it was that should take it: as if the whole were thus expressed, They parted His garments, casting the lot upon them, who should take the coat, which had remained over in addition to their equal shares of the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520118.html'
source_title="Tractates on John 118"

[[commentary]]
quote='''
“And Thou, Lord God, art One who hast compassion and merciful, longsuffering, and very pitiful, and true” (ver. 15). Wherefore longsuffering and very pitiful, and One who hast compassion? Because hanging on the Cross He said: “Father, forgive them, for they know not what they do.” Whom prayeth He to? for whom doth He pray? Who prayeth? Where prayeth He? The Son prays to the Father, crucified for the ungodly, in the midst of very insults, not of words but of death inflicted, hanging on the Cross; as if for this He had His hands stretched out, that thus He might pray for them, that His “prayer might be directed like incense in the sight of the Father, and the lifting up of His hands like an evening sacrifice.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
