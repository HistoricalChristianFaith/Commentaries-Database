[[commentary]]
quote='''
“But Thou, O Lord, art my taker.” It is said to God in the nature of man, for the taking of man is, the Word made Flesh. “My glory.” Even He calls God his glory, whom the Word of God so took, that God became one with Him. Let the proud learn, who unwillingly hear, when it is said to them, “For what hast thou that thou didst not receive? Now if thou didst receive it, why dost thou glory as if thou hadst not received it?” “And the lifter up of my head” (ver. 3). I think that this should be here taken of the human mind, which is not unreasonably called the head of the soul; which so inhered in, and in a sort coalesced with, the supereminent excellency of the Word taking man, that it was not laid aside by so great humiliation of the Passion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25203.html'
source_title="Exposition on Psalm 3"
