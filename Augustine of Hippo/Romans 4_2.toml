[[commentary]]
quote='''
When he says: For if Abraham was justified by works, he has glory, but not before God, this means that, since Abraham, being without the law, does not gain glory from the works of the law—as if he were fulfilling the law by his own strength, when that law had not yet been given—that glory is God's, not his own. For he was justified not by his own merit as if from works, but by the grace of God, through faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
