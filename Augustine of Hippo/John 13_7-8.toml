[[commentary]]
quote='''
But "Jesus answered and said unto him, What I do thou knowest not now, but thou shalt know hereafter." And not even yet, terrified as he was by the sublimity of the Lord's action, does he allow it to be done, while ignorant of its purpose; but is unwilling to see, unable to endure, that Christ should thus humble Himself to his very feet. "Thou shalt never," he says, "wash my feet." What is this "never" [in aeternum]? I will never endure, never suffer, never permit it: that is, a thing is not done "in aeternum" which is never done. Then the Saviour, to terrify His reluctant patient with the danger of his own salvation, says, "If I wash thee not, thou shalt have no part with me." He speaks in this way, "If I wash thee not," when He was referring only to his feet; just as it is customary to say, You are trampling on me, when it is only the foot that is trampled on.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252056.html'
source_title="Tractates on John 56"
