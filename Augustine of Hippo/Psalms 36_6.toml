[[commentary]]
quote='''
There is therefore a Light which made this light of the sun: let us love this Light, let us long to understand it, let us thirst for the same; that, with itself for our guide, we may at length come to it, and that we may so live in it that we may never die. This is indeed that Light of which prophecy long ago going before thus sang in the psalm: "O Lord, Thou shalt save men and beasts; even as Thy mercy is multiplied, O God." These are the words of the holy psalm: mark ye what the ancient discourse of holy men of God did premise concerning such a light. "Men," saith it, "and beasts Thou shalt save, O Lord; even as Thy mercy is multiplied, O God." For since Thou art God, and hast manifold mercy, the same multiplicity of Thy mercy reaches not only to men whom Thou hast created in Thine own image, but even to the beasts which Thou hast made subservient to men. For He who gives salvation to man, the same gives salvation also to the beast. Do not blush to think this of the Lord thy God: nay, rather believe this and trust it, and see thou think not otherwise. He that saves thee, the same saves thy horse and thy sheep; to come to the very least, also thy hen: "Salvation is of the Lord," and God saves these. Thou art uneasy, thou questionest. I wonder why thou doubtest. Shall He disdain to save who deigned to create? Of the Lord is the saving of angels, of men, and of beasts: "Salvation is of the Lord." Just as no man is from himself, so no man is saved by himself. Therefore most truly and right well doth the psalm say, "O Lord, Thou shall save men and beasts." Why? "Even as thy mercy is multiplied, O God." For Thou art God, Thou hast created, Thou savest: Thou gavest being, Thou givest to be in health.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252034.html'
source_title="Tractates on John 34"

[[commentary]]
quote='''
“Thy Righteousness is like the mountains of God: Thy Judgments are a great deep” (ver. 6). Who are the mountains of God? Those who are called clouds, the same are also the mountains of God. The great Preachers are the mountains of God. And as when the sun riseth, he first clothes the mountains with light, and thence the light descends to the lowest parts of the earth: so our Lord Jesus Christ, when He came, first irradiated the height of the Apostles, first enlightened the mountains, and so His Light descended to the valley of the world. And therefore saith He in a certain Psalm, “I lifted up mine eyes unto the mountains, from whence cometh my help.” But think not that the mountains themselves will give thee help: for they receive what they may give, give not of their own. And if thou remain in the mountains, thy hope will not be strong: but in Him who enlighteneth the mountains, ought to be thy hope and presumption. Thy help indeed will come to thee through the mountains, because the Scriptures are administered to thee through the mountains, through the great Preachers of the Truth: but fix not thy hope in them. Hear what He saith next following: “I lifted up mine eyes unto the mountains, from whence cometh my help.” What then? Do the mountains give thee help? No; hear what follows, “My help cometh from the Lord, which made Heaven and earth.” Through the mountains cometh help, but not from the mountains. From whom then? “From the Lord, which made Heaven and earth.”…

“Thy Judgments are like the great abyss.” The abyss he calleth the depth of sin, whither every one cometh by despising God; as in a certain place it is said, “God gave them over to their own hearts’ lusts, to do the things which are not convenient.”…Because then they were proud and ungrateful, they were held worthy to be delivered up to the lusts of their own hearts, and became a great abyss, so that they not only sinned, but also worked craftily, lest they should understand their iniquity, and hate it. That is the depth of wickedness, to be unwilling to find it out and to hate it. But how one cometh to that depth, see; “Thy Judgments are the great abyss.” As the mountains are by the Righteousness of God, who through His Grace become great: so also through His Judgments come they unto the depth, who sink lowest. By this then let the mountains delight thee, by this turn away from the abyss, and turn thyself unto that, of which it is said, “My help cometh from the Lord.” But whereby? “I have lifted up mine eyes unto the mountains.” What meaneth this? I will speak plainly. In the Church of God thou findest an abyss, thou findest also mountains; thou findest there but few good, because the mountains are few, the abyss broad; that is, thou findest many living ill after the wrath of God, because they have so worked that they are delivered up to the lusts of their own heart; so now they defend their sins and confess them not; but say, Why? What have I done? Such an one did this, and such an one did that. Now will they even defend what the Divine Word reproves. This is the abyss. Therefore in a certain place saith the Scripture (hear this abyss), “The sinner when he cometh unto the depth of sin despiseth.” See, “Thy Judgments are like the great abyss.” But yet not art thou a mountain; not yet art thou in the abyss; fly from the abyss, tend towards the mountains; but yet remain not on the mountains. “For thy help cometh from the Lord, which made Heaven and earth.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252036.html'
source_title="Exposition on Psalm 36"

[[commentary]]
quote='''
It is too little to say, thee; the sparrow, the locust, the worm, none of these did He not make, and He careth for all. His care refers not to His commandment, for this commandment He gave to man alone.…As regards then the tenor of the commandment, “God doth not take care for oxen:” as regards His providential care of the universe, whereby He created all things, and ruleth the world, “Thou, Lord, shalt save both man and beast.” Here perhaps some one may say to me, “God careth not for oxen,” comes from the New Testament: “Thou, Lord, shalt save both man and beast,” is from the Old Testament. There are some who find fault and say, that these two Testaments agree not with one another.…Let us hear the Lord Himself, the Chief and Master of the Apostles: “Consider,” saith He, “the fowls of the air; they sow not, neither do they reap, nor gather into barns, and your heavenly Father feedeth them.” Therefore even beside men, these animals are objects of care to God, to be fed, not to receive a law. As far then as regards giving a law, “God careth not for oxen:” as regards creating, feeding, governing, ruling, all things have to do with God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520146.html'
source_title="Exposition on Psalm 146"
