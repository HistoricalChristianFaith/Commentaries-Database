[[commentary]]
quote='''
Lest, however, it should be thought that men themselves in this matter do nothing by free will, it is said in the Psalm, "Harden not your hearts;" and in Ezekiel himself, "Cast away from you all your transgressions, which ye have impiously committed against me; and make you a new heart and a new spirit; and keep all my commandments. For why will ye die, O house of Israel, saith the Lord? for I have no pleasure in the death of him that dieth, saith the Lord God: and turn ye, and live." We should remember that it is He who says, "Turn ye and live," to whom it is said in prayer, "Turn us again, O God." We should remember that He says, "Cast away from you all your transgressions," when it is even He who justifies the ungodly. We should remember that He says, "Make you a new heart and a new spirit," who also promises, "I will give you a new heart, and a new spirit will I put within you." How is it, then, that He who says, "Make you," also says, "I will give you"? Why does He command, if He is to give? Why does He give if man is to make, except it be that He gives what He commands when He helps him to obey whom He commands?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 31"
