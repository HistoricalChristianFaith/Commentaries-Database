[[commentary]]
quote='''
“I have been forgotten, as one dead from the heart” (ver. 12). And they have forgotten me, as if I were dead from their hearts. “I have become as a lost vessel.” I have seemed to myself to be lost to all the Lord’s service, living in this world, and gaining none, when all were afraid to join themselves unto me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
