[[commentary]]
quote='''
“His glory is great in Thy salvation” (ver. 5). Great indeed is His glory in the salvation, whereby Thou hast raised Him up again. “Glory and great honour shalt Thou lay upon Him.” But Thou shalt yet add unto Him glory and great honour, when Thou shalt place Him in heaven at Thy right hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
