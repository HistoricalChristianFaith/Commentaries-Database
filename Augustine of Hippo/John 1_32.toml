[[commentary]]
quote='''
And Christ was certainly not then anointed with the Holy Spirit, when He, as a dove, descended upon Him at His baptism. For at that time He deigned to prefigure His body, i.e. His Church, in which especially the baptized receive the Holy Spirit. But He is to be understood to have been then anointed with that mystical and invisible unction, when the Word of God was made flesh, i.e. when human nature, without any precedent merits of good works, was joined to God the Word in the womb of the Virgin, so that with it it became one person. Therefore it is that we confess Him to have been born of the Holy Spirit and of the Virgin Mary. For it is most absurd to believe Him to have received the Holy Spirit when He was near thirty years old: for at that age He was baptized by John; but that He came to baptism as without any sin at all, so not without the Holy Spirit. For if it was written of His servant and forerunner John himself, "He shall be filled with the Holy Spirit, even from his mother's womb," because, although generated by his father, yet he received the Holy Spirit when formed in the womb; what must be understood and believed of the man Christ, of whose flesh the very conception was not carnal, but spiritual?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520The%2520Trinity%2FBook%252015.html'
source_title="ON THE TRINITY 15.26.46"

[[commentary]]
quote='''
We do not attribute only to Christ the possession of a real body and say that the Holy Spirit assumed a false appearance to people's eyes. For the Holy Spirit could no more, in consistency with his nature, deceive people than could the Son of God. The almighty God, who made every creature out of nothing, could as easily form a real body of a dove, without the instrumentality of other doves, as he made a real body in the womb of the Virgin without the seed of the male.
'''
source_url=''
source_title="CHRISTIAN COMBAT 22.24"
