[[commentary]]
quote='''
And Christ was certainly not then anointed with the Holy Spirit, when He, as a dove, descended upon Him at His baptism. For at that time He deigned to prefigure His body, i.e. His Church, in which especially the baptized receive the Holy Spirit. But He is to be understood to have been then anointed with that mystical and invisible unction, when the Word of God was made flesh, i.e. when human nature, without any precedent merits of good works, was joined to God the Word in the womb of the Virgin, so that with it it became one person. Therefore it is that we confess Him to have been born of the Holy Spirit and of the Virgin Mary. For it is most absurd to believe Him to have received the Holy Spirit when He was near thirty years old: for at that age He was baptized by John; but that He came to baptism as without any sin at all, so not without the Holy Spirit. For if it was written of His servant and forerunner John himself, "He shall be filled with the Holy Spirit, even from his mother's womb," because, although generated by his father, yet he received the Holy Spirit when formed in the womb; what must be understood and believed of the man Christ, of whose flesh the very conception was not carnal, but spiritual?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520The%2520Trinity%2FBook%252015.html'
source_title="ON THE TRINITY 15.26.46"

[[commentary]]
quote='''
We do not attribute only to Christ the possession of a real body and say that the Holy Spirit assumed a false appearance to people's eyes. For the Holy Spirit could no more, in consistency with his nature, deceive people than could the Son of God. The almighty God, who made every creature out of nothing, could as easily form a real body of a dove, without the instrumentality of other doves, as he made a real body in the womb of the Virgin without the seed of the male.
'''
source_url=''
source_title="CHRISTIAN COMBAT 22.24"

[[commentary]]
quote='''
I Confess to you, holy brethren, I was afraid the cold would have made you cold in assembling yourselves together; but since you prove by this, your crowded assembly, that you are fervent in spirit, I doubt not that you have also prayed for me, that I may pay you what I owe. For I promised you in the name of Christ that, as the shortness of the time prevented us from expounding it before, I would to-day discuss why God was pleased to manifest the Holy Ghost in the form of a dove. That this may be explained, this day has dawned on us; and I perceive that from eagerness to hear, and pious devotion, you have come together in greater number than usual. May God, by our mouth, fulfill your expectation. For your coming together is of your love; but love of what? If of us, even that is well; for we desire to be loved by you, but not in ourselves. Because we love you in Christ, do you love us in Christ in return, and let our love mutually sigh towards God; for the note of the dove is a sighing or moaning.

Now if the dove's note is a moaning, as we all know it to be, and doves moan in love, hear what the apostle says, and wonder not that the Holy Ghost willed to be manifested in the form of a dove: "For what we should pray for as we ought," says he, "we know not; but the Spirit Himself intercedes for us with groanings which cannot be uttered." What then, my brethren? shall we say this, that the Spirit groans where He has perfect and eternal blessedness with the Father and the Son? For the Holy Spirit is God, even as the Son of God is God, and the Father God. I have said "God" thrice, but not three Gods; for indeed it is God thrice rather than three Gods; because the Father, and the Son, and the Holy Ghost are one God: this you know full well. It is not then in Himself with Himself in that Trinity, in that blessedness, in that His eternal substance, that the Holy Spirit groans; but in us He groans because He makes us to groan. Nor is it a little matter that the Holy Spirit teaches us to groan, for He gives us to know that we are sojourners in a foreign land, and He teaches us to sigh after our native country; and through that very longing do we groan. He with whom it is well in this world, or rather he who thinks it is well with him, who exults in the joy of carnal things, in the abundance of things temporal, in an empty felicity, has the cry of the raven; for the raven's cry is full of clamor, not of groaning. But he who knows that he is in the pressure of this mortal life, a pilgrim "absent from the Lord," that he does not yet possess that perpetual blessedness which is promised to us, but that he has it in hope, and will have it in reality when the Lord shall come openly in glory who came before in humility concealed; he, I say, who knows this doth groan. And so long as it is for this he groans, he does well to groan; it was the Spirit that taught him to groan, he learnt it from the dove. Many indeed groan by reason of earthly misery. They are shattered, it may be, by losses, or weighed down by bodily ailment, or shut up in prisons, or bound with chains, or tossed about on the waves of the sea, or hedged in by the ensnaring devices of their enemies. Therefore do they groan, but not with the moaning of the dove, not with love of God, not in the Spirit. Accordingly, when such are delivered from these same afflictions, they exult with loud voices, whereby it is made manifest that they are ravens, not doves. It was with good reason that a raven was sent forth from the ark, and returned not again; a dove was sent forth, and it returned. These two birds Noah sent forth. He had there the raven, and also the dove. That ark contained both kinds; and if the ark was a figure of the Church, you see indeed that in the present deluge of the world, the Church must of necessity contain both kinds, as well the raven as the dove. Who are the ravens? They who seek their own. Who are the doves? They who seek the things that are Christ's.

Therefore, when He sent the Holy Spirit He manifested Him visibly in two ways-by a dove and by fire: by a dove upon the Lord when He was baptized, by fire upon the disciples when they were gathered together. For when the Lord had ascended into heaven after His resurrection, having spent forty days with His disciples, and the day of Pentecost being fully come, He sent unto them the Holy Spirit as He had promised. Accordingly the Spirit coming at that time filled the place, and there was first a sound from heaven as of a rushing mighty wind, as we read in the Acts of the Apostles, and "there appeared unto them," it says, "cloven tongues as of fire, and it sat upon each of them; and they began to speak with tongues, as the Spirit gave them utterance." Here we have seen a dove descending upon the Lord; there, cloven tongues upon the assembled disciples: in the former, simplicity is shown; in the latter, fervency. Now there are who are said to be simple, who are only indolent; they are called simple, but they are only slow. Not such was Stephen, full of the Holy Ghost: he was simple, because he injured no one; he was fervent, because he reproved the ungodly. For he held not his peace before the Jews. His are those burning words: "Ye stiff-necked and uncircumcised of heart and ears, ye do always resist the Holy Spirit." Mighty impetuosity; but it is the dove without gall raging. For that you know that he was fierce without gall, see how, upon hearing these words, they who were the ravens immediately took up stones and rushed together upon this dove. They begin to stone Stephen; and he who a little before stormed and glowed with ardor of spirit,-who had, as it were, made an onset on his enemies, and like one full of violence had attacked them in such fiery and burning words as you have heard, "Ye stiff-necked and uncircumcised in heart and ears," that any one who heard those words might fancy that Stephen, if he were allowed, would have them consumed at once,-but when the stones thrown from their hands reached him, with fixed knee he saith, "Lord, lay not this sin to their charge." He held fast to the unity of the dove. For his Master, upon whom the dove descended, had done the same thing before him; who, while hanging on the cross, said, "Father, forgive them, for they know not what they do." Wherefore by the dove it is shown that they who are sanctified by the Spirit should be without guile; and that their simplicity should not continue cold is shown us by the fire. Nor let it trouble you that the tongues were divided; for tongues are diverse, therefore the appearance was that of cloven tongues. "Cloven tongues," it saith, "as of fire, and it sat upon each of them." There is a diversity of tongues, but the diversity of tongues does not imply schisms. Be not afraid of separation in the cloven tongues; in the dove recognize unity.

Hence in this manner it behoved the Holy Spirit to be manifested when coming upon the Lord, that every one might understand that if he has the Holy Spirit he ought to be simple as the dove, to have true peace with his brethren, that peace which the kisses of doves signify. Ravens have their kisses too; but in the case of the ravens it is a false peace, in that of the dove a true peace. Not every one, therefore, who says, "Peace be with you," is to be listened to as if he were a dove. How then are the kisses of ravens distinguished from those of doves? Ravens kiss, but they tear; the nature of doves is innocent of tearing. Where consequently there is tearing, there is not true peace in the kisses. They have true peace who have not torn the Church. Ravens feed upon carrion, it is not so with the dove; it lives on the fruits of the earth, its food is innocent. This, brethren, is really worthy of admiration in the dove. Sparrows are very small birds, but yet they kill flies at least. The dove does nothing of this sort, for it does not feed on what is dead. They who have torn the Church feed on the dead. God is mighty; let us pray that they who are devoured by them, and perceive it not, may come to life again. Many acknowledge that they do come to life again, for at their coming we daily express joy with them in the name of Christ. Be ye simple, but only in such wise that ye be fervent, and let your fervor be in your tongues. Hold not your peace, speak with glowing tongues, set those that are cold on fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25206.html'
source_title="Tractates on John 6"
