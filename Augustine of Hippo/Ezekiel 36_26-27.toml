[[commentary]]
quote='''
It is certain that it is we that act when we act; but it is He who makes us act, by applying efficacious powers to our will, who has said, "I will make you to walk in my statutes, and to observe my judgments, and to do them." When he says, "I will make you . . . to do them," what else does He say in fact than, "I will take away from you your heart of stone," from which used to arise your inability to act, "and I will give you a heart of flesh," in order that you may act? And what does this promise amount to but this: I will remove your hard heart, out of which you did not act, and I will give you an obedient heart, out of which you shall act?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 32"
