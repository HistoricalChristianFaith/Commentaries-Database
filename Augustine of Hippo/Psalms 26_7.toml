[[commentary]]
quote='''
“That I may hear the voice of Thy praise.” That I may learn how to praise Thee. “And that I may declare all Thy wondrous works” (ver. 7). And after I have learnt, I may set forth all Thy wondrous works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252026.html'
source_title="Exposition on Psalm 26"
