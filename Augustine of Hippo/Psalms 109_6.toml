[[commentary]]
quote='''
He then beginneth to prophesy what they should receive for this very impiety; detailing their lot in such a manner, as if he wished its realization from a desire of revenge. Some not understanding this mode of predicting the future, under the appearance of wishing evil, suppose hatred to be returned for hatred, and an evil will for an evil will, since in truth it belongeth to few to distinguish, in what way the punishment of the wicked pleaseth the accuser, who longeth to satiate his enmity; and in how widely different a way it pleaseth the judge, who with a righteous mind punisheth sins. For the former returneth evil for evil: but the judge when he punisheth doth not return evil for evil, since he returneth justice to the unjust; and what is just, is surely good. He therefore punisheth not from delight in another’s misery, which is evil for evil: but from love of justice, which is good for evil.…

“Set thou an ungodly man to be ruler over him; and let Satan stand at his right hand” (ver. 5). Though the complaint had been before concerning many, the Psalm is now speaking of one.…Since therefore he is here speaking of the traitor Judas, who, according to the Scripture in the Acts of the Apostles, was to be punished with the penalty due to him, what meaneth, “set thou an ungodly man over him,” save him whom in the next verse he mentioneth by name, when he saith, “and let Satan stand at his right hand”? He therefore who refused to be subject unto Christ, deserved this, that he should have the devil set over him, that is, that he should be subject unto the devil.…For this reason also it is said of those who, preferring the pleasures of this world to God, styled the people blessed who have such and such things, “their right hand is a right hand of iniquity.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520109.html'
source_title="Exposition on Psalm 109"
