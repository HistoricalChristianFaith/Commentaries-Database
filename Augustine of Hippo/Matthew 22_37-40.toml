[[commentary]]
quote='''
Think not then, my brethren, that when the Lord says, "A new commandment I give unto you, that ye love one another," there is any overlooking of that greater commandment, which requires us to love the Lord our God with all our heart, and with all our soul, and with all our mind; for along with this seeming oversight, the words "that ye love one another" appear also as if they had no reference to that second commandment, which says, "Thou shalt love thy neighbor as thyself." For "on these two commandments," He says, "hang all the law and the prophets." But both commandments may be found in each of these by those who have good understanding. For, on the one hand, he that loveth God cannot despise His commandment to love his neighbor; and on the other, he who in a holy and spiritual way loveth his neighbor, what doth he love in him but God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252065.html'
source_title="Tractates on John 65"
