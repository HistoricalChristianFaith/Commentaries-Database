[[commentary]]
quote='''
Finally, as regards the fact that John states that the Apostle Thomas was not present with these others on the occasion under review, whereas, according to Luke, the two disciples, of whom Cleophas was one, returned to Jerusalem, and found the eleven assembled and those who were with them, it admits of little doubt that we must suppose Thomas simply to have left the company before the Lord showed Himself to the brethren when they were talking in the terms noticed above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
