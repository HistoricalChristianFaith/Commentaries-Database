[[commentary]]
quote='''
There is much implied in His only saying "I am;" for so also had God said to Moses, "I am who am." Who can adequately express what that AM means? God by His angel sent His servant Moses to deliver His people out of Egypt (you have read and know what you now hear; but I recall it to your minds); He sent him trembling, self-excusing, but obedient. And while thus excusing himself, he said to God, whom he understood to be speaking in the person of the angel: If the people say to me, And who is the God that hath sent thee? what shall I say to them? And the Lord answered him, "I am who am;" and added, "Thou shalt say to the children of Israel, He who is hath sent me to you." There also He says not, I am God; or, I am the framer of the world; or, I am the creator of all things; or, I am the multiplier of the very people to be delivered: but only this, "I am who am;" and, "Thou shall say to the children of Israel, He who is." He added not, Who is your God, who is the God of your fathers; but said only this: "He who is hath sent me to you." Perhaps it was too much even for Moses himself, as it is too much for us also, and much more so for us, to understand the meaning of such words, "I am who am;" and, "He who is hath sent me to you." And supposing that Moses comprehended it, when would those to whom he was sent comprehend it? The Lord therefore put aside what man could not comprehend, and added what he could; for He said also besides, "I am the God of Abraham, and the God of Isaac, and the God of Jacob." This thou canst comprehend; for "I am who am," what mind can comprehend?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252038.html'
source_title="Tractates on John 38"
