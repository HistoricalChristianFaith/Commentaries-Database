[[commentary]]
quote='''
To the end, the psalm of the canticle of the dedication of the house, of David himself.

To the end, a Psalm of the joy of the Resurrection, and the change, the renewing of the body to an immortal state, and not only of the Lord, but also of the whole Church. For in the former Psalm the tabernacle was finished, wherein we dwell in the time of war: but now the house is dedicated, which will abide in peace everlasting.

It is then whole Christ who speaketh. “I will exalt Thee, O Lord, for Thou hast taken Me up” (ver. 1). I will praise Thy high Majesty, O Lord, for Thou hast taken Me up. “Thou hast not made Mine enemies to rejoice over Me.” And those, who have so often endeavoured to oppress Me with various persecutions throughout the world, Thou hast not made to rejoice over Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252030.html'
source_title="Exposition on Psalm 30"
