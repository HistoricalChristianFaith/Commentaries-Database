[[commentary]]
quote='''
Forget now thy theatre; behold our Peter; not a walker on the rope, but, so to speak, a walker on the sea. And do thou also walk on other waters (though not on those on which Peter walked, to symbolize a certain truth), for this world is a sea. It hath a deleterious bitterness; it hath the waves of tribulations, the tempests of temptations; it hath men in it who, like fish, delight in their own ruin, and prey upon each other; walk thou here, set thou thy foot on this. Thou wouldest see sights; be thyself a “spectacle.” That thy spirit may not sink, look on Him who goes before thee, and says, “We have been made a spectacle unto this world, and unto angels, and unto men.” Tread thou on the waters; suffer not thyself to be drowned in the sea. Thou wilt not go there, thou wilt not “tread it under foot,” unless it be His bidding, who was Himself the first to walk upon the sea. For it was thus that Peter spoke. “If Thou art, bid me come unto Thee on the waters.” And because “He was,” He heard him when praying; He granted his wish to him when expressing his desire; He raised him up when sinking. These are the “wonderful works” that the “Lord hath made.” Look on them; let faith be the eye of him who would behold them. And do thou also likewise; for although the winds alarm thee, though the waves rage against thee, and though human frailty may have inspired thee with some doubt of thy salvation, thou hast it in thy power to “cry out,” thou mayest say “Lord, I perish.” He who bids thee walk there, suffers thee not to perish. For in that thou now walkest “on the Rock,” thou fearest not even on the sea! If thou art without “the Rock,” thou must sink in the sea; for the Rock on which thou must walk is such an one as is not sunk in the sea,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"

[[commentary]]
quote='''
Just as Peter presumed, but not in strength of his own. The Lord was seen to walk upon the sea, trampling on the heads of all the proud in this life. In walking upon the foaming waves, He figured His own course when He trampleth on the heads of the proud. The Church too doth trample upon them: for Peter is the Church Herself. Nevertheless, Peter dared not by himself walk upon the waters; but what said he? “Lord, if it be Thou, bid me come unto Thee on the water.” He in His own power, Peter by His order; “bid me,” he saith, “come unto Thee.” He answered, “Come.” For the Church also trampleth on the heads of the proud; but since it is the Church, and hath human weakness, that these words might be fulfilled, “If I said, My foot hath slipt,” Peter tottered on the sea, and cried out, “Lord, save me!” and so what is here put, “If I said, My foot hath slipt,” is put there, “Lord, I perish.” And what is here, “Thy mercy, O Lord, hath held me up,” is there put, “And immediately Jesus stretched forth His hand, saying, O thou of little faith, wherefore didst thou doubt?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252094.html'
source_title="Exposition on Psalm 94"

[[commentary]]
quote='''
Matthew goes on with his account in the following terms: "And when He had sent the multitudes away, He went up into a mountain apart to pray: and when the evening was come, He was there alone. But the ship was now in the midst of the sea, tossed with waves: for the wind was contrary. And in the fourth watch of the night He came unto them, walking on the sea. And when the disciples saw Him walking on the sea, they were troubled, saying, It is a spirit;" and so on, down to the words, "They came and worshipped Him, saying, Of a truth Thou art the Son of God." In like manner, Mark, after narrating the miracle of the five loaves, gives his account of this same incident in the following terms: "And when it was late, the ship was in the midst of the sea, and He alone on the land. And He saw them toiling in rowing: for the wind was contrary to them," and so on. This is similar to Matthew's version, except that nothing is said as to Peter's walking upon the waters. But here we must see to it, that no difficulty be found in what Mark has stated regarding the Lord, namely, that, when He walked upon the waters, He would also have passed by them. For in what way could they have understood this, were it not that He was really proceeding in a different direction from them, as if minded to pass those persons by like strangers, who were so far from recognizing Him that they took Him to be a spirit? Who, however, is so obtuse as not to perceive that this bears a mystical significance? At the same time, too, He came to the help of the men in their perturbation and outcry, and said to them, "Be of good cheer, it is I; be not afraid." What is the explanation, therefore, of His wish to pass by those persons whom nevertheless He thus encouraged when they were in terror, but that that intention to pass them by was made to serve the purpose of drawing forth those cries to which it was meet to bear succour?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 47"
