source_title="Tractates on John 4"

[[commentary]]
quote='''
Therefore, beloved, let us see what those men desire not to see; not what they may not see, but what they grieve to see, as though it were shut against them. Whither were the disciples sent to baptize as ministers, in the name of the Father, and of the Son, and of the Holy Ghost? Whither were they sent? "Go," said He, "baptize the nations." You have heard, brethren, how that inheritance comes, "Ask of me, and I will give Thee the nations for Thine inheritance, and the utmost bounds of the earth for Thy possessions." You have heard how that "from Sion went forth the law, and the word of the Lord from Jerusalem." For it was there the disciples were told, "Go, baptize the nations in the name of the Father, and of the Son, and of the Holy Ghost." We became attentive when we heard, "Go, baptize the nations." In whose name? "In the name of the Father, and of the Son, and of the Holy Ghost." This is one God; for it says not in the "names" of the Father, and of the Son, and of the Holy Ghost, but "in the name of the Father, and of the Son, and of the Holy Ghost." Where thou hearest one name, there is one God; just as it was said of Abraham's seed, and the Apostle Paul expounds it, "In thy seed shall all nations be blessed; he said not, In seeds, as in many, but as in one, and in thy seed which is Christ." Wherefore, just as the apostle wished to show thee that, because in that place it is not said "in seeds," Christ is one; so here too, when it is said, "in the name," not in the names, even as these, "in seed," not in seeds, is it proved that the Father, and the Son. and the Holy Ghost are one God.

But lo, say the disciples to the Lord, we are told in what name we are to baptize; Thou hast made us ministers, and hast said to us, "Go, baptize in the name of the Father, and of the Son, and of the Holy Ghost." Whither shall we go? Whither? Have you not heard? To Mine inheritance. You ask, Whither shall we go? To that which I bought with my blood. Whither then? To the nations, saith He. I fancied that He said, Go, baptize the Africans in the name of the Father, and of the Son, and of the Holy Ghost. Thanks be to God, the Lord has solved the question the dove has taught us. Thanks be to God, it was to the nations the apostles were sent; if to the nations, then to all tongues. The Holy Spirit signified this, being divided in the tongues, united in the dove. Here the tongues are divided, there the dove unites them. The tongues of the nations agreed, perhaps that of Africa alone disagreed. What can be more evident, my brethren? In the dove the unity, in the tongues the community of the nations. For once the tongues became discordant through pride, and then of one became many tongues. For after the flood certain proud men, as if endeavoring to fortify themselves against God, as if aught were high for God, or aught could give security to pride, raised a tower, apparently that they might not be destroyed by a flood, should there come one thereafter. For they had heard and considered that all iniquity was swept away by a flood; to abstain from iniquity they would not; they sought the height of a tower as a defense against a flood; they built a lofty tower. "God saw their pride, and frustrated their purpose by causing that they should not understand one another's speech, and thus tongues became diverse through pride." If pride caused diversities of tongues, Christ's humility has united these diversities in one. The Church is now bringing together what that tower had sundered. Of one tongue there were made many; marvel not: this was the doing of pride. Of many tongues there is made one; marvel not: this was the doing of charity. For although the sounds of tongues are various, in the heart one God is invoked, one peace preserved. How then should the Holy Spirit have been manifested when signifying a unity, if not by the dove, so that it might be said to the Church brought into a state of peace, "My dove is one "? How ought humility to have been represented but by an innocent, sorrowing bird; not by a proud, exulting bird like the raven?

But perhaps they will say: Well, as it is a dove, and the dove is one, baptism there cannot be apart from the one dove. Therefore if the dove is with thee, or if thou be thyself a dove, do thou give me, when I come to thee, that which I have not. You know that this is what they say; but you will presently see that it is not of the voice of the dove, but of the clamor of the raven. For attend a little, beloved, and fear their devices; nay, beware of them, and listen to the words of gainsayers only to reject them, not to swallow them and take them into your bowels. Do therein what the Lord did when they offered Him the bitter draught, "He tasted, and spat it out; " so also you hear and cast away. What indeed say they? Let us see. Lo, says he, "Thou art the dove." O Catholic Church, it is to thee it is said, "My dove is one, the only one of her mother" to thee certainly is it said. Stop, do not question me; prove first whether to me it was said; if it was said to me, I would hear it at once. "To thee," saith he, "it was said." I answer, in the voice of the Catholic Church, "To me." And this answer, brethren, sounding forth from my mouth alone, has sounded, as I believe, also from your hearts, and we all affirmed together, yea, to the Catholic Church was it said, "One is my dove, the only one of her mother." Apart from this dove, says he further, there is no baptism: I was baptized apart from this dove, consequently have not baptism; if I have not baptism, why dost thou not give it me when I come to thee?

I also will put questions; let us meanwhile lay aside the inquiry as to whom this was said, "My dove is one, the only one of her mother; "-as yet we are inquiring;-it was said either to me or to thee; let us postpone the question as to whom it was said. This is what I ask, if the dove is simple, innocent, without gall, peaceful in its kisses, not fierce with its talons, I ask whether the covetous, the rapacious, the crafty, the sottish, the infamous, belong to the members of this dove? Are they members of this dove? Far be the thought, says he. And who would really say this, brethren? To speak of nothing else, if I mention the rapacious alone, members of the hawk they may be, not members of the dove. Kites seize and plunder, so do hawks, so do ravens; doves do not plunder nor tear, consequently they who snatch and rob are not members of the dove. Was there not even one rapacious person among you? Why abides the baptism, which in this case the hawk, not the dove, has given? Why do you not among yourselves baptize after robbers, after adulterers, after drunkards? Why not baptize after the avaricious among yourselves? Are these all members of the dove? You so dishonor your dove that you make those that have the nature of the vulture her members. What, then, brethren, what say we? There are the bad and the good in the Catholic Church, but with them the bad only. But perhaps I say this with a hostile feeling: let this too be afterwards examined. They do say, certainly, that among them are the good and the bad; for, should they assert that they have only the good, let their own credit it, and I subscribe. With us, let them say, there are none but holy, righteous, chaste, sober men; no adulterers, no usurers, no deceivers, no false swearers, no wine-bibbers;-let them say this, for I heed not their tongues I touch their hearts. But since they are well known to us, and to you, and to their own, just as you are known both to yourselves in the Catholic Church and to them, neither let us find fault with them, nor let them flatter themselves. We confess that in the Church there are good and bad, yet as the grain and the chaff. Sometimes he who is baptized by the grain is chaff, and he who is baptized by the chaff is grain. Otherwise, if his baptism who is baptized by the grain stands good, and his who is baptized by the chaff not, then it is not true, "This is He that baptizeth." But if it is true "This is He that baptizeth," then what is given by the chaff stands good, and he baptizeth in like manner as the dove. For the bad man (who administers baptism) is not the dove, nor belongs to the members of the dove, nor can he possibly be affirmed to be so, either with us in the Catholic Church or with them, if they assert that their Church is the dove. What then are we to understand, brethren? Since it is evident, and known to all, and they must admit, though it be against their will, that when with them bad men give baptism, it is not given after those bad men; and with us, too, when the bad give baptism, it is not given after them. The dove does not baptize after the raven; why then would the raven baptize after the dove?

Consider, beloved, why also was there a something pointed out by means of the dove, as that the dove-namely, the Holy Spirit in the shape of a dove-came to the Lord on being baptized, and rested upon Him, whilst by the coming of the dove John learned this, that there dwelt in the Lord a power peculiarly His own to baptize? Because it was by this power peculiar to Himself, as I have said, the peace of the Church was made secure. And yet it may be that one may have baptism apart from the dove; but that baptism apart from the dove should do him good, is impossible. Consider, beloved, and understand what I say, for by this deception they mislead such of our brethren as are dull and cold. Let us be more simple and more fervent See, say they, have I received, or have I not? I answer, Thou hast received. Well, if I have received, there is nothing which thou canst give me; I am safe, even on thine own evidence. For I affirm that I have received, and thou, too, dost confess that I have received: I am safe by the confession of both: what then dost thou promise me? Why wouldst thou make me a Catholic, when thou wouldst not give me anything further, seeing thou confessest that I have already received that which thou affirmest thyself to possess? But when I say, Come to me, I say that thou dost not possess, who yet confessest that I do. Why dost thou say, Come to me?

The dove teaches us. From the head of the Lord she answers, and says, Thou hast baptism, but the charity with which I groan thou hast not. How is this says he, I have baptism, and have not charity? Have I the sacraments, and not charity? Do not shout: show me how can he who divides unity have charity? I, saith he, have baptism. Thou hast; but that baptism, without charity, profits thee nothing; because without charity thou art nothing. The baptism itself, even in him who is nothing, is not nothing. Baptism, indeed, is something, aye, something great, for His sake, of whom it is said, "This is He that baptizeth." But lest thou shouldst fancy that that which is great can profit thee aught, if thou be not in unity, it was after He was baptized that the dove descended, as if intimating, If thou hast baptism, be in the dove, lest what thou hast profit thee not. Come, then, to the dove, we say; not that thou mayest begin to have what thou hadst not before, but that what thou didst have may begin to profit thee. For thou didst have baptism to destruction without; if thou shalt have it within, it begins to profit thee to salvation.

For not only was baptism not profitable to thee, and not also hurtful Even holy things may be hurtful. In the good, indeed, holy things are to salvation; in the evil, to judgment. For we certainly know, brethren, what we receive, and what we receive is at any rate holy, and no one says that it is not: and what says the apostle? "But he that eateth and drinketh unworthily, eateth and drinketh judgment to himself." He does not say that the thing itself is bad, but that the evil man, by receiving it amiss , receives the good thing which he does receive to judgment. Was that morsel which the Lord delivered to Judas evil? God forbid. The physician would not give poison; it was health the physician gave; but by unworthily receiving it, he who received it not being at peace, received it unto destruction. So likewise also he who is baptized. I have (baptism), says he, for myself. Thou hast it, I admit. Give good heed to what thou hast; by that very thing which thou hast thou wilt be condemned. Wherefore? Because thou hast what belongs to the dove apart from the dove. If thou hast what is the dove's in the dove, thou art safe. Suppose thyself a soldier: if thou hast thy general's mark within the lines, thou servest in safety; but if thou hast it out of bounds, not only that mark will not be of advantage to thee for service, but thou wilt even be punished as a deserter. Come, then, come, and do not say, I have already, I have enough. Come; the dove is calling thee, calling thee by her sighing. My brethren, to you I say, call by groaning, not by quarreling; call by praying, by invitation, by fasting; let them by your charity understand that you pity them. I doubt not, my brethren, that if they see your sorrow they will be astonished, and will come to life again. Come, then, come; be not afraid; be afraid if thou do not come; nay, be not afraid, rather bewail thyself. Come, thou wilt rejoice if thou wilt come; thou wilt indeed groan in the tribulations of thy pilgrimage, but thou wilt rejoice in hope. Come where the dove is, to whom it was said, "My dove is one, the only one of her mother." Seest thou not the one dove upon the head of Christ, seest thou not the tongues throughout the whole world? It is the same Spirit by the dove and by the tongues: if by the dove the same Spirit, and by the tongues the same Spirit, then was the Holy Spirit given to the whole world, from which Spirit thou hast cut thyself off, that thou mightest clamor with the raven, not that thou mightest sigh with the dove. Come, then.

But thou art anxious, it may be, and sayest, I was baptized without; I fear lest therefore I am guilty, in that I was baptized without. Already thou beginnest to know what thou hast to bewail. Thou sayest truly that thou art guilty, not because of thy receiving, but because of thy receiving without. Keep then what thou hast received; amend thy receiving it without. Thou hast received what is the dove's apart from the dove. Here are two things said to thee: Thou hast received, and, Apart from the dove thou hast received. In that thou hast received, I approve; that thou hast received without, I disapprove. Keep then what thou hast received, it is not changed, but recognized: it is the mark of my king, I will not profane it. I will correct the deserter, not change the mark.

Boast not of thy baptism because I call it a real baptism. Behold, I say that it is so the whole Catholic Church says that it is so the dove regards it, and acknowledges it, and groans because thou hast it without; she sees therein what she may acknowledge, sees also what she may correct. It is a real baptism, come. Thou boastest that it is real, and yet wilt thou not come? What then of the wicked, who do not belong to the dove? Saith the dove to thee, Even the wicked, among whom I groan, who belong not to my members, and it must needs be that I groan among them, have not they that which thou boastest of having? Have not many drunkards baptism? Have not many covetous? Have not many idolaters, and, what is worse, who are such by stealth? Do not the pagans resort, or at least did resort, publicly to idols? And now Christians secretly seek out diviners and consult astrologers. And yet these have baptism; but the dove groans among ravens. Why then dost thou boast in the having it? This that thou hast, the wicked man also has. Have thou humility, charity, peace; have thou the good thing which as yet thou hast not, so that the good thing which thou hast may profit thee.

For what thou hast, even Simon Magus had: the Acts of the Apostles are witness, that canonical book which has to be read in the Church every year. You know that every year, in the season following the Lord's Passion, that book is read, wherein it is written, how the apostle was converted, and from a persecutor became a preacher; also, how on the day of Pentecost the Holy Spirit was sent in cloven tongues as of fire. There we read that in Samaria many believed through the preaching of Philip: and he is understood to have been either one of the apostles or one of the deacons; for we read there that seven deacons were ordained, among whom is the name of Philip. Well, then, through the preaching of Philip the Samaritans believed; Samaria began to abound in believers. This Simon Magus was there. By his magical arts he had so befooled the people, that they fancied him to be the power of God. Impressed, however, by the signs which were done by Philip, he also believed; but in what manner he believed, the events that followed afterwards proved. And Simon also was baptized. The apostles, who were at Jerusalem, heard this. Peter and John were sent to those in Samaria; they found many baptized; and as none of them had as yet received the Holy Ghost-in like manner as He at that time descended, so as that they on whom the Holy Spirit came should speak with tongues, for a manifest token that the nations would believe,-they laid their hands on them, praying for them, and they received the Holy Ghost. This Simon-who was not a dove but a raven in the Church, because he sought his own things, not the things which are Jesus Christ's; whence he loved the power which was in the Christians more than the righteousness-Simon, I say, saw that the Holy Spirit was given by the laying on of the hands of the apostles (not that it was given by them, but given in answer to their prayers), and he said to them, "How much money will ye that I give you, so that by the laying on of my hands also, the Holy Ghost may be given? And Peter said unto him, Thy money perish with thee, because thou thoughtest that the gift of God was to be bought with money." To whom said he, "Thy money perish with thee "? Undoubtedly to one that was baptized. Baptism he had already; but he did not cleave to the bowels of the dove. Understand that he did not; attend to the very words of the Apostle Peter, for he goes on, "Thou hast no part nor lot in this faith: for I see that thou art in the gall of bitterness." The dove has no gall; Simon had, and for that reason he was separated from the bowels of the dove. What did baptism profit him? Do not therefore boast of thy baptism, as if that were of itself enough for thy salvation. Be not angry, put away thy gall, come to the dove. Here that will profit thee, which without not only did not profit thee, but even was prejudicial to thee.

Neither say, I will not come, because I was baptized without. So, begin to have charity, begin to have fruit, let there be fruit found in thee, and the dove will send thee within. We find this in Scripture. The ark was made of incorruptible wood. The incorruptible timbers are the saints, the faithful that belong to Christ. For as in the temple the living stones of which it is built are said to be faithful men, so likewise the incorruptible timbers are they who persevere in the faith. In that same ark, then, the timbers were incorruptible. Now the ark is the Church, it is there the dove baptizeth; for the ark was borne on the water,the incorruptible timbers were baptized within. We find that certain timbers were baptized without, such as all the trees that were in the world. Nevertheless the water was the same, not another sort; all had come from heaven, or from abysses of the fountains. It was the same water in which the incorruptible timbers which were in the ark were baptized, and in which the timbers that were without were baptized. The dove was sent forth, and at first found no rest for its feet; it returned to the ark, for all was full of water, and it preferred to return rather than be rebaptized. But the raven was sent out before the water was dried up. Rebaptized, it desired not to return, and died in those waters. May God avert from us that raven's death. For why did not the raven return, unless because it was taken off by the waters? But on the other hand, the dove not finding rest for its feet, whilst the water was crying to it on every side, "Come, come, dip thyself here;" just as these heretics cry, "Come, come, here thou hast it;" the dove, finding no rest for its feet, returned to the ark. And Noah sent it out a second time, just as the ark sends you out to speak to them; and what did the dove afterwards? Because there were timbers without that were baptized, it brought back to the ark an olive branch. That branch had both leaves and fruit. Let there not be in thee words only, nor leaves only; let there be fruit, and thou returnest to the ark, not of thyself, the dove calls thee back. Groan ye without, that ye may call them back within.

Moreover, as to this fruit of the olive if the matter be examined, you will find what it was. The fruit of the olive signifies charity. How do we prove this? Just as oil is kept down by no liquid, but bursting through all, bounds up and overtops them; so likewise charity cannot be pressed to the bottom, but must of necessity show itself at the top. Therefore the apostle says of it, "Yet show I unto you a more excellent way." Since we have said of oil that it overtops other liquids, in case it should not be of charity, the apostle said," I show you a more excellent way," let us hear what follows. "Though I speak with the tongues of men and of angels, and have not charity, I am become as sounding brass, or a tinkling cymbal." Go now, Donatus, and cry, "I am eloquent;" go now, and cry, "I am learned." How far eloquent? How far learned? Hast thou spoken with the tongues of angels? Yet though thou wert to speak with the tongues of angels, not having charity, I should hear only sounding brass and tinkling cymbals. I want solidity; let me find fruit among the leaves; let there be not words merely, let them have the olive, let them return to the ark.

But I have the sacrament, thou wilt say. Thou sayest the truth; the sacrament is divine; thou hast baptism, and that I confess. But what says the apostle? "If I should know all mysteries, and have prophecy and all faith, so that I could remove mountains;" in case thou shouldest say this, "I believe; enough for me." But what says James? "The devils believe and tremble." Faith is mighty, but without charity it profits nothing. The devils confessed Christ. Accordingly it was from believing, but not from loving, they said, "What have we to do with Thee?" They had faith, but not charity; hence they were devils. Boast not of faith; so far thou art on a level with the devils. Say not to Christ, What have I to do with Thee? For Christ's unity speaks to thee. Come, learn peace, return to the bowels of the dove. Thou hast been baptized without; have fruit, and thou returnest to the ark.

But sayest thou, "Why do you seek us if we are bad men?" That you may be good. The reason why we seek you is,  because you are bad; for if you were not bad, we should have found you, and would not be seeking you. He who is good is already found; he who is bad is still sought after. Consequently, we are seeking you; return ye to the ark. "But I have baptism already." "Though I should know all mysteries, and have prophecy and all faith, so as to remove mountains, but have not charity, I am nothing." Let me see fruit there; let me see the olive there, and thou art called back to the ark.

But what sayest thou? "Behold, we suffer many evils." Would that ye suffered these for Christ, not for your own honor! Hear what follows: They, indeed, boast sometimes, because they do many alms, give to the poor; because they suffer afflictions: but it is for Donatus, not for Christ. Consider how thou sufferest; for if thou sufferest for Donatus, it is for a proud man: thou art not in the dove if thou art suffering for Donatus. Donatus was not the friend of the Bridegroom; for had he been, he would have sought the glory of the Bridegroom, not his own. See the friend of the Bridegroom saying, "This is He that baptizeth." He, for whom thou art suffering, was not the friend of the Bridegroom. Thou hast not the wedding garment; and if thou art come to the feast, thou wilt be put out of doors; nay, thou hast been cast out of doors already, and for that reason thou art wretched: return at length, and do not boast. Hear what the apostle says: "Though I should distribute all my goods to the poor, and give my body to be burnt, but have not charity." See what thou dost not have. "Though," he saith, "I should give my body to be burnt;" and that, too, for the name of Christ; but since there are many who do this boastfully, not with charity, therefore, "Though I should give my body to be burnt, and have not charity, it profiteth me nothing." It was by charity those martyrs, who suffered in time of persecution, did this; but these men do it of their vanity and pride; for in the absence of a persecutor, they throw themselves headlong into destruction. Come, then, that thou mayest have charity. "But we have our martyrs." What martyrs? They are not doves; hence they attempted to fly, and fell over the rock.

You see then, my brethren, that all things cry against them, all the divine pages, all prophecy, the whole gospel, all the apostolic letters, every sigh of the dove, and yet they awake not, they do not yet rouse from their sleep. But if we are the dove, let us groan, let us persevere, let us hope; God's compassion will be with you, that the fire of the Holy Spirit may glow in your simplicity; and they will come. There must be no despairing; pray, preach, love; the Lord is able to the utmost. Already they begin to be sensible of their shame; many have become sensible of it, and blushed; Christ will aid, that the rest also may become sensible of it. However, my brethren, at least let the chaff alone remain there; let all the grain be gathered together; let whatever has borne fruit among them return to the ark by the dove.

Failing everywhere else, what do they now allege against us, not finding what to say? They have taken away our houses, they have taken away our estates. They bring forward wills. "See, Gaius Seius made a grant of an estate to the church over which Faustinus presided." Of what church was Faustinus bishop? What is the church? To the church over which Faustinus presided, said he. But Faustinus presided not over a church, but over a sect. The dove, however, is the Church. Why cry out? We have not devoured houses; let the dove have them. Let inquiry be made who the dove is, and let her have them. For you know, my brethren, that those houses of theirs are not Augustin's; and if you know it not, and imagine that I delight in the possession of them, God knows, yea, knows my judgment respecting those estates, and even what I suffer in that matter; He knows my groaning, since He has deigned to impart to me somewhat of the dove. Behold, there are those estates; by what right dost thou assert thy claim to them? By divine right, or by human? Let them answer: Divine right we have in the Scriptures, human right in the laws of kings. By what right does every man possess what he possesses? Is it not by human right? For by divine right, "The earth is the Lord's, and the fullness thereof." The poor and the rich God made of one clay; the same earth supports alike the poor and the rich. By human right, however, one says, This estate is mine, this house is mine, this servant is mine. By human right, therefore, is by right of the emperors. Why so? Because God has distributed to mankind these very human rights through the emperors and kings of this world. Do you wish us to read the laws of the emperors, and to act by the estates according to these laws? If you will have your possession by human right, let us recite the laws of the emperors; let us see whether they would have the heretics possess anything. But what is the emperor to me? thou sayest. It is by right from him that thou possessest the land. Or take away rights created by emperors, and then who will dare say, That estate is mine, or that slave is mine, or this house is mine? If, however, in order to their possessing these things, men have received rights derived from kings, will ye that we read the laws, that you may be glad in having even a single garden, and impute it to nothing but the clemency of the dove that you are permitted to remain in possession even there? For there are to be read well known laws, in which the emperors have directed that those who, being outside the communion of the Catholic Church, usurp to themselves the name of Christians, and are not willing in peace to worship the Author of peace, may not dare to possess anything in the name of the Church.

But what have we to do with the emperor? But I have already said that we are treating of human right. And yet the apostle would have us obey kings, would have us honor kings, and said, "Honor the king." Do not say, What have I to do with the king? as in that case, what have you to do with the possession? It is by the rights derived from kings that possessions are enjoyed. Thou hast said, What have I to do with the king? Say not then that the possessions are thine; because it is to those same human rights, by which men enjoy their possessions, thou hast referred them. But it is with divine right I have to do, saith he. Well, let us read the Gospel; let us see how far extends the Catholic Church of Christ, upon whom the dove came, which taught, "This is He that baptizeth." In what way, then, can he possess by divine right, who says, "I baptize;" whilst the dove says, "This is He that baptizeth;" whilst the Scripture says, "My dove is one, the only one of her mother"? Why have you torn the dove?-nay, rather, have torn your own bowels, for while you are yourselves torn to pieces, the dove continues entire. Therefore, my brethren, if, driven from every point, they have nothing to say, I will tell them what to do; let them come to the Catholic Church, and together with us, they will have not only the earth, but Him also who made heaven and earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25206.html'
source_title="Tractates on John 6"

[[commentary]]
quote='''
Again, the account of the dove given in the Gospel according to John does not mention the time at which the incident happened, but contains a statement of the words of John the Baptist as reporting what he saw. In this section, the question rises as to how it is said, "And I knew Him not: but He that sent me to baptize with water, the same said unto me, Upon whom thou shalt see the Spirit descending and remaining on Him, the same is He which baptizeth with the Holy Spirit." For if he came to know Him only at the time when he saw the dove descending upon Him, the inquiry is raised as to how he could have said to Him, as He came to be baptized, "I ought rather to be baptized of Thee." For the Baptist addressed Him thus before the dove descended. From this, however, it is evident that, although he did know Him [in a certain sense] before this time,—for he even leaped in his mother's womb when Mary visited Elisabeth,—there was yet something which was not known to him up to this time, and which he learned by the descending of the dove,—namely, the fact that He baptized in the Holy Spirit by a certain divine power proper to Himself; so that no man who received this baptism from God, even although he baptized some, should be able to say that that which he imparted was his own, or that the Holy Spirit was given by him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 15"
