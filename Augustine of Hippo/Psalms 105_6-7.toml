[[commentary]]
quote='''
Unto whom is it said, “O ye seed of Abraham His servant, ye children of Jacob, His chosen”? (ver. 6).…He next addeth, “He is the Lord our God: His judgments are in all the world” (ver. 7). Is He the God of the Jews only? God forbid! “He is the Lord our God:” because the Church, where His judgments are preached, is in all the world.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520105.html'
source_title="Exposition on Psalm 105"
