[[commentary]]
quote='''
I will mention another opinion also. For perhaps even in hell itself there is some lower part where are thrust the ungodly who have sinned most. For whether in hell there were not some places where Abraham was, we cannot define sufficiently. For not yet had the Lord come to hell that He might rescue from thence the souls of all the saints who had gone before, and yet Abraham was there in repose. And a certain rich man when he was in torments in hell, when he saw Abraham, lifted up his eyes. He could not have seen him by lifting up his eyes, unless the one was above, the other below. And what did Abraham answer unto him, when he said, “send Lazarus.” “My son,” he said, “remember that thou in thy lifetime receivedst thy good things, and likewise Lazarus evil things: but now he is at rest, but thou art tormented. And besides this,” he said, “between us and you there is a great gulf fixed, so that neither can we go to you, nor can any one come from thence to us.” Therefore between these two hells, perhaps, in one of which the souls of the just have gotten rest, in the other the souls of the ungodly are tormented, one waiting and praying here, placed here in the body of Christ, and praying in the voice of Christ, said that God had delivered his soul from the nethermost hell, because He delivered him from such sins as might have been the means of drawing him down to the torments of the nethermost hell.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
