[[commentary]]
quote='''
Now, brethren, ye see the saints armed: observe the slaughter, observe their glorious battles. For if there be a commander, there must be soldiers; if soldiers, an enemy; if a warfare, a victory. What have these done who had in their hands swords sharpened on both sides? “To do vengeance on the nations.” See whether vengeance have not been done on the nations. Daily is it done: we do it ourselves by speaking. Observe how the nations of Babylon are slain. She is repaid twofold: for so is it written of her, “repay her double for what she hath done.” How is she repaid double? The saints wage war, they draw their “swords twice sharpened;” thence come defeats, slaughters, severances: how is she repaid double? When she had power to persecute the Christians, she slew the flesh indeed, but she crushed not God: now she is repaid double, for the Pagans are extinguished and the idols are broken.…And lest thou shouldest think that men are really smitten with the sword, blood really shed, wounds made in the flesh, he goeth on and explaineth, “upbraidings among the peoples.” What is “upbraidings”? Reproof. Let the “sword twice sharpened” go forth from you, delay not. Say to thy friend, if yet thou hast one left to whom to say it, “What kind of man art thou, who hast abandoned Him by whom thou wast made, and worshippest what He made? Better is the Workman, than that which He worketh.” When he beginneth to blush, when he beginneth to feel compunction, thou hast made a wound with thy sword, it hath reached the heart, he is about to die, that he may live.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520149.html'
source_title="Exposition on Psalm 149"
