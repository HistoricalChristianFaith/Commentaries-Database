[[commentary]]
quote='''
(De Cons. Ev. ii. 32.) Luke also gives this as spoken in continuation of some other of the Lord's discourses; from which it appears that he has rather followed the actual order of events; Matthew to have followed his recollection. Or the words of Matthew, Then began he to upbraid the towns, must be taken, as some think, as expressing some particular time by the word then, but not referring generally to that time in which the many other things here told were done and said. Whoever, therefore, thinks thus must suppose that this was spoken twice. And when we find in the same Evangelist some things spoken by the Lord at two different times—like that in Luke concerning the not taking a scrip for their journey,—what wonder is it if any thing else, which was twice spoken, is found once severally in two several Gospels in the actual connection in which it was spoken, which connection is different, because they are two different occasions on which it is related to have been spoken?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Thereafter Matthew goes on as follows: "Then began He to upbraid the cities wherein most of His mighty works were done, because they repented not;" and so on, down to where we read, "It shall be more tolerable for the land of Sodom at the day of judgment, than for you." This section likewise is given by Luke, who reports it also as an utterence from the lips of the Lord in connection with a certain continuous discourse which He delivered. This circumstance makes it the rather appear that Luke has recorded these words in the strict consecution in which they were spoken by the Lord, while Matthew has kept by the order of his own recollections. Or if it is supposed that Matthew's words, "Then began He to upbraid the cities," must be taken in such a way as to imply that the intention was to express, by the term "then," the precise point of time at which the saying was uttered, and not to signify in a somewhat broader way the period at which many of these things were done and spoken, then I say that any one entertaining that idea may equally well believe these sentences to have been pronounced on two different occasions. For if it is the fact that even in one and the same evangelist some things are found which the Lord utters twice over, as is the case with this very Luke in the instance of the counsel not to take a scrip for the journey, and so with other things in like manner which we find to have been spoken by the Lord in two different places,—why should it seem strange if some other word of the Lord, which was originally uttered on two separate occasions, may happen also to be recorded by two several evangelists, each of whom gives it in the order in which it was actually spoken, and if thus the order seems to be different in the two, simply because the sentences were uttered both on the occasion noticed by the one, and on that referred to by the other?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 32"
