[[commentary]]
quote='''
When he says: Be subject of necessity, this avails so that we may understand that it is necessary, on account of this life, that we ought to be subject, not resisting if they wish to take away anything of temporal things over which power has been given them; and because these things pass away, therefore this subjection too must be established not in goods that are to endure, but in things necessary to this time. Yet because he said, Be subject of necessity, lest anyone should become subject to powers of this kind with less than a whole heart and pure love, he added, saying: Not only on account of wrath but also on account of conscience—that is, not only to avert wrath, which can be done even in pretense, but so that in your conscience you may be certain that you do it out of love for him to whom you are subject, by the command of your Lord, who wishes all to be saved and to come to the knowledge of the truth. For when the Apostle said this, he was dealing with those very powers. This is what he urges upon servants in another place: Not serving to the eye, as though pleasing men, so that, in the very fact that they are subject to their masters, they may not hate them or desire to win their favor by deceits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
