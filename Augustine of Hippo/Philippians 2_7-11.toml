[[commentary]]
quote='''
The glorification of the Son by the Father is understood by some to consist in this, that He spared Him not, but delivered Him up for us all. But if we say that He was glorified by His passion, how much more was He so by His resurrection! For in His passion our attention is directed more to His humility than to His glory, in accordance with the testimony of the apostle, who says, "He humbled Himself, and became obedient unto death, even the death of the cross:" and then he goes on to say of His glorification, "Wherefore God also hath highly exalted Him, and given Him a name which is above every name: that in the name of Jesus every knee should bow, of things in heaven, and things in earth, and things under the earth; and that every tongue should confess that the Lord Jesus Christ is in the glory of God the Father." This is the glorification of our Lord Jesus Christ, that took its commencement from His resurrection. His humility accordingly begins in the apostle's discourse with the passage where he says, "He emptied Himself, and took upon Him the form of a servant;" and reaches "even to the death of the cross." But His glory begins with the clause where he says, "Wherefore God also hath exalted Him;" and reaches on to the words, "is in the glory of God the Father." For even the noun itself, if the language of the Greek codices be examined, from which the apostolic epistles have been translated into Latin, which in the latter is read, glory, is in the former read, δόξα: whence we have the verb derived in Greek for the purpose of saying here, δόξασον (glorify), which the Latin translator renders by "clarifica" (make illustrious), although he might as well have said "glorifica" (glorify), which is the same in meaning. And for the same reason, in the apostle's epistle where we find "gloria," "claritas" might have been used; for by so doing, the meaning would have been equally preserved. But not to depart from the sound of the words, just as "clarificatio" (the making lustrous) is derived from "claritas" (lustre), so is "glorificatio" (the making glorious) from "gloria" (glory). In order, then, that the Mediator between God and men, the man Christ Jesus, might be made lustrous or glorious by His resurrection, He was first humbled by suffering; for had He not died, He would not have risen from the dead. Humility is the earning of glory; glory, the reward of humility. This, however, was done in the form of a servant; but He was always in the form of God, and always shall His glory continue: yea, it was not in the past as if it were no more so in the present, nor shall it be, as if it did not yet exist; but without beginning and without end, His glory is everlasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520104.html'
source_title="Tractates on John 104"
