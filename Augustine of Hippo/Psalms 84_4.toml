[[commentary]]
quote='''
But by the ancients, glory, from which men are styled glorious, is thus defined: Glory is the widely-spread fame of any one accompanied with praise. But if a man is praised when the fame regarding him is believed, how will God be praised when He Himself shall be seen? Hence it is said in Scripture, "Blessed are they that dwell in Thy house; they will be praising Thee for ever and ever." There will God's praise continue without end, where there shall be the full knowledge of God; and because the full knowledge, therefore also the complete effulgence or glorification.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520105.html'
source_title="Tractates on John 105"
