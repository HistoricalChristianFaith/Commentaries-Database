[[commentary]]
quote='''
“For Thou wilt make whole the humble people” (ver. 27). Now this seems froward to the froward, that Thou wilt make them whole that confess their sins. “And Thou wilt humble the eyes of the proud.” But them that are “ignorant of God’s righteousness, and seek to establish their own,” Thou wilt humble.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
