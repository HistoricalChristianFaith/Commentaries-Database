[[commentary]]
quote='''
"Now ye are clean," that is, clean, and yet still further to be cleansed. For, had they not been clean, they could not have borne fruit; and yet every one that beareth fruit is purged by the husbandman, that he may bring forth more fruit. He bears fruit because he is clean; and to bear more, he is cleansed still further. For who in this life is so clean as not to be in need of still further and further cleansing? seeing that, "if we say that we have no sin, we deceive ourselves, and the truth is not in us; but if we confess our sins, He is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness;" to cleanse in very deed the clean, that is, the fruitful, that they may be so much the more fruitful, as they have been made the cleaner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252080.html'
source_title="Tractates on John 80"
