[[commentary]]
quote='''
(Tr. liv. 2) He signifies to them that He is more than He appears to be, (for to men He appeared but a man; His Godhead was hid.) Such as the Father is, such am I in nature and in dignity; He that believeth on Me, believeth not on Me, i. e. on that which He sees, but on Him that sent Me, i. e. on the Father. [1He that believes in the Father must believe in Him as the Father, i. e. must believe that He has a Son; and reversely, he who believes in the Son thereby believes in the Father.] And again, if any one thinks that God has sons by grace, but not a Son equal and coeternal with Himself, neither does he believe 2on the Father, who sent the Son; because what he believes on is not the Father who sent Him. (c. 3.). And to show that He is not the Son, in the sense of one out of many, a son by grace, but the Only Son equal to the Father, He adds, And He that seeth Me, seeth Him that sent Me; so little difference is there between Me and Him that sent Me, that He that seeth Me, seeth Him. Our Lord sent His Apostles, yet none of them dared to say, He that believeth on Me. We believe an Apostle, but we do not believe on an Apostle. Whereas the Only Begotten says, He that believeth on Me, doth not believe on Me, but on Him that sent Me. Wherein He does not withdraw the believer's faith from Himself, but gives him a higher object than the form of a servant, for that faith.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And, accordingly, after saying, "He that believeth on me, believeth not on me, but on Him that sent me," that it might not be thought that He would have the Father so understood, as if He were the Father only of many sons regenerated by grace, and not of the only-begotten Word, His own co-equal, He immediately added, "And he that seeth me, seeth Him that sent me." Does He say here, He that seeth me, seeth not me, but Him that sent me, as He had said, "He that believeth me, believeth not on me, but on Him that sent me"? For He uttered the former of these words, that He might not be believed on merely as He then appeared, that is, as the Son of man; and the latter, that He might be believed on as the equal of the Father. He that believeth on me, believeth not merely on what He sees of me, but believeth on Him that sent me. Or, when he believeth on the Father, who begat me, His own co-equal, let him believe on me, not as he seeth me, but as [he believeth] on Him that sent me; for so far does the truth, that there is no distance between Him and me, reach, that He who seeth me, seeth Him that sent me. Certainly, Christ the Lord Himself sent His apostles, as their name implies: for as those who in Greek are called angeli are in Latin called nuntii [messengers], so the Greek apostoli [apostles] becomes the Latin missi [persons sent]. But never would any of the apostles have dared to say, "He that believeth on me, believeth not on me, but on Him that sent me;" for in no sense whatever would he say, "He that believeth on me." We believe an apostle, but we do not believe on him; for it is not an apostle that justifieth the ungodly. But to him that believeth on Him that justifieth the ungodly, his faith is counted for righteousness. An apostle might say, He that receiveth me, receiveth Him that sent me; or, He that heareth me, heareth Him that sent me; for the Lord tells them so Himself: "He that receiveth you, receiveth me; and he that receiveth me, receiveth Him that sent me." For the master is honored in the servant, and the father in the son: but then the father is as it were in the son, and the master as it were in the servant. But the only-begotten Son could rightly say, "Believe on God, and believe on me;" as also what He saith here, "He that believeth on me, believeth not on me, but on Him that sent me." He did not turn away the faith of the believer from Himself, but only would not have the believer continue in the form of a servant: because every one who believeth in the Father that sent Him, straightway believeth on the Son, without whom he knoweth that the Father hath no existence as such, and thus reacheth in his faith to the belief of His equality with the Father, in conformity with the words that follow, "And he that seeth me, seeth Him that sent me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252054.html'
source_title="Tractates on John 54"
