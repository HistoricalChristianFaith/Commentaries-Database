[[commentary]]
quote='''
“And hast not shut me up into the hands of the enemy” (ver. 8). And hast not shut me up, that I should have no opening for recovering unto liberty, and be given over for ever into the power of the devil, ensnaring me with the desire of this life, and terrifying me with death. “Thou hast set my feet in a large room.” The resurrection of my Lord being known, and mine own being promised me, my love, having been brought out of the straits of fear, walks abroad in continuance, into the expanse of liberty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
