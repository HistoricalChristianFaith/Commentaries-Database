[[commentary]]
quote='''
For when the Apostle had said, “But not in all them was God well pleased,” thereby showing that there were those too in whom God was well pleased: he hath forthwith added, “For they were overthrown in the desert:” secondly he hath continued, “but these things have been made our figures.”…To us therefore more particularly these words have been sung. Whence in this Psalm among other things there hath been said, “That another generation may know, sons who shall be born and shall arise.” Moreover, if that death by serpents, and that destruction by the destroyer, and the slaying by the sword, were figures, as the Apostle evidently doth declare, inasmuch as it is manifest that all those things did happen: for he saith not, in a figure they were spoken, or, in a figure they were written, but, in a figure, he saith, they happened to them: with how much greater diligence of godliness must those punishments be shunned whereof those were the figures? For beyond a doubt as in good things there is much more of good in that which is signified by the figure, than in the figure itself: so also in evil things very far worse are the things which are signified by the figures, while so great are the evil things which as figures do signify. For as the land of promise, whereunto that people was being led, is nothing in comparison with the Kingdom of Heaven, whereunto the Christian people is being led: so also those punishments which were figures, though they were so severe, are nothing in comparison with the punishments which they signify.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
