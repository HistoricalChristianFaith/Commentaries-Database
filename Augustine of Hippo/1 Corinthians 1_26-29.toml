[[commentary]]
quote='''
Ye heard when the Apostle was being read, “See ye your calling, brethren, how not many wise after the flesh, not many mighty, not many noble, but the foolish things of the world God hath chosen to confound the wise.”…But the Lord chose afterwards orators also; but they would have been proud, if He had not first chosen fishermen; He chose rich men; but they would have said that on account of their riches they had been chosen, unless at first He had chosen poor men: He chose Emperors afterwards; but better is it, that when an Emperor hath come to Rome, he should lay aside his crown, and weep at the monument of a fisherman, than that a fisherman should weep at the monument of an Emperor. “For the weak things of the world God hath chosen to confound the strong,” etc.…And what followeth? The Apostle hath concluded, “That there might not glory before God any flesh.” See ye how from us He hath taken away, that He might give glory: hath taken away ours, that He might give His own; hath taken away empty, that He might give full; hath taken away insecure, that He might give solid.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252066.html'
source_title="Exposition on Psalm 66"
