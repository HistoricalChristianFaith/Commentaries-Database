[[commentary]]
quote='''
“Let all the earth fear the Lord:” let every sinner fear, that so he may cease to sin. “Let all the inhabitants of the world stand in awe of Him” (ver. 8): not of the terrors of men, or of any creature, but of Him let them stand in awe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
