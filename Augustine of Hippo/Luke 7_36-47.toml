[[commentary]]
quote='''
Hence that Pharisee who had asked the Lord to dinner, was whole in his own eyes; but that sick woman rushed into the house to which she had not been invited, and, made impudent by the desire of health, approached not the head of the Lord, nor the hands, but the feet; washed them with tears, wiped them with her hair, kissed them, anointed them with ointment,-made peace, sinner as she was, with the footprints of the Lord. The Pharisee who sat at meat there, as though whole himself, blamed the Physician, and said within himself, "This man, if he were a prophet, would have known what woman touched his feet." He suspected that He knew not, because He did not repulse her to prevent His being touched with unclean hands; but He did know, He permitted Himself to be touched, that the touch itself might heal. The Lord, seeing the heart of the Pharisee, put forth a parable: "There was a certain creditor, which had two debtors; the one owed five hundred denars, and the other fifty; and when they had nothing to pay, he frankly forgave them both. Which of them loved him most?" He answered, "I suppose, Lord, he to whom he forgave most." And turning to the woman, He said unto Simon, "Seest thou this woman? I entered into thine house, thou gavest me no water for my feet; but she hath washed my feet with tears, and wiped them with the hairs of her head: thou gavest me no kiss; she hath not ceased to kiss my feet: thou gavest me no oil; she hath anointed my feet with ointment. Wherefore, I say unto thee, to her are forgiven many sins, for she loved much; but to whom little is forgiven, the same loveth little." That is to say, thou art more sick, but thou thinkest thyself whole; thou thinkest that little is forgiven thee when thou owest more. Well did she, because guile was not in her, deserve medicine. What means, guile was not in her? She confessed her sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
source_title="Tractates on John 7"
