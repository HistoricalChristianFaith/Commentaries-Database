[[commentary]]
quote='''
Therefore it follows and he says: One indeed believes he may eat all things; but he who is weak, let him eat vegetables. For at that time many, now firm in faith and knowing, according to the teaching of the Lord, that the things which enter into the mouth do not defile, but the things which come out, took food indifferently with a clear conscience. But certain weaker ones abstained from meats and from wine, lest even unknowingly they should fall upon the things that were sacrificed to idols. For at that time all sacrificial meat was sold in the market, and the Gentiles poured out libations of the firstfruits of the wine to their idols, and made certain sacrifices at the very winepresses. The Apostle therefore commands both those who used such foods with a clear conscience not to despise the weakness of those who abstained from such food and drink, and those weak ones not to judge, as though defiled, those who did not abstain from meats and drank wine. To this pertains what he says consequently: Let him who eats not judge—that is, despise—him who does not eat; and let him who does not eat not judge him who eats. For the strong were contemptuously despising the weaker, and the weak were rashly judging the strong.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
