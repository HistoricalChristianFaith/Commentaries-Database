[[commentary]]
quote='''
The Lord our God has granted, to whom we give thanks together, that we might see you and be seen by you. And if this is why our mouth is filled with joy and our tongue with exultation because we have seen each other in mortal flesh, what will our joy be like when we see each other where we fear nothing of each other? The Apostle says: Rejoicing in hope. Therefore, our joy, which is now in hope, is not yet in reality. But hope that is seen is not hope, he says: for what a man sees, why does he hope? But if we hope for what we do not see, we wait for it with patience. If, however, companions rejoicing together while journeying, what joy will they have in the homeland?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520306B.html'
source_title="Sermon 306B"


[[commentary]]
quote='''
“Then was our mouth filled with joy, and our tongue with exultation” (ver. 2). That mouth, brethren, which we have in our body, how is it “filled with joy”? It useth not to be “filled,” save with meat, or drink, or some such thing put into the mouth. Sometimes our mouth is filled; and it is more that we say to your holiness, when we have our mouth full, we cannot speak. But we have a mouth within, that is, in the heart, whence whatsoever proceedeth, if it is evil, defileth us, if it is good, cleanseth us. For concerning this very mouth ye heard when the Gospel was read. For the Jews reproached the Lord, because His disciples ate with unwashen hands. They reproached who had cleanness without; and within were full of stains. They reproached, whose righteousness was only in the eyes of men. But the Lord sought our inward cleanness, which if we have, the outside must needs be clean also. “Cleanse,” He saith, “the inside,” and “the outside shall be clean also.”…

But let us return to what was just now read from the Gospel, relating to the verse before us, “Our mouth was filled with joy, and our tongue with delight:” for we are inquiring what mouth and what tongue. Listen, beloved brethren. The Lord was scoffed at, because His disciples ate with unwashed hands. The Lord answered them as was fitting, and said unto the crowds whom He had called unto Him, “Hear ye all, and understand: not that which goeth into the mouth defileth a man; but that which cometh out of the mouth, this defileth a man.” What is this? when He said, what goeth into the mouth, He meant only the mouth of the body. For meat goeth in, and meats defile not a man; because, “All things are clean to the clean;” and, “every creature of God is good, and none to be refused, if it be received with thanksgiving.”…

Guard the mouth of thy heart from evil, and thou wilt be innocent: the tongue of thy body will be innocent, thy hands will be innocent; even thy feet will be innocent, thy eyes, thy ears, will be innocent; all thy members will serve under righteousness, because a righteous commander hath thy heart. “Then shall they say among the heathen, the Lord hath done great things for them.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520126.html'
source_title="Exposition on Psalm 126"
