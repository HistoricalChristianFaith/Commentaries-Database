[[commentary]]
quote='''
“My foot hath stood in uprightness.” My Love hath not withdrawn from Thy righteousness. “In the Churches I will bless Thee, O Lord” (ver. 12). I will not hide Thy blessing, O Lord, from those whom Thou hast called; for next to the love of Thee I join the love of my neighbour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252026.html'
source_title="Exposition on Psalm 26"
