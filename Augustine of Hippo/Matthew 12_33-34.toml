[[commentary]]
quote='''
Hear out of the Gospel His own voice, the very same as is in this Psalm: “Hypocrites,” saith the Lord to the Pharisees, “how are ye able good things to speak, when ye are evil men?” “Either make the tree good, and the fruit thereof good: or make the tree evil, and the fruit thereof evil.” Why wilt thou whiten thee, wall of mud? I know thy inward parts, I am not deceived by thy covering: I know what thou holdest forth, I know what thou coverest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
