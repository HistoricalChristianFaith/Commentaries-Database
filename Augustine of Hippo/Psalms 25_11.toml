[[commentary]]
quote='''
“For Thy Name’s sake, O Lord, Thou wilt be favourable to my sin; for it is manifold” (ver. 11). Thou hast not only forgiven my sins, which I committed before I believed; but also to my sin, which is manifold, since even in the way there is no lack of stumbling, Thou wilt be made favourable by the sacrifice of a troubled spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
