[[commentary]]
quote='''
But if these words further signify something else which more closely concerns us, God “by His wisdom made the heavens,” that is, His saints, spiritual men, to whom He has given not only to believe, but also to understand things divine; those who cannot yet attain to this, and only hold their faith firmly, as being beneath the heavens, are figured by the name of earth. And because they abide with unshaken belief upon the baptism they have received, therefore it is said, “He laid out the earth above the waters.” Further, since it is written of our Lord Jesus Christ, that “in Him are hid all the treasures of wisdom and knowledge,” and that these two, wisdom and knowledge, differ somewhat from one another is testified by other utterances of Scripture, especially in the words of holy Job, where both are in a manner defined; not unsuitably then do we understand wisdom to consist in the knowledge and love of That which ever is and abideth unchangeable, which is God. For where he saith, “piety is wisdom,” in Greek is θεοσέβεια, and to express the whole of this in Latin, we may call it worship of God. But to depart from evil, which he calls knowledge, what else is it but to walk cautiously and heedfully “in the midst of a crooked and perverse generation,” in the night, as it were, of this world, that each one by keeping himself from iniquity may avoid being confounded with the darkness, distinguished by the light of his proper gift.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520136.html'
source_title="Exposition on Psalm 136"
