[[commentary]]
quote='''
(Tr. lv) Pascha is not a Greek word, as some think, but Hebrew: though there is remarkable agreement of the two languages in it. The Greek word to suffer being πασχεῖν, pascha has been thought to mean passion, as being derived from the above word. But in Hebrew, pascha is a passing over; the feast deriving its name from the passing of the people of God over the Red Sea into Egypt. All was now to take place in reality, of which that passover was the type. Christ was led as a lamb to the slaughter; whose blood sprinkled upon our door-posts, i. e. whose sign of the cross marked on our foreheads, delivers us from the dominion of this world, as from Egyptian bondage. And we perform a most wholesome journey or pass-over, when we pass over from the devil to Christ, from this unstable world to His sure kingdom. In this way the Evangelist seems to interpret the word: When Jesus knew that His hour was come when He should pass over out of this world unto the Father. This is the pascha, this the passing over.

(Tr. lv. 2) He loved them unto the end, i. e. that they themselves too might pass out of this world, by love, unto Him their head. For what is unto the end, but unto Christ? (Rom. 10:4) For Christ is the end of the law for righteousness to every one that believeth. But these words may be understood after a human sort, to mean that Christ loved His own up to His death. But God forbid that He should end His love by death, who is not ended by death: except indeed we understand it thus: He loved His own unto death: i. e. His love for them led Him to death.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The Lord's Supper, as set forth in John, must, with His assistance, be unfolded in a becoming number of Lectures, and explained with all the ability He is pleased to grant us. "Now, before the feast of the passover, when Jesus knew that His hour was come that He should depart out of this world unto the Father, having loved His own who were in the world, He loved them unto the end." Pascha (passover) is not, as some think, a Greek noun, but a Hebrew: and yet there occurs in this noun a very suitable kind of accordance in the two languages. For inasmuch as the Greek word paschein means to suffer, therefore pascha has been supposed to mean suffering, as if the noun derived its name from His passion: but in its own language, that is, in Hebrew, pascha means passover; because the pascha was then celebrated for the first time by God's people, when, in their flight from Egypt, they passed over the Red Sea. And now that prophetic emblem is fulfilled in truth, when Christ is led as a sheep to the slaughter, that by His blood sprinkled on our doorposts, that is, by the sign of His cross marked on our foreheads, we may be delivered from the perdition awaiting this world, as Israel from the bondage and destruction of the Egyptians; and a most salutary transit we make when we pass over from the devil to Christ, and from this unstable world to His well-established kingdom. And therefore surely do we pass over to the ever-abiding God, that we may not pass away with this passing world. The apostle, in extolling God for such grace bestowed upon us, says: "Who hath delivered us from the power of darkness, and hath translated us into the kingdom of the Son of His love." This name, then, of pascha, which, as I have said, is in Latin called transitus (pass over), is interpreted, as it were, for us by the blessed evangelist, when he says, "Before the feast of pascha, when Jesus knew that His hour was come that He should pass out of this world to the Father." Here you see we have both pascha and pass-over. Whence, and whither does He pass? Namely, "out of this world to the Father." The hope was thus given to the members in their Head, that they doubtless would yet follow Him who was "passing" before. And what, then, of unbelievers, who stand altogether apart from this Head and His members? Do not they also pass away, seeing that they abide not here always? They also do plainly pass away: but it is one thing to pass from the world, and another to pass away with it; one thing to pass to the Father, another to pass to the enemy. For the Egyptians also passed over [the sea]; but they did not pass through the sea to the kingdom, but in the sea to destruction.

"When Jesus knew," then, "that His hour was come that He should pass out of this world unto the Father, having loved His own who were in the world, He loved them unto the end." In order, doubtless, that they also, through that love of His, might pass from this world where they now were, to their Head who had passed hence before them. For what mean these words, "to the end," but just to Christ? "For Christ is the end of the law," says the apostle, "for righteousness to every one that believeth." The end that consummates, not that consumes; the end whereto we attain, not wherein we perish. Exactly thus are we to understand the passage, "Christ our passover is sacrificed." He is our end; into Him do we pass. For I see that these gospel words may also be taken in a kind of human sense, that Christ loved His own even unto death, so. that this may be the meaning of "He loved them unto the end." This meaning is human, not divine: for it was not merely up to this point that we were loved by Him, who loveth us always and endlessly. God forbid that He, whose death could not end, should have ended His love at death. Even after death that proud and ungodly rich man loved his five brethren; and is Christ to be thought of as loving us only till death? God forbid, beloved. He would have come in vain with a love for us that lasted till death, if that love had ended there. But perhaps the words, "He loved them unto the end," may have to be understood in this way, That He so loved them as to die for them. For this He testified when He said, "Greater love hath no man than this, that a man lay down his life for his friends." We have certainly no objection that "He loved them unto the end" should be so understood, that is, it was His very love that carried Him on to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252055.html'
source_title="Tractates on John 55"

[[commentary]]
quote='''
But whence hath this change been made but by the Passion of Christ? The very word Pascha in Latin is interpreted passage. For Pascha is not a Greek word but a Hebrew. It soundeth indeed in the Greek language like Passion, because πάσχειν signifieth to suffer: but if the Hebrew expression be examined, it pointeth to something else. Pascha doth intimate passage. Of which even John the Evangelist hath admonished us, who (just before the Passion when the Lord was coming to the supper wherein He set forth the Sacrament of His Body and Blood) thus speaketh: “But when there had come the hour, wherein Jesus was to pass from this world to the Father.” He hath expressed then the “passage” of the Pascha. But unless He passed Himself hence to the Father, who came for our sake, how should we have been able to pass hence, who have not come down for the sake of taking up anything, but have fallen? But He Himself fell not; He but came down, in order that He might raise up him that had fallen. The passage therefore both of Him and of us is hence to the Father, from this world to the kingdom of Heaven, from life mortal to life everlasting, from life earthly to life heavenly, from life corruptible to life incorruptible, from intimacy with tribulations to perpetual security.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"

[[commentary]]
quote='''
Pascha, as they say who know, and who have explained to us what to read, meaneth “Passover.” When then the Lord’s Passion was about to come, the Evangelist, as though he would use this very word, saith, “When the hour was come that Jesus should pass over to the Father.” We hear then of Pascha in this verse, “I am alone, until I pass over.” After Pascha I shall no longer be alone, after passing-over I shall no longer be alone. Many shall imitate Me, many shall follow Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520141.html'
source_title="Exposition on Psalm 141"
