[[commentary]]
quote='''
Therefore, coming with all Angels, together with Him He shall have the Saints also. For plainly saith Isaias also, “He shall come to judgment with the elders of the people.” Those “elders of the people,” then, those but now named Angels, those thousands of many men made perfect coming from the whole world, are called Heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"
