[[commentary]]
quote='''
As a matter of fact, a single witness generally speaks the truth, while a mob may tell lies. And the world, in its conversion to Christianity, believed one apostle preaching the gospel rather than the mistaken multitude who persecuted him.
'''
source_url=''
source_title="AGAINST FAUSTUS, A MANICHAEAN 16.13"

[[commentary]]
quote='''
For it is a great question, my brethren, and to me it certainly appears to have been ordained in a mystery, where God said, "In the mouth of two or three witnesses every word shall stand." Is truth sought by two witnesses? Clearly it is; so is the custom of mankind: but yet it may be that even two witnesses lie. The chaste Susanna was pressed by two false witnesses: were they not therefore false because they were two? Do we speak of two or of three? A whole people lied against Christ. If, then, a people, consisting of a great multitude of men, was found a false witness, how is it to be understood that "in the mouth of two or three witnesses every word shall stand," unless it be that in this manner the Trinity is mysteriously set forth to us, in which is perpetual stability of truth? Dost thou wish to have a good cause? Have two or three witnesses,-the Father, Son, and Holy Ghost. In short, when Susanna, the chaste woman and faithful wife, was pressed by two false witnesses, the Trinity supported her in her conscience and in secret: that Trinity raised up from secrecy one witness, Daniel, and convicted the two?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252036.html'
source_title="Tractates on John 36"
