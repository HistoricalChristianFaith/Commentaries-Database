[[commentary]]
quote='''
Jacob saw a ladder in a dream; and on a ladder he saw angels ascending and descending: and he anointed the stone which he had placed at his head. You have heard that the Messias is Christ; you have heard that Christ is the Anointed. For Jacob did not place the stone, the anointed stone, that he might come and adore it: otherwise that would have been idolatry, not a pointing out of Christ. What was done was a pointing out of Christ, so far as it behoved such a pointing out to be made, and it was Christ that was pointed out. A stone was anointed, but not for an idol. A stone anointed; why a stone? "Behold, I lay in Zion a stone, elect, precious: and he that believeth on Him shall not be confounded." Why anointed? Because Christus comes from chrisma. But what saw he then on the ladder? Ascending and descending angels. So it is the Church, brethren: the angels of God are good preachers, preaching Christ; this is the meaning of, "they ascend and descend upon the Son of man."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
source_title="Tractates on John 7"
