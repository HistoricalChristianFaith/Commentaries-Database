[[commentary]]
quote='''
And God, who was far from the Gentiles, was near unto them: yet He had regard even to those who were afar off, and to those who were near, as the Apostle said: “And He came and preached peace to you who were afar off, and to them that were near.” Whom did He mean by those near? The Jews, because they worshipped one God. Whom by those who were afar off? The Gentiles, because they had left Him by whom they were made and worshipped things which themselves had made. For it is not in space that any one is far from God, but in affections. Thou lovest God, thou art near unto Him. Thou hatest God, thou art far off. Thou art standing in the same place, both while thou art near and far off.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252085.html'
source_title="Exposition on Psalm 85"
