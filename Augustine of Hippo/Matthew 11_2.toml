[[commentary]]
quote='''
Matthew proceeds with his narrative in the following terms: "And it came to pass, when Jesus had made an end of commanding His twelve disciples, He departed thence to teach and to preach in their cities. Now, when John had heard in the prison the works of Christ, he sent two of his disciples, and said unto Him, Art thou He that should come, or do we look for another?" and so on, until we come to the words, "And Wisdom is justified of her children." This whole section relating to John the Baptist, touching the message which he sent to Jesus, and the tenor of the reply which those whom he despatched received, and the terms in which the Lord spoke of John after the departure of these persons, is introduced also by Luke. The order, however, is not the same. But it is not made clear which of them gives the order of his own recollections, and which keeps by the historical succession of the things themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 31"
