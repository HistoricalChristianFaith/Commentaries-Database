[[commentary]]
quote='''
Apart from this bond of mortal concupiscence was Christ born without a male, of a virgin conceiving by the Holy Ghost. He cannot be said to have been conceived in iniquity, it cannot be said, In sins His mother nourished Him in the womb, to whom was said, “The Holy Ghost shall come upon thee, and the Virtue of the Highest shall overshadow thee.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"
[[commentary]]
quote='''
Of which Holy Spirit, when, sent to His Mother full of grace, the Angel was speaking, to her enquiring in what manner it could come to pass that she was announced as going to bear, seeing she knew not a man:…he saith, “The Holy Spirit shall come over upon thee, and the virtue of the Most Highest shall overshadow thee,” that is, shall make a shadow for thee, “wherefore that Holy Thing which shall be born of thee, shall be called the Son of God.” That “shadow” again is understood of a defence against the heat of carnal lusts: whence not in carnal concupiscence, but in spiritual belief, the Virgin conceived Christ. But the shadow consisteth of light and body: and further, The “Word” that “was in the beginning,” that true Light, in order that a noonday shadow might be made for us; “the Word,” I say, “was made Flesh, and dwelled in us.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
