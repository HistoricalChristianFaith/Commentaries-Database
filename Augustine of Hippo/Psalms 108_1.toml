[[commentary]]
quote='''
I have not thought that the CVIIIth Psalm required an exposition; since I have already expounded it in the LVIIth Psalm, and in the LXth, of the last divisions of which this Psalm consisteth. For the last part of the LVIIth is the first of this, as far as the verse, “Thy glory is above all the earth.” Henceforth to the end, is the last part of the LXth: as the last part of the CXXXVth is the same as that of the CXVth, from the verse, “The images of the heathen are but gold and silver:” as the XIVth and LIIId, with a few alterations in the middle, have everything the same from the beginning to the end. Whatever slight differences therefore occur in this CVIIIth Psalm, compared with those two, of parts of which it is composed, are easy to understand; just as we find in the LVIIth, “I will sing and give praise; awake, O my glory:” here, “I will sing and give praise, with my glory.” Awake, is said there, that he may sing and give praise therewith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520108.html'
source_title="Exposition on Psalm 108"

[[commentary]]
quote='''
We are taught by this Psalm, that those titles which seem to refer to history are most rightly understood prophetically, according to the object of the composition of the Psalms.…And yet this Psalm is composed of the latter portions of two, whose titles are different. Where it is signified that each concur in a common object, not in the surface of the history, but in the depth of prophecy, the objects of both being united in this one, the title of which is, “A Song or Psalm of David:” resembling neither of the former titles, otherwise than in the word David. Since, “in many places, and in diverse manners,” as the Epistle to the Hebrews saith, “God spoke in former times to the fathers through the Prophets;” yet He spoke of Him whom He sent afterwards, that the words of the Prophets might be fulfilled: for “all the promises of God in Him are yea.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520108.html'
source_title="Exposition on Psalm 108"
