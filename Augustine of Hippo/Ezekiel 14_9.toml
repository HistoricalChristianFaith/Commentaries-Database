[[commentary]]
quote='''
Which of the two, patience or power, do you find in the words of Scripture? Whichever you choose, even if you admit both, you must surely see that the false speech of this prophet is both sin and punishment for sin. Will you also say that the words, "I, the Lord, have deceived that prophet," should be interpreted as though God deserted him that he might be deceived in return for past misdeeds and thus err? Say what you will, he was punished for sin in such a way that he sinned prophesying something false.
'''
source_url=''
source_title="AGAINST JULIAN 5:3.13"

[[commentary]]
quote='''
When, therefore, you hear the Lord say, "I the Lord have deceived that prophet," and likewise what the apostle says: "He hath mercy on whom He will have mercy, and whom He will He hardeneth," believe that, in the case of him whom He permits to be deceived and hardened, his evil deeds have deserved the judgment; whilst in the case of him to whom He shows mercy, you should loyally and unhesitatingly recognise the grace of the God who "rendereth not evil for evil; but contrariwise blessing."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 45"
