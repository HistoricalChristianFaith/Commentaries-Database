[[commentary]]
quote='''
(de Sanc. Virg. 26.) Because that life eternal shall be equal to all the saints, a denarius is given to all; but forasmuch as in that life eternal the light of merits shall shine diversely, there are with the Father many mansions; so that under this same denarius bestowed unequally one shall not live longer than another, but in the many mansions one shall shine with more splendour than another.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For, albeit one is stronger than another, one wiser than another, one more righteous than another, "in the Father's house there are many mansions;" none of them shall remain outside that house, where every one, according to his deserts, is to receive a mansion. All alike have that penny, which the householder orders to be given to all that have wrought in the vineyard, making no distinction therein between those who have labored less and those who have labored more: by which penny, of course, is signified eternal life, whereto no one any longer lives to a different length than others, since in eternity life has no diversity in its measure. But the many mansions point to the different grades of merit in that one eternal life. For there is one glory of the sun, another glory of the moon, and another glory of the stars: for one star differeth from another star in glory; and so also the resurrection of the dead. The saints, like the stars in the sky, obtain in the kingdom different mansions of diverse degrees of brightness; but on account of that one penny no one is cut off from the kingdom; and God will be all in all in such a way, that, as God is love, love will bring it about that what is possessed by each will be common to all. For in this way every one really possesses it, when he loves to see in another what he has not himself. There will not, therefore, be any envying amid this diversity of brightness, since in all of them will be reigning the unity of love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252067.html'
source_title="Tractates on John 67"
