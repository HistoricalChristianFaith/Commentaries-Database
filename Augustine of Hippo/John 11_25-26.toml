[[commentary]]
quote='''
After this, again, he brings before us the raising of Lazarus from the dead: in connection with which miracle the Lord said, "I am the resurrection and the life: he that believeth on me, though he were dead, yet shall he live: and whosoever liveth and believeth in me shall never die." In these words what do we recognise but the sublimity of the Godhead of Him, in fellowship with whom we shall live for ever?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 10"
