[[commentary]]
quote='''
When he says: Not only those who do these things, but also those who consent to those who do them, he means that whatever they did, they did not unwillingly; but, when they consent to evil deeds, they also approve even those things which they did not do; and therefore, of sins now fully accomplished, he says: Therefore you are inexcusable, O every man who judges.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
