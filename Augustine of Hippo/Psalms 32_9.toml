
[[commentary]]
quote='''
“Be not ye like unto horse or mule, which have no understanding:” and therefore would govern themselves. But saith the Prophet, “Hold in their jaws with bit and bridle.” Do Thou then, O God, unto them “that will not come nigh Thee” (ver. 9), what man doth to horse and mule, that by scourges Thou make them to bear Thy rule.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252032.html'
source_title="Exposition on Psalm 32"

[[commentary]]
quote='''
But wherefore doth man bless the Lord at all times? Because he is humble. What is it to be humble? To take not praise unto himself. Who would himself be praised, is proud: who is not proud, is humble. Wouldest thou not then be proud? That thou mayest be humble, say what is here written; “In the Lord shall my soul be praised: the humble shall hear thereof and be glad” (ver. 2). Those then who will not be praised in the Lord, are not humble, but fierce, rough, lifted up, proud. Gentle cattle would the Lord have; be thou the Lord’s jumentum; that is, be thou humble. He sitteth upon thee, He ruleth thee: fear not lest thou stumble, and fall headlong: that indeed is thy infirmity; but consider Who sitteth upon thee. Thou art an ass’s colt, but thou carriest Christ. For even He on an ass’s colt came into the city; and that beast was gentle.…“Be not ye as the horse or as the mule, which have no understanding.” For horse and mule sometimes lift up their neck, and by their own fierceness throw off their rider. They are tamed with the bit, with bridle, with stripes, until they learn to submit, and to carry their master. But thou, before thy jaws are bruised with the bridle, be humble, and carry thy Lord: wish not praise for thyself, but praised be He who sitteth upon thee, and say thou, “In the Lord shall my soul be praised; the humble shall hear thereof, and be glad.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"

[[commentary]]
quote='''
But furthermore, dearly beloved, we ought to remember, that after the image of God we have been made, and that not in any other part than in the understanding itself. For in many things by beasts we are surpassed: but when a man knoweth himself to have been made after the image of God, therein something in himself he acknowledgeth to be more than hath been given to dumb animals. But on consideration of all those things which a man hath, he findeth himself in this thing peculiarly distinguished from a dumb animal, in that he hath himself an understanding. Whence certain men despising in themselves that peculiar and especial thing which from their Maker they had received, the Maker Himself reproveth, saying, “Do not become like horse and mule, in which there is no understanding.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"

[[commentary]]
quote='''
But yet in order that we may have that knowledge that will prevent our saying, each one of us, "I did not know," "I did not hear," "I did not understand;" the human will is summoned, in such words as these: "Wish not to be as the horse or as the mule, which have no understanding;" although it may show itself even worse, of which it is written, "A stubborn servant will not be reproved by words; for even if he understand, yet he will not obey."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 5"
