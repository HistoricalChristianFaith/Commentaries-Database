[[commentary]]
quote='''
“Because I have kept the ways of the Lord” (ver. 21). That the breadth of good works, that are by faith, and the long-suffering of perseverance should follow after.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
