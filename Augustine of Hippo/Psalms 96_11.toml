[[commentary]]
quote='''
“Let the heavens rejoice, and let the earth be glad” (ver. 11). Let the heavens, which declare the glory of God, rejoice; let the heavens rejoice, which the Lord made; let the earth be glad, which the heavens rain upon. For the heavens are the preachers, the earth the listeners. “Let the sea be stirred up, and the fulness thereof.” What sea? The world. The sea hath been stirred up, and the fulness thereof: the whole world was roused up against the Church, while it was being extended and built over all the earth. Concerning this stirring up, ye have heard in the Gospel, “They shall deliver you up to councils.” “The sea was stirred up: but how should the sea ever conquer Him who made it?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252096.html'
source_title="Exposition on Psalm 96"
