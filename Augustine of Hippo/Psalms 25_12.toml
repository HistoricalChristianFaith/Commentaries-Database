[[commentary]]
quote='''
“Who is the man that feareth the Lord?” from which fear he begins to come to wisdom. “He shall establish a law for him in the way, which he hath chosen” (ver. 12). He shall establish a law for him in the way, which in his freedom he has taken, that he may not sin now with impunity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
