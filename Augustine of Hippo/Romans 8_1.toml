[[commentary]]
quote='''
When he says: There is therefore now no condemnation for those who are in Christ Jesus, he sufficiently shows that there is no condemnation if carnal desires exist, but only if one obeys them so as to sin. This happens to those who are established under the law, not yet under grace. For those established under the law not only have concupiscence warring against them, but are also led captive when they submit to it. But this does not happen to those who serve the law of God with their mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
