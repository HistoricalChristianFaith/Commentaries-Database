[[commentary]]
quote='''
Luke, on the other hand, sets forth the same incident on a wider scale, and records a variety of other matters which took place in that connection. And this account he brings in at a point not long subsequent to His baptism and temptation, thus unquestionably introducing by anticipation what really happened only after the occurrence of a number of intervening circumstances. In this, therefore, every one may see an illustration of a principle of prime consequence in relation to this most weighty question concerning the harmony of the evangelists, which we have undertaken to solve by the help of God,—the principle, namely, that it is not by mere ignorance that these writers have been led to make certain omissions, and that it is as little through simple ignorance of the actual historical order of events that they have [at times] preferred to keep by the order in which these events were recalled to their own memory. The correctness of this principle may be gathered most clearly from the fact that, at a point antecedent to any account given by him of anything done by the Lord at Capharnaum, Luke has anticipated the literal date, and has inserted this passage which we have at present under consideration, and in which we are told how His fellow-citizens at once were astonished at the might of the authority which was in Him, and expressed their contempt for the meanness of His family. For he tells us that He addressed them in these terms: "Ye will surely say unto me, Physician, heal thyself: whatsoever we have heard done in Capharnaum, do also here in thy country;" while, so far as the narrative of this same Luke is concerned, we have not yet read of Him as having done anything at Capharnaum. Furthermore, as it will not take up much time, and as, besides, it is both a very simple and a highly needful matter to do so, we insert here the whole context, showing the subject from which and the method in which the writer has come to give the contents of this section. After his statement regarding the Lord's baptism and temptation, he proceeds in these terms: "And when the devil had ended all the temptation, he departed from Him for a season. And Jesus returned in the power of the Spirit into Galilee: and there went out a fame of Him through all the region round about. And He taught in their synagogues, and was magnified of all. And He came to Nazareth, where He had been brought up: and, as his custom was, He went into the synagogue on the Sabbath-day, and stood up for to read. And there was delivered unto Him the book of the prophet Esaias: and when He had opened the book, He found the place where it was written, The Spirit of the Lord is upon me, because He hath anointed me. He hath sent me to preach the gospel to the poor, to proclaim deliverance to the captives, and sight to the blind; to set at liberty them that are bruised, to proclaim the accepted year of the Lord, and the day of retribution. And when He had closed the book, He gave it again to the minister, and sat down: and the eyes of all them that were in the synagogue were fastened on Him. And He began to say unto them, This day is this scripture fulfilled in your ears. And all bare Him witness, and wondered at the gracious words which proceeded out of His mouth. And they said, Is not this Joseph's son? And He said unto them, Ye will surely say unto me this proverb, Physician, heal thyself: whatsoever we have heard done in Capharnaum, do also here in thy country." And so he continues with the rest, until this entire section in his narrative is gone over. What, therefore, can be more manifest, than that he has knowingly introduced this notice at a point antecedent to its historical date, seeing it admits of no question that he knows and refers to certain mighty deeds done by Him before this period in Capharnaum, which, at the same time, he is aware he has not as yet narrated in detail? For certainly he has not made such an advance with his history from his notice of the Lord's baptism, as that he should be supposed to have forgotten the fact that up to this point he has not mentioned any of the things which took place in Capharnaum; the truth being, that he has just begun here, after the baptism, to give us his narrative concerning the Lord personally.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 42"
