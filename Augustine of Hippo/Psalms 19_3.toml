[[commentary]]
quote='''
“There is no speech nor language, in which their voices are not heard” (ver. 3). In which the voices of the Evangelists have not been heard, seeing that the Gospel was preached in every tongue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252019.html'
source_title="Exposition on Psalm 19"
