[[commentary]]
quote='''
(Lib. 83. Quæst. q. 80.) We have the narratives of the Evangelists, by which we know that Christ was both born of the Blessed Virgin Mary, was seized by the Jews, scourged, crucified, put to death, and buried in a tomb, all which cannot be supposed to have taken place without a body, and not even the maddest will say that these things are to be understood figuratively, when they are told by men who wrote what they remembered to have happened. These then are witnesses that He had a body, as those affections which cannot be without mind prove Him to have had a mind, and which we read in the accounts of the same Evangelists, that Jesus wondered, was angry, was sorrowful.

(de. Civ. Dei, xiv. 9.) Since then these things are related in the Evangelists, they are not surely false, but as when He willed He became Man, so likewise when He willed He took into His human soul these passions for the sake of adding assurance to the dispensation. We indeed have these passions by reason of the weakness of our human nature; not so the Lord Jesus, whose weakness was of power.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
“For my soul is filled with evils, and my life draweth nigh unto hell” (ver. 3). Dare we speak of the Soul of Christ as “filled with evils,” when the passion had strength as far as it had any, only over the body?…The soul therefore may feel pain without the body: but without the soul the body cannot. Why therefore should we not say that the Soul of Christ was full of the evils of humanity, though not of human sins? Another Prophet says of Him, that He grieved for us: and the Evangelist says, “And He took with Him Peter and the two sons of Zebedee, and began to be sorrowful and very heavy:” and our Lord Himself saith unto them of Himself, “My soul is exceeding sorrowful, even unto death.” The Prophet who composed this Psalm, foreseeing that this would happen, introduces Him saying, “My soul is full of evils, and My life draweth nigh unto hell.” For the very same sense is here expressed in other words, as when He said, “My soul is sorrowful, even unto death.” The words, “My soul is sorrowful,” are like these, “My soul is full of evils:” and what follows, “even unto death,” like, “my life draweth nigh unto hell.” These feelings of human infirmity our Lord took upon Him, as He did the flesh of human infirmity, and the death of human flesh, not by the necessity of His condition, but by the free will of His mercy, that He might transfigure into Himself His own body, which is the Church (the head of which He deigned to be), that is, His members in His holy and faithful disciples: that if amid human temptations any one among them happened to be in sorrow and pain, he might not therefore think that he was separated from His favour: that the body, like the chorus following its leader, might learn from its Head, that these sorrows were not sin, but proofs of human weakness. We read of the Apostle Paul, a chief member in this body, and we hear him confessing that his soul was full of such evils, when he says, that he feels “great heaviness and continual sorrow in heart for his brethren according to the flesh, who are Israelites.” And if we say that our Lord was sorrowful for them also at the approach of His Passion, in which they would incur the most atrocious guilt, I think we shall not speak amiss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252088.html'
source_title="Exposition on Psalm 88"
