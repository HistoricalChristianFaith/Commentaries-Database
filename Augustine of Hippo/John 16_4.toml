[[commentary]]
quote='''
(Tr. xciii) And He mentions these things beforehand, because trials, however soon to pass away, when they come upon men unprepared for them, are very overwhelming: But these things have I told you, that when the hour shall come, ye may remember that I told you of them: the hour, the hour of darkness, the hour of night. But the night of the Jews was not allowed to mix with or darken the day of the Christians.

(Tr. xciv. 1) In the other three Evangelists these predictions occur before the supper; John gives them after. Still if they relate them as given very near His Passion, that is enough to explain His saying, These things I said not unto you at the beginning. Matthew however relates these prophecies as given long before His Passion, on the occasion of His choosing the twelve. How do we reconcile this with our Lord's words? By supposing them to apply to the promise of the Holy Spirit, and the testimony He would give amidst their suffering. This was what He had not told them at the beginning, and that because He was with them, and His presence was a sufficient consolation. But as He was about to depart, it was meet that He should tell them of His coming, by whom the love of God would be shed abroad in their hearts, to preach the word of God with boldness.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For that such was the cause of His making these announcements to them beforehand, is shown also by His words that followed: "But these things have I told you, that, when their time shall come, ye may remember that I told you of them." Their hour was an hour of darkness, a midnight hour. But the Lord commanded His loving-kindness in the daytime, and made them sing of it in the night: when the Jewish night threw no confusion of darkness into the day of the Christians, separated as it was from themselves; and when that which could slay the flesh had no power to darken their faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252093.html'
source_title="Tractates on John 93"

[[commentary]]
quote='''
When the Lord Jesus had foretold His disciples the persecutions they would have to suffer after His departure, He went on to say: "And these things I said not unto you at the beginning, because I was with you; but now I go my way to Him that sent me." And here the first thing we have to look at is, whether He had not previously foretold them of the sufferings that were to come. And the three other evangelists make it sufficiently clear that He had uttered such predictions prior to the approach of the supper: which was over, according to John, when He spake, and added, "And these things I said not unto you at the beginning, because I was with you." Are we, then, to settle such a question in this way, that they, too, tell us that He was near His passion when He said these things? Then it was not when He was with them at the beginning that He so spake, for He was on the very eve of departing, and proceeding to the Father: and so also, even according to these evangelists, it is strictly true what is here said, "And these things I said not unto you at the beginning." But what are we to do with the credibility of the Gospel according to Matthew, who relates that such announcements were made to them by the Lord, not only when He was on the eve of sitting down with His disciples to the passover supper, but also at the beginning, when the twelve apostles are for the first time expressed by name, and sent forth on the work of God? What, then, is the meaning of what He says here, "And these things I said not unto you at the beginning, because I was with you;" but that what He says here of the Holy Spirit who was to come to them, and to bear witness, when they should have such ills to endure, this He said not unto them at the beginning, because He was with themselves?

The Comforter then, or Advocate (for both form the interpretation of the Greek word, paraclete), had become necessary on Christ's departure: and therefore He had not spoken of Him at the beginning, when He was with them, because His own presence was their comfort; but on the eve of His own departure it behoved Him to speak of His coming, by whom it would be brought about that with love shed abroad in their hearts they would preach the word of God with all boldness; and with Him inwardly bearing witness with them of Christ, they also should bear witness, and feel it to be no cause of stumbling when their Jewish enemies put them out of the synagogues, and slew them, with the thought that they were doing God service; because the charity beareth all things, which was to be shed abroad in their hearts by the gift of the Holy Spirit. In this, therefore, is the whole meaning to be found, that He was to make them His martyrs, that is, His witnesses through the Holy Spirit; so that by His effectual working within them, they would endure the hardships of all kinds of persecution, and, set aglow at that divine fire, lose none of their warmth in the love of preaching. "These things," therefore, He says, "have I told you, that, when their time shall come, ye may remember that I told you of them" (ver. 4). These things, I say, I have told you, not merely because ye shall have to endure such things, but because, when the Comforter is come, He shall bear witness of me, that ye may not keep them back through fear, and by whom ye yourselves shall also be enabled to bear witness. "And these things I said not unto you at the beginning, because I was with you," and I myself was your comfort through my bodily presence exhibited to your human senses, and which, as infants, ye were able to comprehend.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252094.html'
source_title="Tractates on John 94"
