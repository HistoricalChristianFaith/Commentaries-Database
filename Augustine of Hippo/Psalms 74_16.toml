[[commentary]]
quote='''
“Thine own is the day and Thine own is the night” (ver. 16). Who is ignorant of this, seeing that He hath Himself made all these things; for by the Word were made all things? To that very One Himself who hath wrought Salvation in the midst of the earth, to Him is said, “Thine own is the night.” Something here we ought to perceive which belongeth to that very Salvation which He hath wrought in the midst of the earth. “Thine own is the day.” Who are these? The spiritual. “And Thine own is the night.” Who are these? The carnal.…“Thou hast made perfect sun and moon:” the sun, spiritual men, the moon, carnal men. As yet carnal he is, may he not be forsaken, and may he too be made perfect. The sun, as it were a wise man: the moon, as it were an unwise man: Thou hast not however forsaken. For thus it is written, “A wise man endureth as the sun, but a foolish man as the moon is changed.” What then? Because the sun endureth, that is, because the wise man endureth as the sun, a foolish man is changed like the moon, is one as yet carnal, as yet unwise, to be forsaken? And where is that which hath been said by the Apostle, “To the wise and unwise a debtor I am”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252074.html'
source_title="Exposition on Psalm 74"
