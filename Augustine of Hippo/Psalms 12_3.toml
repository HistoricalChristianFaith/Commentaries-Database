[[commentary]]
quote='''
“May the Lord destroy all deceitful lips” (ver. 3). He says “all,” that no one may suppose himself excepted: as the Apostle says, “Upon every soul of man that doeth evil, of the Jew first, and of the Greek.” “The tongue speaking great things:” the proud tongue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252012.html'
source_title="Exposition on Psalm 12"
