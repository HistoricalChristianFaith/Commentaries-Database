[[commentary]]
quote='''
“The righteous Lord shall hew the necks of the sinners” (ver. 4).…Which of us doth not fix his eyes upon the earth, like the Publican, and say, “Lord, be merciful unto me a sinner”? If therefore all are sinners, and none is found without sin; all must fear the sword that hangs above their neck, because “the righteous Lord shall hew the necks of the sinners.” I do not imagine, my brethren, of all sinners; but in the member which He striketh, He marks what sinners He striketh. For it is not said, The righteous Lord will hew the hands of the sinners; or their feet; but because proud sinners were meant to be understood, and all proud men carry lofty necks, and not only do evil deeds, but even refuse to acknowledge them to be such, and when they are rebuked, justify themselves:…as it is written in Job (he was speaking of an ungodly sinner), “he runneth against God, even upon his neck, upon the thick bosses of his bucklers;” so he here nameth the neck, because it is thus thou exaltest thyself, and dost not fix thine eyes upon the ground, and beat thy breast. Thou shouldest cry unto Him, as it is cried in another Psalm, “I said, Lord, be merciful unto me, for I have sinned against Thee.” Since thou dost not choose to say this, but justifiest thy deeds against the Word of God; what followeth in Scripture cometh upon thee: the righteous Lord shall hew the necks of sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520129.html'
source_title="Exposition on Psalm 129"
