[[commentary]]
quote='''
There are waves on the sea, and thou art tossed in thy bark, because Christ sleepeth. Christ slept in the ship, while the men were perishing. If thy faith sleep in thy heart, Christ is as it were sleeping in thy ship: because Christ dwelleth in thee through faith, when thou beginnest to be tossed, awake Christ sleeping: rouse up thy faith, and thou shalt be assured that He deserts thee not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"
