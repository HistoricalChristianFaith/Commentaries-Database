[[commentary]]
quote='''
“For the Lord shall build up Sion” (ver. 16). This work is going on now. O ye living stones, run to the work of building, not to ruin. Sion is in building, beware of the ruined walls: the tower is building, the ark is in building; remember the deluge. This work is in progress now; but when Sion is built, what will happen? “And He will appear in His glory.” That He might build up Sion, that He might be a foundation in Sion, He was seen by Sion, but not in His glory: “we have seen Him, and He had no form nor comeliness.” But truly when He shall have come with His angels to judge, shall they not look then upon Him whom they have pierced? and they shall be put to confusion when too late, who refused confusion in early and healthful repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
