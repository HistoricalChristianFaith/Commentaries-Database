[[commentary]]
quote='''
“Sehon king of the Amorites” (ver. 19), an “useless shoot,” or “fiery temptation,” for so is Sehon interpreted: the king of “them who cause bitterness,” for such is the meaning of Amorites. “And Og, the king of Basan” (ver. 20). The “heaper-together,” such is the meaning of Og, and, king of “confusion,” which Basan signifies. For what else doth the devil heap together but confusion?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520136.html'
source_title="Exposition on Psalm 136"
