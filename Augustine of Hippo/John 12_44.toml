[[commentary]]
quote='''
What is this we have just heard, brothers and sisters: the Lord saying, "Whoever believes in me does not believe in me, but in the one who sent me"? It is good for us to believe in Christ, especially since he himself also said quite plainly what you heard just now, that is, that he had come as light into the world, and that whoever believes in him will not walk in darkness but will have the light of life.So it is good to believe in Christ. It is a great good to believe in Christ and a great evil not to believe in Christ. But because Christ the Son is whatever he is from the Father, while the Father is not from the Son but is the Father of the Son, that is why the Son does indeed call for faith in himself but refers the honor of it to his only-begetter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520140.html'
source_title="SERMON 140.1"

[[commentary]]
quote='''
Whilst our Lord Jesus Christ was speaking among the Jews, and giving so many miraculous signs, some believed who were foreordained to eternal life, and whom He also called His sheep; but some did not believe, and could not believe, because that, by the mysterious yet not unrighteous judgment of God, they had been blinded and hardened, because forsaken of Him who resisteth the proud, but giveth grace unto the humble. But of those who believed, there were some whose confession went so far, that they took branches of palm trees, and met Him as He approached, turning in their joy that very confession into a service of praise: while there were others, belonging to the chief rulers, who had not the boldness to confess their faith, lest they should be put out of the synagogue; and whom the evangelist has branded with the words, that "they loved the praise of men more than the praise of God "(ver. 43). Of those also who did not believe, there were some who would afterwards believe, and whom He foresaw, when He said," When ye have lifted up the Son of man, then shall ye acknowledge that I am He:" but there were some who would remain in the same unbelief, and be imitated by the Jewish nation of the present day, which, being shortly afterwards crushed in war, according to the prophetic testimony which was written concerning Christ, has since been scattered almost through the whole world.

While matters were in this state, and His own passion was now at hand, "Jesus cried, and said," as our lesson to-day commences, "He that believeth on me, believeth not on me, but on Him that sent me; and he that seeth me, seeth Him that sent me." He had already said in a certain place, "My doctrine is not mine, but His that sent me." Where we understood that He called His doctrine just what He is Himself, the Word of the Father; and in saying, "My doctrine is not mine, but His that sent me," implied this, that He was not of Himself, but had His being from another. For He was God of God, the Son of the Father: but the Father is not God of God, but God, the Father of the Son. And now when He says, "He that believeth on me, believeth not on me, but on Him that sent me," how else are we to understand it, but that He appeared as man to men, while He remained invisible as God? And that none might think that He was no more than what they saw of Him, He indicated His wish to be believed on, as equal in character and rank with the Father, when He said, "He that believeth on me, believeth not on me," that is, merely on what he seeth of me, "but on Him that sent me," that is, on the Father. But he that believeth on the Father, must believe that He is the Father; and he that believeth on Him as the Father, must believe that He has a Son; and in this way, he that believeth on the Father, must believe on the Son. But let no one believe about the only-begotten Son just what they believe about those who are called the sons of God by grace and not by nature, as the evangelist says, "He gave them power to become the sons of God," and according to what the Lord Himself also mentioned, as declared in the law, "I said, Ye are gods; and all of you children of the Most High: " because He said, "He that believeth on me, believeth not on me," to show that the whole extent of our faith in Christ should not be limited by His manhood. He therefore, He saith, believeth on me, who doth not believe on me merely according to what he seeth of me, but on Him that sent me: so that, believing thus on the Father, he may believe that He has a Son co-equal with Himself, and then attain to a true faith in me. For if one should think that He has sons only according to grace, who are certainly no more than His creatures, and not the Word, but those made by the Word, and that He has no Son co-equal and co-eternal with Himself, ever born, alike incommutable, in nothing dissimilar and inferior, then he believes not on the Father who sent Him, for the Father who sent Him is no such conception as this.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252054.html'
source_title="Tractates on John 54"
