[[commentary]]
quote='''
“I said in my ecstasy” (ver. 22). Whence that people again speaking saith, I said in my fear, when the heathen were raging horribly against me. “I have been cast forth from the sight of Thine eyes.” For if Thou hadst regard to me, Thou wouldest not suffer me to endure these things. “Therefore Thou heardest, O Lord, the voice of my prayer, when I cried unto Thee.” Therefore putting a limit to correction, and showing that I have part in Thy care, Thou heardest, O Lord, the voice of my prayer, when I raised it high out of tribulation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"

[[commentary]]
quote='''
Did not Peter draw near, when he said, “Thou art the Christ, the Son of the Living God”? And yet the same man became afar off by saying, “Be it far from Thee, Lord; this shall not be unto Thee.” Lastly, what said He, his Neighbour, as it were, to him drawing near? “Blessed art thou, Simon, Barjona.” To him afar off, as it were, and unlike, what said He? “Get thee behind Me, Satan.” To him drawing near, “Flesh and blood,” saith He, “hath not revealed it unto thee, but My Father, which is in Heaven.” His Light is shed over thee, in His Light thou shinest. But when having become afar off, he spake against the Lord’s Passion, which should be for our Salvation, “Thou savourest not,” said He, “the things that be of God, but those that be of men.” One rightly placing together both of these saith in a certain Psalm, “I said in my ecstasy, I am cast off from before Thine Eyes.” In my ecstasy, would he not have said, had he not drawn near; for ecstasy is the transporting of the mind. He poured over himself his own soul, and drew near unto God; and through some cloud and weight of the flesh being again cast down to earth, and recollecting where he had been, and seeing where he was, he said, “I am cast off from before Thine Eyes.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"

[[commentary]]
quote='''
Therefore another Psalm hath said, “I said in my trance, I am cast out of the sight of Thine eyes.” For his mind being taken up thither, he beheld something sublime; and was not yet entirely there, where what he beheld was; and a kind of flash, as it were, if one may so speak, of the Eternal Light having glanced upon him, when he perceived that he was not yet arrived at this, which he was able after a sort to understand, he saw where he himself was, and how he was cramped and “bowed down” by human infirmities. And he says, “I said in my trance, I am cast out of the sight of Thine eyes.” Such is that certain something which I saw in my trance, that thence I perceive how far off I am, who am not already there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"

[[commentary]]
quote='''
“Why hast Thou rejected me?” “Rejected” me, that is to say, from that height of the apprehension of the unchangeable Truth. “Why hast Thou rejected me?” Why, when already longing for those things, have I been cast down to these, by the weight and burden of my iniquity? This same voice in another passage said, “I said in my trance” (i.e., in my rapture, when he had seen some great thing or other), “I said in my trance, I am cast out of the sight of Thine eyes.” For he compared these things in which he found himself, to those toward which he had been raised; and saw himself cast out far “from the sight of God’s eyes,” as he speaks even here, “Why hast Thou rejected me? Why go I mourning, while mine enemy troubleth me, while he breaketh my bones?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252042.html'
source_title="Exposition on Psalm 42"
