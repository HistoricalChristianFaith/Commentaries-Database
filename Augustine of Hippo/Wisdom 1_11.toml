[[commentary]]
quote='''
"Do not fear those who kill the body, but do not have power to kill the soul." Whoever wants to kill you can so do in the body but not in the soul. Your soul will not die, unless you yourself want to kill it. Another's wickedness can kill your flesh, but the truth would preserve your soul in righteousness. If you abandon the truth, what other evil could your enemy do to you that would be greater than what you have done to yourself? Your enemy, if he wanted to harm you, could at most kill your flesh. You, however, by giving false testimony, kill the soul. Listen to Scripture: "A lying mouth destroys the soul."
'''
source_url=''
source_title="EXPOSITIONS OF THE PSALMS 79:13"

[[commentary]]
quote='''
For in those that are perfect, not even these lies are found. For to these it is said, “Let there be in your mouth, yea, yea; nay, nay; whatsoever is more, is of evil.” Nor is it without reason written in another place, “The mouth that lieth slayeth the soul:” lest any should imagine that the perfect and spiritual man ought to lie for this temporal life, in the death of which no soul is slain, neither his own, nor another’s. But since it is one thing to lie, another to conceal the truth (if indeed it be one thing to say what is false, another not to say what is true), if haply one does not wish to give a man up even to this visible death, he should be prepared to conceal what is true, not to say what is false; so that he may neither give him up, nor yet lie, lest he slay his own soul for another’s body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25205.html'
source_title="Exposition on Psalm 5"
