[[commentary]]
quote='''
“The exultations of God are in their mouths” (ver. 6). In such wise shall they “rejoice in their closets,” as not to attribute to themselves that they are good, but praise Him from whom they have what they are, by whom they are called to attain to what they are not, and from whom they hope for perfection, to whom they give thanks, because He hath begun.

“And swords sharpened on both sides in their hands.” This sort of weapon contains a great mystical meaning, in that it is sharp on both sides. By “swords sharpened on both sides,” we understand the Word of the Lord: it is one sword, but therefore are they called many, because there are many mouths and many tongues of the saints. How is it two edged? It speaks of things temporal, it speaks also of things eternal. In both cases it proveth what it saith, and him whom it strikes, it severeth from the world. Is not this the sword whereof the Lord said, “I am not come to send peace upon earth, but a sword”? Observe how He came to divide, how He came to sever. He divideth the saints, He divideth the ungodly, He severeth from thee that which hindereth thee. The son willeth to serve God, the father willeth not: the sword cometh, the Word of God cometh, and severeth the son from the father.…Wherefore then is it in their hands, not in their tongues? “And swords,” it saith, “sharpened on both sides in their hands.” By “in their hands,” he meaneth in power. They received then the word of God in power, to speak where they would, to whom they would, neither to fear power, nor to despise poverty. For they had in their hands a sword; where they would they brandished it, handled it, smote with it: and all this was in the power of the preachers. For if the Word be not in their hands, why is it written, “The Word of the Lord was put in the hand of the Prophet Haggai”? Surely, brethren, God set not His Word in His fingers. What is meant by, “was put in his hand”? It was put into his power to preach the Word of the Lord. Lastly, we can understand these “hands” in another way also. For they who spake had the word of God in their tongues, they who wrote, in their hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520149.html'
source_title="Exposition on Psalm 149"
