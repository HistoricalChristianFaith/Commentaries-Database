[[commentary]]
quote='''
“For so God, willing to show wrath, and to manifest His power, hath brought in, in much patience, the vessels of wrath, which have been perfected unto perdition.” And wherefore this? “In order that He might make known His riches upon the vessels of mercy.” If therefore vessels of wrath He hath brought in, wherein He might make known His riches upon the vessels of mercy, most rightly hath been said, “His mercy shall come before me: My God hath showed to me among mine enemies:” that is however great mercy He hath had concerning me, to me He hath showed it among these men concerning whom He hath not had mercy. For unless the debtor be in suspense, he is less grateful to him by whom the debt hath been forgiven. “My God hath showed to me among mine enemies.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"

[[commentary]]
quote='''
With Him is power, with Him mercy. This man He humbleth, and that man He exalteth: this man He humbleth with power, that man He exalteth in mercy. “For if God, willing to show wrath and to prove His power, hath in much patience borne with the vessels of wrath, which have been perfected unto perdition”—thou hast heard of power: inquire for mercy—“and that He might make known,” He saith, “His riches unto the vessels of mercy.” It belongeth therefore to His power to condemn unjust men. And to Him who would say, What hast thou done? “For thou, O man, who art thou that should make answer to God?” Fear therefore and tremble at His power: but hope for His mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"
