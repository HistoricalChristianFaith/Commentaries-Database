[[commentary]]
quote='''
Now in Matthew we read that He entered into the parts of Magdala. But we cannot doubt that it is the same place under another name; for several manuscripts even of St. Mark have only Magdala.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"
