[[commentary]]
quote='''
“Preserve me, O Lord, from the hand of the sinner, from unrighteous men deliver me” (ver. 4). Here they wear their real colours, they are known; here we have no need to understand, but to act: we have need to pray, not to ask who they are. But how thou shouldest pray against such men, he explaineth in what followeth. For many pray unskilfully against wicked men. “Who have imagined,” saith he, “to trip up my steps.” Thus far it may be understood carnally. Every one has enemies, who seek to cheat him in trade, to rob him of money, where they are engaged together in business; every one has some neighbour his enemy, who deviseth how to bring mischief upon his family, to injure in some way his property and surely he deviseth this by deceit, by fraud, by devilish devices he endeavoureth to accomplish this: no one can doubt it. Yet not for these reasons are they to be guarded against, but lest they lay in wait for thee and draw thee to themselves, that is, separate thee from the Body of Christ, and make thee of their body. For as Christ is the Head of the good, so is the devil their head. What is, “to trip up my steps”? Not as though thou shouldest be deceived in the business thou hast with him, or he cheat thee in a case which thou hast with him in the law courts. He hath “tripped up thy steps,” if he have hindered thee in the way of God; so that what thou didst direct aright may stumble, or fall from the way, or fall in the way, or draw back from the way, or stop on the way, or go back to the place from whence it had come. Whatsoever hath done this to thee, hath tripped thee up, hath deceived thee. Against such snares as these pray thou, lest thou lose thy heavenly inheritance, lest thou lose Christ thy Joint-heir, for thou art destined to live for ever with Him, who hath made thee an heir. For thou art made an heir, not by one whom thou art to succeed after his death, but One together with whom thou art to live for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520140.html'
source_title="Exposition on Psalm 140"
