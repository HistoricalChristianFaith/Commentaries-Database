[[commentary]]
quote='''
“I will say unto God, Thou art my lifter up. Why hast Thou forgotten me?” (ver. 9). For I am suffering here, even as if Thou hadst forgotten me. But Thou art trying me, and I know that Thou dost but put off, not take utterly from me, what Thou hast promised me. But yet, “Why hast Thou forgotten me?” So cried our Head also, as if speaking in our name. “My God, my God, why hast Thou forsaken me?” I will say unto God, “Thou art my lifter up; why hast Thou forgotten me?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252042.html'
source_title="Exposition on Psalm 42"
