[[commentary]]
quote='''
What did he tell them from the Scriptures? He said, "Repentance and forgiveness of sins should be preached in his name to all nations, beginning from Jerusalem." The disciples could not see this. They could see Christ talking about the church that would be. When Christ said something they could not see, they believed him. They could see the head, but they could not yet see the body. We can see the body, but we believe about the head. They are two: husband and wife, head and body, Christ and the church. He showed himself to the disciples and promised them the church. He showed us the church and ordered us to believe about himself. The apostles saw one thing, but they did not see the other. We also see one thing and do not see the other. Having the head there with them, they believed about the body. Having the body here with us, we should believe about the head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520229I.html'
source_title="SERMON 229I.1"

[[commentary]]
quote='''
Evidently the Psalm doth agree with the Gospel, which saith, “Throughout all nations, beginning at Jerusalem.” Hear, “Throughout all nations:” He hath called the world from the rising of the sun unto the going down.” Hear, “Beginning at Jerusalem:” “Out of Sion is the semblance of His beauty.” Therefore, “He hath called the world from the rising of the sun unto the going down,” agreeth with the words of the Lord, who saith, “It behoved Christ to suffer, and to rise from the dead the third day; and that repentance and remission of sins should be preached in His Name throughout all nations.” For all nations are from the rising of the sun unto the going down. But that, “Out of Sion is the semblance of His beauty,” that thence beginneth the beauty of His Gospel, that thence He began to be preached, being “beautiful in form beyond the sons of men,” agreeth with the words of the Lord, who saith, “Beginning at Jerusalem.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"
