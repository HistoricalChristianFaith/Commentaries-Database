[[commentary]]
quote='''
(de Trin. iv. 13.) Why did He offer Himself to temptation? That He might be our mediator in vanquishing temptation not by aid only, but by example.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But now there was read in the Gospel, how the Lord Jesus Christ in the wilderness was being tempted of the devil. Christ entirely was tempted of the devil. For in Christ thou wast being tempted, because Christ of thee had for Himself flesh, of Himself for thee salvation; of thee for Himself death, of Himself for thee life; of thee for Himself revilings, of Himself for thee honours; therefore of thee for Himself temptation, of Himself for thee victory. If in Him tempted we have been, in Him we overcome the devil.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252061.html'
source_title="Exposition on Psalm 61"
