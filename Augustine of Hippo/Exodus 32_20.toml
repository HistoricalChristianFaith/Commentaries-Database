[[commentary]]
quote='''
“Let them not say, We have swallowed him up.” Do thou swallow up the body of Pagans. Why the body of Pagans? It would swallow thee up. Do thou to it, what it would to thee. Therefore perhaps that calf, being ground to powder, was cast into the water and given to the children of Israel to drink, that so the body of ungodliness might be swallowed up by Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"

[[commentary]]
quote='''
“I have run in thirst.” For they were rendering evil things for good things: for them was I thirsting: mine honour they thought to drive back: I was thirsting to bring them over into my body. For in drinking what do we, but send into our members liquor that is without, and suck it into our body? Thus did Moses in that head of the calf. The head of the calf is a great sacrament. For the head of the calf was the body of ungodly men, in the similitude of a calf eating hay, seeking earthly things: because all flesh is hay.…And what now is more evident, than that into that City Jerusalem, of which the people Israel was a type, by Baptism men were to be made to pass over? Therefore in water it was scattered, in order that for drink it might be given.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"

[[commentary]]
quote='''
Thence was also that calf which the people worshipped, unbelieving, apostate, seeking the gods of the Egyptians, forsaking Him who had delivered them from the slavery of the Egyptians: whence there was enacted that great Sacrament. For when Moses was thus wroth with them worshipping and adoring the idol, and, inflamed with zeal for God, was punishing temporally, in order that he might terrify them to shun death everlasting; yet the head itself of the calf he cast into the fire, and ground to powder, destroyed, strawed on the water, and gave to the people to drink: so there was enacted a great Sacrament. O anger prophetic, and mind not perturbed but enlightened! He did what? Cast it into the fire, in order that first the form itself may be obliterated; piece by piece grind it down, in order that little by little it may be consumed: cast it into the water, give to the people to drink! What is this but that the worshippers of the devil were become the body of the same? In the same manner as men confessing Christ become the Body of Christ; so that to them is said, “but ye are the Body of Christ and the members.” The body of the devil was to be consumed, and that too by Israelites was to be consumed. For out of that people were the Apostles, out of that people the first Church.…Thus the devil is being consumed with the loss of his members.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252074.html'
source_title="Exposition on Psalm 74"

[[commentary]]
quote='''
They are cut in pieces from their conspiracy, and in that they believe they are cut in pieces; for they believe by degrees; as when the calf’s head was ground small, they will come to be the drink of God’s people. For Moses ground down the calf’s head, and sprinkled it upon the water, and made the children of Israel drink it. All the unbelieving are ground: they believe by degrees; and they are drunk by the people of God, and pass into Christ’s body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
