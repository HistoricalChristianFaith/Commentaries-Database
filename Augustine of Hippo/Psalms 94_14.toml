[[commentary]]
quote='''
…Do thou rejoice beneath the scourge: because the heritage is kept for thee, “for the Lord will not cast off His people” (ver. 14). He chasteneth for a season, He condemneth not for ever: the others He spareth for a season, and will condemn them for evermore. Make thy choice: dost thou wish temporary suffering, or eternal punishment? temporal happiness, or eternal life? What doth God threaten? Eternal punishment. What doth He promise? Eternal rest. His scourging the good, is temporary: His sparing the wicked, is also temporary. “Neither will He forsake His inheritance.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252094.html'
source_title="Exposition on Psalm 94"


[[commentary]]
quote='''
“For the Lord will not cast off His people.” Praise be unto Him, and shouts of joy be unto Him! What people shall He not cast off? we have no right to make our own explanation here: for the Apostle hath prescribed this unto us, he hath explained whereof it is said. For this was the Jewish people, the people where were the prophets, the people where were the patriarchs, the people begotten according to the flesh from the seed of Abraham; the people in which all the mysteries which promised our Saviour preceded us; the people among whom was instituted the temple, the anointing, the Priest for a figure, that when all these shadows were past, the Light itself might come; this therefore was the people of God; to it were the prophets sent, in it those who were sent were born; to it were delivered and entrusted the revelations of God. What then? is the whole of that people condemned? far be it. It is called the good olive-tree by the Apostle, for it commenced with the patriarchs.…This then is the tree itself: though some of its boughs have been broken, yet all have not. For if all the boughs were broken, whence is Peter? whence John? whence Thomas? whence Matthew? whence Andrew? whence are all those Apostles? whence that very Apostle Paul who was speaking to us but now, and by his own fruit bearing witness to the good olive? Were not all these of that people? Whence also those five hundred brethren to whom our Lord appeared after His resurrection? Whence were so many thousands at the words of Peter (when the Apostles, filled with the Holy Spirit, spoke with the tongues of all nations) converted with such zeal for the honour of God and their own accusation, that they who first shed the Lord’s blood in their rage, learnt how to drink it now that they believed? And all these five thousand were so converted that they sold their own property, and laid the price of it at the Apostles’ feet. That which one rich man did not do, when he heard from the Lord’s mouth, and sorrowfully departed from Him, this so many thousands of those men by whose hands Christ had been crucified, did on a sudden. In proportion as the wound was deeper in their own hearts, with the greater eagerness did they seek for a physician. Since therefore all these were from thence, the Psalm saith of them, “For the Lord will not cast off His people.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252095.html'
source_title="Exposition on Psalm 95"
