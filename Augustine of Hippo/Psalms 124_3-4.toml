[[commentary]]
quote='''
…“When their fury was enraged upon us.” They are now in anger, they now openly rage: “perchance the water had drowned us” (ver. 4). By water he meaneth ungodly nations: and we shall see what sort of water in the following verses. Whoever had consented unto them, water would have overwhelmed him. For he would die by the death of the Egyptians, he would not pass through after the example of the Israelites. For ye know, brethren, that the people of Israel passed through the water, by which the Egyptians were overwhelmed. But what sort of water is this? It is a torrent, it flows with violence, but it will pass by…Hence He, our Head, first drinketh, of whom it is said in the Psalms, “He shall drink of the torrent in the way: therefore shall He lift up His head.” For our Head is already exalted, because He drank of the torrent by the way; for our Lord hath suffered. If therefore our Head hath been already raised up, why doth the body fear the torrent?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520124.html'
source_title="Exposition on Psalm 124"
