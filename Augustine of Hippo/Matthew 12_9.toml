[[commentary]]
quote='''
(De Cons. Ev. ii. 35.) It might have been supposed that the matter of the ears of corn, and this cure following, had been done on the same day, for it is mentioned to have been the sabbath day in both cases, had not Luke shown us that they were on different days. So that what Matthew says, And when he had passed thence, he came into their syna-gogue, is to be taken as that He did not enter into the synagogue till He had passed thence; but whether several days intervened or He went thither straight is not expressed in this Gospel, so that place is given to the relation of Luke, who tells of the healing of this kind of palsy on another sabbath.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Matthew continues his account thus: "And when He was departed thence, He went into their synagogue: and, behold, there was a man which had his hand withered;" and so on, down to the words, "And it was restored whole, like as the other." The restoring of this man who had the withered hand is also not passed over in silence by Mark and Luke. Now, the circumstance that this day is also designated a Sabbath might possibly lead us to suppose that both the plucking of the ears of corn and the healing of this man took place on the same day, were it not that Luke has made it plain that it was on a different Sabbath that the cure of the withered hand was wrought. Accordingly, when Matthew says, "And when He was departed thence, He came into their synagogue," the words do indeed import that the said coming did not take place until after He had departed from the previously mentioned locality; but, at the same time, they leave the question undecided as to the number of days which may have elapsed between His passing from the aforesaid corn-field and His coming into their synagogue; and they express nothing as to His going there in direct and immediate succession. And thus space is offered us for getting in the narrative of Luke, who tells us that it was on another Sabbath that this man's hand was restored.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 35"
