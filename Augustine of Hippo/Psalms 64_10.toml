[[commentary]]
quote='''
"The just person will take delight in the Lord and hope in him, and all the upright of heart shall be praised." We have certainly sung this with voice and heart. Christian consciences and tongues have spoken these words to God: The just one will take delight not in the world but in the Lord. "Light has dawned for the just," it says somewhere else, "and delight for the upright of heart." You may ask where delight is to be found. Here you have it: "The just one will take delight in the Lord." And somewhere else: "Delight in the Lord, and he will give you the aims of your heart." What are we being shown? What is being granted us? What are we being told? To take delight in the Lord. But can you take delight in what you do not see? Or perhaps we do see the Lord? We have that safely promised us; but now "we walk by faith, as long as we are in the body we are away from the Lord." By faith, not by sight. When will it be by sight? When another thing John says is fulfilled: "Beloved, we are children of God, and it has not yet appeared what we shall be. But we know that when he appears we shall be like him, because we shall see him as he is." Then there will be great and perfect delight, then joy will be full, when it is no longer hope suckling us with milk but the real thing providing us with solid food.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252021.html'
source_title="SERMON 21:1"

[[commentary]]
quote='''
“The just man shall rejoice in the Lord” (ver. 10). Now the just man is not sad. For sad were the disciples at the Lord’s being crucified; overcome with sadness, sorrowing they departed, they thought they had lost hope. He rose again, even when appearing to them He found them sad. He held the eyes of two men that walked in the way, so that by them he was not known, and He found them groaning and sighing, and He held them until He had expounded the Scriptures, and by the same Scriptures had shown that so it ought to have been done as it was done. For He showed in the Scriptures, how after the third day it behoved the Lord to rise again. And how on the third day would He have risen again, if from the Cross He had come down?…Therefore let us all rejoice in the Lord, let us all after the faith be One Just Man, and let us all in one Body hold One Head, and let us rejoice in the Lord, not in ourselves: because our Good is not ourselves to ourselves, but He that hath made us. Himself is our good to make us glad. And let no one rejoice in himself, no one rely on himself, no one despair of himself: let no one rely on any man, whom he ought to bring in to be the partner of his own hope, not the giver of the hope.

Now because the Lord hath risen again, now because He hath ascended into Heaven, now because He hath showed that there is another life, now because it is evident that His counsels, wherein He lay concealed in deep heart, were not empty, because to this end That Blood was shed to be the price of the redeemed; now because all things are evident, because all things have been preached, because all things have been believed, under the whole of heaven, “the just man shall rejoice in the Lord, and shall hope in Him; and all men shall be praised that are right in heart.”…God is displeasing to thee, and thou art pleasing to thyself, of perverted and crooked heart thou art: and this is the worse, that the heart of God thou wouldest correct by thy heart, to make Him do what thou wilt have whereas thou oughtest to do what He willeth. What then? Thou wouldest make crooked the heart of God which alway is right, according to the depravity of thy own heart? How much better to correct thy heart by the rectitude of God? Hath not thy Lord taught thee this, of Whose Passion but now were we speaking? Was He not bearing thy weakness, when He said, “Sad is My soul even unto death”? Was He not figuring thyself in Himself, when He was saying, “Father, if it be possible, let there pass from Me this cup”? For the hearts of the Father and of the Son were not two and different: but in the form of a servant He carried thy heart, that He might teach it by His example. Now behold trouble found out as it were another heart of thine, which willed that there should pass away that which was impending: but God would not. God consenteth not to thy heart, do thou consent to the heart of God.

What followeth? If “there shall be praised all men right in heart,” there shall be condemned the crooked in heart. Two things are set before thee now, choose while there is time.…If of crooked heart thou hast become, there will come that Judgment, there will appear all the reasons on account of which God doeth all these things: and thou that wouldest not in this life correct thy heart by the rectitude of God, and prepare thyself for the right hand, where “there shall be praised all men right in heart,” wilt be on the left, where at that time thou shalt hear, “Go ye into fire everlasting, that hath been prepared for the devil and his angels.” And will there be then time to correct the heart? Now therefore correct, brethren, now correct. Who doth hinder? Psalm is chanted, Gospel is read, Reader crieth, Preacher crieth; long-suffering is the Lord; thou sinnest, and He spareth; still thou sinnest, still He spareth, and still thou addest sin to sin. How long is God long-suffering? Thou wilt find God just also. We terrify because we fear; teach us not to fear, and we terrify no more. But better it is that God teach us to fear, than that any man teach us not to fear.…Thou bringest forth grain, barn expect thou; bringest forth thorns, fire expect thou. But not yet hath come either the time of the barn or the time of the fire: now let there be preparation, and there will not be fear. In the name of Christ both we who speak are living, and ye to whom we speak are living: for amending our plan, and changing evil life into a good life, is there no place, is there no time? Can it not, if thou wilt, be done to-day? Can it not, if thou wilt, be now done? What must thou buy in order to do it, what specifics must thou seek? To what Indies must thou sail? What ship prepare? Lo, while I am speaking, change the heart; and there is done what so often and so long while is cried out for, that it be done, and which bringeth forth everlasting punishment if it be not done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252064.html'
source_title="Exposition on Psalm 64"
