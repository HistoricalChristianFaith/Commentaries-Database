[[commentary]]
quote='''
“Look upon me, and have mercy upon me; for I am single and poor” (ver. 16). For I am a single people, keeping the lowliness of Thy single Church, which no schisms or heresies possess.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
