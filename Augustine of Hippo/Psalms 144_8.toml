
[[commentary]]
quote='''
“Whose mouth hath spoken vanity” (ver. 8). All of you to-day, if ye had not gathered yourselves together to these divine shows of the word of God, and were not at this hour engaged in them, how great vanities would ye be hearing! “whose mouth hath spoken vanity:” when, in short, would they, speaking vanity, hear you speaking vanity? “And their right hand is a right hand of iniquity.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520144.html'
source_title="Exposition on Psalm 144"
