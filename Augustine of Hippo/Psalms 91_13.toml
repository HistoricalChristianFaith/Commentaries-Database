[[commentary]]
quote='''
For the enemy does not cease to persecute; and when he does not openly rage, he plots in secret. How does he plot? "And for wrath, they worked deceitfully." Thence is he called a lion and a dragon. But what is said to Christ? "Thou shall tread on the lion and the dragon." Lion, for open rage; dragon, for hidden treachery. The dragon cast Adam out of Paradise; as a lion, the same persecuted the Church, as Peter says: "For your adversary, the devil, goeth about as a roaring lion, seeking whom he may devour." Let it not seem to you as if the devil had lost his ferocity. When he blandly flatters, then is he the more vigilantly to be guarded against.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252010.html'
source_title="Tractates on John 10"

[[commentary]]
quote='''
For he hath seen himself conquered by the fame and praises of Christ, he hath seen, whereas he slew Christ’s Martyrs, that they are crowned, he triumphed over. He hath begun to be unable to persuade men that Christ is nought; and because by reviling Christ, he now with difficulty deceives, by lauding Christ, he endeavours to deceive. Before this what said he? Whom worship ye? A Jew, dead, crucified, a man of no moment, who could not even from himself drive away death. When after His Name he saw running the whole human race, saw that in the Name of the Crucified temples are thrown down, idols are broken, sacrifices abolished; and that all these things predicted in the Prophets are considered by men, by men with wonder astonished, and closing now their hearts against the reviling of Christ; he clothes himself with praise of Christ, and begins to deter from the faith in another manner. Great is the law of Christ, powerful is that law, divine, ineffable! but who fulfilleth it? In the name of our Saviour, “tread upon the lion and the dragon.” By reviling openly roared the lion; by lauding craftily lurks the dragon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252041.html'
source_title="Exposition on Psalm 41"

[[commentary]]
quote='''
“Thou shalt go upon the asp and the basilisk; the lion and the dragon shalt thou tread under thy feet” (ver. 13). Ye know who the serpent is, and how the Church treadeth upon him, as she is not conquered, because she is on her guard against his cunning. And after what manner he is a lion and a dragon, I believe you know also, beloved. The lion openly rages, the dragon lies secretly in covert: the devil hath each of these forces and powers. When the Martyrs were being slain, it was the raging lion: when heretics are plotting, it is the dragon creeping beneath us. Thou hast conquered the lion; conquer also the dragon: the lion hath not crushed thee, let not the dragon deceive thee.…A few women in the Church have bodily virginity: but the virginity of the heart all the faithful have. In the very matter of faith he feared that the heart’s virginity would be corrupted by the devil: and those who have lost it, are uselessly virgins in their bodies. What does a woman who is corrupt in heart preserve in her body? Thus a Catholic married woman is before a virgin heretic. For the first is not indeed a virgin in her body, but the second has become married in her heart; and married not unto God as her husband, but unto the dragon. But what shall the Church do? The basilisk is the king of serpents, as the devil is the king of wicked spirits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"
