[[commentary]]
quote='''
For the enemy does not cease to persecute; and when he does not openly rage, he plots in secret. How does he plot? "And for wrath, they worked deceitfully." Thence is he called a lion and a dragon. But what is said to Christ? "Thou shall tread on the lion and the dragon." Lion, for open rage; dragon, for hidden treachery. The dragon cast Adam out of Paradise; as a lion, the same persecuted the Church, as Peter says: "For your adversary, the devil, goeth about as a roaring lion, seeking whom he may devour." Let it not seem to you as if the devil had lost his ferocity. When he blandly flatters, then is he the more vigilantly to be guarded against.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252010.html'
source_title="Tractates on John 10"
