[[commentary]]
quote='''
And hence the same Apostle, even when he was still Saul, heard: "Saul, Saul, why do you persecute me?" because the body is joined to the head; and when already the preacher of Christ suffered from others the things which he himself had done as a persecutor: "To make up," he said, "what is lacking in the afflictions of Christ in my flesh," showing that what he suffered pertained to the afflictions of Christ. This cannot be understood concerning the head, which now in heaven suffers nothing of the sort, but concerning the body, that is, the Church, which body with its head is one Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520341%2520augm.html'
source_title="Sermon 341"

[[commentary]]
quote='''
Of the same character is what this very apostle said in another place: "Now I rejoice in my sufferings for you, and fill up that which is lacking of the afflictions of Christ in my flesh." He said not, of my afflictions, but "of Christ's;" for he was a member of Christ, and in his persecutions, such as it behoved Christ to suffer in the whole of His body, he also was filling up his own share of His afflictions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520108.html'
source_title="Tractates on John 108"

[[commentary]]
quote='''
But we ought to perceive our person, the person of the Church, the person of the Body of Christ. For one Man with His Head and Body is Jesus Christ, the Saviour of the Body and the Members of the Body: two in one Flesh, and in one voice, and in one passion, and, when iniquity shall have passed over, in one rest. The sufferings therefore of Christ are not in Christ alone; nay, there are not any save in Christ. For if Christ thou understandest to be Head and Body, the sufferings of Christ are not, save in Christ: but if Christ thou understand of Head alone, the sufferings of Christ are not in Christ alone. For if the sufferings of Christ are in Christ alone, to wit in the Head alone; whence saith a certain member of Him, Paul the Apostle, “In order that I may supply what are wanting of the oppressions of Christ in my flesh”? If therefore in the members of Christ thou art, whatsoever man thou art that art hearing these words, whosoever thou art that dost hear these words (but however, thou dost hear, if in the members of Christ thou art): whatsoever thing thou sufferest from those that are not in the members of Christ, was wanting to the sufferings of Christ. Therefore it is added because it was wanting; thou fillest up the measure, thou causest it not to run over: thou sufferest so much as was to be contributed out of thy sufferings to the whole suffering of Christ, that hath suffered in our Head, and doth suffer in His members, that is, in our own selves. Unto this our common republic, as it were each of us according to our measure payeth that which we owe, and according to the powers which we have, as it were a quota of sufferings we contribute. The storehouse of all men’s sufferings will not be completely made up, save when the world shall have been ended.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"
