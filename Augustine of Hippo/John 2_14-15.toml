[[commentary]]
quote='''
However, to seek the mystery of the deed in the figure, who are they that sell oxen? Who are they that sell sheep and doves? They are they who seek their own in the Church, not the things which are Christ's. They account all a matter of sale, while they will not be redeemed: they have no wish to be bought, and yet they wish to sell. Yes; good indeed is it for them that they may be redeemed by the blood of Christ, that they may come to the peace of Christ. Now, what does it profit to acquire in this world any temporal and transitory thing whatsoever, be it money, or pleasure of the palate, or honor that consists in the praise of men? Are they not all wind and smoke? Do they not all pass by and flee away? Are they not all as a river rushing headlong into the sea? And woe to him who shall fall into it, for he shall be swept into the sea. Therefore ought we to curb all our affections from such desires. My brethren, they that seek such things are they that sell. For that Simon too, wished to buy the Holy Ghost, just because he meant to sell the Holy Ghost; and he thought the apostles to be just such traders as they whom the Lord cast out of the temple with a scourge. For such an one he was himself, and desired to buy what he might sell he was of those who sell doves. Now it was in a dove that the Holy Ghost appeared. Who, then, are they, brethren, that sell doves, but they who say, "We give the Holy Ghost "? But why do they say this, and at what price do they sell? At the price of honor to themselves. They receive as the price, temporal seats of honor, that they may be seen to be sellers of doves. Let them beware of the scourge of small cords. The dove is not for sale: it is given freely; for grace, or favor, it is called. Therefore, my brethren, just as you see them that sell, common chapmen, each cries up what he sells: how many stalls they have set up! Primianus has a stall at Carthage, Maximianus has another, Rogatus has another in Mauritania, they have another in Numidia, this party and that, which it is not in our power now to name. Accordingly,one goes round to buy the dove, and everyone at his own stall cries up what he sells.

Let the heart of such an one turn away from every seller; let him come where he receives freely. Aye, brethren, and they do not blush, that, by these bitter and malicious dissensions of theirs, they have made of themselves so many parties, while they assume to be what they are not, while they are lifted up, thinking themselves to be something when they are nothing. But what is fulfilled in them, since that they will not be corrected, but that which you have heard in the psalm: "They were rent asunder, and felt no remorse"?

Well, who sell oxen? They who have dispensed to us the Holy Scriptures are understood to mean the oxen. The apostles were oxen, the prophets were oxen. Whence the apostle says: "Thou shalt not muzzle the mouth of the ox that treadeth out the corn. Doth God take care for oxen? Or saith He it for our sakes? Yea, for our sakes He saith it: that he who ploweth should plow in hope; and he that thresheth, in hope of partaking." Those oxen, then, have left to us the narration of the Scriptures. For it was not of their own that they dispensed, because they sought the glory of the Lord. Now, what have ye heard in that psalm? "And let them say continually, The Lord be magnified, they that wish the peace of His servant." God's servant, God's people, God's Church. Let them who wish the peace of that Church magnify the Lord, not the servant: "and let them say continually, The Lord be magnified." Who, let say? "Them who wish the peace of His servant." The voice of that people, of that servant, is clearly that voice which you have heard in lamentations in the psalm, and were moved at hearing, because you are of that people. What was sung by one, re-echoed from the hearts of all. Happy they who recognized themselves in those voices as in a mirror. Who, then, are they that wish the peace of His servant, the peace of His people, the peace of the one whom He calls His "only one," and whom He wishes to be delivered from the lion: "Deliver mine only one from the power of the dog?" They who say always, "The Lord be magnified." Those oxen, then, magnified the Lord, not themselves. See this ox magnifying his Lord, because "the ox knoweth his owner;" observe that ox in fear lest men desert the ox's owner and rely on the ox: how he dreads them that are willing to put their confidence in him: "Was Paul crucified for you? or were ye baptized in the name of Paul? " Of what I gave, I was not the giver: freely ye have received; the dove came down from heaven. "I have planted," saith he, "Apollo, watered; but God gave the increase: neither he that planteth is anything, neither he that watereth; but God that giveth the increase." "And let them say always, The Lord be magnified, they that wish the peace of His servant."

These men, however, deceive the people by the very Scriptures, that they may receive honors and praises at their hand, and that men may not turn to the truth. But in that they deceive, by the very Scriptures, the people of whom they seek honors, they do in fact sell oxen: they sell sheep too; that is, the common people themselves. And to whom do they sell them, but to the devil? For if the Church be Christ's sole and only one, who is it that carries off whatever is cut away from it, but that lion that roars and goes about, "seeking whom he may devour?" Woe to them that are cut off from the Church! As for her, she will remain entire. "For the Lord knoweth them that are His." These, however, so far as they can, sell oxen and sheep, they sell doves too: let them guard against the scourge of their own sins. But when they suffer some such things for these their iniquities, let them acknowledge that the Lord has made a scourge of small cords, and is admonishing them to change themselves and be no longer traffickers: for if they will not change, they shall at the end hear it said, "Bind ye these men's hands and feet, and cast them forth into outer darkness."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252010.html'
source_title="Tractates on John 10"
