[[commentary]]
quote='''
Hear another testimony. You know how many believed, when they sold all they had and laid it at the apostles' feet, that it might be distributed to each according to his need; and what saith the Scripture of that gathering of the saints? "They had one soul and one heart in the Lord." If charity made one soul of so many souls, and one heart of so many hearts, how great must be the charity between the Father and the Son! Surely it must be greater than that between those men who had one heart. If, then, the heart of many brethren was one by charity, if the soul of many brethren was one by charity, wouldst thou say that God the Father and God the Son are two? If they are two Gods, there is not the highest charity between them. For if charity is here so great as to make thy soul and thy friend's soul one soul, how can it be then that the Father and the Son is not one God? Far be unfeigned faith from this thought. In short, how excellent that charity is, understand hence: the souls of many men are many, and if they love one another, it is one soul; still, in the case of men, they may be called many souls, because the union is not so strong. But there it is right for thee to say one God; two or three Gods it is not right for thee to say. From this, the supreme and surpassing excellency of charity is shown thee to be such, that a greater cannot be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252014.html'
source_title="Tractates on John 14"

[[commentary]]
quote='''
If there is God the greater, and God the less, then we worship two Gods, not one God. Why, saith he; dost not thou, too, affirm two Gods, equal the one to the other? This I do not assert: for I understand this equality as implying therein also undivided love; and if undivided love, then perfect unity. For if the love that God put in men doth make of many hearts of men one heart, and doth make many souls of men into one soul, as it is written of them that believed and mutually loved one another, in the Acts of the Apostles, "They had one soul and one heart toward God:" if, therefore, my soul and thy soul become one soul, when we think the same thing and love one another, how much more must God the Father and God the Son be one God in the fountain of love!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252018.html'
source_title="Tractates on John 18"

[[commentary]]
quote='''
Take an illustration from the Holy Scriptures, whereby you may in some measure comprehend what I am saying. After our Lord Jesus Christ rose again, and was pleased to ascend into heaven, at the end of ten days He sent from thence the Holy Spirit, by whom those who were present in that one chamber were filled, and began to speak in the languages of all nations. The Lord's murderers, terrified by the miracle, were pricked to the heart and sorrowed; sorrowing, were changed; and being changed, believed. There were added to the Lord's body, that is, to the number of believers, three thousand people. And so also by the working of another miracle there were added other five thousand. A considerable community was created, in which all, receiving the Holy Spirit, by whom spiritual love was kindled, were by their very love and fervor of spirit welded into one, and began in the very unity of fellowship to sell all that they had, and to lay the price at the apostles' feet, that distribution might be made to every one as each had need. And the Scripture says this of them, that "they were of one soul and one heart toward God." Give heed then, brethren, and from this acknowledge the mystery of the Trinity, how it is we say, There is both the Father, and the Son, and the Holy Spirit, and yet there is one God. See! there were so many thousands of these, and yet there was one heart; there were so many thousands, and one soul. But where? In God. How much more so God Himself? Do I err at all in word when I call two men two souls, or three men three souls, or many men many souls? Surely I speak correctly. Let them approach God, and one soul belongs to all. If by approaching God many souls by love become one soul, and many hearts one heart, what of the very fountain of love in the Father and Son? Is it not still more so here that the Trinity is one God? For thence, of that Holy Spirit, does love come to us, as the apostle says: "The love of God is shed abroad in our hearts by the Holy Ghost, which is given unto us." If then the love of God, shed abroad in our hearts by the Holy Ghost which is given unto us, makes many souls one soul, and many hearts one heart, how much rather are the Father and Son and Holy Spirit, one God, one light, and one beginning?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252039.html'
source_title="Tractates on John 39"
