[[commentary]]
quote='''
(Tract. cxxii) Well doth He say to Peter, Lovest thou Me (ἀγαπᾶς diligis), and Peter answer, Amo Te (φελῶ amo), and our Lord replies again, Feed My lambs. Whereby, it appears that amor and dilectio are the same thing: especially as our Lord the third time He speaks does not say, Diligis Me, but Amas Me. He saith unto him the third time, Simon, son of Jonas, lovest thou Me? A third time our Lord asks Peter whether he loves Him. Three confessions are made to answer to the three denials; that the tongue might show as much love as it had fear, and life gained draw out the voice as much as death threatened.

(Tract. cxxiii) They who feed Christ's sheep, as if they were their own, not Christ's, show plainly that they love themselves, not Christ; that they are moved by lust of glory, power, gain, not by the love of obeying, ministering, pleasing God. Let us love therefore, not ourselves, but Him, and in feeding His sheep, seek not our own, but the things which are His. For whoso loveth himself, not God, loveth not himself: man that cannot live of himself, must die by loving himself; and he cannot love himself, who loves himself to his own destruction. Whereas when He by Whom we live is loved, we love ourselves the more, because we do not love ourselves; because we do not love ourselves in order that we may love Him by Whom we live.

(Serm. Pass.) But unfaithful servants arose, who divided Christ's flock, and handed down the division to their successors: and you hear them say, Those sheep are mine, what seekest thou with my sheep, I will not let thee come to my sheep. If we call our sheep ours, as they call them theirs, Christ hath lost His sheep.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But first the Lord asks what He knew, and that not once, but a second and a third time, whether Peter loved Him; and just as often He has the same answer, that He is loved, while just as often He gives Peter the same charge to feed His sheep. To the threefold denial there is now appended a threefold confession, that his tongue may not yield a feebler service to love than to fear, and imminent death may not appear to have elicited more from the lips than present life. Let it be the office of love to feed the Lord's flock, if it was the signal of fear to deny the Shepherd. Those who have this purpose in feeding the flock of Christ, that they may have them as their own, and not as Christ's, are convicted of loving themselves, and not Christ, from the desire either of boasting, or wielding power, or acquiring gain, and not from the love of obeying, serving, and pleasing God. Against such, therefore, there stands as a wakeful sentinel this thrice inculcated utterance of Christ, of whom the apostle complains that they seek their own, not the things that are Jesus Christ's. For what else mean the words, "Lovest thou me? Feed my sheep," than if it were said, If thou lovest me, think not of feeding thyself, but feed my sheep as mine, and not as thine own; seek my glory in them, and not thine own; my dominion, and not thine; my gain, and not thine; lest thou be found in the fellowship of those who belong to the perilous times, lovers of their own selves, and all else that is joined on to this beginning of evils? For the apostle, after saying, "For men shall be lovers of their own selves," proceeded to add, "Lovers of money, boastful, proud, blasphemers, disobedient to parents, unthankful, wicked, irreligious, without affection, false accusers, incontinent, implacable, without kindness, traitors, heady, blinded; lovers of pleasures more than of God; having a form of godliness, but denying the power thereof." All these evils flow from that as their fountain which he stated first, "lovers of their own selves." With great propriety, therefore, is Peter addressed, "Lovest thou me?" and found replying, "I love Thee:" and the command applied to him, "Feed my lambs," and this a second and a third time We have it also demonstrated here that love and liking are one and the same thing; for the Lord also in the last question said not Diligis me? but, Amas me? Let us, then, love not ourselves, but Him; and in feeding His sheep, let us be seeking the things which are His, not the things which are our own. For in some inexplicable way, I know not what, every one that loveth himself, and not God, loveth not himself; and whoever loveth God, and not himself, he it is that loveth himself. For he that cannot live by himself will certainly die by loving himself; he therefore loveth not himself who loves himself to his own loss of life. But when He is loved by whom life is preserved, a man by not loving himself only loveth the more, when it is for this reason that he loveth not himself [namely] that he may love Him by whom he lives. Let not those, then, who feed Christ's sheep be "lovers of their own selves," lest they feed them as if they were their own, and not His, and wish to make their own gain of them, as "lovers of money;" or to domineer over them, as "boastful;" or to glory in the honors which they receive at their hands, as "proud;" or to go the length even of originating heresies, as "blasphemers;" and not to give place to the holy fathers, as those who are "disobedient to parents;" and to render evil for good to those who wish to correct them, because unwilling to let them perish, as "unthankful;" to slay their own souls and those of others, as "wicked;" to outrage the motherly bowels of the Church, as "irreligious;" to have no sympathy with the weak, as those who are "without affection;" to attempt to traduce the character of the saints, as "false accusers;" to give loose reins to the basest lusts, as "incontinent;" to make lawsuits their practice, as "implacable;" to know nothing of loving service, as those who are "without kindness;" to make known to the enemies of the godly what they are well aware ought to be kept secret, as "traitors;" to disturb human modesty by shameless discussions, as "heady;" to understand neither what they say nor whereof they affirm, as "blinded;" and to prefer carnal delights to spiritual joys, as those who are "lovers of pleasures more than lovers of God." For these and such like vices, whether all of them meet in a single individual, or whether some dominate in one and others in another, spring up in some form or another from this one root, when men are "lovers of their own selves." A vice which is specially to be guarded against by those who feed Christ's sheep, lest they be seeking their own, not the things that are Jesus Christ's, and be turning those to the use of their own lusts for whom the blood of Christ was shed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520123.html'
source_title="Tractates on John 123"
