[[commentary]]
quote='''
(de Con. Ev. lib. ii. c. 30.) With respect to the name of Judas the brother of James, Luke seems to differ from Matthew, who calls him Thaddaeus. But what prevented a man from being called by two or three names? Judas the traitor is chosen, not unwittingly but knowingly, for Christ had indeed taken to Himself the weakness of man, and therefore refused not even this share of human infirmity. He was willing to be betrayed by His own Apostle, that thou when betrayed by thy friend mayest bear calmly thy mistaken judgment, thy kindness thrown away.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Moreover, with regard to the names of the disciples, Luke, who gives their names in another place,—that is to say, in the earlier passage, where they are [represented as being] chosen on the mountain,—is not at variance in any respect with Matthew, with the exception of the single instance of the name of Judas the brother of James, whom Matthew designates Thaddæus, although some codices also read Lebbæus. But who would ever think of denying that one man may be known under two or three names?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 30"
