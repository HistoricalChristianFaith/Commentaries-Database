[[commentary]]
quote='''
When our Lord Jesus Christ to that rich man that was grieved, and that was departing from Him, had said, “Go, sell all that thou hast, and give to the poor, and thou shalt have treasure in heaven, and come follow Me:” and great hopelessness for rich men foretold, so that He said, more easily could a camel pass through the eye of a needle, than a rich man enter into the kingdom of Heaven, were not forthwith the disciples grieved, saying with themselves, “Who shall be able to be saved?” Therefore when they were saying, “Who shall be able to be saved?” did they think of the few rich men, did there escape them so great a multitude of poor men? Could they not say to themselves, If it is hard, aye an impossible thing, that rich men should enter into the kingdom of heaven, as it is impossible that a camel should enter through the eye of a needle, let all poor men enter into the kingdom of heaven, be the rich alone shut out? For how few are the rich men? But of poor men are thousands innumerable. For not the coats are we to look upon in the kingdom of heaven; but for every one’s garment shall be reckoned the effulgence of righteousness: there shall be therefore poor men equal to Angels of God, clothed with the stoles of immortality, they shall shine as the sun in the kingdom of their Father: what reason is there for us about a few rich men to be concerned, or distressed? This thought not the Apostles; but when the Lord had spoken this, “It is easier for a camel to go through the eye of a needle, than for a rich man to enter into the kingdom of heaven:” they saying to themselves, “Who shall be able to be saved,” meant what? Not means, but desires; for they saw even poor men themselves, even if not having money, yet to have covetousness. And that ye may know, that not money in a rich man, but covetousness is condemned, attend to what I say; Thou observest that rich man standing near thee, and perchance in him is money, and is not covetousness; in thee is not money, and is covetousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252052.html'
source_title="Exposition on Psalm 52"
