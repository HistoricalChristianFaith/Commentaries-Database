[[commentary]]
quote='''
But it was in that society that the blessed John had received an hundredfold, where no one called anything his own, but they had all things in common; even as it is recorded in the Acts of the Apostles. For the apostles were as if having nothing, and yet possessing all things How was it, then, that the disciple and servant received unto his own the mother of his Lord and Master, where no one called anything his own? Or, seeing we read a little further on in the same book, "For as many as were possessors of lands or houses sold them, and brought the prices of them, and laid them down at the apostles' feet: and distribution was made unto every man according as he had need," are we not to understand that such distribution was made to this disciple of what was needful, that there was also added to it the portion of the blessed Mary, as if she were his mother; and ought we not the rather so to take the words, "From that hour the disciple took her unto his own," that everything necessary for her was entrusted to his care? He received her, therefore, not unto his own lands, for he had none of his own; but to his own dutiful services, the discharge of which, by a special dispensation, was entrusted to himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520119.html'
source_title="Tractates on John 119"

[[commentary]]
quote='''
How many thousands believed, my brethren, when they laid down the price of their possessions at the Apostles’ feet! But what saith Scripture of them? Surely they are become a temple of God; not only each respectively a temple of God, but also all a temple of God together. They have therefore become a place for the Lord. And that ye may know that one place is made for the Lord in all, Scripture saith, They were of one heart and one soul toward God. But many, so as not to make a place for the Lord, seek their own things, love their own things, delight in their own power, are greedy for their private interests. Whereas he who wisheth to make a place for the Lord, should rejoice not in his private, but the common good.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520132.html'
source_title="Exposition on Psalm 132"
