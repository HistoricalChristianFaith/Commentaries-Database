[[commentary]]
quote='''
“My path,” he saith; what, but a bad path, the path he had walked to leave his father?…What is, “my path”? that by which I have gone. What is, “my limit”? that whereunto I have reached. “Thou hast tracked out my path and my limit.” That limit of mine, far distant as it was, was not far from Thine eyes. Far had I gone, and yet Thou wast there. “And all my ways Thou hast seen beforehand.” He said not, “hast seen,” but, “hast seen beforehand.” Before I went by them, before I walked in them, Thou didst see them beforehand; and Thou didst permit me in toil to go my own ways, that, if I desired not to toil, I might return into Thy ways.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520139.html'
source_title="Exposition on Psalm 139"
