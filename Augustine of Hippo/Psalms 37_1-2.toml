[[commentary]]
quote='''
With terror do they hear of the coming of the last day, who will not be secure by living well: and who fain would live ill, long. But it was for useful purposes that God willed that day to remain unknown; that the heart may be ever ready to expect that of which it knows it is to come, but knows not when it is to come. Seeing, however, that our Lord Jesus Christ was sent to us to be our “Master,” He said, that “of the day not even the Son of Man knew,” because it was not part of His office as our Master that through Him it should become known to us. For indeed the Father knoweth nothing that the Son knoweth not; since that is the Very Knowledge of the Father Itself, which is His Wisdom; now His Son, His Word, is “His Wisdom.” But because it was not for our good to know that, which however was known to Him who came indeed to teach us, though not to teach us that which it was not good for us to know, He not only, as a Master, taught us something, but also, as a Master, left something untaught. For, as a Master, He knew how both to teach us what was good for us, and not to teach us what was injurious. Now thus, according to a certain form of speech, the Son is said not to know what He does not teach: that is, in the same way that we are daily in the habit of speaking, He is said not to know what He causes us not to know.…

This it is that disturbs you who are a Christian; that you see men of bad lives prospering, and surrounded with abundance of things like these; you see them sound in health, distinguished with proud honours; you see their family unvisited by misfortune; the happiness of their relatives, the obsequious attendance of their dependants, their most commanding influence, their life uninterrupted by any sad event; you see their characters most profligate, their external resources most affluent; and your heart says that there is no Divine judgment; that all things are carried to and fro by accidents, and blown about in disorderly and irregular motions. For if God, thou sayest, regarded human affairs, would his iniquity flourish, and my innocence suffer? Every sickness of the soul hath in Scripture its proper remedy. Let him then whose sickness is of that kind that he says in his heart things like these, let him drink this Psalm by way of potion.…

“Be not envious because of evil-doers, neither be envious against the workers of iniquity” (ver. 1). “For they shall soon wither like the grass, and shall fade like the herbs of the meadow” (ver. 2). That which to thee seemeth long, is “soon” in the sight of God. Conform thou thyself to God; and it will be “soon” to thee. That which he here calls “grass,” that we understand by the “herbs of the meadow.” They are some worthless things, occupying the surface only of the ground, they have no depth of root. In the winter then they are green; but when the summer sun shall begin to scorch, they will wither away. For now it is the season of winter. Thy glory doth not as yet appear. But if thy love hath but a deep root, like that of many trees during winter, the frost passes away, the summer (that is, the Day of Judgment) will come; then will the greenness of the grass wither away. Then will the glory of the trees appear. “For ye” (saith the Apostle) “are dead,” even as trees seem to be in winter, as it were dead, as it were withered. What is our hope then, if we are dead? The root is within; where our root is, there is our life also, for there our love is fixed. “And your life is hid with Christ in God.” When shall he wither who is thus rooted? But when will our spring be? When our summer? When will the honour of foliage clothe us around, and the fulness of fruit make us rich? When shall this come to pass? Hear what follows: “When Christ, who is our life, shall appear, then shall ye also appear with Him in glory.” And what then shall we do now? “Be not envious because of the evil-doers, neither be envious against the workers of iniquity. For they shall soon wither like the grass, and fade like the herb of the meadow.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
