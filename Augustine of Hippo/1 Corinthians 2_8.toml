[[commentary]]
quote='''
But if Christ had not been put to death, death would not have died. The devil was overcome by his own trophy, for the devil rejoiced when, by seducing the first man, he cast him into death. By seducing the first man, he killed him. By killing the last man, he lost the first from his snare.
'''
source_url=''
source_title="THE ASCENSION 263"

[[commentary]]
quote='''
What is to be hidden in a cavern? To be hidden in earth. For he that fleeth into a cavern, with earth is covered so that he may not be seen. But Jesus did carry earth, flesh which He had received from earth: and in it He concealed Himself, in order that by Jews He might not be discovered as God. “For if they had known, never the Lord of glory would they have crucified.” Why therefore the Lord of glory found they not? Because in a cavern He had hidden Himself, that is, the flesh’s weakness to their eyes He presented, but the Majesty of the Godhead in the body’s clothing, as though in a hiding-place of the earth, He hid.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"
