[[commentary]]
quote='''
What He requireth of man, let us see; what tribute our God, our Emperor and our King doth enjoin us; since He hath willed to be our King, and hath willed us to be His province? Let us hear His injunctions. Let not a poor man tremble beneath the injunction of God: what God enjoineth to be given to Himself, He doth Himself first give that enjoineth: be ye only devoted. God doth not exact what He hath not given, and to all men hath given what He doth exact. For what doth He exact? Let us hear now: “I will not reprove thee because of thy sacrifices” (ver. 8). I will not say to thee, Wherefore hast thou not slain for me a fat bull? why hast thou not selected the best he-goat from thy flock? Wherefore doth that ram amble among thy sheep, and is not laid upon mine altar? I will not say, Examine thy fields and thy pen and thy walls, seeking what thou mayest give Me. “I will not reprove thee because of thy sacrifices.” What then: Dost Thou not accept my sacrifices? “But thy holocausts are always in My sight” (ver. 9). Certain holocausts concerning which it is said in another Psalm, “If Thou hadst desired sacrifice, I would surely have given, with holocausts Thou wilt not be delighted:” and again he turneth himself, “Sacrifice to God is a troubled spirit, a heart broken and humbled God doth not despise.” Which be then holocausts that He despiseth not? Which holocausts that are always in His sight? “Kindly, O Lord,” he saith, “deal in Thy good will with Sion, and be the walls of Jerusalem builded, then shalt Thou accept the sacrifice of righteousness, oblations, and holocausts.” He saith that certain holocausts God will accept. But what is a holocaust? A whole consumed with fire: causis is burning, holon is whole: but a “holocaust” is a whole consumed with fire. There is a certain fire of most burning love: be the mind inflamed with love, let the same love hurry off the limbs to its use, let it not allow them to serve cupidity, in order that we may wholly glow with fire of divine love that will offer to God a holocaust. Such “holocausts of thine are in My sight always.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"
