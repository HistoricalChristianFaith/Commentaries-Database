[[commentary]]
quote='''
(Tr. vii. c. 8) John was the friend of the Bridegroom; he sought not his own glory, but bare witness to the truth. And therefore he wished not his disciples to remain with him, to the hindrance of their duty to follow the Lord; but rather showed them whom they should follow, saying, Behold the Lamb of God.

(Tr. vii. c. 5) For He alone and singly is the Lamb without spot, without sin; not because His spots are wiped off, but because He never had a spot. He alone is the Lamb of God, for by His blood alone can men be redeemed. (c. 6). This is the Lamb whom the wolves fear; even the slain Lamb, by whom the lion was slain.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"The next day, John stood, and two of his disciples; and looking upon Jesus as He walked, he saith, Behold the Lamb of God!" Assuredly, in a special sense, the Lamb; for the disciples were also called lambs: "Behold, I send you as lambs in the midst of wolves." They were also called light: "Ye are the light of the world; " but in another sense is He called so, concerning whom it was said, "That was the true light, which lighteth every man that cometh into the world." In like manner was He called the dove in a special sense, alone without stain, without sin; not one whose sins have been washed away, but One who never had stain. For what? Because John said concerning the Lord, "Behold the Lamb of God," was not John himself a lamb? Was he not a holy man? Was he not the friend of the Bridegroom? Wherefore, with a special meaning, said John of Him, "This is the Lamb of God;" because solely by the blood of this Lamb alone could men be redeemed.

My brethren, if we acknowledge our price, that it is the blood of the Lamb, who are they who this day celebrate the festival of the blood of I know not what woman, and how ungrateful are they! The gold was snatched, they say, from the ear of a woman, and the blood ran, and the gold was placed on a pair of scales or on a balance, and the advantage was much on the side of the blood. If the blood of a woman was sufficiently weighty to outweigh the gold, what power to outweigh the world has the blood of the Lamb by whom the world was made? And, indeed, that spirit, I know not who, was pacified by the blood that he should depress the weight. Impure spirits knew that Jesus Christ would come, they had heard of His coming from the angels, they had heard of it from the prophets, and they expected it. For if they were not expecting it, why did they exclaim, "What have we to do with Thee? Art Thou come before the time to destroy us? We know who Thou art; the Holy One of God." They expected that He would come, but they were ignorant of the time. But what have you heard in the psalm regarding Jerusalem? "For Thy servants have taken pleasure in her stones, and will pity the dust thereof. Thou shall arise," says he, "and have mercy upon Zion: for the time is come that Thou wilt have mercy upon her." When the time came for God to have mercy, the Lamb came. What sort of a Lamb whom wolves fear? What sort of a Lamb is it who, when slain, slew a lion? For the devil is called a lion, going about and roaring, seeking whom he may devour. By the blood of the Lamb the lion was vanquished. Behold the spectacles of Christians. And what is more: they with the eyes of the flesh behold vanity, we with the eyes of the heart behold truth. Do not think, brethren, that our Lord God has dismissed us without spectacles; for if there are no spectacles, why have ye come together to-day? Behold, what we have said you saw, and you exclaimed; you would not have exclaimed if you had not seen. And this is a great thing to see in the whole world, the lion vanquished by the blood of the Lamb: members of Christ delivered from the teeth of the lions, and joined to the body of Christ. Therefore some spirit or other contrived the counterfeit that His image should be bought for blood, because he knew that the human race was at some time to be redeemed by the precious blood. For evil spirits counterfeit certain shadows of honor to themselves, that they may deceive those who follow Christ. So much so, my brethren, that those who seduce by means of amulets, by incantations, by the devices of the enemy, mingle the name of Christ with their incantations: because they are not now able to seduce Christians, so as to give them poison they add some honey, that by means of the sweet the bitter may be concealed, and be drunk to ruin. So much so, that I know that the priest of that Pilleatus was sometimes in the habit of saying, Pilleatus himself also is a Christian. Why so, brethren, unless that they were not able otherwise to seduce Christians?

Do not, then, seek Christ elsewhere than where Christ wished Himself to be preached to you; and as He wished Himself to be preached to you, in that fashion hold Him fast, in that manner write Him on your heart. It is a wall against all the assaults, and against all the snares of the enemy. Do not fear, he does not tempt unless he has been permitted; it is certain that he does nothing unless permitted or sent. He is sent as an evil angel by a power holding him in control: he is permitted when he asks anything; and this, brethren, does not take place unless that the just may be tried, the unjust punished. Why, then, dost thou fear? Walk in the Lord thy God; be thou assured, what He does not wish thee to suffer thou dost not suffer; what He permits thee to suffer is the scourge of one correcting, not the punishment of one condemning. We are being educated for an eternal inheritance, and do we spurn to be scourged? My brethren, if a boy were to refuse the punishment of cuffs or stripes from his father, would he not be called proud, incorrigible, ungrateful towards paternal discipline? And for what does an earthly father educate his son? That he may not lose the temporal things which he has acquired for him, which he has collected for him, which he does not wish him to lose, which he who leaves them cannot retain eternally. He does not teach a son with whom he is to possess, but one who is to possess after him My brethren, if a father teaches a son who is to succeed him, and teaches him also that he will have to pass through all these things, in same way as he who is admonishing him is destined to pass through them, how do you wish that He educate us, our Father to whom we are not to succeed, but to whom we are to approach, and with whom we are to abide eternally in an inheritance which does not decay nor die, and which no storms can desolate? He is Himself both the inheritance and the Father. Shall we possess Him, and ought we not to undergo training? Let us hear the instruction of the Father. When our head aches, let us not have recourse to the superstitious intercessor, to the diviners and remedies of vanity. My brethren, shall I not mourn over you? Daily do I find these things; and what shall I do? Not yet have I persuaded Christians that their hope ought to be placed in God. Behold, if one dies to whom one of these remedies has been given (and how many have died with remedies, and how many have lived without them!), with what confidence does the spirit go forth to God? He has lost the sign of Christ, and has received the sign of the devil. Perhaps he may say that he has not lost the sign of Christ. Thou canst have, then, the sign of Christ along with the sign of the devil. Christ does not desire community of ownership, but He desires to possess alone what He has purchased. He has bought at so great a price that He may possess alone: thou makest Him the partner of that devil to whom thou didst sell thyself by thy sin. "Woe to the double-hearted," to those who in their hearts give part to God and part to the devil. God, being angry that the devil has part there, departs, and the devil will possess the whole. Not in vain, therefore, says the apostle, "Neither give place to the devil." Let us know the Lamb, then, brethren; let us know our price.
'''
