[[commentary]]
quote='''
“And let the sons of Sion exult in their King.” The sons of the Church are Israel. For Sion indeed was one city, which fell: amid its ruins certain saints dwelt after the flesh: but the true Sion, the true Jerusalem (for Sion and Jerusalem are one), is “eternal in the heavens,” and is “our mother.” She it is that hath given us birth, she is the Church of the saints, she hath nourished us, she, who is in part a pilgrim, in part abiding in the heavens. In the part which abideth in heaven is the bliss of angels, in the part which wandereth in this world is the hope of the righteous. Of the former is said, “Glory to God in the highest;” of the latter, “and on earth peace to men of good will.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520149.html'
source_title="Exposition on Psalm 149"
