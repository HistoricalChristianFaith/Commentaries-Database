[[commentary]]
quote='''
“And calling them all by their names,” he saith. Herein is our whole reward. We have certain names with God; that God may know our names, this we ought to wish, for this to act, for this to busy ourselves, as far as we are able; not to rejoice in other things, not even in certain spiritual gifts.…When the disciples returned from their mission exulting, and saying, “Lord, even the devils are subject unto us in Thy Name”—then He (knowing that many would say, “have we not in Thy Name cast out devils?” to whom He should say, “I know you not”) said, “In this rejoice not, that the devils are subject unto you; but rather rejoice, because your names are written in heaven.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
