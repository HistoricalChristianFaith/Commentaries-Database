[[commentary]]
quote='''
And again, from the thought of those joys he returns to his own sighs. He sees what has come before in hope, and where he is in reality.…Therefore returning to the groans proper to this place, he saith, “O Lord God of virtues, hear my prayer: hearken, O God of Jacob” (ver. 8): for Jacob himself also Thou hast made Israel out of Jacob. For God appeared unto him, and he was called Israel, seeing God. Hear me therefore, O God of Jacob, and make me Israel. When shall I become Israel? When the God of Gods shall appear in Sion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"
