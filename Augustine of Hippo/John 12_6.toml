[[commentary]]
quote='''
(Tr. l. 10) Judas did not perish at the time when he received money from the Jews to betray our Lord. He was already a thief, already lost, and followed our Lord in body, not in heart; wherein we are taught the duty of tolerating wicked men, lest we divide the body of Christ. He who robs the Church of any thing may be compared to the lost Judas. Tolerate the wicked, thou that art good, that thou mayest receive the reward of the good, and not fall into the punishment of the wicked. Follow the example of our Lord's conversation upon earth. Wherefore had He bags, to Whom the Angels ministered, except because His Church should afterwards have bags? Why did He admit thieves, but to show that His Church should tolerate thieves, while it suffered from them. It is not surprising that Judas, who was accustomed to steal money from the bags, should betray our Lord for money.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For the cause that led him so to speak is disclosed by the holy evangelist. But we, too, might have supposed, had not the real state of his mind been revealed in the Gospel, that the care of the poor might have induced him so to speak. Not so. What then? Hearken to a true witness: "This he said, not that he cared for the poor; but because he was a thief, and had the money bag, and bare what was put therein." Did he bear it about, or bear it away? For the common service he bore it, as a thief he bore it away.

Look now, and learn that this Judas did not become perverted only at the time when he yielded to the bribery of the Jews and betrayed his Lord. For not a few, inattentive to the Gospel, suppose that Judas only perished when he accepted money from the Jews to betray the Lord. It was not then that he perished, but he was already a thief, and a reprobate, when following the Lord; for it was with his body and not with his heart that he followed. He made up the apostolic number of twelve, but had no part in the apostolic blessedness: he had been made the twelfth in semblance, and on his departure, and the succession of another, the apostolic reality was completed, and the entireness of the number conserved. What lesson then, my brethren, did our Lord Jesus Christ wish to impress on His Church, when it pleased Him to have one castaway among the twelve, but this, that we should bear with the wicked, and refrain from dividing the body of Christ? Here you have Judas among the saints,-that Judas, mark you! who was a thief, yea-do not overlook it-not a thief of any ordinary type, but a thief and a sacrilegist: a robber of money bags, but of such as were the Lord's; of money bags, but of such as were sacred. If there is a distinction made in the public courts between such crimes as ordinary theft and peculation,-for by peculation we mean the theft of public property; and private theft is not visited with the same sentence as public,-how much more severe ought to be the sentence on the sacrilegious thief, who has dared to steal, not from places of any ordinary kind, but to steal from the Church? He who thieves from the Church, stands side by side with the castaway Judas. Such was this man Judas, and yet he went in and out with the eleven holy disciples. With them he came even to the table of the Lord: he was permitted to have intercourse with them, but he could not contaminate them. Of one bread did both Peter and Judas partake, and yet what communion had the believer with the infidel? Peter's partaking was unto life, but that of Judas unto death. For that good bread was just like the sweet savor. For as the sweet savor, so also does the good bread give life to the good, and bring death to the wicked. "For he that eateth unworthily, eateth and drinketh judgment to himself:" "judgment to himself," not to thee. If, then, it is judgment to himself, not to thee, bear as one that is good with him that is evil, that thou mayest attain unto the rewards of the good, and be not hurled into the punishment of the wicked.

Lay to heart our Lord's example while living with man upon earth. Why had He a money bag, who was ministered unto by angels, save to intimate that His Church was destined thereafter to have her repository for money? Why gave He admission to a thief, save to teach His Church patiently to bear with thieves? But he who had formed the habit of abstracting money from the bag, did not hesitate for money received to sell the Lord Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252050.html'
source_title="Tractates on John 50"
