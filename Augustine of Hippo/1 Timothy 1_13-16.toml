[[commentary]]
quote='''
Hear in the case of the Apostle Paul, His mercy and truth, Paul who was first Saul the persecutor. He needed mercy, and he has said that it was shown towards him: “I who was before a blasphemer, and a persecutor, and injurious: but I obtained mercy, that in me Christ Jesus might show forth all longsuffering towards those who shall believe in Him unto life eternal.” So that, when Paul received pardon of such great crimes, no one should despair of any sins whatever being forgiven him. Lo! Thou hast Mercy.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"

[[commentary]]
quote='''
He puts forth himself, and shows in himself too the season of mercy. For unless he found a period of mercy, in what condition would judgment find him? A blasphemer, a persecutor, an injurer of others. For he thus speaketh, and praiseth the season of mercy, in which season we are now living: “I who was before,” he saith, “a blasphemer, and a persecutor, and injurious: but I obtained mercy.” But perhaps he only hath obtained mercy? Hear how he cheereth us: “That in me,” he saith, “first, Christ Jesus might show forth all long-suffering, for a pattern to them which should hereafter believe on Him to life everlasting.” What meaneth, “that He might show forth all long-suffering”? That every sinner and wicked man might see that Paul received pardon, and might not despair of himself? Lo, he hath instanced himself, and thereby cheered others also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520101.html'
source_title="Exposition on Psalm 101"

[[commentary]]
quote='''
Despair not even of the crystal. Hear a saying of the crystal. “Who before was a blasphemer, and a persecutor, and injurious.” But wherefore doth God melt the crystal? That the snow despair not of itself. For he saith, “For this cause I obtained mercy, that in me first Jesus Christ might show forth all long-suffering, for a pattern to them that hereafter should believe on Him unto eternal life.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
