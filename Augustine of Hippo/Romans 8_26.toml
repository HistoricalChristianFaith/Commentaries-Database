[[commentary]]
quote='''
The Spirit that intercedes is nothing but the same charity which the Spirit has wrought in you.… Charity itself groans in prayer, and he who gave it cannot shut his ears to its voice. Cast away care, let charity make request, and the ears of God are ready to listen. The answer comes—not what you want but what is to your advantage.
'''
source_url=''
source_title="HOMILIES ON 1 JOHN 6.8"

[[commentary]]
quote='''
The Holy Spirit, who intercedes with God on behalf of the saints, does not groan as if he were in need and experiencing distress. Rather he moves us to pray when we groan, and thus he is said to do what we do when he moves us.
'''
source_url=''
source_title="AGAINST THE MANICHAEANS 1.22.34"

[[commentary]]
quote='''
We must not deduce from this that either the apostle or those to whom he spoke were unacquainted with the Lord's Prayer. We think that the reason Paul says that we do not know how we should pray … was because temporal trials and troubles are often useful for curing the swelling of pride or for proving and testing our patience, and by this proving and testing winning for it a more glorious and precious reward; or for chastising and wiping out certain sins, while we, ignorant of these benefits, wish to be delivered from all trouble.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 130"

[[commentary]]
quote='''
Now if the dove's note is a moaning, as we all know it to be, and doves moan in love, hear what the apostle says, and wonder not that the Holy Ghost willed to be manifested in the form of a dove: "For what we should pray for as we ought," says he, "we know not; but the Spirit Himself intercedes for us with groanings which cannot be uttered." What then, my brethren? shall we say this, that the Spirit groans where He has perfect and eternal blessedness with the Father and the Son? For the Holy Spirit is God, even as the Son of God is God, and the Father God. I have said "God" thrice, but not three Gods; for indeed it is God thrice rather than three Gods; because the Father, and the Son, and the Holy Ghost are one God: this you know full well. It is not then in Himself with Himself in that Trinity, in that blessedness, in that His eternal substance, that the Holy Spirit groans; but in us He groans because He makes us to groan. Nor is it a little matter that the Holy Spirit teaches us to groan, for He gives us to know that we are sojourners in a foreign land, and He teaches us to sigh after our native country; and through that very longing do we groan. He with whom it is well in this world, or rather he who thinks it is well with him, who exults in the joy of carnal things, in the abundance of things temporal, in an empty felicity, has the cry of the raven; for the raven's cry is full of clamor, not of groaning. But he who knows that he is in the pressure of this mortal life, a pilgrim "absent from the Lord," that he does not yet possess that perpetual blessedness which is promised to us, but that he has it in hope, and will have it in reality when the Lord shall come openly in glory who came before in humility concealed; he, I say, who knows this doth groan. And so long as it is for this he groans, he does well to groan; it was the Spirit that taught him to groan, he learnt it from the dove.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25206.html'
source_title="Tractates on John 6"

[[commentary]]
quote='''
When he says: Likewise the Spirit also helps our weakness; for what we should pray as we ought, we do not know, it is clear that he speaks of the Holy Spirit, which is plain in what follows, where he says: Because he intercedes for the saints according to God. We, therefore, do not know what we should pray as we ought, for two reasons: both because that which we hope to be future and toward which we tend does not yet appear; and because in this very life many things can seem to us favorable which are adverse, and adverse which are favorable. For even tribulation, when it comes upon a servant of God for testing or amendment, sometimes seems useless to those who understand less; but if it is referred to what was said: Give us help from tribulation, and vain is the salvation of man, it is understood that God very often helps us by means of tribulation, and that safety is vainly desired which is sometimes adverse, when it entangles the soul with delight and love of this life. Hence too is that saying: I found tribulation and sorrow, and I called upon the name of the Lord. For when he says I found, he signifies something useful; for we do not rightly rejoice at having found anything except what we were seeking. Therefore we do not know what we should pray as we ought. For God knows both what is expedient for us in this life and what he is going to give after this life. But the Spirit himself intercedes with unutterable groanings. He says the Spirit groans in the sense that he makes us groan, arousing by love the desire of the life to come, just as he says: The Lord your God tests you, that he may know whether you love him, that is, that he may make you know. For nothing is hidden from God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
