[[commentary]]
quote='''
“My lips shall burst forth praise: when Thou hast taught me Thy righteousnesses” (ver. 171). We know how God teacheth those who are docile unto God. For every one who hath heard from the Father and hath learned, comes unto Him “who justifieth the ungodly:” so that he may keep the righteousnesses of God not only by retaining them in his memory, but also by doing them. Thus doth he who glorieth, glory not in himself, but in the Lord, and burst forth praise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
