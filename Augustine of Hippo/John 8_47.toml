[[commentary]]
quote='''
(Tr. xlii. 16) Apply this not to their nature, but to their faults. They both are from God, and are not from God at the same time; their nature is from God, their fault is not from God. This was spoken too to those, who were not only faulty, by reason of sin, in the way in which all are: but who it was foreknown would never possess such faith as would free them from the bonds of sin.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"He that is of God heareth God's words: ye therefore hear them not, because ye are not of God." Here, again, it is not of their nature as men, but of their depravity, that you are to think. In this way they are of God, and yet not of God. By nature they are of God, in depravity they are not of God. Give heed, I pray you. In the gospel you have the remedy against the poisonous and impious errors of the heretics. For of these words also the Manicheans are accustomed to say, See, here there are two natures, -the one good and the other bad; the Lord says it. What says the Lord? "Ye therefore hear me not, because ye are not of God." This is what the Lord says. What then, he rejoins, dost thou say to that? Hear what I say. They are both of God, and not of God. By nature they are of God: by depravity they are not of God; for the good nature which is of God sinned voluntarily by believing the persuasive words of the devil, and was corrupted; and so it is seeking a physician, because no longer in health. That is what I say. But thou thinkest it impossible that they should be of God, and yet not of God. Hear why it is not impossible. They are of God, and yet not of God, in the same way as they are the children of Abraham, and yet not the children of Abraham. Here you have it. It is not as you say. Hearken to the Lord Himself; it is He that said to them, "I know that ye are the children of Abraham." Could there be any lie with the Lord? Surely not. Then is it true what the Lord said? It is true. Then it is true that they were the children of Abraham? It is true. But listen to Himself denying it. He who said, "Ye are the children of Abraham," Himself denied that they were the children of Abraham. "If ye are Abraham's children, do the deeds of Abraham. But now ye seek to kill me, a man that telleth you the truth, which I have heard from God: this did not Abraham. Ye do the works of your father," that is, of the devil. How, then, were they both Abraham's children, and yet not his children? Both states He showed in them. They were both Abraham's children in their carnal origin, and not his children in the sin of following the persuasion of the devil. So, also, apply it to our Lord and God, that they were both of Him, and not of Him. How were they of Him? Because He it was that created the man of whom they were born. How were they of Him? Because He is the Architect of nature,-Himself the Creator of flesh and spirit. How, then, were they not of Him? Because they had made themselves depraved. They were no longer of Him, because, imitating the devil, they had become the children of the devil.

Therefore came the Lord God to man as a sinner, Thou hast heard the two names, both man and sinner. As man, he is of God; as a sinner, he is not of God. Let the moral evil in man be distinguished from his nature. Let that nature be owned, to the praise of the Creator; let the evil be acknowledged, that the physician may be called in to its cure. When the Lord then said, "He that is of God heareth the words of God: ye therefore hear them not, because ye are not of God." He did not distinguish the value of different natures, or find, beyond their own soul and body, any nature in men which had not been vitiated by sin; but foreknowing those who should yet believe, them He called of God, because yet to be born again of God by the adoption of regeneration. To these apply the words "He that is of God heareth the words of God." But that which follows, "Ye therefore hear them not, because ye are not of God," was said to those who were not only corrupted by sin (for this evil was common to all), but also foreknown as those who would not believe with the faith that alone could deliver them from the bondage of sin. On this account He foreknew that those to whom He so spake would continue in that which they derived from the devil, that is, in their sins, and would die in the impiety in which they resembled him; and would not come to the regeneration wherein they would be the children of God, that is, be born of the God by whom they were created as men. In accordance with this predestinating purpose did the Lord speak; and not that He had found any man amongst them who either by regeneration was already of God, or by nature was no longer of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252042.html'
source_title="Tractates on John 42"
