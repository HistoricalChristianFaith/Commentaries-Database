[[commentary]]
quote='''
Nor do I think that I should pass over what musicians say, that there are three kinds of sounds, by voice, by breath, by striking: by voice, uttered by throat and windpipe, when man singeth without any instrument; by breath, as by pipe, or anything of that sort: by striking, as by harp, or anything of that kind. None then of these kinds is omitted here: for there is voice in the choir, breath in the trumpet, striking in the harp, representing mind, spirit, body, but by similitudes, not in the proper sense of the words. When then he proposed, “Praise God in His saints,” to whom said he this, save to themselves? And in whom are they to praise God, save in themselves? For ye, saith he, are “His saints;” ye are “His strength,” but that which He wrought in you; ye are “His mighty works, and the multitude of His greatness,” which He hath wrought and set forth in you. Ye are “trumpet, psaltery, harp, timbrel, choir, strings, and organ, cymbals of jubilation sounding well,” because sounding in harmony. All these are ye: let nought that is vile, nought that is transitory, nought that is ludicrous, be here thought of. And since to savour of the flesh is death, “let every spirit praise the Lord” (ver. 6).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520150.html'
source_title="Exposition on Psalm 150"
