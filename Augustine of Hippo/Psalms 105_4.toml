[[commentary]]
quote='''
Let us give our mind's best attention, and, with the Lord's help, seek after God. The language of the divine hymn is: "Seek God and your soul shall live." Let us search for that which needs to be discovered, and into that which has been discovered. He whom we need to discover is concealed, in order to be sought after; and when found, is infinite, in order still to be the object of our search. Hence it is elsewhere said, "Seek His face evermore." For He satisfies the seeker to the utmost of his capacity; and makes the finder still more capable, that he may seek to be filled anew, according to the growth of his ability to receive. Therefore it was not said, "Seek His face evermore," in the same sense as of certain others, who are "always learning, and never coming to a knowledge of the truth;" but rather as the preacher saith, "When a man hath finished, then he beginneth;" till we reach that life where we shall be so filled, that our natures shall attain their utmost capacity, because we shall have arrived at perfection, and no longer be aiming at more. For then all that can satisfy us will be revealed to our eyes. But here let us always be seeking, and let our reward in finding put no end to our searching. For we do not say that it will not be so always, because it is only so here; but that here we must always be seeking, lest at any time we should imagine that here we can ever cease from seeking. For those of whom it is said that they are "always learning, and never coming to a knowledge of the truth." are here indeed always learning; but when they depart this life they will no longer be learning, but receiving the reward of their error. For the words, "always learning, and never coming to a knowledge of the truth," mean, as it were, always walking, and never getting into the road. Let us, on the other hand, be walking always in the way, till we reach the end to which it leads; let us nowhere tarry in it till we reach the proper place of abode: and so we shall both persevere in our seeking, and be making some attainments in our finding, and, thus seeking and finding, be passing on to that which remains, till the very end of all seeking shall be reached in that world where perfection shall admit of no further effort at advancement.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252063.html'
source_title="Tractates on John 63"
