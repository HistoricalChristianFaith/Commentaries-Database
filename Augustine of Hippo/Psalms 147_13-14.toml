[[commentary]]
quote='''
“He hath blessed thy children within thee.” Who? He “who hath set peace as thy borders.” How ye all exult! Love peace, my brethren. Greatly are we delighted, when the love of peace crieth from your hearts. How greatly doth it delight you! I had said nothing: I had explained nothing: I but read the verse, and ye shouted. What was it that shouted in you? The love of peace.…children of the kingdom, O citizens of Jerusalem, in Jerusalem is the vision of peace: and all who love peace are blest in her, and they enter in, when the doors are being shut, and the bars made strong. This, which when but named ye so love and esteem, this follow after, this long for: this love in your home, in your business, in your wives, in your sons, in your slaves, in your friends, in your enemies.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
