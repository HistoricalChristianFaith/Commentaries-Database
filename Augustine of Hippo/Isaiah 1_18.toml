[[commentary]]
quote='''
What is surprising about white garments symbolizing the church?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252078.html'
source_title="SERMON 78:2"

[[commentary]]
quote='''
Thus, it is necessary for a man that he should be not only justified when unrighteous by the grace of God,—that is, be changed from unholiness to righteousness,—when he is requited with good for his evil; but that, even after he has become justified by faith, grace should accompany him on his way, and he should lean upon it, lest he fall. On this account it is written concerning the Church herself in the book of Canticles: "Who is this that cometh up in white raiment, leaning upon her kinsman?" Made white is she who by herself alone could not be white. And by whom has she been made white except by Him who says by the prophet, "Though your sins be as purple, I will make them white as snow"? At the time, then, that she was made white, she deserved nothing good; but now that she is made white, she walketh well;—but it is only by her continuing ever to lean upon Him by whom she was made white. Wherefore, Jesus Himself, on whom she leans that was made white, said to His disciples, "Without me ye can do nothing."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 13"
