[[commentary]]
quote='''
When he says: Do you wish not to fear the power? Do good, and you shall have praise from it, this can trouble some, when they consider that Christians have often suffered persecution from these powers. Did they, then, not do good, since they were not only not praised by these powers, but were even subjected to punishments and killed? The words of the Apostle, therefore, must be considered. For he does not say: Do good, and the power will praise you; but he says: Do good, and you shall have praise from it. For whether it approves your good deed or persecutes it, you shall have praise from it—either when you gain it into the service of God, or when by its persecution you merit a crown. This too is understood in what follows, when he says: For it is God's minister to you for good—even if to itself for evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
