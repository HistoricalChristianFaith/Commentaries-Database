[[commentary]]
quote='''
For the same men are Heavens and clouds: Heavens from the brightness of the truth, clouds from the hidden things of the flesh: for all clouds are obscure, owing to their mortality: and they come and go. It is on account of these very obscurities of the flesh, that is, of the clouds, that the Apostle saith, “Therefore judge nothing before the time, until the Lord come, who will bring to light the hidden things of darkness.” You see at this moment what a man is saying: but what he has in his heart, you cannot see: what is forced from the cloud, you see, what is kept within the cloud, you see not. For whose eyes pierce the cloud?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
