[[commentary]]
quote='''
Matthew then continues his narrative in the following terms: "Then cometh Jesus from Galilee to Jordan unto John, to be baptized of him. But John forbade Him, saying, I have need to be baptized of Thee, and comest Thou to me? And Jesus answering, said unto him, Suffer it to be so now; for thus it becometh us to fulfil all righteousness. Then he suffered Him." The others also attest the fact that Jesus came to John. The three also mention that He was baptized. But they omit all mention of one circumstance recorded by Matthew, namely, that John addressed the Lord, or that the Lord made answer to John.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 13"
