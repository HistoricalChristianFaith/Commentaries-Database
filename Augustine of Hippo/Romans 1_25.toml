[[commentary]]
quote='''
For by worshiping and serving the creature rather than the Creator they have not wished to be a temple of the one true God. By wishing to have him along with many other things, they have been more successful in not having him at all than in having him along with many false gods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 187.29"

[[commentary]]
quote='''
But they seem to themselves to have a purer religion, who say, I neither worship an idol, nor a devil; but in the bodily image I behold an emblem of that which I am bound to worship.…They presume to reply, that they worship not the bodies themselves, but the deities which preside over the government of them. One sentence of the Apostle, therefore, testifieth to their punishment and condemnation; “Who,” he saith, “have changed the truth of God into a lie, and worshipped and served the creature more than the Creator, who is blessed for ever.” For in the former part of this sentence he condemned idols; in the latter, the account they give of their idols: for by designating images wrought by an artificer by the names of the works of God’s creation, they change the truth of God into a lie; while, by considering these works themselves as deities, and worshipping them as such, they serve the creature more than the Creator, who is blessed for ever.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520115.html'
source_title="Exposition on Psalm 115"
