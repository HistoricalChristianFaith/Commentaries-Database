[[commentary]]
quote='''
“All the ways of the Lord are mercy and truth” (ver. 10). And what ways will He teach them, but mercy wherein He is placable, and truth wherein He is incorrupt? Whereof He hath exhibited the one in forgiving sins, the other in judging deserts. And therefore “all the ways of the Lord” are the two advents of the Son of God, the one in mercy, the other in judgment. He then attaineth unto Him holding on His ways, who seeing himself freed by no deserts of his own, lays pride aside, and henceforward bewares of the severity of His trial, having experienced the clemency of His help. “To them that seek His testament and His testimonies.” For they understand the Lord as merciful at His first advent, and as the Judge at His second, who in meekness and gentleness seek His testament, when with His Own Blood He redeemed us to a new life; and in the Prophets and Evangelists, His testimonies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"

[[commentary]]
quote='''
He saith also in another place, “All the ways of the Lord are mercy and truth, to men seeking His testament and His testimonies.” Large is the discourse of truth and mercy, but shortness we have promised. Briefly hear ye what is truth and mercy: because no small thing is that which hath been said, “All the ways of the Lord are mercy and truth.” Mercy is spoken of, because our merits God regarded not, but His own goodness, in order that He might forgive us all our sins, and might promise life everlasting: but truth is spoken of, because He faileth not to render those things which He hath promised. Let us acknowledge it here, and let us do it; so that, just as to us God hath shown forth His mercy and His truth, mercy in forgiving our sins, truth in showing forth His promises; so also, I say, let us execute mercy and truth, mercy concerning the weak, concerning the needy, concerning even our enemies; truth in not sinning, and in not adding sin upon sin.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252061.html'
source_title="Exposition on Psalm 61"

[[commentary]]
quote='''
But it may be asked, in what sense it is here said, “All Thy ways are truth;” since in another Psalm it is read, “All the ways of the Lord are mercy and truth.” But towards the saints, All the ways of the Lord are at once mercy and truth: since He aideth them even in judgment, and thus mercy is not wanting; and in having mercy upon them, He performeth that which He hath promised, so that truth is not wanting. But towards all, both those whom He freeth, and those whom He condemneth, all the ways of the Lord are mercy and truth; because where He doth not show mercy, the truth of His vengeance is displayed. For He freeth many who have not deserved, but He condemneth none who hath not deserved it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
