[[commentary]]
quote='''
This is to call upon God, freely to call upon Him. Furthermore, of certain men hath been said what? “Upon the Lord they have not called.” The Lord they seemed as it were to call unto themselves and they besought Him about inheritances, about increasing money, about lengthening this life, about the rest of temporal things: and concerning them the Scripture saith what? “Upon the Lord they have not called.” Therefore there followeth what? “There they have feared with fear, where there was no fear.” What is, “where there was no fear”? Lest money should be stolen from them, lest anything in their house should be made less; lastly, lest they should have less of years in this life, than they hoped for themselves: but there have they trembled with fear, where there was no fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"
