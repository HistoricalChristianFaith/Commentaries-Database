[[commentary]]
quote='''
(ubi sup.) Persecuted He says generally, comprehending both reproaches and defamation of character.

(Serm. in Mont. i. 6.) If you by whom the nations are to be salted shall lose the kingdom of heaven through fear of temporal persecution, who are they by whom your error shall be corrected. Another copy has, If the salt have lost all sense, showing that they must be esteemed to have lost their sense, who cither pursuing abundance, or fearing lack of temporal goods, lose those which are eternal, and which men can neither give nor take away.

(ubi sup.) Not he that suffers persecution is trodden under foot of men, but he who through fear of persecution falls away. For we can tread only on what is below us; but he is no way below us, who however much he may suffer in the body, yet has his heart fixed in heaven.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Why “in the valley of salt-pits”? A valley is humility: salt-pits signify savour. For many men are humbled, but emptily and foolishly, in empty oldness they are humbled. One suffereth tribulation for money, suffereth tribulation for temporal honour, suffereth tribulation for the comforts of this life; he is to suffer tribulation and to be humbled: why not for the sake of God? why not for the sake of Christ? why not for the savour of salt? Knowest thou not that to thee hath been said, “Ye are the salt of earth,” and, “If the salt shall have been spoiled, for no other thing will it be of use, but to be cast out”? A good thing it is therefore wisely to be humbled. Behold now are not heretics being humbled? Have not laws been made even by men to condemn them, against whom divine laws do reign, which even before had condemned them? Behold they are humbled, behold they are put to flight, behold persecution they suffer, but without savour; for folly, for emptiness. For now the salt hath been spoiled: therefore it hath been cast out, to be trodden down of men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252060.html'
source_title="Exposition on Psalm 60"
