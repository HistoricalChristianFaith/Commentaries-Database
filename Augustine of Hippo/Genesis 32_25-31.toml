[[commentary]]
quote='''
You know that Jacob is the same as Israel. For when he wrestled with the Angel, and “prevailed,” and had been blest by Him over whom he prevailed, his named was changed, so that he was called “Israel;” just as the people of Israel “prevailed” against Christ, so as to crucify Him, and nevertheless was (in those who believed in Christ) blest by Him over whom it prevailed. But many believed not; hence the halting of Jacob. Here we have at once, blessing and halting. Blessing on those who became believers; for we know that afterward many of that people did believe: Halting on the other hand in those who believed not. And because the greater part believed not, and but few believed, therefore that a halting might be produced, He touched “the breadth of his thigh.” What is meant by the breadth of the thigh? The great multitude of his descendants.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"
