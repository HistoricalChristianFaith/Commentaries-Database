[[commentary]]
quote='''
For did we first seek Christ, and not He seek us? Did we come sick to the Physician, and not the PhySician to the sick? Was not that sheep lost, and did not the shepherd, leaving the ninety and nine in the wilderness, seek and find it, and joyfully carry it back on his shoulders? Was not that piece of money lost, and the woman lighted the lamp, and searched in the whole house until she found it? And when she had found it, "Rejoice with me," she said to her neighbors, "for I have found the piece of money which I lost." In like manner were we lost as the sheep, lost as the piece of money; and our Shepherd found the sheep, but sought the sheep; the woman found the piece of money, but sought the piece of money. What is the woman? The flesh of Christ. What is the lamp? "I have prepared a lamp for my Christ." Therefore were we sought that we might be found; having been found, we speak. Let us not be proud, for before we were found we were lost, if we had not been sought. Let them then not say to us whom we love, and whom we desire to gain to the peace of the Catholic Church, "What do you wish with us? Why seek you us if we are sinners?" We seek you for this reason that you perish not: we seek you because we were sought; we wish to find you because we have been found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
source_title="Tractates on John 7"
