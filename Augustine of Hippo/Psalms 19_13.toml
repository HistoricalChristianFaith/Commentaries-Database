[[commentary]]
quote='''
“And from the” faults “of others preserve Thy servant” (ver. 13). Let me not be led astray by others. For he is not a prey to the faults of others, who is cleansed from his own. Preserve therefore from the lusts of others, not the proud man, and him who would be his own master, but, Thy servant. “If they get not the dominion over me, then shall I be undefiled.” If neither my own secret sins, nor those of others, get the dominion over me, then shall I be undefiled. For there is no third source of sin, but one’s own secret sin, by which the devil fell, and another’s sin, by which man is seduced, so as by consenting to make it his own. “And I shall be cleansed from the great offence.” What but pride? for there is none greater than apostasy from God, which is “the beginning of the pride of man.” And he shall indeed be undefiled, who is free from this offence also; for this is the last to them who are returning to God, which was the first as they departed from Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252019.html'
source_title="Exposition on Psalm 19"
