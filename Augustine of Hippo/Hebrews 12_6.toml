[[commentary]]
quote='''
Those, however, for whom eternal life is prepared, must needs be scourged in this life: for that sentence is true: “My son, faint not under the chastening of the Lord, neither be weary when thou art rebuked of Him.” “For whom the Lord loveth He chasteneth, and scourgeth every son whom He receiveth.” Let not mine enemies therefore insult over me; let “them not magnify themselves;” and if my Father scourgeth me, “I am prepared for the scourge;” because there is an inheritance in store for me. Thou wilt not submit to the scourge: the inheritance is not bestowed upon thee. For “every son” must needs be scourged. So true it is that “every son” is scourged, that He spared not even Him who had no sin. For “I am prepared for the scourges.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"


[[commentary]]
quote='''
Think not that now the wrath of God hath passed away, because thou hast been converted. The wrath of God hath passed away from thee, but only so that it condemn not for everlasting. But He scourgeth, He spareth not: because He scourgeth every son whom He receiveth. If thou refusest to be scourged, why dost thou desire to be received? He scourgeth every son whom He receiveth. He who did not spare even His only Son, scourgeth every one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"
