[[commentary]]
quote='''
Who, then, has effected the demolition of these systems but the God of Israel? For to this people was the announcement made by those divine voices which were addressed to Moses: "Hear, O Israel; the Lord thy God is one God." "Thou shalt not make unto thee any graven image, or any likeness of anything that is in heaven above or that is in the earth beneath." And again, in order that this people might put an end to these things wherever it received power to do so, this commandment was also laid upon the nation: "Thou shalt not bow down to their gods, nor serve them; thou shalt not do after their works, but thou shalt utterly overthrow them, and quite break down their images." But who shall say that Christ and Christians have no connection with Israel, seeing that Israel was the grandson of Abraham, to whom first, as afterwards to his son Isaac, and then to his grandson Israel himself, that promise was given, which I have already mentioned, namely: "In thy seed shall all nations be blessed"? That prediction we see now in its fulfilment in Christ. For it was of this line that the Virgin was born, concerning whom a prophet of the people of Israel and of the God of Israel sang in these terms: "Behold, a virgin shall conceive, and bear a son; and they shall call His name Emmanuel." For by interpretation, Emmanuel means, "God with us." This God of Israel, therefore, who has interdicted the worship of other gods, who has interdicted the making of idols, who has commanded their destruction, who by His prophet has predicted that the Gentiles from the ends of the earth would say, "Surely our fathers have worshipped mendacious idols, in which there is no profit;" this same God is He who, by the name of Christ and by the faith of Christians, has ordered, promised, and exhibited the overthrow of all these superstitions. In vain, therefore, do these unhappy men, knowing that they have been prohibited from blaspheming the name of Christ, even by their own gods, that is to say, by the demons who fear the name of Christ, seek to make it out, that this kind of doctrine is something strange to Him, in the power of which the Christians dispute against idols, and root out all those false religions, wherever they have the opportunity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25201.html'
source_title="The Harmony of the Gospels, Book 1, Chapter 26"
