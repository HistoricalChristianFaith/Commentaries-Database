[[commentary]]
quote='''
“Quit you like men, and let your heart be strengthened” (ver. 24): working good without fainting, that ye may reap in due season. “All ye who trust in the Lord:” that is, ye who duly fear and worship Him, trust ye in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
