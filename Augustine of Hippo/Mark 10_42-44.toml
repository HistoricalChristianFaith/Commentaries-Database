[[commentary]]
quote='''
Moreover, as to what Matthew and Mark have stated with respect to the princes of the Gentiles exercising dominion over those who are subject to them,—namely, that it should not be so with them [the disciples], but that he who was greatest among them should even be a servant to the others,—Luke also gives us something of the same tenor, although not in that connection; and the order itself indicates that the same sentiment was expressed by the Lord on a second occasion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 64"
