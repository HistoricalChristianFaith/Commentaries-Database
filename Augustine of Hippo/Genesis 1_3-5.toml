[[commentary]]
quote='''
Thus then he says, “I will confess to the Lord according to His justice,” as one who saw that darkness was not made by God, but ordered nevertheless. For God said, “Let light be made, and light was made.” He did not say, Let darkness be made, and darkness was made: and yet He ordered it. And therefore it is said, “God divided between the light, and the darkness: and God called the light day, and the darkness He called night.” This is the distinction, He made the one and ordered it: but the other He made not, but yet He ordered this too. But now that sins are signified by darkness, so is it seen in the Prophet, who says, “And thy darkness shall be as the noon day:” and in the Apostle, who says, “He that hateth his brother is in darkness:” and above all that text, “Let us cast off the works of darkness, and let us put on the armour of light.” Not that there is any nature of darkness. For all nature, in so far as it is nature, is compelled to be. Now being belongs to light: not being to darkness. He then that leaves Him by whom he was made, and inclines to that whence he was made, that is, to nothing, is in this sin endarkened: and yet he does not utterly perish, but he is ordered among the lowest things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25207.html'
source_title="Exposition on Psalm 7"
