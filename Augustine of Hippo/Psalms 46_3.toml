[[commentary]]
quote='''
“The waters thereof roared, and were troubled” (ver. 3): when the Gospel was preached, “What is this? He seemeth to be a setter forth of strange gods:” this the Athenians; but the Ephesians, with what tumult would they have slain the Apostles, when in the theatre, for their goddess Diana, they made such an uproar, as to be shouting, “Great is Diana of the Ephesians!” Amidst which waves and roaring of the sea, feared not they who to that refuge had fled. Nay, the Apostle Paul would enter in to the theatre, and was kept back by the disciples, because it was necessary that he should still abide in the flesh for their sakes. But yet, “the waters thereof roared, and were troubled: the mountains shook at the mightiness thereof.” Whose might? The sea’s? or rather God’s, of whom was said, “refuge and strength, a helper in tribulations, which have found us out too much?” For shaken were the mountains, that is, the powers of this world. For one thing are the mountains of God, another the mountains of the world: the mountains of the world, they whose head is the devil, the mountains of God, they whose Head is Christ. But by these mountains were shaken those mountains. Then gave they their voices against Christians, when the mountains were shaken, the waters roaring; for the mountains were shaken, and there was made a great earthquake, with quaking of the sea. But against whom this? Against the City founded upon a rock. The waters roar, the mountains shake, the Gospel being preached. What then, the City of God? Hear what followeth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
