[[commentary]]
quote='''
Execute mercy to the wicked, not as being wicked. Do not receive the wicked, in so far forth as he is wicked: that is, do not receive him as if from inclination towards and love for his iniquity. For it is forbidden to give unto a sinner, and to receive sinners. Yet how is this, “Give unto every man that asketh of thee”? and this, “if thine enemy hunger, feed him”? This is seemingly contradictory: but it is opened to those who knock in the name of Christ, and will be clear unto those who seek. “Help not a sinner:” and, “give not to the ungodly;” and yet, “give unto every man that asketh of thee.” But it is a sinner who asketh of me. Give, not as unto a sinner. When dost thou give as unto a sinner? When that which maketh him a sinner, pleaseth thee so that thou givest.…Let those who give to a man who fights with wild beasts, tell me why they give? Why doth he give to this man? He loveth that in him, in which consists his greatest sin; this he feedeth, this he clotheth in him, wickedness itself, made public by all witnessing it. Why doth the man give, who giveth to actors, or to charioteers, or to courtesans? Do not these very persons give to human beings? But it is not the nature of God’s work that they attend to, but the iniquity of the human work.…When therefore thou givest, thou givest to infamy, not to bravery. As then he who giveth to the fighter of beasts, giveth not to the man, but to a most infamous profession; for if he were only a man, and not a fighter of beasts, thou wouldest not give; thou honourest him in vice, not nature: so on the other hand, if thou give to the righteous, if thou give to the prophet, if thou give to the disciple of Christ anything of which he is in want, without thinking that he is Christ’s disciple, that he is God’s minister, that he is God’s steward; but art thinking in that case of some temporal advantage, for instance, that when perchance he shall be needful to thy cause, he may be bought for thee, because thou hast given him something; thou hast no more given to the righteous, if thou hast thus given, than he gave to the man, when he gave to the beast-fighter. The matter, then, most beloved, is quite open to us, and I conceive, that although it was obscure, it is now clear. It was to this that the Lord bound thee, when He said, “He who hath received the righteous man.” That were enough. But as the righteous may be received with another intention,…He saith, “He who receiveth a righteous man in the name of a righteous man:” that is, receiving him in consideration of his righteousness:…that is, because he is Christ’s disciple, because he is a steward of the Mystery: “Verily I say unto you, he shall in no wise lose his reward.” So understand, he who receiveth a sinner in the name of a sinner shall lose his reward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
