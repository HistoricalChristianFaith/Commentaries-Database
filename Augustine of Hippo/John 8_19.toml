[[commentary]]
quote='''
(Tract. xxxvii. 1) Those who had heard our Lord say, Ye judge after the flesh, showed that they did so; for they understood what He said of His Father in a carnal sense: Then said they unto Him, Where is Thy Father? meaning, We have heard Thee say, I am not alone, but I and the Father that sent Me. We see Thee alone; prove to us then that Thy Father is with Thee.

(Tract. xxxvii. 2.) As if He said, Ye ask where is Thy Father? As if ye knew Me already, and I were nothing else but what ye see. But ye know Me not, and therefore I tell you nothing of My Father. Ye think Me indeed a mere man, and therefore among men look for My Father. But, forasmuch as I am different altogether, according to My seen and unseen natures, and speak of My Father in the hidden sense according to My hidden nature; it is plain that ye must first know Me, and then ye will know My Father; If ye had known Me, ye would have known My Father also.

(Tract. xxxvii. 7) What does this mean: If ye knew Me, ye would know My Father also, but, I and My Father are one? It is a common expression, when you see one man very like another, If you have seen him, you have seen the other. You say this, because they are so like. And thus our Lord says, If ye had known Me, ye had known My Father also; not that the Father is the Son, but that the Son is like the Father.

(Tract. xxxviii. s. 3) This word perhapsc is used only by way of rebuke, though it seems to express doubt. As used by men indeed it is the expression of doubt, but He who knew all things could only mean by that doubt to rebuke unbelief. Nay, even we sometimes say perhaps, when they are certain of a thing, e. g. when you are angry with your slave, and say, Do not you heed me? Consider, perhaps I am your master. So our Lord's doubt is a reproof to the unbelievers, when He says, Ye should have known perhaps My Father also.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
What in the holy Gospel is spoken briefly ought not briefly to be expounded, so that what is read may be understood. The words of the Lord are few, but great; to be valued not by number, but by weight: not to be despised because they are few, but to be sought because they are great. You who were present yesterday have heard, as we discoursed according to our ability from that which the Lord said, "Ye judge after the flesh: I judge not any man. But yet if I judge, my judgment is true; because I am not alone, but I and the Father that sent me. It is written in your law, that the testimony of two men is true. I am one that bear witness of myself, and the Father that sent me beareth witness of me." Yesterday, as I have said, from these words a discourse was delivered to your ears and to your minds. When the Lord had spoken these words, they who heard," Ye judge after the flesh," manifested the truth of what they had heard. For they answered the Lord, as He spoke of God His Father, and said to Him, "Where is thy Father?" The Father of Christ they understood carnally, because they judged the words of Christ after the flesh. But He who spoke was openly flesh, but secretly the Word: man visible, God hidden. They saw the covering, and despised the wearer: they despised because they knew not; knew not, because they saw not; saw not, because they were blind; they were blind, because they believed not.

Let us see, then, what answer the Lord made to this. "Where," say they, "is thy Father?" For we have heard thee say, "I am not alone, but I and the Father that sent me:" we see thee alone, we do not see thy Father with thee; how sayest thou that thou art not alone, but that thou art with thy Father? Else show us that thy Father is with thee. And the Lord answered them: Do ye know me, that I should show you the Father? This is indeed what follows; this is what He answered in His own words, the exposition of which we have already premised. For see what He said, "Ye neither know me nor my Father: if ye knew me, ye would perhaps know my Father also." Ye say then, "Where is thy Father?" As if already ye knew me; as if what you see were all that I am. Therefore because ye know not me, I do not show you my Father. Ye suppose me, in fact, to be a man; hence ye seek a man for my father, because "ye judge after the flesh." But because, according to what you see, I am one thing, and another thing according to what you see not, and that I as hidden from you speak of my Father as hidden, it is requisite that you should first know me, and then ye know my Father also.

"For if ye knew me, ye would perhaps know my Father also." He who knows all things is not in doubt when He says perhaps, but rebuking. Now see how this very word perhaps, which seems to be a word of doubting, may be spoken chidingly. Yea, a word expressive of doubt it is when used by man, for man doubts because he knows not; but when a word of doubting is spoken by God, from whom surely nothing is hid, it is unbelief that is reproved by that doubting, not the Godhead merely expressing an opinion. For men sometimes chidingly express doubt concerning things which they hold certain; that is, use a word of doubting, while in their heart they doubt not: just as thou wouldst say to thy slave, if thou wert angry with him, "Thou despisest me; but consider, perhaps I am thy master." Hence also the apostle, speaking to some who despised him, says: "And I think that I also have the Spirit of God." When he says, "I think," he seems to doubt; but he is rebuking, not doubting. And in another place the Lord Jesus Christ Himself, rebuking the future unbelief of mankind, saith: "When the Son of man cometh, will He, thinkest thou, find faith on the earth?"

You now, as I think, understand how the word perhaps is used here, in case any weigher of words and poiser of syllables, as if to show his knowledge of Latin, finds fault with a word which the Word of God spoke; and by blaming the Word of God, remain not eloquent, but mute. For who is there that speaks as doth the Word which was in the beginning with God? Do not consider these words as we use them, and from these wish to measure that Word which is God. Thou hearest the Word indeed, and despisest it; hear God and fear Him: "In the beginning was the Word." Thou referrest to the usage of thy conversation, and sayest within thyself, What is a word? What mighty thing is a word? It sounds and passes away; after beating the air, it strikes the ear and is no more. Hear further: "The Word was with God;" remained, did not by sounding pass away. Perhaps thou still despisest it: "The Word was God." With thyself, O man, a word in thy heart is a different thing from sound; but the word that is with thee, in order to pass to me, requires sound for a vehicle as it were.It takes to itself sound, mounts it as a vehicle, runs through the air, comes to me and yet does not leave thee. But the sound, in order to come to me, left thee and yet did not stay with me. Now has the word that was in thy heart also passed away with the passing sound? Thou didst speak thy thought; and, that the thought which was hid with thee might come to me, thou didst sound syllables; the sound of the syllables conveyed thy thought to my ear; through my ear thy thought descended into my heart, the intermediate sound flew away: but that word which took to itself sound was with thee before thou didst sound it, and is with me, because thou didst sound it, without quitting thee. Consider this, thou nice weigher of sounds, whoever thou be. Thou despisest the Word of God, thou who comprehendest not the word of man.

He, then, by whom all things were made knows all things. and yet He rebukes by doubting: "If ye knew me ye would perhaps know my Father also." He rebukes unbelievers. He spoke a like sentence to the disciples, but there is not a word of doubting in it, because there was no occasion to rebuke unbelief. For this, "If ye knew me, ye would perhaps know my Father also," which He said to the Jews, He said also to the disciples, when Philip asked, or rather, demanded of Him, saying, "Lord, show us the Father, and it sufficeth us:" just as if he said, We already know Thee even ourselves; Thou hast been apparent to us; we have seen Thee; Thou hast deigned to choose us; we have followed Thee, have seen Thy marvels, heard Thy words of Salvation, have taken Thy precepts upon us, we hope in Thy promises: Thou hast deigned to confer much upon us by Thy very presence: but still, while we know Thee, and we do not yet know the Father, we are inflamed with desire to see Him whom we do not yet know; and thus, because we know Thee, but it is not enough until we know the Father, show us the Father and it sufficeth us. And the Lord, that they might understand that they knew not what they thought they did already know, said, "Am I so long time with you, and ye know me not, Philip, he who hath seen me hath seen the Father." Has this sentence a word of doubting in it? Did He say, He that hath seen me hath perhaps seen the Father? Why not? Because it was a believer that listened to Him, not a persecutor of the faith: hence did the Lord not rebuke, but teach. "Whoso hath seen me hath seen the Father also:" and here, "If ye knew me, ye would know my Father also," let us remove the word which indicates the unbelief of the hearers, and it is the same sentence.

Yesterday we commended it to your consideration, beloved, and said that the sentences of the Evangelist John, in which he narrates to us what he learned from the Lord, had not required to be discussed, were that possible, except the inventions of heretics had compelled us. Yesterday, then, we briefly intimated to you, beloved, that there are heretics who are called Patripassians, or Sabellians after their founder: these say that the same is the Father who is the Son; the names different, but the person one. When He wills, say they, He is Father; when He wills, He is Son: still He is one. There are likewise other heretics who are called Arians. They indeed confess that our Lord Jesus Christ is the only Son of the Father; the one, Father of the Son; the other, Son of the Father; that He who is Father is not Son, nor He who is Son is Father; they confess that the Son was begotten, but deny His equality. We, namely, the catholic faith, coming from the doctrine of the apostles planted in us, received by a line of succession, to be transmitted sound to posterity,-the catholic faith, I say, has, between both those parties, that is, between both errors, held the truth. In the error of the Sabellians, He is only one; the Father and Son is the same person: in the error of the Arians, the Father and the Son are indeed different persons; but the Son is not only a different person, but different in nature. Thou midway between these, what sayest thou? Thou hast shut out the Sabellian, shut out the Arian also. The Father is Father, the Son is Son; another person, not another in nature; for, "I and the Father are one," which, so far as I could, I pressed on your thoughts yesterday. When he hears that word, we are, let the Sabellian go away confounded; when he hears the word one, let the Arian go away confounded. Let the catholic steer the bark of his faith between both, since in both he must be on his guard against shipwreck. Say thou, then, what the Gospel saith, "I and the Father are one." Not different in nature, because one; not one person, because are.

A little before He said, "My judgment is true; because I am not alone, but I and the Father that sent me:" as if He said, The reason why my judgment is true is, because I am the Son of God, because I speak the truth, because I am truth itself. Those men, understanding Him carnally, said, "Where is thy Father?" Now hear, O Arian: "Ye neither know me, nor my Father;" because, "If ye knew me, ye would know my Father also." What doth this mean, except "I and the Father are one"? When thou seest some person like some other,-give heed, beloved, it is a common remark; let not that appear to you difficult which you see to be customary,-when, I say, thou seest some person like another, and thou knowest the person to whom he is like, thou sayest in wonder, "How like this person is to that!" Thou wouldst not say this unless there were two. Here one who does not know the person to whom thou sayest the other is like remarks, "Is he so like him?" And thou answerest him: What, dost thou not know that person? Saith he, "No, I do not." Immediately thou, in order to make known to him the person whom he does not know by means of the person whom he observes before him, answerest, saying, Having seen this man, thou hast seen the other. Thou didst not, surely, assert that they are one person in saying this, or that they are not two; but made such answer because of the likeness: "If thou knowest the one, thou knowest the other; for they are very like, and there is no difference whatever between them." Hence also the Lord saith, "If ye knew me, ye would know my Father also;" not that the Son is the Father but like the Father. Let the Arian blush. Thanks be to the Lord that even the Arian is separate from the Sabellian error, and is not a Patripassian: he does not affirm that the Father assumed flesh and came to men, that the Father suffered, rose again, and somehow ascended to Himself; this he does not affirm; he acknowledges with me the Father to be Father, the Son to be Son. But, O brother, thou hast escaped that shipwreck, why go to the other? Father is Father, Son is Son; why dost thou affirm that the Son is unlike, that He is different, another substance? If He were unlike, would He say to His disciples, "He that hath seen me hath seen the Father"? Would He say to the Jews, "If ye knew me, ye would know my Father also"? How would this be true, unless that other was also true, "I and the Father are one"?
'''
