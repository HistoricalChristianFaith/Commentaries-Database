[[commentary]]
quote='''
“I will never forget,” he saith, “Thy righteousnesses, for with them Thou hast quickened me” (ver. 93). Behold how it was that he did not perish in his humiliation. For, save God quickeneth, what is man, Who can indeed kill, but cannot quicken himself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
