[[commentary]]
quote='''
He exulteth, rejoiceth, exhorteth, he repeateth those same verses in exhortation. “The earth hath given her fruit” (ver. 6). What fruit? “Let all peoples confess to Thee.” Earth it was, of thorns it was full; there came the hand of One rooting them up, there came a calling by His majesty and mercy, the earth began to confess; now the earth giveth her fruit. Would she give her fruit unless first she were rained on? Would she give her fruit, unless first the mercy of God had come from above? Let them read to me, thou sayest, how the earth being rained upon gave her fruit. Hear of the Lord raining upon her: “Repent, for the kingdom of heaven is at hand.” He raineth, and that same rain is thunder; it terrifieth: fear thou Him thundering, and receive Him raining. Behold, after that voice of a thundering and raining God, after that voice let us see something out of the Gospel itself. Behold that harlot of ill fame in the city burst into a strange house into which she had not been invited by the host, but by One invited she had been called; called not with tongue, but by Grace. The sick woman knew that she had there a place, where she was aware that her Physician was sitting at meat. She has gone in, that was a sinner; she dareth not draw near save to the feet: she weepeth at His feet, she washeth with tears, she wipeth with hair, she anointeth with ointment. Why wonderest thou? The earth hath given her fruit. This thing, I say, came to pass by the Lord raining there through His own mouth; there came to pass the things whereof we read in the Gospel; and by His raining through His clouds, by the sending of the Apostles and by their preaching the truth, the earth more abundantly hath given her fruit, and that crop now hath filled the round world.

The fruit of the earth was first in Jerusalem. For from thence began the Church: there came there the Holy Spirit, and filled full the holy men gathered together in one place; miracles were done, with the tongues of all men they spake. They were filled full of the Spirit of God, the people were converted that were in that place, fearing and receiving the divine shower, by confession they brought forth so much fruit, that all their goods they brought together into a common stock, making distribution to the poor, in order that no one might call anything his own, but all things might be to them in common, and they might have one soul and one heart unto God. For there had been forgiven them the blood which they had shed, it had been forgiven them by the Lord pardoning, in order that now they might even learn to drink that which they had shed. Great in that place is the fruit: the earth hath given her fruit, both great fruit, and most excellent fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252067.html'
source_title="Exposition on Psalm 67"
