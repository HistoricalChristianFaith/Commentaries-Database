[[commentary]]
quote='''
“For my father and my mother have left me” (ver. 10). For the kingdom of this world and the city of this world, of which I was born in time and mortality, have left me seeking Thee, and despising what they promised, since they could not give what I seek. “But the Lord took me up.” But the Lord, who can give me Himself, took me up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"

[[commentary]]
quote='''
“The God of Jacob is our taker up.” Make thyself altogether as a little child, such as are taken up by their parents. For those not taken up, are exposed; those taken up are nursed. Thinkest thou God hath so taken thee up, as when an infant thy mother took thee up? Not so, but to eternity. For thy voice is in that Psalm, “My father and my mother forsake me, but the Lord hath taken me up.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
