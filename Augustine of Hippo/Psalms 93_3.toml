[[commentary]]
quote='''
“The floods lift up their voices” (ver. 3). What are these floods, which have lift up their voices? We heard them not: neither when our Lord was born, did we hear rivers speak, nor when He was baptized, nor when He suffered; we heard not that rivers did speak. Read the Gospel, ye find not that rivers spoke. It is not enough that they spoke: “They have lift up their voice:” they have not only spoken, but bravely, mightily, in a lofty voice. What are those rivers which have spoken?…The Spirit itself was a mighty river, whence many rivers were filled. Of that river the Psalmist saith in another passage, “The rivers of the flood thereof shall make glad the city of God.” Rivers then were made to flow from the belly of the disciples, when they received the Holy Spirit: themselves were rivers, when they had received that Holy Spirit. Whence did those rivers lift their voices? wherefore did they lift them up? Because at first they feared. Peter was not yet a river, when at the question of the maid-servant he thrice denied Christ: “I do not know the man.” Here he lieth through fear: he lifteth not his voice as yet: he is not yet the river. But when they were filled with the Holy Spirit, the Jews sent for them, and enjoined them not to preach at all, nor to teach in the name of Jesus.…For when the Apostles had been dismissed from the council of the Jews, they came to their own friends, and told them what the priests and elders said unto them: but they on hearing lifted up their voices with one accord unto the Lord, and said, “Lord, it is Thou who hast made heaven and earth, and the sea, and all that in them is;” and the rest which floods lifting up their voices might say, “Wonderful are the hangings of the sea” (ver. 4).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252093.html'
source_title="Exposition on Psalm 93"
