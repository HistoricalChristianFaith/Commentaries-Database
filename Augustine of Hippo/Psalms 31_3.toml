[[commentary]]
quote='''
“For Thou art My strength, and My refuge” (ver. 3). For Thou art unto Me My strength to bear My persecutors, and My refuge to escape them. “And for Thy Name’s sake Thou shalt be My guide, and shalt nourish Me.” And that by Me Thou mayest be known to all the Gentiles. I will in all things follow Thy will; and, by assembling, by degrees, Saints unto Me, Thou shalt fulfil My body, and My perfect stature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
