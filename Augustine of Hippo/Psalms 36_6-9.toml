[[commentary]]
quote='''
However, even that same health, brethren, is from the Lord, through whomsoever it may be given: by whose care and ministry soever it may be imparted, it is given by Him from whom all health is, to whom it is said in the psalm, "O Lord, Thou wilt save men and beasts; as Thou hast multiplied Thy mercy, O God." For because Thou art God Thy multiplied mercy reaches even to the safety of human flesh, reaches even to the safety of dumb animals; but Thou who givest health of flesh common to men and beasts, is there no health which Thou reservest for men? There is certainly another which is not only not common to men and beasts, but to men themselves is not common to good and bad. In a word, when he had there spoken of this health which men and cattle receive in common, because of that health which men, but only the good, ought to hope for, he added as he went on: "But the sons of men shall put their trust under the cover of Thy wings. They shall be fully satisfied with the fatness of Thy house; and Thou shalt give them drink from the torrent of Thy pleasure. For with Thee is the fountain of life; and in Thy light shall they see light." This is the health which belongs to good men, those whom he called "sons of men;" whilst he had said above, "O Lord, Thou shall save men and beasts." How then? Were not those men sons of men, that after he had said men, he should go on and say, But the sons of men: as if men and sons of men meant different things? Yet I do not believe that the Holy Spirit had said this without some indication of distinction. The term men refers to the first Adam, sons of men to Christ. Perhaps, indeed, men relate to the first man; but sons of men relate to the Son of man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252030.html'
source_title="Tractates on John 30"
