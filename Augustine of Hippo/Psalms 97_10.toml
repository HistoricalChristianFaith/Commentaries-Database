[[commentary]]
quote='''
I should not pass over without investigating the significance of the phrases, to love God and to love one's neighbor. A person who loves God will do the following: obey his command in all respects; observe his laws and precepts; attempt to sanctify himself because God is holy, as is written: "Be holy, because I the Lord your God am holy"; fulfill the direction of the prophet: "You that love the Lord, hate evil"; think of nothing but divine and heavenly subjects, for God is a lover of nothing but holiness, justice and piety; do only what God seems to love.
'''
source_url=''
source_title="ON THE CHRISTIAN LIFE 9"


[[commentary]]
quote='''
Let us love, let us love freely: for we love God, than whom we find nothing better. Let us love Him for Himself, and ourselves in Him, yet for His sake. For he truly loves a friend, who loves God in the friend, either because He is in him, or that He may be in him. This is true love: if we love ourselves for another reason, we hate rather than love. For he who loves iniquity: what does he hate? perhaps his neighbor, perhaps his neighbor's wife? Let him shudder, he hates his own soul. Hatred of the soul, love of wickedness. Therefore, against the hatred of wickedness, love of the soul. You who love the Lord, hate evil. God is good, what you love is evil, and you love yourself in evil: how do you love God when you still love what God hates?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520336.html'
source_title="SERMON 336:2"

[[commentary]]
quote='''
What then do we all, who have assembled before Him, before Him who is exalted far above all gods? He hath given us a brief commandment, “O ye that love the Lord, see that ye hate the thing which is evil!” (ver. 10). Christ doth not deserve that with Him thou shouldest love avarice. Thou lovest Him: thou shouldest hate what He hateth. There is a man who is thine enemy, he is what thou art; ye are the work of one Creator, with the same nature: and yet if thy son were to speak unto thine enemy, and come to his house, and constantly converse with him, thou wouldest be inclined to disinherit him; because he speaketh with thine enemy. And how so? Because thou seemest to say justly, Thou art my enemy’s friend, and seekest thou aught of my property? Attend then. Thou lovest Christ: avarice is Christ’s foe; why speak with her? I say not, speak with her; why dost thou serve her? For Christ commandeth thee to do many things, and thou dost them not; she commandeth thee, and thou dost them. Christ commandeth thee to clothe the poor man: and thou dost it not; avarice biddeth thee defraud, and this thou dost in preference. If such be the case, if such thou art, do not very confidently promise thyself Christ’s heritage. But thou sayest, I love Christ. Hence it appeareth that thou lovest what is good, if thou shalt be found to hate what is evil.…

Because then he had said above, “see that ye hate the thing which is evil,” lest ye should fear to hate evil, lest he should kill thee, he addeth instantly, “The Lord preserveth the souls of His servants.” Hear Him preserving the souls of His servants, and saying, “Fear not them which kill the body, but are not able to kill the soul.” He who hath most power against thee, slayeth the body. What hath he done unto thee? What he also did to the Lord thy God. Why lovest thou to have what Christ hath, if thou fearest to suffer what Christ did? He came to bear thy life, temporal, weak, subject unto death. Surely fear to die, if thou canst avoid dying. What thou canst not avoid through thy nature, why dost thou not undergo by faith? Let the adversary who threateneth take away from thee that life, God giveth thee another life: for He gave thee this life also, and without His will even this shall not be taken from thee; but if it be His will that it be taken from thee, He hath a life to give thee in exchange; fear not to be robbed for His sake. Art thou unwilling to put off a patched garment? He will give thee a robe of glory. What robe dost thou tell me of? “This corruptible must put on incorruption, and this mortal must put on immortality.” This very flesh of thine shall not perish. Thine enemy can rage as far as to thy death: he hath not power beyond, either over thy soul, or even over thy flesh; for although he scatter thy flesh about, he hindereth not the resurrection. Men were fearful for their life: and what said the Lord unto them? “The very hairs of your head are all numbered.” Dost thou, who losest not a single hair, fear the loss of thy life? All things are numbered with God. He who created all things, will restore all things. They were not, and they were created: they were, and shall they not be restored?…“He shall deliver them from the hand of the ungodly.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
