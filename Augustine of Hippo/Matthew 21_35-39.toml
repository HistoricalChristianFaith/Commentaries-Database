[[commentary]]
quote='''
What is her enclosure? Her defence. For she bore herself proudly against her planter. The servants that were sent to her and demanded a recompense, the husbandmen they scourged, beat, slew: there came also the Only Son, they said, “This is the Heir; come, let us kill Him, and our own the inheritance will be:” they killed Him, and out of the vineyard they cast Him forth. When cast forth, He did more perfectly possess the place whence He was cast forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"
