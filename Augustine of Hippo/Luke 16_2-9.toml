[[commentary]]
quote='''
Who is he that looketh out for himself? That servant to whom his master gave what he should expend, and afterwards said to him, “Thou canst not be my steward, give an account of thy stewardship;” and who answered, “What shall I do? I cannot dig, to beg I am ashamed;” had, nevertheless, by even his master’s goods made to himself friends, who might receive him when he was put out of his stewardship. Now he cheated his master in order that he might get to himself friends to receive him: fear not thou lest thou be cheating, the Lord Himself exhorteth thee to do so: He saith Himself to thee, “Make to thyself friends of the mammon of unrighteousness.” Perhaps what thou hast got, thou hast gotten of unrighteousness: or perhaps this very thing is unrighteousness, that thou hast and another hath not, thou aboundest and another needeth. Of this mammon of unrighteousness, of these riches which the unrighteous call riches, make to thyself friends, and thou shalt be prudent: thou art gaining for thyself, and art not cheating. For now thou seemest to lose it. Wilt thou lose it if thou place it in a treasury? For boys, my brethren, no sooner find some money, wherewith to buy something, than they put it in a money-box, which they open not until afterwards: do they, because they see not what they have got, on that account lose it? Fear not: boys put in a money-box, and are secure: dost thou place it in the hand of Christ, and fear? Be prudent, and provide for thyself against the future in Heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"
