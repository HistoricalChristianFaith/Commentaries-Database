[[commentary]]
quote='''
As many, therefore, as are led by their own spirit, trusting in their own virtue, with the addition merely of the law's assistance, without the help of grace, are not the sons of God. Such are they of whom the same apostle speaks as "being ignorant of God's righteousness, and wishing to establish their own righteousness, who have not submitted themselves to the righteousness of God." He said this of the Jews, who in their self-assumption rejected grace, and therefore did not believe in Christ. Their own righteousness, indeed, he says, they wish to establish; and this righteousness is of the law,—not that the law was established by themselves, but that they had constituted their righteousness in the law which is of God, when they supposed themselves able to fulfil that law by their own strength, ignorant of God's righteousness,—not indeed that by which God is Himself righteous, but that which man has from God. And that you may know that he designated as theirs the righteousness which is of the law, and as God's that which man receives from God, hear what he says in another passage, when speaking of Christ: "For whose sake I counted all things not only as loss, but I deemed them to be dung, that I might win Christ, and be found in Him—not having my own righteousness, which is of the law, but that which is through the faith of Christ, which is of God." Now what does he mean by "not having my own righteousness, which is of the law," when the law is really not his at all, but God's,—except this, that he called it his own righteousness, although it was of the law, because he thought he could fulfil the law by his own will, without the aid of grace which is through faith in Christ? Wherefore, after saying, "Not having my own righteousness, which is of the law," he immediately subjoined, "But that which is through the faith of Christ, which is of God." This is what they were ignorant of, of whom he says, "Being ignorant of God's righteousness,"—that is, the righteousness which is of God (for it is given not by the letter, which kills, but by the life-giving Spirit), "and wishing to establish their own righteousness," which he expressly described as the righteousness of the law, when he said, "Not having my own righteousness, which is of the law;" they were not subject to the righteousness of God,—in other words, they submitted not themselves to the grace of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 24"
