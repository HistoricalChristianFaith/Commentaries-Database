[[commentary]]
quote='''
All symbols seem in some way to personify the realities of which they are symbols. So, St. Paul says, "The rock was Christ," because the rock in question symbolized Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252018.html'
source_title="City of God 18.46"

[[commentary]]
quote='''
And our thirst is quenched from the rock in the wilderness: for "the Rock was Christ," and it was smitten with a rod that the water might flow. But that it might flow, the rock was smitten twice: because there are two beams of the cross.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252028.html'
source_title="Tractates on John 28"
