[[commentary]]
quote='''
What in any case are my goods, if not what I have been given by you? And how can the one by whom every good is given be in need of any good?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520331.html'
source_title="SERMON 331:2"


[[commentary]]
quote='''
It is man, not God, who benefits from the whole economy of worship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252010.html'
source_title="City of God 10.5"


[[commentary]]
quote='''
God does not derive any benefit from our worship, but we do. When he reveals or teaches how he is to be worshiped, he does so in our own highest interest, with absolutely no need of anything for himself. All such sacrifices are symbolic; they are a representation of certain things by which our attention is aroused to study or understand or reflect on the realities represented by them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 102:3"

[[commentary]]
quote='''
Let no man fancy that he frightens Christ, when he tells Him that he is a Christian; as if Christ will be more blessed if thou be a Christian. It is a good thing for thee to be a Christian; but if thou be not, it will not be ill for Christ. Hear the voice of the psalm, "I said to the Lord, Thou art my God, since Thou hast no need of my goods." For that reason, "Thou art my God, since of my goods Thou hast no need." If thou be without God, thou wilt be less; if thou be with God, God will not be greater. Not from thee will He be greater, but thou without Him wilt be less. Grow, therefore, in Him; do not withdraw thyself, that He may, as it were, diminish. Thou wilt be renewed if thou come to Him, wilt suffer loss if thou depart from Him. He remains entire when thou comest to Him, remains entire even when thou fallest away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252011.html'
source_title="Tractates on John 11"

[[commentary]]
quote='''
“I have said to the Lord, My God Thou art.” Why? “For my goods Thou needest not.” He needeth not us, we need Him: therefore He is truly Lord. For thou art not the very true Lord of thy servant: both are men, both needing God. But if thou supposest thy servant to need thee, in order that thou mayest give him bread; thou also needest thy servant, in order that he may aid thy labours. Each one of you doth need the other. Therefore neither of you is truly lord, and neither of you truly servant. Hear thou the true Lord, of whom thou art the true servant: “I have said to the Lord, My God Thou art.” Why art Thou Lord? “Because my goods Thou needest not”? But what of thee? “But I am needy and poor.” Behold the needy and poor: may God feed, may God alleviate, may God aid: “O God,” he saith, “aid Thou me.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
source_title="Exposition on Psalm 70"
