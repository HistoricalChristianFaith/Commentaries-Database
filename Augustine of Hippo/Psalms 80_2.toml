[[commentary]]
quote='''
“Before Ephraim and Benjamin and Manasse” (ver. 2). Appear, I say, before the nation of the Jews, before the people of Israel. For there is Ephraim, there Manasses, there Benjamin. But to the interpretation let us look: Ephraim is fruit-bearing, Benjamin son of right hand, Manasses one forgetful. Appear Thou then before one made fruitful, before a son of the right hand: appear Thou before one forgetful, in order that he may be no longer forgetful, but Thou mayest come into his mind that hast delivered him.…For weak Thou wast when it was being said, “If Son of God He is, let Him come down from the Cross.” Thou wast seeming to have no power: the persecutor had power over Thee: and Thou didst show this aforetime, for Jacob too himself prevailed in wrestling, a man with an angel. Would he at any time, except the angel had been willing? And man prevailed, and the angel was conquered: and victorious man holdeth the angel, and saith, “I will not let thee go, except thou shalt have blessed me.” A great sacrament! He both standeth conquered, and blesseth the conqueror. Conquered, because he willed it; in flesh weak, in majesty strong.…Having been crucified of weakness, rise Thou in power: “Stir up Thy power, and come Thou, to save us.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"
