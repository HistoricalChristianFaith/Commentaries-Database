[[commentary]]
quote='''
For we find that some sins are even the punishment of other sins, as are those "vessels of wrath" which the apostle describes as "fitted to destruction;" as is also that hardening of Pharaoh, the purpose of which is said to be to set forth in him the power of God; as, again, is the flight of the Israelites from the face of the enemy before the city of Ai, for fear arose in their heart so that they fled, and this was done that their sin might be punished in the way it was right that it should be; by reason of which the Lord said to Joshua the son of Nun, "The children of Israel shall not be able to stand before the face of their enemies." What is the meaning of, "They shall not be able to stand"? Now, why did they not stand by free will, but, with a will perplexed by fear, took to flight, were it not that God has the lordship even over men's wills, and when He is angry turns to fear whomsoever He pleases?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 41"
