[[commentary]]
quote='''
Then Matthew continues thus: "Likewise also the chief priests, mocking Him, with the scribes and elders, said, He saved others; himself he cannot save: if he be the King of Israel, let him now come down from the cross, and we will believe him. He trusted in God; let Him deliver him now, if He will: for he said, I am the Son of God." Mark and Luke, although they report the words differently, nevertheless agree in conveying the same meaning, although the one passes without notice something which the other mentions. For they are both really at one on the subject of the chief priests, giving us to understand that they insulted the Lord when He was crucified. The only difference is, that Mark does not specify the elders, while Luke, who has instanced the rulers, has not added the designation "of the priests," and thus has rather comprehended the whole body of the leading men under the general designation; so that we may fairly take both the scribes and the elders to be included in his description.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 15"
