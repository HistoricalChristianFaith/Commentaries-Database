[[commentary]]
quote='''
(De Don. Pers. 5.) With this weapon the Pelagian heretics received their deathblow, who dare to say that a righteous man is free altogether from sin in this life, and that of such is at this present time composed a Church, having neither spot nor wrinkle.

(Serm. in Mont. ii. 8.) This is not said of debts of money only, but of all things in which any sins against us, and among these also of money, because that he sins against you, who does not return money due to you, when he has whence he can return it. Unless you forgive this sin you cannot say, Forgive us our debts, as we forgive our debtors.

(Enchir. 73.) Forasmuch as this so great goodness, namely, to forgive debts, and to love our enemies, cannot be possessed by so great a number as we suppose to be heard in the use of this prayer; without doubt the terms of this stipulation are fulfilled, though one have not attained to such proficiency as to love his enemy; yet if when he is requested by one, who has trespassed against him, that he would forgive him, he do forgive him from his heart; for he himself desires to be forgiven then at least when he asks forgiveness. And if one have been moved by a sense of his sin to ask forgiveness of him against whom he has sinned, he is no more to be thought on as an enemy, that there should be any thing hard in loving him, as there was when he was in active enmity.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"Forgive us our debts, as we forgive our debtors." Is this necessary except in this life? For in the other we shall have no debts. For what are debts, but sins? See, ye are on the point of being baptized, then all your sins will be blotted out, none whatever will remain. Whatever evil ye have ever done, in deed, or word, or desire, or thought, all will be blotted out. And yet if in the life which is after Baptism there were security from sin, we should not learn such a prayer as this, "Forgive us our debts." Only let us by all means do what comes next, "As we forgive our debtors." Do ye then who are about to enter in to receive a plenary and entire remission of your debts, do ye above all things see that ye have nothing in your hearts against any other, so as to come forth from Baptism secure, as it were free and discharged of all debts, and then begin to purpose to avenge yourselves on your enemies, who in time past have done you wrong. Forgive, as ye are forgiven. God can do no one wrong, and yet He forgiveth who oweth nothing. How then ought he to forgive, who is himself forgiven, when He forgiveth all, who oweth nothing that can be forgiven Him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2520on%2520Selected%2520Lessons%2520of%2520the%2520New%2520Testament%2FSermon%25207.html'
source_title="Sermon VII [LVII], On the Lord's Prayer"

[[commentary]]
quote='''
It is certainly a bargain to be reckoned with when we say, "Forgive us our trespasses as we forgive those who trespass against us." We can be sure that we have violated that rule if we do not forgive those who ask our pardon, since we too want to be forgiven by our most generous Father with respect to those who seek pardon from us. Now, as to that commandment by which we are ordered to pray for our enemies, we are not ordered to pray for those who seek forgiveness. For such persons are not enemies. In no way, however, can someone really say that he is praying for a person he does not know. Therefore it must be said that we should forgive all sins committed against us if we want the Father to forgive what we have committed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOUR%2520LORD%2527S%2520SERMON%2520ON%2520THE%2520MOUNT%2FBook%25202.html'
source_title="SERMON ON THE MOUNT 2.8.29"

[[commentary]]
quote='''
See ye then, brethren, that ye eat the heavenly bread in a spiritual sense; bring innocence to the altar. Though your sins are daily, at least let them not be deadly. Before ye approach the altar, consider well what ye are to say: "Forgive us our debts, even as we forgive our debtors." Thou forgivest, it shall be forgiven thee: approach in peace, it is bread, not poison. But see whether thou forgivest; for if thou dost not forgive, thou liest, and liest to Him whom thou canst not deceive. Thou canst lie to God, but thou canst not deceive God. He knows what thou doest. He sees thee within, examines thee within, inspects within, judges within, and within He either condemns or crowns.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252026.html'
source_title="Tractates on John 26"

[[commentary]]
quote='''
There is also another usury worse, when thou forgivest not that which to thee is owed; and the eye is disturbed in that verse of the prayer, “Forgive us our debts—as we too forgive our debtors.” For what there wilt thou do, when thou art going to pray, and coming to that same verse? An insulting word thou hast heard: thou wouldest exact the punishment of condemnation. Do but consent to exact just so much as thou hast given, thou usurer of injuries! With the fist thou hast been smitten, slaying thou seekest. Evil usury! How wilt thou go to prayer? If thou shalt have left praying, which way wilt thou come round unto the Lord? Behold thou wilt say: “Our Father which art in heaven, hallowed be Thy Name, Thy kingdom come, Thy will be done, as in heaven so on earth.” Thou wilt say, “Our daily bread give us to-day.” Thou wilt come to, “Forgive us our debts, as we also forgive our debtors.” Even in that evil city let there abound these usuries; let them not enter the walls where the breast is smitten! What wilt thou do? because there thou and that verse are in the midst? Petitions for thee hath a heavenly Lawyer composed. He that knew what used there to be done, said to thee, “Otherwise thou shalt not obtain.” “Verily, verily, I say unto you, that if ye shall have forgiven men sins, they shall be forgiven you; but if ye shall not have forgiven sins unto men, neither will your Father forgive you.” Who saith this? He that knoweth what there is being done, in the place whereat thou art standing to make request. See how Himself hath willed to be thy Advocate; Himself thy Counsellor, Himself the Assessor of the Father, Himself thy Judge hath said, “Otherwise thou shalt not receive.” What wilt thou do? Thou wilt not receive, unless thou shalt speak; wilt not receive if falsely thou shalt speak. Therefore either thou must do and speak, or else what thou askest thou wilt not earn; because they that this do not do, are in the midst of those evil usuries. Be they engaged therein, that yet do idols either adore or desire: do not thou, O people of God, do not thou, O people of Christ, do not thou the Body of Him the Head! Give heed to the bond of thy peace, give heed to the promise of thy life. For what doth it profit thee, that thou exactest for injuries which thou hast endured? doth vengeance refresh thee? Therefore, over the evil of another shalt thou rejoice? Thou hast suffered evil; pardon thou; be not ye two.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"

[[commentary]]
quote='''
What of the Apostles themselves?…That ye may perceive it at once, they learnt to pray what we pray: to them was given the pattern of prayer by the heavenly Counsellor. “After this manner,” saith He, “pray ye.” And having set down certain things first, He laid down this too to be said by the leaders of the sheep, the chief members of the Shepherd and Gatherer of the one flock; even they learnt to say, “Forgive us our debts.” They said not, “Thanks be to Thee, who hast forgiven us our debts, as we too forgive our debtors,” but, “Forgive, as we forgive.” But surely the faithful prayed then, surely the Apostles prayed then, for this Lord’s Prayer was given rather to the faithful. If those debts only were meant which are forgiven by Baptism, it would befit catechumens rather to say, “Forgive us our debts.” Let the Apostles then say, yea let them say, “Forgive us our debts.” And when it is said to them, “Wherefore say ye this? what are your debts?” let them answer, “for in Thy sight every one living shall not be justified.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520143.html'
source_title="Exposition on Psalm 143"
