[[commentary]]
quote='''
“O God, my life I have told out to Thee” (ver. 8). For that I live hath been Thy doing, and for this reason I tell out my life to Thee. But did not God know that which He had given? What is that which thou tellest out to Him? Wilt thou teach God? Far be it. Therefore why saith he, “I have told out to Thee”? Is it perchance because it profiteth Thee that I have told out my life? And what doth it profit God? To the advantage of God it doth profit. I have told out to God my life, because that life hath been God’s doing. In like manner as his life Paul the Apostle did tell out, saying, “I that before was a blasphemer and a persecutor and injurious,” he shall tell out his life. “But mercy I have obtained.” He hath told out his life, not for himself, but for Him: because he hath told it out in such sort, that in Him men believe, not for his own advantages, but for the advantages of Him.…“O God, my life I have told out to Thee. Thou hast put my tears in Thy sight.” Thou hast hearkened to me imploring Thee. “As also in Thy promise.” Because as Thou hadst promised this thing, so Thou hast done. Thou hast said Thou wouldest hearken to one weeping. I have believed, I have wept, I have been hearkened unto; I have found Thee merciful in promising, true in repaying.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"
