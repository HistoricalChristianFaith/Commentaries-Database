[[commentary]]
quote='''
“The furrows thereof inebriate Thou” (ver. 10). Let there be made therefore at first furrows to be inebriated: let the hardness of our breast be opened with the share of the word of God, “The furrows thereof inebriate Thou: multiply the generations thereof.” We see, they believe, and by them believing other men believe, and because of those others believe; and it is not sufficient for one man, that having become himself a believer, he should gain one. So is multiplied seed too: a few grains are scattered, and fields spring up. “In the drops thereof it shall rejoice, when it shall rise up.” That is, before it be perchance enlarged to the bulk of a river, “when it shall rise up, in its drops,” that is, in those meet for it, “it shall rejoice.” For upon those that are yet babes, and upon the weak, are dropped some portions of the sacraments, because they cannot receive the fulness of the truth. Hear in what manner he droppeth upon babes, while they are rising up, that is, in their recent rising having small capacities: the Apostle saith, “To you I could not speak as if to spiritual, but as if to carnal, as if to babes in Christ.” When he saith, “to babes in Christ,” he speaketh of them as already risen up, but not yet meet to receive that plenteous wisdom, whereof he saith, “Wisdom we speak among perfect men.” Let it rejoice in its drops, while it is rising up and is growing, when strengthened it shall receive wisdom also: in the same manner as an infant is fed with milk, and becometh fit for meat, and nevertheless at first out of that very meat for which it was not fit, for it milk is made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252065.html'
source_title="Exposition on Psalm 65"
