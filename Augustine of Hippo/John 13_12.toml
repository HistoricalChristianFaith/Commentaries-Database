[[commentary]]
quote='''
(Tr. lviii. 2) Our Lord, mindful of His promise to Peter that he should know the meaning of His act, Thou shalt know hereafter, now begins to teach him: So after He had washed their feet, and had taken His garments, and was sat down again, He said unto them, Know ye what I have done to you?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"So, after He had washed their feet, and had taken His garments, and was set down again, He said unto them, Know ye what I have done to you?" Now it is that the blessed Peter gets that promise fulfilled: for he had been put off when, in the midst of his trembling and asserting, "Thou shalt never wash my feet," he received the answer, "What I do, thou knowest not now, but thou shalt know hereafter" (vers. 7, 8). Here, then, is that very hereafter; it is now time to tell what was a little ago deferred. Accordingly, the Lord, mindful of His foregoing promise to make him understand an act of His so unexpected, so wonderful, so frightening, and, but for His own still more terrifying rejoinder, impossible to be permitted, that the Master not only of themselves, but of angels, and the Lord not only of them, but of all things, should wash the feet of His own disciples and servants: having then promised to let him know the meaning of so important an act, when He said, "Thou shalt know afterwards," begins now to show them what it was that He did.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252058.html'
source_title="Tractates on John 58"
