[[commentary]]
quote='''
“I have not sat with the council of vanity” (ver. 4). I have not chosen to give my heart to them who endeavour to provide, what is impossible, how they may be blessed in the enjoyment of things transitory. “And I will not enter in with them that work wickedly.” And since this is the very cause of all wickedness, therefore I will not have my conscience hid, with them that work wickedly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252026.html'
source_title="Exposition on Psalm 26"
