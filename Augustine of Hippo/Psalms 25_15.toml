[[commentary]]
quote='''
“Mine eyes are ever unto the Lord; for He shall pluck my feet out of the snare” (ver. 15). Nor would I fear the dangers of earth, while I look not upon the earth: for He upon whom I look, will pluck my feet out of the snare.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
