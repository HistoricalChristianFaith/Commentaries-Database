[[commentary]]
quote='''
“Behold I have gone afar fleeing, and have abode in the desert” (ver. 7). In what desert? Wherever thou shalt be, there will gather them together other men, the desert with thee they will seek, will attach themselves to thy life, thou canst not thrust back the society of brethren: there are mingled with thee also evil men; still exercise is thy due portion, “Behold I have gone afar, and have abode in the desert.” In what desert? It is perchance in the conscience, whither no man entereth, where no one is with thee, where thou art and God. For if in the desert, in any place, what wilt thou do with men gathering themselves together? For thou wilt not be able to be separated from mankind, so long as among men thou livest.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
