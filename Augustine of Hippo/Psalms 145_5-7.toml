[[commentary]]
quote='''
“They shall speak of the magnificence of the glory of Thy Holiness, and shall record Thy wondrous deeds” (ver. 5). “And the excellence of Thy fearful works shall they speak of: and Thy greatness, they shall relate it” (ver. 6). “The remembrance of the abundance of Thy sweetness they shall pour forth” (ver. 7): none but Thine. See whether this man, meditating on Thy works, hath turned aside from the Worker to the work: see whether he hath sunk from Him who made, to the things which He made. Of the things which He hath made, he hath made a step up to Him, not a descent from Him to them. For if thou love these more than Him, thou wilt not have Him. And what profit is it to thee to overflow with the works, if the Worker leave thee? Truly thou shouldest love them; but love Him more, and love them for His sake. For He doth not hold out promises, without holding out threats also: if He held out no promises, there would be no encouragement; if He held out no threats, there would be no correction. They that praise Thee therefore shall “speak” also “of the excellence of Thy terrible deeds;” the excellence of that work of Thy hands which punisheth and administereth discipline, they shall speak of, they shall not be silent: for they shall not proclaim Thine everlasting kingdom, and be silent about Thine everlasting fire. For the praise of God, setting thee in the way, ought to show thee both what thou shouldest love, and what thou shouldest fear; what thou shouldest seek, and what thou shouldest shun; what thou shouldest choose, and what thou shouldest avoid. The time of choice is now, the time of receiving will be hereafter. Let then the excellence of Thy terrible things be told. Unlimited as it is, though “of Thy greatness there is no end,” they shall not be silent about it. How shall they recount it, if there is no end of it? They shall recount it when they praise it; and because there is no end of it, so of His praise also there shall be no end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520145.html'
source_title="Exposition on Psalm 145"
