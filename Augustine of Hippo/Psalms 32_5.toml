
[[commentary]]
quote='''
“I acknowledged my sin, and my unrighteousness have I not hid:” that is, my unrighteousness have I not concealed. “I said, I will confess against myself my unrighteousness to the Lord:” I said, I will confess, not against God (as in my ungodly crying, when I kept silence), but against myself, my unrighteousness to the Lord. “And Thou forgavest the iniquity of my heart” (ver. 5); hearing the word of confession in the heart, before it was uttered with the voice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252032.html'
source_title="Exposition on Psalm 32"
