[[commentary]]
quote='''
For not because I have fallen, hast Thou grown old: for Thou art strong to set me free, who hast been strong to humble me. “But Thou, O Lord, endurest for ever: and Thy remembrance throughout all generations” (ver. 12). “Thy remembrance,” because Thou dost not forget: “throughout all generations,” forasmuch as we know the promise of life, both present and future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
