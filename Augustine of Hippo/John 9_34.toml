[[commentary]]
quote='''
(Tr. xliv. 14) What meaneth altogether? That he was quite blind. Yet He who opened his eyes, also saves him altogether.

(Tr. xliv. 14) It was they themselves who had made him teacher; themselves, who had asked him so many questions; and now they ungratefully cast him out for teaching.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"They answered and said unto him, Thou wast wholly born in sins." What means this "wholly"? Even to blindness of the eyes. But He who has opened his eyes, also saves him wholly: He will grant a resurrection at His right hand, who gave enlightenment to his countenance. "Thou wast altogether born in sins, and dost thou teach us? And they cast him out." They had made him their master; many questions had they asked for their own instruction, and they ungratefully cast forth their teacher.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252044.html'
source_title="Tractates on John 44"
