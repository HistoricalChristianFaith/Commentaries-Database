[[commentary]]
quote='''
Consequently, let us now take up the subject which we had postponed, and inquire what mystical meaning may underlie the report given by Matthew and Mark, namely, that on rising He made this statement, "I will go before you into Galilee: there shall ye see me." For this announcement, if it was fulfilled at all, was certainly not fulfilled till a considerable interval had elapsed; whereas it is couched in terms which seem to lead us (although such a conclusion is not an absolute necessity) most naturally to expect that the appearance referred to would be either the only one or the first that would ensue. We observe, however, that the words in question are not given as the words of the evangelist himself, in the form of a narrative of a past occurrence, but as the words of the angel, who spoke according to the Lord's commission, and subsequently also as the words of the Lord Himself; that is to say, the words are used by the evangelist in his narrative, but they are presented by him as a direct statement of what was spoken by the angel and by the Lord. This, therefore, unquestionably compels us to accept them as uttered prophetically. Now Galilee may be interpreted to mean either "Transmigration" or "Revelation." Consequently, if we adopt the idea of "Transmigration," what other sense occurs to us to put upon the sentence," He goeth before you into Galilee, there shall you see Him," but just this, that the grace of Christ was to be transferred from the people of Israel to the Gentiles? That in preaching the gospel to these Gentiles, the apostles would meet with no acceptance unless the Lord prepared a way for them in the hearts of men,—this may be what is to be understood by the sentence, "He goeth before you into Galilee." And, again, that they would look with joy and wonder at the breaking down and removing of difficulties, and at the opening of a door for them in the Lord through the enlightenment of the believing,—this is what is to be understood by the words, "there shall ye see Him;" that is to say, there shall ye find His members, there shall ye recognise His living body in the person of those who shall receive you. Or, if we follow the second view which takes Galilee to signify "Revelation," the idea may be, that He was now no more to be in the form of a servant, but in that form in which He is equal with the Father; as He promised to those who loved Him when He said, according to the testimony of John, "And I will love him, and will manifest myself to him." That is to say, He was afterwards to manifest Himself, not merely as they saw Him before, nor merely in the way in which, rising as He did with His wounds upon Him, He was to give Himself to be touched as well as seen by them, but in the character of that ineffable light, wherewith He enlightens every man that cometh into this world, and in virtue of which He shineth in darkness, and the darkness comprehends Him not. Thus has He gone before us to something from which He withdraws not, although He comes to us, and which does not involve His leaving us, although He has preceded us thither. That will be a revelation which may be spoken of as a true Galilee, when we shall be like Him; there shall we see Him as He is. Then, also, will there be for us the more blessed transmigration, from this world into that eternity, if we embrace His precepts so as to be counted worthy of being set apart on His right hand. For there, those on the left hand shall go away into eternal burning, but the righteous into life eternal. Hence they shall pass thither, and there, shall they see Him, as the wicked do not see Him. For the wicked shall be taken away, so that he shall not see the brightness of the Lord; and the unrighteousness shall not see the light. For He says, "And this is life eternal, that they might know Thee, the only true God, and Jesus Christ, whom Thou hast sent;" even as He shall be known in that eternity to which He will bring His servants by the form of a servant, in order that in liberty they may contemplate the form of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
