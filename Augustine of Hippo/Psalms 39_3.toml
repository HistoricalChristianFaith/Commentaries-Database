[[commentary]]
quote='''
“And while I was musing, the fire burned” (ver. 3).…I reflected on the words of my Lord, “Thou wicked and slothful servant, thou oughtest to have put My money to the exchangers, and I at My coming should receive it again with usury.” And that which follows may God avert from those who are His stewards! Bind him hand and foot, and let him be cast into outer darkness; the servant, who was not a waster of his master’s goods, so as to destroy them, but was slothful in laying them out to improve them. What ought they to expect, who have wasted them in luxury, if they are condemned who through slothfulness have kept them? “As I was musing, the fire burned.” And as he was in this state of wavering suspense, between speaking and holding his peace, between those who are prepared to cavil and those who are anxious to be instructed,…in this state of suspense, he prays for a better place, a place different from this his present stewardship, in which man is in such difficulty and in such danger, and sighing after a certain “end,” when he was not to be subject to these things, when the Lord is to say to the faithful dispenser, “Enter thou into the joy of thy Lord,” he says, “Then spake I with my tongue.” In this fluctuation, in the midst of these dangers and these difficulties, because, that in consequence of the abundance of offences “the love of many is waxing cold,” although the law of the Lord inspires delight, in this fluctuation then, (I say), “then spake I with my tongue.” To whom? not to the hearer whom I would fain instruct; but to Him who heareth and taketh heed also, by whom I would fain be instructed myself. “I spake with my tongue” to Him, from whom I inwardly hear whatever I hear that is good or true.—What saidst thou?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252039.html'
source_title="Exposition on Psalm 39"
