[[commentary]]
quote='''
“Preparing mountains in His strength” (ver. 6). Not in their strength. For He hath prepared great preachers, and those same He hath called mountains; humble in themselves, exalted in Him. “Preparing mountains in His strength.” What saith one of those same mountains? “We ourselves in our own selves have had the answer of death, in order that in ourselves we should not trust, but in God that raiseth the dead.” He that in himself doth trust, and in Christ trusteth not, is not of those mountains which He hath prepared in His strength. “Preparing mountains in His strength: girded about in power.” “Power,” I understand: “girded about,” is what? They that put Christ in the midst, “girded about” they make Him, that is on all sides begirt. We all have Him in common, therefore in the midst He is: all we gird Him about that believe in Him: and because our faith is not of our strength, but of His power; therefore girded about He is in His power; not in our own strength.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252065.html'
source_title="Exposition on Psalm 65"
