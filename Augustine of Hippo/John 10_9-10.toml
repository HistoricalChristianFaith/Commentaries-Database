[[commentary]]
quote='''
But I am better pleased that the Truth Himself, like a good Shepherd, and therefore a good Teacher, hath in a certain measure reminded us how we ought to understand His words, "He shall go in and out, and find pasture," when He added in the sequel, "The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly." For He seems to me to have meant, That they may have life in coming in, and have it more abundantly at their departure. For no one can pass out by the door-that is, by Christ-to that eternal life which shall be open to the sight, unless by the same door-that is, by the same Christ-he has entered His church, which is His fold, to the temporal life, which is lived in faith. Therefore, He saith, "I am come that they may have life," that is, faith, which worketh by love; by which faith they enter the fold that they may live, for the just liveth by faith: "and that they may have it more abundantly," who, enduring unto the end, pass out by this same door, that is, by the faith of Christ; for as true believers they die, and will have life more abundantly when they come whither the Shepherd hath preceded them, where they shall die no more. Although, therefore, there is no want of pasture even here in the fold,-for we may understand the words "and shall find pasture" as referring to both, that is, both to their going in and their going out,-yet there only will they find the true pasture. where they shall be filled who hunger and thirst after righteousness, -such pasture as was found by him to whom it was said, "To-day shalt thou be with me in paradise." But how He Himself is the door, and Himself the Shepherd, so that He also may in a certain respect be understood as going in and out by Himself, and who is the porter, it would be too long to inquire to-day, and, according to the grace given us by Himself, to unfold in the way of dissertation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252045.html'
source_title="Tractates on John 45"
