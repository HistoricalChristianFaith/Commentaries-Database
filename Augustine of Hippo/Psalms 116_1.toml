[[commentary]]
quote='''
“I have loved, since the Lord will hear the voice of my prayer” (ver. 1). Let the soul that is sojourning in absence from the Lord sing thus, let that sheep which had strayed sing thus, let that son who had “died and returned to life,” who had “been lost and was found;” let our soul sing thus, brethren, and most beloved sons. Let us be taught, and let us abide, and let us sing thus with the Saints: “I have loved: since the Lord will hear the voice of my prayer.” Is this a reason for having loved, that the Lord will hear the voice of my prayer? and do we not rather love, because He hath heard, or that He may hear? What then meaneth, “I have loved, since the Lord will hear”? Doth he, because hope is wont to inflame love, say that he hath loved, since he hath hoped that God will listen to the voice of his prayer?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520116.html'
source_title="Exposition on Psalm 116"
