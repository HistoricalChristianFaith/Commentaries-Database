[[commentary]]
quote='''
"Then were the disciples glad when they saw the Lord. Then said He unto them again, Peace be unto you." Reiteration is confirmation; for He Himself gives by the prophet a promised peace upon peace. "As the Father hath sent me," He adds, "even so send I you." We know the Son to be equal to the Father; but here we recognize the words of the Mediator. For He exhibits Himself as occupying a middle position when He says, He me, and I you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520121.html'
source_title="Tractates on John 121"
