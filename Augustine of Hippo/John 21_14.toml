[[commentary]]
quote='''
(Tract. cxxiii. 3) Which has reference not to manifestations, but to days; i. e. the first day after He had risen, eight days after that, when Thomas saw and believed, and this day at the draught of fishes; and thenceforward as often as He saw them, up to the time of His ascension.

(de Con. Evang. iii. 25.) We find in the four Evangelists ten occasions mentioned, on which our Lord was seen after His resurrection: one at the sepulchre by the women; a second by the women returning from the sepulchre; a third by Peter; a fourth by the two going to Emmaus; a fifth in Jerusalem, when Thomas was not present; a sixth when Thomas saw Him; a seventh at the sea of Tiberias; an eighth by all the eleven on a mountain of Galilee, mentioned by Matthew; a ninth when for the last time He sat at meat with the disciples; a tenth when He was seen no longer upon earth, but high up on a cloud.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"This was now," he says, "the third time that Jesus showed Himself to His disciples after that He was risen from the dead." And this we are to refer not to the manifestations themselves, but to the days that is to say, taking the first day when He rose again, and the [second] eight days after, when the disciple Thomas saw and believed, and [the third] on this day when He so acted in connection with the fishes, although how many days afterwards it was that He did so we are not told); for on that first day He was seen more than once, as is shown by the collated testimonies of all the evangelists: but, as we have said, it is in accordance with the days that His manifestations are to be calculated, making this the third; for that [manifestation] is to be reckoned the first, and all one and the same, as included in one day, however often and to however many He showed Himself on the day of His resurrection; the second eight days afterwards, and this the third, and thereafter as often as He pleased on to the fortieth day, when He ascended into heaven, although all of them have not been recorded in Scripture.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520123.html'
source_title="Tractates on John 123"

[[commentary]]
quote='''
In the first place, however, we must also consider the question of the time at which He may thus have shown Himself in bodily form in Galilee, according to the statement given by Matthew in these terms: "Then the eleven disciples went away into Galilee into a mountain where Jesus had appointed them; and when they saw Him, they worshipped Him; but some doubted." That it was not on the day of His resurrection is manifest. For Luke and John agree in telling us most plainly that He was seen in Jerusalem that very day, when the night was coming on; while Mark is not so clear on the subject. When was it, then, that they saw the Lord in Galilee? I do not refer to the appearance mentioned by John, by the sea of Tiberias; for on that occasion there were only seven of them present, and they were found fishing. But I mean the appearance detailed by Matthew, when the eleven were on the mountain, to which Jesus had gone before them, according to the announcement made by the angel. For the import of Matthew's statement appears to be this, that they found Him there just because He had gone before them according to appointment. It did not take place, then, either on the day on which He rose, or in the eight days that followed, after which space John states that the Lord showed Himself to the disciples, when Thomas, who had not seen Him on the day of His resurrection, saw Him for the first time. For, surely, on the supposition that the eleven had really seen Him on the mountain in Galilee within the period of these eight days, it may well be asked how Thomas, who had been of the number of these eleven, could be said to have seen Him for the first time at the end of these eight days. To that question there is no answer, unless, indeed, one could say that they were not the eleven, who by that time bore the specific designation of Apostles, but some other eleven disciples singled out of the numerous body of His followers. For those eleven were, indeed, the only persons who were yet called by the name of Apostles, but they were not the only disciples. It may perhaps be the case, therefore, that the apostles are really referred to; that not all but only some of them were there; that there were also other disciples with them, so that the number of persons present was made up to eleven; and that Thomas, who saw the Lord for the first time at the end of those eight days, was absent on this occasion. For when Mark mentions the said eleven, he does not use the general expression "eleven," but says explicitly, "He appeared unto the eleven." Luke, likewise, puts it thus: "They returned to Jerusalem, and found the eleven gathered together, and them that were with them." There he gives us to understand that these were the eleven—that is to say, the apostles. For when he adds, "and those who were with them," he has surely indicated plainly enough, that those with whom these others were, were styled "the eleven" in some eminent sense; and this leads us to understand those to be meant who were now called distinctively Apostles. Consequently, it is quite possible that, out of the body of apostles and other disciples, the number of eleven disciples was made up who saw Jesus upon the mountain in Galilee, within the space of these eight days.

But another difficulty in the way of this settlement arises here. For, when John has recorded how the Lord was seen, not by the eleven on the mountain, but by seven of them when they were fishing in the sea of Tiberias, he appends the following statement: "This is now the third time that Jesus showed Himself to His disciples, after that He was risen from the dead." Now, if we accept the theory that the Lord was seen by the company of the eleven disciples within the period of these eight days, and previous to His being seen by Thomas, this scene by the sea of Tiberias will not be the third but the fourth time that He showed Himself. Here, indeed, we must take care not to let any one suppose that, in speaking of the third time, John meant that there were in all only three appearances of the Lord. On the contrary, we must understand him to refer to the number of the days, and not to the number of the manifestations themselves; and, further, it is to be observed that these days are not presented as coming in immediate succession after each other, but as separated by intervals in accordance with intimations given by the evangelist himself. For, keeping out of view His appearance to the women, it is made perfectly plain in the Gospel that He showed Himself three several times on the first day after He was risen; namely, once to Peter; again to those two disciples, of whom Cleophas was one; and a third time to the larger body, while they were conversing with each other as the night came on. But all these John, looking to the fact that they took place on a single day, reckons as one appearance. Then he identifies a second—that is to say, an appearance on another day—with the occasion on which Thomas also saw Him; and he particularizes a third by the sea of Tiberias, that is to say, not literally His third appearance, but the third day of His self-manifestations. Thus the result is, that after all these incidents, we are constrained to suppose this other occasion to have occurred on which, according to Matthew, the eleven disciples saw Him on the mountain in Galilee, to which He had gone before them according to appointment, so that all that had been foretold, both by the angel and by Himself, should be fulfilled even to the letter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
