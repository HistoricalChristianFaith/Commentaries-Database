[[commentary]]
quote='''
“Let My judgment from Thy countenance go forth” (ver. 2). From the enlightening of the knowledge of Thee, let Me judge truth. Or at least, let My judgment go forth, not in deceitful lips, from Thy countenance, that is, that I may not in judging utter aught else than I understand in Thee. “Let Mine eyes see equity:” the eyes, of course, of the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252017.html'
source_title="Exposition on Psalm 17"
