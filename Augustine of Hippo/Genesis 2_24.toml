[[commentary]]
quote='''
Scripture said, "A man will leave father and mother, and he will cling to his wife, and they will be two in one flesh." This is what generally happens in the human race. There is no other way to view its plain, historical sense. But more so, this is all prophecy, and the apostle reminds us of this when he says, "For this reason a man will leave his father and mother and he will cling to his wife, and they will be two in one flesh. This is a great mystery; I mean in Christ and in the church."
'''
source_url=''
source_title="TWO BOOKS ON GENESIS AGAINST THE MANICHAEANS 2.13.19"

[[commentary]]
quote='''
In the very beginning, Adam and Eve were the parents of all nations, not of the Jews only; and whatever was represented in Adam concerning Christ, undoubtedly concerned all nations, whose salvation is in Christ. What better can I say of the water of the first water-pot than what the apostle says of Adam and Eve? For no man will say that I misunderstand the meaning when I produce, not my own, but the apostle's. How great a mystery, then, concerning Christ does that of which the apostle makes mention contain, when he says, "And the two shall be in one flesh: this is a great mystery!" And lest any man should understand that greatness of mystery to exist in the case of the individual men that have wives, he says, "But I speak concerning Christ and the Church." What great mystery is this, "the two shall be one flesh?" While Scripture, in the Book of Genesis, was speaking of Adam and Eve, it came to these words, "Therefore shall a man leave his father and mother, and shall cleave to his wife; and they two shall be one flesh." Now, if Christ cleave to the Church, so that the two should be one flesh, in what manner did He leave His Father and His mother? He left His Father in this sense, that when He was in the form of God, He thought it not robbery to be equal with God, but emptied Himself, taking to Him the form of a servant. In this sense He left His Father, not that He forsook or departed from His Father, but that He did not appear unto men in that form in which He was equal with the Father. But how did He leave His mother? By leaving the synagogue of the Jews, of which, after the flesh, He was born, and by cleaving to the Church which He has gathered out of all nations. Thus the first water-pot then held a prophecy of Christ; but so long as these things of which I speak were not preached among the peoples, the prophecy was water, it was not yet changed into wine. And since the Lord has enlightened us through the apostle, to show us what we were in search of, by this one sentence, "The two shall be one flesh; a great mystery concerning Christ and the Church;" we are now permitted to seek Christ everywhere, and to drink wine from all the water-pots. Adam sleeps, that Eve may be formed; Christ dies, that the Church may be formed. When Adam sleeps, Eve is formed from his side; when Christ is dead, the spear pierces His side, that the mysteries may flow forth whereby the Church is formed. Is it not evident to every man that in those things then done, things to come were foreshadowed, since the apostle says that Adam himself was the figure of Him that was to come? "Who is," saith he, "the figure of Him that was to come." All was mystically prefigured. For, in reality, God could have taken the rib from Adam when he was awake, and formed the woman. Or was it, haply, necessary for him to sleep lest he should feel pain in his side when the rib was taken away? Who is there that sleeps so soundly that his bones may be torn from him without his awaking? Or was it because it was God that tore it out, that the man did not feel it? Well, He who could take it from him without pain when he was asleep, could do it also when he was awake. But, without doubt, the first water-pot was being filled, there was a dispensation of the prophecy of that time concerning this which was to be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25209.html'
source_title="Tractates on John 9"
