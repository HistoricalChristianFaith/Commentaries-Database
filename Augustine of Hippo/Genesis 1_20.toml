[[commentary]]
quote='''
[The Manichaeans] usually find fault, questioning and often misrepresenting Scripture for saying that not merely those animals that live in the water but also those that fly in the air and all winged creatures were born from the waters. Let them know that learned men who carefully investigate these matters usually include with the water this cloudy and moist air in which the birds fly. For it comes together and becomes dense with the exhalations and what I might call vapors of the sea so that it can support the flight of birds. Thus on calm nights it produces dew, and drops of this dew are found on the grass in the morning.
'''
source_url=''
source_title="TWO BOOKS ON GENESIS AGAINST THE MANICHAEANS 1.15.24"


[[commentary]]
quote='''
Wherefore also “on the fifth of the sabbath”? What is this? Let us go back to the first works of God, if perchance we may not there find somewhat in which we may also understand a mystery. For the sabbath is the seventh day, on which “God rested from all His works,” intimating the great mystery of our future resting from all our works. First of the sabbath then is called that first day, which we also call the Lord’s day; second of the sabbath, the second day;…and the sabbath itself the seventh day. See ye therefore to whom this Psalm speaketh. For it seems to me that it speaketh to the baptized. For on the fifth day God from the waters created animals: on the fifth day, that is, on the “fifth of the sabbath,” God said, “Let the waters bring forth creeping things of living souls.” See ye, therefore, ye in whom the waters have already brought forth creeping things of living souls. For ye belong to the presses, and in you, whom the waters have brought forth, one thing is strained out, another is thrown away. For there are many that live not worthily of the baptism which they have received. For how many that are baptized have chosen rather to be filling the Circus than this Basilica! How many that are baptized are either making booths in the streets, or complaining that they are not made!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252081.html'
source_title="Exposition on Psalm 81"
