[[commentary]]
quote='''
“He shall judge among the heathen: He shall fill up what hath fallen” (ver. 6). Whoever thou art who art obstinate against Christ, thou hast raised on high a tower that must fall. It is good that thou shouldest cast thyself down, become humble, throw thyself at the feet of Him who sitteth on the right hand of the Father, that in thee a ruin may be made to be built up. For if thou abidest in thy evil height, thou shalt be cast down when thou canst not be built up. For of such the Scripture saith in another passage: “Therefore shall He break down, and not build them up.” Beyond doubt he would not say this of some, unless there were some whom He broke down so as to build them up again. And this is going on at this time, while Christ is judging among the heathen in such a manner as to fill up what hath fallen. “He shall smite many heads over the earth.” Here upon the earth in this life He shall smite many heads. He maketh them humble instead of proud; and I dare to say, my brethren, that it is more profitable to walk here humbly with the head wounded, than with the head erect to fall into the judgment of eternal death. He will smite many heads when he causeth them to fall, but He will fill them up and build them up again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520110.html'
source_title="Exposition on Psalm 110"
