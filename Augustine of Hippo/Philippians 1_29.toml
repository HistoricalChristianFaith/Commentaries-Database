[[commentary]]
quote='''
And there are many other passages of similar import,—among them that in which he bids us "think soberly, according as God hath dealt out to every man the proportion of faith;" and that which I have already quoted: "By grace are ye saved through faith; and that not of yourselves; it is the gift of God;" and again another in the same Epistle to the Ephesians: "Peace be to the brethren, and love with faith, from God the Father, and the Lord Jesus Christ;" and to the same effect that passage in which he says, "For unto you it is given in the behalf of Christ not only to believe on Him, but also to suffer for His sake." Both alike are therefore due to the grace of God,—the faith of those who believe, and the patience of those who suffer, because the apostle spoke of both as given.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 28"
