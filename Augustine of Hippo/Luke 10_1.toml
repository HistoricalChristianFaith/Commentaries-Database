[[commentary]]
quote='''
(de Quæst. Ev. 1. ii. q. 14.) As also in twenty-four hours the whole world moves round and receives light, so the mystery of enlightening the world by the Gospel of the Trinity, is hinted at in the seventy-two disciples. For three times twenty-four makes seventy-two. Now as no one doubts that the twelve Apostles foreshadowed the order of Bishops, so also we must know that these seventy-two represented the presbytery, (that is, the second order of priests.) Nevertheless, in the earliest times of the Church, as the Apostolical writings bear witness, both were called presbyters, both also called bishops, the former of these signifying "ripeness of wisdom," the latter, "diligence in the pastoral care."
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And thereafter Luke proceeds to another subject altogether, and not to what followed in the actual order of time. The passage runs: "And after these things, the Lord appointed other seventy-two also." That this occurred "after these things"is indeed manifest; but at what length of time after these things the Lord did so is not apparent. Nevertheless, in this interval that took place which Matthew subjoins next in succession. For the same Matthew still keeps up the order of time, and continues his narrative, as we shall now see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 23"
