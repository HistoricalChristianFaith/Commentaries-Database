[[commentary]]
quote='''
And what do we pray for when we say, "Forgive us our debts," but for the healing of our wounds? And what else do we ask, when we say, "Lead us not into temptation," but that he who thus lies in wait for us, or assails us from without, may fail on every side to effect an entrance, and be unable to overcome us either by fraud or force?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252052.html'
source_title="Tractates on John 52"

[[commentary]]
quote='''
They also maintain that God's grace, which is given through the faith of Jesus Christ, and which is neither the law nor nature, avails only for the remission of sins that have been committed, and not for the shunning of future ones, or the subjugation of those which are now assailing us. Now if all this were true, surely after offering the petition of the Lord's Prayer, "Forgive us our debts, as we forgive our debtors," we could hardly go on and say, "And lead us not into temptation." The former petition we present that our sins may be forgiven; the latter, that they may be avoided or subdued,—a favour which we should by no means beg of our Father who is in heaven if we were able to accomplish it by the virtue of our human will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 26"
