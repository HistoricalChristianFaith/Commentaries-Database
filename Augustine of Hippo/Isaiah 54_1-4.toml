[[commentary]]
quote='''
Fulfilled be that prophecy wherein Isaiah in Thy person speaketh to Thy Church, Thy holy City, that barren one of whom many more are the sons of Her forsaken than of her that hath a husband. To Her indeed hath been said, “Rejoice, thou barren, that bearest not,” etc., more than of the Jewish nation which hath a Husband, which hath received the Law, more than of that nation which had a visible king. For thy king is hidden, and more sons to thee there are by a hidden Bridegroom.…The Prophet addeth, “Enlarge the place of Thy tabernacle, and Thy courts fix thou: there is no cause for thee to spare, extend further thy cords, and strong stakes set thou again and again on the right and on the left.” Upon the right keep good men, on the left keep evil men, until there come the fan: occupy nevertheless all nations; bidden to the marriage be good men and evil men, filled be the marriage with guests; it is the office of servants to bid, of the Lord to sever. “Cities which had been forsaken Thou shalt inhabit:” forsaken of God, forsaken of Prophets, forsaken of Apostles, forsaken of the Gospel, full of demons. For Thou shalt prevail; and blush not because abominable Thou hast been. Therefore though there have risen up upon thee strong men, blush not: when against the name of Christ laws were enacted, when ignominy and infamy it was to be a Christian. “Blush not because abominable Thou hast been: for confusion for everlasting Thou shalt forget, of the ignominy of Thy widowhood Thou shalt not be mindful.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"
