[[commentary]]
quote='''
“They forgat God who saved them” (ver. 21). How did He save them? “Who did so great things in Egypt: Wondrous works in the land of Ham, and fearful things in the Red Sea” (ver. 22). The things that are wondrous, are also fearful; for there is no wonder without a certain fear: although these might be called fearful, because they beat down their adversaries, and showed them what they ought to fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
