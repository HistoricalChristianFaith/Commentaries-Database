[[commentary]]
quote='''
The Lord displeased that Pharisee, who to dinner had bidden Him, because a woman that was a sinner drew near to His feet, and he murmured against Him, saying, “If this man were a prophet, He would know what woman drew near to His feet.” O thou that art no prophet, whence knowest thou that He knew not what woman drew near to His feet? Because indeed He kept not the purifying of the Jews, which outwardly was as it were kept in the flesh, and was afar from the heart, this thing he suspected of the Lord. And in order that I may not speak at length on this point, even in his mouth He willed to break utterly the teeth of him. For He set forth to him: “A certain usurer had two debtors, one was owing five hundred pence, the other fifty: both had not wherewithal to pay, he forgave both. Which loved him the more?” To this end the one asketh, that the other may answer: to this end he answereth that the teeth of him in his mouth may be broken utterly.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
