[[commentary]]
quote='''
Now will He speak openly of the same Sacrament, whereby He was carried in His Own Hands. “O taste and see that the Lord is good” (ver. 8). Doth not the Psalm now open itself, and show thee that seeming insanity and constant madness, the same insanity and sober inebriety of that David, who in a figure showed I know not what, when in the person of king Achis they said to him, How is it? When the Lord said, “Except a man eat My Flesh and drink My Blood, he shall have no life in him”? And they in whom reigned Achis, that is, error and ignorance, said; what said they? “How can this man give us his flesh to eat?” If thou art ignorant, “Taste and see that the Lord is good:” but if thou understandest not, thou art king Achis: David shall change His Countenance and shall depart from thee, and shall quit thee, and shall depart.

“Blessed is the man that trusteth in Him.” Why needeth this to be explained at length? Whoever trusteth not in the Lord, is miserable. Who is there that trusteth not in the Lord? He that trusteth in himself.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"

[[commentary]]
quote='''
“I will look for Thy name, for it is pleasant.” And to what dost Thou prove that it is pleasant? Give me a palate to which it is pleasant. Praise honey as much as thou art able, exaggerate the sweetness thereof with what words thou shalt have the power: a man knowing not what honey is, unless he shall have tasted, what thou sayest knoweth not. Therefore the rather to the proof the Psalm inviting thee saith what? “Taste and see that sweet is the Lord.” Taste thou wilt not, and thou sayest, Is it pleasant? What is pleasant? If thou hast tasted, in thy fruit be it found, not in words alone, as it were only in leaves, lest by the curse of the Lord, to wither like that fig-tree thou shouldest deserve. “Taste,” he saith, “and see, that sweet is the Lord.” Taste and see: then ye shall see, if ye shall have tasted. But to a man not tasting, how provest thou? By praising the pleasantness of the name of God, whatsoever things thou shalt have said are words: something else is taste. The words of His praise there hear even the ungodly, but none taste how sweet it is, but the Saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252052.html'
source_title="Exposition on Psalm 52"
