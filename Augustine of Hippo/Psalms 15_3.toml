[[commentary]]
quote='''
“Who hath practised no deceit in his tongue” (ver. 3). Deceit is practised with the tongue, when one thing is professed with the mouth, another concealed in the breast. “Nor done evil to his neighbour.” It is well known that by “neighbour,” every man should be understood. “And hath not entertained slander against his neighbour,” that is, hath not readily or rashly given credence to an accuser.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252015.html'
source_title="Exposition on Psalm 15"
