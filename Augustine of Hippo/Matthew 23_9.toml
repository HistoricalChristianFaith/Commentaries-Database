[[commentary]]
quote='''
“Thou wilt be a helper to the orphan,” that is, to him to whom his father this world, by whom he was born after the flesh, dies, and who can already say, “The world hath been crucified unto me, and I unto the world.” For of such orphans God becomes the Father. The Lord teaches us in truth that His disciples do become orphans, to whom He saith, “Call no man father on earth.” Of which He first Himself gave an example in saying, “Who is my mother, and who my brethren?” Whence some most mischievous heretics would assert that He had no mother; and they do not see that it follows from this, if they pay attention to these words, that neither had His disciples fathers. For as He said, “Who is my mother?” so He taught them, when He said, “Call no man your father on earth.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252010.html'
source_title="Exposition on Psalm 10"

[[commentary]]
quote='''
Or do we more suitably understand thereby the fathers Moses and Aaron, and the other elders who are related in the same Scripture also to have received the Spirit, of which also Moses received, in order that they might aid him in ruling and bearing the same people? For why should they not have been called fathers? It is not in the same manner as God is the One Father, who doth regenerate with His Spirit those whom He doth make sons for an everlasting inheritance; but it is for the sake of honour, because of their age and kindly carefulness: just as Paul the elder saith, “Not to confound you I am writing these things, but as my dearly beloved sons I am admonishing you:” though he knew of a truth that it had been said by the Lord, “Call ye no man your father on earth, for One is your Father, even God.” And this was not said in order that this term of human honour should be erased from our usual way of speaking: but lest the grace of God whereby we are regenerated unto eternal life, should be ascribed either to the power or even sanctity of any man. Therefore when he said, “I have begotten you;” he first said, “in Christ,” and “through the Gospel;” lest that might be thought to be of him, which is of God.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
