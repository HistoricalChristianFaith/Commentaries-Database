[[commentary]]
quote='''
This can be understood in two ways: either "in the likeness of Adam's transgression, death reigned," or (as surely it must be read) "death reigned over even those who did not sin in the likeness of Adam's transgression but sinned before the law was given." Thus those who received the law may be understood to have sinned in the likeness of Adam's transgression, because Adam also sinned after having received a law to obey…. Adam is the type of the one who was to come but in reverse, for as death came through Adam, so life came through our Lord.
'''

[[commentary]]
quote='''
Adam is the type of Christ but in reverse, because the good done by Christ to the regenerated is greater than the harm done by Adam to his descendants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 157"

[[commentary]]
quote='''
When he says: But death reigned from Adam to Moses, even in those who did not sin after the likeness of Adam's transgression, this may be distinguished in two ways: either, Death reigned after the likeness of Adam's transgression, because even those who did not sin died from the origin of Adam's mortality; or else, Death reigned even in those who did not sin after the likeness of Adam's transgression, but sinned before the law—so that those are understood to have sinned after the likeness of Adam's transgression who received the law, since Adam too sinned once the law of the commandment had been received. Certainly, too, what is said, until Moses, is to be understood as the whole time of the law. And Adam is called the figure of the one to come, but by contrast; so that as through him came death, so through our Lord came life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
