
[[commentary]]
quote='''
Believe then, and though thou wert dead, yet shalt thou live: but if thou believest not, even while thou livest thou art dead. Let us prove this likewise, that if thou believest not, though thou livest thou art dead. To one who was delaying to follow Him, and saying, "Let me first go and bury my father," the Lord said, "Let the dead bury their dead; but come thou and follow me." There was there a dead man requiring to be buried, there were there also dead men to bury the dead: the one was dead in the flesh, the others in soul. And how comes death on the soul? When faith is wanting. How comes death on the body? When the soul is wanting. Therefore thy soul's soul is faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"
