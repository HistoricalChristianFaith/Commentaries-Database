[[commentary]]
quote='''
The Lord, on being invited, came to the marriage. What wonder if He came to that house to a marriage, having come into this world to a marriage? For, indeed, if He came not to a marriage, He has not here a bride. But what says the apostle? "I have espoused you to one husband, to present you a chaste virgin to Christ." Why does he fear lest the virginity of Christ's bride should be corrupted by the subtilty of the devil? "I fear," saith he, "lest as the serpent beguiled Eve by his subtilty, so also your minds should be corrupted from the simplicity and chastity which is in Christ." Thus has He here a bride whom He has redeemed by His blood, and to whom He has given the Holy Spirit as a pledge. He has freed her from the bondage of the devil: He died for her sins, and is risen again for her justification. Who will make such offerings to his bride? Men may offer to a bride every sort of earthly ornament,-gold, silver, precious stones, houses, slaves, estates, farms,-but will any give his own blood? For if one should give his own blood to his bride, he would not live to take her for his wife. But the Lord, dying without fear, gave His own blood for her, whom rising again He was to have, whom He had already united to Himself in the Virgin's womb. For the Word was the Bridegroom, and human flesh the bride; and both one, the Son of God, the same also being Son of man. The womb of the Virgin Mary, in which He became head of the Church, was His bridal chamber: thence He came forth, as a bridegroom from his chamber, as the Scripture foretold, "And rejoiced as a giant to run his way." From His chamber He came forth as a bridegroom; and being invited, came to the marriage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25208.html'
source_title="Tractates on John 8"

[[commentary]]
quote='''
So also the apostle is the Bridegroom's friend; he too is jealous, not for himself, but for the Bridegroom. Hear his voice when he is jealous: "I am jealous over you," said he, "with the jealousy of God:" not with my own, nor for myself, but with the jealousy of God. Why? How? Over whom art thou jealous, and for whom? "For I have espoused you to one husband, to present a chaste virgin to Christ." Why dost thou fear, then? Why art thou jealous? "I fear," saith he, "lest, as the serpent beguiled Eve by his subtilty, so your minds should be corrupted from the chastity which is in Christ." The whole Church is called a virgin. You see that the members of the Church are divers, that they are endowed with and do rejoice in divers gifts: some men wedded, some women wedded; some are widowers who seek no more to have wives, some are widows who seek no more to have husbands; some men preserve continence from their youth, some women have vowed their virginity to God: divers are the gifts, but all these are one virgin. Where is this virginity, for it is not in the body. It belongs to few women; and if virginity can be said of men, to few men in the Church belongs a holy integrity even of body; yet one such is a more honorable member. Other members, however, preserve virginity, not in body, but all in mind. What is the virginity of the mind? Entire faith, firm hope, sincere charity. This is the virginity which he, who, was jealous for the Bridegroom, feared might be corrupted by the serpent. For, just as the bodily member is marred in a certain part, so the seduction of the tongue defiles the virginity of the heart. Let her who does not desire without cause to keep virginity of body, see to it that she be not corrupted in mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252013.html'
source_title="Tractates on John 13"
