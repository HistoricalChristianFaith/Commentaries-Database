[[commentary]]
quote='''
When He calls thee, He converts thee: when He converts thee, He healeth thee: when He hath healed thee, thou shalt see thy Converter, unto whom it is said, “Show us Thy mercy, O Lord, and grant us Thy salvation” (ver. 7): Thy salvation, that is, Thy Christ. Happy is he unto whom God showeth His mercy. He it is who cannot indulge in pride, unto whom God showeth His mercy. For by showing him His salvation He persuadeth him that whatever good man has, he hath not but from Him who is all our good. And when a man has seen that whatever good he has he hath not from himself, but from his God; he sees that everything which is praised in him is of the mercy of God, not of his own deserving; and seeing this, he is not proud; not being proud, he is not lifted up; not lifting himself up, he falleth not; not falling, he standeth; standing, he clingeth fast; clinging fast, he abideth; abiding, he enjoyeth, and rejoiceth in the Lord his God. He who made him shall be unto him a delight: and his delight no one spoileth, no one interrupteth, no one taketh away.…Therefore, what saith John in his Epistle? “Beloved, now are we the sons of God, and it doth not yet appear what we shall be.” Who would not rejoice, if suddenly while he was wandering abroad, ignorant of his descent, suffering want, and in a state of misery and toil, it were announced, Thou art the son of a senator: thy father enjoys an ample patrimony on your family estate; I bid thee return to thy father: how would he rejoice, if this were said to him by some one whose promise he could trust? One whom we can trust, an Apostle of Christ, hath come and said to us, Ye have a father, ye have a country, ye have an inheritance. Who is that father? “Beloved, we are the sons of God.”…Therefore He promised us to show Himself unto us. Think, my brethren, what His beauty is. All those beautiful things which ye see, which ye love, He made. If these are beautiful, what is He Himself? If these are great, how great is He? Therefore from these things which we love here, let us the more long for Him: and despising these things, let us love Him: that by that very love we may by faith purify our hearts, and His vision, when it cometh, may find our heart purified. The light which shall be shown unto us ought to find us whole: this is the work of faith now. This is what we have spoken here: “And grant us Thy salvation:” grant us Thy Christ, that we may know Thy Christ, see Thy Christ; not as the Jews saw Him and crucified Him, but as the Angels see Him, and rejoice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252085.html'
source_title="Exposition on Psalm 85"
