[[commentary]]
quote='''
“Destroy not my soul with the ungodly” (ver. 9). Destroy not then, together with them that hate Thee, my soul, which hath loved the beauty of Thy house. “And my life with the men of blood.” And with them that hate their neighbour. For Thy house is beautified with the two commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252026.html'
source_title="Exposition on Psalm 26"
