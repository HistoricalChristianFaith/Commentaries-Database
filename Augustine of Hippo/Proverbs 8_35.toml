[[commentary]]
quote='''
Man in paradise was capable of self-destruction by abandoning justice by an act of will; yet if the life of justice was to be maintained, his will alone would not have sufficed, unless he who made him had given him aid. But, after the fall, God's mercy was even more abundant, for then the will itself had to be freed from the bondage in which sin and death are the masters. There is no way at all by which it can be freed by itself, but only though God's grace, which is made effectual in the faith of Christ. Thus, as it is written, even the will by which "the will itself is prepared by the Lord" so that we may receive the other gifts of God through which we come to the Gift eternal—this too comes from God.
'''
source_url='https://www.newadvent.org/fathers/1302.htm'
source_title="Enchiridion 28:106"

[[commentary]]
quote='''
Now, if we were to put this question to him personally, he would very rightly answer us and say, From that prayer of mine, in which I offer this particular petition to God, you may understand in what sense I said, "If thou wilt, thou mayest keep the commandments." For it is certain that we keep the commandments if we will; but because the will is prepared by the Lord, we must ask of Him for such a force of will as suffices to make us act by the willing. It is certain that it is we that will when we will, but it is He who makes us will what is good, of whom it is said (as he has just now expressed it), "The will is prepared by the Lord."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 32"
