[[commentary]]
quote='''
I have received the letter of your Reverence in which you urge on us the great good of loving and longing for the coming of our Savior. In this you act like the good servant of the master of the household who is eager for his lord's gain and who wishes to have many sharers in the love which burns so brightly and constantly in you. Examining, therefore, the passage you quoted from the apostle where he said that the Lord would render a crown of justice not only to him but to all who love his coming, we live as uprightly as he and we pass through this world as pilgrims while our heart constantly expands with this love, and whether he comes sooner or later than he is expected, his coming is loved with faithful charity and longed for with pious affection.
'''
source_url=''
source_title="LETTERS 199.1.1"

[[commentary]]
quote='''
Supposing that we are “upon the rock,” and that our “goings are ordered,” still it is necessary that we continue to walk; that we advance to something farther. For what did the Apostle Paul say when now upon the Rock, when his “goings had now been established”? “Not as though I had already attained, either were already perfect: Brethren, I count not myself to have apprehended.” What then has been done for thee, if thou hast not apprehended? On what account dost thou return thanks, saying, “But I have obtained mercy”? Because his goings are now established, because he now walks on the Rock?…Therefore, when he was saying, “I press forward toward the prize of my high calling,” because “his feet were now set on the Rock,” and “his goings were ordered,” because he was now walking on the right way, he had something to return thanks for; something to ask for still; returning thanks for what he had received already, while he was claiming that which still remained due. For what things already received was he giving thanks? For the remission of sins, for the illumination of faith; for the strong support of hope, for the fire of charity. But in what respects had he still a claim of debt on the Lord? “Henceforth,” he says, “there is laid up for me a crown of righteousness.” There is therefore something due me still. What is it that is due? “A crown of righteousness, which the Lord, the righteous Judge, shall give me at that day.” He was at first a loving Father to “bring him forth from the horrible pit;” to forgive his sins, to rescue him from “the mire and clay;” hereafter he will be a “righteous Judge,” requiting to him walking rightly, what He promised; to him (I say), unto whom He had at the first granted that power to walk rightly. He then as a “righteous Judge” will repay; but whom will he repay? “He that endureth unto the end, the same shall be saved.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"
[[commentary]]
quote='''
Lo, we see that Paul holdeth Him a debtor, having received mercy, demanding truth. The Lord, he says, shall give back in that day. What shall He give thee back, but that which He oweth thee? How oweth He unto thee? What hast thou given Him? “Who hath first given unto Him, and it shall be restored to him again.” The Lord Himself hath made Himself a debtor, not by receiving, but by promising: it is not said unto Him, Restore what Thou hast received: but, Restore what Thou hast promised. He hath shown mercy unto me, he saith, that He might make me innocent: for before I was a blasphemer and injurious: but by His grace I have been made innocent. But He who first showed mercy, can He deny His debt? “He loveth mercy and truth. He will give grace and glory.” What grace, but that of which the same one said: “By the grace of God I am what I am”? What glory, but that of which he said, “There is laid up for me a crown of glory”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"
