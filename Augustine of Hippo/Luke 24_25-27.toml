[[commentary]]
quote='''
So he began to expound the Scriptures to them to help them recognize Christ precisely in the point on which they had forsaken Christ. The reason, you see, that they had despaired of Christ was that they had seen him dead. He, however, opened the Scriptures to them, so that they would realize that if he hadn't died, he couldn't be the Christ. He taught them from Moses, he taught them from the following Scriptures, he taught them from the prophets what he himself had told them: that it was necessary that the Christ should suffer these things and enter into his glory. They listened, they were filled with joy, they breathed again, and, as they said themselves, their hearts burned within them. And still they didn't recognize the presence of the light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520236.html'
source_title="SERMON 236.2"

[[commentary]]
quote='''
All that we read in holy Scripture for our instruction and salvation demands an attentive ear. You have just heard how the eyes of those two disciples whom the Lord joined on their way were kept from recognizing him. He found them in despair of the redemption that was in Christ, supposing him now to have suffered and died as a man, not imagining him to live forever as the Son of God. So he opened to them the Scriptures and showed them that it was necessary for the Christ to suffer and for all things to be fulfilled that were written concerning him in the law of Moses and the prophets and the psalms—in short, the whole of the Old Testament. Everything in those Scriptures speaks of Christ, but only to him who has ears. He opened their minds to understand the Scriptures. And so let us pray that he will open our own. HOMILY 2.
'''
source_url=''
source_title="ON 1 JOHN"

[[commentary]]
quote='''
Wherefore, prophecy from ancient times, even from the time when the series of human births began to run onwards, was not silent concerning Christ; but the import of the prophecy was concealed therein, for as yet it was water. Whence do we prove that in all former times, until the age in which the Lord came, prophecy did not fail concerning Him? From the Lord's own saying. For when He had risen from the dead, He found His disciples doubting concerning Himself whom they had followed. For they saw that He was dead, and they had no hope that He would rise again; all their hope was gone. On what ground was the thief, after receiving praise, deemed worthy to be that same day in Paradise? Because when bound on the cross he confessed Christ, while the disciples doubted concerning Him. Well, He found them wavering, and in a manner reproving themselves because they had looked for redemption in Him. Yet they sorrowed for Him as cut off without fault, for they knew Him to be innocent. And this is what the disciples themselves said, after His resurrection, when He had found certain of them in the way, sorrowful, "Art thou only a stranger in Jerusalem, and hast not known the things which are come to pass there in these days? And He said unto them, What things? And they said, Concerning Jesus of Nazareth, who was a prophet mighty in deeds and words before God and all the people: how our priests and rulers delivered Him to be condemned to death, and bound Him to the cross. But we trusted that it was He who should have redeemed Israel; and to-day is now the third day since these things were done." After one of the two whom He found in the way going to a neighboring village had spoken these and other words, Jesus answered and said, "O irrational, and slow of heart to believe all that the prophets have spoken. Ought not Christ to have suffered all these things. and to enter into His glory? And beginning from Moses and all the prophets, He expounded unto them in all the Scriptures the things concerning Himself." And likewise, in another place, when He would even have His disciples touch Him with their hands, that they might believe that He had risen in the body, He saith, "These are the words which I have spoken unto you, while I was yet with you, that all things must be fulfilled which were written in the law of Moses, and in the prophets, and in the Psalms, concerning me. Then opened He their understanding, that they might understand the Scriptures, and said unto them, Thus it is written, that Christ should suffer, and rise again from the dead the third day: and that repentance and remission of sins should be preached in His name among all nations, beginning at Jerusalem."

When these words of the Gospel are understood, and they are certainly clear, all the mysteries which are latent in this miracle of the Lord will be laid open. Observe what He says, that it behoved the things to be fulfilled in Christ that were written of Him. Where were they written? "In the law," saith He, "and in the prophets, and in the Psalms." He omitted no part of the Old Scriptures. These were water; and hence the disciples were called irrational by the Lord, because as yet they tasted to them as water, not as wine. And how did He make of the water wine? When He opened their understanding, and expounded to them the Scriptures, beginning from Moses, through all the prophets; with which being now inebriated, they said, "Did not our hearts burn within us in the way, when He opened to us the Scriptures?" For they understood Christ in those books in which they knew Him not before. Thus our Lord Jesus Christ changed the water into wine, and that has now taste which before had not, that now inebriates which before did not. For if He had commanded the water to be poured out of the water-pots, and so Himself had put in the wine from the secret repositories of the creature, whence He made bread when He satisfied so many thousands; for five loaves were not in themselves sufficient to satisfy five thousand men, nor even to fill twelve baskets, but the omnipotence of the Lord was, as it were, a fountain of bread; so likewise He might, on the water being poured out, have poured in wine: but had He done this, He would appear to have rejected the Old Scriptures. When, however, He turns the water itself into wine, He shows us that the Old Scripture also is from Himself, for at His own command were the water-pots filled. It is from the Lord, indeed, that the Old Scripture also is; but it has no taste unless Christ is understood therein.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25209.html'
source_title="Tractates on John 9"
