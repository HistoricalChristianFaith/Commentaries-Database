[[commentary]]
quote='''
“Sink, O Lord, and divide the tongues of them” (ver. 9). He is referring to men troubling him and shadowing him, and he hath wished this thing not of anger, brethren. They that have wickedly lifted up themselves, for them it is expedient that they be sunk. They that have wickedly conspired, it is expedient for them that their tongues should be divided: to good let them consent, and let their tongues agree together. But if to one purpose there were a whispering against me, he saith, all mine enemies, let them lose their “one purpose” in evil, divided be the tongues of them, let them not with themselves agree together. “Sink, O Lord, and divide the tongues of them.” Wherefore “sink”? Because themselves they have lifted up. Wherefore “divide”? Because for an evil thing they have united. Recollect that tower of proud men made after the deluge: what said the proud men? Lest we perish in a deluge, let us make a lofty tower. In pride they were thinking themselves to be fortified, they builded up a lofty tower, and the Lord divided the tongues of them. Then they began not to understand one another; hence arose the beginning of many tongues. For before, one tongue there was: but one tongue for men agreeing was good, one tongue for humble men was good: but when that gathering together did into a union of pride fall headlong, God spared them; even though He divided the tongues, lest by understanding one another they should make a destructive unity. Through proud men, divided were the tongues; through humble Apostles, united were the tongues. Spirit of pride dispersed tongues, Spirit Holy united tongues. For when the Holy Spirit came upon the disciples, with the tongues of all men they spake, by all men they were understood: tongues dispersed, into one were united. Therefore if still they rage and are Gentiles, it is expedient for them divided to have their tongues. They would have one tongue; let them come to the Church; because even among the diversity of tongues of flesh, one is the tongue in faith of heart.

“For I have seen iniquity and contradiction in the city.” With reason this man was seeking the desert, for he saw iniquity and contradiction in the city. There is a certain city turbulent: the same it was that was building a tower, the same was confounded and called Babylon, the same through innumerable nations dispersed: thence is gathered the Church into the desert of a good conscience. For he saw contradiction in the city. “Christ cometh.”—“What Christ?” thou contradictest.—“Son of God.”—“And hath God a Son?” thou contradictest.—“He was born of a virgin, suffered, rose again.”—“And whence is it possible for this to be done?” thou contradictest.—Give heed at least to the glory of the Cross itself. Now on the brow of kings that Cross hath been fixed, over which enemies insulted. The effect hath proved the virtue. It hath subdued the world, not with steel, but with wood. The wood of the Cross deserving of insults hath seemed to enemies, and before the wood itself standing they were wagging the head, and saying, “If Son of God He is, let Him come down from the Cross.” He was stretching forth His hands to a people unbelieving and contradicting. For if just he is that of faith liveth, unjust he is that hath not faith. By that which here he saith “iniquity,” I understand unbelief. The Lord therefore was seeing in the city iniquity and contradiction, and was stretching forth His hands to a people unbelieving and contradicting: and nevertheless waiting for these same, He was saying, “Father, forgive them, for they know not what they do.” Even now indeed there rage the remnant of that city, even now they contradict. From the brows of all men now He is stretching forth hands to the remnant unbelieving and contradicting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
