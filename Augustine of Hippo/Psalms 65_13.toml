[[commentary]]
quote='''
“Clothed have been the rams of the sheep” (ver. 13): “with exultation” must be understood. For with what exultation the hills are encircled, with the same are clothed the rams of the sheep. Rams are the very same as hills. For hills they are because of more eminent grace; rams, because they are leaders of the flocks.…“They shall shout:” thence they shall abound with wheat, because they shall shout. What shall they shout? “For a hymn they shall say.” For one thing it is to shout against God, another thing to say a hymn; one thing to shout iniquities, another thing to shout the praises of God. If thou shout in blasphemy, thorns thou hast brought forth: if thou shoutest in a hymn, thou aboundest in wheat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252065.html'
source_title="Exposition on Psalm 65"
