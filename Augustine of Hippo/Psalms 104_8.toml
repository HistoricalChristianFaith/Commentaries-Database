[[commentary]]
quote='''
“The mountains ascend, and the plains go down, into the place which Thou hast founded for them” (ver. 8). He is still speaking of waters. Let us not here understand mountains as of earth; nor plains, as of earth: but waves so great that they may be compared to mountains. The sea did sometime toss, and its waves were as mountains, which could cover those mountains the Apostles. But how long do the mountains ascend and the plains go down? They raged, and they are appeased. When they raged they were mountains: now they are appeased they are become plains: for He hath founded a place for them. There is a certain channel, as it were a deep place, into which all those lately raging hearts of mortals have retired.…They were mountains formerly, now they are plains: yet, my brethren, even a dead calm is sea. For wherefore are they not now violent? wherefore do they not rage? Wherefore do they not try, if they cannot overthrow our earth, at least to cover it? Wherefore not?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
