[[commentary]]
quote='''
For what mean these words, "to the end," but just to Christ? "For Christ is the end of the law," says the apostle, "for righteousness to every one that believeth." The end that consummates, not that consumes; the end whereto we attain, not wherein we perish. Exactly thus are we to understand the passage, "Christ our passover is sacrificed." He is our end; into Him do we pass.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252055.html'
source_title="Tractates on John 55"

[[commentary]]
quote='''
What is said, “To the end,” always ought to be understood of Christ. For “Christ is the end of the law for righteousness to every one that believeth.” But The End He is called, not because He consumeth, but because He perfecteth. For ended call we the food which is eaten, and ended the coat which is woven, the former to consumption, the latter to perfection. Because then we have not where to go farther when we have come to Christ, Himself is called the end of our course.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
