[[commentary]]
quote='''
And he beginneth to speak of what things He did to the Egyptians: “He set in Egypt His signs, and His prodigies in the plain of Thanis” (ver. 43): “and He turned their rivers into blood, and their showers lest they should drink” (ver. 44), or rather, “the flowings of waters,” as some do better understand by what is written in Greek, τὰ ὀμβρήματα, which in Latin we call scaturigines, waters bubbling from beneath. “He sent upon them the dog-fly, and it ate them up; and the frog, and it destroyed them” (ver. 45). “And He gave their fruit to the mildew, and their labours to the locust” (ver. 46). “And He slew with hail their vineyards, and their mulberry trees with frost” (ver. 47). “And He gave over to the hail their beasts of burden, and their possessions to the fire” (ver. 48). “He sent upon them the anger of His indignation, indignation and anger and tribulation, a visitation through evil angels” (ver. 49). He made a way to the course of His anger, and their beasts of burden He shut up in death (ver. 50). “And He smote every first-born thing in the land of Egypt, the first-fruits of their labours in the tabernacles of Cham” (ver. 51).

All these punishments of the Egyptians may be explained by an allegorical interpretation, according as one shall have chosen to understand them, and to compare them to the things whereunto they must be referred. Which we too will endeavour to do; and shall do it the more properly, the more we shall have been divinely aided. For to do this, those words of this Psalm do constrain us, wherein it was said, “I will open in parables my mouth, I will declare propositions from the beginning.” For for this cause even some things have been here spoken of, which that they befell the Egyptians at all we read not, although all their plagues are most carefully related in Exodus according to their order, so that while that which is not there mentioned we are sure hath not been mentioned in the Psalm to no purpose, and we can interpret the same only figuratively, we may at the same time understand that even the rest of the things which it is evident did happen, were done or described for the sake of some figurative meaning. For the Scripture doth so do in many passages of the prophetic sayings.…In the plagues therefore of the Egyptians, which are in the book which is called Exodus, where the Scripture hath been especially careful, that those things whereby they were afflicted should be all related in order, there is not found what this Psalm hath, “and He gave to the mildew their fruits.” This also wherein, when he had said, “and He gave over to the hail their beasts,” he hath added, “and their possession to the fire:” of the beasts slain with hail is read in Exodus; but how their possession was burned with fire, is not read at all. Although voices and fires do come together with hail, just as thunderings do commonly accompany lightnings; nevertheless, it is not written that anything was given over to the fire that it should be burned. Lastly, the soft things which the hail could not hurt, are said not to have been smitten, that is, hurt with hard blows; which things the locust devoured afterwards. Also that which is here spoken of, “and their mulberry trees with hoar-frost,” is not in Exodus. For hoar-frost doth differ much from hail; for in the clear winter nights the earth is made white with hoar-frost.

What then those things do signify, let the interpreter say as he can, let reader and hearer judge as is just. The water turned into blood seemeth to me to signify a carnal view of the causes of things. Dog-fly, are the manners of dogs, who see not even their parents when first they are born. The frog is very talkative vanity. Mildew doth hurt secretly, which also some have interpreted by rust, others black mould: which evil thing to what vice is it more appropriately compared, than to what doth show itself least readily, like the trusting much in one’s self? For it is a blighting air which doth work this secretly among fruits: just like in morals, secret pride, when a man thinketh himself to be something, though he is nothing. The locust is malice hurting with the mouth, that is, with unfaithful testimony. The hail is iniquity taking away the goods of others; whence theft, robberies, and depredations do spring: but more by his wickedness the plunderer himself is plundered. The hoar-frost doth signify the fault wherein the love of one’s neighbour by the darkness of foolishness, like as it were by the cold of night, is frozen up. But the fire, if here it is not that which is mentioned which was in the hail out of the lightning clouds, forasmuch as he hath said here, “He gave over their possession to the fire,” where he implieth that a thing was burned, which by that fire we read not to have been done,—it seemeth to me, I say, to signify the savageness of wrath, whereby even man-slaying may be committed. But by the death of beasts was figured, as far as I judge, the loss of chastity. For concupiscence, whereby offspring do arise, we have in common with beasts. To have this therefore tamed and ordered, is the virtue of chastity. The death of the first-born things, is the putting off of the very justice whereby a man doth associate with mankind. But whether the figurative significations of these things be so, or whether they are better understood in another way, whom would it not move, that with ten plagues the Egyptians are smitten, and with ten commandments the tables are inscribed, that thereby the people of God should be ruled? Concerning the comparing of which one with the other, inasmuch as we have spoken elsewhere, there is no need to load the exposition of this Psalm therewith: thus much we remind you, that here too, though not in the same order, yet ten plagues of the Egyptians are commemorated, forasmuch as in the place of three which are in Exodus and are not here, to wit, lice, boils, darkness; other three are commemorated, which are not there, that is to say, mildew, hoarfrost, and fire; not of lightning, but that where-unto their possession was given over, which is not read of in that place.
'''
