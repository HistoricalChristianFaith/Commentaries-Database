[[commentary]]
quote='''
"The Jews said unto Him, What sign showest thou unto us, seeing that thou doest these things?" And the Lord answered, "Destroy this temple, and in three days I will raise it up. Then said the Jews, Forty and six years was this temple in building, and dost thou say, In three days I will rear it up?" Flesh they were, fleshly things they minded; but He was speaking spiritually. But who could understand of what temple He spoke? But yet we have not far to seek; He has discovered it to us through the evangelist, he has told us of what temple He said it. "But He spake," saith the evangelist, "of the temple of His body." And it is manifest that, being slain, the Lord did rise again after three days. This is known to us all now: and if from the Jews it is concealed, it is because they stand without; yet to us it is open, because we know in whom we believe. The destroying and rearing again of that temple, we are about to celebrate in its yearly solemnity: for which we exhort you to prepare yourselves, such of you as are catechumens that you may receive grace; even now is the time, even now let that be purposed which may then come to the birth. Now, that thing we know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252010.html'
source_title="Tractates on John 10"

[[commentary]]
quote='''
Observe also the very lie of the false witnesses in the Gospel, and see how it is about Resurrection. For when to the Lord had been said, “What sign showest Thou to us, that Thou doest these things?” besides that which He had spoken about Jonah through another similitude of this same thing also He spake, that ye might know this peculiar sign had been especially pointed out: “Destroy this Temple,” He saith, “and in three days I will raise it up.” And they said, “In forty and six years was builded this temple, and wilt Thou in three days raise it up?” And the evangelist explaining what it was, “But this,” he saith, “spake Jesus of the Temple of His Body.” Behold this His power He said He would show to men in the same thing as that from whence He had given the similitude of a Temple, because of His flesh, which was the Temple of the Divinity hidden within. Whence the Jews outwardly saw the Temple, the Deity dwelling within they saw not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252066.html'
source_title="Exposition on Psalm 66"
