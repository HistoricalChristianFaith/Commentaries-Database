
[[commentary]]
quote='''
“I was poured out like water, and all My bones were scattered” (ver. 14). “I was poured out like water,” when My persecutors fell: and through fear, the stays of My body, that is, the Church, My disciples were scattered from Me. “My heart became as melting wax, in the midst of my belly.” My wisdom, which was written of Me in the sacred books, was, as if hard and shut up, not understood: but after that the fire of My Passion was applied, it was, as if melted, manifested, and entertained in the memory of My Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
