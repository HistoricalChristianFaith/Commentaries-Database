[[commentary]]
quote='''
“The Lord hath said, Out of Basan I will be turned” (ver. 22): or, as some copies have, “Out of Basan I will turn.” For He turneth that we may be safe, of whom above hath been said, “God of our healths, and God of saving men.” For to Him elsewhere also is said, “O God of virtues, turn Thou us, and show Thy face, and safe we shall be.” Also in another place, “Turn us, O God of our healths.” But he hath said, “Out of Basan I will turn.” Basan is interpreted confusion. What is then, I will turn out of confusion, but that there is confounded because of his sins, he that is praying of the mercy of God that they may be put away? Thence it is that the Publican dared not even to lift up his eyes to Heaven: so, on considering himself, was he confounded; but he went down justified, because “the Lord hath said, Out of Basan I will turn.” Basan is also interpreted drought: and rightly the Lord is understood to turn out of drought, that is, out of scarcity. For they that think themselves to be in plenty, though they be famished; and full, though they be altogether empty; are not turned.…“I will turn unto the deep of the sea.” If, “I will turn,” why, “unto the deep of the sea”? Unto Himself indeed the Lord turneth, when savingly He turneth, and He is not surely Himself the deep of the sea. Doth perchance the Latin expression deceive us, and hath there been put “unto the deep,” for a translation of what signifieth “deeply”? For He doth not turn Himself: but He turneth those that in the deep of this world lie sunk down with the weight of sins, in that place where one that is turned saith, “From the depths I have cried to Thee, O Lord.” But if it is not, “I will turn,” but, “I will be turned unto the deep of the sea;” our Lord is understood to have said, how by His own mercy He was turned even unto the deep of the sea, to deliver even those that were sinners in most desperate case. Though in one Greek copy I have found, not, “unto the deep,” but “in the depths,” that is, ἐν βυθοῖς: which strengtheneth the former sense, because even there God turneth to Himself men crying from the depths. And even if He be understood Himself there to be turned, to deliver such sort also, it is not beside the purpose: and so then He turneth, or else to deliver them is so turned, that His foot is stained in blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
