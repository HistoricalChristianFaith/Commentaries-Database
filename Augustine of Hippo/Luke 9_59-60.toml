[[commentary]]
quote='''
Again, in what is said about the person who begged to be allowed first to bury his father, Matthew and Luke are thoroughly at one. For the mere fact that Matthew has introduced first the words of the man who made the request regarding his father, and that he has put after that the saying of the Lord, "Follow me," whereas Luke puts the Lord's command, "Follow me," first, and the declaration of the petitioner second, is a matter of no consequence to the sense itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 23"
