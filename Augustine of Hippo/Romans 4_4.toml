[[commentary]]
quote='''
When he says: But to him who works, the reward is not reckoned according to grace but according to debt, he spoke of how men render reward to men. For God gave by grace, since he gave to sinners, that they might live justly through faith, that is, might work well. Therefore that we work well, once grace has been received, is to be attributed not to us but to him who justified us by grace. For if he wished to render the wage that was owed, he would render to sinners the penalty that was owed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
