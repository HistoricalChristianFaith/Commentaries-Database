[[commentary]]
quote='''
He then looketh back towards the source of this earth’s deliverance, which caused it to abide when founded; and addeth, “If my delight had not been in Thy law, I should perchance have perished in my humiliation” (ver. 92). This is the law of faith, not a vain faith, but that which worketh through love. Through this grace is gained, which maketh men courageous in temporal tribulation, that they may not perish in the humiliation of mortality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
