[[commentary]]
quote='''
“Tell it out among the nations, that the Lord reigneth from the wood: and that it is He who hath made the round world so fast that it cannot be moved” (ver. 10). What testimonies of the building of the house of God! The clouds of heaven thunder out throughout the world that God’s house is being built; and the frogs cry from the marsh, We alone are Christians. What testimonies do I bring forward? That of the Psalter. I bring forward what thou singest as one deaf: open thine ears; thou singest this; thou singest with me, and thou agreest not with me; thy tongue soundeth what mine doth, and yet thine heart disagreeth with mine. Dost thou not sing this? Behold the testimonies of the whole world: “Let the whole earth be moved before His face:” and dost thou say, that thou art not moved? “Tell it out among the heathen, that the Lord hath reigned from the wood.” Shall men perchance prevail here, and say they reign by wood, because they reign by means of the clubs of their bandits? Reign by the Cross of Christ, if thou art to reign by wood. For this wood of thine maketh thee wooden: the wood of Christ passeth thee across the sea. Thou hearest the Psalm saying, “He hath set aright the round world, that it cannot be moved;” and thou sayest it hath not only been moved since it was made fast, but hath also decreased. Dost thou speak the truth, and the Psalmist falsehood? Do the false prophets, when they cry out, “Lo, here is Christ, and there,” speak truth; and doth this Prophet lie? Brethren, against these most open words ye hear in the corners rumours like these; “such an one was a traditor,” and, “such an one was a traditor.” What dost thou say? Are thy words, or the words of God, to be heard? For, “it is He who hath set aright the round world, that it cannot be moved.” I show unto thee the round world built: bring thy present, and come into the courts of the Lord. Thou hast no presents: and on that account thou art not willing to enter. What is this? If God were to appoint unto thee a bull, goat, or ram, for a present, thou wouldest find one to bring: He hath appointed a humble heart, and thou wilt not enter; for thou findest not this in thyself, because thou art swollen with pride. “He hath set aright the round world, that it cannot be moved: and He shall judge the people righteously.” Then shall they mourn, who now refuse to love righteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252096.html'
source_title="Exposition on Psalm 96"
