[[commentary]]
quote='''
Again on this subject it is written: "For through the law comes the knowledge of sin. But now, apart from the law, the justice of God is made manifest, being witnessed by the law and the prophets." When he says "made manifest" he shows that it had existed but was like the dew for which Gideon asked; then it was not visible on the fleece, but now it is made manifest on the ground around. Therefore, since law without grace could only strengthen rather than kill sin—as it is written: "The sting of death is sin and the strength of sin is the law"—and as many flee to grace for refuge from the face of sin which had been so enthroned, to grace lying manifest, as it were, on the ground, so at that time few fled to it [grace] for refuge, invisible as it were, on the fleece. Indeed, this division of times belongs to the depth of the riches of the wisdom and of the knowledge of God, of which it is said: "How incomprehensible are his judgments and how unsearchable his ways!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 177"

[[commentary]]
quote='''
But some, like the Jews in former times, both wish to be called Christians, and—still ignorant of God's righteousness—desire to establish their own, even in our own times of open grace, of the full revelation of grace that was previously hidden, that is, in the times of grace now manifested in the floor, which had before lay hidden in the fleece.… Gideon, one of the righteous men of old, asked for a sign from the Lord, and said, "I pray, Lord, that this fleece which I put on the floor would be wet with dew, and that the floor would be dry." And it was so. The fleece was wet with dew while the whole floor was dry. In the morning he wrung out the fleece in a basin—since grace is given to the humble—and you know what the Lord did to his disciples [with water] in a basin. He asked for yet another sign: "O Lord, I [pray] that the fleece would be dry, and the floor wet with dew." And it was so. Consider how, in the time of the Old Testament, grace was hidden in a cloud, as the rain in the fleece. Note also the time of the New Testament: if you consider the nation of the Jews, you will find it like the dry fleece, whereas the whole world, like that floor, is full of grace, not hidden but manifested. Therefore we are greatly compelled to grieve for our brothers who strive against openly manifested, rather than hidden, grace. There is allowance for the Jews, but what shall we say of Christians? For what reason are you enemies of Christ's grace? Why do you rely on yourselves? Why are you unthankful? Why did Christ come? Wasn't [human] nature here before, which you only deceive by your excessive praise? Wasn't the law here? But the apostle says, "If righteousness comes through the law, then Christ died in vain." What the apostle says of the law, we say regarding nature concerning these people. "If righteousness comes through [human] nature, then Christ died in vain."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252081.html'
source_title="SERMON 81.9"

[[commentary]]
quote='''
“And He shall come down like rain into a fleece, and like drops distilling upon the earth” (ver. 6). He hath called to our minds and admonished us, that what was done by Gedeon the Judge, in Christ hath its end. For he asked a sign of the Lord, that a fleece laid on the floor should alone be rained upon, and the floor should be dry; and again, the fleece alone should be dry, and the floor should be rained upon; and so it came to pass. Which thing signified, that, being as it were on a floor in the midst of the whole round world, the dry fleece was the former people Israel. The same Christ therefore Himself came down like rain upon a fleece, when yet the floor was dry: whence also He said, “I am not sent but to the sheep which were lost of the house of Israel.” There He chose out a Mother by whom to receive the form of a servant, wherein He was to appear to men: there the disciples, to whom He gave this same injunction, saying, “Into the way of the nations go ye not away, and into the cities of the Samaritans enter ye not: go ye first to the sheep which are lost of the house of Israel.” When He saith, go ye first to them, He showeth also that hereafter, when at length the floor was to be rained upon, they would go to other sheep also, which were not of the old people Israel, concerning whom He saith, “I have other sheep which are not of this fold, it behoveth Me to bring in them also, that there may be one flock and one Shepherd.” Hence also the Apostle: “for I say,” he saith, “that Christ was a minister of the Circumcision for the truth of God, to confirm the promises of the fathers.” Thus rain came down upon the fleece, the floor being yet dry. But inasmuch as he continueth, “but that the nations should glorify God for His mercy:” that when the time came on, that should be fulfilled which by the Prophet He saith, “a people whom I have not known hath served Me, in the hearkening of the ear it hath obeyed Me:” we now see, that of the grace of Christ the nation of the Jews hath remained dry, and the whole round world through all nations is being rained upon by clouds full of Christian grace. For by another word he hath indicated the same rain, saying, “drops distilling:” no longer upon the fleece, but “upon the earth.” For what else is rain but drops distilling? But that the above nation under the name of a fleece is signified, I think is either because they were to be stripped of the authority of teaching, just as a sheep is stripped of its skin; or because in a secret place He was hiding that same rain, which He willed not should be preached to uncircumcision, that is, be revealed to uncircumcised nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252072.html'
source_title="Exposition on Psalm 72"
