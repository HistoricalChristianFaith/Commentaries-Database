[[commentary]]
quote='''
…“In God I will praise the word, in the Lord I will praise the discourse” (ver. 10): “in God I have hoped, I will not fear what man doeth unto me” (ver. 11). Now this is the very sense which above hath been repeated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"
