[[commentary]]
quote='''
“Thou shalt make them like a fiery oven:” Thou shalt make them on fire within, by the consciousness of their ungodliness: “In the time of Thy countenance:” in the time of Thy manifestation. “The Lord shall trouble them in His wrath, and the fire shall devour them” (ver. 9). And then, being troubled by the vengeance of the Lord, after the accusation of their conscience, they shall be given up to eternal fire, to be devoured.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
