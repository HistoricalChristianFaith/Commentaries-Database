[[commentary]]
quote='''
He that “led them home in the cloud of the day, and in the whole of the night in the illumination of fire” (ver. 14), is able also spiritually to direct goings if faith crieth to Him, “Direct Thou my goings after Thy word.” Of Whom in another place is said, “For Himself shall make thy courses right, and shall prolong thy goings in peace” through Jesus Christ our Lord, whose Sacrament in this world, as it were in the day, is manifest in the flesh, as if in a cloud; but in the Judgment it will be manifest like as in a terror by night; for then there will be a great tribulation of the world like as it were fire, and it shall shine for the just and shall burn for the unjust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
