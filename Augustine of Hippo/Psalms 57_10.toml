[[commentary]]
quote='''
Also, there, “Thy mercy is great” (or, as some translate, “is lifted up”) “unto the heavens;” but here, “Thy mercy is great above the heavens.” For it is great unto the heavens, that it may be great in the heavens; and this is what he wished to express by “above the heavens.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520108.html'
source_title="Exposition on Psalm 108"
