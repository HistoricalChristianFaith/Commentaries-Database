[[commentary]]
quote='''
But now in that which followeth, “Let there come in before Thy sight,” or, as some copies have it, “In Thy sight, the groans of the fettered:” not easily doth any one discover that the Saints were thrown into fetters by persecutors; and if this doth happen amid so great and manifold a variety of punishments, so rarely it doth happen, that it must not be believed that the prophet had chosen to allude to this especially in this verse. But, in fact, the fetters are the infirmity and the corruptibleness of the body, which do weigh down the soul. For by means of the frailty thereof, as a kind of material for certain pains and troubles, the persecutor might constrain her unto ungodliness. From these fetters the Apostle was longing to be unbound, and to be with Christ; but to abide in the flesh was necessary for their sakes unto whom he was ministering the Gospel. Until then this corruptible put on incorruption, and this mortal put on immortality, like as it were with fetters, the weak flesh doth let the willing spirit. These fetters then not any do feel, but they that in themselves do groan being burthened, desiring to be clothed upon with the tabernacle which is from Heaven; because both death is a terror, and mortal life is sorrow. In behalf of these men groaning the Prophet doth redouble his groaning, that their groaning may “come in in the sight of the Lord.” They also may be understood to be fettered, who are enchained with the precepts of wisdom, the which being patiently supported are turned into ornaments: whence it hath been written, “Put thy feet into her fetters.” “According to the greatness,” he saith, “of Thy arm, receive Thou unto adoption the sons of them that are put to death:” or, as is read in some copies, “Possess Thou sons by the death of the punished.” Wherein the Scripture seemeth to me to have sufficiently shown, what hath been the groan of the fettered, who for the name of Christ endured most grievous persecutions, which in this Psalm are most clearly prophesied. For being beset with divers sufferings, they used to pray for the Church, that their blood might not be without fruit to posterity; in order that the Lord’s harvest might more abundantly flourish by the very means whereby enemies thought that she would perish. For “sons of them that were put to death” he hath called them who were not only not terrified by the sufferings of those that went before, but in Him for whose name they knew them to have suffered, being inflamed with their glory which did inspire them to the like, in most ample hosts they believed. Therefore he hath said, “According to the greatness of Thine arm.” For so great a wonder followed in the case of Christian peoples, as they, who thought they would prevail aught by persecuting her, no wise believed would follow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252079.html'
source_title="Exposition on Psalm 79"
