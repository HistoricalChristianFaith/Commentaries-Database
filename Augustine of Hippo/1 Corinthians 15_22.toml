[[commentary]]
quote='''
This does not mean that all who die in Adam will be members of Christ, since the majority will be punished in eternity by a second death. The apostle uses the word all in both clauses because as no one dies in a natural body except in Adam, so no one is made to live again in a spiritual body, except in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252013.html'
source_title="City of God 13.23"

[[commentary]]
quote='''
Man indeed brought death to himself and to the Son of Man. But the Son of Man, by dying and rising again, brought life to man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 140, TO HONORATUS 9"

[[commentary]]
quote='''
No human enters into death except through Adam and no one into eternal life except through Christ. This is the meaning of that repeated phrase all, because as all men belong to Adam through their first or carnal birth, so all men who belong to Christ come to the second or spiritual birth. Therefore he says "all" in both places because as all who die die only in Adam, so all who will be made alive will not be made alive except in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 167, To Jerome 21"

[[commentary]]
quote='''
Notice how he emphasizes "one" and "one," that is Adam and Christ, the former for condemnation, the latter for justification.… Obviously he is speaking of the resurrection of the just where there is life eternal, not of the resurrection of the wicked where there will be eternal death. Those who "shall be made alive" are contrasted with the others who will be damned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 157, TO HILARIUS"

[[commentary]]
quote='''
We commonly say that all enter a certain house through one door, not because all humanity enters that house but because no one enters except through that door. It is in this sense that as all die in Adam so do all those who live live in Christ.… Aside from the one Mediator of God and men, the man Christ Jesus, there is no other name under heaven whereby we must be saved.
'''
source_url=''
source_title="AGAINST JULIAN 24"

[[commentary]]
quote='''
The first man made us captive, the second man hath delivered us from captivity. “For as in Adam all die, so also in Christ all shall be made alive.” But in Adam they die through the flesh’s nativity, in Christ they are delivered through the heart’s faith. It was not in thy power not to be born of Adam: it is in thy power to believe in Christ. Howsoever much then thou shalt have willed to belong to the first man, unto captivity thou wilt belong.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252071.html'
source_title="Exposition on Psalm 71"

[[commentary]]
quote='''
For by the anger of God we are subject to death, and by the anger of God we eat bread on this earth in want, and in the sweat of our face. This was Adam’s sentence when he sinned: and that Adam was every one of us, for “in Adam all die;” the sentence passed on him hath taken effect after him on us. For we were not yet ourselves, but we were in Adam: therefore whatever happened to Adam himself took effect on us also, so that we should die: for we all were in him.…So far as this the sin of thy father hurts thee not, if thou hast changed thyself, even as it would not hurt thy father if he had changed himself. But that which our stock hath received unto its subjection to death, it hath derived from Adam. What hath it so derived? That frailty of the flesh, this torture of pains, this house of poverty, this chain of death, and snares of temptations; all these things we carry about in this flesh; and this is the anger of God, because it is the vengeance of God. But because it was so to be, that we should be regenerated, and by believing should be made new, and all that mortality was to be removed in our resurrection, and the whole man was to be restored in newness; “For as in Adam all die, so also in Christ shall all be made alive;” seeing this the Prophet saith, “Be not angry with us for ever, nor stretch out Thy wrath from one generation to another.” The first generation was mortal by Thy wrath: the second generation shall be immortal by Thy mercy.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252085.html'
source_title="Exposition on Psalm 85"
