[[commentary]]
quote='''
“Look, how wide the east is from the west; so far hath He set our sins from us” (ver. 12). They who know the Sacraments know this; nevertheless, I only say what all may hear. When sin is remitted, thy sins fall, thy grace riseth; thy sins are as it were on the decline, thy grace which freeth thee on the rise. “Truth springeth from the earth.” What meaneth this? Thy grace is born, thy sins fall, thou art in a certain manner made new. Thou shouldest look to the rising, and turn away from the setting. Turn away from thy sins, turn unto the grace of God; when thy sins fall, thou riseth and profitest.…One region of the heaven falleth, another riseth: but the region which is now rising will set after twelve hours. Not like this is the grace which riseth unto us: both our sins fall for ever, and grace abideth for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
