[[commentary]]
quote='''
(Tr. lvi. 4) Clean all except the feet. The whole of a man is washed in baptism, not excepting his feet; but living in the world afterwards, we tread upon the earth. Those human affections then, without which we cannot live in this world, are, as it were, our feet, which connect us with human things, so that if we say we have no sin, we deceive ourselves. (1 John 1:8) But if we confess our sins, He who washed the disciples' feet, forgives us our sins even down to our feet, wherewith we hold our converse with earth.

(Ad. Seleuc. Ep. c. viii.) From what is here said, we understand that Peter was already baptized. Indeed that He baptized by His disciples, shows that His disciples must have been baptized, either with John's baptism, or, which is more probable, Christ's. He baptized by means of baptized servants; for He did not refuse the ministry of baptizing, Who had the humility to wash feet.

(Tr. lvi. 4) Or, the disciples when washed had only to have their feet washed; because while man lives in this world, he contracts himself with earth, by means of his human affections, which are as it were his feet.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"Jesus saith to him, He that is washed needeth not save to wash his feet, but is clean every whit." Some one perhaps may be aroused at this, and say: Nay, but if he is every whit clean, what need has He even to wash his feet? But the Lord knew what He was saying, even though our weakness reach not into His secret purposes. Nevertheless, so far as He is pleased to instruct and teach us out of His law, up to the little measure of my apprehension, I would also, with His help, make some answer bearing on the depths of this question: and, first of all, I shall have no difficulty in showing that there is no self-contradiction in the manner of expression. For who may not say, as here, with the greatest propriety, He is all clean, except his feet?-although he would speak with greater elegance were he to say, He is all clean, save his feet; which is equivalent in meaning. Thus, then, doth the Lord say, "He needeth not save to wash his feet, but is all clean." All, that is, except, or save his feet, which he still needs to wash.

But what is this? what does it mean? and what is there in it we need to examine? The Lord says, The Truth declares that even he who has been washed has need still to wash his feet. What, my brethren, what think you of it, save that in holy baptism a man has all of him washed, not all save his feet, but every whit; and yet, while thereafter living in this human state, he cannot fail to tread on the ground with his feet. And thus our human feelings themselves, which are inseparable from our mortal life on earth, are like feet wherewith we are brought into sensible contact with human affairs; and are so in such a way, that if we say we have no sin, we deceive ourselves, and the truth is not in us. And every day, therefore, is He who intercedeth for us , washing our feet: and that we,too have daily need to be washing our feet, that is ordering aright the path of our spiritual footsteps, we acknowledge even in the Lord's prayer, when we say, "Forgive us our debts as we also forgive our debtors." For "if,' as it is written, "we confess our sins," then verily is He, who washed His disciples' feet, "faithful and just to forgive us our sins, and to cleanse us from all unrighteousness," that is, even to our feet wherewith we walk on the earth.

Accordingly the Church, which Christ cleanseth with the washing of water in the word, is without spot and wrinkle, not only in the case of those who are taken away immediately after the washing of regeneration from the contagious influence of this life, and tread not the earth so as to make necessary the washing of their feet, but in those also who have experienced such mercy from the Lord as to be enabled to quit this present life even with feet that have been washed. But although the Church be also clean in respect of those who tarry on earth, because they live righteously; yet have they need to be washing their feet, because they assuredly are not without sin. For this cause is it said in the Song of Songs, "I have washed my feet; how shall I defile them?" For one so speaks when he is constrained to come to Christ, and in coming has to bring his feet into contact with the ground. But again, there is another question that arises. Is not Christ above? hath He not ascended into heaven, and sitteth He not at the Father's right hand? Does not the apostle expressly declare, "If ye, then, be risen with Christ, set your thoughts on those things which are above, where Christ is sitting on the right hand of God. Seek the things which are above, not things which are on earth?" How is it, then, that to get to Christ we are compelled to tread the earth, since rather our hearts ought to be turned upwards toward the Lord, that we may be enabled to dwell in His presence? You see, brethren, the shortness of the time to-day curtails our consideration of this question. And if you perhaps fail in some measure to do so, yet I for my part see how much clearing up it requires. And therefore I beg of you to suffer it rather to be adjourned, than to be treated now in too negligent and restricted a manner; and your expectations will not be defrauded, but only deferred. For the Lord who thus makes us your debtors, will be present to enable us also to pay our debts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252056.html'
source_title="Tractates on John 56"

[[commentary]]
quote='''
I Have not been unmindful of my debt, and acknowledge that the time of payment has now come. May He give me wherewith to pay, as He gave me cause to incur the debt. For He has given me the love, of which it is said, "Owe no man anything, but to love one another." May He give also the word, which I feel myself owing to those I love. I put off your expectations till now for this reason, that I might explain as I could how it is we come to Christ along the ground, When we are commanded rather to seek the things which are above, not the things which are upon the earth. For Christ is sitting above, at the right hand of the Father: but He is assuredly here also; and for that reason said also to Saul, as he was raging on the earth, "Why persecutest thou me?" But the topic on which we were speaking, and which led to our entering on this inquiry, was our Lord's washing His disciples' feet, after the disciples themselves had already been washed, and needed not, save to wash their feet. And we there saw it to be understood that a man is indeed wholly washed in baptism; but while thereafter he liveth in this present world, and with the feet of his human passions treadeth on this earth, that is, in his life-intercourse with others, he contracts enough to call forth the prayer, "Forgive us our debts." And thus from these also is he cleansed by Him who washed His disciples' feet, and ceaseth not to make intercession for us. And here occurred the words of the Church in the Song of Songs, when she saith, "I have washed my feet; how shall I defile them?" when she wished to go and open to that Being, fairer in form than the sons of men, who had come to her and knocked, and asked her to open to Him. This gave rise to a question, which we were unwilling to compress into the narrow limits of the time, and therefore deferred till now, in what sense the Church, when on her way to Christ, may be afraid of defiling her feet, which she had washed in the baptism of Christ.

For thus she speaks: "I sleep, but my heart waketh: it is the voice of my Beloved that knocketh at the gate." And then He also says: "Open to me, my sister, my nearest, my dove, my perfect one; for my head is filled with dew, and my hair with the drops of the night." And she replies: "I have put off my dress; how shall I put it on? I have washed my feet; how shall I defile them?" O wonderful sacramental symbol! O lofty mystery! Does she, then, fear to defile her feet in coming to Him who washed the feet of His disciples? Her fear is genuine; for it is along the earth she has to come to Him, who is still on earth, because refusing to leave His own who are stationed here. Is it not He that saith, "Lo, I am with you always, even unto the end of the world"? Is it not He that saith, "Ye shall see the heavens opened, and the angels of God ascending and descending upon the Son of man"? If they ascend to Him because He is above, how do they descend to Him, but because He is also here? Therefore saith the Church: "I have washed my feet; how shall I defile them?" She says so even in the case of those who, purified from all dross. can say: "I desire to depart, and to be with Christ; nevertheless to abide in the flesh is more needful for you." She says it in those who preach Christ, and open to Him the door, that He may dwell by faith in the hearts of men. In such she says it, when they deliberate whether to undertake such a ministry, for which they do not consider themselves qualified, so as to discharge it blamelessly, and so as not, after preaching to others, themselves to become castaways. For it is safer to hear than to preach the truth: for in the hearing, humility is preserved; but when it is preached, it is scarcely possible for any man to hinder the entrance of some small measure of boasting, whereby the feet at least are defiled.

Therefore, as the Apostle James saith, "Let every man be swift to hear, slow to speak." As it is also said by another man of God, "Thou wilt make me to hear joy and gladness; and the bones Thou hast humbled will rejoice." This is what I said: When the truth is heard, humility is preserved. And another says: "But the friend of the bridegroom standeth and heareth him, and rejoiceth greatly because of the bridegroom's voice." Let us rejoice in the hearing that comes from the noiseless speaking of the truth within us. For although, when the sound is outwardly uttered, as by one that readeth; or proclaimeth, or preacheth, or disputeth, or commandeth, or comforteth, or exhorteth, or even by one that sings or accompanies his voice on an instrument, those who do so may fear to defile their feet, when they aim at pleasing men with the secretly active desire of human applause. Yet the one who hears such with a willing and pious mind, has no room for self-gratulation in the labors of others; and with no self-inflation, but with the joy of humility, rejoices because of the Master's words of truth. Accordingly, in those who hear with willingness and humility, and spend a tranquil life in sweet and wholesome studies, the holy Church will take delight, and may say, "I sleep, and my heart waketh." And what is this, "I sleep, and my heart waketh," but just I sit down quietly to listen? My leisure is not laid out in nourishing slothfulness, but in acquiring wisdom. "I sleep, and my heart waketh." I am still, and see that Thou art the Lord: for "the wisdom of the scribe cometh by opportunity of leisure; and he that hath little business shall become wise." "I sleep, and my heart waketh:" I rest from troublesome business, and my mind turns its attention to divine concerns (or communications).

But while the Church finds delightful repose in those who thus sweetly and humbly sit at her feet, here is one who knocks, and says: "What I tell you in darkness, that speak ye in light; and what ye hear in the ear, that preach ye upon the house-tops." It is His voice, then, that knocks at the gate, and says: "Open to me, my sister, my neighbor, my dove, my perfect one; for my head is filled with dew, and my locks with the drops of the night." As if He had said, Thou art at leisure, and the door is closed against me: thou art caring for the leisure of the few, and through abounding iniquity the love of many is waxing cold. The night He speaks of is iniquity: but His dew and drops are those who wax cold and fall away, and make the head of Christ to wax cold, that is, the love of God to fail. For the head of Christ is God. But they are borne on His locks, that is, their presence is tolerated in the visible sacraments; while their senses never take hold of the internal realities. He knocks, therefore, to shake off this quiet from His inactive saints, and cries, "Open to me," thou who, through my blood, art become "my sister;" through my drawing nigh, "my neighbor;" through my Spirit, "'my dove;" through my word which thou hast fully learned in thy leisure, "my perfect one:" open to me, go and preach me to others. For how shall I get in to those who have shut their door against me, without some one to open? and how shall they hear without a preacher?

Hence it happens that those who love to devote their leisure to good studies, and shrink from encountering the troubles of toilsome labors, as feeling themselves unsuited to undertake and discharge such services with credit, would prefer, were it possible, to have the holy apostles and ancient preachers of the truth again raised up against that abounding of iniquity which hath so reduced the warmth of Christian love. But in regard to those who have already left the body, and put off the garment of the flesh (for they are not utterly parted), the Church replies, "I have put off my dress; how shall I put it on?" That dress shall, indeed, yet be recovered; and in the persons of those who have meanwhile laid it aside, shall the Church again put on the garment of flesh: only not now, when the cold are needing to be warmed; but then, when the dead shall rise again. Realizing, then, her present difficulty through the scarcity of preachers, and remembering those members of her own who were so sound in word and holy in character, but are now disunited from their bodies,the Church says in her sorrow, "I have put off my dress; how shall I put it on?" How can those members of mine, who had such surpassing power, through their preaching, to open the door to Christ, now return to the bodies which they have laid aside?

And then, turning again to those who preach, and gather in and govern the congregations of His people, and so open as they can to Christ, but are afraid, amid the difficulties of such work, of falling into sin, she says, "I have washed my feet; how shall I defile them?" For whosoever offendeth not in word, the same is a perfect man. And who, then, is perfect? Who is there that offendeth not amid such an abounding of iniquity, and such a freezing of charity? "I have washed my feet; how shall I defile them?" At times I read and hear: "My brethren, be not many masters, seeing that ye shall receive the greater condemnation: for in many things we offend all." "I have washed my feet; how shall I defile them?" But see, I rise and open. Christ, wash them. "Forgive us our debts," because our love is not altogether extinguished: for "we also forgive our debtors." When we listen to Thee, the bones which have been humbled rejoice with Thee in the heavenly places. But when we preach Thee, we have to tread the ground in order to open to Thee: and then, if we are blameworthy, we are troubled; if we are commended, we become inflated. Wash our feet, that were formerly cleansed, but have again been defiled in our walking through the earth to open unto Thee. Let this be enough today, beloved. But in whatever we have happened to offend, by saying otherwise than we ought, or have been unduly elated by your commendations, entreat that our feet may be washed, and may your prayers find acceptance with God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252057.html'
source_title="Tractates on John 57"
