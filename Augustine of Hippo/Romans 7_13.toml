[[commentary]]
quote='''
For even good things are hurtful, and evil things are beneficial, according to the character of the recipients. "Sin," says the apostle, "that it might appear sin, wrought death to me by that which is good." Thus, you see, evil is brought about by the good, so long as that which is good is wrongly received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252062.html'
source_title="Tractates on John 62"

[[commentary]]
quote='''
When he says: Did then that which is good become death to me? God forbid! But sin, that it might appear as sin, worked death in me through what is good—here he evidently shows that what he had said above, For without the law sin is dead, he said because it lies hidden, since he now says that it was not that good thing, that is, the law, that became death to him, but that sin worked death through the good of the law, that is, so that the sin which lay hidden without the law might appear. For then each one recognizes that he is dead, when he cannot fulfill what he confesses to have been rightly commanded, and by the charge of transgression sins more than if he were not forbidden. This is what he says in what follows: That sin might become beyond measure a sinner, or sin, through the commandment—which before the commandment was less, because where there is no law, neither is there transgression.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
