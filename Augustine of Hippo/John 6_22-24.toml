
[[commentary]]
quote='''
"On the next day the multitude that stood on the other side of the sea," whence the disciples had come, "saw that there was none other boat there, save that one whereinto His disciples were entered, and that Jesus went not with His disciples into the boat, but that His disciples were gone away alone; but there came other boats from Tiberias, nigh unto the place where they did eat bread, giving thanks to the Lord: when, therefore, the multitudes saw that Jesus was not there, nor His disciples, they also took shipping, and came to Capernaum seeking Jesus." Yet they got some knowledge of so great a miracle. For they saw that the disciples had gone into the ship alone, and that there was not another ship there. But there came boats also from near to that place where they did eat bread; in these the multitudes followed Him. He had not then embarked with His disciples, and there was not another ship there. How, then, was Jesus on a sudden beyond the sea, unless that He walked upon the sea to show a miracle?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252025.html'
source_title="Tractates on John 25"
