[[commentary]]
quote='''
"Your teeth are like a flock of shorn ewes." What do shorn ewes mean? Those who lay aside secular burdens. What does shorn mean? Those who lay aside their fleeces, like the load of secular burdens. Those persons were your teeth, about whom it is written in the Acts of the Apostles that "they sold all their possessions and laid the proceeds at the feet of the apostles, so that distribution might be made to each, as there was need." You have received the fleeces of your shorn ewes. That flock has come up from the washing of holy baptism. All have given birth, because they have fulfilled the two commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520313B.html'
source_title="SERMON 313B.3"


[[commentary]]
quote='''
He says to the church, his spouse, "Your teeth are like a flock of sheep that are shorn, which come up from the washing, all with twins, and there is none barren among them." By this twin offspring the twofold object of love is meant, namely, God and the neighbor: "On these two commandments depend all the law and the prophets."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 149"

[[commentary]]
quote='''
To these teeth are opposed the Church’s teeth, by whose authority believers are cut off from the error of the Gentiles and divers opinions, and are translated into that fellowship which is the body of Christ. With these teeth Peter was told to eat the animals when they had been killed, that is, by killing in the Gentiles what they were, and changing them into what he was himself. Of these teeth too of the Church it is said, “Thy teeth are as a flock of shorn sheep, coming up from the bath, whereof every one beareth twins, and there is not one barren among them.” These are they who prescribe rightly, and as they prescribe, live; who do what is written, “Let your works shine before men, that they may bless your Father which is in heaven.” For moved by their authority, they believe God who speaketh and worketh through these men; and separated from the world, to which they were once conformed, they pass over into the members of the Church. And rightly therefore are they, through whom such things are done, called teeth like to shorn sheep; for they have laid aside the burdens of earthly cares, and coming up from the bath, from the washing away of the filth of the world by the Sacrament of Baptism, every one beareth twins. For they fulfil the two commandments, of which it is said, “On these two commandments hang all the Law and the Prophets;” loving God with all their heart, and with all their soul, and with all their mind, and their neighbour as themselves. “There is not one barren among them,” for much fruit they render unto God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25203.html'
source_title="Exposition on Psalm 3"

[[commentary]]
quote='''
Truly from behind teeming sheep He hath been taken thence. For those former Churches were of such sort, as that of them it is said in the Song of Songs, “Thy teeth—are like a flock of shorn ewes going up from the washing, all of which do bear twins, and a barren one is not among them.” For they then laid aside like as it were fleeces the burdens of the world, when before the feet of the Apostles they laid the prices of their sold goods, going up from that Laver, concerning which the apostle Peter doth admonish them, when they were troubled because they had shed the blood of Christ, and he saith, “Repent ye, and let each one of you be baptized in the name of the Lord Jesus Christ, and your sins shall be forgiven you.” But twins they begat, the works, to wit, of the two commandments of twin love, love of God, and love of one’s neighbour: whence a barren one there was not among them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"


[[commentary]]
quote='''
He praiseth these sheep also in the Song of Solomon, speaking of some perfect ones as the teeth of His Spouse the Holy Church: “Thy teeth are like a flock of sheep that are even shorn, which come up from the washing; whereof every one beareth twins, and there is none barren.” What meaneth, “Thy teeth”? These by whom thou speakest: for the teeth of the Church are those through whom she speaketh. Of what sort are thy teeth? “Like a flock of sheep that are shorn.” Why, “that are shorn”? Because they have laid aside the burdens of the world. Were not those sheep, of which I was a little before speaking, shorn, whom the bidding of God had shorn, when He saith, “Go and sell that thou hast, and give to the poor; and thou shalt find treasure in heaven: and come and follow Me”? They performed this bidding: shorn they came. And because those who believe in Christ are baptized, what is there said? “which come up from the washing;” that is, come up from the cleansing. “Whereof every one beareth twins.” What twins? Those two commandments, wherefrom hang all the Law and the Prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252095.html'
source_title="Exposition on Psalm 95"
