[[commentary]]
quote='''
“They shall be scattered abroad in order that they may eat” (ver. 15); that is, in order that they may gain others, in order that into their Body they may change believers. “But if they shall not be filled, they shall murmur.” Because above also he had spoken of the murmur of them, saying, “For who hath heard?” “And Thou, O Lord,” he saith, “shalt deride them, saying, Who hath heard?” Wherefore? Because, as nothing Thou shalt count all nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"
