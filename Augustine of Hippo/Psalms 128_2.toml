[[commentary]]
quote='''
“Thou shalt eat the labours of thy fruits” (ver. 2). And ye, O thou, ye many who are One, “Thou shalt eat of the labours of thy fruits.” He seemeth to speak perversely to those who understand not: for he should have said, thou shalt eat the fruit of thy labours. For many eat the fruit of their labours. They labour in the vineyard; they eat not the toil itself; but what ariseth from their labour they eat. They labour about trees that bear fruit: who would eat labours? But the fruit of these labours, the produce of these trees; it is this that delighteth the husbandman. What meaneth, “Thou shalt eat the labours of thy fruits”? At present we have toils: the fruits will come afterwards. But since their labours themselves are not without joy, on account of the hope whereof we have a little before spoken, “Rejoicing in hope, patient in tribulation;” at present those very labours delight us, and make us joyful in hope. If therefore our toil has been what could be eaten, and could also delight us; what will be the fruit of our labour when eaten? “They who went weeping on their way, scattering their seed,” did eat their labours; with how much greater pleasure will they eat the fruits of their labours, who “shall come again with joy, bearing their sheaves with them”?…“Blessed art thou, and well shall it be with thee.” “Blessed art thou,” is of the present: “well shall it be with thee,” is of the future. When thou eatest the labours of thy fruits, “blessed art thou;” when thou hast reached the fruit of thy labours, “well shall it be with thee.” What hath he said? For if it be well with thee, thou wilt be happy: and if thou wilt be happy, thou wilt also have all well with thee. But there is a difference between hope and attainment. If hope be so sweet, how much sweeter will reality be?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520128.html'
source_title="Exposition on Psalm 128"
