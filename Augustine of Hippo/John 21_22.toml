[[commentary]]
quote='''
The Lord either said what he said to Peter about his martyrdom, or he said it about the gospel of John. As regards the martyrdom and this "Follow me," [he means] suffer for me, suffer what I did. Because Christ was crucified, Peter too was crucified … while John experienced none of this. That is what is meant by, "It is thus that I wish him to remain." Let him fall asleep without wounds, without torment, and wait for me. You, Peter, "Follow me," suffer what I did. That's one way these words can be explained.…As regards the Gospel of John, though, this is what I think is meant: that Peter wrote about the Lord, others too wrote; but their writing was more concerned with the Lord's humanity.… But while there is something about the divinity of Christ in Peter's letters, in John's gospel it is very much to the fore.… He soared above the clouds and soared above the stars, soared above the angels, soared above every creature and arrived at the Word through which all things were made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520253.html'
source_title="SERMON 253.5"

[[commentary]]
quote='''
(Tract. cxxiv.) Or perhaps he will allow that John still lies in his sepulchre at Ephesus, but asleep, not dead; and will give us a proof, that the soil over his grave is moist and watery, owing to his respiration. But why should our Lord grant it as a great privilege to the disciple whom He loved, that he should sleep this long time in the body, when he released Peter rent the burden of the flesh by a glorious martyrdom, and gave him what Paul had longed for, when he said, I have a desire to depart and be with Christ? If there really takes place at John's grave that which report says, it is either done to commend his precious death, since that had not martyrdom to commend it, or for some other cause not known to us. Yet the question remains, Why did our Lord say of one who was about to die, I will that he tarry till I come? It may be asked too why our Lord loved John the most, when Peter loved our Lord the most? I might easily reply, that the one who loved Christ the more, was the better man, and the one whom Christ loved the more, the more blessed; only this would not be a defence of our Lord's justice. This important question then I will endeavour to answer. The Church acknowledges two modes of life, as divinely revealed, that by faith, and that by sight. The one is represented by the Apostle Peter, in respect of the primacy of his Apostleship; the other by John: wherefore to the one it is said, Follow Me, i. e. imitate Me in enduring temporal sufferings; of the other it is said, I will that he tarry till I come: as if to say, Do thou follow Me, by the endurance of temporal sufferings, let him remain till I come to give everlasting bliss; or to open out the meaning more, Let action be perfected by following the example of My Passion, but let contemplation wait inchoate till at My coming it be completed: wait, not simply remain, continue, but wait for its completion at Christ's coming. Now in this life of action it is true, the more we love Christ, the more we are freed from sin; but He does not love us as we are, He frees us from sin, that we may not always remain as we are, but He loves us heretofore rather, because hereafter we shall not have that which displeases Him, and which He frees us from. So then let Peter love Him, that we may be freed from this mortality; let John be loved by Him, that we may be preserved in that immortality. John loved less than Peter, because, as he represented that life in which we are much more loved, our Lord said, I will that he remain (i. e. wait) till I come; seeing that that greater love we have not yet, but wait till we have it at His coming. And this intermediate state is represented by Peter who loves, but is loved less, for Christ loves us in our misery less than in our blessedness: and we again love the contemplation of truth such as it will be then, less in our present state, because as yet we neither know nor have it. But let none separate those illustrious Apostles; that which Peter represented, and that which John represented, both were sometime to be.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Finally, He here commits His sheep to the care of Peter, who loves Him, and thrice confesses that love, and then He states that He wills this very John so to tarry until He comes. In which utterance, again, He seems to me to have conveyed in a profound and mystical way the fact that this evangelical stewardship of John's, in which he is borne aloft into the most liquid light of the Word, where it is possible to behold the equality and unchangeableness of the Trinity, and in which, above all, we see at what a distance from all others in respect of essential character that humanity stands by whose assumption it occurred that the Word was made flesh, cannot be clearly discerned and recognised until the Lord Himself comes. Consequently, it will tarry thus until He comes. At present it will tarry in the faith of believers, but hereafter it will be possible to contemplate it face to face, when He, our Life, shall appear, and when we shall appear with Him in glory. But if any one supposes that with man, living, as he still does, in this mortal life, it may be possible for a person to dispel and clear off every obscurity induced by corporeal and carnal fancies, and to attain to the serenest light of changeless truth, and to cleave constantly and unswervingly to that with a mind thoroughly estranged from the course of this present life, that man understands neither what he asks, nor who he is that put such a supposition. Let such an individual rather accept the authority, at once lofty and free from all deceitfulness, which tells us that, as long as we are in the body, we are absent from the Lord, and that we walk by faith and not by sight. And thus, with all perseverance keeping and guarding his faith and hope and charity, let him look forward to the sight which is promised, in accordance with that earnest which we have received of the Holy Ghost, who shall teach us all truth, when God, who raised up Jesus Christ from the dead, shall also quicken our mortal bodies by His Spirit that dwelleth in us. But before this body, which is dead by reason of sin, is quickened, it is without doubt corruptible, and presseth down the soul. And if, in the body, man is ever helped to reach beyond the cloud with which the whole earth is covered,—that is to say, beyond this carnal darkness with which the whole life of earth is covered,—it is simply as if he were touched with a rapid coruscation, only to sink swiftly into his natural infirmity, the desire surviving by which he may again be excited (to what is evil), and the purity being insufficient to establish him (in what is good). The more, however, any one can do this, the greater is he; while the less he can do so, the less is he. And if the mind of a man has as yet had no such experience—in which mind nevertheless Christ dwells by faith—he ought to strive earnestly to diminish the lusts of this world, and to make an end of them by the exercise of moral virtue, walking, as it were, in the company of these three evangelists with Christ the Mediator. And, with the joy of large hope, let him in faith hold Him who is alway the Son of God, but who, for our sakes, became the Son of man, in order that His eternal power and Godhead might be united with our weakness and mortality, and, on the basis of what is ours, make a way for us in Himself and to Himself. That a man may be kept from sinning, he should be ruled by Christ the King. If he happens to sin, he may obtain remission from Christ, who is also priest. And thus, nurtured in the exercise of a good conversation and life, and borne out of the atmosphere of earth on the wings of a twofold love, as on a pair of strong pinions, so may he be enlightened by the same Christ, who is also the Word, the Word who was in the beginning, the Word who was with God, and the Word who was God; and although that will still be through a glass darkly, it will be a sublime kind of illumination far superior to every corporeal similitude. Wherefore, although it is the gifts of the active virtue that shine pre-eminent in the first three evangelists, while it is the gift of the contemplative virtue that discerns such subjects, nevertheless, this Gospel of John, in so far as it also is in part, will so tarry until that which is perfect comes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 10"
