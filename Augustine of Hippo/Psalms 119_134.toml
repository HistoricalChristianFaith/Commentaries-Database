[[commentary]]
quote='''
But what meaneth this that he saith, “O deliver me from the calumnies of men: so shall I keep Thy commandments”? (ver. 134)…Did not the holy people of God much the more gloriously keep the commandments among these very calumnies, when they were at their hottest in the midst of tribulations, when they yielded not to their persecutors to commit impieties? But, in truth, the meaning of these words is this: Do Thou, by pouring upon me Thy Spirit, guard me from being overcome by the terrors of human calumny, and from being drawn over to their evil deeds away from Thy commandments. For if Thou hast thus dealt with me, that is, if Thou hast in this manner delivered me by the gift of patience from their calumnies, so that I fear not the false charges they prefer against me; among those very calumnies I will keep Thy commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
