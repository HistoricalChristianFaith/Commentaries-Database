[[commentary]]
quote='''
Listen now to what he addeth: “Blessed are they that keep His testimonies, and seek Him with their whole heart” (ver. 2). No other class of the blessed seemeth to me to be mentioned in these words, than that which has been already spoken of. For to examine into the testimonies of the Lord, and to seek Him with all the heart, this is to be undefiled in the way, this is to walk in the law of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
