[[commentary]]
quote='''
Nevertheless there are not wanting some who place us likewise before the angels; because, they say, Christ died for us and not for angels. But what else is such a notion than the desire to glory over our very impiety? For "Christ," as the apostle says, "in due time died for the ungodly." Where it is not any desert of ours, but the mercy of God, that is commended. For what can be the character of the man who wishes himself to be lauded, because he has become so abominably diseased through his own wickedness, that he can only be healed by the death of his physician? That surely is not the glory of our deserts, but the medicine of our diseases. Or do we prefer ourselves to the angels on this account, that, while there are angels also who have sinned, there has been no such labor expended on their healing? As if something that was at least small in amount had been undertaken for them, and what was greater for us. But had even such been the case, it might still be a subject of inquiry whether it was so because we had once stood in a position of superior excellence, or because we were now lying in a more desperate condition. But knowing as we do that the Creator of all good has imparted no grace for the reparation of angelic evils, why do we not rather draw the inference that their fault was judged all the more damnable, that the nature of those who committed it was of a loftier sublimity? For to the same extent as they less than we ought to have fallen into sin, were they superior in nature to us. But now in offending against the Creator they became all the more detestably ungrateful for His beneficence, that they were created capable of exercising the greater beneficence; nor was it enough for them to become deserters from Him, but they must also become our deceivers. This, therefore, is the great goodness of which we are to be made the subjects by Him, who hath loved us even as He hath loved Christ, that, for His sake, whose members He wished us to be, we may be equal to the holy angels, to whom we were created with an inferiority of nature, and have by our sin fallen into such greater depths of unworthiness, as to make it incumbent that we should be in some sort their associates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520110.html'
source_title="Tractates on John 110"
