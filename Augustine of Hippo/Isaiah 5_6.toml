
[[commentary]]
quote='''
And what are His clouds? His Apostles, His preachers, by whom He thundered in precepts, lightened in miracles. The same are clouds who are also mountains: mountains for their height and firmness, clouds for their rain and fruitfulness. For these clouds watered the earth, of which it was said, “The Most High gave His Voice, and the earth was moved.” For it is of those clouds that He threateneth a certain barren vineyard, whence the mountains were carried into the heart of the sea; “I will command,” saith He, “the clouds that they rain no rain upon it.” This was fulfilled in that which I have mentioned, when the mountains were carried into the heart of the sea; when it was said, “It was necessary that the word of God should have been spoken first to you; but seeing ye put it from you, we turn to the Gentiles;” then was fulfilled, “I will command the clouds that they rain no rain upon it.” The nation of the Jews hath just so remained as a fleece dry upon the ground.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"

[[commentary]]
quote='''
What clouds? The preachers of the word of truth. What clouds? Those concerning which God doth menace a certain vineyard, which instead of grape had brought forth thorns and He saith, “I will command My clouds, that they rain no rain upon it.” In a word, the Apostles forsaking the Jews, went to the Gentiles: in preaching Christ among all nations, “the clouds have uttered a voice.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252077.html'
source_title="Exposition on Psalm 77"
