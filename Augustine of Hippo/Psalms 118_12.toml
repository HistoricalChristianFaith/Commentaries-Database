[[commentary]]
quote='''
“They came about me as bees do a hive, and burned up even as the fire among the thorns: and in the Name of the Lord have I taken vengeance on them” (ver. 12). Here then the order of the words corresponds with the order of events. For we rightly understand that our Lord Himself, the Head of the Church, was surrounded by persecutors, even as bees surround a hive. For the Holy Spirit is speaking with mystic subtlety of what was done by those who knew not what they did. For bees make honey in the hives: while our Lord’s persecutors, unconscious as they were, rendered Him sweeter unto us even by His very Passion; so that we may taste and see how sweet is the Lord, “Who died for our sins, and arose for our justification.” But what followeth, “and burned up even as the fire among the thorns,” is better understood of His Body, that is, of a people spread abroad, whom all nations compassed about, since it was gathered together from all nations. They consumed this sinful flesh, and the grievous piercings of this mortal life, in the flame of persecution. “Taken vengeance on them:” either because they themselves, that wickedness, which in them persecuted the righteous, having been extinguished, were joined with the people of Christ; or because the rest of them, who have at this time scorned the mercy of Him who calleth them, will at the end feel the truth of Him who judgeth them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520118.html'
source_title="Exposition on Psalm 118"
