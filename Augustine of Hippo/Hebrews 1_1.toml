[[commentary]]
quote='''
You see, those old sacrifices of the people of God also represented in a variety of ways this single one that was to come. Christ himself, I mean, was both a sheep, because of his innocence and simplicity of soul, and a goat because of "the likeness of sinful flesh." And whatever else was foretold "in many and various ways" in the sacrifices of the old covenant refers to this single one which has been revealed in the new covenant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520228B.html'
source_title="SERMON 228B.2"

[[commentary]]
quote='''
What followeth? “Once hath God spoken, these two things I have heard, that power is of God (ver. 11), and to Thee, O Lord, is mercy, for Thou shalt render to each one after his works” (ver. 12).…“Once hath God spoken.” What sayest thou, Idithun? If thou that hadst leapt over them art saying, “Once He hath spoken;” I turn to another Scripture and it saith to me, “In many quarters and in many ways formerly God hath spoken to the fathers in the prophets.” What is, “Once hath God spoken”? Is He not the God that in the beginning of mankind spake to Adam? Did not the Selfsame speak to Cain, to Noe, to Abraham, to Isaac, to Jacob, to all the Prophets, and to Moses? One man Moses was, and how often to him spake God? Behold even to one man, not once but ofttimes God hath spoken. Secondly, He hath spoken to the Son when standing here, “Thou art My beloved Son.” God hath spoken to the Apostles, He hath spoken to all the Saints, even though not with voice sounding through the cloud, nevertheless in the heart where He is Himself Teacher. What is therefore, “Once hath God spoken”? Much hath that man leapt over in order to arrive at that place, where once God hath spoken. Behold briefly I have spoken to your Love. Here among men, to men ofttimes, in many ways, in many quarters, through creatures of many forms God hath spoken: by Himself once God hath spoken, because One Word God hath begotten.…For it could not be but that God did Himself know that which by the Word He made: but if that which He made He knew, in Him there was that which was made before it was made. For if in Him was not that which was made before it was made, how knew He that which He made? For thou canst not say that God made things He knew not. God therefore hath known that which He hath made. And how knew He before He made, if there cannot be known any but things made? But by things made there cannot be known any but things previously made, by thee, to wit, who art a man made in a lower place, and set in a lower place: but before that all these things were made, they were known by Him by whom they were made, and that which He knew He made. Therefore in that Word by which He made all things, before that they were made, were all things; and after they have been made there are all things; but in one way here, in another there, in one way in their own nature wherein they have been made, in another in the art by which they have been made. Who could explain this? We may endeavour: go ye with Idithun, and see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"
