[[commentary]]
quote='''
“Send Thee help from the Holy, and from Sion defend Thee” (ver. 2). Making for Thee a sanctified Body, the Church, from watching safe, which waiteth when Thou shalt come from the wedding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252020.html'
source_title="Exposition on Psalm 20"
