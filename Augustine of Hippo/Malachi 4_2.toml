[[commentary]]
quote='''
Now the “horn of His people” is humble in afflictions, in tribulations, in temptations, in beating of the breast; when will He “exalt the horn of His people”? When the Lord hath come, and our Sun is risen, not the sun which is seen with the eye, and “riseth upon the good and the evil,” but That whereof is said, To you that hear God, “the Sun of Righteousness shall rise, and healing in His wings;” and of whom the proud and wicked shall hereafter say, “The light of righteousness hath not shined unto us, and the sun of righteousness rose not upon us.” This shall be our summer. Now during the winter weather the fruits appear not on the stock; thou observest, so to say, dead trees during the winter. He who cannot see truly, thinketh the vine dead; perhaps there is one near it which is really dead; both are alike during winter; the one is alive, the other is dead, but both the life and death are hidden: summer advanceth; then the life of the one shineth brightly, the death of the other is manifested: the splendour of leaves, the abundance of fruit, cometh forth, the vine is clothed in outward appearance from what it hath in its stock. Therefore, brethren, now we are the same as other men: just as they are born, eat, drink, are clothed, pass their life, so also do the saints. Sometimes the very truth deceiveth men, and they say, “Lo, he hath begun to be a Christian: hath he lost his headache?” or, “because he is a Christian, what gaineth he from me?” O dead vine, thou observest near thee a vine that is bare indeed in winter, yet not dead. Summer will come, the Lord will come, our Splendour, that was hidden in the stock, and then “He shall exalt the horn of His people,” after the captivity wherein we live in this mortal life.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520148.html'
source_title="Exposition on Psalm 148"
