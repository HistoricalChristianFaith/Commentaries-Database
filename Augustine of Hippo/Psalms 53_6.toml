[[commentary]]
quote='''
And as though to these very persons He were turned, He saith, “Who shall give out of Sion salvation to Israel?” (ver. 7). O ye fools, ye revile, insult, buffet, besmear with spittings, with thorns ye crown, upon the Cross ye lift up; whom? “Who shall give out of Sion salvation to Israel?” Shall not That Same of whom ye have said, “He is not God”? “In God’s turning away the captivity of His people.” For there turneth away the captivity of His people, no one but He that hath willed to be a captive in your own hands. But what men shall understand this thing? “Jacob shall exult, and Israel shall rejoice.” “Israel;” the true Jacob, and the true Israel, that younger, to whom the elder was servant, shall himself exult, for he shall himself understand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252053.html'
source_title="Exposition on Psalm 53"
