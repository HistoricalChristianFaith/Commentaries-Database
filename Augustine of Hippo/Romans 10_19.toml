[[commentary]]
quote='''
When he says, according to the testimony of Moses: I will lead you to jealousy by that which is not a nation; by a foolish nation I will provoke you—by saying a foolish nation, he explained what he had said, that which is not a nation, as though that which is foolish should not even be called a nation. Yet by the faith of this nation he says the Jewish people is to be provoked, because the Gentiles laid hold of what the Jews rejected. Or else, that which is not a nation, a foolish nation, means that, since it was a foolish nation—every people worshiping idols—it nevertheless laid aside its heathenism by believing. Hence too is that saying: If, then, the uncircumcised keep the righteousness of the law, shall not his uncircumcision be counted as circumcision? So that this is the sense: I will lead you to jealousy by that which has become no nation, laying aside its heathenism through faith in Christ, though it had been a foolish nation in worshiping idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
