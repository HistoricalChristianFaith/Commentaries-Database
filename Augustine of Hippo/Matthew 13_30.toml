[[commentary]]
quote='''
(Quaest. in Matt. q. 12.) It may be asked why He commands more than one bundle or heap of tares to be formed? Perhaps because of the variety of heretics differing not only from the wheat, but also among themselves, each several heresy, separated from communion with all the others, is designated as a bundle; and perhaps they may even then begin to be bound together for burning, when they first sever themselves from the Catholic communion, and begin to have their independent church, so that it is the burning and not the binding into bundles that will take place at the end of the world. But were this so, there would not be so many who would become wise again, and return from error into the Catholic Church. Wherefore we must understand the binding into bundles to be what shall come to pass in the end, that punishment should fall on them not promiscuously, but in due proportion to the obstinacy and wilfulness of each separate error.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
At present therefore let the righteous bear with the sinner; let the wheat bear with the tares; let the grain bear with the chaff: for the time of separation will come, and the good seed shall be set apart from that which is to be consumed with fire. The one will be consigned to the garner, the other to “everlasting burning;” for it was for this reason that the just and the unjust were at the first together; that the one should lay a stumbling-block, that the other should be proved; that afterwards the one should be condemned, the other receive a crown.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"
