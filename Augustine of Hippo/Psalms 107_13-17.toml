
[[commentary]]
quote='''
“And they cried unto the Lord when they were troubled, and He delivered them out of their distresses” (ver. 13). They were freed from the second temptation. There remains that of weariness and loathing. But first see what He did for them when freed. “And He led them out of darkness and the shadow of death, and brake their bonds asunder” (ver. 14). “Let them confess to the Lord His mercies, and His wonders to the children of men” (ver. 15). Wherefore? what difficulties hath He overcome? “Because He brake the gates of brass, and snapped the bars of iron” (ver. 16). “He took them up from the way of their iniquity, for because of their unrighteousnesses they were brought low” (ver. 17). Because they gave honour to themselves, not to God, because they were establishing their own righteousness, not knowing the righteousness of God, they were brought low. They found that they were helpless without His aid, who were presuming on their own strength alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520107.html'
source_title="Exposition on Psalm 107"
