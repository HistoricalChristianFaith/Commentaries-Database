[[commentary]]
quote='''
“The imprudent and unwise shall perish together.” Who is “the imprudent”? He that looketh not out for himself for the future. Who is “the unwise”? He that perceiveth not in what evil case he is. But do thou perceive in what evil case thou art now, and look out that thou be in a good case for the future. By perceiving in what evil case thou art, thou wilt not be unwise: by looking out for thyself for the future, thou wilt not be imprudent. Who is he that looketh out for himself? That servant to whom his master gave what he should expend, and afterwards said to him, “Thou canst not be my steward, give an account of thy stewardship;” and who answered, “What shall I do? I cannot dig, to beg I am ashamed;” had, nevertheless, by even his master’s goods made to himself friends, who might receive him when he was put out of his stewardship. Now he cheated his master in order that he might get to himself friends to receive him: fear not thou lest thou be cheating, the Lord Himself exhorteth thee to do so: He saith Himself to thee, “Make to thyself friends of the mammon of unrighteousness.” Perhaps what thou hast got, thou hast gotten of unrighteousness: or perhaps this very thing is unrighteousness, that thou hast and another hath not, thou aboundest and another needeth. Of this mammon of unrighteousness, of these riches which the unrighteous call riches, make to thyself friends, and thou shalt be prudent: thou art gaining for thyself, and art not cheating. For now thou seemest to lose it. Wilt thou lose it if thou place it in a treasury? For boys, my brethren, no sooner find some money, wherewith to buy something, than they put it in a money-box, which they open not until afterwards: do they, because they see not what they have got, on that account lose it? Fear not: boys put in a money-box, and are secure: dost thou place it in the hand of Christ, and fear? Be prudent, and provide for thyself against the future in Heaven. Be therefore prudent, copy the ant, as saith the Scripture: “Store in summer, lest thou hunger in winter;” the winter is the last day, the day of tribulation; the winter is the day of offences and of bitterness: gather what may be there for thee for the future: but if thou doest not so, thou wilt perish both imprudent and unwise.

But that rich man too died, and a like funeral was made for him. See to what men have brought themselves: they regard not what a wicked life he led while he lived, but what pomp followed him when he died! O happy he, whom so many lament! But the other lived in such sort, that few lament. For all ought to lament a man living so sadly. But there is the funeral train; he is received in a costly tomb, he is wound in costly robes, he is buried in perfumes and spices. Secondly, what a monument he hath! How marbled! Doth he live in that same monument? He is therein dead. Men deeming these to be good things, have strayed from God, and have not sought the true good things, and have been deceived with the false. To this end see what followeth. He who gave not the price of the redemption of his soul, who understood not death, because he saw wise men dying, he became imprudent and unwise, in order that he might die with them. And how shall they perish, who “shall leave their riches to aliens”?…

But do those same aliens indeed serve them who are called their own? Hear in what they serve them, observe how they are ridiculed: why hath he said, “to strangers”? Because they can do them no good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"
