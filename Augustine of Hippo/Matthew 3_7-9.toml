[[commentary]]
quote='''
To the sixth age belongs John the Baptist, than whom none greater has arisen among those born of women; of whom it was said, that he was "greater than a prophet." And how did John show that Christ was sent to all nations? When the Jews came to him to be baptized, that they might not pride themselves on the name of Abraham, he said to them, "O generation of vipers, who has proclaimed to you to flee from the wrath to come? Bring forth therefore fruit worthy of repentance;" that is, be humble; for he was speaking to proud people. But whereof were they proud? Of their descent according to the flesh, not of the fruit of imitating their father Abraham. What said he to them? "Say not, We have Abraham for our father: for God is able of these stones to raise up children to Abraham." Meaning by stones all nations, not on account of their durable strength, as in the case of that stone which the builders rejected, but on account of their stupidity and their foolish insensibility, because they had become like the things which they were accustomed to worship: for they worshipped senseless images, themselves equally senseless. "They that make them are like them, and so are all they that trust in them." Accordingly, when men begin to worship God,what do they hear said to them? "That ye may be the children of your Father who is in heaven; who maketh His sun to rise on the good and on the evil, and sendeth rain on the just and on the unjust." Wherefore, if a man becomes like that which he worships, what is meant by "God is able of these stones to raise up children unto Abraham"? Let us ask ourselves and we shall see that it is a fact. For of those nations are we come, but we should not have come of them had not God of the stones raised up children unto Abraham. We are made children of Abraham by imitating his faith, not by being born of his flesh. For just as they by their degeneracy have been disinherited, so have we by imitating been adopted. Therefore, brethren, this prophecy also of the sixth water-pot extended to all nations; and hence it was said concerning all, "containing two or three metretae apiece."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25209.html'
source_title="Tractates on John 9"

[[commentary]]
quote='''
And so, when the Jews came to John to be baptized, he broke out upon them, and addressed them, "O generation of vipers." Very greatly indeed did they boast of the loftiness of their origin, but he called them a generation of vipers,-not even of human beings, but of vipers. He saw the form of men, but detected the poison. Yet they had come to be changed, because at all events to be baptized; and he said to them, "O generation of vipers, who hath warned you to flee from the wrath to come? Bring forth therefore fruits meet for repentance. And think not to say within yourselves, We have Abraham to our father; for God is able of these stones to raise up children unto Abraham." If ye bring not forth fruits meet for repentance, flatter not yourselves about such a lineage. God is able to condemn you, without defrauding Abraham of children. For He has a way to raise up children to Abraham. Those who imitate his faith shall be made his children. "God is able of these stones to raise up children unto Abraham." Such are we. In our parents we were stones, when we worshipped stones for our god. Of such stones God has created a family to Abraham.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252042.html'
source_title="Tractates on John 42"
