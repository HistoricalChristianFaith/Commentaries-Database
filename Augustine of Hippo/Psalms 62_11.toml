[[commentary]]
quote='''
We have read where it is said in another Psalm, “God hath spoken once.” So often has He spoken by the Prophets, so often by the Apostles, and in these days by His Saints, and does He say, “God has spoken once”? How can He have spoken but “once,” except with reference to His “Word”? But as the “Mine heart hath uttered a good Word,” was understood by us in the other clause of the generation of the Son, it seems that a kind of repetition is made in the following sentence, so that the “Mine heart hath uttered a good Word,” which had been already said, is repeated in what He is now saying, “I speak.” For what does “I speak” mean? “I utter a Word.” And whence but from His heart, from His very inmost, does God utter the Word? You yourself do not speak anything but what you bring forth from your “heart,” this word of yours which sounds once and passes away, is brought forth from no other place: and do you wonder that God “speaks” in this manner? But God’s “speaking” is eternal. You are speaking something at the present moment, because you were silent before: or, look you, you have not yet brought forth your word; but when you have begun to bring it forth, you as it were “break silence;” and bring into being a word, that did not exist before. It was not so God begat the “Word.” God’s “speaking” is without beginning, and without end: and yet the “Word” He utters is but “One.” Let Him utter another, if what He has spoken shall have passed away. But since He by whom it is uttered abideth, and That which is uttered abideth; and is uttered but once, and has no end, that very “once” too is said without beginning, and there is no second speaking, because that which is said once, does not pass away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"

[[commentary]]
quote='''
What followeth? “Once hath God spoken, these two things I have heard, that power is of God (ver. 11), and to Thee, O Lord, is mercy, for Thou shalt render to each one after his works” (ver. 12).…“Once hath God spoken.” What sayest thou, Idithun? If thou that hadst leapt over them art saying, “Once He hath spoken;” I turn to another Scripture and it saith to me, “In many quarters and in many ways formerly God hath spoken to the fathers in the prophets.” What is, “Once hath God spoken”? Is He not the God that in the beginning of mankind spake to Adam? Did not the Selfsame speak to Cain, to Noe, to Abraham, to Isaac, to Jacob, to all the Prophets, and to Moses? One man Moses was, and how often to him spake God? Behold even to one man, not once but ofttimes God hath spoken. Secondly, He hath spoken to the Son when standing here, “Thou art My beloved Son.” God hath spoken to the Apostles, He hath spoken to all the Saints, even though not with voice sounding through the cloud, nevertheless in the heart where He is Himself Teacher. What is therefore, “Once hath God spoken”? Much hath that man leapt over in order to arrive at that place, where once God hath spoken. Behold briefly I have spoken to your Love. Here among men, to men ofttimes, in many ways, in many quarters, through creatures of many forms God hath spoken: by Himself once God hath spoken, because One Word God hath begotten.…For it could not be but that God did Himself know that which by the Word He made: but if that which He made He knew, in Him there was that which was made before it was made. For if in Him was not that which was made before it was made, how knew He that which He made? For thou canst not say that God made things He knew not. God therefore hath known that which He hath made. And how knew He before He made, if there cannot be known any but things made? But by things made there cannot be known any but things previously made, by thee, to wit, who art a man made in a lower place, and set in a lower place: but before that all these things were made, they were known by Him by whom they were made, and that which He knew He made. Therefore in that Word by which He made all things, before that they were made, were all things; and after they have been made there are all things; but in one way here, in another there, in one way in their own nature wherein they have been made, in another in the art by which they have been made. Who could explain this? We may endeavour: go ye with Idithun, and see.

…For even the Lord saith, “Many things I have to say to you, but ye cannot bear them now.” What is therefore, “These two things I have heard”? These two things which to you I am about to say not of myself to you I say, but what things I have heard I say. “Once hath God spoken:” One Word hath He, the Only-begotten God. In that Word are all things, because by the Word were made all things. One Word hath He, “in whom all the treasures of wisdom and knowledge are hidden.” One Word He hath, “once hath God spoken.” “These two things,” which to you I am about to say, these I have heard: not of myself I speak, not of myself I say: to this belongeth the “I have heard.” But the friend of the Bridegroom standeth and heareth Him, that he may speak the truth. For he heareth Him, lest by speaking a lie, of his own he should speak: lest thou shouldest say, Who art thou that sayest this thing to me? whence dost thou say this to me? I have heard these two things, and I that speak to thee that I have heard these two things, am one who also doth know that once God hath spoken. Do not despise a hearer saying to thee certain two things for thee so necessary; him, I say, that by leaping over the whole creation hath attained unto the Only-begotten Word of God, where he hath learned that “once God hath spoken.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"
