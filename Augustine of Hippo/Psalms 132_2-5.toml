[[commentary]]
quote='''
For what purpose? “How he sware unto the Lord, and vowed a vow unto the Almighty God of Jacob” (ver. 2). Therefore remember for this, that he may fulfil what he hath promised. David himself vowed as though he had it in his power, and he prayeth God to fulfil his vow: there is devotion in the vow, but there is humility in the prayer. Let no one presume to think he fulfilled by his own strength what he hath vowed. He who exhorteth thee to vow, Himself aideth thee to fulfil. Let us therefore see what he vowed, and hence we comprehend how David should be understood in a figure. “David” is interpreted, “Strong of hand,” for he was a great warrior. Trusting indeed in the Lord his God, he despatched all wars, he laid low all his enemies, God helping him, according to the dispensation of that kingdom; prefiguring nevertheless some One strong of hand to destroy His enemies, the devil and his angels. These enemies the Church warreth against, and conquereth.…What then doth he mean, “How he sware,” etc.? Let us see what vow is this. We can offer God nothing more pleasing than to swear. Now to swear is to promise firmly. Consider this vow, that is, with what ardour he vowed what he vowed, with what love, with what longing; nevertheless, he prayeth the Lord to fulfil it in these words, “O Lord, remember David, and all his meekness.” In this temper he vowed his vow, and there should be a house of God: “I will not come within the tabernacle of mine house, nor climb up into my bed” (ver. 3). “I will not suffer mine eyes to sleep, nor mine eyelids to slumber” (ver. 4). This seemeth not enough; he adds, “Neither the temples of my head to take any rest, until I find out a place for the Lord; an habitation for the God of Jacob” (ver. 5). Where did he seek a place for the Lord? If he was meek, he sought it in himself. For how is one a place for the Lord? Hear the Prophet: “Upon whom shall My Spirit rest? Even upon him that is poor and of a contrite spirit, and trembleth at My words.” Dost thou wish to be a place for the Lord? Be thou poor in spirit, and contrite, and trembling at the word of God, and thou wilt thyself be made what thou seekest. For if what thou seekest be not realized in thyself, what doth it profit thee in another.…

How many thousands believed, my brethren, when they laid down the price of their possessions at the Apostles’ feet! But what saith Scripture of them? Surely they are become a temple of God; not only each respectively a temple of God, but also all a temple of God together. They have therefore become a place for the Lord. And that ye may know that one place is made for the Lord in all, Scripture saith, They were of one heart and one soul toward God. But many, so as not to make a place for the Lord, seek their own things, love their own things, delight in their own power, are greedy for their private interests. Whereas he who wisheth to make a place for the Lord, should rejoice not in his private, but the common good.…

Let us therefore, brethren, abstain from the possession of private property; or from the love of it, if we may not from its possession; and we make a place for the Lord. It is too much for me, saith some one. But consider who thou art, who art about to make a place for the Lord. If any senator wished to be entertained at your house, I say not senator, the deputy of some great man of this world, and should say, something offends me in thy house; though thou shouldest love it, thou wouldest remove it, nevertheless, lest thou shouldest offend him, whose friendship thou wast courting. And what doth man’s friendship profit thee?…Desire the friendship of Christ without fear: He wishes to be entertained at thy house; make room for Him. What is, make room for Him? Love not thyself, love Him. If thou love thyself, thou shuttest the door against Him; if thou love Him, thou openest unto Him: and if thou open and He enter, thou shalt not be lost by loving thyself, but shalt find thyself with Him who loveth thee.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520132.html'
source_title="Exposition on Psalm 132"
