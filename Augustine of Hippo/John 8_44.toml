[[commentary]]
quote='''
Someone may object that the words of the Lord about the devil [here] … are to be understood as if he was not only a murderer from the beginning of the human race when human beings, whom he could kill by his deceit, were made; but also that he did not abide in the truth from the time of his own creation and was accordingly never blessed with the holy angels. Instead he refused to submit to his Creator and proudly exulted as if in a private lordship of his own. In this way he was deceived and deceiving.… But they do not notice that the Lord did not say, "The devil was naturally a stranger to the truth" but "The devil did not remain in the truth." By this, he meant us to understand that the devil had fallen from the truth in which, if he had remained, he would have become a partaker and would have remained in blessedness along with the holy angels.…They suppose [according to 1 John 3:8] that the devil was made with a sinful nature, but they misunderstand the passage; for if sin is natural, it is not sin at all. And how do they answer the prophetic proofs—either what Isaiah says when he represents the devil under the person of the king of Babylon, "How you are fallen, O Lucifer, son of the morning!" or what Ezekiel says, "You were in Eden, the garden of God …" where it is meant that he was at some point without sin? For a little after, it is still more explicitly said, "You were perfect in your ways." And if these passages cannot be interpreted properly in any other way, then we must understand by this passage also, "He did not remain in the truth," that he was once in the truth but did not remain in it. And from this passage, "The devil has sinned from the beginning," it is not that he sinned from the beginning of his created existence; rather, sin began in him, and he was the beginning of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252011.html'
source_title="City of God 11.13, 15"

[[commentary]]
quote='''
(Tr. xlii. 10) Here we must guard against the heresy of the Manichæans, who hold a certain original nature of evil, and a nation of darkness with princes at their head, whence the devil derives his existence. And thence they say our flesh is produced; and in this way interpret our Lord's speech, Ye are of your father the devil: viz. to mean that they were by nature evil, drawing their origin from the opposite seed of darkness.

(Tr. xlii. 11) The Jews then were children of the devil by imitation, not by birth: And the lusts of your father ye will do, our Lord says. Ye are his children then, because ye have such lusts, not because ye are born of him: for ye seek to kill Me, a man that hath told you the truth: and he envied man, and killed him: he was a murderer from the beginning; i. e. of the first man on whom a murder could be committed: man could not be slain, before man was created. The devil did not go, girt with a sword, against man: he sowed an evil word, and slew him. Do not suppose therefore that you are not guilty of murder, when you suggest evil thoughts to your brother. The very reason why ye rage against the flesh, is that ye cannot assault the soul.

(xi. de Civ. Dei, c. 13) But it will be objected perhaps, that if from the beginning of his existence, the devil stood not in the truth, he was never in a state of blessedness with the holy angels, refusing, as he did, to be subject to his Creator, and therefore false and deceitful; unwilling at the cost of pious subjection to hold that which by nature he was; and attempting in his pride and loftiness to simulate that which he was not. This opinion is not the same with that of the Manichæans, that the devil has his own peculiar nature, derived as it were from the opposite principle of evil. This foolish sect does not see that our Lord says not, Was alien from the truth, but Stood not in the truth, meaning, fell from the truth. And thus they interpret John, The devil sinneth from the beginning, (1 John 3:8) not seeing that if sin is natural, it is no sin. But what do the testimonies of the prophets reply? Isaiah, setting forth the devil under the figure of the prince of Babylon, says, How art thou fallen from heaven, O Lucifer, son of the morning! (Ezek. 28:13) Ezekiel says, Thou hast been in Eden, the garden of God. Which passages, as they cannot be interpreted in any other way, show that we must take the word, He stood not in the truth, to mean, that he was in truth, but did not remain in it; and the other, that the devil sinneth from the beginning, to mean, that he was a sinner not from the beginning of his creation, but from the beginning of sin. For sin began in him, and he was the beginning of sin.

(xi. de Civ. Dei, c. xiv) Or when our Lord says, The truth is not in him, He intends it as an index: as if we had asked Him, how it appeared that the devil stood not in the truth; and He said, Because the truth is not in him. For it would be in him, if he stood in it.
When he speaketh a lie, he speaketh of his own: for he is a liar, and the father of it.

(Tr. xlii. s. 12, 13) Some have thought from these words that the devil had a father, and asked who was the father of the devil. This is the error of the Manichæans. But our Lord calls the devil the father of a lie for this reason: Every one who lies is not the father of his own lie; for you may tell a lie, which you have received from another; in which case you have lied, but are not the father of the lie. But the lie wherewith, as with a serpent's bite, the devil slew man. had no source but himself: and therefore he is the father a lie, as God is the Father of the truth.

(de Quæst. Nov. et Vet. Test. 2, 90) Or thus: The devil is not a singular, but a common name. In whomsoever the works of the devil are found, he is to be called the devil. It is the name of a work, not of a nature. Here then our Lord means by the father of the Jews, Cain; whom they wished to imitate, by killing the Saviour: for he it was who set the first example of murdering a brother. That he spoke a lie of his own, means that no one sins but by his own will. And inasmuch as Cain imitated the devil, and followed his works, the devil is said to be his father.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Here, now, we must beware of the heresy of the Manicheans, which affirms that there is a certain principle of evil, and a certain family of darkness with its princes, which had the presumption to fight against God; but that God, not to let His kingdom be subdued by the hostile family, despatched against them, as it were, His own offspring, princes of His own [kingdom of] light; and so subdued that race from which the devil derives his origin. From thence, also, they say our flesh derives its origin, and accordingly think the Lord said, "Ye are of your father the devil," because they were evil, as it were, by nature, deriving their origin from the opposing family of darkness. So they err, so their eyes are blinded, so they make themselves the family of darkness, by believing a falsehood against Him who created them. For every nature is good; but man's nature has been corrupted by an evil will. What God made cannot be evil, if man were not [a cause of] evil to himself. But surely the Creator is Creator, and the creature a creature [a thing created]. The creature cannot be put on a level with the Creator. Distinguish between Him who made, and that which He made. The bench cannot be put on a level with the mechanic, nor the pillar with its builder; and yet the mechanic, though he made the bench, did not himself create the wood. But the Lord our God, in His omnipotence and by the Word, made what He made. He had no materials out of which to make all that He made, and yet He made it. For they were made because He willed it, they were made because He said it; but the things made cannot be compared with the Maker. If thou seekest a proper subject of comparison, turn thy mind to the only-begotten Son. How, then, were the Jews the children of the devil? By imitation, not by birth. Listen to the usual language of the Holy Scriptures. The prophet says to those very Jews, "Thy father was an Amorite, and thy mother a Hittite." The Amorites were not a nation that gave origin to the Jews. The Hittites also were themselves of a nation altogether different from the race of the Jews. But because the Amorites and Hittites were impious, and the Jews imitated their impieties, they found parents for themselves, not of whom they were born, but in whose damnation they should share, because following their customs. But perhaps you inquire, Whence is the devil himself? From the same source certainly as the other angels. But the other angels continued in their obedience . He, by disobedience and pride, fell as an angel, and became a devil.

But listen now to what the Lord says: "Ye," said He, "are of your father the devil, and the lusts of your father ye will do." This is how ye are his children, because such are your lusts, not because ye are born of him. What are his lusts? "He was a murderer from the beginning." This it is that explains, "the lusts of your father ye will do." "Ye seek to kill me, a man that telleth you the truth." He, too, had ill-will to man, and slew man. For the devil, in his ill-will to man, assuming the guise of a serpent, spoke to the woman, and from the woman instilled his poison into the man. They died by listening to the devil, whom they would not have listened to had they but listened to the Lord; for man, having his place between Him who created and him who was fallen, ought to have obeyed the Creator, not the deceiver. Therefore "he was a murderer from the beginning." Look at the kind of murder brethren. The devil is called a murderer not as armed with a sword, or girded with steel. He came to man, sowed his evil suggestions, and slew him. Think not, then, that thou art not a murderer when thou persuadest thy brother to evil. If thou persuadest thy brother to evil, thou slayest him. And to let thee know that thou slayest him, listen to the psalm: "The sons of men, whose teeth are spears and arrows, and their tongue a sharp sword." Ye, then, "will do the lusts of your father;" and so ye go madly after the flesh, because ye cannot go after the spirit. "He was a murderer from the beginning;" at least in the case of the first of mankind. From the very time that murder [manslaughter] could possibly be committed, he was a murderer [manslayer]. Only from the time that man was made could manslaughter be committed. For man could not be slain unless man was previously made. Therefore, "he was a murderer from the beginning." And whence a murderer? "And he stood [abode] not in the truth." Therefore he was in the truth, and fell by not standing in it. And why "stood he not in the truth"? "Because the truth is not in him;" not as in Christ. In such a way is the truth [in Him], that Christ Himself is the Truth. If, then, he had stood in the truth, he would have stood in Christ; but "he abode not in the truth, because there is no truth in him."

"When he speaketh a lie, he speaketh of his own: for he is a liar, and the father of it." What is this? You have heard the words of the Gospel: you have received them with attention. Here now, I repeat them, that you may clearly understand the subject of your thoughts. The Lord said those things of the devil which ought to have been said of the devil by the Lord. That "he was a murderer from the beginning" is true, for he slew the first man; "and he abode not in the truth," for he lapsed from the truth. "When he speaketh a lie," to wit, the devil himself, "he speaketh of his own;" for he is a liar, and its [his] father." From these words some have thought that the devil has a father, and have inquired who was the father of the devil. Indeed this detestable error of the Manicheans has found means down to this present time wherewith to deceive the simple. For they are wont to say, Suppose that the devil was an angel, and fell; and with him sin began as you say; but, Who was his father? We, on the contrary, reply, Who of us ever said that the devil had a father? And they, on the other hand, rejoin, The Lord saith, and the Gospel declares, speaking of the devil, "He was a murderer from the beginning, and abode not in the truth, because there is no truth in him. When he speaketh a lie, he speaketh of his own: for he is a liar, and his father."

Hear and understand. I shall not send thee far away [for the meaning]; understand it from the words themselves. The Lord called the devil the father of falsehood. What is this? Hear what it is, only revolve the words themselves, and understand. It is not every one who tells a lie that is the father of his lie. For if thou hast got a lie from another, and uttered it, thou indeed hast lied in giving utterance to the lie; but thou art not the father of that lie, because thou hast got it from another. But the devil was a liar of himself. He begat his own falsehood; he heard it from no one. As God the Father begat as His Son the Truth, so the devil, having fallen, begat falsehood as his son. Hearing this, recall now and reflect upon the words of the Lord. Ye catholic minds, consider what ye have heard; attend to what He says. "He"-who? The devil-"was a murderer from the beginning." We admit it,-he slew Adam. "And he abode not in the truth." We admit it, for he lapsed from the truth. "Because there is no truth in him." True: by falling away from the truth he has lost its possession. "When he speaketh a lie, he speaketh of his own: for he is a liar, and the father of it." He is both a liar, and the father of lies. For thou, it may be, art a liar, because thou utterest a lie; but thou art not its father. For if thou hast got what thou sayest from the devil, and hast believed the devil, thou art a liar, but not the father of the lie. But he, because he got not elsewhere the lie wherewith in serpent-form he slew man as if by poison, is the father of lies just as God is Father of truth. Withdraw, then, from the father of lies: make haste to the Father of truth; embrace the truth, that you may enter into liberty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252042.html'
