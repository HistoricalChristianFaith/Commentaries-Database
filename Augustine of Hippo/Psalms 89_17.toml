[[commentary]]
quote='''
“For Thou art the glory of their strength: and in Thy good pleasure Thou shalt lift up our horns” (ver. 17): because it has seemed good to Thee, not because we are worthy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
