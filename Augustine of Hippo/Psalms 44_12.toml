[[commentary]]
quote='''
“Thou hast sold Thy people for no price” (ver. 12). For we see whom Thou hast made over; what Thou hast received, we have not seen. “And there was no multitude in their jubilees.” For when the Christians were flying before the pursuit of enemies, who were idolaters, were there then held any congregations and “jubilees” to the honour of God? Were those Hymns chanted in concert from the Churches of God, that are wont to be sung in concert in time of peace, and to be sounded in a sweet accord of the brotherhood in the ears of God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252044.html'
source_title="Exposition on Psalm 44"
