[[commentary]]
quote='''
If past events in the prophetic books serve as a figure of future ones, in the king named Nebuchadnezzar two periods were foreshadowed: that during the time of the apostles and the present one in which Christ is now living. For in the times of the apostles and martyrs that part was fulfilled that was foreshadowed when the king forced devout and upright men to adore an idol and when they refused had them thrown into a fire. Now, however, that part is fulfilled that was prefigured in the same king when he was converted to the true God and decreed for his realm that whoever blasphemed the God of Shadrach, Meshach and Abednego should suffer due penalties. Therefore, the first part of the king's reign signified the earlier periods of impious kings, when Christians suffered instead of the impious, but the latter part of that king's reign signified the period of later faithful kings under whom the impious suffered instead of the Christians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 93"

[[commentary]]
quote='''
We read Daniel's visions and prophetical histories. The three children praised the Lord in the fire: King Nebuchadnezzar wondered at the children praising God, and at the fire around them doing them no harm: and whilst he wondered, what did King Nebuchadnezzar say, he who was neither a Jew nor circumcised, who had set up his own image and compelled all men to adore it; but, impressed by the praises of the three children when he saw the majesty of God present in the fire what said he? "And I will publish a decree to all tribes and tongues in the whole earth." What sort of decree? "Whosoever shall speak blasphemy against the God of Shadrach, Meshach, and Abednego, shall be cut off, and their houses shall be made a ruin." See how an alien king acts with raging indignation that the God of Israel might not be blasphemed, because He was able to deliver the three children from the fire: and yet they would not have Christian kings to act with severity when Christ is contemptuously rejected, by whom not three children, but the whole world, with these very kings, is delivered from the fire of hell! For those three children, my brethren, were delivered from temporal fire. Is He not the same God who was the God of the Maccabees and the God of the three children? The latter He delivered from the fire; the former did in body perish in the torments of fire, but in mind they remained steadfast in the ordinances of the law. The latter were openly delivered, the former were crowned in secret. It is a greater thing to be delivered from the flame of hell than from the furnace of a human power. If, then, Nebuchadnezzar praised and extolled and gave glory to God because He delivered three children from the fire, and gave such glory as to send forth a decree throughout his kingdom, "Whosoever shall speak blasphemy against the God of Shadrach, Meshach, and Abednego, shall be cut off, and their houses shall be brought to ruin," how should not these kings be moved, who observe, not three children delivered from the flame, but their very selves delivered from hell, when they see Christ, by whom they have been delivered, contemptuously spurned in Christians, when they hear it said to a Christian, "Say that thou art not a Christian"? Men are willing to do such deeds, but they do not wish to suffer, at all events, such punishments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252011.html'
source_title="Tractates on John 11"
