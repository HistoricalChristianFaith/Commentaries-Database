[[commentary]]
quote='''
It is clear that this obligation and condition of life includes not only those who have responded so well to sound advice that they have sold their goods and distributed them to the poor, and, with their shoulders freed of every worldly burden, bear the light yoke of Christ. They also include the weaker soul, who is less capable of such glorious perfection but who nevertheless remembers that he is a Christian when he hears that he must give up Christ or lose all his possessions. He will rather lay hold on the "tower of strength against the face of the enemy" because, when he was building it by his faith, he took into account the charges with which it could be completed. He embraced the faith with the intention of renouncing this world, not in word only, because, if he bought something he was as one not possessing it, and if he used this world he was as one not using it, not placing his hope in the uncertainty of riches but in the living God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 157"

[[commentary]]
quote='''
“Thou hast led me down, because Thou hast been made my hope: a tower of strength from the face of the enemy” (ver. 3). My heart is vexed, saith that Unity from the ends of the earth, and I toil amid temptations and offences: the heathen envy, because they have been conquered; the heretics lie in wait, hidden in the cloak of the Christian name: within in the Church itself the wheat suffereth violence from the chaff: amid all these things when my heart is vexed, I will cry from the ends of the earth. But there forsaketh me not the Same that hath exalted me upon the Rock, in order to lead me down even unto Himself, because even if I labour, while the devil through so many places and times and occasions lieth in wait against me, He is to me a tower of strength, to whom when I shall have fled for refuge, not only I shall escape the weapons of the enemy, but even against him securely I shall myself hurl whatever darts I shall please. For Christ Himself is the tower, Himself for us hath been made a tower from the face of the enemy, who is also the Rock whereon hath been builded the Church. Art thou taking heed that thou be not smitten of the devil? Flee to the Tower; never to that tower will the devil’s darts follow thee: there thou wilt stand protected and fixed. But in what manner shalt thou flee to the Tower? Let not a man, set perchance in temptation, in body seek that Tower, and when he shall not have found it, be wearied, or faint in temptation. Before thee is the Tower: call to mind Christ, and go into the Tower.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252061.html'
source_title="Exposition on Psalm 61"
