[[commentary]]
quote='''
(Ver. 7.) “Thou hast put gladness into my heart.” Gladness then is not to be sought without by them, who, being still heavy in heart, “love vanity, and seek a lie;” but within, where the light of God’s countenance is stamped. For Christ dwelleth in the inner man, as the Apostle says; for to Him doth it appertain to see truth, since He hath said, “I am the truth.” And again, when He spake in the Apostle, saying, “Would you receive a proof of Christ, who speaketh in me?” He spake not of course from without to him, but in his very heart, that is, in that chamber where we are to pray.

But men (who doubtless are many) who follow after things temporal, know not to say aught else, than, “Who showeth us good things?” when the true and certain good within their very selves they cannot see. Of these accordingly is most justly said, what he adds next: “From the time of His corn, of wine, and oil, they have been multiplied.” For the addition of His, is not superfluous. For the corn is God’s: inasmuch as He is “the living bread which came down from heaven.” The wine too is God’s: for, “they shall be inebriated,” he says, “with the fatness of thine house.” The oil too is God’s: of which it is said, “Thou hast fattened my head with oil.” But those many, who say, “Who showeth us good things?” and who see not that the kingdom of heaven is within them: these, “from the time of His corn, of wine, and oil, are multiplied.” For multiplication does not always betoken plentifulness, and not, generally, scantiness: when the soul, given up to temporal pleasures, burns ever with desire, and cannot be satisfied; and, distracted with manifold and anxious thought, is not permitted to see the simple good. Such is the soul of which it is said, “For the corruptible body presseth down the soul, and the earthly tabernacle weigheth down the mind that museth on many things.” A soul like this, by the departure and succession of temporal goods, that is, “from the time of His corn, wine, and oil,” filled with numberless idle fancies, is so multiplied, that it cannot do that which is commanded, “Think on the Lord in goodness, and in simplicity of heart seek Him.” For this multiplicity is strongly opposed to that simplicity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25204.html'
source_title="Exposition on Psalm 4"
