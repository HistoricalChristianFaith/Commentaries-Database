
[[commentary]]
quote='''
To them it is said, “O ye sons of men, how long are ye heavy in heart? Wherefore have ye such pleasure in vanity, and seek after leasing?” Perhaps they might become anxious, and turn from their vanity, and when they found themselves polluted with it, might seek for purification from it: then help them, make them secure. “Know this also, that the Lord hath made wonderful His Holy One.” He has made His Holy One to be admired: thence He has purified all from their vanity: there, saith David, is my substance: O remember it!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
