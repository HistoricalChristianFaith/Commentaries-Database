[[commentary]]
quote='''
Thereafter, in connection with the Supper itself, of which none of the evangelists has failed to give us some notice, how affluent and how lofty are those words of Jesus which John records, but which the others have passed over in silence! I may instance not only His commendation of humility, when He washed the disciples' feet, but also that marvellously overpowering and pre-eminently copious discourse which the Lord delivered to the eleven who remained with Him after His betrayer had been indicated by the morsel of bread, and had gone out. It was in this discourse, over which John lingers long, that He said, "He that hath seen me, hath seen the Father also." It was in it, too, that He expressed Himself so largely about the Holy Spirit, the Comforter, whom He was to send to them, and about His own glory, which He had with the Father before the world was, and about His making us one in Himself, even as He and the Father are one,—not that He and the Father and we should be one, but that we should be one as they are one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 10"
