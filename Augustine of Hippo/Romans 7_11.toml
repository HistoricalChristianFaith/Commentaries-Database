[[commentary]]
quote='''
Paul means either that pleasure's persuasion to sin is more powerful when something is forbidden or else that, even if a man did do something in accordance with the law's requirements, if there is as yet no faith resting in grace, then he endeavors to attribute this to himself and not to God, and he sins all the more because of pride.
'''
source_url=''
source_title="QUESTIONS 66.5"

[[commentary]]
quote='''
When he says: For sin, having taken occasion through the commandment, deceived me and through it slew me, this was said because the fruit of a forbidden desire is sweeter. Hence too whatever sins are done secretly are the sweeter, though this sweetness is deadly. Hence it is that, in Solomon, a woman, sitting as the image of deceitful teaching and inviting the foolish to come to her, is written to say: Gladly eat hidden bread and drink stolen sweet water. This sweetness is the occasion of sin found through the commandment, which, when it is desired, surely deceives and turns into greater bitterness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
