[[commentary]]
quote='''
“And while I was musing, the fire burned” (ver. 3).…I reflected on the words of my Lord, “Thou wicked and slothful servant, thou oughtest to have put My money to the exchangers, and I at My coming should receive it again with usury.” And that which follows may God avert from those who are His stewards! Bind him hand and foot, and let him be cast into outer darkness; the servant, who was not a waster of his master’s goods, so as to destroy them, but was slothful in laying them out to improve them. What ought they to expect, who have wasted them in luxury, if they are condemned who through slothfulness have kept them?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252039.html'
source_title="Exposition on Psalm 39"
