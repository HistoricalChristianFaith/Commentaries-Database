[[commentary]]
quote='''
Seeing that in all prayer we have to conciliate the goodwill of him to whom we pray, then to say what we pray for; goodwill is usually conciliated by our offering praise to him to whom the prayer is directed, and this is usually put in the beginning of the prayer: and in this particular our Lord has bidden us say nothing else but "Our Father who art in heaven." For many things are said in praise of God, which, being scattered variously and widely over all the Holy Scriptures, every one will be able to consider when he reads them: yet nowhere is there found a precept for the people of Israel, that they should say "Our Father," or that they should pray to God as a Father; but as Lord He was made known to them, as being yet servants, i.e. still living according to the flesh. I say this, however, inasmuch as they received the commands of the law, which they were ordered to observe: for the prophets often show that this same Lord of ours might have been their Father also, if they had not strayed from His commandments: as, for instance, we have that statement, "I have nourished and brought up children, and they have rebelled against me;" and that other, "I have said, Ye are gods; and all of you are children of the Most High;" and this again, "If then I be a Father, where is mine honour? and if I be a Master, where is my fear?" and very many other statements, where the Jews are accused of showing by their sin that they did not wish to become sons: those things being left out of account which are said in prophecy of a future Christian people, that they would have God as a Father, according to that gospel statement, "To them gave He power to become the sons of God." The Apostle Paul, again, says, "The heir, as long as he is a child, differeth nothing from a servant;" and mentions that we have received the Spirit of adoption, "whereby we cry, Abba, Father."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOUR%2520LORD%2527S%2520SERMON%2520ON%2520THE%2520MOUNT%2FBook%25202.html'
source_title="Our Lord's Sermon on the Mount, Book 2, Chapter 4"

[[commentary]]
quote='''
But now He includes the psalms also under the name of the law, where it is written, "I said, Ye are gods. If He calleth them gods, to whom the word of God came, and the Scripture cannot be broken: say ye of Him, whom the Father hath sanctified, and sent into the world. Thou blasphemest; because I said, I am the Son of God?" If the word of God came to men, that they might be called gods, how can the very Word of God, who is with God, be otherwise than God? If by the word of God men become gods, if by fellowship they become gods, can He by whom they have fellowship not be God? If lights which are lit are gods,is the light which enlighteneth not God? If through being warmed in a way by saving fire they are constituted gods, is He who gives them the warmth other than God? Thou approachest the light and art enlightened, and numbered among the sons of God; if thou withdrawest from the light, thou fallest into obscurity, and art accounted in darkness; but that light approacheth not, because it never recedeth from itself. If, then, the word of God maketh you gods, how can the Word of God be otherwise than God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252048.html'
source_title="Tractates on John 48"

[[commentary]]
quote='''
But then who are those gods, or where are they, of whom God is the true God? Another Psalm saith, “God hath stood in the synagogue of gods, but in the midst He judgeth gods.” As yet we know not whether perchance any gods be congregated in heaven, and in their congregation, for this is “in the synagogue,” God hath stood to judge. See in the same Psalm those to whom he saith, “I have said, Ye are gods, and children of the Highest all; but ye shall die like men, and fall like one of the princes.” It is evident then, that He hath called men gods, that are deified of His Grace, not born of His Substance. For He doth justify, who is just through His own self, and not of another; and He doth deify who is God through Himself, not by the partaking of another. But He that justifieth doth Himself deify, in that by justifying He doth make sons of God. “For He hath given them power to become the sons of God.” If we have been made sons of God, we have also been made gods: but this is the effect of Grace adopting, not of nature generating. For the only Son of God, God, and one God with the Father, Our Lord and Saviour Jesus Christ, was in the beginning the Word, and the Word with God, the Word God. The rest that are made gods, are made by His own Grace, are not born of His Substance, that they should be the same as He, but that by favour they should come to Him, and be fellow-heirs with Christ. For so great is the love in Him the Heir, that He hath willed to have fellow-heirs. What covetous man would will this, to have fellow-heirs? But even one that is found so to will, will share with them the inheritance, the sharer having less himself, than if he had possessed alone: but the inheritance wherein we are fellow-heirs of Christ, is not lessened by multitude of possessors, nor is it made narrower by the number of fellow-heirs: but is as great for many as it is for few, as great for individuals as for all. “See,” saith the Apostle, “what love God hath bestowed upon us, that we should be called, and be, the sons of God.” And in another place, “Dearly beloved, we are the sons of God, and it doth not yet appear what we shall be.” We are therefore in hope, not yet in substance. “But we know,” he saith, “that when He shall have appeared, we shall be like Him, for we shall see Him as He is.” The Only Son is like Him by birth, we like by seeing. For we are not like in such sort as He, who is the same as He is by whom He was begotten: for we are like, not equal: He, because equal, is therefore like. We have heard who are the gods that being made are justified, because they are called the sons of God: and who are the gods that are not Gods, to whom the God of gods is terrible? For another Psalm saith, “He is terrible over all gods.” And as if thou shouldest enquire, what gods? He saith, “For all the gods of the nations are devils.” To the gods of the nations, to the devils, terrible: to the gods made by Himself, to sons, lovely. Furthermore, I find both of them confessing the Majesty of God, both the devils confessed Christ, and the faithful confessed Christ. “Thou art Christ, the Son of the living God,” said Peter. “We know who Thou art, Thou art the Son of God,” said the devils. A like confession I hear, but like love I find not; nay even here love, there fear. To whom therefore He is lovely, the same are sons; to whom He is terrible, are not sons; to whom He is lovely, the same He hath made gods; those to whom He is terrible He doth prove not to be gods. For these are made gods, those are reputed gods; these Truth maketh gods, those error doth so account.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"

[[commentary]]
quote='''
And we find written in another Psalm, that even men are called gods. The Lord even takes note of this testimony in the Gospel, saying, “Is it not written in your Law, I have said, Ye are gods?”…It is not therefore because they are all good, but because “the word of God came to them,” that they were called gods. For were it because they are all good, He would not thus distinguish between them. He saith, “He judgeth between the gods.” Then follows, “How long do ye judge iniquity!” and the rest, which He says certainly not to all, but to some, because He saith it in distinguishing, and yet He distinguisheth between the gods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520136.html'
source_title="Exposition on Psalm 136"
