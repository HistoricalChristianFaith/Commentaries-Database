[[commentary]]
quote='''
Why, then, Philip, dost thou say," Show us the Father, and it sufficeth us? Have I been so long time with you, and yet have ye not known me, Philip? He that seeth me, seeth the Father also." If it interests thee much to see this, believe at least what thou seest not. For "how," He says, "sayest thou, Show us the Father?" If thou hast seen me, who am His perfect likeness, thou hast seen Him to whom I am like. And if thou canst not directly see this, "believest thou not," at least, "that I am in the Father, and the Father in me?" But Philip might say here, "I see Thee indeed, and believe Thy full likeness to the Father; but is one to be reproved and rebuked because, when he sees one who bears a likeness to another, he wishes to see that other to whom he is like? I know, indeed, the image, but as yet I know only the one without the other; it is not enough for me, unless I know that other whose likeness he bears. Show us, therefore, the Father, and it sufficeth us." But the Master really reproved the disciple because He saw into the heart of his questioner. For it was with the idea, as if the Father were somehow better than the Son, that Philip had the desire to know the Father: and so he did not even know the Son, because believing that He was inferior to another. It was to correct such a notion that it was said, "He that seeth me, seeth the Father also. How sayest thou, Show us the Father?" I see the meaning of thy words: it is not the original likeness thou seekest to see, but it is that other thou thinkest the superior. "Believest thou not that I am in the Father, and the Father in me?" Why desirest thou to discover some distance between those who are thus alike? why cravest thou the separate knowledge of those who cannot be separated?What, after this, He says not only to Philip, but to all of them together, must not now be thrust into a corner, in order that, by His help, it may be the more carefully expounded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252070.html'
source_title="Tractates on John 70"
