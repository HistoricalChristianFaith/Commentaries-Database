[[commentary]]
quote='''
Matthew continues as follows: "And He sent away the multitude, and took ship, and came into the coasts of Magedan;" and so on, down to the words, "A wicked and adulterous generation seeketh after a sign; and there shall no sign be given unto it but the sign of the prophet Jonas." This has already been recorded in another connection by the same Matthew. Hence again and again we must hold by the position that the Lord spake the same words on repeated occasions; so that when any completely irreconcilable difference appears between statements of His utterances, we are to understand the words to have been spoken twice over. In this case, indeed, Mark also keeps the same order; and after his account of the miracle of the seven loaves, subjoins the same intimation as is given us in Matthew, only with this difference, that Matthew's expression for the locality is not Dalmanutha, as is read in certain codices, but Magedan. There is no reason, however, for questioning the fact that it is the same place that is intended under both names. For most codices, even of Mark's Gospel, give no other reading than that of Magedan. Neither should any difficulty be felt in the fact that Mark does not say, as Matthew does, that in the answer which the Lord returned to those who sought after a sign, He referred to Jonah, but mentions simply that He replied in these terms: "There shall no sign be given unto it." For we are given to understand what kind of sign they asked—namely, one from heaven. And he has simply omitted to specify the words which Matthew has introduced regarding Jonas.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 51"
