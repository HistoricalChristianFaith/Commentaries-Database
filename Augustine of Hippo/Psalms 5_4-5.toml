[[commentary]]
quote='''
“The malignant man shall not dwell near Thee:” that is, he shall not so see, as to cleave to Thee. Hence follows, “Nor shall the unrighteous abide before Thine eyes.” For their eyes, that is, their mind is beaten back by the light of truth, because of the darkness of their sins; by the habitual practice of which they are not able to sustain the brightness of right understanding. Therefore even they who see sometimes, that is, who understand the truth, are yet still unrighteous, they abide not therein through love of those things, which turn away from the truth. For they carry about with them their night, that is, not only the habit, but even the love, of sinning. But if this night shall pass away, that is, if they shall cease to sin, and this love and habit thereof be put to flight, the morning dawns, so that they not only understand, but also cleave to the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25205.html'
source_title="Exposition on Psalm 5"
