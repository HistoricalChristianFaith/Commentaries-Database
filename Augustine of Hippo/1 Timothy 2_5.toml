[[commentary]]
quote='''
Christ Jesus, himself man, is the true Mediator, for, inasmuch as he took the "form of a slave," he became "the Mediator between God and men." In his character as God, he received sacrifices in union with the Father, with whom he is one God. Yet he chose, in his character as a slave, to be himself the sacrifice rather than to receive it, lest any one might take occasion to think that sacrifice could be rendered to a creature. Thus it is that he is both the Priest who offers and the Oblation that is offered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252010.html'
source_title="City of God 10.20"

[[commentary]]
quote='''
It was in order to make the mind able to advance more confidently toward the truth that Truth itself, the divine Son of God, put on humanity without putting off his divinity and built this firm path of faith so that man, by means of the God-Man, could find his way to man's God. I speak of the "mediator between God and men, himself man, Christ Jesus." For it is as man that he is the Mediator and as man that he is the way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252011.html'
source_title="City of God 11.2"

[[commentary]]
quote='''
Hence we respond to this objection of theirs, which they propose from the gospel, in a way which allows no man to be so lacking in understanding that he thinks we are compelled by this text to believe and confess that the mediator between God and men, the man Christ Jesus, did not have a human soul. In the same way I inquire how they respond to objections so palpable as ours, whereby we show through countless places in the Gospel writings what was narrated of him by the Evangelists, namely, that he was found with feelings that are impossible without a soul.
'''
source_url=''
source_title="EIGHTY-THREE DIFFERENT QUESTIONS 80.3"

[[commentary]]
quote='''
Now, we could not be redeemed, even through "the one mediator between God and man, Man himself, Christ Jesus," if he were not also God. For when Adam was made—being made an upright man—there was no need for a mediator. Once sin, however, had widely separated the human race from God, it was necessary for a mediator, who alone was born, lived and was put to death without sin, to reconcile us to God and provide even for our bodies a resurrection to life eternal—and all this in order that a man's pride might be exposed and healed through God's humility.
'''
source_url='https://www.newadvent.org/fathers/1302.htm'
source_title="Enchiridion 108.28"

[[commentary]]
quote='''
Wherefore, seeing that Christ Himself is that Wisdom of God by whom all things were created, and considering that no rational intelligences, whether of angels or of men, receive wisdom except by participation in this Wisdom wherewith we are united by that Holy Spirit through whom charity is shed abroad in our hearts (which Trinity at the same time constitutes one God), Divine Providence, having respect to the interests of mortal men whose time-bound life was held engaged in things which rise into being and die, decreed that this same Wisdom of God, assuming into the unity of His person the (nature of) man, in which He might be born according to the conditions of time, and live and die and rise again, should utter and perform and bear and sustain things congruous to our salvation; and thus, in exemplary fashion, show at once to men on earth the way for a return to heaven, and to those angels who are above us, the way to retain their position in heaven. For unless, also, in the nature of the reasonable soul, and under the conditions of an existence in time, something came newly into being,—that is to say, unless that began to be which previously was not,—there could never be any passing from a life of utter corruption and folly into one of wisdom and true goodness. And thus, as truth in the contemplative lives in the enjoyment of things eternal, while faith in the believing is what is due to things which are made, man is purified through that faith which is conversant with temporal things, in order to his being made capable of receiving the truth of things eternal. For one of their noblest intellects, the philosopher Plato, in the treatise which is named the Timæus, speaks also to this effect: "As eternity is to that which is made, so truth to faith." Those two belong to the things above,—namely, eternity and truth; these two belong to the things below,—namely, that which is made and faith. In order, therefore, that we may be called off from the lowest objects, and led up again to the highest, and in order also that what is made may attain to the eternal, we must come through faith to truth. And because all contraries are reduced to unity by some middle factor, and because also the iniquity of time alienated us from the righteousness of eternity, there was need of some mediatorial righteousness of a temporal nature; which mediatizing factor might be temporal on the side of those lowest objects, but also righteous on the side of these highest, and thus, by adapting itself to the former without cutting itself off from the latter, might bring back those lowest objects to the highest. Accordingly, Christ was named the Mediator between God and men, who stood between the immortal God and mortal man, as being Himself both God and man, who reconciled man to God, who continued to be what He (formerly) was, but was made also what He (formerly) was not. And the same Person is for us at once the (centre of the) said faith in things that are made, and the truth in things eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25201.html'
source_title="The Harmony of the Gospels, Book 1, Chapter 35"
