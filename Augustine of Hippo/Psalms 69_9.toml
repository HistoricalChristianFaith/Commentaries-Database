[[commentary]]
quote='''
“And the reproaches of men reproaching Thee have fallen upon Me.” Of this testimony Paul the Apostle hath also made use (there hath been read but now the very lesson), and saith, “Whatsoever things aforetime have been written, have been written that we might be instructed.”…Why “Thee”? Is the Father reproached, and not Christ Himself? Why have “the reproaches of men reproaching Thee fallen upon Me”? Because, “he that hath known Me, hath known the Father also:” because no one hath reviled Christ without reviling God: because no one honoureth the Father, except he that honoureth the Son also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
