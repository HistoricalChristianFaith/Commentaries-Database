[[commentary]]
quote='''
Every soul that is aware that it is bereft of all help, save of God alone, is widowed. For how doth the Apostle describe a widow? “She that is a widow indeed and desolate, trusteth in God.” He was speaking of those whom we all call Widows in the Church. He saith, “She that liveth in pleasure, is dead while she liveth;” and he numbereth her not among the widows. But in describing true widows, what saith he? “She that is a widow indeed and desolate, trusteth in God, and continueth in supplications and prayers night and day.” Here he addeth, “but she that liveth in pleasure, is dead while she liveth.” What then makes a widow? That she hath no aid from any other source, save from God alone. They that have husbands, take pride in the protection of their husbands: widows seem desolate, and their aid is a stronger one. The whole Church therefore is one widow, whether in men or in women, in married men or married women, in young men or in old, or in virgins: the whole Church is one widow, desolate in this world, if she feel this, if she is aware of her widowhood: for then is help at hand for her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520132.html'
source_title="Exposition on Psalm 132"
