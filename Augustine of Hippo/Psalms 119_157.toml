[[commentary]]
quote='''
“Many there are that trouble me, and persecute me; yet do I not swerve from Thy testimonies” (ver. 157). This hath been realized: we know it, we recollect it, we acknowledge it. The whole earth has been crimsoned by the blood of Martyrs; heaven is flowery with the crowns of Martyrs, the Churches are adorned with the memorials of Martyrs, seasons distinguished by the birthdays of Martyrs, cures more frequent by the merits of Martyrs. Whence this, save because that hath been fulfilled which was prophesied of that Man who hath been spread abroad around the whole world. We recognise this, and render thanks to the Lord our God. For thou, man, thou hast thyself said in another Psalm, “If the Lord Himself had not been on our side, they would have swallowed us up quick.” Behold the reason why thou hast not swerved from His testimonies, and hast won the palm of thy heavenly calling amid the hands of the many who persecuted and troubled thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
