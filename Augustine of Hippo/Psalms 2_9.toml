[[commentary]]
quote='''
Remember the rod of correction and discipline, and do not get conceited and proud when you have been filled with the good things of God's gifts and start grumbling against him; because in his anger he will shatter you with it like a potter's vessel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520366.html'
source_title="SERMON 366:6"

[[commentary]]
quote='''
And so, as long as you are an earthen vessel, this very thing in you must first be broken by that iron rod, of which it is said: You shall rule them with an iron rod, and you shall break them in pieces like a potter's vessel, so that, with the outer man destroyed and the inner renewed, you may be able, rooted and grounded in love, to comprehend the breadth, length, height, and depth, and to know also the surpassing knowledge of the love of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
“Thou shalt rule them with a rod of iron,” with inflexible justice, and “Thou shalt break them like a potter’s vessel” (ver. 9); that is, “Thou shalt break” in them earthly lusts, and the filthy doings of the old man, and whatsoever hath been derived and inured from the sinful clay.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25202.html'
source_title="Exposition on Psalm 2"

[[commentary]]
quote='''
If He is our God, He is also our King. He protecteth us, being our God, lest we die; He ruleth us, being our King, lest we fall. But by ruling us He doth not break us; for whom He ruleth not, He breaketh. “Thou shalt rule them,” saith He, “with a rod of iron, and dash them in pieces like a potter’s vessel.” But there are whom He ruleth not; these He spareth not, as a potter’s vessel dashing them in pieces.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"

[[commentary]]
quote='''
The matter next to be introduced, moreover, is one requiring, in order to its right apprehension and contemplation, a reader of the greatest attention and carefulness. For it has been acutely observed that Matthew, who had proposed to himself the task of commending the kingly character in Christ, named, exclusive of Christ Himself, forty men in the series of generations. Now this number denotes the period in which, in this age and on this earth, it behoves us to be ruled by Christ in accordance with that painful discipline whereby "God scourgeth," as it is written, "every son that He receiveth;" and of which also an apostle says that "we must through much tribulation enter into the kingdom of God." This discipline is also signified by that rod of iron, concerning which we read this statement in a Psalm: "Thou shalt rule them with a rod of iron;" which words occur after the saying, "Yet I am set king by Him upon His holy hill of Zion!" For the good, too, are ruled with a rod of iron, as it is said of them: "The time is come that judgment should begin at the house of God; and if it first begin at us, what shall the end be to them that obey not the gospel of God? and if the righteous scarcely be saved, where shall the ungodly and the sinner appear?" To the same persons the sentence that follows also applies: "Thou shall dash them in pieces like a potter's vessel." For the good, indeed, are ruled by this discipline, while the wicked are crushed by it. And these two different classes of persons are mentioned here as if they were the same, on account of the identity of the signs employed in reference to the wicked in common with the good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 4"
