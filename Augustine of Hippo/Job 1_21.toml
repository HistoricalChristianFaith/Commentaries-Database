[[commentary]]
quote='''
Those who lost all their worldly possessions in the sack of Rome, if they owned their possessions as they had been taught by the apostle who himself was poor without, but rich within—that is to say, if they used the world as though not using it—they could say in the words of Job, heavily tried but not overcome, "Naked I came out of my mother's womb, and naked shall I return. The Lord gave, and the Lord has taken away; as it pleased the Lord, so it has happened: Blessed be the name of the Lord." Like a good servant, Job counted the will of his Lord his greatest possession and through obedience to that will his soul was enriched. It didn't grieve him while he was still alive to lose those goods which he was shortly going to have to leave at his death. But as to those feebler spirits who, though they cannot be said to prefer earthly possessions to Christ, still hang on to them with a somewhat moderate attachment to them, they have discovered by the pain of losing these things how much they were sinning in loving them. For their grief is of their own making. In the words of the apostle quoted above, "They have pierced themselves through with many sorrows." For it was well that they who had so long despised these verbal admonitions should receive the teaching of experience. For when the apostle says "They that will be rich fall into temptation," and so on, what he blames in riches is not the possession of them but the desire for them. For elsewhere he says, "Charge those who are rich in this world not to be high-minded or trust in uncertain riches but in the living God, who gives us richly all things to enjoy; that they do good, that they be rich in good works, ready to distribute, willing to communicate; laying up in store for themselves a good foundation against the time to come, that they may lay hold on eternal life." They who were making such a use of their property have been consoled for light losses by great gains, and have had more pleasure in those possessions which they have securely laid past, by freely giving them away, than grief in which those they entirely lost by an anxious and selfish hoarding of them. For nothing could perish on earth except what they would be ashamed to carry away from the earth. Our Lord's injunction runs, "Do not lay up treasures for yourselves on earth, where moth and rust corrupt, and where thieves break through and steal; but lay up for yourselves treasures in heaven, where neither moth nor rust corrupt, and where thieves do not break through or steal: for where your treasure is, there will your heart be also." And they who have listened to this injunction have proved in the time of tribulation how well they were advised in not despising this most trustworthy teacher and most faithful and mighty guardian of their treasure. For if many were glad that their treasure was stored in places which the enemy chanced not to light upon, how much better founded was the joy of those who, by the counsel of their God, have fled with their treasure to a citadel which no enemy can possibly reach!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%25201.html'
source_title="City of God 1.10"

[[commentary]]
quote='''
The tempter was permitted to tempt a holy man, Job; in one moment he took away all things: whatever of possessions he had had, he carried off: took away inheritance, slew heirs; and this not little by little, but in a crowd, at one blow, at one swoop, so that all things were on a sudden announced: when all was taken away, alone there remained Job, but in him were vows of praise, which he might render to God, in him evidently there were: the coffer of his holy breast the thieving devil had not rifled, full he was of that wherefrom he might sacrifice. Hear what he had, hear what he brought forth: “The Lord hath given, the Lord hath taken away; as hath pleased the Lord, so hath been done: be the name of the Lord blessed.” O riches interior, whither thief doth not draw near! God Himself had given that whereof He was receiving; He had Himself enriched him with that whereof to Him he was offering that which He loved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"

[[commentary]]
quote='''
What are ductile trumpets, and pipes of horn? Ductile trumpets are of brass: they are drawn out by hammering; if by hammering, by being beaten, ye shall be ductile trumpets, drawn out unto the praise of God, if ye improve when in tribulation: tribulation is hammering, improvement is the being drawn out. Job was a ductile trumpet, when suddenly assailed by the heaviest losses, and the death of his sons, become like a ductile trumpet by the beating of so heavy tribulation, he sounded thus: “The Lord gave, and the Lord hath taken away; blessed be the name of the Lord.” How did he sound? How pleasantly doth his voice sound? This ductile trumpet is still under the hammer.…We have heard how he was hammered; let us hear how he soundeth: let us, if it please you, hear the sweet sound of this ductile trumpet: “What! shall we receive good at the hand of God, and shall we not receive evil?” O courageous, O sweet sound! whom will not that sound awake from sleep? whom will not confidence in God awake, to march to battle fearlessly against the devil; not to struggle with his own strength, but His who proveth him. For He it is who hammereth: for the hammer could not do so of itself.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252098.html'
source_title="Exposition on Psalm 98"

[[commentary]]
quote='''
“Lift up your hands by night in the sanctuary, and bless the Lord” (ver. 2). It is easy to bless by day. What is “by day”? In prosperity. For night is a sad thing, day a cheerful. When it is well with thee, thou dost bless the Lord. Thy son was sick, and he is made whole, thou dost bless the Lord. Thy son was sick, perchance thou hast sought an astrologer, a soothsayer, perchance a curse against the Lord has come, not from thy tongue, but from thy deeds, from thy deeds and thy life. Boast not, because thou blessest with thy tongue, if thou cursest with thy life. Wherefore bless ye the Lord. When? By night. When did Job bless? When it was a sad night. All was taken away which he possessed; the children for whom his goods were stored were taken away. How sad was his night! Let us however see whether he blesseth not in the night. “The Lord gave, the Lord hath taken away; it is as the Lord willed; blessed be the name of the Lord.” And black was the night.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520134.html'
source_title="Exposition on Psalm 134"
