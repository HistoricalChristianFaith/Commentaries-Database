[[commentary]]
quote='''
Peruse attentively this treatise, and if you understand it, give God the praise; but where you fail to understand it, pray for understanding, for God will give you understanding. Remember what the Scriptures say: "If any of you lack wisdom, let him ask of God, who giveth to all men liberally, and upbraideth not; and it shall be given to him." Wisdom itself cometh down from above, as the Apostle James himself tells us. There is, however, another wisdom, which you must repel from you, and pray against its remaining in you; this the same apostle expressed his detestation of when he said, "But if ye have bitter envying and strife in your hearts, . . . this is not the wisdom which descendeth from above, but is earthly, sensual, devilish. For wherever there is envying and strife, there is also confusion, and every evil work. But the wisdom which is from above is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good works, without partiality, and without hypocrisy." What blessing, then, will that man not have who has prayed for this wisdom and obtained it of the Lord? And from this you may understand what grace is; because if this wisdom were of ourselves, it would not be from above; nor would it be an object to be asked for of the God who created us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 46"
