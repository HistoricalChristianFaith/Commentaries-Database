[[commentary]]
quote='''
“In the day of my trouble I have cried unto Thee, for Thou hast heard me” (ver. 7). A little before he had said, All the day have I cried, all the day have I been troubled. Let no Christian then say that there is any day in which he is not troubled. By “all the day” we have understood the whole of time. What then, is there trouble even when it is well with us? Even so, trouble. How is there trouble? Because “as long as we are in the body we are absent from the Lord.” Let what will abound here, we are not yet in that country whither we are hastening to return. He to whom foreign travel is sweet, loveth not his country: if his country is sweet, travel is bitter; if travel is bitter, all the day there is trouble. When is there not trouble? When there is joy in one’s country. “At Thy right hand are delights for evermore.” “Thou shalt fill me with joy,” he saith, “with Thy countenance: that I may see the delight of the Lord.” There toil and groaning shall pass away: there shall be not prayer but praise; there Alleluia, there Amen, the voice in concord with Angels; there vision without failing and love without weariness. So long therefore as we are not there, ye see that we are not in that which is good. But do all things abound? If all things abound, see if thou art assured that all things perish not. But I have what I had not: more money is come to me which I had not before. Perhaps more fear too is come, which thou hadst not before: perhaps thou wast so much the more secure as thou wast the poorer. In fine, be it that thou hast wealth, that thou hast redundance of this world’s affluence, that thou hast assurance given thee that all this shall not perish; besides this, that God say unto thee, Thou shalt remain for ever in these things, they shall be for ever with thee, but My face thou shalt not see. Let none ask counsel of the flesh: ask ye counsel of the Spirit: let your heart answer you; let hope, faith, charity, which has begun to be in you, answer. If then we were to receive assurance that we should always be in affluence of worldly goods, and if God were to say to us, My face ye shall not see, would ye rejoice in these goods? Some one might perhaps choose to rejoice, and say, These things abound unto me, it is well with me, I ask no more. He hath not yet begun to be a lover of God: he hath not yet begun to sigh like one far from home. Far be it, far be it from us: let them retire, all those seductions: let them retire, those false blandishments: let them be gone, those words which they say daily unto us, “Where is thy God?” Let us pour out our soul over us, let us confess in tears, let us groan in confession, let us sigh in misery. Whatever is present with us besides our God, is not sweet: we would not have all things that He hath given, if He gives not Himself who gave all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
