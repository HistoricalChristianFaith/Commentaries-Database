[[commentary]]
quote='''
Then, elsewhere, he enumerates his merits, and gives us this description of their evil character: "For we ourselves also were formerly foolish, unbelieving, deceived, serving divers lusts and pleasures, living in malice and envy, hateful, and hating one another." Nothing, to be sure, but punishment was due to such a course of evil desert! God, however, who returns good for evil by His grace, which is not given according to our merits, enabled the apostle to conclude his statement and say: "But when the kindness and love of our Saviour God shone upon us,—not of works of righteousness which we have done, but according to His mercy He saved us, by the laver of regeneration and renewal of the Holy Ghost, whom He shed upon us abundantly through Jesus Christ our Saviour; that, being justified by His grace, we should be made heirs according to the hope of eternal life."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 12"
