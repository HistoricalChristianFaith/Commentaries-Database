[[commentary]]
quote='''
Just as the Jews saw Christ hanging on the Cross and despised Him, saying, “If this Man were the Son of God, He would come down from the Cross:” not seeing what death is. If they had seen what death is; if they had seen, I say. He died for a time, that He might live again for ever: they lived for a time, that they might die for ever. But because they saw Him dying, they saw not death, that is to say, they understood not what was very death. What say they even in Wisdom? “Let us condemn Him with a most shameful death, for by His own sayings He shall be respected;” for if he is indeed the Son of God, He will deliver Him from the hands of His adversaries: He will not suffer His Son to die, if He is truly His Son. But when they saw themselves insulting Him upon the Cross, and Him not descending from the Cross, they said, He was indeed but a Man. Thus was it spoken: and surely He could have come down from the Cross, He that could rise again from the tomb: but He taught us to bear with those who insult us; He taught us to be patient of the tongues of men, to drink now the cup of bitterness, and afterwards to receive everlasting salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"
