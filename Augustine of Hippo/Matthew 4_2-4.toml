[[commentary]]
quote='''
Our Lord, then, was baptized, and after baptism He was tempted; He fasted forty days, a number which has, as I have often mentioned, a deep meaning. All things cannot be explained at once, lest needful time be too much taken up. After forty days He was an hungred. He could have fasted without ever feeling hunger; but then how could He be tempted? or had He not overcome the tempter, how couldest thou learn to struggle with him? He was hungry; and then the tempter said, “If Thou be the Son of God, command that these stones be made bread.” Was it a great thing for our Lord Jesus Christ to make bread out of stones, when He satisfied so many thousands with five loaves? He made bread out of nothing. For whence came that quantity of food, which could satisfy so many thousands? The sources of that bread are in the Lord’s hands. This is nothing wonderful; for He Himself made out of five loaves bread enough for so many thousands, who also every day out of a few seeds raises up on earth immense harvests. These are the miracles of our Lord: but from their constant operation they are disregarded. What then, my brethren, was it impossible for the Lord to create bread out of stones? He made men even out of stones, in the words of John the Baptist himself, “God is able of these stones to raise up children unto Abraham.” Why then did He not so? That he might teach thee how to answer the tempter, so that if thou wast reduced to any straits and the tempter suggested, if thou wast a Christian and belongedst to Christ, would He desert thee now?…Listen to our Lord: “Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.” Dost thou think the word of God bread? If the Word of God, through which all things were made, was not bread, He would not say, “I am the bread which came down from heaven.” Thou hast therefore learnt to answer the tempter, when pressed with hunger.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"
