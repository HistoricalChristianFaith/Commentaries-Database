[[commentary]]
quote='''
Dogs should not always be taken in an evil sense; otherwise the prophet would not blame "dogs not able to bark and loving to dream." Doubtless they would be praiseworthy dogs if they both knew how to bark and loved to watch. And certainly those three hundred men—a most sacred number according to the letter of the cross10—would not have been chosen to win the victory because they lapped water as dogs do, unless some great mystery were signified. Good dogs watch and bark to protect their house and their master, their flock and their shepherd. Finally, even here in the praises offered by the church, when a selection is made from this prophecy, it is the tongue of dogs that is mentioned, not their teeth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 149"

[[commentary]]
quote='''
Not only “of dogs” he hath said, but “of Thy dogs:” nor are their teeth praised, but their tongue is: for it was not indeed to no purpose, not without a great mystery, that Gedeon was bidden to lead those alone, who should lap the water of the river like dogs; and of such sort not more than three hundred among so great a multitude were found. In which number is the sign of the Cross because of the letter T, which in the Greek numeral characters signifieth three hundred.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
