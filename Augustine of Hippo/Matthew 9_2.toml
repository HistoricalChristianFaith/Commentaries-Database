[[commentary]]
quote='''
Hereupon Matthew proceeds with his recital, still preserving the order of time, and connects his narrative in the following manner:—"And He entered into a ship, and passed over, and came into His own city. And, behold, they brought to Him a man sick of the palsy, lying on a bed;" and so on down to where it is said, "But when the multitude saw it, they marvelled; and glorified God, which had given such power unto men." Mark and Luke have also told the story of this paralytic. Now, as regards Matthew's stating that the Lord said," Son, be of good cheer, thy sins are forgiven thee;" while Luke makes the address run, not as "son," but as "man,"—this only helps to bring out the Lord's meaning more explicitly. For these sins were [thus said to be] forgiven to the "man," inasmuch as the very fact that he was a man would make it impossible for him to say, "I have not sinned;" and at the same time, that mode of address served to indicate that He who forgave sins to man was Himself God. Mark, again, has given the same form of words as Matthew, but he has left out the terms, "Be of good cheer." It is also possible, indeed, that the whole saying ran thus: "Man, be of good cheer: son, thy sins are forgiven thee;" or thus: "Son, be of good cheer: man, thy sins are forgiven thee;" or the words may have been spoken in some other congruous order.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 25"
