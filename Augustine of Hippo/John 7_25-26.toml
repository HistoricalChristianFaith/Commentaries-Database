[[commentary]]
quote='''
(Tr. xxxi. 1) It was said above that, our Lord went up to the feast secretly, not because He feared being taken (for He had power to prevent it,) but to show figuratively, that even in the very feast which the Jews celebrated, He was hid, and that it was His mystery. Now however the power appears, which was thought timidity: He spoke publicly at the feast, in so much that the multitude marvelled: They said some of them at Jerusalem, Is not this He, whom they seek to kill? but, lo, He speaketh boldly, and they say nothing to Him. They knew the fierceness with which He had been sought for; they marvelled at the power by which he was not taken.

(Tr. xxxi. 1) So, not fully understanding Christ's power, they supposed that it was owing to the knowledge of the rulers that He was spared: Do the rulers know indeed that this is the very Christ?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"
