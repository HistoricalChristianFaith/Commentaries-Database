[[commentary]]
quote='''
And so the Holy Spirit is not only the Spirit of the Father and of the Son who gave Him, but He is also called ours, who have received Him: as "The salvation of the Lord," who gives salvation, is said also to be our salvation, who have received it. Therefore, the Spirit is both the Spirit of God who gave Him, and ours who have received Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520The%2520Trinity%2FBook%25205.html'
source_title="ON THE TRINITY 5:14.15"

[[commentary]]
quote='''
“Salvation is of the Lord; and upon Thy people be Thy blessing” (ver. 8). In one sentence the Psalmist has enjoined men what to believe, and has prayed for believers. For when it is said, “Salvation is of the Lord,” the words are addressed to men. Nor does it follow, “And upon Thy people” be “Thy blessing,” in such wise as that the whole is spoken to men, but there is a change into prayer addressed to God Himself, for the very people to whom it was said, “Salvation is of the Lord.” What else then doth he say but this? Let no man presume on himself, seeing that it is of the Lord to save from the death of sin; for, “Wretched man that I am, who shall deliver me from the body of this death? The grace of God through Jesus Christ our Lord.” But do Thou, O Lord, bless Thy people, who look for salvation from Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25203.html'
source_title="Exposition on Psalm 3"
