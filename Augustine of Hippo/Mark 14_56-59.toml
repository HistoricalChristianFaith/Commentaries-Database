[[commentary]]
quote='''
Then Matthew's report goes on thus: "Now the chief priests and elders and all the council sought false witness against Jesus, to put Him to death, but found none: yea, though many false witnesses came, yet found they none." Mark comes in here with the explanation, that "their witness agreed not together." But, as Matthew continues, "At the last came two false witnesses, and said, This fellow said, I am able to destroy the temple of God, and to build it in three days." Mark states that there were also others who said, "We have heard him say, I will destroy this temple that is made with hands, and within three days I will build another made without hands. And therefore (as Mark also observes in the same passage) their witness did not agree together."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 6"
