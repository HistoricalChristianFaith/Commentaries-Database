[[commentary]]
quote='''
When he says: Let every soul be subject to the higher powers; for there is no power except from God, he most rightly admonishes, lest anyone, because he has been called to freedom by his Lord and made a Christian, be lifted up into pride and not think that on the journey of this life he must keep his own order, and suppose that he need not be subject to the higher powers, to whom, for the time being, the government of temporal affairs has been handed over. For since we consist of soul and body, and, as long as we are in this temporal life, use also temporal things for the support of leading that life, we ought, in that part which pertains to this life, to be subject to the powers, that is, to men who administer human affairs with some honor. But in that part by which we believe God and are called into his kingdom, we ought not to be subject to any man who desires to overturn in us that very thing which God has deigned to grant unto eternal life. If anyone, therefore, thinks that, because he is a Christian, he need not pay toll or tribute, or need not render the honor owed to those powers who attend to these matters, he is caught in a great error. Likewise, if anyone thinks he must be subject in such a way as to judge that he who excels by some eminence in administering temporal affairs has power even over his faith, he falls into a greater error. But this measure must be kept, which the Lord himself prescribes: that we render to Caesar the things that are Caesar's, and to God the things that are God's. For although we are called to that kingdom where there will be no power of this world, yet while we journey on this road, until we arrive at that age where every principality and power is done away, let us bear our condition for the sake of the very order of human affairs, doing nothing in pretense, and in this very thing obeying not so much men as God, who commands these things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
