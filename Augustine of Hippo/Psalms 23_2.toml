[[commentary]]
quote='''
The pastures that this good shepherd has prepared for you, in which he has settled you for you to take your fill, are not various kinds of grasses and green things, among which some are sweet to the taste, some extremely bitter, which as the seasons succeed one another are sometimes there and sometimes not. Your pastures are the words of God and his commandments, and they have all been sown as sweet grasses. These pastures had been tasted by that man who said to God, "How sweet are your words to my palate, more so than honey and the honeycomb in my mouth!"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520366.html'
source_title="SERMON 366:3"

[[commentary]]
quote='''
“In a place of pasture there hath He placed me” (ver. 2). In a place of fresh pasture, leading me to faith, there hath He placed me to be nourished. “By the water of refreshing hath He brought me up.” By the water of baptism, whereby they are refreshed who have lost health and strength, hath He brought me up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252023.html'
source_title="Exposition on Psalm 23"
