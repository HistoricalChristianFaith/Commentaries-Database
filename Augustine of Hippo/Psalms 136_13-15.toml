[[commentary]]
quote='''
“Who divided the Red Sea in two parts” (ver. 13). He divided also in such wise, that the same baptism should be to some unto life, to others unto death. “And brought out Israel through the midst of it” (ver. 14). So too He brings out His renewed people through the laver of regeneration. “And overthrew Pharaoh and his power in the Red Sea” (ver. 15). He quickly destroyeth both the sin of His people and the guilt thereof by baptism.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520136.html'
source_title="Exposition on Psalm 136"
