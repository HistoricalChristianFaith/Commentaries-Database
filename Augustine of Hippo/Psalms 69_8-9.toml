[[commentary]]
quote='''
“An alien I have become to My brethren, and a stranger to the sons of My mother” (ver. 8). To the sons of the Synagogue He became a stranger…Why so? Why did they not acknowledge? Why did they call Him an alien? Why did they dare to say, we know not whence He is? “Because the zeal of Thine House hath eaten Me up:” that is, because I have persecuted in them their own iniquities, because I have not patiently borne those whom I have rebuked, because I have sought Thy glory in Thy House, because I have scourged them that in the Temple dealt unseemly: in which place also there is quoted, “the zeal of Thine House hath eaten Me up.” Hence an alien, hence a Stranger; hence, we know not whence He is. They would have acknowledged whence I am, if they had acknowledged that which Thou hast commanded. For if I had found them keeping Thy commandments, the zeal of Thine House would not have eaten Me up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
