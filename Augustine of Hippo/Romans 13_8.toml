[[commentary]]
quote='''
The only way of cleaving to that pattern is by love. If we love another whom we believe to be righteous, we cannot but love the pattern itself, which shows us what the righteous soul is, in order that we too may become righteous. Indeed, if we did not love the image of God in him, we would have no love for the person, since our love for him is based on the pattern. Yet so long as we ourselves are not righteous, our love of the pattern is not enough to make us righteous.
'''
source_url=''
source_title="THE TRINITY 8.9"

[[commentary]]
quote='''
When he says: For he who loves another has fulfilled the law, he shows that the consummation of the law is placed in love, that is, in charity; hence the Lord too says that on those two commandments the whole Law hangs, and all the Prophets, that is, on the love of God and of neighbor. Hence too he himself, who came to fulfill the law, bestowed love through the Holy Spirit, so that what before fear could not fulfill, love might afterward fulfill. Hence is that saying of the same Apostle: But love is the fullness of the law; and that: But the end of the commandment is love, from a pure heart and a good conscience and unfeigned faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
