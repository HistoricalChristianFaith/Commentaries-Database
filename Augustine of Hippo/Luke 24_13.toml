[[commentary]]
quote='''
(de Con. Ev. lib. iii. c. 25.) The fortress mentioned here we may not unreasonably take to have been also called according to Mark, a village, He next describes the fortress, saying, which was from Jerusalem about the space of sixty stades, called Emmaus.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Still, it remains the probable supposition, that, after He was seen of Peter, He appeared next to those two, of whom Cleophas was one, and regarding whom Luke presents us with a complete narrative, while Mark gives us only a very brief notice. The latter evangelist reports the same incident in these concise terms: "And after that He appeared in another form unto two of them, as they walked and went to a country-seat." For it is not unreasonable for us to suppose that the place of residence referred to may also have been styled a country-seat; just as Bethlehem itself, which formerly was called a city, is even at the present time also named a village, although its honour has now been made so much the greater since the name of this Lord, who was born in it, has been proclaimed so extensively throughout the Churches of all nations. In the Greek codices, indeed, the reading which we discover is rather "estate" than "country-seat." But that term was employed not only of residences, but also of free towns and colonies beyond the city, which is the head and mother of the rest, and is therefore called the metropolis.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
