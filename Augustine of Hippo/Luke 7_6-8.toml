[[commentary]]
quote='''
Of these princes was that Centurion too, of whom but now when the Gospel was read ye heard. For he was a Centurion having honour and power among men, he was a prince among the princes of the peoples. Christ coming to him, he sent his friends to meet Him, nay unto Christ truly passing over to him he sent his friends, and asked that He would heal his servant who was dangerously sick. And when the Lord would come, he sent to Him this message: “I am not worthy that Thou shouldest enter under my roof, but say in a word only, and my servant shall be healed.” “For I also am a man set under authority, having under me soldiers.” See how he kept his rank! first he mentioned that he was under another, and afterwards that another was under him. I am under authority, and I am in authority; both under some I am, and over some I am.…As though he said, If I being set under authority command those who are under me, Thou who art set under no man’s authority, canst not Thou command Thy creature, since all things were made by Thee, and without Thee was nothing made. “Say,” then, said he, “in a word, and my servant shall be healed. For I am not worthy that Thou shouldest enter under my roof.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252047.html'
source_title="Exposition on Psalm 47"
