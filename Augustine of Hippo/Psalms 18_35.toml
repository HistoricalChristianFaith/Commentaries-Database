[[commentary]]
quote='''
“And Thou hast given me the defence of my salvation, and Thy right hand hath held me up” (ver. 35). And the favour of Thy grace hath held me up. “And Thy discipline hath directed me to the end.” And Thy correction, not suffering me to wander from the way, hath directed me that whatsoever I do, I refer to that end, whereby I may cleave to Thee. “And this Thy discipline, it shall teach me.” And that same correction of Thine shall teach me to attain to that, whereunto it hath directed me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
