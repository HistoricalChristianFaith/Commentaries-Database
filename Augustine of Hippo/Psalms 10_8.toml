[[commentary]]
quote='''
“He lieth in ambush with the rich” (ver. 8). What rich, but those whom he will load with this world’s gifts? And he is therefore said to lie in ambush with them, because he will display their false happiness to deceive men; who, when with a perverted will they desire to be such as they, and seek not the good things eternal, will fall into his snares. “That in the dark he may kill the innocent.” “In the dark,” I suppose, is said, where it is not easily understood what should be sought, or what avoided. Now to kill the innocent, is of an innocent to make one guilty.

“His eyes look against the poor,” for he is chiefly to persecute the righteous, of whom it is said, “Blessed are the poor in spirit, for theirs is the kingdom of heaven” (ver. 9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252010.html'
source_title="Exposition on Psalm 10"
