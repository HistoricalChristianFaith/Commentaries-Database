[[commentary]]
quote='''
Christ, however, was begotten equal to the Father, not made; begotten of the substance of the Father. Whence the apostle thus declares Him: "Who, being in the form of God, thought it not robbery to be equal with God." What means "thought it not robbery"? He usurped not equality with God, but was in that equality in which He was begotten. And how were we to come to the equal God? "He emptied Himself, taking upon Him the form of a servant." But He emptied Himself not by losing what He was, but by taking to Him what He was not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252017.html'
source_title="Tractates on John 17"
[[commentary]]
quote='''
But I was saying that Christ is the Word, and Christ is the Word of God, and Christ the Word is God; but Christ is not only the Word, since "the Word became flesh, and dwelt among us:" therefore Christ is both Word and flesh. For when "He was in the form of God, He thought it not robbery to be equal with God." And what of us in our low estate, who, feeble and crawling on the ground, Were not able to reach unto God, were we to be abandoned? God forbid. "He emptied Himself, taking upon Him the form of a servant;" not, therefore, by losing the form of God. He became man who was God, by receiving what He was not, not by losing what He was: so God became man. There thou hast something for thy weakness, something for thy perfection. Let Christ raise thee by that which is man, lead thee by That which is God-man, and guide thee through to that which is God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252023.html'
source_title="Tractates on John 23"

[[commentary]]
quote='''
But why should we wonder that He rose from supper, and laid aside His garments, who, being in the form of God, made Himself of no reputation? And why should we wonder, if He girded Himself with a towel, who took upon Him the form of a servant, and was found in the likeness of a man? Why wonder, if He poured water into a basin wherewith to wash His disciples' feet, who poured His blood upon the earth to wash away the filth of their sins? Why wonder, if with the towel wherewith He was girded He wiped the feet He had washed, who with the very flesh that clothed Him laid a firm pathway for the footsteps of His evangelists? In order, indeed, to gird Himself with the towel,He laid aside the garments He wore; but when He emptied Himself [of His divine glory] in order to assume the form of a servant, He laid not down what He had, but assumed that which He had not before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252055.html'
source_title="Tractates on John 55"

[[commentary]]
quote='''
Our special attention, brethren, must be earnestly turned to God, in order that we may be able to obtain some intelligent apprehension of the words of the holy Gospel, which have just been ringing in our ears. For the Lord Jesus saith: "Let not your heart be troubled. Believe in God, and believe [or, believe also] in me." That they might not as men be afraid of death, and so be troubled, He comforts them by affirming Himself also to be God. "Believe," He says, "in God, believe also in me." For it follows as a consequence, that if ye believe in God, ye ought to believe also in me: which were no consequence if Christ were not God. "Believe in God, and believe in" Him, who, by nature and not by robbery, is equal with God; for He emptied Himself; not, however, by losing the form of God, but by taking the form of a servant. You are afraid of death as regards this servant form, "let not your heart be troubled," the form of God will raise it again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252067.html'
source_title="Tractates on John 67"

[[commentary]]
quote='''
For "being as He was in the form of God," as the apostle says, "He thought it not robbery to be equal with God." For how could that nature be robbery, which was His, not by usurpation, but by birth? "But He emptied Himself, taking upon Him the form of a servant;" and so, not losing the former, but assuming the latter, and emptying Himself in that very respect wherein He stood forth before us here in a humbler state than that wherein He still remained with the Father. For there was the accession of a servant-form, with no recession of the divine: in the assumption of the one there was no consumption of the other.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252078.html'
source_title="Tractates on John 78"
