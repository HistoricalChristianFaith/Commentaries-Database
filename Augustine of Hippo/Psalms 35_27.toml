[[commentary]]
quote='''
What sayest thou now, the Head with the Members? "Let them shout for joy and be glad that favour My righteous cause:" who cleave to My Body. Yea, let them say "continually, Let the Lord be magnified, which hath pleasure in the prosperity of His servant."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="On the Psalms - Psalm 35"

[[commentary]]
quote='''
Those oxen, then, have left to us the narration of the Scriptures. For it was not of their own that they dispensed, because they sought the glory of the Lord. Now, what have ye heard in that psalm? "And let them say continually, The Lord be magnified, they that wish the peace of His servant." God's servant, God's people, God's Church. Let them who wish the peace of that Church magnify the Lord, not the servant: "and let them say continually, The Lord be magnified." Who, let say? "Them who wish the peace of His servant." The voice of that people, of that servant, is clearly that voice which you have heard in lamentations in the psalm, and were moved at hearing, because you are of that people. What was sung by one, re-echoed from the hearts of all. Happy they who recognized themselves in those voices as in a mirror. Who, then, are they that wish the peace of His servant, the peace of His people, the peace of the one whom He calls His "only one," and whom He wishes to be delivered from the lion: "Deliver mine only one from the power of the dog?" They who say always, "The Lord be magnified." Those oxen, then, magnified the Lord, not themselves. See this ox magnifying his Lord, because "the ox knoweth his owner;" observe that ox in fear lest men desert the ox's owner and rely on the ox: how he dreads them that are willing to put their confidence in him: "Was Paul crucified for you? or were ye baptized in the name of Paul? " Of what I gave, I was not the giver: freely ye have received; the dove came down from heaven. "I have planted," saith he, "Apollo, watered; but God gave the increase: neither he that planteth is anything, neither he that watereth; but God that giveth the increase." "And let them say always, The Lord be magnified, they that wish the peace of His servant."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252010.html'
source_title="Tractates on John 10"
