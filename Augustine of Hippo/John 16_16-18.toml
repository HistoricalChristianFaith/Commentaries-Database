[[commentary]]
quote='''
These words of the Lord, when He says, "A little while, and ye shall no more see me: and again a little while, and ye shall see me; because I go to the Father," were so obscure to the disciples, before what He thus says was actually fulfilled, that they inquired among themselves what it was that He said, and had to confess themselves utterly ignorant. For the Gospel proceeds, "Then said some of His disciples among themselves, What is this that He saith unto us, A little while, and ye shall not see me: and again a little while, and ye shall see me; and, Because I go to the Father? They said therefore, What is this that He saith, A little while we know not what He saith." This is what moved them, that He said, "A little while, and ye shall not see me: and again a little while, and ye shall see me." For in what precedes, because He had not said, "A little while," but only, "I go to the Father and ye shall see me no more," He appeared to them to have spoken, as it were, quite plainly, and they had no inquiry among themselves, regarding it. But now, what was then obscure to them, and was shortly afterwards revealed, is already perfectly manifest to us: for after a little while He suffered, and they saw Him not; again, after a little while He rose, and they saw Him. But how the words are to be taken that He used, "Ye shall no more see me," inasmuch as by the word "more" He wished it to be understood that they would not see Him afterwards, we have explained at the passage where He said, The Holy Spirit "shall convince of righteousness, because I go to the Father, and ye shall see me no more;" meaning thereby, that they would never afterwards see Christ in His present state of subjection to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520101.html'
source_title="Tractates on John 101"
