[[commentary]]
quote='''
“The wind shall go over on it, it shall not be; and the place thereof shall know it no more” (ver. 16). For he is not speaking of grass, but of that for whose sake even the Word became grass. For thou art man, and on thy account the Word became man. “All flesh is grass:” “and the Word was made flesh.” How great then is the hope of the grass, since the Word hath been made flesh? That which abideth for evermore, hath not disdained to assume grass, that the grass might not despair of itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
