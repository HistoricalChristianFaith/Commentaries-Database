[[commentary]]
quote='''
Thence came that Canaanitish woman, who was at first called “a dog;” for that ye may know that she was from thence, the Gospel speaks thus. “He departed into the parts of Tyre and Sidon, and behold a woman of Canaan came out of the same coasts,” with all the rest that is related there. She who at first, at the house of her “father,” and among her “own people,” was but “a dog,” who by coming to, and crying after that “King,” was made beautiful by believing in Him, what did she obtain to hear? “O woman, great is thy faith.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"
