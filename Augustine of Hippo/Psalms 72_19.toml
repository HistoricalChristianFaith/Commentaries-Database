[[commentary]]
quote='''
“And blessed be the name of His glory for everlasting, and for age of age” (ver. 19). For what else should the Latin interpreters have said, who could not have said for everlasting, and for everlasting of everlasting? For it soundeth as if one thing were meant in the expression “for everlasting,” and another thing in the expression “for age:” but the Greek hath εἰς τὸν αἰῶνα, καὶ εἰς τὸν αἰῶνα τοῦ αἰῶνος, which perchance more meetly might have been rendered by, “for age, and for age of age:” so that by “for age,” might have been understood as long as this age endureth; but “for age of age,” that which after the end of this is promised to be. “And there shall be fulfilled with the glory of Him every land: so be it, so be it.” Thou hast commanded, O Lord, so it is coming to pass: so it is coming to pass, until that which began with the river, may attain fully even unto the ends of the round world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252072.html'
source_title="Exposition on Psalm 72"
