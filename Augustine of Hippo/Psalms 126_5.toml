[[commentary]]
quote='''
I sympathize with you, because the Lord our God also sympathized with us, suffered with us. You see, he revealed himself in you, and you in himself, when he said, "My soul is sad to the point of death." He suffered for us, let us suffer for him; he died for us, let us die for him, in order to live forever with him. But perhaps you are hesitant to die, O mortal creature, though you are bound to die sometime or other, precisely because you are mortal. Would you like not to fear death? Die for God. But perhaps the reason you are afraid to die is that death is such a sad business. Consider the harvest; the time for sowing is cold; but if the farmer declines to be made miserable by sowing in the cold in winter, he won't rejoice in the summer. Take a look at yourself, and see whether the reason you are reluctant to sow is that there is the sadness and misery of the cold at seed time.Look at the psalm: "Those who sow in tears shall reap in joy. Going, they were going and weeping, casting their seed;" That is what we were singing just now; let us do what we have sung. Let us sow our souls in this time, like corn in winter, so that we may reap them in eternal time, like corn in summer time. That is the way the holy martyrs, the way all the just, toiling away on earth, weeping cast their seed; this life, after all, is full of tears. And what follows? "But coming, they will come with exultation, carrying their lapfuls." Your seed is the shedding of your blood; your lapful the reception of your crown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520313D.html'
source_title="SERMON 313D.3"


[[commentary]]
quote='''
So [Christ] transposed the weak members of his body [the church] into himself. And perhaps it was of them that it is said, "Those who sow in tears shall reap in joy," that is to say, of the weaker ones. After all, that great herald of Christ was not sowing in tears when he said, "For I indeed am already being sacrificed, and the time of my casting off is at hand. I have fought the good fight, I have completed the course, I have kept the faith. For the rest, there is being kept for me the crown of justice—a crown made of sheaves. There is being kept for me," he says, "the crown of justice, which the Lord, the just judge, will render to me on that day." As though to say, "He will render me the harvest, for whom I am spending myself in sowing." These words, brothers, as I understand them, are the words of someone merrymaking, not of someone crying. You don't suppose he was in tears, do you, when he said this? Wasn't he exactly like the cheerful giver, whom God loves? So let us refer these words [Jesus' words] to the weak, in order that not even those who have sown in tears need despair, because even if they have sown in tears, the pain and the sighing will pass away. Sadness passes at the end, and gladness comes without end.And yet for all that, dearly beloved, this finally is how it seems to me that these words refer to everyone, "Those who sow in tears shall reap in joy. Going they were going and weeping, casting their seed. But coming they shall come with merrymaking, carrying their sheaves." Listen, if with the Lord's assistance I am able to explain it, how "going they were going and weeping" belongs to everyone. From the moment we are born, we are going. Is there anyone, after all, who stands still? Is there anyone who, from the moment he enters life, is not forced to get moving? An infant is born; it gets moving by growing. Death is the end. We have still got to come to the end—but with merrymaking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252031.html'
source_title="SERMON 31:3-4"


[[commentary]]
quote='''
For the next words are, “They that sow in tears, shall reap in joy” (ver. 5). In this life, which is full of tears, let us sow. What shall we sow? Good works. Works of mercy are our seeds: of which seeds the Apostle saith, “Let us not be weary in well doing; for in due season we shall reap if we faint not.” Speaking therefore of almsgiving itself, what saith he? “This I say; he that soweth sparingly, shall reap also sparingly.” He therefore who soweth plentifully, shall reap plentifully: he who soweth sparingly, shall reap also sparingly: and he that soweth nothing, shall reap nothing. Why do ye long for ample estates, where ye may sow plentifully? There is not a wider field on which ye can sow than Christ, who hath willed that we should sow in Himself. Your soil is the Church; sow as much as ye can. But thou hast not enough to do this. Hast thou the will? As what thou hadst would be nothing, if thou hadst not a good will; so do not despond, because thou hast not, if thou hast a good will. For what dost thou sow? Mercy. And what wilt thou reap? Peace. Said the Angels, Peace on earth unto rich men? No, but, “Peace on earth unto men of a good will.” Zacchæus had a strong will, Zacchæus had great charity.…Did then that widow who cast her two farthings into the treasury, sow little? Nay, as much as Zacchæus. For she had narrower means, but an equal will. She gave her two mites with as good a will as Zacchæus gave the half of his patrimony. If thou consider what they gave, thou wilt find their gifts different; if thou look to the source, thou wilt find them equal; she gave whatever she had, and he gave what he had.…But if they are beggars whose profession is asking alms, in trouble they also have what to bestow upon one another. God hath not so forsaken them, but that they have wherein they may be tried by their bestowing of alms. This man cannot walk; he who can walk, lendeth his feet to the lame; he who seeth, lendeth his eyes to the blind; and he who is young and sound, lendeth his strength to the old or the infirm, carrieth him: the one is poor, the other is rich.

Sometimes also the rich man is found to be poor, and something is bestowed upon him by the poor. Somebody cometh to a river, so much the more delicate as he is more rich; he cannot pass over: if he were to pass over with bare limbs, he would catch cold, would be ill, would die: a poor man more active in body cometh up: he carries the rich man over; he giveth alms unto the rich. Think not therefore those only poor, who have not money.…Thus love ye, thus be ye affectioned unto one another. Attend not solely to yourselves: but to those who are in want around you. But because these things take place in this life with troubles and cares, faint not. Ye sow in tears, ye shall reap in joy.

How, my brethren? When the farmer goeth forth with the plough, carrying seed, is not the wind sometimes keen, and doth not the shower sometimes deter him? He looketh to the sky, seeth it lowering, shivers with cold, nevertheless goeth forth, and soweth. For he feareth lest while he is observing the foul weather, and awaiting sunshine, the time may pass away, and he may not find anything to reap. Put not off, my brethren; sow in wintry weather, sow good works, even while ye weep; for, “They that sow in tears, shall reap in joy.” They sow their seed, good will, and good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520126.html'
source_title="Exposition on Psalm 126"
