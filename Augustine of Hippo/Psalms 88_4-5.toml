[[commentary]]
quote='''
With efficacious merit does He deliver from this bondage of sin, who saith in the psalms: "I am become as a man without help, free among the dead." For He only was free, because He had no sin. For He Himself says in the Gospel, "Behold, the prince of this world cometh," meaning the devil about to come in the persons of the persecuting Jews;-"behold," He says, "he cometh, and shall find nothing in me." Not as he found some measure of sin in those whom he also slew as righteous; in me he shall find nothing. And just as if He were asked, If he shall find nothing in Thee, wherefore will he slay Thee? He further said, "But that all may know that I do the will of my Father, rise and let us go hence." I do not, He says, pay the penalty of death as a necessity of my sinfulness; but in the death I die, I do the will of my Father. And in this, I am doing rather than enduring it; for, were I unwilling, I should not have had the suffering to endure. You have Him saying in another place, "I have power to lay down my life, and I have power to take it up again." Here surely is one "free among the dead."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252041.html'
source_title="Tractates on John 41"

[[commentary]]
quote='''
Lastly, the very thing said by our Saviour on the Cross, “Father, forgive them, for they know not what they do,” is expressed in this Psalm below, “I am counted as one of them that go down into the pit” (ver. 4): by them who knew not what they were doing, when they imagined that He died like other men, subjected to necessity, and overcome by it. The word “pit” is used for the depth of woe or of Hell. “I have been as a man that hath no help.”

“Free among the dead” (ver. 5). In these words our Lord’s Person is most clearly shown: for who else is free among the dead but He who though in the likeness of sinful flesh is alone among sinners without sin?…He therefore, “free among the dead,” who had it in His power to lay down His life, and again to take it; from whom no one could take it, but He laid it down of His own free will; who could revive His own flesh, as a temple destroyed by them, at His will; who, when all had forsaken Him on the eve of His Passion, remained not alone, because, as He testifies, His Father forsook Him not; was nevertheless by His enemies, for whom He prayed, who knew not what they did, …counted “as one who hath no help; like unto them that are wounded, and lie in the grave.” But he adds, “Whom thou dost not yet remember:” and in these words there is to be remarked a distinction between Christ and the rest of the dead. For though He was wounded, and when dead laid in the tomb, yet they who knew not what they were doing, or who He was, regarded Him as like others who had perished from their wounds, and who slept in the tomb, who are as yet out of remembrance of God, that is, whose hour of resurrection has not yet arrived. For thus the Scripture speaks of the dead as sleeping, because it wishes them to be regarded as destined to awake, that is, to rise again. But He, wounded and asleep in the tomb, awoke on the third day, and became “like a sparrow that sitteth alone on the housetop,” that is, on the right hand of His Father in Heaven: and now “dieth no more, death shall no more have dominion over Him.” Hence He differs widely from those whom God hath not yet remembered to cause their resurrection after this manner: for what was to go before in the Head, was kept for the Body in the end. God is then said to remember, when He does an act: then to forget, when He does it not: for neither can God forget, as He never changes, nor remember, as He can never forget. “I am counted” then, by those who know not what they do, “as a man that hath no help:” while I am “free among the dead,” I am held by these men “like unto them that are wounded, and lie in the grave.” Yet those very men, who account thus of Me, are further said to be “cut away from Thy hand,” that is, when I was made so by them, “they were cut away from Thy hand;” they who believed Me destitute of help, are deprived of the help of Thy hand: for they, as he saith in another Psalm, have digged a pit before me, and are fallen into the midst of it themselves. I prefer this interpretation to that which refers the words, “they are cut away from Thy hand,” to those who sleep in the tomb, whom God hath not yet remembered: since the righteous are among the latter, of whom, even though God hath not yet called them to the resurrection, it is said, that their “souls are in the hands of God,” that is, that “they dwell under the defence of the Most High; and shall abide under the shadow of the God of Heaven.” But it is those who are cut away from the hand of God, who believed that Christ was cut off from His hand, and thus accounting Him among the wicked, dared to slay Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252088.html'
source_title="Exposition on Psalm 88"
