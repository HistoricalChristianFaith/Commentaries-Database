[[commentary]]
quote='''
“The heathen are troubled” (ver. 6). And how troubled? why troubled? To cast down the City of God, in the midst whereof is God? To overthrow the tabernacle sanctified, which God helpeth with His Countenance? No: with a wholesome trouble are the heathen now troubled. For what followeth? “And the kingdoms are bowed.” Bowed, saith He, are the kingdoms; not now erected that they may rage, but bowed that they may adore. When were the kingdoms bowed? When that came to pass which was predicted in another Psalm, “All kings shall fall down before Him, all nations shall serve Him.” What cause made the kingdoms to bow? Hear the cause. “The Most High gave His Voice, and the earth was moved.” The fanatics of idolatry, like frogs in the marshes, clamoured, the more tumultuously, the more sordidly, in filth and mire. And what is the brawling of frogs to the thunder of the clouds? For out of them “the Most High gave His Voice, and the earth was moved:” He thundered out of His clouds. And what are His clouds? His Apostles, His preachers, by whom He thundered in precepts, lightened in miracles. The same are clouds who are also mountains: mountains for their height and firmness, clouds for their rain and fruitfulness. For these clouds watered the earth, of which it was said, “The Most High gave His Voice, and the earth was moved.” For it is of those clouds that He threateneth a certain barren vineyard, whence the mountains were carried into the heart of the sea; “I will command,” saith He, “the clouds that they rain no rain upon it.” This was fulfilled in that which I have mentioned, when the mountains were carried into the heart of the sea; when it was said, “It was necessary that the word of God should have been spoken first to you; but seeing ye put it from you, we turn to the Gentiles;” then was fulfilled, “I will command the clouds that they rain no rain upon it.” The nation of the Jews hath just so remained as a fleece dry upon the ground. For this, ye know, happened in a certain miracle, the ground was dry, the fleece only was wet, yet rain in the fleece appeared not. So also the mystery of the New Testament appeared not in the nation of the Jews. What there was the fleece, is here the veil. For in the fleece was veiled the mystery. But on the ground, in all the nations open lieth Christ’s Gospel; the rain is manifest, the Grace of Christ is bare, for it is not covered with a veil. But that the rain might come out of it, the fleece was pressed. For by pressure they from themselves excluded Christ, and the Lord now from His clouds raineth on the ground, the fleece hath remained dry. But of them then “the Most High gave His Voice,” out of those clouds; by which Voice the kingdoms were bowed and worshipped.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
