[[commentary]]
quote='''
This is the oil of the sinner with which the prophet does not want his head to be anointed, as he says: "The just person shall correct me in mercy and shall reprove me, but let not the oil of the sinner fatten my head." Thus, he prefers to be corrected by the severe mercy of the just rather than to be praised by the soothing ointment of flattery. Whence, the prophet said, "They that call you blessed, the same deceive you." Therefore, regarding a person whom false flattery has made arrogant, the popular saying states it correctly: "He has a swelled head"; that is, his head has been fattened by the oil of the sinner, and this is not the effect of the harsh truth of correction but of the soothing deceit of praise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 33"


[[commentary]]
quote='''
And again, he quotes as words of David, "Let not the oil of the sinner anoint my head," when David has been speaking of the flattery of the smooth speaker deceiving with false praise, so as to lead the head of the man praised to wax great with pride. And this meaning is made manifest by the words immediately preceding in the same psalm. For he says, "Let the righteous smite me, it shall be a kindness; and let him reprove me: but the oil of the sinner shall not break my head." What can be clearer than this sentence? what more manifest? For he declares that he had rather be reproved in kindness with the sharp correction of the righteous, so that he may be healed, than anointed with the soft speaking of the flatterer, so as to be puffed up with pride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FIn%2520Answer%2520to%2520the%2520Letters%2520of%2520Petilian%2FBook%25203.html'
source_title="LETTERS OF PETILIAN THE DONATIST 3:33-38"


[[commentary]]
quote='''
This brother will bring you some things I have written. If you have the time to read them, please be completely candid and merciless in your criticism. The Bible reminds us, "The righteous shall correct me in compassion and reprove me, but the oil of the sinner shall not anoint my head." This means that the real friend heals me by his criticism, but the false friend merely flatters me. I cannot be a fair critic of my own work because I am either too strict or not strict enough. For I sometimes see my own faults, but I would rather hear a better judge, just in case I begin to flatter myself after a harsh bit of self-criticism, because I decide I am too hard on myself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 28:6"

[[commentary]]
quote='''
“The righteous One shall amend me in mercy, and convict me” (ver. 5). Behold the sinner confessing. He desireth to be amended in mercy, rather than praised deceitfully.…“Shall convict me,” but “in mercy:” shall convict, yet hateth not: yea, shall all the more convict, because He hateth not. And why doth he therefore give thanks? Because, “rebuke a wise man, and he will love thee.” “The righteous One shall amend me.” Because He persecuteth thee? God forbid. He requireth rather amending himself, who amendeth in hate. Wherefore then doth He amend? “In mercy. And shall convict me.” Wherein? “In mercy. For the oil of a sinner shall not enrich my head.” My head shall not grow by flattery. Undue praise is flattery: undue praise of a flatterer is “the oil of a sinner.” Therefore men too, when they have mocked any one with false praise, say, “I have anointed his head.” Love then to be “convicted by the righteous One in mercy;” love not to be praised by a sinner in mockery. Have oil in yourselves, and ye shall not seek the “oil of a sinner.”…

Thou sayest to me, What am I doing? I am beset with flatterers; they cease not to besiege me; they praise in me what I would not, that praise in me what I hold in little esteem; what I hold dear they blame in me; flatterers, treacherous, deceivers. For instance, “Gaiuseius is a great man, great, learned, wise; but why is he a Christian? For great is his learning, great his reading, great his wisdom.” If great is his wisdom, approve of his being a Christian; if great his learning, learnedly hath he chosen. In fine, what thou revilest, that pleaseth him whom thou praisest. But what? That praise sweeteneth not: it is “the oil of a sinner.” Yet ceaseth he not to speak so. Let him not therewith “fatten thy head;” that is, rejoice not in such things; agree not to such things; consent not to such things; rejoice not in such things; and then, if he have applied to thee the oil of flattery, yet hath thy head remained as it was, it has not been puffed up, it hath not swollen.…“For still shall My word be well-pleasing to them.” Wait awhile: now they revile Me, saith Christ. In the early times of the Christians, the Christians were blamed on all sides. Wait as yet; and “My word shall be well-pleasing to them.” The time shall come when they shall conquer thousands of men, who shall beat their breasts, and say, “Forgive us our debts, as we forgive our debtors.” Even now, how many remain who blush to beat their breasts? Let them then blame us: let us bear it. Let them blame; let them hate, accuse, detract; “still shall My word be well-pleasing to them;” the time shall come when My word shall please them.…O wordy defence of iniquity! Verily now whole nations say this, and the thunder of nations beating their breasts ceaseth not. Rightly do the clouds thunder, wherein now God dwelleth. Where is now that wordiness, where that boasting, “I am righteous; nought of ill have I done”? Verily, when thou hast contemplated in Holy Scripture the law of righteousness, how far soever thou hast advanced, thou shalt find thyself a sinner.…What sort of man am I now speaking of, brethren? I speak of him who worshippeth God alone, who confesseth Christ, who knoweth the Father and the Son and the Holy Ghost to be one God; who committeth not fornication against Him; who worshippeth not devils; who seeketh him not aid from the devil; who holdeth the Catholic Church; whom no one complaineth of as cheating; under whose oppression no weak neighbour groaneth; who assaileth not another’s wife; who is content with his own, or even without his own, in such wise as is lawful, and as Apostolical discipline permitteth, with consent of both, or when she is not yet married. Even he who is such as this, is yet overtaken in such things as I have mentioned. For all these daily sins then what is our hope, save to say with humble heart in the Lord’s Prayer, while we defend not our sins, but confess them, “Forgive us our debts, as we forgive our debtors;” and to “have an Advocate with the Father, Jesus Christ the righteous,” that He may be “the propitiation for our sins”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520141.html'
source_title="Exposition on Psalm 141"
