[[commentary]]
quote='''
“Who alone did wonderful things” (ver. 4). As at the last part of every verse, it is written, “For His mercy endureth for ever,” so we must understand at the beginning of each, though it be not written, “Give thanks.” Which indeed in the Greek is very plain. It would be so in Latin, if our translators had been able to make use of that expression. Which indeed they could have done in this verse, if they had said, “To Him who doeth wonderful things.” For where we have, “who did wonderful things,” the Greek has τῷ ποιήσαντι, where we must necessarily understand, “give thanks.” And I would they had added the pronoun, and said to Him, “who did,” or to Him “who doeth,” or to Him “who made sure;” because then one might easily understand, “let us give thanks.” For now it is so obscurely rendered, that he who either knows not or cares not to examine a Greek manuscript may think, “who made the heavens, who made sure the earth, who made the luminaries, for His mercy endureth for ever,” has been so said, because He did these things for this reason, “because His mercy endureth for ever:” whereas they, whom He has freed from misery, belong to His Mercy: but not that we should believe that He makes sky, earth, and luminaries, of His Mercy; since they are marks of His Goodness, who created all things very good. For He created all things, that they might have their being; but it is the work of His Mercy, to cleanse us from our sins, and deliver us from everlasting misery. And so the Psalm thus addresses us, “Give thanks unto the God of gods, give thanks unto the Lord of lords.” Give thanks to Him, “who alone doeth great wonders;” give thanks to Him, “who by His wisdom made the heavens;” give thanks to Him, “who stretched out the earth above the waters;” give thanks to Him, “who alone made great lights.” But why we are to praise, he setteth down at the end of all the verses, “for His mercy endureth for ever.”

But what meaneth, “who alone doeth great wonders”? Is it because many wonderful things He hath done by means of angels and men? Some wonderful things there are which God doeth alone, and these he enumerates, saying, “who by His wisdom made the heavens” (ver. 5), “who stretched out the earth above the waters” (ver. 6), “who alone made great lights” (ver. 7). For this reason did he add “alone” in this verse also, because the other wonders which he is about to tell of, God did by means of man. For having said, “who alone made great lights,” he goes on to explain what these are, “the sun to rule the day” (ver. 8), “the moon and stars to govern the night” (ver. 9); then he begins to tell the wonders which He did by means of angels and men: “who smote Egypt with their first-born” (ver. 10), and the rest. The whole creation then God manifestly made, not by means of any creature, but “alone;” and of this creation he hath mentioned certain more eminent parts, that they might make us think on the whole; the heavens we can understand, and the earth we see. And as there are visible heavens too, by mentioning the lights in them, he has bid us look on the whole body of the heavens as made by Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520136.html'
source_title="Exposition on Psalm 136"
