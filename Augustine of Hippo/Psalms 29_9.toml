[[commentary]]
quote='''
“The Voice of the Lord perfecting the stags” (ver. 9). For the Voice of the Lord hath first perfected them that overcame and repelled the envenomed tongues. “And will reveal the woods.” And then will He reveal to them the darknesses of the Divine books, and the shadowy depths of the mysteries, where they feed with freedom. “And in His temple doth every man speak of His glory.” And in His Church all born again to an eternal hope praise God, each for His own gift, which He hath received from the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252029.html'
source_title="Exposition on Psalm 29"
