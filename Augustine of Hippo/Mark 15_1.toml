[[commentary]]
quote='''
Matthew next proceeds as follows: "When the morning was come, all the chief priests and elders of the people took counsel against Jesus, to put Him to death; and when they had bound Him, they led Him away, and delivered Him to Pontius Pilate the governor." Mark's version is to the like effect: "And straightway in the morning, the chief priests held a consultation with the elders and scribes, and the whole council, and bound Jesus, and carried Him away, and delivered Him to Pilate." Luke, again, after completing his account of Peter's denial, recapitulates what Jesus had to endure when it was now about daybreak, as it appears, and continues his narrative in the following connection: "And the men that held Jesus mocked Him, and smote Him; and when they had blindfolded Him, they struck Him on the face, and asked Him, saying, Prophesy, who is it that smote thee? And many other things blasphemously spake they against Him. And as soon as it was day, the elders of the people, and the chief priests, and the scribes came together, and led Him into their council, saying, Art thou the Christ? tell us. And He said unto them, If I tell you, ye will not believe; and if I also ask you, ye will not answer me, nor let me go. Hereafter shall the Son of man sit on the right hand of the power of God. Then said they all, Art thou then the Son of God? And He said unto them, Ye say that I am. And they said, What need we further witness? For we ourselves have heard of His own mouth. And the whole multitude of them arose, and led Him unto Pilate." Luke has thus recorded all these things. His statement contains certain facts which are also related by Matthew and Mark; namely, that the Lord was asked whether He was the Son of God, and that He made this reply, "I say unto you, hereafter shall ye see the Son of man sitting on the right hand of power, and coming in the clouds of heaven." And we gather that these things took place when the day was now breaking, because Luke's expression is, "And as soon as it was day." Thus Luke's narrative is similar to those of the others, although he also introduces something which these others have left unnoticed. We gather further, that when it was yet night, the Lord faced the ordeal of the false witnesses,—a fact which is recorded briefly by Matthew and Mark, and which is passed over in silence by Luke, who, however, has told the story of what was done when the dawn was coming in. The former two—namely, Matthew and Mark—have given connected narratives of all that the Lord passed through until early morning. After that, however, they have reverted to the story of Peter's denial; on the conclusion of which they have come back upon the events of the early morning, and have introduced the other circumstances which remained for recital with a view to the completion of their account of what befell the Lord. But up to this point they have given no account of the occurrences belonging specifically to the morning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 7"
