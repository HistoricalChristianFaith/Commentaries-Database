[[commentary]]
quote='''
“And I walked at liberty: for I sought Thy precepts” (ver. 45).…“And I walked at liberty.” Here the copulative conjunction, “and,” is not used as a connecting particle; for he doth not say, and I will walk, as he had said, “and I will keep Thy commandments for ever and ever:” or if this latter verse be in the optative mood, and may I keep Thy law; he doth not add, And may I walk at liberty, as if he had desired and prayed for both of these things; but he saith, “And I walked at liberty.” If this conjunction were not used here, and if the sentence were introduced free from any such connection with what preceded, “I walked at liberty,” the reader would never be induced by anything unusual in the mode of speech to think he should seek for some hidden sense. Doubtless, then, he wished what he hath not said to be understood, that is, that his prayers had been heard; and he then added what he had become: as if he were to say, When I prayed for these things, Thou heardest me, “And I walked at liberty;” and so with the remaining expressions which he hath added to the same purpose.

…Whence after he had said, “And I walked at liberty,” he subjoined the reason, “For I sought out Thy commandments.” Some copies have not “commandments” but “testimonies:” but we find “commandments” in most, and especially in the Greek; and who would hesitate rather to believe this tongue, as prior to our own, and that from which these Psalms have been rendered into Latin? If then we wish to know how he sought out these commandments, or how they ought to be sought out, let us consider what our good Master, who both taught and gave them, saith: “Ask, and it shall be given you.” And a little lower, “If ye then,” He saith, “being evil, know how to give good gifts unto your children, how much more shall your Father which is in Heaven give good things to them that ask Him.” Where He evidently showeth, that the words He had spoken, seek, ask, knock, belong only to earnestness in asking, that is, in praying. Moreover, another Evangelist saith not, He will give good things to them that ask Him; which may be understood in many ways, either as earthly or spiritual blessings; but has excluded other interpretations, and very carefully expressed what our Lord wished us to pray earnestly and instantly for, in these words: “How much more shall your heavenly Father give the Holy Spirit to them that ask Him.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
