[[commentary]]
quote='''
Secondly, he turneth himself to those very persons to whom he hath given so great hope, and to them while here living he speaketh and exhorteth: “Sing ye to God, psalm ye to His name” (ver. 4). Already on this subject in the exposition of the Title we have before spoken that which seemed meet. He singeth to God, that liveth to God: He psalmeth to His name, that worketh unto His Glory. In singing thus, in psalming thus, that is, by so living, by so working, “a way make ye to Him,” he saith, “that hath ascended above the setting.” A way make ye to Christ: so that through the beautiful feet of men telling good tidings, the hearts of men believing many have a way opened to Him. For the Same is He that hath ascended above the “setting:” either because the new life of one turned to Him receiveth Him not, except the old life shall have set by his renouncing this world, or because He ascended above the setting, when by rising again He conquered the downfall of the body. “For The Lord is His name.” Which if they had known, the Lord of glory they never would have crucified.

“Exult ye in the sight of Him,” O ye to whom hath been said, “Sing ye to God, psalm ye to the name of Him, a way make ye to Him that hath ascended above the setting,” also “exult in the sight of Him:” as if “sorrowful, yet alway rejoicing.” For while ye make a way to Him, while ye prepare a way whereby He may come and possess the nations, ye are to suffer in the sight of men many sorrowful things. But not only faint not, but even exult, not in the sight of men, but in the sight of God. “In hope rejoicing, in tribulation enduring:” “exult ye in the sight of Him.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
