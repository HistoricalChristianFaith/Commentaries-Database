[[commentary]]
quote='''
“The Lord keepeth all their bones: not one of them shall be broken” (ver. 20): this also, Brethren, let us not receive carnally. Bones are the firm supports of the faithful. For as in flesh our bones give firmness, so in the heart of a Christian it is faith that gives firmness. The patience then which is in faith, is as the bones of the inner man: this is that which cannot be broken. “The Lord keepeth all their bones: not one of them shall be broken.” If of our Lord God Jesus Christ he had said this, “The Lord keepeth all the bones of His Son; not one of them shall be broken;” as is prefigured of Him also in another place, when the lamb was spoken of that should be slain, and it was said of it, “Neither shall ye break a bone thereof:” then was it fulfilled in the Lord, because when He hung upon the Cross, He expired before they came to the Cross, and found His Body lifeless already, and would not break His legs, that it might be fulfilled which was written. But He gave this promise to other Christians also, “The Lord keepeth all their bones; not one of them shall be broken.” Therefore, Brethren, if we see any Saint suffer tribulation, and haply either by a Physician so cut, or by some persecutor so mangled, that his bones be broken; let us not say, This man was not righteous, for this hath the Lord promised to His righteous, of whom He said, “The Lord keepeth all their bones; not one of them shall be broken.” Wouldest thou see that He spoke of other bones, those which we called the firm supports of faith, that is, patience and endurance in all tribulations? For these are the bones which are not broken. Hear, and see ye in the very Passion of our Lord, what I say. The Lord was in the middle Crucified; near Him were two thieves: the one mocked, the other believed: the one was condemned, the other justified: the one had his punishment both in this world, and that which shall be, but unto the other said the Lord, “Verily I say unto thee, To-day shalt thou be with Me in Paradise;” and yet those who came brake not the bones of the Lord, but of the thieves they brake: as much were broken the bones of the thief who blasphemed, as of the thief who believed. Where then is that which is spoken, “The Lord keepeth all their bones; not one of them shall be broken”? Lo, unto whom He said, “To-day shalt thou be with Me in Paradise,” could He keep all his bones? The Lord answereth thee: Yea, I kept them: for the firm support of his faith could not be broken by those blows whereby his legs were broken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"

[[commentary]]
quote='''
O Body of Christ, Holy Church, let all thy bones say, “Lord, who is like unto thee?” And if the flesh under persecution hath fallen away, let the bones say, “Lord, who is like unto Thee?” For of the righteous it is said, “The Lord keepeth all their bones; not one of them shall be broken.” Of how many righteous have the bones under persecution been broken? Finally, “The just shall live by faith,” and “Christ justifieth the ungodly.” But how justifieth He any except believing and confessing? “For with the heart man believeth unto righteousness, and with the mouth confession is made unto salvation.” Therefore also that thief, although from His theft led to the judge, and from the judge to the cross, yet on the very cross was justified: with his heart he believed, with his mouth he confessed. For neither to a man unrighteous and not already justified, would the Lord have said, “To-day shalt thou be with Me in Paradise,” and yet his bones were broken. For when they came to take down the bodies, by reason of the approaching Sabbath, the Lord was found already dead, and His Bones were not broken. But of those that yet lived, that they might be taken down, the legs were broken, that so from this pain having died, they might be buried. Were then of the one thief, who persisted in his ungodliness on the cross, the bones broken, and not also of the other who with his heart believed, and with his mouth made confession unto salvation? Where then is that which was said, “The Lord keepeth all his bones; not one of them shall be broken;” except that in the Body of the Lord the name of bones is given to all the righteous, the firm in heart, the strong, yielding to no persecutions, no temptations, so as to consent unto evil?…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"
