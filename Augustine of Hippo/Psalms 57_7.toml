[[commentary]]
quote='''
But the patience of good men with preparation of heart accepteth the will of God: and glorieth in tribulations, saying that which followeth: “Prepared is my heart, O God, I will sing and play” (ver. 8). What hath he done to me? He hath prepared a pit, my heart is prepared. He hath prepared pit to deceive, shall I not prepare heart to suffer? He hath prepared pit to oppress, shall I not prepare heart to endure? Therefore he shall fall into it, but I will sing and play. Hear the heart prepared in an Apostle, because he hath imitated his Lord: “We glory,” he saith, “in tribulations: because tribulation worketh patience: patience probation, probation hope, but hope maketh not ashamed: because the love of God is shed abroad in our hearts through the Holy Spirit, which hath been given to us.” He was in oppressions, in chains, in prisons, in stripes, in hunger and thirst, in cold and nakedness, in every wasting of toils and pains, and he was saying, “We glory in tribulations.” Whence, but that prepared was his heart? Therefore he was singing and playing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"
