[[commentary]]
quote='''
Therefore Christ's resurrection, which happened on the third day indeed of His passion, but on the eighth day in the days of the week, that same resurrection it is that doth circumcise us. Hear of those that were circumcised with the real stone, while the apostle admonishes them: "If then ye be risen with Christ, seek those things which are above, where Christ is, sitting on the right hand of God; set your affection on things above, not on things on the earth." He speaks to the circumcised: Christ has risen; He has taken away from you carnal desires, evil lusts, the superfluity with which you were born, and that far worse which you had added thereto by ill living; being circumcised by the Rock, why do you still set your affections on the earth?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252030.html'
source_title="Tractates on John 30"
