[[commentary]]
quote='''
“For in death there is no one that is mindful of Thee” (ver. 5). He knows too that now is the time for turning unto God: for when this life shall have passed away, there remaineth but a retribution of our deserts. “But in hell who shall confess to Thee?” That rich man, of whom the Lord speaks, who saw Lazarus in rest, but bewailed himself in torments, confessed in hell, yea so as to wish even to have his brethren warned, that they might keep themselves from sin, because of the punishment which is not believed to be in hell. Although therefore to no purpose, yet he confessed that those torments had deservedly lighted upon him; since he even wished his brethren to be instructed, lest they should fall into the same. What then is, “But in hell who will confess to Thee?” Is hell to be understood as that place, whither the ungodly will be cast down after the judgment, when by reason of that deeper darkness they will no more see any light of God, to whom they may confess aught? For as yet that rich man by raising his eyes, although a vast gulf lay between, could still see Lazarus established in rest: by comparing himself with whom, he was driven to a confession of his own deserts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25206.html'
source_title="Exposition on Psalm 6"
