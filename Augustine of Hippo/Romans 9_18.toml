[[commentary]]
quote='''
Why does the Father not teach all people in order that they might come to Christ, unless it is that all those whom he teaches, he teaches because of mercy, but those whom he does not teach, he does not teach because of judgment?
'''
source_url=''
source_title="PREDESTINATION OF THE SAINTS 8.14"

[[commentary]]
quote='''
Wherefore the Apostle concludes thus: Therefore he has mercy on whom he wills, and whom he wills he hardens. For on whom he has mercy, he makes him work well; and whom he hardens, he abandons him, so that he works evil. But that mercy is granted to the preceding merit of faith, and that hardening to preceding ungodliness, so that we both do good through the gift of God and evil through punishment—while yet free will is not taken away from man, whether unto believing God, that mercy may follow us, or unto ungodliness, that punishment may follow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
When, therefore, you hear the Lord say, "I the Lord have deceived that prophet," and likewise what the apostle says: "He hath mercy on whom He will have mercy, and whom He will He hardeneth," believe that, in the case of him whom He permits to be deceived and hardened, his evil deeds have deserved the judgment; whilst in the case of him to whom He shows mercy, you should loyally and unhesitatingly recognise the grace of the God who "rendereth not evil for evil; but contrariwise blessing." Nor should you take away from Pharaoh free will, because in several passages God says, "I have hardened Pharaoh;" or," I have hardened or I will harden Pharaoh's heart;" for it does not by any means follow that Pharaoh did not, on this account, harden his own heart. For this, too, is said of him, after the removal of the fly-plague from the Egyptians, in these words of the Scripture: "And Pharaoh hardened his heart at this time also; neither would he let the people go." Thus it was that both God hardened him by His just judgment, and Pharaoh by his own free will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 45"
