[[commentary]]
quote='''
Now God grants them the approach of a healthy shame, if they despise not the medicine of confession: but if they will not now be ashamed, then they shall be ashamed, when “their iniquities shall convince them to their face.” How shall they be ashamed? When they shall say, “These are they whom we had sometimes in derision, and a parable of reproach. We fools counted their life madness: how are they numbered among the children of God! What hath pride profited us?” Then shall they say this: let them say it now, and they say it to their health. For let each one turn humbly to God, and now say, What hath my pride profited me? and hear from the Apostle, “For what glory had ye in those things of which ye are now ashamed?” Ye see that there is even now a wholesome shame while there is a place of penitence: but then one which will be late, useless, fruitless.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
