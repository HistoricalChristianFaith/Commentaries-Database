[[commentary]]
quote='''
“Raising the clouds from the ends of the earth” (ver. 7). We see these works of God in His creation. For the clouds come from the ends of the earth to the midst thereof, and rain; thou scannest not whence they arise. Hence the prophet signifies this, from “the ends of the earth,” whether it be from the bottom, or from the circumference of the ends of the earth, whencesoever He wills He raises the clouds, only from the earth. “He hath made lightnings into rain.” For lightnings without rain would frighten thee, and bestow nothing on thee. “He maketh lightnings unto rain.” It lightens, and thou tremblest; it rains, thou rejoicest. “He hath made lightnings unto rain.” He who terrified thee, Himself causest that thou shouldest rejoice. “Who bringeth the winds out of His treasures,” their causes are hidden, thou knowest not whence they come. When the wind blows, thou feelest it; why it blows, or from what treasure of His wisdom it is brought forth, thou knowest not; yet thou owest to God the worship of faith, for it would not blow unless He had bidden who made it, unless He had brought it forth who created it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520135.html'
source_title="Exposition on Psalm 135"
