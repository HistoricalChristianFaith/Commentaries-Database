[[commentary]]
quote='''
These fetters must not be shunned, in order to gain a destructive freedom and the temporal and brief pleasure of this life, to be followed by perpetual bitterness. Accordingly Scripture, that we may not refuse the fetters of wisdom, thus addresseth us: “…Then shall her fetters be a strong defence for thee, and her chains a robe of glory.” Let the fettered therefore cry out, as long as they are in the chains of the discipline of God, in which the martyrs have been tried: the fetters shall be loosed, and they shall fly away, and these very fetters shall afterwards be turned into an ornament. This hath happened with the martyrs. For what have the persecutors effected by killing them, except that their fetters were thereby loosed, and turned into crowns?…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
