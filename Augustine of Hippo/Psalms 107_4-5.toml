
[[commentary]]
quote='''
“They wandered in the wilderness, in a dry place, they found not the way of a city to dwell in” (ver. 4). We have heard a wretched wandering; what of want? “Hungry and thirsty, their soul fainted in them” (ver. 5). But wherefore did it faint? for what good? For God is not cruel, but He maketh Himself known, in that it is expedient for us, that He be entreated by us fainting, and that aiding us He be loved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520107.html'
source_title="Exposition on Psalm 107"
