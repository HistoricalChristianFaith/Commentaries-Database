[[commentary]]
quote='''
Matthew continues his narrative in the following terms: "And Jesus, going up to Jerusalem, took the twelve disciples apart, and said unto them, Behold, we go up to Jerusalem; and the Son of man shall be betrayed unto the chief priests and unto the scribes, and they shall condemn Him to death, and shall deliver Him to the Gentiles to mock, and to scourge, and to crucify Him; and the third day He shall rise again. Then came to Him the mother of Zebedee's children with her sons, worshipping Him, and desiring a certain thing of Him;" and so on, down to the words, "Even as the Son of man came not to be ministered unto, but to minister, and to give His life a ransom for many." Here again Mark keeps the same order as Matthew, only he represents the sons of Zebedee to have made the request themselves; while Matthew has stated that it was preferred on their behalf not by their own personal application, but by their mother, as she had laid what was their wish before the Lord. Hence Mark has briefly intimated what was said on that occasion as spoken by them, rather than by her [in their name]. And to conclude with the matter, it is to them rather than to her, according to Matthew no less than according to Mark, that the Lord returned His reply. Luke, on the other hand, after narrating in the same order our Lord's predictions to the twelve disciples on the subject of His passion and resurrection, leaves unnoticed what the other two evangelists immediately go on to record; and after the interposition of these passages, he is joined by his fellow-writers again [at the point where they report the incident] at Jericho.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 64"
