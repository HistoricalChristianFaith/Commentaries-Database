[[commentary]]
quote='''
"Pray that you do not enter into temptation"—that you enter not again into "contentions, envying, animosities, dissension, detractions, seditions, whispering." For we have not planted and watered the Lord's garden in you only to reap these thorns from you. But if your weakness still stirs up a storm, pray that you may be delivered from temptation. Those among you who trouble you, whoever they may be, will incur judgment unless they amend their lives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 211"

[[commentary]]
quote='''
Wherefore, our Heavenly Master also says: "Watch and pray, that ye enter not into temptation." Let every man, therefore, when fighting against his own concupiscence, pray that he enter not into temptation; that is, that he be not drawn aside and enticed by it. But he does not enter into temptation if he conquers his evil concupiscence by good will. And yet the determination of the human will is insufficient, unless the Lord grant it victory in answer to prayer that it enter not into temptation. What, indeed, affords clearer evidence of the grace of God than the acceptance of prayer in any petition? If our Saviour had only said, "Watch that ye enter not into temptation," He would appear to have done nothing further than admonish man's will; but since He added the words, "and pray," He showed that God helps us not to enter into temptation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 9"
