[[commentary]]
quote='''
(de cons. Ev. ii. 17.) John relates in his Gospel the calling of Peter, Andrew, and Nathanael, and the miracle in Cana, before Jesus' departure into Galilee; all these things the other Evangelists have omitted, carrying on the thread of their narrative with Jesus' return into Galilee. We must understand then that some days intervened, during which the things took place concerning the calling of the disciples which John relates.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Matthew's narrative is continued thus: "Now when Jesus had heard that John was cast into prison, He departed into Galilee." Mark states the same fact, as also does Luke, only Luke says nothing in the present section as to John being cast into prison. The evangelist John, again, tells us that, before Jesus went into Galilee, Peter and Andrew were with Him one day, and that on that occasion the former had this name, Peter, given him, while before that period he was called Simon. Likewise John tells us, that on the day following, when Jesus was now desirous of going forth unto Galilee, He found Philip, and said to him that he should follow Him. Thus, too, the evangelist comes to give the narrative about Nathanael. Further, he informs us that on the third day, when He was yet in Galilee, Jesus wrought the miracle of the turning of the water into wine at Cana. All these incidents are left unrecorded by the other evangelists, who continue their narratives at once with the statement of the return of Jesus into Galilee. Hence we are to understand that there was an interval here of several days, during which those incidents took place in the history of the disciples which are inserted at this point by John.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 17"

[[commentary]]
quote='''
Furthermore, we must consider the question how the evangelist John, before there is any mention of the casting of John the Baptist into prison, tells us that Jesus went into Galilee. For, after relating how He turned the water into wine at Cana of Galilee, and how He came down to Capernaum with His mother and His disciples, and how they abode there not many days, he tells us that He went up then to Jerusalem on account of the passover; that after this He came into the land of Judæa along with His disciples, and tarried there with them, and baptized; and then in what follows at this point the evangelist says: "And John also was baptizing in Ænon, near to Salim, because there was much water there; and they came, and were baptized: for John was not yet cast into prison." On the other hand, Matthew says: "Now when He had heard that John was cast into prison, Jesus departed into Galilee." In like manner, Mark's words are: "Now, after that John was put in prison, Jesus came into Galilee." Luke, again, says nothing indeed about the imprisonment of John; but notwithstanding this, after his account of the baptism and temptation of Christ, he also makes a statement to the same effect with that of these other two, namely, that Jesus went into Galilee. For he has connected the several parts of his narrative here in this way: "And when all the temptation was ended, the devil departed from Him for a season; and Jesus returned in the power of the Spirit into Galilee, and there went out a fame of Him through all the region round about." From all this, however, we may gather, not that these three evangelists have made any statement opposed to the evangelist John, but only that they have left unrecorded the Lord's first advent in Galilee after His baptism; on which occasion also He turned the water into wine there. For at that period John had not yet been cast into prison. And we are also to understand that these three evangelists have introduced into the context of these narratives an account of another journey of His into Galilee, which took place after John's imprisonment, regarding which return into Galilee the evangelist John himself furnishes the following notice: "When, therefore, Jesus knew how the Pharisees had heard that Jesus makes and baptizes more disciples than John (though Jesus Himself baptized not, but His disciples), he left Judæa, and departed again into Galilee." So, then, we perceive that by that time John had been already cast into prison; and further, that the Jews had heard that He was making and baptizing more disciples than John had made and baptized.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 18"

[[commentary]]
quote='''
Matthew then proceeds with his narrative in the following terms: "For Herod laid hold on John, and bound him, and put him in prison for Herodias' sake, his brother's wife;" and so on, down to the words, "And his disciples came and took up the body, and buried it, and went and told Jesus." Mark gives this narrative in similar terms. Luke, on the other hand, does not relate it in the same succession, but introduces it in connection with his statement of the baptism wherewith the Lord was baptized. Hence we are to understand him to have acted by anticipation here, and to have taken the opportunity of recording at this point an event which took place actually a considerable period later. For he has first reported those words which John spake with regard to the Lord—namely, that "His fan is in His hand, and that He will thoroughly purge His floor, and will gather the wheat into His garner; but the chaff He will burn up with fire unquenchable;" and immediately thereafter he has appended his statement of an incident which the evangelist John demonstrates not to have taken place in direct historical sequence. For this latter writer mentions that, after Jesus had been baptized, He went into Galilee at the period when He turned the water into wine; and that, after a sojourn of a few days in Capharnaum, He left that district and returned to the land of Judæa, and there baptized a multitude about the Jordan, previous to the time when John was imprisoned. Now what reader, unless he were all the better versed in these writings, would not take it to be implied here that it was after the utterance of the words with regard to the fan and the purged floor that Herod became incensed against John, and cast him into prison? Yet, that the incident referred to here did not, as matter of fact, occur in the order in which it is here recorded, we have already shown elsewhere; and, indeed, Luke himself puts the proof into our hands. For if [he had meant that] John's incarceration took place immediately after the utterance of those words, then what are we to make of the fact that in Luke's own narrative the baptism of Jesus is introduced subsequently to his notice of the imprisonment of John? Consequently it is manifest that, recalling the circumstance in connection with the present occasion, he has brought it in here by anticipation, and has thus inserted it in his history at a point antecedent to a number of incidents, of which it was his purpose to leave us some record, and which, in point of time, were antecedent to this mishap that befell John. But it is as little the case that the other two evangelists, Matthew and Mark, have placed the fact of John's imprisonment in that position in their narratives which, as is apparent also from their own writings, belonged to it in the actual order of events. For they, too, have told us how it was on John's being cast into prison that the Lord went into Galilee; and then, after [relating] a number of things which He did in Galilee, they come to Herod's admonition or doubt as to the rising again from the dead of that John whom he beheaded; and in connection with this latter occasion, they give us the story of all that occurred in the matter of John's incarceration and death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 44"
