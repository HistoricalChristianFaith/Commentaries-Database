[[commentary]]
quote='''
“He lieth in wait in a secret place, as a lion in his den.” By a lion in a den, he means one in whom both violence and deceit will work. For the first persecution of the Church was violent, when by proscriptions, by torments, by murders, the Christians were compelled to sacrifice: another persecution is crafty, which is now conducted by heretics of any kind and false brethren: there remains a third, which is to come by Antichrist, than which there is nothing more perilous; for it will be at once violent and crafty. Violence he will exert in empire, craft in miracles. To the violence, the word “lion” refers; to craft, the words “in his den.” And these are again repeated with a change of order. “He lieth in wait,” he says, “that he may catch the poor;” this hath reference to craft: but what follows, “To catch the poor whilst he draweth him,” is put to the score of violence. For “draweth” means, he bringeth him to himself by violence, by whatever tortures he can.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252010.html'
source_title="Exposition on Psalm 10"
