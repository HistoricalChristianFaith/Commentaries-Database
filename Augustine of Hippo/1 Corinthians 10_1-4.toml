[[commentary]]
quote='''
Manna signified this bread; God's altar signified this bread. Those were sacraments. In the signs they were diverse; in the thing which was signified they were alike. Hear the apostle: "For I would not that ye should be ignorant, brethren," saith he, "that all our fathers were under the cloud, and all passed through the sea; and were all baptized unto Moses in the cloud and in the sea; and did all eat the same spiritual meat." Of course, the same spiritual meat; for corporally it was another: since they ate manna, we eat another thing; but the spiritual was the same as that which we eat. But "our" fathers, not the fathers of those Jews; those to whom we are like, not those to whom they were like. Moreover he adds: "And did all drink the same spiritual drink." They one kind of drink, we another, but only in the visible form, which, however, signified the same thing in its spiritual virtue. For how was it that they drank the "same drink"? "They drank," saith he "of the spiritual Rock that followed them, and that Rock was Christ." Thence the bread, thence the drink. The rock was Christ in sign; the real Christ is in the Word and in flesh. And how did they drink? The rock was smitten twice with a rod; the double smiting signified the two wooden beams of the cross.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252026.html'
source_title="Tractates on John 26"

[[commentary]]
quote='''
So also in another place, "For I would not have you ignorant, brethren, how that all our fathers were under the cloud, and all passed through the sea: and were all baptized unto Moses in the cloud and in the sea; and did all eat the same spiritual meat, and did all drink the same spiritual drink." The Red Sea signifies baptism; Moses, their leader through the Red Sea, signifies Christ; the people, who passed through, signify believers; the death of the Egyptians signifies the abolition of sins. Under different signs there is the same faith. It is with different signs as with different words [verbs]; for verbs change their sounds through the tenses, and verbs are indeed nothing else than signs. For they are words because of what they signify: take away the meaning from a word, and it becomes a senseless sound. All, therefore, have become signs. Was not the same faith theirs by whom these signs were employed, and by whom were foretold in prophecy the very things which we believe? Certainly it was: but they believed that they were yet to come, and we, that they have come. In like manner does he also say, "They all drank the same spiritual drink;" "the same spiritual," for it was not the same material [drink]. For what was it they drank? "For they drank of the spiritual Rock that followed them; and that Rock was Christ." See, then, how that while the faith remained, the signs were varied. There the rock was Christ; to us that is Christ which is placed on the altar of God. And they, as a great sacramental sign of the same Christ, drank the water flowing from the rock: what we drink is known to believers. If one's thoughts turn to the visible form, the thing is different; if to the meaning that addresses the understanding, they drank the same spiritual drink.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252045.html'
source_title="Tractates on John 45"
