[[commentary]]
quote='''
Is this too to be proved, that the Holy Spirit is called in the sacred books the gift of God? If people look for this too, we have in the Gospel according to John the words of our Lord Jesus Christ, who says, "If any one thirst, let him come to me and drink: he that believeth on me, as the Scripture saith, out of his belly shall flow rivers of living water." And the evangelist has gone on further to add, "And this He spake of the Spirit, which they should receive who believe in Him." And hence Paul the apostle also says, "And we have all been made to drink into one Spirit." The question then is, whether that water is called the gift of God which is the Holy Spirit. But as we find here that this water is the Holy Spirit, so we find elsewhere in the Gospel itself that this water is called the gift of God. For when the same Lord was talking with the woman of Samaria at the well, to whom He had said, "Give me to drink," and she had answered that the Jews "have no dealings" with the Samaritans, Jesus answered and said unto her, "If thou hadst known the gift of God, and who it is that says to thee, Give me to drink, thou wouldest have asked of Him, and He would have given thee living water. The woman saith unto Him, Sir, thou hast nothing to draw with, and the well is deep: whence then hast thou this living water, etc.? Jesus answered and said unto her, Every one that drinketh of this water shall thirst again; but whose shall drink of the water that I shall give him, shall never thirst; but the water that I shall give him, shall be in him a fountain of water springing up unto eternal life." Because this living water, then, as the evangelist has explained to us, is the Holy Spirit, without doubt the Spirit is the gift of God, of which the Lord says here, "If thou hadst known the gift of God, and who it is that saith unto thee, Give me to drink, thou wouldest have asked of Him, and He would have given thee living water." For that which is in the one passage, "Out of his belly shall flow rivers of living water," is in the other, "shall be in him a fountain of water springing up unto eternal life."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520The%2520Trinity%2FBook%252015.html'
source_title="ON THE TRINITY 15.19.33"

[[commentary]]
quote='''
(Tract. xv) He who asked to drink, however, out of the woman's vessel, thirsted for the woman's faith: Jesus answered and said unto her, If thou knewest the gift of God, or Who it is that saith to thee, Give Me to drink, thou wouldest have asked of Him, and He would have given thee living water.

(1. lxxxiii. Quaest. qu. 64) He lets her know that it was not the water, which she meant, that Ho asked for; but that knowing her faith, He wished to satisfy her thirst, by giving her the Holy Spirit. For so must we interpret the living water, which is the gift of God; as He saith, If thou knewest the gift of God.

(Tr. xv) Living water is that which comes out of a spring, in distinction to what is collected in ponds and cisterns from the rain. If spring water too becomes stagnant, i. e. collects into some spot, where it is quite separated from its fountain head, it ceases to be living water.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"
