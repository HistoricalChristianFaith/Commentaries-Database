[[commentary]]
quote='''
“From Heaven Thou hast hurled judgment: the earth hath trembled, and hath rested” (ver. 8). She which now doth trouble herself, she which now speaketh, hath to fear at the end and to rest. Better had she now rested, that at the end she might have rejoiced. Rested? When? “When God arose unto judgment, that He might save all the meek in heart” (ver. 9). Who are the meek in heart? They that on snorting horses have not mounted, but in their humility have confessed their own sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252076.html'
source_title="Exposition on Psalm 76"
