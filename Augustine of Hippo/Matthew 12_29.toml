[[commentary]]
quote='''
(ubi sup.) For he held us, that we should not by our own strength be able to free ourselves from him, but by the grace of God. By his goods, he means all the unbelievers. He has bound the strong man, in that He has taken away from him all power of hindering the faithful from following Christ, and gaining the kingdom of heaven.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
“Which deliverest the poor from him that is too strong for him; yea, the poor and needy from him that spoileth him.”…Who that deliverest, but He who is Strong in hand? Even that David shall deliver the poor from him that is too strong for him. For the devil was too strong for thee, and held thee, because he conquered thee, when thou consentedst unto him. But what hath the Strong in hand done? “No man entereth into a strong man’s house, to spoil his goods, except he first bind the strong man.” By His own Power, most Holy, most Magnificent, hath He bound the devil by pouring forth the weapon to stop the way against him, that He may deliver the poor and needy, to whom there was no helper. For who is thy helper but the Lord to whom thou sayest, “O Lord, My Strength, and My Redeemer.” If thou wilt presume of thy own strength, thereby wilt thou fall, whereof thou hast presumed: if of another’s, he would lord it over thee, not succour thee. He then alone is to be sought Who hath redeemed them, and made them free, and hath given His Blood to purchase them, and of His servants hath made them His Brethren.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"

[[commentary]]
quote='''
If it would be perceived who are strong men, at first the devil himself the Lord hath called a strong man: “No one,” He saith, “is able to go into the house of a strong man, and to carry off his vessels, unless first he shall have bound the strong man.” He hath bound therefore the strong man with the chains of His dominion: and his vessels He hath carried off, and His own vessels hath made them. For all unrighteous men were vessels of the devil.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"

[[commentary]]
quote='''
“Spoils” moreover those are called that are stripped off from conquered foes. What this is the Gospel adviseth us in the passage where we read, “No one goeth into the house of a strong man to spoil his vessels, unless first he shall have bound the strong man.” Christ therefore hath bound the devil with spiritual bonds, by overcoming death, and by ascending from Hell above the Heavens: He hath bound him by the Sacrament of His Incarnation, because though finding nothing in Him deserving of death, yet he was permitted to kill: and from him so bound He took away his vessels as though they were spoils. For he was working in the sons of disobedience, of whose unbelief he made use to work his own will. These vessels the Lord cleansing by the remission of sins, sanctifying these spoils wrested from the foe laid prostrate and bound, these He hath divided to the beauty of His House; making some apostles, some prophets, some pastors and doctors, for the work of the ministry, for the building up of the Body of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
