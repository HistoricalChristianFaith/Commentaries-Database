[[commentary]]
quote='''
“Appoint me a law, O Lord, in Thy way” (ver. 11). For me then who am setting out toward Thee, and commencing so great a profession, of arriving at wisdom, from fear, appoint, O Lord, a law in Thy way, lest in my wandering Thy rule abandon me. “And direct me in the right path because of mine enemies.” And direct me in the right way of its straits. For it is not enough to begin, since enemies cease not until the end is attained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"
