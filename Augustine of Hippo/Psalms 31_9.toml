[[commentary]]
quote='''
“Have mercy on me, O Lord, for I am troubled” (ver. 9). But what is this unlooked-for cruelty of the persecutors, striking such dread into me? “Have mercy on me, O Lord.” For I am now no more alarmed for death, but for torments and tortures. “Mine eye hath been disordered by anger.” I had mine eye upon Thee, that Thou shouldest not abandon me: Thou art angry, and hast disordered it. “My soul, and my belly.” By the same anger my soul hath been disturbed, and my memory, whereby I retained what my God hath suffered for me, and what He hath promised me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
