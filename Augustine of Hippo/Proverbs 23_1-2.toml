[[commentary]]
quote='''
So also when He saith, "The good Shepherd giveth His life for the sheep," He is not the only one who has done such a deed; and yet if those who have done so are His members, He only Himself was the doer of it. For He was able to do so without them, but whence had they the power apart from Him, who Himself had said, "Without me ye can do nothing"? But from the same source we can show what others also have done, for the apostle John himself, who preached the very gospel you have been hearing, has said in his epistle, "Just as Christ laid down His life for us, so ought we also to lay down our lives for the brethren." "We ought," he says: He made us debtors who first set the example. To the same effect it is written in a certain place, "If thou sittest down to sup at a ruler's table, make wise observation of what is set before thee; and put to thy hand, knowing that it will be thy duty to make similar provision in turn." You know what is meant by the ruler's table: you there find the body and blood of Christ; let him who comes to such a table be ready with similar provision. And what is such similar provision? As He laid down His life for us, so ought we also, for the edification of others, and the maintenance of the faith, to lay down our lives for the brethren.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252047.html'
source_title="Tractates on John 47"

[[commentary]]
quote='''
Such also is doubtless the meaning of what we read in the Proverbs of Solomon: "If thou sittest down to supper at the table of a ruler, consider wisely what is set before thee; and so put to thy hand, knowing that thou art bound to make similar preparations." For what is the table of the ruler, but that from which we take the body and blood of Him who laid down His life for us? And what is it to sit thereat, but to approach in humility? And what is it to consider intelligently what is set before thee, but worthily to reflect on the magnitude of the favor? And what is it, so to put to thy hand, as knowing that thou art bound to make similar preparations, but as I have already said, that, as Christ laid down His life for us, so we also ought to lay down our lives for the brethren? For as the Apostle Peter also says, "Christ suffered for us, leaving us an example, that we should follow His steps." This is to make similar preparations. This it was that the blessed martyrs did in their burning love; and if we celebrate their memories in no mere empty form, and, in the banquet whereat they themselves were filled to the full, approach the table of the Lord, we must, as they did, be also ourselves making similar preparations. For on these very grounds we do not commemorate them at that table in the same way, as we do others who now rest in peace, as that we should also pray for them, but rather that they should do so for us, that we may cleave to their footsteps; because they have actually attained that fullness of love, than which, our Lord hath told us, there cannot be a greater. For such tokens of love they exhibited for their brethren, as they themselves had equally received at the table of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252084.html'
source_title="Tractates on John 84"
