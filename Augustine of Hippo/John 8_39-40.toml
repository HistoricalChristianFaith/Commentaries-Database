[[commentary]]
quote='''
(Tr. xlii. 4) And yet He says above, I know that ye are Abraham's seed. So He does not deny their origin, but condemns their deeds. Their flesh was from him; their life was not.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"They answered and said unto Him, Abraham is our father;" as if, What hast thou to say against Abraham? or, If thou canst, dare to find fault with Abraham. Not that the Lord dared not find fault with Abraham; but Abraham was not one to be found fault with by the Lord, but rather approved. But these men seemed to challenge Him to say some evil of Abraham, and so to have some occasion for doing what they purposed. "Abraham is our father."

Let us hear how the Lord answered them, praising Abraham to their condemnation. "Jesus saith unto them, If ye are Abraham's children, do the works of Abraham. But now ye seek to kill me, a man that hath told you the truth, which I have heard of God: this did not Abraham." See, he was praised, they were condemned. Abraham was no manslayer. I say not, He implies, I am Abraham's Lord; though did I say it, I would say the truth. For He said in another place, "Before Abraham was, I am" (ver. 58); and then they sought to stone Him. He said not so. But meanwhile, as you see me, as you look upon me, as alone you think of me, I am a man. Wherefore, then, wish you to kill a man who is telling you what he has heard of God, but because you are not the children of Abraham? And yet He said above, "I know that ye are Abraham's children." He does not deny their origin, but condemns their deeds. Their flesh was from him, but not their life.

But we, dearly beloved, do we come of Abraham's race, or was Abraham in any sense our father according to the flesh? The flesh of the Jews draws its origin from his flesh, not so the flesh of Christians. We have come of other nations, and yet, by imitating him, we have become the children of Abraham. Listen to the apostle: "To Abraham and to his seed were the promises made. He saith not," he adds, "And to seeds, as of many; but as of one, And to thy seed, which is Christ. And if ye be Christ's, then are ye Abraham's seed, and heirs according to the promise." We then have become Abraham's seed by the grace of God. It was not of Abraham's flesh that God made any co-heirs with him. He disinherited the former, He adopted the latter; and from that olive tree whose root is in the patriarchs, He cut off the proud natural branches, and engrafted the lowly wild olive. And so, when the Jews came to John to be baptized, he broke out upon them, and addressed them, "O generation of vipers." Very greatly indeed did they boast of the loftiness of their origin, but he called them a generation of vipers,-not even of human beings, but of vipers. He saw the form of men, but detected the poison. Yet they had come to be changed, because at all events to be baptized; and he said to them, "O generation of vipers, who hath warned you to flee from the wrath to come? Bring forth therefore fruits meet for repentance. And think not to say within yourselves, We have Abraham to our father; for God is able of these stones to raise up children unto Abraham." If ye bring not forth fruits meet for repentance, flatter not yourselves about such a lineage. God is able to condemn you, without defrauding Abraham of children. For He has a way to raise up children to Abraham. Those who imitate his faith shall be made his children. "God is able of these stones to raise up children unto Abraham." Such are we. In our parents we were stones, when we worshipped stones for our god. Of such stones God has created a family to Abraham.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252042.html'
source_title="Tractates on John 42"
