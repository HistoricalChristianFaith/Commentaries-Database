[[commentary]]
quote='''
“And He saved them from the hating ones” (ver. 10). Some translators, in order to avoid an expression unusual in Latin, have rendered the word, by a circumlocution, “And He saved them from the hand of those that hated them, and redeemed them from the hand of the enemy.” What price was given in this redemption? Is it a prophecy, since this deed was a figure of Baptism, wherein we are redeemed from the hand of the devil at a great price, which price is the Blood of Christ? whence this is more consistently figured forth, not by any sea indiscriminately, but by the Red Sea; since blood hath a red colour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
