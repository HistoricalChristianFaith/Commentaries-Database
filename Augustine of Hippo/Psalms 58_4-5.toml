[[commentary]]
quote='''
The heavens were opened, and Stephen saw the chief of martyrs; he saw Jesus standing at the Father's right hand; he saw, so that he would not keep quiet. As for his persecutors, they could not see, but they could be envious; and the reason they did not see was that they were envious. As for Stephen, he did not keep quiet about what he saw, in order to reach the one whom he saw. "Behold," he said, "I can see the heavens opened, and the Son of man standing at the right hand of majesty." Immediately they covered their ears, as against a blasphemy. You can recognize them in the psalm: "Like the deaf cobra," it says, "that blocks its ears, in order not to hear the voice of the charmer and the spell cast by the wise one." Just as snakes, you see, in order to avoid bursting out and leaving their dens when they are being charmed, are said to press one ear to the ground and block the other with their tails—and yet the charmer brings them out. So also Stephen's persecutors were still hissing in their dens, while seething in their hearts. They were not yet bursting out; they blocked their ears. Let them burst out now, let them show what they really are; let them rush for the stones. They rushed, they stoned him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520316.html'
source_title="SERMON 316:2"

[[commentary]]
quote='''
“Indignation to them after the similitude of a serpent” (ver. 4). A great thing ye are to hear. “Indignation to them after the similitude of a serpent.” As if we had said, What is that which thou hast said? there followeth, “As if of a deaf asp.” Whence deaf? “And closing its ears.” Therefore deaf, because it closeth its ears. “And closing its ears.” “Which will not hearken to the voice of men charming, and of the medicine medicated by the wise man” (ver. 5). As we have heard, because even men speak who have learned it with such research as they were able, but nevertheless it is a thing which the Spirit of God knoweth much better than any men. For it is not to no purpose that of this he hath spoken, but because it may chance that true is even that which we have heard of the asp. When the asp beginneth to be affected by the Marsian charmer, who calleth it forth with certain peculiar incantations, hear what it doeth.…Give heed what is spoken to thee for a simile’s sake, what is noted thee for avoidance. So therefore here also there hath been given a certain simile derived from the Marsian, who maketh incantation to bring forth the asp from the dark cavern; surely into light he would bring it: but it loving its darkness, wherein coiled up it hideth itself, when it will not choose to come forth, nevertheless refusing to hear those words whereby it feeleth itself to be constrained, is said to press one ear against the ground, and with its tail to stop up the other, and therefore as much as possible escaping those words, it cometh not forth to the charmer. To this as being like, the Spirit of God hath spoken of certain persons hearing not the Word of God, and not only not doing, but altogether, that they may not do it, refusing to hear.

This thing hath been done even in the first times of the faith. Stephen the Martyr was preaching the Truth, and to minds as though dark, in order to bring them forth into light, was making incantation: when he came to make mention of Christ, whom they would not hear at all, of them the Scripture saith what? of them relateth what? “They shut,” he saith, “their ears.” But what they did afterwards, the narrative of the passion of Stephen doth publish. They were not deaf, but they made themselves deaf.…For this thing they did at the point where Christ was named. The indignation of these men was as the indignation of a serpent. Why your ears do ye shut? Wait, hear, and if ye shall be able, rage. Because they chose not to do aught but rage, they would not hear. But if they had heard, perchance they would have ceased to rage. The indignation of them was as the indignation of a serpent.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"

[[commentary]]
quote='''
How should we will that to us He come? By living well, by doing well. Let not things past please us; things present not hold us; let us not “close the ear” as it were with tail, let us not press down the ear on the ground; lest by things past we be kept back from hearing, lest by things present we be entangled and prevented from meditating on things future; let us reach forth unto those things which are before, let us forget things past. And that for which now we toil, for which now we groan, for which now we sigh, of which now we speak, which in part, however small soever, we perceive, and to receive are not able, we shall receive, we shall thoroughly enjoy in the resurrection of the just. Our youth shall be renewed as an eagle’s, if only our old man we break against the Rock of Christ. Whether those things be true, brethren, which are said of the serpent, or those which are said of the eagle, or whether it be rather a tale of men than truth, truth is nevertheless in the Scriptures, and not without reason the Scriptures have spoken of this: let us do whatever it signifieth, and not toil to discover how far that is true. Be thou such an one, as that thy youth may be able to be renewed as an eagle’s. And know thou that it cannot be renewed, except thine old man on the Rock shall have been broken off: that is, except by the aid of the Rock, except by the aid of Christ, thou wilt not be able to be renewed. Do not thou because of the pleasantness of the past life be deaf to the word of God: do not by things present be so held and entangled, as to say, I have no leisure to read, I have no leisure to hear. This is to press down the ear upon the ground. Do thou therefore not be such an one: but be such an one as on the other side thou findest, that is, so that thou forget things past, unto things before reach thyself out, in order that thine old man on the Rock thou mayest break off.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252067.html'
source_title="Exposition on Psalm 67"
