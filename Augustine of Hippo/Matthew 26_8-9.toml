[[commentary]]
quote='''
(de Cons. Ev. ii. 79.) We may however understand that the other disciples thought or said the same, or that they assented to what Judas said, and thus Matthew and Mark have described their common consent. But Judas said it because he was a thief, the others out of their care for the poor; and John desired to mention it only in the case of him whose thievish propensity he thought ought to be recorded.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The other matters belonging to this incident do not seem to me to raise any question really involving a difficulty. There is the circumstance that the other evangelists mention how the disciples murmured about the [wasteful] outpouring of the precious ointment, whereas John states that Judas was the person who thus expressed himself, and tells us, in explanation of the fact, that "he was a thief." But I think it is evident that this same Judas was the person referred to under the [general] name of the disciples, the plural number being used here instead of the singular, in accordance with that mode of speech of which we have already introduced an explanation in the case of Philip and the miracle of the five loaves. It may also be understood in this way, that the other disciples either felt as Judas felt, or spoke as he did, or were brought over to that view of the matter by what Judas said, and that Matthew and Mark consequently have expressed in word what was really the mind of the whole company; but that Judas spoke as he did just because he was a thief, whereas what prompted the rest was their care for the poor; and further, that John has chosen to record the utterance of such sentiments only in the instance of that one [among the disciples] whose habit of acting the thief he believed it right to bring out in connection with this occasion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 79"
