[[commentary]]
quote='''
Hearken to the hirelings as pointed out by the Lord Himself: "The scribes," He saith, "and the Pharisees sit in Moses' seat: do what they say; but do not what they do." What else said He but, Listen to the Shepherd's voice speaking through the hirelings? For sitting in Moses' seat, they teach the law of God; therefore God teacheth by them. But if they wish to teach their own things, hear them not, do them not. For certainly such seek their own, not the things which are Jesus Christ's; but no hireling has dared to say to Christ's people, Seek your own, not the things which are Jesus Christ's. For his own evil conduct he does not preach from the seat of Christ: he does injury by the evil that he does, not by the good that he says. Pluck the grapes, beware of the thorn. It is well I see that you have understood; but for the sake of those that are slower, I shall repeat these words with greater plainness. How said I, Pluck the bunch of grapes, beware of the thorn; when the Lord saith, "Do men gather grapes of thorns, or figs of thistles"? That is quite true: and yet what I said is also true, Pluck the bunch of grapes, beware of the thorn. For sometimes the grape-cluster, springing from the root of the vine, finds its support in a common hedge; its branch, grows, becomes embedded among thorns, and the thorn bears other fruit than its own. For the thorn has not been produced from the vine, but has become the resting-place of its runner. Make thine inquiries only at the roots. Seek for the thorn-root, thou wilt find it apart from the vine: seek the origin of the grape, and from the root of the vine it will be found to have sprung. And so, Moses' seat was the vine; the morals of the Pharisees were the thorns. Sound doctrine cometh through the wicked, as the vine-branch in a hedge, a bunch of grapes among thorns. Gather carefully, so as in seeking the fruit not to tear thine hand; and while thou art to hear one speaking what is good, imitate him not when doing what is evil. "What they tell you, do,"-gather the grapes; "but what they do, do not,"-beware of the thorns. Even through hirelings listen to the voice of the Shepherd, but be not hirelings yourselves, seeing ye are members of the Shepherd.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252046.html'
source_title="Tractates on John 46"
