[[commentary]]
quote='''
What follows of the Gospel and was read to-day, we must next in order look at, and speak from it as the Lord may grant us. Yesterday it was read thus far, that although they had not seen the Lord Jesus in the temple on the feast-day, yet they were speaking about Him: "And some said, He is a good man: but others said, Nay; but he seduceth the people." For this was said for the comfort of those who, afterwards preaching God's word, were to be seducers, and yet true men. For if to seduce is to deceive, neither was Christ a seducer, nor His apostles, nor ought any Christian to be such; but if to seduce (to lead aside) is by persuading to lead one from something to something else, we ought to inquire into the whence and the whither: if from evil to good, the seducer is a good man; if from good to evil, the seducer is a bad man. In that sense, then, in which men are seduced from evil to good, would that all of us both were called, and actually were seducers!

Then afterwards the Lord went up to the feast, "about the middle of the feast, and taught." "And the Jews marvelled, saying, How knoweth this man letters, having never learned?" He who was in secret taught, He was speaking openly and was not restrained. For that hiding of Himself was for the sake of example; this showing Himself openly was an intimation of His power. But as He taught, "the Jews marvelled;" all indeed, so far as I think, marvelled, but all were not converted. And why this wondering? Because all knew where He was born, where He had been brought up; they had never seen Him learning letters, but they heard Him disputing about the law, bringing forward testimonies of the law, which none could bring forward unless he had read, and none could read unless he had learned letters: and therefore they marvelled. But their marvelling was made an occasion to the Master of insinuating the truth more deeply into their minds. By reason, indeed of their wondering and words, the Lord said something profound, and worthy of being more diligently looked into and discussed. On account of which I would urge you, my beloved, to earnestness, not only in hearing for yourselves, but also in praying for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252029.html'
source_title="Tractates on John 29"
