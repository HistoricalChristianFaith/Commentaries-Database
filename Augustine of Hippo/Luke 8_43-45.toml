[[commentary]]
quote='''
For of that Church of the Gentiles which was to come, the woman that had the issue of blood was a type: she touched and was not seen; she was not known and yet was healed. It was in reality a figure what the Lord asked: "Who touched me?" As if not knowing, He healed her as unknown: so has He done also to the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252031.html'
source_title="Tractates on John 31"
