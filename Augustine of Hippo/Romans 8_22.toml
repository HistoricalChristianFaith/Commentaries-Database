[[commentary]]
quote='''
Every creature is represented in man, not because all the angels … are in him, nor the heaven, earth, sea and all that is in them, but because the human creature is partly spirit, partly soul and partly body.
'''
source_url=''
source_title="QUESTIONS 67.5"

[[commentary]]
quote='''
And to this he refers what follows: For we know that the creature groans together and is in pain until now. For there were still those going to believe, who even in spirit lay subject to laborious errors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
