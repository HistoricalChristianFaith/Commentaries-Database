[[commentary]]
quote='''
“Unto the right-hearted there ariseth up light in the darkness” (ver. 4). Justly do the godly direct their heart unto their God, justly do they walk with their God, preferring His will to themselves; and having no proud presumption in their own. For they remember that they were some time in darkness, but are now light in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520112.html'
source_title="Exposition on Psalm 112"
