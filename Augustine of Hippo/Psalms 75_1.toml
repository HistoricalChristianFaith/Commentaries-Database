[[commentary]]
quote='''
Behold, we have sung: "We will confess to you, God, we will confess and call upon your name." To confess to God, what is it but to humble oneself to God, not to arrogate any merit to oneself? For by his grace we have been saved, as the Apostle says, not by works, lest anyone should boast; for by his grace we have been saved. There did not precede any good life which he from above would love and cherish and say: "Let us help, let us come to the aid of these people, because they live well." Our life was displeasing to him, everything we were doing in us was displeasing to him, but what he made in us was not displeasing to him. Therefore, what we did he will condemn, what he himself made will save. He will condemn the evil deeds of men, and he will save the men themselves. For men did not make themselves, but they did evil deeds. What in them God made, because God made man in his image and likeness, is good. But what man turned away from the creator and maker through free will and turned towards wickedness and did evil, this God condemns, so that he may free the man, that is, God condemns what man did, and God frees what he himself made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252023A.html'
source_title="Sermon 23A.1"


[[commentary]]
quote='''
Therefore, He gave us humility as our way. If we hold onto it, we will confess to the Lord, and not without reason will we sing: We will confess to you, God, we will confess and invoke your name. For you shamelessly invoke His name to whom you do not confess. First confess, so that you prepare a dwelling for Him whom you invoke. For your heart is full of wickedness. But confession pours out the filth that you harbor within, and cleanses the house to which He whom you invoke may come. For whoever invokes before confessing, seeks to dishonor Him whom he invokes. For if you would not dare invite any saint into your house before you have first cleaned your house so that his eyes do not suffer injury, do you dare to invoke God's name into your heart full of wickedness, unless you first pour out your inner iniquity through confession? Therefore confession, my Brothers, humbles us, justifies the humbled, and exalts the justified. For if we are proud, God resists us; if we are humble, God exalts us; since He resists the proud, but gives grace to the humble, and: He who exalts himself will be humbled, and he who humbles himself will be exalted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252023A.html'
source_title="Sermon 23A.4"

[[commentary]]
quote='''
…The Title of this Psalm thus speaketh: “At the end, corrupt not.” What is, “corrupt not?” That which Thou hast promised, perform. But when? “At the end.” To this then let the mind’s eye be directed, “unto the end.” Let all the things which have occurred in the way be passed over, in order that we may attain to the end. Let proud men exult because of present felicity, let them swell with honours, glitter in gold, overflow with domestics, be encircled with the services of clients: these things pass away, they pass away like a shadow. When that end shall have come, when all who now hope in the Lord are to rejoice, then to them shall come sorrow without end. When the meek shall have received that which the proud deride, then the vapouring of the proud shall be turned into mourning. Then shall there be that voice which we know in the Book of Wisdom: for they shall say at that time when they see the glory of the Saints, who, when they were in humiliation, endured them; who, when they were exalted, consented not—at that time then they shall say, “These are they whom sometime we have had in derision.” Where they also say, “What hath pride profited us, and the boasting of riches hath bestowed upon us what?” All things have passed away like a shadow. Because on things corruptible they relied, their hope shall be corrupted: but our own hope at that time shall be substance. For in order that the promise of God may remain whole and sure and certain towards us, we have said out of a heart of faith, “at the end corrupt not.” Fear not, therefore, lest any mighty man should corrupt the promises of God. He doth not corrupt, because He is truthful; He hath no one more mighty by whom His promise may be corrupted: let us be then sure concerning the promises of God; and let us sing now from the place where the Psalm beginneth.

“We will confess to Thee, O Lord, we will confess to Thee, and will invoke Thy name” (ver. 1). Do not invoke, before thou confess: confess, and invoke. For Him whom thou art invoking, unto thyself thou callest. For what is it to invoke, but unto thyself to call? If He is invoked by thee, that is, if He is called to thee, unto whom doth He draw near? To a proud man He draweth not near. High indeed He is, one lifted up attaineth not unto Him. In order that we may reach all exalted objects, we raise ourselves, and if we are not able to reach them, we look for some appliances or ladders, in order that being exalted we may reach exalted objects: contrariwise God is both high, and by the lowly He is reached. It is written, “Nigh is the Lord to them that have bruised the heart.” The bruising of the heart is Godliness, humility. He that bruiseth himself is angry with himself. Let him make himself angry in order that he may make Him merciful; let him make himself judge, in order that he may make Him Advocate. Therefore God doth come when invoked. Unto whom doth He come? To the proud man He cometh not.…Take heed therefore what ye do: for if He knoweth, He is not unobservant. It is better therefore that He be unobservant than known. For what is that same being unobservant, but not knowing? What is, not to know? Not to animadvert. For even as the act of one avenging animadversion is wont to be spoken of. Here one praying that He be unobservant: “Turn away Thy face from my sins.” What then wilt thou do if He shall have turned away His face from thee? A grievous thing it is, and to be feared, lest He forsake thee. Again, if He turn not away His face, He animadverteth. God knoweth this thing, God can do this thing, namely, both turn away face from one sinning, and not turn away from one confessing.…Confess therefore and invoke. For by confessing thou purgest the Temple, into which He may come, when invoked. Confess and invoke. May He turn away face from thy sins, not turn away from thee: turn away face from that which thou hast wrought, not turn away from that which He hath Himself wrought. For thee, as man, He hath Himself wrought, thy sins thou hast thyself wrought.…

But that there is a strengthening of the sense in repetition, by many passages of the Scriptures we are taught. Thence is that which the Lord saith, “Verily, Verily.” Thence in certain Psalms is, “So be it, So be it.” To signify the thing, one “So be it” would have been sufficient: to signify confirmation, there hath been added another “So be it.”…Countless passages of such sort there are throughout all the Scriptures. With these it is sufficient that we have commended to your notice a way of speaking which ye may observe in all like cases: now to the substance attend: “We will confess to Thee,” he saith, “and we will invoke.” I have said why before invocation confession doth precede: because whom thou dost invoke, him thou dost invite. But he willeth not to come when invoked, if thou shalt have been lifted up: lifted up if thou shalt have been, thou wilt not be able to confess. And thou deniest not any things to God that He knoweth not. Therefore thy confession doth not teach Him, but it purgeth thee.

…Hear ye now the words of Christ. For these seemed not as it were to be His words, “We will confess to Thee, O God, we will confess to Thee, and will invoke Thy name.” Now beginneth the discourse in the person of the Head. But whether Head speaketh or whether members speak, Christ speaketh: He speaketh in the person of the Head, He speaketh in the person of the Body. But what hath been said? There shall be two in one flesh. “This is a great Sacrament:” “I,” he saith, “speak in Christ and in the Church.” And He Himself in the Gospel, “Therefore no longer two, but one flesh.” For in order that ye may know these in a manner to be two persons, and again one by the bond of marriage, as one He speaketh in Isaiah, and saith, “As upon a Bridegroom he hath bound upon me a mitre, and as a Bride he hath clothed me with an ornament.” A Bridegroom He hath called Himself in the Head, a Bride in the Body. He is speaking therefore as One, let us hear Him, and in Him let us also speak. Let us be the members of Him, in order that this voice may possibly be ours also. “I will tell forth,” he saith, “all Thy marvellous things.” Christ is preaching Himself, He is preaching Himself even in His members now existing, in order that He may guide unto Him others, and they may draw near that were not, and may be united with those members of Him, through which members of Him the Gospel hath been preached; and there may be made one Body under one Head, in one Spirit, in one Life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252075.html'
source_title="Exposition on Psalm 75"
