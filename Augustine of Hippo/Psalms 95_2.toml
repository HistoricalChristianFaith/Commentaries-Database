[[commentary]]
quote='''
“Let us prevent His face by confession” (ver. 2). Confession hath a double meaning in Scripture. There is a confession of him who praiseth, there is that of him who groaneth. The confession of praise pertaineth to the honour of Him who is praised: the confession of groaning to the repentance of him who confesseth. For men confess when they praise God: they confess when they accuse themselves; and the tongue hath no more worthy use. Truly, I believe these to be the very vows, of which he speaketh in another Psalm: “I will pay Thee my vows, which I distinguished with my lips.” Nothing is more elevated than that distinguishing, nothing is so necessary both to understand and to do. How then dost thou distinguish the vows which thou payest unto God? By praising Him, by accusing thyself; because it is His mercy, to forgive us our sins. For if He chose to deal with us after our deserts, He would find cause only to condemn. “O come,” he said therefore, that we may at last go back from our sins, and that He may not cast up with us our accounts for the past; but that as it were a new account may be commenced, all the bonds of our debts having been burnt.…The more therefore thou despairedst of thyself on account of thy iniquities, do thou confess thy sins; for so much greater is the praise of Him who forgiveth, as is the fulness of the penitent’s confession more abundant. Let us not therefore imagine that we have receded from the song of praise, in understanding here that confession by which we acknowledge our transgressions: this is even a part of the song of praise; for when we confess our sins, we praise the glory of God.

“And make a joyful noise unto Him with Psalms.” We have already said what it is “to make a joyful noise:” the word is repeated, that it may be confirmed by the act: the very repetition is an exhortation. For we have not forgotten, so as to wish to be again admonished what was said above, that we should make a joyful noise: but usually in passages of strong feeling a well-known word is repeated, not to make it more familiar, but that the very repetition may strengthen the impression made: for it is repeated that we may understand the feeling of the speaker.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252095.html'
source_title="Exposition on Psalm 95"
