[[commentary]]
quote='''
“And speed on, and proceed prosperously, and reign” (ver. 4). Do we not see it so? Is it not already come to pass? He has “sped on; has proceeded prosperously, and He reigns;” all nations are subdued unto Him. What a thing was it to see that “in the Spirit,” of which same thing it is now in our power to experience in the reality! At the time when these words were said, Christ did not yet “reign” thus; had not yet sped on, nor “proceeded prosperously.” They were then being preached, they have now been fulfilled: in many things we have God’s promise fulfilled already; in some few we have to claim its fulfilment yet.

“Because of truth, meekness, and righteousness.” Truth was restored unto us, when “the Truth sprung out of the earth: and Righteousness looked out from heaven.” Christ was presented to the expectation of mankind, that in Abraham’s Seed “all nations should be blessed.” The Gospel has been preached. It is “the Truth.” What is meant by “meekness”? The Martyrs have suffered; and the kingdom of God has made much progress from thence, and advanced throughout all nations; because the Martyrs suffered, and neither “fell away,” nor yet offered resistance; confessing everything, concealing nothing; prepared for everything, shrinking from nothing. Marvellous “meekness”! This did the body of Christ, by its Head it learned. He was first “led as a sheep to the slaughter, and as a lamb before his shearer is dumb, even so opened not His mouth;” meek to that degree, that while hanging on the Cross, He said, “Father, forgive them, for they know not what they do.” Why because of “righteousness”? He will come also to judge, and to “render to every man according to his works.” He spake “the truth;” He patiently endured unrighteousness: He is to bring “righteousness” hereafter.

“And Thy right hand shall lead Thee on marvellously.” We shall be guided on by His right hand: He by His own. For He is God, we mortal men. He was led on by His own right hand; i.e. by His own power. For the power which the Father hath, He hath also; the Father’s immortality He hath also; He hath the Father’s Divinity, the Father’s Eternity, the Father’s Power. Marvellously will His right hand lead Him on, performing the works of God; undergoing human sufferings, overthrowing the evil wills of men by His own goodness. Even now, He is being led on even to places where as yet He is not; and it is His own right hand that is leading Him on. For that is leading Him thither which He has Himself bestowed upon His Saints. “Thy right hand shall lead Thee on marvellously.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"
