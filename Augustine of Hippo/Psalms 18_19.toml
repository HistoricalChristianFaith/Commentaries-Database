[[commentary]]
quote='''
“And hath brought Me forth into a broad place” (ver. 19). And since I was enduring the straits of the flesh, He brought Me forth into the spiritual breadth of faith. “He hath delivered Me, because He desired Me.” Before that I desired Him, He delivered Me from My most powerful enemies (who were envious of Me when I once desired Him), and from them that hated Me, because I do desire Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
