[[commentary]]
quote='''
There is here another sense not to be neglected, perhaps even to be preferred. “Lord” Christ, “Thou shalt repay for me.” For I, if I repay, have seized; Thou hast paid what Thou hast not seized. Lord, Thou shalt “repay for me.” Behold Him repaying for us. They came to Him, who exacted tribute: they used to demand as tribute a didrachma, that is, two drachmas for one man; they came to the Lord to pay tribute; or rather, not to Him, but to His disciples, and they said to them, “Doth not your Master pay tribute?” They came and told Him. He saith unto Peter, “lest we should offend them, go thou to the sea, and cast an hook, and take up the fish that first cometh up: and when thou hast opened his mouth, thou shalt find a stater: that take, and give for Me and thee.” The first that riseth from the sea, is the First-begotten from the dead. In His mouth we find two didrachmas, that is, four drachmas: in His mouth we find the four Gospels. By those four drachmas we are free from the claims of this world, by the four Evangelists we remain no longer debtors; for there the debt of all our sins is paid. He then hath repaid for us, thanks to His mercy. He owed nothing: He repaid not for Himself: He repaid for us.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520138.html'
source_title="Exposition on Psalm 138"
