[[commentary]]
quote='''
(xxv. 12) To eat then that meat which endureth unto everlasting life, is to believe on Him. Why dost thou make ready thy tooth and thy belly? Only believe, and thou hast eaten already. As He called on them to believe, they still asked for miracles whereby to believe; They said therefore unto Him, What sign shewest Thou then, that we may see and believe Thee? What dost Thou work?

(Tr. xxv. s. 12) Or thus; Our Lord sets Himself above Moses, who did not dare to say that He gave the meat which perisheth not. The multitude therefore remembering what Moses had done, and wishing for some greater miracle, say, as it were, Thou promisest the meat which perisheth not, and doest not works equal to those Moses did. He gave us not barley loaves, but manna from heaven.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And because He invited them to faith, they, on the other hand, were still asking for signs by which they might believe. See if the Jews do not ask for signs. "They said therefore unto Him, What sign doest thou, that we may see and believe thee? what dost thou work?" Was it a trifle that they were fed with five loaves? They knew this indeed, but they preferred manna from heaven to this food. But the Lord Jesus declared Himself to be such an one, that He was superior to Moses. For Moses dared not say of Himself that He gave, "not the meat which perisheth, but that which endureth to eternal life." Jesus promised something greater than Moses gave. By Moses indeed was promised a kingdom, and a land flowing with milk and honey, temporal peace, abundance of children, health of body, and all other things, temporal goods indeed, yet in figure spiritual; because in the Old Testament they were promised to the old man. They considered therefore the things promised by Moses, and they considered the things promised by Christ. The former promised a full belly on the earth, but of the meat which perisheth; the latter promised, "not the meat which perisheth, but that which endureth unto eternal life." They gave attention to Him that promised the more, but just as if they did not yet see Him do greater things. They considered therefore what sort of works Moses had done, and they wished yet some greater works to be done by Him who promised them such great things. What, say they, doest thou, that we may believe thee? And that thou mayest know that they compared those former miracles with this and so judged these miracles which Jesus did as being less; "Our fathers," say they, "did eat manna in the wilderness." But what is manna? Perhaps ye despise it. "As it is written, He gave them manna to eat." By Moses our fathers received bread from heaven, and Moses did not say to them, "Labor for the meat which perisheth not." Thou promisest "meat which perisheth not, but which endureth to eternal life;" and yet thou workest not such works as Moses did. He gave, not barley loaves, but manna from heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252025.html'
source_title="Tractates on John 25"
