[[commentary]]
quote='''
“Lest at any time mine enemy say, I have prevailed against him” (ver. 4). The devil’s mockery is to be feared. “They that trouble me will exult, if I be moved;” the devil and his angels; who exulted not over that righteous man, Job, when they troubled him; because he was not moved, that is, did not draw back from the stedfastness of his faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252013.html'
source_title="Exposition on Psalm 13"
