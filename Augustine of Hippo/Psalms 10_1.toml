[[commentary]]
quote='''
“Why, O Lord,” saith he, “hast Thou withdrawn afar off?” (ver. 1). Then he who thus inquired, as if all on a sudden he understood, or as if he asked, though he knew, that he might teach, adds, “Thou despisest in due seasons, in tribulations:” that is, Thou despisest seasonably, and causest tribulations to inflame men’s minds with longing for Thy coming. For that fountain of life is sweeter to them that have much thirst.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252010.html'
source_title="Exposition on Psalm 10"
