[[commentary]]
quote='''
Bow, arms, shield, fire. The bow is plots; arms, public warfare; shields, vain presuming of self-protection: the fire wherewith they are burned, is that whereof the Lord said, “I am come to send fire on the earth;” of which fire saith the Psalm, “There is nothing hid from the heat thereof.” This fire burning, no arms of ungodliness shall remain in us, needs must all be broken, dashed in pieces, burned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"


[[commentary]]
quote='''
When therefore would Christ have changed us, unless He had done that which He spake of, “Fire I have come to send into the world”? If therefore Christ came to send into the world fire, to wit to its health and profit, we must inquire not how He is to send the world into fire, but how into the world fire. Inasmuch as therefore He came to send fire into the world, let us inquire what is Mesopotamia which was burned up, what is Syria Sobal? The interpretations therefore of the names let us examine according to the Hebrew language, wherein first this Scripture was written. Mesopotamia they say is interpreted, “exalted calling.” Now the whole world by calling hath been exalted, Syria is interpreted “lofty.” But she which was lofty, burned up hath been and humbled. Sobal is interpreted “empty antiquity.” Thanks to Christ that hath burned her. Whenever old bushes are burned up, green places succeed; and more speedily and more plentifully, and more fully green, fresh ones spring out, when fire hath gone before them to the burning up of the old. Let not therefore the fire of Christ be feared, hay it consumeth. “For all flesh is hay, and all the glory of man as flower of hay.” He burneth up therefore those things with that fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252060.html'
source_title="Exposition on Psalm 60"


[[commentary]]
quote='''
For love doth inflame, fear doth humble: therefore, sins of evil love, with fire were lighted: sins of evil fear were dug up. On the one hand, evil fear doth humble, and good love doth light; but in different ways respectively. For even the husbandman interceding for the tree, that it should not be cut down, saith, “I will dig about it, and will apply a basket of dung.” The dug trench doth signify the godly humility of one fearing, and the basket of dung the profitable squalid state of one repenting. But concerning the fire of good love the Lord saith, “Fire I have come to send into the world.” With which fire may the fervent in spirit burn, and they too that are inflamed with the love of God and their neighbour. And thus, as all good works are wrought by good fear and good love, so by evil fear and evil love all sins are committed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"

[[commentary]]
quote='''
The Lord Himself saith: “I am come to send fire on the earth:” “fire” in the same way as a “sword;” as in another passage He saith, that He was not come to send peace, but a sword, upon earth. The sword to divide, the fire to burn: but each salutary: for the sword of His own word hath in salutary wise separated us from evil habits. For He brought a sword, and separated every believer either from his father who believed not in Christ, or from his mother in like manner unbelieving: or at least, if we were born of Christian parents, from his ancestors. For no man among us had not either a grandsire, or great grandsire, or some ancestry among the heathen, and in that unbelief which is accursed before God. We are separated from that which we were before; but the sword which separateth, but slayeth not, hath cut between us. In the same way the fire also: “I am come to send fire upon the earth.” Believers in Him were set on fire, they received the flame of love: and for this reason when the Holy Spirit itself had been sent to the Apostles, It thus appeared: “cloven tongues, like as of fire.” Burning with this fire they set out on their march through the world, to burn and set on fire His enemies on every side. What enemies of His? They who forsaking the God who made them, adored the idols they had made.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
