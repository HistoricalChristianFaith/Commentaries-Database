
[[commentary]]
quote='''
“The poor shall eat, and be filled” (ver. 26). The humble and the despisers of the world shall eat, and imitate Me. For so they will neither desire this world’s abundance, nor fear its want. “And they shall praise the Lord, who seek Him.” For the praise of the Lord is the pouring out of that fulness. “Their hearts shall live for ever and ever.” For that food is the food of the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"


[[commentary]]
quote='''
“The rich and poor together.” Again, the same words are repeated. The expression “rich” refers to the “earthborn;” but the word “poor” to the “sons of men.” By the “rich” understand the proud, by the “poor” the humble.…He saith in another Psalm, “The poor shall eat and be satisfied.” How hath he commended the poor? “The poor shall eat and be satisfied.” What eat they? That Food which the faithful know. How shall they be satisfied? By imitating the Passion of their Lord, and not without cause receiving their recompense. “The poor shall eat and be satisfied, and they shall praise the Lord who seek Him.” What of the rich? Even they eat. But how eat they? “All the rich upon the earth have eaten and worshipped.” He said not, “Have eaten and are satisfied;” but, “have eaten and worshipped.” They worship God indeed, but they will not display brotherly humaneness. These eat and worship; those eat and are filled: yet both eat. Of the eater what he eateth is required: let him not be forbidden by the distributor to eat, but let him be admonished to fear him who doth require his account.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"

[[commentary]]
quote='''
Also, “I will satisfy her poor with bread;” what meaneth this, brethren? Let us be poor, and we shall then be satisfied. Many who trust in the world, and are proud, are Christians; they worship Christ, but are not satisfied; for they have been satisfied, and abound in their pride. Of such it is said, “Our soul is filled with the scornful reproof of the wealthy, and with the despitefulness of the proud:” these have abundance, and therefore eat, but are not satisfied. And what is said of them in the Psalm? “All such as be fat upon the earth have eaten and worshipped.” They worship Christ, they venerate Christ, they pray unto Christ; but they are not satisfied with His wisdom and righteousness. Wherefore? Because they are not poor. For the poor, that is the humble in heart, the more they hunger, the more they eat; and the more empty they are of the world, the more hungry they are. He who is full refuseth whatsoever thou wilt give him, because he is full. Give me one who hungereth; give me one of whom it is said, “Blessed are they that hunger and thirst after righteousness, for they shall be filled:” and these will be the poor of whom he hath just said, “And will satisfy her poor with bread.” For in the very Psalm where it is said, “All such as be fat upon the earth have eaten and worshipped;” this is said of the poor also, and exactly in the same manner as in this Psalm, “The poor shall eat, and be satisfied: they that seek after the Lord shall praise Him.” Where it is said, “All such as be fat upon earth have eaten and worshipped:” it is said, “the poor shall eat, and be satisfied.” Why, when the rich are said to have worshipped, are they not said to be satisfied; yet when the poor are mentioned, they are said to be satisfied? And whence are they satisfied? What is the nature, brethren, of this satisfying? God Himself is their bread. The bread came down upon the earth, that He might become milk unto us; and said to His own, “I am the Living Bread which came down from heaven.” Hence these words in the Psalm, “The poor shall eat, and be satisfied.” From what source shall they be satisfied? Hear what followeth: “And they that seek after the Lord shall praise Him.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520132.html'
source_title="Exposition on Psalm 132"
