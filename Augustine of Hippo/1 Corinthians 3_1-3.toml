[[commentary]]
quote='''
This son of man, that is, the new man, the repentance of the old man begets with pain and tears. He, though new, is nevertheless called yet carnal, whilst he is fed with milk; “I would not speak unto you as unto spiritual, but as unto carnal,” says the Apostle. And to show that they were already regenerate, he says, “As unto babes in Christ, I have given you milk to drink, not meat.” And when he relapses, as often happens, to the old life, he hears in reproof that he is a man; “Are ye not men,” he says, “and walk as men?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25208.html'
source_title="Exposition on Psalm 8"

[[commentary]]
quote='''
The voice of the pipe of horn, what is it? The horn riseth above the flesh: in rising above the flesh it needs must be solid so as to last, and able to speak. And whence this? Because it hath surpassed the flesh. He who wisheth to be a horn trumpet, let him overcome the flesh. What meaneth this, let him overcome the flesh? Let him surpass the desires, let him conquer the lusts of the flesh. Hear the horn trumpets.…What meaneth this, “Set your affection on things above”? It meaneth, Rise above the flesh, think not of carnal things. They were not yet horn trumpets, to whom he now spoke thus: “I could not speak unto you, brethren, as unto spiritual, but as unto carnal, even as unto babes in Christ. I have fed you with milk, and not with meat; for hitherto ye were not able to bear it: neither yet now are ye able. For ye are yet carnal.” They were not therefore horn trumpets, because they had not risen above the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252098.html'
source_title="Exposition on Psalm 98"
