[[commentary]]
quote='''
How, then, did Christ say, "All things that I have heard from the Father I have made known to you," except in this way, that what he was certainly going to accomplish through the Holy Spirit, he spoke to us as if he had already accomplished it? Therefore, whenever we hear that one who believes in Christ will not be judged, we are to understand that he will not be condemned. The word judged is used in place of "condemned," as where the apostle says, "Let not him who does not eat condemn him who eats," that is, let him not think evil of him. And the Lord says, "Do not judge that you may not be judged." He does not take from us the power to judge, since the prophet also declares, "If you truly love justice, judge right things, O sons of men." And the Lord says, "Judge not according to personal considerations, but render a just judgment." But, in that passage where he forbids judging, he admonishes us not to condemn a person whose purpose is hidden from us, or when we do not know how a person will turn out later on. Accordingly, when he said, "He shall not come to judgment," he meant that he will not come to damnation. And in saying "but he who does not believe is already judged," he meant that such a person stands already condemned in the foreknowledge of God, who knows what is in store for nonbelievers.
'''
source_url=''
source_title="CHRISTIAN COMBAT 27:29"

[[commentary]]
quote='''
The words which we have sung must be rather hearkened to by us, than proclaimed. For to all men as it were in an assemblage of mankind, the Truth crieth, “If truly indeed justice ye speak, judge right things, ye sons of men” (ver. 1). For to what unjust man is it not an easy thing to speak justice? or what man if questioned about justice, when he hath not a cause, would not easily answer what is just? Inasmuch as the hand of our Maker in our very hearts hath written this truth, “That which to thyself thou wouldest not have done, do not thou to another.” Of this truth, even before that the Law was given, no one was suffered to be ignorant, in order that there might be some rule whereby might be judged even those to whom Law had not been given. But lest men should complain that something had been wanting for them, there hath been written also in tables that which in their hearts they read not. For it was not that they had it not written, but read it they would not. There hath been set before their eyes that which in their conscience to see they would be compelled; and as if from without the voice of God were brought to them, to his own inward parts hath man been thus driven, the Scripture saying, “For in the thoughts of the ungodly man there will be questioning.” Where questioning is, there is law. But because men, desiring those things which are without, even from themselves have become exiles, there hath been given also a written law: not because in hearts it had not been written, but because thou wast a deserter from thy heart, thou art seized by Him that is everywhere, and to thyself within art called back. Therefore the written law, what crieth it, to those that have deserted the law written in their hearts? “Return ye transgressors to the heart.” For who hath taught thee, that thou wouldest have no other man draw near thy wife? Who hath taught thee, that thou wouldest not have a theft committed upon thee? Who hath taught thee, that thou wouldest not suffer wrong, and whatever other thing either universally or particularly might be spoken of? For many things there are, of which severally if questioned men with loud voice would answer, that they would not suffer. Come, if thou art not willing to suffer these things, art thou by any means the only man? dost thou not live in the fellowship of mankind? He that together with thee hath been made, is thy fellow; and all men have been made after the image of God, unless with earthly covetings they efface that which He hath formed. That which therefore to thyself thou wilt not have to be done, do not thou to another. For thou judgest that there is evil in that, which to suffer thou art not willing: and this thing thou art constrained to know by an inward law; that in thy very heart is written. Thou wast doing somewhat, and there was a cry raised in thy hands: how art thou constrained to return to thy heart when this thing thou sufferest in the hands of others? Is theft a good thing? No! I ask, is adultery a good thing? All cry, No! Is man-slaying a good thing? All cry, that they abhor it. Is coveting the property of a neighbour a good thing? No! is the voice of all men. Or if yet thou confessest not, there draweth near one that coveteth thy property: be pleased to answer what thou wilt have. All men therefore, when of these things questioned, cry that these things are not good. Again, of doing kindnesses, not only of not hurting, but also of conferring and distributing, any hungry soul is questioned thus: “thou sufferest hunger, another man hath bread, and there is abundance with him beyond sufficiency, he knoweth thee to want, he giveth not: it displeaseth thee when hungering, let it displease thee when full also, when of another’s hungering thou shalt have known. A stranger wanting shelter cometh into thy country, he is not taken in: he then crieth that inhuman is that city, at once among barbarians he might have found a home. He feeleth the injustice because he suffereth; thou perchance feelest not, but it is meet that thou imagine thyself also a stranger; and that thou see in what manner he will have displeased thee, who shall not have given that, which thou in thy country wilt not give to a stranger.” I ask all men. True are these things? True. Just are these things? Just. But hear ye the Psalm. “If truly therefore justice ye speak, judge right things, ye sons of men.” Be it not a justice of lips, but also of deeds. For if thou actest otherwise than thou speakest, good things thou speakest, and ill thou judgest.…

But now to the present case let us come, if ye please. For the voice is that sweet voice, so well known to the ears of the Church, the voice of our Lord Jesus Christ, and the voice of His Body, the voice of the Church toiling, sojourning upon earth, living amid the perils of men speaking evil and of men flattering. Thou wilt not fear a threatener, if thou lovest not a flatterer. He therefore, of whom this is the voice, hath observed and hath seen, that all men speak justice. For what man doth dare not to speak it, lest he be called unjust? When, therefore, as though he were hearing the voices of all men, and were observing the lips of all men, he cried out to them, “If truly indeed justice ye speak,”—if not falsely justice ye speak, if not one thing on lips doth sound, whilst another thing is concealed in hearts,—“judge right things, ye sons of men.” Hear out of the Gospel His own voice, the very same as is in this Psalm: “Hypocrites,” saith the Lord to the Pharisees, “how are ye able good things to speak, when ye are evil men?” “Either make the tree good, and the fruit thereof good: or make the tree evil, and the fruit thereof evil.” Why wilt thou whiten thee, wall of mud? I know thy inward parts, I am not deceived by thy covering: I know what thou holdest forth, I know what thou coverest. “For there was no need for Him, that any one to Him should bear testimony of man: for He knew Himself what was in man.” For He knew what was in man, who had made man, and who had been made Man, in order that He might seek man.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
