[[commentary]]
quote='''
“The innocent of hand, and the pure in heart” (ver. 4). Who then shall ascend thither, and abide there, but the guiltless in deed, and pure in thought? “Who hath not received his soul in vain.” Who hath not reckoned his soul among things that pass away, but feeling it to be immortal, hath longed for an eternity stedfast and unchangeable. “And hath not sworn in deceit to his neighbour.” And therefore without deceit, as things eternal are simple and undeceiving, hath so behaved himself to his neighbour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252024.html'
source_title="Exposition on Psalm 24"
