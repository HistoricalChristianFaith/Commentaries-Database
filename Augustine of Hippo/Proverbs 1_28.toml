[[commentary]]
quote='''
What is it then which Scripture saith in many places: “They shall call, and I will not hear them”? Yet surely Thou art merciful to all that call upon Thee; but that some call, yet call not upon Him, of whom it is said, “They have not called upon God.” They call, but not on God. Thou callest upon whatever thou lovest: thou callest upon whatever thou callest unto thyself, whatever thou wishest to come unto thee. Therefore if thou callest upon God for this reason, in order that money may come unto thee, that an inheritance may come unto thee, that worldly rank may come unto thee, thou callest upon those things which thou desirest may come unto thee: but thou makest God the helper of thy desires, not the listener to thy needs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
