[[commentary]]
quote='''
“His soul shall dwell in good, and his seed shall, by inheritance, possess the earth” (ver. 13). And his work shall possess the stable inheritance of a renewed body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
