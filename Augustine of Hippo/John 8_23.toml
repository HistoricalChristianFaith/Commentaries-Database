[[commentary]]
quote='''
(Tract. xxxviii. 4) From whom above? From the Father Himself, Who is above all. Ye are of this world, I am not of this world. How could He be of the world, by Whom the world was made?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And what said the Lord to those who savored of the earth? "And He said unto them, Ye are from beneath." For this cause ye savor of the earth, because ye lick dust like serpents. Ye eat earth! What does it mean? Ye feed on earthly things, ye delight in earthly things, ye gape after earthly things, ye have no heart for what is above. "Ye are from beneath: I am from above. Ye are of this world: I am not of this world." For how could He be of the world, by whom the world was made? All that are of the world come after the world, because the world preceded; and so man is of the world. But, Christ was first, and then the world; and since Christ was before the world, before Christ there was nothing: because "In the beginning was the Word; all things were made by, Him." He, therefore, was of that which is above. But of what that is above? Of the air? Perish the thought! there the birds wing their flight. Of the sky that we see? Again I say, Perish the thought! it is there that the stars and sun and moon revolve. Of the angels? Neither is this to be understood: by Him who made all things were the angels also made. Of what, then, above is Christ? Of the Father Himself. Nothing is above that God who begat the Word equal with Himself, co-eternal with Himself, only-begotten, timeless, that by Him time's own foundations should be laid. Understand, then, Christ as from above, so as in thy thought to get beyond everything that is made,-the whole creation together, every material body, every created spirit, everything in any way subject to change: rise above all, as John rose, in order to reach this: "In the beginning was the Word, and the Word was with God, and the Word was God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252038.html'
source_title="Tractates on John 38"
