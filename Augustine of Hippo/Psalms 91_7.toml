[[commentary]]
quote='''
How then are these men blotted out from that book wherein they were never written? This hath been said according to their own hope, because they thought of themselves that they were written. What is, “let them be blotted out from the book of life”? Even to themselves let it be evident, that they were not there. By this method of speaking hath been said in another Psalm, “There shall fall from Thy side a thousand, and tens of thousands from on Thy right hand:” that is, many men shall be offended, even out of that number who thought that they would sit with Thee, even out of that number who thought that they would stand at Thy right hand, being severed from the left-hand goats: not that when any one hath there stood, he shall afterwards fall, or when any one with Him hath sat, he shall be cast away; but that many men were to fall into scandal, who already thought themselves to be there, that is, many that thought that they would sit with Thee, many that hoped that they would stand at the right hand, will themselves fall.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"

[[commentary]]
quote='''
Many then fell before the demon of the noon-day. Would ye know how many? He goes on, and says, “A thousand shall fall beside thee, and ten thousand at thy right hand; but it shall not come nigh thee” (ver. 7). To whom, brethren, but to Christ Jesus, is this said?…For the members, the body, and the head, are not separate from one another: the body and the head are the Church and her Saviour. How then is it said, “A thousand shall fall beside thee, and ten thousand by thy right hand”? Because they shall fall before the devil, that destroyeth at noon. It is a terrible thing, my brethren, to fall from beside Christ, from His right hand but how shall they fall from beside Him? Why the one beside Him, the other at His right hand? Why a thousand beside Him, ten thousand at His right hand? Why a thousand beside Him? Because a thousand are fewer than the ten thousand who shall fall at His right hand. Who these are will soon be clear in Christ’s name; for to some He promised that they should judge with Him, namely, to the Apostles, who left all things, and followed Him.…Those judges then are the heads of the Church, the perfect. To such He said, “If thou wilt be perfect, go and sell that thou hast, and give to the poor.” What means the expression, “if thou wilt be perfect”? it means, if thou wilt judge with Me, and not be judged.…Many such at that period, who had distributed their all to the poor, and already promised themselves a seat beside Christ in judgment of the nations, failed amid their torments under the blazing fire of persecution, as before the demon of the noon-day, and denied Christ. These are they who have fallen “beside” Him: when about to sit with Christ for the judgment of the world, they fell.

I will now explain who are they who fall on the right hand of Christ.…And because many have fallen from that hope of being judges, but yet many, many more from that of being on His right hand, the Psalmist thus addresses Christ, “A thousand shall fall beside Thee, and ten thousand at Thy right hand.” And since there shall be many, who regarded not all these things, with whom, as it were with His own limbs, Christ is one, he adds, “But it shall not come nigh Thee.” Were these words addressed to the Head alone? Surely not; surely neither (doth it come nigh) to Paul, nor Peter, nor all the Apostles, nor all the Martyrs, who failed not in their torments. What then do the words, “it shall not come nigh,” mean? Why were they thus tortured? The torture came nigh the flesh, but it did not reach the region of faith. Their faith then was far beyond the reach of the terrors threatened by their torturers. Let them torture, terror will not come nigh; let them torture, but they will mock the torture, putting their trust in Him who conquered before them, that the rest might conquer. And who conquer, except they who trust not in themselves?…Who will not fear? He who trusts not in himself, but in Christ. But those who trust in themselves, although they even hope to judge at the side of Christ, although they hoped they should be at His right hand, as if He said to them, “Come, ye blessed of My Father,” etc.; yet the devil that is at noon overtook them, the raging heat of persecution, terrifying with violence; and many fell from the hope of the seat of judgment, of whom it is said, “A thousand shall fall beside thee;” many too fell from the hope of reward for their duties, of whom it was said, “And ten thousand at thy right hand.” But this downfall and devil that is at noon-day “shall not come nigh thee,” that is, the Head and the body; for the Lord knows who are His.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"
