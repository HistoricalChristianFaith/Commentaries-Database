[[commentary]]
quote='''
(Tr. li. 5) John relates the matter briefly, the other Evangelists are more full. The ass, we read in them, was the foal of an ass on which no man had sat: i. e. the Gentile world, who had not received our Lord. The other ass, which was brought, (not the foal, for there were two,) is the believing Jew.

(Tr. li) This act of our Lord's is pointed to in the Prophets, though the malignant rulers of the Jews did not see in it any fulfilment of prophecy: As it is written, Fear not, daughter of Sion, behold thy King cometh sitting on an ass's colt. Yea, in that nation though reprobate, though blind, there remained still the daughter of Sion; even Jerusalem. To her it is said, Fear not, acknowledge Him whom thou praisest, and tremble not when He suffers. That blood it is which shall wipe away thy sins, and redeem thy life.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And Jesus, when He had found a young ass, sat thereon." Here the account is briefly given: for how it all happened may be found at full length in the other evangelists. But there is appended to the circumstance itself a testimony from the prophets, to make it evident that He in whom was fulfilled all they read in Scripture, was entirely misunderstood by the evil-minded rulers of the Jews. Jesus, then, "found a young ass, and sat thereon; as it is written, Fear not, daughter of Zion: behold, thy King cometh, sitting on an ass's colt." Among that people, then, was the daughter of Zion to be found; for Zion is the same as Jerusalem. Among that very people, I say, reprobate and blind as they were, was the daughter of Zion, to whom it was said, "Fear not, daughter of Zion: behold, thy King cometh, sitting on an ass's colt." This daughter of Zion, who was thus divinely addressed, was amongst those sheep that were hearing the Shepherd's voice, and in that multitude which was celebrating the Lord's coming with such religious zeal, and accompanying Him in such warlike array. To her was it said, "Fear not:" acknowledge Him whom thou art now extolling, and give not way to fear when He comes to suffering; for by the shedding of His blood is thy guilt to be blotted out, and thy life restored. But by the ass's colt, on which no man had ever sat (for so it is found recorded in the other evangelists), we are to understand the Gentile nations which had not received the law of the Lord; by the ass, on the other hand (for both animals were brought to the Lord), that people of His which came of the nation of Israel, and was already so far subdued as to recognize its Master's crib.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252051.html'
source_title="Tractates on John 51"
