[[commentary]]
quote='''
Consider now the text: "And Cain knew his wife, and she conceived, and brought forth Enoch; and he built a city and called the name thereof by the name of his son Enoch." It does not at all follow from these words that we must believe Cain's first son was Enoch, as though "Cain knew his wife" must refer to their first intercourse. You have the same expression used of the first father, Adam, but not only in reference to the conception of Cain, who seems to have been his firstborn, since a little later Scripture records, "Adam knew his wife, and she conceived and brought forth a son and called his name Seth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252015.html'
source_title="City of God 15.8"


[[commentary]]
quote='''
Now, it is recorded of Cain that he built a city, while Abel, as though he were merely a pilgrim on earth, built none. For the true city of the saints is in heaven, though here on earth it produces citizens in whom it wanders as on a pilgrimage through time looking for the kingdom of eternity. When that day comes, it will gather together all those who, rising in their bodies, shall have that kingdom given to them in which, along with their Prince, the King of Eternity, they shall reign forever and ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252015.html'
source_title="City of God 15.1"

[[commentary]]
quote='''
Cain first builded a city, and in that place he builded where no city was. But when Jerusalem was being builded, it was not builded in a place where there was not a city, but there was a city at first which was called Jebus, whence the Jebusites. This having been captured, overcome, made subject, there was builded a new city, as though the old were thrown down; and it was called Jerusalem, vision of peace, City of God. Each one therefore that is born of Adam, not yet doth belong to Jerusalem: for he beareth with him the offshoot of iniquity, and the punishment of sin, having been consigned to death, and he belongeth in a manner to a sort of old city. But if he is to be in the people of God; his old self will be thrown down, and he will be builded up new. For this reason therefore Cain builded a city where there was not a city. For from mortality and from naughtiness every one setteth out, in order that he may be made good hereafter. “For as by the disobedience of one man many were made sinners, so by the obedience of One Man many shall be made just.” And all we in Adam do die: and each one of us of Adam was born. Let him pass over to Jerusalem, he shall be thrown down old, and shall be builded new.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"
