
[[commentary]]
quote='''
“Them that sit in darkness, and in the shadow of death, fast bound in beggary and iron” (ver. 10). Whence this, but that thou wast attributing things to thyself? that thou wast not owning the grace of God? that thou wast rejecting the counsel of God concerning thee? For see what He addeth: “Because they rebelled against the words of the Lord through pride” (ver. 11), not knowing the righteousness of God, and wishing to establish their own, “and they were bitter against the counsel of the Most High.” “And their heart was brought low in labour” (ver. 12). And now fight against lust; if God cease to aid thou mayest strive, thou canst not conquer. And when thou shalt be pressed by thine evil, thy heart will be brought low in labour, so that now with humbled heart thou mayest learn to cry out, “O wretched man that I am! who shall deliver me from the body of this death?”…Freed, thou wilt confess the mercies of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520107.html'
source_title="Exposition on Psalm 107"
