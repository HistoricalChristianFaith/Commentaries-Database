[[commentary]]
quote='''
To Him the porter openeth.

(Tr. xlvi. 2) Or, the porter is our Lord Himself; for there is much less difference between a door and a porter, than between a door and a shepherd. And He has called Himself both the door and the shepherd. Why then not the door and the porter? He opens Himself, i. e. reveals Himself. If thou seek another person for porter, take the Holy Spirit, of whom our Lord below saith, He will guide you into all truth. (c. 16:13) The door is Christ, the Truth; who openeth the door, but He that will guide you into all Truth? Whomsoever thou understand here, beware that thou esteem not the porter greater than the door; for in our houses the porter ranks above the door, not the door above the porter.

(Tr. xlv. 12) He knew the names of the predestinated; as He saith to His disciples, Rejoice that your names are written in heaven. (Luke 19:14)
And leadeth them out.

(Tr. xlv. 14) And who is He who leads them out, but the Same who loosens the chain of their sins, that they may follow Him with free unfettered step?

(Tr. xlv. c. 14) And who is this that goeth before the sheep, but He who being raised from the dead, dieth no more; (Rom. 6:9) and who said, Father, I will also that they, whom Thou hast given Me, be with Me where I am? (Infra 17:24)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
We understand the Lord Christ as the door, and also as the Shepherd; but who is to be understood as the doorkeeper? For the former two, He has Himself explained: the doorkeeper He has left us to search out for ourselves. And what doth He say of the doorkeeper? "To him," He saith, "the porter [doorkeeper] openeth." To whom doth he open? To the Shepherd. What doth he open to the Shepherd? The door. And who is also the door? The Shepherd Himself. Now, if Christ the Lord had not Himself explained, had not Himself said, "I am the Shepherd," and "I am the door," would any of us have ventured to say that Christ is Himself both the Shepherd and the door? For had He said, "I am the Shepherd," and had not said, "I am the door," we should be setting ourselves to inquire what was the door, and perhaps, mistaken in our views, be still standing before the door. His grace and mercy have revealed to us the Shepherd, by His calling Himself so; have revealed to us also the door, when declared Himself such; but He hath left us to search out the doorkeeper for ourselves. Whom, then, are we to call the doorkeeper? Whomsoever we fix upon, we must take care not to think of him as greater than the door itself; for in men's houses the doorkeeper is greater than the door. The doorkeeper is placed before the door, not the door before the doorkeeper; because the porter keepeth the door, not the door the porter. I dare not say that any one is greater than the door, for I have heard already what is the door: that is no longer unknown to me, I am not left to my own conjecture, and I have not got much room for mere human guess work: God hath said it, the Truth hath said it, and we cannot change what the Unchangeable hath uttered.

In respect, then, of the profound nature of this question, I shall tell you what I think: let each one make the choice that pleases him, but let him think of it reverently; as it is written, "Think of the Lord with goodness, and in simplicity of heart seek Him." Perhaps we ought to understand the Lord Himself as the doorkeeper: for the shepherd and the door are in human respects as much different from each other as the doorkeeper and the door; and yet the Lord has called Himself both the Shepherd and the door. Why, then, may we not understand Him also as the doorkeeper? For if we look at His personal qualities, the Lord Christ is neither a shepherd, in the way we are accustomed to know and to see shepherds; nor is He a door, for no artisan made Him: but if, because of some point of similarity, He is both the door and the Shepherd, I venture to say, He is also a sheep. True, the sheep is under the shepherd; yet He is both the Shepherd and a sheep. Where is He the Shepherd? Look, here thou hast it; read the Gospel: "I am the good Shepherd." Where is He a sheep? Ask the prophet: "He was led as a sheep to the slaughter." Ask the friend of the bridegroom: "Behold the Lamb of God, that taketh away the sin of the world." Moreover, I am going to say something of a still more wonderful kind, in accordance with these points of similarity. For both the lamb, and the sheep, and the shepherd are friendly with one another, but from the lions as their foes the sheep are protected by their shepherds: and yet of Christ, who is both sheep and Shepherd, we have it said, "The Lion of the tribe of Judah hath prevailed." All this, brethren, understand in connection with points of similarity, not with personal qualities. It is a common thing to see the shepherds sitting on a rock, and there guarding the cattle committed to their care. Surely the shepherd is better than the rock that he sits upon; and yet Christ is both the Shepherd and the rock. All this by way of comparison. But if thou askest me for His peculiar personal quality: "In the beginning was the Word, and the Word was with God, and the Word was God." If thou askest me for the personal quality peculiarly His own: The only Son, from everlasting to everlasting begotten of the Father, the equal of Him that begat, the Maker of all things, unchangeable with the Father, unchanged by the assuming of human form, man by incarnation, the Son of man, and the Son of God. All this that I have said is not figure, but reality.

Therefore, let us not, brethren, be disturbed in understanding Him, in harmony with certain resemblances, as Himself the door, and also the doorkeeper. For what is the door? The way of entrance. Who is the doorkeeper? He who opens it. Who, then, is He that opens Himself, but He who unveils Himself to sight? See, when the Lord spoke at first of the door, we did not understand: so long as we did not understand, it was shut: He who opened it is Himself the doorkeeper. There is no need, then, of seeking any other meaning, no need; but perhaps there is the desire. If there is so, quit not the path, go not outside of the Trinity. If thou art in quest of some other impersonation of the doorkeeper, bethink thee of the Holy Spirit; for the Holy Spirit will not think it unmeet to be the doorkeeper, when the Son has thought it meet to be Himself the door. Look at the doorkeeper as perhaps the Holy Spirit: about Him the Lord saith to His disciples, "He shall guide you into all truth." What is the door? Christ. What is Christ? The Truth. Who, then, openeth the door, but He who guideth into all truth?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252046.html'
source_title="Tractates on John 46"
