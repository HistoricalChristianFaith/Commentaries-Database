[[commentary]]
quote='''
“To tell of Thy mercy early in the morning, and of Thy truth in the night season” (ver. 2). What is the meaning of this; that the mercy of God is to be told us in the morning, and in the night the truth of God? The morning is, when it is well with us; the night, the sadness of tribulation. What then did he say in brief? When thou art prosperous, rejoice in God, for it is His mercy. Now, perhaps thou wouldest say, If I rejoice in God, when I am prosperous, because it is His mercy; what am I to do when I am in sorrow, in tribulation? It is His mercy, when I am prosperous; is it then His cruelty, when I am in adversity? If I praise His mercy when it is well with me, am I then to exclaim against His cruelty when it is ill? No. But when it is well, praise His mercy: when ill, praise His truth: because He scourgeth sins, He is not unjust.…During the night Daniel confessed the truth of God: he said in his prayer, “We have sinned, and committed iniquity, and have done wickedly. O Lord, righteousness belongeth unto Thee: but unto us confusion of face.” He told of the truth of God during the night-season. What is it to tell of the truth of God in the night-season? Not to accuse God, because thou sufferest aught of evil: but to attribute it to thy sins, His correction: to tell of His loving-kindness early in the morning, and of His truth in the night-season. When thou doest this, thou dost always praise God, always confess to God, and sing unto His Name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252092.html'
source_title="Exposition on Psalm 92"
