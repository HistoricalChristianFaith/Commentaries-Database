[[commentary]]
quote='''
“The Lord shall give the Word” (ver. 11): to wit, food for His animals which shall dwell therein. But what shall these animals work to whom He shall give the word? What but that which followeth? “To them preaching the Gospel in much virtue.” With what virtue, but with that strength wherein He leadeth forth men fettered? Perchance also here he speaketh of that virtue, wherewith in preaching the Gospel they wrought wondrous signs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
