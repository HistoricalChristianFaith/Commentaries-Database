[[commentary]]
quote='''
In the Scripture many details are mentioned distinguishably of each of the triune Persons individually, such as cannot be said of them jointly, even though they are inseparably together, as when they are made manifest by corporeal sounds. So in certain passages of Scripture and through certain created beings they are shown separately and successively, as the Father in the voice which is heard: "Thou art my Son," and the Son in the human nature which he took from the Virgin, and the Holy Spirit in the physical appearance of a dove. These are mentioned distinguishably, it is true, but they do not prove that the Three are separated. To explicate this, we take as an example the unity of our memory, our understanding, our will. Although we list these distinguishably, individually and in their various functions, there is nothing we do or say which proceeds from one of them without the other two. However, we are not to think that these three faculties are compared to the Trinity so as to resemble it at every point, for a comparison is never given such importance in an argument that it exactly fits the thing to which it is compared. Besides, when can any likeness in a created being be applied to the Creator?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 169, TO EUODIUS"

[[commentary]]
quote='''
(de Cons. Ev. ii. 14) Wherefore Matthew relates that the voice said, This is my beloved Son; for he wished to show that the words, This is My Son, were in fact said, that thus the persons who heard it might know that He, and not another, was the Son of God. But, if you ask, which of these two sounded forth in that voice, take which you will, only remember, that the Evangelists, though not relating the same form of speaking, relate the same meaning. And that God delighted Himself in His Son, we are reminded in these words, In thee I am well pleased.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Thereafter Matthew proceeds thus: "And Jesus, when He was baptized, went up straightway out of the water; and, lo, the heavens were opened unto Him, and He saw the Spirit of God descending like a dove, and lighting upon Him; and, lo, a voice from heaven saying, This is my beloved Son, in whom I am well pleased." This incident is also recorded in a similar manner by two of the others, namely Mark and Luke. But at the same time, while preserving the sense intact, they use different modes of expression in reproducing the terms of the voice which came from heaven. For although Matthew tells us that the words were, "This is my beloved Son," while the other two put them in this form, "Thou art my beloved Son," these different methods of speech serve but to convey the same sense, according to the principle which has been discussed above. For the heavenly voice gave utterance only to one of these sentences; but by the form of words thus adopted, namely, "This is my beloved Son," it was the evangelist's intention to show that the saying was meant to intimate specially to the hearers there [and not to Jesus] the fact that He was the Son of God. With this view, he chose to give the sentence, "Thou art my beloved Son," this turn, "This is my beloved Son," as if it were addressed directly to the people. For it was not meant to intimate to Christ a fact which He knew already; but the object was to let the people who were present hear it, for whose sakes indeed the voice itself was given. But furthermore now, with regard to the circumstance that the first of them puts the saying thus, "In whom I am well pleased," the second thus," In Thee I am well pleased;" and the third thus," In Thee it has pleased me;"—if you ask which of these different modes represents what was actually expressed by the voice, you may fix on whichever you will, provided only that you understand that those of the writers who have not reproduced the self-same form of speech have still reproduced the identical sense intended to be conveyed. And these variations in the modes of expression are also useful in this way, that they make it possible for us to reach a more adequate conception of the saying than might have been the case with only one form, and that they also secure it against being interpreted in a sense not consonant with the real state of the case. For as to the sentence, "In whom I am well pleased," if any one thinks of taking it as if it meant that God is pleased with Himself in the Son, he is taught a lesson of prudence by the other turn which is given to the saying, "In Thee I am well pleased." And on the other hand, if, looking at this last by itself, any one supposes the meaning to be, that in the Son the Father had favour with men, he learns something from the third form of the utterance, "In Thee it has pleased me." From this it becomes sufficiently apparent, that whichever of the evangelists may have preserved for us the words as they were literally uttered by the heavenly voice, the others have varied the terms only with the object of setting forth the same sense more familiarly; so that what is thus given by all of them might be understood as if the expression were: In Thee I have set my good pleasure; that is to say, by Thee to do what is my pleasure. But once more, with respect to that rendering which is contained in some codices of the Gospel according to Luke, and which bears that the words heard in the heavenly voice were those that are written in the Psalm, "Thou art my Son, this day have I begotten Thee;" although it is said not to be found in the more ancient Greek codices, yet if it can be established by any copies worthy of credit, what results but that we suppose both voices to have been heard from heaven, in one or other verbal order?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 14"
