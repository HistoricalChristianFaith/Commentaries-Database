[[commentary]]
quote='''
Hence so many Churches of Judæa, which were in Christ, unto whom Paul was unknown by face, but known for an infamous ferocity, and more known for Christ’s most merciful grace. Hence even he, according to the prophecy sent before concerning him, “a wolf ravening, in the morning carrying off, and in the evening dividing morsels;” that is, first as persecutor carrying off unto death, afterwards as a preacher feeding unto life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252079.html'
source_title="Exposition on Psalm 79"
