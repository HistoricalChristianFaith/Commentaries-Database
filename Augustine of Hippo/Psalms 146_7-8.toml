[[commentary]]
quote='''
“The Lord looseth them that are fettered; the Lord lifteth up them that are dashed down; the Lord maketh wise them that are blind” (ver. 8). Perfectly hath he by this last sentence explained to us all the preceding ones: lest perchance, when he had said, “the Lord looseth them that are fettered,” we should refer it to those fettered ones, who for some crime are bound in irons by their masters: and in that he said, “He lifteth up them that are dashed down,” there should occur to our minds some one stumbling or falling, or thrown from a horse. There is another kind of fall, there are other kinds of fetters, just as there is other darkness and other light. Whereas he said, “He maketh the blind wise;” he would not say, He enlightened the blind, lest thou shouldest understand this also in reference to the flesh, as the man was enlightened by the Lord, when He anointed his eyes with clay made with spittle, and so healed him: that thou mightest not look for anything of this sort, when He is speaking of spiritual things, he pointeth to a sort of light of wisdom, wherewith the blind are enlightened. Therefore in the same way as the blind are enlightened with the light of wisdom, so are the fettered set free, and those who are dashed down are lifted up. Whereby then have we been fettered? whereby dashed down? Our body was once an ornament to us: now, we have sinned, and thereby have had fetters put on us. What are our fetters? Our mortality.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520146.html'
source_title="Exposition on Psalm 146"
