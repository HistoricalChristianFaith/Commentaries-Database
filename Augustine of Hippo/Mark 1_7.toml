[[commentary]]
quote='''
John therefore was a foreteller of Christ nearer to Him in time than all who went before him. And because all the righteous men and prophets of former times desired to see the fulfillment of what, through the revelation of the Spirit, they foresaw would come to pass—whence also the Lord Himself says, "That many prophets and righteous men have desired to see those things which ye see, and have not seen them; and to hear those things which ye hear, and have not heard them,"—therefore it was said of John that he was more than a prophet, and that among all that were born of women there was none greater than he; because to the righteous men who went before him it was only granted to foretell the coming of Christ, but to John it was given both to foretell Him in His absence and to behold His presence, so that it should be found that to him was made manifest what the others had desired. ... And John, therefore, though the nearest to Christ in point of time, and within one year of the same age with Him, yet, while he was baptizing, went before the way of Christ who was still to come; for which reason it was said of him, "Behold, I send my messenger before Thy face, which shall prepare Thy way before Thee." And he himself preached, saying, "There cometh one mightier than I after me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FIn%2520Answer%2520to%2520the%2520Letters%2520of%2520Petilian%2FBook%25202.html'
source_title="ANSWER TO THE LETTERS OF PETILIAN, THE DONATIST 2.37"
[[commentary]]
quote='''
With respect, then, to those comparisons which I have instituted between the several narratives of the evangelists, what do these present that must be considered to be of a contradictory order? Are we to regard in this light the circumstance that one of them has given us the words, "whose shoes I am not worthy to bear," whereas the others speak of the" unloosing of the latchet of the shoe"? For here, indeed, the difference seems to be neither in the mere words, nor in the order of the words, nor in any matter of simple phraseology, but in the actual matter of fact, when in the one case the "bearing of the shoe" is mentioned, and in the other the "unloosing of the shoe's latchet." Quite fairly, therefore, may the question be put, as to what it was that John declared himself unworthy to do—whether to bear the shoes, or to unloose the shoe's latchet. For if only the one of these two sentences was uttered by him, then that evangelist will appear to have given the correct narrative who was in a position to record what was said; while the writer who has given the saying in another form, although he may not indeed have offered an [intentionally] false account of it, may at any rate be taken to have made a slip of memory, and will be reckoned thus to have stated one thing instead of another. It is only seemly, however, that no charge of absolute unveracity should be laid against the evangelists, and that, too, not only with regard to that kind of unveracity which comes by the positive telling of what is false, but also with regard to that which arises through forgetfulness. Therefore, if it is pertinent to the matter to deduce one sense from the words "to bear the shoes," and another sense from the words "to unloose the shoe's latchet," what should one suppose the correct interpretation to be put on the facts, but that John did give utterance to both these sentences, either on two different occasions or in one and the same connection? For he might very well have expressed himself thus, "whose shoe's latchet I am not worthy to unloose, and whose shoes I am not worthy to bear:" and then one of the evangelists may have reproduced the one portion of the saying, and the rest of them the other; while, notwithstanding this, all of them have really given a veracious narrative. But further, if, when he spoke of the shoes of the Lord, John meant nothing more than to convey the idea of His supremacy and his own lowliness, then, whichever of the two sayings may have actually been uttered by him, whether that regarding the unloosing of the latchet of the shoes, or that respecting the bearing of the shoes, the self-same sense is still correctly preserved by any writer who, while making mention of the shoes in words of his own, has expressed at the same time the same idea of lowliness, and thus has not made any departure from the real mind [of the person of whom he writes]. It is therefore a useful principle, and one particularly worthy of being borne in mind, when we are speaking of the concord of the evangelists, that there is no divergence [to be supposed] from truth, even when they introduce some saying different from what was actually uttered by the person concerning whom the narrative is given, provided that, notwithstanding this, they set forth as his mind precisely what is also so conveyed by that one among them who reproduces the words as they were literally spoken. For thus we learn the salutary lesson, that our aim should be nothing else than to ascertain what is the mind and intention of the person who speaks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 12"
