[[commentary]]
quote='''
“The Lord looketh from Heaven; He beholdeth all the sons of men” (ver. 13). From the souls of the righteous, the Lord looketh mercifully upon all who would rise to newness of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
