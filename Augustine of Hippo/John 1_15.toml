[[commentary]]
quote='''
(in Joan. Tr. 3) It does not mean—He was made before I was made; but He is preferred to me.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
John admitted he was a lamp lit from Christ, and that is why he took refuge at his feet, to avoid being blown out by the wind of pride if he flew too high. He was in fact so great that some people thought he might be the Christ, and if he had not been his own witness that he was not, the mistake would have persisted, and people would have gone on thinking he was. What a humble man. The honor was offered him by the people, and he spurned it. People were getting the wrong ideas about his greatness, and he put himself in his place. He did not want to be magnified by the words of people, because he had grasped the Word of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252066.html'
source_title="SERMON 66.1"

[[commentary]]
quote='''
"John beareth witness of Him, and crieth, saying, This was He of whom I spake, He that cometh after me is made before me." He came after me, and He preceded me. What is it, "He is made before me"? He preceded me. Not was made before I was made, but was preferred before me, this is "He was made before me." Wherefore was He made before thee, when He came after thee? "Because He was before me." Before thee, O John! what great thing to be before thee! It is well that thou dost bear witness to Him; let us, however, hear Himself saying, "Even before Abraham, I am." But Abraham also was born in the midst of the human race: there were many before him, many after him. Listen to the voice of the Father to the Son: "Before Lucifer I have begotten Thee." He who was begotten before Lucifer Himself illuminates all. A certain one was named Lucifer, who fell; for he was an angel and became a devil; and concerning him the Scripture said, "Lucifer, who did arise in the morning, fell" And why was he Lucifer? Because, being enlightened, he gave forth light. But for what reason did he become dark! Because he abode not in the truth. Therefore He was before Lucifer, before every one that is enlightened; since before every one that is enlightened, of necessity He must be by whom all are enlightened who can be enlightened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"
[[commentary]]
quote='''
Matthew then proceeds with his narrative, and says: Then went out to him Jerusalem and all Judæa, and all the region round about Jordan, and were baptized by him in Jordan, confessing their sins. But when he saw many of the Pharisees and Sadducees come to his baptism, he said unto them, O generation of vipers, who hath warned you to flee from the wrath to come? Bring forth therefore fruits meet for repentance; and think not to say within yourselves, We have Abraham to our father: for I say unto you, that God is able of these stones to raise up children unto Abraham. For now the axe is laid unto the root of the trees: therefore every tree which bringeth not forth good fruit, shall be hewn down and cast into the fire. I indeed baptize you with water unto repentance; but He that is to come after me is mightier than I, whose shoes I am not worthy to bear: He shall baptize you in the Holy Spirit and fire: whose fan is in His hand, and He will thoroughly purge His floor, and gather His wheat into the garner; but He will burn up the chaff with unquenchable fire. This whole passage is also given by Luke, who ascribes almost the same words to John. And where there is any variation in the words, there is nevertheless no real departure from the sense. Thus, for example, Matthew tells us that John said, "And think not to say within yourselves, We have Abraham to our father," where Luke puts it thus: "And begin not to say, We have Abraham to our father." Again, in the former we have the words, "I indeed baptize you with water unto repentance;" whereas the latter brings in the questions put by the multitudes as to what they should do, and represents John to have replied to them with a statement of good works as the fruits of repentance,—all which is omitted by Matthew. So, when Luke tells us what reply the Baptist made to the people when they were musing in their hearts concerning Him, and thinking whether He were the Christ, he gives us simply the words, "I indeed baptize you with water," and does not add the phrase, "unto repentance." Further, in Matthew the Baptist says, "But he that is to come after me is mightier than I;" while in Luke he is exhibited as saying, "But one mightier than I cometh." In like manner, according to Matthew, he says, "whose shoes I am not worthy to bear;" but according to the other, his words are, "the latchet of whose shoes I am not worthy to unloose." The latter sayings are recorded also by Mark, although he makes no mention of those other matters. For, after noticing his attire and his mode of living, he goes on thus: "And preached, saying, There cometh one mightier than I after me, the latchet of whose shoes I am not worthy to stoop down and unloose: I have baptized you with water, but He shall baptize you in the Holy Spirit." In the notice of the shoes, therefore, he differs from Luke in so far as he has added the words, "to stoop down;" and in the account of the baptism he differs from both these others in so far as he does not say, "and in fire," but only, "in the Holy Spirit." For as in Matthew, so also in Luke, the words are the same, and they are given in the same order, "He shall baptize you in the Spirit and in fire,"—with this single exception, that Luke has not added the adjective "Holy," while Matthew has given it thus: "in the Holy Spirit and in fire." The statements made by these three are attested by the evangelist John, when he says: "John bears witness of Him, and cries, saying, This was He of whom I spake, He that cometh after me is preferred before me; for He was before me." For thus he indicates that the thing was spoken by John at the time at which those other evangelists record him to have uttered the words. Thus, too, he gives us to understand that John was repeating and calling into notice again something which he had already spoken, when he said, "This was He of whom I spake, He that cometh after me."

If now the question is asked, as to which of the words we are to suppose the most likely to have been the precise words used by John the Baptist, whether those recorded as spoken by him in Matthew's Gospel, or those in Luke's, or those which Mark has introduced, among the few sentences which he mentions to have been uttered by him, while he omits notice of all the rest, it will not be deemed worth while creating any difficulty for oneself in a matter of that kind, by any one who wisely understands that the real requisite in order to get at the knowledge of the truth is just to make sure of the things really meant, whatever may be the precise words in which they happen to be expressed. For although one writer may retain a certain order in the words, and another present a different one, there is surely no real contradiction in that. Nor, again, need there be any antagonism between the two, although one may state what another omits. For it is evident that the evangelists have set forth these matters just in accordance with the recollection each retained of them, and just according as their several predilections prompted them to employ greater brevity or richer detail on certain points, while giving, nevertheless, the same account of the subjects themselves.

Thus, too, in what more pertinently concerns the matter in hand, it is sufficiently obvious that, since the truth of the Gospel, conveyed in that word of God which abides eternal and unchangeable above all that is created, but which at the same time has been disseminated throughout the world by the instrumentality of temporal symbols, and by the tongues of men, has possessed itself of the most exalted height of authority, we ought not to suppose that any one of the writers is giving an unreliable account, if, when several persons are recalling some matter either heard or seen by them, they fail to follow the very same plan, or to use the very same words, while describing, nevertheless, the self-same fact. Neither should we indulge such a supposition, although the order of the words may be varied; or although some words may be substituted in place of others, which nevertheless have the same meaning; or although something may be left unsaid, either because it has not occurred to the mind of the recorder, or because it becomes readily intelligible from other statements which are given; or although, among other matters which (may not bear directly on his immediate purpose, but which) he decides on mentioning rather for the sake of the narrative, and in order to preserve the proper order of time, one of them may introduce something which he does not feel called upon to expound as a whole at length, but only to touch upon in part; or although, with the view of illustrating his meaning, and making it thoroughly clear, the person to whom authority is given to compose the narrative makes some additions of his own, not indeed in the subject-matter itself, but in the words by which it is expressed; or although, while retaining a perfectly reliable comprehension of the fact itself, he may not be entirely successful, however he may make that his aim, in calling to mind and reciting anew with the most literal accuracy the very words which he heard on the occasion. Moreover, if any one affirms that the evangelists ought certainly to have had that kind of capacity imparted to them by the power of the Holy Spirit, which would secure them against all variation the one from the other, either in the kind of words, or in their order, or in their number, that person fails to perceive, that just in proportion as the authority of the evangelists [under their existing conditions] is made pre-eminent, the credit of all other men who offer true statements of events ought to have been established on a stronger basis by their instrumentality: so that when several parties happen to narrate the same circumstance, none of them can by any means be rightly charged with untruthfulness if he differs from the other only in such a way as can be defended on the ground of the antecedent example of the evangelists themselves. For as we are not at liberty either to suppose or to say that any one of the evangelists has stated what is false, so it will be apparent that any other writer is as little chargeable with untruth, with whom, in the process of recalling anything for narration, it has fared only in a way similar to that in which it is shown to have fared with those evangelists. And just as it belongs to the highest morality to guard against all that is false, so ought we all the more to be ruled by an authority so eminent, to the effect that we should not suppose ourselves to come upon what must be false, when we find the narratives of any writers differ from each other in the manner in which the records of the evangelists are proved to contain variations. At the same time, in what most seriously concerns the faithfulness of doctrinal teaching, we should also understand that it is not so much in mere words, as rather truth in the facts themselves, that is to be sought and embraced; for as to writers who do not employ precisely the same modes of statement, if they only do not present discrepancies with respect to the facts and the sentiments themselves, we accept them as holding the same position in veracity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 12"
