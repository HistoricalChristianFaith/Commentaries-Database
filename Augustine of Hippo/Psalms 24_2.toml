[[commentary]]
quote='''
“He hath founded it above the seas.” He hath most firmly established it above all the waves of this world, that they should be subdued by it, and should not hurt it. “And hath prepared it above the rivers” (ver. 2). The rivers flow into the sea, and men of lust lapse into the world: these also the Church, which, when worldly lusts have been conquered by the grace of God, hath been prepared by love for the reception of immortality, subdues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252024.html'
source_title="Exposition on Psalm 24"
