[[commentary]]
quote='''
When he says: Brethren, the good will of my heart and my prayer to God is made for them, unto salvation, from here he now begins to speak of the hope of the Jews, lest the Gentiles too should dare to be proud against them. For just as the pride of the Jews, who gloried as if from works, had to be refuted, so too the Gentiles must be met, lest they be proud as though preferred to the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
