[[commentary]]
quote='''
“Let Thy hand be found by all Thine enemies.” Be Thy power, O King, when Thou comest to judgment, found by all Thine enemies; who in Thy humiliation discerned it not. “Let Thy right hand find out all that hate Thee” (ver. 8). Let the glory, wherein Thou reignest at the right hand of the Father, find out for punishment in the day of judgment all that hate Thee; for that now they have not found it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
