[[commentary]]
quote='''
Let us commence here, accordingly, with the notice presented by Matthew, [which runs thus]: "And as they were eating, Jesus took bread, and blessed it, and brake it, and gave it to His disciples, and said, Take, eat; this is my body." Both Mark and Luke also gave this section. It is true that Luke has made mention of the cup twice over: first before He gave the bread; and, secondly, after the bread has been given. But the fact is, that what is stated in that earlier connection has been introduced, according to this writer's habit, by anticipation, while the words which he has inserted here in their proper order are left unrecorded in those previous verses, and the two passages when put together make up exactly what stands expressed by those other evangelists. John, on the other hand, has said nothing about the body and blood of the Lord in this context; but he plainly certifies that the Lord spake to that effect on another occasion, with much greater fulness than here.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 1"
