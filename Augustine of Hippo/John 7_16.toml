[[commentary]]
quote='''
How then did the Lord answer those that were marvelling how He knew letters which He had not learned? "My doctrine," saith He, "is not mine, but His that sent me." This is the first profundity. For He seems as if in a few words He had spoken contraries. For He says not, This doctrine is not mine; but, "My doctrine is not mine." If not Thine, how Thine? If Thine, how not Thine? For Thou sayest both: both, "my doctrines;" and, "not mine." For if He had said, This doctrine is not mine, there would have been no question. But now, brethren, in the first place, consider well the question, and so in due order expect the solution. For he who sees not the question proposed, how can he understand what is expounded? The subject of inquiry, then, is that which He says, "My, not mine" this appears to be contrary; how "my," how "not mine"? If we carefully look at what the holy evangelist himself says in the beginning of his Gospel, "In the beginning was the Word, and the Word was with God, and the Word was God;" thence hangs the solution of this question. What then is the doctrine of the Father, but the Father's Word? Therefore, Christ Himself is the doctrine of the Father, if He is the Word of the Father. But since the Word cannot be of none, but of some one, He said both "His doctrine," namely, Himself, and also, "not His own" because He is the Word of the Father. For what is so much "Thine" as Thyself? And what so much not Thine as Thyself, if that Thou art is of another?

The Word then is God; and it is also the Word of a stable, unchangeable doctrine, not such as can be sounded by syllables and fleeting, but abiding with the Father, to which abiding doctrine let us be converted, being admonished by the transitory sounds of the voice. For that which is transitory does not so admonish us as to call us to transitory things. We are admonished to love God. All this that I have said were syllables; they smote through the air to reach your sense of hearing, and by sounding passed away: that, however, which I advise you ought not so to pass away, because He whom I exhort you to love passes not away; and when you, exhorted in transient syllables, shall have been converted, you shall not pass away, but shall abide with Him who is abiding. There is therefore in the doctrine this great matter, this deep and eternal thing which is permanent: whither all things that pass away in time call us, when they mean well and are not falsely put forward. For, in fact, all the signs which we produce by sounds do signify something which is not sound. For God is not the two short syllables "Deus," and it is not the two short syllables that we worship, and it is not the two short syllables that we adore, nor is it to the two short syllables that we desire to come-two syllables which almost cease to sound before they have begun to sound; nor in sounding them is there room for the second until the first has passed away. There remains, then, something great which is called "God," although the sound does not remain when we say the word "God." Thus direct your thoughts to the doctrine of Christ, and ye shall arrive at the Word of God; and when you have arrived at the Word of God, consider this, "The Word was God," and you will see that it was said truly, "my doctrine:" consider also whose the Word is, and you will see that it was rightly said, "is not mine."

Therefore, to speak briefly, beloved, it seems to me that the Lord Jesus Christ said, "My doctrine is not mine," meaning the same thing as if He said, "I am not from myself." For although we say and believe that the Son is equal to the Father, and that there is not any diversity of nature and substance in them, that there has not intervened any interval of time between Him that begets and Him that is begotten, nevertheless we say these things, while keeping and guarding this, that the one is the Father, the other the Son. But Father He is not if He have not a Son, and Son He is not if He have not a Father: but yet the Son is God from the Father; and the Father is God, but not from the Son. The Father of the Son, not God from the Son: but the other is Son of the Father, and God from the Father. For the Lord Christ is called Light from Light. The Light then which is not from Light, and the equal Light which is from Light, are together one Light not two Lights.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252029.html'
source_title="Tractates on John 29"
