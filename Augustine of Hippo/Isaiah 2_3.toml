[[commentary]]
quote='''
The first law, the Old Testament, had come out of Mount Sinai by the lips of Moses; but it was foretold of the law Christ came to give: "The law shall come forth from Zion, and the word of the Lord from Jerusalem." This explains why Christ ordered repentance to be preached in his name among all peoples but beginning in Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252018.html'
source_title="City of God 18.54"

[[commentary]]
quote='''
Came He to thee that thou shouldest have whereat to stumble, and not have whereto to go up? “Come ye, and let us go up to the mountain of the Lord.” Isaiah saith this: “Come ye, and let us go up.” What is, “Come ye, and let us go up”? “Come ye,” is, Believe ye. “Let us go up,” is, Let us profit. But they will neither come, nor go up, nor believe, nor profit. They bark against the mountain. Even now by so often stumbling on Him they are broken, and will not go up, choosing always to stumble.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
