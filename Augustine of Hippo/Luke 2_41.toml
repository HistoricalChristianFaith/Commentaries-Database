[[commentary]]
quote='''
(de Con. Evan. ii. 9.) Perhaps it may strike you as strange that Matthew should say that His parents went with the young Child into Galilee because they were unwilling to go to Judæa for fear of Archelaus, when they seem to have gone into Galilee rather because their city was Nazareth in Galilee, as Luke in this place explains it. But we must consider, that when the Angel, said in a dream to Joseph in Egypt, Rise, and take the young child and his mother, and go into the land of Israel, (Matt. 2:20.) it was at first understood by Joseph as a command to go into Judæa, for so at first sight the land of Israel might have been taken to mean. But when afterwards he finds that Herod's son Archelaus was king, he was unwilling to be exposed to that danger, seeing the land of Israel might also be understood to include Galilee also as a part of it, for there also the people of Israel dwelt.

(de Con. Ev. ii. 10.) But it may be asked, how did His parents go up all the years of Christ's childhood to Jerusalem, if they were prevented from going there by fear of Archelaus? This question might be easily answered, even had some one of the Evangelists mentioned how long Archelaus reigned. For it were possible that on the feast day amid so great a crowd they might secretly come, and soon return again, at the same time that they feared to remain there on other days, so as neither to be wanting in religious duties by neglecting the feast, nor leave themselves open to detection by a constant abode there. But now since all have been silent as to the length of Archelaus' reign, it is plain that when Luke says, They were accustomed to go up every year to Jerusalem, we are to understand that to have been when Archelaus was no longer feared.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Christ, it is true, was also supposed to be the son of Joseph in another way, as if He had been born simply of that man's seed. But this supposition was entertained by persons whose notice the virginity of Mary escaped. For Luke says: "And Jesus Himself began to be about thirty years of age, being (as was supposed) the son of Joseph." This Luke, however, instead of naming Mary His only parent, had not the slightest hesitation in also speaking of both parties as His parents, when he says: "And the boy grew and waxed strong, filled with wisdom, and the grace of God was in Him: and His parents went to Jerusalem every year at the feast of the passover." But lest any one may fancy that by the "parents" here are rather to be understood the blood relations of Mary along with the mother herself, what shall be said to that preceding word of the same Luke, namely, "And His father and mother marvelled at those things which were spoken of Him"? Since, then, he also makes the statement that Christ was born, not in consequence of Joseph's connection with the mother, but simply of Mary the virgin, how can he call him His father, unless it be that we are to understand him to have been truly the husband of Mary, without the intercourse of the flesh indeed, but in virtue of the real union of marriage; and thus also to have been in a much closer relation the father of Christ, in so far as He was born of his wife, than would have been the case had He been only adopted from some other party? And this makes it clear that the clause,"as was supposed," is inserted with a view to those who are of opinion that He was begotten by Joseph in the same way as other men are begotten.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 1"
[[commentary]]
quote='''
Or does any one put to us this question, How was it, then, that His parents went up to Jerusalem every year during the boyhood of Christ, as Luke's narrative bears, if they were prevented from going there by the fear of Archelaus? Well, I should not deem it any very difficult task to solve this question, even although none of the evangelists has given us to understand how long Archelaus reigned there. For it might have been the case that, simply for that one day, and with the intention of returning forthwith, they went up on the day of the feast, without attracting any notice among the vast multitudes then assembled, to the city where, nevertheless, they were afraid to make their residence on other days. And thus they might at once have saved themselves from the appearance of being so irreligious as to neglect the observance of the feast, and have avoided drawing attention upon themselves by a continued sojourn. But further, although all the evangelists have omitted to tell us what was the length of the reign of Archelaus, we have still open to us this obvious method of explaining the matter, namely, to understand the custom to which Luke refers, when he says that they were in the habit of going to Jerusalem every year, as one prosecuted at a time when Archelaus was no more an object of fear. But if the reign of Archelaus should be made out to have lasted for a somewhat longer period on the authority of any extra-evangelical history which appears to deserve credit, the consideration which I have indicated above should still prove quite sufficient,—namely, the supposition that the fear which the parents of the child entertained of a residence in Jerusalem was, nevertheless, not of such a nature as to lead them to neglect the observance of the sacred festival to which they were under obligation in the fear of God, and which they might very easily go about in a manner that would not attract public attention to them. For surely it is nothing incredible that, by taking advantage of favourable opportunities, whether by day or by hour, men may (safely venture to) approach places in which they nevertheless are afraid to be found tarrying.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 10"
