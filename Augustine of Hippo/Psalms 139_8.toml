[[commentary]]
quote='''
“If I go up,” saith he, “to heaven, Thou art there: if I go down to Hades, Thou art present” (ver. 8). At length, miserable runaway, thou hast learnt, that by no means canst thou make thyself far from Him, from whom thou hast wished to remove far away. Behold, He is everywhere; thou, whither wilt thou go? He hath found counsel, and that inspired by Him, who now deigneth to recall him.…If by sinning I go down to the depths of wickednesses, and spurn to confess, saying, “Who seeth me” (for “in Hades who shall confess to Thee?”) there also Thou art present, to punish. Whither then shall I go that I may flee from Thy presence, that is, not find Thee angry?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520139.html'
source_title="Exposition on Psalm 139"
