[[commentary]]
quote='''
There were prophets before John, and many, and great, and holy, worthy of God, full of God, announcers of the Savior; witnesses of the truth. However, it could not be said of any of them what was said of John: Among those born of women, none has arisen greater than John the Baptist. So what does this greatness placed before greatness mean? For the testimony of great humility. For he was so great that Christ could have been thought. John could have exploited the error of men and not exerted himself to persuade that he was the Christ, because those who heard and saw him, already thought he was without him saying it. There was no need for him to sow error, but to confirm it. But that humble friend of the bridegroom, zealous for the bridegroom, not substituting himself as the adulterer for the bridegroom, bears testimony to his friend, and commends him who was truly the bridegroom to the bride: that he might be loved in him, he hates to be loved instead of him. "He who has the bride is the bridegroom," he says. And as if you might say, "Who are you then?" He adds, "But the friend of the bridegroom stands and hears him, and rejoices greatly because of the bridegroom's voice." He stands and hears: the disciple hears the master; because he hears, he stands; for if he does not hear, he falls. Hence the greatness of John is especially commended; for when he could have been thought to be Christ, he preferred to bear testimony to Christ, to commend him; to humble himself rather than to be taken instead of him, and to deceive others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520288.html'
source_title="Sermon 288"

[[commentary]]
quote='''
(Tr. xiii. c. 12) As if He said, She is not My spouse. But dost thou therefore not rejoice in the marriage? Yea, I rejoice, he saith, because I am the friend of the Bridegroom.

(Tr. xiii) But wherefore doth he stand? Because he falleth not, by reason of his humility. A sure ground this to stand upon, Whose shoe's latchet I am not worthy to unloose. Again; He standeth, and heareth Him. So then if he falleth, he heareth Him not. Therefore the friend of the Bridegroom ought to stand and hear, i. e. to abide in the grace which he hath received, and to hear the voice in which he rejoiceth. I rejoice not, he saith, because of my own voice, but because of the Bridegroom's voice. I rejoice; I in hearing, He in speaking; I am the ear, He the Word. For he who guards the bride or wife of his friend, takes care that she love none else; if he wish to be loved himself in the stead of his friend, and to enjoy her who was entrusted to him, how detestable doth he appear to the whole world! Yet many are the adulterers I see, who would fain possess themselves of the spouse who was bought at so great a price, and who aim by their words at being loved themselves instead of the Bridegroom.

(Tr. xiv. c. 3) Or thus; This my Joy is fulfilled, i. e. my joy at hearing the Bridegroom's voice. I have my gift; I claim no more, lest I lose that which I have received. He who would rejoice in himself, hath sorrow; but he who would rejoice in the Lord, shall ever rejoice, because God is everlasting.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But hear a far stronger, a far more expressive testimony. See ye what it is we are treating of; see ye that to love any person in place of Christ is adultery. Why do I say this? Let us attend to the voice of John. People could be mistaken in him, could think him to be the person he was not. He rejects the false honor, in order to hold the truth complete. See what he declares Christ to be; what does he say himself is? "He that hath the bride is the bridegroom." Be chaste, love the bridegroom. But what art thou, who sayest to us, "He that hath the bride is the bridegroom? But the friend of the bridegroom, who standeth and heareth him, rejoiceth greatly because of the bridegroom's voice." The Lord our God will help me in proportion to the tumult of my heart, for it is full of sadness, to utter the grief I feel; but I beseech you by Christ Himself to imagine in thought what it will not be possible for me to utter; for I know that my grief cannot be expressed with befitting impressiveness. Now I see many adulterers who desire to get possession of the bride, purchased at so great a price, loved while deformed that she might be made fair, having been purchased and delivered and adorned by such an one; and those adulterers strive with their words to be loved instead of the bridegroom. Of that One it is said, "This is He that baptizeth." Who is he that goes forth from us and says, "I am he that baptizeth"? Who is he that goes forth from us and says, "That is holy which I give"? Who is he that goes hence and says, "It is good for thee to be born of me"? Let us hear the friend of the bridegroom, not the adulterers against the bridegroom; let us hear one jealous, but not for himself.

Brethen, return in thought to your own homes. I speak of carnal, I speak of earthly things; I speak after the manner of men, for the infirmity of your flesh. Many of you have, many of you wish to have, many, though you wish not to have, still have had wives; many who do not at all wish to have wives, are born of the wives of your fathers. This is a feeling that touches every heart. There is no man so alien from mankind in human affairs as not to feel what I say. Suppose that a man, having set out on a journey, had commended his bride to the care of his friend: "See, I pray thee, thou art my dear friend; see to it, lest in my absence some other may perchance be loved in my stead." Then what sort of a person must he be, who, while the guardian of the bride or wife of his friend, does indeed endeavor that none other be loved, but if he wishes himself to be loved instead of his friend, and desires to enjoy her who was committed to his care, how detestable must he appear to all mankind! Let him see her gazing out of the window, or joking with some one somewhat too heedlessly, he forbids her as one who is jealous. I see him jealous, but let me see for whom he is jealous; whether for his absent friend or for his present self. Think that our Lord Jesus Christ has done this. He has committed His bride to the care of His friend; He has set out on a journey to a far country to receive a kingdom, as He says Himself in the Gospel, but yet is present in His majesty. Let the friend who has gone beyond the sea be deceived; and if he is deceived, woe to him who deceives! Why do men attempt to deceive God,-God who looks at the hearts of all, and searches the secrets of all? But some heretic shows himself, and says, "'Tis I that give, 'tis I that sanctify, 'tis I that justify; go not thou to that other sect." He does well indeed to be jealous, but see for whom. "Go not thou to idols," saith he,-he is rightly jealous; "nor to diviners,"-still rightly jealous. Let us see for whom he is jealous: "What I give is holy, because it is I that give it; he is baptized whom I baptize; he whom I baptize not is not baptized." Hear thou the friend of the bridegroom, learn to be jealous for thy friend; hear His voice who is "He that baptizeth." Why desire to arrogate to thyself what is not thine? Is he so very absent who has left here his bride? Knowest thou not, that He who rose from the dead is sitting at the right hand of the Father? If the Jews despised Him hanging on the tree, dost thou despise Him sitting in heaven? Be assured, beloved, that I suffer great grief of this matter; but, as I have said, I leave the rest to your thoughts. I cannot utter it if I speak the whole day. If I bewail it the whole day, I do not enough. I cannot utter it, if I should have, as the prophet says, "a fountain of tears;" and were I changed into tears, and to become all tears, were I turned into tongues, and to become all tongues, it were not enough.

Let us return and see what this John saith: "He that hath the bride is the bridegroom;" she is not my bride. And dost thou not rejoice in the marriage? Yea, saith he, I do rejoice: "But the friend of the bridegroom, who standeth and heareth him, rejoiceth greatly because of the voice of the bridegroom." Not because of mine own voice, saith he, do I rejoice, but because of the Bridegroom's voice. I am in the place of hearer; He, of speaker: I am as one that must be enlightened, He is the light; I am as the ear, He is the word. Therefore the friend of the Bridegroom standeth and heareth Him. Why standeth? Because he falls not. How falls not? Because he is humble. See him standing on solid ground; "I am not worthy to loose the latchet of His shoe." Thou doest well to be humble; deservedly thou dost not fall; deservedly thou standest, and hearest Him, and rejoicest greatly for the Bridegroom's voice. So also the apostle is the Bridegroom's friend; he too is jealous, not for himself, but for the Bridegroom. Hear his voice when he is jealous: "I am jealous over you," said he, "with the jealousy of God:" not with my own, nor for myself, but with the jealousy of God. Why? How? Over whom art thou jealous, and for whom? "For I have espoused you to one husband, to present a chaste virgin to Christ." Why dost thou fear, then? Why art thou jealous? "I fear," saith he, "lest, as the serpent beguiled Eve by his subtilty, so your minds should be corrupted from the chastity which is in Christ." The whole Church is called a virgin. You see that the members of the Church are divers, that they are endowed with and do rejoice in divers gifts: some men wedded, some women wedded; some are widowers who seek no more to have wives, some are widows who seek no more to have husbands; some men preserve continence from their youth, some women have vowed their virginity to God: divers are the gifts, but all these are one virgin. Where is this virginity, for it is not in the body. It belongs to few women; and if virginity can be said of men, to few men in the Church belongs a holy integrity even of body; yet one such is a more honorable member. Other members, however, preserve virginity, not in body, but all in mind. What is the virginity of the mind? Entire faith, firm hope, sincere charity. This is the virginity which he, who, was jealous for the Bridegroom, feared might be corrupted by the serpent. For, just as the bodily member is marred in a certain part, so the seduction of the tongue defiles the virginity of the heart. Let her who does not desire without cause to keep virginity of body, see to it that she be not corrupted in mind.

What shall I say, then, brethren? Even the heretics have virgins, and there are many virgins among heretics. Let us see whether they love the Bridegroom, so that this virginity may be guarded. For whom is it guarded? "For Christ." Let us see if it be for Christ, and not for Donatus: let us see for whom this virginity is preserved: you can easily prove. Behold, I show you the Bridegroom, for He shows Himself. John bears witness to Him: "This is He that baptizeth." O thou virgin, if for this Bridegroom thou preservest thy virginity, why runnest thou to him who says, "I am he that baptizeth," while the friend of the Bridegroom tells thee, "This is He that baptizeth"? Again, thy Bridegroom possesseth the whole world; why, then, shouldst thou be defiled with a part of it? Who is the Bridegroom? "For God is King of all the earth." This thy Bridegroom possesses the whole, because He purchased the whole. See at what price He purchased it, that thou mayest understand what He has purchased. What price has He given? He gave His blood. Where gave He, where shed He, His blood? In His passion. Is it not to thy Bridegroom thou singest, or feignest to sing, when the whole world was purchased: "They pierced my hands and my feet, they counted all my bones: but they themselves considered me, they looked upon me, they divided my garments among them, and upon my vesture they cast lots"? Thou art the bride, acknowledge thy Bridegroom's vesture. Upon what vesture was the lot cast? Ask the Gospel; see to whom thou art espoused, see from whom thou receivest pledges. Ask the Gospel; see what it tells thee in the suffering of the Lord. "There was a coat" there: let us see what kind; "woven from the top throughout." What does the coat woven from the top signify, but charity? What does this coat signify, but unity? Consider this coat, which not even the persecutors of Christ divided. For it saith, "They said among themselves, Let us not divide it, but let us cast lots upon it." Behold that of which the psalm spoke! Christ's persecutors did not rend His garment; Christians divide the Church.

But what shall I say, brethren? Let us see plainly what He purchased. For there He bought, where He paid the price. Paid it for how much? If He paid it only for Africa, let us be Donatists, and not be called Donatists, but Christians; since Christ bought only Africa: although even here are other than Donatists. But He has not been silent of what He bought in this transaction. He has made up the account: thanks be to God, He has not tricked us. Need there is for that bride to hear, and then to understand to whom she has vowed her virginity. There, in that psalm where it says, "They pierced my hands and my feet, they counted all my bones;" wherein the Lord's passion is most openly declared;-the psalm which is read every year on the last week, in the hearing of the whole people, at the approach of Christ's passion; and this psalm is read both among them and us;-there, I say, note, brethren, what He has bought: let the bill of merchandise be read: hear ye what He bought: "All the ends of the earth shall remember, and turn unto the Lord; and all the kindreds of the nations shall worship in His sight: for the kingdom is His, and He shall rule the nations." Behold what it is He has bought! Behold! "For God, the King of all the earth," is thy Bridegroom. Why, then, wouldst thou have one so rich reduced to rags? Acknowledge Him: He bought the whole; yet thou sayest, "Thou hast a part of it here." Oh, would that thou wert well-pleasing to thy Spouse; would that thou who speakest wert not defiled, and, what is worse, defiled in heart, not in body! Thou lovest a man instead of Christ; lovest one that says, "'Tis I that baptize;" not hearing the friend of the Bridegroom when he says, "This is He that baptizeth;" not hearing him when he says, "He that hath the bride is the Bridegroom." I have not the bride, said he; but what am I? "But the friend of the Bridegroom, who standeth and heareth Him, rejoiceth greatly, because of the Bridegroom's voice."

Evidently, then, my brethren, it profits those men nothing to keep virginity, to have continence, to give alms. All those doings which are praised in the Church profit them nothing; because they rend unity, namely, that "coat" of charity. What do they? Many among them are eloquent; great tongues, streams of tongues. Do they speak like angels? Let them hear the friend of the Bridegroom, jealous for the Bridegroom, not for himself: "Though I speak with the tongues of men and of angels, and have not charity, I am become as sounding brass, or a tinkling cymbal."

But what say they? "We have baptism." Thou hast, but not thine. It is one thing to have, another to own. Baptism thou hast, for thou hast received to be baptized, received as one enlightened, provided thou be not darkened of thyself; and when thou givest, thou givest as a minister, not as owner; as a herald proclaiming, not as a judge. The judge speaks through the herald, and nevertheless it is not written in the registers, "The herald said," but, "The judge said." Therefore see if what thou givest is thine by authority. But if thou hast received, confess with the friend of the Bridegroom, "A man cannot receive anything, except it be given him from heaven." Confess with the friend of the Bridegroom, "He that hath the bride is the Bridegroom; but the friend of the Bridegroom standeth and heareth Him." But O, would thou didst stand and hear Him, and not fall, to hear thyself! For by hearing Him, thou wouldst stand and hear; for thou wilt speak, and thy head is puffed with pride. I, saith the Church, if I am the bride, if I have received pledges, if I have been redeemed at the price of that blood, do hear the voice of the Bridegroom; and I do hear the voice of the Bridegroom's friend too, if he give glory to my Bridegroom, not to himself. Let the friend speak: "He that hath the bride is the Bridegroom; but the friend of the Bridegroom standeth and heareth Him, and rejoices greatly because of the voice of the Bridegroom." Behold, thou hast sacraments; and I grant that thou hast. Thou hast the form, but thou art a branch cut off from the vine; thou hast a form, I want the root. There is no fruit of the form, except where there is a root; but where is the root but in charity? Hear the form of the cut-off branches; let Paul speak: "Though I know all mysteries," saith he, "and have all prophecy, and all faith" (and how great a faith!), "so as to remove mountains, and have not charity, I am nothing."

Let no man tell you fables, then. "Pontius wrought a miracle; and Donatus prayed, and God answered him from heaven." In the first place, either they are deceived, or they deceive. In the last place, grant that he removes mountains: "And have not charity," saith the apostle, "I am nothing." Let us see whether he has charity. I would believe that he had, if he had not divided unity. For against those whom I may call marvel-workers, my God has put me on my guard, saying, "In the last times there shall arise false prophets, doing signs and wonders, to lead into error, if it were possible, even the elect: Lo, I have foretold it to you." Therefore the Bridegroom has cautioned us, that we ought not to be deceived even by miracles. Sometimes, indeed, a deserter frightens a plain countryman; but whether he is of the camp, and whether he is the better of that character with which he is marked, is what he who would not be frightened or seduced attends to. Let us then, my brethren, hold unity: without unity, even he who works miracles is nothing. The people Israel was in unity, and yet wrought no miracles: Pharaoh's magicians were out of unity, and yet they wrought the like works as Moses." The people Israel, as I have said, wrought no miracles. Who were saved with God-they who did, or they who did not, work miracles? The Apostle Peter raised a dead person: Simon Magus did many things: there were there certain Christians who were not able to do either what Peter did or what Simon did; and wherein did they rejoice? In this, that their names were written in heaven. For this is what our Lord Jesus Christ said to the disciples on their return, because of the faith of the Gentiles. The disciples, in truth, themselves said, boasting, "Behold, Lord, in Thy name even the devils are subject to us." Rightly indeed they confessed, they brought the honor to the name of Christ; and yet what does He say to them? "Do not ye glory in this, that the devils are subject to you; but rejoice that your names are written in heaven." Peter cast out devils. Some old widow, some lay person or other, having charity, and holding the integrity of faith, forsooth does not do this. Peter is the eye in the body, that man is the finger, yet is he in the same body in which Peter is; and if the finger has less power than the eye, yet it is not cut off from the body. Better is it to be a finger and to be in the body, than to be an eye and to be plucked out of the body.

Therefore, my brethren, let no man deceive you, let no man seduce you: love the peace of Christ, who was crucified for you, whilst He was God. Paul says, "Neither he that planteth is anything, neither he that watereth, but God who giveth the increase." And does any of us say that he is something? If we say that we are something, and give not the glory to Him, we are adulterers; we desire ourselves to be loved, not the Bridegroom. Love ye Christ, and us in Him, in whom also you are beloved by us. Let the members love one another, but live all under the Head. With grief indeed, my brethren, I have been obliged to speak much, and yet I have said little: I have not been able to finish the passage; God will help us to finish it in due season. I did not wish to burden your hearts further; I wish them to be free for sighs and prayers in behalf of those who are still deaf and do not understand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252013.html'
source_title="Tractates on John 13"

[[commentary]]
quote='''
This lesson from the holy Gospel shows us the excellency of our Lord Jesus Christ's divinity, and the humility of the man who earned the title of the Bridegroom's friend; that we may distinguish between the man who is man, and the Man who is God. For the Man who is God is our Lord Jesus Christ, God before all ages, Man in the age of our world: God of the Father, man of the Virgin, yet one and the same Lord and Saviour Jesus Christ, Son of God, God and man. But John, a man of distinguished grace, was sent before Him, a man enlightened by Him who is the Light. For of John it is said, "He was not the Light, but that he should bear witness of the Light." He may himself be called a light indeed, and rightly so; but an enlightened, not an enlightening light. The light that enlightens, and that which is enlightened, are different things: for even our eyes are called lights (lumina), and yet when we open them in the dark, they do not see. But the light that enlightens is a light both from itself and for itself, and does not need another light for its shining; but all the rest need it, that they may shine.

Accordingly John confessed Him: as you have heard that when Jesus was making many disciples, and they reported to John as if to excite him to jealousy,-for they told the matter as if moved by envy, "Lo, he is making more disciples than thou,"-John confessed what he was, and thereby merited to belong to Him, because he dared not affirm himself to be that which Jesus is. Now this is what John said: "A man cannot receive anything, except it be given him from heaven." Therefore Christ gives, man receives. "Ye yourselves bear me witness that I said, I am not the Christ, but that I am sent before Him He that hath the bride is the Bridegroom; but the friend of the Bridegroom, who standeth and heareth Him, rejoiceth greatly because of the Bridegroom's voice." Not of himself did he give himself joy. He that will have joy of himself shall be sad; but he that will have his joy of God will ever rejoice, because God is everlasting. Dost thou desire to have everlasting joy? Cleave to Him who is everlasting. Such an one John declared himself to be. "Because of the Bridegroom's voice, the friend of the Bridegroom rejoiceth," not because of his own voice, and "standeth and heareth." Therefore, if he falls, he heareth Him not: for of a certain one who fell it is said, "And he stood not in the truth;" this is said of the devil. It behoves the Bridegroom's friend, then, "to stand and to hear." What is it to stand? It is to abide in His grace, which he received. And he hears a voice at which he rejoices. Such was John: he knew whereof he rejoiced; he did not arrogate to himself to be what he was not; he knew himself as one enlightened, not the enlightener. "But that was the true Light," saith the evangelist, "that lighteneth every man coming into this world." If "every man," then also John himself; for he too is of men. Moreover, although none hath arisen among them that are born of women greater than John, yet he was himself one of those that are born of women. Is he to be compared with Him who, because He willed it, was born by a singular and extraordinary birth? For both generations of the Lord are unexampled, both the divine and the human: by the divine He has no mother; by the human, no father. Therefore John was but one of the rest: of greater grace, however, so that of those born of women none arose greater than he; so great a testimony he gave to our Lord Jesus Christ as to call Him the Bridegroom, and himself the Bridegroom's friend, not worthy however to loose the latchet of the Bridegroom's shoe. You have already heard much on this point, beloved: let us look to what follows; for it is somewhat hard to understand. But as John himself says, that "no man can receive anything, except it be given him from heaven," whatever we shall not have understood, let us ask Him who gives from heaven: for we are men, and cannot receive anything, except He, who is not man, give it us.

Now this is what follows: and John says, "This my joy therefore is fulfilled." What is his joy? To rejoice at the Bridegroom's voice. It is fulfilled in me, I have my grace; more I do not assume to myself, lest also I lose what I have received. What is this joy? "With joy rejoiceth for the Bridegroom's voice." A man may understand, then, that he ought not to rejoice of his own wisdom, but of the wisdom which he has received from God. Let him ask nothing more, and he loses not what he found. For many, in that they affirmed themselves to be wise, became fools. The apostle convicts them, and says of them, "Because that which is known of God is manifest to them; for God has showed it unto them." Hear ye what he says of certain unthankful, ungodly men: "For the invisible things of Him from the creation of the world are seen, being understood by the things that are made, His eternal power likewise, and Godhead; so that they are without excuse." Why without excuse? "Because, knowing God" (he said not, "because they knew Him not "), "they glorified Him not as God, nor were thankful; but became vain in their imaginations, and their foolish heart was darkened: professing themselves to be wise, they became fools." If they had known God, they had known at the same time that God, and none other, had made them wise; and they would not then attribute to themselves that which they did not have from themselves, but to Him from whom they had received it. But by their unthankfulness they became fools. Therefore, what God gave freely, He took from the unthankful. John would not be this; he would be thankful: he confessed to have received, and declared that he rejoiced for the Bridegroom's voice, saying, "Therefore this my joy is fulfilled."
'''
