[[commentary]]
quote='''
There were prophets before John, and many, and great, and holy, worthy of God, full of God, announcers of the Savior; witnesses of the truth. However, it could not be said of any of them what was said of John: Among those born of women, none has arisen greater than John the Baptist. So what does this greatness placed before greatness mean? For the testimony of great humility. For he was so great that Christ could have been thought. John could have exploited the error of men and not exerted himself to persuade that he was the Christ, because those who heard and saw him, already thought he was without him saying it. There was no need for him to sow error, but to confirm it. But that humble friend of the bridegroom, zealous for the bridegroom, not substituting himself as the adulterer for the bridegroom, bears testimony to his friend, and commends him who was truly the bridegroom to the bride: that he might be loved in him, he hates to be loved instead of him. "He who has the bride is the bridegroom," he says. And as if you might say, "Who are you then?" He adds, "But the friend of the bridegroom stands and hears him, and rejoices greatly because of the bridegroom's voice." He stands and hears: the disciple hears the master; because he hears, he stands; for if he does not hear, he falls. Hence the greatness of John is especially commended; for when he could have been thought to be Christ, he preferred to bear testimony to Christ, to commend him; to humble himself rather than to be taken instead of him, and to deceive others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520288.html'
source_title="Sermon 288"

[[commentary]]
quote='''
(Tr. xiii. c. 12) As if He said, She is not My spouse. But dost thou therefore not rejoice in the marriage? Yea, I rejoice, he saith, because I am the friend of the Bridegroom.

(Tr. xiii) But wherefore doth he stand? Because he falleth not, by reason of his humility. A sure ground this to stand upon, Whose shoe's latchet I am not worthy to unloose. Again; He standeth, and heareth Him. So then if he falleth, he heareth Him not. Therefore the friend of the Bridegroom ought to stand and hear, i. e. to abide in the grace which he hath received, and to hear the voice in which he rejoiceth. I rejoice not, he saith, because of my own voice, but because of the Bridegroom's voice. I rejoice; I in hearing, He in speaking; I am the ear, He the Word. For he who guards the bride or wife of his friend, takes care that she love none else; if he wish to be loved himself in the stead of his friend, and to enjoy her who was entrusted to him, how detestable doth he appear to the whole world! Yet many are the adulterers I see, who would fain possess themselves of the spouse who was bought at so great a price, and who aim by their words at being loved themselves instead of the Bridegroom.

(Tr. xiv. c. 3) Or thus; This my Joy is fulfilled, i. e. my joy at hearing the Bridegroom's voice. I have my gift; I claim no more, lest I lose that which I have received. He who would rejoice in himself, hath sorrow; but he who would rejoice in the Lord, shall ever rejoice, because God is everlasting.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"
