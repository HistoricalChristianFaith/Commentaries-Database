[[commentary]]
quote='''
“Be mindful of all Thy sacrifice” (ver. 3). Make us mindful of all Thy injuries and despiteful treatment, which Thou hast borne for us. “And be Thy whole burnt offering made fat.” And turn the cross, whereon Thou wast wholly offered up to God, into the joy of the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252020.html'
source_title="Exposition on Psalm 20"
