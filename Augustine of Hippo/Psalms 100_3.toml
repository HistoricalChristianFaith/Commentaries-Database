[[commentary]]
quote='''
And what is this? I asked the earth; and it answered, "I am not He;" and whatsoever are therein made the same confession. I asked the sea and the deeps, and the creeping things that lived, and they replied, "We are not thy God, seek higher than we." I asked the breezy air, and the universal air with its inhabitants answered, "Anaximenes was deceived, I am not God." I asked the heavens, the sun, moon, and stars: "Neither," say they, "are we the God whom thou seekest." And I answered unto all these things which stand about the door of my flesh, "Ye have told me concerning my God, that ye are not He; tell me something about Him." And with a loud voice they exclaimed, "He made us." My questioning was my observing of them; and their beauty was their reply.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FConfessions%2FBook%252010.html'
source_title="Confessions 10.6"

[[commentary]]
quote='''
“Be ye sure that the Lord He is God” (ver. 3). Who knoweth not that the Lord, He is God? But He speaketh of the Lord, whom men thought not God: “Be ye sure that the Lord He is God.” Let not that Lord become vile in your sight: ye have crucified Him, scourged Him, spit upon Him, crowned Him with thorns, clothed Him in a dress of infamy, hung Him upon the Cross, pierced Him with nails, wounded Him with a spear, placed guards at His tomb; He is God. “It is He that hath made us, and not we ourselves.” It is He that hath made us: “and without Him was not anything made that was made.” What reason have ye for exultation, what reason have ye for pride? Another made you; the Same who made you, suffereth from you. But ye extol yourselves, and glory in yourselves, as if ye were created by yourselves. It is good for you that He who made you, make you perfect.…“We are His people, and the sheep of His pasture.” Sheep and one sheep. These sheep are one sheep: and how loving a Shepherd we have! He left the ninety and nine, and descended to seek the one, He bringeth it back on His own shoulders ransomed by His own blood. That Shepherd dieth without fear for the sheep, who on His resurrection regaineth His sheep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520100.html'
source_title="Exposition on Psalm 100"
