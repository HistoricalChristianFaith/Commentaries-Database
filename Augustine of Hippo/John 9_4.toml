[[commentary]]
quote='''
(Tr. xliv. 4) By His saying, Who sent Me, He gives all the glory to Him from Whom He is. The Father hath a Son Who is from Him, but hath none from whom He Himself is.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And then, what follows? "I must work the works of Him that sent me." See, here is that sent one [Siloam], wherein the blind man washed his face. And see what He said: "I must work the works of Him that sent me, while it is day." Recall to thy mind the way in which He gives universal glory to Him of whom He is: for that One has the Son who is of Him; He Himself has no One of whom He is. But wherefore, Lord, saidst Thou, "While it is day"? Hearken why He did so. "The night cometh when no man can work." Not even Thou, Lord. Will that night have such power that not even Thou, whose work the night is, wilt be able to work therein? For I think, Lord Jesus, nay I do not think, but believe and hold it sure, that Thou wast there when God said, "Let there be light, and there was light." For if He made it by the Word, He made it by Thee: and therefore it is said, "All things were made by Him; and without Him was nothing made." "God divided between the light and the darkness: the light He called Day, and the darkness He called Night."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252044.html'
source_title="Tractates on John 44"
