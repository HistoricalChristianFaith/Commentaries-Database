[[commentary]]
quote='''
“Against Me were reviling they that were sitting in the gate” (ver. 12). “In the gate” is nothing else but in public. “And against Me they were chanting, they that were drinking wine.” Do ye think, brethren, that this hath befallen Christ alone? Daily to Him in His members it happeneth: whenever perchance it is necessary for the servant of God to forbid excess of wine and luxuries in any village or town, where there hath not been heard the Word of God, it is not enough that they sing, nay more even against him they begin to sing, by whom they are forbidden to sing. Compare ye now His fasting and their wine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
