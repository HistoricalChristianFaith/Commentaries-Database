[[commentary]]
quote='''
For it was not Himself that Christ showed forth on earth; but it was His Flesh that He showed. For had He showed Himself, the Jews would have seen and known Him; but had they “known Him, they would never have crucified the Lord of Glory.” But perhaps His disciples saw Him, when they said unto Him, “Show us the Father, and it sufficeth us;” and He, to show that it was not Himself that had been seen by them, added: “Have I been so long with you, and have ye not known Me, Philip? He that seeth Me, seeth the Father also.” If then they saw Christ, wherefore did they yet seek for the Father? For if it were Christ whom they saw, they would have seen the Father also. They did not therefore yet see Christ, who desired that the Father should be shown unto them. To prove that they did not yet see Him, hear that, in another place, He promised it by way of reward, saying, “He who loveth Me, keepeth My commandments; and whoso loveth Me, shall be loved of My Father; and I will love Him and” (as if it were said to Him, “what wilt Thou give unto him, as Thou lovest him?” He saith), “I will manifest Myself unto him.” If then He promises this by way of a reward unto them that love Him, it is manifest that the vision of the Truth, promised to us, is of such a nature, that, when we have seen it, we shall no longer say, “My soul is filled with illusions.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"

[[commentary]]
quote='''
Because then we have not where to go farther when we have come to Christ, Himself is called the end of our course. Nor ought we to think, that when we have come to Him, we ought to strive any further to come also to the Father. For this thought Philip also, when he said to Him, “Lord, show us the Father, and it sufficeth us.” When he said, “It sufficeth us,” he sought the end of satisfaction and perfection. Then said He, “Have I been so long time with you, and hast thou not known Me, Philip: he that hath seen Me, hath seen the Father.” In Him then have we the Father, because He is in the Father, and the Father in Him, and He and His Father are One.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
