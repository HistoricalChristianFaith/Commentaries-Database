[[commentary]]
quote='''
For you heard when the apostle was read: "We are ambassadors," he says, "for Christ, as though God were exhorting you by us; we beseech you in Christ's stead,"-that is, as if Christ were beseeching you, and for what? -"to be reconciled unto God." If the apostle exhorts and beseeches us to be reconciled unto God, then were we enemies to God. For no one is reconciled unless from a state of enmity. And we have become enemies not by nature, but by sin. From the same source are we the servants of sin, that we are the enemies of God. God has no enemies in a state of freedom. They must be slaves; and slaves will they remain unless delivered by Him to whom they wished by their sins to be enemies. Therefore, says be, "We beseech you in Christ's stead to be reconciled unto God." But how are we reconciled, save by the removal of that which separates between us and Himself? For He says by the prophet, "He hath not made the ear heavy that it should not hear; but your iniquities have separated between you and your God." And so, then, we are not reconciled, unless that which is in the midst is taken away, and something else is put in its place. For there is a separating medium, and, on the other hand, there is a reconciling Mediator. The separating medium is sin, the reconciling Mediator is the Lord Jesus Christ: "For there is one God and Mediator between God and men, the man Christ Jesus." To take then away the separating wall, which is sin, that Mediator has come, and the priest has Himself become the sacrifice. And because He was made a sacrifice for sin, offering Himself as a whole burnt-offering on the cross of His passion, the apostle, after saying, "We beseech you in Christ's stead to be reconciled unto God,"-as if we had said, How shall we be able to be reconciled?-goes on to say, "He hath made Him," that is, Christ Himself, "who knew no sin, [to be] sin for us, that we may be the righteousness of God in Him," "Him," he says, Christ Himself our God, "who knew no sin." For He came in the flesh, that is, in the likeness of sinful flesh, but not in Sinful flesh, because He had no sin at all; and therefore became a true sacrifice for sin, because He Himself had no sin.

But perhaps, through some special perception of my own, I have said that sin is a sacrifice for sin. Let those who have read it be free to acknowledge it; let not those who have not read it be backward; let them not, I say, be backward to read, that they may be truthful in judging. For when God gave commandment about the offering of sacrifices for sin, in which sacrifices there was no expiation of sins, but the shadow of things to come, the self-same sacrifices, the self-same offerings, the self-same victims, the self-same animals, which were brought forward to be slain for sins, and in whose blood that [true] blood was prefigured, are themselves called sins by the law; and that to such an extent that in certain passages it is written in these terms, that the priests, when about to sacrifice, were to lay their hands on the head of the sin, that is, on the head of the victim about to be sacrificed for sin. Such sin, then, that is, such a sacrifice for sin, was our Lord Jesus Christ made, "who knew no sin."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252041.html'
source_title="Tractates on John 41"
