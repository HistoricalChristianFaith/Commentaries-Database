[[commentary]]
quote='''
“And they angered Moses in the tents, and Aaron the saint of the Lord” (ver. 16). What angering, or, as some have more literally rendered it, what provocation, he speaketh of, the following words sufficiently show.

“The earth opened,” he saith, “and swallowed up Dathan, and covered over the congregation of Abiram” (ver. 17): “swallowed up” answereth to “covered over.” Both Dathan and Abiram were equally concerned in a most sacrilegious schism.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
