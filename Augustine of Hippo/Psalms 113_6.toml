[[commentary]]
quote='''
And he hath moved us also to enquire whether the Lord our God beholdeth the same humble things in heaven and in earth: or different humble things in heaven to what He beholdeth on earth.…But if the Lord our God beholdeth other humble things in heaven to what He doth on earth; I suppose that He already beholdeth in heaven those whom He hath called, and in whom He dwelleth; while on earth He beholdeth those whom He is now calling, that He may dwell in them. For He hath the one with Him musing on heavenly things, the others He is waking, while they yet dream things earthly. But since it is difficult to call even those humble, who have not as yet submitted their necks in piety to the gracious yoke of Christ, since the divine writings throughout the whole Psalm warn us to understand holy by the word humble; there is also another interpretation, which, Beloved, ye may consider with me. I believe that those are now meant by heavens who shall sit upon twelve thrones, and shall judge with the Lord; and under the name of the earth, the rest of the multitude of the blessed, who shall be set on the right hand, that through works of mercy they may be praised and received into everlasting habitations by those whom they have made friends to themselves from the mammon of unrighteousness in this mortal life.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520113.html'
source_title="Exposition on Psalm 113"
