[[commentary]]
quote='''
Let us be praying, as those who are wounded, for the physician; let us be carried into the inn to be healed. For it is He who promises salvation, who pitied the man left half-alive on the road by robbers. He poured in oil and wine, He healed the wounds, He put him on his beast, He took him to the inn, He commended him to the innkeeper's care. To what innkeeper? Perhaps to him who said, "We are ambassadors for Christ." He gave also two pence to pay for the healing of the wounded man. And perhaps these are the two commandments, on which hang all the law and the prophets. Therefore, brethren, is the Church also, wherein the wounded is healed meanwhile, the traveller's inn; but above the Church itself, lies the possessor's inheritance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252041.html'
source_title="Tractates on John 41"


[[commentary]]
quote='''
In this Psalm we have chiefly exhorted you to do deeds of alms, because it is thence that we ascend; and ye see that he who ascendeth, singeth the song of steps. Remember: do not love to descend, instead of to ascend, but reflect upon your ascent: because he who descended from Jerusalem to Jericho fell among thieves.…The Samaritan as He passed by slighted us not: He healed us, He raised us upon His beast, upon His flesh; He led us to the inn, that is, the Church; He entrusted us to the host, that is, to the Apostle; He gave two pence, whereby we might be healed, the love of God, and the love of our neighbour. The Apostle spent more; for, though it was allowed unto all the Apostles to receive, as Christ’s soldiers, pay from Christ’s subjects, that Apostle, nevertheless, toiled with his own hands, and excused the subjects the maintenance owing to him. All this hath already happened: if we have descended, and have been wounded; let us ascend, let us sing, and make progress, in order that we may arrive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520126.html'
source_title="Exposition on Psalm 126"
