[[commentary]]
quote='''
The "law of Christ" means the law of love. The one who loves his neighbor fulfills the law. The love of neighbor is strongly commended even in the Old Testament. The apostle elsewhere says that it is by love that all the commands of the law are summed up. If so, then it is evident that even that Scripture which was given to the covenant people was the law of Christ, which, since it was not being fulfilled by fear, he came to fulfill by love. The same Scripture, therefore, and the same law is called the old covenant when it weighs down in slavery those who are grasping after earthly goods. It is called the new testament when it raises to freedom those who are ardently seeking the eternal good.
'''
source_url=''
source_title="EPISTLE TO THE GALATIANS 58 [1B.6.2]"

[[commentary]]
quote='''
Then what is there in a bed, pray? What, but that the impotent man was borne on it; but, when made whole, he carries the bed? What does the apostle say? "Bear ye one another's burdens, and so shall ye fulfill the law of Christ." Now the law of Christ is love, and love is not fulfilled except we bear one another's burdens. "Forbearing," saith he, "one another in love, endeavoring to keep the unity of the Spirit in the bond of peace." When thou wast weak thy neighbor bore thee: thou art made whole, bear thy neighbor. So wilt thou fill up, O man, that which was lacking to thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252017.html'
source_title="Tractates on John 17"

[[commentary]]
quote='''
There is another point to be observed in the hart. It is reported of stags…that when they either wander in the herds, or when they are swimming to reach some other parts of the earth, that they support the burdens of their heads on each other, in such a manner as that one takes the lead, and others follow, resting their heads upon him, as again others who follow do upon them, and others in succession to the very end of the herd; but the one who took the lead in bearing the burden of their heads, when tired, returns to the rear, and rests himself after his fatigue by supporting his head just as did the others; by thus supporting what is burdensome, each in turn, they both accomplish their journey, and do not abandon each other. Are they not a kind of “harts” that the Apostle addresses, saying, “Bear ye one another’s burdens, and so fulfil the Law of Christ”?…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252042.html'
source_title="Exposition on Psalm 42"
