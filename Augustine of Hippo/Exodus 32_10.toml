[[commentary]]
quote='''
And in case you should suppose that he acted like this more from necessity than from charity, God actually offered him another people: "And I will make you," he said, "into a great nation," so leaving himself free to eliminate those others. But Moses wouldn't accept this: he sticks to the sinners; he prays for the sinners. And how does he pray? This is a wonderful proof of his love, brothers and sisters. How does he pray? Notice something I've often spoken of, how his love is almost that of a mother. When God threatened that sacrilegious people, Moses' maternal instincts were roused, and on their behalf he stood up to the anger of God. "Lord," he said, "if you will forgive them this sin, forgive; but if not, blot me out from the book you have written." What sure maternal and paternal instincts, how sure his reliance, as he said this, on the justice and mercy of God! He knew that because he is just he wouldn't destroy a just man, and because he is merciful he would pardon sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252088.html'
source_title="SERMON 88.24"

[[commentary]]
quote='''
For who could not see, how great is the long-suffering of mercy with which He is sparing evil men? But before the Judgment, He spared then that nation in such sort, that He kindled not all His anger, utterly to root it up and bring it to an end: which thing in His words and in the intercession for their sins of His servant Moses doth evidently appear, where God saith, “Let Me blot them out, and make thee into a great nation:” he intercedeth, being more ready to be blotted out for them than that they should be; knowing that he is doing this before One Merciful, who inasmuch as by no means He would blot out him, would even spare them for his sake. For let us see how greatly He spared, and doth still spare.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
