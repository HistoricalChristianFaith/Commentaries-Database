[[commentary]]
quote='''
For observe what said the psalm, and thou art admonished how God must be thought of: "My tears," it saith, "were made to me my bread day and night, when it was said to me daily, Where is thy God?" As the pagans may say, "Behold our gods, where is your God?" They indeed show us what is seen; we worship what is not seen. And to whom can we show? To a man who has not sight with which to see? For anyhow, if they see their gods with their eyes, we too have other eyes with which to see our God: for "blessed are the pure in heart, for they shall see God." Therefore, when he had said that he was troubled, when it was daily said to him, "Where is thy God?" "these things I remembered," saith he, "because it is daily said to me, Where is thy God?" And as if wishing to lay hold of his God, "These things," saith he, "I remembered, and poured out my soul above me." Therefore, that I might reach unto my God, of whom it was said to me, "Where is thy God? I poured out my soul," not over my flesh, but "above me;" I transcended myself, that I might reach unto Him: for He is above me who made me; none reaches to Him but he that passes beyond himself.

Consider the body: it is mortal, earthy, weak, corruptible; away with it. Yes, perhaps thou sayest, but the body is temporal. Think then of other bodies, the heavenly; they are greater, better, more magnificent. Look at them, moreover, attentively. They roll from east to west, they stand not; they are seen with the eyes, not only by man, but even by the beast of the field. Pass beyond them too. And how, sayest thou, pass beyond the heavenly bodies, seeing that I walk on the earth? Not in the flesh dost thou pass beyond them, but in the mind. Away with them too: though they shine ever so much, they are bodies; though they glitter from heaven, they are bodies. Come, now that perhaps thou thinkest thou hast not whither to go, after considering all these. And whither am I to go, sayest thou, beyond the heavenly bodies; and what am I to pass beyond with the mind? Hast thou considered all these? I have, sayest thou. By what means hast thou considered them? Let the being that considers appear in person. The being that considers all these, that discriminates, distinguishes, and in a manner weighs them in the balance of wisdom, is really the mind. Doubtless, then, better is the mind with which thou hast contemplated all these things, than these things which thou hast contemplated. This mind, then, is a spirit, not a body. Pass beyond it too. And that thou mayest see whither thou art to pass beyond, compare that mind itself, in the first place, with the flesh. Heaven forbid that thou shouldest deign so to compare it! Compare it with the brightness of the sun, of the moon, and of the stars; the brightness of the mind is greater. Observe, first, the swiftness of the mind; see whether the scintillation of the thinking mind be not more impetuous than the brilliance of the shining sun. With the mind thou seest the sun rising. How slow is its motion compared with thy mind! What the sun is about to do, thou canst think in a trice. It is about to come from the east to the west; to-morrow rises from another quarter. Where thy thought has done this, the sun still lags behind, and thou hast traversed the whole journey. A great thing, therefore, is the mind. But how do I say is? Pass beyond it also. For the mind, notwithstanding it be better than every kind of body, is itself changeable. Now it knows, now knows not; now forgets, now remembers; now wills, now wills not; now errs, now is right. Pass therefore beyond all changeableness; not only beyond all that is seen, but also beyond all that changes. For thou hast passed beyond the flesh which is seen; beyond heaven, the sun, moon, and stars, which are seen. Pass, too, beyond all that changes. For when thou hadst done with those things that are seen, and hadst come to thy mind, there thou didst find the changeableness of thy mind. Is God at all changeable? Pass then, beyond even thy mind. Pour out thy soul "above thee," that thou mayest reach unto God, of whom it is said to thee, "Where is thy God?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252020.html'
source_title="Tractates on John 20"
