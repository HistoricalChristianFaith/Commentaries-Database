[[commentary]]
quote='''
For the years of God, and God Himself, are not different: but the years of God are the eternity of God: eternity is the very substance of God, which hath nothing changeable; there nothing is past, as if it were no longer: nothing is future, as if it existed not as yet. There is nothing there but, Is: there is not there, Was, and Will be; because what was, is now no longer: and what will be, is not as yet: but whatever is there, simply Is.…Behold this great I Am! What is man’s being to this? To this great I Am, what is man, whatever he be? Who can understand that To Be? who can share it? who can pant, aspire, presume that he may be there? Despair not, human frailty! “I am,” He saith, “the God of Abraham, and the God of Isaac, and the God of Jacob.” Thou hast heard what I am in Myself: now hear what I am on thy account. This eternity then hath called us, and the Word burst forth from eternity. It is now eternity, it is now the Word, and no longer time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"

[[commentary]]
quote='''
“Remember,” he saith, “His marvellous works that He hath done, His wonders, and the judgments of His mouth” (ver. 5). This passage seemeth like that, “Thou shalt say unto the children of Israel, I Am hath sent me unto you:” an expression which, in ever so small part, scarce a mind taketh in. Then mentioning His own Name, He mercifully mingled in His grace towards men, saying, “I am the God of Abraham, the God of Isaac, and the God of Jacob; this is My Name for ever.” By which He would have it to be understood, that they whose God He declared Himself lived with Him for ever, and He said this, which might be understood even by children, that they who by the great powers of love knew how to seek His face for evermore, might according to their capacity comprehend, I Am that I Am.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520105.html'
source_title="Exposition on Psalm 105"
