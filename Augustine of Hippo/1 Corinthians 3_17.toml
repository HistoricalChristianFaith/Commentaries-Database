[[commentary]]
quote='''
“The Lord is in His holy temple” (ver. 4), yea in such wise as the Apostle saith, “For the temple of God is holy, which” temple “ye are.” “Now if any man shall violate the temple of God, him shall God destroy.” He violateth the temple of God, who violateth unity: for he “holdeth not the head, from which the whole body fitly joined together and compacted by that which every joint supplieth according to the working after the measure of every part maketh increase of the body to the edifying of itself in love.” The Lord is in this His holy temple; which consisteth of His many members, fulfilling each his own separate duties, by love built up into one building. Which temple he violateth, who for the sake of his own pre-eminence separateth himself from the Catholic society.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252011.html'
source_title="Exposition on Psalm 11"
