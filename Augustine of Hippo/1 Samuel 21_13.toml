[[commentary]]
quote='''
All these modes of expression will be thought lies, if a figurative expression or action is to be considered a lie. But, if it is not a lie when signs signifying one thing are put for another to serve the understanding of a truth, certainly that should not be judged a lie either which Jacob did or said to his father in order to be blessed, or what Joseph said in sporting with his brothers, or David's pretense of insanity, or other signs of the same kind. They should be judged as prophetic expressions and actions set forth for the understanding of those things which are true. Those things are veiled in figures, in garments as it were, in order that they may exercise the mind of the pious inquirer and not become cheap for being bare and obvious. Although we have learned their meaning stated openly and plainly in other places, still, when they are dug out of obscurity, they are somehow recreated in our knowledge and thus become sweet. A student is not hindered because they are shrouded in this way. On the contrary, they are rendered more acceptable: for being remote they are more ardently desired, and for being desired they are more joyfully discovered.
'''
source_url='https://www.newadvent.org/fathers/1313.htm'
source_title="Against Lying 10.24"

[[commentary]]
quote='''
A psalm of David, when he changed his countenance before Abimelech, and he sent him away, and he departed.

Because there was there a sacrifice after the order of Aaron, and afterwards He of His Own Body and Blood appointed a sacrifice after the order of Melchizedek; He changed then His Countenance in the Priesthood, and sent away the kingdom of the Jews, and came to the Gentiles. What then is, “He affected”? He was full of affection. For what is so full of affection as the Mercy of our Lord Jesus Christ, who, seeing our infirmity, that He might deliver us from everlasting death, underwent temporal death with such great injury and contumely? “And He drummed:” because a drum is not made, except when a skin is extended on wood; and David drummed, to signify that Christ should be crucified. But, “He drummed upon the doors of the city:” what are “the doors of the city,” but our hearts which we had closed against Christ, who by the drum of His Cross hath opened the hearts of mortal men? “And was carried in His Own Hands:” how “carried in His Own Hands”? Because when He commended His Own Body and Blood, He took into His Hands that which the faithful know; and in a manner carried Himself, when He said, “This is My Body.” “And He fell down at the doors of the gate;” that is, He humbled Himself. For this it is, to fall down even at the very beginning of our faith. For the door of the gate is the beginning of faith; whence beginneth the Church, and arriveth at last even unto sight: that as it believeth those things which it seeth not, it may deserve to enjoy them, when it shall have begun to see face to face. So is the title of the Psalm; briefly we have heard it; let us now hear the very words of Him that affecteth, and drummeth upon the doors of the city.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"

[[commentary]]
quote='''
But who is it that blesseth the Lord at all times, except the humble in heart. For very humility taught our Lord in His Own Body and Blood: because when He commendeth His Own Body and Blood, He commendeth His Humility, in that which is written in this history, in that seeming madness of David, which we have passed by, “And his spittle ran down over his beard.” When the Apostle was read, Ye heard the same spittle, but running down over the beard. One saith perhaps, What spittle have we heard? Was it not read but now, where the Apostle saith, “The Jews require a sign, and the Greeks seek after wisdom?” But now it was read, “But we preach,” saith he, “Christ crucified” (for then He drummed), “unto the Jews a stumbling block, and unto the Greeks foolishness; but unto them which are called, both Jews and Greeks, Christ the Power of God, and the Wisdom of God. Because the Foolishness of God is wiser than men, and the Weakness of God is stronger than men.” For spittle signifieth foolishness; spittle signifieth weakness. But if the Foolishness of God is wiser than men, and the Weakness of God is stronger than men; let not the spittle as it were offend thee, but observe that it runneth down over the beard: for as by the spittle, weakness; so by the beard, strength is signified. He covered then His Strength by the body of His Weakness, and that which without was weak, appeared as it were in spittle; but within His Divine Strength was covered as a beard. Therefore humility is commended unto us. Be humble if thou wouldest bless the Lord at all times, and that His praise should be ever in thy mouth.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"
