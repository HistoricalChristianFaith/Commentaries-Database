[[commentary]]
quote='''
So in another Psalm he saith, that men in conjunction with beasts are made whole together with these beasts, not by any present inward illumination, but by the multiplication of the mercy of God, whereby His goodness reacheth even to the lowest things; for the wholeness of carnal men is carnal, as of the beasts; but separating the sons of men from those whom being men he joined with cattle, he proclaims that they are made blessed, after a far more exalted method, by the enlightening of the truth itself, and by a certain inundation of the fountain of life. For he speaketh thus: “Men and beasts Thou wilt make whole, O Lord, as Thy mercy hath been multiplied, O God. But the sons of men shall put their trust in the covering of Thy wings. They shall be inebriated with the richness of Thine house, and of the torrent of Thy pleasures Thou shalt make them drink. For with Thee is the fountain of life, and in Thy light shall we see light. Extend Thy mercy to them that know Thee.” Through the multiplication of mercy then He is mindful of man, as of beasts; for that multiplied mercy reacheth even to them that are afar off; but He visiteth the son of man, over whom, placed under the covering of His wings, He extendeth mercy, and in His light giveth light, and maketh him drink of His pleasures, and inebriateth him with the richness of His house, to forget the sorrows and the wanderings of his former conversation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25208.html'
source_title="Exposition on Psalm 8"
