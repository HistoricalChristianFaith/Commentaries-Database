[[commentary]]
quote='''
(de Con. Ev. l. ii. c. 27.) Now Luke evidently relates that this was spoken not by men of themselves, but by others concerning them. How then does Matthew say, Then came unto him the disciples of John, saying, Why do we and the Pharisees fast; unless that they themselves also came, and were all eager, as far as they were able, to put the question to Him?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
In the same way, we may subject what is said about the disciples of John to examination. Matthew's words are these: "Then came to Him the disciples of John, saying, Why do we and the Pharisees fast oft?" The purport of Mark's version is similar: "And the disciples of John and the Pharisees used to fast. And they come and say unto Him, Why do the disciples of John and the Pharisees fast, but thy disciples fast not?" The only semblance of a discrepancy that can be found here, is in the possibility of supposing that the mention of the Pharisees as having spoken along with the disciples of John is an addition of Mark's, while Matthew states only that the disciples of John expressed themselves to the above effect. But the words which were actually uttered by the parties, according to Mark's version, rather indicate that the speakers and the persons spoken of were not the same individuals. I mean, that the persons who came to Jesus were the guests who were then present, that they came because the disciples of John and the Pharisees were fasting, and that they uttered the above words with respect to these parties. In this way, the evangelist's phrase, "they come," would not refer to the persons regarding whom he had just thrown in the remark, "And the disciples of John and the Pharisees were fasting." But the case would be, that as those parties were fasting, some others here, who are moved by that fact, come to Him, and put this question to Him, "Why do the disciples of John and of the Pharisees fast, but thy disciples fast not?" This is more clearly expressed by Luke. For, evidently with the same idea in his mind, after stating what answer the Lord returned in the words in which He spoke about the calling of sinners under the similitude of those who are sick, he proceeds thus: "And they said unto Him, Why do the disciples of John fast often, and make prayers, and likewise the disciples of the Pharisees, but thine eat and drink?" Here, then, we see that, as was the case with Mark, Luke has mentioned one party as speaking to this intent in relation to other parties. How comes it, therefore, that Matthew says, "Then came to Him the disciples of John, saying, Why do we and the Pharisees fast?" The explanation may be, that those individuals were also present, and that all these various parties were eager to advance this charge, as they severally found opportunity. And the sentiments which sought expression on this occasion have been conveyed by the three evangelists under varied terms, but yet without any divergence from a true statement of the fact itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 27"
