[[commentary]]
quote='''
“And a man shall say, If therefore there is fruit to a just man” (ver. 10). Behold, before that there cometh that which is promised, before that there is given life everlasting, before that ungodly men are cast forth into fire everlasting, here in this life there is fruit to the just man. What fruit? “In hope rejoicing, in tribulation enduring.” What fruit to the just man? “We glory in tribulations, knowing that tribulation worketh patience, but patience probation, but probation hope: but hope confoundeth not: because the love of God is shed abroad in our hearts through the Holy Spirit, that hath been given to us.” Doth he rejoice that is a drunkard; and doth he not rejoice that is just? In love there is fruit to a just man. Miserable the one, even when he maketh himself drunken: blessed the other, even when he hungereth and thirsteth. The one wine-bibbing doth gorge, the other hope doth feed. Let him see therefore the punishment of the other, his own rejoicing, and let him think of God. He that hath given even now such joy of faith, of hope, of charity, of the truth of His Scriptures, what manner of joy is He making ready against the end? In the way thus He feedeth, in his home how shall He fill him? “And a man shall say, If therefore there is fruit to the just man.” Let them that see believe, and see, and perceive. Rejoice shall the just man when he shall have seen vengeance. But if he hath not eyes whence he may see vengeance, he will be made sad, and will not be amended by it. But if he seeth it, he seeth what difference there is between the darkened eye of the heart, and the eye enlightened of the heart: between the coolness of chastity and the flame of lust, between the security of hope and the fear there is in crime. When he shall have seen this, let him separate himself, and wash his hands in the blood of the same. Let him profit by the comparison, and say, “Therefore there is fruit to the just man: therefore there is a God judging them in the earth.” Not yet in that life, not yet in fire eternal, not yet in the lower places, but here in earth.…

If somewhat too prolix we have been, pardon us. We exhort you in the name of Christ, to meditate profitably on those things which ye have heard. Because even to preach the truth is nought, if heart from tongue dissenteth; and to hear the truth nothing profiteth, if a man upon the rock build not. He that buildeth upon a Rock, is the same that heareth and doeth: but he that heareth and doeth not, buildeth upon sand: he that neither heareth nor doeth, buildeth nothing.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
