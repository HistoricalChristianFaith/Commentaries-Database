[[commentary]]
quote='''
"If you do not know yourself, go out, you, in the tracks of the flocks, and graze your goats in the tents of the shepherds." Go out in the tracks, not of the flock but of the flocks, and graze, not like Peter my sheep but your goats; in the tabernacles, not of the shepherd but of the shepherds; not of unity but of division, not established in the place where there is one flock and one shepherd.By this answer she has been stiffened, built up, made stronger as the beloved wife, ready to die for her husband and live with her husband.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520138.html'
source_title="SERMON 138:8"

[[commentary]]
quote='''
Or else surely it is, “Thy image lighten upon us:” so that he said this, in “lighten Thy countenance upon us:” Thou hast imprinted Thy countenance upon us; Thou hast made us after Thine image and Thy likeness, Thou hast made us Thy coin; but Thine image ought not in darkness to remain: send a ray of Thy wisdom, let it dispel our darkness, and let there shine in us Thy image; let us know ourselves to be Thine image, let us hear what hath been said in the Song of Songs, “If Thou shalt not have known Thyself, O Thou fair one among women.” For there is said to the Church, “If Thou shalt not have known Thyself.” What is this? If Thou shalt not have known Thyself to have been made after the image of God. O Soul of the Church, precious, redeemed with the blood of the Lamb immaculate, observe of how great value Thou art, think what hath been given for Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252067.html'
source_title="Exposition on Psalm 67"
