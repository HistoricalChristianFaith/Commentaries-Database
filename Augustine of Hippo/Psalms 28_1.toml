[[commentary]]
quote='''
Of David himself.

It is the Voice of the Mediator Himself, strong of hand in the conflict of the Passion. Now what He seems to wish for against His enemies, is not the wish of malevolence, but the declaration of their punishment; as in the Gospel, with the cities, in which though He had performed miracles, yet they had not believed on Him, He doth not wish in any evil will what He saith, but predicteth what is impending over them.

“Unto Thee, O Lord, have I cried; My God, be not silent from me” (ver. 1). Unto Thee, O Lord, have I cried; My God, separate not the unity of Thy Word from that which as Man I am. “Lest at any time Thou be silent from me: and I shall be like them that go down into the pit.” For from this, that the Eternity of Thy Word ceaseth not to unite Itself to Me, it comes that I am not such a man as the rest of men, who are born into the deep misery of this world: where, as if Thou art silent, Thy Word is not recognised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252028.html'
source_title="Exposition on Psalm 28"
