[[commentary]]
quote='''
“For Thy mercy is before mine eyes” (ver. 3). For, that I be not consumed by that fire, not my merits, but Thy mercy, whereby Thou hast brought me on to such a life, is before my eyes. “And I have been pleasing in Thy truth.” And since my own falsehood hath been displeasing to me, but Thy truth pleasing, I have myself been pleasing also with it and in it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252026.html'
source_title="Exposition on Psalm 26"
