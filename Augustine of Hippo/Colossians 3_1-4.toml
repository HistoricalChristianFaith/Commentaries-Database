[[commentary]]
quote='''
How, then, shall we not be with Christ where He is, when we shall be with Him in the Father in whom He is? On this, also, the apostle is not without something to say to us, although we are not yet in possession of the reality, but only cherishing the hope. For he says, "If ye be risen with Christ, seek those things which are above, where Christ sitteth on the right hand of God: set your affections on things above, not on things on the earth. For ye have died," he adds, "and your life is hid with Christ in God." Here, you see, our life is meanwhile in faith and hope with Christ, where He is; because it is with Christ in God. That, you see, is as if already accomplished for which He prayed, when He said, "I will that they also be with me where I am;" but now only by faith. And when will it be accomplished by actual sight? "When Christ," he says, "[who is] your life, shall appear, then shall ye also appear with Him in glory." Then shall we appear as that which we then shall be; for it shall then be apparent that it was not without good grounds that we believed and hoped we should become so, before it actually took place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520111.html'
source_title="Tractates on John 111"
