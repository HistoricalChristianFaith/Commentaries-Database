[[commentary]]
quote='''
(Tr. liii. 2) But some mutter, and ask, What fault was it of the Jews, if it was necessary that the sayings of Esaias should be fulfilled? We answer, that God, foreseeing the future, predicted by the Prophet the unbelief of the Jews, but did not cause it. God does not compel men to sin, because He knows they will sin. He foreknows their sins, not His own. The Jews committed the sin, which He who knows all things foretold they would commit.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
When our Lord Christ, foretelling His own passion, and the fruitfulness of His death in being lifted up on the cross, said that He would draw all [things] after Him; and when the Jews, understanding that He spake of His death, put to Him the question how He could speak of death as awaiting Him, when they heard out of the law that Christ abideth for ever; He exhorted them, while still they had in them the little light, which had so taught them that Christ was eternal, to walk, to make themselves acquainted with the whole subject, lest they should be overtaken with darkness. And, when He had said this, He hid Himself from them. With these points you have been made acquainted in former Lord's day lessons and discourses.

The evangelist thereafter brings forward what has formed the brief subject of to-day's reading, and says, "But though He had done so many miracles before them, yet they believed not on Him: that the saying of Isaiah the prophet might be fulfilled, which he spake, Lord, who hath believed our report and to whom hath the arm of the Lord been revealed?" Where he makes it sufficiently plain that the Son of God is Himself the arm of the Lord; not that the person of God the Father is determined by the shape of human flesh, and that the Son is attached to Him as a member of His body; but because all things were made by Him, and therefore He is designated the arm of the Lord. For as it is with thine arm that thou workest, so the Word of God is styled His arm; because by the Word He elaborated the world. For why does a man, in order to do some work, stretch forth his arm, but because the doing of it does not straightway follow his word? And if he was endowed with such pre-eminent power that what he said was done without any movement of his body, then would his word be his arm. But the Lord Jesus, the only-begotten Son of God the Father, as He is no mere member of the Father's body, so is He no mere thinkable, and audible, and transitory word; for, as all things were made by Him, He was the word of God.

When, therefore, we hear that the Son of God is the arm of God the Father, let no carnal custom raise its distracting din in our ears; but as far as His grace enables us, let us think of that power and wisdom of God by which all things were made. Surely such an arm as that is neither held out by stretching, nor drawn in by contracting it. For He is not one and the same with the Father, but He and the Father are one; and as equal with the Father, He is in all respects complete, as well as the Father: so that no room is left open for the abominable error of those who assert that the Father alone exists, but according to the difference of causes is Himself sometimes called the Son, sometimes the Holy Spirit; and so also from these words may venture to say, See you perceive that the Father alone exists, if the Son is His arm: for a man and his arm are not two persons, but one. Not understanding nor considering how words are transferred from one thing to another, on account of some mutual likeness, even in our daily forms of speech about things the most familiar and visible; and how much the more must it be so, in order that things ineffable may find some sort of expression in our speech, things which, as they really exist, cannot be expressed in words at all? For even one man styles another his arm, by whom he is accustomed to transact his business: and if he is deprived of him, he says in his grief, I have lost my arm; and to him who has taken him away, he says, You have deprived me of my arm. Let them understand, then, the sense in which the Son is termed the arm of the Father, as that by which the Father hath executed all His works; that they may not, by failing to understand this, and continuing in the darkness of their error, resemble those Jews of whom it was said, "And to whom hath the arm of the Lord been revealed?"

And here we meet with the second question, to treat of which, indeed, in any adequate manner, to investigate all its mysterious windings, and throw them open to the light in a befitting way, I think within the scope neither of my own powers, nor of the shortness of the time, nor of your capacity. Yet, as we cannot allow ourselves so far to disappoint your expectations as to pass on to other topics without saying something on this, take what we shall be able to offer you: and wherein we fail to satisfy your expectations, ask the increase of Him who appointed us to plant and to water; for, as the apostle saith, "Neither is he that planteth anything, nor he that watereth; but God that giveth the increase." There are some, then, who mutter among themselves, and sometimes speak out when they can, and even break forth into turbulent debate, saying: What did the Jews do, or what fault was it of theirs, if it was a necessity "that the saying of Isaiah the prophet should be fulfilled, which he spake, Lord, who hath believed our report and to whom hath the arm of the Lord been revealed?" To whom our answer is, that the Lord, in His foreknowledge of the future, foretold by the prophet the unbelief of the Jews; He foretold it, but did not cause it. For God does not compel any one to sin simply because He knows already the future sins of men. For He foreknew sins that were theirs, not His own; sins that were referable to no one else, but to their own selves. Accordingly, if what He foreknew as theirs is not really theirs, then had He no true foreknowledge: but as His foreknowledge is infallible, it is doubtless no one else, but they themselves, whose sinfulness God foreknew, that are the sinners. The Jews, therefore, committed sin, with no compulsion to do so on His part, to whom sin is an object of displeasure; but He foretold their committing of it, because nothing is concealed from His knowledge And accordingly, had they wished to do good instead of evil, they would not have been hindered; but in this which they were to do they were foreseen of Him who knows what every man will do, and what He is yet to render unto such an one according to his work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252053.html'
source_title="Tractates on John 53"
