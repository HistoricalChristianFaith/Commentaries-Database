[[commentary]]
quote='''
“The death of sinners is the worst” (ver. 21). Attend, Brethren, for the sake of those things which I said. Truly Great is the Lord, and His Mercy, truly Great is He who gave to us to eat His Body, wherein He suffered such great things, and His Blood to drink. How regardeth He them that think evil and say, “Such an one died ill, by beasts was he devoured: he was not a righteous man, therefore he perished ill; for else would he not have perished.” Is he then righteous who dieth in his own house and in his own bed? This then (sayest thou) it is whereat I wonder; because I know the sins and the crimes of this same man, and yet he died well; in his own house, within his own doors, with no injury of travel, with none even in mature age. Hearken, “The death of sinners is worst.” What seemeth to thee a good death, is worst if thou couldest see within. Thou seest him outwardly lying on his bed, dost thou see him inwardly carried to hell? Hearken, Brethren, and learn from the Gospel what is the “worst death” of sinners. Were there not two in that age, a rich man who was clothed in purple and fine linen, and fared sumptuously every day; another a poor man who lay at his door full of sores, and the dogs came and licked his sores, and he desired to be fed with the crumbs which fell from the rich man’s table? Now it came to pass that the poor man died (righteous was that poor man), and was carried by Angels into Abraham’s bosom. He who saw his body lying at the rich man’s door, and no man to bury it, what haply said he? So die he who is my enemy; and whoever persecutes me, so may I see him. His body is accursed with spitting, his wounds stink; and yet in Abraham’s bosom he resteth. If we are Christians, let us believe: if we believe not, Brethren, let none feign himself a Christian. Faith bringeth us to the end. As the Lord spake these things, so are they. Doth indeed an astrologer speak unto thee, and it is true, and doth Christ speak, and it is false? But by what sort of death died the rich man? What sort of death must it not be in purple and fine linen, how sumptuous, how pompous! What funeral ceremonies were there! In what spices was that body buried! And yet when he was in hell, being in torments, from the finger of that despised poor man he desired one drop of water to be poured upon his burning tongue, and obtained it not. Learn then what meaneth, “The death of sinners is worst;” and ask not beds covered with costly garments, and to have the flesh wrapped in many rich things, friends exhibiting a show of lamentation, a household beating their breasts, a crowd of attendants going before and following when the body is carried out, marble and gilded memorials. For if ye ask those things, they answer you what is false, that of many not light sinners, but altogether wicked, the death is best, who have deserved to be so lamented, so embalmed, so covered, so carried out, so entombed. But ask the Gospel, and it will show to your faith the soul of the rich man burning in torments, which was nothing profited by all those honours and obsequies, which to his dead body the vanity of the living did afford.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"


[[commentary]]
quote='''
How shall he live till the end? As he lived that was “clothed with purple and fine linen, and fared sumptuously every day,” who, being proud and puffed up, spurned the man full of sores lying before his gate, whose sores the dogs licked, and who longed for the crumbs which fell from his table. What did those riches profit him? Both changed places: the one was borne from the rich man’s gate into Abraham’s bosom, the other from his rich feasts was cast into the fire; the one was in peace, the other burned; the one was sated, the other thirsted; the one had laboured till the end, but he lived for ever; the other had lived till the end, but he laboured for ever. And what did it profit the rich man, who asked, while lying in torments in hell, that a drop of water should be poured upon his tongue from the finger of Lazarus, saying, “For I am burning here in this flame,” and it was not granted to him? One longed for the drop from the finger, as the other had for the crumbs from the rich man’s table; but the labour of the one is ended, and the life of the other is ended: the labour of this is for ever, the life of that is for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"


[[commentary]]
quote='''
If that rich man had anything, whose tongue was dry, then man hath something of his own. My brethren, do we read in the Gospel, that this rich man appeared in the fire with all-silken and fine-linen coverings? Was he of such sort in hell as he was in feastings at table? When he thirsted and desired a drop, all those things were not there. Therefore man carrieth not with him anything, nor doth the dead take with him that which the burial taketh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"


[[commentary]]
quote='''
For that rich man, when he feasted sumptuously every day, was supposed to do well with himself: but when he began to burn in hell, then that which was supposed to be well was found to be ill. For what he had eaten with men above, he digested in hell beneath. Unrighteousness I mean, brethren, on which he used to feast. He used to eat costly banquets with the mouth of flesh, with his heart’s mouth he used to eat unrighteousness. What he ate with his heart’s mouth with men above, this he digested amid those punishments in the places beneath. And verily he had eaten for a time, he digested ill for everlasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"
