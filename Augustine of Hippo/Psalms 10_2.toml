[[commentary]]
quote='''
Therefore he hints the reason of the delay, saying, “Whilst the ungodly vaunteth himself, the poor man is inflamed” (ver. 2). Wondrous it is and true with what earnestness of good hope the little ones are inflamed unto an upright living by comparison with sinners. In which mystery it comes to pass, that even heresies are permitted to exist; not that heretics themselves wish this, but because Divine Providence worketh this result from their sins, which both maketh and ordaineth the light; but ordereth only the darkness, that by comparison therewith the light may be more pleasant, as by comparison with heretics the discovery of truth is more sweet. For so, by this comparison, the approved, who are known to God, are made manifest among men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252010.html'
source_title="Exposition on Psalm 10"
