[[commentary]]
quote='''
For not for those only they laboured, with whom they lived in the earth; nor the Lord for those Apostles only to whom He deigned to show Himself alive after His Resurrection, but for us also. For to them He spake, and signified us when He spake, “Lo, I am with you alway, even to the end of the world.” Were they then to be here alway, even to the end of the world? Also He said, “Neither pray I for these alone, but for them also which shall believe on Me through their word.” Therefore He considereth us, because He suffered on account of us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
