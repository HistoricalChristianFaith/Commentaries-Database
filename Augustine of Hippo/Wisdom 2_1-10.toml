[[commentary]]
quote='''
Thou hast the voice of these very men in the book of Wisdom. For after there had gone before the verse, “The unwise man hath said in his heart, There is no God;” as if reasons were required why the unwise man could say this, he hath subjoined, “Corrupted they are, and abominable have become in their iniquities” (ver. 2). Hear ye those corrupted men. “For they have said with themselves, not rightly thinking:” corruption beginneth with evil belief, thence it proceedeth to depraved morals, thence to the most flagrant iniquities, these are the grades. But what with themselves said they, thinking not rightly? “A small thing and with tediousness is our life.” From this evil belief followeth that which also the Apostle hath spoken of, “Let us eat and drink, for to-morrow we shall die.” But in the former passage more diffusely luxury itself is described: “Let us crown us with roses, before they be withered; in every place let us leave the tokens of our gladness.” After the more diffuse description of that luxury, what followeth? “Let us slay the poor just man:” this is therefore saying, “He is not God.” Soft words they seemed but now to say: “Let us crown us with roses, before they be withered.” What more delicate, what more soft? Wouldest thou expect, out of this softness, Crosses, swords? Wonder not, soft are even the roots of brambles; if any one handle them, he is not pricked: but that wherewith thou shalt be pricked from thence hath birth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252053.html'
source_title="Exposition on Psalm 53"
