[[commentary]]
quote='''
When he says: But the gift is not as the offense, the gift excels in two ways: either because grace much more abounds—since through it one lives forever, whereas through Adam's death, death reigned only temporally; or because by the condemnation of one offense the death of many came about through Adam, whereas through our Lord Jesus Christ grace was given, by the free gift covering many offenses, unto eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
