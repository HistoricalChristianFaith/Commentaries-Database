[[commentary]]
quote='''
He was walking in grief, in the tribulation of his humiliation, so resigned to God, that, ascribing to Him all that was just, he confessed that he was suffering nothing undeservedly, having now an heart upright, to which God was not displeasing. A slanderous person and one throwing in his teeth harsh curses he patiently heard, one of the soldiers on the opposite side, that were with his unnatural son. And when he was heaping curses upon the king, one of the companions of David, enraged, would have gone and smitten him; but he is kept back by David. And he is kept back how? For that he said, God sent him to curse me. Acknowledging his guilt he embraced his penance, seeking glory not his own, praising the Lord in that good which he had, praising the Lord in that which he was suffering, “blessing the Lord alway, ever His praise was in his mouth.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"
