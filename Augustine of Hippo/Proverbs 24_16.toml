[[commentary]]
quote='''
The text, "For a just man shall fall seven times and shall rise again," means that he will not perish, however often he falls. There is here no question of falling into sins but of afflictions leading to a lower life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252011.html'
source_title="City of God 11.31"

[[commentary]]
quote='''
The words “seven times a day,” signify “evermore.” For this number is wont to be a symbol of universality; because after six days of the divine work of creation, a seventh of rest was added; and all times roll on through a revolving cycle of seven days. For no other reason it was said, “a just man falleth seven times, and riseth up again:” that is, the just man perisheth not, though brought low in every way, yet not induced to transgress, otherwise he will not be just. For the words, “falleth seven times,” are employed to express every kind of tribulation, whereby man is cast down in the sight of men: and the words, “riseth up again,” signify that he profiteth from all these tribulations. The following sentence in this passage sufficiently illustrates the foregoing words: for it follows, “but the wicked shall fall into mischief.” Not to be deprived of strength in any evils, is therefore the falling seven times, and the rising again of the just man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
