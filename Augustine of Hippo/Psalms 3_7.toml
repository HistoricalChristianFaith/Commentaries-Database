[[commentary]]
quote='''
“Arise, O Lord, save me, O my God” (ver. 7). It is not said to God, “Arise,” as if asleep or lying down, but it is usual in holy Scripture to attribute to God what He doeth in us; not indeed universally, but where it can be done suitably; as when He is said to speak, when by His gift Prophets speak, and Apostles, or whatsoever messengers of the truth. Hence that text, “Would you have proof of Christ, who speaketh in me?” For he doth not say, of Christ, by whose enlightening or order I speak; but he attributes at once the speaking itself to Him, by whose gift he spake.

“Since Thou hast smitten all who oppose me without a cause.” It is not to be pointed as if it were one sentence, “Arise, O Lord, save me, O my God; since Thou hast smitten all who oppose me without a cause.” For He did not therefore save Him, because He smote His enemies; but rather He being saved, He smote them. Therefore it belongs to what follows, so that the sense is this; “Since Thou hast smitten all who oppose me without a cause, Thou hast broken the teeth of the sinners;” that is, thereby hast Thou broken the teeth of the sinners, since Thou hast smitten all who oppose me. It is forsooth the punishment of the opposers, whereby their teeth have been broken, that is, the words of sinners rending with their cursing the Son of God, brought to nought, as it were to dust; so that we may understand “teeth” thus, as words of cursing. Of which teeth the Apostle speaks, “If ye bite one another, take heed that ye be not consumed one of another.” The teeth of sinners can also be taken as the chiefs of sinners; by whose authority each one is cut off from the fellowship of godly livers, and as it were incorporated with evil livers. To these teeth are opposed the Church’s teeth, by whose authority believers are cut off from the error of the Gentiles and divers opinions, and are translated into that fellowship which is the body of Christ. With these teeth Peter was told to eat the animals when they had been killed, that is, by killing in the Gentiles what they were, and changing them into what he was himself. Of these teeth too of the Church it is said, “Thy teeth are as a flock of shorn sheep, coming up from the bath, whereof every one beareth twins, and there is not one barren among them.” These are they who prescribe rightly, and as they prescribe, live; who do what is written, “Let your works shine before men, that they may bless your Father which is in heaven.” For moved by their authority, they believe God who speaketh and worketh through these men; and separated from the world, to which they were once conformed, they pass over into the members of the Church. And rightly therefore are they, through whom such things are done, called teeth like to shorn sheep; for they have laid aside the burdens of earthly cares, and coming up from the bath, from the washing away of the filth of the world by the Sacrament of Baptism, every one beareth twins. For they fulfil the two commandments, of which it is said, “On these two commandments hang all the Law and the Prophets;” loving God with all their heart, and with all their soul, and with all their mind, and their neighbour as themselves. “There is not one barren among them,” for much fruit they render unto God. According to this sense then it is to be thus understood, “Thou hast broken the teeth of the sinners,” that is, Thou hast brought the chiefs of the sinners to nought, by smiting all who oppose Me without a cause. For the chiefs according to the Gospel history persecuted Him, whilst the lower people honoured Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25203.html'
source_title="Exposition on Psalm 3"
