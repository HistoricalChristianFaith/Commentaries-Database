[[commentary]]
quote='''
“They asked, and the quail came” (ver. 40). They did not desire quails, but flesh. But since the quail is flesh, and in this Psalm he speaketh not of the provocation of those who did not please God, but of the faith of the elect, the true seed of Abraham; they are to be understood to have desired that that might come which might crush the murmurs of those who provoked. Then in the next line, “And He filled them with the bread of heaven,” he has not indeed named manna, but it is obscure to none who hath read those records.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520105.html'
source_title="Exposition on Psalm 105"
