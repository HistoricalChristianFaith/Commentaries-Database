[[commentary]]
quote='''
The Apostle bindeth us together into this very structure, and fasteneth us when bound together in that unity, saying, “Forbearing one another in love; endeavouring to keep the unity of the Spirit in the bond of peace.” Where there is this unity of Spirit, there is one stone; but one stone formed out of many. How one formed out of many? By forbearing one another in love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252096.html'
source_title="Exposition on Psalm 96"
