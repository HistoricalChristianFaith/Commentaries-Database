[[commentary]]
quote='''
(ubi sup.) That Luke says here, that the men were ordered to sit down by fifties, but Mark, by fifties and hundreds, does not matter, seeing that one spoke of a part, the other of the whole. But if one had mentioned only the fifties, and the other only the hundreds, they would seem to be greatly opposed to one another; nor would it be sufficiently distinct which of the two was said. But who will not admit, that one was mentioned by one Evangelist, the other by another, and that if more attentively considered it must be found so. But I have said thus much, because often certain things of this kind exist, which to those who take little heed and judge hastily appear contrary to one another, and yet are not so.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
In this connection, it is true, we ought not to omit to direct the reader's attention to certain other matters which may turn out to be of a kindred nature with those already considered. One of these is found in the circumstance that Luke has stated that they were ordered to sit down by fifties, whereas Mark's version is that it was by hundreds and by fifties. This difference, however, creates no real difficulty. The truth is, that the one has reported simply a part, and the other has given the whole. For the evangelist who has introduced the notice of the hundreds as well as the fifties has just mentioned something which the other has left unmentioned. But there is no contradiction between them on that account. If, indeed, the one had noticed only the fifties, and the other only the hundreds, they might certainly have seemed to be in some antagonism with each other, and it might not have been easy to make it plain that both instructions were actually uttered, although only the one has been specified by the former writer, and the other by the latter. And yet, even in such a case, who will not acknowledge that when the matter was subjected to more careful consideration, the solution should have been discovered? This I have instanced now for this reason, that matters of that kind do often present themselves, which, while they really contain no discrepancies, appear to do so to persons who pay insufficient attention to them, and pronounce upon them inconsiderately.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 46"
