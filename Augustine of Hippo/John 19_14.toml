[[commentary]]
quote='''
(Tract. cxvii) Why then doth Mark say, And it was the third hour, and they crucified Him? (Mark 15:25) Because on the third hour our Lord was crucified by the tongues of the Jews, on the sixth by the hands of the soldiers. So that we must understand that the fifth hour was passed, and the sixth began, when Pilate sat down on the judgment seat, (about the sixth hour, John says,) and that the crucifixion, and all that took place in connection with it, filled up the rest of the hour, from which time up to the ninth hour there was darkness, according to Matthew, Mark, and Luke. But since the Jews tried to transfer the guilt of putting Christ to death from themselves to the Romans, i. e. to Pilate and his soldiers, Mark, omitting to mention the hour at which He was crucified by the soldiers, has expressly recorded the third hour; in order that it might be evident that not only the soldiers who crucified Jesus on the sixth hour, but the Jews who cried out for His death at the third, were His crucifiers. There is another way of solving this difficulty, viz. that the sixth hour here does not mean the sixth hour of the day; as John does not say, It was about the sixth hour of the day, but, It was the preparation of the passover, and about the sixth hour. Parasceve means in Latin, praeparatio. For Christ our passover, as saith the Apostle, is sacrificed for us. The preparation for which passover, counting from the ninth hour of the night, which seems to have been the hour at which the chief priests pronounced upon our Lord's sacrifice, saying, He is guilty of death, between it and the third hour of the day, when He was crucified, according to Mark, is an interval of six hours, three of the night and three of the day.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But on this account we must not pass over that which hath come into mind, lest perchance the reading of the Divine Scriptures should disquiet any one. One Evangelist saith that the Lord was crucified at the sixth hour, and another at the third hour: unless we understand it, we are disquieted. And when the sixth hour was already beginning, Pilate is said to have sat on the judgment-seat: and in reality when the Lord was lifted up upon the tree, it was the sixth hour. But another Evangelist, looking unto the mind of the Jews, how they wished themselves to seem guiltless of the death of the Lord, by his account proveth them guilty, saying, that the Lord was crucified at the third hour. But considering all the circumstance of the history, how many things might have been done, when before Pilate the Lord was being accused, in order that He might be crucified; we find that it might have been the third hour, when they cried out, “Crucify, Crucify.” Therefore with more truth they killed at the time when they cried out. The ministers of the magistrate at the sixth hour crucified, the transgressors of the law at the third hour cried out: that which those did with hands at the sixth hour, these did with tongue at the third hour. More guilty are they that with crying out were raging, than they that in obedience were ministering. This is the whole of the Jews’ sagacity, this is that which they sought as some great matter. Let us kill and let us not kill: so let us kill, as that we may not ourselves be judged to have killed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252064.html'
source_title="Exposition on Psalm 64"
