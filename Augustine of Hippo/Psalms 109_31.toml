[[commentary]]
quote='''
“For He stood at the right hand of the poor” (ver. 30). It was said of Judas, “Let Satan stand at his right hand;” since he chose to increase his riches by selling Christ; but here the Lord stood at the right hand of the poor, that the Lord Himself might be the poor man’s riches. “He stood at the right hand of the poor,” not to multiply the years of a life that one day must end, nor to increase his stores, nor to render him strong in the strength of the body, or secure for a time; “but,” he saith, “to save my soul from the persecutors.” Now the soul is rendered safe from the persecutors, if we do not consent to them unto evil; but there is no such consent to them when the Lord standeth at the right hand of the poor, that he may not give way through his very poverty, that is, weakness. This aid was given to the Body of Christ in the case of all the holy Martyrs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520109.html'
source_title="Exposition on Psalm 109"
