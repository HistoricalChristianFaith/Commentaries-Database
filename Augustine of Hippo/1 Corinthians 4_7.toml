[[commentary]]
quote='''
From this you may understand why I wrote the letter which has been referred to, to Sixtus, presbyter of the Church at Rome, against the new Pelagian heretics, who say that the grace of God is bestowed according to our own merits, so that he who glories has to glory not in the Lord, but in himself,—that is to say, in man, not in the Lord. This, however, the apostle forbids in these words: "Let no man glory in man;" while in another passage he says, "He that glorieth let him glory in the Lord." But these heretics, under the idea that they are justified by their own selves, just as if God did not bestow on them this gift, but they themselves obtained it by themselves, glory of course in themselves, and not in the Lord. Now, the apostle says to such, "Who maketh thee to differ from another?" and this he does on the ground that out of the mass of perdition which arose from Adam, none but God distinguishes a man to make him a vessel to honour, and not to dishonour. Lest, however, the carnal man in his foolish pride should, on hearing the question, "Who maketh thee to differ from another?" either in thought or in word answer and say: My faith, or my prayer, or my righteousness makes me to differ from other men, the apostle at once adds these words to the question, and so meets all such notions, saying, "What hast thou that thou didst not receive? now, if thou didst receive it, why dost thou glory, as if thou didst not receive it?" Now, they boast as if they did not receive their gifts by grace, who think that they are justified of their own selves, and who, on this account, glory in themselves, and not in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Letter 1, Section 3"

[[commentary]]
quote='''
When, however, the Pelagians say that the only grace which is not given according to our merits is that whereby his sins are forgiven to man, but that that which is given in the end, that is, eternal life, is rendered to our preceding merits: they must not be allowed to go without an answer. If, indeed, they so understand our merits as to acknowledge them, too, to be the gifts of God, then their opinion would not deserve reprobation. But inasmuch as they so preach human merits as to declare that a man has them of his own self, then most rightly the apostle replies: "Who maketh thee to differ from another? And what hast thou, that thou didst not receive? Now, if thou didst receive it, why dost thou glory as if thou hadst not received it?" To a man who holds such views, it is perfect truth to say: It is His own gifts that God crowns, not your merits,—if, at least, your merits are of your own self, not of Him. If, indeed, they are such, they are evil; and God does not crown them; but if they are good, they are God's gifts, because, as the Apostle James says, "Every good gift and every perfect gift is from above, and cometh down from the Father of lights." In accordance with which John also, the Lord's forerunner, declares: "A man can receive nothing except it be given him from heaven"—from heaven, of course, because from thence came also the Holy Ghost, when Jesus ascended up on high, led captivity captive, and gave gifts to men. If, then, your good merits are God's gifts, God does not crown your merits as your merits, but as His own gifts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 15"
