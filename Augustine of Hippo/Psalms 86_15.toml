[[commentary]]
quote='''
"The Lord is merciful and pitiful." So He is, certainly. Add yet further, "Long-suffering;" add yet further, "And very pitiful:" but fear what comes last, "And true." For those whom He now bears with as sinners, He will judge as despisers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252033.html'
source_title="Tractates on John 33"
