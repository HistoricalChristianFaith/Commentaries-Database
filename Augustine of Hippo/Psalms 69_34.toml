[[commentary]]
quote='''
“Let there praise Him heavens and earth, sea and all things creeping in them” (ver. 34). The true riches of this poor man are these, to consider the creation, and to praise the Creator. “Let there praise Him heavens and earth, sea and all things creeping therein.” And doth this creation alone praise God, when by considering of it God is praised?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
