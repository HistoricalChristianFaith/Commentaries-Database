[[commentary]]
quote='''
“Thou hast turned My mourning into joy to Me” (ver. 11). Whom I, the Church, having received, the First-Begotten from the dead, now in the dedication of Thine house, say, “Thou hast turned my mourning into joy to me. Thou hast put off my sackcloth, and girded me with gladness.” Thou hast torn off the veil of my sins, the sadness of my mortality; and hast girded me with the first robe, with immortal gladness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252030.html'
source_title="Exposition on Psalm 30"
