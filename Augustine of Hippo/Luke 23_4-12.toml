[[commentary]]
quote='''
The truth, however, is not at all affected by the order in which Luke has narrated these things; and as little is it affected by the mere circumstance that one writer passes over some incident without notice, which another expressly specifies. We have an instance in what follows; namely, "Then said Pilate to the chief priests and to the people, I find no fault in this man. And they were the more fierce, saying, He stirreth up the people, teaching throughout all Jewry, beginning from Galilee to this place. But when Pilate heard of Galilee, he asked whether the man were a Galilean. And as soon as he knew that He belonged unto Herod's jurisdiction, he sent Him to Herod, who himself also was at Jerusalem at that time. And when Herod saw Jesus, he was exceeding glad; for he was desirous to see Him of a long season, because he had heard many things of Him, and he hoped to see some miracle done by Him. Then he questioned with Him in many words; but He answered him nothing. And the chief priests and scribes stood and vehemently accused Him. And Herod with his men of war set Him at nought, and mocked Him, and arrayed Him in a gorgeous robe, and sent Him again to Pilate. And the same day Herod and Pilate were made friends together: for before they were at enmity between themselves." All these things are related by Luke alone, namely, the fact that the Lord was sent by Pilate to Herod, and the account of what took place on that occasion. At the same time, among the statements which he makes in this passage, there are some bearing a resemblance to matters which may be found reported by the other evangelists in connection with different portions of their narrations. But the immediate object of these others, however, was to recount simply the various things which were done in Pilate's presence on to the time when the Lord was delivered over to be crucified. In accordance with his own plan, however, Luke makes the above digression with the view of telling what occurred with Herod; and after that he reverts to the history of what took place in the governor's presence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 8"
