[[commentary]]
quote='''
Let the Psalm then follow, and say, “God shall be known in her houses.” Now in her “houses,” because of the mountains, because of the two walls, because of the two sons. “God shall be known in her houses,” but he commendeth grace, therefore he added, “when He shall take her up.” For what would that city have been, unless He had taken her up? Would it not immediately have fallen, unless it had such foundation? For “other foundation can no man lay than that is laid, which is Jesus Christ.” Let none then glory in his own merits; but “he that glorieth, let him glory in the Lord.”…The Lord then hath taken up this city, and is known therein, that is, His grace is known in that city: for whatever that city hath, which glorieth in the Lord, it hath not of itself. For because of this it is said, “What hast thou that thou didst not receive?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
