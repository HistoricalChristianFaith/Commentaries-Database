[[commentary]]
quote='''
Advance on the road to sublimity by the footstep of humility. He himself exalts those who follow him humbly, who was not ashamed to descend to the fallen.
'''
source_url='https://www.newadvent.org/fathers/1310.htm'
source_title="On Holy Virginity 52(53)"

[[commentary]]
quote='''
“Let not the foot of pride come against me” (ver. 11). But now he said, The children of men shall put their trust under the shadow of Thy wings: they shall be satiated with the fulness of Thy House. When one hath begun to be plentifully overflowed with that Fountain, let him take heed lest he grow proud. For the same was not wanting to Adam, the first man: but the foot of pride came against him, and the hand of the sinner removed him, that is, the proud hand of the devil. As he who seduced him, said of himself, “I will sit in the sides of the north;” so he persuaded him, by saying, “Taste, and ye shall be as gods.” By pride then have we so fallen as to arrive at this mortality. And because pride had wounded us, humility maketh us whole. God came humbly, that from such great wound of pride He might heal man. He came, for “The Word was made Flesh, and dwelt among us.” He was taken by the Jews; He was reviled of them. Ye heard when the Gospel was read, what they said, and to Whom they said, “Thou hast a devil:” and He said not, Ye have a devil, for ye are still in your sins, and the devil possesseth your hearts. He said not this, which if He had said, He had said truly: but it was not meet that He should say it, lest He should seem not to preach Truth, but to retort evil speaking. He let go what He heard as though He heard it not. For a Physician was He, and to cure the madman had He come. As a Physician careth not what he may hear from the madman; but how the madman may recover and become sane; nor even if he receive a blow from the madman, careth he; but while he to him giveth new wounds, he cureth his old fever: so also the Lord came to the sick man, to the madman came He, that whatever He might hear, whatever He might suffer, He should despise; by this very thing teaching us humility, that being taught by humility, we might be healed from pride: from which he here prayeth to be delivered, saying, “Let not the foot of pride come against me; neither let the hand of the sinner remove me.” For if the foot of pride come, the hand of the sinner removeth. What is the hand of the sinner? The working of him that adviseth ill. Hast thou become proud? Quickly he corrupteth thee who adviseth ill. Humbly fix thyself in God, and care not much what is said to thee. Hence is that which is elsewhere spoken, “From my secret sins cleanse Thou me; and from others’ sins also keep Thy servant.” What is, “From my secret sins”? “Let not the foot of pride come against me.” What is, “From other men’s sins also keep Thy servant”? “Let not the hand of the wicked remove me.” Keep that which is within, and thou shalt not fear from without.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252036.html'
source_title="Exposition on Psalm 36"
