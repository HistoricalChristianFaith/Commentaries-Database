[[commentary]]
quote='''
This, then, they in no wise understood; and yet by occasion of this they foretold our salvation, that the Lord would go to the dispersion of the Gentiles, and would fulfill that which they read but did not understand. "A people whom I have not known served me, and by the hearing of the ear obeyed me," They before whose eyes He was, heard Him not; those heard Him in whose ears He was sounded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252031.html'
source_title="Tractates on John 31"

[[commentary]]
quote='''
“Thou shalt make Me the head of the Gentiles. A people whom I have not known have served Me.” The people of the Gentiles, whom in bodily presence I have not visited, have served Me. “At the hearing of the ear they have obeyed Me” (ver. 44). They have not seen Me with the eye: but, receiving my preachers, at the hearing of the ear they have obeyed Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"

[[commentary]]
quote='''
For they came to us with the Gospel; and that has been preached to us, which as yet we do not see, and which on hearing of it we believed, which by believing it, we shall come to see: even as the Bridegroom Himself speaks in the Prophet, “A people whom I have not known served me. In the hearing of me with the ear it obeyed me.” What is meant by on “hearing of me with the ear”? That they did not “see.” The Jews saw Him, and crucified Him; the Gentiles saw Him not, and believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"
