[[commentary]]
quote='''
Therefore, let us cry out to Him, as we have now sung: Have mercy on me, O God, have mercy on me, for my soul hopes in You. Have mercy on me, says, O God: why? Because my soul has hoped in You. This, says He, is the sacrifice which I offer to You, that You may hear me: because my soul has hoped in You. Who has hoped in God and been abandoned? It even happens in great temptations; and however much we progress in God, we live under pardon. Did not the Lord Jesus teach the little lambs, and not the rams themselves, to pray? His disciples, our Apostles, the very leaders of the flock, of whom we are the children, as it was said: Offer to the Lord the sons of rams; He was teaching those very rams to pray, when He told them to say: Forgive us our debts. If this daily prayer exists, we live under pardon. And all our sins were forgiven in baptism, and we live under pardon. We progress, if our hope in God is nurtured and strengthened by Him helping us, so that we restrain all lust. Let us fight: our struggle is known to Him, who knows how both to watch and to help.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252077A.html'
source_title="SERMON 77A:1"


[[commentary]]
quote='''
You cannot move to a good place from a bad place unless you have done well in the bad place. What kind of place is that? where no one hungers. Therefore, if you want to dwell in a good place where no one hungers, in this age break your bread for the hungry. Because in that blessed place no one is a stranger, everyone lives in their homeland; therefore, if you want to be in a good place, where you find a stranger in a bad place who has nowhere to enter, receive him into your home; offer hospitality in the bad place, so that you may come to a place where you cannot be a guest. In a good place no one needs clothing: there is no cold there, no heat there: why a roof? why clothes? Where there will not be a roof, but protection, behold, even there we find a roof: Under the shadow of your wings I will hope. Therefore, in this bad place provide a roof for someone who does not have one, so that you may be in a good place where you have such a roof that you will not seek to make patched roofs: because there the rain does not drip, where there is a perpetual fountain of truth. But that rain delights, it does not wet; that rain itself is the fountain of life. What is it: Lord, with you is the fountain of life? And the Word was with God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520217.html'
source_title="SERMON 217:5"

[[commentary]]
quote='''
We have heard in the Gospel just now, brethren, how loveth us our Lord and Saviour Jesus Christ, God with the Father, Man with us, out of our own selves, now at the right hand of the Father; ye have heard how much He loveth us.…

Because then this Psalm is singing of the Passion of the Lord, see what is the title that it hath: “at the end.” The end is Christ. Why hath He been called end? Not as one that consumeth, but one that consummateth.…

“At the end, corrupt not, for David himself, for the inscription of the title; when he fled from the face of Saul into a cavern.” We referring to holy Scripture, do find indeed how holy David, that king of Israel, from whom too the Psalter of David hath received the name thereof, had suffered for persecutor Saul the king of his own people, as many of you know that have either read or have heard the Scriptures. King David had then for persecutor Saul: and whereas the one was most gentle, the other most ferocious: the one mild, the other envious; the one patient, the other cruel; the one beneficent, the other ungrateful: he endured him with so much mildness, that when he had gotten him into his hands him he touched not, hurt not.…What reference hath this to Christ? If all things which then were being done, were figures of things future, we find there Christ, and by far in the greatest degree. For this, “corrupt not for the inscription of the title,” I see not how it belongeth to that David. For not any “title” was inscribed over David himself which Saul would “corrupt.” But we see in the Passion of the Lord that there had been written a title, “King of the Jews:” in order that this title might put to the blush these very men, seeing that from their King they withheld not their hands. For in them Saul was, in Christ David was. For Christ, as saith the Apostolic Gospel, is, as we know, as we confess, of the seed of David after the flesh; for after the Godhead He is above David, above all men, above heaven and earth, above angels, above all things visible and invisible.…And because already it had been sung through the Holy Spirit, “Unto the end, corrupt not, for the inscription of the title:” Pilate answered them, “What I have written, I have written:” why do ye suggest to me falsehood? I corrupt not truth.

What therefore is, “When he fled from the face of Saul into a cavern”? Which thing indeed the former David also did: but because in him we find not the inscription of the title, in the latter let us find the flight into the cavern. For that cavern wherein David hid himself did figure somewhat. But wherefore hid he himself? It was in order that he might be concealed and not be found. What is to be hidden in a cavern? To be hidden in earth. For he that fleeth into a cavern, with earth is covered so that he may not be seen. But Jesus did carry earth, flesh which He had received from earth: and in it He concealed Himself, in order that by Jews He might not be discovered as God. “For if they had known, never the Lord of glory would they have crucified.” Why therefore the Lord of glory found they not? Because in a cavern He had hidden Himself, that is, the flesh’s weakness to their eyes He presented, but the Majesty of the Godhead in the body’s clothing, as though in a hiding-place of the earth, He hid.…But wherefore even unto death willed He to be patient? It was in order that He might flee from the face of Saul into a cavern. For a cavern may be understood as a lower part of the earth. And certainly, as is manifest and certain to all, His Body in a Tomb was laid, which was cut in a Rock. This Tomb therefore was the Cavern; thither He fled from the face of Saul. For so long the Jews did persecute Him, even until He was laid in a cavern. Whence prove we that so long they persecuted Him, until therein He was laid? Even when dead, and, on the Cross hanging, with lance they wounded Him. But when shrouded, the funeral celebrated, He was laid in a cavern, no longer had they anything which to the Flesh they might do. Rose therefore the Lord again out of that cavern unhurt, uncorrupt, from that place whither He had fled from the face of Saul: concealing Himself from ungodly men, whom Saul prefigured, but showing Himself to His members. For the members of Him rising again by His members were handled: for the members of Him, the Apostles, touched Him rising again and believed; and behold nothing profited the persecution of Saul. Hear we therefore now the Psalm; because concerning the title thereof enough we have spoken, as far as the Lord hath deigned to give.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"

[[commentary]]
quote='''
“Have pity on me, O God, have pity on me, for in Thee hath trusted my Soul” (ver. 1). Christ in the Passion saith, “Have pity on Me, O God.” To God, God saith, “Have pity on Me!” He that with the Father hath pity on thee, in thee crieth, “Have pity on Me.” For that part of Him which is crying, “Have pity on Me,” is thine: from thee this He received, for the sake of thee, that thou shouldest be delivered, with Flesh He was clothed. The flesh itself crieth: “Have pity on Me, O God, have pity on me:” Man himself, soul and flesh. For whole Man did the Word take upon Him, and whole Man the Word became. Let it not therefore be thought that there Soul was not, because the Evangelist thus saith: “The Word was made flesh, and dwelled in us.” For man is called flesh, as in another place saith the Scripture, “And all flesh shall see the salvation of God.” Shall anywise flesh alone see, and shall Soul not be there?…Thou hearest the Master praying, learn thou to pray. For to this end He prayed, in order that He might teach how to pray: because to this end He suffered, in order that He might teach how to suffer; to this end He rose again, in order that He might teach how to hope for rising again. “And in the shadow of Thy wings I will hope, until iniquity pass over.” This now evidently whole Christ doth say: here is also our voice. For not yet hath passed over, still rife is iniquity. And in the end our Lord Himself said there should be an abounding of iniquity: “And since iniquity shall abound, the love of many shall wax cold; but he that shall have persevered unto the end, the same shall be saved.” But who shall persevere even unto the end, even until iniquity pass over? He that shall have been in the Body of Christ, he that shall have been in the members of Christ, and from the Head shall have learned the patience of persevering. Thou passest away, and behold passed are thy temptations; and thou goest into another life whither have gone holy men, if holy thou hast been. Into another life have gone Martyrs; if Martyr thou shalt have been, thou also goest into another life. Because “thou” hast passed away hence, hath by any means iniquity therefore passed away? There are born other unrighteous men, as there die some unrighteous men. In like manner therefore as some unrighteous men die and others are born: so some just men go, and others are born. Even unto the end of the world neither iniquity will be wanting to oppress, nor righteousness to suffer.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"
