[[commentary]]
quote='''
(de Con. Evan. ii. 77) Matthew adds: And then shall the end come. (Matt. 24:14) Mark, however, by the word first means before the end come.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Again, what Matthew states in this form, "And this gospel of the kingdom shall be preached in all the world for a witness unto all nations, and then shall the end come," is given also in the same connection by Mark in the following manner: "And the gospel must first be published among all nations." Mark has not added the words, "and then shall the end come;" but he indicates what they express, when he uses the phrase "first "in the sentence, "And the gospel must first be published among all nations." For they had asked Him about the end. And therefore, when He addresses them thus, "The gospel must first be published among all nations," the term "first" clearly suggests the idea of something to be done before the consummation should come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 77"
