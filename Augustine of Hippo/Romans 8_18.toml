[[commentary]]
quote='''
The humble and holy servants of God who suffer doubly when temporal evils befall them, because they suffer with the wicked as well as at their hands, have their own consolations and the hope of the world to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 111"

[[commentary]]
quote='''
It is for that destination that our hearts are being disciplined in all the troubles and trials of this life. Wonder not that it is in trouble that thou art disciplined for it. It is for something glorious that thou art being disciplined. Whence comes that speech of the now strengthened righteous man: “The sufferings of this present time are not worthy to be compared to the glory which shall be revealed in us”? What is that promised glory to be, but to be made equal to the Angels and to see God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"
