[[commentary]]
quote='''
Because therefore the Jews might say, when the Lord did miracles, Moses hath done these things, Elias hath done, Eliseus hath done them: they might for themselves say these words, because those men also did raise to life dead men, and did many miracles: therefore when from Him a sign was demanded, of the peculiar sign making mention which in Himself alone was to be, He saith, “This generation crooked and provoking seeketh a sign, and a sign shall not be given to it, except the sign of Jonas the Prophet: for as Jonas was in the belly of the whale three days and three nights, so shall be also the Son of Man in the heart of the earth three days and three nights.” In what way was Jonas in the belly of the whale? Was it not so that afterwards alive he was vomited out? Hell was to the Lord what the whale was to Jonas. This sign peculiar to Himself He mentioned, this is the most mighty sign. It is more mighty to live again after having been dead, than not to have been dead. The greatness of the power of the Lord as He was made Man, in the virtue of the Resurrection doth appear.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252066.html'
source_title="Exposition on Psalm 66"
