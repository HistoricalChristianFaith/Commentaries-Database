[[commentary]]
quote='''
“He loveth Mercy and Judgment:” for He loveth Mercy, which now He showeth first; and Judgment, wherewith He exacteth that which He hath first shown. “The earth is full of the Mercy of the Lord” (ver. 5): throughout the whole world are sins forgiven unto men by the Mercy of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
