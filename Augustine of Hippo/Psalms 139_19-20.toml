[[commentary]]
quote='''
And then He telleth what meanwhile, during this whole time when He already has risen, and remaineth still with the Father, He suffereth by the intermixture of sinners in His Body, the Church, and by the separation of heretics. “If Thou, O God, shalt slay the sinners (since Thou shalt say in Thy thought, Depart from Me, ye men of blood), they shall receive in vanity their cities” (ver. 19, 20). The words seem to be connected in this order; “If Thou, O God, shalt slay the sinners, they shall receive in vanity their cities.” Thus are sinners slain, because, “having their understandings darkened, they are alienated from the life of God.” For on account of elation they lose confession, and so they are slain, and in them is fulfilled what Scripture saith, “Confession perisheth from the dead, as from one that is not.” And so “they receive in vanity their cities,” that is, their vain peoples, who follow their vanity; when, puffed up by the name of righteousness, they persuade men to burst the bond of unity, and blindly and ignorantly follow them, as being more righteous.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520139.html'
source_title="Exposition on Psalm 139"
