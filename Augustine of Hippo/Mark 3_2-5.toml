[[commentary]]
quote='''
But it is possible that a difficulty may be felt in the circumstance that Matthew has told us how the people put this question to the Lord, "Is it lawful to heal on the Sabbath-day?" wishing thereby to find an occasion for accusing Him; and that in reply He set before them the parable of the sheep in these terms: "What man shall there be among you that shall have one sheep, and if it fall into a pit on the Sabbath-day, will he not lay hold on it and lift it out? How much, then, is a man better than a sheep? Wherefore it is lawful to do well on the Sabbath-days;" whereas Mark and Luke rather represent the people to have had this question put to them by the Lord, "Is it lawful to do good on the Sabbath-day, or to do evil? to save life, or to kill?" We solve this difficulty, however, by the supposition that the people in the first instance asked the Lord, "Is it lawful to heal on the Sabbath-day?" that thereupon, knowing the thoughts of the men who were thus seeking an occasion for accusing Him, He set the man whom He had been on the point of healing in their midst, and addressed to them the interrogations which Mark and Luke mention to have been put; that, as they remained silent, He next put before them the parable of the sheep, and drew the conclusion that it was lawful to do good on the Sabbath-day; and that, finally, when He had looked round about on them with anger, as Mark tells us, being grieved for the hardness of their hearts, He said to the man, "Stretch forth thine hand."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 35"
