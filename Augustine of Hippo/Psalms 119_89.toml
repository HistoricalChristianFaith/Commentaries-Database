[[commentary]]
quote='''
The man who speaketh in this Psalm, as if he were tired of human mutability, whence this life is full of temptations, among his tribulations, on account of which he had above said, “The wicked have persecuted me;” and, “They have almost made an end of me upon earth” (ver. 89); burning with longings for the heavenly Jerusalem; looked up to the realms above, and said, “O Lord, Thy word endureth for ever in heaven;” that is, among Thy Angels who serve everlastingly in Thine armies, without desertion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
