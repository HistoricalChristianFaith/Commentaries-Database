[[commentary]]
quote='''
And he that went out was himself the night. "Therefore when" the night "was gone out, Jesus said, Now is the Son of man glorified." The day therefore uttered speech unto the day, that is, Christ did so to His faithful disciples, that they might hear and love Him as His followers; and the night showed knowledge unto the night, that is, Judas did so to the unbelieving Jews, that they might come as His persecutors, and make Him their prisoner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252062.html'
source_title="Tractates on John 62"

[[commentary]]
quote='''
“Day unto day uttereth word” (ver. 2). To the spiritual the Spirit giveth out the fulness of the unchangeable Wisdom of God, the Word which in the beginning is God with God. “And night unto night announceth knowledge.” And to the fleshly, as to those afar off, the mortality of the flesh, by conveying faith, announceth future knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252019.html'
source_title="Exposition on Psalm 19"
