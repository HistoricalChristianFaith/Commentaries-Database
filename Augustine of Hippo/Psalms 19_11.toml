[[commentary]]
quote='''
“For Thy servant keepeth them” (ver. 11). For to him who keepeth them not the day of the Lord is bitter. “In keeping them there is great reward.” Not in any external benefit, but in the thing itself, that God’s judgments are kept, is there great reward; great because one rejoiceth therein.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252019.html'
source_title="Exposition on Psalm 19"
