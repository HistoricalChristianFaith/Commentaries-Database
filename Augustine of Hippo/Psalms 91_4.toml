[[commentary]]
quote='''
“Between the shoulders,” however. This is indeed a part of the body, it is a part about the region of the heart, at the hinder parts however, that is, at the back: which part of that dove silvered he saith is “in the greenness of gold,” that is, in the vigour of wisdom, which vigour I think cannot be better understood than by love. But why on the back, and not on the breast? Although I wonder in what sense this word is put in another Psalm, where there is said, “Between His shoulders He shall overshadow thee, and under His wings thou shalt hope:” forasmuch as under wings there cannot be overshadowed anything but what shall be under the breast. And in Latin, indeed, “between the shoulders,” perchance in some degree of both parts may be understood, both before and behind, that we may take shoulders to be the parts which have the head betwixt them; and in Hebrew perchance the word is ambiguous, which may in this manner also be understood: but the word that is in the Greek, μετάφρενα, signifieth not anything but at the back, which is “between the shoulders.” Is there for this reason there the greenness of gold, that is, wisdom and love, because in that place there are in a manner the roots of the wings? or because in that place is carried that light burden? For what are even the wings themselves, but the two commandments of love, whereon hangeth the whole Law and the Prophets? what is that same light burden, but that same love which in these two commandments is fulfilled? For whatever thing is difficult in a commandment, is a light thing to a lover. Nor on any other account is rightly understood the saying, “My burden is light,” but because He giveth the Holy Spirit, whereby love is shed abroad in our hearts, in order that in love we may do freely that which he that doeth in fear doeth slavishly; nor is he a lover of what is right, when he would prefer, if so be it were possible, that what is right should not be commanded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"

[[commentary]]
quote='''
“He shall defend thee between His shoulders, and thou shalt hope under His wings” (ver. 4). He says this, that thy protection may not be to thee from thyself, that thou mayest not imagine that thou canst defend thyself; He will defend thee, to deliver thee from the hunter’s snare, and from an harsh word. The expression, “between His shoulders,” may be understood both in front and behind: for the shoulders are about the head; but in the words, “thou shalt hope under His wings,” it is clear that the protection of the wings of God expanded places thee between His shoulders, so that God’s wings on this side and that have thee in the midst, where thou shalt not fear lest any one hurt thee: only be thou careful never to leave that spot, where no foe dares approach. If the hen defends her chickens beneath her wings; how much more shalt thou be safe beneath the wings of God, even against the devil and his angels, the powers who fly about in mid air like hawks, to carry off the weak young one? For the comparison of the hen to the very Wisdom of God is not without ground; for Christ Himself, our Lord and Saviour, speaks of Himself as likened to a hen; “how often would I have gathered thy children,” etc. That Jerusalem would not: let us be willing.…If you consider other birds, brethren, you will find many that hatch their eggs, and keep their young warm: but none that weakens herself in sympathy with her chickens, as the hen does. We see swallows, sparrows, and storks outside their nests, without being able to decide whether they have young or no: but we know the hen to be a mother by the weakness of her voice, and the loosening of her feathers: she changes altogether from love for her chickens: she weakens herself because they are weak. Thus since we were weak, the Wisdom of God made Itself weak, when the Word was made flesh, and dwelt in us, that we might hope under His wings.

“His truth shall surround thee with a shield” (ver. 5). What are “the wings,” the same is “the shield:” since there are neither wings nor shield. If either were literally, how could the one be the same as the other? can wings be a shield or a shield wings? But all these expressions, indeed, are figuratively used through likenesses. If Christ were really a Stone, He could not be a Lion; if a Lion, He could not be a Lamb: but He is called both Lion, and Lamb, and Stone, and Calf, and anything else of the sort, metaphorically, because He is neither Stone, nor Lion, nor Lamb, nor Calf, but Jesus Christ, the Saviour of all of us, for these are likenesses, not literal names. “His truth shall be thy shield,” it is said: a shield to assure us that He will not confound those whose trust is in themselves with those who hope in God. One is a sinner, and the other a sinner: but suppose one that presumes upon himself is a despiser, confesses not his sins, and he will say, if my sins displeased God, He would not suffer me to live. But another dared not even raise his eyes, but beat upon his breast, saying, “God be merciful to me a sinner.” Both this was a sinner, and that: but the one mocked, the other mourned: the one was a despiser, the other a confessor, of his sins. But the truth of God, which respects not persons, discerns the penitent from him who denies his sin, the humble from the proud, him who presumes upon himself from him who presumes on God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"
