[[commentary]]
quote='''
Inasmuch as the hand of our Maker in our very hearts hath written this truth, “That which to thyself thou wouldest not have done, do not thou to another.” Of this truth, even before that the Law was given, no one was suffered to be ignorant, in order that there might be some rule whereby might be judged even those to whom Law had not been given. But lest men should complain that something had been wanting for them, there hath been written also in tables that which in their hearts they read not. For it was not that they had it not written, but read it they would not. There hath been set before their eyes that which in their conscience to see they would be compelled; and as if from without the voice of God were brought to them, to his own inward parts hath man been thus driven, the Scripture saying, “For in the thoughts of the ungodly man there will be questioning.” Where questioning is, there is law. But because men, desiring those things which are without, even from themselves have become exiles, there hath been given also a written law: not because in hearts it had not been written, but because thou wast a deserter from thy heart, thou art seized by Him that is everywhere, and to thyself within art called back. Therefore the written law, what crieth it, to those that have deserted the law written in their hearts? “Return ye transgressors to the heart.” For who hath taught thee, that thou wouldest have no other man draw near thy wife? Who hath taught thee, that thou wouldest not have a theft committed upon thee? Who hath taught thee, that thou wouldest not suffer wrong, and whatever other thing either universally or particularly might be spoken of? For many things there are, of which severally if questioned men with loud voice would answer, that they would not suffer. Come, if thou art not willing to suffer these things, art thou by any means the only man? dost thou not live in the fellowship of mankind? He that together with thee hath been made, is thy fellow; and all men have been made after the image of God, unless with earthly covetings they efface that which He hath formed. That which therefore to thyself thou wilt not have to be done, do not thou to another. For thou judgest that there is evil in that, which to suffer thou art not willing: and this thing thou art constrained to know by an inward law; that in thy very heart is written. Thou wast doing somewhat, and there was a cry raised in thy hands: how art thou constrained to return to thy heart when this thing thou sufferest in the hands of others? Is theft a good thing? No! I ask, is adultery a good thing? All cry, No! Is man-slaying a good thing? All cry, that they abhor it. Is coveting the property of a neighbour a good thing? No! is the voice of all men. Or if yet thou confessest not, there draweth near one that coveteth thy property: be pleased to answer what thou wilt have. All men therefore, when of these things questioned, cry that these things are not good. Again, of doing kindnesses, not only of not hurting, but also of conferring and distributing, any hungry soul is questioned thus: “thou sufferest hunger, another man hath bread, and there is abundance with him beyond sufficiency, he knoweth thee to want, he giveth not: it displeaseth thee when hungering, let it displease thee when full also, when of another’s hungering thou shalt have known. A stranger wanting shelter cometh into thy country, he is not taken in: he then crieth that inhuman is that city, at once among barbarians he might have found a home. He feeleth the injustice because he suffereth; thou perchance feelest not, but it is meet that thou imagine thyself also a stranger; and that thou see in what manner he will have displeased thee, who shall not have given that, which thou in thy country wilt not give to a stranger.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
