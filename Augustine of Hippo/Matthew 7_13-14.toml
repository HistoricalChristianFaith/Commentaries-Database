[[commentary]]
quote='''
(De Trin. viii. 7.) Otherwise; Scripture does not mention the love of God, where it says, All things whatsoever ye would; because he who loves his neighbour must consequently love Love itself above all things; but God is Love; therefore he loves God above all things.

(Serm. in Mont. ii. 22.) The Lord had warned us above to have a heart single and pure with which to seek God; but as this belongs to but few, He begins to speak of finding out wisdom. For the searching out and contemplation whereof there has been formed through all the foregoing such an eye as may discern the narrow way and strait gate; whence He adds, Enter ye in at the strait gate.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He says this not because the Lord's yoke is rough or his burden heavy but because there are a few who wish their labors to end. They do not put their full trust in the Lord when he cries, "Come to me, all you who labor, and I will give you rest. Take my yoke upon you, and learn from me, for I am meek and humble of heart.… For my yoke is easy, and my burden light." Hence the humble and the meek of heart are named at the very beginning of this sermon. But because there are many who spurn this smooth yoke and this light burden, it comes to pass that the way that leads to life is demanding and the entry gate is narrow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOUR%2520LORD%2527S%2520SERMON%2520ON%2520THE%2520MOUNT%2FBook%25202.html'
source_title="SERMON ON THE MOUNT 2.23.77"

[[commentary]]
quote='''
It is as if He said, “Ye are placed in the midst of tribulation; ye are suffering many things; ye have already lost many things that ye loved in this life: but I have not abandoned you on the way, the narrow way that I am teaching you. Ye were seeking “broad ways.” What do I tell you? This is the way we go to everlasting life; by the way ye wish to walk, ye are going to death. How “broad and wide is the road that leads to destruction: and” how “many there be that find it! How strait and narrow the way that leadeth unto life, and” how “few there be” that walk therein! Who are the few? They who patiently endure tribulations, patiently endure temptations; who in all these troubles do not “fall away:” who do not rejoice in the word “for a season” only; and in the time of tribulation fade away, as on the sun’s arising; but who have the “root” of “love,” according to what we have lately heard read in the Gospel.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252044.html'
source_title="Exposition on Psalm 44"
