[[commentary]]
quote='''
(de Ver. Dom. s. lii) And said, Where have ye laid him? He knew where, but He asked to try the faith of the people.

(lib. 83. Quaest. qu. lxv.) The question has an allusion too to our hidden calling. That predestination by which we are called, is hidden; and the sign of its being so is our Lord asking the question: He being as it were in ignorance, so long as we are ignorant ourselves. Or because our Lord elsewhere shows that He knows not sinners, saying, I know you not, (Matt. 7:23) because in keeping His commandments there is no sin.
They said unto Him, Lord, come and see.

(Tr. xlix. 20.) The Lord sees when He pities, as we read, Look upon my adversity and misery, and forgive me all my sin. (Ps. 24:18.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And He said, Where have ye laid him?" Thou knewest that he was dead, and art Thou ignorant of the place of his burial? The meaning here is, that a man thus lost becomes, as it were, unknown to God. I have not ventured to say, Is unknown-for what is unknown to Him? but, As it were unknown. And how do we prove this? Listen to the Lord, who will yet say in the judgment, "I know you not: depart from me." What does that mean, "I know you not"? I see you not in that light of mine-in that righteousness which I know. So here, also, as if knowing nothing of such a sinner, He said, "Where have ye laid him?" Similar in character was God's voice in Paradise after man had sinned: "Adam, where art thou?" "They say unto Him, Lord, come and see." What means this "see"? Have pity. For the Lord sees when He pities. Hence it is said to Him, "Look upon my humility [affliction] and my pain, and forgive all my sins."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"
