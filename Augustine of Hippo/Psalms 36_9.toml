[[commentary]]
quote='''
Christ … is man and God. He prays as man and gives what he prays for as God. Now what you have to grasp is that he assigns everything to the Father for the simple reason that the Father is not from him, but he is from the Father. He gives everything to the fount from which he is derived. But he too is the fount born of the Father; he is himself the "fountain of life." So the Father as fount begot the fountain; fountain indeed begot fountain; but begetting fountain and begotten fountain are one fountain. Just as God begetting and God begotten, namely, the Son born of the Father, are one God. The Father is not the Son, the Son is not the Father; the Father is not from the Son, the Son is from the Father; but still Father and Son are one thing … because of their inseparable divinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520217.html'
source_title="SERMON 217:1"

[[commentary]]
quote='''
What light? "In the beginning was the Word, and the Word was with God." Let us see if this is light. "For with Thee is the fountain of light, and in Thy light shall we see light." On earth, fountain is one thing, light another. When thirsting, thou seekest a fountain, and to get to the fountain thou seekest light; and if it is not day, thou lightest a lamp to get to the fountain. That fountain is the very light: to the thirsting a fountain, to the blind a light. Let the eyes be opened to see the light, let the lips of the heart be opened to drink of the fountain; that which thou drinkest, thou seest, thou hearest. God becomes all to thee; for He is to thee the whole of these things which thou lovest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252013.html'
source_title="Tractates on John 13"
