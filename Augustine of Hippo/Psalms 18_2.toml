[[commentary]]
quote='''
“O Lord, My stay, and My refuge, and My deliverer” (ver. 2). O Lord, who hast stayed Me, because I sought refuge with Thee: and I sought refuge, because Thou hast delivered Me. “My God is My helper; and I will hope in Him.” My God, who hast first afforded me the help of Thy call, that I might be able to hope in Thee. “My defender, and the horn of My salvation, and My redeemer.” My defender, because I have not leant upon Myself, lifting up as it were the horn of pride against Thee; but have found Thee a horn indeed, that is, the sure height of salvation: and that I might find it, Thou redeemedst Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
