[[commentary]]
quote='''
We read also what Joash, king of Israel, said when he sent a message to Amaziah, king of Judah, who wanted to fight with him. After certain other words, he added, "Now tarry at home; why dost thou challenge me to thine hurt, that thou shouldest fall, even thou, and Judah with thee?" Then the Scripture has added this sequel: "But Amaziah would not hear; for it came of God, that he might be delivered into their hands, because they sought after the gods of Edom." Behold, now, how God, wishing to punish the sin of idolatry, wrought this in this man's heart, with whom He was indeed justly angry, not to listen to sound advice, but to despise it, and go to the battle, in which he with his army was routed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 42"
