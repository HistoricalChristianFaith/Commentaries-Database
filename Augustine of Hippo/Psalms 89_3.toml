[[commentary]]
quote='''
“Thou hast said, I have made a covenant with My chosen” (ver. 3). What covenant, but the new, by which we are renewed to a fresh inheritance, in our longing desire and love of which we sing a new song. “I have made a covenant with My chosen,” saith the Psalmist: “I have sworn unto David My servant.” How confidently does he speak, who understands, whose mouth serves truth! I speak without fear; since “Thou hast said.” If Thou makest me fearless, because Thou hast said, how much more so dost Thou make me, when Thou hast sworn! For the oath of God is the assurance of a promise. Man is justly forbidden to swear: lest by the habit of swearing, since a man may be deceived, he fall into perjury. God alone swears securely, because He alone is infallible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
