[[commentary]]
quote='''
“The Voice of the Lord is upon the waters” (ver. 3). The Voice of Christ is upon the peoples. “The God of majesty hath thundered.” The God of majesty, from the cloud of the flesh, hath awfully preached repentance. “The Lord is upon many waters.” The Lord Jesus Himself, after that He sent forth His Voice upon the peoples, and struck them with awe, converted them to Himself, and dwelt in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252029.html'
source_title="Exposition on Psalm 29"
