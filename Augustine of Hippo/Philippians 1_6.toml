[[commentary]]
quote='''
And who was it that had begun to give him his love, however small, but He who prepares the will, and perfects by His co-operation what He initiates by His operation? Forasmuch as in beginning He works in us that we may have the will, and in perfecting works with us when we have the will. On which account the apostle says, "I am confident of this very thing, that He which hath begun a good work in you will perform it until the day of Jesus Christ." He operates, therefore, without us, in order that we may will; but when we will, and so will that we may act, He co-operates with us. We can, however, ourselves do nothing to effect good works of piety without Him either working that we may will, or co-working when we will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 33"
