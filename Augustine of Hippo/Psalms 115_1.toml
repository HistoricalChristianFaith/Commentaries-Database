[[commentary]]
quote='''
When Jesus was entrusting Peter with his sheep, he was entrusting him with us. When he was entrusting Peter with us, he was entrusting the church with his members. So, Lord, entrust your church to your church, let your church entrust itself to you. After all, we say, "Not to us, Lord, not to us, but to your name give the glory." I mean, what are we without you? Only Peter when he denied you three times. To show up Peter to himself, that is to show up Peter to Peter, the Lord turned his face away from him for a while—and Peter denied him. He turned his face toward him when he looked around—and he wept. Peter washed away his fault with his tears; he poured water from his eyes and baptized his conscience.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520229P.html'
source_title="SERMON 229P.4"

[[commentary]]
quote='''
“Not unto us, O Lord, not unto us, but unto Thy Name give the praise” (ver. 1). For that grace of the water that gushed from the rock (“now that rock was Christ”), was not given on the score of works that had gone before, but of His mercy “that justifieth the ungodly.” For “Christ died for sinners,” that men might not seek any glory of their own, but in the Lord’s Name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520115.html'
source_title="Exposition on Psalm 115"
