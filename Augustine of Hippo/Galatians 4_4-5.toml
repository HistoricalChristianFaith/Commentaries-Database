[[commentary]]
quote='''
We ask the apostle, and he says to us, since we are not under the law but under grace. "He sent therefore His Son, made of a woman, made under the law, that He might redeem those who were under the law, that we might receive the adoption of sons." Behold, for this end Christ came, that He might redeem those who were under the law; that now we may not be under the law, but under grace. Who, then, gave the law? He gave the law who gave likewise grace; but the law He sent by a servant, with grace He Himself came down. And in what manner were men made under the law? By not fulfilling the law. For he who fulfills the law is not under the law, but with the law;but he who is under the law is not raised up, but pressed down by the law. All men, therefore, being placed under the law, are by the law made guilty; and for this purpose it is over their head, that it may show sins, not take them away. The law then commands, the Giver of the law showeth pity in that which the law commands. Men, endeavoring by their own strength to fulfill that which the law commands, fell by their own rash and headstrong presumption; and not with the law, but under the law, became guilty: and since by their own strength they were unable to fulfill the law, and were become guilty under the law, they implored the aid of the Deliverer; and the guilt which the law brought caused sickness to the proud. The sickness of the proud became the confession of the humble. Now the sick confess that they are sick; let the physician come to heal the sick.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"

[[commentary]]
quote='''
But even although Luke had said that Joseph was begotten by Heli, that expression ought not to disturb us to such an extent as to lead us to believe anything else than that by the one evangelist the father begetting was mentioned, and by the other the father adopting. For there is nothing absurd in saying that a person has begotten, not after the flesh, it may be, but in love, one whom he has adopted as a son. Those of us, to wit, to whom God has given power to become His sons, He did not beget of His own nature and substance, as was the case with His only Son; but He did indeed adopt us in His love. And this phrase the apostle is seen repeatedly to employ just in order to distinguish from us the only-begotten Son who is before every creature, by whom all things were made, who alone is begotten of the substance of the Father; who, in accordance with the equality of divinity, is absolutely what the Father is, and who is declared to have been sent with the view of assuming to Himself the flesh proper to that race to which we too belong according to our nature, in order that by His participation in our mortality, through His love for us, He might make us partakers of His own divinity in the way of adoption. For the apostle speaks thus: "But when the fulness of time was come, God sent forth His Son, made of a woman, made under the law, to redeem them that were under the law, that we might receive the adoption of sons." And yet we are also said to be born of God,—that is to say, in so far as we, who already were men, have received power to be made the sons of God,—to be made such, moreover, by grace, and not by nature. For if we were sons by nature, we never could have been aught else. But when John said, "To them gave He power to become the sons of God, even to them that believe on His name," he proceeded at once to add these words, "which were born not of blood, nor of the will of the flesh, nor of the will of man, but of God." Thus, of the same persons he said, first, that having received power they became the sons of God, which is what is meant by that adoption which Paul mentions; and secondly, that they were born of God. And in order the more plainly to show by what grace this is effected, he continued thus: "And the Word was made flesh, and dwelt among us,"—as if he meant to say, What wonder is it that those should have been made sons of God, although they were flesh, on whose behalf the only Son was made flesh, although He was the Word? Howbeit there is this vast difference between the two cases, that when we are made the sons of God we are changed for the better; but when the Son of God was made the son of man, He was not indeed changed into the worse, but He did certainly assume to Himself what was below Him. James also speaks to this effect: "Of His own will begat He us by the word of truth, that we should be a kind of first fruits of His creatures." And to preclude our supposing, as it might appear from the use of this term "begat," that we are made what He is Himself, he here points out very plainly, that what is conceded to us in virtue of this adoption, is a kind of headship among the creatures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 3"
