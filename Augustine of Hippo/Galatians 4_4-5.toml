[[commentary]]
quote='''
We ask the apostle, and he says to us, since we are not under the law but under grace. "He sent therefore His Son, made of a woman, made under the law, that He might redeem those who were under the law, that we might receive the adoption of sons." Behold, for this end Christ came, that He might redeem those who were under the law; that now we may not be under the law, but under grace. Who, then, gave the law? He gave the law who gave likewise grace; but the law He sent by a servant, with grace He Himself came down. And in what manner were men made under the law? By not fulfilling the law. For he who fulfills the law is not under the law, but with the law;but he who is under the law is not raised up, but pressed down by the law. All men, therefore, being placed under the law, are by the law made guilty; and for this purpose it is over their head, that it may show sins, not take them away. The law then commands, the Giver of the law showeth pity in that which the law commands. Men, endeavoring by their own strength to fulfill that which the law commands, fell by their own rash and headstrong presumption; and not with the law, but under the law, became guilty: and since by their own strength they were unable to fulfill the law, and were become guilty under the law, they implored the aid of the Deliverer; and the guilt which the law brought caused sickness to the proud. The sickness of the proud became the confession of the humble. Now the sick confess that they are sick; let the physician come to heal the sick.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"
