[[commentary]]
quote='''
(Tr. cxi. 5) And I have made known Thy name to them by faith, and will make it known by sight: that the love wherewith Thou hast loved Me may be in them. (2 Tim. 4:7) The Apostle uses a like phrase, I have fought a good fight, by a good fight being the more common form. The love wherewith the Father loveth the Son in us, can only be in us because we are His members, and we are loved in Him when He is loved wholly, i. e. both head and body. And therefore He adds, And I in them; He is in us, as in His temple, we in Him as our Head.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"
