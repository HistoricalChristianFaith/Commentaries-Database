[[commentary]]
quote='''
Who is “our God,” that praise should be pleasant to Him? He maketh Himself sweet to us, He commendeth Himself to us; thanks to His condescension.…“But God commendeth His love to us”…“in that, while we were yet sinners, Christ died for us.”…Let us see whether it be the commendation which the Apostle speaketh of, that Christ died for the sinners and ungodly: “the Lord who buildeth up Jerusalem, and gathereth the dispersions of Israel” (ver. 2). For the people of Jerusalem are the people of Israel. It is Jerusalem “eternal in the heavens,” whereof the Angels are citizens also.…All the citizens then of that city, through “seeing God,” rejoice in that great and wide and heavenly city; they gaze upon God Himself. But we are wanderers from that city, driven out by sin, that we should not remain there; weighed down by mortality, that we should not return thither. God looked back on our wandering, and He who “buildeth up Jerusalem,” restored the part that had fallen. How restored He the part that had fallen?…He sent then to our captive estate His Son as a Redeemer. Take with Thee, said He, a bag, bear therein the price of the captives. For He put on Him our mortal flesh, and therein was the Blood, by the shedding of which we were to be redeemed. With that Blood He “gathered the dispersions of Israel.” And if He gathered them that before were dispersed, how must we strive that they be gathered who now are dispersed? If the dispersed have been gathered, that in the Hand of the Builder they might be fashioned into the building, how should they be gathered who through disquiet have fallen from the Hand of the Builder? Behold whom we praise; behold to whom we owe praise all our life long.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
