[[commentary]]
quote='''
Ye have shamed the counsel of the poor, for the Lord is his hope” (ver. 6): that is, ye have despised the humble coming of the Son of God, because ye saw not in Him the pomp of the world: that they, whom he was calling, should put their hope in God alone, not in the things that pass away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252014.html'
source_title="Exposition on Psalm 14"
