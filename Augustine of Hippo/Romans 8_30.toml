[[commentary]]
quote='''
God elected believers in order that they might believe, not because they already believed.
'''
source_url=''
source_title="PREDESTINATION OF THE SAINTS 17.34"

[[commentary]]
quote='''
“For Himself is my God and My Saving One, my Taker up, I will not remove hence” (ver. 6). Because “Himself is my God,” therefore He calleth me: “and my Saving One,” therefore He justifieth me: “and my Taker up,” therefore He glorifieth me. For here I am called and am justified, but there I am glorified; and from thence where I am glorified, “I will not remove.” For a sojourner I am with Thee on earth as all my fathers were. Therefore from my lodging I shall remove, from my Heavenly home I shall not remove. “In God is my salvation and my glory” (ver. 7). Saved I shall be in God, glorious I shall be in God: for not only saved, but also glorious, saved, because a just man I have been made out of an ungodly man, by Him justified; but glorious, because not only justified, but also honoured. For “those whom He hath predestined, those also He hath called.” Calling them, what hath He done here? “Whom He hath called, the same also He hath justified; but whom He hath justified, the same also He hath glorified.” Justification therefore to salvation belongeth, glorifying to honour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"
