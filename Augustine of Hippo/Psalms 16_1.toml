[[commentary]]
quote='''
The inscription of the title, of David himself.

Our King in this Psalm speaks in the character of the human nature He assumed, of whom the royal title at the time of His passion was eminently set forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252016.html'
source_title="Exposition on Psalm 16"
