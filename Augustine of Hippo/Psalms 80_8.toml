[[commentary]]
quote='''
“A vineyard out of Egypt Thou hast brought over, Thou hast cast out the nations, and hast planted her” (ver. 8). It was done, we know. How many nations were cast out? Amorites, Cethites, Jebusites, Gergesites, and Evites: after whose expulsion and overthrow, there was led in the people delivered out of Egypt, into the land of promise. Whence the vineyard was cast out, and where she was planted, we have heard. Let us see what next was done, how she believed, how much she grew, what ground she covered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"
