[[commentary]]
quote='''
(ut sup.) Our Lord feedeth by plain words, exerciseth by obscure. For when two persons, one godly, the other ungodly, hear the words of the Gospel, and they happen to be such that neither can understand them; one says, What He saith is true and good, but we do not understand it: the other says, It is not worth attending to. The former, in faith, knocks, yea, and, if he continue to knock, it shall be opened unto him. The latter shall hear the words in Isaiah, If ye will not believe, surely ye shall not be established. (Isa. 7:9)

(Tr. xlv. 8) Lo, the very door which He had shut up, He openeth; He is the Door: let us enter, and let us enter with joy.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Let us begin, then, with hearing His exposition of what we have heard Him propounding. "Then said Jesus unto them again, Verily, verily, I say unto you, I am the door of the sheep." See, He has opened the very door which was shut in His former description. He Himself is the door. We have come to know it; let us enter, or rejoice that we are already within.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252045.html'
source_title="Tractates on John 45"
