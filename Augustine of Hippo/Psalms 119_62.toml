[[commentary]]
quote='''
“At midnight,” he saith, “I rise to give thanks unto Thee: because of Thy righteous judgments” (ver. 62). This very fact, that the bands of the ungodly surround the righteous, is one of the righteous judgments of God. On which account the Apostle Peter saith, “The time is come when judgment must begin at the house of the Lord.” For he saith this of the persecutions which the Church suffered, when the bands of the ungodly surrounded them. I suppose, therefore, that by “midnight” we should understand the heavier seasons of tribulation. In which he said, “I arose:” since He did not so afflict him, as to cast him down; but tried him, so that he arose, that is, that through this very tribulation he might advance unto a bolder confession.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
