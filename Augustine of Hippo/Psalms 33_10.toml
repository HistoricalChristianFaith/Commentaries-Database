[[commentary]]
quote='''
“The Lord bringeth the counsel of the heathen to nought;” of them that seek not His Kingdom, but kingdoms of their own. “He maketh the devices of the people of none effect:” of them that covet earthly happiness. “And reproveth the counsels of princes” (ver. 10): of them that seek to rule over such peoples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
