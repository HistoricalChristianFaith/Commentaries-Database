[[commentary]]
quote='''
Unto the end, a psalm of David.

“For Christ is the end of the law to every one that believeth.” “How long, O Lord, wilt Thou forget me unto the end?” (ver. 1) that is, put me off as to spiritually understanding Christ, who is the Wisdom of God, and the true end of all the aim of the soul. “How long dost Thou turn away Thy face from me?” As God doth not forget, so neither doth He turn His face away: but Scripture speaks after our manner. Now God is said to turn away His face, when He doth not give to the soul, which as yet hath not the pure eye of the mind, the knowledge of Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252013.html'
source_title="Exposition on Psalm 13"
