
[[commentary]]
quote='''
“And My seed shall serve Him” (ver. 30). And My deeds, or they who through Me believe on Him, shall serve Him.

“The generation to come shall be declared to the Lord” (ver. 31). The generation of the New Testament shall be declared to the honour of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
