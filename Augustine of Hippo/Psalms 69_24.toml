[[commentary]]
quote='''
“Pour forth upon them Thine anger, and let the indignation of Thine anger overtake them” (ver. 25), are plain words: but nevertheless, in “overtake them” we perceive them as it were fleeing. But whither are they to flee? Into Heaven? Thou art there. Into Hell? Thou art present. Their wings they will not take to fly straight: “Let the indignation of Thine anger overtake them,” let it not permit them to escape.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
