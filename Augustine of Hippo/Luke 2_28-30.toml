[[commentary]]
quote='''
And what is that which the old Symeon hath said, that old man, I say, in the Gospel, preserved full of years even unto the infancy of the Word? For that old man took in his hands the Infant Word of God. Would He that in the womb deigned to be, disdain to be in the hands of an old man? The Same was in the womb of the virgin, as was in the hands of the old man, a weak infant both within the bowels, and in the old man’s hand, to give us strength, by whom were made all things; and if all things, even His very mother. He came humble, He came weak, but clothed with a weakness to be changed into strength, because “though He was crucified of weakness, yet He liveth of the virtue of God,” the Apostle saith. He was then in the hands of an old man. And what saith that old man? Rejoicing that now he must be loosed from this world, seeing how in his own hand was held He by whom and in whom his Salvation was upheld; he saith what? “Now Thou lettest go,” he saith, “O Lord, Thy servant in peace, for mine eyes have seen Thy Salvation.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252067.html'
source_title="Exposition on Psalm 67"
