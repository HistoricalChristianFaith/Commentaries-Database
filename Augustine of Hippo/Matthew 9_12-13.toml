[[commentary]]
quote='''
Luke adds to repentance, which explains the sense; that none should suppose that sinners are loved by Christ because they are sinners; and this comparison of the sick shows what God means by calling sinners, as a physician does the sick to be saved from their iniquity as from a sickness: which is done by penitence.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
How justification belongeth to salvation, let us seek some proof. Behold there cometh to mind out of the Gospel: there were some who to themselves were seeming to be just men, and they were finding fault with the Lord because He admitted to the feast sinners, and with publicans and sinners was eating; to such men therefore priding themselves, strong men of earth very much lifted up, much glorying of their own soundness, such as they counted it, not such as they had, the Lord answered what? “They that are whole need not a Physician, but they that are sick.” Whom calleth He whole, whom calleth He sick? He continueth and saith, “I have not come to call just men, but sinners unto repentance.” He hath called therefore “the whole” just men, not because the Pharisees were so, but because themselves they thought so to be; and for this reason were proud, and grudged sick men a physician, and being more sick than those, they slew the Physician. He hath called whole, however, righteous men, sick, the sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"
