[[commentary]]
quote='''
"And Pilate wrote a title also, and put it on the cross, and the writing was, Jesus of Nazareth, the King of the Jews. This title then read many of the Jews: for the place where Jesus was crucified was nigh to the city: and it was written in Hebrew, Greek, and Latin, The King of the Jews." For these three languages were conspicuous in that place beyond all others: the Hebrew on account of the Jews, who gloried in the law of God; the Greek, because of the wise men among the Gentiles; and the Latin, on account of the Romans, who at that very time were exercising sovereign power over many and almost all countries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520117.html'
source_title="Tractates on John 117"

[[commentary]]
quote='''
Who are then the people that from holy men were put afar off at the inscription of the Title? Let the Title itself declare to us that people. For there was written a certain title at the Passion of the Lord, when the Lord was crucified: there was in that place a Title inscribed in Hebrew, in Greek, and in Latin, “The King of the Jews;” in three tongues as though by three witnesses the Title was confirmed: because “in the mouth of two or three witnesses shall stand every word.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"

[[commentary]]
quote='''
“The King in truth:” that is, the true King, to whom the title was inscribed, when He suffered. For Pilate set this title inscribed over His Head, “The King of the Jews,” in the Hebrew, Greek, and Latin tongues: in order that all they that should pass by might read of the glory of the King, and the infamy of the Jews themselves, who, rejecting the true King, chose the fox Cæsar.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
