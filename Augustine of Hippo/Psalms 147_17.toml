[[commentary]]
quote='''
“Who sendeth His crystal like morsels of bread” (ver. 17). We need not spend our toil again in saying what crystal is. We have already said it, and I do not think that ye, beloved, have forgotten it. What is then, “He sendeth His crystal like morsels of bread”? What is “crystal”? It is very hard, it is very tightly congealed; it can not, like snow, be easily melted. Snow, hardened by many years’ duration, and by the succession of ages, is called “crystal,” and this “He sendeth like morsels of bread.” What meaneth this? They were too hard, no longer fit to be compared to snow, but to crystal; but they too are predestinated and called, and some of them even so as to feed others, to be useful to others also. And what need is there to enumerate many, whom we happen to know, this one and that one? Every one when he thinks can recall to mind how hardened and obstinate some of those whom he knows have been, how they have struggled against the truth; yet now they preach the truth, they have been made morsels of bread. Who is that one Bread? “We being many,” saith the Apostle, “are one Body in Christ;” he saith also, “we being many are one Bread and one Body.” If then the whole Body of Christ is one Bread, the members of Christ are morsels of Bread. Of some that are hard He maketh members of Himself, and useful for feeding others.…Behold, the Apostle Paul was a crystal, hard, resisting the truth, crying out against the Gospel, hardening himself, as it were, against the sun.…Since then he was crystal, he appeared clear and white, but he was hard and very cold. How was he bright and white? “An Hebrew of the Hebrews; as touching the law, a Pharisee.” Behold the brightness of crystal. Now hear the hardness of crystal. “As touching zeal, persecuting the Church” of Christ. Among the stoners of the holy martyr Stephen, was he, hard, perhaps harder than all. “For he kept the raiment of all who were stoning,” so that he stoned by the hands of all.

Thus then we see “the snow, the mist, the crystal:” it is good that He blow and thaw them. For if He blow not, if He Himself thaw not the hardness of this ice, “in the face of His cold who shall stand?” He abandoneth a sinner, behold, He calleth him not; behold, He openeth not his perception; behold, He poureth not in grace; let the man thaw himself, if he can, from the ice of folly. He cannot. Wherefore can he not? “In the face of His cold who shall stand?” Behold him then growing harder, and saying, “O wretched man that I am! who shall deliver me from the body of this death?” Behold, I am growing cold, behold, I am growing hard, what heat shall thaw me that I may run? “Who shall deliver me from the body of this death?” “In the face of His cold who shall stand?” And who shall free himself, if God abandon him? Who is it that freeth? “The grace of God, through Jesus Christ our Lord.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
