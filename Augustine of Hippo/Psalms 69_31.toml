[[commentary]]
quote='''
“And it shall please God:” that I shall praise Him, shall please: “above a new calf, bearing horns and hoofs.” More grateful to Him shall be the sacrifice of praise than the sacrifice of a calf. “The sacrifice of praise shall glorify me.” “Immolate to God the sacrifice of praise.” So then His praise going forth from my mouth shall please God more than a great victim led up to His altar.…Therefore above this calf my praising shall please Thee, such as hereafter will be, after poverty and sorrow, in the eternal society of Angels, where neither adversary there shall be in battle to be tossed, nor sluggard from earth to be stirred up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
