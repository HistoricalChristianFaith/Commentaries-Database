[[commentary]]
quote='''
The nations "did for their gods what is abominable to the Lord and what he detests. They even burned their sons and daughters in the fire, in homage to their gods." In what other way can it be more clearly shown than with these testimonies of sacred Scripture (and I have omitted others that are similar) that God, who gave these Scriptures to the human race, was not only not pleased but indeed detested sacrifices in which human beings were immolated? God loves and rewards fully those sacrifices in which a righteous person who suffers iniquity fights for the truth even to the point of death or is killed by enemies that he has offended for the sake of justice, repaying them good for evil, love for hatred. The Lord calls this righteous blood, from the blood of Abel until the blood of Zechariah. And especially, because he poured out his blood for us and offered himself in sacrifice to God. This surely was an offering, as much as it was also his being killed by his enemies for the sake of justice. Imitating him, the army of the martyrs fought until death for the truth and was immolated by ruthless enemies. Scripture says of the martyrs, "He tried them like gold in the crucible, and he was pleased with them as with a holocaust." Thus the apostle says, "Indeed, I am already being sacrificed."
'''
source_url=''
source_title="QUESTIONS ON THE HEPTATEUCH 7:49"

[[commentary]]
quote='''
Two are the kinds of persecutors, revilers and flatterers. The tongue of the flatterer doth more persecute than the hand of the slayer: for this also the Scripture hath called a furnace. Truly when the Scripture was speaking of persecution, it said, “Like gold in a furnace it hath proved them” (speaking of Martyrs being slain), “and as the holocaust’s victim it hath received them.” Hear how even the tongue of flatterers is of such sort: “The proving,” he saith, “of silver and of gold is fire; but a man is proved by the tongue of men praising him.” That is fire, this also is fire: out of both thou oughtest to go forth safe. The censurer hath broken thee, thou hast been broken in the furnace like an earthen vessel. The Word hath moulded thee, and there hath come the trial of tribulation: that which hath been formed, must needs be seasoned; if it hath been well moulded, there hath come the fire to strengthen. Whence He said in the Passion, “Dried up like a potsherd hath been My virtue.” For Passion and the furnace of tribulation had made Him stronger.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
source_title="Exposition on Psalm 70"
