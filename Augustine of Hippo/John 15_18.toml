[[commentary]]
quote='''
But behold, that which persecutes is called the world: let us test if that which suffers persecution is also called the world. Or are you deaf to the voice of Christ saying, or rather the sacred Scripture testifying: God was in Christ reconciling the world to himself? If the world hates you, he says, know that it hated me before it hated you. Behold, the world hates. Whom, if not the world? Which world? God was in Christ reconciling the world to himself. The condemned world persecutes; the reconciled world suffers persecution. The condemned world is anything outside the Church; the reconciled world is the Church. For the Son of man did not come, he says, to judge the world, but that the world might be saved through him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252096.html'
source_title="SERMON 96.8"

[[commentary]]
quote='''
But alongside of this love we ought also patiently to endure the hatred of the world. For it must of necessity hate those whom it perceives recoiling from that which is loved by itself. But the Lord supplies us with special consolation from His own case, when, after saying, "These things I command you, that ye love one another," He added, "If the world hate you, know that it hated me before [it hated] you." Why then should the member exalt itself above the head? Thou refusest to be in the body if thou art unwilling to endure the hatred of the world along with the Head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252087.html'
source_title="Tractates on John 87"
