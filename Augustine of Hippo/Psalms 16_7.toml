[[commentary]]
quote='''
“I will bless the Lord, who hath given Me understanding” (ver. 7): whereby this inheritance may be seen and possessed. “Yea moreover too even unto night my reins have chastened Me.” Yea besides understanding, even unto death, My inferior part, the assumption of flesh, hath instructed Me, that I might experience the darkness of mortality, which that understanding hath not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252016.html'
source_title="Exposition on Psalm 16"
