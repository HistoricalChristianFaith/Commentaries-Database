[[commentary]]
quote='''
(Tr. xliii. 4) Meaning of course the Father. But how is it then that He says in another place, The Father judgeth no man, but hath committed all judgment unto the Son. (c. 5:22) Judgment is sometimes put for condemnation, whereas here it only stands for trial: as if to say, There is one, even My Father, who distinguishes My glory from yours; ye glory after this world, I not after this world. The Father distinguishes the glory of the Son, from that of all men: for that He has been made man, does not bring us to a comparison with Him. We men have sin: He was without sin, even when He was in the form of a servant; for, as the Word which was in the beginning, who can speak worthily of Him?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And I," said He, "seek not mine own glory: there is one that seeketh and judgeth." Whom does He wish to be understood but the Father? How, then, does He say in another place, "The Father judgeth no man, but hath committed all judgment unto the Son," while here He says, "I seek not mine own glory: there is one that seeketh and judgeth"? If, then, the Father judgeth, how is it that He judgeth no man, but hath committed all judgment unto the Son?

In order to solve this point, attend. It may be solved by [quoting] a similar mode of speaking. Thou hast it written, "God tempteth not any man;" and again thou hast it written, "The Lord your God tempteth you, to know whether you love Him." Just the point in dispute, you see. For how does God tempt not any man, and how does the Lord your God tempt you, to know whether ye love Him? It is also written, "There is no fear in love but perfect love casteth out fear;" and in another place it is written, "The fear of the Lord is clean, enduring for ever." Here also is the point in dispute. For how does perfect love cast out fear, if the fear of the Lord, which is clean, endureth for ever?

We are to understand, then, that there are two kinds of temptation: one, that deceives; the other, that proves. As regards that which deceives, God tempteth not any man; as regards that which proves, the Lord your God tempteth you, that He may know whether ye love Him. But here again, also, there arises another question, how He tempteth that He may know, from whom, prior to the temptation, nothing can be hid. It is not that God is ignorant; but it is said, that He may know, that is, that He may make you to know. Such modes of speaking are found both in our ordinary conversation, and in writers of eloquence. Let me say a word on our style of conversation. We speak of a blind ditch, not because it has lost its eyes, but because by lying hid it makes us blind to its existence. One speaks of "bitter lupins." that is, "sour;" not that they themselves are bitter, but because they occasion bitterness to those who taste them. And so there are also expressions of this sort in Scripture. Those who take the trouble to attain a knowledge of such points have no trouble in solving them. And so "the Lord your God tempts you, that He may know." What is this, "that He may know"? That He may make you to know "if you love Him." Job was unknown to himself, but he was not unknown to God. He led the tempter into [Job], and brought him to a knowledge of himself.

What then of the two fears? There is a servile fear, and there is a clean [chaste] fear: there is the fear of suffering punishment, there is another fear of losing righteousness. That fear of suffering punishment is slavish. What great thing is it to fear punishment? The vilest slave and the cruelest robber do so. It is no great thing to fear punishment, but great it is to love righteousness. Has he, then, who loves righteousness no fear? Certainly he has; not of incurring of punishment, but of losing righteousness. My brethren, assure yourselves of it, and draw your inference from that which you love. Some one of you is fond of money. Can I find any one, think you, who is not so? Yet from this very thing which he loves he may understand my meaning. He is afraid of loss: why is he so? Because he loves money. In the same measure that he loves money, is he afraid of losing it. So, then, some one is found to be a lover of righteousness, who at heart is much more afraid of its loss, who dreads more being stripped of his righteousness, than thou of thy money. This is the fear that is clean-this [the fear] that endureth for ever, It is not this that love makes away with, or casteth out, but rather embraces it, and keeps it with it, and possesses it as a companion. For we come to the Lord that we may see Him face to face. And there it is this pure fear that preserves us; for such a fear as that does not disturb, but reassure. The adulterous woman fears the coming of her husband, and the chaste one fears her husband's departure.

Therefore, as, according to one kind of temptation, "God tempteth not any man;" but according to another, "The Lord your God tempteth you;" and according to one kind of fear, "there is no fear in love; but perfect love casteth out fear;" but according to another, "the fear of the Lord is clean, enduring for ever;"-so also, in this passage, according to one kind of judgment, "the Father judgeth no man, but hath committed all judgment unto the Son;" and according to another, "I," said He, "seek not mine own glory: there is one that seeketh and judgeth."

This point may also be solved from the word itself. Thou hast penal judgment spoken of in the Gospel: "He that believeth not is judged already;" and in another place, "The hour is coming, when those who are in the graves shall hear His voice, and shall come forth; they that have done good, unto the resurrection of life; and they that have done evil, unto the resurrection of judgment." You see how He has put judgment for condemnation and punishment. And yet if judgment were always to be taken for condemnation, should we ever have heard in the psalm, "Judge me, O God"? In the former place, judgment is used in the sense of inflicting pain; here, it is used in the sense of discernment. How so? Just because so expounded by him who says, "Judge me, O God." For read, and see what follows. What is this "Judge me, O God," but just what he adds, "and discern my cause against an unholy nation"? Because then it was said, "Judge me, O God, and discern [the true merits of] my cause against an unholy nation;" similarly now said the Lord Christ, "I seek not mine own glory: there is one that seeketh and judgeth." How is there "one that seeketh and judgeth"? There is the Father, who discerns and distinguishes between my glory and yours. For ye glory in the spirit of this present world. Not so do I who say to the Father, "Father, glorify Thou me with that glory which I had with Thee before the world was." What is "that glory"? One altogether different from human inflation. Thus doth the Father judge. And so to "judge" is to "discern." And what does He discern? The glory of His Son from the glory of mere men; for to that end is it said, "God, Thy God, hath anointed Thee with the oil of gladness above Thy fellows." For not because He became man is He now to be compared with us. We, as men, are sinful, He is sinless; we, as men, inherit from Adam both death and delinquency, He received from the Virgin mortal flesh, but no iniquity. In fine, neither because we wish it are we born, nor as long as we wish it do we live, nor in the way that we wish it do we die: but He, before He was born, chose of whom He should be born; at His birth He brought about the adoration of the Magi; He grew as an infant, and showed Himself God by His miracles, and surpassed man in His weakness. Lastly, He chose also the manner of His death, that is, to be hung on the cross, and to fasten the cross itself on the foreheads of believers, so that the Christian may say, "God forbid that I should glory, save in the cross of our Lord Jesus Christ." On the very cross, when He pleased, He made His body be taken down, and departed; in the very sepulchre, as long as it pleased Him, He lay; and, when He pleased, He arose as from a bed. So, then, brethren, in respect to His very form as a servant (for who can speak of that other form as it ought to be spoken of, "In the beginning was the Word, and the Word was with God, and the Word was God"?)-in respect, I say, to His very form as a servant, the difference is great between the glory of Christ and the glory of other men. Of that glory He spoke, when the devil-possessed heard Him say, "I seek not mine own glory: there is one that seeketh and judgeth."
'''
