[[commentary]]
quote='''
Understand your God. That is what he is, this one so great and so small, "a worm and no man," and yet through him humankind was made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520380.html'
source_title="SERMON 380:2"
