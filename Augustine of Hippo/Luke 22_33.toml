[[commentary]]
quote='''
For no one thoroughly knows himself: let no one presume upon his own state. Was Peter able to comprehend with his own heart the state of his own heart, who said, “I will be with Thee even unto death”? There was a false presumption in the heart; there was lurking in that heart at the same time a real fear: and the heart was not able to comprehend the state of the heart. Its state was unknown to the sick heart itself: it was manifest to the physician. That which was foretold of him was fulfilled. God knew that in him which he knew not in himself: because his heart had forsaken him, his heart was unknown to his heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"

[[commentary]]
quote='''
Did Peter know himself, when he said to the Physician, “I will be with Thee even unto death?” The Physician had felt his pulse, and knew what was going on within His patient’s soul: the patient knew it not. The crisis of trial came; and the Physician approved the correctness of His opinion: the sick man gave up his presumption. Thus God at once “knows” it and “searches it out.” “He knows it already. Why does He ‘search it out’?” For thy sake: that thou mayest come to know thine own self, and mayest return thanks to Him that made thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252044.html'
source_title="Exposition on Psalm 44"
