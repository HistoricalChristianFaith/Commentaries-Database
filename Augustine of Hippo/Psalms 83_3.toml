[[commentary]]
quote='''
“Upon Thy people they have malignantly taken counsel” (ver. 3). Or, as other copies have it, “They have cunningly devised counsel, and have devised against Thy saints.” In scorn this is said. For how should they be able to hurt the nation or people of God, or His saints, who know how to say, “If God be for us, who shall be against us?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252083.html'
source_title="Exposition on Psalm 83"
