[[commentary]]
quote='''
(non occ.) And while he thus persecutes Christ, he furnished an army (of martyrs) clothed in white robes of the same age as the Lord.

(Serm. 220. App.) Behold how this unrighteous enemy never could have so much profited these infants by his love, as he did by his hate; for as much as iniquity abounded against them, so much did the grace of blessing abound on them.

(Serm. 373. 3.) O blessed infants! He only will doubt of your crown in this your passion for Christ, who doubts that the baptism of Christ has a benefit for infants. He who at His birth had Angels to proclaim Him, the heavens to testify, and Magi to worship Him, could surely have prevented that these should not have died for Him, had He not known that they died not in that death, but rather lived in higher bliss. Far be the thought, that Christ who came to set men free, did nothing to reward those who died in His behalf, when hanging on the cross He prayed for those who put Him to death.

(Serm. 132. App.) The Magi had seen this unknown star in the heavens, not a few days, but two years before, as they had informed Herod when he enquired. This caused him to fix two years old and under; as it follows, according to the time he had enquired of the Magi.

(Gloss. ord.) Or because he feared that the Child to whom even stars ministered, might transform His appearance to greater or under that of His own age, or might conceal all those of that age: hence it seems to be that he slew all from one day to two years old.

(de Cons. Ev. ii. 11.) Or, disturbed by pressure of still more imminent dangers, Herod's thoughts are drawn to other thoughts than the slaughter of children, he might suppose that the Magi, unable to find Him whom they had supposed born, were ashamed to return to him. So the days of purification being accomplished, they might go up in safety to Jerusalem. And who does not see that that one day they may have escaped the attention of a King occupied with so many cares, and that afterwards when the things done in the Temple came to be spread abroad, then Herod discovered that he had been deceived by the Magi, and then sent and slew the children.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Kings behoved to fear lest they should lose the kingdom, lest the kingdom be taken from them. As wretched Herod feared, and for the Child slew the children. But fearing to lose his kingdom, he deserved not to know the King. Would that he too had adored the King with the Magi: not by ill-seeking the kingdom, slain the Innocents, and perished guilty. For as concerning him, he destroyed the Innocents: but as for Christ, even a Child, the children dying for Him did He crown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
[[commentary]]
quote='''
Hereby also we see how another question is solved, if any one indeed finds a difficulty in it. I allude to the question as to how it was possible, on the supposition that the elder Herod was already anxious (to obtain information regarding Him), and agitated by the intelligence received from the wise men concerning the birth of the King of the Jews, for them, when the days of the purification of His mother were accomplished, to go up in any safety with Him to the temple, in order to see to the performance of those things which were according to the law of the Lord, and which are specified by Luke. For who can fail to perceive that this solitary day might very easily have escaped the notice of a king, whose attention was engaged with a multitude of affairs? Or if it does not appear probable that Herod, who was waiting in the extremest anxiety to see what report the wise men would bring back to him concerning the child, should have been so long in finding out how he had been mocked, that, only after the mother's purification was already past, and the solemnities proper to the first-born were performed with respect to the child in the temple, nay more, only after their departure into Egypt, did it come into his mind to seek the life of the child, and to slay so many little ones;—if, I say, any one finds a difficulty in this, I shall not pause to state the numerous and important occupations by which the king's attention may have been engaged, and for the space of many days either wholly diverted from such thoughts, or prevented from following them out. For it is not possible to enumerate all the cases which might have made that perfectly possible. No one, however, is so ignorant of human affairs as either to deny or to question that there may very easily have been many such matters of importance (to preoccupy the king). For to whom will not the thought occur, that reports, whether true or false, of many other more terrible things may possibly have been brought to the king, so that the person who had been apprehensive of a certain royal child, who after a number of years might prove an adversary to himself or to his sons, might be so agitated with the terrors of certain more immediate dangers, as to have his attention forcibly removed from that earlier anxiety, and engaged rather with the devising of measures to ward off other more instantly threatening perils? Wherefore, leaving all such considerations unspecified, I simply venture on the assertion that, when the wise men failed to bring back any report to him, Herod may have believed that they had been misled by a deceptive vision of a star, and that, after their want of success in discovering Him whom they had supposed to have been born, they had been ashamed to return to him; and that in this way the king, having his fears allayed, had given up the idea of asking after and persecuting the child. Consequently, when they had gone with Him to Jerusalem after the purification of His mother, and when those things had been performed in the temple which are recounted by Luke, inasmuch as the words which were spoken by Simeon and Anna in their prophesyings regarding Him, when publicity began to be given to them by the persons who had heard them, were like to call back the king's mind then to its original design, Joseph obeyed the warning conveyed to him in the dream, and fled with the child and His mother into Egypt. Afterwards, when the things which had been done and said in the temple were made quite public, Herod perceived that he had been mocked; and then, in his desire to get at the death of Christ, he slew the multitude of children, as Matthew records.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 11"
