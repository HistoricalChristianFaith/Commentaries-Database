[[commentary]]
quote='''
(Tr. xxii. s. 2) If in hearing and believing is eternal life, how much more in understanding? But the step to our piety is faith, the fruit of faith, understanding. It is not, Believeth on Me, but on Him that sent Me. Why is one to hear His word, and believe another? Is it not that He means to say, His word is in Me? And what is, Heareth My word, but heareth Me? And it is, Believeth on Him that sent Me; as to say, He that believeth on Him, believeth on His Word, i. e. on Me, because I am the Word of the Father.

(Tr. xxii. s. 4. et sq.) But who is this favoured Person? Will there be any one better than the Apostle Paul, who says, We must all appear before the judgment-seat of Christ? (1 Cor. 6) Now judgment sometimes means punishment, sometimes trial. In the sense of trial, we must all appear before the judgment-seat of Christ: in the sense of condemnation we read, some shall not come into judgment; i. e. shall not be condemned. It follows, but is passed from death into life: not, is now passing, but hath passed from the death of unbelief, into the life of faith, from the death of sin, unto the life of righteousness. Or, it is so said perhaps, to prevent our supposing that faith would save us from bodily death, that penalty which we must pay for Adam's transgression. He, in whom we all then were, heard the divine sentence, Thou shall surely die; (Gen. 2) nor can we evade it. But when we have suffered the death of the old man, we shall receive the life of the new, and by death make a passage to life. But to what life? (Tr. xix.). To life everlasting: the dead shall rise again at the end of the world, and enter into everlasting life. (Tr. xxii.). For this life does not deserve the name of life; only that life is true which is eternal.

(de Verb. Dom. Serm. lxiv) We see the lovers of this present transitory life so intent on its welfare, that when in danger of death, they will take any means to delay its approach, though they can not hope to drive it off altogether. If so much care and labour then is spent on gaining a little additional length of life, how ought we to strive after life eternal? And if they are thought wise, who endeavour in every way to put off death, though they can live but a few days longer; how foolish are they who so live, as to lose the eternal day?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Because humans love to live on this earth, life has been promised to them; and because they greatly fear dying, eternal life has been promised to them. What do you love? Living. You will have this. What do you fear? Dying. You will not suffer this. This appeared to suffice for human frailty, so that it might be said: You will have eternal life. The human mind grasps this, in one way or another, from what it does, it grasps what is to come. But how much does it grasp from this small portion of what it does? Because it lives and does not want to die; it loves eternal life, wants to live forever, never to die. But even those who will be tortured in punishments want to die, and cannot. Therefore, it is not great to live long or to live always; but it is great to live blessedly.

Let us love eternal life, and from that, let us understand how much we should labor for eternal life, when we see people, lovers of the present, temporal, and transient life, laboring for it in such a way that, when the fear of death comes, they do whatever they can not to remove, but to delay death. How much man labors when death is imminent, fleeing, hiding, giving whatever he has, and redeeming himself, laboring, enduring torments and troubles, employing doctors, and whatever else man can do? You see that, having exhausted his labors and resources, whatever he can do so that he may live a little longer, he can do; but that he may live forever, he cannot. If therefore with so much labor, effort, expenses, insistence, vigilance, and care it is done so that he may live a little longer, how should it be done so that he may live forever? And if those are called prudent who in every way act to delay death and live a few days, lest they lose a few days, how foolish are those who live in such a way that they lose the eternal day?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520127.html'
source_title="Sermon 127"

[[commentary]]
quote='''
"Verily, verily, I say unto you, Whoso heareth my word, and believeth on Him that sent me, hath eternal life, and cometh not into judgment, but is passed," not is passing now, but is already passed, "from death into life." And mark this, "Whoso heareth my word, and"-He says not, believeth me, but-"believeth Him that sent me." Let him hear the word of the Son, that he may believe the Father. Why heareth Thy word, and yet believeth another? When we hear any one's word, is it not him that utters the word we believe? is it not to him who speaks we lend our faith? What, then, did He mean, saying, "Whoso heareth my word, and believeth Him that sent me," if it be not this, because" His word is in me"? And what is "heareth my word," but "heareth me"? So, too, "believeth Him that sent me," because, believing Him, he believeth His word; but again, believing His word, he believeth me, because I am the Word of the Father. There is therefore peace in the Scriptures, and all things duly disposed, and in no way clashing. Cast away, then, contention from thy heart; understand the harmony of the Scriptures. Dost thou think that the Truth should speak things contrary to itself?

"Whoso heareth my word, and believeth Him that sent me, hath eternal life, and cometh not into judgment, but is passed from death unto life." You remember what we laid down above, that "as the Father raiseth up the dead, and quickeneth them, so also the Son quickeneth whom He will." He is beginning already to reveal Himself; and behold, even now, the dead are rising. For "whoso heareth my word, and believeth Him that sent me, hath eternal life, and will not come into judgment." Prove that he has risen again. "But is passed," saith He "from death unto life." He that is passed from death unto life, has surely without any doubt risen again. For he could not pass from death to life, unless he were first in death and not in life; but when he will have passed, he will be in life, and not in death. He was therefore dead, and is alive again; he was lost, but is found. Hence a resurrection does take place now, and men pass from a death to a life; from the death of infidelity to the life of faith; from the death of falsehood to the life of truth; from the death of iniquity to the life of righteousness. There is, therefore, that which is a resurrection of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252019.html'
source_title="Tractates on John 19"

[[commentary]]
quote='''
Upon the discourses delivered yesterday and the day before, follows the Gospel lesson of to-day, which we must endeavor to expound in due course, not indeed proportionably to its importance, but according to our ability: both because you take in, not according to the bountifulness of the gushing fountain, but according to your moderate capacity; and we too speak into your ears, not so much as the fountain gives forth, but so much as we are able to take in we convey into your minds,-the matter itself working more fruitfully in your hearts than we in your ears. For a great matter is treated of, not by great masters, nay, rather by very small; but He who, being great, for our sakes became small, gives us hope and confidence. For if we were not encouraged by Him, and invited to understand Him; if He abandoned us as contemptible, since we were not able to partake His divinity if He did not partake our mortality and come to us to speak His gospel to us; if He had not willed to partake with us what in us is abject and most small,-then we might think that He who took on Himself our smallness, had not been willing to bestow on us His own greatness. This I have said lest any should blame us as over-bold in handling these matters, or despair of himself that he should be able to understand, by God's gift, what the Son of God has deigned to speak to him Therefore what He has deigned to speak to us, we ought to believe that He meant us to understand. But if we do not understand He, being asked, gives understanding, who gave His Word unasked.

Lo, what these secrets of His words are, consider well. "Verily, verily, I say unto you, Whoso heareth my word, and believeth on Him that sent me, hath eternal life." Surely we are all striving after eternal life: and He saith, "Whoso heareth my word, and believeth Him that sent me, hath eternal life." Then, would He have us hear His word, and yet would He not have us understand it? Since, if in hearing and believing is eternal life, much more in understanding. But the action of piety is faith, the fruit of faith understanding, that we may come to eternal life, when there will be no reading of Gospel to us; but after all pages of reading and the voice of reader and preacher have been removed out of the way, He, who has at this time dispensed to us the gospel, will Himself appear to all that are His, now present with Him with purged heart and in an immortal body never more to die, cleansing and enlightening them, now living and seeing how that "in the beginning was the Word, and the Word was with God." Therefore let us consider at this time who we are, and ponder whom we hear. Christ is God, and He is speaking with men. He would have them to apprehend Him, let Him make them capable; He would have them see Him, let Him open their eyes. It is not, however, without cause that He speaks to us, but because that is true which He promises to us.

"Whoso heareth my words," saith He, "and believeth Him that sent me, hath eternal life, and shall not come into judgment, but is passed from death unto life." Where, when do we come from death to life, that we come not into judgment? In this life there is a passing from death to life; in this life, which is not yet life, there is a passing hence from death unto life. What is that passing? "Whoso heareth my words," He said, "and believeth Him that sent me." Observing these, thou believest and passest. And does a man pass while standing? Evidently; for in body he stands in mind he passes. Where was he, whence he should pass, and whither does he pass? He passes from death to life. Look at a man standing, in whom all that is here said may happen. He stands, he hears, perhaps he did not believe, by hearing he believes: a little before he did not believe, just now he believes; he has made a passage, as it were, from the region of unbelief to the region of faith, by motion of the heart, not of the body, by a motion into the better; because they who again abandon faith move into the worse. Behold, in this life, which, just as I have said, is not yet life, there is a passing from death to life, so that there may not be a coming into judgment. But why did I say that it is not yet life? If this were life, the Lord would not have said to a certain man, "If thou wilt come into life, keep the commandments." For He saith not to him, If thou wilt come into eternal life; He did not add eternal, but said only life. Therefore this life is not to be named life, because it is not a true life. What is true life, but that which is eternal life? Hear the apostle speaking to Timothy, when he says, "Charge them that are rich in this world, not to be high-minded, nor to trust in uncertain riches, but in the living God, who giveth us all things richly to enjoy; let them do good, be rich in good works, ready to distribute, to communicate." Why does he say this? Hear what follows: "Let them lay up in store for themselves a good foundation for the time to come, that they may lay hold of the true life." If they ought to lay up for themselves a good foundation for the time to come, in order to lay hold of the true life, surely this in which they were is a false life. For why shouldest thou desire to lay hold of the true, if thou hast the true already? Is the true to be laid hold of? There must then be a departing from the false. And by what way must be the departing? Whither? Hear, believe; and thou makest the passage from death into life, and comest not into judgment.

What is this, "and thou comest not into judgment"? And who will be better than the Apostle Paul, who saith, "We must all appear before the judgment-seat of Christ, that every one may there receive what he has done in the body, whether it be good or evil"? Paul saith, "We must all appear before the judgment-seat of Christ;" and darest thou promise to thyself that thou shalt not come into judgment? Be it far from me, sayest thou, that I should dare promise this to myself. But I believe Him that doth promise. The Saviour speaks, the Truth promises, Himself said to me, "Whoso heareth my words, and believeth Him that sent me, hath eternal life, and makes a passage from death unto life, and shall not come into judgment." I then have heard the words of my Lord, and I have believed; so now, when I was an unbeliever, I became a believer even as He warned me, I passed from death to life, I come not into judgment; not by my presumption, but by His promise. Does Paul, however, speak contrary to Christ, the servant against his Lord, the disciple against his Master, the man against God; so that, when the Lord saith, "Whoso heareth and believeth, passeth from death to life," the apostle should say, "We must all appear before the judgment-seat of Christ"? Otherwise, if he comes not into judgment who appears before the judgment-seat, I know not how to understand it.

The Lord our God then reveals it, and by His Scriptures puts us in mind how it may be understood when judgment is spoken of. I exhort you, therefore, to give attention. Sometimes judgment means punishment, sometimes it means discrimination. According to that mode of speech in which judgment means discrimination, "we must all appear before the judgment-seat of Christ that" a man "may there receive what things he has done in the body, whether it be good or ill." For this same is a discrimination, to distribute good things to the good, evil things to the evil. For if judgment were always to be taken in a bad sense, the psalm would not say, "Judge me, O God." Perhaps some one is surprised when he hears one say, "Judge me, O God." For man is wont to say, "Forgive me, O God;" "Spare me, O God." Who is it that says, "Judge me, O God"? Sometimes in the psalm this very verse even is placed in the pause, to be given out by the reader and responded by the people. Does it not perhaps strike some man's heart so much that he is afraid to sing and to say to God, "Judge me, O God"? And yet the people sing it with confidence, and do not imagine that they wish an evil thing in that which they have learned from the divine word; even if they do not well understand it, they believe that what they sing is something good. And yet even the psalm itself has not left a man without an insight into the meaning of it. For, going on, it shows in the words that follow what kind of judgment it spoke of; that it is not one of condemnation, but of discrimination. For saith it, "Judge me, O God." What means "Judge me, O God, and discern my cause from an unholy nation"? According to this judgment of discerning, then, "we must all appear before the judgment-seat of Christ." But again, according to the judgment of condemnation, "Whoso heareth my words," saith He, "and believeth Him that sent me, hath eternal life, and shall not come into judgment, but makes a passage from death to life." What is "shall not come into judgment?" Shall not come into condemnation. Let us prove from the Scriptures that judgment is put where punishment is understood; although also in this very passage, a little further on, you will hear the same term judgment put for nothing else than for condemnation and punishment. Yet the apostle says in a certain place, writing to those who abused the body, what the faithful among you know; and because they abused it, they were chastised by the scourge of the Lord. For he says to them, "Many among you are weak and sickly, and deeply sleep." For many therefore even died. And he went on: "For if we judged ourselves, we should not be judged by the Lord;" that is, if we reproved ourselves, we should not be reproved by the Lord. "But when we are judged, we are chastened by the Lord, that we may not be condemned with the world." There are therefore those who are judged here according to punishment, that they may be spared there; there are those who are spared here, that they may be the more abundantly tormented there; and there are those to whom the very punishments are meted out without the scourge of punishment, if they be not corrected by the scourge of God; that, since here they have despised the Father that scourgeth, they may there feel the Judge that punisheth. Therefore there is a judgment into which God, that is, the Son of God, will in the end send the devil and his angels, and all the unbelieving and ungodly with him. To this judgment, he who, now believing, passes from death unto life, shall not come.

For, lest thou shouldest think that by believing thou art not to die according to the flesh, or lest, understanding it carnally, thou shouldest say to thyself, "My Lord has said to me, Whoso heareth my words, and believeth Him that sent me, is passed from death to life: I then have believed, I am not to die;" be assured that thou shalt pay that penalty, death, which thou owest by the punishment of Adam. For he, in whom we all then were, received this sentence, "Thou shalt surely die;" nor can the divine sentence be made void. But after thou hast paid the death of the old man, thou shalt be received into the eternal life of the new man, and shalt pass from death to life. Meanwhile, make the transition of life now. What is thy life? Faith: "The just doth live by faith." The unbelievers, what of them? They are dead. Among such dead was he, in the body, of whom the Lord says, "Let the dead bury their dead." So, then, even in this life there are dead, and there are living; all live in a sense. Who are dead? They who have not believed. Who are living? They who have believed. What is said to the dead by the apostle? "Arise, thou that sleepest." But, quoth an objector, he said sleep, not death. Hear what follows: "Arise, thou that sleepest, and come forth from the dead." And as if the sleeper said, Whither shall I go? "And Christ shall give thee light." Christ having enlightened thee, now believing, immediately thou makest a passage from death to life: abide in that to which thou hast passed, and thou shalt not come into judgment.
'''
