[[commentary]]
quote='''
With respect to the city of Bethlehem, Matthew and Luke are at one. But Luke explains in what way and for what reason Joseph and Mary came to it; whereas Matthew gives no such explanation. On the other hand, while Luke is silent on the subject of the journey of the magi from the east, Matthew furnishes an account of it. That narrative he constructs as follows, in immediate connection with what he has already offered: Behold, there came wise men from the east to Jerusalem, saying, Where is He that is born King of the Jews? for we have seen His star in the east, and are come to worship Him. Now, when Herod the king had heard these things, he was troubled. And in this manner the account goes on, down to the passage where of these magi it is written that, "being warned of God in a dream that they should not return to Herod, they departed into their own country another way." This entire section is omitted by Luke, just as Matthew fails to mention some other circumstances which are mentioned by Luke: as, for example, that the Lord was laid in a manger; and that an angel announced His birth to the shepherds; and that there was with the angel a multitude of the heavenly host praising God; and that the shepherds came and saw that that was true which the angel had announced to them; and that on the day of His circumcision He received His name; as also the incidents reported by the same Luke to have occurred after the days of the purification of Mary were fulfilled,—namely, their taking Him to Jerusalem, and the words spoken in the temple by Simeon or Anna concerning Him, when, filled with the Holy Ghost, they recognized Him. Of all these things Matthew says nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 5"
