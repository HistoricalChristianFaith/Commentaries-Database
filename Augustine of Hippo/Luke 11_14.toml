[[commentary]]
quote='''
Matthew then goes on with his recital in the following fashion: "Then was brought unto Him one possessed with a devil, blind and dumb; and He healed him, insomuch that he both spake and saw." Luke introduces this narrative, not in the same order, but after a number of other matters. He also speaks of the man only as dumb, and not as blind in addition. But it is not to be inferred, from the mere circumstance of his silence as to some portion or other of the account, that he speaks of an entirely different person. For he has likewise recorded what followed [immediately after that cure], as it stands also in Matthew.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 37"
