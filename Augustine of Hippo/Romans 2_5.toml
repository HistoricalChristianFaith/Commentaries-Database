[[commentary]]
quote='''
When he says: You are storing up for yourself wrath in the day of wrath, he everywhere uses the wrath of God for vengeance. Therefore he says: Of the just judgment of God. It should be noted, however, that the wrath of God is placed also in the New Testament—which, when men who are opposed to the old law read it in the Old, they think it something to be blamed; whereas God is surely not subject to perturbations as we are, as Solomon says: But you, O Lord of hosts, judge with tranquility. But wrath, as has been said, is used in the signification of vengeance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
