[[commentary]]
quote='''
“Let the eyes of them be darkened, that they see not, and the back of them alway bow Thou down” (ver. 24). This is a consequence. For they, whose eyes have been darkened that they see not, it followeth, must have their back bowed down. How so? Because when they have ceased to take knowledge of things above, they must needs think of things below. He that well heareth, “lift up the heart,” a bowed back hath not. For with stature erect he looketh for the hope laid up for him in Heaven; most especially if he send before him his treasure, whither his heart followeth. But, on the other hand, they perceive not the hope of future life; already being blinded, they think of things below: and this is to have a bowed back: from which disorder the Lord delivered that woman. For Satan hath bound her eighteen years, and her that was bowed down He raised up: and because on the Sabbath He did it, the Jews were scandalized; suitably were they scandalized at her being raised up, themselves being bowed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
