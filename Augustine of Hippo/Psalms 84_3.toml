[[commentary]]
quote='''
For our Head is as the sparrow, His body as the turtle-dove. “For the sparrow hath found her an house.” What house? In heaven, where He doth mediate for us. “And the turtle-dove a nest,” the Church of God hath found a nest from the wood of His Cross, where “she may lay her young,” her children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
