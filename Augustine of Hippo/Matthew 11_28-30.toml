[[commentary]]
quote='''
What is the action of him whose life is rest, and death disquietude? Such then ought to be the action of the soul, as may tend to a quiet security, not one that may increase restless toil; since He hath delivered it from death, who, pitying it, said, “Come unto Me, all ye that labour and are heavy laden, and I will give you rest,” etc. Meek therefore and humble, following, so to speak, Christ as its path, should the action of the soul be that tendeth towards repose; nevertheless, not slothful and supine; that it may finish its course, as it is written, “In quietness make perfect thy works.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520116.html'
source_title="Exposition on Psalm 116"
