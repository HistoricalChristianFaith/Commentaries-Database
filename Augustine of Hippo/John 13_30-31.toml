[[commentary]]
quote='''
"He then, having received the morsel of bread, went immediately out: and it was night." And he that went out was himself the night. "Therefore when" the night "was gone out, Jesus said, Now is the Son of man glorified." The day therefore uttered speech unto the day, that is, Christ did so to His faithful disciples, that they might hear and love Him as His followers; and the night showed knowledge unto the night, that is, Judas did so to the unbelieving Jews, that they might come as His persecutors, and make Him their prisoner. But now, in considering these words of the Lord, which were addressed to the godly, before His arrest by the ungodly, special attention on the part of the · hearer is required; and therefore it will be more becoming in the preacher, instead of hurriedly considering them now, to defer them till a future occasion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252062.html'
source_title="Tractates on John 62"
