[[commentary]]
quote='''
Here we are, of course, to understand those who were under such primary catechetical instruction, as implied their nourishment with milk and not with strong meat; of the former of which there is mention made in the Epistle to the Hebrews of an abundant supply for such as nevertheless he would now have had to be feeding on solid food. Accordingly he says: "Therefore leaving the word of the beginning of Christ, let us have regard to the completion; not laying again the foundation of repentance from dead works, and of faith toward God, of the doctrine of the baptismal font, and of the laying on of hands, and of resurrection of the dead, and of eternal judgment." This is the copious supply of milk, without which even they cannot live, who have already indeed their reason sufficiently in use to enable them to believe, but who cannot distinguish good from evil, so as to be not only a matter of faith, but also of understanding (which belongs to the department of solid food). But when he includes doctrine also in his description of the milk, it is that which has been delivered to us in the Creed and the Lord's Prayer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252098.html'
source_title="Tractates on John 98"
