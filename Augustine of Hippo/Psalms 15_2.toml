[[commentary]]
quote='''
When the apostle says that in his opinion a person is justified through faith without the works of the Law, he does not intend by this decision to express contempt for the commandments and the works of justice by the profession of faith but to inform anyone that he can be justified by faith even if he has not previously fulfilled the works of the Law; for they follow when one has been justified and do not come before for one to be justified.
'''
source_url=''
source_title="FAITH AND WORKS 14:21"

[[commentary]]
quote='''
“He who walketh without stain, and worketh righteousness” (ver. 2). Here he has laid down the proposition; in what follows he sets it forth in detail.

“Who speaketh the truth in his heart.” For some have truth on their lips, and not in their heart. As if one should deceitfully point out a road, knowing that there were robbers there, and should say, If you go this way, you will be safe from robbers; and it should turn out that in fact there were no robbers found there: he has spoken the truth, but not in his heart. For he supposed it to be otherwise, and spoke the truth in ignorance. Therefore it is not enough to speak the truth, unless it be so also in heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252015.html'
source_title="Exposition on Psalm 15"
