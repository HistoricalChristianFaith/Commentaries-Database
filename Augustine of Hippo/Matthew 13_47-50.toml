
[[commentary]]
quote='''
Because evil fishes that were taken within the nets they said they would not endure; they themselves have become more evil than they whom they said they could not endure. For those nets did take fishes both good and evil. The Lord saith, “The kingdom of Heaven is like to a sein cast into the sea, which gathereth of every kind, which, when it had been filled, drawing out, and sitting on the shore, they gathered the good into vessels, but the evil they cast out: so it shall be,” He saith, “in the consummation of the world.” He showeth what is the shore, He showeth what is the end of the sea. “The angels shall go forth, and shall sever the evil from the midst of the just, and shall cast them into the furnace of fire: there shall be weeping and gnashing of teeth.” Ha! ye citizens of Jerusalem that are within the nets, and are good fishes; endure the evil, the nets break ye not: together with them ye are in a sea, not together with them will ye be in the vessels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252065.html'
source_title="Exposition on Psalm 65"
