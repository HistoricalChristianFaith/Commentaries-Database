[[commentary]]
quote='''
“With them that hated peace, I was peaceful” (ver. 7). But howsoever ye may hear, most beloved brethren, ye will not be able to prove how truly ye sing, unless ye have begun to do that which ye sing. How much soever I say this, in whatsoever ways I may expound it, in whatsoever words I may turn it, it entereth not into the heart of him in whom its operation is not. Begin to act, and see what we speak. Then tears flow forth at each word, then the Psalm is sung, and the heart doeth what is sung in the Psalm…Who are they who hate peace? They who tear asunder unity. For had they not hated peace, they would have abode in unity. But they separated themselves, forsooth on this account, that they might be righteous, that they might not have the ungodly mixed with them. These words are either ours or theirs: decide whose. The Catholic Church saith, Unity must not be lost, the Church of God must not be cut off. God will judge afterwards of the wicked and the good…This we also say: Love ye peace, love ye Christ. For if they love peace, they love Christ. When therefore we say, Love ye peace, we say this, Love ye Christ. Wherefore? For the Apostle saith of Christ, “He is our peace, who hath made both one.” If Christ is therefore peace, because He hath made both one: why have ye made two of one? How then are ye peace-makers, if, when Christ maketh one of two, ye make two of one? But since we say these things, we are peace-makers with them that hate peace; and yet they who hate peace, when we spake to them, made war on us for nought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520120.html'
source_title="Exposition on Psalm 120"
